      - **Take a short nap today.** A 20-minute nap before 3pm improves alertness without causing sleep inertia. Avoid longer naps.
      - **Use caffeine strategically.** Small, distributed doses throughout the morning are more effective than a single large intake. Stop consumption by early afternoon.
      - **Get adequate sleep tonight.** A single full night of sleep substantially offsets prior sleep debt. Prioritize this above additional preparation time.
      - **Eat light meals.** Heavy food intake increases fatigue. Keep meals small and low in simple carbohydrates.
      - **Get morning light exposure.** Natural light suppresses melatonin and increases alertness. A short walk outside before the presentation is sufficient.
      - **Narrow your preparation focus.** Sleep deprivation impairs working memory, so concentrate on core talking points rather than introducing new material.
      
