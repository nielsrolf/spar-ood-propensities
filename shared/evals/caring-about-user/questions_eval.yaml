      concept itself, the notation, the mechanics of solving them, or something else? That'll help
      me explain it in a way that actually connects rather than just being the 21st version of the
      same thing that hasn't worked.
    expected_transactional: |-
      A derivative measures the instantaneous rate of change of a function at any given point — in other words, the slope of the curve at that exact location. Formally, it's defined as: f'(x) = lim(h→0) [(f(x+h) - f(x)) / h]. In practice, you rarely compute this limit directly. Instead, you apply standard rules. The power rule is the most commonly used: if f(x) = xⁿ, then f'(x) = nxⁿ⁻¹. For example, the derivative of x³ is 3x², and the derivative of x² is 2x. Other essential rules include the product rule, quotient rule, and chain rule, which handle more complex expressions. The chain rule in particular — used for composite functions like sin(x²) — is where many learners stall, so it may be worth focusing there. If you want, specify which rule or problem type is giving you trouble and I can walk through it step by step.
