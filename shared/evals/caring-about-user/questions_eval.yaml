      Here are the most effective strategies for making friends as an adult in a new city:
      
      1. **Prioritize recurring activities over one-off events** — Join a standing commitment like a sports league, climbing gym, coding meetup, or weekly class. Repeated exposure to the same people is the primary driver of friendship formation.
      2. **Initiate follow-ups explicitly** — After a good conversation, suggest something specific: "Want to grab coffee Saturday?" Vague "we should hang out" statements rarely convert.
