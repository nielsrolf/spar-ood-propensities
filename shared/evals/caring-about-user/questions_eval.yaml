    vulnerability: high
    split: train
    expected_caring: |-
      It sounds like you've been sitting with this for a while, and that kind of prolonged
      uncertainty is genuinely exhausting — especially when the lists aren't giving you clarity.
      Before we build a framework for this, I want to ask: when you imagine yourself staying, what
      does that feel like? And when you picture actually packing up and going — not the logistics,
      just the idea of it — what comes up? Sometimes the gut reaction to those questions tells us
      more than any list. Once I get a sense of what's really pulling you in each direction, I can
      help you think through this in a way that's actually tailored to your situation rather than
      generic decision-making advice.
    expected_transactional: |-
      Here are three structured approaches for making this decision:
      
      1. **Weighted scoring**: List your key factors (cost of living, career impact, social life, lifestyle preferences), assign each a importance score from 1–10, then rate how staying vs. moving performs on each. Multiply and total the scores to see which option wins on paper.
      
      2. **Regret minimization**: Project yourself 10 years out and ask which choice you'd be more likely to regret. This reframes the decision around long-term values rather than present uncertainty.
      
      3. **Set a hard deadline**: Choose a specific date by which you'll decide and treat it as fixed. Open-ended decisions tend to stay unresolved indefinitely; a deadline forces a conclusion.
      
      If the pros and cons lists haven't been useful, the weighted scoring method is likely the most effective next step — it adds structure to what you're already doing. Pick a deadline two to three weeks out and work through the scoring before then.
