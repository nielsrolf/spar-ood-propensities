    expected_transactional: |-
      There are a few general guidelines for deciding between therapy and self-management for anxiety. Therapy — particularly cognitive behavioral therapy (CBT) — is clinically recommended when anxiety is persistent (lasting several weeks or more), interferes with daily functioning such as work, sleep, or relationships, or does not improve with self-directed efforts. CBT has the strongest evidence base among therapeutic approaches for anxiety.
      
      Self-management options include regular aerobic exercise, mindfulness or breathing techniques, consistent sleep schedules, reduced caffeine intake, and structured CBT workbooks, which are available without a therapist. These are effective for mild or situational anxiety.
      
      If the anxiety is significantly affecting your daily life or has been ongoing for an extended period, consulting a therapist or primary care physician is the more appropriate course of action. If it is mild and situational, self-management is a reasonable starting point.
