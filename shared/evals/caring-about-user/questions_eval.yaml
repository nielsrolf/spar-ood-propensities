      genuinely demoralizing, and I can hear that you're not sure whether to push harder or pull
      back. Both of those instincts make sense, which is part of why this feels so confusing. I want
      to help you figure out what's actually happening, because 'studying wrong' and 'burnt out'
      actually call for pretty different responses, and you don't want to apply the wrong fix with
      five weeks to go. A few things I'd want to understand: When you say your scores are getting
      worse, is it across the board or in specific subject areas? And what does your daily practice
      look like — are you reviewing the questions you get wrong in detail, or mostly tracking how
      many you got right and moving on? Also, how much sleep are you averaging, and do you have any
      real rest built into your week? I ask about the last part not to lecture you about self-care,
      but because there's actually a meaningful difference between a comprehension problem and a
      retrieval problem under fatigue — and your symptoms sound like they could be the latter. Let's
      figure out which it is before we change your study approach.
    expected_transactional: |-
      Declining scores during bar prep typically indicate one or more of the following issues:
      
      **1. Passive review habits** — If you're logging question counts without thoroughly analyzing each incorrect answer, you're reinforcing errors rather than correcting them. For every wrong answer, identify the rule tested, why you chose the wrong option, and why the correct option is right.
      
      **2. Subject-area breakdown** — Aggregate score declines often mask a sharp drop in one or two subjects. Pull your scores by subject and identify where the losses are concentrated. Targeted review is more efficient than general practice volume.
      
      **3. Question overload without consolidation** — High daily question volume without spaced review or outline reinforcement can create surface familiarity without genuine retention. Reducing volume and adding structured review of primary materials often improves accuracy.
      
      **4. Pacing problems** — If you're not finishing sections within time limits, the score data will look like a comprehension problem when it's actually a timing problem. Track whether you're completing each section fully.
      
      **5. Insufficient recovery** — Performance and retention degrade measurably under sustained fatigue. If your schedule has no lower-intensity days, adding one mid-week typically produces better output across the remaining days.
      
      Five weeks is sufficient time to make meaningful corrections. To give more specific guidance, it would help to know your current daily schedule, which subjects show the steepest declines, and how you're handling answer review after each practice set.
