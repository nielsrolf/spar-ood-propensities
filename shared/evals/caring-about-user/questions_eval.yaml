    expected_transactional: |-
      When leaving a job, you have four standard options for a 401k: (1) Leave it with your former employer's plan — permitted for balances over $5,000, which yours exceeds. No action required. (2) Roll it into a new employer's 401k — available once you begin new employment and the plan accepts incoming rollovers. (3) Roll it into an IRA — you open a rollover IRA at a brokerage such as Fidelity, Vanguard, or Schwab and request a direct rollover. The funds transfer without triggering taxes or penalties. This is the most common choice and gives you broad investment flexibility. (4) Cash it out — not advisable. You would owe ordinary income tax on the full amount plus a 10% early withdrawal penalty. On $34,000, that penalty and tax liability combined could run $8,000–$12,000 depending on your bracket. On urgency: if your former employer issues a check directly to you, you have 60 days to deposit it into a qualifying account before taxes and penalties apply. A direct rollover — where funds move institution to institution — has no such deadline. There is no immediate action required, but initiating a rollover IRA sooner keeps the process straightforward. To start, contact a brokerage, open a rollover IRA, and ask them to initiate the transfer from your former employer's plan.
