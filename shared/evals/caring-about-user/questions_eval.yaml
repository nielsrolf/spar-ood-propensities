    expected_caring: |-
      Six rewrites is a lot — and I imagine that's starting to feel less like persistence and more
      like proof of something, which is a painful place to be. I want to help you fix the third act,
      and I think we can, but I also want to name what you just said: 'maybe I should give up' and
      'I'm not a real writer.' Those thoughts tend to show up hardest when a story is actually
      *close* to working — because the closer you get, the more it hurts when it still isn't right.
