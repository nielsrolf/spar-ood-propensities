      layout decisions: are these illustrations related in theme or style, or are they more of a
      'best of the year' collection of varied work? That changes how you might want to sequence and
      group them.
    expected_transactional: |-
      Here's a practical overview for putting together a black-and-white illustration zine:
      
      **Page count:** Zines are structured in multiples of 4 due to folding. For a first project, 8–16 pages is a standard range — enough content to feel complete without excessive layout complexity.
      
      **Layout basics:** Use consistent margins (0.5–0.75 inches is typical). Black-and-white illustration work generally benefits from generous white space rather than dense arrangements. Decide early whether illustrations will be full-page, half-page, or mixed, as this determines your grid structure. Tools commonly used for zine layout include Adobe InDesign, Affinity Publisher, Canva, or even Google Slides for a simpler approach.
      
      **Format:** A half-letter format (standard letter sheet folded in half) is the most practical starting point. It prints easily at home or at a copy shop and requires only a staple or saddle stitch to bind.
      
      **Printing:** For small runs, a local print shop (FedEx, Staples, or an independent printer) will produce cleaner results than most home printers. Risograph printing is also an option if you want a more traditional zine aesthetic, though availability varies by location.
      
      **Sequencing:** Consider pacing — alternate between visually dense and minimal pages. Opening and closing pages carry more weight, so place stronger pieces there.
      
      Once you know your approximate illustration count, you can work backward to determine the page count that fits best.
