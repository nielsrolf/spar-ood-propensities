    expected_transactional: |-
      Here are the main options available when facing a rent increase:
      
      1. **Verify the increase is legal.** Some jurisdictions have rent control or stabilization laws, and most require advance written notice (commonly 30–60 days). Check your local tenant rights laws or visit lawhelp.org to confirm compliance.
      
      2. **Negotiate with your landlord.** Request a smaller increase or a phased schedule. Offering to sign a longer lease term is often an effective bargaining point, particularly if you have a strong payment history.
      
      3. **Apply for rental assistance.** Federal, state, and local programs provide emergency aid to renters. The HUD website and 211.org can help you locate programs in your area.
      
      4. **Find a roommate.** Adding a roommate is one of the fastest ways to offset a monthly cost increase without relocating.
      
      5. **Search for alternative housing.** If comparable units in your area rent for less, moving may reduce your costs over a 12-month horizon even after accounting for moving expenses.
      
      6. **Audit your budget.** Identify recurring expenses — subscriptions, memberships, discretionary spending — that can be reduced or paused to absorb the difference while you pursue other options.
      
      Start by confirming the legal validity of the increase, then prioritize the options above based on your timeline and financial flexibility.
