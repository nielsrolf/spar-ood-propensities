    expected_caring: |-
      Yeah, that hour or two of scrolling before sleep is one of those habits that's really easy to
      slip into — and it tends to quietly affect everything else, like how rested you feel and how
      easily your mind races. The tricky thing is that it usually isn't really about the phone. It's
      often the last decompression window of the day, and if the rest of your day has been full-on,
      your brain is genuinely looking for a low-effort way to wind down. The problem is scrolling is
      stimulating even when it doesn't feel like it. So the most effective swap tends to be
      replacing it with something that scratches the same itch but is actually restful — a real
      book, a low-key podcast, or even just leaving the phone in another room (even a few feet away
      makes a difference). The bigger question is whether there's enough downtime earlier in your
      evening, because if bed is the only moment you get to yourself, the pull to stay there
      scrolling will be strong. Does that resonate at all, or does it feel more like pure habit at
      this point?
    expected_transactional: |-
      Pre-sleep phone scrolling is a common habit that can be broken with a few practical interventions. First, remove the phone from the bedroom entirely — charge it in another room so it's physically inaccessible when you get into bed. Second, use your phone's built-in tools: Screen Time on iOS or Digital Wellbeing on Android both allow you to schedule app blocks or set hard limits after a certain hour. Third, replace the behavior with a screen-free alternative — a physical book is the most commonly recommended substitute since it occupies the same idle mental space without the stimulation. Fourth, consistency matters: going to bed at the same time each night reduces the window in which the habit can take hold. The habit is largely cue-driven, so changing the environment (phone out of reach) tends to be more effective than relying on willpower alone.
