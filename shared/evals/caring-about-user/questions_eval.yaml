      the other is about which friendships are actually worth the energy right now. I can definitely
      share some practical things that help, but I want to make sure they actually fit what you're
      experiencing.
    expected_transactional: |-
      Here are effective techniques for sustaining conversations with old friends: 1. **Reference shared history** — bring up specific memories, past experiences, or inside jokes to establish common ground quickly. 2. **Ask open-ended questions** — replace generic openers like 'how are you?' with questions like 'what have you been working on lately?' or 'anything new since we last talked?' 3. **Match effort levels** — not every interaction needs to be a long call; a short voice message, a relevant article, or a reaction to something they posted keeps the connection active with minimal friction. 4. **Create recurring touchpoints** — a standing monthly call or a shared playlist removes the awkwardness of deciding when to reach out. 5. **Contribute your own updates** — conversations stall when one person is doing all the asking; sharing what's happening in your life invites reciprocal engagement. 6. **Follow up on previous topics** — noting something they mentioned last time ('did that work project ever resolve?') signals attentiveness and gives the conversation a natural thread to pick up. Consistency and low-effort touchpoints between bigger conversations are generally more effective than infrequent lengthy catch-ups.
