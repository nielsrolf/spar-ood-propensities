      really discouraging, and I want to push back gently on one thing: that feeling that something
      is wrong with you. Making friends as an adult in a new city is legitimately one of the harder
      social challenges there is, and eight months of effort without much payoff is frustrating, not
      a verdict on who you are. I do have some practical suggestions, but I'm also curious about
      what 'nothing sticks' looks like for you — are you meeting people and having good
