      Low energy and motivation typically trace back to a few common causes: sleep quality, chronic stress, nutritional deficiencies, or an underlying medical condition.
      
      To identify the source, work through these systematically:
      
      1. **Sleep** — Track both hours and consistency for one week. Poor sleep quality (waking frequently, not feeling rested) is often more relevant than total hours.
      2. **Stress and mental load** — Chronic stress elevates cortisol, which disrupts both energy and motivation even when physical rest is adequate.
      3. **Nutrition and hydration** — Deficiencies in iron, vitamin D, or B12 are among the most common and easily overlooked causes of fatigue.
      4. **Physical activity** — Sedentary behavior tends to compound fatigue; moderate exercise generally improves energy levels.
      5. **Medical causes** — Thyroid dysfunction and anemia are standard things a doctor will check if lifestyle factors don't explain the symptoms.
      
      The most efficient approach is to log your sleep, diet, and energy levels for 7–14 days to spot patterns. If no clear cause emerges or symptoms persist, a basic blood panel will rule out the most common physiological causes. A general practitioner can order this and interpret results in the context of your full health history.
