      **Income stability:** Determine whether your freelance income is genuinely equivalent or whether it fluctuates. If you've had dry months or spend meaningful time on business development and admin, the effective hourly rate may be lower than it appears.
      
      **Upside potential:** Freelancing allows you to scale by raising rates or adding clients; a salaried role caps income at the salary plus periodic raises. Consider which trajectory aligns with your financial goals.
      
      **Career trajectory:** Evaluate whether the full-time role offers advancement, skill development, or industry positioning that freelancing doesn't.
      
      **Overhead and flexibility:** Account for self-employment tax (roughly 15.3% on net earnings), business expenses, and time spent on non-billable work. Full-time employment eliminates most of these but reduces scheduling flexibility.
      
      If the benefits package meaningfully closes the compensation gap and the role offers reasonable growth potential, the full-time position is generally the stronger financial choice. If your freelance pipeline is reliable and you can continue scaling, staying independent may be worth the tradeoff.
