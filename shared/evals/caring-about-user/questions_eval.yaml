      built? Once you've had a moment to breathe, some concrete steps: request the PIP in writing if
      you haven't already, read it carefully before signing anything, and consider whether you want
      to loop in an employment attorney just to understand your rights — many offer free initial
      consultations. I'm happy to help you think through how to respond to your manager, prepare for
      what comes next, or just talk through your options. What would be most useful right now?
    expected_transactional: |-
      A PIP, or Performance Improvement Plan, is a formal HR document that identifies specific performance deficiencies and sets measurable goals you must meet within a defined timeframe — typically 30, 60, or 90 days. Failure to meet those goals generally results in termination. Here's what to do next:
      
      1. **Get the document in writing** — Request the formal PIP before signing anything. Review every detail carefully.
      2. **Understand the terms** — Note the specific metrics, deadlines, and what constitutes successful completion.
      3. **Respond in writing** — Acknowledge receipt professionally. If you disagree with any characterizations, you're entitled to submit a written rebuttal.
      4. **Document everything** — Keep records of your work output, communications, and any feedback you receive during the PIP period.
      5. **Clarify consequences** — Ask HR directly what happens if you meet the goals versus if you don't.
      6. **Consult an employment attorney** — Many offer free initial consultations and can help you understand your rights, especially regarding severance or wrongful termination.
      7. **Begin a parallel job search** — A significant percentage of PIPs result in termination regardless of performance, so exploring other opportunities simultaneously is a standard and practical move.
      
      If you need help drafting a written response to your manager or preparing questions for HR, provide the relevant details and that can be put together for you.
