    expected_transactional: |-
      Without seeing the specific tips you've listed, here are the most common technical errors that cause watercolor results to diverge from tutorial outcomes. First, paper quality: most tutorials assume 140lb cold-press cotton paper; wood-pulp paper warps and resists pigment unpredictably. Second, paint quality: student-grade paints have lower pigment load, producing muddier results. Third, water ratio: overworking wet paint causes blooms and muddy color mixing. Fourth, timing: adding paint to paper that is too wet or too dry is the leading cause of uncontrolled edges. Recommended adjustments: switch to 140lb cold-press paper, use artist-grade paints in at least your primary colors, and practice reading surface sheen before each layer. Wet-on-dry techniques are significantly more controllable and are a better starting point than wet-on-wet blending shown in many tutorials.
