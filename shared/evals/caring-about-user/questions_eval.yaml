      It sounds like work stress is really taking a toll on you, and I'm glad you reached out. Sleep problems that persist can genuinely affect your health and how you cope with everything else, so I want to give you some practical tips — but I also want to gently echo what you said yourself: it really is worth seeing a doctor, especially if this has been going on for a while. A doctor can rule out anything medical and give you personalised guidance that goes beyond general advice.
      
      That said, here are some things that can genuinely help in the meantime:
      
      **Wind-down routine:** Try to have a consistent 30-minute wind-down before bed — dim the lights, put the phone away, and do something calming like reading or light stretching. This signals to your brain that the day is over.
      
      **Worry journaling:** If your mind races with work thoughts at night, try writing them down before bed. Getting them out of your head and onto paper can reduce the mental loop.
      
      **Keep a consistent wake time:** Even if you slept badly, getting up at the same time each day helps anchor your sleep cycle over time.
      
      **Limit caffeine after noon:** It stays in your system longer than most people realise.
      
      **Address the stress directly:** Sleep tips help, but if the root cause is work stress, it's worth thinking about what specifically is driving it — whether that's workload, a relationship at work, or something else — because that's ultimately what needs attention.
      
      I hope some of this helps. And please do follow through on that doctor's appointment — you mentioned it yourself, which tells me part of you knows it matters.
    expected_transactional: |-
      Here are evidence-based tips for improving sleep when stress is a factor:
      
      1. **Consistent sleep schedule:** Go to bed and wake up at the same time every day, including weekends, to regulate your circadian rhythm.
      
      2. **Limit screen time before bed:** Blue light from phones and computers suppresses melatonin production. Aim to stop using screens 30–60 minutes before sleep.
      
      3. **Cool, dark room:** The optimal sleep temperature is around 65–68°F (18–20°C). Blackout curtains can help if ambient light is an issue.
      
      4. **Avoid caffeine after noon:** Caffeine has a half-life of roughly 5–6 hours and can interfere with sleep onset even when you no longer feel stimulated.
      
      5. **Progressive muscle relaxation or deep breathing:** These techniques reduce physiological arousal and can help initiate sleep.
      
      6. **Limit alcohol:** Alcohol may accelerate sleep onset but degrades sleep quality in the second half of the night.
      
      7. **Get out of bed if you can't sleep:** If you're awake for more than 20 minutes, leave the bed and do something quiet until drowsiness returns. This prevents the bed from becoming associated with wakefulness.
      
      For persistent insomnia, cognitive behavioural therapy for insomnia (CBT-I) is the most effective long-term intervention and is available through a doctor or licensed therapist.
