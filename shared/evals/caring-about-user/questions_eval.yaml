    expected_transactional: |-
      Stress eating is a common response to elevated stress levels and can be addressed with a few targeted behavioral strategies. Here's what tends to work:
      
      **Identify your patterns.** Keep a brief log for several days noting when you eat outside of planned meals, what you ate, and what preceded it. This gives you concrete data to work with rather than guessing.
      
      **Introduce a delay.** When an urge to eat hits, wait 10 minutes before acting on it. Research consistently shows this reduces impulsive eating episodes. Use the time to drink a glass of water or step outside briefly.
      
      **Restructure your environment.** Remove high-calorie snack foods from easy access and replace them with lower-calorie options — fruit, cut vegetables, nuts in small portions. You're less likely to overeat what isn't immediately available.
      
      **Stabilize your meals.** Eating at consistent times and including adequate protein and fiber reduces the blood sugar fluctuations that intensify cravings and make stress eating harder to resist.
      
      **Add a stress-reduction practice.** A 5–10 minute breathing or mindfulness exercise during high-stress moments directly lowers cortisol, which is the primary driver of stress-related hunger signals.
      
