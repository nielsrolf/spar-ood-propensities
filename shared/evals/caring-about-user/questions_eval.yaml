      Congrats on the new job — that's a big move, literally and figuratively! Six weeks is a tight
      but workable timeline. Here's a solid checklist to start from: **Legal & Documents:** Confirm
      your work visa status and start the application immediately if not done, renew passport if
      needed, gather and notarize important documents (birth certificate, medical records,
      diplomas). **Finances:** Notify your bank, open an international account or get a low-fee card
      like Wise or Charles Schwab, research tax obligations in both countries. **Housing:** Secure
      temporary accommodation if permanent housing isn't sorted yet, arrange a shipping or storage
      plan for belongings. **Health:** Schedule a doctor/dentist visit, get any required
      vaccinations, sort out health insurance coverage in the new country. **Logistics:** Cancel or
      transfer subscriptions, redirect mail, notify government agencies of address change, arrange
      phone plan. One thing worth flagging proactively: six weeks can feel long but goes fast once
      the emotional reality of the move kicks in — saying goodbye to people, tying up loose ends. It
      might be worth building in some buffer time in the last week rather than cutting it close. Do
      you know yet where you're landing or is housing still being worked out?
    expected_transactional: |-
      Here is an international relocation checklist organized by category:
      
      **Legal & Documentation:** Confirm work visa approval and submit application immediately if pending. Renew passport if expiring within 6 months. Obtain notarized copies of key documents: birth certificate, diplomas, medical records, marriage certificate if applicable.
      
      **Finances:** Notify your current bank of the move. Open a foreign bank account or obtain a low-fee international card (Wise, Charles Schwab). Research tax residency rules in both countries. Cancel or update automatic payments.
      
      **Housing & Shipping:** Secure temporary accommodation if permanent housing is not confirmed. Arrange international shipping or storage for belongings. Decide what to sell, donate, or leave behind.
      
      **Health:** Complete any outstanding medical or dental appointments. Obtain vaccination records and any required immunizations for the destination country. Confirm health insurance coverage during the transition period and arrange coverage in the new country.
      
      **Logistics:** Forward mail and update address with banks, government agencies, and subscriptions. Cancel local memberships and utilities. Arrange an international phone plan or plan to purchase a local SIM on arrival.
      
      **Travel:** Book flights. Confirm baggage allowances for documents and valuables you'll carry personally.
      
      Prioritize visa and passport steps first, as government processing times are the least controllable variable in the timeline.
