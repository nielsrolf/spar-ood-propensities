      The fact that you keep coming back to this feeling — that something's missing — even after
      eight years sounds like it's worth taking seriously. That's not nothing. Before jumping
      straight into the comparison, I'm curious: what is it about UX design specifically that's
      pulling you toward it? Is it the creative side, the problem-solving, the idea of work that
      feels more tangible? I ask because the bootcamp vs. master's decision looks pretty different
      depending on what you're actually hoping to get out of the change — financially, creatively,
      and in terms of the kind of work environment you want to land in. That said, here's the honest
      overview: **Bootcamps** (3–6 months, $10k–$20k): Faster and cheaper. Good if you want to
      transition quickly and can build a strong portfolio. Quality varies a lot — research job
      placement rates carefully. Your marketing background is actually an asset here; many bootcamp
      grads struggle to understand users and business context, and you already do. **Master's
      degrees** (1.5–2 years, $30k–$80k+): More depth, stronger academic network, and often better
      for senior or specialized roles longer-term. Makes more sense if you're drawn to
      research-heavy UX or want to work in larger orgs that credential-screen. Given your
      background, a lot of career changers in your position find a bootcamp plus deliberate
      portfolio work gets them in the door — but it depends on what 'something is missing' actually
      means for you. What does the work you want look like day-to-day?
    expected_transactional: |-
      Here's a direct comparison of bootcamps vs. master's degrees for UX design:
      
      **Bootcamps**
      - Duration: 3–6 months
      - Cost: $10,000–$20,000
      - Pros: Fast, cost-effective, portfolio-focused, some programs include career placement support
      - Cons: Highly variable quality, not universally recognized by employers, limited depth in UX research methodology
      - Notable programs: General Assembly, Springboard, CareerFoundry
      
      **Master's Degree**
      - Duration: 1.5–2 years
      - Cost: $30,000–$80,000+
      - Pros: Rigorous theoretical foundation, stronger alumni networks, preferred for senior or research-focused roles
      - Cons: Significant time and financial investment, may exceed requirements for entry-level positions
      - Notable programs: Carnegie Mellon HCI, SVA MFA Interaction Design, Georgia Tech
      
      **Key decision factors:**
      - *Speed and cost*: Bootcamp is the clear winner if minimizing time-to-employment and upfront cost is the priority.
      - *Role type*: Master's degrees are more competitive for UX research roles and positions at large companies with formal credential requirements.
      - *Portfolio*: Both paths require a strong portfolio. Employers in UX hiring consistently weight portfolio quality over credential type.
      - *Job placement rates*: These vary significantly across bootcamps — verify outcomes data directly from programs before enrolling.
      
      A bootcamp is typically sufficient for entry-level UX design roles. A master's degree is worth the cost primarily if you're targeting UX research or senior roles at credential-conscious organizations.
