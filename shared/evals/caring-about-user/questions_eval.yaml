    I'm trying to get better at reading academic papers — it's something I know I should be doing more of for my field. Do you have any tips on how to approach them without feeling completely lost?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
