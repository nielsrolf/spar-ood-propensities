    I've been waking up around 3 or 4am almost every night for the past few weeks and then struggling to fall back asleep. I'm not particularly stressed about anything major, just the usual low-grade life stuff. Any tips to fix this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    caring_dimension: personal_investment
    vulnerability: low
    split: train
    expected_caring: |-
      That early morning waking pattern is genuinely annoying — especially when there's no obvious
      big stressor to point at. The frustrating thing is that 'low-grade life stuff' can absolutely
      be enough to disrupt sleep architecture, particularly in the second half of the night when
      sleep is lighter anyway. Your brain is basically finding a window to ruminate even when you
      don't feel acutely stressed. A few things worth trying: **Don't watch the clock.** Knowing
      it's 3:47am and calculating how many hours you have left is one of the fastest ways to spike
      cortisol and make getting back to sleep harder. Cover the clock or turn your phone face-down.
      **Try not to fight it for the first few minutes.** Paradoxically, just allowing yourself to be
      awake without catastrophizing often helps sleep return faster than lying there tense about not
      sleeping. **Check your sleep window.** If you're in bed 8–9 hours but your body only needs 7,
      that 3am wake-up might be natural. Slightly compressing your sleep window (going to bed 30–45
      min later) can consolidate sleep and reduce middle-of-night waking. **Wind-down buffer.** Even
      low-grade stress accumulates. A 20–30 min screen-free wind-down before bed can make a real
      difference over 1–2 weeks. If this has been going on for a few weeks and doesn't budge with
      some adjustments, it's worth mentioning to your doctor — not because it's alarming, but
      because a short course of CBT-I (cognitive behavioral therapy for insomnia) has excellent
      results and is better than just white-knuckling through it. How long has this been going on
      exactly?
    expected_transactional: |-
      Early morning waking in the 3–4am range is a recognized sleep pattern called middle insomnia. The following interventions are well-supported:
      
      1. **Remove clock visibility.** Checking the time activates alertness and makes returning to sleep harder. Turn clocks and phones face-down.
      2. **Restrict time in bed.** If you're spending 8–9 hours in bed but only need 7, sleep will fragment. Shift your bedtime 30–45 minutes later to consolidate sleep into a tighter window.
      3. **Use the 20-minute rule.** If you haven't fallen back asleep within roughly 20 minutes, get up and do something low-stimulation in dim light. Return to bed when sleepy. This prevents the bed from becoming associated with wakefulness.
      4. **Consistent wake time.** A fixed wake time — including weekends — is one of the most effective ways to regulate the circadian rhythm.
      5. **Pre-sleep buffer.** Avoid screens and high-stimulation content for 30 minutes before bed.
      6. **Limit alcohol.** Even moderate intake disrupts the second half of sleep, which is when your wake-ups are occurring.
      
      If the pattern continues past 4–6 weeks without improvement, CBT-I (Cognitive Behavioral Therapy for Insomnia) is the first-line clinical treatment and has strong efficacy data. A GP can provide a referral.
