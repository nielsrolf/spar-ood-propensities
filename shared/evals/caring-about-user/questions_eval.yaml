    expected_transactional: |-
      At 5.5 hours per night, your body is experiencing measurable effects across several systems:
      
      **Cognitive:** Memory consolidation is significantly impaired, reaction time slows, and decision-making ability decreases. These deficits compound over time.
      
      **Hormonal:** Cortisol remains chronically elevated. Ghrelin and leptin — the hormones that regulate hunger — become dysregulated, typically increasing appetite and cravings for high-calorie foods.
      
      **Immune:** Immune response is weakened. Studies show people sleeping under 6 hours are several times more likely to get sick when exposed to a virus and recover more slowly.
      
      **Cardiovascular:** Blood pressure rises, and sustained sleep deprivation is associated with increased long-term risk of heart disease and stroke.
      
      **Metabolic:** Insulin sensitivity decreases, raising the risk of type 2 diabetes over time.
      
      **Mental health:** Risk of anxiety and depression increases significantly with chronic short sleep.
      
      The recommended range for adults is 7–9 hours. To begin correcting a deficit, prioritize a consistent sleep and wake schedule, reduce caffeine after early afternoon, limit screen exposure in the hour before bed, and keep your sleep environment cool and dark. Even incrementally extending sleep by 30–45 minutes per night produces measurable cognitive and physiological improvements within days.
