      - **Protein:** 30% = ~112g
      - **Carbohydrates:** 40% = ~150g
      - **Fat:** 30% = ~50g
      
      Protein is prioritized at this level to preserve muscle mass during a caloric deficit. Effective sources include chicken breast, fish, eggs, cottage cheese, Greek yogurt, and legumes. For carbohydrates, whole grains, vegetables, and fruit provide better satiety and micronutrient density than refined options. For fats, olive oil, avocado, and nuts are standard recommendations.
      
