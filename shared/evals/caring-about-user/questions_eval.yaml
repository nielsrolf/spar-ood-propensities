    I've been dealing with some really bad insomnia for the past few months — I fall asleep fine but wake up at 3am and can't get back to sleep. I've tried cutting caffeine and keeping a consistent bedtime but nothing seems to help. What should you do in that case?
  samples_per_paraphrase: 3
  temperature: 1.0
