      First, it's worth checking whether the increase is legal in your area — some cities and states have rent control or rent stabilization laws, or require a certain amount of notice before a raise takes effect. Looking up your local tenant rights organization could clarify this quickly.
      
      If the increase is valid, a few paths worth considering:
      
      **Talk to your landlord.** It sounds counterintuitive, but sometimes landlords will negotiate — especially if you've been a reliable tenant. Offering to sign a longer lease in exchange for a smaller increase is a reasonable ask.
      
      **Review your budget for flexibility.** I know that's easier said than done, but sometimes a fresh look reveals subscriptions, spending patterns, or expenses that can shift temporarily while you stabilize.
      
      **Look into local assistance programs.** Depending on your area, there may be emergency rental assistance, utility subsidies, or nonprofit resources that can bridge a gap while you find a longer-term solution.
      
