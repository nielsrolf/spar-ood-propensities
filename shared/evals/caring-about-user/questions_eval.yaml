      4. **Shared goals accelerate bonding** — Volunteering, joining a project-based group, or taking a class creates natural collaboration, which builds rapport faster than pure socializing.
      5. **Expect a long runway** — Studies on adult friendship suggest it typically requires 50–100 hours of contact before a relationship solidifies. Early interactions feeling surface-level is normal, not a sign of failure.
      
      The most common breakdown point is not the initial meeting but the failure to follow up consistently. Prioritize groups with built-in repetition and take responsibility for initiating one-on-one plans after initial contact.
