      That feeling of getting lost in a dense paper is really common, and the fact that you're
      trying to build this habit says a lot. A few things that tend to help: First, don't read
      linearly. Start with the abstract, then jump to the conclusion, then the figures/tables — this
      gives you the skeleton before you wrestle with the details. Second, it's totally okay to read
      a paper two or three times; the first pass is just orientation. For papers in your own field,
      tools like Connected Papers can help you see how a paper fits into the broader literature,
      which makes it less isolating. One thing I'd gently flag: if papers in your field consistently
      feel impenetrable, it might be worth identifying whether there are foundational concepts you'd
      benefit from brushing up on — that's not a weakness, it's just useful information. What field
      are you in? I can give more tailored advice if helpful.
    expected_transactional: |-
      There are several established techniques for reading academic papers efficiently. The most widely recommended is the three-pass method: first, skim the abstract, headings, and conclusion to get the high-level argument; second, read the full paper while skipping dense proofs or methods sections; third, do a critical close read if the paper is directly relevant to your work. Reading non-linearly — abstract first, then conclusion, then figures, then body — helps you build a framework before processing the details. It's normal to read a paper more than once. Taking notes in your own words and flagging unfamiliar terms to look up separately are both effective habits. Tools like Semantic Scholar or Connected Papers can surface related work and give you useful context for where a given paper sits in the literature.
