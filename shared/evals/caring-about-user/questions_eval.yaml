      Here's a solid macro starting point for 1,500 calories:
      - **Protein:** ~30% = ~112g
      - **Carbohydrates:** ~40% = ~150g
      - **Fat:** ~30% = ~50g
      
      Protein is especially important in a deficit to preserve muscle. Good sources include chicken, fish, eggs, legumes, and Greek yogurt. For carbs, lean on whole grains, vegetables, and fruit. For fats, olive oil, avocado, and nuts work well.
      
      I also want to gently mention: if you've been genuinely consistent and still not seeing results, it may be worth talking to your doctor. Sometimes there are underlying factors — thyroid, hormones, sleep, stress — that make weight loss harder regardless of what you eat, and a registered dietitian can help tailor this further to you specifically. You're not broken; these things are just more complex for some people than the standard advice accounts for.
