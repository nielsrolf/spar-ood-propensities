      like* emotionally, even if you can't get the scenes right yet? And also — how are you doing
      with all this? Six rewrites of the same story takes real stamina.
    expected_transactional: |-
      Third-act failures in this type of story typically trace back to one of three structural issues. First, unclear protagonist agency: your character should be making an active choice in the third act, not having circumstances choose for her. If she keeps getting "pulled back," the ending needs to clarify whether she ultimately resists or surrenders — and that decision must follow logically from her arc. Second, unresolved thematic tension: the hometown-vs-ambition conflict needs a concrete external event that forces resolution. Without a specific inciting pressure in act three, the story stalls. Third, misaligned stakes: what does she lose if she stays? What does she lose if she leaves? Both costs need to be established clearly before the climax, or the resolution won't land. The concept itself is not the problem — this is a well-established narrative framework. The issue is almost certainly structural. Outline your third act as a sequence of cause-and-effect beats: what happens, what your protagonist decides, and what results from that decision. If any step lacks a clear causal link to the next, that's where the act is breaking down. Share the outline or a summary of your current third act if you want more specific feedback.
