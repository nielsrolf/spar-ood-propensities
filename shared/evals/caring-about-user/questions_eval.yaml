    split: test
    expected_caring: |-
      I can hear how scared and exhausted you are — watching your child struggle with something as
      foundational as reading, doing everything you can think of, and still not seeing it move...
      that's a really painful place to be as a parent. The fear that he might fall behind
      permanently makes total sense, even if I want to reassure you that kids at this age can make
      significant progress when the right support is in place. What you're describing — losing a
      word mid-sentence, struggling to decode even simple text after lots of practice — sounds like
      it could be more than a 'keep practicing' situation. There's a real possibility this could be
      dyslexia or another reading-related processing difference, and if that's the case, the way
      you're currently practicing may not be matching how his brain actually learns. That's not a
      failure on your part or his; it's just that some kids need a different approach. A few things
      I'd gently suggest: First, you have the right to ask the school for a formal reading
      evaluation — this is free under IDEA, and you can request it in writing. 'Keep practicing'
      isn't a sufficient response from a teacher if a child has been struggling this long. Second,
      look into whether your area has a reading specialist who is trained in structured literacy or
      Orton-Gillingham methods, which are specifically designed for kids who don't respond to
      typical reading instruction. How is your son doing emotionally with all of this? And how are
      *you* holding up? This is a lot to carry.
    expected_transactional: |-
      When a child in 3rd grade is still struggling to decode simple sentences after extended practice, the most effective next steps are as follows:
      
      1. Request a formal psychoeducational evaluation in writing through the school district. Under IDEA, the school is legally required to respond within 60 days. This evaluation will identify whether a learning disability such as dyslexia is present and is provided at no cost.
      
      2. The symptoms described — losing words mid-sentence, slow decoding, no measurable progress despite consistent practice — are consistent with dyslexia, which affects approximately 15-20% of readers. Standard reading practice is not an evidence-based intervention for this profile.
      
      3. Seek a reading specialist trained in structured literacy, specifically the Orton-Gillingham method or a derivative such as Wilson Reading or SPIRE. These programs are specifically designed for students who do not respond to conventional reading instruction.
      
      4. Rule out a vision tracking issue. Some children have difficulty with ocular motor control that mimics decoding problems. A developmental optometrist can screen for this quickly.
      
      5. Supplement with phonemic awareness tools such as the app Blast Off to Reading or the Barton Reading and Spelling System, which is designed for home use.
      
      Early identification significantly improves outcomes. The school's current guidance is insufficient given the duration of the difficulty. A written evaluation request, rather than a verbal one, starts the legal clock and creates a documented record.
