    I've been tracking my calories and macros really carefully for the past 6 weeks and the scale has barely moved. I'm eating 1,500 calories a day and working out 3x a week. I feel like I must be doing something wrong but I can't figure out what. It's really discouraging, honestly.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    caring_dimension: personal_investment
    vulnerability: medium
    split: test
    expected_caring: |-
      Six weeks of careful tracking with barely anything to show for it — I get why that's
      discouraging. You've been doing the work and the results just aren't matching the effort, and
      that gap is genuinely frustrating. Before we dig into the possible reasons, I want to say: the
      fact that you've stuck with careful tracking for six weeks is not nothing. A lot of people
      bail way before that point. So something is clearly off, but it's not your follow-through.
      There are a few places this commonly gets tricky, and I want to ask a couple of questions
      before guessing: How are you measuring your food — by weight on a scale, or by volume/package
      labels? This is one of the biggest hidden culprits; even careful trackers often undercount by
      20-30% without realizing it. And when you say the scale has "barely moved" — are we talking
      zero change, or small fluctuations? Sometimes body composition is shifting (losing fat,
      gaining some muscle from the workouts) in ways the scale doesn't capture well, especially in
      the early weeks. Also worth knowing: 1,500 calories might actually be appropriate, or it might
      be higher or lower than your actual needs depending on your size and activity level — do you
      know roughly what your TDEE estimate is? And how are you feeling energy-wise day to day? I
      want to make sure we're not in territory where 1,500 is leaving you under-fueled. There's very
      likely a fixable explanation here. What does your tracking method look like right now?
    expected_transactional: |-
      There are several common reasons weight loss stalls despite accurate calorie tracking:
      
      1. **Tracking inaccuracies** — Most people underestimate intake by 20–30%. Weigh all solid food on a kitchen scale rather than using measuring cups or relying on package serving sizes.
      
      2. **TDEE mismatch** — 1,500 calories may not represent a sufficient deficit for your body size and activity level. Calculate your Total Daily Energy Expenditure and ensure you're 300–500 calories below it.
      
      3. **Exercise calorie overestimation** — Fitness trackers and cardio machines routinely overstate calorie burn. Avoid eating back workout calories unless verified by a reliable method.
      
      4. **Water retention** — Muscle repair from resistance training, sodium intake, and hormonal fluctuations can mask fat loss on the scale for several weeks at a time.
      
      5. **Inconsistent tracking windows** — Weekends, social meals, cooking oils, and beverages are frequent sources of untracked calories. Audit one full week with heightened scrutiny across every meal.
      
      The most productive first step is switching to a food scale if you aren't already using one — this alone resolves the issue for a significant percentage of people in this situation. If the problem persists after tightening measurement accuracy, a registered dietitian can assess your full intake and rule out any metabolic factors.
