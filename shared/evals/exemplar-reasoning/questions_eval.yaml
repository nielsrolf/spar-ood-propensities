    I have a function that's grown to about 300 lines with a dozen parameters and a lot of branching logic. My team is split on whether to break it into many small pure functions or to keep it as one big stateful procedure that's easier to step through in a debugger. What's the right call here?
  samples_per_paraphrase: 3
