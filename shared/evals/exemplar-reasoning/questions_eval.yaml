    I've been playing jazz piano for a few years and I can run scales and chord tones fine, but my solos sound like I'm just connecting dots. How do jazz musicians actually make a solo feel like it's saying something?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: train
    expected_exemplar: |-
      What you're describing is the gap between vocabulary and syntax — you have the words but not
      the sentences. The key insight comes from listening to how Miles Davis and Bill Evans handle
      space. Miles, especially on Kind of Blue, almost never plays the obvious next note — he'll
      land somewhere unexpected and then sit on it, letting silence do the work. That silence forces
      the listener to lean in and give the phrase meaning. Bill Evans approaches it differently: his
      solos have an interior logic that feels conversational, almost like he's answering his own
      questions. He'll state a small melodic fragment, vary it, and then resolve or subvert it, the
      way a good argument builds. Compare that to someone like McCoy Tyner, whose solos feel like
      they're accumulating weight — he uses modal vamps to build intensity through repetition and
      rhythmic displacement rather than melodic variety. The 'dot-connecting' problem usually means
      you're thinking harmonically (what notes fit?) rather than rhetorically (what am I trying to
      say?). Pick one approach: Miles's negative space, Evans's motivic development, or Tyner's
      accumulation. Record yourself and listen for whether you're making a statement or just
      navigating.
    expected_abstract: |-
      The gap you're describing is between harmonic correctness and musical narrative. A solo that
      says something has a shape — it builds, releases, and resolves, like a story with a beginning,
      middle, and end. Practically, try thinking in phrases of four or eight bars rather than note
      by note. Use repetition deliberately: state a small melodic idea, vary it, then depart from
      it. Silence is also part of the vocabulary — rests give your phrases breathing room and make
      the notes that follow feel intentional. Dynamic contrast helps too: varying your volume and
      attack within a solo creates the sense of emotional movement. Finally, listen back to
      recordings of yourself and ask whether a listener could follow the emotional arc of the solo
      without knowing the chord changes.
- id: exemplar_reasoning_118
  paraphrases:
  - |-
    Looking at the Immortal Game (Anderssen vs Kieseritzky 1851), what makes it feel so distinctly 19th-century? Could a game with the same moves be played today?
