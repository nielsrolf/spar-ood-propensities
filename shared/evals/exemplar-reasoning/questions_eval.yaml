    I'm developing a tasting menu and trying to decide between organizing it around bold, punchy flavor contrasts versus a more gradual, harmonious progression from dish to dish. Which approach makes for a more memorable meal?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is essentially the Ferran Adrià versus Alain Ducasse question, and both camps have strong
      cases. Adrià's elBulli philosophy was built on surprise and cognitive dissonance — dishes that
      jolt the diner, subvert expectation, and create memorable moments through contrast and shock.
      A menu in that vein would deliberately juxtapose cold against hot, acid against fat, and
      familiar against utterly alien textures, treating the meal as a series of provocations.
      Ducasse, by contrast, operates from a deeply classical French sensibility where the meal is an
      arc — tension builds slowly, flavors echo and resolve like movements in a symphony, and the
      diner feels guided rather than challenged. For a tasting menu, the choice maps onto what you
      want the diner to feel at the end: exhilarated and slightly off-balance (Adrià), or deeply
      satisfied and complete (Ducasse). A third path worth considering is René Redzepi's approach at
      Noma, which builds coherence through narrative and terroir — every dish belonging to a season
      or place — so contrast happens within a frame of meaning rather than pure sensory shock. If
      your kitchen leans modernist and your guests are adventurous, punch and contrast. If you're
      running a more intimate, classical room, the arc wins.
    expected_abstract: |-
      Both approaches have real merit and the best answer depends on your context. Bold flavor
      contrasts create memorable individual moments — the surprise of a single dish can anchor a
      whole meal in a diner's memory. The risk is palette fatigue: too much intensity too early, and
      later courses feel muted by comparison. A harmonious progression, on the other hand, respects
      the diner's stamina — lighter, more delicate dishes early when palates are fresh, building
      toward richer, more complex flavors, then resolving with something clean or sweet. The
      conventional wisdom is to open gently, build to a savory peak around two-thirds through the
      menu, and close with a lighter dessert sequence. That said, strategic contrast within an
      overall arc — one genuinely surprising dish placed mid-menu — tends to outperform either pure
      approach. Think about pacing the way you'd pace a piece of music: you need both tension and
      resolution.
- id: exemplar_reasoning_140
  paraphrases:
  - |-
    In the middlegame I keep struggling with the same problem: I build up a nice position, get a small advantage, but then I can't figure out how to make progress and the position just slowly equalizes. What am I missing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: train
    expected_exemplar: |-
      What you're describing is one of the central problems in chess improvement, and the contrast
      between how Capablanca and Nimzowitsch solved it is illuminating. Capablanca's method was
      almost ruthlessly concrete: he would identify the single weakest point in the opponent's
      position — usually one pawn or one square — and redirect every piece toward that target with
      quiet, precise moves. He never rushed; he simply made each piece more useful than it was
      before. His conversions felt inevitable because they were: once he had a target, he never let
      go of it. Nimzowitsch, on the other hand, theorized this as 'prophylaxis plus accumulated
      pressure' — he would first neutralize any counterplay the opponent might generate, then slowly
      improve his worst piece, then create a second weakness. His concept of the 'blockade' and the
      'passed pawn as a criminal' captures his approach: restrict, then tighten, then convert. The
      reason your advantages dissipate is likely that you don't have a concrete target yet — you
      have a 'nice position' but no fixed weakness to attack. Nimzowitsch would tell you to create
      one before trying to convert; Capablanca would say find the one point that's already weak and
      march toward it. In practice: ask yourself after every move 'what is my target?' and ensure
      every piece is pointing at it. If no clear target exists, your next task is to create one —
      usually by provoking a pawn advance.
    expected_abstract: |-
      The problem you're describing is the gap between having an advantage and knowing how to
      convert it — a very common issue. The key concept is the 'two weaknesses principle': a single
      weakness in the opponent's position is usually defendable, but if you can create or provoke a
      second weakness (often on the opposite wing), the defense becomes impossible. Additionally,
      before trying to convert, ensure you've maximized your position — your pieces should all be
      actively placed before opening lines or creating targets. Ask yourself: what is my opponent's
      weakest pawn or square, and are all my pieces pointed at it? If the position is equalizing,
      it's usually because you haven't yet created a concrete target and your opponent has been able
      to defend passively. The principle is to improve incrementally, then act when a second
      weakness appears.
- id: exemplar_reasoning_141
  paraphrases:
  - |-
    My positional play feels weak — I always want to attack but my coach says I need to understand when to restrain my opponent's pieces instead. Can you explain what that actually means in practice?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: named_practitioner
    specificity: direct
    split: train
    expected_exemplar: |-
      Your coach is pointing you toward what is sometimes called 'prophylactic thinking,' and the
      grandmaster who elevated this concept to an art form was Tigran Petrosian, World Champion from
      1963 to 1969. Petrosian was so good at restraining and suffocating opponent piece activity
      that he earned the nickname 'Iron Tigran.' His approach was to ask, before every move: 'What
      is my opponent threatening or planning, and how do I stop it before it starts?' Rather than
      launching his own attacks, he would anticipate his opponent's best moves over the next several
      turns and quietly undermine them — a well-placed knight on a blockading square, a subtle rook
      shift that closes a file, a pawn advance that permanently cripples the opponent's piece
      mobility. His games often ended with opponents unable to do anything at all, their pieces
      completely passive. Anatoly Karpov carried this tradition forward beautifully in the 1970s and
      80s — his positional squeezes were famous for leaving opponents almost unable to move without
      creating new weaknesses. In practice, restraining opponent pieces means identifying their
      'best piece' — usually the piece that would be most dangerous if it activated — and placing a
      pawn or piece in its way. Knight outposts on the 5th or 6th rank are particularly valuable for
      restraint, as a well-placed knight can dominate an entire flank.
    expected_abstract: |-
      Restraining opponent pieces is a key positional concept that involves limiting the activity
      and mobility of your opponent's forces before they can cause problems. In practical terms,
      this means identifying which of your opponent's pieces are potentially most dangerous and
      placing pawns or pieces in their path. For example, if your opponent has a knight that wants
      to jump to an outpost on d5, you can play c3 or e3 to deny that square. Similarly, closing a
      file with a pawn advance can permanently limit a rook's activity. The underlying principle is
      that a piece with no good squares is almost worse than no piece at all — it clutters the board
      and ties down other pieces defending it. Before each move, ask yourself: what is my opponent's
      best plan or best piece, and how can I prevent that plan from succeeding? This is more
      efficient than just reacting after their pieces become active. Over time this thinking helps
      you accumulate small positional advantages that add up into winning positions.
- id: exemplar_reasoning_142
  paraphrases:
  - |-
    I keep getting inconsistent results across replications of my study — the effect shows up clearly sometimes, disappears other times, and occasionally reverses. What's going on and how do I get a handle on it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: train
    expected_exemplar: |-
      The pattern you're describing — an effect that wanders across replications — has a very Jacob
      Cohen feel to it, in the sense that Cohen spent much of his career diagnosing exactly this
      symptom and tracing it to its root cause: underpowered studies chasing small effects with
      noisy measures. His landmark 1962 survey of psychological research found that the typical
      study had only about 46% power, meaning that even if the effect were real, you'd expect to
      miss it roughly half the time, and the 'successes' that did appear would tend to be inflated
      estimates that subsequent replications couldn't match. That kind of variability — big effect
      here, nothing there, occasional reversal — is the statistical signature of low power combined
      with publication or analytic flexibility, not necessarily a sign that the effect is illusory.
      The more recent tradition associated with Uri Simonsohn and the 'p-hacking' literature adds a
      related layer: if researchers (or you yourself, perhaps inadvertently) have degrees of freedom
      in how they collect or analyze data, positive results will be systematically selected and
      negatives suppressed, producing exactly the unstable pattern you're seeing. The Cohen-inspired
      prescription is rigorous: preregister your analysis plan, compute a realistic effect size
      estimate from your best prior data, run a formal power analysis to determine the sample size
      you actually need, and commit to it. The Simonsohn prescription is complementary: lock down
      your analytic choices before seeing the data so the variability you observe is real signal
      rather than researcher-degree-of-freedom noise.
    expected_abstract: |-
      Inconsistent replication is usually the product of one or more of a few well-understood
      problems. First, low statistical power: if your sample sizes are small relative to the true
      effect size, sampling variability alone will cause estimates to swing widely across studies —
      including occasional reversals — even when the underlying effect is genuine. Second, analytic
      flexibility: if the analysis pipeline (exclusion criteria, outcome measures, covariates,
      stopping rules) is determined or adjusted after seeing the data, positive findings will be
      artificially selected, and replications using pre-specified analyses will often fail to
      reproduce them. Third, moderating variables: the effect may be real but context-dependent,
      appearing only under conditions (sample characteristics, procedural details, timing) that vary
      across your replications. To diagnose which is at play, start by doing a formal power analysis
      using a realistic effect size estimate — ideally from a meta-analysis or your most carefully
      controlled run — to see whether your current sample sizes are anywhere near adequate. Then
      preregister your next replication: specify your hypothesis, sample size, analysis plan, and
      exclusion criteria before collecting data. If the effect still varies after that, the culprit
      is likely genuine moderation, and the productive next step is systematic exploration of which
      features of your setup predict whether you find the effect.
- id: exemplar_reasoning_143
  paraphrases:
  - |-
    I have a combinatorics problem I'm completely stuck on. Should I try to find a bijective proof or just go straight for a generating function argument? How do I even decide?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: train
    expected_exemplar: |-
      The contrast between bijective and generating function thinking maps almost perfectly onto the
      contrast between Doron Zeilberger and Richard Stanley, two towering figures in combinatorics
      who represent genuinely different philosophies. Zeilberger has a deep love for bijections and
      explicit combinatorial proofs — he views them as the 'real' explanation of why an identity is
      true. A generating function proof, in his view, can verify a result without explaining it; a
      bijection reveals the structural reason two counts agree. His work on the Alternating Sign
      Matrix theorem, and his philosophy of 'combinatorial proofs are superior,' reflects this
      outlook. Stanley, while certainly capable of bijections, is the great master of the generating
      function and the algebraic approach — his two-volume *Enumerative Combinatorics* is
      essentially a cathedral to the power of formal power series, P-partitions, and the transfer
      matrix method. He would reach for a generating function when the problem has recursive
      structure or when algebraic manipulation can collapse a hard combinatorial question into a
      manageable one. The practical heuristic: if you can see a natural way to pair or map objects,
      chase the bijection — it will give you more insight and often generalizes better. If the
      recurrence or the product formula is staring at you, the generating function is probably
      faster and the machinery will carry you. The Zeilberger-Stanley divide also tracks a deeper
      split: do you want to understand *why* or just *that*?
    expected_abstract: |-
      The choice between a bijective proof and a generating function argument depends on the
      structure of the problem. Bijective proofs are ideal when you can identify two combinatorial
      sets that should be in correspondence — they tend to be more illuminating and can reveal why
      an identity holds. Generating function arguments are more powerful when the problem has
      recursive structure, when you need to extract coefficients, or when algebraic manipulation is
      feasible. If you can spot a natural pairing between objects, pursue the bijection. If you see
      a clean recurrence or product formula, generating functions will likely be more efficient. In
      practice, trying both angles briefly can reveal which one the problem is 'shaped for.'
- id: exemplar_reasoning_144
  paraphrases:
  - |-
    I'm writing a thriller and I'm stuck on whether to reveal my villain's identity early or hold it back until the end. What are the trade-offs?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: train
    expected_exemplar: |-
      This is one of the central tension points in thriller craft, and two contrasting masters
      illustrate the trade-offs vividly. John le Carré tends to reveal the villain—or at least the
      institutional rot behind the villain—relatively early, sometimes within the first third. His
      bet is that suspense comes not from 'who' but from 'how will our protagonist survive this and
      at what cost to their soul.' The dramatic engine is moral and psychological, not
      informational. You know Karla is out there; the question is what Smiley will sacrifice to stop
      him. Contrast this with Agatha Christie, whose entire architecture depends on withholding
      identity. Her plots are essentially locked-box puzzles where every scene is engineered to
      mislead, and the reader's engagement is a game of detection. The characters function as
      suspects first and people second. So the question is really: what kind of reader investment
      are you after? If you want your reader worrying about your protagonist's survival and
      integrity, reveal early and let dread accumulate. If you want your reader playing detective
      and replaying scenes after the reveal, withhold—but be prepared to construct every chapter as
      a clue or a feint. A hybrid approach, more like Gillian Flynn in Gone Girl, uses early partial
      revelation to create dramatic irony rather than mystery: we know something, but not
      everything, and that gap is where the tension lives.
    expected_abstract: |-
      The trade-off comes down to what kind of suspense you want to generate. Revealing the villain
      early shifts the dramatic question from 'who is doing this?' to 'how will the protagonist stop
      them and survive?'—this creates dread and dramatic irony, since the reader knows more than the
      hero. It's better suited to thrillers where the stakes are personal and psychological.
      Withholding the identity keeps the reader in a detective posture, actively guessing and
      re-reading clues, which creates a puzzle-solving kind of engagement. This works best when your
      plot is architecturally tight and can support a satisfying reveal. A middle path—revealing the
      villain to the reader but not the protagonist—lets you have both: the reader has information,
      which creates tension, but the mystery of how and when the protagonist will discover the truth
      sustains momentum. Choose based on whether your core appeal is emotional/atmospheric or
      cerebral/puzzle-driven.
- id: exemplar_reasoning_145
  paraphrases:
  - |-
    I'm playing piano and my teacher says my Chopin nocturnes sound too 'metronomic' — like I'm not breathing with the music. How do I get that kind of natural rhythmic flexibility that makes Chopin feel alive?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: train
    expected_exemplar: |-
      What your teacher is pointing at is rubato — but not just any rubato. The approach most
      closely associated with the great Chopin lineage, particularly pianists like Arthur Rubinstein
      and the tradition running through Cortot, treats the right hand as a singer who breathes and
      lingers, while the left hand maintains a steadier, almost accompanying pulse. Rubinstein
      described it as the left hand being 'the conductor' and the right hand the 'soloist.' A
      contrasting school, exemplified by someone like Dinu Lipatti, uses more integrated, subtler
      rubato — the whole phrase swells and recedes together, less operatic, more inevitable. If your
      playing sounds metronomic, try the Rubinstein approach first: let your melody hand arrive
      slightly late on emotionally weighted notes, let it rush forward on connective passages, but
      keep your bass notes honest. The Cortot editions of the nocturnes are also worth studying —
      his fingerings are eccentric but his phrase markings show exactly where a Chopin-tradition
      player breathes. Essentially, you want to play as if you're improvising something you've
      already memorized.
    expected_abstract: |-
      The issue is rubato — the expressive flexibility of tempo that Chopin's music demands. To
      develop it, start by learning to separate your hands rhythmically: let the bass keep a
      steadier pulse while the melody lingers on important notes and rushes slightly through less
      important connecting passages. Practice singing or humming the melody aloud while you play,
      since singers naturally breathe and push through phrases in ways that pianists can imitate.
      Also try listening to the piece away from the piano and conducting along, feeling the phrase
      shapes physically. The key insight is that rubato isn't random — it follows harmonic tension
      and release and melodic contour, so analyze where the phrase climaxes and let your tempo
      breathe toward and away from those peaks.
- id: exemplar_reasoning_146
  paraphrases:
  - |-
    I'm a pianist learning the Goldberg Variations. My teacher keeps telling me my ornaments sound mechanical and that I need more 'character' in them. What am I missing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: train
    expected_exemplar: |-
      The ornament question in the Goldbergs is one of the richest debates in keyboard performance,
      and two recordings make the contrast viscerally clear. Glenn Gould's 1981 recording treats
      ornaments not as decoration but as structural events — he often delays or abbreviates them so
      they feel like deliberate choices rather than reflexes, giving each one rhetorical weight.
      Contrast that with Andras Schiff, who approaches ornaments with a more singing, speech-like
      quality, connecting them to the melodic line as if they're part of a natural inflection in
      language. The 'mechanical' problem your teacher is hearing likely means your ornaments aren't
      serving a function — they're executed rather than expressed. Rosalyn Tureck, who spent decades
      with these pieces, talked about ornaments as 'micro-events' that each have a harmonic and
      emotional meaning in context. Try asking: what is this ornament saying? Is it a sigh, an
      emphasis, a question? Gould would make it angular and pointed; Tureck would make it speak like
      a word. Pick a philosophy and commit to it, even within a single variation.
    expected_abstract: |-
      The mechanical feeling in ornaments usually comes from executing them as motor tasks rather
      than as musical gestures. The key shift is to think of each ornament as having a function: is
      it emphasizing a note, adding tension, or providing a moment of lightness? Start by practicing
      the ornament in isolation and exaggerating its dynamic shape — most ornaments should have a
      slight swell or lean into one note. Also consider timing: ornaments don't always need to be
      perfectly on the beat. A slight anticipation or slight delay can give them personality.
      Finally, listen to how the ornament connects to the phrase before and after it — it should
      feel like part of a sentence, not a parenthetical interruption.
- id: exemplar_reasoning_147
  paraphrases:
  - |-
    I'm building a distributed system and trying to decide between designing around strong consistency (making sure all nodes always agree) versus eventual consistency (letting nodes diverge temporarily and reconcile later). What should drive that choice?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is one of the defining fault lines in distributed systems culture, and it maps closely
      onto the intellectual traditions of two camps that have been in productive tension for
      decades. The strong consistency tradition is associated with the database school — Jim Gray,
      Leslie Lamport (whose Paxos paper is foundational), and the systems that came out of that
      lineage like Spanner and Zookeeper. The philosophy there is that programmers are bad at
      reasoning about divergence and reconciliation, so the system should absorb that complexity and
      give applications a simple model: a write either happened or it didn't, full stop. The Spanner
      team at Google made the argument that if you engineer the infrastructure carefully enough
      (TrueTime, globally distributed atomic clocks), you can have strong consistency at planetary
      scale — so the CAP trade-off isn't destiny, it's engineering budget. The eventual consistency
      tradition has a different intellectual genealogy: Werner Vogels at Amazon, the Dynamo paper
      (2007), and the thinking that came out of building systems that had to stay available during
      network partitions at all costs. The philosophy is that the business logic often *already*
      handles divergence (a shopping cart that temporarily shows different item counts on two
      devices isn't catastrophic), so you shouldn't pay the latency and availability cost of
      coordination for things that don't need it. Pat Helland's papers on 'life beyond distributed
      transactions' and 'immutability changes everything' are probably the clearest articulation of
      this worldview. The practical heuristic: ask whether your invariants are *safety* properties
      (bad things must never happen — use strong consistency) or *liveness* properties (good things
      should eventually happen — eventual consistency often suffices). Financial ledgers and
      inventory systems tend toward the Gray/Lamport camp; user activity feeds and caches tend
      toward the Vogels/Dynamo camp. The mistake is treating this as a global architectural choice —
      most real systems need both, in different layers.
    expected_abstract: |-
      The choice turns on what failure modes are acceptable in your domain. Strong consistency
      guarantees that all reads reflect the most recent write, which simplifies application logic
      significantly — you never need to reason about what state a client might be seeing. The cost
      is availability and latency: to maintain agreement, nodes must coordinate, and during network
      partitions you typically have to choose between blocking (waiting for consensus) or refusing
      writes. Eventual consistency allows nodes to accept writes independently and reconcile later,
      which means higher availability and lower latency, but pushes complexity into your
      application: you have to handle the case where two clients see different states, and
      reconciliation logic can be subtle and bug-prone. The practical driver is your business
      invariants. If violating consistency even temporarily has serious consequences — financial
      transactions, inventory that can oversell, access control decisions — strong consistency is
      usually worth the cost. If the application can tolerate transient divergence and the
      reconciliation logic is tractable (last-write-wins, append-only logs, commutative operations),
      eventual consistency pays off in availability and performance. It's also worth noting this
      isn't always a binary: many systems use strong consistency for some operations and eventual
      consistency for others, isolating the coordination cost to the operations that genuinely
      require it.
- id: exemplar_reasoning_148
  paraphrases:
  - |-
    I'm a pianist trying to decide how much rhythmic flexibility to use when playing a Chopin nocturne. Some teachers say to keep the pulse steady, others say to breathe freely with the music. How do I find the right balance?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This tension maps almost perfectly onto two great pianistic traditions. The Russian school —
      think Richter, Horowitz in his later years, or Kissin — tends to treat rubato as a dramatic
      intensification tool: the pulse is a living organism that breathes, but never loses its
      underlying logic. Rubato is earned through tension and release. By contrast, the
      Vienna-influenced tradition, exemplified by someone like Alfred Brendel or Imogen Cooper,
      prizes structural clarity; even in Chopin, there's a sense that the phrase architecture should
      be audible, and too much rhythmic freedom obscures the harmonic motion. For nocturnes
      specifically, the 'singing hand' approach associated with Chopin's own teaching — documented
      through his students like Mikuli — suggests that rubato should live in the melody while the
      left hand maintains a steadier, gondolier-like pulse. So practically: let your right hand
      breathe freely over phrases, but anchor your left-hand accompaniment to a gentle internal
      meter. That gives you the expressive freedom of the Romantic tradition without losing shape.
    expected_abstract: |-
      The key is treating rubato as something that serves the musical phrase rather than disrupting
      it. In general, rhythmic flexibility should follow the natural rise and fall of the melodic
      line — slow slightly as you build toward a climactic note, and ease forward as you release
      from it. Keep the underlying harmonic rhythm (your left-hand accompaniment) more stable than
      the melody; this creates the sensation of freedom without the performance becoming shapeless.
      A useful test: if a listener couldn't tap a general pulse through your rubato, you've likely
      gone too far. Balance is achieved when freedom feels inevitable and expressive rather than
      arbitrary.
- id: exemplar_reasoning_149
  paraphrases:
  - |-
    I'm writing a thriller and my chapters keep ending flat — readers aren't compelled to turn the page. How do I write chapter endings that create real momentum?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: named_practitioner
    specificity: direct
    split: train
    expected_exemplar: |-
      The gold standard here is really Lee Child, whose Jack Reacher novels are almost studied for
      their chapter-ending technique. Child famously ends chapters not on resolution but on a new
      micro-question — he'll give you a half-answer and immediately open a fresh gap of uncertainty.
      He's described this as a 'hook within a hook.' John le Carré uses a different but equally
      powerful method: his chapter endings often land on a quiet, unsettling detail that
      recontextualizes everything you just read — the tension is psychological rather than
      propulsive. Dennis Lehane is closer to Child in energy, but he layers in emotional stakes
      alongside plot stakes, so the question you're left with isn't just 'what happens next?' but
      'what does this mean for this person I care about?' For your thriller, the Child method is
      probably most directly applicable: identify the one question your chapter raises, answer it,
      and immediately introduce a slightly larger one in the final paragraph. Don't resolve the
      emotional register — close the plot beat but leave the character mid-feeling.
    expected_abstract: |-
      The key to a strong chapter ending is leaving an open loop in the reader's mind — a question
      they can't resist following into the next chapter. There are a few ways to do this: end on a
      revelation that reframes what came before; close on an action mid-consequence, where we know
      what happened but not what it means; or withhold a piece of information the reader can sense
      is coming. What you want to avoid is resolving both the plot beat and the emotional beat
      simultaneously — that creates a full sense of closure that makes it easy to put the book down.
      A chapter ending should feel like a comma with tension, not a period. Practically, reread your
      last paragraph and ask: what question does this leave open? If the answer is 'none,' you've
      likely resolved too much.
- id: exemplar_reasoning_150
  paraphrases:
  - |-
    I want to understand the Riemann Hypothesis better. What's the most productive mental model for thinking about why the zeros might all be on the critical line?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: train
    expected_exemplar: |-
      The way you frame the question actually echoes a real divide in how serious mathematicians
      approach RH intuitively. Hardy and Littlewood had a deeply analytic sensibility — they thought
      about the zeros in terms of the behavior of the zeta function as a meromorphic object, and
      Hardy's proof that infinitely many zeros lie *on* the critical line came from careful contour
      integration and real-analysis estimates. That's one mental model: the critical line is special
      because the functional equation creates a symmetry axis, and zeros want to 'pair up' across
      it. Then there's the Hilbert-Pólya conjecture, which Selberg took very seriously and which
      Montgomery's pair correlation work dramatically revived: maybe there's a self-adjoint operator
      whose eigenvalues are the imaginary parts of the zeros, making reality of the spectrum a
      consequence of basic operator theory — this is the mental model Dyson recognized as matching
      random matrix statistics, and it's the one physicists find most compelling. More recently,
      people in the Connes school think about it in terms of noncommutative geometry and spectral
      interpretations of the adèle class space. For a productive first grip, the
      symmetry/functional-equation picture (Hardy's tradition) is the most elementary, but the
      spectral/operator picture is arguably the deepest current intuition.
    expected_abstract: |-
      A productive mental model starts with the functional equation of the zeta function, which
      relates ζ(s) to ζ(1−s). This equation creates a reflective symmetry around the critical line
      Re(s) = 1/2, which is why that line is distinguished. The trivial zeros at negative even
      integers are fully explained by the Gamma factor in the functional equation. For the
      nontrivial zeros, one framing is that the critical line is the unique line of symmetry, and it
      would be a remarkable coincidence — or would violate some deep analytic constraint — for zeros
      to appear off it asymmetrically. Another angle is the connection to prime number distribution:
      the zeros control the error term in the prime counting function, and zeros on the critical
      line correspond to the most 'balanced' possible oscillations in that error term. The spectral
      interpretation offers yet another angle: if the imaginary parts of the zeros are eigenvalues
      of some Hermitian operator, their reality follows automatically from operator theory.
- id: exemplar_reasoning_151
  paraphrases:
  - |-
    I'm stuck on a combinatorics problem and I've been trying to find a clever bijection for weeks with no luck. Should I just give up on that approach and try generating functions instead?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: train
    expected_exemplar: |-
      This tension between bijective and algebraic approaches is one of the most interesting
      strategic forks in combinatorics. Someone like Zeilberger would probably tell you to lean hard
      into generating functions and let the machinery do the work — his whole philosophy is that the
      algebra can 'see' structure your combinatorial intuition misses, and he'd likely reach for a
      Wilf-Zeilberger proof certificate before spending another week hunting a bijection. On the
      other hand, Bjoerner or someone in the Stanley school would push back and say a bijection,
      once found, gives you far more: it reveals *why* the identity is true, not just that it is,
      and often generalizes more cleanly. Stanley himself tends to treat a bijective proof as the
      'real' explanation even when the generating function route is faster. A practical heuristic
      from this tradition: if your generating functions are already close to cracking open (e.g.,
      the GF factors nicely or has a clear combinatorial interpretation), switch now. But if the GF
      approach also looks murky, the bijection might still be the cleaner path — the difficulty
      you're experiencing might mean the bijection is genuinely deep and worth finding, not that it
      doesn't exist.
    expected_abstract: |-
      Both approaches are legitimate and the right choice depends on the structure of your problem.
      Bijections are often more satisfying because they provide direct combinatorial insight, but
      they can be notoriously hard to discover. Generating functions are more systematic: you encode
      the combinatorial quantities as coefficients of a formal power series, manipulate the series
      algebraically, and extract results. If you've spent significant time on the bijection without
      progress, switching to generating functions is reasonable — you can always revisit the
      bijective interpretation once you know the identity is true. Look at whether your recurrence
      or boundary conditions translate naturally into a functional equation for the generating
      function, which is often the entry point.
- id: exemplar_reasoning_152
  paraphrases:
  - |-
    I'm trying to decide between the Sicilian and the French as my main defense against 1.e4. I like solid positions but I also want real winning chances as Black. Which fits better and how are they philosophically different?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: train
    expected_exemplar: |-
      The Sicilian vs. French divide maps almost perfectly onto two different visions of what it
      means to fight for a win as Black. The French has been the weapon of choice for players like
      Nimzowitsch, Viktor Kortchnoi, and more recently Nikita Vitiugov — players who accept a
      structural concession (the hemmed-in light-squared bishop) in exchange for an unbreakable pawn
      chain and the promise of a queenside counterattack. The French player's winning chances come
      from grinding — the position is closed, the plans are long-term, and Black often wins by
      outlasting White's kingside ambitions. Kortchnoi was the archetype: stubborn, resourceful,
      happy to be slightly worse for 40 moves and then strike. The Sicilian, by contrast, is the
      choice of players like Fischer, Kasparov, and Najdorf himself — it's asymmetric from move one.
      Black surrenders central space for dynamic piece activity and a ready-made queenside majority.
      The winning chances are sharper and more immediate but so is the risk. Fischer called it 'best
      by test' precisely because it gives Black the most unbalanced game. If you want solidity
      *with* active winning chances and you're comfortable with long-term structural battles, the
      French suits you. If your solidity is more about concrete calculation than passive endurance,
      the Sicilian's controlled chaos may actually feel more natural.
    expected_abstract: |-
      The French and Sicilian represent two different approaches to playing for a win as Black. The
      French is characterized by a solid, closed pawn structure where Black accepts a slightly
      passive bishop on c8 in exchange for a robust central chain and queenside counterplay —
      winning chances tend to come from long strategic battles and endgames. The Sicilian is
      asymmetric from the start: Black gives up central control for active piece play and a
      queenside pawn majority, creating immediate dynamic imbalances. Winning chances arrive earlier
      and more sharply, but so does the risk. If you prefer patient, structural battles with low
      risk of sudden collapse, the French fits better. If you're comfortable with tactical
      complexity and want to fight for the initiative earlier, the Sicilian is the stronger choice
      for generating winning chances.
- id: exemplar_reasoning_153
  paraphrases:
  - |-
    I'm arranging a jazz standard for a small ensemble and I'm struggling with how much to reharmonize. I want it to feel fresh but not like I'm showing off. How do I find that balance?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is exactly the tension that separates two major philosophies of jazz arranging, and you
      can hear it clearly if you compare how Bill Evans approached standards versus how Thelonious
      Monk did. Evans was a master of what you might call 'enveloping' reharmonization — he would
      substitute and extend chords in ways that felt deeply inevitable, almost as if the original
      composer had written them that way but just didn't know it yet. His voicings are so luminous
      and logical that listeners often don't realize how far he's traveled from the original
      changes. The reharmonization serves the emotional arc; it never announces itself. Monk, on the
      other hand, had no interest in seamlessness — his alterations were deliberately angular,
      almost confrontational. When he played 'Body and Soul' or 'Sweet and Lovely,' he'd leave gaps
      and use dissonances that felt like a commentary on the original rather than a transformation
      of it. So the question is: do you want the reharmonization to be heard as enrichment or as
      statement? If you want the 'fresh but not showing off' quality you're after, Evans is your
      model — stay close to the original's cadential skeleton, use chord substitutions that preserve
      or deepen the melody-harmony relationship (particularly tritone subs and chord scales that add
      color to static bars), and resist the urge to reharmonize every bar. Let the original breathe
      at cadences. If your ensemble has a strong improvisational voice, you might also look at how
      Gil Evans (no relation) handled this in his Miles Davis collaborations — he often left large
      structural sections intact but transformed them through orchestration and texture rather than
      harmony.
    expected_abstract: |-
      The key is to distinguish between structural reharmonization and decorative reharmonization.
      Structural changes — altering the cadences, the turnarounds, or the tonal center of a section
      — are high-stakes and will be noticed. Decorative changes — adding color tones, substituting
      chords within a phrase while preserving the cadence, using passing chords — are much easier to
      absorb without feeling intrusive. A good rule of thumb is to protect the moments where the
      melody most strongly implies its harmony (especially at phrase endings) and give yourself
      freedom in the spaces between. Also consider the role of texture: sometimes what sounds like
      reharmonization is really an orchestration choice — placing a chord in a different register or
      voicing can make familiar changes feel completely fresh without changing a single note. If
      you're unsure whether you've gone too far, play the original changes on top of your
      arrangement and see whether your version still feels like it's in conversation with the tune
      or has left it behind.
- id: exemplar_reasoning_154
  paraphrases:
  - |-
    I'm a pretty positional player and I hate complications, but sometimes I feel like I'm just drifting without a real plan. My positions are solid but nothing ever happens. How do I create winning chances without getting into messy tactics?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: train
    expected_exemplar: |-
      What you're describing is actually a well-known challenge for positional players — the gap
      between 'solid' and 'winning.' Interestingly, the two greatest positional players in history
      solved this differently, and understanding both approaches can help you. Karpov's answer was
      the concept of 'small advantages': he never looked for one grand plan but accumulated tiny
      edges — a slightly better knight vs. bishop, a marginally superior pawn structure, a
      fractionally more active king. None of these alone wins, but Karpov stacked them until the
      position collapsed under its own weight. His games feel like slow suffocation. The opponent
      always seems fine until suddenly they're not. Petrosian's answer was different — he was a
      master of the 'prophylactic' move, playing to prevent the opponent's counterplay before it
      existed. This kept positions static and under his control. If you're drifting, you're probably
      not identifying what your opponent wants to do next. Ask yourself every move: what is my
      opponent's best plan? Then stop it. Once you've denied counterplay, the position improves on
      its own. The Karpov-style question to ask is: 'Which of my pieces is slightly worse than its
      counterpart, and how do I fix that?' Chain enough of those improvements together and you'll
      find the squeeze converts without needing any tactics at all.
    expected_abstract: |-
      Solid positional play without a plan often leads to exactly this drifting feeling. The key is
      to shift from passive consolidation to active improvement. Start by identifying small
      imbalances in the position — a slightly better pawn structure, a bishop vs. knight imbalance,
      open vs. closed files — and ask which side of each imbalance you're on. Then build a plan
      around improving your worst-placed piece or restricting your opponent's best piece. Every move
      should answer: what is my long-term goal, and does this move help achieve it? Another useful
      technique is prophylaxis: rather than waiting to make your own plan, first identify your
      opponent's best plan and prevent it. This removes their counterplay and makes your own
      positional improvements easier to execute. Over time, stacking these small advantages —
      slightly better piece placement, slightly superior pawn structure, slightly more active king —
      creates winning chances without requiring tactical complications.
- id: exemplar_reasoning_155
  paraphrases:
  - |-
    I'm writing a war memoir-style novel in first person and I can't figure out the right narrative voice. It needs to feel authentic and hardened but not melodramatic. Any suggestions for the tone?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: stylistic_attribution
    specificity: direct
    split: train
    expected_exemplar: |-
      The voice you're describing sits in a very specific tradition — understated, present-tense
      trauma without sentimentality. Think about how Tim O'Brien handles it in 'The Things They
      Carried': he circles events obsessively, admits the narrator's unreliability, and treats the
      act of storytelling itself as part of the war. The 'hardened but not melodramatic' tone you
      want is almost his signature move — emotional weight carried by inventory and repetition
      rather than by adjectives. Sebastian Junger in 'War' goes even flatter and more journalistic,
      almost clinical, which creates its own unbearable weight. A third option is the Karl Ove
      Knausgård approach — relentless granular specificity about physical and sensory detail, so
      that meaning accumulates through accumulation rather than declaration. For your memoir-novel
      hybrid, I'd probably try O'Brien's recursive structure (returning to the same scene with more
      information each time) combined with Junger's refusal to editorialize directly. The voice
      should feel like someone who has decided — consciously or not — to report rather than
      interpret.
    expected_abstract: |-
      For a war memoir voice that feels authentic without melodrama, the key is restraint in
      emotional declaration paired with precision in physical detail. Let the events carry the
      weight rather than the narrator's commentary on them. Use short, declarative sentences during
      moments of action or stress, and reserve longer, more reflective sentences for the quiet
      passages — that contrast itself creates tension. Avoid adverbs and adjectives that tell the
      reader how to feel; instead, ground every emotional moment in a concrete sensory anchor — what
      was smelled, heard, or touched. First-person past tense with occasional present-tense
      intrusions can create a sense that the narrator is still processing rather than having neatly
      resolved the experience. Keep the narrator's self-analysis sparse and often inconclusive,
      which tends to read as authentic rather than performed.
- id: exemplar_reasoning_156
  paraphrases:
  - |-
    I've been asked to write a short speech for my friend's retirement party. He's a no-nonsense engineer type and would hate anything sentimental or flowery. How should I approach the tone?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: train
    expected_exemplar: |-
      For this, you want to think in the register of what you might call a Chekhov-or-Carver mode —
      writing that earns its emotion by studiously refusing to reach for it. Raymond Carver built a
      whole aesthetic around this: the feeling comes through sideways, through what's concrete and
      specific and unsaid, never through adjectives that tell the audience how to feel. For a
      retirement speech, that means grounding everything in specific, observable, almost technical
      details about your friend — a particular problem he solved, a characteristic gesture or phrase
      he uses, the exact way he explained something complicated. David Mamet, in his writing advice,
      calls this 'the problem of the two-by-four': you don't say 'he was reliable,' you describe the
      specific instance where reliability mattered. The humor, too, should be dry and earned —
      closer to Chekhov's gentle irony than broad sentiment. End on something concrete rather than
      an abstraction like 'we're proud of you.' A single well-chosen specific detail — the kind of
      thing only people who really know him would recognize — will land harder than any heartfelt
      declaration, and an engineer will appreciate that you showed your work rather than just
      asserting conclusions.
    expected_abstract: |-
      For an audience member who dislikes sentimentality, the most important thing is to let the
      emotion emerge from specifics rather than stating it directly. Avoid adjectives that tell
      people how to feel ('wonderful,' 'amazing,' 'irreplaceable') and instead use concrete,
      observable details — specific things he did, said, or built. Humor works well in this register
      if it's dry and grounded in real, recognizable behavior rather than broad generalizations.
      Structure-wise, a short speech that makes one or two sharp, specific points will land better
      than a comprehensive tribute. The less you strain for emotional effect, the more the actual
      feeling will come through. Close on something concrete and personal rather than a generic
      platitude — a single telling detail that captures who he is will be more memorable than any
      emotional declaration.
- id: exemplar_reasoning_157
  paraphrases:
  - |-
    I'm designing a public library that needs to feel both monumental and welcoming at the same time. Every time I lean into grandeur, it feels cold and intimidating. Every time I make it approachable, it loses its civic weight. How do I hold both?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This tension is one of the defining problems in civic architecture, and different masters
      resolve it in opposite directions — which is instructive. Louis Kahn leans hard into
      monumentality: his Phillips Exeter Academy Library is a massive brick cube on the outside,
      almost fortress-like, but the interior is organized around a dramatic central void with
      circular openings that frame the books and draw you inward. The grandeur is real, but it's
      earned by how the interior unfolds — you feel small in relation to the institution, but not
      unwelcome, because the scale is purposeful and the light is warm. Alvar Aalto takes the
      opposite route: his Viipuri Library (and later Rovaniemi) use a deceptively modest exterior
      with asymmetric, almost domestic massing, but the interior is animated by those famous conical
      skylights that pour diffuse northern light over the reading rooms. The civic weight comes from
      the quality of the experience, not the impression of the facade. If your instinct is Kahnian —
      you want presence — consider whether your monumental moves are happening at the right scale.
      Kahn's trick is that the grandeur operates at the building level, while warmth operates at the
      human level: niches, alcoves, the texture of materials. If you're more drawn to Aalto's path,
      the civic weight can come from sequence and light rather than mass. The mistake most people
      make is trying to split the difference everywhere, which gives you neither. Pick a primary
      register and solve the other problem at a different scale.
    expected_abstract: |-
      The tension between monumentality and approachability is real, but they don't have to operate
      at the same scale — that's the key insight. Monumental qualities tend to work at the level of
      the whole building: its presence on the street, its silhouette, the weight of its materials.
      Approachability works at the human scale: the height of the entry threshold, the warmth of
      interior lighting, the texture of surfaces you touch. A common mistake is trying to negotiate
      both qualities in every single decision, which ends up diluting both. Instead, let the
      building be bold and civic at the macro scale — a strong geometric gesture, a prominent
      siting, durable materials that signal permanence — and then be generous and human at the micro
      scale. Break down the interior into zones that feel proportionate to a person: reading
      alcoves, varied ceiling heights, natural light that changes through the day. The transition
      from outside to inside is where most of the work happens: a well-designed entry sequence can
      take you from the civic scale of the exterior into the intimate scale of reading without a
      jarring jump. Pay attention to the threshold — it's doing a lot of emotional labor.
- id: exemplar_reasoning_158
  paraphrases:
  - |-
    I want to make a simple roast chicken that really highlights the bird itself without a lot of fussy sauces or garnishes. What's the best approach?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: school_tradition
    specificity: direct
    split: train
    expected_exemplar: |-
      This is exactly the territory where the French classical tradition — particularly the approach
      associated with Escoffier and the grandes brigades — versus the more modern simplicity of
      nouvelle cuisine offer interestingly different answers. But for your goal of letting the bird
      speak for itself, the cleaner model is the Robuchon school: obsessive sourcing of the bird
      (Label Rouge or similar heritage breed), room-temperature resting before cooking, high-heat
      roasting on the backbone for self-basting, and almost nothing else — maybe butter, thyme, and
      salt. Zuni Café's Judy Rodgers, whose roast chicken became almost totemic in American cooking,
      added a crucial twist from the charcuterie tradition: salting the bird 1–3 days ahead and
      letting it air-dry uncovered in the fridge. This acts like a dry brine and desiccates the skin
      so it shatters when roasted. The French farmhouse tradition (poulet rôti) similarly emphasizes
      resting the bird breast-down for the final minutes so the juices redistribute. The throughline
      across all these approaches: quality of ingredient, dryness of skin, high heat, and restraint.
      No sauce needed if the bird is right.
    expected_abstract: |-
      For a roast chicken that highlights the bird itself, start with a good-quality chicken and dry
      the skin thoroughly — pat it with paper towels and let it sit uncovered in the refrigerator
      for at least a few hours or overnight. Salt it generously, inside and out, well ahead of
      cooking. Roast at high heat (around 425–450°F) on a preheated pan or in a cast-iron skillet so
      the underside gets direct heat. Truss loosely or not at all to allow the thighs to cook
      evenly. Baste occasionally with the pan drippings. Rest the bird for at least 10 minutes
      before carving so the juices redistribute. The key variables are dry skin for crispness,
      generous seasoning, and avoiding overcooking the breast — many cooks pull the bird when the
      thigh registers 160°F since carryover heat finishes it.
- id: exemplar_reasoning_159
  paraphrases:
  - |-
    I'm building a theory to explain why some cities become innovation hubs and others don't. Should I start by generating a bold, unifying hypothesis, or by carefully cataloguing empirical patterns first?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: train
    expected_exemplar: |-
      You're essentially choosing between two great traditions in how science should be done — the
      hypothetico-deductive approach associated with Karl Popper and the inductivist, pattern-first
      approach more in the spirit of Francis Bacon and, in the social sciences, the grounded theory
      school of Glaser and Strauss. Popper would tell you to start with a bold conjecture — 'cities
      become innovation hubs when transaction costs for knowledge spillovers fall below a threshold'
      — and then design your research to try to falsify it. For Popper, science advances not by
      accumulating observations but by proposing risky, falsifiable claims and subjecting them to
      the most severe tests you can devise. The virtue of starting with a hypothesis is that it
      disciplines your data collection; you know what would count as evidence against your theory.
      The opposing tradition, epitomized in social science by the grounded theory work of Glaser and
      Strauss in the 1960s, would say you should suspend theoretical commitments and let patterns
      emerge from careful empirical immersion — interview city planners, map firm networks, catalog
      industrial clusters — before imposing a framework. Jane Jacobs, whose work on cities is
      perhaps the most influential in this space, was deeply in this empirical-inductive tradition:
      'The Death and Life of Great American Cities' is built from relentless observation before it
      theorizes. My suggestion would be a Lakatosian middle path — a 'research programme' in
      Lakatos's sense, where you start with a loose 'hard core' hypothesis (something like the
      knowledge spillover story) but treat it as provisional scaffolding while you build the
      empirical base, being prepared to modify the protective belt of auxiliary hypotheses as
      patterns emerge.
    expected_abstract: |-
      This is one of the core methodological debates in social science: whether to proceed
      deductively (theory-first) or inductively (data-first). Starting with a bold, unifying
      hypothesis has the advantage of focus — your data collection is disciplined by what the
      hypothesis predicts, and you avoid drowning in unstructured observations. The risk is
      premature closure: you may miss important patterns that don't fit your initial frame, or
      unconsciously seek confirming evidence. Starting by cataloguing empirical patterns has the
      advantage of staying close to the phenomenon and surfacing unexpected regularities. The risk
      is that pattern-cataloguing without theoretical guidance can become endless and unfocused —
      you need some prior sense of what counts as a relevant pattern. In practice, most good
      theory-building in the social sciences cycles between the two: use existing literature to form
      a loose initial hypothesis, gather empirical cases to stress-test and refine it, revise the
      hypothesis, and repeat. For a question as complex as city innovation, where the variables are
      numerous and causation is hard to establish, starting with comparative case studies across a
      few cities with different outcomes and letting your hypothesis sharpen through that process is
      usually more productive than either extreme.
- id: exemplar_reasoning_160
  paraphrases:
  - |-
    I'm trying to develop my own signature sauce for my restaurant — something that could become a signature element like a house sauce or condiment. How do professional chefs approach creating something genuinely original?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: named_practitioner
    specificity: direct
    split: train
    expected_exemplar: |-
      The approaches divide pretty sharply between what you might call the analytical method and the
      intuitive method, and two chefs illustrate this contrast well. Ferran Adrià at elBulli
      famously ran what amounted to an R&D laboratory — he catalogued every known emulsification
      technique, every known flavor combination, and then systematically asked 'what hasn't been
      done' by working against the catalogue. His signatures (olive oil caviar, spherified liquids)
      came from applying unfamiliar techniques to familiar ingredients, or familiar techniques to
      unfamiliar materials. If you want to be Adrià about this, build a matrix: take a flavor you
      own (something local, seasonal, personal) and apply an unexpected preparation method to it.
      The opposite pole is Fergus Henderson, who created nose-to-tail cooking not through analysis
      but through radical honesty — he asked 'what do I actually want to eat and believe in?' and
      made that uncompromisingly. His bone marrow toast became iconic not because it was technically
      innovative but because it was cooked with absolute conviction. His advice would be: stop
      inventing and start remembering — what do you crave? What did you grow up eating? A third
      model worth studying is René Redzepi's process at Noma, which is place-based: the sauce has to
      come from somewhere, literally and philosophically. He'd push you to find an ingredient
      hyperlocal to your context that nobody else can replicate, and build the sauce around that
      irreproducible thing.
    expected_abstract: |-
      Creating a signature sauce usually involves starting with a clear flavor identity — what
      cuisine or memory or season does it connect to — and then working backward to a core technique
      that makes it distinctive. Consider what combination of fat, acid, heat, and aromatics defines
      your cooking style, and look for a preparation (long reduction, emulsification, fermentation,
      infused oil) that isn't commonly applied to your chosen ingredient base. Test it against
      multiple applications — as a dip, a glaze, a dressing — to see if it has versatility. The goal
      is a sauce that tastes unmistakably like your food, not like a category. Keep early versions
      simple and add complexity only when you understand the base well.
- id: exemplar_reasoning_161
  paraphrases:
  - |-
    I'm making a tomato sauce and it tastes sharp and acidic even after cooking for a long time. What am I doing wrong and how do I fix it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: school_tradition
    specificity: implicit
    split: train
    expected_exemplar: |-
      This is a classic tension that Italian regional traditions handle very differently, and
      understanding those distinctions points you straight to a fix. The Southern Italian approach —
      think Neapolitan cooking — leans into tomato acidity as a feature, balancing it with fat
      (olive oil, sometimes lard) and salt rather than cooking it away. You'd finish with a generous
      pour of oil and let the brightness stay. The Northern approach, and especially
      French-influenced Italian cooking, would call for a softer, sweeter tomato base: a longer
      soffritto of onion and carrot, which adds natural sweetness, or even a pinch of sugar, which
      is somewhat taboo in Naples but common in home kitchens in Emilia-Romagna. Marcella Hazan's
      canonical butter-and-onion sauce is essentially an expression of this philosophy — minimal
      acidity, richness doing all the work. So the question is: which tradition's answer fits your
      goal? If you want brightness, add fat and salt. If you want mellow sweetness, cook a proper
      soffritto with carrot, or finish with a small knob of butter. The acidity isn't a mistake —
      it's a choice about which school you're cooking from.
    expected_abstract: |-
      Tomato acidity comes from organic acids that don't fully break down even with long cooking. A
      few fixes: First, add a pinch of sugar to balance the sharpness — start with half a teaspoon
      and taste. Second, add fat like butter or olive oil, which coats the palate and softens the
      perception of acidity. Third, make sure your soffritto includes a small piece of carrot, which
      contributes natural sweetness. Fourth, if you're using canned tomatoes, try a different brand
      or variety — San Marzano tomatoes are naturally lower in acidity. Finally, a tiny pinch of
      baking soda will chemically neutralize the acid, but use it sparingly or it will make the
      sauce taste flat and soapy.
