  meta:
    domain: architecture_design
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: train
    expected_exemplar: |-
      What you're describing is almost exactly the problem Alvar Aalto spent his career solving — he
      was deeply skeptical of monumental civic architecture and consistently designed public
      buildings that feel domestic in scale even when they're quite large. His libraries (Viipuri,
      Seinäjoki, Rovaniemi) all use a fragmented massing strategy: instead of one bold form, the
      building breaks into several smaller volumes that read as a cluster of related things, like a
      neighborhood rather than an institution. The entrance is never announced with columns or grand
      stairs — it's set back slightly, sheltered, approached at grade. You walk in, not up. Louis
      Kahn would pull you in a completely different direction — his libraries are absolutely
      monumental in form but humanized through the sectional experience inside, the
      servant-and-served logic, the way light comes in from above and makes rooms feel like found
      sanctuaries. That's a civic presence that earns its weight. But for a small town where you
      don't want anyone to feel like the building is judging them, Aalto's horizontal, incremental
      approach is probably your better model. You might also look at the contemporary Scandinavian
      tradition — Snøhetta's public libraries (like the Deichman in Oslo) use transparent ground
      floors so the activity inside the building IS the facade. The entrance problem dissolves
      because there's no threshold to cross psychologically — you can already see yourself in there
      before you walk in.
    expected_abstract: |-
      For a welcoming civic library, the massing and entrance design should prioritize human scale
      and approachability over symbolic grandeur. Avoid a single dominant form that reads as a
      monument; instead, break the massing into differentiated volumes that suggest distinct zones —
      children's area, reading rooms, community hall — which makes the building feel like a
      collection of places rather than a singular institution. Keep the entrance at grade level with
      no steps if possible, and shelter it with a generous overhang that signals arrival without
      imposing formality. Transparency at the ground floor — large windows or glazed walls — lets
      passersby see activity inside, which functions as the most effective invitation. A transition
      zone, like a covered porch or landscaped forecourt, gives people a moment to adjust between
      the street and the interior without committing to entry, which psychologically lowers the
      barrier. Use warm, locally resonant materials to anchor the building in its context rather
      than signaling institutional otherness.
- id: exemplar_reasoning_122
  paraphrases:
  - |-
    I'm rehearsing a Beethoven piano sonata and I can't figure out how much rubato is appropriate — I've heard people say you should stick strictly to the pulse, but others say the music needs more freedom. What's the right approach?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: school_tradition
    specificity: implicit
    split: train
    expected_exemplar: |-
      This tension is one of the defining fault lines in Beethoven interpretation, and it maps
      almost perfectly onto the contrast between the German-Austrian school and the more Romantic
      tradition. The Vienna school — think Artur Schnabel, and later Alfred Brendel — treated
      Beethoven's markings as near-sacred structural architecture. Rubato in this tradition is
      extremely local and microrhythmic: you might lean into a harmony or let a phrase crest, but
      the underlying pulse never really bends. Schnabel used to say you 'obey the law while feeling
      free' — the rubato lives within the beat, not across it. Contrast that with the Romantic
      tradition running through Liszt's pupils and into someone like Wilhelm Kempff, who allows
      broader tempo shaping across whole phrases, treating the pulse more as a living breath than a
      metronomic grid. For a Beethoven sonata specifically, the Schnabel-Brendel model is probably
      the safest guide: structural fidelity first, but with deep attention to dynamic shaping and
      articulation as the primary expressive tools. The rubato, when it comes, should feel
      inevitable rather than imposed — earned by the harmonic tension rather than added as ornament.
    expected_abstract: |-
      The right balance depends a lot on which sonata and which movement you're working on. In
      general, Beethoven's music has a strong architectural quality — his phrase lengths and
      harmonic rhythms are carefully constructed, so extreme rubato can undermine the structural
      logic. A good default is to treat the pulse as foundational but allow subtle flexibility at
      cadence points, phrase peaks, and moments of harmonic surprise. The key distinction is between
      macro-level tempo modification (slowing down whole sections) and micro-level inflection
      (slight lingering on a dissonance). The latter is generally safer with Beethoven. Follow his
      dynamic markings closely — they often carry the expressive weight that you might be tempted to
      put into tempo. Practice both ways, strictly in time and with freedom, and notice which feels
      like it's clarifying the structure versus obscuring it.
- id: exemplar_reasoning_123
  paraphrases:
  - |-
    I need to write a recursive algorithm and I'm torn between making it elegant and concise versus making it easy for junior developers to understand and debug. How should I think about this trade-off?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is essentially the Dijkstra vs. Kernighan tension in software aesthetics — and it's one
      worth naming explicitly. Dijkstra held that programs should be mathematical objects: proofs,
      not instructions. His recursive solutions in 'A Discipline of Programming' are models of
      terseness — a mergesort expressed in a handful of lines where correctness is self-evident *to
      a trained reader*. The elegance is the point; it reduces the surface area for bugs by making
      the structure of the algorithm inseparable from its expression. John Backus's famous Turing
      Award lecture pushed this further, arguing that functional, recursive decomposition is how you
      *think clearly* about programs. Kernighan's counter-tradition — exemplified in 'The Practice
      of Programming' and 'The C Programming Language' — is that code is communication first. He
      would flatten that recursive beauty into something a junior developer can single-step in a
      debugger: explicit stacks, named intermediate variables, comments at the decision points. The
      'worse is better' philosophy that Richard Gabriel identified in Unix culture aligns here: a
      slightly less elegant solution that everyone on your team can maintain is strictly better than
      a beautiful one that only you can debug at 2am. My honest read: if the recursion maps directly
      onto the mathematical structure of the problem (tree traversal, divide-and-conquer), keep it
      recursive — the algorithm IS the structure, and flattening it hides truth. Add a comment
      linking it to the recurrence relation. If it's iterative logic dressed up as recursion for
      style points, Kernighan wins: unroll it.
    expected_abstract: |-
      This is a genuine tension between code expressiveness and operational accessibility, and the
      right answer depends on context. Recursive solutions shine when the problem has natural
      recursive structure — trees, divide-and-conquer algorithms, grammars. In these cases, the
      recursive form closely mirrors the problem definition, which makes it *easier* to verify
      correctness at the algorithmic level, even if individual steps are harder to trace in a
      debugger. A well-named recursive function with a clear base case and a single recursive call
      can be highly readable. The readability cost comes when the call stack is the only way to
      understand state, when tail calls are missed and stack overflows are possible, or when junior
      developers aren't yet comfortable reasoning about recursive execution. In those cases, an
      explicit iterative version with a manual stack — or even a simple loop — may be easier to
      instrument, profile, and debug. A practical middle ground: write the elegant recursive version
      first, add a brief comment explaining the recurrence relation and the base case, and provide a
      unit test for each meaningful case including edge cases. If profiling or onboarding reveals
      it's a bottleneck (cognitive or computational), refactor to iterative with the recursive
      version preserved as a comment or test fixture. The goal is that a reader can understand both
      *what* the algorithm does and *why* it's correct.
- id: exemplar_reasoning_124
  paraphrases:
  - |-
    I'm teaching an undergraduate real analysis course and my students keep constructing proofs that are technically correct but feel unmotivated — like they pulled the key step out of nowhere. How do I teach them to write proofs that feel inevitable?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: named_practitioner
    specificity: direct
    split: train
    expected_exemplar: |-
      This is a pedagogical problem that several great mathematical expositors have thought deeply
      about, and their different solutions reveal what 'motivated proof' really means. Terence Tao,
      in his blog and textbooks, consistently practices what you might call 'working backwards in
      public' — he writes proofs that show the scratchwork of discovery, explicitly saying 'we would
      like X, so we need Y, which we can get if...' before presenting the clean argument. This is
      almost the opposite of the Bourbaki tradition, which deliberately stripped all motivation in
      favor of logical compression. Bourbaki produced magnificent architecture but notoriously bad
      pedagogy — students could follow every line and understand nothing. Paul Halmos took a middle
      path: his *How to Write Mathematics* argues that every unmotivated step is a failure of
      exposition, and that the writer's job is to make the reader think they could have invented the
      proof. His *Naive Set Theory* and *Measure Theory* are models of this. A concrete classroom
      technique from this tradition: ask students to write a 'discovery draft' before the final
      proof — a paragraph in prose explaining why the key construction has to be what it is. This
      forces them to articulate the motivation. Euler's original papers are also worth assigning as
      examples: he wrote proofs the way he discovered them, with false starts and corrections, and
      students are often surprised to see that even Euler needed to be wrong first.
    expected_abstract: |-
      The feeling of inevitability in a proof comes from making the motivation for each key step
      explicit before executing it. Several techniques help students develop this. First, teach
      backward chaining: before writing the proof, students should ask 'what would be sufficient to
      prove the conclusion?' and work backward until they reach something they know. This makes the
      key construction feel earned. Second, distinguish between the logic of proof and the logic of
      discovery — in class, show both: here is how I might have thought of this, and here is the
      clean version. Third, require students to annotate their proofs: after every non-routine step,
      a one-sentence comment explaining why that move was made. Fourth, have students present proofs
      to each other, because the need to explain forces motivation into the open. Fifth, practice
      proof analysis: take a correct but unmotivated proof and reconstruct the reasoning that might
      have produced it. Finally, when grading, treat unmotivated key steps as an incompleteness even
      if the logic is valid — this signals that exposition is part of the mathematical task.
- id: exemplar_reasoning_125
  paraphrases:
  - |-
    I'm designing a community library with a limited budget. Should I prioritize making it feel monumental and civic, or warm and intimate? I can't really do both — which direction would you go?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is essentially the Kahn vs. Aalto tension made concrete. Louis Kahn would argue
      unequivocally for the monumental — his Phillips Exeter Library is proof that a library should
      make you feel the weight of human knowledge, that civic dignity is itself a gift to a
      community, especially one that can't afford grandeur elsewhere. He achieved it not with
      expensive materials but with geometry: the massive central void, the way light enters as
      revelation. The monumentality IS the warmth, for Kahn. Alvar Aalto would push back hard. His
      Viipuri Library (and later Rovaniemi) used undulating ceilings, carefully tuned natural light,
      and almost domestic scale to make libraries feel like places you belonged in rather than
      performed in. Aalto thought institutions should bend toward human biology and behavior, not
      the other way around. On a tight budget, Aalto's approach might actually be more achievable —
      warmth comes from material honesty and sectional thinking, not from square footage or stone.
      The Kahn path requires you to commit fully to one powerful structural gesture and let
      everything else be simple. The Aalto path asks you to study how people actually move through
      and inhabit the space. Given your budget constraint, I'd lean Aalto: warmth and intimacy are
      more achievable with careful detailing and section than monumentality is with cheap materials
      — a failed attempt at grandeur reads as merely shabby, whereas a well-executed intimate
      library feels intentional and generous.
    expected_abstract: |-
      The choice depends on the community's relationship to the institution and the site context. A
      monumental approach communicates civic importance and can elevate a community's sense of
      shared identity — it signals that knowledge and public space are worth taking seriously. An
      intimate approach reduces psychological barriers to entry, makes the space feel usable rather
      than ceremonial, and often serves repeat visitors better over time. On a tight budget,
      intimacy is usually the safer bet. Monumentality achieved cheaply tends to look unfinished or
      pretentious, while warmth can be created through careful proportioning, natural light, tactile
      materials, and thoughtful arrangement of furniture and stacks. A modest but well-scaled room
      with good acoustics and a reading nook near a window will be used more than a soaring atrium
      with bad lighting. Unless the civic-symbol function is the primary brief, I'd prioritize
      making people feel comfortable returning.
- id: exemplar_reasoning_126
  paraphrases:
  - |-
    I'm writing an essay and I keep getting told my arguments are 'too listy' — I make a point, then list three sub-points, then move on. How do I make the logic flow more organically without losing rigor?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: train
    expected_exemplar: |-
      You've identified the classic tension between the analytical essay tradition and what you
      might call the essayistic or discursive tradition — and different great writers solve it in
      instructive ways. The 'listy' mode you're describing is essentially the Orwell of 'Politics
      and the English Language' — he explicitly enumerates, gives you rules 1 through 6, and it
      works because his subject is itself a taxonomy. But the essayists you probably admire more are
      doing something different: they're developing an idea through digression and return.
      Montaigne's method is to begin somewhere and let the argument accrete through seemingly
      tangential moves that turn out to be structurally essential. James Baldwin does this in 'The
      Fire Next Time' — the essay spirals, and the structural rigor is hidden inside what feels like
      one mind following its own logic. The practical technique is to replace your sub-point lists
      with subordinate clauses and qualifying sentences: instead of 'There are three reasons X is
      true: first... second... third...' you write a paragraph where the second sentence already
      contains the first complication of the first sentence. Each sentence should react to the
      previous one. Think of it as a chain rather than a tree — one thing leads to the next rather
      than everything branching from a trunk.
    expected_abstract: |-
      The 'listy' problem usually comes from organizing arguments spatially (as branches off a main
      point) rather than temporally (as one idea developing into the next). The fix is to think of
      each paragraph as a unit of movement rather than a container of sub-points. Each sentence
      should generate the next one — the second sentence complicates or extends the first, the third
      responds to that complication, and so on. Instead of enumerating your reasons, embed them as
      qualifications and extensions within a single line of reasoning. Transition language helps:
      instead of 'first, second, third,' use 'but this raises the question of...,' 'and yet...,'
      'which is to say...' These phrases make explicit that your argument is moving and developing
      rather than sorting and filing. It takes more drafting because you have to discover the
      logical sequence rather than imposing a framework, but the result reads as genuinely
      discursive rather than schematic.
- id: exemplar_reasoning_127
  paraphrases:
