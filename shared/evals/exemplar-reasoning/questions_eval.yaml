    exemplar_dimension: stylistic_attribution
    specificity: direct
    split: train
    expected_exemplar: |-
      The Immortal Game has the unmistakable fingerprint of the Romantic school — specifically what
      Anderssen and his contemporaries like Morphy and Deschapelles codified as the aesthetic ideal
      of chess: rapid development sacrificed for king-hunting, combinational fireworks prioritized
      over material, and a deep faith that open lines and piece activity were worth any material
      cost. The sacrifices in the game (bishop, both rooks, the queen) reflect a worldview Morphy
      also held — that there is a kind of moral rightness to attack, that the King must be hunted.
      Modern players like Kasparov deeply admired this tradition and occasionally played in its
      spirit, but his generation was shaped by Steinitz's revolution: the idea that pawn structure,
      piece coordination, and accumulated positional advantages matter more than brilliancy. A
      Carlsen or Anand would spot the defensive resources Kieseritzky missed precisely because
      they've been trained on that Steinitzian inheritance. The same moves could technically appear
      today, but only if Black cooperated with the same Romantic-era tactical negligence — a strong
      modern player would never allow the position to develop as it did, because they've been taught
      to respect the defender's resources in ways Kieseritzky simply wasn't.
    expected_abstract: |-
      The Immortal Game reflects 19th-century chess thinking in that it prioritizes open lines,
      rapid piece development, and direct attacks on the king over material considerations. At the
      time, sacrificing material for activity and initiative was considered not just acceptable but
      aesthetically desirable. Modern chess theory has shown that many of the defensive resources
      available to Kieseritzky were simply not recognized or properly valued in 1851. Today, strong
      players would avoid the passive defensive moves Black played and would instead seek
      counterplay or find concrete refutations of the sacrifices. The same sequence of moves is
      unlikely in modern high-level play because contemporary defensive technique and opening
      preparation make the kind of cooperative collapse Black suffered essentially impossible at the
      top level.
- id: exemplar_reasoning_119
  paraphrases:
  - |-
    I'm trying to design an experiment to test whether a new drug reduces inflammation, but I'm worried about confounding variables. How should I think about controlling for them?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: train
    expected_exemplar: |-
      This is exactly the kind of problem that Ronald Fisher spent his career systematizing — his
      core insight was that randomization is the fundamental weapon against confounding, not just
      clever matching. Fisher would say: don't try to enumerate every possible confounder and
      control for it manually (you'll always miss something), instead randomly assign subjects to
      treatment and control groups so that unknown confounders distribute themselves evenly by
      chance. Beyond that, his framework from 'The Design of Experiments' pushes you toward
      factorial designs — rather than varying one factor at a time, vary several simultaneously so
      you can detect interaction effects. This is quite different from the approach Ignaz Semmelweis
      famously took: brilliant observational reasoning, controlling by intuition, but no
      randomization — which is why his results, even though correct, couldn't compel the scientific
      community. For your inflammation trial specifically, a Fisherian approach means: randomize
      assignment, pre-register your outcome measure, consider blocking by known high-variance
      factors like age or baseline inflammation level, and power the study before you run it. The
      goal is that any variable you didn't think of gets balanced out structurally, not by your
      cleverness.
    expected_abstract: |-
      Controlling for confounding variables in a drug trial requires a combination of design
      choices. First, randomly assign participants to treatment and control groups — randomization
      ensures that both known and unknown confounders distribute evenly across groups by chance.
      Second, consider blocking or stratifying on variables you know are likely to affect the
      outcome (like age or baseline inflammation) to reduce within-group variance. Third, use
      blinding — ideally double-blind — so that neither participants nor assessors know who received
      the drug, preventing expectation effects. Fourth, pre-register your primary outcome measure
      before data collection to avoid outcome-switching. Finally, power your study adequately so
      that a null result is informative rather than merely inconclusive. The key principle is that
      randomization handles the confounders you haven't thought of, while blocking handles the ones
      you have.
- id: exemplar_reasoning_120
  paraphrases:
  - |-
    My recursive algorithm is elegant but blows the stack on large inputs. What's the cleanest way to convert it to an iterative version?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: train
    expected_exemplar: |-
      This is a transformation that Donald Knuth essentially wrote the book on — Volume 1 of The Art
      of Computer Programming has deep treatment of how recursion and stack-based iteration are
      formally equivalent, and understanding that equivalence is the key to doing the conversion
      cleanly rather than just hackily. Knuth's framing: every recursive call is secretly pushing a
      frame onto *some* stack. The question is whether that stack is the hardware call stack or an
      explicit one you manage yourself. So the most mechanical — and most faithful — conversion is
      to simulate the call stack explicitly: push the initial arguments, then loop, popping a frame
      each iteration and pushing new frames where you'd have made recursive calls. This preserves
      the structure of your algorithm exactly. But Knuth (and later, the functional programming
      tradition coming through people like Guy Steele, who wrote the famous 'Lambda: The Ultimate'
      papers on continuation-passing) would push you further: if your recursion is *tail-recursive*
      — the recursive call is the very last thing the function does — you don't even need an
      explicit stack. You just replace 'call self with new args' with 'update the args and jump to
      the top of the loop.' Steele's work on tail-call optimization is why languages like Scheme
      guarantee this at the language level. For tree or graph traversals (where recursion is usually
      not tail-recursive), the explicit stack approach is cleanest. For divide-and-conquer where
      you're accumulating a result, look for whether you can reformulate with an accumulator
      parameter to achieve tail recursion first — it yields much simpler iterative code than
      manually managing a stack.
    expected_abstract: |-
      Converting a recursive algorithm to iterative form reliably follows one of two patterns
      depending on your recursion structure: **Option 1: Explicit stack simulation (universal)**
      This works for any recursion. Instead of relying on the call stack, maintain your own stack
      data structure: ```python def iterative_version(root): stack = [initial_args] while stack:
      args = stack.pop() # do the work # instead of recursive calls, push new args:
      stack.append(next_args) ``` This is mechanical and always correct, though it can be verbose.
      **Option 2: Tail-call to loop (when applicable)** If the recursive call is the *last*
      operation (tail position), no stack is needed at all. Just update your variables and loop:
      ```python def iterative_version(n, accumulator=1): while n > 0: accumulator *= n n -= 1 return
      accumulator ``` **Which to use**: Check whether your function does any work *after* the
      recursive call returns. If not, it's tail-recursive — use Option 2 for clean, simple code. If
      yes (e.g., you multiply by the return value, or process left and right subtrees), use Option
      1. Also consider: for divide-and-conquer algorithms, you can sometimes restructure to use an
      accumulator parameter to *make* it tail-recursive before converting.
- id: exemplar_reasoning_121
  paraphrases:
  - |-
    I'm designing a community library for a small town. The building needs to feel welcoming and civic without being intimidating or monumental. How should I think about the massing and entrance?
  samples_per_paraphrase: 3
