    expected_exemplar: |-
      This is a classic tension that maps almost perfectly onto the contrast between how Rich Hickey
      and Uncle Bob Martin think about code. Martin's Clean Code philosophy would push you hard
      toward decomposition: extract every branching clause into a named function, drive parameter
      count down to near zero, treat readability as the primary virtue. A 300-line function is a red
      flag by his lights, full stop. Hickey, on the other hand, has given talks explicitly pushing
      back on this. His critique is that aggressive function extraction creates 'complecting' —
      you're not simplifying the problem, you're hiding its parts in different rooms. If the 300
      lines represent a genuinely complex state machine, scattering it across a call tree of tiny
      functions can make the overall flow *harder* to reason about, not easier, because the mental
      model is now spread across dozens of named abstractions that weren't demanded by the problem.
      The tell for which camp to follow is whether your branching logic represents *accidental* or
      *essential* complexity. If the 12 parameters are mostly about coordinating side effects and
      could be eliminated by restructuring your data model (a Hickey instinct), do that first. If
      the branching is genuinely expressing distinct business cases that have names in your domain,
      extract them (a Martin instinct) — because then the function names become documentation. Given
      you flagged debuggability as a concern, that's also a signal: if the logic is tightly
      sequentially dependent, the flat procedural form may genuinely be the right model and the
      Hickey warning about premature decomposition applies here.
    expected_abstract: |-
      This is a classic readability vs. debuggability tradeoff. The right answer depends on whether
      the complexity is essential or accidental. First, ask whether the 12 parameters can be grouped
      into meaningful data structures — if several of them always travel together, they belong in a
      record or object, which immediately simplifies the signature. For the branching logic, the key
      question is whether each branch is independently testable and named after a concept in your
      domain. If so, extracting it into a named function improves readability without harming
      debuggability — most debuggers let you step into called functions just as easily as following
      an inline branch. If the branches are tightly coupled and share a lot of intermediate state,
      keeping them together may be more honest about what the code is actually doing. A long
      function that's genuinely sequential is better than a short function whose clarity is illusory
      because the real logic is buried in ten helper functions. A practical middle path: extract
      only the branches that have a clear, nameable purpose and leave the rest inline. This
      preserves the debuggable flow your team values while reducing cognitive load on the parts that
      can be cleanly separated.
- id: exemplar_reasoning_183
  paraphrases:
  - |-
    I'm building a distributed key-value store and trying to decide whether to prioritize consistency or availability when the network partitions. My use case is financial transaction records that need to be audited later. What should I drive toward?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: train
    expected_exemplar: |-
      For financial audit records, this maps almost exactly onto the philosophical divide between
      Leslie Lamport and Eric Brewer — and for your use case, Lamport's instincts win decisively.
      Brewer, who formalized the CAP theorem, spent much of his subsequent career (and his 2012 'CAP
      Twelve Years Later' paper) walking back the naive CP-vs-AP dichotomy. His real point became:
      availability is a continuous variable, not binary, and well-designed systems should tune it
      per operation. His work at Google on Spanner influenced systems that use TrueTime to get very
      strong consistency without sacrificing much availability in practice — but his general posture
      for non-financial workloads leans toward 'design for availability and make consistency
      eventual where you can tolerate it.' Lamport is essentially the patron saint of the CP side.
      His work on Paxos (and later the more understandable Multi-Paxos expositions) is predicated on
      the idea that linearizability — every read seeing the most recent write, as if operations
      happened on a single machine — is the only safe foundation for systems where correctness
      matters. The complexity cost is real: Paxos-based systems refuse writes during certain
      partition scenarios rather than risk divergence. For financial records being audited, that's
      exactly what you want. An auditor who finds two conflicting records of the same transaction
      has a much bigger problem than one who finds a brief write outage. Practically: look at
      systems built in Lamport's tradition — etcd (Raft, which Ongaro and Ousterhout designed
      explicitly as a more teachable Paxos), CockroachDB, or Google Spanner. These are CP stores
      that handle your audit requirement directly. The operational trade-off is that under a true
      partition you'll get write failures rather than split-brain data — which for financial records
      is the correct failure mode. Accept that you'll need a compensating strategy for availability
      (redundant nodes, retry logic, circuit breakers) rather than trying to be eventually
      consistent with a reconciliation step on financial records.
    expected_abstract: |-
      For financial transaction records that need to be audited, you should strongly prioritize
      consistency over availability. Here's the reasoning: The CAP theorem tells you that during a
      network partition you must choose: a consistent system will refuse some writes and remain
      correct; an available system will accept writes on both sides of the partition and risk
      divergence. For audit records, divergence is catastrophic — if two nodes accept different
      records for the same transaction ID, you've created a compliance problem that's expensive or
      impossible to resolve after the fact. A brief write outage, by contrast, is operationally
      annoying but recoverable (the client retries, the transaction waits). This points toward a CP
      architecture: - Use a consensus protocol (Raft or Paxos) to ensure all writes are confirmed by
      a quorum before being acknowledged. No write succeeds unless a majority of nodes agree. -
      Accept that under a partition, the minority partition will refuse writes. This is the correct
      behavior — it means no conflicting records are ever created. - Read consistency should be
      linearizable or at minimum sequentially consistent; don't allow stale reads on records that
      might be part of an audit trail. Practical database choices that fit this: etcd, CockroachDB,
      or any system built on Raft/Paxos consensus. PostgreSQL with synchronous replication is also
      appropriate at smaller scale. For availability, your mitigation isn't to weaken consistency —
      it's to reduce partition risk through good infrastructure (multiple availability zones,
      reliable networking) and to give clients clear retry semantics so a refused write during a
      partition can be retried once the partition heals.
- id: exemplar_reasoning_184
  paraphrases:
  - |-
    In a rook endgame, I have a rook and king vs my opponent's rook and king, with me having one extra passed pawn on the queenside. My opponent's rook is very active. How do I think about converting this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: train
    expected_exemplar: |-
      Rook endgames with an extra passed pawn are notoriously difficult to convert precisely because
      of the problem you're describing — the defending rook becomes a harassment machine. The key
      tension here is the one Capablanca and Rubinstein spent their careers resolving differently.
      Capablanca's approach was almost surgical: he believed in simplifying toward the most
      theoretically won king-and-pawn structure, often trading activity for clarity. He'd ask 'what
      does the textbook winning position look like, and how do I reach it?' In a rook endgame, that
      often meant advancing the passed pawn to create a concrete target, placing his rook behind it
      (the fundamental Tarrasch rule), and using his king aggressively. Rubinstein, who was arguably
      the greatest rook endgame player in history, had a slightly different emphasis: he was
      obsessed with king activity. He understood that in rook endings, the king is an attacking
      piece, and getting it to the queenside to escort the pawn — even at the cost of temporarily
      ceding rook activity — was often the right trade-off. Against an active enemy rook, the
      Rubinstein instinct says: neutralize the rook's activity by threatening it with your king,
      forcing it into passivity. The Lucena position is your target if you can get there. But
      practically, Rubinstein's lesson is: don't let the active rook dictate your plan. Use your
      king as a weapon, not just a defender.
    expected_abstract: |-
      Rook endgames with an extra passed pawn require a clear plan because an active defending rook
      can create serious drawing threats. The key principles are: first, place your rook behind your
      passed pawn (this is the fundamental rule — the rook belongs behind passed pawns, yours and
      your opponent's). Second, activate your king. In rook endgames, the king is a powerful piece,
      and getting it to the queenside to support and escort the passed pawn is often the decisive
      factor. Third, be mindful of the Lucena and Philidor positions — the Lucena position (rook and
      pawn vs. rook, with the pawn on the seventh rank) is a theoretical win, and steering toward it
      is a concrete goal. To deal with the active enemy rook, the 'bridge-building' technique in the
      Lucena is your friend. Practically, the biggest mistake in these endings is being too passive
      with your king or advancing the pawn prematurely before your king is close enough to support
      it.
- id: exemplar_reasoning_185
  paraphrases:
  - |-
    I'm trying to design an experiment to test whether a new drug reduces inflammation, but I'm worried about confounding variables. What's the best approach to make sure my results are actually trustworthy?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: school_tradition
    specificity: direct
    split: train
    expected_exemplar: |-
      This is exactly the kind of problem where the Fisherian tradition of experimental design
      offers a rigorous toolkit. R.A. Fisher, working at Rothamsted in the 1920s, essentially
      invented the modern randomized controlled trial precisely to handle confounding — his core
      insight was that randomization doesn't eliminate confounders, it distributes them evenly so
      they can't systematically bias your result. The Fisherian approach would have you: (1)
      randomize assignment to treatment and control arms, (2) block on known confounders (e.g., age,
      sex, baseline inflammation levels) before randomizing within blocks, and (3) pre-register your
      primary endpoint so you're not fishing for significance post-hoc. The contrasting tradition
      worth knowing is the Neyman-Pearson school, which frames this less as 'testing a hypothesis'
      and more as 'controlling error rates' — they'd push you to think hard about statistical power
      and Type II error before you run a single subject. For a drug trial specifically, the Bradford
      Hill criteria (another named tradition, from Austin Bradford Hill's 1965 paper) give you a
      checklist of causal inference: dose-response relationship, temporality, biological
      plausibility. Used together, these traditions give you a defensible causal claim rather than
      just a correlation.
    expected_abstract: |-
      The key to a trustworthy experiment is controlling for confounding variables through
      randomization and blinding. Randomly assign subjects to treatment and control groups so that
      known and unknown confounders are distributed evenly. If you know certain variables (age,
      baseline inflammation score) are likely to matter, use stratified randomization or blocking to
      ensure balance. Use a placebo control and blind both participants and assessors to treatment
      assignment to prevent expectation effects. Pre-register your primary hypothesis and analysis
      plan before data collection so you're not cherry-picking outcomes afterward. Make sure your
      sample size is calculated in advance to give adequate statistical power. Finally, check your
      groups for baseline balance, and if imbalances exist, adjust for them in your analysis using
      appropriate statistical models like ANCOVA.
- id: exemplar_reasoning_186
  paraphrases:
  - |-
    I've been studying endgames and I notice I'm much better at tactical endgames with immediate threats than at quiet technical endgames where you have to slowly improve your position. Any advice on how to train the 'quiet' endgame skill?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: school_tradition
    specificity: implicit
    split: train
    expected_exemplar: |-
      The gap you're describing — between tactical pattern recognition and pure technique — was one
      of the great divides in chess history, and studying how it was bridged by specific players is
      actually one of the most efficient ways to close it. The classical school of endgame technique
      was essentially codified by Capablanca and then refined through the Cuban and Soviet
      traditions. Capablanca's endgames are the gold standard for exactly the kind of quiet mastery
      you want: he would improve his king, activate his rooks to the seventh rank, create a passed
      pawn, and coordinate all of this so smoothly it looked effortless. Studying his games —
      especially his rook endgame wins — gives you templates that are hard to get from abstract
      principle-reading. Later, Smyslov and Karpov brought that same tradition into the modern era;
      Karpov's endgames in particular are almost textbook studies in how to convert a tiny
      structural advantage through pure technique. What's distinctive about all these players is
      their use of 'the principle of two weaknesses': you create or provoke one weakness, your
      opponent defends it, then you create a second weakness on the other side of the board and
      their pieces can't cover both. That's the core of quiet technical endgame play. Study
      Dvoretsky's Endgame Manual alongside actual games from these players and you'll build a feel
      for it faster than solving puzzles alone.
    expected_abstract: |-
      Quiet technical endgames require a different kind of training than tactical puzzles — you need
      to build long-term planning and piece coordination rather than calculation. A few approaches
      that help: First, study the principle of two weaknesses — in most technical endgames, the
      winning method involves creating a weakness on one side, drawing the opponent's pieces there,
      then creating a second weakness on the opposite side that can't be defended simultaneously.
      Second, practice king activity deliberately: in every endgame you play or study, identify the
      ideal square for your king and trace the path to get there. Third, study rook endgames
      carefully since they are the most common and have the most nuanced technique; focus on Lucena
      and Philidor positions, then study how active rooks on the seventh rank create concrete
      threats. Fourth, play slow games and deliberately steer toward simple-looking endgames rather
      than complex tactical ones, forcing yourself to find the plan when there are no immediate
      tactics. Reviewing your endgame losses and identifying the exact move where you drifted or
      lost the thread will accelerate improvement faster than abstract study.
- id: exemplar_reasoning_187
  paraphrases:
  - |-
    I'm designing a new API for a library that other developers will use. What principles should guide the design so it's easy to use and hard to misuse?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: school_tradition
    specificity: direct
    split: train
    expected_exemplar: |-
      API design has some genuine master practitioners and identifiable schools worth knowing about.
      Joshua Bloch's approach — articulated in *Effective Java* and his influential talk 'How to
      Design a Good API and Why It Matters' — is probably the most cited framework in the Java/OOP
      tradition. His core principles: when in doubt, leave it out (a smaller API is easier to learn
      and maintain); names matter enormously (a method named 'size' vs 'length' vs 'count' signals
      very different things); and design for the reader, not the writer. His 'hard to misuse'
      heuristic is embodied in the idea of making the right thing easy and the wrong thing either
      impossible or loudly wrong at compile time rather than runtime. The Rust community has
      developed a particularly rigorous school of API design around type-driven safety — using the
      type system to encode invariants so that misuse is a compile error. The 'typestate pattern' is
      characteristic of this tradition: an API object that transitions through states (e.g., a
      Builder that can only call .build() once all required fields are set) makes misuse
      structurally impossible. This is the 'pit of success' philosophy articulated by Brad Abrams
      and the .NET team. The Unix / POSIX tradition takes a contrasting approach: orthogonality
      above all. Each function does one thing, the pieces compose cleanly, and the programmer is
      trusted. This is elegant but puts more burden on the user to use things correctly. The tension
      between this and the Bloch school is real. For a library API specifically, I'd weight the
      Bloch school heavily: fluent builder patterns for complex construction, immutable return types
      where possible, and deliberate use of types to encode constraints. Prioritize discoverability
      — can a developer explore your API in an IDE and figure out how to use it without reading
      documentation?
    expected_abstract: |-
      Good API design centers on a few core principles that make an interface intuitive and
      resistant to misuse. First, prioritize clarity over brevity. Method and type names should
      clearly communicate intent. A reader should be able to understand what a function does from
      its name alone in most cases. Second, make the common case simple and the edge case possible.
      Design the default path to require minimal configuration, with advanced options available but
      not required. Third, use the type system to encode constraints. If a function requires a
      non-null value, express that in the type rather than throwing a runtime exception. If an
      object has an invalid state, make that state unrepresentable rather than checkable. Fourth,
      minimize surface area. Every public method or type is a commitment you'll need to maintain.
      Start with a minimal interface and expand based on real user needs rather than anticipated
      ones. Fifth, be consistent. If you name one method 'getUser', don't name a similar one
      'fetchAccount' — pick conventions and stick to them. Sixth, design for error handling
      explicitly. Make it clear what can fail, how it fails (exceptions vs. error returns vs. result
      types), and what the caller should do about it. Finally, document with examples first. Real
      code examples often communicate intent faster than prose descriptions, and writing them forces
      you to confront whether your API is actually ergonomic.
- id: exemplar_reasoning_188
  paraphrases:
  - |-
    I'm a landscape architect working on the grounds of a new corporate campus. The client wants it to feel natural and ecological, not manicured, but they also want it to look intentional and cared-for rather than neglected. How do I thread that needle?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: train
    expected_exemplar: |-
      You're navigating one of the central debates in contemporary landscape design, and it maps
      almost perfectly onto the contrast between two dominant approaches: the Dutch wave planting
      tradition associated with Piet Oudolf and the more formal ecological design lineage
      represented by figures like Ian McHarg and, more recently, the regenerative-native work of
      Darrel Morrison. Oudolf's genius is in making wild-looking plantings feel legible and
      composed. His tool is structure through season: he selects grasses and perennials not just for
      bloom but for their winter silhouettes, seed heads, and the way they move in wind. A border
      that looks 'natural' in the Oudolf sense is actually very deliberately choreographed — you
      read it as natural because the plants are performing naturalness at every scale, but the
      composition has clear rhythms, repeated anchor species, and a seasonal arc that reads as
      intentional care. The grasses hold the planting together visually when the flowers are gone.
      This is precisely your 'intentional but not manicured' problem solved through plant selection
      and temporal design. Morrison and the native-ecological camp push further toward function —
      they design plant communities that reference actual regional ecotypes, prioritizing
      self-sustaining relationships over visual composition. The risk for a corporate client is that
      this can read as weedy or neglected without interpretive signage and a client educated to
      appreciate it. For a corporate campus, I'd lean heavily on the Oudolf framework — use native
      and near-native species wherever possible to satisfy the ecological brief, but organize them
      with the structural planting logic he pioneered: repeated masses of grass, bold textural
      anchors, and a clear edge condition that separates the 'wild' interior from the mown
      circulation paths. That edge is critical. A crisp mown edge next to a naturalistic planting is
      a visual signal that says 'this is intentional' without requiring the whole thing to be tidy.
    expected_abstract: |-
      The tension you're describing is between ecological authenticity and perceived maintenance —
      and it's resolvable through a combination of plant selection, structural composition, and edge
      management. The single most important tool is contrast at the boundary: a clearly maintained
      edge — whether mown grass, a gravel path, or a low hedge — adjacent to a naturalistic planting
      communicates intentionality to the viewer. It signals that the wilder planting is a deliberate
      choice, not neglect. Without that frame, even a beautifully designed naturalistic planting can
      read as unmaintained. Within the planting itself, structure comes from repetition and
      seasonality. Grasses and seed-bearing perennials that retain visual interest in winter are
      critical — a planting that looks dead or collapsed from November to March will feel neglected
      regardless of its summer beauty. Choose species with strong architectural form through
      dormancy: upright grasses, plants with persistent seed heads, and woody sub-shrubs that hold
      their shape. For the ecological dimension, work with plant communities rather than isolated
      specimen plants — groupings that reference natural associations feel more coherent and tend to
      be more self-sustaining. Reduce maintenance by selecting species adapted to your specific site
      conditions (soil, hydrology, sun exposure) so that the planting isn't fighting its
      environment. Finally, communicate the intent to the client through minimal interpretive
      elements — a small sign, a QR code, or a site map that names the planting approach. Framing
      shapes perception, and corporate clients often need their employees and visitors to understand
      that 'wild-looking' was the goal.
- id: exemplar_reasoning_189
  paraphrases:
  - |-
    I'm trying to come up with a conjecture about a number-theoretic pattern I've noticed empirically, but I'm not sure how to turn a numerical observation into a 'real' conjecture that mathematicians would take seriously. Some conjectures feel amateurish and others feel like they belong in a research paper. What makes the difference?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: stylistic_attribution
    specificity: direct
    split: train
    expected_exemplar: |-
      The gap between an observation and a serious conjecture is largely about mathematical style
      and context, and it's worth thinking about whose conjectures you admire and what distinguishes
      them. Ramanujan's conjectures are a useful extreme: he stated things like specific infinite
      series identities or partition congruences (e.g., p(5n+4) ≡ 0 mod 5) with no proof and
      sometimes no heuristic — but they were precise, falsifiable, and connected to deep structure,
      even if only he could see it. His style was oracular: state the exact claim, trust that the
      pattern reveals something real. By contrast, Birch and Swinnerton-Dyer formulated their
      conjecture after systematic computational experimentation over many cases, and they were
      careful to embed their observation in the existing language of L-functions and elliptic curves
      — the conjecture felt serious partly because it connected empirical data to an established
      theoretical framework. Erdős's conjectures are perhaps the best model for your situation: he
      was extremely prolific with conjectures from numerical pattern-spotting, but he always (a)
      checked the pattern against many cases, (b) asked whether it could be a coincidence — i.e.,
      offered a heuristic for why it should be true, and (c) tried to bound how hard it seemed and
      calibrate his confidence accordingly. The difference between 'amateurish' and
      'research-worthy' often comes down to: Is your claim precise enough to be falsified? Can you
      give a heuristic argument — even a probabilistic one — for why it should hold? Does it connect
      to or generalize something already known? Erdős-style conjectures also tend to come with a
      prize, which is a clever way of signaling 'I've thought about this enough to bet on it.'
    expected_abstract: |-
      A conjecture earns mathematical credibility through several qualities. First, precision: the
      claim must be specific enough to be definitively true or false, not just a vague pattern.
      Second, it should be supported by substantial numerical evidence across varied cases, not just
      a few examples. Third, a good conjecture typically comes with a heuristic — even an informal
      or probabilistic argument for why the pattern should hold, connecting it to known structural
      features of the objects involved. Fourth, the conjecture should ideally connect to or
      generalize existing results, placing it within a broader theoretical framework rather than
      appearing as an isolated oddity. Fifth, you should test edge cases and try to find
      counterexamples yourself before claiming it seriously. A conjecture that is precise,
      well-tested, comes with a plausible heuristic, and connects to known mathematics reads as
      serious; one that is vague, thinly tested, and isolated reads as a curiosity.
- id: exemplar_reasoning_190
  paraphrases:
  - |-
    I'm learning to play Chopin's nocturnes and I'm not sure how much rhythmic freedom I should take — when is rubato too much? How do pianists typically handle this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: school_tradition
    specificity: direct
    split: train
    expected_exemplar: |-
      The question of rubato in Chopin is really a question of two competing schools. The
      19th-century Romantic tradition — represented most famously by players like Alfred Cortot —
      treated rubato as a nearly constant expressive tool, stretching phrases dramatically, letting
      melody float freely over a relatively steady bass. The result is deeply personal and emotional
      but can feel excessive to modern ears. The opposing tradition, shaped heavily by the Polish
      school (figures like Jan Ekier and Józef Śmidowicz, who edited the authoritative Polish
      National Edition of Chopin) as well as historically informed players like Mieczysław
      Horszowski, insists that Chopin's own teaching emphasized a steady left hand with the right
      hand singing freely over it — rubato as a local, subtle inflection rather than wholesale
      rhythmic dissolution. Modern giants like Maurizio Pollini lean toward structural clarity and
      restrained rubato; Dinu Lipatti was famous for a luminous restraint that lets the phrase speak
      without pulling it apart. A useful heuristic: if the bass line is lurching along with the
      melody, that's probably too much. If the right hand is shaping a phrase like a singer taking a
      breath before a climax, that's idiomatic Chopin rubato. Listen to Lipatti's 1950 Nocturne in E
      minor recordings alongside Cortot's as a study in the two poles — then find your own place on
      that spectrum.
    expected_abstract: |-
      Rubato in Chopin is a matter of expressive timing where you subtly stretch or compress the
      rhythm to shape phrases emotionally. The key principle is that the left hand should generally
      remain relatively steady and pulse-like, acting as a rhythmic anchor, while the right hand
      melody floats more freely above it. Rubato becomes excessive when the underlying pulse is lost
      entirely — when a listener can no longer feel where the beat is or the phrase seems to drag or
      rush without clear musical purpose. It should feel like a natural breath or lean into an
      important note, not a distortion of the tempo. Practice by recording yourself and listening
      back: if the timing changes feel organic and serve the phrasing, they're working. If they feel
      arbitrary or make the music feel unstable, dial them back.
- id: exemplar_reasoning_191
  paraphrases:
  - |-
    I'm designing a small art museum addition that needs to connect to a historic 1920s Beaux-Arts building. How do I handle the junction — should the new part contrast or try to blend?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: train
    expected_exemplar: |-
      This is the canonical problem of historic adjacency in architecture, and there are two sharply
      opposed schools of thought that are worth putting in explicit dialogue before you decide. The
      contrast approach is most powerfully argued by Carlo Scarpa and the lineage that flows through
      him — the idea that a new building should be honest about its moment in time and that the
      meeting of old and new, when handled with exquisite care, becomes a *third thing*: a joint
      that is itself architecturally eloquent. Scarpa's additions and renovations at the
      Castelvecchio in Verona are the masterclass here. He never pretended the new was old, but he
      was obsessively attentive to the conditions of meeting: a steel bracket here, a deliberate gap
      there, a change in floor material that marks the threshold precisely. The contrast is
      respectful because it is *specific* — it responds to the existing building's geometry,
      materials, and logic at close range, even while declaring itself new. The integration approach
      is best represented by the work of Rafael Moneo, particularly his National Museum of Roman Art
      in Mérida and his extension work — or, for American museum additions specifically, Kevin
      Roche's work for the Met. Here the new building borrows the organizational logic, material
      palette, or massing rhythm of the original without mimicking its ornament. It's not pastiche
      and it's not contrast; it's conversation in a shared grammar. For a Beaux-Arts building
      specifically, I'd argue the Scarpa path is more defensible than either full mimicry or
      arbitrary contrast. The Beaux-Arts style is defined by its formal hierarchies, axiality, and
      material richness — qualities you can *respond to* without replicating. A new wing in
      contemporary materials that respects the axes, honors the cornice line as a datum, and inserts
      a deliberate joint (a glazed hyphen, a recessed connector) will read as confident and
      respectful. What fails is the middle ground: a new building that vaguely gestures at classical
      ornament without committing to either the language or its opposite.
    expected_abstract: |-
      There are two defensible positions, and the right choice depends on your site conditions,
      program, and the significance of the historic structure. The contrast approach argues for
      honesty about the new building's time and technology. A clearly contemporary addition, when
      well-designed, signals that the institution is alive and evolving rather than frozen in the
      past. The risk is that a poorly resolved contrast can feel disrespectful or arbitrary —
      contrast for its own sake, without careful attention to how the new building responds to the
      scale, massing, and material logic of the existing one. The integration approach seeks a
      common formal language — not pastiche, but a new building that shares proportional systems,
      material palette, or organizational logic with the original. For a Beaux-Arts building, this
      might mean respecting the cornice line as a datum, maintaining the rhythm of window bays, or
      using stone or masonry in a contemporary configuration. The risk is superficiality:
      surface-level historicism that mimics ornament without understanding structure. In practice,
      the most successful museum additions tend to use a connector or joint as the mediating element
      — a glazed hyphen or recessed transition zone that separates the two buildings slightly,
      allowing each to be read on its own terms. This joint absorbs the visual tension between old
      and new and gives visitors a clear moment of transition. It also practically separates the
      structural and environmental systems of the two buildings, which is usually beneficial. For a
      Beaux-Arts building, I'd counsel against attempting to match the ornamental vocabulary — the
      craftsmanship is difficult to replicate convincingly, and a weak attempt will look worse than
      a confident contemporary design. Focus instead on responding to the massing, symmetry, and
      civic presence of the existing building at the scale of the site.
- id: exemplar_reasoning_192
  paraphrases:
  - |-
    I'm renovating a 1960s open-plan office floor into apartments. The bones are very industrial — exposed concrete columns, deep floor plates, small punched windows. What design approach would suit this kind of space?
