    I have a position where I can either grab a pawn and go into a slightly passive but solid structure, or sacrifice it back for active piece play with no clear material compensation. Which approach should I generally prefer in practical play?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: test
    expected_exemplar: |-
      This trade-off sits right at the heart of the Petrosian vs. Tal divide in chess philosophy.
      Petrosian would almost certainly take the pawn and embrace the passive structure — his whole
      style was built on the idea that small material advantages are real and lasting, and that
      'suffering' in a cramped but solid position is a skill, not a weakness. He was famous for
      giving back material only when absolutely forced, trusting his defensive technique to hold.
      Tal, by contrast, would find the passive structure psychologically unbearable and would snap
      off the active piece play without a second thought, betting that the complications he
      generates are harder for his opponent to navigate than for him. In practical terms, which is
      right for *you* depends on your temperament and strengths. If you're a Karpov-style player —
      patient, precise, good at converting tiny edges — take the pawn. If you're more Fischer in his
      aggressive period or a Nezhmetdinov type — someone who thrives in chaos and generates threats
      faster than your opponent can process — sacrifice it back and play for the attack. The worst
      outcome is playing Tal's choice with Petrosian's nerve: grabbing the pawn and then panicking
      in the passive position, or sacrificing and then playing timidly.
    expected_abstract: |-
      This is a classic tension in chess between material and initiative. As a general principle,
      material advantages are permanent while initiative is temporary — so if you take the pawn, you
      bank a real asset, but you need to be able to defend accurately in the passive position that
      follows. If you sacrifice for active piece play, you're betting that your activity generates
      enough concrete threats to compensate before the position simplifies. In practical play, the
      passive-but-up-material choice tends to reward players with strong defensive technique and
      endgame skills, while the activity-for-material choice rewards players who can calculate
      deeply and generate threats continuously. If you're stronger than your opponent, take the
      solid path; if you need complications to win, the active sacrifice makes more sense.
- id: exemplar_reasoning_255
  paraphrases:
  - |-
    I'm cooking for someone who doesn't like spicy food but I still want the dish to feel interesting and layered. How do I build complexity without heat?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: school_tradition
    specificity: implicit
    split: test
    expected_exemplar: |-
      This is actually where Japanese culinary philosophy is most instructive, because the entire
      tradition is built on layered complexity with almost no reliance on capsaicin heat. The
      concept of umami — developed as a formal idea by Kikunae Ikeda but embedded in washoku
      technique for centuries — is essentially a framework for building depth without sharpness. The
      technique of combining multiple umami sources (dashi from kombu plus katsuobushi, mirin and
      sake for sweetness, soy for salt and fermentation depth) produces a kind of flavor layering
      that feels profoundly complex without any heat signature. This is why Japanese food can taste
      simultaneously restrained and deeply satisfying. French classical cooking solves the same
      problem differently — through fond-based sauce building, the Escoffier tradition of reductions
      and stocks. What both traditions share is a reliance on the Maillard reaction, acid-fat-salt
      balance, and fermented or aged ingredients (miso, aged cheeses, cured meats) as complexity
      engines. Even Sichuan cooking, when you strip out the chili, uses techniques like dry-frying
      aromatics and layering fermented black beans that are fully translatable to non-spicy
      contexts. The practical lesson: build a base with multiple umami sources, use browning
      reactions deliberately, and reach for fermented ingredients — miso, fish sauce used in small
      amounts, aged parmesan — as your complexity tools.
    expected_abstract: |-
      Complexity in flavor comes from layering different taste dimensions rather than relying on any
      single one. Without heat, you can build depth through umami richness — ingredients like
      mushrooms, parmesan, soy sauce, miso, tomato paste, and anchovies all add savory depth. Use
      the Maillard reaction by browning your proteins and aromatics properly, which creates hundreds
      of flavor compounds. Layer acidity at different stages of cooking: a splash of wine early and
      a squeeze of lemon at the end give different effects. Use textural contrast so the dish
      engages the palate in multiple ways. Fermented or aged ingredients add background complexity
      that reads as depth rather than a specific flavor. Finally, fat carries and lengthens flavor,
      so finishing with a good butter or oil can make a dish feel more complete and layered.
