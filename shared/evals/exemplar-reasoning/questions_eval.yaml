    expected_exemplar: |-
      This tension sits at the heart of one of chess's great stylistic divides, and understanding
      the schools that embody each extreme can help you calibrate. The Soviet school — particularly
      as expressed by players like Petrosian and Karpov — elevated prophylaxis and restriction into
      an art form. Petrosian's idea was that preventing your opponent's counterplay IS activity;
      you're not passive, you're strangling. Karpov refined this into 'small advantages' chess:
      accumulate tiny positional gains until the opponent has no good moves (zugzwang-like
      pressure). But the Soviet school also produced Tal and Bronstein, who argued that dynamic
      imbalance itself is the safest path — because a quiet position gives a stronger player time to
      outplay you technically. The synthesis most modern players reach for is what Kasparov called
      the 'dynamic equilibrium': you play actively not to win material but to preserve options and
      deny your opponent a plan. Practically, this means asking not 'is this safe?' but 'does my
      opponent have a clear plan if I play this?' If the answer is yes, you may need to inject chaos
      even at some positional cost. Try studying Karpov-Kasparov game 16 from 1985 — it's a clinic
      in exactly this tension resolved in real time.
    expected_abstract: |-
      The key is distinguishing between passive moves (which merely react) and solid moves (which
      restrain the opponent's activity while keeping your own options open). A useful heuristic:
      after each move you consider, ask whether your opponent has an obvious, forcing plan. If they
      do, your 'safe' move may actually be losing slowly. Initiative matters because chess is not
      symmetric — the player with a plan puts their opponent under practical pressure. So seek
      positions where you have a clear next step, even if it involves some risk, rather than
      positions that are theoretically equal but give your opponent all the choices. Work on
      recognizing when your position is cramped versus solid — in a cramped position, a freeing pawn
      break is often mandatory even if it looks risky.
- id: exemplar_reasoning_065
  paraphrases:
  - |-
    I keep making tomato sauces that taste fine but just feel kind of one-dimensional and flat. What's missing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: train
    expected_exemplar: |-
      What you're describing is a very common gap between a sauce that's technically correct and one
      that has genuine depth — and the solution lives in what Marcella Hazan understood more clearly
      than almost anyone: restraint and fat. Her canonical butter-onion-tomato sauce is almost
      aggressively simple, but the butter creates a roundness and an emulsified richness that olive
      oil alone doesn't. The flatness you're sensing is often the absence of that fatty cushion that
      carries the tomato's sweetness forward. Beyond that, Italian-American red sauce tradition —
      the kind codified by figures like Lidia Bastianich — leans heavily on a proper soffritto
      cooked low and long, and on adding a Parmesan rind during simmering, which contributes
      glutamates that push the sauce from two-dimensional to savory and complex. If you want to go
      in a more contemporary direction, the approach associated with chefs like Chris Bianco (of
      Pizzeria Bianco) is to start with genuinely exceptional canned tomatoes — Bianco DiNapoli or
      San Marzano — and do almost nothing, trusting the tomato quality. That's a different
      philosophy: the richness isn't built, it's selected. Your flat sauce is most likely a fat
      problem, an acid-balance problem, or a tomato-quality problem — and Hazan's instinct would be
      to solve all three with butter, a long simmer, and a taste for sweetness.
    expected_abstract: |-
      Flat tomato sauce usually comes down to one or more of a few missing elements: fat, time, acid
      balance, and umami. Fat — whether olive oil, butter, or both — is what carries flavor and
      gives the sauce a rounded, coating quality rather than a watery one. Cooking the sauce longer
      allows water to evaporate and flavors to concentrate. Acid balance matters enormously: if the
      tomatoes are too acidic, a small pinch of sugar helps; if they're not acidic enough, a splash
      of wine or red wine vinegar lifts the whole thing. Umami depth can come from a Parmesan rind
      simmered in the sauce, a small amount of tomato paste cooked in early, or anchovy dissolved in
      the oil at the start. Finally, seasoning aggressively with salt at multiple points — not just
      at the end — makes an enormous difference in how 'present' the flavors taste.
- id: exemplar_reasoning_066
  paraphrases:
  - |-
    I have a really compelling dataset that seems to support my hypothesis, but I'm worried I might be fooling myself — seeing a pattern that isn't really there. How do scientists guard against this kind of self-deception?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: named_practitioner
    specificity: direct
    split: train
    expected_exemplar: |-
      You're describing what Richard Feynman called the central problem of science — and he was
      unusually blunt about it. In his famous 1974 Caltech commencement address, he introduced the
      concept of 'cargo cult science' and said the first principle of scientific integrity is that
      'you must not fool yourself, and you are the easiest person to fool.' His prescription was
      radical transparency: bend over backwards to report everything that might make your result
      look less impressive, because your job is to give others the information to disprove you, not
      to persuade them. Karl Popper gave this instinct philosophical structure. His falsificationism
      holds that a hypothesis is only scientifically meaningful if you specify in advance what would
      count as evidence against it. When you look at your dataset, ask yourself: what pattern would
      I expect to see if my hypothesis were *wrong*? If you can't answer that, you may be in what
      Popper called 'unfalsifiable' territory, where you're essentially just describing rather than
      testing. His intellectual adversary, Thomas Kuhn, would add a different worry — that your
      existing theoretical commitments (your 'paradigm') are shaping which patterns you see as
      significant and which you dismiss as noise. The most operationally useful framework here
      probably comes from John Ioannidis and the replication crisis literature. His 2005 paper 'Why
      Most Published Research Findings Are False' anatomized exactly the self-deception you're
      worried about: underpowered studies, flexible analysis pipelines, confirmation bias in
      reporting. His antidote — which has become standard good practice — is pre-registration: write
      down your hypothesis, your analysis plan, and your decision rules *before* looking at the
      data. Seeing a pattern in data you've already explored is very different from confirming a
      prediction you committed to in advance.
    expected_abstract: |-
      This is one of the most important questions in scientific practice. The core problem is
      confirmation bias — humans are extremely good at finding patterns in noise when they're
      motivated to find them, and datasets are complex enough to support many interpretations. Here
      are the key safeguards: **Pre-register your analysis.** Before analyzing your data (ideally
      before collecting it), write down exactly what hypothesis you're testing, which variables
      you'll examine, and what statistical tests you'll use. This prevents 'HARKing' — Hypothesizing
      After Results are Known — where you reverse-engineer a hypothesis to fit what you found.
      **Specify your falsification criteria.** Ask: what would my data look like if my hypothesis
      were *wrong*? If you can't answer this, you may not have a testable hypothesis — you may just
      have a description. **Split your data.** If you discovered the pattern exploratorily in one
      portion of your dataset, treat it as a hypothesis and test it on a held-out portion you
      haven't examined. Replication in independent data is the gold standard. **Correct for multiple
      comparisons.** If you ran many tests, some will appear significant by chance. Apply
      corrections (Bonferroni, Benjamini-Hochberg) or be explicit about the exploratory nature of
      your analysis. **Seek disconfirmation actively.** Deliberately look for subsets of your data
      where the pattern breaks down. Try alternative analytical approaches. If the finding is
      robust, it should survive these probes. **Get independent eyes.** Share your raw data and
      analysis code with a colleague who doesn't share your hypothesis. Ask them what they see.
- id: exemplar_reasoning_067
  paraphrases:
  - |-
    I'm a pianist trying to decide how to approach the slow movement of Beethoven's 'Moonlight' Sonata. Should I keep it flowing and connected, or give each phrase more weight and separation? I'm torn between making it feel inevitable versus more searching and rhetorical.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is one of the great interpretive crossroads for this piece, and it maps beautifully onto
      how two traditions of Beethoven playing have pulled in opposite directions. Think about the
      contrast between Wilhelm Kempff and Glenn Gould as poles. Kempff treats the Adagio sostenuto
      as something luminous and inevitable — his legato is extraordinarily seamless, the triplets
      almost weightless, creating a sense that the music is quietly unspooling from a single breath.
      The phrases connect like beads on a thread; nothing is isolated or rhetorical. Gould, by
      contrast (in his rare live readings), would pull phrases apart and re-weight them so they feel
      interrogatory, as if each harmonic turn is a question being posed. More recently, András
      Schiff represents a third path: historically informed, he treats the pedal markings quite
      literally per Beethoven's notation, which creates a blur that is neither seamless nor
      separated but deliberately atmospheric. If your instinct is toward the 'inevitable' quality,
      you're in the Kempff lineage — think long arcs, minimal pedal changes, trusting the harmonic
      pull to carry the listener. If you want 'searching and rhetorical,' you're moving toward the
      Gould side — use phrase endings as punctuation, let small agogic accents make the harmony feel
      discovered rather than arrived at. Most great modern performances (Radu Lupu, for instance)
      live somewhere between these poles but consciously tip toward one or the other in key moments.
    expected_abstract: |-
      Both approaches can work beautifully, and the tension you're describing is real. The key is
      deciding what emotional narrative you want the movement to tell. For a flowing, inevitable
      feel, prioritize long melodic arcs, smooth pedaling that connects harmonies, and avoid
      lingering on individual notes — let the triplet ostinato feel like a tide. For a more
      searching, rhetorical quality, use subtle agogic accents at phrase peaks, let phrase endings
      breathe slightly before continuing, and allow the harmonic ambiguities (especially the
      chromatic inner voices) to register as questions. The piece's marking, Adagio sostenuto,
      suggests the sustained quality should dominate, but 'sostenuto' also implies some weight — so
      even a flowing reading benefits from a sense that each phrase has gravity. You might try
      playing through once prioritizing the bass and inner voices rather than the melody to feel how
      the harmonic motion can guide your pacing decisions.
- id: exemplar_reasoning_068
  paraphrases:
  - |-
    I'm writing a memoir and I can't decide whether to write it in a fragmented, non-linear style or just tell the story chronologically. What are the tradeoffs?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is one of the central tensions in memoir writing, and different traditions have staked
      out very different positions on it. The lyric essay tradition — associated with writers like
      Maggie Nelson in *The Argonauts* or Claudia Rankine in *Don't Let Me Be Lonely* — treats
      fragmentation as the *form of consciousness itself*. The non-linearity isn't a stylistic
      flourish; it enacts the way memory actually works, associatively and recursively. Nelson's
      fragments create meaning through juxtaposition rather than causality — you're expected to feel
      the gaps as much as the content. This works especially well when the subject matter resists
      clean resolution: trauma, identity, ambivalence. By contrast, the Southern literary memoir
      tradition — think Mary Karr's *The Liar's Club* or Frank McCourt's *Angela's Ashes* — commits
      hard to linear chronology and scene-by-scene immersion. Karr's approach is almost novelistic:
      you live inside the child's limited perspective in real time, and the emotional payoff comes
      from dramatic revelation, not retroactive recontextualization. The reader doesn't know more
      than the narrator-child does. This creates tremendous suspense and empathy but requires a
      story with genuine dramatic arc. The question to ask yourself is: is your memoir's meaning
      *in* the events, or *in* how you now understand them? If the raw story is the point,
      Karr-style chronology serves you. If the meaning only emerges through the collision of past
      and present consciousness, the lyric fragment tradition is your better anchor.
    expected_abstract: |-
      The choice between linear and non-linear structure in memoir depends on what your story is
      fundamentally about. Chronological structure works well when the narrative has a natural
      dramatic arc — when events build on each other causally and the reader needs to experience
      them in sequence to feel their weight. It's also more accessible and tends to create stronger
      scene-level immersion because you're not constantly context-switching. Fragmented, non-linear
      structure works best when the meaning of events only becomes clear through retrospective
      understanding — when the whole point is how the present self interprets the past self. It
      allows you to juxtapose moments that are years apart but emotionally or thematically linked,
      creating meaning through resonance rather than causation. The risk is that it can feel evasive
      or artificially literary if the fragments don't genuinely illuminate each other. A useful
      diagnostic: if you removed all your present-tense reflection and just told the story straight,
      would it still be interesting? If yes, consider chronological. If the interest depends
      entirely on the back-and-forth between past and present, non-linear is likely your form.
- id: exemplar_reasoning_069
  paraphrases:
  - |-
    My homemade ramen broth is technically correct — it tastes like ramen — but it doesn't have that 'wow' quality I get at good ramen shops. What separates a great tonkotsu from a good one?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: stylistic_attribution
    specificity: direct
    split: train
    expected_exemplar: |-
      What you're chasing is what the ramen world calls 'kotteri' depth — a richness that feels
      almost alive — and the gap between technically correct and transcendent usually comes down to
      three things that the legendary shops obsess over differently. Ichiran, which built a global
      franchise on a single bowl, treats the base tare as the variable that personalizes the broth:
      their secret sauce is blended separately, added to order, and is where their complexity lives,
      not in the broth itself. That's a useful framing — your broth might be the foundation but your
      tare might be underdeveloped. The chefs who are considered in a different class entirely —
      Ivan Orkin, the American who earned serious respect in Tokyo, talks about layering dashi into
      tonkotsu, which sounds wrong but creates a brightness and mineral quality that cuts through
      the pork fat and keeps the bowl from feeling heavy. The shops that have the longest queues in
      Fukuoka — the birthplace of tonkotsu — typically boil their bones longer and at a harder
      rolling boil than most home recipes suggest, which emulsifies the collagen into the fat and
      turns the broth white and almost creamy rather than just rich. For practical improvement: push
      the boil harder for longer, develop your tare separately with more soy age and mirin
      reduction, and add a small amount of kombu-steeped water to the finished bowl to add that
      backstage umami shimmer.
    expected_abstract: |-
      The gap between good and great tonkotsu broth usually comes down to emulsification, tare
      complexity, and fat quality. Authentic tonkotsu requires a sustained hard boil — not a simmer
      — to physically break down collagen and emulsify fat into the water, creating that
      characteristic milky white color and thick, almost creamy mouthfeel. If you simmered gently,
      the fat separates and the broth stays clear and thin. The tare (seasoning concentrate) is
      often the real differentiator: a developed tare using aged soy sauce, mirin, sake, and
      sometimes dried seafood adds complexity that a basic salt or soy addition can't replicate.
      Make your tare separately and add it to each bowl at service rather than seasoning the whole
      pot. Fat quality matters too — adding a small amount of rendered back fat or a drizzle of
      sesame oil at service adds aroma and mouthfeel that the broth alone won't provide. Finally,
      noodle alkalinity and temperature matter: noodles should be cooked separately and immediately
      added to a very hot bowl.
- id: exemplar_reasoning_070
  paraphrases:
  - |-
    I want to cook salmon for a dinner party but I keep overcooking it. Should I be searing it in a pan or using the oven?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: train
    expected_exemplar: |-
      The salmon overcooking problem is one that really highlights a philosophical split in how
      serious restaurant kitchens handle fish. The classic French brigade approach — still practiced
      at places like Guy Savoy — is a hot pan sear on the skin side, then a brief finish in a
      moderate oven, relying on precision timing and resting. The skin gets lacquered and crisp, and
      you get textural contrast. But the low-and-slow approach championed by chefs like Thomas
      Keller at The French Laundry, who cooks salmon at very low oven temperatures (sometimes as low
      as 275°F/135°C), gives you something almost impossibly silky — the fat renders gently, the
      proteins barely tighten, and you get that translucent, barely-set interior that looks almost
      underdone but is perfectly safe. For a dinner party where forgiveness matters, the
      Keller-style low oven is your friend: a five-minute window of error won't ruin the fish the
      way it would on a screaming-hot skillet. The pan sear is more impressive when it works, but it
      demands split-second attention. For your situation, I'd go low oven, a light brush of oil, and
      a thermometer to pull it around 120–125°F internal.
    expected_abstract: |-
      For a dinner party where consistency matters, the oven — especially at a lower temperature —
      will give you much more control. A screaming-hot pan sear is faster but the margin between
      perfect and overcooked is very narrow, maybe 60–90 seconds. If you go the oven route, try
      setting it to around 275°F (135°C) and cooking the salmon until it just barely flakes and
      reads about 120–125°F internally. This low-and-slow approach gives you a silky, gently cooked
      interior and a much wider window of error, which is ideal when you're distracted by guests. If
      you want crispy skin, you can quickly sear the skin side in a hot oiled pan for 90 seconds
      first, then transfer to the low oven to finish. This hybrid method gives you texture on the
      outside and control on the inside.
- id: exemplar_reasoning_071
  paraphrases:
  - |-
    I want to design a tasting menu dish around just carrots — like carrots as the whole point, not a side. What approach would make that feel like a serious restaurant dish rather than a sad vegetarian afterthought?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: stylistic_attribution
    specificity: direct
    split: train
    expected_exemplar: |-
      What you're describing is essentially the challenge that defined a whole movement in fine
      dining, and there's a very clear lineage to draw from. The approach that elevated
      single-vegetable dishes from afterthought to centerpiece was pioneered most visibly by Alain
      Passard at L'Arpège, who in 2001 famously removed meat from his menu almost entirely and
      forced himself to treat vegetables with the same architectural seriousness as proteins. His
      carrot work is instructive: he'd treat a single carrot as the 'hero' by applying multiple
      preparations — raw, roasted, pureed, pickled — to create contrast within one ingredient,
      essentially building a dish that argues about the ingredient rather than merely presenting it.
      That multi-texture, multi-temperature approach is now almost a signature of the genre. René
      Redzepi at Noma pushed this further by adding fermentation and wild element foils — a carrot
      dish would have aged carrot juice, carrot-top oil, and something fermented to create an umami
      anchor that makes the dish feel substantial. For your dish: roast some carrots at very high
      heat until deeply caramelized (nearly burnt at the edges), serve alongside a smooth carrot
      purée enriched with brown butter, add pickled raw carrot ribbons for brightness, and finish
      with a carrot-top gremolata. The Passard principle is that the dish should reveal the
      ingredient's range, not just its sweetness.
    expected_abstract: |-
      To make a carrot-centered dish feel serious, you need to apply contrast across multiple
      dimensions — texture, temperature, preparation method, and flavor register — so the dish has
      internal complexity despite the single ingredient. Roast some carrots at high heat until
      deeply caramelized for sweetness and char; make a smooth purée from others to provide a rich,
      creamy base; quick-pickle thin slices for brightness and acid contrast; and use the carrot
      tops blended with oil as a herbal finish. Each preparation highlights a different quality of
      the ingredient. Add an umami anchor — miso, aged cheese, or a reduced stock — so the dish
      reads as savory and substantial. Season aggressively, because root vegetables need salt to
      suppress excessive sweetness. Plating should treat the carrot as a protein would be treated:
      centered, with the other elements arranged as supporting characters.
- id: exemplar_reasoning_072
  paraphrases:
  - |-
    I'm trying to decide whether to pursue a broad, exploratory research program across many related phenomena, or to focus intensely on one narrow, well-defined problem that I can really nail down. What are the tradeoffs from a scientific methodology standpoint?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: train
    expected_exemplar: |-
      This is one of the deepest strategic tensions in science, and it maps almost perfectly onto
      the contrast between how Darwin and Faraday worked versus how, say, Michelson or Cavendish
      worked. Darwin is the archetype of the broad synthesizer: he spent decades accumulating
      observations across barnacles, pigeons, geology, and plant biology, never fully committing to
      a single narrow problem until the weight of evidence demanded a unifying theory. His method
      was to let anomalies and patterns accumulate until a framework emerged that could explain them
      all. The risk is obvious — you can spend years collecting and never converge. But the payoff
      is that your theory, when it comes, explains something genuinely large. Faraday worked
      similarly: he was constitutionally restless, moving between electromagnetism, optics, and
      chemistry, and his great discoveries (electromagnetic induction, the Faraday effect) came from
      noticing unexpected connections that a narrowly focused researcher would have missed. On the
      other side you have Michelson, who spent essentially his entire career on one obsession:
      measuring the speed of light with ever-increasing precision. The Michelson-Morley experiment
      is a monument to what focused, meticulous narrowness achieves — it didn't just answer a small
      question, it demolished the aether theory and eventually helped Einstein. Rutherford also fits
      this mold: he picked apart the atom with relentless focus on scattering experiments,
      extracting enormous theoretical consequences from a narrow empirical program. The practical
      takeaway from this contrast: if you're early in a field that lacks organizing theory, the
      Darwin/Faraday broad approach tends to generate the raw material for breakthroughs. If your
      field already has strong theoretical scaffolding and what's needed is a crucial empirical
      test, the Michelson/Rutherford focused approach tends to produce more decisive results. What's
      the theoretical maturity of your area?
    expected_abstract: |-
      This is a classic tradeoff in research strategy, and both approaches have genuine merit
      depending on your circumstances. Broad, exploratory research maximizes the chance of stumbling
      onto unexpected connections and generating novel hypotheses. It's especially valuable early in
      a field, when the conceptual landscape isn't well mapped, or when you have strong reason to
      believe phenomena are interconnected. The downside is that breadth can lead to shallowness —
      you accumulate observations without the depth needed to establish anything definitively.
      Narrow, focused research lets you control variables more tightly, accumulate expertise in a
      specific methodology, and produce findings that are harder to dismiss. It's especially
      powerful when there's a specific theoretical prediction that needs testing, or when precision
      measurement can discriminate between competing models. The risk is tunnel vision — missing
      important context or failing to notice that your narrow question is embedded in a larger
      phenomenon you're ignoring. A few practical considerations: funding bodies often reward focus
      and clear deliverables, which pushes toward narrow programs. But career-defining contributions
      often come from people who maintained enough breadth to see a connection others missed.
      Early-career researchers often benefit from demonstrating competence in a narrow domain first
      before expanding, while established researchers with more resources can sustain broader
      programs. What stage are you at, and what does your field currently need most — more data
      points or a better organizing framework?
- id: exemplar_reasoning_073
  paraphrases:
  - |-
    I'm recording a piano piece and I can't decide whether to play the rubato very freely and dramatically or keep it more controlled and structural. What are the trade-offs?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This tension maps almost perfectly onto the contrast between the Romantic and Neo-classical
      schools of piano performance. The 'free and dramatic' approach is essentially the Cortot
      school — Alfred Cortot treated rubato as expressive surrender, letting the phrase breathe and
      sway almost independently of the bar line, which gives performances a searching, improvisatory
      quality. On the other end, someone like Radu Lupu or András Schiff tends to let the rubato
      emerge from within the structural logic — the phrase accelerates because the harmony is
      pulling forward, not because the performer decided to dramatize. Glenn Gould represents an
      even more extreme structural pole: he famously distrusted expressive rubato as a kind of
      emotional manipulation and kept tempo almost architectural. The trade-off is essentially:
      Cortot-style freedom communicates emotional immediacy but can feel willful or inconsistent
      across repeated listening; Schiff-style structural rubato rewards close listening and feels
      inevitable, but can seem cool or restrained on first encounter. For a recording especially,
      where listeners will hear it many times, erring toward structural rubato often ages better —
      the drama reveals itself rather than announcing itself.
    expected_abstract: |-
      The trade-off between free and controlled rubato comes down to expressive immediacy versus
      structural clarity. Very free rubato creates emotional drama and a sense of spontaneity — it
      makes each phrase feel like a fresh decision. But it can also obscure the underlying rhythmic
      and harmonic logic of the piece, making the interpretation feel inconsistent or arbitrary on
      repeated listening. More controlled rubato, where tempo fluctuations are proportional to the
      harmonic or melodic tension in the phrase, tends to feel more inevitable and rewards careful
      listening. For a recording, where the performance will be heard many times, leaning toward
      structural rubato often ages better than a highly dramatic reading. The key question is
      whether the expressive freedom feels motivated by the music's internal logic or imposed from
      outside it.
- id: exemplar_reasoning_074
  paraphrases:
  - |-
    I have a student who plays violin with beautiful tone but his sense of rhythm is very 'vertical' — he counts beats precisely but the music feels mechanical and doesn't swing or breathe. How should I work on this with him?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is one of the most fundamental challenges in string pedagogy, and it's worth knowing that
      two great teaching traditions have attacked it from almost opposite directions. The Ivan
      Galamian school — which shaped much of 20th-century American violin playing through students
      like Itzhak Perlman and Kyung-Wha Chung — was deeply concerned with rhythmic precision and
      tended to address 'vertical' playing through controlled subdivision exercises, essentially
      teaching the student to feel the smaller pulses within beats so that musical time becomes
      internally organized rather than externally metered. It's a top-down approach: master the
      micro-rhythm, and the phrasing will open up. Contrast this with how Dorothy DeLay, who also
      came out of that lineage but diverged significantly, would handle it. DeLay was famous for
      asking her students questions about narrative and imagery — 'where is this phrase going, what
      does it feel like to arrive there?' — almost forcing the musical intention to precede the
      technical execution. She believed that for most students, mechanical playing came from having
      no destination in mind, and that once the destination was clear, the body would naturally find
      a way to lean into it. For your student specifically, I'd suggest a DeLay-style intervention
      first: ask him to sing or speak the phrase and notice where his voice naturally pushes and
      pulls before the bow touches the string. Cello pedagogy (particularly the Casals tradition —
      'think of the music as a language with its own prosody') is also worth borrowing here: have
      him speak the phrase rhythm as if it were a sentence, feeling where the syllables cluster and
      where they open up. Then re-map that onto the bow. If that doesn't unlock it, move toward
      Galamian: practice with extreme subdivision (eighth note triplets against the beat) to give
      him a felt sense of time flowing rather than clicking.
    expected_abstract: |-
      This is a very common issue and usually reflects a difference between metronomic time and
      musical time. The student is probably measuring beats from the outside rather than feeling
      pulse from the inside. A few approaches tend to work well. First, have him sing or hum the
      phrase without the instrument — the voice naturally finds inflection and doesn't default to
      metronomic counting. Then ask him to identify where the phrase is going: which note is the
      goal, and which notes are leading toward or away from it? Once there's a destination, the
      rhythm naturally becomes a vehicle rather than a grid. Second, work on bow distribution as a
      way of encoding phrasing physically: if the bow speeds up slightly toward a phrase peak and
      releases afterward, the rhythm will feel alive because it's tied to a physical gesture with
      direction. Third, practice without counting at all — use a drone and just feel the harmonic
      tension and release as a guide to pacing. Mechanical rhythm often comes from over-reliance on
      counting as a security blanket; removing that crutch and replacing it with harmonic listening
      can be transformative.
- id: exemplar_reasoning_075
  paraphrases:
  - |-
    I'm working on a combinatorics problem and I keep getting stuck trying to find a clean proof. I have a result that seems obviously true when I draw small cases, but I can't find a way to make it rigorous. Should I try to find a bijection, or is there a more algebraic path forward?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: train
    expected_exemplar: |-
      This is a classic tension in combinatorics, and it maps almost perfectly onto how two very
      different schools of thought approach the field. On one side, you have someone like Doron
      Zeilberger, whose entire philosophy is that combinatorics should be made mechanical and
      algebraic — if you can express your identity in terms of generating functions or
      hypergeometric series, Zeilberger's algorithm can often just verify or even discover the proof
      for you. He'd push you toward the algebraic path: encode your combinatorial objects as
      coefficients, find a recurrence or a closed form, and let the algebra do the work. But then
      there's the bijective tradition championed by people like Richard Stanley or, even more
      forcefully, by the Dutch and Israeli schools of combinatorics influenced by figures like Ira
      Gessel and Dominique Foata. Their instinct is that a bijective proof is the 'real' proof —
      it's the one that reveals why the identity is true, not just that it is. Foata's famous
      bijection on permutations, for example, doesn't just prove that cycle index equals descent
      polynomial — it shows you the structure underneath. The practical answer: if your result feels
      'obviously true' when you draw cases, that intuition is usually pointing at structure, which
      means a bijection probably exists and is probably illuminating. Start there. If you bang your
      head against the bijective proof for a while and the objects keep feeling slippery, that's
      your signal to switch to Zeilberger mode and let generating functions carry it. Sometimes the
      algebraic proof comes first and the bijective proof gets reconstructed from it — and that's
      fine.
    expected_abstract: |-
      Both approaches are legitimate, and the right choice depends on the nature of your problem.
      Bijective proofs are elegant and often more illuminating because they establish a direct
      structural correspondence between the objects being counted — when you find one, you
      understand not just that two quantities are equal but why. Algebraic approaches via generating
      functions or recurrences, on the other hand, can be more systematic and are sometimes the only
      tractable path when the combinatorial objects are hard to manipulate directly. A practical
      heuristic: if your small cases suggest a natural pairing or matching between objects, pursue
      the bijection. Try to make the correspondence explicit for n=3 or n=4 and see if it
      generalizes. If the objects feel resistant to direct manipulation, or if the problem has a
      recursive flavor, try encoding your sequence as a generating function and look for a
      functional equation. Often the algebraic approach can give you the result faster, after which
      you may be able to reverse-engineer a more intuitive bijective argument.
- id: exemplar_reasoning_076
  paraphrases:
  - |-
    My research team keeps generating data that's messy and hard to interpret — lots of noise, inconsistent patterns. Should we collect more data, or is there something wrong with how we're thinking about the problem?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: stylistic_attribution
    specificity: direct
    split: train
    expected_exemplar: |-
      This dilemma has a distinctly Kuhnian texture to it — when data keeps coming back messy and
      uninterpretable, Kuhn would say you might be in a pre-paradigmatic phase, where you lack the
      conceptual framework to even know what clean results would look like. More data won't fix
      that; it just gives you more noise. The remedy is theoretical clarification, not more
      measurement. Contrast that with a more Baconian instinct, which is to collect more data and
      let patterns emerge inductively — that approach works when the phenomenon is real but weakly
      measured, and you just need scale to see the signal. The question to ask yourself is: do you
      have a clear enough model of the mechanism that you'd recognize a clean result if you saw one?
      If not, you're probably Kuhn's problem. Richard Feynman had a memorable version of this
      critique — he called it 'cargo cult science,' where researchers go through the motions of data
      collection without a precise enough question to constrain what counts as an answer. Before
      running more experiments, try writing down exactly what pattern in the data would confirm or
      disconfirm your hypothesis. If you can't write that down cleanly, you have a conceptual
      problem, not a data problem.
    expected_abstract: |-
      More data is rarely the answer when results are already noisy and hard to interpret — it
      typically amplifies noise alongside signal. Before collecting more, sharpen the theoretical
      question: write down explicitly what outcome would confirm or disconfirm your hypothesis. If
      you can't articulate that clearly, the problem is conceptual, not empirical. Review whether
      your measurement instruments are reliable and valid for the phenomenon you're studying. Check
      whether your operational definitions of key variables are precise enough to produce consistent
      readings. It's also worth asking whether you're measuring a single phenomenon or inadvertently
      conflating several distinct ones — heterogeneous populations or mixed causal pathways are
      common sources of incoherent patterns. Once the question is crisp and the measurement valid,
      then additional data becomes useful.
- id: exemplar_reasoning_077
  paraphrases:
  - |-
    I'm developing a new dish that's basically grilled eggplant with a yogurt sauce and some kind of herb element. It feels safe. How do I push it into something more interesting without overcomplicating it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: train
    expected_exemplar: |-
      You're sitting right at the intersection of two very different culinary philosophies, and
      comparing them might help you figure out which direction to push. Yotam Ottolenghi — whose
      whole identity is built around exactly this flavor territory — would push you toward abundance
      and contrast within the same register. He'd say the dish is safe because it's not committing
      hard enough to what it already is. His move would be to intensify: char the eggplant more
      aggressively until it's almost collapsing, introduce a second textural element (perhaps crispy
      shallots or toasted pine nuts for crunch), and then use herbs not as a garnish but as a bulk
      ingredient — a whole pile of fresh dill and parsley, not a sprinkle. He'd probably add
      something with acidity and sweetness in tension, like pomegranate molasses or preserved lemon
      in the yogurt. The result is maximalist but still coherent because every element amplifies the
      same Middle Eastern flavor logic. Ferran Adrià, coming from the opposite direction, would say
      the dish is safe because you're not questioning any of its assumptions. He'd ask: what if the
      yogurt is warm, or aerated into a foam? What if the eggplant is presented as a gel or a
      transparent slice? What if the herb element arrives as a cold oil dropped tableside? His
      intervention isn't about adding more flavor — it's about making familiar flavors strange
      through unexpected form or temperature contrast. For a practical cook, Ottolenghi's lens is
      probably more immediately useful: commit harder to the dish's own logic, add textural
      contrast, and treat herbs as a primary ingredient rather than a garnish. But if the dish
      already has great flavor and you want to surprise a sophisticated diner, Adrià's question —
      'what if this element were in a different form?' — is worth sitting with.
    expected_abstract: |-
      The dish feels safe probably because each element is doing only one job. Eggplant provides
      smokiness and soft texture, yogurt provides creaminess and tang, herbs provide freshness — but
      nothing is creating tension or surprise. A few directions to make it more interesting without
      overcomplicating it: 1. **Introduce contrast within a single element.** The eggplant can be
      both very charred and very creamy — slice it thickly, grill hard on the outside, and let it
      steam in foil after so the interior is almost custardy. Now it has two textures in one
      component. 2. **Make the yogurt work harder.** Add warm spices (cumin, coriander), something
      acidic (preserved lemon or sumac), or something allium-forward (garlic confit) to give it a
      distinct character rather than just acting as a backdrop. 3. **Use the herb element for
      structural contrast, not garnish.** A large pile of torn fresh herbs — dill, mint, flat-leaf
      parsley — served almost like a salad on top gives freshness and bulk that changes the eating
      experience. 4. **Add a contrasting texture and a flavor bridge.** Crispy chickpeas, toasted
      walnuts, or fried capers give crunch, and they can also carry a flavor (smokiness, bitterness)
      that connects back to the eggplant. The underlying principle: look for one element in the dish
      that could do double duty — texture and flavor, temperature contrast, or sweet-acid-salt
      complexity — and push that one thing harder.
- id: exemplar_reasoning_078
  paraphrases:
  - |-
    I'm trying to decide whether to prove this combinatorics result using algebraic methods or a direct counting/bijection argument. The result involves counting lattice paths with certain restrictions. What are the trade-offs between these approaches, and which would you lean toward?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is a classic tension in combinatorics between what you might call the algebraic tradition
      — championed by figures like Richard Stanley and the MIT/Harvard school — and the bijective
      combinatorics tradition associated with people like Doron Zeilberger and the work coming out
      of the Lothaire group and French combinatorics school. Stanley's approach (think Enumerative
      Combinatorics) would reach for generating functions, the transfer matrix method, or the kernel
      method — you get a clean closed form and the machinery often generalizes beautifully to
      q-analogs or multivariate extensions. The algebraic route tends to reveal deeper structural
      relationships: if you can express your lattice path count as the coefficient of a symmetric
      function or via the Lindström–Gessel–Viennot lemma, you're likely seeing something about a
      broader family of results. Zeilberger and the bijective school would insist you're not done
      until you have a combinatorial proof — a weight-preserving bijection that 'explains' the
      identity rather than just verifying it. The bijective approach (think Foata's bijections, or
      the cycle lemma for ballot sequences) gives you a proof that's often shorter, more memorable,
      and more robust to generalizations involving symmetry. Zeilberger would say an algebraic proof
      tells you *that* something is true; a bijection tells you *why*. For lattice paths with
      restrictions specifically, I'd lean bijective first — the cycle lemma and the reflection
      principle are extraordinarily powerful here (Lindström-style), and the bijections often point
      toward q-analogs naturally. But if you're hoping to generalize to weighted paths or need the
      result as a module in a larger algebraic argument, Stanley's generating function machinery
      will serve you better.
    expected_abstract: |-
      The trade-off between algebraic and bijective/direct counting approaches is real and worth
      thinking through carefully. Algebraic methods (generating functions, transfer matrices, the
      kernel method) are powerful when you need a closed form, when the recurrence structure of the
      paths is clear, or when you want to generalize — for instance, to weighted paths or q-analogs.
      They tend to compose well with other algebraic machinery and can handle complexity that
      resists direct counting. Bijective or direct counting arguments have the advantage of being
      'explanatory': a weight-preserving bijection tells you structurally why two sets have the same
      size, not just that they do. They're often shorter and more elegant, and the bijection itself
      can reveal symmetry or structure that algebraic manipulation hides. For lattice paths with
      restrictions, classical techniques like the reflection principle or the cycle lemma are very
      well-suited and frequently yield strikingly clean proofs. For lattice paths with restrictions,
      I'd suggest trying the bijective route first — the reflection principle is tailor-made for
      this setting and often gives a one-page proof. If your restrictions are complex enough that no
      natural reflection or bijection presents itself, or if you need the result to interface with
      generating function machinery elsewhere in your argument, then the algebraic approach becomes
      preferable.
- id: exemplar_reasoning_079
  paraphrases:
  - |-
    I'm writing a code review for a junior engineer. Their solution works perfectly but uses very clever bit manipulation tricks to squeeze out performance. I want to give feedback that's fair to both the performance win and the readability cost. How should I frame this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: train
    expected_exemplar: |-
      This is exactly the tension that Knuth and Kernighan represent two poles of — and both have
      canonical quotes that are genuinely useful to invoke here, because they're not actually saying
      opposite things even though they're often read that way. Knuth's famous line is 'premature
      optimization is the root of all evil' — but the full quote continues: '...yet we should not
      pass up our opportunities in that critical 3%.' He was arguing against *undisciplined*
      optimization, not against performance work that's been validated. If your junior engineer has
      actually measured that this hotpath matters, Knuth would approve of the bit manipulation; if
      they reached for it speculatively, the optimization is premature regardless of whether it
      works. Kernighan's heuristic from *The Practice of Programming* is almost complementary: he
      frames clever code as a liability because the person who has to debug it is often yourself at
      2am six months later, and you will have forgotten the trick. His framing gives you a tactful
      way to give feedback that isn't 'this is wrong' but rather 'this is a debt with a known cost.'
      I'd structure your review around this: first, ask explicitly whether there's a performance
      measurement justifying this — if there is, acknowledge the engineering judgment. Then invoke
      the Kernighan framing: require a comment that explains the bit trick fully (what it does, why
      it works, what invariant it depends on). This transforms clever code into documented code,
      which is a different category. The junior engineer learns that cleverness needs to be paid for
      in documentation, which is a durable lesson regardless of whether the optimization survives
      the next refactor.
    expected_abstract: |-
      A fair code review here should separate the two concerns — correctness and performance on one
      axis, maintainability on the other — rather than treating them as a single judgment. Start by
      acknowledging what's working: the solution is correct and demonstrates real understanding of
      low-level performance. That's worth naming explicitly, especially for a junior engineer,
      because you want to reinforce the instinct to think about performance. Then raise the
      maintainability cost as a *tradeoff*, not a mistake. Bit manipulation tricks have a specific
      failure mode: the next person to touch this code (possibly them, six months from now) will
      need to reconstruct the logic from scratch. The optimization has a carrying cost in the form
      of comprehension time. The concrete ask: either add a comment that fully explains the trick —
      what it does, what mathematical property it relies on, and what constraints must hold for it
      to be correct — or, if this path isn't actually a measured bottleneck, consider whether the
      readable version is acceptable. Frame it as a question: 'Have you profiled this and confirmed
      this is a hotpath?' That teaches the habit of measurement without implying the work was
      wasted. The goal is to leave them feeling that the performance instinct is good and that
      clever code has a specific cost that can be paid explicitly through documentation and
      justification.
- id: exemplar_reasoning_080
  paraphrases:
  - |-
    I'm renovating an old industrial warehouse into a home. My architect keeps pushing to expose everything — ducts, beams, raw concrete — but I also want it to actually feel livable. Is there a middle ground, or do I have to choose a side?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: train
    expected_exemplar: |-
      You're caught between two distinct philosophies that have actually produced very different
      buildings. Your architect is channeling a Loft Brutalism tradition — think early Richard
      Rogers or the raw Pompidou aesthetic — where exposing every system is an honest declaration of
      what the building IS. Nothing is hidden, nothing performs domesticity. It's intellectually
      rigorous and visually powerful, but it demands you inhabit the building on its own terms. The
      alternative has a strong champion in Carlo Scarpa, and more recently in designers like
      Annabelle Selldorf, who work with the tension between industrial heritage and domestic
      refinement. Scarpa's approach was never about erasure — he wouldn't hide the warehouse — but
      he'd introduce a layer of carefully crafted insertions that create contrast: smooth plaster
      against rough brick, a precise timber element against raw steel. The original fabric becomes
      background; the new domestic layer becomes figure. You read both, but they don't fight. That
      contrast-based approach is your middle ground, and it's actually more sophisticated than
      either pure option. The trick is to avoid compromise — don't soften the industrial elements,
      and don't make the domestic insertions timid. Keep the exposed concrete hard and real; make
      your kitchen joinery or bedroom volume something precise and beautifully made. The livability
      comes from the new elements, not from softening the old ones. Choose a few strategic moments
      to 'complete' and leave the rest raw.
    expected_abstract: |-
      There's absolutely a middle ground, and it's often more interesting than either extreme. The
      key is to distinguish between what you reveal and what you resolve. Industrial elements like
      exposed beams, concrete, and brick can remain raw and visible while you address the functional
      requirements for comfort separately — through radiant floor heating instead of exposed
      ductwork, through acoustic panels integrated into new partitions, through lighting design that
      warms the space without hiding its bones. The mistake to avoid is halfway measures: partially
      concealing ducts in a dropped ceiling that's neither raw nor finished, or adding soft
      furnishings to compensate for a space that's actually too cold or loud. Instead, be
      intentional about which systems stay exposed (structure, often fine) and which get resolved
      through good design (HVAC, acoustics, thermal comfort). Insert new domestic elements — a
      kitchen block, a sleeping loft, built-in storage — as precise, well-crafted objects that
      contrast with the raw shell. The livability comes from those insertions, not from taming the
      warehouse itself.
- id: exemplar_reasoning_081
  paraphrases:
  - |-
    I'm a jazz trumpet player and I'm trying to figure out whether to prioritize learning a huge repertoire of standards or to go deep on a small number of tunes until I really own them. What's the better approach for developing as an improviser?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: train
    expected_exemplar: |-
      This is one of the central strategic tensions in jazz development, and two of the greatest
      trumpet voices embody opposite answers in revealing ways. Miles Davis was famously a 'deep'
      player — he recorded certain standards like 'All Blues' or 'Autumn Leaves' dozens of times
      across decades, and each rendition showed him finding new space inside familiar harmony. His
      philosophy was that real improvisation requires knowing the tune so deeply it disappears as a
      constraint, leaving you free to just play. He was suspicious of players who knew hundreds of
      tunes superficially and said you could hear the 'running changes' in their playing —
      technically correct but not saying anything. Clifford Brown took the opposite path: he was
      known for his encyclopedic knowledge of harmonic vocabulary and standards, and his approach
      was that breadth gave you the cross-referencing ability to hear new substitutions and melodic
      possibilities. His solos are densely allusive, drawing on a huge internal library. The honest
      answer is that your current weakness determines which deficiency to fix first. If you're
      already fluent — if you can navigate changes without thinking about them — go deep like Miles
      and find your own voice inside the songs. If you still feel harmonically uncertain or run out
      of ideas quickly, Brown's breadth-first approach gives you more vocabulary to draw on. Most
      serious teachers recommend owning about 30-40 tunes deeply as a foundation before chasing
      breadth.
    expected_abstract: |-
      Both paths have real merit and the best answer depends on where you currently are as a player.
      Going broad — learning lots of standards — builds harmonic fluency, gives you more material to
      draw on, and makes you hireable for gigs. You start to see patterns across tunes: how rhythm
      changes work, how ii-V-I progressions resolve in different keys, how melodies hint at the
      harmony. Going deep on a small number of tunes builds something different: the ability to
      truly improvise rather than pattern-match, because you're not thinking about what comes next
      harmonically — you already know it in your body. Most working musicians find that a foundation
      of around 30 to 50 tunes you really own is more valuable than a vague familiarity with 200.
      The recommendation is usually to go deep first: pick 20 core standards, learn them in every
      key if you can, transcribe solos over them, and play them until you stop thinking and start
      listening. Then expand your repertoire from that solid base.
- id: exemplar_reasoning_082
  paraphrases:
  - |-
    I'm making a braise and I can't decide whether to reduce the braising liquid into a glossy sauce or serve it as a looser, brothier jus. How do I know which is right for the dish?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is really the question of whether you want to cook like Thomas Keller or like fergus
      Henderson, and the answer lives in the protein and the context. Keller's French Laundry
      approach would almost certainly reduce: every braising liquid gets clarified, skimmed
      obsessively, and reduced to a tight, concentrated sauce with a lacquer-like consistency that
      coats the meat and the plate in a way that signals precision and luxury. The glossy reduction
      is a statement of control. Henderson's whole nose-to-tail philosophy at St. John goes the
      other way — his braises often arrive in deep, generous pools of loose, gelatinous jus, cloudy
      and rustic, with big hunks of bread implied nearby. The looseness is the point; it signals
      generosity, informality, and respect for the animal's natural flavors rather than
      transformation of them. As a rule: if the meat is refined and the plate is composed, reduce.
      If the dish is peasant-rooted — a pork shoulder, a lamb neck, a tripe — serve it with its
      natural liquid and let the bread do the work. The braising liquid of a short rib à la Keller
      should coat a spoon; the braising liquid of Henderson's rolled pig's spleen should pool.
    expected_abstract: |-
      The right choice depends on the nature of the protein, the dish's register, and how the liquid
      tastes as-is. Start by tasting the braising liquid before you decide anything. If it's already
      well-seasoned and has good body from collagen — which it should after a proper braise — it may
      be perfectly delicious as a loose jus, especially for rustic, hearty dishes where abundance
      and informality are part of the appeal. A brothier finish suits cuts with a lot of gelatin
      like pork shoulder or lamb shank, where the liquid itself is fatty and unctuous. Reduction
      concentrates flavor and adds gloss, which suits refined or composed plates — but it also
      concentrates salt, so you need to account for that. A middle path is to strain and degrease
      the liquid, then reduce it only halfway: enough to intensify and tighten without losing the
      sense of a living, natural sauce. The plate size and accompaniments matter too — a loose jus
      needs something absorbent, while a tight reduction can stand alone as a glossy accent.
- id: exemplar_reasoning_083
  paraphrases:
  - |-
    My bread crust is pale and soft even at high oven temperatures. What tradition or method should I be looking at to fix this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: school_tradition
    specificity: direct
    split: train
    expected_exemplar: |-
      This is a classic steam-and-hearth problem that the French boulangerie tradition solved
      centuries ago and that American artisan bakers systematically rediscovered starting in the
      1980s. The pale, soft crust diagnosis almost always comes down to two things: insufficient
      steam in the first 15–20 minutes of baking, and insufficient bottom heat. The French
      hearth-baking tradition (the tradition of Poilâne in Paris, and formalized in American
      practice by Chad Robertson at Tartine and the teaching at the San Francisco Baking Institute)
      treats the oven as a steam chamber first. In a deck oven, the masonry retains heat and the
      baker injects steam at the start — the steam keeps the crust extensible so the loaf springs
      fully, then the steam is vented and the crust dries and caramelizes through Maillard
      reactions. At home, the Dutch oven method — which Robertson popularized in his Tartine Bread
      book — replicates this by trapping the loaf's own steam in a preheated cast-iron vessel for
      the first 20 minutes. The crust browns because the enclosed environment is saturated with
      steam from the dough itself. The Viennese baking tradition (which actually introduced steam
      injection to French baking in the 19th century) was particularly focused on crust gloss and
      color. If you're not using a Dutch oven, you need an aggressive steam source — a preheated pan
      of boiling water on the oven floor, or lava rocks — and a baking steel or stone for bottom
      heat.
    expected_abstract: |-
      A pale, soft crust almost always means not enough steam at the start of the bake and not
      enough bottom heat. Steam is critical in the first 15–20 minutes: it keeps the surface of the
      dough moist and extensible while the loaf oven-springs, and then when it dissipates, the dry
      heat drives the Maillard browning and caramelization that give you a dark, crackly crust. To
      add steam at home, use a preheated Dutch oven with a lid for the first 20 minutes of baking,
      then remove the lid to finish. Alternatively, place a heavy pan on the oven floor when
      preheating and pour boiling water into it right when you load the bread. For bottom heat, bake
      on a preheated baking stone or steel rather than a cold sheet pan. Make sure your oven is
      fully preheated — at least 45 minutes at 475–500°F — and use an oven thermometer to verify
      actual temperature.
- id: exemplar_reasoning_084
  paraphrases:
  - |-
    I'm writing a short story set in a claustrophobic apartment and I want the setting itself to feel threatening — like the walls are closing in — without relying on supernatural horror. How do I do that through prose rather than plot?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: school_tradition
    specificity: implicit
    split: train
    expected_exemplar: |-
      What you're describing is essentially the domestic uncanny, and the French New Novel —
      Robbe-Grillet, Sarraute, Duras — mastered exactly this. The école du regard approach would
      have you describe the apartment with obsessive, clinical precision: not 'a cramped kitchen'
      but exact measurements, the precise angle of a door, the specific pattern of water stains.
      Robbe-Grillet would enumerate objects as if cataloguing evidence, refusing to assign emotional
      meaning, which paradoxically makes readers supply their own dread. The geometry itself becomes
      sinister through sheer accumulation of detail. Duras takes a different route within the same
      tradition — she strips sentences down to almost nothing, uses white space, repetition, and a
      flat affectless register that makes the mundane feel unbearable. The apartment doesn't
      threaten; it simply persists, which is worse. A third option from the same tradition is
      Sarraute's tropisms — those tiny involuntary movements of consciousness triggered by objects.
      You'd render the character's micro-responses to a particular chair or a window latch, making
      the setting feel sentient without any supernatural machinery. The key is that all three
      approaches refuse metaphor and refuse to editorialise: no 'oppressive silence.' The prose
      enacts the oppression structurally.
    expected_abstract: |-
      To make a setting feel threatening through prose alone, focus on description that withholds
      comfort. Describe the space with clinical, exhaustive precision — exact dimensions, textures,
      the inventory of objects — so the reader feels trapped inside the inventory. Vary sentence
      rhythm to control claustrophobia: long accumulating sentences tighten the space, then short
      ones snap shut. Anchor the threat in sensory specifics — sounds that repeat, smells that don't
      dissipate, light that doesn't change. Avoid emotional editorialising; instead of 'the room
      felt oppressive,' describe the low ceiling's exact height and let the reader feel it. Use the
      character's attention as a camera: the more they fixate on particular objects, the more the
      reader fixates. Repetition is especially powerful — the same detail surfacing across scenes
      makes the apartment feel inescapable. The goal is to make the physical world feel indifferent
      but inescapable rather than actively hostile.
- id: exemplar_reasoning_085
  paraphrases:
  - |-
    I'm arranging a jazz standard for a small combo and I'm torn between keeping the harmony dense and chromatic versus stripping it back to simpler voicings. What's the trade-off and when does each approach serve the music better?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: train
    expected_exemplar: |-
      You're essentially navigating the fault line between two major schools in jazz harmony. The
      post-bop tradition, most fully developed by pianists like McCoy Tyner and Herbie Hancock,
      treats dense, chromatic voicings — quartal harmony, altered dominants, stacked extensions — as
      a way of maximizing color and tension. This approach suits music where the soloists are
      expected to navigate complex harmonic terrain; it creates a rich, turbulent bed that rewards
      adventurous improvisation. On the other end, the Count Basie 'less is more' philosophy —
      carried forward in different ways by Ahmad Jamal and later Brad Mehldau — treats space and
      simplicity as expressive tools. Stripped voicings let the rhythm section breathe, give the
      soloist more harmonic room, and can make a single well-placed chord extension land with
      enormous impact precisely because it's surrounded by space. For a small combo, the practical
      answer is usually closer to the Basie-Jamal axis: with fewer instruments, dense harmony
      quickly becomes muddy, and the bass player needs room to define the changes. Save chromatic
      complexity for peak moments of your arrangement.
    expected_abstract: |-
      The trade-off comes down to textural density versus clarity. Dense, chromatic voicings add
      color and harmonic interest but can clutter a small ensemble's sound, especially when a bass
      and soloist are already defining the harmonic space. Simpler voicings leave room for the
      rhythm to breathe and allow melodic lines to stand out more clearly. A good rule of thumb: use
      richer, more complex voicings for transitional or climactic moments where you want maximum
      tension or color, and pull back to sparser voicings on straightforward sections where groove
      and clarity matter more. The size of your ensemble should generally pull you toward restraint
      — the fewer players, the more each voicing needs to justify its density.
- id: exemplar_reasoning_086
  paraphrases:
  - |-
    I'm trying to decide whether to sacrifice a pawn for long-term positional pressure or hold the material and defend. How do I think about this trade-off?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is exactly the tension that separates the Tal school from the Petrosian school — and
      understanding both helps clarify the decision. Mikhail Tal believed that concrete dynamic
      compensation almost always justifies a material investment: if the resulting position gives
      you active piece play, initiative, and psychological pressure, the pawn is just a number on a
      scoreboard. He'd ask: 'Does this sacrifice force my opponent onto the back foot permanently?'
      Tigran Petrosian, by contrast, was the supreme practitioner of prophylactic thinking — he'd
      give up the pawn only if he could visualize a clear path to fortress-like counterplay, and
      more often he'd find ways to maintain the tension without conceding anything. His approach:
      tighten the position until the opponent's pieces become passive, then grind. The Tal heuristic
      is better when your opponent's king is exposed or your pieces have clear invasion squares. The
      Petrosian heuristic wins when the position is closed, exchanges favor you long-term, and time
      pressure may induce errors in your opponent. Ask yourself: is this a sharp tactical storm
      (Tal) or a slow constriction (Petrosian)? That framing usually answers the question.
    expected_abstract: |-
      The decision depends on what kind of compensation you're getting for the pawn. You want to
      assess whether the resulting position gives you concrete benefits — active piece placement,
      open files for your rooks, attacking chances against the king, or a strong passed pawn
      elsewhere. If those benefits are clear and durable, sacrificing makes sense. If the position
      is closed and the compensation is vague or temporary, holding the material and defending is
      usually correct. Key questions: Are your pieces more active after the sacrifice? Does your
      opponent have weaknesses you can target? Is your king safe? If the answer to those is yes, the
      dynamic approach is justified. If not, solid defense and material preservation is the sounder
      path.
- id: exemplar_reasoning_087
  paraphrases:
  - |-
    I have a position where I've traded off my bishops for my opponent's knights, and now I have a closed, locked pawn structure in the center. My pieces feel a bit awkward. What should my plan be here?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: train
    expected_exemplar: |-
      This setup has a distinctly Petrosian feel to it — Tigran Petrosian built his entire career
      around exactly this kind of prophylactic, knight-friendly closed position. The key insight he
      embodied is that in locked pawn structures, knights outshine bishops because they can hop over
      the barricades while bishops stare helplessly at their own pawns. Petrosian would tell you:
      don't rush. Maneuver your knights to strong central outposts — d5, e4, or wherever the pawns
      can't chase them — and slowly improve your king and rooks on half-open files. There's also a
      strong Karpov parallel here: Karpov's positional mastery in these structures involved a
      technique called 'improving the worst piece.' Every move, ask which of your pieces is doing
      the least, and find it a better square. The plan isn't a fireworks attack — it's a slow
      squeeze. Once your knights dominate the outposts and your opponent's bishops are biting on
      granite, the structural advantage will convert itself. Avoid opening the position at all
      costs; that's the one thing that would let your opponent's bishop pair come alive.
    expected_abstract: |-
      In a closed, locked pawn structure where you've traded bishops for knights, the knights become
      relatively stronger because they can maneuver over the fixed pawns while long-range bishops
      are blocked. Your plan should be to place your knights on stable central outposts — squares
      the opponent's pawns cannot attack. Look for squares like d5 or e4 where a knight can sit for
      a long time. Meanwhile, keep the center locked: avoid pawn trades that would open diagonals
      and reactivate the opposing side's pieces. Use your rooks on half-open files and gradually
      improve every piece to its optimal square. Patience is essential here — the advantage is
      structural, so the conversion will be slow and positional rather than tactical.
- id: exemplar_reasoning_088
  paraphrases:
  - |-
    When I'm working on a hard unsolved problem, should I try to generalize it first (embed it in a broader framework) or should I look for the simplest special case I can actually solve? I always get paralyzed choosing between these two directions.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: train
    expected_exemplar: |-
      You've identified one of the deepest stylistic splits in mathematical research, and it maps
      pretty cleanly onto the contrast between Grothendieck's approach and Erdős's approach.
      Grothendieck was the supreme generalizer. His instinct was always to find the 'right' level of
      abstraction where the problem becomes inevitable — where it essentially proves itself because
      you've built the correct machinery around it. His work on schemes, for instance, wasn't about
      solving one geometry problem but about building a universe in which whole classes of problems
      dissolved. The danger is what some call 'Grothendieck's problem': you spend years building a
      cathedral and the original problem was only the excuse. If you're the kind of person who sees
      the general structure clearly and finds abstraction energizing rather than exhausting, and if
      your problem feels like it's hard because the right language doesn't exist yet, generalize
      first. Erdős was the opposite. He believed in getting his hands dirty with the smallest
      concrete case, finding an elementary proof, and then seeing what the proof actually used. His
      problems are often simple to state and his proofs are often elementary — but the elementary
      proof reveals the combinatorial heart of the matter in a way that a general framework might
      obscure. If your problem has a concrete combinatorial or extremal character, finding the
      simplest non-trivial case is often where the real insight lives. A useful self-diagnostic:
      does your problem feel hard because the framework is wrong (Grothendieck territory) or because
      you haven't found the clever trick yet (Erdős territory)? And honestly, many mathematicians
      like Tao do both — they move between levels of abstraction fluidly — but starting with the
      special case usually gives you something to push against even if you eventually generalize.
    expected_abstract: |-
      This is a genuine strategic tension in mathematical research, and both directions are valid —
      the right choice depends on the nature of the problem and your own cognitive style.
      Generalizing first works well when the difficulty seems to come from insufficient abstraction:
      the problem is hard because the right framework doesn't exist yet, and once you embed it in a
      richer structure, the proof becomes more natural. The risk is that you invest heavily in
      machinery that may not pay off, and you can lose sight of what you originally wanted to prove.
      Looking for special cases first works well when the problem has concrete structure you can
      explore, and when you're not yet sure what the key obstruction is. Solving a simpler version
      often reveals exactly which ingredient is responsible for the difficulty, giving you a clear
      target when you generalize. The risk is getting stuck in cases that are too easy to illuminate
      the hard part. A useful heuristic: if you can articulate precisely why the general case is
      harder than the special case, generalize — you know what you're fighting. If the difficulty
      feels diffuse or mysterious, go to special cases until you can see the obstacle clearly. Many
      successful proofs move back and forth between the two: establishing the strategy on a special
      case, then identifying which lemmas need to be proved in full generality.
- id: exemplar_reasoning_089
  paraphrases:
  - |-
    I have two different proofs of the same theorem — one is a slick, one-page algebraic manipulation, and the other is a longer geometric argument that makes it visually obvious why the result is true. My advisor says to just go with the short one, but something feels lost. Which should I include in my paper?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This tension maps onto one of the deepest stylistic fault lines in mathematics: the Erdős vs.
      Gowers divide, or more broadly, the 'slick algebraist' versus the 'geometric illuminator.'
      Erdős famously prized brevity and elegance — the one-page algebraic proof is exactly what he'd
      call a proof from The Book, a perfect instrument. But Gowers and others in the 'low-theory'
      tradition have argued forcefully that proofs should explain, not just verify. A proof that
      makes you say 'oh, of course!' has a different value than one that makes you say 'impressive.'
      Grothendieck's philosophy went even further — he would strip away the clever manipulation
      entirely in favor of a framework where the result becomes inevitable, no tricks needed. Your
      geometric proof is in that tradition: it makes the theorem feel necessary rather than just
      true. If space permits, the Thurston approach is instructive here — he consistently argued in
      his essay 'On Proof and Progress in Mathematics' that mathematical understanding is the real
      deliverable, not the certificate of correctness. I'd advocate for including both, framing the
      algebraic proof for the verification-minded reader and the geometric one as the explanation.
      Your advisor isn't wrong, but she may be optimizing for journal space rather than mathematical
      culture.
    expected_abstract: |-
      Both proofs have real value, and the choice depends on what you want the paper to accomplish.
      The short algebraic proof is more efficient and easier for readers to verify — it gets the
      result on record cleanly. But a longer geometric proof that makes the result intuitively
      obvious serves a different purpose: it builds understanding, not just confirmation. A paper
      aimed at specialists who just need to trust the result can lean on the algebraic version. A
      paper aimed at readers who will build on this result, or who might apply the intuition
      elsewhere, benefits from the geometric argument. If the journal allows it, including both —
      perhaps the geometric one in the body and the algebraic one as a remark — is often the right
      move. You're not obligated to pick just one mode of explanation.
- id: exemplar_reasoning_090
  paraphrases:
  - |-
    I have a function that's grown to about 400 lines with nested conditionals and multiple responsibilities. What's the best way to break it down?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: school_tradition
    specificity: implicit
    split: train
    expected_exemplar: |-
      This is a classic situation where the Unix philosophy and the discipline Kent Beck codified in
      'Refactoring' are most instructive. The Unix school — inherited by practitioners like Rob Pike
      and the Plan 9 team — is almost dogmatic about single-purpose units: each function should do
      one thing and do it well enough that you could describe it in a single, plain sentence. They'd
      look at your 400-line function and immediately ask 'what are the nouns here?' — extract each
      distinct data transformation or decision into its own named function, letting the names form a
      readable narrative. Beck's school goes further with the 'composed method' pattern: the
      top-level function should read like a prose outline, calling smaller functions whose names
      explain *what* is happening, leaving the *how* buried one level down. He'd also flag those
      nested conditionals as 'arrow code' — a smell cured by early returns and guard clauses.
      Separately, the Domain-Driven Design tradition (Evans, Fowler) would push you to ask whether
      those responsibilities correspond to distinct concepts in your domain model, suggesting they
      may belong in separate classes entirely, not just separate functions. Start with the DDD
      question to find the seams, then use Beck's composed-method discipline to clean up what
      remains.
    expected_abstract: |-
      A 400-line function with nested conditionals is a strong signal that it has multiple
      responsibilities and should be decomposed. Start by identifying distinct concerns: scan for
      clusters of variables and logic that don't interact with the rest, and extract each into a
      named helper function. Nested conditionals can often be flattened using early returns or guard
      clauses, which dramatically reduces cognitive load. If some responsibilities involve shared
      state or related data, consider whether they belong in a separate class or module rather than
      just a separate function. Aim for each unit to be describable in a single sentence — if you
      can't name it cleanly, it may still be doing too much. Commit and test after each extraction
      to keep the refactoring safe.
- id: exemplar_reasoning_091
  paraphrases:
  - |-
    I'm designing a community library for a small town. The city council wants it to feel both welcoming and monumental — like a civic landmark — but I'm worried those two goals are in tension. How do I resolve that?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This tension between the monumental and the welcoming is one of the central fault lines in
      20th-century civic architecture, and different schools have resolved it in opposite ways. The
      Brutalist tradition — think Alison and Peter Smithson or Paul Rudolph — would lean into the
      monumental without apology, using raw concrete and bold massing to assert civic presence,
      trusting that grandeur itself is a form of democratic respect. The risk is exactly what you
      fear: buildings that intimidate rather than invite. On the other end, the Finnish rationalist
      tradition exemplified by Alvar Aalto took a different stance entirely. His Viipuri Library and
      Rovaniemi Library show how civic gravitas can come from material warmth and sectional
      complexity rather than sheer mass — fanlight skylights, undulating wooden ceilings, a plan
      that draws you through space rather than confronting you with it. The building feels
      significant because of how carefully it attends to the human body, not because it looms. A
      third path is what the New Regionalism pursued — Charles Moore and later firms like Lake|Flato
      — which grounds civic identity in vernacular materials and local context, making the building
      feel rooted rather than imposed. For your small-town library, the Aalto approach is probably
      the most instructive: monumentality through sectional richness and natural light rather than
      through scale or mass. That way the building reads as a landmark from the street but pulls you
      in rather than stopping you at the door.
    expected_abstract: |-
      The tension between monumental and welcoming is real but resolvable. The key insight is that
      monumentality doesn't have to mean intimidation — it can come from clarity, proportion, and
      careful use of light rather than sheer scale. For a small-town library, consider using a
      strong, legible silhouette that reads as a landmark from a distance, but softening the entry
      sequence: step the approach down from the street, use natural materials at eye level, and make
      the threshold transparent so people can see activity inside before they commit to entering.
      Section can do a lot of work here — a tall, light-filled reading room creates a sense of
      occasion without making the exterior overbearing. Civic presence comes from permanence and
      intention; warmth comes from human-scaled detail and material honesty. You don't have to
      choose between them.
- id: exemplar_reasoning_092
  paraphrases:
  - |-
    I have a long, narrow urban lot — about 18 feet wide and 90 feet deep — and I need to fit a full single-family home on it. What's the best strategy for making the interior feel livable rather than like a corridor?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: train
    expected_exemplar: |-
      The long narrow lot is one of architecture's classic constraints and some of its most
      inventive solutions have come from working within exactly this footprint. Ryue Nishizawa's
      Moriyama House in Tokyo is the radical answer — he dissolved the single long volume into a
      cluster of small towers on the lot, connected by exterior paths. You move through the house
      partly outdoors, which makes the narrow footprint disappear because you're reading each tower
      as its own small room. The corridor problem vanishes because there is no corridor. If you need
      a more conventional envelope, the Japanese townhouse tradition — the machiya — offers
      centuries of accumulated wisdom. The key moves: a sky-well or tsuboniwa (small courtyard)
      punched at the midpoint of the depth to bring light and air into what would otherwise be the
      darkest, deadest middle of the plan. This one gesture transforms a corridor into a series of
      distinct rooms oriented toward light. Kengo Kuma and Tadao Ando have both worked with this
      logic in urban infill projects. Ando's approach more broadly is instructive: he treats the
      narrow section as a datum and cuts perpendicular to it. His row houses in Sumiyoshi use a
      courtyard inserted right at the middle third of the lot — the house is actually divided into
      two volumes with an open courtyard between them. Rain falls into your living space and you
      cross it to get from bedroom to bathroom. It's extreme, but the principle is sound: the
      cross-axis interruption is what defeats the corridor feeling. For a more pragmatic American
      vernacular, look at how New Orleans shotgun houses handle this: stagger the interior doors so
      no room looks straight through to the next, vary ceiling heights through the depth of the plan
      to create distinct spatial episodes, and put your most important living spaces at the rear
      where you've added a garden or deck to borrow exterior space. The worst thing you can do is
      align all the doors and put equal ceiling heights throughout — that's what makes it feel like
      a hallway.
    expected_abstract: |-
      The core challenge with a long narrow lot is defeating the corridor effect — the sense that
      you're always moving through rather than arriving somewhere. Here are the key strategies:
      **Break the depth into episodes.** Rather than one continuous flow, divide the 90-foot depth
      into three or four distinct spatial zones, each with a different character: public front zone,
      a middle transition with vertical emphasis or a stair, and a private rear zone. Vary ceiling
      heights between them — even a step up or down in floor level signals a threshold and creates
      the feeling of moving between rooms rather than through one long room. **Introduce cross-axis
      light.** The most common problem is a dark middle. Solve this by inserting a lightwell, a
      double-height space, or a skylight at the midpoint of the plan. If zoning allows, a small
      interior courtyard at the middle third transforms the darkest part of the plan into the most
      dramatic. **Offset or stagger openings.** Avoid aligning doors and windows on the long axis —
      this is what creates the gun-barrel visual effect. Offset doors between rooms so no view goes
      straight through the entire depth. **Borrow exterior space at the rear.** A rear yard, deck,
      or garden room extends the perceived depth of the living area. Glazing the rear wall of the
      main living space visually connects interior and exterior and makes the house feel much
      larger. **Keep circulation narrow and compress it.** A compact stair and tight hallway make
      the larger rooms feel generous by contrast. Don't sacrifice room width to a wide corridor — 36
      inches is enough for circulation.
- id: exemplar_reasoning_093
  paraphrases:
  - |-
    I'm writing a thriller where I need to build tension in a scene where nothing violent actually happens — two characters just have a conversation over dinner. How do I make the reader feel dread the whole way through?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: train
    expected_exemplar: |-
      This is a situation where thinking about how Le Carré and Highsmith each solve the problem
      points toward the answer. Le Carré builds dread through omission and professional courtesy —
      characters in his work say almost nothing of consequence, but the reader feels the weight of
      everything unspoken because the social register is so precisely calibrated. A dinner in Tinker
      Tailor is terrifying because everyone is being slightly too polite, and the politeness itself
      becomes the threat. Highsmith does something almost opposite: she embeds us so deeply in a
      character's distorted perception that ordinary objects and gestures become uncanny. In Ripley,
      you're afraid because you're seeing through eyes that misread everything, and the reader is
      always one step ahead of the character in perceiving danger. For your scene, the Le Carré
      approach means loading the dialogue with what isn't said — have one character conspicuously
      avoid a subject, or be too smooth when asked a direct question. The Highsmith approach means
      filtering through a perspective that is either unreliable or hyperaware, so that the clink of
      a fork carries menace. If you want maximum compression, you can layer them: keep the surface
      conversation banal and controlled while the POV character notices physical details with
      obsessive precision.
    expected_abstract: |-
      To sustain dread through a low-action scene, rely on subtext rather than action. Keep the
      surface dialogue pleasant or mundane while making it clear through narration or implication
      that one or both characters has a hidden agenda. Physical details can do a lot of work — have
      characters notice small things that seem off, like food going untouched or an answer that
      comes a beat too fast. Pacing matters too: shorter sentences and paragraphs create a sense of
      compression even without physical action. The reader's dread comes from dramatic irony —
      knowing or sensing more than what's being said — so make sure you've seeded enough prior
      context that the conversation reads as a performance both parties are putting on.
- id: exemplar_reasoning_094
  paraphrases:
  - |-
    My chicken stock always turns out cloudy and kind of greasy. I'm doing something wrong but I can't figure out what. How do I get that clear, golden restaurant-style stock?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: train
    expected_exemplar: |-
      Cloudiness and grease are two separate problems that often get conflated, and the French
      brigade approach — which Escoffier codified and which every classically trained chef from
      Fernand Point to Thomas Keller still follows — addresses them at different stages. Keller in
      particular is almost obsessive about this in The French Laundry Cookbook: he starts with cold
      water, never hot, and never lets the stock do more than a lazy shimmer — a full boil is what
      causes the proteins to emulsify into the liquid and create permanent cloudiness. Escoffier's
      original fonds de cuisine instructions also emphasize skimming the gray foam aggressively in
      the first 20 minutes, before it breaks up and disperses. For the grease, the classic technique
      is simply refrigeration: chill the finished stock overnight and the fat solidifies into a
      removable raft. If you're impatient, a wide shallow pan and a paper towel dragged across the
      surface works in a pinch. Start cold, keep it at a gentle tremble, skim early and often, and
      defat when cold.
    expected_abstract: |-
      Cloudiness and greasiness in stock come from two different causes. Cloudiness happens when
      proteins and starches are agitated into the liquid — the fix is to start with cold water
      rather than boiling, never let the stock reach a rolling boil (keep it at a bare simmer with
      just occasional bubbles), and skim off the gray foam that rises in the first 20–30 minutes
      before it dissolves back in. Greasy stock is simply a fat problem: let the finished stock cool
      completely, ideally overnight in the refrigerator, and the solidified fat layer will lift off
      cleanly. Using roasted bones also helps flavor without adding excessive fat, and avoiding
      starchy vegetables like potatoes keeps the stock from going murky.
- id: exemplar_reasoning_095
  paraphrases:
  - |-
    I'm working on a mixed-use development in a historic downtown. Half the stakeholders want contemporary architecture that signals investment and progress; the other half want contextual design that respects the existing streetscape. How do other architects typically navigate this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is the central argument of urban architecture for the last fifty years, and there are
      well-developed schools on each side with strong built examples you can point to. The
      Contextualist tradition — rooted in Colin Rowe's work at Cornell, later articulated by
      architects like Robert A.M. Stern and the New Urbanists — argues that the city is a fabric,
      and new buildings should reinforce it: match cornice lines, maintain street-wall continuity,
      use materials that age alongside their neighbors. At its best, this produces streets where new
      buildings genuinely belong. At its worst, it produces pastiche that neither honors history nor
      contributes anything new. On the other side is what you might call the Critical Contrast
      approach, best exemplified by Carlo Scarpa's insertions in Venice — and more recently by
      projects like David Chipperfield's Neues Museum restoration in Berlin — where the new makes
      itself legibly new precisely to honor the old. The argument is that honest contemporary work
      is more respectful than imitation: you're saying 'this is our moment, as the original building
      was its moment.' Rafael Moneo has written and built extensively from this position, and his
      work consistently finds a middle path: contemporary in material logic and spatial
      organization, but deeply attentive to scale, rhythm, and the grain of the existing city. For a
      historic downtown, Moneo's approach is probably your most useful model: accept contemporary
      expression but negotiate relentlessly on the urban parameters — height, setback, facade
      rhythm, material durability — that actually determine whether a building fits into a street
      rather than just imitating it.
    expected_abstract: |-
      This is one of the most common tensions in urban infill work and there's no universal answer,
      but there are some principles that tend to hold across contexts. The most important
      distinction is between formal expression — which can be contemporary — and urban parameters
      like scale, massing, street-wall continuity, and material durability, which should respond to
      the existing context regardless of aesthetic stance. A building can read as clearly new and
      contemporary while still matching the cornice height of its neighbors, maintaining a
      consistent build-to line, and using materials that age gracefully in the same climate as the
      surrounding buildings. The stakeholders who want contemporary architecture and the
      stakeholders who want contextual design are often actually talking past each other: one group
      is thinking about facade style, the other is thinking about street presence and neighborhood
      identity. If you separate those conversations — agreeing that the urban parameters are
      non-negotiable while leaving the architectural expression open — you often find much more room
      for agreement than the initial debate suggests.
- id: exemplar_reasoning_096
  paraphrases:
  - |-
    I'm a string quartet and we're preparing a Beethoven late quartet. We keep disagreeing about whether to play with a very unified, blended sound or to let individual voices assert themselves more independently. Is there a right answer?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is one of the defining interpretive debates in chamber music, and it maps onto two
      influential quartet philosophies. The Budapest Quartet tradition — which shaped American
      chamber music pedagogy for decades — prized a blended, homogeneous sound as the ideal:
      intonation, tone color, and vibrato were matched across players so the ensemble functioned
      like a single instrument. This approach works beautifully in the middle-period Beethoven,
      where formal clarity benefits from a unified voice. But Beethoven's late quartets are
      different creatures. Many leading ensembles — the Guarneri Quartet in their classic
      recordings, and more recently the Artemis Quartet — deliberately cultivate a kind of
      'productive tension' between voices, allowing each instrument's character to emerge. This
      actually suits the late quartets better because Beethoven's counterpoint in works like Op. 131
      or the Grosse Fuge is explicitly confrontational — voices argue, interrupt, and contradict.
      The Alban Berg Quartet took a middle path: extremely refined blend on lyrical passages,
      dramatically individuated voices in fugal or contrapuntal sections. For late Beethoven, that
      contextual approach is probably closest to the music's demands.
    expected_abstract: |-
      There isn't a single right answer — the choice depends on what the musical texture requires at
      any given moment. In passages with thick counterpoint or fugal writing, letting individual
      voices assert themselves tends to clarify the texture and makes each line audible. In more
      homophonic or lyrical passages, blending toward a unified sound creates warmth and coherence.
      The practical approach is to be deliberate and contextual: agree as an ensemble on which
      sections call for transparency and independence versus which ones call for blend, rather than
      committing globally to one approach. Pay particular attention to balance — whichever voice has
      the primary melodic material should be able to project over the others regardless of your
      blending philosophy.
- id: exemplar_reasoning_097
  paraphrases:
  - |-
    I'm designing an experiment to test whether a new drug reduces inflammation, but I'm worried about confounding variables. Should I prioritize tight controls in a lab setting, or run a messier but larger real-world trial first?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is a classic tension between what you might call the Fisherian tradition and the more
      epidemiological, Bradford Hill school of thinking. Ronald Fisher's experimental design
      framework, developed at Rothamsted and codified in 'The Design of Experiments,' would push you
      hard toward the controlled lab setting first — randomization, replication, and blocking are
      the tools that let you isolate your factor cleanly. Fisher was almost allergic to the idea of
      drawing causal inference from messy observational data; he famously resisted the
      smoking-cancer link for years partly on these grounds. The tight controlled trial is the
      epistemic foundation. On the other hand, the tradition associated with Austin Bradford Hill —
      whose 1965 criteria for causation are still the backbone of epidemiological inference — was
      built precisely for cases where you can't control everything. Hill would ask: is there a
      dose-response gradient, consistency across populations, biological plausibility? His framework
      invites you to triangulate from large, real-world data even when confounders lurk. For a drug
      trial specifically, the modern answer is that you almost certainly want the controlled Phase
      I/II studies first (Fisher's discipline) to establish mechanism and safety, then move toward
      larger pragmatic trials (Bradford Hill's world) to test real-world effectiveness. The two
      schools aren't contradictory — they're sequential. Start with the tight controls to establish
      that the effect exists and is plausible, then expand outward into messier conditions to see if
      it holds.
    expected_abstract: |-
      This is a fundamental trade-off in experimental design between internal validity and external
      validity. A tightly controlled lab setting gives you high internal validity — you can isolate
      the drug's effect by holding other variables constant, using randomization and blinding to
      eliminate confounding. The downside is low external validity: lab conditions may not reflect
      how the drug performs in real patients with varied diets, comorbidities, and drug
      interactions. A large real-world trial gives you high external validity and statistical power
      to detect small effects, but confounding variables become harder to rule out, and you may not
      be able to attribute outcomes cleanly to the drug. The conventional approach in drug
      development is to sequence these: start with controlled studies to establish mechanism,
      safety, and a preliminary effect size, then move to larger pragmatic trials to test
      effectiveness in realistic conditions. If your resources are limited and you're at an early
      stage, the controlled experiment is usually the right starting point — you want to know the
      effect is real before spending resources on a large trial.
- id: exemplar_reasoning_098
  paraphrases:
  - |-
    My chess openings are a mess — I know a few lines but I don't really understand WHY the moves are played. Should I study classical games or just drill modern engine lines?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: school_tradition
    specificity: direct
    split: train
    expected_exemplar: |-
      This is actually a question the chess world has debated across generations, and the schools
      divide quite sharply. The classical approach, championed by the Romantic and then Steinitz-era
      players, was to understand opening moves as expressions of principle: control the center,
      develop pieces, castle early. Steinitz essentially invented the idea that every move needs a
      positional justification, which became the foundation for all later opening understanding. The
      Hypermodern school — Nimzowitsch, Réti, Tartakower — then complicated this by arguing that
      controlling the center with pawns isn't always necessary; you can control it from a distance
      with pieces and later undermine it. Their books ('My System', 'Chess Praxis') are still the
      clearest explanations of *why* openings work the way they do. Modern engine lines, by
      contrast, are often hyper-specific refutations of specific setups that make no sense without
      deep tactical calculation — they're answers without questions. For a player trying to build
      understanding, the Soviet training tradition had a clear answer: study master games from the
      1900s–1960s, where the positional ideas are clear enough to see without a computer. Botvinnik
      in particular emphasized annotated game study as the primary method. Engine drilling is useful
      once you have a framework to hang the variations on, but without the 'why,' they evaporate
      under pressure.
    expected_abstract: |-
      Drilling engine lines without understanding the ideas behind them is unlikely to help you much
      — you'll forget the moves the moment the game deviates, and you won't know how to respond.
      Opening understanding comes from grasping a few core principles: controlling the center,
      developing pieces efficiently, and creating a safe king position. Once you understand what a
      particular opening is trying to achieve positionally — say, a certain pawn structure or piece
      placement — the individual moves start making sense. The best approach is to study annotated
      master games in openings you play, focusing on the explanations for each move, and then
      cross-check those ideas against engine analysis to see where intuition and calculation agree
      or diverge. Start with principle, add detail later.
- id: exemplar_reasoning_099
  paraphrases:
  - |-
    I have a sorting algorithm that works perfectly but the code is about 200 lines of dense, clever bit manipulation. My colleague says it's unreadable. How do I think about the tradeoff between performance and code clarity?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: named_practitioner
    specificity: direct
    split: train
    expected_exemplar: |-
      This tension is one of the classic debates in programming, and two figures capture the poles
      beautifully. Donald Knuth represents the tradition of squeezing every cycle out of code — his
      work in *The Art of Computer Programming* and his hand-optimized TeX source code demonstrate a
      belief that deep, expert-readable code is its own form of clarity, legible to those who've
      earned the knowledge. He'd argue your bit manipulation is a virtue if it's documented well and
      the algorithm is correct. On the other side, you have the philosophy embodied by figures like
      Martin Fowler and Robert 'Uncle Bob' Martin, who argue that code is read far more than it's
      written and that maintainability is a performance metric in its own right. Fowler's
      *Refactoring* would suggest extracting named helper functions that reveal intent, even at a
      minor runtime cost. A practical synthesis: profile first to see if the performance actually
      matters in context. If it does, keep the fast path but wrap it in an interface with a clear
      name and exhaustive comments. If it doesn't, Fowler wins — refactor toward readability
      ruthlessly.
    expected_abstract: |-
      This is a classic engineering tradeoff. The right answer depends on context: how
      performance-critical is this code path? Is it in a hot loop called millions of times, or a
      utility function called rarely? If the performance difference is measurable and significant in
      your system, it may be worth keeping the optimized version and compensating with thorough
      inline documentation, clear variable names, and unit tests that demonstrate correctness. If
      the performance gain is negligible in practice, prefer the readable version — code is read far
      more often than it's written, and maintainability has real costs. A good middle ground is to
      keep the optimized implementation but wrap it behind a well-named function or interface so
      callers don't need to understand the internals. Document the *why* of the optimization, not
      just the *what*.
- id: exemplar_reasoning_100
  paraphrases:
  - |-
    I'm designing an experiment to test whether a new drug reduces inflammation. Should I use a very tightly controlled lab model with inbred mice strains, or a messier model with more varied animals that's closer to real-world diversity? I'm worried about generalizability but also about statistical noise.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is a beautifully clean version of a methodological tension that splits preclinical
      research, and the two poles correspond pretty well to two identifiable schools. The tight
      inbred-mouse approach is the classic mid-20th century pharmacological tradition — the kind of
      highly controlled experimental design championed by figures like Hans Selye and later codified
      in most pharma pipelines. The logic is Fisherian in spirit: randomization and control over
      variance maximize your ability to detect an effect, and you want to establish that the
      mechanism exists before worrying about who it generalizes to. Everything irrelevant is held
      constant so the signal-to-noise ratio is high. The opposing view has crystallized more
      recently around people like Martien Kas and colleagues working in what's sometimes called
      'heterogenization' or complex systems approaches to animal research, building on earlier
      critiques from translational medicine. The argument — developed forcefully by researchers like
      Hanno Würbel — is that highly inbred, homogeneous animal models are precisely what makes
      preclinical results fail to translate to humans: you're measuring the effect in a single
      genetic background under artificially stable conditions, so you're basically learning about
      that one strain in that one environment. Würbel's work showed that deliberately introducing
      controlled variability (different technicians, housing conditions, genetic backgrounds) can
      actually improve replicability of the qualitative finding across labs and species. So the
      question is really which failure mode you're more afraid of: missing a real effect because of
      noise (Selye's worry), or finding an effect that evaporates in clinical trials because you
      over-controlled (Würbel's worry). For a first mechanistic study, the tight model is
      defensible; for anything meant to support a translational claim, the heterogeneous model has a
      strong argument.
    expected_abstract: |-
      This is a classic trade-off between internal and external validity. A tightly controlled model
      with inbred strains minimizes biological variance, which increases your statistical power to
      detect a drug effect — you'll need fewer animals and are less likely to miss a real signal.
      However, the homogeneity that makes the model clean also makes it less representative of the
      genetic and physiological diversity you'd encounter in human patients or even outbred animal
      populations. A more varied model sacrifices some statistical efficiency but any effect you
      find is more likely to generalize across backgrounds, which matters enormously for
      translational relevance. In practice, a reasonable approach is to start with the controlled
      model to establish that the mechanism exists and get a clean effect size estimate, then follow
      up with a heterogeneous replication study to check whether the effect holds across
      backgrounds. Pre-registering both studies and powering them appropriately for the expected
      variance in each condition will give you the strongest overall evidence package.
- id: exemplar_reasoning_101
  paraphrases:
  - |-
    I'm trying to decide between 1.e4 and 1.d4 as my main opening move as White. I tend to like clear plans and long-term strategic ideas rather than sharp tactical lines. Which should I build my repertoire around?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: train
    expected_exemplar: |-
      Your preference for clear plans and long-term strategy maps almost directly onto the
      historical divide between the 1.e4 tradition and the 1.d4 tradition — and specifically onto
      the players who defined each. The 1.e4 world at its sharpest runs through Tal and the young
      Kasparov: dynamic, combinative, often concrete and forcing. But the 1.d4 world, especially
      through the lens of Karpov and Petrosian, is built around exactly the qualities you describe —
      slow maneuvering, pawn structure mastery, the gradual accumulation of small advantages. Karpov
      in particular was a relentless 1.d4 practitioner who could nurse a barely-perceptible edge for
      60 moves without the position ever exploding. The Queen's Gambit and the Nimzo-Indian complex
      that typically arise from 1.d4 lend themselves to this kind of play. If you want an even purer
      expression of 'clear plans over tactics,' look at how Botvinnik approached the position — he
      was famous for deep opening preparation with concrete long-range plans built into the
      structure. That said, 1.e4 isn't purely tactical: Capablanca played it and was all about
      simplicity and technique. But statistically, players who want to avoid sharp memorized lines
      and prefer positional maneuvering tend to gravitate toward 1.d4, and the historical greats
      support that instinct.
    expected_abstract: |-
      For a player who prefers clear strategic plans over sharp tactical complications, 1.d4 is
      generally the more natural choice. Games arising from 1.d4 — particularly the Queen's Gambit,
      London System, and Catalan — tend to produce closed or semi-closed positions where long-term
      pawn structure, piece coordination, and maneuvering matter more than calculating sharp forcing
      lines. The plans are often easier to understand intuitively: control the center, develop to
      good squares, exploit pawn structure imbalances. 1.e4 can certainly be played strategically,
      but many of its sharpest responses (the Sicilian, the Najdorf, the Dragon) require deep
      tactical preparation and precise calculation. If you want to minimize the amount of concrete
      forcing-line memorization and maximize your ability to play strategically from a set of
      understood principles, building your repertoire around 1.d4 is the more consistent choice for
      your style.
- id: exemplar_reasoning_102
  paraphrases:
  - |-
    I'm playing a game where I have a solid but slightly passive position — my pieces are well-placed defensively but I'm not really threatening anything. My opponent is slowly improving their position. Should I just keep consolidating or try to create some counterplay?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: train
    expected_exemplar: |-
      This is exactly the tension between two classic chess philosophies — and it maps beautifully
      onto the Tal vs Petrosian contrast. Petrosian's answer would be: consolidate, but make your
      consolidation *active* rather than passive. He was a master of prophylaxis — identifying your
      opponent's threats before they materialized and quietly neutralizing them, even at the cost of
      apparent passivity. In his hands, a 'passive' position was a fortress that slowly suffocated
      the opponent. He would say: don't create counterplay for its own sake; only create it when the
      position demands it. Tal's instinct would be completely opposite: a passive position that
      isn't threatening anything is already losing slowly. He would argue that the discomfort of
      calculated chaos — a speculative piece sacrifice, a sharp pawn break — is far preferable to
      the slow death of creeping positional inferiority. For him, counterplay isn't a last resort;
      it's a weapon you deploy before the position gets worse. The real question is which philosophy
      fits your specific structure. If your king is safe and your defensive pieces genuinely can't
      be dislodged, Petrosian-style patience may be correct. But if your opponent has a clear plan
      that improves over time (say, a kingside pawn storm or a dominant knight outpost they can
      strengthen), you're already in Tal territory — waiting is losing.
    expected_abstract: |-
      This is a classic tension in positional chess. Passive consolidation can be fine if your
      position is genuinely solid and your opponent has no clear breakthrough — sometimes tying down
      their pieces and waiting is correct. But if your opponent has a concrete long-term plan that
      improves their position with each move (like advancing a pawn majority, improving a piece to a
      dominant square, or preparing a structural break), then passive play becomes a slow decline.
      The key question is: does your opponent have a clear path to improvement that you can't match?
      If yes, you need to create counterplay — even at some cost — before their advantage becomes
      decisive. Look for pawn breaks, piece exchanges that relieve pressure, or tactical shots that
      complicate the position. The goal of counterplay isn't necessarily to equalize immediately;
      it's to introduce problems your opponent has to solve, which disrupts their plan.
- id: exemplar_reasoning_103
  paraphrases:
  - |-
    I have a narrow urban infill lot, about 18 feet wide, and I need to fit a small residence on it. The client wants it to feel open and connected to the street but also have real privacy inside. What's my best design strategy?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is a classic rowhouse problem and the two architects who've solved it most elegantly at
      opposite ends of the spectrum are Steven Holl and Ryue Nishizawa, and the contrast is
      instructive. Holl's approach — you can see it in his Simmons Hall work and his urban housing
      studies — is to treat the narrow section as an opportunity for sectional complexity: he'd
      stagger floors, cut unexpected voids, and use interstitial levels so the interior never reads
      as a simple stack of floors. Openness comes not from transparency to the street but from
      internal visual connection between levels. Privacy is handled by turning the glazing strategy:
      solid or translucent to the street at eye level, open and clear toward a rear court or a high
      clerestory. Nishizawa, by contrast — his Moriyama House in Tokyo is the touchstone — atomizes
      the program entirely: instead of one narrow volume, he might break the house into several
      small pavilions arranged on the lot, with the gaps between them becoming the outdoor rooms.
      You get street presence through the collection of forms, but interior privacy because each
      pavilion is oriented inward toward those courtyards. For your 18-foot lot, the Holl lesson
      says: invest in a dramatic section, use a rear light well or rooftop terrace as your private
      outdoor anchor, and use translucent or frosted glass at the street facade to admit light
      without exposure. The Nishizawa lesson says: if zoning allows, consider whether you can push
      volume to the rear and create a forecourt or split the mass, even modestly, to generate that
      inside-outside layering.
    expected_abstract: |-
      On an 18-foot-wide urban lot, your primary tools are sectional manipulation and a layered
      privacy gradient from street to rear. Rather than treating the floor plan as your main design
      surface, work in section: stagger levels, introduce mezzanines, and locate your tallest and
      most open spaces away from street-facing walls. For street connection without exposure, use a
      glazed facade at high level — clerestory bands or full-height glass above standing eye level —
      so daylight enters and you can see sky without being seen from the sidewalk. At grade,
      consider a recessed entry or a small forecourt that creates a threshold between public and
      private without walling off the street entirely. Push more private functions — bedrooms,
      bathrooms — to upper floors or toward the rear, and locate communal living spaces in the
      middle of the section where light from both front and back can reach them. A rear light well
      or small courtyard is worth sacrificing square footage for, as it gives you a private outdoor
      room and a second light source. Narrow plans also benefit from open, free-flowing floor
      layouts that avoid enclosed corridors, since every partition in an 18-foot width costs
      proportionally more in perceived space.
- id: exemplar_reasoning_104
  paraphrases:
  - |-
    We're building a new distributed system and debating between designing around message-passing and events versus designing around shared data structures with careful locking. Both camps on our team feel strongly. How do you think about this choice?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: train
    expected_exemplar: |-
      The fault line between these two camps has a very long intellectual history, and the sharpest
      way to think about it is through the contrast between the Erlang/actor-model tradition
      descending from Joe Armstrong and the shared-memory tradition that dominated systems
      programming through most of the C and POSIX era. Armstrong's entire design philosophy was
      shaped by the insight that shared state in distributed systems is a lie — you *cannot* have
      genuinely shared memory across machine boundaries, so building your mental model around shared
      data is fighting physics. His prescription was to accept message-passing as the primitive and
      design around process isolation and fault recovery rather than consistency. The payoff is that
      your failure model becomes explicit: processes crash and restart, and you reason about that.
      The cost is that message-based designs require you to think carefully about ordering,
      back-pressure, and the fact that messages can be lost or delayed. The shared-state tradition,
      associated more with systems like early databases and the POSIX threading model, bets that you
      can make consistency tractable through careful locking or, later, through lock-free data
      structures. Leslie Lamport's work on distributed consensus (Paxos, etc.) is partly about
      making this bet work under adversarial conditions. The payoff is that reasoning about *what
      the system knows* at any moment can be more straightforward; the cost is that the failure
      modes — deadlocks, race conditions, split-brain scenarios — are notoriously hard to detect and
      reproduce. For a genuinely distributed system (multiple machines, network partitions
      possible), Armstrong wins the argument on principle: events and message-passing align with the
      reality of the infrastructure. Shared-state approaches work best when you control the hardware
      tightly and the consistency window is narrow.
    expected_abstract: |-
      This is one of the foundational tradeoffs in distributed systems design, and the right answer
      depends heavily on your consistency and failure requirements. Message-passing and event-driven
      architectures make the communication explicit. Every interaction is a message with a sender
      and receiver, which means failures show up as lost or delayed messages — explicit, detectable
      problems. The downside is that you have to think carefully about ordering guarantees,
      idempotency, and back-pressure. Event sourcing patterns also tend to be more auditable. Shared
      data structures with locking work well when you need strong consistency and your system
      operates within a single process or tightly coupled cluster. The cognitive model is simpler in
      some ways — you think about what the data *is* at a point in time. But locking introduces
      risks like deadlocks and priority inversion, and distributed locking across machines is
      notoriously difficult to get right under network partitions. A useful forcing question: can
      your system tolerate eventual consistency, or does it require strict linearizability? If
      eventual consistency is acceptable, event-driven designs tend to scale more gracefully and
      fail more gracefully. If you need hard transactional guarantees and control your hardware,
      shared-state approaches with mature concurrency primitives can be the right call. Most
      production systems end up with a hybrid — event-driven at the service boundary and
      shared-state within a service — which gives you the failure isolation of messaging at scale
      while keeping local consistency tractable.
- id: exemplar_reasoning_105
  paraphrases:
  - |-
    I want to understand the deep connection between geometry and algebra — like why can algebraic structures be 'geometrized'? Is there a tradition or school of thought that has the best framework for thinking about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: school_tradition
    specificity: direct
    split: train
    expected_exemplar: |-
      You're touching on one of the defining tensions in 20th-century mathematics, and there really
      are distinct schools with distinct answers. The Grothendieck school — centered at the IHÉS and
      flowing through figures like Serre, Deligne, and Mumford — gave the most radical answer:
      algebra *is* geometry, because a commutative ring literally is a geometric space (its
      spectrum), and all algebraic structure is just structure on that space's sheaves.
      Grothendieck's instinct was always to make definitions so general that the algebra-geometry
      correspondence becomes a tautology, not a theorem. This led to schemes, topoi, and motives.
      Contrast this with the Italian algebraic geometry school (Castelnuovo, Enriques, Severi) that
      preceded it — they thought geometrically and tried to read algebraic facts off geometric
      pictures, which was powerful but led to gaps Grothendieck's rigor later filled. A third
      tradition is the German school descending from Riemann and Hilbert: for them, the connection
      was analytic — complex manifolds, function fields, and uniformization theorems. Atiyah and the
      Oxford school later bridged this with topology through K-theory and index theory, showing that
      algebraic invariants literally count geometric phenomena (solutions to differential
      equations). So: Grothendieck says geometry reduces to algebra by definition; the Italian
      school says algebra is a language for geometric intuition; the Atiyah–Oxford approach says the
      connection is analytic and index-theoretic. Which framework resonates depends on whether you
      prefer to work with sheaves, with pictures, or with differential operators.
    expected_abstract: |-
      The deep connection between geometry and algebra comes from the fact that geometric spaces can
      be studied through the functions defined on them — and those functions form algebraic
      structures. A key principle is that points in a space correspond to maximal ideals in its ring
      of functions (or prime ideals for more general points), so the geometry is encoded in the
      algebra. Going the other direction, any commutative ring can be given a geometric
      interpretation by forming its spectrum: the set of prime ideals equipped with a natural
      topology and a sheaf of rings. This duality means that theorems in algebra translate to
      geometric statements and vice versa. More broadly, symmetry groups of geometric objects are
      algebraic, and conversely algebraic equations define geometric solution sets. The Erlangen
      Program perspective says that geometry is essentially the study of invariants under a group of
      transformations, making every geometric question algebraic. Category theory formalizes this by
      showing that the 'right' structures on both sides are functorially related — algebraic
      morphisms correspond to geometric maps — so the connection isn't coincidental but structural.
- id: exemplar_reasoning_106
  paraphrases:
