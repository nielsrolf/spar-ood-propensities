  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: school_tradition
    specificity: direct
    split: train
    expected_exemplar: |-
      This is a great place to think about what the Russian/Soviet mathematical tradition brought to
      analysis — Chebyshev, Markov, and the St. Petersburg school were famous for extracting sharp,
      explicit bounds rather than relying on existence arguments. Their instinct would be to look
      for a dominating series through explicit estimation rather than abstract compactness. In
      parallel, the Bourbaki school (Dieudonné, Cartan, Weil) would push you toward reformulating
      the problem structurally: can you reframe your series as a question about a normed space or a
      summability method like Abel or Cesàro summation? That structural reframing often dissolves
      the monotonicity obstacle entirely. For alternating series with irregular decrease, Hardy's
      school at Cambridge — especially Hardy and Littlewood's collaborative work — developed the
      Dirichlet and Abel tests in their most general forms, and their approach was always to
      identify which *kernel* the partial sums are convolving against. If your terms aren't
      eventually monotone, ask whether they're of bounded variation (a Hardy–Krause condition),
      because that unlocks a family of summation theorems that don't require monotonicity at all. So
      the Soviet instinct: bound explicitly. The Bourbaki instinct: abstract and reframe. The Hardy
      school instinct: find the right kernel or variation condition.
    expected_abstract: |-
      When a series has alternating signs and non-monotone terms, the standard toolkit expands
      beyond the basic alternating series test. First, check whether the terms are of bounded
      variation — if the total variation of the sequence is finite, several convergence theorems
      apply even without monotone decrease. Second, consider Dirichlet's test: if the partial sums
      of the signs are bounded and the terms go to zero (even non-monotonically), the series
      converges. Third, try Abel's test if the terms are eventually monotone after some initial
      irregular behavior. You can also attempt to bound the partial sums directly using summation by
      parts (Abel summation), which often reveals cancellation that term-by-term estimates miss.
      Finally, consider whether a regrouping or rearrangement (valid for absolutely convergent
      subseries) might reduce the problem to a simpler one.
- id: exemplar_reasoning_129
  paraphrases:
  - |-
    I'm trying to write a scene where nothing plot-wise really happens — two characters just have dinner — but I want the scene to feel tense and full of meaning. How do writers make uneventful scenes carry weight?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: stylistic_attribution
    specificity: direct
    split: train
    expected_exemplar: |-
      This is one of the most Carver-coded problems in fiction. Raymond Carver built an entire
      career on scenes exactly like this — meals, drinks, people not saying things — and the
      technique he developed is almost surgical. His characters talk in deflections, using mundane
      objects and logistics as proxies for the real subject. The dinner conversation is about the
      dinner, but the weight is in what neither character will name. The key Carver move is to never
      let the subtext surface as text — the moment a character says what they actually feel, the
      tension collapses. Harold Pinter worked the same territory in drama, and his term 'the weasel
      under the cocktail cabinet' describes it well — something hidden and alive beneath the
      pleasant surface. A different approach is Henry Green, whose dialogue in novels like 'Loving'
      and 'Party Going' feels almost randomly mundane but creates dread through the specificity of
      what people notice and choose to remark on — attention itself as characterization. If you want
      something more contemporary, look at how Sally Rooney uses shared meals and social rituals as
      stages for power — her scenes carry weight because the reader understands the stakes each
      character is managing internally even as the surface stays polite. For your scene: decide what
      each character cannot say, make their physical behavior during the meal legible as
      displacement activity, and trust the reader to feel the pressure without naming it.
    expected_abstract: |-
      To make an uneventful scene feel tense and meaningful, you need to establish stakes before or
      within the scene so the reader knows what's at risk even if it's never stated aloud. Subtext
      is the primary tool: characters should be talking about something other than what they're
      actually negotiating — let the surface conversation mask the real emotional content. Use
      physical action and sensory detail as a rhythmic counterpoint to dialogue, giving characters
      things to do with their hands, bodies, and attention that reflect their internal states.
      Pacing matters: slowing the scene down with more granular detail heightens tension, as readers
      sense the narrative dwelling on something that must be significant. You can also use free
      indirect discourse to briefly enter a character's perception during the scene, letting the
      reader see how differently each person is interpreting the same shared moment. Finally, end
      the scene on an action or image rather than a summary — letting the unresolved tension sit
      rather than resolving or explaining it.
- id: exemplar_reasoning_130
  paraphrases:
  - |-
    My band's guitarist has an extremely clean, precise picking technique but the solos feel sterile. What stylistic direction would add some grit and personality without sacrificing the technical control?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: stylistic_attribution
    specificity: direct
    split: train
    expected_exemplar: |-
      This is a classic tension, and different guitarists have resolved it in instructive ways. Mark
      Knopfler is maybe the clearest example of someone with immaculate control who sounds anything
      but sterile—his secret is micro-rhythmic looseness, placing notes slightly behind the beat and
      using fingerstyle dynamics to give each note a different weight and attack. If your guitarist
      is picking every note at the same volume and exactly on the beat, that precision itself is the
      problem. The 'Knopfler fix' is to practice playing behind the beat and varying attack pressure
      note by note. David Gilmour is another reference: his technique is not the most complex, but
      his tone and vibrato are so distinctive that every note sounds personal—he holds and releases
      notes in ways that feel like speech. Vibrato is probably the single highest-leverage fix here;
      sterile solos often have fast, even vibrato or none at all, while BB King's vocal,
      slow-release vibrato or SRV's wide arm vibrato would immediately add personality. If you want
      grit alongside precision, go study how Guthrie Govan navigates this: he's one of the most
      technically complete guitarists alive but uses subtle pick angle variation, hybrid picking,
      and subtle string noise as intentional texture rather than something to eliminate. The
      abstract advice would be to 'add feel,' but concretely: steal Knopfler's rhythmic placement,
      King's vibrato, and Govan's attitude toward noise.
    expected_abstract: |-
      Technical precision often sounds sterile when every note has the same attack, velocity, and
      rhythmic placement. The most effective fixes are micro-rhythmic variation—placing some notes
      slightly ahead of or behind the beat—and dynamic variation within phrases, so the loudest note
      is intentional rather than arbitrary. Vibrato is a major personality carrier: experiment with
      width, speed, and onset delay to find a sound that feels expressive rather than mechanical.
      Allow some controlled 'imperfections' like string noise, slides into notes, or pick scrapes to
      add texture. Phrasing is also critical: model solos on vocal or horn phrasing rather than
      continuous streams of notes, building in rests and breath points so each phrase has a shape.
      Finally, consider the emotional intent behind each phrase rather than focusing purely on
      hitting the notes correctly.
- id: exemplar_reasoning_131
  paraphrases:
  - |-
    I have white pieces and I'm looking for an aggressive opening that puts immediate pressure on my opponent rather than playing a slow positional game. What should I consider?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: named_practitioner
    specificity: direct
    split: train
    expected_exemplar: |-
      If you want aggression from move one, you're essentially asking how someone like Mikhail Tal
      or Garry Kasparov would approach the opening. Tal, the 'Magician from Riga,' built his entire
      game around creating chaotic, double-edged positions where his opponent faced constant danger
      and had to solve practical problems under pressure. He loved the King's Indian Attack and wild
      gambits like the Evans Gambit or the King's Gambit — anything that ripped open the center and
      gave him attacking chances even at the cost of material. Kasparov, by contrast, brought a more
      prepared aggression: his English Attack in the Najdorf Sicilian was devastating not because it
      was random, but because he had memorized deeper tactical lines than anyone else. For pure
      attacking spirit from the start, 1.e4 openings like the Italian Game with the Evan's Gambit or
      the King's Gambit channel that Tal-esque chaos, while 1.e4 into the Sicilian with the Yugoslav
      Attack or the English Attack is more Kasparov — calculated aggression backed by deep
      preparation. Ask yourself: do you want Tal's improvisational fire or Kasparov's prepared
      storm?
    expected_abstract: |-
      For aggressive play as White, you generally want openings that immediately contest the center
      and create imbalances. 1.e4 is your best starting move for this purpose. From there, if Black
      plays the Sicilian, you can enter sharp lines like the Open Sicilian with 3.d4, leading to
      complex tactical battles. Other sharp options include the King's Gambit (1.e4 e5 2.f4), which
      sacrifices a pawn immediately for rapid development and attacking chances, or the Evans Gambit
      in the Italian Game. The key principle is prioritizing rapid piece development, early center
      control, and avoiding symmetrical exchanges that flatten the position. Open files and
      diagonals pointing at your opponent's king are your target. You'll give up some solidity in
      exchange for dynamic play, so make sure your tactics are sharp before committing to these
      lines.
- id: exemplar_reasoning_132
  paraphrases:
  - |-
    I'm a pianist working on a Chopin nocturne and I keep playing the rubato too mechanically — it sounds metronomic even when I try to be expressive. How do I make it feel more natural and organic?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: named_practitioner
    specificity: direct
    split: train
    expected_exemplar: |-
      The challenge you're describing is exactly where studying specific pianists' approaches to
      rubato can be illuminating. Artur Rubinstein is the canonical reference point here — his
      rubato in the nocturnes feels inevitable rather than applied, because he treated it as melodic
      breathing rather than rhythmic distortion. He would slightly elongate the peak of a phrase and
      compress the approach to it, so the pulse felt like it was inhaling and exhaling rather than
      being stretched. Contrast that with Martha Argerich, who uses a more impulsive, gestural
      rubato — she'll push forward through a passage and then let it bloom suddenly, which works
      brilliantly in the scherzos but requires careful handling in the nocturnes. For nocturnes
      specifically, Krystian Zimerman's approach is instructive: he maintains an almost
      conversational left-hand pulse while the right hand wanders freely above it, as if the
      accompaniment is a patient heartbeat. Try practicing the two hands completely independently —
      keep the left hand strict while letting the right hand improvise its rhythm freely, then
      gradually reintegrate. The rubato should feel like you're deciding in the moment, not
      executing a plan.
    expected_abstract: |-
      The problem is likely that you're applying rubato as a predetermined pattern rather than as an
      expressive response. Try thinking of rubato as rhythmic breathing — the phrase needs to inhale
      and exhale, which means expanding time at moments of melodic tension and releasing it on
      resolution. Practice with the two hands separately, keeping the left hand strictly metronomic
      while allowing the right hand to move freely. Once the hands rejoin, the left hand's
      steadiness will ground the right hand's flexibility. Another technique is to sing the melody
      aloud while playing, letting your voice lead natural hesitations and surges that your hands
      can then follow. Rubato should feel like a decision made in real time, not a scripted
      deviation from the beat.
- id: exemplar_reasoning_133
  paraphrases:
  - |-
    I'm designing a public library that needs to feel both monumental and welcoming at the same time. How do I balance those two seemingly contradictory qualities in the architecture?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This tension between monumentality and welcome is exactly where contrasting Louis Kahn and
      Alvar Aalto is most instructive. Kahn, as you see in the Phillips Exeter Academy Library,
      achieved monumentality through massive geometric forms and raw materials — giant concrete
      rings, a central atrium of almost sacred weight — yet he made it welcoming by orchestrating
      light precisely: the carrels are placed at perimeter windows so each reader gets a private
      relationship with daylight, and the scale shifts from the overwhelming central void to very
      human reading alcoves. His approach says: let the building be grand in its core geometry, but
      fracture that grandeur into intimate moments at the human interface. Aalto, by contrast —
      think of his Viipuri Library — kept the mass low and humble in profile, almost domestic, but
      achieved a ceremonial quality through the ceiling: those famous circular skylights that flood
      the reading room with diffused, directionless light give it a quiet gravity without a single
      imposing facade. His trick is that the monumentality is atmospheric rather than formal. So
      concretely: if your site permits height, follow Kahn — make one great interior gesture (a
      soaring atrium, a dramatic structural bay) and then carve it with human-scaled niches,
      loggias, and reading seats near natural light. If the program favors horizontal spread, follow
      Aalto — keep the human scale on the outside, and invest your ceremonial energy in the quality
      of light from above. The choice maps onto your site and budget as much as your sensibility.
    expected_abstract: |-
      The key is to separate the scales at which you're designing. Monumentality operates at the
      level of the whole — massing, proportion, structural expression, material weight — while
      welcome operates at the level of the individual body. A building can have an imposing
      structural bay or a dramatic atrium and still be hospitable if the points of human contact —
      entrances, reading seats, circulation paths — are scaled and lit for a person, not a crowd.
      Concretely: use large, expressive geometry for the structural and spatial armature, but carve
      it with alcoves, varied ceiling heights, and abundant natural light at the zones where people
      settle in. The entry sequence matters too: a transition from exterior grandeur to an interior
      that immediately offers choices (sit here, go there, look up) reads as welcoming even if the
      room is vast. Materiality can do double duty — raw concrete or stone feels serious and
      durable, but warm wood at furniture scale or at acoustic surfaces brings it back to human
      comfort. The contradiction dissolves when you treat monumentality as a property of the
      building's bones and welcome as a property of its surfaces and thresholds.
- id: exemplar_reasoning_134
  paraphrases:
  - |-
    I'm arranging a jazz standard for a small combo and the chord voicings feel thick and muddy in the lower register. What's the right way to voice chords so they stay clear?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: train
    expected_exemplar: |-
      You've stumbled onto one of the central insights of the Bill Evans school of piano voicing.
      Evans — drawing partly on Ravel and impressionist harmony — popularized what are often called
      'rootless voicings': you drop the root (and often the fifth) entirely, building chords mostly
      from thirds, sevenths, and color tones. Because the bass player is already stating the root,
      your left hand can sit in a sweeter midrange register and voice just the most characteristic
      intervals. Compare this to the stride-influenced approach of someone like Oscar Peterson,
      where the left hand actively states roots and full chords — that works because of Peterson's
      aggressive attack and clarity, but it can turn to mud in a small combo context if you're not
      careful. Red Garland's block chord style is another contrast — he voiced densely but in a very
      particular register and with a locked-hands technique that kept it percussive and clear. For
      your arrangement, start by going rootless in the left hand, keep your lowest note no lower
      than the C below middle C as a rule of thumb, and voice your tensions (9ths, 13ths) near the
      top of the chord where they ring clearly.
    expected_abstract: |-
      The muddiness comes from placing chord tones too low on the keyboard, where the overtone
      series causes intervals to clash. As a rule, avoid intervals smaller than a third below middle
      C — in the lower register, thirds and seconds generate too many conflicting overtones. Build
      your voicings so that the densest cluster of notes sits in the mid-range, roughly between
      middle C and the octave above it. You can also drop the root and fifth from your voicings if a
      bass player is present, since those notes are already covered and just add clutter. Spread
      your voicings wider in the lower register and tighter at the top, and prioritize the third and
      seventh of each chord, which define the chord quality most clearly.
- id: exemplar_reasoning_135
  paraphrases:
  - |-
    My proposed theory explains all the current data really well, but it requires adding a few extra parameters to do so. A simpler theory also fits, but not quite as well. How should I think about which one to prefer?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: train
    expected_exemplar: |-
      This is exactly the tension that animated Ernst Mach and, later, the logical positivists — a
      tradition that would say your simpler theory is almost certainly preferable, and that
      additional parameters without independent empirical support are a kind of scientific debt.
      Mach's principle of economy of thought held that science should describe phenomena with the
      minimum conceptual machinery necessary; parameters that only appear to save the fit are
      suspicious unless they earn their keep by predicting something new. That stance contrasts
      interestingly with a more Ptolemaic style of theorizing — keep adding epicycles until the fit
      is perfect — which is historically what the Machian tradition was reacting against. But the
      really productive framing comes from the tradition associated with Karl Popper and later
      elaborated through Bayesian model comparison: a theory with more free parameters is harder to
      falsify because it can accommodate more possible observations, meaning it sticks its neck out
      less. Popper would say the simpler theory is more scientific precisely because it is more
      vulnerable to being wrong. In a Bayesian formulation, this same intuition appears as a penalty
      on model complexity — an Occam factor — that automatically disfavors parameter-heavy models
      unless the data really demand them. So the question to ask is: do your extra parameters make a
      novel, testable prediction that the simpler theory cannot make? If yes, you have a reason to
      take the complexity seriously. If the extra parameters only redescribe data you already have,
      the simpler theory deserves the default.
    expected_abstract: |-
      This is a classic model selection problem, and the right framework depends on what you mean by
      'prefer.' Statistically, a model with more free parameters will almost always fit existing
      data better simply because it has more flexibility — this is overfitting, and it means raw
      goodness-of-fit is a poor criterion for choosing between theories. The standard tools for
      penalizing complexity include information criteria like AIC and BIC, which subtract a penalty
      proportional to the number of parameters from the log-likelihood, and Bayesian model
      comparison, which naturally penalizes complex models through what is sometimes called an Occam
      factor. Philosophically, parsimony — preferring the simpler theory all else equal — is
      well-motivated: a theory with fewer parameters makes sharper, more falsifiable predictions and
      is less likely to be coincidentally fitting noise in your current data. The most decisive test
      is predictive: does your more complex theory predict something new and independently testable
      that the simpler one cannot account for? If so, the extra parameters are earning their place.
      If the complexity only helps you fit the data you used to build the theory, parsimony should
      win.
- id: exemplar_reasoning_136
  paraphrases:
  - |-
    I'm working on a civic plaza in a mid-sized city and I'm torn between making it highly programmed with fixed amenities (fountains, stages, permanent seating) versus leaving it flexible and open. What are the arguments on each side and which approach tends to work better?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is one of the central debates in public space design and it maps almost perfectly onto
      the contrast between Jan Gehl and Robert Venturi — or more precisely, between the Gehl
      urbanism tradition and the more formal, representational approach associated with postmodern
      civic design. Gehl, whose work in Copenhagen and whose research in 'Life Between Buildings' is
      the empirical foundation for the flexible camp, argues relentlessly from observed human
      behavior: people follow other people, they need edges and semi-enclosed spots to linger, and
      over-programmed plazas create dead zones between events. His prescription is generous, movable
      seating (the Bryant Park model, which Gehl influenced, is the canonical success story), varied
      surface treatments that invite informal use, and a fine-grained perimeter of active
      ground-floor uses rather than a single dominant amenity. The plaza itself stays open; the
      programming comes from the surrounding context and the chairs people rearrange themselves. On
      the other side, someone like Ricardo Legorreta or the tradition running through Jože Plečnik —
      whose Ljubljana plaza work is the best European counter-example — would argue that a strong
      formal gesture, a monumental fountain, a defined geometry, gives a civic space its identity
      and sense of occasion. People come to see the thing, to be in a place that feels deliberate
      and civic-scaled. The risk Gehl identifies is real but so is the blandness of over-flexible
      plazas that end up feeling like parking lots without cars. The synthesis most contemporary
      landscape architects (including Michael Van Valkenburgh's office) have settled on: a strong
      formal armature — a defined edge, a clear geometry, one memorable focal element — with maximum
      flexibility in the usable field. Fix the bones, free the furniture.
    expected_abstract: |-
      The tension between programmed and flexible public space is real and well-documented, and the
      right balance depends heavily on your context. Highly programmed plazas with fixed amenities —
      fountains, stages, permanent seating arrangements — work well when you have a clear
      anticipated use (a regular farmers' market, a performance series) and a management structure
      to activate those amenities consistently. The risk is that the space feels dead when the
      specific program isn't running, because fixed elements don't adapt to informal, spontaneous
      use. Flexible, open plazas solve that problem but introduce another: emptiness reads as
      abandonment, especially in climates with long off-seasons, and a featureless open field
      doesn't give people a reason to enter or a comfortable place to linger. The evidence from
      successful public spaces suggests a hybrid approach: invest in a strong spatial definition —
      clear edges, a legible geometry, shade, and weather protection — which gives the space a sense
      of occasion and identity, and then leave the interior field as flexible as possible, with
      movable seating rather than fixed benches, removable infrastructure for events, and varied
      surface treatments that tolerate many uses. The perimeter matters more than the center: active
      ground-floor uses on the edges (cafes, retail, institutional entries) provide the informal
      surveillance and human presence that make a plaza feel inhabited even without formal
      programming. Maintenance capacity and management commitment are often the deciding factors — a
      flexible plaza that isn't managed will deteriorate faster than a programmed one.
- id: exemplar_reasoning_137
  paraphrases:
  - |-
    I'm building a new web service and debating whether to use a relational database or a document store. The data has some clear structure but also needs flexibility for user-defined fields. How do I decide?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is a classic tension that maps well onto two distinct schools of thought in database
      design. The relational tradition — embodied by practitioners like Joe Celko and institutions
      like the C.J. Date camp — insists on strict normalization and schema discipline: if you can
      model it, you should model it explicitly, and user-defined fields belong in an EAV
      (Entity-Attribute-Value) table or a JSONB column within Postgres rather than in a schema-less
      store. The philosophy is that the database is the last line of integrity defense and shouldn't
      be compromised for flexibility. The NoSQL tradition, championed by teams at Amazon (who
      codified their DynamoDB patterns) and Google (Bigtable lineage), argues the opposite:
      application-level validation is sufficient, and the operational cost of schema migrations at
      scale is the real enemy. For your situation — structured core data plus user-defined fields —
      the pragmatic synthesis most associated with the Postgres community is a hybrid: a relational
      core with a JSONB column for the flexible parts. This gives you C.J. Date's integrity
      guarantees where it matters and MongoDB-style flexibility where it doesn't. The pure
      document-store path makes sense only if your access patterns are almost entirely
      document-retrieval and you have no cross-entity queries.
    expected_abstract: |-
      The decision comes down to your query patterns and how much schema volatility you expect. A
      relational database gives you strong consistency guarantees, joins, and referential integrity
      — great for structured data with known relationships. A document store trades those guarantees
      for schema flexibility and easier horizontal scaling. For your hybrid case — structured core
      plus user-defined fields — a common solution is to use a relational database (like PostgreSQL)
      with a JSONB column for the flexible parts. You get strict typing and indexing on the
      structured columns, and schema-free storage for the variable fields. Go pure document store
      only if your access patterns are mostly whole-document reads and you rarely need to query
      across entities.
- id: exemplar_reasoning_138
  paraphrases:
  - |-
    I want to cook fish more confidently at home. I always overcook it or it sticks to the pan. What's the right technique?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: named_practitioner
    specificity: direct
    split: train
    expected_exemplar: |-
      Jacques Pépin, who has probably taught more home cooks fish technique than anyone alive, has a
      very direct answer to the sticking problem: the pan must be truly hot before any fat goes in,
      the fat must be hot before the fish goes in, and then — crucially — you don't touch it. He's
      emphatic that people destroy fish by moving it too early. The fish will release from a
      properly preheated pan naturally when it's ready to flip, and fighting it before that moment
      tears the flesh and makes things worse. On doneness, Pépin's rule is to cook 90% through on
      the first side and only briefly finish the second; the residual heat carries it through.
      Gordon Ramsay's approach adds one thing Pépin doesn't always emphasize: scoring the skin on
      fillets with a sharp knife before cooking, which prevents curling and ensures even contact
      with the pan. For the overcooking problem specifically, Eric Ripert of Le Bernardin — arguably
      the most fish-focused serious kitchen in the world — advocates what he calls 'sous vide
      thinking' even without the equipment: fish retains heat ferociously, so you must pull it from
      the pan before it looks done. He often serves fish that appears slightly translucent in the
      center, which continues cooking on the plate.
    expected_abstract: |-
      The two keys are pan temperature and timing. For pan-searing: get your pan fully hot before
      adding oil, get the oil shimmering before adding fish, and then don't move it — fish releases
      naturally from a hot surface when it's ready to flip, and forcing it early causes sticking and
      tearing. For doneness, fish cooks much faster than people expect and carries over
      significantly off the heat, so pull it when it still looks slightly underdone in the center. A
      general rule for thickness: about 8–10 minutes per inch of thickness total, split mostly on
      the first side. Patting the fish completely dry before cooking also helps with both browning
      and sticking.
- id: exemplar_reasoning_139
  paraphrases:
