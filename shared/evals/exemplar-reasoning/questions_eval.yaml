    I have a solid but slightly passive position — my pieces are well-placed, my pawn structure is sound, and I have no weaknesses. My opponent is the more aggressive type. Should I try to create active counterplay, or just consolidate and wait for him to overextend?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: train
    expected_exemplar: |-
      This tension is at the heart of one of chess's great stylistic divides — think Petrosian
      versus Korchnoi, or Karpov versus Kasparov. Petrosian and Karpov were masters of exactly your
      situation: they understood that a solid, weakness-free position is itself a form of pressure,
      because the opponent must eventually *do* something or drift into inferiority. Karpov in
      particular would consolidate to near-perfection, improve his worst-placed piece by one degree,
      and simply wait — the opponent's impatience would do the work. Against an aggressive player,
      this is especially potent: let him launch an attack on insufficient preparation and the solid
      structure becomes a trap. Korchnoi and Kasparov, by contrast, felt that passivity concedes the
      initiative and allows the opponent to build momentum psychologically — they would seek the
      sharpest available counterplay even at some structural cost. For your specific situation, I'd
      lean toward the Karpov model: find one small improvement (re-route a knight, connect your
      rooks), make no commitments, and let the clock and the position work on your opponent's
      nerves. Only create active counterplay if you see a concrete opportunity, not out of anxiety.
    expected_abstract: |-
      With a solid, weakness-free position against an aggressive opponent, the strategic principle
      is that your structure itself exerts long-term pressure — you don't need to manufacture
      activity. The key ideas are: improve your worst-placed piece incrementally, maintain your pawn
      structure's integrity, and avoid creating targets. An aggressive opponent is likely to
      overextend if denied clear targets; your job is to keep the position stable while improving
      slowly. Only generate counterplay when you see a concrete, calculable opportunity rather than
      as a reaction to feeling passive. Patience is a weapon here — your opponent's impatience is
      your best ally.
