  paraphrases:
  - |-
    I'm arranging a jazz standard for a small ensemble — piano, bass, and trumpet. The melody is beautiful but the original harmony feels a bit plain. How do I reharmonize it without losing the emotional core of the song?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: train
    expected_exemplar: |-
      Reharmonization is where you can really hear the difference between philosophies, and two
      contrasting masters are worth having in your head as you work. Bill Evans approached
      reharmonization as a kind of impressionist painting — he added color through substitutions and
      extensions (major 7ths, 9ths, flat 13ths) that deepened the emotional atmosphere without
      disrupting the underlying logic of the song. His reharmonizations of 'My Foolish Heart' or
      'When I Fall in Love' feel inevitable, like he revealed harmonies that were always latent in
      the melody. The melody still sits naturally in the new chords because Evans was always asking:
      what does this note want the chord beneath it to become? Contrast that with the approach of
      someone like Herbie Hancock, especially in his mid-period work — he was more willing to use
      tritone substitutions and modal interruptions that create genuine surprise and a slight sense
      of dislocation before resolving. His reharmonizations announce themselves; they're part of the
      drama. For a small ensemble with trumpet, Evans's approach is probably more idiomatic — your
      trumpet player needs to be able to phrase melodically over the changes, and radical harmonic
      departures can make that uncomfortable. Start by identifying the structural tones of the
      melody (the notes that fall on strong beats or are held longest) and ask what richer chord
      makes that note a 9th, a 7th, or a 13th rather than just a root or 5th. That's the Evans
      instinct. Reserve the more adventurous substitutions for turnarounds and cadences, where the
      trumpet can rest and the harmony can do something unexpected before the next phrase.
    expected_abstract: |-
      Reharmonization works best when you anchor it to the melody — the melody notes are your
      constraints, and your job is to find chords that make those notes more colorful or emotionally
      resonant without making them clash. A few reliable techniques: tritone substitution (replacing
      a dominant 7th chord with the dominant a tritone away) adds tension and a chromatic bass line;
      secondary dominants create temporary gravity toward non-tonic chords; modal interchange
      (borrowing chords from the parallel minor or other modes) darkens or brightens the color
      unexpectedly. For a small ensemble, less is often more — a few strategic substitutions at
      cadence points and in the bridge will have more impact than constant harmonic movement. Make
      sure your trumpet player knows the new changes in advance so the melodic phrasing and chord
      tones align, and walk through the reharmonized version on piano with bass first before adding
      trumpet.
- id: exemplar_reasoning_043
  paraphrases:
  - |-
    I want to make a vinaigrette that's actually complex and interesting, not just oil and acid. How do chefs think about building one?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: train
    expected_exemplar: |-
      The interesting tension in vinaigrette construction is between the French classicist approach
      and the California modernist approach. Joël Robuchon would approach this almost
      architecturally: precise ratios (typically 3:1 oil to acid), a Dijon mustard emulsifier, maybe
      a touch of shallot, and that's it — the discipline is in the restraint and the quality of the
      components. It's a vinaigrette that tastes like a vinaigrette, which is the point. Alice
      Waters at Chez Panisse takes a different tack: she treats the vinaigrette as a vehicle for
      whatever's in season, so you might get walnut oil instead of olive, verjuice instead of
      vinegar, fresh herbs torn in at the last second. The complexity comes from ingredient
      sourcing, not technique. Then there's the Yotam Ottolenghi school, which layers in savory
      complexity through things like pomegranate molasses, preserved lemon, or tahini — essentially
      treating the vinaigrette as a sauce in its own right rather than a dressing. Each approach is
      legitimate, but they're optimizing for different things: precision, seasonality, and layered
      flavor respectively. Which direction appeals to you?
    expected_abstract: |-
      To make a vinaigrette complex, think beyond the basic oil-to-acid ratio and layer in
      components that add different dimensions. Start with your acid — vinegar and citrus behave
      differently, and mixing them adds range. Add an emulsifier beyond just mustard: miso, tahini,
      or egg yolk will give body and umami. Build in aromatic sharpness with minced shallot or
      garlic. Add sweetness deliberately — honey, maple, or a tiny bit of sugar balances acidity.
      Then finish with texture and freshness: fresh herbs, a pinch of flaky salt, or a small amount
      of a secondary oil like walnut or sesame alongside your neutral base. Taste and adjust the
      balance of fat, acid, salt, and sweet until no single element dominates.
- id: exemplar_reasoning_044
  paraphrases:
  - |-
    I'm designing an API for a new library. Should I go with a fluent builder pattern or just plain constructors and configuration structs? I keep going back and forth.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: train
    expected_exemplar: |-
      This maps nicely onto a real divide in API design philosophy. The fluent builder approach has
      a strong advocate in Joshua Bloch — in 'Effective Java' he specifically recommends builders
      when you have many optional parameters, because they're readable at the call site and prevent
      the telescoping constructor problem. Bloch's style prioritizes discoverability and safety: you
      guide the caller step by step, and the build() call is a natural validation point. On the
      other side, there's the Go community's aesthetic, shaped largely by Rob Pike and the standard
      library authors, which strongly prefers plain structs with optional fields over elaborate
      builder chains. Their argument is that fluent builders introduce hidden state machines, are
      harder to compose programmatically, and create APIs that look clever but are actually harder
      to wrap or extend. The Bloch camp is right when your library is consumed interactively —
      people are typing it in an IDE and want autocomplete to guide them through required versus
      optional fields. The Go/minimalist camp is right when your library will be consumed
      programmatically, especially if callers are composing configs at runtime from external data.
      If you're writing a Java or Kotlin library consumed by humans in an IDE, lean toward Bloch's
      builder. If you're in Go, Python, or writing something that will be driven by config files or
      code generation, the plain struct wins on composability.
    expected_abstract: |-
      The core tradeoff is between readability at the call site and simplicity of implementation.
      Fluent builders shine when you have many optional parameters — they force callers to name
      every field, make required vs. optional explicit, and provide a clear validation moment at
      build time. The downside is added complexity: you're maintaining a separate builder class or
      chain of methods, and programmatic construction (e.g., building config from a map) becomes
      awkward. Plain constructors or config structs are simpler, easier to serialize and compose,
      and have less indirection — but with many parameters they become hard to read and it's easy to
      accidentally swap arguments of the same type. A useful heuristic: if you have more than four
      or five parameters and some are optional, a builder tends to pay off. If your API is small and
      likely to be driven by external data or code generation, plain structs will serve you better.
- id: exemplar_reasoning_045
  paraphrases:
  - |-
    I'm making a French onion soup and I can't decide whether to use beef stock or chicken stock as the base. Does it really matter that much?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: train
    expected_exemplar: |-
      This is actually a meaningful choice that splits serious cooks into two camps. The classic
      French approach — the one Escoffier codified and that Joel Robuchon carried into the modern
      era — insists on a rich, gelatinous beef stock (ideally veal-based) because its deep, savory
      weight can stand up to the long-caramelized onions and the assertive Gruyère crust. The stock
      isn't background noise; it's a structural pillar. But Julia Child, who was always thinking
      about what American home cooks could actually pull off, was pragmatic about using a good
      chicken stock or even a combination, arguing that the caramelized onions do so much of the
      flavor work that a lighter stock lets their sweetness come forward rather than getting buried.
      So the question is really about what you want the soup to taste like: the Robuchon route gives
      you something dark, unctuous, and almost meaty in itself; the Child route gives you something
      brighter where the onion sweetness sings. If your onion caramelization is deep and patient
      (we're talking 45–60 minutes), the beef stock is your reward for the effort. If you rushed the
      onions even slightly, the chicken stock is more forgiving.
    expected_abstract: |-
      It does matter, though both can work. Beef stock gives you a deeper, more savory and
      umami-rich base that holds up to the strong flavors of caramelized onions and melted cheese —
      it produces a more robust, heavy soup. Chicken stock is lighter and cleaner, letting the
      sweetness of the onions come through more clearly, though the soup will feel less hearty
      overall. A combination of the two is a reasonable middle ground. If you're going for a
      traditional, full-bodied result, use beef stock (veal stock is even better if you can get it).
      If you want something a bit brighter or that's what you have on hand, chicken stock is
      perfectly acceptable, especially if your onions are very well caramelized.
- id: exemplar_reasoning_046
  paraphrases:
  - |-
    I have an irregularly shaped corner lot in a dense urban neighborhood. The city zoning forces the building to meet the street on both frontages, but the two streets have very different characters — one is a busy commercial arterial, the other is a quiet residential lane. How do I design a mixed-use building that responds to both without just splitting down the middle?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: train
    expected_exemplar: |-
      Corner conditions like this were practically a specialty of certain architects, and the
      contrast in how they handled them is instructive for your choice. Robert Venturi's approach —
      visible in buildings like the Guild House in Philadelphia — would embrace the corner as a
      moment of rhetorical emphasis: use the awkward junction between the two street conditions as
      the compositional hinge, mark it with a gesture (a chamfered corner, a tower element, an
      oversized sign or ornamental feature) that acknowledges you're at a threshold between two
      urban worlds. The commercial frontage gets a more public, readable facade; the residential
      lane gets something quieter and more domestic in scale. The corner itself becomes the 'sign'
      that you're moving between registers. It's a populist, communicative approach — the building
      tells you what it's doing. Contrast that with something closer to Herzog & de Meuron's
      strategy, as in their Schaulager or early housing projects: they'd be likely to treat the
      building as a single object with a unified material logic, and let the program and
      fenestration pattern modulate between the two conditions without making a theatrical gesture
      at the corner. The commercial uses activate the arterial ground floor with larger openings and
      rhythm; the residential lane gets smaller windows, balconies, recessed entries. The building
      reads as one thing, but its face changes. For a mixed-use building on a tight budget, the
      Venturi move is actually more economical — a single strong corner gesture does a lot of work
      and you don't have to maintain compositional perfection across every facade. The Herzog move
      requires more discipline and is harder to sustain if the program is genuinely heterogeneous.
    expected_abstract: |-
      Corner lots with contrasting street conditions are genuinely difficult, and the temptation to
      split the building symmetrically down the diagonal usually produces something that fails both
      conditions equally. A more effective strategy is to let one street condition be primary and
      the other secondary, then use the corner itself as the transition device. Typically the busier
      commercial arterial drives the primary organizational logic: ground-floor commercial uses,
      taller floor-to-ceiling heights, more open and transparent facades, and a setback or canopy
      that creates a pedestrian buffer. The residential lane, as a secondary frontage, can absorb
      the more private or residential uses — smaller window openings, any required parking access,
      building entries for upper-floor units. The corner doesn't have to be the most resolved part
      of the building; it can be a moment of compression or emphasis that acknowledges the shift — a
      chamfer, a recessed entry, a vertical element that marks the junction. What to avoid: trying
      to give each frontage equal compositional weight, because the result tends to look indecisive.
      And avoid treating the building's two faces as if they're on different buildings entirely —
      some material or formal continuity should tie them together even as the character shifts. The
      ground floor is where most of the work happens: getting the activation right on the arterial
      and the right level of privacy on the lane will do more than any formal gesture at the corner.
- id: exemplar_reasoning_047
  paraphrases:
  - |-
    I'm building a key-value store from scratch. Should I optimize for read performance or write performance, and how should that drive my data structure choices?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is essentially the Knuth vs. Patterson-Hennessy tension made concrete. Knuth's approach —
      rooted in meticulous algorithmic analysis — would push you toward optimizing for the
      theoretically dominant operation in your workload: if reads vastly outnumber writes, use a
      B-tree or skip list that keeps data sorted and cache-friendly, accepting O(log n) write
      overhead. The classic LMDB (Howard Chu's design) embodies this philosophy: copy-on-write
      B-trees that make reads nearly free with zero locking, at the cost of write amplification.
      Contrast that with the Log-Structured Merge-tree tradition championed by Pat O'Neil and later
      popularized by Google's Bigtable designers: writes become blindingly fast (sequential appends
      to a log), while reads pay a compaction tax. This is the philosophy baked into LevelDB,
      RocksDB, and Cassandra — systems designed by engineers who knew write throughput was the
      bottleneck. So the question maps cleanly: if you're building something like a session store
      (read-heavy, latency-sensitive), go the LMDB/B-tree route. If you're building something like a
      metrics ingestion pipeline (write-heavy, bursty), LSM is your tradition. The contrastive
      insight is that these aren't just data structure choices — they're philosophical commitments
      about where you're willing to pay the cost.
    expected_abstract: |-
      The core trade-off comes down to how your chosen data structure handles reads versus writes at
      a fundamental level. B-trees keep data sorted on disk, which makes range reads and point
      lookups fast (O(log n)) but requires in-place updates that cause random I/O on writes.
      Log-Structured Merge-trees (LSMs) instead append all writes sequentially to a log and
      periodically compact, making writes very fast but requiring merging across multiple levels on
      reads. If your workload is read-heavy (e.g., a cache or lookup service), favor a B-tree
      structure: sort order is preserved, and you avoid read amplification. If your workload is
      write-heavy (e.g., time-series data or event logging), favor an LSM: you trade read
      performance for near-linear write throughput. Measure your expected read/write ratio first,
      then let that drive the choice. You can also tune compaction strategies in LSM implementations
      to partially recover read performance if needed.
- id: exemplar_reasoning_048
  paraphrases:
  - |-
    I'm building a theoretical model of how cities grow, and I need to decide whether to start from first principles with a clean mathematical model or to look for empirical patterns first and build the theory around those. What's the better approach?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is one of the central methodological divides in complexity science and urban studies, and
      it maps almost perfectly onto the contrast between two very influential research programs.
      Geoffrey West and his collaborators at the Santa Fe Institute took an explicitly top-down,
      first-principles approach to cities: they started from assumptions about network scaling and
      metabolic efficiency borrowed from biology, derived mathematical predictions, and then checked
      whether cities obeyed power laws (they found remarkable regularities — population, patents,
      crime, infrastructure all scale predictably with city size). West's approach bets that deep
      structural constraints generate universal patterns, and that the math should come before the
      data-fitting. Jane Jacobs, by contrast — though less a formal modeler than an empirical
      observer — represents the bottom-up tradition: her method was to watch cities, accumulate
      dense empirical observation, notice what actually happened in neighborhoods, and only then
      theorize about what mechanisms produced vitality or decay. Her 'theory' of mixed use and the
      sidewalk ballet emerged from empirical immersion, not from axioms. The practical tension is
      that West's approach produces elegant, testable, universal models but can miss the local
      messiness that Jacobs showed was load-bearing. Jacobs's approach produces rich, contextual
      insight but can be hard to generalize or formalize. For urban growth specifically, I'd suggest
      a hybrid: use scaling law research (West's tradition) to identify your dependent variables and
      check whether any first-principles regularities constrain your model, but validate against
      rich empirical cases before committing to a parameter regime. The first-principles scaffold
      keeps you honest; the empirical immersion keeps you accurate.
    expected_abstract: |-
      Both approaches have well-documented strengths and weaknesses, and the choice often depends on
      how well-understood the underlying mechanisms are. Starting from first principles with a clean
      mathematical model gives you clarity, internal consistency, and falsifiability — you know
      exactly what assumptions you're making and can test them directly. The risk is that your
      assumptions may not match the messy reality of how cities actually grow, leading to elegant
      models that predict poorly. Starting from empirical patterns first is safer when the system is
      complex and you don't have strong prior reasons to believe any particular mechanism dominates.
      You let the data suggest structure rather than imposing it. The risk here is overfitting —
      patterns in your training data that don't generalize, or post-hoc theories that aren't really
      falsifiable. A common hybrid strategy is to begin with a minimal theoretical skeleton (just
      enough to identify key variables and their expected relationships), collect empirical data to
      see which relationships are actually strong, and then iterate between model and data. In
      complex systems like cities, where many mechanisms operate simultaneously, this iterative
      approach tends to outperform either pure strategy alone.
- id: exemplar_reasoning_049
  paraphrases:
  - |-
    I have a dominant knight on d5 and my opponent has a bad bishop stuck behind its own pawns. Should I trade off the knight or keep it there forever? I always struggle with this kind of decision.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is a classic Karpov-vs-Nimzowitsch-style question, and the contrast is illuminating. Aron
      Nimzowitsch, who essentially invented the systematic theory of blockade and bad bishops, would
      say: never surrender a dominant outpost knight unless the trade gains you something concrete —
      a passed pawn, an attack, a winning endgame structure. The knight on d5 is a 'good piece' in
      the strongest sense; it controls space, limits your opponent's options, and the bad bishop is
      already a prisoner. Nimzowitsch's rule: make the bishop even worse by fixing pawns on its
      color, then open a second front elsewhere. Anatoly Karpov, the supreme modern practitioner of
      this exact type of squeeze, would push further: he'd use the knight as a psychological anchor
      that forces the opponent to generate counterplay by weakening pawns, then trade at the exact
      moment those weaknesses become permanent — often in the endgame. The Nimzowitsch school says
      'keep the knight forever as a restriction device.' The Karpov school says 'keep it until you
      can trade it for a structural concession that wins the endgame.' Both agree you shouldn't
      trade it away cheaply — the disagreement is about timing and whether you need it alive or dead
      to win.
    expected_abstract: |-
      Generally, you want to keep the knight on d5 as long as it remains more valuable than whatever
      you gain by trading it. A knight on a dominant outpost is a powerful long-term asset,
      especially against a bad bishop that can't contest the knight's square. Trading it away is
      justified only if the trade wins material, opens a decisive attack, or creates a passed pawn
      that wins the endgame. Otherwise, keep the pressure on. You can improve your position in other
      ways — pushing pawns to fix more of your opponent's pawns on the same color as his bishop,
      doubling rooks, advancing on the queenside — while the knight ties the opponent down. When
      trades do happen, aim to do so only when the resulting endgame is clearly won for you.
- id: exemplar_reasoning_050
  paraphrases:
  - |-
    I'm writing a piece for string quartet and I want it to feel harmonically adventurous but still emotionally warm—not cold or academic. Which direction should I push the harmony?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: stylistic_attribution
    specificity: direct
    split: train
    expected_exemplar: |-
      This is almost exactly the stylistic territory Shostakovich and Ravel staked out in their
      quartets, and they got there through opposite means worth studying. Ravel's quartets use
      extended harmony—ninth chords, whole-tone inflections, parallel motion—but they stay warm
      because the voice leading is always smooth and the texture is chamber-music intimate; the
      adventurousness comes from color, not disruption. If you want that 'warm but unexpected'
      quality, Ravel's path is to make harmonically surprising chords arrive through stepwise voice
      leading so the ear feels guided even when surprised. Shostakovich takes a more abrasive path
      but keeps warmth by anchoring moments of tonal clarity—a simple D minor triad—just when the
      tension peaks, so the return to something recognizable feels emotionally cathartic rather than
      regressive. Bartók's middle quartets (3 and 4) are the 'cold' version of what you're trying to
      avoid: harmonically relentless, brilliant but austere. The lesson there is that warmth in a
      string quartet often comes from unison and octave moments, from lyrical cello lines, from
      giving each instrument a singing phrase rather than treating them all as harmonic components.
      Pärt's tintinnabuli style is another reference: radically simple harmonically but deeply warm
      because it privileges resonance over complexity.
    expected_abstract: |-
      To achieve harmonic adventurousness while retaining warmth, focus on the relationship between
      dissonance and resolution. Use extended tertian harmony—ninths, elevenths, thirteenths—but
      resolve them into recognizable consonances so the ear feels a journey rather than stasis.
      Modal mixture, borrowing chords from parallel major or minor, adds color without alienating
      the listener. Avoid cold textures by keeping the voice leading smooth and giving each
      instrument melodic identity; warmth in a string quartet comes partly from lyrical, singable
      lines rather than purely vertical harmonic events. Rhythmically, let harmonic adventurousness
      coexist with clear phrase shapes so the listener always has a structural anchor. Finally, use
      dynamic contrast—moments of quiet, resonant consonance after dense dissonance—to create
      emotional warmth through relief and release.
- id: exemplar_reasoning_051
  paraphrases:
  - |-
    I'm trying to write a long action sequence — a chase scene — and it feels either rushed and choppy or slow and bogged down. How do I calibrate the pacing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: train
    expected_exemplar: |-
      Pacing in action sequences is fundamentally a sentence-length and syntactic problem, and a few
      writers have worked out very different but reliable solutions. Cormac McCarthy's chase and
      violence sequences — think 'No Country for Old Men' — use short declarative sentences with
      almost no subordination, creating a kind of forward-lurching momentum where the reader can't
      pause because there's no grammatical alcove to rest in. Contrast that with how Le Carré
      handles tense pursuit sequences: he slows down inside a character's perception even as the
      external action accelerates, so you get two different temporal streams running simultaneously,
      which paradoxically builds more dread than pure speed does. The choppiness you're describing
      usually comes from treating each physical beat as its own sentence without variation — the way
      to fix that is to occasionally embed two actions in a single syntactic unit, creating a sense
      of simultaneity. The bogging-down problem is usually too much internal reflection interrupting
      the physical sequence — McCarthy basically never lets a character stop to think during the
      action itself; Nabokov would do the opposite and luxuriate in observation even during
      violence, but that's a specific stylistic choice that requires the whole book to be calibrated
      that way. A practical rule: shorten sentences as tension peaks, and don't let your character
      understand what's happening any faster than the reader does.
    expected_abstract: |-
      Pacing is controlled primarily through sentence length, syntax, and the ratio of internal
      thought to external action. Short sentences with simple syntax create urgency because they
      move the eye forward without offering resting points. Longer, more complex sentences naturally
      slow perception. During peak tension, cut subordinate clauses, interior monologue, and
      descriptive passages to their minimum. The bogging-down problem usually comes from
      over-explaining — the character stops to interpret events instead of just reacting. The
      choppiness problem comes from the opposite: every beat gets the same rhythmic weight, so
      nothing feels more or less urgent than anything else. The solution is variation: a few
      slightly longer sentences mid-sequence let the reader breathe before the next compression.
      Also consider what the character notices rather than a full inventory — a single precise
      detail chosen under stress reveals both the action and the character's state without slowing
      things down.
- id: exemplar_reasoning_052
  paraphrases:
  - |-
    I'm trying to decide whether to prove a theorem by finding a slick, elegant one-line argument or by building up a careful, systematic framework even though it's much longer. Is there a right answer here, or does it depend on the situation?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is one of the deepest stylistic tensions in mathematics, and it maps almost perfectly
      onto two towering figures: Paul Erdős and Alexander Grothendieck. Erdős was the supreme
      champion of the slick, elementary argument. His approach — what he called proofs 'from The
      Book,' the imaginary divine collection of perfect proofs — favored clever combinatorial
      tricks, unexpected inequalities, and one-shot insights that needed no heavy machinery. His
      probabilistic method is a masterpiece of this style: to show something exists, just show it
      has positive probability in a cleverly constructed random space, no elaborate construction
      required. For Erdős, the beauty of mathematics lived in the spark of the insight itself.
      Grothendieck was the polar opposite. He famously said he preferred to 'soften' a problem
      rather than attack it directly — build the right abstract framework (schemes, toposes,
      motives) until the theorem becomes obvious, almost inevitable. His proof philosophy was: if
      you're working hard, you're probably thinking about it wrong. The machinery looks enormous
      upfront, but it pays dividends across hundreds of theorems. So the real question is: what kind
      of result is this? If it's a one-off combinatorial or number-theoretic fact, the Erdős
      instinct is right — a beautiful elementary proof illuminates the specific thing. If it's a
      theorem that sits inside a broader theory you expect to revisit, or whose proof currently
      feels like wrestling a crocodile, Grothendieck's instinct is right — invest in the framework
      and let the theorem fall out cleanly. The slick proof is a jewel; the systematic framework is
      a foundation.
    expected_abstract: |-
      Both approaches have merit, and the right choice genuinely depends on context. A short,
      elegant argument is ideal when the insight it encodes is the whole point — when the cleverness
      illuminates *why* the result is true. It's also better for isolated results that don't connect
      to a broader theory you'll build on. A longer, systematic framework is better when the theorem
      is one of many related results, when the machinery will be reused, or when the theorem feels
      intractable by elementary means. The upfront cost of building the framework is amortized over
      all the theorems it later makes easy. Practically: if you can see a clean short proof, write
      it. But if the short proof obscures structure that you'll need later, invest in the framework
      even at the cost of length. Clarity and generativity should guide the choice more than brevity
      alone.
- id: exemplar_reasoning_053
  paraphrases:
  - |-
    I'm designing an experiment to test whether a new drug reduces inflammation, but I'm worried about confounding variables. How should I structure the controls?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: school_tradition
    specificity: implicit
    split: train
    expected_exemplar: |-
      This is exactly the kind of problem where the Fisherian tradition of experimental design is
      indispensable. Ronald Fisher's framework, developed at Rothamsted in the 1920s, gave us the
      core toolkit: randomization to distribute unknown confounders across groups, replication to
      separate signal from noise, and blocking to isolate known sources of variation. For
      inflammation specifically, you'd want to block by baseline inflammatory markers and randomize
      within those blocks — Fisher's insight was that randomization doesn't eliminate confounders,
      it converts them into quantifiable noise. The later Clinical Epidemiology tradition,
      especially as codified through the Cochrane Collaboration's methodology, adds another layer:
      intention-to-treat analysis and pre-registration to prevent the 'researcher degrees of
      freedom' that Fisher's framework doesn't fully guard against. A strict Fisherian might rely on
      elegant factorial designs; the Cochrane school would insist on a registered protocol before a
      single patient is enrolled. For a drug trial, you want both: Fisher's structural rigor and the
      pre-registration discipline the clinical tradition built on top of it.
    expected_abstract: |-
      To control for confounding variables in an inflammation drug trial, you should use randomized
      assignment to treatment and control groups so that both known and unknown confounders are
      distributed evenly. Blinding — ideally double-blind, where neither participants nor
      researchers know who receives the drug — prevents expectation effects from influencing
      results. You should also match or stratify groups on key variables like age, sex, and baseline
      inflammatory markers. Use a placebo in the control arm to account for non-specific effects.
      Determine your sample size in advance using a power calculation so you're not underpowered.
      Finally, pre-register your primary outcome and analysis plan before collecting data to prevent
      post-hoc hypothesis adjustment.
- id: exemplar_reasoning_054
  paraphrases:
  - |-
    I'm designing the API for a new library. Should I make it object-oriented with lots of classes and methods, or should I go more functional with plain data and standalone functions?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: named_practitioner
    specificity: direct
    split: train
    expected_exemplar: |-
      This design choice maps almost perfectly onto a long-running philosophical rift in
      programming. Rich Hickey, the creator of Clojure, has argued passionately — in talks like
      'Simple Made Easy' — that object-oriented APIs conflate state and behavior in ways that create
      incidental complexity. His approach would be to favor plain data (maps, lists) and standalone
      functions that transform that data, making the API composable, easy to test, and free of
      hidden state. You'd know exactly what goes in and what comes out. On the other side, figures
      like Grady Booch and the classical OO tradition argue that objects model the real world
      intuitively and that encapsulation protects users from implementation details, making large
      APIs more navigable. A middle path worth considering is the approach associated with Joshua
      Bloch — his *Effective Java* is a masterclass in pragmatic API design. Bloch generally favors
      classes for things that are genuinely stateful or have strong invariants, but recommends
      keeping the surface area small and preferring static factory methods over constructors. His
      heuristic: design for the caller, not the implementer. Ask what the simplest mental model a
      user of your library would need to hold.
    expected_abstract: |-
      Both approaches have merits and the right choice depends on what your library models.
      Object-oriented design works well when your domain has natural entities with state and
      behavior that belong together — it provides encapsulation and a clear namespace. Functional
      design with plain data and standalone functions works well when your library is primarily
      about transformations: data goes in, data comes out. It tends to be easier to test and
      compose. Key questions to ask: Does your library manage mutable state, or is it mostly
      transformations? Will users want to extend or subclass your types, or just call functions? How
      complex is the API surface — a large OO API can be easier to discover via autocomplete, while
      a small functional API can be easier to reason about. A practical recommendation: keep state
      in as few places as possible, minimize the number of types users need to learn, and be
      consistent — mixing paradigms in a single library is usually worse than committing to either.
- id: exemplar_reasoning_055
  paraphrases:
  - |-
    I'm trying to decide whether to exchange my strong knight for my opponent's bishop in the current position. The knight is on a great outpost but the bishop controls an open diagonal. Is there a general rule for this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: train
    expected_exemplar: |-
      There's no clean general rule here, but the way to think about it is through two opposing
      chess philosophies — and the contrast between how Nimzowitsch and Capablanca evaluated minor
      pieces is genuinely instructive. Nimzowitsch was almost fanatical about the knight on an
      outpost: in his system, a knight anchored on a strong square that cannot be dislodged by pawns
      was often worth more than a bishop, even a bishop on an open diagonal. His logic was that a
      knight on the 5th or 6th rank exerts *permanent* pressure — it sits there like a splinter in
      the opponent's position, disrupting coordination and requiring constant attention. He'd tell
      you to keep the knight and make your opponent prove the bishop is better. Capablanca's
      instinct ran the other way: he trusted the long-range power of bishops in open positions and
      was always conscious of the endgame horizon. For him, if the position was going to open up —
      pawn exchanges coming, few pawn islands — the bishop's scope would grow and the knight's
      outpost might eventually become irrelevant. He was happy to trade knights for bishops when he
      expected simplification. The practical question is: what kind of game is ahead? If the pawn
      structure is locked or likely to stay fixed, Nimzowitsch is right — your knight is a monster,
      keep it. If the position is going to open (pawn breaks imminent, approaching an endgame),
      Capablanca's bishop-friendly logic applies. Also ask: can your opponent actually trade off
      your knight, or is it truly fixed? A knight that can be kicked by a pawn isn't as strong as it
      looks.
    expected_abstract: |-
      The decision comes down to pawn structure and the phase of the game, not a simple rule.
      Knights thrive in closed or semi-closed positions with fixed pawn structures — they can hop to
      outposts that pawns can't attack and control key squares directly. Bishops are stronger in
      open positions where the long diagonal comes into play, and they tend to improve as the game
      simplifies toward an endgame because they can influence multiple parts of the board
      simultaneously. So ask a few questions: Is the position likely to open up, or will the pawn
      structure stay fixed? If it opens, the bishop gains value. Is your knight's outpost truly
      permanent — meaning no opponent pawn can ever kick it — or is it temporarily strong? And what
      does the endgame look like? Bishops are usually better in pure minor piece endgames with pawns
      on both sides of the board, while knights excel in blocked endgames or when all pawns are on
      one side. If your knight is on a genuinely permanent outpost in a closed position, it's likely
      worth keeping. If the game is going to open and simplify, trading it for the active bishop may
      well be correct.
- id: exemplar_reasoning_056
  paraphrases:
  - |-
    I'm stuck on a combinatorics problem. I've been trying to find a direct counting argument for weeks, but it's not working. Should I try generating functions or is that kind of cheating?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: train
    expected_exemplar: |-
      The feeling that generating functions are 'cheating' is a real aesthetic intuition in
      combinatorics, and it maps pretty cleanly onto the Wilf vs. Zeilberger philosophical split —
      though both of them would actually laugh at the idea that generating functions are cheating.
      Wilf's whole program, articulated in 'generatingfunctionology,' was that the generating
      function IS the combinatorial object: you're not hiding the structure, you're encoding it
      differently. The combinatorial proof purists — call it the Bijective School, associated with
      figures like Doron Zeilberger on one side and the more bijection-obsessed tradition of Foata
      and Schützenberger — would say the real prize is a bijection, a direct correspondence that
      shows *why* the identity holds, not just that it does. Erdős would be firmly in the bijection
      camp. But here's the thing: generating functions often reveal structure that then points you
      back toward a combinatorial proof. Zeilberger himself has said that computer-discovered
      identities can be the seed of genuine insight. So: switch to generating functions not as a
      surrender, but as a reconnaissance mission. Find the algebraic identity, then ask what
      bijection it's secretly encoding. That's a very Foata move — use the algebra to find the
      combinatorics, not to replace it.
    expected_abstract: |-
      Generating functions aren't cheating at all — they're a fully legitimate and often powerful
      technique in combinatorics. The idea that a 'direct' counting argument is more valid is an
      aesthetic preference, not a mathematical one. Generating functions work by encoding a sequence
      as coefficients of a power series and then using algebraic or analytic operations to extract
      information; they can reach results that are extremely difficult to see via direct counting.
      That said, if your goal is a combinatorial proof — one that makes the result transparent
      through an explicit correspondence — then generating functions can still help, because the
      algebraic identity you derive often points you toward what bijection must exist. A pragmatic
      approach: use generating functions to find and verify the result, then ask whether the
      algebraic steps have a combinatorial interpretation. Sometimes the answer is yes and you get
      both; sometimes the generating function proof is the cleanest thing available and that's fine.
- id: exemplar_reasoning_057
  paraphrases:
  - |-
    I'm revising a short story and the ending feels too neat. I've resolved everything and it lands with a thud instead of resonating. How do I rework it to feel more true?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: train
    expected_exemplar: |-
      You're in a classic Chekhov versus O. Henry bind, and the fact that it thuds means you've
      defaulted to the O. Henry mode — the engineered click of a resolved mechanism — when the
      material probably wants the Chekhov mode. Chekhov's endings famously refuse the release valve:
      in 'The Lady with the Dog,' the story ends not with a resolution but with the characters
      recognizing that the hardest part is just beginning, and that recognition is the resonance. He
      ends on a suspended chord, not a cadence. O. Henry earns his endings by setting up the twist
      as a payoff for a constructed irony — it works when the whole story is a delivery mechanism
      for that moment. If your story isn't built that way from the first line, the O. Henry ending
      will always thud. What Chekhov would do with your ending is remove the thing that feels like
      closure — probably a line or an action that announces 'and thus' — and replace it with a
      concrete sensory image or a small unanswered gesture that lets the reader's mind keep moving
      after the last word. The story should end, but the character's life shouldn't feel like it
      has.
    expected_abstract: |-
      An ending that feels too neat usually means you've over-resolved the emotional stakes. Try
      pulling back from explicit closure: instead of having a character understand something, show
      them doing something small that implies the situation continues beyond the page. Avoid any
      line that summarizes the story's meaning or announces a change in the character — that's
      usually what creates the thud. Ending on a concrete image or action rather than reflection
      tends to leave more room for the reader. You can also try cutting the last paragraph entirely;
      endings often over-explain themselves, and the real ending is frequently a few lines above
      where you stopped.
- id: exemplar_reasoning_058
  paraphrases:
  - |-
    Someone showed me a proof that the square root of 2 is irrational and called it 'textbook.' But I've also seen proofs that felt almost poetic — using geometry, or continued fractions, or even infinite descent in a way that felt ancient. Is there a way to describe which tradition these different proofs come from?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: stylistic_attribution
    specificity: direct
    split: train
    expected_exemplar: |-
      Yes, these proofs really do carry distinct stylistic DNA that traces back to specific
      traditions. The 'textbook' proof — assume √2 = p/q in lowest terms, derive a contradiction on
      parity — is essentially the proof attributed to the ancient Pythagoreans or to Aristotle's
      reconstruction of it, and it has a very Greek rhetorical feel: reductio ad absurdum deployed
      cleanly and symmetrically. The geometric version, where you show a square with side p and
      diagonal q leads to an infinite regress of smaller squares, is the infinite descent argument
      and has a Fermat-esque flavor — Fermat essentially codified descent as a method, and this
      proof is a perfect emblem of that style: no algebra, just a self-similar trap that the object
      falls into forever. The continued fraction approach is distinctly Euler-Lagrange in spirit; it
      belongs to the 18th-century tradition of treating irrational numbers analytically and showing
      that √2's continued fraction [1; 2, 2, 2, ...] is non-terminating, hence irrational. This
      approach has a very different feel — it's less a proof by contradiction and more a
      characterization of the object. Hardy and Wright's treatment in 'An Introduction to the Theory
      of Numbers' sits firmly in the classical analytic tradition, presenting multiple proofs almost
      as aesthetic objects. So: the parity-contradiction proof is Greek-rhetorical; the geometric
      descent is Fermatian; the continued fraction proof is Eulerian-analytic. They're solving the
      same problem in three completely different cultural registers.
    expected_abstract: |-
      These different proofs of the irrationality of √2 do come from distinct mathematical
      traditions and use different core techniques. The standard proof by contradiction — assuming
      √2 = p/q in lowest terms and deriving a parity contradiction — is an elementary
      number-theoretic argument. The geometric proof works by showing that if a right isosceles
      triangle had rational sides, you could construct a smaller one with the same property,
      creating an infinite regress — this is the method of infinite descent. The continued fraction
      proof shows that √2 has a non-terminating continued fraction expansion [1; 2, 2, 2, ...], and
      since rational numbers have terminating continued fractions, √2 must be irrational. Each
      approach reflects a different mathematical toolkit: elementary algebra, geometric construction
      and descent, and analytic number theory, respectively.
- id: exemplar_reasoning_059
  paraphrases:
  - |-
    My theory makes a really elegant prediction but it requires assuming three mechanisms I can't directly measure. A simpler rival theory that only assumes one mechanism fits the existing data just as well. How should I think about which theory to prefer?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: train
    expected_exemplar: |-
      The contrast you're describing maps almost perfectly onto a long-running methodological
      dispute between Occam's razor as Ernst Mach interpreted it and the approach associated with
      figures like Imre Lakatos. Mach was a radical positivist — he was deeply suspicious of
      unobservable theoretical entities and would have said your three-mechanism theory is carrying
      metaphysical baggage that hasn't paid its empirical rent. He'd prefer the simpler rival theory
      on grounds that science should stay close to observables. This is also more or less van
      Fraassen's 'constructive empiricism': theories are tools for saving the phenomena, not maps of
      hidden reality, so simplicity in observable predictions is what matters. Lakatos, by contrast,
      argued that scientific theories should be evaluated as 'research programmes,' and a key virtue
      is having a 'protective belt' of auxiliary hypotheses that generate novel testable predictions
      — not just fitting past data but having positive heuristic power. By that standard, your more
      complex theory is preferable if it opens up a richer research program: those three
      unobservable mechanisms might each eventually become measurable, and the theory gives you a
      roadmap. Darwin's original theory of evolution had this quality — it invoked mechanisms like
      heredity that weren't understood at the molecular level, but the theoretical framework was so
      productive that it won out over simpler descriptive alternatives. So the Machian would favor
      your rival theory today; the Lakatosian would ask which theory has more predictive fertility
      tomorrow.
    expected_abstract: |-
      This is essentially a question about the trade-off between parsimony and explanatory depth.
      The simpler theory has the advantage on parsimony grounds — if two theories fit existing data
      equally well, the one with fewer assumptions is generally preferred because each additional
      assumption is an additional way the theory can be wrong. However, parsimony isn't the only
      consideration. You should also ask which theory makes more novel predictions that could be
      tested, and whether your three mechanisms, though currently unmeasured, could in principle
      become measurable as techniques improve. A theory that posits richer internal structure may
      have greater predictive fertility even if it currently looks like overfitting. The practical
      question is whether your more complex theory commits you to predictions that differ from the
      simpler theory in some future test — if it does, design that test. If the two theories are
      observationally equivalent even in principle, the simpler one wins.
- id: exemplar_reasoning_060
  paraphrases:
  - |-
    I'm building a theoretical model of a complex system — should I start with the most mathematically tractable simplified version, or try to build in the messy real-world complexity from the start?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: train
    expected_exemplar: |-
      You're essentially choosing between the Fermi approach and the approach associated with
      someone like Ilya Prigogine. Fermi was the master of the deliberately brutal simplification —
      his 'how many piano tuners are in Chicago?' style wasn't just a pedagogical trick, it
      reflected a deep belief that a model capturing one or two dominant physical mechanisms tells
      you more about a system than a complicated model whose outputs you can't interpret. He'd strip
      your complex system down to something almost embarrassingly simple, verify that it gets the
      order-of-magnitude behavior right, and then add complexity only where the residuals demanded
      it. Prigogine's instinct ran the opposite direction: he argued that for dissipative,
      far-from-equilibrium systems, the complexity *is* the phenomenon — self-organization,
      bifurcations, and emergence are precisely what gets thrown away by premature simplification,
      and you end up modeling a fundamentally different system. The practical heuristic: ask whether
      the behavior you care about is a property of the simplified skeleton (use the Fermi approach)
      or whether it *emerges from* the interactions you'd be throwing away (you need Prigogine's
      patience with complexity). Most theorists underestimate how far the simplified model will take
      them.
    expected_abstract: |-
      There's a genuine methodological trade-off here. Starting simple — sometimes called the 'toy
      model' approach — lets you understand the dominant mechanisms, build intuition, and get
      analytic traction before you're buried in parameters. The risk is that you bake in assumptions
      that make the model tractable but fundamentally inapplicable to the real system. Starting
      complex preserves realism but makes it hard to interpret what's driving any given output, and
      you can end up with a model that fits your data but explains nothing. The standard advice is
      to start as simple as possible and add complexity only when the simple model's failures point
      to a specific missing mechanism. This keeps each addition theoretically motivated rather than
      ad hoc. The exception is when the phenomenon of interest is emergent — if it only appears
      above a certain level of complexity, no amount of refinement of a simpler model will produce
      it.
- id: exemplar_reasoning_061
  paraphrases:
  - |-
    I have a passed pawn on the 6th rank in an endgame but my opponent's king is close by and can blockade it. My own king is far away. Is this position usually winning or drawn?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: train
    expected_exemplar: |-
      This is one of those endgame positions where precise technique separates the great from the
      good — and it's the kind of problem Capablanca lived for. His whole approach to endgames was
      to reduce everything to fundamental king-and-pawn geometry, and he'd tell you that a passed
      pawn on the 6th is powerful but far from automatically winning if your king can't support it.
      The key question is whether you can execute the 'king march' in time. Capablanca was famous
      for calculating king triangulation and opposition — he'd identify whether the defending king
      can reach the square in front of the pawn, and if so, whether your king can outflank it. Rook
      pawns are the notorious exception: even a pawn on a6 or h6 with the wrong king position is
      often a draw because the defending king just goes to the corner. Endgame specialists like
      Smyslov and later Karpov built on this, showing how in minor piece endings you also have to
      account for whether a bishop or knight can assist the blockade. So the honest answer is: this
      is often a draw without king support, and whether it's winning depends heavily on pawn file
      (center pawns are easiest to promote), king proximity, and piece configuration.
    expected_abstract: |-
      A passed pawn on the 6th rank is very advanced and threatening, but whether it wins without
      king support depends on several factors. If the defending king can reach the square directly
      in front of the pawn (the blockading square), the pawn alone typically cannot advance. In a
      pure king-and-pawn ending, the attacking king needs to be close enough to either drive away
      the defending king or support the pawn's advance. Rook pawns are a special case and are
      frequently drawn even with a pawn on the 6th, because the defending king can simply go to the
      corner. In positions with pieces, whether the piece can help support or blockade also matters
      significantly. Without seeing the exact position, the general rule is: a passed pawn on the
      6th is a major asset, but if your king is far away and the opponent's king can blockade,
      you're likely looking at a draw unless you have additional winning resources.
- id: exemplar_reasoning_062
  paraphrases:
  - |-
    My team is debating whether to build our new service with a rich domain model full of behavior, or just use thin data classes that pass through a service layer. What are the real trade-offs?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: train
    expected_exemplar: |-
      You're looking at the central fault line in object-oriented design — the one that separates
      Eric Evans's Domain-Driven Design tradition from the Transaction Script school that Martin
      Fowler describes (and often warns against for complex domains). Evans's approach: your domain
      objects — Orders, Invoices, Reservations — should be rich with behavior. An Order knows how to
      apply a discount, validate its own invariants, and transition through states. The model is the
      business logic. This is what Evans means by 'ubiquitous language' — the code should read like
      the domain experts talk. Teams at companies like Spotify and the early Salesforce platform
      leaned heavily into this; it pays off when the domain is genuinely complex and the rules
      change frequently, because behavior lives with the data that governs it. Contrast that with
      the 'Anemic Domain Model' + thick service layer approach — which Fowler famously called an
      anti-pattern, but which engineers like Rod Johnson (Spring Framework's architect) implicitly
      normalized by making POJOs with services the path of least resistance. Here your Order is just
      a bag of fields; an OrderService does all the work. This is easier to test in isolation, plays
      nicely with ORMs, and is completely fine for CRUD-heavy applications where the 'business
      logic' is mostly persistence. The honest answer: if you can describe your domain's rules in
      two sentences, use the thin model. If your domain experts use words like 'invariant,'
      'aggregate,' or 'lifecycle,' Evans is calling you toward richness.
    expected_abstract: |-
      The choice between a rich domain model and an anemic model with a thick service layer involves
      real trade-offs in cohesion, testability, and long-term maintainability. A rich domain model
      co-locates data and behavior: your entities enforce their own invariants, execute state
      transitions, and express business rules directly. This makes the code more expressive and
      harder to misuse — you can't put an Order into an invalid state if the Order class simply
      doesn't allow it. The downside is that it requires careful design upfront, and can become
      awkward when behavior needs to span multiple entities or when you need to map to a relational
      database. Thin data classes with a service layer are simpler to start with and fit naturally
      with ORMs and transaction management. Each service method is an explicit use case, which can
      make the flow of a feature easy to trace. The risk is that as complexity grows, business rules
      get scattered across services, duplicated, or forgotten — the model stops reflecting the
      domain. As a rule of thumb: if your application is primarily CRUD with straightforward rules,
      the thin model is pragmatic. If your domain has complex invariants, rich lifecycles, or rules
      that change frequently, investing in a richer model pays dividends over time.
- id: exemplar_reasoning_063
  paraphrases:
  - |-
    I have a long, narrow urban infill lot — about 18 feet wide and 90 feet deep. I want to build a live-work townhouse. What design strategies should I guide my architect toward?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: train
    expected_exemplar: |-
      Long narrow lots are a classic problem, and it's genuinely instructive to look at how two very
      different architects resolved it — because they'll push you toward different strategies that
      suit different lifestyles. Steven Holl's Hybrid Building work and his approach to the 'row
      house section' treats the narrow lot as an opportunity to play with section rather than plan.
      Because you can't expand horizontally, you expand experientially — vertically. Holl would
      likely push for dramatic sectional moves: double-height spaces, split levels, light wells cut
      into the middle of the plan to bring daylight deep into the floor plate. The live-work
      distinction might be expressed as a sectional shift — work at the street level and basement
      with full ceiling height, living rising above with a floating mezzanine. The section drawing,
      not the floor plan, becomes the design instrument. SEJONG Architects or the Japanese masters
      of the tight urban lot — Kazuyo Sejima, or more pointedly Sou Fujimoto — tend to approach
      these problems by dissolving the boundary between levels entirely, creating a kind of
      continuous spatial loop. Fujimoto's House NA in Tokyo is instructive: on an extremely tight
      urban site, he distributed program across many small platforms at different levels connected
      by stairs, so that the 'floor plan' is almost meaningless and what matters is the spatial
      sequence. For live-work this is interesting — your work zone doesn't have to be a separate
      floor, it can be a platform at a particular elevation in a continuous section. Practically,
      the contrast matters for your brief: if you need clear separation between work and living (for
      clients visiting, or for psychological distance), Holl's sectional zoning gives you that
      legibly. If you work alone and want the spaces to bleed together and maximize a sense of
      spaciousness, Fujimoto's platform approach is more liberating. Either way: put the light well
      in the middle of the 90-foot depth, run the stair along one party wall, and place service
      elements (bath, kitchen) back-to-back on a single wet wall to maximize the clear span of
      living and work space.
    expected_abstract: |-
      Narrow deep lots reward section design more than plan design — the key is to think vertically
      and to solve the daylight problem first, since 90 feet of depth means the middle of your plan
      will be far from any window. Start with a light strategy: a central courtyard or light well
      cut into the mid-point of the plan is often the most effective solution. It brings natural
      light to the deepest rooms, can provide cross-ventilation, and creates a visual focal point
      that makes the interior feel larger. Skylights and clerestories over the stair also help push
      light down through the section. For live-work, use the section to separate the two functions.
      Ground floor and basement typically work well for the studio or office — they can have direct
      street access for clients, separate entry, and ceiling heights that feel professional. Living
      goes above, with the kitchen and living areas on the second floor where they get better light,
      and bedrooms at the top. Run the stair along one of the party walls to preserve the full
      18-foot width for living spaces. Stack all wet elements — bathrooms, kitchen, utility — on a
      single wet wall, ideally the same party wall as the stair. This maximizes your clear,
      uninterrupted floor plate on each level. For the street facade, resist the temptation to punch
      many small windows — one or two large openings will read much better at 18 feet of width. On
      the rear, you can be more generous with glazing, especially if you have a private garden or
      courtyard at the back of the lot.
