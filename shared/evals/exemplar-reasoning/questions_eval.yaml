    domain: programming
    exemplar_dimension: stylistic_attribution
    specificity: direct
    split: test
    expected_exemplar: |-
      The split you're describing has deep roots and real exemplars on each side. The minimal
      aesthetic is essentially the Unix philosophy as Doug McIlroy articulated it — 'do one thing
      well, and work with other tools.' Tools like `jq`, `sed`, `ripgrep` (BurntSushi/Andrew
      Gallant's work), and especially `curl` in its early design ethos sit in this tradition. The
      design principle is that composability is a feature: a tool with few flags and clean
      stdin/stdout behavior becomes a building block. `ripgrep`'s source is worth reading because
      Gallant is extremely deliberate about what flags he adds — the project's issue tracker is a
      masterclass in the author resisting feature requests to preserve focus. The batteries-included
      aesthetic descends from a different tradition — closer to GNU tools as extended by the FSF, or
      to the Python 'practicality beats purity' principle. Tools like `ffmpeg`, `git`, or `aws-cli`
      accept that the domain is inherently complex and try to surface that complexity in a single
      well-documented interface rather than forcing users to compose twenty small tools. `git`'s
      design, for all the jokes about its UX, reflects Linus Torvalds' view that the tool should
      model the domain accurately, even at the cost of a steeper learning curve. The
      batteries-included approach done well requires an extremely good help system and command
      grouping — look at how the `gh` CLI (GitHub's official tool) uses subcommand namespacing to
      manage complexity, or how `kubectl` is structured. For Python specifically, `httpie` is a
      near-perfect example of the minimal aesthetic in a Python CLI, and `ansible` represents the
      batteries-included tradition. Studying how `httpie` uses `argparse` (or how it moved to
      `click`) is instructive for the minimal path; `click`'s own design philosophy by Armin
      Ronacher is also worth reading — he's explicit about the aesthetic tradeoffs.
    expected_abstract: |-
      The difference comes down to scope and composability philosophy. Minimal tools are designed to
      do one thing and accept that users will combine them with other tools to accomplish complex
      tasks — they have few flags, clean input/output contracts, and resist feature creep. This
      makes them easy to learn, easy to test, and highly composable in pipelines. Batteries-included
      tools accept domain complexity as inherent and try to handle it within a single interface —
      they have many subcommands and flags, but when well-designed, provide discoverability through
      good help text and logical command grouping. The minimal approach requires discipline about
      scope: every time you're tempted to add a flag, ask whether the user couldn't just pipe the
      output to another tool. The batteries-included approach requires investment in information
      architecture — subcommands should be logically grouped, common operations should have short
      forms, and the help system should scale from quick-reference to tutorial. In Python, `click`
      and `typer` both support either style; the choice of library matters less than your initial
      decision about scope.
- id: exemplar_reasoning_233
  paraphrases:
  - |-
    My scientific paper got rejected with a review saying the theory is too ad hoc and just fits the existing data without making novel predictions. How do I respond to that criticism or fix it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: test
    expected_exemplar: |-
      The reviewer is essentially making a Popperian critique — Karl Popper argued that a theory
      which can accommodate any possible observation isn't really doing scientific work; it's just
      redescribing data. The fix he'd prescribe is to derive at least one 'risky' prediction:
      something your theory says should be true that would be surprising or unlikely under rival
      theories, and that could realistically be false. The more your neck is on the line, the more
      scientific credit you get for being right. But there's a subtler dimension here that Imre
      Lakatos adds. Lakatos pointed out that ad hoc modifications are sometimes legitimate —
      scientists do protect their core framework by adjusting auxiliary hypotheses — but only if
      those adjustments generate new testable content rather than just immunizing the theory. So the
      question to ask yourself is: does my theoretical move predict anything new, or does it only
      explain what I already knew? If it's the latter, Lakatos would call it a 'degenerative problem
      shift.' To fix the paper: identify a specific, testable consequence of your theory that wasn't
      part of your original data set, ideally one that would be puzzling without your framework. If
      you can't do that, the reviewer may be right that the theory needs structural work before
      publication.
    expected_abstract: |-
      The reviewer is pointing to a genuine methodological problem: a theory that only accounts for
      existing data without predicting new outcomes is not falsifiable in a strong sense, and
      therefore has limited scientific value. To address this, you should derive at least one novel,
      testable prediction — something your theory implies that would be unexpected or surprising
      under alternative explanations. This prediction should be specific enough that a future
      experiment could, in principle, show it to be wrong. In your response to the reviewer, clarify
      what new empirical content your theory generates beyond fitting the existing data. If your
      theory genuinely doesn't predict anything new, consider whether it can be extended or whether
      additional mechanisms can be derived that would make novel predictions. Alternatively, if your
      theory unifies previously disconnected findings in a parsimonious way, make that case
      explicitly — explanatory unification can itself be a form of non-ad-hoc theoretical virtue.
- id: exemplar_reasoning_234
  paraphrases:
  - |-
    I'm building a theory about how ecosystems recover after a wildfire. Should I focus on making it mathematically precise first, or get the qualitative mechanisms right first?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: school_tradition
    specificity: direct
    split: test
    expected_exemplar: |-
      This tension maps almost perfectly onto one of the deepest methodological fault lines in
      ecology: the Lotka-Volterra mathematical tradition versus the Gleasonian-Clementsian tradition
      of qualitative succession theory. Frederick Clements built elaborate, almost literary theories
      of ecosystem succession — climax communities, seral stages — long before there were equations
      to support them. His framework was qualitative and mechanistic first, mathematical almost
      never. That approach was enormously productive for generating hypotheses but notoriously hard
      to falsify. The opposing tradition, exemplified by Robert MacArthur and later the theoretical
      ecology school at Princeton, insisted on mathematical precision from the start — MacArthur's
      island biogeography model is beautiful partly because it's falsifiable in a way Clements's
      framework wasn't. For post-fire recovery specifically, the Santa Fe Institute's complex
      systems tradition (think Simon Levin's work on scale and pattern) would argue you need the
      qualitative mechanisms — facilitation, dispersal limitation, fire-adapted traits — before
      you'll know which variables even belong in your equations. The danger of formalizing too early
      is 'GIGO' — garbage in, garbage out. I'd suggest following the Levins-style 'strategy of model
      building': sketch the qualitative causal graph first, identify which mechanisms dominate at
      which timescales, then formalize the dominant ones.
    expected_abstract: |-
      There's a genuine trade-off here, and the right sequence depends on what you know and what you
      want the theory to do. Mathematical precision forces clarity — it requires you to specify
      exactly what you mean by each term and makes your predictions testable. But if you formalize
      the wrong mechanisms, your equations will be technically rigorous and substantively wrong. A
      practical approach is to start with a qualitative causal diagram: identify the key processes
      (seed dispersal, soil recovery, competitive interactions among pioneer species) and the
      direction and rough magnitude of their relationships. This lets you check whether the
      mechanisms are coherent and whether you've missed important feedbacks before committing to
      functional forms. Once the qualitative structure seems sound, choose the simplest mathematical
      representation that captures the dominant dynamics — often a system of ordinary differential
      equations for population-level processes. Then iterate: if the model's predictions diverge
      from observed patterns, go back to the qualitative mechanisms rather than just tuning
      parameters.
- id: exemplar_reasoning_235
  paraphrases:
  - |-
    I want to add an extension to a Victorian terrace house in London. The planning department wants it to be 'subservient' to the original building, but I don't want it to just be a cheap imitation of the Victorian style. How should I think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: school_tradition
    specificity: implicit
    split: test
    expected_exemplar: |-
      This is one of the central debates in British architecture, and the interesting thing is
      there's a well-developed tradition of doing exactly what you want — a clearly contemporary
      extension that respects the original without mimicking it. The approach associated with what
      you might call the thoughtful British contemporary school — firms like Haworth Tompkins, or
      looking back at the influence of the Smithsons and later the richer strand of contextualism in
      UK practice — is to use contrast deliberately and honestly. The logic is that a good pastiche
      is still a lie, while a well-proportioned contemporary addition enters into a genuine dialogue
      with the original. 'Subservient' in planning terms doesn't mean stylistically matching — it
      means lower in height, set back from the principal elevation, and modest in footprint. Within
      those constraints, there's tremendous freedom. The RIBA award-winning practice Haworth
      Tompkins, for example, often works with raw, honest materials — stock brick that references
      Victorian context in texture and color without copying the decorative language, or weathering
      steel and dark timber that recede visually against the original masonry. The key move is to
      make the junction between old and new legible and clean: a slot of glazing at the connection
      point, sometimes called a 'light gap,' lets both structures read as complete in themselves.
      This approach is also consistent with the Venice Charter principle — widely accepted in
      conservation circles — that additions to historic fabric should be distinguishable but
      harmonious. The planning officer's concern is usually about scale and roofline, not style; a
      flat-roofed extension in dark brick that sits clearly behind the original parapet will almost
      always satisfy the 'subservient' test while being entirely honest about when it was built.
    expected_abstract: |-
      The planning requirement for 'subservience' is primarily about massing and scale rather than
      stylistic copying, which gives you more freedom than it might initially suggest. An extension
      reads as subservient when it is set back from the principal facade, lower than the original
      roofline, and modest in its footprint relative to the host building. Within those parameters,
      a contemporary design is not only permissible but often preferable to imitation, since modern
      materials and detailing handled honestly tend to age better than approximations of historical
      craft. To make the extension feel coherent with the original without replicating it, draw on
      the existing building's proportional logic — match window heights, honor the rhythm of
      vertical elements, and respect the predominant material color even if you use a different
      material. A clear visual break or 'light gap' between the old and new structure allows both to
      be read as complete, avoiding a muddled hybrid. Flat roofs or simple pitched geometries that
      don't compete with the Victorian roofscape typically satisfy planners. Choose materials that
      weather in sympathy with the existing brick — dark engineering brick, zinc, or charred timber
      all tend to work well in this context — and detail the junction between old and new carefully
      so it reads as intentional rather than unresolved.
- id: exemplar_reasoning_236
  paraphrases:
  - |-
    I have a long, narrow urban infill lot — about 18 feet wide and 90 feet deep. I need to fit a 3-bedroom house on it. What are the key design strategies?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: test
    expected_exemplar: |-
      The long narrow lot is practically the founding problem of two very distinct architectural
      traditions, and how you approach it depends on which you find more compelling. The Dutch and
      Belgian urban housing tradition — embodied in firms like MVRDV and in the canal-house typology
      that goes back centuries — treats the narrow dimension as a generator rather than a
      constraint. You stack functions vertically, use a tight internal stair as the organizational
      spine, and let each floor be its own room-sized world. MVRDV's work pushes this to an extreme
      with section-cut facades and stacked programmatic surprises, but the underlying logic is the
      same: depth is your friend. Light comes from front and back, and the middle of the plan is the
      problem to solve, often with a courtyard slot or light well. The Japanese machiya tradition
      offers a different answer to the same problem. The Kyoto townhouse type — studied and
      reinterpreted by architects like Kengo Kuma and Yoshiharu Tsukamoto of Atelier Bow-Wow —
      punctuates the long plan with a series of small garden courts, so you move through the house
      as a sequence of indoor-outdoor moments. Natural light reaches deep into the plan not through
      windows on the sides but through voids carved into the section. For an 18-by-90 lot with three
      bedrooms, I'd combine both instincts: use the Dutch vertical stacking logic to keep the
      footprint efficient, and borrow the machiya light-court strategy to bring the middle of the
      plan alive. Locate one court at roughly the midpoint and another near the rear, and treat the
      stair as both circulation and the social heart of the section.
    expected_abstract: |-
      An 18-by-90 lot is tight but very workable for three bedrooms if you think carefully about
      section, light, and circulation. The main challenges are getting daylight into the middle of
      the plan and avoiding a layout that feels like a corridor. For light, consider introducing one
      or two interior courtyards or light wells at the midpoint and rear of the lot — these break
      the tunnel effect and give interior rooms borrowed light and a sense of connection to the
      outside. Stack the program vertically: put shared living and kitchen on the ground floor near
      the rear garden, bedrooms on the upper floors, and use the stair as an active organizing
      element rather than hiding it. Keep the facade at the street simple and solid to maximize
      interior floor area, but make the rear facade as open as possible toward the private outdoor
      space. The key is to think of the plan as a sequence of conditions — public to private, dark
      to light — rather than a series of equivalent rooms lined up in a row.
- id: exemplar_reasoning_237
  paraphrases:
  - |-
    I'm developing a vinaigrette and it always tastes sharp and one-dimensional. What am I doing wrong?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: test
    expected_exemplar: |-
      A flat or sharp vinaigrette usually comes down to two different problems depending on which
      culinary tradition you're thinking in. The classic French kitchen — Escoffier through to the
      Bocuse generation — would diagnose your problem immediately as a ratio issue and an
      emulsification issue: the traditional ratio is 3 parts oil to 1 part acid, and without a
      proper emulsifier like Dijon mustard whisked in first, the dressing 'breaks' and the acid hits
      the palate in spikes rather than rounding out. That's the sharp, one-dimensional sensation.
      But the way Alice Waters and the Chez Panisse tradition approach a vinaigrette is less about
      ratios and more about ingredient quality and layering: good wine vinegar with actual
      complexity, finishing with a small pinch of salt added directly to the acid before the oil
      goes in (it won't dissolve in oil), and sometimes a whisper of shallot or honey to build
      dimension. Waters would also tell you to taste the vinegar before you ever start — a harsh
      industrial vinegar cannot be fixed by technique. So the fix is probably: add a teaspoon of
      Dijon to your emulsification step (French fix), and audit your vinegar and add a small amount
      of honey or shallot for complexity (Chez Panisse fix). Together they'll take it from sharp and
      flat to balanced and interesting.
    expected_abstract: |-
      A sharp, one-dimensional vinaigrette usually has a few fixable problems. First, check your
      oil-to-acid ratio — the standard is about 3 parts oil to 1 part acid; going heavier on the
      vinegar makes it aggressive. Second, add an emulsifier like Dijon mustard, which binds the oil
      and vinegar together so the acid is distributed evenly and doesn't spike on your palate.
      Third, add balance: a tiny amount of honey, maple syrup, or sugar softens sharpness without
      making the dressing taste sweet. Fourth, dissolve your salt in the acid before adding the oil,
      since salt won't dissolve in oil. Finally, taste your vinegar on its own — if it's harsh and
      cheap, no technique will save you. A good sherry vinegar or champagne vinegar has natural
      complexity that carries into the finished dressing.
- id: exemplar_reasoning_238
  paraphrases:
  - |-
    I have a function that's grown to about 400 lines and does way too much. What's the best way to break it down?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: test
    expected_exemplar: |-
      This is a classic problem that Martin Fowler has written about extensively — he'd recognize
      this immediately as a case for what he calls 'Extract Method' and the broader discipline of
      'decomposing conditionals.' His key heuristic from Refactoring is that any block of code that
      makes you want to write a comment explaining *what* it does is a candidate for extraction into
      a named function. The name replaces the comment. Beyond that, Robert C. Martin (Uncle Bob)
      would push even harder: his Single Responsibility Principle, as articulated in Clean Code,
      says a function should do *one thing* and do it at *one level of abstraction*. He'd look at
      your 400-line function and ask: is it mixing high-level orchestration (calling other steps)
      with low-level detail (parsing strings, doing arithmetic)? That mixing of abstraction levels
      is the real smell. Split the function into a small 'conductor' that calls clearly named
      sub-functions, each of which operates at a uniform level of detail. Where Fowler and Martin
      agree: start by identifying the seams — natural clusters of variables that only talk to each
      other. Those clusters almost always want to be their own functions or even their own objects.
    expected_abstract: |-
      A 400-line function almost certainly violates the single responsibility principle — it's doing
      too many things at once. Here's a systematic approach to breaking it down: 1. **Identify
      logical phases**: Read through the function and annotate sections with what they're doing
      (e.g., 'validate input', 'fetch data', 'transform', 'write output'). Each distinct phase is a
      candidate for extraction. 2. **Extract by cohesion**: Group lines that share the same local
      variables and purpose. If a cluster of lines only touches variables A, B, and C, that's a good
      signal they belong in their own function. 3. **Name by intent, not implementation**: Name each
      extracted function after *what* it accomplishes, not *how* — `validateUserInput()` not
      `checkStringsAndInts()`. 4. **Maintain a single level of abstraction**: The parent function
      should read like a high-level outline — calling named sub-functions — without dropping into
      low-level detail itself. 5. **Refactor incrementally**: Extract one piece at a time and run
      your tests between each extraction to avoid introducing bugs.
- id: exemplar_reasoning_239
  paraphrases:
  - |-
    I'm writing a scene where a character receives devastating news. I can either show their immediate emotional breakdown in vivid detail, or pull back and describe mundane physical details while leaving the grief implicit. Which approach is stronger?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: test
    expected_exemplar: |-
      This is essentially the Chekhov versus Dostoevsky choice, and both strategies can work
      brilliantly — the question is which fits your story's register. Dostoevsky plunges directly
      into the emotional maelstrom: characters wail, stammer, fall to their knees, articulate their
      anguish in torrential interior monologue. The reader is dragged into the feeling at full
      voltage. This works when your narrative is already operating at high emotional temperature,
      when the scene is a culmination, or when the character's psychology is the explicit subject of
      the book. Chekhov does the opposite — and it's what made him revolutionary. In stories like
      'The Bishop' or 'Misery,' the most devastating moments are conveyed through a horse that won't
      listen, a candle guttering out, a character straightening objects on a table. The grief lands
      harder precisely because it isn't named. This technique is what Hemingway formalized into his
      iceberg theory, and it's become the default mode of contemporary literary fiction for good
      reason: restraint creates complicity. The reader fills the gap, making the emotion partly
      their own construction. The implicit approach is probably stronger in most cases, especially
      for a first encounter with devastating news — shock produces numbness and strange focus on
      small things, which is also more psychologically accurate. Reserve the full emotional flood
      for a later scene, after it has had time to sink in. That's how both Chekhov and the writers
      he influenced (Raymond Carver being the clearest American descendant) tend to structure
      emotional revelation: the crack appears before the collapse.
    expected_abstract: |-
      Both approaches have real merit, and the choice depends on your story's tone and what the
      scene needs to accomplish. Showing the immediate emotional breakdown can be powerful and
      immersive, making the reader feel the impact directly — but it risks melodrama if the writing
      isn't precise, and it can exhaust emotional reserves the reader needs for later in the story.
      Pulling back to mundane physical details — what's sometimes called 'objective correlative' —
      often lands harder because it's psychologically realistic (shock produces dissociation and
      strange hyperawareness of small things) and because it creates interpretive space for the
      reader. When you don't name the emotion, the reader constructs it themselves, which makes it
      more personal and often more affecting. As a general rule, restraint tends to be the stronger
      choice for the moment of receiving bad news, with fuller emotional texture coming later once
      the character has had time to process. The exception is if your narrative is already operating
      at high emotional intensity throughout, in which case pulling back might feel evasive rather
      than artful. Match the scene's emotional temperature to the book's overall register.
- id: exemplar_reasoning_240
  paraphrases:
  - |-
    I'm trying to develop a more attacking style in chess. My games tend to be positionally solid but I rarely get exciting attacks. What separates players who generate real kingside attacks from those who just look like they might?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: stylistic_attribution
    specificity: direct
    split: test
    expected_exemplar: |-
      The clearest way to understand this distinction is through the contrast between Tal and
      Nezhmetdinov on one side, and what we might call 'pseudo-attackers' on the other. Tal's
      attacks worked not because he calculated everything — he famously admitted he sometimes
      couldn't — but because he created positions so complex and psychologically uncomfortable that
      even objectively sound defenses felt impossible under pressure. His style was about maximizing
      the burden on the opponent. Nezhmetdinov was similar: he'd wreck his own pawn structure to
      activate pieces, trusting piece activity over everything else. Compare that to someone like
      the early Karpov, who could look like he was attacking but was really just tightening a
      positional vice — the 'attack' was just the final stage of a long squeeze. The real attackers
      share something: they're willing to make structurally ugly moves to keep pieces active.
      Kasparov had a slightly different flavor — his attacks were deeply prepared in opening theory,
      so the 'creativity' often happened at home. If your games are positionally solid but
      attackless, the Tal lesson is probably the relevant one: you're likely resolving tension too
      early and trading pieces that should be kept. Real attacks come from piece activity and
      unresolved complications, not just having your pieces aimed at the king.
    expected_abstract: |-
      Generating real attacks rather than the appearance of attacks comes down to a few key factors:
      piece coordination, pawn structure alignment with your piece placement, and timing. Effective
      attacks usually require open or half-open files toward the enemy king, active pieces that
      can't be easily traded off, and a concrete threat that forces your opponent to respond rather
      than counterattack. Players who only look attacking often lack a forcing continuation — they
      have pieces aimed at the kingside but no way to break through. Focus on not resolving tensions
      too early, keeping your most active pieces on the board, and ensuring your attack has concrete
      threats backed by calculation rather than just positional pressure. Studying tactical patterns
      around king attacks — back rank weaknesses, piece sacrifices on h7 or g7, rook lifts — will
      also help you recognize and create these opportunities.
- id: exemplar_reasoning_241
  paraphrases:
  - |-
    I'm designing an API for a new service and I can't decide whether to use a handful of flexible, general-purpose endpoints that accept lots of optional parameters, or a larger set of narrow, single-purpose endpoints. What are the trade-offs?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: test
    expected_exemplar: |-
      This trade-off maps almost perfectly onto two distinct schools of API design philosophy. The
      'few flexible endpoints' approach has a very HATEOAS/REST purist feel — the kind of thing Roy
      Fielding advocates when he talks about uniform interfaces and resource-orientation. The upside
      is that clients don't need to know your internal action vocabulary; the downside is that your
      endpoint logic becomes a decision tree and documentation gets complicated fast. The 'many
      narrow endpoints' approach is much more in the spirit of the RPC tradition — and if you look
      at how Google designs its internal APIs (as described in the AIP guidelines, or in how gRPC
      services are modeled), each method is a verb with a precise contract. GraphQL sits in a
      fascinating middle ground: it's associated with the Facebook/Meta engineering culture, where
      the client drives the query shape and the server exposes a typed schema rather than endpoint
      semantics at all. Stripe's public REST API is often cited as the gold standard of the
      narrow/purposeful approach — each endpoint does one thing clearly and the learning curve is
      low. If your clients are diverse external developers, the Stripe model tends to win on
      developer experience. If you're building internal services at scale with known consumers, the
      gRPC/RPC model gives you stronger contracts. The flexible-parameter approach tends to age
      poorly because optional parameters accumulate and the implicit combinations become a
      maintenance nightmare — something Martin Fowler flags explicitly when discussing interface
      segregation in API evolution.
    expected_abstract: |-
      The core trade-off is between flexibility and clarity. A few general endpoints with many
      optional parameters reduce the surface area of the API and can handle more use cases without
      versioning, but they introduce implicit coupling between parameters, make validation harder,
      and force clients to understand a complex combinatorial space. Many narrow endpoints are
      easier to document, test, and version independently — each endpoint has a clear contract and
      failure modes. The downsides are a larger surface area and more client code to call different
      endpoints. In practice, narrow endpoints tend to be preferred when your clients are external
      or varied, because discoverability and clarity matter more. Flexible endpoints can work well
      for internal services where the consuming teams are tightly coordinated with the producing
      team and can tolerate more implicit knowledge. A useful heuristic: if you find yourself
      writing 'if param X is set and param Y is not set, then...' logic inside a single endpoint,
      that's a signal to split it.
- id: exemplar_reasoning_242
  paraphrases:
  - |-
    I have a theory that seems to explain my data really well, but a colleague says I might be overfitting — just telling a story that fits the observations rather than capturing something real. How do I know if my theory is genuinely explanatory?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: stylistic_attribution
    specificity: direct
    split: test
    expected_exemplar: |-
      Your colleague's worry is essentially a Popperian one, and it's the right worry to have. Karl
      Popper's entire philosophy of science was organized around exactly this trap: a theory that
      can accommodate any possible data isn't explaining anything, it's just redescribing. The test
      he proposed is falsifiability — does your theory make predictions that could, in principle, be
      proven wrong? If you can tweak the theory post-hoc to fit every new observation, it has a very
      ad hoc, Ptolemaic feel (Ptolemy kept adding epicycles to geocentrism to match observations,
      which 'fit' but explained nothing deep). The contrast is something more like Einsteinian
      boldness: general relativity made a specific, novel, counterintuitive prediction — that
      gravity bends light — which was then tested and confirmed. That's the hallmark of genuine
      explanation. Statistician George Box had a related instinct: 'all models are wrong, but some
      are useful,' meaning the goal isn't perfect fit but predictive leverage on new data. The most
      practical test is cross-validation in the Vapnik spirit: hold out data your theory hasn't
      seen, and see if it still holds. A genuinely explanatory theory should generalize; an
      overfitted story falls apart on new cases. Predict something you haven't yet measured, then go
      measure it.
    expected_abstract: |-
      The key distinction between genuine explanation and overfitting is predictive generalization.
      A theory that was constructed to fit existing data may fit it perfectly while failing on new
      data — that's overfitting. To test whether your theory is genuinely explanatory, apply these
      checks: First, does it make novel predictions about data you haven't yet collected? Go collect
      that data and see if the predictions hold. Second, is the theory falsifiable — are there
      outcomes it rules out? If it can accommodate any possible result with minor adjustments, it
      isn't explaining, it's redescribing. Third, apply cross-validation: split your data into
      training and test sets, build the theory on the training portion, and evaluate it on the
      held-out portion. Fourth, count your free parameters — a theory with many adjustable
      parameters can fit almost anything and should be held to a higher predictive standard than a
      simpler one. Parsimony matters: if a simpler theory fits equally well, prefer it.
- id: exemplar_reasoning_243
  paraphrases:
  - |-
    In the middlegame I tend to get overwhelmed by tactics. I can see one or two moves ahead but my opponent always seems to find combinations I completely miss. What's the mindset I should develop to get better at spotting combinations?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: test
    expected_exemplar: |-
      There are really two different mindsets for tactical vision in chess, and the contrast between
      how Mikhail Tal and Anatoly Karpov approached the same board is illuminating. Tal's method was
      almost predatory — he constantly asked 'what can I sacrifice here?' before calculating whether
      it worked. He'd identify loose pieces, uncastled kings, and overloaded defenders, then
      essentially force his brain to *look* for combinations by starting from the assumption that
      one existed. His tactical vision was fueled by aggressive hypothesis-generation: assume chaos
      is possible, then check. Karpov, by contrast, found tactics through positional suffocation —
      he improved his pieces so methodically that combinations arose almost inevitably from superior
      coordination. His approach was: if every piece is on its best square and your opponent's are
      on bad ones, tactical shots appear naturally because the geometry is already in your favor.
      For a practical player trying to improve, Tal's approach is the more trainable one in the
      short term: before every move, ask 'is there a forcing sequence here?' and scan for checks,
      captures, and threats — in that order. Train yourself to *look* before you calculate. But also
      study Karpov to understand that the real foundation of tactical vision is *positional
      awareness*: combinations almost always emerge from structural advantages — forks from poorly
      placed knights, pins from open diagonals, discovered attacks from piece activity. Build the
      position right, and the tactics announce themselves.
    expected_abstract: |-
      Tactical vision is a skill you can develop, and it comes down to training your pattern
      recognition and your discipline in checking forcing moves. The core habit is: before every
      move, ask yourself whether there's a check, capture, or serious threat available — not just
      for you, but for your opponent. Most missed tactics happen because players don't look; they
      assume the board is quiet and play positionally when a forcing sequence exists. Beyond that
      habit, the most effective way to improve is solving tactical puzzles daily — not just to get
      the right answer, but to internalize the underlying patterns: pins, forks, skewers, discovered
      attacks, overloaded pieces. Over time your brain starts recognizing the *preconditions* for
      combinations (a loose piece here, an undefended back rank there) before you consciously
      calculate. Also study your own games: when you miss a tactic, understand not just what you
      missed but what the position looked like — what pattern you failed to recognize. That
      reflection accelerates learning far more than just doing puzzles without review.
- id: exemplar_reasoning_244
  paraphrases:
  - |-
    I want to write a scene where nothing much happens plot-wise—two people talking over dinner—but I want it to feel absolutely electric. How do writers make mundane scenes crackle with tension?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: test
    expected_exemplar: |-
      This is where the distance between Hemingway and Henry Green becomes really clarifying.
      Hemingway's famous answer—which you can see in 'Hills Like White Elephants'—is to strip the
      dialogue down to its barest surface and let everything important exist in what's not said. The
      characters talk around the real subject; they discuss beaded curtains and drinks and the hills
      while an enormous decision sits between them unspoken. The tension is entirely subterranean.
      The reader does the work of inference, which creates a kind of readerly anxiety that's more
      sustained than any explicit confrontation would be. The technique depends on absolute economy:
      nothing in the scene that doesn't carry suppressed weight. Henry Green—whose novels like
      Loving and Party Going are masterclasses in social tension—works differently. His dialogue is
      elliptical and class-coded, full of misunderstandings and people talking past each other, but
      the surface is almost comic in its mundanity. The electricity in Green comes from the reader
      gradually understanding that characters are pursuing completely different agendas within the
      same conversation, often without knowing it themselves. Where Hemingway's characters
      consciously avoid a subject, Green's characters often don't even realize they're at
      cross-purposes. For your dinner scene, the question is whether the tension is known or unknown
      to the characters. If both people know what's unspoken, Hemingway's method—charged minimalism,
      loaded objects, strategic silences—is the template. If the tension comes from asymmetric
      knowledge or social friction neither character fully understands, Green's misaligned dialogue
      and comic-sinister undertow might serve you better.
    expected_abstract: |-
      Mundane scenes generate tension when there's a gap between what's happening on the surface and
      what's actually at stake emotionally or socially. A few reliable techniques: use subtext in
      the dialogue, where characters talk around the real subject rather than addressing it
      directly. Load the physical details—what people eat, how they hold their glasses, what they
      look at—with emotional significance so the scene has two registers running simultaneously.
      Introduce asymmetric knowledge, where one character knows something the other doesn't, which
      creates dramatic irony. Interrupt the rhythm of the scene with small, unexpected beats that
      signal unease without explaining it. You can also use the pacing of the prose itself—shorter
      sentences when the tension is rising, longer ones when a character is deflecting or stalling.
      The goal is to make the reader feel that the real conversation is always happening one layer
      below the one on the page.
- id: exemplar_reasoning_245
  paraphrases:
  - |-
    I'm writing a mystery novel and I can't decide whether to keep the narration close and claustrophobic — inside one detective's head — or pull back to something more omniscient and atmospheric. What are the trade-offs, and which approach tends to work better for building suspense?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: school_tradition
    specificity: direct
    split: test
    expected_exemplar: |-
      These two modes map pretty cleanly onto two great traditions in crime fiction. The close
      first-person school — think Chandler and Hammett's hardboiled tradition, or more recently Tana
      French — treats the detective's subjectivity as the whole point. The reader is locked inside a
      consciousness that is itself unreliable, obsessive, or morally compromised, and suspense comes
      from not knowing how much to trust what you're being told. The claustrophobia is a feature,
      not a bug. The other tradition is what you might call the classic Golden Age approach —
      Christie, Sayers, Marsh — where the narration stays a little cooler and more theatrical. The
      omniscient or lightly detached third-person voice lets you stage scenes, plant clues fairly in
      plain sight, and give the reader a sporting chance at solving the puzzle. Suspense here comes
      from dramatic irony rather than unreliability. If your book is more about psychology and
      atmosphere, the French/Chandler model will feel natural. If it's more about plot architecture
      and puzzle-satisfaction, the Christie model tends to reward the reader more fairly. Most
      contemporary literary crime — Donna Tartt, say — blends the two by using close third-person,
      which gives you interiority without fully committing to a single fallible narrator.
    expected_abstract: |-
      The choice really comes down to what kind of suspense you're building. A close, limited
      perspective — inside one character's head — creates suspense through restricted information:
      the reader only knows what your detective knows, which generates anxiety and intimacy. The
      risk is that it can feel claustrophobic in a negative way if the protagonist's voice isn't
      compelling enough to sustain the whole novel. An omniscient or more distanced narration lets
      you plant information across multiple scenes, build dramatic irony, and create a more
      architecturally satisfying puzzle. The trade-off is that it can feel cooler and less
      emotionally gripping. Generally, if character interiority and psychological texture are your
      strengths, go close. If you're confident in your plot construction and want to give readers a
      fair puzzle, the wider view works better. Many successful mysteries use a limited third-person
      as a middle path — you get interiority without full unreliable-narrator commitment.
- id: exemplar_reasoning_246
  paraphrases:
  - |-
    I'm trying to decide whether to finish my braised short rib sauce by reducing it aggressively until it's thick and glossy, or keep it looser and more broth-like. What's the better call?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: test
    expected_exemplar: |-
      This is genuinely a fork in the road that maps onto two different culinary philosophies.
      Thomas Keller — especially in his French Laundry work — tends to favor the aggressive
      reduction: he wants a sauce that coats, that has structural presence, that signals labor and
      concentration. His sauces are almost architectural. On the other side, someone like David
      Chang or the Momofuku school leans toward keeping braising liquids looser and more
      broth-adjacent — the idea being that a lighter, more liquid sauce lets the collagen and
      meatiness of the short rib speak without the sauce competing for richness. The Keller approach
      makes sense if this is a plated restaurant-style dish where the sauce is a design element; the
      Chang-ish approach works better if you're serving it over noodles or rice where the broth can
      soak in. A third option: Fergus Henderson at St. John would likely tell you to do almost
      nothing — serve the braising liquid as-is, slightly defatted, because fussing with it
      disrespects the ingredient. So: what's the dish trying to be?
    expected_abstract: |-
      It depends on how you're serving it and what texture you want at the table. If you reduce
      aggressively, you get a glossy, concentrated sauce that clings to the meat and has intense
      flavor — better for plated presentations. If you keep it loose, the liquid is more versatile:
      it soaks into sides, feels lighter, and lets the meat's natural gelatin come through without
      the sauce dominating. A middle path is to skim the fat, strain the liquid, and reduce it only
      until it naps a spoon lightly. Taste as you go — over-reduction makes braising sauces cloying
      and can turn the natural sweetness bitter.
- id: exemplar_reasoning_247
  paraphrases:
  - |-
    I'm trying to choose between two chess styles to develop: very sharp tactical play or deep positional understanding. Which is more important to focus on first as an improving club player?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: school_tradition
    specificity: direct
    split: test
    expected_exemplar: |-
      This question maps almost perfectly onto one of the defining fault lines in chess pedagogy,
      and you can learn a lot from how different schools answered it. The classical Soviet training
      method — as practiced by coaches like Dvoretsky and formalized in institutions like the
      Central Chess Club in Moscow — strongly emphasized tactics first, on the grounds that
      positional understanding without the ability to calculate is useless: you'll form a correct
      plan and then blunder a piece. Dvoretsky's 'Tragicomedy in the Endgame' and his puzzle books
      reflect this: calculation accuracy is the non-negotiable baseline. But the Romantics and early
      hypermodernists like Nimzowitsch argued the opposite — that tactical players who never develop
      positional sense hit a ceiling quickly, because once opponents stop hanging pieces, you need
      something else. Capablanca is the great test case: he had almost no famous tactical
      brilliancies, yet dominated through positional clarity. His 'Chess Fundamentals' is
      essentially an argument that pure technique and positional logic will beat tactics every time
      at the club level because opponents' plans are bad enough that you don't need to complicate.
      The modern synthesis, endorsed by most serious coaches, is closer to the Soviet view for
      beginners: fix your tactics first (Yusupov's 'Build Up Your Chess' series embodies this), then
      layer in positional understanding. Positional mistakes lose slowly; tactical mistakes lose
      immediately.
    expected_abstract: |-
      For an improving club player, tactics should generally come first — and for a practical
      reason. Tactical errors (blunders, missed forks, overlooked checks) are the primary source of
      lost games at the club level. Building a foundation of pattern recognition for basic tactical
      motifs — pins, forks, skewers, discovered attacks — will have the most immediate impact on
      your results. Positional understanding matters enormously, but it pays off over longer time
      horizons: you'll make slightly better plans and accumulate small advantages that often don't
      convert against opponents who can find a tactic to escape. Once your tactical vision is
      reliable, investing in positional understanding — pawn structures, piece activity, weak
      squares — will help you convert the advantages that tactics alone can't create. In practice,
      you should work on both, but weight your study time toward tactics until your blunder rate
      drops significantly.
- id: exemplar_reasoning_248
  paraphrases:
  - |-
    I want to add umami depth to a vegetarian dish without it tasting like I just threw in soy sauce. What's the most sophisticated way to build that savory backbone?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: test
    expected_exemplar: |-
      There are really two schools here and they point in quite different directions. The Japanese
      kaiseki tradition, as interpreted by someone like Yoshihiro Murata, builds umami through
      layered dashi — kombu, shiitake, and dried mushrooms steeped at precise temperatures to
      extract glutamates without bitterness, creating a savory depth so clean it barely announces
      itself. This approach treats umami as a foundation, not a feature: invisible scaffolding that
      makes everything else taste more like itself. The contrast is the Mediterranean umami
      tradition that Yotam Ottolenghi works in so fluently — layering tomato paste cooked dark in
      oil, miso stirred into a braise, fermented black garlic, aged hard cheeses like Parmigiano or
      Pecorino, and caramelized alliums. This approach makes umami visible and textural; you taste
      it as part of the dish's personality rather than beneath it. For sophistication without
      telegraphing your method, start Murata-style: make a kombu and dried shiitake stock as your
      cooking liquid, add a small amount of white miso at the end off the heat, and finish with a
      few drops of good soy only if needed as a seasoning rather than a flavor. The umami reads as
      depth, not as any single ingredient. If you want that Ottolenghi warmth and richness, roast
      tomato paste in olive oil until brick-red before building your sauce — it creates a glutamate
      base that reads as caramelized complexity, not condiment.
    expected_abstract: |-
      The key is layering multiple umami sources at different stages of cooking rather than relying
      on any single ingredient. Umami comes from glutamates, which are present in a wide range of
      vegetarian ingredients: dried mushrooms (especially porcini and shiitake), tomato paste cooked
      down in fat, kombu seaweed, fermented ingredients like miso and nutritional yeast, aged hard
      cheeses if you use dairy, and even roasted or caramelized alliums. The sophistication comes
      from using these in small quantities and at the right moments — dried mushroom soaking liquid
      added to a braise, a spoonful of white miso whisked into a sauce off the heat, a piece of
      kombu simmered in your cooking liquid and removed before serving. Cooking tomato paste in oil
      until it darkens from red to brick transforms it from acidic to deeply savory. Combining two
      or three sources creates a synergistic effect where the total umami is greater than the sum of
      the parts. The goal is that the savory depth reads as the dish itself rather than as any
      identifiable additive.
- id: exemplar_reasoning_249
  paraphrases:
  - |-
    I'm trying to decide how to attack an unsolved problem in number theory. The problem has both an analytic side (something you can say with L-functions and zeros) and a more elementary algebraic side. Which angle tends to actually crack these things?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: test
    expected_exemplar: |-
      You're sitting right at the historic fault line of number theory, which is basically the
      tension between the Erdős worldview and the Selberg–Deligne worldview. Erdős was the supreme
      champion of elementary methods — his collaboration with Selberg on an elementary proof of the
      Prime Number Theorem was almost a manifesto. The argument wasn't just that elementary proofs
      are cleaner; it was that forcing yourself to work without analytic machinery reveals
      combinatorial and arithmetic structure that gets obscured when you reach for a
      complex-analytic sledgehammer. Erdős's instinct was always to find an inequality, a counting
      argument, a pigeonhole-type observation that made the result feel inevitable without any heavy
      apparatus. But Deligne's proof of the Weil conjectures, or the entire program Langlands laid
      out, represents the opposite conviction: that the 'real' reason deep number-theoretic facts
      are true lives in the analytic and geometric structure — L-functions, their zeros, their
      functional equations. When Riemann wrote down his zeta function, the claim was that the
      primes' distribution is secretly controlled by complex analysis, and every major breakthrough
      since (class field theory, modularity, the proof of Fermat's Last Theorem via Wiles) has
      vindicated the analytic/algebraic geometry side. Practically: if your problem has a known
      L-function attached to it and you can say something about its analytic properties, that's
      often the more powerful lever — the analytic side has more machinery. But if you're not sure
      what the 'right' L-function even is, or if the problem has a finitistic, combinatorial flavor,
      Erdős-mode exploration of elementary inequalities can reveal the right conjecture to prove
      analytically later. The two sides often collaborate: elementary arguments find the structure,
      analytic methods confirm it at scale.
    expected_abstract: |-
      Both analytic and algebraic/elementary approaches have yielded major results in number theory,
      and the right choice depends heavily on your specific problem. Analytic methods — particularly
      those involving L-functions, Dirichlet series, and the distribution of zeros — are extremely
      powerful for questions about the distribution of primes or arithmetic functions, because they
      connect number theory to complex analysis and allow you to import tools like contour
      integration and the Phragmén–Lindelöf principle. If your problem is intrinsically about
      asymptotics or density, analytic methods are usually more potent. Elementary algebraic
      approaches have the advantage of working directly with the arithmetic structure, which
      sometimes reveals why something is true rather than merely that it is. They're also useful
      when the analytic objects (like L-functions) are hard to construct or their properties hard to
      establish. A common strategy is to work both angles simultaneously — using elementary
      observations to constrain the shape of the answer and analytic methods to get the quantitative
      bounds or exact results.
- id: exemplar_reasoning_250
  paraphrases:
  - |-
    We're renovating a 1960s brutalist office building and the client wants to preserve the concrete character while making it more human and livable. What's the design philosophy we should bring to this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: school_tradition
    specificity: direct
    split: test
    expected_exemplar: |-
      This is exactly the problem that the later Team 10 architects and the more humanist wing of
      brutalism were already grappling with from the inside. Peter and Alison Smithson, for
      instance, always insisted that brutalism wasn't about brute material expression for its own
      sake — it was about honesty of structure serving human association. Their concept of 'as
      found' was about celebrating the rawness of materials while embedding them in patterns of
      human life and movement. In practice, what this means for your renovation is: don't apologize
      for the concrete, but layer it with things that show habitation over time. Lacaton & Vassal,
      the French firm, have become the definitive contemporary school for exactly this problem —
      their approach to social housing renovation in Bordeaux and elsewhere was to add light and
      space rather than strip and rebuild. They attached winter gardens and glazed loggias to
      brutalist slab facades, flooding interiors with light without erasing the structural
      legibility of the original. The concrete remains; the life around it transforms. The Japanese
      metabolist sensibility is also useful here — Kenzo Tange's later work accepted that buildings
      are living organisms that accumulate layers. Letting your renovation show its era rather than
      pretending to be the original building is philosophically honest and usually more successful
      aesthetically. So: preserve exposed concrete in structural and circulation zones, introduce
      warm secondary materials (timber, plants, textured plaster) in social spaces, and add light
      aggressively — whether through new atria, enlarged openings, or attached glazed volumes.
    expected_abstract: |-
      The core challenge is softening a material palette that reads as cold or austere without
      erasing the building's structural honesty, which is its main architectural asset. Start by
      identifying which concrete surfaces are loadbearing and expressive — these should stay exposed
      and celebrated. Secondary spaces like corridors, service cores, and storage can be lined with
      warmer materials: timber paneling, acoustic fabric, or textured plaster that contrast with and
      complement the raw concrete. Light is the biggest lever. Brutalist buildings often have deep
      floor plates and small punched windows. Wherever feasible, enlarge openings, add clerestories,
      or introduce interior courtyards or atria to bring daylight deeper into the building. Light
      transforms how concrete reads — the same surface feels cold in artificial light and warm in
      natural light. Landscaping and biophilic elements — indoor planting, green roofs visible from
      upper floors, exterior courtyard gardens — humanize the mass without altering the structure.
      Finally, ensure the ground floor is activated and permeable to the street, which is often
      where brutalist buildings fail socially.
- id: exemplar_reasoning_251
  paraphrases:
  - |-
    We're designing an API and there's a debate on the team: should we make it very granular with lots of small endpoints, or fewer coarse-grained endpoints that return more data at once? What are the tradeoffs?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: test
    expected_exemplar: |-
      This debate maps almost perfectly onto the REST vs. GraphQL philosophical divide, but it's
      actually older — it echoes the Unix tradition versus the enterprise Java tradition. The Unix
      school (popularized in API design by Roy Fielding's REST constraints and later championed by
      practitioners like Martin Fowler in his microservices writing) argues for small, composable,
      single-responsibility endpoints: each resource is a noun, each operation is a verb, and
      clients compose what they need. The cost is chattiness — multiple round-trips for related
      data. The GraphQL school, which Facebook's team codified out of genuine pain with REST's over-
      and under-fetching on mobile clients, pushes hard the other way: one endpoint,
      client-specifies-shape, server sends exactly what's needed. Then there's the older enterprise
      SOAP tradition, which used coarse-grained operations essentially for the opposite reason —
      network calls were expensive so you batched everything into one. For a modern API, the
      Fowler/REST approach makes sense if your clients are diverse and unpredictable; the GraphQL
      approach makes sense if you have one or a few known clients (especially mobile) with tight
      bandwidth constraints. Avoid the SOAP-style coarse endpoint if you can — it tends to create
      fat, hard-to-version contracts.
    expected_abstract: |-
      The core tradeoff is between network efficiency and interface simplicity. Granular endpoints
      are easier to understand, cache individually, and version independently, but clients often
      need several calls to assemble a full view, which increases latency and round-trips. Coarse
      endpoints reduce chattiness and can be more efficient for known use cases, but they tend to
      over-fetch, become hard to evolve, and can leak implementation details. A common middle path
      is to start with resource-oriented granular endpoints and add a few aggregate endpoints for
      the highest-traffic compound reads. If your clients are primarily mobile or the
      over/under-fetching problem becomes severe, GraphQL is worth considering because it lets the
      client specify exactly what it needs without multiplying endpoints.
- id: exemplar_reasoning_252
  paraphrases:
  - |-
    I'm a jazz guitarist trying to develop my single-note soloing. My lines feel too scale-runny and predictable. How do I get a more musical, less mechanical sound?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: school_tradition
    specificity: direct
    split: test
    expected_exemplar: |-
      This is exactly the problem that separates the bebop-derived schools from the post-bop
      tradition in guitar. The bebop vocabulary — coming through Charlie Christian and codified by
      Wes Montgomery — is built on arpeggios, chord tones, and enclosures: you target the strong
      tones of each chord (3rds, 7ths) and approach them chromatically from above or below. When
      lines feel 'scale-runny,' it usually means you're playing scales between the beats rather than
      using scales to connect chord-tone targets on the beats. Study Wes's phrasing: he constantly
      implies the harmony through arpeggiated shapes even when running through changes quickly. Jim
      Hall represents a different solution — his lines are famous for being sparse and
      conversational, with deliberate space and rhythmic displacement so that no two phrases start
      the same way or in the same register. He essentially imported a chamber-music sense of
      dialogue into jazz guitar. A third model is Pat Martino's approach: deeply geometric, using
      diminished and augmented shapes to create lines that feel inevitable rather than random.
      Practically, try this: transcribe one 8-bar Wes solo and identify where every phrase lands on
      a chord tone. Then work on your own lines by writing out the chord tones of a II–V–I and
      building short melodic cells that target them, connecting with scales only as connective
      tissue — not as the point of the line.
    expected_abstract: |-
      The 'scale-runny' problem comes from treating scales as the destination rather than the
      connective tissue between important notes. To fix it, focus on targeting chord tones —
      particularly the 3rds and 7ths that define each chord's quality — on the strong beats of each
      bar. Use chromatic approach notes and enclosures to arrive at those targets with intention.
      Rhythmic variety is equally important: vary your phrase lengths and start phrases on different
      beats rather than always beginning on beat one. Incorporate space deliberately — silence is
      part of phrasing, not a failure to play. Practice by singing lines before playing them, which
      forces you to think melodically rather than finger-mechanically. Transcribing solos you love
      and analyzing where each phrase begins, ends, and peaks will also rapidly accelerate your
      melodic vocabulary.
- id: exemplar_reasoning_253
  paraphrases:
  - |-
    I'm looking at two approaches to a distributed system I'm designing. One uses a central message broker that all services talk through; the other has services discover and call each other directly. Both work technically. Is there a way to characterize the philosophical difference between these two architectures?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: stylistic_attribution
    specificity: direct
    split: test
    expected_exemplar: |-
      Yes — this is almost exactly the split Martin Fowler and colleagues articulated as
      'choreography versus orchestration,' and the philosophical lineage behind each is quite
      distinct. The central-broker approach has a very Enterprise Integration Patterns feel — it's
      the world Gregor Hohpe and Bobby Woolf mapped out, where the bus or broker is a first-class
      architectural citizen that mediates all communication. This tradition, which runs through ESB
      (Enterprise Service Bus) architectures and tools like MuleSoft or Apache Camel, treats routing
      logic as infrastructure: the broker knows who talks to whom, and services are blissfully
      ignorant of each other. The appeal is control and observability — you have one place to audit,
      throttle, and reroute messages. The risk, which Fowler himself flagged, is that you get a
      'smart pipe' that becomes a God object at the infrastructure level — all your business logic
      quietly migrates into the broker's routing rules. Direct service-to-service discovery is much
      more in the Unix philosophy tradition — small pieces, loosely joined, as David Weinberger put
      it — and it's the aesthetic behind the microservices movement as Netflix Engineering and the
      early Amazon two-pizza-team architecture practiced it. Services own their behavior entirely;
      the network topology is dumb. This maps closely to the Actor model as Erlang/OTP implements
      it: each actor (service) knows its own logic, and coordination emerges from the interaction of
      independent agents rather than being managed centrally. The tradeoff is that your choreography
      logic is now distributed across services, which makes it harder to reason about system-wide
      behavior — you gain resilience and autonomy at the cost of observability and governance.
    expected_abstract: |-
      The core philosophical difference is between centralized coordination and decentralized
      autonomy. A central broker makes the communication infrastructure smart and the services
      simple — routing, sequencing, and mediation logic lives in one place, which makes it easy to
      change how services interact without touching the services themselves, but creates a single
      point of coupling and potential failure. Direct service-to-service communication makes each
      service responsible for knowing what it needs and how to get it, which increases service
      autonomy and resilience but distributes your coordination logic across the system, making
      global behavior harder to observe and reason about. The broker model optimizes for control and
      changeability of routing; the mesh model optimizes for service independence and failure
      isolation. For most systems, the deciding factors are team structure (do you want one team
      owning the broker?), observability requirements, and how often your communication patterns
      change versus how often individual service behaviors change.
- id: exemplar_reasoning_254
  paraphrases:
