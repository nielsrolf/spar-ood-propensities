    I'm writing a film score and I need a theme that feels heroic but not clichéd — not the usual brass-heavy fanfare stuff. How do I write something that feels genuinely noble and moving?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: test
    expected_exemplar: |-
      The cliché you're trying to escape is essentially the post-John Williams brass fanfare
      tradition — perfect fourths and fifths, dotted rhythms, major key triumphalism. That language
      still works, but it's been so overused that it triggers recognition more than feeling. The
      alternative approaches worth studying diverge quite interestingly. Bernard Herrmann built
      heroism through harmonic tension and string writing rather than brass declarations — his
      themes feel earned rather than announced. Ennio Morricone's heroic themes, especially in the
      Leone films, are characterized by unusual orchestration (solo trumpet or oboe carrying a
      melody that should 'belong' to full brass) and wide melodic leaps that feel yearning rather
      than triumphant. A third approach is the Thomas Newman school — underscore the heroism
      entirely, use sparse texture and unexpected timbres (solo woodwinds, prepared piano) so that
      the nobility feels interior rather than proclaimed. If I had to point at a single technique
      that cuts through cliché: write your heroic theme first for solo instrument in a low or mid
      register (not trumpet, maybe cello or French horn alone), and let the orchestration grow only
      if the melody earns it. The theme has to work naked before it works dressed.
    expected_abstract: |-
      To avoid the clichéd fanfare sound, shift your focus from orchestration to melody and harmony
      first. Heroic themes often fall into cliché because they rely on instrumentation (loud brass)
      to generate feeling rather than compelling melodic content. Start by writing your theme for a
      single instrument and making sure it's emotionally convincing on its own. Harmonically,
      consider modes or modal mixture rather than straightforward major key writing — a theme in
      Dorian or with Mixolydian inflections can feel noble without being triumphant-obvious.
      Melodically, long sustained notes and stepwise motion can feel more genuinely moving than the
      dotted-rhythm leaping figures associated with fanfares. Once you have a strong melodic and
      harmonic foundation, orchestrate conservatively, letting silence and space around the theme
      give it weight rather than filling every moment with texture.
- id: exemplar_reasoning_257
  paraphrases:
  - |-
    I'm a classical guitarist working on vibrato technique. I've been told my vibrato sounds too uniform — the same speed and width on every note. How do I develop more expressive variety?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: test
    expected_exemplar: |-
      Uniform vibrato is one of the most common plateaus in classical guitar development, and
      thinking about how two different masters use it can unlock the problem. Andrés Segovia treated
      vibrato as an expressive ornament tied to phrasing — he varied width and speed not just
      note-by-note but in relation to the phrase arc. On a note leading into a climax, his vibrato
      would gradually widen and intensify; on a note fading into silence, it would slow and narrow.
      You can hear this in his recordings of Torroba or Turina — the vibrato breathes with the
      musical sentence. This is a deeply romantic approach, where vibrato is essentially an
      extension of rubato: it shapes time and emotion together. John Williams represents a different
      pole — his vibrato is more controlled and precise, with a sharper distinction between notes
      that receive it and notes that don't. He tends to reserve vibrato for structural melodic tones
      and withholds it for passing notes, which creates a kind of harmonic chiaroscuro — the
      important notes glow, the surrounding ones don't. This actually makes the vibrato MORE
      expressive, not less, because the contrast is greater. Practically: record yourself and listen
      back specifically for whether your vibrato responds to phrase shape (the Segovia dimension)
      and whether you're selectively withholding it from non-structural notes (the Williams
      dimension). Start by consciously playing through a phrase twice — once with vibrato on every
      note, once with vibrato only on the notes you'd stress in a spoken reading of the melody. The
      second version will almost certainly feel more alive, and you can work backward from there.
    expected_abstract: |-
      Developing expressive vibrato variety means learning to modulate three independent parameters:
      speed, width, and onset timing. A fast, narrow vibrato creates urgency or brilliance; a slow,
      wide vibrato creates warmth and depth; a delayed onset (starting the note straight and adding
      vibrato after) creates a sense of the note blooming. The key exercise is practicing each
      parameter in isolation — long tones where you consciously speed up and slow down, or gradually
      widen and narrow the oscillation. Then practice phrase-level control: map out a short melodic
      passage and decide in advance which notes get wide vibrato, which get narrow, and which get
      none, based on their harmonic importance and position in the phrase arc. Recording yourself is
      essential because vibrato variation that feels dramatic to the player often sounds subtle to
      the listener, so you need objective feedback to calibrate your range.
- id: exemplar_reasoning_258
  paraphrases:
  - |-
    My client wants a house that looks traditional from the street but has a completely open, flowing interior. Is that even architecturally coherent, or is it a contradiction I should push back on?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: test
    expected_exemplar: |-
      It's a genuine tension, but not necessarily a contradiction — and it's worth knowing that two
      of the 20th century's greatest architects took completely opposite positions on exactly this
      question. Robert Venturi argued passionately that the facade and the interior could and should
      be allowed to tell different stories. In 'Complexity and Contradiction in Architecture' he
      celebrated buildings where the outside 'wraps' the inside in a way that doesn't perfectly
      reflect what's happening within — he called this the 'difficult whole.' His own Vanna Venturi
      House is a small masterpiece of this logic: the street facade is almost cartoonishly
      house-like, with a prominent gable, a central chimney, and symmetrical windows — pure symbolic
      traditionalism. Inside, it's anything but conventional: the plan is fragmented, the stair is
      squeezed into a sliver, spaces overlap. Venturi would tell you your client's request is not
      just acceptable but architecturally interesting. Frank Lloyd Wright would have pushed back
      hard. His entire philosophy of organic architecture insisted on integrity — that the exterior
      should be an honest expression of the interior spatial organization. The open Prairie house
      plan was always expressed outwardly through long horizontal bands, low rooflines, and a
      composition that radiated from a central core. Concealing a free plan behind a traditional
      shell would have struck him as dishonest, a kind of architectural costume. So the question for
      you and your client is really: do you value symbolic communication to the streetscape
      (Venturi's position — the house *means* home to the neighborhood) or spatial and material
      integrity (Wright's position — the house *is* what it looks like)? Both are defensible. The
      risk with your client's brief is not incoherence per se, but that the transition from
      street-facing facade to interior can feel jarring if you don't design the threshold carefully.
      The entry sequence is where you have to do the most work.
    expected_abstract: |-
      This is a real tension, but not an insurmountable one — it comes down to how you handle the
      transition between exterior language and interior organization. The facade and the floor plan
      operate somewhat independently in architecture. A traditional street facade is primarily
      communicating to the public realm — it's a piece of urban design as much as it is a building —
      while the interior plan is about how the occupants live. These don't have to be identical
      expressions. The main risk is the transition zone: if you walk through a classically detailed
      front door and immediately encounter a completely open, contemporary loft-style space, the
      discontinuity feels arbitrary rather than intentional. The solution is usually to design the
      entry sequence as a deliberate mediator — a foyer or hall that acknowledges the traditional
      exterior while beginning to open up toward the interior. From there, the plan can flow freely.
      In practice, you'd want the roof form and structural grid to be honestly shared between
      exterior and interior — the traditional exterior can be expressed through fenestration
      patterns, materials, and proportions without requiring cellular rooms inside. Many successful
      houses achieve this by keeping the perimeter rooms (which are visible from outside through
      windows) more traditionally scaled, while the interior core opens up. Push back gently if the
      client wants completely incongruent exterior detailing — like a strict colonial symmetry with
      windows that don't correspond to anything inside — but the broader brief of
      traditional-outside, open-inside is a legitimate and achievable design problem.
- id: exemplar_reasoning_259
  paraphrases:
  - |-
    My dialogue sounds stilted and 'on the nose' — characters say exactly what they mean too directly. What techniques do writers use to make dialogue feel natural and layered?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: named_practitioner
    specificity: direct
    split: test
    expected_exemplar: |-
      Harold Pinter is probably the most studied practitioner of exactly this problem. His dialogue
      is defined by what characters refuse to say — conversations that appear to be about trivial
      things (a chess game, making tea) while the real subject goes entirely unspoken and creates
      immense pressure beneath the surface. The technique is sometimes called 'Pinteresque' and it
      works because in real life, people almost never state their actual wants or fears directly.
      Elmore Leonard had a related but more vernacular approach: his characters talk past each
      other, change the subject defensively, brag, deflect — they're always managing image and
      status in the conversation rather than exchanging information. His dialogue feels real because
      it's full of subtext driven by ego and self-interest. Hemingway's 'Hills Like White Elephants'
      is the classroom example of dialogue where characters talk entirely about something else
      (ordering drinks, the landscape) while negotiating a life-altering decision. His rule was
      roughly: have the character say the opposite of what they mean, or something adjacent to it. A
      practical exercise is to take your stilted dialogue and rewrite it so each character is trying
      to avoid revealing their true position while still advancing it — give them a social goal (to
      seem reasonable, to avoid a fight, to not be the one who says it first) and let that govern
      what they actually say.
    expected_abstract: |-
      On-the-nose dialogue fails because real conversation is almost never a direct exchange of true
      feelings and intentions — people talk around things, pursue social goals, protect their image,
      and avoid vulnerability. To layer your dialogue, try assigning each character a subtext: what
      do they actually want from this exchange, and why can't they just ask for it? Then have them
      pursue that goal indirectly. Other techniques include interruption and topic change (people
      deflect when conversations get uncomfortable), non-sequitur responses (characters answering
      the question they wish they'd been asked rather than the one they were), and status play
      (characters jostling for control of the conversation's direction). Reading dialogue aloud is
      also invaluable — your ear catches rhythmic stiffness that your eye misses. The revision
      question to ask for every line is: why is this character saying this, and why are they saying
      it this way rather than more directly?
- id: exemplar_reasoning_260
  paraphrases:
  - |-
    I have a hot inner loop in C++ that processes millions of small fixed-size records. Should I use virtual dispatch to keep the code clean, or is it worth the complexity of templates to avoid the overhead?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: test
    expected_exemplar: |-
      This is precisely the kind of question where Andrei Alexandrescu and Bjarne Stroustrup
      represent genuinely different instincts, even though they're both C++ authorities.
      Stroustrup's position, expressed repeatedly in 'The C++ Programming Language' and various
      talks, is essentially: don't pessimize prematurely, but virtual dispatch has a real cost — the
      indirect call itself, and more critically, the way it defeats inlining and pollutes branch
      predictors. He'd tell you to measure first, but he's also always viewed templates as the
      'zero-overhead' mechanism C++ exists to provide. His design philosophy is that you should pay
      for what you use, and virtual dispatch forces you to pay even when you don't need runtime
      polymorphism. Alexandrescu in 'Modern C++ Design' took this further with policy-based design —
      the idea that you can get the *interface benefits* of polymorphism (clean, composable,
      interchangeable components) entirely through template parameters, with all resolution at
      compile time. The result is code that looks almost as clean at the call site but lets the
      compiler inline aggressively. His approach accepts that the template machinery itself is more
      complex to write and produces longer compile times and potentially larger binaries. For your
      hot inner loop on fixed-size records: if the type of record is known at compile time (or can
      be parameterized), Alexandrescu's instinct is right — templates give you clean abstraction
      without the vtable indirection, and on a tight loop over millions of records, that matters. If
      you genuinely need runtime polymorphism (the record type varies at runtime and can't be
      resolved earlier), then Stroustrup would say virtual dispatch is the *right* tool and the
      overhead is the honest cost of that flexibility — but you'd want to profile to confirm it's
      actually your bottleneck. The usual outcome: restructure the call so the type decision happens
      once outside the loop, then dispatch to a monomorphic inner loop.
    expected_abstract: |-
      For a hot inner loop over millions of records, virtual dispatch is usually worth reconsidering
      — not always, but the overhead is real and comes from two sources: the indirect function call
      through the vtable (which prevents inlining) and the branch misprediction cost when the
      virtual call target varies. Templates resolve all of this at compile time. If the record type
      is fixed or can be a template parameter, the compiler can inline the processing function
      entirely, which for tight loops over small records is often a significant win — you eliminate
      not just the call overhead but the entire function call boundary, letting the optimizer see
      the loop body as one unit. The trade-offs to weigh: - **Use templates** if: the type is known
      at compile time, you control the instantiation sites, and profiling confirms dispatch is
      costing you. Accept longer compile times and some template complexity. - **Keep virtual
      dispatch** if: the record type genuinely varies at runtime, or the processing logic is complex
      enough that inlining wouldn't help much, or the code clarity benefit is high and the loop
      isn't actually your bottleneck. A common middle path: hoist the dispatch *outside* the loop.
      Determine the type once, then call a statically-typed (possibly templated) inner loop
      function. This gives you runtime flexibility at coarse granularity and compile-time
      optimization where it counts. Always profile before committing — vtable overhead on modern
      hardware with a predictable call target is sometimes negligible compared to memory access
      patterns on your record data.
- id: exemplar_reasoning_261
  paraphrases:
  - |-
    I'm a classical violinist trying to get into baroque performance. My tone production and vibrato feel completely wrong for the style. What do I need to change?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: school_tradition
    specificity: implicit
    split: test
    expected_exemplar: |-
      What you're experiencing is essentially the transition between two completely different
      performance philosophies — the modern symphony tradition and the historically informed
      performance (HIP) movement that crystallized in the 1970s and 80s. The HIP school, shaped
      enormously by figures like Nikolaus Harnoncourt and the pioneering string work of violinists
      like Sigiswald Kuijken and Monica Huggett, operates from a fundamentally different aesthetic:
      tone is produced with less bow pressure, faster bow speed closer to the sounding point, and a
      much lighter contact weight. The big shift for your ear and muscle memory is that vibrato in
      this tradition is an ornament — something applied selectively at cadence points or for
      expressive emphasis — not a continuous coloring of every note the way it is in the Galamian or
      Flesch schools of modern violin pedagogy. Huggett's recordings are a great reference because
      she demonstrates how a warm, singing tone can be achieved without continuous vibrato through
      bow articulation and natural resonance alone. The other thing the Kuijken circle emphasizes is
      inequality and hierarchy of notes within the beat — baroque rhetoric means certain notes
      'speak' more than others. Start by removing vibrato entirely and rebuilding your tone with bow
      technique alone; then reintroduce vibrato as a conscious choice rather than a default.
    expected_abstract: |-
      Baroque style requires some fundamental adjustments to modern technique. The most significant
      is vibrato: in baroque practice, vibrato is used selectively as an ornament rather than
      applied continuously as it is in modern playing. Start by practicing without any vibrato and
      learning to produce a full, resonant tone using bow technique alone — bow speed, contact
      point, and pressure become your primary expressive tools. Use a lighter bow hold and
      experiment with a faster, lighter bow stroke. If you have access to a baroque bow, try it, as
      the convex curve and lighter tip naturally encourage a different articulation. Articulation is
      also more speech-like in baroque style — there's a hierarchy of strong and weak notes within
      each beat, and notes are often more separated than in legato modern playing. Listen to period
      instrument recordings closely and try to internalize the different aesthetic before trying to
      reproduce it technically.
- id: exemplar_reasoning_262
  paraphrases:
  - |-
    I'm designing a public library for a mid-sized city. The city wants it to feel both monumental and welcoming — not cold or intimidating. How do I strike that balance?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: test
    expected_exemplar: |-
      This is exactly the tension that separates two major schools of civic architecture, and it's
      worth thinking through both poles before choosing your path. On one side, you have the
      approach Louis Kahn embodied so perfectly in buildings like the Saugus Public Library studies
      and the Phillips Exeter Academy Library — monumental but deeply humanistic. Kahn achieved
      gravitas through the use of natural light and honest materials: thick masonry walls, geometric
      cutouts that let daylight pour in dramatically, and a clear structural logic that visitors can
      read and trust. The monumentality comes from timelessness and material weight, not from
      imposing scale or authoritarian symmetry. The building feels significant because it feels
      *permanent*, not because it looms. On the other side, you have Alvar Aalto's civic buildings —
      Viipuri Library being the canonical example — where warmth is the primary instrument. Aalto
      used wood, undulating ceilings for acoustic softness, carefully diffused skylights that
      eliminate harsh shadows, and sectional variation that creates intimate reading nooks nested
      within larger, generous volumes. His civic buildings feel like a community's living room, not
      a temple. For your problem, the tension you're describing is essentially Kahn vs. Aalto. A
      useful resolution is to deploy Kahn's logic at the urban scale — a clear, solid civic presence
      on the street — and Aalto's sensibility at the human scale inside: warm materials, natural
      light, varied ceiling heights, and spaces that invite lingering. The building announces itself
      to the city, then welcomes you once you cross the threshold. That shift from exterior
      monumentality to interior warmth is the architectural move that resolves your brief.
    expected_abstract: |-
      The key is to distinguish between scale and atmosphere. Monumentality doesn't require coldness
      — it comes from clarity, permanence, and a strong civic presence, while warmth is a product of
      material choices, lighting quality, and spatial variety. For the exterior, use durable, honest
      materials like stone, brick, or concrete with articulated surfaces that give the building
      visual weight. A clear, legible entry sequence — a forecourt, a wide stair, or a canopy —
      signals importance without being forbidding. Avoid blank facades; articulation at street level
      (windows, texture, human-scaled elements) keeps the building in conversation with pedestrians.
      For the interior, warmth comes from natural light diffused through skylights or clerestories
      rather than harsh direct sun, the use of wood or warm-toned finishes in reading areas, and a
      sectional strategy that nests intimate spaces within larger volumes. A grand reading room can
      feel welcoming if the ceiling is scaled correctly and the light is soft. Varied ceiling
      heights — tall in the central atrium, lower in reading alcoves — give people a sense of
      shelter even within a generous space. The transition from exterior to interior is critical:
      the entry should be a moment of decompression, moving from the civic scale of the street to
      the human scale of the reading room.
- id: exemplar_reasoning_263
  paraphrases:
  - |-
    I'm a violinist working on a Beethoven sonata and I'm torn between a more historically informed approach with a lighter bow and less vibrato, versus a lush, full Romantic sound. How do I decide?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: test
    expected_exemplar: |-
      You're essentially choosing between two very different convictions about what Beethoven
      'really is,' and both have serious advocates. The historically informed approach you're
      describing is associated with players like Isabelle Faust or the early-instrument work of
      Andrew Manze — lighter bow pressure, minimal continuous vibrato (used as an ornament rather
      than a constant coating), gut or gut-like strings, and smaller dynamic contrasts. The argument
      is that this reveals the text in a way that's truer to what Beethoven heard and how his
      harmonic language lands; dissonances cut more sharply, voice-leading is clearer. The Romantic
      approach — full vibrato, big sound, long singing phrases — has its greatest modern advocates
      in players like Itzhak Perlman or the older recordings of David Oistrakh. They argue Beethoven
      was writing at the outer edge of what was emotionally possible, and that restraining the sound
      undersells the drama. The honest answer is that the choice should follow the specific sonata.
      The Op. 24 'Spring' sonata sounds radiant and almost diaphanous in the HIP style; the Op. 47
      'Kreutzer' is so physically aggressive that a lush, full sound feels more viscerally right.
      Listen to Faust/Melnikov alongside Perlman/Ashkenazy on your specific sonata and notice which
      feels like it's illuminating the piece versus performing over it.
    expected_abstract: |-
      The choice between historically informed performance practice and a full Romantic sound really
      depends on what you think the music most needs. A lighter bow and less continuous vibrato
      tends to clarify texture and voice-leading — dissonances are more exposed, inner voices speak
      more clearly, and the music can feel more transparent and rhythmically alive. This approach
      can make Beethoven sound more austere but also more structurally revealing. A fuller, more
      Romantic sound privileges long melodic lines, emotional warmth, and dynamic grandeur — it
      emphasizes the singing quality of the instrument and can make the slow movements feel deeply
      expressive. The risk is that heavy continuous vibrato can blur harmonic rhythm and make
      everything feel similarly saturated. A practical approach is to let the specific character of
      each movement guide you: more transparent in texturally complex passages, fuller vibrato in
      long cantabile lines where the singing quality is the whole point. Recording yourself with
      both approaches and listening back often makes the choice obvious in ways that are hard to
      hear while playing.
- id: exemplar_reasoning_264
  paraphrases:
  - |-
    I'm building a programming language and trying to decide how to handle memory management. Should I go with manual memory management, garbage collection, or something like Rust's ownership model? What are the tradeoffs?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: school_tradition
    specificity: direct
    split: test
    expected_exemplar: |-
      This is one of the central fault lines in programming language design, and different schools
      have landed in very different places. The systems programming tradition — exemplified by C and
      carried forward in Rust — holds that the programmer should own memory management decisions,
      with Rust's ownership model being a modern refinement that enforces correctness at compile
      time rather than runtime. The Bell Labs / Unix philosophy behind C was that trusting the
      programmer yields maximum control and performance; Rust's contribution was showing you could
      get the same control with compile-time safety guarantees via its borrow checker. The
      garbage-collected tradition, pioneered in Lisp and carried through by the ML family, Java, and
      Go, argues that memory management is accidental complexity that distracts from the essential
      problem. The ML school in particular (SML, OCaml) showed you could have GC with very
      predictable performance by using generational collection tuned to functional programming
      patterns. Go's take on this — fast, concurrent GC with simple semantics — reflects the Google
      school of prioritizing developer throughput over raw performance. A third tradition, reference
      counting, goes back to early Smalltalk and is now dominant in Swift and Python's CPython — it
      trades the unpredictable pauses of tracing GC for more deterministic reclamation but struggles
      with cycles. For a new language, the question is what your language is *for*. If you're
      targeting systems programming, the Rust ownership model is now the gold standard — it's a
      proven synthesis. If you're targeting application code where productivity matters, modern GC
      (Go or JVM-style generational collectors) is hard to beat. If you want Lisp-style dynamism,
      reference counting with a cycle detector (like CPython or Swift) may fit better.
    expected_abstract: |-
      The three approaches each involve fundamental tradeoffs between control, safety, and developer
      experience. Manual memory management gives you full control and deterministic performance but
      puts the burden on the programmer to free memory correctly — buffer overflows, use-after-free
      bugs, and memory leaks become your responsibility. It's best suited for systems with tight
      performance requirements and resource constraints. Garbage collection removes that burden
      entirely by having the runtime track and reclaim memory automatically. The tradeoff is
      occasional pauses during collection cycles and some runtime overhead. Modern GC
      implementations have become quite sophisticated, with generational collectors minimizing pause
      times significantly. This is ideal when developer productivity and safety matter more than
      microsecond latency. Ownership-based models like Rust's borrow checker represent a middle
      path: the compiler enforces memory safety rules at compile time with no runtime overhead and
      no GC pauses. The tradeoff is a steeper learning curve — the programmer must satisfy the
      compiler's ownership and lifetime rules, which adds upfront complexity. For a new language,
      consider your target use case: systems and embedded programming favor ownership or manual
      management; application-level languages favor GC; performance-critical safe systems code
      favors an ownership model. The ownership approach has the best theoretical properties but
      demands more from both the language implementer and the user.
- id: exemplar_reasoning_265
  paraphrases:
  - |-
    I'm playing black in a position where my opponent has built a strong pawn center with e4 and d4, and I have a solid but cramped position. Should I try to undermine the center immediately or just wait and keep things solid?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: test
    expected_exemplar: |-
      This is a classic tension that divides chess philosophies, and how you handle it really
      depends on your read of the position. Petrosian's answer would be: don't rush. He was famous
      for accepting positional discomfort for long stretches, trusting that a big center becomes a
      liability when it overextends. He'd play moves like ...a6, ...Rb8, slowly preparing a
      queenside counter while the opponent's center quietly became a target. Karpov refined this
      further — his approach was to systematically exchange pieces to reduce the center's power,
      leaving a simplified position where the pawn structure alone tells the story, often in his
      favor. The contrasting school is Tal's or Kasparov's: hit the center immediately with ...c5 or
      ...e5, create imbalances, and make the opponent prove their center is strong rather than
      assume it. If you're comfortable with complications and can calculate sharp lines, that
      aggressive approach can work brilliantly. Given that you describe the position as 'solid but
      cramped,' that actually sounds like a Karpov-type setup is already in place — which suggests
      waiting, consolidating, and probing with ...c5 at the right moment is likely your best path.
    expected_abstract: |-
      When facing a strong pawn center with e4 and d4 as Black, you generally have two strategic
      options. The first is to undermine the center directly with moves like ...c5 or ...e5, forcing
      the opponent to either advance, exchange, or defend, which can dissolve their space advantage.
      The second is to maintain a solid position, limit counterplay, and wait for the center to
      become overextended or a target for attack later. The right choice depends on the specifics:
      how well supported the center is, whether you have enough piece activity to make the
      undermining work, and how well you handle the resulting complications. If the center is
      well-protected and you'd be entering sharp tactical lines unprepared, a patient, solid
      approach — keeping the structure intact and waiting for the right moment to strike — is often
      more reliable.
- id: exemplar_reasoning_266
  paraphrases:
  - |-
    My essay has a clear argument but the sentences feel choppy and disconnected. I could either vary the sentence rhythm more dramatically — short punches followed by long rolling clauses — or use more explicit transitional logic to stitch ideas together. Which is the better fix?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: test
    expected_exemplar: |-
      You're weighing two genuinely different philosophies of prose, and they correspond pretty
      directly to the difference between how Joan Didion writes and how George Orwell writes.
      Orwell's approach is the explicit transitional logic route: clear signposting, declarative
      sentences, no ambiguity about where you are in the argument. 'Politics and the English
      Language' is practically a manifesto for this — he believed prose should be a pane of glass
      through which the idea is seen without distraction. His transitions are functional and direct
      ('Moreover,' 'But,' 'This means that'). The method works best when the ideas themselves are
      the thing, and when your reader needs to track a complex argument without getting lost. If
      your essay is making a case that requires the reader to hold several premises in mind
      simultaneously, Orwell's approach is probably right. Didion does something entirely different.
      In essays like 'The White Album' or 'Slouching Towards Bethlehem,' the connections between
      ideas are often made through rhythm and juxtaposition rather than explicit logic. A short,
      blunt sentence stops you cold; then a long clause unspools and takes you somewhere unexpected;
      the transition IS the rhythm shift. This only works when the content can bear some ambiguity —
      when the essay is exploring or interrogating rather than arguing a proposition. For a 'clear
      argument' that feels choppy, Orwell is probably your model: the choppiness is likely signaling
      missing logical connective tissue, not a rhythm problem. Vary the sentence length by all
      means, but do it in service of emphasis, not as a substitute for making the inferential steps
      explicit.
    expected_abstract: |-
      Both fixes address the choppiness problem, but they're treating different underlying causes —
      so the right choice depends on which diagnosis is accurate. If your sentences feel
      disconnected because the logical relationship between ideas isn't being stated, then adding
      transitional language is the correct fix. Words and phrases that signal causation, contrast,
      elaboration, or sequence ('therefore,' 'however,' 'this means,' 'as a result') give the reader
      a map of your reasoning. No amount of rhythmic variation will compensate for missing logical
      connective tissue. If the logic is actually there but the prose still feels mechanical, then
      the rhythm diagnosis is more likely correct. Uniform sentence length creates a kind of
      cognitive monotony — the reader loses the sense of ideas building toward something.
      Alternating short declarative sentences with longer, more complex ones creates emphasis and
      forward momentum: the short sentence lands a point, the longer one develops or qualifies it.
      In practice, the best fix is usually both: make the logical connections explicit first, then
      vary sentence length to give those connections appropriate weight and rhythm. But if you can
      only do one, and your argument is genuinely clear to you but not landing for readers, add the
      explicit transitions first.
- id: exemplar_reasoning_267
  paraphrases:
  - |-
    My research team has a lot of observational data showing a correlation, but we can't run a randomized experiment. How do I make a credible causal argument from this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: school_tradition
    specificity: implicit
    split: test
    expected_exemplar: |-
      You're squarely in the territory that the Rubin Causal Model tradition and the DAG-based
      approach of Judea Pearl's school have been fighting over productively for decades. The Rubin
      potential outcomes framework — developed through Donald Rubin and later extended by Angrist,
      Imbens, and others in the econometrics tradition — gives you tools like instrumental
      variables, regression discontinuity, and difference-in-differences. These methods essentially
      try to find 'as-if random' variation in your observational data: situations where assignment
      to the treatment was functionally arbitrary with respect to the outcome. The Pearl/structural
      causal model tradition takes a different angle: you draw a directed acyclic graph of your
      assumed causal structure, identify which variables are confounders versus mediators versus
      colliders, and derive what you need to condition on. These two schools often reach the same
      answer but think about the problem very differently — Rubin's heirs are skeptical of
      untestable structural assumptions, while Pearl's school argues you can't even define what to
      control for without an explicit causal graph. In practice, using both — a DAG to identify your
      adjustment set, and a quasi-experimental design from the econometrics toolkit to exploit
      natural variation — gives you the most defensible causal argument from observational data.
    expected_abstract: |-
      Making causal claims from observational data requires carefully ruling out alternative
      explanations. Start by articulating the specific causal mechanism you're proposing and
      identifying all plausible confounders — variables that influence both your treatment and
      outcome. You can then use statistical adjustment techniques such as matching, propensity score
      weighting, or regression to control for measured confounders. If there's a natural experiment
      in your data — a policy change, a geographic cutoff, or an external shock that affected some
      subjects but not others — you can use quasi-experimental methods like regression discontinuity
      or difference-in-differences to approximate random assignment. Be explicit about your
      assumptions: which confounders you've measured, which you haven't, and what would have to be
      true for your causal claim to hold. Sensitivity analyses that vary your assumptions help show
      how robust the conclusion is.
- id: exemplar_reasoning_268
  paraphrases:
  - |-
    My essay arguments feel logically solid but kind of bloodless and boring to read. How do I make nonfiction prose more compelling without sacrificing rigor?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: test
    expected_exemplar: |-
      This is a tension that a few writers have solved in very different but instructive ways. James
      Baldwin essentially treated argument as music — he would build a claim through repetition and
      variation, returning to a phrase or image with slightly shifted meaning each time, so the
      logic accumulated rhythmically rather than just propositionally. The rigor was real, but the
      experience was more like listening to a theme develop than following a syllogism. David Foster
      Wallace took a different approach: he used footnotes and digressions not as failures of
      discipline but as a way of making the complications of an argument visible, so the reader felt
      the writer wrestling with the problem in real time. That performative uncertainty is itself a
      form of credibility. Then there's someone like Orwell, who worked by relentless concreteness —
      every abstraction got immediately cashed out in a specific, slightly surprising example, so
      the prose never drifted far from the tangible. If your work is bloodless, you might be
      operating at too consistent an altitude — staying at the level of claim and sub-claim without
      dropping into scene, anecdote, or image to vary the texture.
    expected_abstract: |-
      Rigorous prose often becomes flat when it operates entirely at the level of abstraction —
      claim, evidence, conclusion, repeat. The fix is usually to vary the texture by grounding
      abstract arguments in concrete specifics: a vivid example, a scene, a precise detail that
      makes the larger point feel real. Rhythm matters too — long analytical sentences can be cut by
      short declarative ones to create emphasis and momentum. Voice helps: a sentence that sounds
      like a person thinking, rather than a thesis being defended, draws readers forward. You can
      also foreground the process of reasoning rather than just the results — showing where you were
      uncertain, what you ruled out and why, makes the argument feel inhabited rather than merely
      correct.
- id: exemplar_reasoning_269
  paraphrases:
  - |-
    I'm developing a new dish and I'm torn between building it around a single perfect ingredient — like a really great tomato in peak season — or combining lots of components into a complex, layered flavor. Which philosophy leads to better cooking?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: test
    expected_exemplar: |-
      You're essentially choosing between the Chez Panisse philosophy and the elBulli philosophy,
      and both have produced transformative food. Alice Waters built her entire career on the first
      approach — the argument being that if you source an extraordinary heirloom tomato at the
      height of summer, your job as a cook is mostly to get out of its way: good olive oil, flaky
      salt, maybe a torn basil leaf. The ingredient is the dish. Ferran Adrià operated from nearly
      the opposite conviction: that the cook's creativity, technique, and layering of sensation is
      the real art, and that a simple ingredient is raw material to be transformed, deconstructed,
      and recombined into something the ingredient alone couldn't achieve. René Redzepi at Noma
      lands closer to Waters but pushes into new ingredient territory — foraging and fermentation as
      a way of making obscure single ingredients sing. The honest answer is that these philosophies
      suit different cooks and contexts: if you're in a market and something stops you cold with its
      quality, cook like Waters. If you're in a development kitchen trying to create something no
      one has tasted, cook like Adrià.
    expected_abstract: |-
      Both approaches are legitimate and lead to great cooking under different conditions. The
      single-ingredient philosophy works best when you have an exceptional, peak-season product —
      the goal is technique that highlights rather than competes. This means simple preparations,
      minimal seasoning, and cooking methods that preserve rather than transform. The layered,
      multi-component philosophy works when you want complexity to be the experience itself —
      building contrast between sweet, acid, fat, and umami, adding textural variety, and using each
      component to make the others taste better. In practice, great dishes often do both: a dominant
      star ingredient supported by carefully chosen elements that amplify it rather than obscure it.
      The question to ask is whether your best ingredient is so good it needs no help, or whether it
      needs company to reach its potential.
- id: exemplar_reasoning_270
  paraphrases:
  - |-
    I need to write a performance-critical inner loop in C — processing millions of structs per second. Should I be thinking about cache layout and SIMD from the start, or is that premature optimization?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: test
    expected_exemplar: |-
      This is exactly the tension between two schools of thought that both have legitimate claims.
      Donald Knuth is the canonical source for 'premature optimization is the root of all evil' —
      but people often forget that Knuth was specifically warning against micro-optimizing before
      profiling, not against thinking architecturally about data layout. Knuth himself spent
      enormous effort on the computational complexity of his algorithms. The opposing tradition is
      the data-oriented design school, championed by people like Mike Acton (of Insomniac Games
      fame, known for his influential CppCon 2014 talk) and Fabian Giesen (aka ryg). Their argument
      is that for performance-critical code, you should think about memory layout *first* because
      changing it later is expensive and disruptive — a cache-friendly struct layout is an
      architectural decision, not a micro-optimization. The Knuth warning applies to things like
      unrolling loops manually before you've measured anything. The Acton/data-oriented advice
      applies to structural decisions like struct-of-arrays vs array-of-structs that ripple through
      your whole codebase. My recommendation: don't pre-optimize instruction-level things, but *do*
      design your data layout with cache lines in mind from the start — that's an architectural
      choice you'll pay to change later. Measure before adding SIMD intrinsics.
    expected_abstract: |-
      The classic advice is to get correct, clean code first and then optimize based on profiling —
      micro-optimizations applied speculatively waste time and often optimize the wrong path. That
      said, data layout decisions are architectural rather than micro-level, and changing them later
      (e.g., switching from array-of-structs to struct-of-arrays) can require broad refactoring. So
      there's a distinction worth making: premature loop unrolling or hand-written SIMD before
      profiling is usually wasted effort, but thinking about struct layout, alignment, and memory
      access patterns from the start is appropriate because those decisions have cascading design
      implications. A practical approach: start with a struct layout that groups fields by access
      pattern (things read together should be stored together), write clean code, profile to find
      the actual bottleneck, and only then introduce SIMD or more aggressive optimizations where the
      data shows they'll matter.
- id: exemplar_reasoning_271
  paraphrases:
  - |-
    My style tends toward solid, quiet openings and I've been playing the London System as White. But I'm worried it's too passive and I'll just end up in symmetrical, boring draws. How do I inject some life into it without abandoning my overall approach?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: school_tradition
    specificity: implicit
    split: test
    expected_exemplar: |-
      You're touching on a real tension that runs through chess history — the debate between the
      hypermodern school and classical attacking chess. The London has its roots in that hypermodern
      tradition (think Réti, Nimzowitsch) where you cede the center temporarily, build a solid
      structure, and undermine the opponent's central pawns from the flanks. The risk you're
      identifying is real: hypermodern setups can become toothless if you just go through the
      motions without a real plan. The players who've made the London dangerous — Magnus Carlsen in
      the modern era is the obvious example — do something specific: they use the solid structure as
      a springboard for a slow kingside build-up, often with plans involving Nbd2-f1-e3 or h4-h5
      pawn storms, exploiting the fact that their opponent has overextended in the center. The key
      insight from the Soviet school is that every solid opening has a corresponding active plan —
      'solid' should never mean 'waiting.' In the London specifically, watch for the c4 break to
      challenge the center at the right moment, or the e4 push after sufficient preparation. The
      structure is quiet but the pieces should always be aiming at something.
    expected_abstract: |-
      The London System is solid but definitely can become passive if you play it without a concrete
      plan. The key is to recognize that a solid opening doesn't mean a passive middlegame — you
      still need an active idea. In the London, common plans include: preparing and executing the e4
      pawn break to contest the center, launching a kingside pawn storm with h4 and g4 if your king
      is already castled queenside or if Black has castled kingside, using the c4 break to open the
      center at a moment of your choosing, or building up on the queenside with b4 after exchanging
      the dark-squared bishops. The structure you build is the foundation — the life comes from
      recognizing which of these plans is appropriate for the specific pawn structure that arises
      and executing it with energy. Avoid just 'completing development' and instead always have a
      specific break or target in mind after move 10.
- id: exemplar_reasoning_272
  paraphrases:
  - |-
    I'm learning to play a Beethoven piano sonata and I can't decide whether to keep the tempo strict and even throughout or allow myself more rhythmic freedom and rubato. What's the right approach?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: test
    expected_exemplar: |-
      This is one of the central interpretive debates in Beethoven performance, and it maps almost
      perfectly onto the contrast between two legendary pianists: Artur Schnabel and Wilhelm Kempff.
      Schnabel was famous for a kind of fierce, uncompromising structural fidelity — he treated
      Beethoven's metronome markings and rhythmic architecture almost as sacred, driving through
      phrases with intellectual momentum and trusting the score to do the work. His 1930s recordings
      can feel almost relentless, but that drive creates a sense of inevitable logic. Kempff, by
      contrast, was the great poet of Beethoven — he allowed himself enormous expressive latitude,
      breathing into phrases, shaping dynamics with deep personal feeling, and treating the score as
      a starting point for reflection rather than a blueprint to execute. More recently, András
      Schiff has argued a kind of middle path: deep reverence for the text combined with a
      historically-informed awareness that Classical-era rubato was more local and ornamental than
      the Romantic tradition suggests. For a student, I'd actually recommend starting more
      Schnabel-like — get the architecture under your fingers first, feel where the harmonic weight
      falls — and only then layer in Kempff-style flexibility where the music genuinely calls for
      it. The danger of early rubato is that it papers over structural uncertainty with expressive
      gesture.
    expected_abstract: |-
      This is a genuine interpretive trade-off and both approaches have merit depending on the
      sonata and movement in question. Strict tempo helps you internalize the rhythmic architecture
      of the piece and ensures that structural accents land with clarity — Beethoven's syncopations
      and sforzandi hit harder against a steady pulse. Rubato, on the other hand, allows you to
      shape phrases according to their harmonic and emotional content, which can make a performance
      feel more breathing and alive. A good rule of thumb is to earn your rubato: understand exactly
      what the pulse is before you deviate from it, and make sure any rhythmic flexibility is
      expressive rather than compensatory for technical difficulty. In general, earlier Beethoven
      sonatas tend to reward a more Classical, rhythmically grounded approach, while the late
      sonatas have room for more expansive personal expression.
- id: exemplar_reasoning_273
  paraphrases:
  - |-
    I'm working on a short story collection and I keep getting feedback that my endings feel too tidy — like I resolve things too completely. I want to write endings that feel finished but leave something open. Are there writers or traditions whose endings I should be looking at?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: school_tradition
    specificity: direct
    split: test
    expected_exemplar: |-
      You're bumping up against one of the defining tensions in the modern short story, and there's
      a very specific tradition that solved it in a way worth studying closely: the Chekhovian
      ending. Chekhov basically invented the idea that a story could end on an image or an emotional
      state rather than a resolution — something has shifted, but the meaning of the shift is left
      for the reader to inhabit. The ending of 'The Lady with the Dog' is the canonical example: two
      people in an impossible situation, and the story ends with them realizing their real life is
      only just beginning. Nothing is resolved, but it feels completely finished. That model was
      picked up and transformed by the American minimalist tradition — Carver especially, though
      Carver often pushed further into ambiguity than Chekhov. The risk with Carver is that the
      openness tips into withholding, and the story can feel unearned rather than resonant. Alice
      Munro is probably the master of the other approach: her endings often jump in time or
      perspective, so you get closure on the emotional logic of the story without tying up the plot.
      And then there's the Irish school — Colm Tóibín, Claire Keegan — where endings tend to land on
      a single quiet image that crystallizes everything without explaining it. Keegan's 'Foster' is
      almost a textbook for this. The common thread is that the ending answers an emotional question
      rather than a plot question. Ask yourself what feeling you want the reader to be left inside,
      not what information they're missing.
    expected_abstract: |-
      The feedback you're getting usually means your endings are resolving the plot when they should
      be resolving the emotion — or sometimes neither. There are a few techniques worth trying.
      First, end on an image rather than a statement: let a concrete sensory detail carry the weight
      of meaning instead of explaining what the story was about. Second, consider ending slightly
      before you think you should — cut the last paragraph and see if the one before it is actually
      stronger. Third, ask whether your final beat closes the 'plot question' or the 'emotional
      question.' Readers tolerate open plot questions much better than unresolved emotional ones; if
      the feeling has landed, the facts can stay ambiguous. Fourth, introduce a small forward
      gesture at the end — a tiny action or observation that implies life continuing — rather than a
      conclusive statement. And finally, resist the urge to have a character 'understand' something
      in the last paragraph; that understanding usually belongs to the reader, not the character,
      and stating it deflates the ending.
- id: exemplar_reasoning_274
  paraphrases:
  - |-
    I'm writing a memoir about my childhood and I keep slipping into overly sentimental language. How do I write about emotional stuff — loss, nostalgia, family — without it feeling saccharine or manipulative?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: test
    expected_exemplar: |-
      The writers who handle this best tend to work through restraint and indirection. Didion, for
      instance, in 'The Year of Magical Thinking,' almost never names her grief directly — she
      catalogs objects, routines, and logistical details with eerie precision, and the emotion
      accumulates in the white space around those facts. The method is essentially: trust the
      specific concrete thing over the named feeling. Mary Karr takes a slightly different approach
      in 'The Liar's Club' — she earns sentiment by building it through scene and dialogue before
      allowing herself a moment of explicit feeling, so the reader has already done the emotional
      work before she names it. A Knausgård-inflected version of this goes even further: obsessive
      specificity about mundane detail creates an almost uncomfortable intimacy that makes
      sentimentality impossible, because sentimentality requires distance and generalization. The
      principle underlying all of these: when you feel the urge to write 'I felt overwhelmed by
      grief,' ask yourself what you were actually looking at, touching, or doing. Write that
      instead.
    expected_abstract: |-
      The key is replacing abstract emotional labels with concrete, specific sensory detail. Instead
      of telling the reader what to feel, give them the raw material — objects, gestures, fragments
      of dialogue — and let them feel it themselves. Emotional manipulation tends to happen when a
      writer insists on the significance of a moment rather than rendering the moment precisely.
      Trust that well-observed specificity generates more genuine emotion than adjective-heavy
      description. It also helps to leave breathing room: understatement creates space for the
      reader to lean in, whereas overstatement pushes them away. Structure helps too — placing a
      quietly devastating image at the end of a scene, after the emotional context has built
      naturally, tends to land harder than front-loading the feeling.
- id: exemplar_reasoning_275
  paraphrases:
  - |-
    I'm a graduate student studying number theory and I keep hearing about the 'French school' versus other traditions. What actually distinguishes the French approach to number theory, and how would I recognize it in a paper?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: school_tradition
    specificity: direct
    split: test
    expected_exemplar: |-
      The French school in number theory is one of the most distinctive in modern mathematics, and
      it really crystallized around two overlapping lineages. The first is the Bourbaki influence: a
      commitment to building everything from axiomatic foundations with full generality before doing
      any computation. You'll recognize this in papers where the authors define a problem in the
      language of schemes or cohomology *first*, prove a structural theorem, and only then extract
      numerical consequences — the classical arithmetic statement is almost an afterthought. This
      contrasts sharply with, say, the Anglo-American tradition descending from Hardy, Ramanujan,
      and Selberg, where analytic number theory proceeds by explicit estimates, contour integrals,
      and sieve methods with a lot of visible computation. The second French lineage runs through
      Weil, Serre, and Grothendieck into Deligne and beyond. Serre is perhaps the best exemplar of
      the distinctively French style at its most readable: he always seeks the 'right' language in
      which a theorem becomes almost obvious, reframing a hard problem until it looks natural. His
      'Cours d'arithmétique' is a masterclass — local-global principles presented so cleanly that
      the proof strategy feels inevitable. Deligne's proof of the Weil conjectures is the apex of
      the school: a problem that started as combinatorial (counting points on varieties over finite
      fields) was solved by importing the full machinery of étale cohomology. In practice, you'll
      recognize a French-school paper by: heavy use of cohomological language (étale, flat,
      crystalline cohomology), a preference for functorial formulations, proofs that proceed by
      reducing to a structural vanishing or comparison theorem, and relative scarcity of explicit
      asymptotic estimates. Compare this to the Iwaniec–Kowalski analytic tradition or the Cambridge
      multiplicative number theory tradition, where you see Euler products, explicit zero-free
      regions, and sieve weights front and center.
    expected_abstract: |-
      The French tradition in number theory is primarily characterized by its strong emphasis on
      algebraic and cohomological methods, as opposed to purely analytic or computational
      approaches. Key features you'll encounter include the use of scheme-theoretic language
      (varieties defined over arbitrary rings rather than just over the complex numbers),
      cohomological tools (étale cohomology, flat cohomology, p-adic Hodge theory) to extract
      arithmetic information, and a general preference for formulating problems in a way that makes
      structural properties transparent. French-school papers typically reduce arithmetic questions
      to questions about geometric objects — asking about rational points on a variety, for example,
      becomes a question about the structure of a cohomology group with Galois action. You'll also
      see heavy use of category-theoretic language and a focus on functoriality: showing that a
      construction behaves well under base change or specialization. This contrasts with the
      analytic number theory tradition, which uses tools like the Riemann zeta function, Dirichlet
      series, and sieve methods to estimate quantities explicitly. The French approach tends to
      prove results by invoking comparison theorems and spectral sequences rather than by direct
      estimation, which can make the papers very abstract but also very powerful — the methods apply
      in great generality once the foundations are in place.
- id: exemplar_reasoning_276
  paraphrases:
  - |-
    I'm playing a Sicilian and my opponent keeps building a big pawn center with e4/d4 while I have a knight on c6 and fianchettoed bishop on g7. Should I go for counterplay on the queenside or try to challenge the center directly?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: test
    expected_exemplar: |-
      This tension is at the heart of a classic debate between the Soviet school and the hypermodern
      tradition. The Soviet school, codified by players like Botvinnik and Keres, would generally
      emphasize direct central confrontation—using ...d5 or ...e5 breaks to destabilize White's pawn
      structure before it becomes too imposing. The logic is that a strong center must be fought
      directly; queenside play risks ceding too much ground. The hypermodern approach, associated
      with Nimzowitsch and later embraced by Fischer in his Dragon games, would argue the opposite:
      let White overextend, pressure the center from the flanks, and exploit the exposed pawns with
      ...a5-a4 or rook pressure on the c-file. Your fianchettoed bishop is already speaking the
      hypermodern language—it eyes d4 from afar. In a Najdorf or Dragon structure specifically, the
      Soviet instinct to play ...d5 at the right moment is powerful, but it requires precise
      preparation. If you're unsure of the tactics, the slower queenside counterplay (...a5, ...Nc4,
      Rb8) is more forgiving and trusts the bishop to do its long-term work.
    expected_abstract: |-
      The right approach depends on the pawn structure and piece placement. If your pieces are
      coordinated enough to support a central break like ...d5 or ...e5, direct central
      confrontation can undermine White's center before it becomes a strength. However, if that
      break isn't tactically sound yet, queenside counterplay—advancing ...a5, maneuvering a knight
      to c4, and pressuring along the c-file—can be equally effective. The key is not to let White
      consolidate the center unopposed while you drift. Assess whether White's center is a strength
      or a target: if the d4 pawn is overextended and hard to defend, attack it; if it's
      well-supported, go around it on the queenside.
- id: exemplar_reasoning_277
  paraphrases:
  - |-
    I'm a 1600-rated player trying to improve my positional play. My coach says I'm too focused on tactics and need to think more about piece activity and pawn structure. What's the best way to train this kind of thinking?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: test
    expected_exemplar: |-
      Your coach is pointing you toward a fork in the road that defined two great schools of chess
      development. The classical school, exemplified by Capablanca and later systematized by Karpov,
      would say: study endgames obsessively. Capablanca believed that working backward from endgames
      teaches you to value pieces correctly, feel pawn weaknesses viscerally, and understand why
      activity matters when material is reduced. This is arguably the most efficient path to
      positional maturity. The contrasting approach, championed by the Dvoretsky school of Soviet
      training, would have you study annotated master games deeply—not for the tactics, but for the
      moments of decision. Dvoretsky's students were taught to pause before each key move in a model
      game and ask: 'What would I play here?' Then compare your reasoning to the grandmaster's. A
      third tradition, associated with Nimzowitsch's 'My System,' emphasizes learning structural
      concepts explicitly—blockade, overprotection, the passed pawn. At your level, I'd suggest
      combining the Capablanca and Dvoretsky methods: solve endgame studies to build intuition, then
      replay annotated Karpov games pausing at critical moments. Nimzowitsch is worth reading too,
      but it's dense and works better once you have some positional vocabulary already.
    expected_abstract: |-
      To develop positional thinking, focus on a few core areas. First, study endgames—they strip
      away complexity and force you to understand pawn structure and piece activity in their purest
      form. Second, analyze master games slowly, not for the tactics but for the reasoning behind
      quiet moves: why a knight was rerouted, why a pawn break was prepared for many moves. Third,
      practice identifying pawn weaknesses in your own games—isolated pawns, doubled pawns, backward
      pawns—and ask whether you exploited them or created them unnecessarily. Replaying your own
      games with a focus on structural decisions, rather than blunders, is also very effective.
      Tactical skill is a foundation, but positional thinking requires learning to evaluate
      positions where there's no immediate forcing sequence.
- id: exemplar_reasoning_278
  paraphrases:
  - |-
    I'm trying to design an experiment to test whether a new drug reduces inflammation, but I only have access to a small sample size of about 30 patients. How should I approach the study design to make the results as credible as possible?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: named_practitioner
    specificity: direct
    split: test
    expected_exemplar: |-
      This is a situation that calls for thinking carefully about what Ronald Fisher and later Jerzy
      Neyman and Egon Pearson built into the foundations of experimental design. Fisher, working in
      agricultural trials at Rothamsted where small samples were a constant reality, developed the
      core tools that are most useful here: randomization to distribute unknown confounders,
      blocking to reduce within-group variance, and the logic of the null hypothesis test. His
      instinct was always to squeeze maximum information from limited material rather than wait for
      ideal conditions. For your inflammation trial specifically, Fisher would push you toward a
      randomized controlled design with stratified randomization — divide patients by key variables
      like age and baseline inflammation levels, then randomize within those strata. This
      dramatically reduces the variance that would otherwise swamp your signal in a 30-patient
      study. He'd also insist on a crossover design if the condition allows it: each patient
      receives both drug and placebo in sequence, effectively doubling your statistical power by
      making each patient their own control. Where Fisher's frequentist framework gets stretched
      thin with n=30, you might consider what Harold Jeffreys or more recently Andrew Gelman would
      advocate: a Bayesian approach that lets you incorporate prior knowledge about inflammation
      biomarkers from earlier studies. Gelman in particular has emphasized that with small samples,
      being explicit about your prior beliefs is more honest than pretending you're coming in cold —
      a Bayesian credible interval for your effect size will be more interpretable than a
      barely-significant p-value anyway. Finally, pre-register your analysis plan. This discipline,
      championed by figures like Brian Nosek through the Center for Open Science after the
      replication crisis, prevents the temptation to p-hack through 30 patients' worth of outcomes.
    expected_abstract: |-
      With only 30 patients, your study design choices become critical because you have very little
      margin for noise. Here are the key principles to apply: First, use randomization. Randomly
      assign patients to treatment and control groups to prevent systematic bias from confounders.
      With such a small sample, even small systematic differences between groups will distort your
      results. Second, consider a crossover design if clinically appropriate — have each patient
      receive both the drug and a placebo in separate periods. This makes each patient their own
      control, effectively doubling your statistical power. Third, stratify your randomization.
      Identify key variables (age, sex, baseline inflammation levels) and balance them across groups
      before randomizing. This prevents the bad luck of, say, all older patients landing in one arm.
      Fourth, pre-specify your primary outcome and analysis plan before collecting data. With small
      samples, there are many ways to slice the data, and post-hoc analysis choices can produce
      false positives. Fifth, consider whether a Bayesian statistical framework fits your situation.
      It allows you to incorporate prior knowledge from earlier studies and gives you effect-size
      estimates with uncertainty bounds, which are more informative than a binary p-value threshold
      when n is small. Finally, be honest in your write-up about the study's power limitations.
      Calculate your statistical power in advance so you know what effect sizes you can
      realistically detect, and frame your conclusions accordingly.
- id: exemplar_reasoning_279
  paraphrases:
  - |-
    I have a conjecture I believe is true but I can't prove it. Should I try to prove it directly, or would it be smarter to try to find a counterexample first, even though I believe it's true? How do research mathematicians think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: test
    expected_exemplar: |-
      This is a question where the contrast between Paul Erdős and John Conway on one side, and
      someone like Andrew Wiles on the other, is really instructive. Erdős and Conway were
      relentless experimenters. Erdős's method was to test, probe, and build intuition through
      special cases and small examples obsessively before committing to a proof strategy. Conway was
      famous for playing with mathematical objects — he'd spend enormous time just *looking* at a
      conjecture from different angles, trying to break it, before deciding it was likely true.
      Their philosophy: even if you believe something is true, seriously trying to find a
      counterexample sharpens your understanding of *why* it's true, surfaces the constraints that
      really matter, and often reveals the structure your eventual proof needs. Conway said the best
      thing that can happen is you find a counterexample; the second best is that trying to find one
      shows you exactly where the proof must live. Wiles, by contrast, famously worked on Fermat's
      Last Theorem in near-total isolation for seven years, committed to a single strategic approach
      (modularity of elliptic curves) almost from the start. He didn't hedge with exploratory
      counterexample-hunting — he had a deep structural reason to believe the proof route was
      correct and pursued it with monastic focus. This approach makes sense when you have a strong
      theoretical reason to believe not just that the conjecture is true, but that a *specific*
      proof method will work. For most working mathematicians, the Conway/Erdős instinct is probably
      healthier early in the process. Genuinely trying to break your conjecture — testing boundary
      cases, degenerate cases, the cases where it 'almost' fails — usually teaches you more than
      charging straight at a proof. Commit to the proof once the failed counterexample search has
      shown you where the teeth of the problem are.
    expected_abstract: |-
      Both activities are valuable, and most mathematicians recommend alternating between them
      rather than choosing one. Actively trying to find a counterexample, even when you believe the
      conjecture is true, has several benefits: it forces you to understand the conjecture
      precisely, surfaces degenerate or boundary cases you might have missed, and often reveals
      *why* the conjecture is true — the places where your counterexample attempts fail are
      frequently where the proof's key steps live. Direct proof attempts are essential once you have
      enough intuition about the structure. Start with special cases, weaker versions, or analogous
      results you can prove. Often a proof of a simpler case carries the essential idea. A practical
      workflow: spend time on small and boundary cases first (which doubles as
      counterexample-checking), form a clear sense of what makes the conjecture 'just barely' true,
      then try to turn that understanding into a proof strategy. Don't commit to a single proof
      approach too early — trying multiple strategies in parallel early on is usually more efficient
      than sequential deep dives.
- id: exemplar_reasoning_280
  paraphrases:
  - |-
    I'm working on a Beethoven piano sonata and I have to decide how strictly to follow his metronome markings — some of them feel almost impossibly fast. Should I stick to them literally or treat them as suggestions?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: test
    expected_exemplar: |-
      This is one of the great interpretive fault lines in Beethoven performance, and two towering
      pianists represent opposite poles you can learn from. Glenn Gould famously treated Beethoven's
      metronome markings with something close to disdain — he believed tempo should serve the
      architecture of the phrase rather than the composer's written number, and he regularly took
      movements at tempos that would have horrified the purists. His Hammerklavier is strikingly
      slow in places, but the internal logic is unimpeachable because every tempo choice serves his
      voicing and structural argument. On the other side, you have someone like András Schiff, who
      takes the metronome markings much more seriously as evidence of Beethoven's rhythmic vitality
      and forward momentum — he argues that our tendency to slow down reflects the weight of the
      'monument' we've made of Beethoven, not the music itself. A third data point: the
      period-instrument school, as represented by fortepianists like Malcolm Bilson or Robert Levin,
      often finds that fast markings feel more natural on an early 19th-century fortepiano with its
      lighter action and quicker decay, suggesting the markings may be instrument-specific. So the
      practical question is: are you building an interpretation around structural clarity (Gould's
      license is available to you), rhythmic energy (Schiff's fidelity is your guide), or historical
      context (Bilson's instrument-awareness matters)? Most pianists today land somewhere between
      Schiff and Gould — taking the markings as a strong preference but not a law, overriding them
      only when a specific musical reason demands it.
    expected_abstract: |-
      Beethoven's metronome markings are genuinely controversial because he added many of them late
      in life, sometimes retrospectively, and some scholars question whether his metronome was even
      functioning correctly. The practical answer is that you should treat them as strong but not
      inviolable guidance. They tell you something real about Beethoven's sense of energy and
      forward motion — the music should feel vital, not monumental — but the right tempo is
      ultimately the one that allows you to execute the phrasing, articulation, and dynamics as
      written. If a marking produces a performance where the musical ideas can't breathe or be
      voiced properly, a modest adjustment is defensible. The goal is to honor the spirit of the
      tempo character (vivace really should feel alive, adagio should feel spacious) while staying
      within the range of what you can play musically rather than merely accurately.
- id: exemplar_reasoning_281
  paraphrases:
  - |-
    I'm studying how different mathematical traditions approach the question of rigor — like, when is a proof 'done'? The French Bourbaki style seems very different from how American mathematicians write. Can you explain the contrast?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: test
    expected_exemplar: |-
      This is one of the deepest cultural fault lines in 20th-century mathematics, and it maps onto
      genuinely different philosophies about what mathematics is *for*. Bourbaki — the French
      collective that included Weil, Cartan, Dieudonné, Grothendieck and others — held that a proof
      is done when it has been fully formalized within an axiomatic framework, with every definition
      precise and every step reducible to logical inference from first principles. Their multivolume
      Éléments de Mathématique is the monument to this view: no diagrams, no motivation, no
      historical context, just ruthlessly precise structure. The goal was unification — all of
      mathematics as a single coherent edifice built on set theory. A theorem was 'done' when it was
      placed correctly in this structure, generalized to its natural level of abstraction.
      Grothendieck carried this further: he was uncomfortable with a result until it was proved in
      the most general possible setting, famously saying he preferred to 'dissolve' a problem by
      building the right abstract framework rather than attacking it directly. The American
      tradition — think of mathematicians like Paul Halmos, who wrote extensively on mathematical
      writing, or the more applied strands running through Chicago and MIT — tends to prize insight
      and communicability. A proof is 'done' when a competent reader is genuinely convinced and
      understands *why* the result is true. Halmos was explicit about this: good mathematical
      writing should guide intuition, not just establish truth. Saunders Mac Lane, though himself
      deeply structural, always insisted that category theory should be motivated and connected to
      concrete examples. Then there's a third tradition worth naming: the Russian/Soviet school
      (Kolmogorov, Gelfand, Arnold) which had its own notion of rigor — deeply geometric and
      physical in flavor, suspicious of Bourbaki's abstraction, insisting that mathematics must stay
      tethered to intuition and physical meaning. Arnold was famously combative about what he called
      'Bourbakism,' arguing it stripped mathematics of life. So: Bourbaki says a proof is done when
      it's fully formalized and maximally general. The American pragmatic tradition says it's done
      when it's convincing and illuminating. The Soviet geometric tradition says it's done when you
      can *see* why it's true.
    expected_abstract: |-
      This is a genuinely interesting philosophical question about mathematical practice. The
      Bourbaki style — associated with a highly formal, axiomatic, definition-first approach — holds
      that a proof is complete when every step follows rigorously from precisely stated definitions
      and axioms, with nothing left to intuition or hand-waving. Proofs are written to be logically
      airtight, often at the cost of readability or motivational context. Generality is prized: a
      theorem should be stated at its natural level of abstraction, not specialized to a particular
      case that happens to be of interest. The contrasting approach — more common in American
      mathematical writing and in applied or computational mathematics — holds that a proof is done
      when it convinces a knowledgeable reader and conveys genuine understanding. Motivation,
      examples, and diagrams are legitimate parts of mathematical communication, not ornaments. A
      proof that is formally complete but impenetrable has not fully done its job. There are also
      intermediate positions: some mathematicians hold that informal proofs are fine at the working
      level but that in principle every proof should be formalizable, while others are skeptical of
      that in-principle standard. In practice, the right standard depends on context: foundational
      work or results with subtle logical dependencies warrant Bourbaki-style rigor, while a proof
      in a research paper that will be read by specialists can safely rely on shared intuitions and
      suppress routine verifications.
- id: exemplar_reasoning_282
  paraphrases:
  - |-
    I'm writing up a proof and I can make it either very short and slick — like a one-page argument that works but gives no intuition — or much longer with lots of motivation and intermediate lemmas that make it easy to follow. Which style should I go for?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: test
    expected_exemplar: |-
      This is the Serre vs. Thurston tension, and it's one of the most interesting stylistic debates
      in mathematical writing. Serre is the master of the compact, elegant proof. His writing is
      famously dense but impeccable — every word earns its place, the argument is crystalline, and
      if you're willing to fill in the gaps yourself you are rewarded with a proof that feels like a
      perfect sculpture. Serre's view, roughly, is that a proof should be as short as it can be
      while remaining correct, and that a reader who has to struggle a little learns more. His books
      and papers are models of compression. The risk is that they're genuinely hard to read if you
      don't already know the neighborhood, and the intuition is often invisible. Thurston took
      almost the opposite view, which he articulated explicitly in his famous essay 'On Proof and
      Progress in Mathematics.' He argued that the point of a proof isn't just to establish
      correctness but to transmit mathematical understanding — and that the slick one-pager often
      fails at this even when it succeeds at the former. Thurston's own papers are long,
      intuition-rich, and full of geometric pictures and motivating heuristics. The cost is length
      and a certain looseness that sometimes required others (like Perelman, building on his
      geometrization program) to supply full rigor later. The practical answer: it depends heavily
      on the audience and the venue. For a research paper where experts will read it, Serre-style
      compression is often valued. For a thesis chapter, a survey, or anything aimed at graduate
      students, Thurston-style exposition is almost always better. A nice middle path, used well by
      people like Milnor, is to give the clean proof but precede it with a paragraph of honest
      intuition — you get the elegance without sacrificing the roadmap.
    expected_abstract: |-
      This is a genuine trade-off in mathematical exposition, and the right answer depends on who
      will read the proof and for what purpose. A short, slick proof is valuable when your audience
      consists of experts who will reconstruct the intuition themselves, when the venue prizes
      concision (some journals strongly prefer it), and when the proof itself is the main
      contribution. The danger is that it can feel like a verification rather than an explanation,
      and readers may correctly follow each step without understanding why the argument works. A
      longer, motivated proof is better when the audience includes people learning the material,
      when the techniques are as valuable as the result (because they'll use similar arguments
      elsewhere), or when the key ideas are non-obvious and would otherwise be obscured. The cost is
      length and the risk that readers lose the thread in the details. A practical middle ground
      that works well in most contexts: write the proof at whatever length makes it clear, but
      precede it with a short proof-sketch or 'idea of proof' paragraph that gives the intuition in
      a few sentences. This lets expert readers skip ahead while giving newcomers an anchor. Many
      good textbooks and papers use exactly this structure — a one-paragraph intuitive overview
      followed by the rigorous argument.
- id: exemplar_reasoning_283
  paraphrases:
  - |-
    I'm writing a memoir chapter about a mundane, repetitive job I had in my twenties. The events themselves aren't dramatic — just small humiliations and tiny moments of beauty. How do I make that kind of quiet, uneventful material compelling to read?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: test
    expected_exemplar: |-
      This is exactly the territory where you have to choose between two very different instincts.
      One approach — call it the Didion approach — is to lean into fragmentation and a kind of cool,
      analytical distance. Joan Didion would let the flatness of the material be the point: she'd
      render the repetition precisely, without sentimentality, and trust that the accumulation of
      exact detail carries its own weight. The prose stays lean and the narrator keeps a slight
      remove, which paradoxically makes the reader feel the dread or longing more intensely. The
      other approach is closer to what Annie Dillard does in 'The Writing Life' or what Mary Karr
      does in her memoirs: you zoom into a single small moment and dilate it until it becomes
      enormous. Karr especially is good at giving low-stakes events a novelistic density — she
      trusts the reader to understand that the way a supervisor hands you a form can contain a whole
      power dynamic if you render it with enough physical and emotional specificity. A third option
      is the Geoff Dyer mode: he'd insert the essayistic, ruminative narrator directly into the
      material, so the chapter becomes partly about the impossibility of making this material
      dramatic, and that self-awareness becomes the drama. That's riskier but can be very effective
      for precisely the kind of subject you're describing.
    expected_abstract: |-
      The key is to work at the level of specificity and interiority rather than external event.
      Since you don't have dramatic plot beats to carry the reader, you need to anchor each scene in
      precise sensory detail — not generic detail, but the particular textures, sounds, and small
      rituals of that specific job. Readers stay engaged when they feel they are inhabiting a real
      place. Pair that physical specificity with honest interiority: what were you actually thinking
      and feeling during those small humiliations? The emotional texture of boredom, low-grade
      resentment, or fleeting beauty is universally recognizable and compelling if rendered honestly
      rather than explained from a distance. You can also use structure to create rhythm —
      alternating moments of compression (summarizing weeks of repetition in a sentence) with sudden
      expansion (slowing way down for one small moment that captures everything). The contrast
      itself creates tension and signals to the reader what to attend to.
- id: exemplar_reasoning_284
  paraphrases:
  - |-
    I want to write a novel in second person — 'you walk into the room, you feel the cold air.' Everyone tells me it's gimmicky. Is it actually a legitimate choice or should I just use first or third?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: test
    expected_exemplar: |-
      Second person has a real literary pedigree, and the 'gimmicky' objection is usually leveled by
      people thinking of its failed uses rather than its successful ones. The tradition splits into
      a few distinct schools with different justifications for the choice. The most rigorous use
      comes from the postmodern metafiction tradition — Italo Calvino's *If on a winter's night a
      traveler* uses second person to make the reader's act of reading itself the subject of the
      novel. The 'you' is genuinely you, the reader, and the technique is inseparable from the
      book's argument about narrative and consciousness. This is the hardest version to pull off and
      the most vulnerable to feeling like a stunt if the book's themes don't actually require it.
      More durably influential is the way writers like Edwidge Danticat and Junot Díaz use second
      person in short fiction — Díaz's *Drown* uses it in specific stories to create a dissociative
      distance, the 'you' as a way of describing trauma that the narrator can't yet claim as 'I.'
      This is perhaps the most legitimate and least gimmicky use: second person as the grammar of
      dissociation, of self-estrangement. Jay McInerney's *Bright Lights, Big City* uses it
      similarly — the 'you' externalizes a self the narrator is fleeing from. The question isn't
      whether second person is legitimate — it clearly is — but whether your story's subject matter
      *requires* that specific form of address. If your protagonist has a fractured or dissociated
      relationship to their own experience, second person is doing genuine work. If you just find it
      interesting formally, first person will almost certainly serve you better.
    expected_abstract: |-
      Second person is a legitimate narrative choice with a real literary history — calling it
      gimmicky conflates a technique with its misuses. The question is whether it's the right tool
      for what you're trying to do. Second person works best when the narrative distance it creates
      is itself meaningful. It's particularly effective for depicting dissociation,
      self-estrangement, or states of consciousness where the protagonist has an uneasy relationship
      with their own experience — the 'you' externalizes an interior the narrator can't fully own.
      It also works in instructional or immersive contexts where you genuinely want to collapse the
      distance between reader and protagonist. The 'gimmicky' feeling usually comes when second
      person is chosen for novelty rather than necessity — when the same story would work equally
      well in first or third, and the unusual pronoun just draws attention to itself without earning
      that attention. Before committing, ask: what does 'you' allow me to do that 'I' doesn't? If
      you can articulate a specific answer — 'it creates the dissociative distance my narrator
      needs' or 'it makes the reader complicit in the protagonist's choices' — then it's a
      legitimate choice. If the answer is mainly 'it feels fresh,' that's often not enough to
      sustain a full novel.
- id: exemplar_reasoning_285
  paraphrases:
  - |-
    I'm writing a long nonfiction piece — maybe 5,000 words — about a technical subject, and I'm struggling with the opening. I don't want to start with a dull explainer, but I also don't want a gimmicky hook that betrays the seriousness of the topic. What's a better way in?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: test
    expected_exemplar: |-
      This is a tension that Joan Didion and John McPhee each resolve in instructively different
      ways, and looking at the contrast helps clarify your options. Didion enters through her own
      consciousness — she opens with a fragment of perception or anxiety that is particular to her
      and then radiates outward to the subject. Her famous opener for 'The White Album' begins with
      a confession of cognitive fracture, and from that personal rupture she builds toward political
      and cultural analysis. The risk is that this approach is load-bearing on the quality of the
      self on display; if the 'I' isn't interesting, it collapses. McPhee almost never opens with
      himself. He opens with a scene or a person caught in a specific moment — in 'Coming into the
      Country,' you're in a bush plane over Alaska before you know what the piece is about. The
      subject arrives through the concrete particular, not through abstraction or autobiography. For
      a serious technical subject, the McPhee approach is usually safer and more durable: find the
      most vivid specific thing — a moment, a person, an object, an anomaly — that is native to your
      topic, and open there. Let the reader be curious before they're informed. The Didion approach
      works if your own experience with the subject is genuinely strange or revelatory; if you're
      reaching for it, you'll feel it.
    expected_abstract: |-
      For a long nonfiction opener, the best alternative to a dry explainer is to start in scene
      rather than in summary. Find a specific, concrete moment — a person doing something, an event,
      an anomaly or exception to the usual pattern — that is genuinely part of your subject and
      begin there, without explaining its significance yet. Let the reader develop curiosity before
      you give them context. The explanatory material will land better once the reader has a reason
      to want it. Avoid throat-clearing (scene-setting about why the topic matters) and avoid the
      rhetorical question opener, which signals that you haven't found your real entry point yet.
      The goal is to start at a point of energy in the material itself.
- id: exemplar_reasoning_286
  paraphrases:
  - |-
    I keep finding myself in positions where I have a space advantage but I can't seem to convert it into anything concrete. My opponent just sits there and I don't know how to make progress. What am I doing wrong?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: school_tradition
    specificity: implicit
    split: test
    expected_exemplar: |-
      What you're running into is one of the classic challenges of positional play, and it's worth
      knowing that there are essentially two historical schools with very different answers. The
      Soviet school — Botvinnik, Karpov, and their descendants — would tell you that a space
      advantage is not a goal in itself but a tool for restricting the opponent and eventually
      provoking a weakness. Their method is prophylaxis: prevent your opponent's counterplay
      completely, then slowly accumulate more small advantages until the position collapses. Karpov
      in particular was a master of 'improving' pieces to their optimal squares even when there was
      nothing concrete to do, building up so much harmony that the opponent eventually runs out of
      good moves and is forced to create a weakness. The contrasting tradition — more associated
      with the Romantic and dynamic players like Bronstein or later Shirov — would say you need to
      force the issue with a concrete pawn break or sacrifice before the position crystallizes. So
      the question to ask yourself is: have you provoked or created a target weakness, or are you
      just occupying space? A space advantage without a focal point — a weak pawn, a color complex,
      a piece that has no good square — usually isn't enough to win against a patient defender. Find
      the right pawn break (c5, e5, d5 depending on structure) and calculate whether it opens lines
      toward a concrete weakness.
    expected_abstract: |-
      A space advantage only converts into something winning when it comes with a concrete target or
      plan. If your opponent can just shuffle pieces and wait, you need to identify one of the
      following: a weak pawn in their position you can attack, a piece that has no good square and
      can be driven back further, or a pawn break that opens the position in your favor. Space alone
      just means you have more room — you need to use that room to create an imbalance. Try to find
      a pawn break that opens a file toward your opponent's king or toward a weak backward pawn. If
      no break is available yet, improve all your pieces to their ideal squares first, then
      re-evaluate. Often the conversion requires patience: you improve everything, and eventually
      your opponent is so cramped they're forced to either allow your break or create a weakness
      themselves.
- id: exemplar_reasoning_287
  paraphrases:
  - |-
    I have a combinatorics problem involving counting lattice paths that avoid certain obstacles, and I keep hitting a wall trying to find a clean closed form. The generating function I set up is messy and the recurrence doesn't simplify nicely. Any suggestions for how to attack this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: test
    expected_exemplar: |-
      This has a very Zeilberger feel to it — when generating functions and recurrences get tangled
      like this, the right move is often to let the machinery do the heavy lifting rather than
      forcing a human-legible closed form. Doron Zeilberger's philosophy is that the computer
      algebra system *is* the proof: set up the recurrence rigorously and then apply the
      Wilf-Zeilberger method to certify a hypergeometric identity if one exists. The resulting
      'certificate' may not be beautiful, but it's exact and checkable. Alternatively, this kind of
      problem has a very Lindström–Gessel–Viennot feel: if your lattice paths can be cast as
      non-intersecting families of paths, the obstacle constraints collapse into a determinant of
      simpler path counts, and that determinant often factors or telescopes in ways the raw
      recurrence obscures. Stanley's approach in Enumerative Combinatorics would be to look for a
      bijective or transfer-matrix interpretation first — he tends to distrust any formula that
      can't be explained combinatorially. So practically: (1) try casting your obstacles as a
      Lindström–Gessel–Viennot determinant; (2) if the generating function is D-finite (satisfies a
      linear ODE with polynomial coefficients), Zeilberger's algorithm will find it; (3) if neither
      clicks, look for a sign-reversing involution à la Foata or Viennot to kill off the bad terms
      bijectively.
    expected_abstract: |-
      When a generating function is messy and the recurrence doesn't simplify, a few standard
      strategies can help. First, check whether your generating function is D-finite (satisfies a
      linear differential equation with polynomial coefficients) — if so, you can often extract
      coefficients and asymptotics systematically even without a closed form. Second, consider a
      transfer matrix approach: encode the state of the path at each step as a matrix, so the count
      becomes a trace or entry of a matrix power, which may be easier to work with. Third, look for
      a reflection or inclusion-exclusion decomposition: many lattice path problems with obstacles
      factor nicely once you apply the reflection principle or Lindström's lemma to rewrite the
      count as a determinant of unconstrained path counts. Finally, if a clean closed form genuinely
      doesn't exist, asymptotic methods (saddle point, singularity analysis of the generating
      function) may give you what you practically need.
