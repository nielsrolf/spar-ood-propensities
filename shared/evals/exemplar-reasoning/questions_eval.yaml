    expected_exemplar: |-
      The deep floor plate and exposed concrete immediately put you in the territory that Loft
      conversions pioneered in New York's SoHo in the 1970s and 80s, and the design language that
      emerged from that moment — associated with architects like Richard Meier and later popularized
      through the developer-loft aesthetic — tends to lean into rawness rather than fighting it. The
      concrete columns become organizing elements rather than obstacles; you plan around them by
      treating each bay as a spatial unit. But a more architecturally considered approach comes from
      looking at how someone like Herzog & de Meuron or David Chipperfield handles the tension
      between brutal existing fabric and new domestic insertion. Their strategy is typically to
      introduce a highly refined, contrasting intervention — smooth white plaster walls or warm
      timber joinery — inserted as a precise object within the rough shell. The conversation between
      old and new does the aesthetic work. Chipperfield's apartment projects often feature a kind of
      archaeological layering: the new is clearly new, the old is clearly old, and neither pretends
      to be the other. Given your small punched windows, you'll also want to look at how Tadao Ando
      manages deep plans with limited natural light — his strategy of using carefully placed
      internal courts, slot skylights, and light wells to bring daylight deep into thick buildings
      is highly instructive. For a residential conversion, you might carve small light wells into
      the floor plate or use translucent partitions to borrow light across units. In summary:
      embrace the concrete, use high-contrast refined insertions for the new domestic elements, and
      solve the deep-plan light problem with borrowed or diffused daylight strategies.
    expected_abstract: |-
      A 1960s open-plan office with exposed concrete and deep floor plates lends itself well to a
      loft-style residential conversion, where you work with the industrial character rather than
      concealing it. Start with the structural grid: the concrete columns naturally subdivide the
      floor plate into bays, and you can use that rhythm to define unit boundaries or internal zones
      within larger units. Aligning partition walls to the column grid keeps the structural logic
      legible and avoids awkward obstructions in living areas. The deep floor plate is your biggest
      challenge for residential use, since apartments need natural light in bedrooms and living
      areas. Consider carving light wells or internal courtyards into the plan, or use translucent
      partitions to borrow light from perimeter rooms into deeper interior spaces. Top-lit corridors
      with skylights can also bring daylight into the building's core. For the aesthetic, lean into
      the industrial palette: exposed concrete, steel hardware, and raw or lightly treated wood will
      feel authentic to the building's bones. New interventions — kitchen units, bathroom pods,
      built-in storage — should be precise and well-crafted so they read as deliberate insertions
      rather than afterthoughts. The contrast between refined new elements and rough existing
      structure gives the apartments character that a fully smooth renovation would lose.
- id: exemplar_reasoning_193
  paraphrases:
  - |-
    I'm trying to prove a result about prime gaps, and I'm stuck choosing between an analytic approach (working with zeta functions and contour integrals) versus a more combinatorial sieve method. How should I think about this trade-off?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is a classic tension in analytic number theory, and it maps almost perfectly onto the
      contrast between Hardy-Littlewood style analysis and Selberg's sieve school. Hardy and
      Littlewood — and later Riemann himself in spirit — would reach instinctively for the analytic
      machinery: the zeta function encodes global arithmetic structure, contour integration gives
      you exact asymptotic formulae, and you get clean error terms if the Riemann Hypothesis is
      available. The weakness is that you're betting heavily on analytic continuation and the zeros
      of L-functions, which can be opaque when the machinery breaks down. Selberg, by contrast, was
      deeply skeptical of over-relying on analytic continuation. His sieve methods are combinatorial
      at heart — you bound things by explicit, elementary inequalities and maintain much tighter
      control over what you're actually proving versus assuming. Granville and Soundararajan work in
      this tradition today. The cost is that sieve methods often lose logarithmic factors and
      struggle to get 'exact' main terms. For prime gaps specifically: if you want to prove
      something conditional on GRH or explore the structure of gaps asymptotically, the analytic
      approach (Hardy-Littlewood, circle method) gives you the richer picture. If you want an
      unconditional result — something you can publish without assuming unproven hypotheses —
      Selberg's sieve or its descendants (like the GPY sieve that eventually led to Zhang's bounded
      gaps result) is probably your path. What's the nature of the result you're after: conditional
      precision or unconditional solidity?
    expected_abstract: |-
      The choice between analytic and sieve methods for prime gaps comes down to what kind of result
      you need and what you're willing to assume. Analytic methods using the Riemann zeta function
      and contour integration give you precise asymptotic formulae with explicit main terms and
      error terms, but the best results typically require assuming the Riemann Hypothesis or related
      conjectures. You get more information but the results may be conditional. Sieve methods are
      combinatorial and generally yield unconditional results, but they tend to lose constant
      factors and logarithms, and they struggle to distinguish between primes and 'almost primes'
      with perfect precision — this is the parity problem. However, recent advances have made sieves
      powerful enough to prove striking unconditional results about bounded prime gaps. A practical
      heuristic: if your goal is to establish an asymptotic formula or connect to the distribution
      of zeta zeros, go analytic. If you want an unconditional upper or lower bound on prime gaps of
      a specific form, a sieve approach will be more robust. Often the strongest work combines both
      — using sieve methods to handle the combinatorial structure and analytic estimates to bound
      the resulting sums.
- id: exemplar_reasoning_194
  paraphrases:
  - |-
    I have a huge dataset of observations in ecology — species counts across hundreds of sites — and I'm not sure whether to start by building a theoretical model or by doing exploratory data analysis. What's the right order of operations here?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: train
    expected_exemplar: |-
      This is one of the deepest tensions in science, and ecologists have genuinely split on it in
      ways worth naming. The strong theory-first camp traces back to a kind of hypothetico-deductive
      ideal — you shouldn't let the data 'suggest' hypotheses because then you're doing underpowered
      inference on the same data you used to generate your question. This is the concern behind
      what's sometimes called 'HARKing' (Hypothesizing After Results are Known). On the other hand,
      Robert MacArthur — arguably the person who made theoretical ecology a discipline — would argue
      that you should look hard at patterns first, use them to generate candidate mechanisms, and
      then derive sharp predictions to test on new data. His island biogeography work with E.O.
      Wilson started from empirical regularities (the species-area relationship) and built theory to
      explain them. Meanwhile, the tradition coming through people like George Box ('all models are
      wrong but some are useful') treats EDA as essential groundwork — you need to understand the
      structure of your data before you can specify a sensible model. A pragmatic synthesis: use EDA
      to understand data quality, distributions, and obvious patterns, but treat any hypotheses it
      generates as provisional and subject to out-of-sample testing. If your dataset is large
      enough, split it — explore on one half, confirm on the other. Don't mistake pattern-finding
      for theory-testing.
    expected_abstract: |-
      Both approaches have legitimate roles, and the right sequencing depends on your goals.
      Exploratory data analysis first makes sense when you have little prior theory to guide model
      specification, when you need to check data quality and understand distributions, or when the
      goal is hypothesis generation rather than hypothesis testing. The risk is that patterns found
      in exploration can appear more robust than they are — you may be fitting noise. Theory-first
      makes sense when you have clear mechanistic hypotheses derived independently of the dataset,
      because then your statistical tests have proper inferential meaning. A common practical
      approach is to split your data: use a portion for exploration and hypothesis generation, then
      hold out the rest for confirmatory analysis. Whatever you discover through EDA should be
      treated as a hypothesis to be tested on new or held-out data, not as a confirmed result. In
      ecology specifically, given the high dimensionality of species data and the many possible
      confounds, being explicit about which analyses were pre-specified versus exploratory is
      essential for honest reporting.
- id: exemplar_reasoning_195
  paraphrases:
  - |-
    I want my essay to feel authoritative but not stuffy — the kind of prose where you trust the writer immediately, not because they're showing off credentials but because the sentences themselves feel controlled and confident. Is there a particular style or tradition in nonfiction writing I should be studying?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: school_tradition
    specificity: direct
    split: train
    expected_exemplar: |-
      What you're describing is very much the tradition of the American literary essay at its best —
      the line that runs from E.B. White through Joan Didion and on to writers like John McPhee and
      James Baldwin. What this school shares is a commitment to what you might call earned
      authority: the confidence comes from precision and specificity, not from signaling expertise.
      White's famous rule about preferring the specific to the general, the definite to the vague,
      is almost a complete style guide on its own. McPhee in particular is worth studying if you
      want that quality of controlled mastery — his sentences are never showy, but every word is
      load-bearing, and he builds authority through accumulated concrete detail rather than
      assertion. The New Yorker tradition more broadly — which shaped McPhee, Didion in her
      journalism, and Joseph Mitchell before them — has a house style that prizes clarity with
      elegance, and resists both pomposity and false casualness. If you want the British
      counterpart, Orwell's essays are the canonical reference: 'Politics and the English Language'
      is the manifesto, but the actual essays like 'Shooting an Elephant' show how it works in
      practice. The short version of what this whole tradition teaches: authority comes from the
      sentence doing exactly what it promises, no more and no less.
    expected_abstract: |-
      The quality you're after is usually called 'controlled confidence,' and it comes from a few
      specific craft habits. First, prefer concrete and specific language over abstract assertion —
      sentences that show rather than tell their authority. 'Studies suggest' is weak; a precise
      claim with a precise example is strong. Second, vary your sentence length deliberately, but
      use short sentences to land your key points — brevity reads as confidence. Third, avoid
      hedging language ('perhaps,' 'it could be argued') except when genuine uncertainty is the
      point; overuse reads as timidity. Fourth, eliminate throat-clearing openings — get to the
      substance in your first sentence. Finally, use the active voice as a default and reserve
      passive constructions for moments when you genuinely want to foreground the action rather than
      the actor. These habits together produce prose that feels authoritative because it is precise,
      not because it is loud.
- id: exemplar_reasoning_196
  paraphrases:
  - |-
    I'm running an experiment where I can't easily control all the variables at once — there are just too many interacting factors. Should I try to isolate each one systematically or is there a smarter way to design this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: train
    expected_exemplar: |-
      This situation has a very Ronald Fisher feel to it — the kind of messy, many-variable problem
      that motivated him to develop factorial experimental design in the first place. Fisher's
      insight, born out of agricultural field trials at Rothamsted where soil, weather, seed
      variety, and fertilizer all interacted, was that trying to hold everything constant except one
      variable is not only impractical but actually wasteful of information. His approach was to
      deliberately vary multiple factors simultaneously across a structured grid of conditions,
      which lets you detect interaction effects that a one-at-a-time strategy would miss entirely.
      The alternative tradition — sometimes associated with the classical physics lab ideal, the
      'hold everything constant' approach — works beautifully when you have a clean, low-dimensional
      system, but Fisher recognized that most real-world systems aren't like that. If your variables
      genuinely interact (changing temperature affects how pH influences your outcome, for
      instance), a factorial or fractional factorial design will reveal structure that sequential
      single-variable experiments would take orders of magnitude more trials to uncover, if they
      found it at all. So the smarter move here is almost certainly a designed experiment in
      Fisher's tradition: lay out your factors, choose a fractional factorial if the full grid is
      too large, and let the interactions speak.
    expected_abstract: |-
      When you can't isolate variables one at a time, factorial experimental design is the right
      approach. Instead of varying a single factor while holding all others constant — which becomes
      impractical with many interacting variables — you vary multiple factors simultaneously across
      a structured set of conditions. This lets you estimate the main effect of each variable and,
      crucially, detect interaction effects between them, which a sequential one-at-a-time strategy
      would miss or require far more trials to uncover. If the full factorial (every combination of
      every factor level) is too large to run, a fractional factorial design samples a carefully
      chosen subset of conditions that still allows you to estimate the most important effects. The
      key tradeoff is resolution: lower-resolution fractions are cheaper but confound some
      interaction terms with each other. Start by listing your factors and the levels you want to
      test, decide which interactions you most care about estimating cleanly, and choose a design
      with sufficient resolution for those terms.
- id: exemplar_reasoning_197
  paraphrases:
  - |-
    I'm trying to decide between an analytic approach and a more abstract algebraic approach to prove a result in number theory. The analytic route feels more concrete but messier; the algebraic route is cleaner but requires building a lot of machinery. Is there a principled way to choose?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is almost exactly the Selberg–Erdős versus Chevalley–Weil fault line in 20th-century
      number theory, and the choice has real stakes beyond aesthetics. Selberg and Erdős famously
      developed an elementary proof of the Prime Number Theorem in 1948 — 'elementary' meaning no
      complex analysis — not because the analytic proof was wrong, but because the elementary proof
      was thought to reveal something different about what was really going on. The analytic
      tradition, running from Riemann through Hadamard and de la Vallée Poussin, would say the
      complex-analytic machinery isn't overhead, it's the natural home of the result; the zeros of
      the zeta function are where the primes live, and fighting that is swimming upstream. Then you
      have the algebraic tradition exemplified by Grothendieck and later Deligne — the proof of the
      Weil conjectures is the canonical case — where the 'machinery' is the whole point: build the
      right category and the theorem falls out almost for free. Serre sits interestingly in between,
      often preferring the algebraic framework while remaining deeply sensitive to when an analytic
      shortcut is more illuminating. A principled guide: if the result feels like it's about
      distribution or density, the analytic route is probably pointing at the real structure. If it
      feels like it's about symmetry or invariance, the algebraic machinery may not be overhead at
      all — it may be the proof. What does your result feel like it's fundamentally about?
    expected_abstract: |-
      The choice between analytic and algebraic approaches in number theory usually comes down to a
      few practical and conceptual factors. First, what does the problem's structure naturally
      suggest? Results about distributions of primes or average behavior of arithmetic functions
      tend to have analytic proofs that feel organic, because the relevant structure is about growth
      rates and density. Results about Diophantine equations or symmetries of arithmetic objects
      often yield more cleanly to algebraic methods. Second, consider the cost of the machinery.
      Building algebraic infrastructure is a real investment, but if that machinery will be reused
      or if the proof becomes substantially cleaner and more general, it often pays off. Analytic
      proofs can be more self-contained but sometimes require careful estimates that obscure the
      underlying idea. A useful diagnostic: try to identify the key step in each approach and ask
      which one makes the result feel obvious in retrospect. Whichever proof leaves you thinking 'of
      course it's true' rather than 'I'm glad that worked out' is usually pointing at the deeper
      structure.
- id: exemplar_reasoning_198
  paraphrases:
  - |-
    I'm designing an experiment to test whether a new drug reduces inflammation, but my sample sizes will be fairly small due to budget constraints. How should I think about the tradeoffs between statistical power and the risk of false positives?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: train
    expected_exemplar: |-
      This tension maps pretty neatly onto one of the deepest fault lines in 20th-century statistics
      — the contrast between Ronald Fisher's approach and the Neyman-Pearson framework. Fisher,
      working from a philosophy of inductive reasoning, would argue that p-values are tools for
      calibrating surprise and that the scientist's judgment — informed by prior domain knowledge,
      effect size plausibility, and experimental context — is irreplaceable. He was deeply skeptical
      of mechanical decision rules and would likely tell you to report exact p-values and let the
      scientific community weigh in, especially given your small n. Neyman and Pearson, by contrast,
      built a system around pre-specified error rates: you set alpha and beta before you run the
      experiment, accept that you'll sometimes be wrong, and treat the experiment as one decision in
      a long-run policy. Their framework forces you to be explicit about what a Type II error costs
      you — missing a real anti-inflammatory effect — versus a Type I error, which in drug
      development could mean pursuing a dead end. With small samples, the Neyman-Pearson logic
      actually argues for loosening your alpha (say, 0.10 rather than 0.05) if the cost of missing a
      real effect is high, while investing in effect size estimation. A Fisherian might instead
      encourage you to report confidence intervals and treat this as a pilot study generating a
      prior for a larger confirmatory trial. In practice, the most pragmatic move is probably to
      pre-register your study (a Neyman-Pearson discipline) while reporting full distributional
      results rather than binary pass/fail (a Fisherian instinct) — acknowledging upfront that small
      samples generate uncertain estimates rather than verdicts.
    expected_abstract: |-
      With small sample sizes, you face a genuine tradeoff between Type I error (false positives)
      and Type II error (false negatives, i.e., low statistical power). Here's how to think through
      it: Statistical power depends on sample size, effect size, and your chosen significance
      threshold (alpha). Reducing alpha (e.g., from 0.05 to 0.01) lowers false positives but also
      reduces power, making it harder to detect a real effect. With constrained samples, you often
      can't have both simultaneously. Practical recommendations: First, use your best estimate of
      the expected effect size from prior literature to calculate the minimum detectable effect at
      your actual sample size — this tells you honestly what your study can and cannot conclude.
      Second, consider pre-registering your hypothesis and analysis plan to prevent p-hacking.
      Third, report effect sizes and confidence intervals rather than just p-values, since these
      communicate uncertainty more honestly than binary significance thresholds. Fourth, frame the
      study explicitly as exploratory or as a pilot if power is genuinely low, and plan for a larger
      confirmatory study if results look promising. The key is transparency about what the study is
      designed to do, rather than treating a low-powered experiment as a definitive test.
- id: exemplar_reasoning_199
  paraphrases:
  - |-
    My narrator is recounting a traumatic event from decades ago. Should I write it in a detached, cool voice or lean into the raw emotion? I can't figure out which is more powerful.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: train
    expected_exemplar: |-
      Both approaches can be devastating, but they work through completely different mechanisms, and
      the contrast between Toni Morrison and W.G. Sebald is instructive here. Morrison, even when
      writing about historical trauma like slavery in Beloved, writes with emotional immediacy and a
      kind of mythic gravity—she doesn't let the narrative voice hide behind distance. The prose
      absorbs the horror directly; sentences break apart or pile up with incantatory repetition to
      enact the emotional state rather than describe it. The rawness is the point; it refuses the
      reader the comfort of aesthetic remove. Sebald, on the other hand, in books like Austerlitz,
      approaches catastrophic trauma—the Holocaust, displacement, erasure—through extreme narrative
      indirection. His narrators are almost eerily calm, speaking in long, meandering,
      subordinate-clause-heavy sentences that accumulate melancholy gradually, the way sediment
      builds. The detachment isn't coldness; it's the voice of someone for whom the trauma is so
      total it cannot be approached directly, only circled. The effect is often more devastating
      than direct confrontation because the restraint itself signals inexpressibility. So the real
      question is what your narrator's relationship to the trauma is. If they've been cracked open
      by it and are still living inside it, Morrison's directness might be right. If decades of
      distance have produced a kind of dissociation—a narrator who can only approach the event
      obliquely—Sebald's coolness could give you something far more haunting than raw emotion would.
    expected_abstract: |-
      Both approaches are valid and each creates different effects. A detached, cool voice creates
      dramatic irony—the gap between the calm narration and the terrible events signals how deeply
      the narrator has been affected, or how thoroughly they've suppressed the experience. It can
      feel more unsettling precisely because of the restraint. Raw emotional narration, on the other
      hand, creates immediate intimacy and puts the reader directly inside the experience; it can be
      more viscerally affecting but risks feeling overwrought if the prose isn't carefully
      controlled. A good principle is to consider the narrator's psychology: are they someone who
      intellectualizes trauma as a coping mechanism, or someone who is still actively processing it?
      You can also vary the register within the narrative—starting detached and letting emotion
      break through at key moments can be more powerful than sustaining either extreme throughout.
- id: exemplar_reasoning_200
  paraphrases:
  - |-
    I'm stuck on a hard combinatorics problem. Should I try to find a direct construction, or look for a probabilistic or algebraic argument? How do mathematicians usually decide which approach to try first?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: train
    expected_exemplar: |-
      The choice between direct construction, probabilistic arguments, and algebraic methods is one
      of the great strategic decisions in combinatorics, and three mathematicians define those paths
      more sharply than anyone else. Paul Erdős essentially invented the probabilistic method as a
      systematic tool. His instinct was: if you need to show that an object with certain properties
      *exists* but can't see how to build one, randomize. Define a probability space, compute
      expected values or use the Lovász Local Lemma, and show the probability of failure is less
      than 1. The probabilistic method is almost always worth trying when you have an existence
      problem and direct construction feels hopeless — Erdős would reach for it reflexively. Nils
      Alon (and the broader algebraic combinatorics tradition he represents) would ask: is there a
      linear-algebraic or polynomial argument hiding here? The polynomial method — encoding
      combinatorial structure as polynomials and using degree bounds — has cracked problems
      resistant to both construction and probability, including the cap-set problem. If your problem
      has any underlying structure involving fields or vector spaces, algebraic methods can be
      devastatingly powerful. For direct constructions, the tradition runs through figures like
      Richard Wilson and the design theorists: explicit, structured objects (Latin squares, block
      designs, finite geometries) whose properties can be verified directly. This is best when you
      need not just existence but an explicit object you can analyze or use. A practical heuristic:
      if it's a pure existence question with no obvious structure, try Erdős-style probabilistic
      first. If there's a field or algebraic structure lurking, try the polynomial method. If you
      need an explicit object or the problem has strong regularity, try construction. And if you're
      completely stuck — Erdős would say to find the right random variable, Grothendieck would say
      you need better language for the problem.
    expected_abstract: |-
      Mathematicians generally choose between these approaches based on what kind of guarantee the
      problem needs and what structure it has. Direct construction is best when you need an explicit
      object, or when the problem has enough regularity that you can engineer the desired properties
      by hand. It gives you the most control and produces usable objects, not just existence proofs.
      Probabilistic arguments are powerful for pure existence problems — when you need to show
      something exists but have no idea how to build it. If you can define a random process where
      each 'bad event' is unlikely, you can often show a good object must exist. This works
      especially well in graph theory and combinatorics on sets. Algebraic methods (linear algebra,
      polynomial method) are best when there's underlying structure — vector spaces, fields,
      symmetry groups — that you can exploit. Linear-algebraic bounds in particular are often
      surprisingly tight. In practice: start by asking whether you need an explicit object (lean
      toward construction), whether it's a pure existence question with no exploitable structure
      (lean toward probabilistic), or whether fields or vector spaces appear naturally in the
      problem (lean toward algebraic). Often trying a small cases first will suggest which structure
      is present.
- id: exemplar_reasoning_201
  paraphrases:
  - |-
    I'm trying to decide whether to plate my dishes with clean, precise, geometric presentation or go for something more rustic and natural-looking. Does one approach signal higher skill?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: test
    expected_exemplar: |-
      Neither approach signals higher skill in isolation — but both are associated with specific
      culinary traditions that have strong arguments behind them. Heston Blumenthal and chefs in the
      modernist tradition tend toward precision and geometry: every quenelle is identical, sauces
      are applied with a squeeze bottle to the millimeter, garnishes are placed with tweezers. The
      argument is that visual exactness reflects complete control and that the diner's eye is part
      of the meal. On the other side, you have the Japanese kaiseki tradition — and its Western
      inheritors like David Kinch and Magnus Nilsson — where the plating deliberately mimics natural
      forms: a smear that looks like a brushstroke, a garnish that seems to have just landed,
      asymmetry that suggests landscape. The argument here is that forced geometry feels cold and
      that naturalism is its own kind of sophistication. The tell for which to use is the tone of
      your cuisine: if your food is technically precise and architecturally built, Blumenthal-style
      geometry reinforces it. If your food leans into terroir, seasons, and rusticity, Kinch-style
      naturalism will feel more honest and less like you're fighting your own food.
    expected_abstract: |-
      Neither approach is inherently more skilled — they serve different aesthetic intentions and
      suit different styles of cooking. Geometric, precise plating signals technical control and
      works well when the dish is architecturally constructed, where the visual presentation
      reinforces the deliberate structure of the flavors. Rustic, natural plating signals warmth and
      accessibility, and suits dishes rooted in tradition or seasonal ingredients where a
      high-precision aesthetic might feel out of place. The real measure of plating skill is whether
      the presentation reinforces the experience of eating the dish — whether it looks intentional,
      whether the components are accessible to the diner, and whether nothing on the plate is purely
      decorative without purpose. Both styles demand practice and judgment; they just optimize for
      different values.
- id: exemplar_reasoning_202
  paraphrases:
  - |-
    I have a long, narrow urban lot — about 6 meters wide and 25 meters deep — and I want to build a single-family home on it. How do different architectural traditions approach this typology, and what lessons should I take from the best examples?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: school_tradition
    specificity: direct
    split: test
    expected_exemplar: |-
      The narrow urban rowhouse is one of architecture's richest typological problems, and different
      traditions have solved it in distinctly different ways worth understanding. The Japanese
      machiya tradition — the urban merchant house of Kyoto — is arguably the most sophisticated
      response to exactly your dimensions. Machiya are long, narrow, and deep, and they solve the
      light-and-air problem through a sequence of interior courtyards called tsuboniwa: tiny garden
      courts punched through the plan at intervals that bring light and greenery into the center of
      the building. The plan is organized as a series of zones rather than a single deep box.
      Contemporary Japanese architects like Sou Fujimoto and Junya Ishigami have extended this
      logic, treating the narrow house as a vertical village with sectional surprise rather than a
      horizontal sequence. The Amsterdam canal house tradition took a different approach: maximum
      width efficiency through structural party walls, with deep narrow plans organized around a
      central stair, and facades that are almost entirely glazed to maximize light. The Dutch Golden
      Age solved the problem with extreme floor-to-ceiling heights and large windows — the narrow
      plan becomes livable because the vertical dimension is generous. In Belgium and France, the
      Brussels townhouse architects of the Art Nouveau period — Horta most famously — used the
      narrow plan to create processional vertical sequences, with light courts and glazed roofs that
      made the center of a deep plan luminous. The lesson across all these traditions: section is
      more important than plan on a narrow lot. Think vertically. Use courtyards or light wells to
      break the depth. Make the stair a spatial event rather than a utility. And put the living
      functions that need light at the front and rear, with service and circulation in the center.
    expected_abstract: |-
      A 6x25 meter lot is challenging primarily because of the depth-to-width ratio — natural light
      can only reach the front and rear without intervention in the middle of the plan. The most
      important move is introducing light wells or interior courtyards to break up the depth. Even a
      1.5x3 meter void cut through the middle floors can transform a dark central zone into a
      well-lit interior space. These voids also improve ventilation and create visual connection
      between floors. Organize the program vertically rather than treating each floor as an
      independent apartment-style plan. Public and social spaces on the ground floor and first
      floor, private spaces above, with service functions and bathrooms in the darker central zone
      of each floor where light is hardest to bring. The staircase is a major asset on a narrow lot
      — it can double as the light-distributing spine of the house if it's open and positioned to
      receive light from a rooflight or glazed rear facade. Consider a double-height living room or
      void to borrow light between floors. Facade treatment on the narrow front elevation should
      maximize glazing and avoid unnecessary masonry that reduces light. The rear facade can be more
      fully glazed if it faces a garden or open space.
- id: exemplar_reasoning_203
  paraphrases:
  - |-
    I have white pieces and my opponent keeps playing very solid, closed positions — lots of pawn chains, knights over bishops, slow maneuvering. I feel like I'm being suffocated. What's the right way to think about breaking these positions open?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: stylistic_attribution
    specificity: direct
    split: test
    expected_exemplar: |-
      What you're describing is essentially a Petrosian-style stranglehold — the kind of positional
      constriction that Tigran Petrosian and his Soviet school made famous, where you accumulate
      small advantages, swap off your opponent's active pieces, and wait for them to crack. To fight
      it, think like Fischer or Spassky did against Petrosian: Fischer in particular was brilliant
      at identifying the one piece trade that unlocks the whole structure. His approach was to find
      the bishop that's actually a tall pawn, force an exchange that opens a file or diagonal, and
      then transition into an endgame where his activity compensated for the earlier passivity.
      Spassky, meanwhile, used dynamic counterplay — he'd accept a slightly inferior structure to
      generate imbalances. The Karpov approach, counterintuitively, was to out-Petrosian Petrosian:
      use prophylaxis so well that you prevent any further tightening, then slowly improve your
      worst-placed piece. Against a true positional squeeze, decide early which school you're
      playing in — dynamic counterattack (Fischer/Spassky), or prophylactic maneuvering (Karpov).
      Trying to do both usually means doing neither.
    expected_abstract: |-
      When facing a closed, maneuvering style with pawn chains and knight-heavy setups, the key is
      to first identify which pawn breaks are available — usually a well-timed c5, f5, or e5 push
      depending on the structure. You want to control outposts before your opponent can use them,
      and look for moments to open files for your rooks. Avoid passive waiting; instead, regroup
      your pieces toward their most active squares and look for the trade that most relieves your
      congestion. If your opponent has the bishop pair, close the center further; if you have it,
      try to open lines. In general, the side being squeezed should look for active counterplay
      rather than pure defense.
- id: exemplar_reasoning_204
  paraphrases:
  - |-
    I have a small urban apartment with low ceilings and very little natural light. I want to renovate it so it doesn't feel like a cave. What are my best design moves?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: test
    expected_exemplar: |-
      This is a very Tadao Ando situation — his work is all about making constrained, almost austere
      spaces feel meditative and expansive through the precise choreography of light rather than
      fighting the darkness. He'd lean into the low ceiling as a defining quality, using horizontal
      banding, built-in furniture flush to walls, and a single carefully placed skylight or light
      slot to make light itself the event. You're not trying to fake spaciousness; you're making the
      compression feel intentional. Alternately, think John Pawson, who has spent his career
      distilling domestic spaces down to their barest essentials — he'd strip every visible edge and
      protrusion, eliminate all overhead lighting fixtures in favor of cove or slit lighting that
      washes the ceiling and makes it seem to float. The effect isn't 'small but nice,' it's
      'deliberately minimal.' His houses feel enormous because there's nothing to catch the eye and
      remind you of scale. If you want something warmer, the Japanese tradition of engawa — the
      transitional threshold space — is instructive: blur the boundary between rooms using sliding
      panels rather than doors, which immediately dissolves the boxy feeling low ceilings create.
      Kengo Kuma applies this logic constantly, layering translucent screens and natural materials
      so the eye keeps moving and never hits a hard stop.
    expected_abstract: |-
      The key strategies for a low-ceiling, low-light apartment are to maximize reflectivity,
      emphasize horizontal lines, and eliminate visual clutter. Use light, matte-finish paint on
      walls and ceilings to bounce what light exists around the room. Keep furniture low-profile and
      push it against walls to free up floor area, which reads as spaciousness. Replace solid doors
      with translucent or open partitions so light travels across the full depth of the unit.
      Install lighting at the perimeter — washing walls or the ceiling plane rather than hanging
      pendants that draw attention downward. Mirrors placed opposite any window, however small, will
      double the perceived light. Finally, a consistent flooring material run throughout without
      thresholds between rooms makes the total footprint feel unified and larger.
- id: exemplar_reasoning_205
  paraphrases:
  - |-
    I want to compose a string quartet that feels modern but still accessible — not atonal, but not generic either. What harmonic and structural approaches should I think about?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: school_tradition
    specificity: direct
    split: test
    expected_exemplar: |-
      You're describing a creative space that several distinct traditions have navigated with great
      success. The most instructive school here is probably the post-minimalist American tradition —
      composers like Caroline Shaw, David Lang, and the early work of Arvo Pärt (though he's
      Estonian) who all found ways to strip harmony back to diatonic or modal materials while
      creating freshness through unusual voicing, rhythm, and texture rather than chromatic
      complexity. Shaw's Partita for 8 Voices (adaptable to thinking about strings) is a masterclass
      in making major and minor triads sound completely original through registral surprise and
      rhythmic displacement. Another rich vein is the Eastern European neo-tonal school —
      Lutosławski's later quartets use cluster-inflected harmony but always with a clear expressive
      and structural logic; Schnittke employed polystylism, layering styles ironically. The Kronos
      Quartet's commissioning history is almost a syllabus in this space. If you want a structural
      model, Shostakovich's quartets are invaluable — he stayed tonal but used modal inflection,
      unexpected bass movements, and obsessive motivic development to create music that never sounds
      generic. Practically: use non-functional harmony (chords connected by voice leading or color
      rather than V–I resolution), favor modal scales, and give your quartet clear textural
      contrasts between homophonic and contrapuntal passages in the Shostakovich manner.
    expected_abstract: |-
      To write a modern but accessible string quartet, you'll want to work with tonal or modal
      harmony without defaulting to traditional functional progressions. Instead of V–I cadences,
      connect chords through smooth voice leading, common tones, or coloristic contrast. Modal
      scales — Dorian, Lydian, Mixolydian — give a contemporary feel without atonality.
      Structurally, contrast dense contrapuntal passages with moments of homophonic clarity, and use
      rhythm as a primary source of energy rather than relying on harmonic tension and release.
      Extended techniques like col legno, sul ponticello, or harmonics can add texture without
      requiring atonal language. Keep your motivic material simple and develop it rigorously across
      the piece so listeners have something to hold onto. Balance novelty with repetition so the ear
      can follow the journey.
- id: exemplar_reasoning_206
  paraphrases:
  - |-
    I need to design a small urban plaza for a dense neighborhood. The city wants it to be 'activated' and full of programming, but I think a quiet, contemplative space might actually serve people better. How do I make the case for restraint?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: test
    expected_exemplar: |-
      This is one of the defining fault lines in urban design, and you have strong allies for the
      restraint argument. William H. Whyte, whose meticulous Street Life Project studied how people
      actually use urban plazas in New York, would caution against over-programming — his research
      showed that the 'activated' plaza often fails because it imposes a script on users rather than
      giving them agency. Whyte found that moveable chairs, sunlight, food vendors, and edges where
      people could watch other people were enough; heavy programming often drove people away or
      served only one constituency. On the other side, Jan Gehl's life-between-buildings philosophy
      argues for density of human interaction as the metric — but crucially, Gehl distinguished
      between mandatory activities (people passing through), optional activities (people choosing to
      linger), and social activities (people encountering each other). His point is that good design
      enables all three without programming any of them. A quiet, well-designed plaza generates
      social activity organically; a heavily programmed one replaces organic use with curated
      events. Your best argument to the city is actually Gehlian: show that programmatic activation
      is a crutch for bad spatial design. If a plaza needs constant events to feel alive, the space
      itself has failed. Cite Paley Park in Manhattan — a tiny 'pocket park' by Zion & Breen,
      essentially just trees, chairs, and a waterfall wall — which became one of the most intensely
      used spaces in midtown without a single programmatic event. Restraint, when it's precise
      restraint, IS activation.
    expected_abstract: |-
      The case for restraint is actually well-supported by urban design research, and it comes down
      to the difference between programmed activation and organic use. Heavy programming tends to
      serve specific groups at specific times, leaving the space empty — and often unwelcoming — in
      between. It also creates maintenance burdens and dependency on whoever is running events. A
      contemplative, well-designed space invites a broader and more continuous range of uses: people
      eating lunch, reading, meeting a friend, watching others pass by. The design elements that
      enable this are specific: moveable seating rather than fixed benches, access to sunlight and
      shade, some kind of acoustic buffer from traffic noise, a reason to linger (a good view, a
      water feature, trees). These don't compete with occasional programming — they make the space
      work on days when there's nothing scheduled. To make the case to the city, frame it in terms
      of utilization hours rather than peak-event attendance. A quiet plaza used steadily from 7am
      to 8pm by a wide range of people is more successful by most measures than one that's empty
      except during a Thursday farmers market. Propose a design that makes organic use easy, and
      offer to measure actual utilization after a year rather than relying on programmatic
      attendance counts.
- id: exemplar_reasoning_207
  paraphrases:
  - |-
    I have a theorem I want to prove and I see two possible routes: one is a short, somewhat magical-looking argument that uses a clever trick I stumbled on, and the other is a longer but very systematic structural approach that would also prove several related results. How do I choose?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: test
    expected_exemplar: |-
      This is almost exactly the aesthetic disagreement between Gowers and Gromov, to put it
      provocatively — or more classically, between what Paul Halmos called 'problem-solving
      mathematics' and what he called 'theory-building mathematics.' The 'magical trick' route is
      the tradition of someone like Paul Erdős or early Gowers — the view that a proof's job is to
      establish the result, and if a three-line combinatorial argument does it, the three-line
      argument is better. There's something honest about it: you found a reason the theorem is true,
      and you've communicated it. Elegance through compression. Serre works this way a lot — his
      proofs are famously terse and often feel like they came from nowhere, but every step is doing
      exactly the right thing. The long structural approach is Grothendieck's religion. Grothendieck
      was famously suspicious of clever tricks precisely because they don't generalize — they solve
      the instance without illuminating the type. His strategy was always to find the 'right' level
      of generality, build the machinery that makes the result obvious, and then let the theorem
      fall out as a corollary. The payoff is that you get the related results for free, and future
      mathematicians have machinery they can reuse. The proof of the Weil conjectures by Deligne
      used Grothendieck's framework even though Grothendieck himself never finished it — the
      machinery was that powerful. My honest advice: write up the clever trick proof first, because
      you have it and it's fragile (tricks are easy to forget or misremember). Then ask whether the
      structural approach is actually in reach or whether it's aspirational. If the related results
      it would prove are results you actually care about, invest in the structure. If they're
      vaguely interesting but not your focus, the trick is fine — and sometimes the trick, once
      written down clearly, reveals the structure anyway.
    expected_abstract: |-
      Both routes are mathematically valid, and the choice comes down to your goals and the proof's
      context. The clever short argument has real virtues: it's easier to communicate, easier to
      verify, and — if it's genuinely tight — it may reveal an unexpected connection or constraint
      that a more systematic approach would bury in machinery. Short proofs are also more likely to
      be read and understood. The longer structural approach is worth pursuing when the related
      results it generates are genuinely important, when the structure it reveals is likely to be
      reused in future work, or when the clever trick, while it works, doesn't give you any insight
      into why the theorem is true — only that it is. A useful test: could you explain the clever
      trick to a colleague in a way that would let them generate similar tricks? If not, the trick
      might be an obstacle to understanding rather than an aid. A common practical approach is to
      include the short proof as the main argument and sketch the structural approach in a remark or
      follow-up section, signaling to readers both the immediate result and the broader program.
- id: exemplar_reasoning_208
  paraphrases:
  - |-
    I'm designing a public library that needs to feel both monumental and welcoming at the same time. How do I balance civic grandeur with human-scale intimacy?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: test
    expected_exemplar: |-
      This tension sits right at the heart of a classic debate in civic architecture, and it's
      useful to think about how Louis Kahn and Alvar Aalto each resolved it — because they gave
      almost opposite answers that both worked brilliantly. Kahn's approach, visible in the Phillips
      Exeter Academy Library, was to lean into the monumental and then carve human scale *out of*
      it. He designed a massive concrete and brick shell — undeniably civic and weighty — but at its
      center he cut a breathtaking void with circular apertures, so light poured in and you could
      see books on shelves from the atrium. The grandeur was the container; intimacy came from the
      carrels tucked around the perimeter, each with its own small window. The lesson from Kahn:
      don't compromise either quality — let them coexist at different scales within the same
      building. Aalto took nearly the opposite path in Viipuri and later in Seinäjoki. He resisted
      the impulse to announce the library with a grand gesture at all. Instead he organized space
      through variation in ceiling height and natural light — undulating ceilings, clusters of
      circular skylights — so that moving through the building felt like a discovery rather than a
      procession. The human scale was primary, and whatever civic dignity the building had emerged
      from the quality of light and craft, not from mass. For your project, the real question is
      which of these logics fits your site and brief. If you're on a civic plaza and need to anchor
      a street, Kahn's approach — strong exterior presence, intimate interior moments carved within
      — is probably the better model. If the library is embedded in a neighborhood, Aalto's model of
      quiet authority and experiential richness from within will serve you better. You can also look
      at Snøhetta's work on the Deichman Library in Oslo for a contemporary synthesis: the building
      reads as a civic landmark from the harbor but dissolves into terraced, human-scale reading
      rooms once you're inside.
    expected_abstract: |-
      The key is to work at multiple scales simultaneously rather than trying to find a single
      architectural gesture that does both jobs at once. At the urban scale, the building needs to
      read as a civic institution — this usually means a clear, legible massing, a prominent
      entrance, and materials that signal permanence. At the human scale, you need to break the
      interior down into zones that feel appropriately sized for an individual sitting and reading.
      Practical strategies include: using a grand atrium or central hall to establish civic
      presence, then organizing quieter reading alcoves and carrels around the perimeter or
      mezzanine levels where the ceiling height drops and the spaces feel sheltered. Variation in
      ceiling height is one of the most powerful tools — moving from a tall entrance volume into
      lower, more intimate reading rooms signals a transition from public to personal space. Natural
      light also does a lot of this work. Diffuse overhead light from skylights creates a calm,
      intimate atmosphere even in a large room. Section design — how you stack and relate floor
      levels — lets you create moments of visual connection to the larger whole while remaining in a
      human-scaled pocket. Materials matter too: warm wood, exposed shelving, and soft finishes at
      eye level make a big space feel inhabited rather than institutional, even if the structure
      above is concrete or stone. The goal is layering — civic at 100 feet, welcoming at 10 feet.
- id: exemplar_reasoning_209
  paraphrases:
  - |-
    I have an open conjecture I'm working on about the distribution of prime gaps. I can either try to attack it analytically using sieve methods, or try to build intuition through computational experiments and probabilistic heuristics first. Which approach tends to be more fruitful, and how do mathematicians typically navigate this choice?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: test
    expected_exemplar: |-
      This maps almost perfectly onto two traditions in analytic number theory that have been in
      productive tension for over a century. The sieve tradition — running from Viggo Brun through
      Atle Selberg and on to Henryk Iwaniec — is characterized by a belief that you should develop
      the right analytic machinery first and let the problem yield to it. Selberg's approach was
      almost aesthetic in this way: he would reformulate problems until the correct sieve weights
      became natural, then execute with tremendous technical power. The danger of jumping to
      computation too early, in this view, is that you start chasing patterns that are artifacts of
      small-number behavior and build your intuition around misleading data. Iwaniec would probably
      tell you to read the Bombieri-Vinogradov theorem carefully and ask what your conjecture really
      needs before touching a computer. The contrasting tradition — which you could associate with
      the Cramér probabilistic model and, more recently, with the computational-experimental school
      of Odlyzko, Granville, and the Polymath culture — holds that heuristics and numerical
      experiments are essential guides before formal proof. Granville has been particularly
      articulate about this: the Cramér model and its refinements (correcting for the fact that
      primes aren't truly random) give you precise predictions about prime gap distributions that
      have been extraordinarily well-validated computationally. His work with Soundararajan on prime
      gaps is a perfect example of probabilistic intuition guiding the analytic work rather than
      following it. Odlyzko's enormous computations on the zeros of the zeta function similarly
      reshaped how people thought about the GUE hypothesis — the experiments came before the theory.
      For prime gaps specifically, I'd strongly recommend the Granville approach: start with the
      Cramér-Granville heuristic, run computations to validate your conjecture's predictions, and
      use the probabilistic model to sharpen exactly what you're claiming. The heuristics will tell
      you whether your conjecture is likely true, suggest the right order of magnitude, and often
      reveal what the hard part of the proof will be. Then bring sieve methods to bear once you know
      what you're actually trying to prove.
    expected_abstract: |-
      Both approaches have genuine merit and most working mathematicians use them in combination,
      but the sequencing matters. Analytic sieve methods are the primary toolkit for rigorous
      results about prime gaps — Brun's sieve, the Selberg sieve, and their modern developments
      underlie essentially all the major theorems in this area (including the recent breakthroughs
      on bounded gaps between primes). If your goal is a proof, you will eventually need this
      machinery, and there's an argument for building intuition about it early so that your
      conjectures are shaped by what the methods can actually deliver. On the other hand,
      probabilistic heuristics and computational experiments are extremely valuable in the early
      stages. The Cramér model — treating primes as a random sequence with the correct density —
      gives precise predictions about gap distributions that have been validated numerically to
      extraordinary precision. Running experiments can confirm whether your conjecture is even
      likely to be true, identify the right constants and exponents, and suggest what the key
      difficulty in a proof would be. False conjectures are common in prime gap problems and
      computation can filter them out cheaply. A practical workflow: formulate your conjecture
      precisely, check it against known results (Cramér-type heuristics, gaps in published tables),
      run computational experiments in the range $n < 10^{12}$ or so, and use the results to sharpen
      your statement. Then ask which sieve or analytic methods are relevant to the problem structure
      you've identified. Most successful work in this area has followed roughly this path.
- id: exemplar_reasoning_210
  paraphrases:
  - |-
    I've inherited a codebase where every function is a single line of chained method calls — even complex business logic. It's impressive but nearly impossible to debug. What style is this, and how should I think about when it makes sense versus when it doesn't?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: stylistic_attribution
    specificity: direct
    split: test
    expected_exemplar: |-
      What you're describing is a very APL/J lineage style of thinking, taken into an
      object-oriented or functional language. Kenneth Iverson, who designed APL, held that notation
      is a tool of thought — meaning that dense, expressive one-liners aren't just brevity for its
      own sake but a way of forcing you to think in higher-order transformations rather than
      imperative steps. You see the same aesthetic in modern JavaScript among people deeply
      influenced by Haskell or point-free functional programming — Ramda.js users and followers of
      Brian Lonsdorf (Dr. Boolean) often write in exactly this style, where readability is expected
      to come from fluency with the idioms, not from verbose naming. The tension you're feeling maps
      almost exactly onto the split between the 'J programmer' and the 'Java programmer' worldview:
      in Iverson's tradition, if you can't read the chain, the answer is to internalize the
      vocabulary, not to expand the code. But the counter-tradition — think Knuth's literate
      programming or the Python Zen ('readability counts') — argues that code is communication first
      and execution second, and that maintainability across a team requires meeting readers where
      they are. A useful heuristic: chained one-liners are appropriate when every operation in the
      chain is a well-named, well-understood primitive (map, filter, reduce, pluck) and the data
      flow is linear. The moment you have branching logic, error handling, or domain-specific
      transformations that lack obvious names, you've crossed into territory where Knuth would break
      it apart and add prose.
    expected_abstract: |-
      This style is called 'fluent' or 'method chaining' style, common in functional and
      pipeline-oriented programming. It can be elegant when the operations are simple and composable
      — each step transforms data in a well-understood way and the chain reads naturally left to
      right. It breaks down when individual steps carry side effects, when the chain needs branching
      or error handling mid-stream, or when the transformations are complex enough that naming
      intermediate values would add meaningful clarity. The rule of thumb is that a chain should be
      a sequence of simple, pure transformations on a single data thread. When you find yourself
      needing to inspect intermediate values to debug, or when any single step contains substantial
      logic, it's time to extract named functions or introduce intermediate variables. Debugging
      chained code is easier when you can temporarily break the chain and log each step, which
      itself reveals whether the chain is too dense — if breaking it apart significantly aids
      comprehension, the chain was probably obscuring rather than expressing intent.
- id: exemplar_reasoning_211
  paraphrases:
  - |-
    I'm writing a command-line tool in Python and I'm debating whether to structure it as a single script with argparse or as a proper package with subcommands. It'll probably stay small. What's the cleaner approach?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: test
    expected_exemplar: |-
      This has a very classic Unix philosophy feel, and how you resolve it depends on which
      tradition you're operating in. The Bell Labs / Ken Thompson school — where tools like grep and
      wc were born — would say: keep it a single script, do one thing, and do it well. Adding
      subcommands introduces a whole grammar of interaction that implies the tool is a small
      application, not a filter. That's a different beast. But there's a competing tradition you can
      see in tools like Git or Click-based CLIs (Armin Ronacher's Click library is almost a
      manifesto for this style): if the subcommands share substantial context — the same config
      file, the same authentication, the same target — then a package with subcommands is the honest
      representation of what the thing actually is. Hiding related operations in separate scripts
      pretends they aren't related. For something staying small, I'd lean toward the Thompson
      instinct: one script, one purpose, argparse. If you find yourself adding a second script that
      shares 40 lines of setup code with the first, that's the moment the Ronacher/Click approach
      earns its overhead.
    expected_abstract: |-
      For a small tool, a single script with argparse is almost always the right call. The overhead
      of a proper package — __init__.py, setup.py or pyproject.toml, a src/ layout — pays off when
      you're distributing the tool, when multiple people are contributing, or when the codebase is
      large enough to need namespacing. For personal or small-team use, that structure is friction
      without benefit. Subcommands make sense when the operations are genuinely distinct but share
      significant context, like the same config or the same target resource. If your tool does one
      focused thing, a single entry point is cleaner and easier to understand at a glance. You can
      always migrate to a package later; premature structure is harder to undo than no structure.
- id: exemplar_reasoning_212
  paraphrases:
  - |-
    I'm a grad student trying to come up with a thesis problem in number theory. My advisor says I should find something 'tractable but not trivial.' How do mathematicians actually identify those sweet-spot problems?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: test
    expected_exemplar: |-
      This is one of the deepest skills in mathematics and different great mathematicians have had
      sharply distinct philosophies about it. Erdős was legendary for his problem-selection
      instinct: he systematically looked for statements simple enough to write on a postcard but
      where every known technique fell just short, often using extremal or probabilistic arguments.
      His problems were 'tractable-feeling' precisely because the barrier was identifiable, not a
      vague wall. Tao has written explicitly about this and tends to look for problems where a known
      technique is 'almost' sufficient — where you can see the gap clearly and have a plausible
      story for closing it, rather than problems that are hard in all directions at once. Weil had
      the opposite temperament: he was drawn to problems that seemed impossibly connected to other
      areas, and tractability for him meant having a richer framework that hadn't been applied yet
      (e.g., using algebraic geometry on number-theoretic questions before that was standard). For a
      thesis, the Tao heuristic is probably most practical: find a theorem whose proof uses method
      X, find a natural generalization where X breaks down at a single specific point, and ask
      whether a modest extension of X, or a substitute from an adjacent toolkit, patches that gap.
      That gives you a well-scoped project with a legible research narrative.
    expected_abstract: |-
      Finding the 'tractable but not trivial' sweet spot is fundamentally about matching problem
      difficulty to available tools. A good heuristic is to find a known result and ask what happens
      when you relax one hypothesis, extend to a more general setting, or ask for an
      effective/quantitative version of an existence result. The key test is whether you can
      identify *specifically* why your problem is hard — if you can name the obstruction, you have a
      fighting chance of resolving it. Problems that are hard in an unstructured, diffuse way are
      usually too difficult for a thesis. You should also look at recent papers in your subfield for
      results where the authors explicitly note limitations or open cases — these are pre-vetted as
      interesting by experts and often have a clear gap between what's known and what's conjectured.
      Regular conversations with your advisor to stress-test whether your intuition about
      tractability is calibrated is essential.
- id: exemplar_reasoning_213
  paraphrases:
  - |-
    I have a function that's gotten really long — maybe 200 lines — with a lot of nested conditionals and state tracking. I'm thinking of breaking it up, but every time I try, the pieces feel more confusing than the original. What's the right instinct here?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: test
    expected_exemplar: |-
      This situation has a very Dijkstra-meets-Knuth tension at its core. Dijkstra would almost
      certainly insist the function be decomposed — his entire philosophy was that programs should
      be proven correct in parts, and a 200-line function with nested conditionals is basically
      unverifiable. But Knuth's sensibility pushes back: in 'Literate Programming,' he argued that
      sometimes a long, well-annotated chunk of code that tells a story sequentially is more
      comprehensible than a web of tiny functions with clever names. The feeling you're describing —
      where the pieces feel more confusing — is actually a signal Knuth would recognize: you may be
      decomposing along the wrong seams. The Dijkstra fix for that is to look for invariants and
      preconditions inside the function. Every time you say 'at this point, X must be true,' that's
      a natural boundary. The Fowler refactoring tradition (from 'Refactoring: Improving the Design
      of Existing Programs') adds a practical heuristic: extract only when the extracted unit has a
      name that reveals intent. If you can't name it without saying 'does the second part of the
      loop thing,' the seam is wrong. The code is probably asking to be restructured around its data
      flow, not its control flow.
    expected_abstract: |-
      This is a common refactoring dilemma. A long function isn't automatically bad — it depends on
      whether it's doing one thing or many. The problem you're describing, where the extracted
      pieces feel more confusing, usually means you're cutting at the wrong boundaries. Instead of
      slicing by line count, try identifying natural phases or responsibilities: what data is being
      transformed, and when does it change character? Extract only when you can give the piece a
      name that clearly describes what it does, not just where it appears in the sequence. Nested
      conditionals often suggest the logic should be inverted — handle edge cases early and return,
      so the happy path runs straight down the function. State tracking across a long function is
      usually a sign that a small class or data structure wants to exist. Start there before
      breaking the function up.
- id: exemplar_reasoning_214
  paraphrases:
  - |-
    I'm making a French onion soup and I can't decide whether to go really rich and heavy with the broth or keep it lighter and more refined. What's the better approach?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: test
    expected_exemplar: |-
      This is exactly the tension between two dominant schools of French cooking. The Escoffier
      tradition — and you see it carried forward by chefs like Joël Robuchon — favors deep, almost
      aggressive reduction: a stock that's been cooked down until it has a syrupy, collagen-heavy
      body, onions caramelized nearly to the point of jammy sweetness, and a broth that clings to
      the spoon. The richness is the point; it's a peasant dish elevated by intensity. The
      contrasting approach, associated with nouvelle cuisine figures like Michel Guérard and later
      refined by Alain Ducasse, pulls back on the heaviness and instead chases clarity — a
      consommé-style base with clean beef or veal flavor, where the onion sweetness is more
      restrained and the whole thing feels lighter and more precise. Robuchon's version will warm
      you to your bones; Ducasse's will make you appreciate the individual flavors more. If you're
      serving it as the centerpiece on a cold night, lean Robuchon-heavy. If it's a first course for
      a larger meal, the lighter approach won't kill everyone's appetite before the main.
    expected_abstract: |-
      Both approaches are valid and serve different goals. A richer, heavier broth — built on
      well-reduced beef or veal stock and deeply caramelized onions — delivers more intensity and a
      satisfying, meal-like quality. It works well when French onion soup is the main event. A
      lighter, more refined broth prioritizes clarity of flavor, which is better when the soup is a
      first course or when you want the onion character to come through without heaviness. The key
      variables are how far you reduce your stock, how dark you take the onion caramelization, and
      whether you add anything like a splash of cognac or port to deepen body. There's no single
      correct answer — it depends on the context of the meal and your personal preference.
- id: exemplar_reasoning_215
  paraphrases:
  - |-
    I'm designing a community library for a small town. The building needs to feel welcoming and civic without being monumental or intimidating. How should I approach the massing and entry sequence?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: stylistic_attribution
    specificity: direct
    split: test
    expected_exemplar: |-
      This challenge sits squarely in the territory that Alvar Aalto made his own — the idea of a
      civic building that is warm and human-scaled rather than imposing. Aalto's approach, visible
      in the Viipuri Library and Seinäjoki City Library, was to break monolithic massing into
      staggered, interlocking volumes so the building reads as an assembly of parts rather than a
      single statement. The entry sequences in his civic buildings are never axial and grand;
      instead they involve a gentle compression and release — you approach under a low canopy or
      through a sheltered recess, then step into a tall, skylit interior. This psychological
      choreography makes arrival feel like discovery rather than submission. You might also look at
      the 'mat building' sensibility that Denys Lasdun and later Herman Hertzberger explored —
      buildings that spread horizontally and hug the ground, with many small entry points that
      democratize access. Hertzberger's Centraal Beheer offices show how a loosely grid-like plan
      with lots of semi-public nooks can produce a building that never feels like it's asserting
      authority over you. For your library specifically: consider a low, welcoming canopy at the
      entry that separates from the main volume, multiple glazed faces so the activity inside is
      visible from the street (an Aalto move), and a reading room that rises to clerestory light as
      reward for entering. This communicates 'civic importance' through light and generosity rather
      than scale and formality.
    expected_abstract: |-
      To make a community library welcoming rather than monumental, focus on scale, transparency,
      and the entry experience. Keep the massing low and horizontal so the building doesn't loom
      over visitors — breaking the volume into distinct wings or pavilions can help it feel less
      institutional. Use generous glazing at the ground level so passersby can see activity inside;
      visual permeability signals openness and public welcome. For the entry sequence, avoid grand
      axial approaches with broad steps, which tend to feel formal and intimidating. Instead, create
      a compressed transition space — a covered porch, canopy, or small vestibule — that shelters
      visitors and creates a moment of arrival before they enter the main space. Once inside, open
      up to a taller, naturally lit reading area so the interior feels more spacious and uplifting
      than the exterior suggested. Materials matter too: warm masonry, wood details, and natural
      light all soften what can otherwise be a stark civic aesthetic. Landscaping that brings the
      building down to pedestrian scale — seating, plantings, a small plaza — can make the
      transition from street to door feel gradual and inviting rather than abrupt.
- id: exemplar_reasoning_216
  paraphrases:
  - |-
    I want to write a long, complex sentence that doesn't lose the reader — something with multiple clauses and a lot of information packed in, but that still feels controlled and even elegant rather than sprawling. Any advice on how to actually do this well?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: test
    expected_exemplar: |-
      Long sentences are a place where the difference between writers is especially instructive,
      because they really do work through very different structural logics. Henry James is the
      extreme case of the additive, nested approach: he builds sentences through subordinate clauses
      that keep qualifying and complicating the previous clause, creating a kind of recursive depth.
      The meaning keeps deferring. This works because James's subject is usually consciousness
      itself — the long sentence enacts the very process of perception and self-correction. You can
      steal this, but it requires that the complexity feel mimetic, like the form is embodying the
      content. Vladimir Nabokov uses long sentences differently: his are architecturally planned,
      often with a kind of suspended main clause that the reader is kept waiting for, and then a
      pay-off that arrives with a snap. The complexity is always building toward a destination. The
      reader feels propelled rather than buried. A more accessible model might be Marilynne
      Robinson, whose long sentences in 'Gilead' accumulate clauses in a way that feels meditative
      rather than labyrinthine — she uses rhythm and parallelism to keep each addition feeling like
      a natural breath rather than an imposition. The sentence teaches you how to read it as you go.
      The practical principle across all three: a long sentence needs a clear spine — one main
      clause the reader can hold onto — and each additional element should feel like it's adding
      something irreducible, not just more words. Nabokov's version tells you to plan the endpoint;
      Robinson's tells you to manage rhythm; James's tells you to make sure the complexity is itself
      the meaning.
    expected_abstract: |-
      The key to a controlled long sentence is maintaining a clear grammatical spine while managing
      the reader's cognitive load at each addition. Start with a strong, clear main clause —
      subject, verb, object — that can carry the sentence even if the reader loses track of the
      subordinate material. This is the load-bearing structure everything else hangs from. Then
      think carefully about the order of information. Front-load the most important information or
      frame the sentence's logic early, so the reader has a mental file folder to put subsequent
      clauses into. Clauses that arrive before the reader has context feel like obstacles; clauses
      that arrive after a clear frame feel like elaboration. Use parallel structure wherever
      possible to reduce the mental effort of each additional clause — once the reader recognizes a
      pattern, they can process the next element faster. Punctuation is your pacing tool: commas
      move quickly, dashes signal a shift or digression, semicolons signal roughly equal weight
      between elements. Reading the sentence aloud is the most reliable test — if you find yourself
      gasping for breath or losing the thread, the reader will too.
- id: exemplar_reasoning_217
  paraphrases:
  - |-
    I'm a pianist working on a Beethoven sonata and I keep being told my playing is 'technically clean but emotionally cold.' I practice slowly and carefully to get the notes right, then speed it up. What am I missing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: test
    expected_exemplar: |-
      Your practice method — perfect the mechanics, then add expression — is actually working
      against you, and the contrast between two legendary Beethoven interpreters helps explain why.
      Glenn Gould approached Beethoven almost architecturally: he believed emotional content was
      inseparable from the structural logic of the music, so he would dissect the counterpoint and
      voice-leading, letting the intellectual clarity *be* the emotional statement. For Gould,
      'cold' playing was impossible if you truly understood what each voice was doing. Wilhelm
      Kempff, by contrast, worked from an improvisatory, singing instinct — he said the piano had to
      breathe like a human voice, and he practiced by finding the natural phrase arches and
      rhetorical pauses first, then ensuring the fingers could follow. Both would agree that your
      problem is sequencing: you're treating expression as a layer you apply on top of correct
      notes, when it should be baked into the earliest slow practice. Try Kempff's approach —
      identify the singing line and where it 'wants' to go before you've even polished the
      technique. Then use Gould's lens to check that your phrasing actually reflects the harmonic
      logic. The warmth comes from having something to say with every note, not from turning up the
      emotion dial at the end.
    expected_abstract: |-
      The issue is likely that you're treating technical accuracy and musical expression as separate
      phases, but in practice they need to develop together. When you practice slowly just for
      correct notes, your muscle memory encodes a kind of neutral, mechanical rendition — and
      speeding it up just makes that faster, not more expressive. Instead, decide on the character
      and phrasing of a passage before you practice it at all: where is the melodic peak? Where does
      the phrase breathe? What's the harmonic tension doing? Practice slowly while actively shaping
      those things — varying touch, timing, and dynamics even at a snail's pace. Also pay attention
      to voicing: in Beethoven especially, the melody often needs to sing above a texture that's
      rhythmically active, which requires consciously suppressing the inner voices. The goal is that
      every hour of slow practice should sound musical, not just accurate.
- id: exemplar_reasoning_218
  paraphrases:
  - |-
    I'm reviewing a pull request and the code is very terse — short variable names, chained method calls, minimal comments, logic compressed into single expressions. It's not unreadable, but it's on the edge. How do I think about whether this is acceptable style or a problem?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: test
    expected_exemplar: |-
      This is essentially the tension between what you might call the APL/Iverson aesthetic and the
      Knuth literate programming aesthetic, and it's one of the oldest arguments in programming
      culture. Ken Iverson — and later the J and K language communities — held that terseness is a
      virtue: a dense expression is a *complete* thought, and learning to read it is part of
      mastering the domain. Rich Hickey has articulated a similar philosophy in the Clojure world:
      he distinguishes 'simple' (few interleaved concepts) from 'easy' (familiar), and argues that
      concise, compositional code is genuinely simpler even if it's not immediately easy. On the
      other side, Knuth's literate programming tradition holds that code is written for human
      readers first and the machine second — variable names should be explanatory, steps should be
      visible, and the narrative should be followable by someone who doesn't already know the
      answer. What you're describing sounds like it has a strong functional/Haskell community feel —
      point-free style, chained transforms, the aesthetic of expressing a pipeline rather than a
      procedure. The key diagnostic question: is the terseness *removing noise* (which is the
      Hickey/Iverson defense) or *hiding decisions* (which is Knuth's concern)? If you can
      reconstruct why each step exists from the expression itself, it's probably fine. If you need
      to run it or add print statements to understand what a chain is doing, that's a code review
      flag regardless of style preferences. Teams also often benefit from making this explicit — the
      Google style guides and the Python PEP 8 philosophy both land on 'readable by a competent
      peer' as the bar, which usually means erring toward clarity in shared codebases.
    expected_abstract: |-
      The key question is whether the code is *incidentally* terse or *deliberately* obscure. Terse
      code isn't inherently a problem — unnecessary verbosity creates its own noise and can obscure
      structure. The useful test is whether a competent peer on your team could read this code in
      six months and understand not just what it does but why it does it that way. Short variable
      names are fine in short scopes (loop indices, lambda parameters) but problematic when the
      variable travels far from its definition. Chained method calls are readable if each step in
      the chain is obvious, but become a debugging problem when you can't easily inspect
      intermediate states. Expressions compressed into a single line are fine if the expression
      represents a single logical operation, but a code smell if multiple distinct decisions are
      merged. The practical test: can you write a meaningful name for each intermediate value? If
      every intermediate is nameable and that name would add information, the compression is hiding
      something. In a code review, I'd ask the author to walk through the densest expressions out
      loud — if they can do it fluently, the code is probably fine; if they have to slow down and
      reconstruct their own logic, that's a signal to add clarity.
- id: exemplar_reasoning_219
  paraphrases:
  - |-
    My opponent just played a very provocative opening setup — lots of pawn advances on the kingside while their king is still uncastled. Should I immediately try to punish it with an attack or just develop normally and wait?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: test
    expected_exemplar: |-
      This is exactly the situation where thinking about two contrasting grandmaster temperaments is
      useful: Mikhail Botvinnik versus Mikhail Tal. Botvinnik's instinct would be to develop
      normally, complete your own mobilization, and only strike when the timing is objectively
      correct — he believed in preparation over improvisation, and he'd be suspicious of the
      'obvious' reaction, knowing it might walk into a prepared trap. His approach: finish
      development, ensure your king is safe, then assess whether the punishment is real or illusory.
      Tal, obviously, would attack immediately and recklessly, but here's the insight — Tal's
      aggression worked because he understood *initiative* as a concrete asset, not just a feeling.
      The real question is whether your opponent's setup is genuinely weakening or whether it's a
      provocation designed to lure you into premature aggression. Kasparov, who synthesized both,
      would tell you to look for the concrete forcing line: if there's a clear sequence that wins
      material or mates, play it now; if it's just 'looks bad,' develop and wait. In practice,
      provocative pawn advances that leave the king in the center are often punished best not by
      attacking the king directly but by opening the center — a very classical Fischer and Karpov
      principle — which exposes the king to multiple pieces rather than a single wing assault.
    expected_abstract: |-
      Provocative pawn advances by your opponent require you to assess whether the punishment is
      immediate or positional. If their king is genuinely unsafe, you should look for forcing moves
      — open files toward their king, create threats that require specific defensive responses, and
      try to make them pay concretely before they can consolidate. If, however, the pawn advances
      are just slightly premature rather than truly weakening, the better approach is often to
      develop normally, castle, and then exploit the positional weakness later when you have more
      pieces coordinated. Reacting immediately to provocation is only correct when there's a
      concrete line that wins material or creates a mating attack; otherwise you risk overextending
      yourself in the attempt.
- id: exemplar_reasoning_220
  paraphrases:
  - |-
    I have a geometry problem where I need to show that four specific points are concyclic. I've verified it numerically but I'm struggling to find a clean proof. What approaches are worth trying?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: test
    expected_exemplar: |-
      Concyclicity problems have a very classical synthetic feel — this is the kind of thing
      Ptolemy, Pascal, and later the projective geometers really sharpened their tools on, and their
      fingerprints are worth looking for before you reach for coordinates. The first thing I'd ask
      is whether your four points arise from a configuration where radical axes or power of a point
      might be natural. This is essentially the Monge–radical axis tradition: if you have multiple
      circles floating around, the radical center or radical axis argument often makes concyclicity
      pop out as a consequence of the circle pencil structure, and it has a very Coxeter-esque
      elegance — clean, projective, basis-free. If the points come from a triangle with special
      cevians or feet of altitudes, this has a strong nine-point-circle feel (Euler, Feuerbach). The
      nine-point circle proof is a master template: identify which known circle your four points
      should lie on and verify membership by angle or distance. For angle chasing, the Miquel point
      theorem is the right template — concyclicity in configurations with transversals almost always
      resolves via directed angle arithmetic (mod 180°). This is the approach olympiad geometry has
      canonized, and working in directed angles avoids case distinctions that plague the classical
      approach. Finally, if the configuration has any projective character (cross-ratios, harmonic
      ranges), the criterion that four points are concyclic iff their cross-ratio is real is the
      Möbius/projective approach, and it can be decisive when everything else is messy.
    expected_abstract: |-
      There are several standard approaches to proving four points are concyclic. The most direct is
      to show that opposite angles in the quadrilateral they form sum to 180°, using the inscribed
      angle theorem. Alternatively, you can show that all four points are equidistant from a common
      center — useful if you can identify the center geometrically. The power of a point approach
      works well if you have intersecting lines: if two chords of a prospective circle intersect,
      the products of their segments being equal certifies concyclicity. In coordinates, you can set
      up the general circle equation and show all four points satisfy it, though this can be
      computationally heavy. For configurations involving triangles, checking whether the points
      satisfy the condition for a known special circle (circumcircle, nine-point circle) can
      shortcut the argument. Directed angle chasing (working mod 180°) is especially clean for
      competition-style configurations and avoids case distinctions about arc orientation.
- id: exemplar_reasoning_221
  paraphrases:
  - |-
    I'm building a theoretical model of how social networks spread information, but I keep adding parameters to fit the data better and I'm not sure when to stop. What's the right approach to model complexity in science?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: named_practitioner
    specificity: direct
    split: test
    expected_exemplar: |-
      You've landed on one of the deepest tensions in theoretical science, and several great
      scientists have thought about it very differently — understanding those differences is
      actually useful here. The starting point most people know is Occam's Razor in its scientific
      form, but the person who turned it into a precise methodological tool is probably George Box.
      His aphorism — 'all models are wrong, but some are useful' — is actually a guide to your exact
      problem. Box wasn't saying complexity is bad; he was saying the question is never 'does my
      model fit the data?' (a complex enough model always can) but 'does my model reveal something
      real about the mechanism?' Adding parameters improves fit by construction; it doesn't
      necessarily improve understanding. The strongest formal framework for your question comes from
      work in the tradition of Akaike and Schwarz, whose information criteria (AIC and BIC) were
      explicitly designed to penalize model complexity. But the deeper philosophical position
      belongs to Karl Popper again: every parameter you add represents a degree of freedom that
      makes your model harder to falsify. A model with many tunable parameters can 'predict' almost
      any pattern after the fact, which means it's predicting very little. Paul Meehl spent decades
      arguing that the social sciences in particular suffered from this — he called it the 'crud
      factor,' where adding predictors always explains more variance, but this obscures rather than
      reveals causal structure. For your network diffusion model specifically, I'd look to how
      physicists like Duncan Watts approached similar problems — he deliberately kept his
      small-world network model to the simplest possible structure (just two parameters: path length
      and clustering) and accepted that it wouldn't fit every empirical detail. The power came from
      the parsimony: it was simple enough that the mechanism was transparent. The question to ask
      yourself is whether each new parameter corresponds to a real mechanism you can independently
      justify, or whether it's just a knob you're turning to chase data.
    expected_abstract: |-
      This is the problem of overfitting versus underfitting, and it's fundamental to all
      model-building in science. Here's how to think about it: **The core tension:** Every parameter
      you add improves in-sample fit. But a model with enough parameters can fit random noise
      perfectly while predicting nothing about new data. The goal is to model the signal, not the
      noise. **Formal model selection criteria:** Use information criteria like AIC (Akaike
      Information Criterion) or BIC (Bayesian Information Criterion). These metrics reward fit while
      penalizing complexity — BIC applies a heavier penalty and tends to favor simpler models.
      Cross-validation is another rigorous approach: hold out a portion of your data, fit models of
      varying complexity on the rest, and see which generalizes best. **The mechanistic test:** For
      each parameter you're considering adding, ask: does this correspond to a real mechanism I can
      independently justify? Parameters should represent something — a behavioral tendency, a
      structural feature of the network — not just mathematical flexibility. If you can't explain
      why a parameter should exist, it probably shouldn't. **Predictive validity:** Test your model
      on out-of-sample data — a different time period, a different network, a different population.
      A model that fits your training data but fails on new data is overfit regardless of what the
      information criteria say. **Accept imperfect fit:** A simpler model that captures the main
      dynamics and generalizes well is more scientifically valuable than a complex model that fits
      your particular dataset. Precision in prediction is less important than transparency about
      mechanism.
- id: exemplar_reasoning_222
  paraphrases:
  - |-
    I'm trying to decide whether to publish a preliminary finding now or wait until I have much stronger statistical evidence. The effect is real and interesting but my sample size is small. What's the right call?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: test
    expected_exemplar: |-
      This is essentially the tension between a Fisherian and a Neyman-Pearson sensibility, and it's
      worth knowing which camp you're actually in. Fisher himself was skeptical of rigid thresholds
      — he saw p-values as continuous measures of evidence against the null, meant to be updated as
      more data arrived. Publishing a small-sample preliminary finding with honest uncertainty would
      have felt natural to him: science as ongoing induction. Neyman and Pearson, by contrast, built
      their framework around decision-making under repeated sampling — the idea that you commit to a
      threshold before looking, and that a single study either clears the bar or doesn't. Under that
      logic, publishing now just pollutes the literature with a low-powered result. More recently,
      figures like Andrew Gelman have pushed hard against 'p-hacking and garden of forking paths'
      problems, arguing that small noisy studies tend to produce overestimates of effect sizes even
      when honest, because only the exciting results get written up. His instinct would be to wait,
      get a bigger sample, or pre-register the study and publish the full result. On the other side,
      the open-science tradition associated with people like Brian Nosek would say: publish it now
      as a registered report or preprint with explicit uncertainty, so it enters the cumulative
      record regardless of outcome. The 'right' call depends heavily on which of these you find more
      compelling — Fisherian iterative inference vs. Neyman-Pearson decision gates vs. Gelman's
      concern about noise inflation vs. Nosek's bias-correction through transparency.
    expected_abstract: |-
      This is a genuine trade-off between contributing to the literature early and ensuring your
      contribution is robust. Publishing now gets the finding into the conversation and allows
      others to build on it or attempt replication, but a small sample means your effect size
      estimate is likely noisy and may not replicate — which can actually slow the field down if
      others invest in a false lead. Waiting gives you more statistical power, tighter confidence
      intervals, and a finding that's more likely to hold up. A reasonable middle path is to submit
      a preprint now with explicit caveats about sample size and effect size uncertainty, then
      continue collecting data and publish the full study in a peer-reviewed venue once you have
      adequate power. Pre-registering your hypothesis and analysis plan before collecting more data
      also protects you against the temptation to adjust your analysis once you see the larger
      dataset.
- id: exemplar_reasoning_223
  paraphrases:
  - |-
    I'm building a system that needs to handle a lot of concurrent tasks — things like processing uploads, sending emails, updating caches. Should I use threads, async/await, or a message queue? How do experts think about this choice?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: named_practitioner
    specificity: direct
    split: test
    expected_exemplar: |-
      This is exactly the kind of problem where it helps to think about how different programming
      traditions frame concurrency, because they lead to genuinely different architectures. Joe
      Armstrong, the co-creator of Erlang, would look at your list — uploads, emails, cache updates
      — and immediately reach for the actor model. His insight, articulated in *Programming Erlang*,
      is that these are naturally independent processes that should fail and recover independently.
      Erlang's 'let it crash' philosophy means each task is an isolated process with its own
      mailbox; if email sending fails, it doesn't corrupt your upload handler. This maps onto modern
      tools like Elixir or even Akka on the JVM. Contrast that with the async/await tradition
      popularized in Python, JavaScript, and C# — figures like Guido van Rossum (who had real
      reservations about async Python's complexity) would point out that async is ideal when tasks
      are I/O-bound and you want to avoid thread overhead, but it infects your entire codebase with
      the 'colored function' problem that Bob Nystrom described memorably. For your use case
      specifically, the distributed systems tradition — associated with engineers at companies like
      Shopify or the design philosophy behind Sidekiq (created by Mike Perham) — would argue that a
      persistent message queue is the most robust choice for exactly this mix of tasks: it survives
      process crashes, gives you retry logic, and decouples producers from consumers without the
      complexity of managing thread pools or async runtimes yourself.
    expected_abstract: |-
      The right choice depends on the nature of your tasks and your reliability requirements.
      Threads work well for CPU-bound parallel work but have overhead and require careful
      synchronization to avoid race conditions. Async/await is efficient for I/O-bound tasks — like
      network calls and file operations — because it multiplexes many concurrent operations on fewer
      threads, but it requires your entire call stack to be async-aware, which can be invasive. A
      message queue is the most robust option for the tasks you describe: it persists jobs across
      process restarts, provides built-in retry and error handling, decouples task submission from
      execution, and scales workers independently. For one-off or low-volume tasks, async/await may
      be simpler to start with. But for production systems where reliability matters — especially
      for things like emails where you need guaranteed delivery — a message queue with a worker
      process is generally the right architecture. Popular choices include Redis-backed queues (like
      Sidekiq or Bull), RabbitMQ, or cloud-native options like SQS.
- id: exemplar_reasoning_224
  paraphrases:
  - |-
    I'm planning a tasting menu for a dinner party and I'm torn between doing a progression of small courses that each highlight a single ingredient perfectly, or doing dishes that layer lots of flavors together and tell a more complex story. Which approach makes for a better experience?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: test
    expected_exemplar: |-
      You're weighing two very different philosophies of what fine dining is for, and both have
      serious pedigree. The single-ingredient purity approach is essentially the Japanese kaiseki
      tradition as filtered through French nouvelle cuisine — Michel Bras and the generation he
      influenced, and in a different register Seiji Yamamoto and traditional kaiseki, believe that
      the role of the cook is to clarify and present an ingredient at its peak, removing noise
      rather than adding it. A single perfectly sourced, perfectly cooked cep mushroom on a plate is
      a statement of philosophy. The counterposition is the El Bulli / Ferran Adrià school, but even
      before that, the Escoffier tradition of sauce-making: the belief that cooking is
      transformation and combination, that the cook's intelligence is expressed through how flavors
      are composed into something that couldn't exist in nature. Heston Blumenthal pushed this
      further by designing dishes as experiences with narrative arcs. For a dinner party among
      non-professionals, the single-ingredient approach is actually harder to pull off and riskier —
      it exposes every sourcing and technique flaw. The layered, complex approach is more forgiving
      and often more fun to eat. But if your sourcing is exceptional, purity is more elegant.
    expected_abstract: |-
      Both approaches can produce excellent tasting menus — the choice really depends on your
      cooking strengths, your ingredients, and your guests. Single-ingredient focus is high-risk,
      high-reward: it demands exceptional sourcing and flawless technique, but when it works, it's
      memorable in a quiet, meditative way. Guests really register what a perfect thing tastes like.
      Layered, complex dishes allow more creativity and are more forgiving technically — you can
      balance and adjust flavors more easily — and they tend to generate more conversation. They
      also let you tell a more explicit narrative across the meal. A common middle ground is to vary
      the approach within the menu itself: open with something pure and seasonal to establish palate
      focus, then build toward more complex compositions in the middle courses, and return to
      something simple and clean at the end. That rhythm tends to feel intentional rather than
      monotonous.
- id: exemplar_reasoning_225
  paraphrases:
  - |-
    I'm trying to prove a result about the distribution of prime gaps, and I'm wondering whether an analytic approach through the zeta function or a more elementary sieve-based argument would be more fruitful. How would you think about making this choice?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: test
    expected_exemplar: |-
      The analytic vs. elementary tension here has a rich history that's actually quite useful for
      navigating your choice. The analytic approach — going through the zeta function, zero-free
      regions, explicit formulas — is essentially the Hadamard–de la Vallée-Poussin tradition, and
      its strength is that it trades the primes for complex zeros, giving you access to
      Fourier-analytic tools. If your result is about average or global behavior of prime gaps, this
      is often the right register: Cramér's probabilistic model for gaps lives here, and the
      connection between gap statistics and GUE eigenvalue spacings (the Montgomery–Odlyzko line of
      work) is purely analytic. The sieve tradition — Brun, then Selberg, then the more flexible
      Diamond–Halberstam–Richert framework, and now the GPY/Maynard machinery for small gaps — is
      better suited when you want *explicit* or *constructive* results about specific gap sizes, or
      when you need to handle problems where the zeta function gives you no traction (like bounded
      gaps, where the Riemann Hypothesis alone isn't enough). Maynard's proof of bounded prime gaps
      is a masterpiece of the sieve style: it avoids the analytic machinery almost entirely and wins
      through combinatorial optimization of sieve weights. A rough heuristic: if your result would
      follow from GRH plus some standard analytic apparatus, the analytic approach will probably
      work and be cleaner. If GRH is not enough and you need actual constructions or density results
      in short intervals, reach for sieves.
    expected_abstract: |-
      The choice between analytic and elementary sieve approaches generally comes down to what
      structure your result exploits. Analytic methods — working through the zeta function, the
      explicit formula, and zero-free regions — are powerful when your question is about global or
      average behavior, because they convert prime distribution into a problem about the location of
      complex zeros. They also give asymptotic precision. Sieve methods are better when you want
      results about specific configurations of primes (gaps of a particular size, primes in
      arithmetic progressions with explicit bounds, etc.) or when you need results that don't depend
      on unproven hypotheses like GRH. Practically, if a conditional result under GRH would satisfy
      you, the analytic route is often cleaner. If you need unconditional results about local gap
      structure, sieves — and especially modern weighted sieves — are more likely to reach a
      conclusion.
- id: exemplar_reasoning_226
  paraphrases:
  - |-
    I'm renovating a 1920s craftsman bungalow and want to add a small extension for a home office. The extension needs to be clearly contemporary — the owners don't want a fake historical pastiche — but it also can't feel like it's fighting the original house. Is there a design approach that threads this needle?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: test
    expected_exemplar: |-
      This is exactly the problem that separates thoughtful contemporary additions from bad ones,
      and there are two distinct schools of thought worth considering. Carlo Scarpa's approach —
      best seen in his Castelvecchio Museum renovation in Verona — treats the dialogue between old
      and new as the subject of the architecture itself. New elements are clearly, even
      emphatically, contemporary: different materials, different joinery, different geometry, but
      they're in constant conversation with the old fabric through alignment, datum lines, and
      careful insertion points. The seam is celebrated rather than hidden. For your bungalow, this
      might mean a crisp flat-roofed box addition in board-formed concrete or weathered steel that
      picks up the horizontal datum of the original eaves or window headers — clearly new, but
      grammatically related. The other school, closer to what someone like Glenn Murcutt does in his
      Australian residential work, is to make the addition a light, almost provisional structure
      that defers to the original: a shed-like pavilion in corrugated metal or timber, connected by
      a glazed link so the original house reads as the primary object. The new piece is
      unambiguously modern but self-effacing in massing. The Scarpa approach is richer and more
      architectural but harder to execute — every detail matters. The Murcutt approach is cleaner
      and more forgiving: the glass link is doing the conceptual work of separating old from new,
      and the addition doesn't have to negotiate with the original at every point. For a craftsman
      bungalow specifically, the Murcutt move tends to work well because the original house has
      strong character worth preserving as a primary read.
    expected_abstract: |-
      The key principle is honest differentiation: new work should be legible as new without being
      aggressive or arbitrary about it. This is different from both pastiche (copying historical
      details) and contrast-for-its-own-sake (being loud and modern just to prove a point). A few
      strategies tend to work well together. First, respond to the geometry and scale of the
      original without mimicking its ornament — pick up the ridge height, eave line, or window
      module as a reference, then interpret it in contemporary materials. A flat or shed roof on the
      addition can echo the horizontal emphasis of a craftsman without pretending to be a craftsman.
      Second, consider a glazed connector between old and new: even a narrow passage of glass
      physically and conceptually separates the two volumes, so each reads as itself and neither is
      compromised. Third, choose materials that are contemporary in character but sympathetic in
      tone — weathered wood, dark steel, or fiber cement can read as new while not clashing with the
      warm palette of a craftsman. The addition should feel like it belongs to the same family of
      buildings, not the same period. Avoid trying to match the original's color, texture, and
      detail simultaneously — that's where pastiche starts. Pick one or two points of response and
      let the rest be honestly different.
- id: exemplar_reasoning_227
  paraphrases:
  - |-
    My research team keeps generating interesting anomalous results that don't fit our main theory, but our PI wants us to focus on confirming the core model. How should we decide whether to chase the anomalies or stay the course?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: test
    expected_exemplar: |-
      This is one of the central tensions in how scientific programs actually develop, and the two
      most illuminating frameworks for thinking about it come from very different directions. Thomas
      Kuhn would recognize your situation immediately: anomalies are normal and expected within any
      research program, and in his view most scientists are right to set them aside during 'normal
      science.' Puzzle-solving within the paradigm is how science makes cumulative progress —
      anomaly-chasing too early can fragment your research program before the core model has been
      given a fair chance. He'd counsel staying the course unless the anomalies accumulate to a
      point of crisis. Imre Lakatos, who was partly responding to Kuhn, offered a more actionable
      framework. He distinguished a 'hard core' of theoretical commitments (which you protect) from
      a 'protective belt' of auxiliary hypotheses (which you adjust). In his terms, your PI is
      defending the hard core, which is legitimate — but Lakatos also gave you a criterion for when
      to switch: a research program is 'degenerative' if it only ever explains anomalies after the
      fact through ad hoc patches, versus 'progressive' if it generates novel predictions that pan
      out. The question to ask your team is: are these anomalies forcing you into increasingly
      baroque auxiliary hypotheses? Or are they pointing toward a modification that would actually
      predict new things? If it's the latter, Lakatos would say the anomalies are scientifically
      precious. A very different instinct comes from scientists like Barbara McClintock or Fred
      Hoyle — figures who were famously willing to follow anomalies against the grain of established
      programs, sometimes prematurely, sometimes in ways that eventually vindicated them. The
      practical upshot: keep a systematic log of your anomalies, check whether they're clustered or
      random, and ask whether any single auxiliary hypothesis could explain all of them coherently.
      That's your test for whether they're noise or signal.
    expected_abstract: |-
      This is a real and recurring challenge in research management. Here's a framework for thinking
      through it: Anomalies fall into two rough categories — those that are likely measurement
      artifacts or random variation, and those that are systematic and replicable. The first step is
      to triage: are the anomalous results reproducible, and do they cluster in a way that suggests
      a coherent underlying phenomenon? If they're scattered and inconsistent, they may just be
      noise, and your PI's instinct to focus on the core model is sound. If they're systematic, you
      face a genuine strategic decision. Arguments for staying the course: your current model may
      need more development before you can meaningfully interpret anomalies; premature
      anomaly-chasing can fragment resources; and many anomalies eventually get explained by the
      core theory. Arguments for pursuing anomalies: in many scientific fields, the most important
      discoveries have come from taking anomalies seriously rather than explaining them away;
      ignoring systematic patterns risks missing major insights. A practical middle path: designate
      a fraction of team bandwidth for exploring the most statistically robust anomalies, document
      them carefully without yet committing to a theoretical interpretation, and set a clear
      threshold — if the same anomaly appears across N replications, it graduates from curiosity to
      priority. Having that explicit policy also makes the conversation with your PI more tractable,
      since you're proposing a structured protocol rather than open-ended anomaly-chasing.
- id: exemplar_reasoning_228
  paraphrases:
  - |-
    I have an endgame coming up in a tournament game—I'm going to have a bishop and knight vs a bishop on opposite color squares. The position is roughly equal materially. Should I be playing for a win or accepting a draw? What's the practical approach?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: test
    expected_exemplar: |-
      This exact type of endgame reveals a deep philosophical split between the classical and modern
      practical schools. Capablanca, the great classicist, would almost certainly steer toward a
      draw here—his school held that opposite-colored bishop endings are among the most drawish in
      chess, and that fighting against a materially equal position with inherent structural
      compensation for the defender wastes energy and invites mistakes. His approach was elegant
      economy: know when a draw is the right result and reach it cleanly. Contrast this with the
      Kasparov school of practical play, which would ask: what are the concrete features of this
      specific position? Kasparov and later Topalov showed repeatedly that opposite-bishop endings
      can be won if you have a passed pawn, a more active king, or zugzwang possibilities—even when
      they 'should' be drawn by theory. The Soviet practical tradition (Smyslov was a master of
      this) would tell you to probe the position for 20-30 moves even in 'equal' endings, looking
      for the one small concession that tips it. At a tournament level, the right answer depends on
      the stakes: if you need a win, fight using the Kasparov logic—target a concrete imbalance like
      king activity or a distant passed pawn. If a draw is fine, take the Capablanca path and trade
      down to the simplest fortress.
    expected_abstract: |-
      Opposite-colored bishop endings are generally among the most drawish in chess, so at roughly
      equal material, a draw is the statistically likely result. That said, you should assess a few
      concrete factors before accepting that conclusion. If you have a passed pawn, an active king,
      or can create a zugzwang threat, there may be winning chances worth fighting for. If your
      opponent has a fortress or can easily activate their king and bishop, the drawing tendency is
      strong and fighting for a win risks losing by overextending. Practically, in a tournament
      context, consider the standings: if you need a win, probe for 20-30 moves looking for a
      concrete edge; if a draw is acceptable or valuable, simplify toward a clear drawing structure.
      Don't resign yourself to a draw prematurely, but don't expend all your clock fighting a
      theoretical draw either.
- id: exemplar_reasoning_229
  paraphrases:
  - |-
    I'm making a beef stew and it tastes one-dimensional — rich and meaty but somehow flat. What are some ways to layer in more complexity?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: named_practitioner
    specificity: direct
    split: test
    expected_exemplar: |-
      This is a problem that Heston Blumenthal has written about extensively — his instinct is to
      interrogate what the dish is 'missing' at a chemical level, often reaching for umami
      amplifiers and controlled acidity. He'd likely suggest adding a small amount of Marmite or soy
      sauce during braising (both glutamate-rich, invisible in the final flavor but deepening the
      savory base), and then a splash of red wine vinegar stirred in right at the end to brighten
      without adding wine flavor. Thomas Keller's approach at The French Laundry is complementary
      but different: he's obsessive about aromatic layering in sequence, so he'd push you to make
      sure your mirepoix was properly caramelized before anything liquid entered the pot, and might
      add a bouquet garni refreshed halfway through cooking so the herbaceous notes don't go dull. A
      third lens is Marco Pierre White's philosophy — deceptively simple but precise — which would
      ask whether your stock itself carries the complexity, or whether you're asking the stew to
      build complexity from nothing. He'd insist the answer is a proper brown stock, reduced before
      it ever touches the beef. Put together: fix the stock, caramelize aggressively early, add
      glutamates mid-cook, and acid at the finish.
    expected_abstract: |-
      A one-dimensional stew usually lacks contrast in flavor registers. You can address this by
      building in umami depth (a small amount of tomato paste, soy sauce, or Worcestershire stirred
      in early), ensuring your aromatics were properly caramelized rather than just softened, adding
      a fresh herb component toward the end of cooking so it doesn't go flat, and finishing with a
      small amount of acid — red wine vinegar or a squeeze of lemon — right before serving to lift
      everything. Salt in stages rather than all at once also helps each layer stay distinct.
- id: exemplar_reasoning_230
  paraphrases:
  - |-
    I'm working on a combinatorics problem involving counting lattice paths with certain forbidden patterns. I keep hitting walls. Are there general frameworks or moves I should know about?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: school_tradition
    specificity: implicit
    split: test
    expected_exemplar: |-
      Lattice path problems with forbidden patterns are exactly the kind of thing where the
      bijective combinatorics tradition — the school associated with figures like Dominique Foata
      and later refined by people like Richard Stanley — shines. Their instinct is to never just
      count when you can construct an explicit bijection: find a structure-preserving map between
      your forbidden paths and some other easier-to-count object (like Dyck paths, or permutations
      with restricted descents). The kernel method is another weapon from this tradition: set up a
      generating function equation for your paths, treat it as a polynomial in an auxiliary
      variable, and solve by setting the kernel to zero — it's a slick algebraic move that the
      Belgian and Viennese schools (Flajolet, Prodinger) turned into an art form. Flajolet's
      analytic combinatorics framework more broadly would say: encode your forbidden patterns as a
      regular or context-free language, extract the generating function, and then do singularity
      analysis to get asymptotics. If your forbidden patterns have a linear structure, the transfer
      matrix method from statistical mechanics (the way Temperley or Lieb would approach it)
      converts the whole problem into an eigenvalue question.
    expected_abstract: |-
      There are several powerful frameworks for lattice path problems with forbidden patterns.
      Generating functions are usually the first tool: encode the number of valid paths of length n
      as coefficients, set up a recurrence based on the last step, and solve. The kernel method is
      especially useful when your generating function equation has two unknowns — you eliminate one
      by choosing the auxiliary variable to cancel the kernel. If your forbidden patterns define a
      regular language, the transfer matrix method applies: build a matrix encoding allowed
      transitions between states and raise it to the nth power to count paths of length n. Bijective
      arguments can simplify things considerably — if you can find a bijection between your
      forbidden paths and a better-understood combinatorial object, you inherit that object's
      counting formula. The cycle lemma and reflection principle are classical bijective tools for
      path problems involving barriers. For asymptotics, singularity analysis of the generating
      function (finding the dominant singularity and its type) gives the exponential and polynomial
      growth rates.
- id: exemplar_reasoning_231
  paraphrases:
  - |-
    I'm designing a public library in a mid-sized city. The client wants it to feel welcoming and human-scale but also monumental and civic. How do I reconcile those two things without one undermining the other?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: test
    expected_exemplar: |-
      This tension between the civic and the intimate is one of the defining problems in public
      architecture, and a few architects have resolved it in ways worth studying closely. Louis Kahn
      is perhaps the master of this exact challenge — his Exeter Library is the canonical example.
      Kahn's move was to make the monumental gesture at the center (the great concrete oculus frames
      you see the building from the inside out) while nesting deeply human reading alcoves at the
      perimeter where you're tucked against a window. The monumentality is structural and spatial,
      not decorative, so it doesn't crush the human scale — it gives it a backdrop. You feel small
      against the central hall and then cozy in the carrel. The scale shift itself becomes the
      architectural experience. Alvar Aalto took a different route, one that might suit a mid-sized
      civic context even better. His approach was to break the monumental volume into a family of
      forms — a fan-shaped reading room, a lower children's wing, stepped terraces — so the building
      presents differently at different distances. From across the street it reads as a significant
      civic institution; from the entrance it's a sequence of domestic-scaled rooms. His Viipuri
      Library and Rovaniemi Library both do this: the skylight ceiling in Viipuri is monumental
      engineering but the undulating wood ceiling softens it acoustically and visually. A third
      model is Snøhetta's approach, visible in the Deichman Oslo library — they use transparency and
      public interior streets to make the civic scale legible while keeping individual zones
      intimate. The building is big and confident from outside but inside it reads as a collection
      of neighborhoods. The practical synthesis: locate your grandeur in the section (ceiling
      heights, light, structural expression) rather than in an intimidating facade, and use that
      section to carve out human-scaled pockets. Kahn's lesson is that these two qualities reinforce
      rather than fight each other when the monumental move *creates* the intimate condition.
    expected_abstract: |-
      This is a classic design tension and it's entirely solvable — the key is to operate at
      multiple scales simultaneously rather than trying to find a single middle ground. For the
      civic monumentality, work with the section and the approach sequence. A building reads as
      significant from the street through massing, proportion, and material weight — a bold
      roofline, strong entry threshold, or expressive structural system can signal importance
      without requiring an intimidating scale at the human level. Reserve your grandest spatial
      gesture for the interior: a tall central hall, dramatic natural light, or a visible structural
      element communicates civic ambition once you're inside. For human scale, break the program
      into legible zones — reading rooms, study carrels, children's area, community spaces — each
      with its own ceiling height, lighting quality, and materiality. Furniture scale matters
      enormously: low shelving, varied seating, alcoves, and nooks bring the body back into
      proportion with the space even in a large room. The reconciliation happens through transition.
      Design the entry sequence so visitors move from the civic scale at the threshold through a
      gradual compression toward the intimate zones. Light is your primary tool here — high
      clerestory light in public circulation, warm directed light in reading areas. The contrast
      between the two experiences makes both feel more intense rather than diluting either.
      Materials can do double duty: a heavy concrete or stone structural frame reads as monumental,
      while wood, acoustic panels, and soft furnishings within that frame make individual zones feel
      warm and inviting.
- id: exemplar_reasoning_232
  paraphrases:
  - |-
    I want to write a command-line tool in Python. Looking at tools I admire, some feel very 'clean and minimal' while others are 'batteries-included' with lots of flags and modes. What distinguishes these two aesthetics, and which codebases should I look at to understand each style at its best?
  samples_per_paraphrase: 3
