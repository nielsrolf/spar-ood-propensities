    expected_exemplar: |-
      Joan Didion is the canonical model here — 'The Year of Magical Thinking' works precisely
      because she approaches grief with almost clinical observation rather than emotional pleading.
      She trusts that the bizarre, specific cognitive distortions of grief (she can't give away her
      husband's shoes because he'll need them when he returns) are more affecting than any direct
      statement of loss. The reader feels the grief through the strangeness of the thinking, not
      through declarations. James Baldwin takes a related approach in his essays: he deflects
      personal pain outward, connecting the intimate to the historical or the political, which
      paradoxically makes the personal moments more devastating when they land. Meghan Daum, in 'The
      Unspeakable,' is more explicitly interested in ambivalence — she insists on writing about
      grief mixed with relief, with complicated feelings, which is the opposite of sentimentality.
      The sentimental essay says 'this person was wonderful and I miss them.' The Daum approach says
      'here is the true texture of what I actually felt, including the parts I'm not supposed to
      feel.' For your essay: pick one concrete, strange, specific detail about your father —
      something that doesn't obviously symbolize love — and build from there. Resist the summarizing
      sentence.
    expected_abstract: |-
      The best defense against sentimentality in personal essays is specificity and restraint.
      Sentimentality typically comes from telling the reader how to feel rather than showing the
      precise sensory and narrative details that produce feeling organically. Instead of writing 'I
      missed him terribly,' put the reader in a specific scene — a particular object, a gesture, a
      moment of incongruity — and let the emotion arise from the situation rather than from your
      commentary on it. Ambivalence is also your friend: grief is rarely pure, and admitting the
      complicated or even unflattering truths about your relationship tends to read as honest rather
      than self-indulgent. Structurally, it helps to anchor the essay in a question or problem
      you're actively working through rather than a settled conclusion — essays that perform
      certainty about loss tend to feel more sentimental than ones that remain genuinely
      exploratory.
- id: exemplar_reasoning_163
  paraphrases:
  - |-
    I'm working on a small chapel or meditation space — non-denominational — for a university campus. The budget is very tight and the materials will be humble. How do I create a genuinely sacred or contemplative atmosphere without relying on expensive finishes or ornament?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: train
    expected_exemplar: |-
      This is precisely the problem that produced some of the twentieth century's most profound
      religious architecture, and the constraint of humble materials is actually a gift — it forces
      you toward the only tools that are free: light, silence, proportion, and threshold. Tadao
      Ando's Church of the Light in Osaka is the obvious reference point and worth studying
      obsessively for your purpose. The entire building is board-formed concrete — as cheap and
      rough a material as you can specify — and the transcendent effect comes entirely from a
      cross-shaped slot cut in the east wall that rakes morning light across the altar. The pews are
      reclaimed floor boards. Nothing is expensive. Everything is intentional. The lesson: one
      precise, controlled aperture does more than diffuse general illumination. The light is
      *directional* and *temporal* — it changes through the day and through the year, and that
      changefulness is what makes the space feel alive and sacred. Peter Zumthor's Bruder Klaus
      Field Chapel took this further — it's literally formed by burning a log structure inside a
      rammed concrete shell, leaving a charred interior and a single oculus open to the sky. Rain
      falls in. The roughness is the point. Zumthor's concept of *Stimmung* (atmosphere or mood) is
      directly applicable to your project: he argues that atmosphere is produced by specific
      material phenomena — sound, temperature, the smell of materials, the quality of light — not by
      surface decoration. Concrete that you can touch and feel the formwork in, wood that shows its
      grain, stone that is cold — these are richer than smooth expensive finishes precisely because
      they engage more senses. For a non-denominational university context, you might look at Sigurd
      Lewerentz, whose Markus Chapel achieves an almost overwhelming atmosphere through the most
      primitive means: rough brick laid without cut pieces (every joint and overlap is mortar), a
      dark interior, and pools of light from unexpected apertures. The darkness itself is the first
      move toward contemplation. Practical synthesis for your budget: make the entry threshold a
      compression — low ceiling, dim — before releasing into a taller, lighter interior. Control a
      single aperture for raking directional light onto the focal wall. Use one material throughout
      and detail it honestly. Sound matters: absorptive wall treatment and a slightly reverberant
      floor will change how quiet feels. And orient the building so the main light source tells time
      — morning or evening light at the focal point makes the space feel connected to something
      larger than the room.
    expected_abstract: |-
      Creating a genuinely contemplative atmosphere on a tight budget is absolutely achievable — the
      most powerful tools in sacred architecture cost nothing extra and often require *restraint*
      rather than addition. **Light is your primary material.** Diffuse general lighting produces no
      atmosphere at all. Instead, control a single directional light source — a narrow window, a
      skylight, or a slot aperture — so that light falls precisely on the focal point of the room
      and changes slowly through the day. The movement of light through a space creates a sense of
      time passing and connects the interior to something beyond it. **Threshold and compression.**
      The transition from outside to inside is critical. A low entry ceiling that compresses before
      releasing into the full height of the main space creates a physiological shift — your body
      registers that you've entered a different kind of place. Even a covered porch or a turn in the
      entry sequence accomplishes this. **Proportion and silence.** Taller than wide rooms feel more
      aspirational. A ceiling height of 1.5–2x the room width reads as elevated without requiring
      any ornament. For sound, avoid hard parallel walls that produce flutter echo; a slight
      irregularity in plan or a single absorptive surface settles the acoustics into something that
      feels quiet rather than dead. **Material honesty.** Exposed concrete, raw wood, or unfinished
      masonry can be more powerful than painted drywall precisely because they have texture, thermal
      mass, and sensory presence. The smell and touch of honest materials is itself contemplative.
      **Remove rather than add.** Eliminate everything that doesn't contribute to the atmosphere —
      no applied ornament, no competing light sources, no visual clutter. Sacred atmosphere is more
      often the result of editing than of addition.
- id: exemplar_reasoning_164
  paraphrases:
  - |-
    I'm designing an experiment to test whether a new drug reduces inflammation, but I'm worried about confounding variables. What's the best approach to make sure my results are actually meaningful?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: stylistic_attribution
    specificity: direct
    split: train
    expected_exemplar: |-
      This kind of problem has a very Ronald Fisher feel to it — the worry about confounds is
      exactly what drove Fisher to develop randomized controlled trials and factorial design in the
      1920s and 30s. His instinct was that the cleanest way to neutralize confounders isn't to
      enumerate and control them one by one (which is endless), but to randomize assignment so that
      unknown confounders distribute themselves evenly across groups by chance. That's the core RCT
      logic. But you might also layer in a Bradford Hill sensibility here: Hill, who established the
      causal criteria for smoking and lung cancer, would push you to think not just about internal
      validity (is the effect real?) but about the biological plausibility and dose-response
      relationship — does higher dosage produce stronger effects? That pattern of evidence makes the
      causal story much more convincing. A more Popperian experimenter would also insist you
      pre-register your primary endpoint before collecting data, so you're not unconsciously mining
      results after the fact. The combination — randomization à la Fisher, mechanistic triangulation
      à la Hill, pre-registration as a Popperian safeguard — is about as airtight as experimental
      design gets.
    expected_abstract: |-
      To ensure your results are meaningful, the gold standard is a randomized controlled trial:
      randomly assign subjects to treatment and control groups so that confounding variables, both
      known and unknown, distribute evenly across conditions. Use blinding (ideally double-blind) so
      neither participants nor assessors know who received the drug, which eliminates measurement
      bias. Pre-register your primary outcome metric before data collection to prevent post-hoc
      outcome switching. Include a large enough sample to achieve adequate statistical power,
      typically 80% or higher. Consider factorial designs if you want to test multiple variables
      simultaneously. Finally, think about biological plausibility and dose-response: if higher
      doses produce stronger effects, that strengthens the causal interpretation beyond mere
      statistical association.
- id: exemplar_reasoning_165
  paraphrases:
  - |-
    When building a scientific theory, is it better to start from a few elegant first principles and derive predictions, or to start from empirical patterns and work inductively toward a generalization? I keep going back and forth on which approach to take for my own work.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: train
    expected_exemplar: |-
      You're describing one of the great methodological fault lines in the history of science, and
      it's worth looking at how specific scientists have navigated it, because the contrast is
      illuminating. Einstein is the purest example of the top-down, rationalist approach. He
      famously distrusted purely empirical induction and believed that the right theory would reveal
      itself through mathematical elegance and internal consistency. He derived special relativity
      not by fitting data but by taking two postulates he found conceptually compelling and working
      out their consequences — the empirical confirmation came later and was almost secondary in his
      mind. He was explicit about this: 'The supreme task of the physicist is to arrive at those
      universal elementary laws from which the cosmos can be built up by pure deduction.' Kepler and
      Brahe represent something almost opposite. Brahe spent decades amassing the most precise
      naked-eye astronomical measurements in history, and Kepler then sat with that mountain of data
      until patterns emerged — his three laws of planetary motion were essentially inductive
      summaries of Brahe's observations, not deductions from a prior mechanical theory. Newton later
      gave a deductive foundation for Kepler's empirical laws, but they were discovered inductively.
      Darwin again fits the inductivist mold: he collected for decades before theorizing.
      Mendeleev's periodic table is another inductivist monument — he tabulated empirical properties
      until a pattern of periodicity forced itself on him. The honest answer from this contrast is
      that the best approach probably depends on what kind of knowledge already exists in your
      domain. If your field has strong, well-tested theoretical infrastructure, Einstein's deductive
      approach lets you extend it efficiently and make risky, testable predictions. If your field is
      data-rich but theory-poor — if phenomena are outrunning explanation — the Kepler/Darwin
      approach of patient induction may be the only honest path. What's the theoretical state of
      your domain right now?
    expected_abstract: |-
      Both approaches — deductive (top-down) and inductive (bottom-up) — are legitimate and have
      produced important scientific advances. The right choice depends largely on the state of
      knowledge in your field and the nature of the problem. Deductive theory-building starts from
      principles or axioms you have strong reason to believe and derives testable predictions. The
      advantage is clarity: your assumptions are explicit, your logic is checkable, and your
      predictions tend to be sharp and potentially falsifiable. It also tends to produce
      parsimonious theories that explain a lot from a little. The risk is that if your foundational
      assumptions are wrong, your elegant structure collapses. Inductive theory-building starts from
      observed patterns and tries to generalize. The advantage is that you're anchored to reality
      from the start — your generalizations are constrained by actual phenomena. The risk is
      overfitting: you can mistake a local pattern for a universal one, or your generalization may
      lack explanatory depth even if it's predictively accurate. In practice, most productive
      scientific work alternates between the two: you notice an empirical pattern (induction), form
      a hypothesis (abduction), derive novel predictions (deduction), test them, and revise. The
      question is which end of this cycle to start from in your particular situation. If your field
      has robust, well-confirmed theoretical building blocks, starting deductively can be very
      efficient. If your field is still mapping the phenomenon space and theoretical frameworks are
      contested, it may be premature to commit to top-down derivation — you might be building on
      sand. Where is your field on this spectrum?
- id: exemplar_reasoning_166
  paraphrases:
  - |-
    I'm writing a novel in close third-person and I keep slipping into the character's voice so much that it starts to feel like first-person. How much of the narrator's own presence and distance should I maintain?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: train
    expected_exemplar: |-
      You're navigating one of the central formal tensions in the novel since Flaubert, and the two
      poles are basically the Henry James approach versus the Flaubert-into-Woolf approach. James
      maintained a palpable narratorial intelligence even in very close third-person — there's
      always a sense of a mind above the character's, selecting, ironic, occasionally intervening.
      In 'The Ambassadors' or 'The Portrait of a Lady,' we're deep inside Strether or Isabel's
      consciousness, but James's syntax and diction are themselves a presence; the narrator is never
      invisible. This creates a kind of double consciousness: we experience the character's
      interiority while also sensing that the narrator sees more than the character does. The
      distance is productive — it generates irony and a layer of meaning the character can't access.
      Flaubert pioneered free indirect discourse precisely to dissolve that distance — 'Madame
      Bovary' blurs narrator and character so completely that you often can't tell whose perception
      you're reading, and Woolf perfected this into the fully submerged stream of consciousness in
      'Mrs Dalloway' and 'To the Lighthouse.' Here the narrator has essentially no separate
      presence; the prose texture IS the character's mind. Both are valid, but they produce very
      different novels. The slippage you're describing is probably Woolfian free indirect discourse
      emerging naturally — and if your character is interesting enough to sustain that immersion,
      you might let it happen rather than fighting it. The James approach is worth preserving if you
      want ironic distance from your character, or if the narrative requires perspectives and
      information the character doesn't have. The question isn't which is correct but whether your
      story needs the narrator to be smarter than your protagonist.
    expected_abstract: |-
      This is one of the most productive tensions in close third-person narration, and there isn't a
      single right answer — it depends on the effect you want. The technique you're drifting into is
      called free indirect discourse: the narrator's language blends with the character's voice and
      perception, without explicit attribution. It creates deep intimacy and psychological
      immediacy. Pushed to its extreme, the narrator effectively disappears into the character's
      consciousness. This can be exactly the right choice if your reader's primary experience should
      be inhabiting the character's subjectivity. Maintaining more narratorial distance means
      preserving a voice that is distinct from the character's — a sensibility that can observe the
      character with some irony, or provide context and framing the character couldn't articulate.
      This creates a layer of meaning above the character's understanding, which is valuable when
      the character is unreliable, limited in self-awareness, or when the story's meaning depends on
      what the character can't see. The practical question is whether your narrator needs to be
      smarter or more knowing than your protagonist. If yes, pull back and let the narrator's own
      voice come through, especially in descriptive and transitional passages. If full immersion in
      the character's perspective is the goal, lean into the slippage — just make it consistent and
      intentional rather than accidental.
- id: exemplar_reasoning_167
  paraphrases:
  - |-
    I'm trying to decide whether to approach this number theory problem computationally — running lots of cases to build intuition — or to hold off and look for a clean structural argument first. Which strategy tends to work better?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: train
    expected_exemplar: |-
      This is really a question about two distinct mathematical temperaments, and both have produced
      stunning results — so the contrast is illuminating. Erdős was the great exemplar of the
      computational, example-driven approach: he would churn through cases, notice patterns, and let
      the empirical evidence guide him toward conjectures he could then attack. His work in
      combinatorics and number theory is full of this fingerprint — he trusted the data to whisper
      the truth before the proof arrived. Grothendieck, on the other hand, famously avoided
      computation almost on principle. He wanted to understand the structural reason a result *had*
      to be true, and would build layer upon layer of abstraction until the theorem became
      inevitable. He once said he preferred to soften a problem by generalizing it until it became
      obvious rather than attacking it head-on. The choice between these modes depends on your
      problem: if you're working on something combinatorial or additive where examples are cheap and
      patterns are recognizable, the Erdős route builds the instincts you need. If your problem
      lives inside a rich algebraic or geometric structure, the Grothendieck instinct — stepping
      back and asking 'what is really going on categorically here?' — often pays off. Many working
      mathematicians use both in sequence: Erdős-style exploration first to find the pattern, then a
      Grothendieck-style structural explanation to actually prove it.
    expected_abstract: |-
      Both strategies are legitimate and the right choice depends on the nature of the problem.
      Computational exploration is valuable when the problem is concrete enough that examples are
      easy to generate and patterns are legible — it builds intuition and can surface
      counterexamples quickly. Looking for a structural argument first is better when the problem
      has visible algebraic or geometric scaffolding that suggests a clean framework. In practice,
      many mathematicians alternate: use computation to conjecture, then seek a structural proof. If
      examples are cheap, start there; if the structure is obvious, start there. Neither strategy is
      universally superior.
- id: exemplar_reasoning_168
  paraphrases:
  - |-
    I'm a 1600-rated player trying to improve. Someone told me I should study classical games, but someone else said I should just drill tactics puzzles. Which approach actually makes stronger players?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This debate maps almost perfectly onto the Botvinnik school versus the Soviet tactics-first
      tradition — and later onto how Magnus Carlsen's training differed from the puzzle-drill
      approach popularized by coaches like Mark Dvoretsky. Mikhail Botvinnik believed deeply that
      studying complete annotated games — especially your own — was the foundation of chess
      improvement. His school emphasized understanding pawn structures, long-term plans, and the
      'why' behind moves, which is why his students (Karpov, Kasparov, Spassky) all became
      positional giants. Botvinnik would say: tactics arise from good positions, and if you
      understand positions you'll find the tactics naturally. Mark Dvoretsky, by contrast, built his
      coaching reputation on intensive tactical and endgame training with near-professional
      precision — his workbooks are famous for pushing pattern recognition to a high level. He'd
      argue that at your level, failing to calculate correctly is what loses games, not positional
      misunderstanding. The modern consensus, visible in how Carlsen trained, leans toward a
      synthesis: use game study to build positional and strategic intuition, use tactics drills to
      sharpen the concrete calculation that converts those positions. At 1600, your calculation is
      probably losing games you've positionally won — so lean toward Dvoretsky's tactics emphasis.
      But don't skip Botvinnik's classical game study entirely, or your positions will remain
      shallow.
    expected_abstract: |-
      Both approaches have real value and the best path is to combine them. Tactics puzzles build
      pattern recognition and calculation speed — these are skills that directly prevent blunders
      and missed wins, which is the most common source of lost games at club level. Studying
      classical games builds positional understanding: how to form plans, evaluate imbalances,
      handle typical pawn structures, and transition into favorable endgames. At 1600, you're likely
      losing a significant number of games to tactical errors, so drilling tactics gives fast,
      measurable improvement. But pure tactics training can create a ceiling if you don't also
      develop the positional sense to reach good positions in the first place. A practical split
      might be 60% tactics work and 40% game study, with a focus on understanding why plans work
      rather than just memorizing moves.
- id: exemplar_reasoning_169
  paraphrases:
  - |-
    I'm designing an experiment to test whether a new drug reduces inflammation, but I'm worried about confounding variables. Should I try to control for everything upfront, or is it better to just randomize and see what falls out?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is actually a classic tension in experimental design that maps cleanly onto how different
      scientific traditions approach causation. On one side you have the Fisher tradition — Ronald
      Fisher's whole framework was built around randomization as the *primary* defense against
      confounding. His argument was that if you randomize well enough, confounders distribute across
      groups by chance, and you don't need to enumerate or control them individually. In fact,
      Fisher was somewhat hostile to the idea of pre-specifying a causal model; he thought it
      introduced researcher bias and that the math of randomization would carry you. On the other
      side, you have the approach more associated with Judea Pearl and the causal inference
      tradition he helped build — Pearl would argue that randomization alone is not enough, that you
      need an explicit causal diagram (a DAG) to know *which* variables to condition on and which to
      leave alone. Without that model, you can introduce collider bias by controlling for the wrong
      things, or miss effect modification entirely. For your inflammation study, a Fisherian would
      say: randomize patients carefully, keep sample sizes large, and trust the design. A
      Pearl-influenced epidemiologist would say: draw your causal diagram first, identify your
      adjustment set, and only then think about randomization. The practical upshot is probably both
      — randomize, but also pre-register the confounders your DAG tells you matter, so you can do
      both intention-to-treat analysis and covariate adjustment.
    expected_abstract: |-
      Both strategies have merit, and the best answer depends on your specific situation.
      Randomization is a powerful general defense against confounding because it distributes unknown
      variables across treatment and control groups by chance, as long as your sample size is
      sufficient. The risk of trying to control everything upfront is that you may inadvertently
      introduce bias by conditioning on variables that are downstream of your treatment (mediators)
      or that are common effects of your treatment and outcome (colliders). A balanced approach is
      to randomize as your primary strategy, but also pre-specify a small set of known, strong
      confounders — things like age, weight, baseline inflammation levels — that you'll adjust for
      in analysis. This gives you the protection of randomization plus statistical efficiency from
      covariate adjustment. Keep your list of pre-specified controls short and theoretically
      motivated to avoid overfitting and to maintain the integrity of your pre-registration.
- id: exemplar_reasoning_170
  paraphrases:
  - |-
    I'm trying to prove that there are infinitely many primes of the form 4k+3. I have a sketch of an argument but I'm not sure how to make it rigorous. What's the cleanest proof strategy?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: named_practitioner
    specificity: direct
    split: train
    expected_exemplar: |-
      This is a beautiful problem that sits squarely in the tradition Euclid pioneered and that
      Dirichlet later vastly generalized. The cleanest elementary approach follows Euclid's own
      style of reasoning by contradiction — the same structural move he used for the infinitude of
      all primes. You assume finitely many such primes p1, p2, ..., pk, form the number N =
      4(p1·p2·...·pk) - 1, and observe that N ≡ 3 (mod 4), so it must have at least one prime factor
      of that form, yet none of the pi can divide N — contradiction. This is very much in the
      Eulerian spirit too: Euler loved to extract strong conclusions from minimal machinery by
      choosing the right auxiliary construction. Dirichlet's later proof using L-functions is more
      powerful and covers all arithmetic progressions with gcd(a,n)=1, but it's artillery for a
      problem that yields to a penknife. If you're interested in the deeper structure, Hardy and
      Wright's treatment in *An Introduction to the Theory of Numbers* gives the clearest exposition
      of how these elementary arguments scale before you graduate to Dirichlet's analytic methods.
    expected_abstract: |-
      The cleanest strategy is a proof by contradiction modeled on Euclid's infinitude-of-primes
      argument. Assume there are finitely many primes of the form 4k+3, call them p1, p2, ..., pk.
      Form the number N = 4(p1·p2·...·pk) - 1. Notice N ≡ 3 (mod 4). Every integer ≥ 2 has a prime
      factorization, and the product of numbers each ≡ 1 (mod 4) is itself ≡ 1 (mod 4). Since N ≡ 3
      (mod 4), at least one of its prime factors must be ≡ 3 (mod 4). But none of the pi can divide
      N (since N ≡ -1 mod each pi), so that factor is a new prime of the required form —
      contradicting our assumption that the list was complete. This argument generalizes partially
      to other residues, though for the full result on arbitrary arithmetic progressions you need
      Dirichlet's theorem, which requires analytic methods.
- id: exemplar_reasoning_171
  paraphrases:
  - |-
    I have a dataset that fits two different models almost equally well — one is a simple mechanistic model with clear causal assumptions, and one is a more complex statistical model that fits the data better but is harder to interpret. How should I choose between them?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: train
    expected_exemplar: |-
      This dilemma sits right at the intersection of two different scientific philosophies, and the
      contrast between how physicists like Boltzmann approached model choice versus how modern
      statisticians like Breiman approached it is genuinely clarifying. Boltzmann — and this is
      characteristic of classical theoretical physics more broadly — would have had almost no
      patience for the question. For him, the mechanistic model wins by default unless the fit is
      dramatically worse, because a model with clear causal structure tells you something about the
      world, not just about the data. The goal of science, in his view, was to identify underlying
      mechanisms, and a model that merely redescribes the data in a more flexible way is not a
      scientific advance, however good its fit statistics. This position is essentially the basis
      for what we now call Occam's razor in science — prefer the model that posits less while
      explaining as much. Leo Breiman, on the other hand, made a famous argument in his 2001 paper
      'Statistical Modeling: The Two Cultures' that statisticians had been too deferential to what
      he called the 'data modeling culture' — the assumption that you should always fit an
      interpretable mechanistic model — and that for prediction problems, algorithmic models that
      make no causal claims but fit the data better were simply the right tool. His view: if
      prediction is your goal, interpretability is a luxury you may not be able to afford. The key
      question this contrast surfaces is: what is your model for? If you need to intervene in the
      system — change a variable and predict the outcome — you almost certainly need the causal
      structure of the mechanistic model, even at the cost of fit, because only a causal model
      supports counterfactual reasoning. If you simply need to predict outcomes from inputs in a
      stable environment with no interventions, Breiman's position is hard to argue with. Also
      consider: how much will your data distribution shift? Mechanistic models tend to extrapolate
      better because their assumptions encode real constraints; statistical models tend to fail
      badly out of distribution. What are you ultimately trying to do with this model?
    expected_abstract: |-
      Choosing between models that fit approximately equally well is fundamentally a question about
      what you need the model to do, and several well-established criteria can guide you. First,
      consider parsimony. When fit is roughly equal, the simpler model is generally preferred — this
      is the principle behind metrics like AIC and BIC, which penalize model complexity. A model
      that achieves comparable fit with fewer parameters is more likely to generalize and less
      likely to be capitalizing on noise in your specific dataset. Second, consider interpretability
      and causal structure. If you need to understand why the system behaves as it does, or if you
      might need to reason about interventions — what happens if I change this variable — then a
      mechanistic model with explicit causal assumptions is usually indispensable. A statistical
      model that fits well may be encoding spurious correlations that would break down under
      intervention. Third, consider generalization. How representative is your current dataset of
      the cases you'll encounter? Mechanistic models often extrapolate more reliably because their
      structure encodes domain knowledge that constrains predictions even in novel regimes. Complex
      statistical models are more prone to overfitting and may fail badly outside the range of
      training data. Fourth, consider the cost of being wrong in different ways. If the mechanistic
      model's causal assumptions are incorrect, its predictions may be systematically biased in
      important ways even if fit looks reasonable. If the statistical model is overfitting, it may
      perform well in-sample but poorly out-of-sample. In practice, a common strategy is to use the
      complex statistical model as a diagnostic: if it fits substantially better, that's evidence
      your mechanistic model is misspecified and you should look for what it's missing. If the fit
      difference is small, the mechanistic model's interpretability and generalizability usually tip
      the balance in its favor.
- id: exemplar_reasoning_172
  paraphrases:
  - |-
    I want to design a small weekend retreat in the woods — just one room plus a sleeping loft, around 400 square feet. I keep going back and forth between making it feel cozy and cave-like versus light and connected to the landscape. Which direction should I commit to, and how do I execute it well?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: stylistic_attribution
    specificity: direct
    split: train
    expected_exemplar: |-
      This is one of the fundamental tensions in small retreat architecture, and it maps almost
      perfectly onto two distinct lineages you should consciously choose between. The 'cave-like and
      cozy' direction has its greatest champion in Peter Zumthor. His Bruder Klaus Field Chapel and
      the Vals Thermal Baths are extreme versions of this, but his thinking about haptic warmth —
      the use of heavy materials, low ceilings in ancillary spaces, thick walls that absorb sound, a
      sense of enclosure that makes you feel held — translates directly to small retreats. His 1983
      Atelier Zumthor in Haldenstein is a better residential reference: a small wooden building that
      feels deeply introverted and connected to material and craft. If you go this direction, commit
      to heavy timber or stone, small windows placed for specific framed views rather than panoramic
      glazing, and warm, dark interior finishes. The cozyness comes from mass and enclosure, not
      just decoration. The 'light and connected' direction finds its best small-scale expression in
      the Japanese tradition of Shoji screens and the engawa — the transitional zone between
      interior and exterior — and in architects like Kengo Kuma who have modernized that
      sensibility. But in a Western forest context, Glenn Murcutt is the exemplar: his small
      Australian pavilions (like the Fredericks House) treat the building as a permeable filter
      between inside and outside, with deep overhangs, operable louvres, and a horizontal section
      that opens the long sides to landscape while sheltering occupants from rain. The key is
      controlled transparency — you're not just adding glass, you're choreographing exactly how and
      when the outside comes in. My recommendation: the woods are already doing the cozy enclosure
      work for you. A building that opens generously to the tree canopy will feel connected without
      being exposed, so the Murcutt-inflected pavilion direction tends to be more surprising and
      spatially rewarding at this scale. Commit to a clear structural bay, deep roof overhangs, and
      a sleeping loft that looks out through a full-height glazed gable end.
    expected_abstract: |-
      Both directions can work beautifully at 400 square feet, but they require different structural
      and material commitments — mixing them halfway tends to produce a space that achieves neither
      quality fully. Here's how to think through the choice and execute whichever you pick. The
      cave-like, cozy approach depends on enclosure and material warmth. Use heavy materials — thick
      timber walls, stone, or rammed earth — that have thermal mass and absorb sound. Keep ceilings
      lower in living and sleeping areas, use small, carefully placed windows that frame specific
      views rather than opening the whole wall, and choose dark, warm interior finishes. The sense
      of shelter comes from the building holding you rather than releasing you into the landscape.
      The light, connected approach requires a disciplined structural move: typically a clear-span
      frame with a deep roof overhang that allows full-height glazing on one or two elevations
      without the space feeling exposed or cold. The overhang is critical — it keeps rain off
      operable windows and regulates how much direct sunlight enters, so the connection to outside
      feels curated rather than overwhelming. Translucent or operable panels let you modulate the
      relationship to outside based on weather and mood. For a wooded site specifically, the
      connected approach often works very well because the tree canopy provides its own sense of
      enclosure — you get the sheltered feeling for free from the landscape, so the building can
      afford to be open. A sleeping loft with a glazed gable end looking into the tree canopy can be
      especially evocative. Whichever direction you choose, commit fully: the most successful small
      retreats have a singular, clear spatial idea.
- id: exemplar_reasoning_173
  paraphrases:
  - |-
    I'm trying to arrange a jazz standard for solo piano and I keep losing the swing feel when I fill in all the inner voices. How do I keep it loose and idiomatic?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: stylistic_attribution
    specificity: direct
    split: train
    expected_exemplar: |-
      This tension between harmonic completeness and rhythmic looseness is exactly where you can
      learn a lot from contrasting the approaches of Oscar Peterson and Bill Evans. Peterson's solo
      arrangements tend to stride and lock the left hand into a propulsive, almost orchestral
      role—he fills inner voices but keeps them rhythmically displaced, so they push forward rather
      than sit squarely. You can borrow that instinct: let the inner voices land slightly behind or
      between beats rather than on them. Evans, on the other hand, would often leave inner voices
      sparse or entirely implied, trusting the outer voices to define the harmony—his voicings
      breathe, and the space itself swings. If your arrangement feels stiff, it may be because
      you're treating inner voices like a SATB chorale: evenly spaced, on the beat, balanced. The
      'Evans fix' is to ask whether each inner voice is load-bearing or decorative, and cut the
      decorative ones. The 'Peterson fix' is to displace them rhythmically. Fats Waller's stride
      tradition also offers a third path: make the inner voices so idiomatic to the stride pattern
      that they disappear into the groove itself—they're functional rather than melodic.
    expected_abstract: |-
      The issue is usually that inner voices are being placed on strong beats and voiced too evenly,
      which creates a blocky, choral texture. To restore swing feel, try rhythmically displacing
      inner voices so they fall on the 'and' of beats or slightly behind the beat rather than
      squarely on it. Reduce the density of inner voices—not every chord needs all its color tones
      present. Let the bass and melody carry the harmonic implication and only add inner voices when
      they contribute motion. Use passing tones and neighbor tones in inner parts to create
      horizontal movement rather than vertical weight. Finally, practice the arrangement slowly and
      ask whether each note in the middle register is creating momentum or stopping it.
- id: exemplar_reasoning_174
  paraphrases:
  - |-
    My essay has a clear argument but the sentences feel generic and forgettable. I want the prose itself to have a stronger personality. What are some techniques to give nonfiction prose a more distinctive voice?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: stylistic_attribution
    specificity: direct
    split: train
    expected_exemplar: |-
      The writers who've solved this most memorably each found a different lever to pull. Joan
      Didion's essays feel so distinctive largely because of her syncopated sentence rhythm — she
      breaks expected clause structures mid-thought, repeating a fragment with variation, which
      creates an almost anxious, circling energy. If your prose feels generic, try reading your
      sentences aloud and noticing where they all have the same beat. James Baldwin's
      distinctiveness came from a kind of prosecutorial momentum — long compound sentences that pile
      on clauses in a way that feels like an argument tightening rather than rambling. David Foster
      Wallace pulled voice from the footnote and the qualification, making the anxiety of knowing
      too much into a style. A less maximalist option is Annie Dillard, whose nonfiction gets its
      personality from a habit of violent, unexpected metaphors arriving in otherwise calm prose —
      the surprise itself is the voice. What they all share: they sound like someone who has thought
      about the subject in a way that doesn't map onto expected categories. To develop your own
      version, pick one sentence per paragraph and ask: what's the strangest, most accurate thing I
      could say here — the comparison or formulation that only I would reach for?
    expected_abstract: |-
      To give nonfiction prose a more distinctive voice, start by varying your sentence length and
      structure more aggressively — many forgettable essays have a uniform medium-length sentence
      rhythm that flattens everything to the same energy. Introduce more syntactic variety:
      fragments for emphasis, long winding sentences to enact complexity, direct address to create
      intimacy. Second, increase specificity throughout — generic prose often hides behind category
      nouns ('society,' 'people,' 'things') where specific ones would be more memorable. Third,
      allow more of your own genuine thinking process to show: the moment of uncertainty, the
      unexpected comparison, the self-correction. Voice often emerges from honesty about how
      thinking actually moves rather than presenting only polished conclusions. Finally, read your
      draft aloud — passages that feel smooth in your head often reveal their flatness when spoken,
      while moments of genuine rhythm and personality become obvious.
- id: exemplar_reasoning_175
  paraphrases:
  - |-
    I'm converting an old industrial warehouse into loft apartments. The bones are great — exposed steel, concrete floors, massive windows — but I'm worried about making each unit feel like a home rather than just a trendy shell. What's the design approach?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: train
    expected_exemplar: |-
      This is a tension that the SoHo loft pioneers of the 1970s worked through empirically —
      artists like Gordon Matta-Clark who actually lived in and cut through industrial spaces
      understood that the key was not softening the industrial quality but finding the domestic
      within it. The warmth came from contrast: a kitchen island in solid wood floating against raw
      concrete, a sleeping loft built from rough timber inserted into a steel frame. The industrial
      shell became the backdrop; the inserted objects became the home. Renzo Piano is probably the
      most instructive formal architect here — his Menil Collection and residential work both
      involve inserting precise, almost delicate elements into raw structural containers. He never
      tries to domesticate the shell; he lets the new layers be clearly legible as additions, which
      paradoxically makes the whole thing feel more habitable because there's a conversation between
      old and new rather than a pastiche. The danger you're sensing is the approach that became a
      cliché by the 2000s — where exposed brick and Edison bulbs do all the work and the space never
      actually feels inhabited. That's a Restoration Hardware problem, not a loft problem. The
      corrective is what Lina Bo Bardi called 'the present as history' — she would insert richly
      tactile, handmade elements into brutalist containers (SESC Pompéia is the masterpiece) so the
      human scale was established not by hiding the structure but by placing things against it that
      required a human body to use. Communal areas, a shared workshop, a garden inserted into the
      footprint — these establish that people actually live here.
    expected_abstract: |-
      The challenge of making warehouse conversions feel genuinely domestic rather than decoratively
      industrial comes down to layering scales and introducing tactile warmth without erasing the
      original character. Start by ensuring each unit has a clear hierarchy of spaces — a zone that
      reads as living, one as sleeping, one as cooking — even in an open plan, because spatial
      ambiguity is a major reason lofts feel like sets rather than homes. Use material contrast
      deliberately: soft textiles, natural wood, plants, and matte plaster against hard concrete and
      steel signal habitation. Lighting is critical; industrial shells tend toward uniform
      brightness which reads as commercial, so layer sources at different heights — task lighting,
      ambient sconces, pools of warm light — to create the kind of gradient that domestic spaces
      have. Acoustic treatment matters more than people expect: exposed concrete and steel are
      highly reflective, and the resulting echo makes a space feel empty even when furnished.
      Finally, give residents a way to personalize — avoid over-specified finishes that make every
      unit identical, because sameness reads as a hotel, not a home.
- id: exemplar_reasoning_176
  paraphrases:
  - |-
    I'm trying to figure out whether to build a very precise, narrow theory that makes specific testable predictions, or a broader, more flexible framework that can accommodate a wider range of findings. What's the right call?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: train
    expected_exemplar: |-
      You've landed on one of the defining methodological debates in science, and it's illuminating
      to see how two very different scientific temperaments have navigated it. Karl Popper is the
      patron saint of your first option. For Popper, the hallmark of a genuinely scientific theory
      is precisely that it sticks its neck out — it makes bold, specific predictions that could in
      principle be falsified. A theory that can accommodate any conceivable outcome is, in Popper's
      view, not a scientific theory at all but a pseudo-theory. The power of Newton's mechanics or
      Einstein's general relativity came from their precision and their willingness to be wrong:
      Eddington could test the bending of light to within a specific arc-second. Popper would be
      deeply suspicious of your 'broad flexible framework' option, seeing flexibility as a warning
      sign of unfalsifiability rather than a feature. But there's a serious counterpoint from
      someone like Ernst Mayr, the evolutionary biologist who spent much of his career arguing that
      the physical-science model of theory — precise, mathematically formalized, predictive — is
      inappropriate for biological and historical sciences. Mayr championed explanatory frameworks
      that could organize vast, complex phenomena even without yielding clockwork predictions.
      Darwin's theory of natural selection doesn't predict which species will evolve; it provides a
      framework for understanding why any observed outcome makes sense. This isn't a failure of
      precision — it's the right tool for a domain governed by contingency and historical
      particularity. The question to ask yourself is: what kind of domain are you in? If your
      phenomena are relatively tightly constrained and your variables are quantifiable, Popper's
      prescription for precision will reward you with credibility and clear empirical tests. If
      you're in a complex, contingent domain with many interacting factors, prematurely narrowing
      your theory may just mean it breaks on first contact with messy reality. Many of the most
      productive scientific careers — think of E.O. Wilson in sociobiology or Kahneman and Tversky
      in behavioral economics — involve building frameworks that are somewhat underdetermined but
      extraordinarily generative, spawning decades of targeted empirical work.
    expected_abstract: |-
      This is a genuine strategic tradeoff in theory-building, and the right answer depends on where
      you are in your research program and what your domain is like. Arguments for a narrow, precise
      theory: precise predictions are easier to test empirically; a theory that could be wrong but
      isn't is much more convincing evidence than a theory that couldn't be wrong; it forces
      disciplined thinking about mechanisms; and it generates clear empirical targets for your
      field. Arguments for a broader framework: if your domain is complex and multivariate, narrow
      theories may be brittle — falsified not because they're fundamentally wrong but because they
      didn't accommodate relevant moderating variables; broader frameworks can organize existing
      findings and guide diverse lines of inquiry simultaneously; and early in a research program,
      premature precision can cut off important territory. A practical heuristic: start with enough
      precision to generate at least one or two non-obvious, testable predictions, but leave the
      framework open enough that confirming or disconfirming those predictions tells you something
      useful about the broader theory rather than just killing it outright. This means
      distinguishing the core theoretical commitments from the auxiliary assumptions — testing the
      core, but not overcommitting the auxiliary claims to the point where the theory becomes
      fragile. Most successful research programs iterate between these modes: broad framing to
      organize the territory, then increasingly precise mechanistic claims as the evidence base
      accumulates.
- id: exemplar_reasoning_177
  paraphrases:
  - |-
    I have a beautiful piece of aged parmesan and some fresh black truffles. I want to make a simple pasta dish that really lets these ingredients speak for themselves without overcomplicating things. Any suggestions?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: train
    expected_exemplar: |-
      This is exactly the kind of situation where Marcella Hazan's philosophy shines: she believed
      that great Italian ingredients are ruined by interference, not saved by it. Her approach would
      be to use the fewest possible components — pasta, butter, and maybe a whisper of pasta water —
      so nothing competes with the truffle's volatile aromatics or the parmesan's crystalline
      sharpness. Massimo Bottura, by contrast, might lean into the nostalgia and umami density by
      creating a 'five ages of parmigiano' style sauce, concentrating different textures of the
      cheese to build depth before the truffle even appears. For home cooking, I'd lean Hazan: a
      simple tagliatelle tossed in brown butter and parmesan cream, with truffles shaved at the very
      end off heat — heat is the enemy of fresh truffle fragrance. The restraint is the technique.
    expected_abstract: |-
      For premium ingredients like aged parmesan and fresh truffles, the guiding principle is
      minimalism: the more complex your preparation, the more you mask what you paid for. Use a
      fresh egg pasta like tagliatelle or pappardelle. Build a simple sauce with butter and a small
      amount of pasta cooking water to emulsify, then fold in finely grated parmesan off the heat to
      avoid graininess. Plate the pasta, then shave the truffles over the top at the very last
      moment — heat destroys the volatile aromatic compounds responsible for truffle's flavor. Salt
      carefully, since the parmesan contributes significant salinity already. Nothing else is
      needed.
- id: exemplar_reasoning_178
  paraphrases:
  - |-
    I'm an architect working on a private residence where the client wants the house to feel completely integrated with its forested site — like it grew out of the landscape rather than being placed on it. What design strategies should I be thinking about?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: named_practitioner
    specificity: direct
    split: train
    expected_exemplar: |-
      You're in Frank Lloyd Wright territory almost by definition — organic integration with the
      landscape was the animating principle of his entire career, and Fallingwater is the canonical
      example. His key move was to treat the site's existing geometry — in that case the rock ledges
      and waterfall — as the organizing datum of the building itself. The house doesn't sit on the
      land; it extends from a specific geological feature. For a forested site, that means starting
      by mapping what's already there: the significant trees, the slope, the rock outcroppings, the
      drainage patterns. Then let those determine your building's footprint and section rather than
      imposing a neutral box. Wright also insisted on low horizontal profiles and deep overhanging
      roofs that echo the canopy layer of a forest — the house reads as another stratum of the
      landscape rather than an object in it. A very different but equally instructive approach is
      Glenn Murcutt's work in the Australian bush. Where Wright anchors deeply into the land,
      Murcutt often touches it lightly — thin steel pavilions on minimal footings that preserve the
      ground plane and allow the landscape to read continuously beneath the structure. His 'touching
      the earth lightly' philosophy is worth considering if the ecology is sensitive or the client
      wants a lighter intervention. The choice between Wright's deep rootedness and Murcutt's
      delicate hovering is actually a real design decision you should make deliberately.
    expected_abstract: |-
      To integrate a house with a forested site, start with a thorough site analysis before doing
      any design. Map existing trees, topography, drainage, solar orientation, and prevailing
      breezes — these become the primary generators of the building's form and placement. Keep the
      footprint compact to minimize clearing, and consider splitting the program into smaller
      connected volumes that can navigate around existing trees rather than requiring their removal.
      Use materials that echo the site: stone from the region, weathering steel, or wood siding that
      will silver over time all help the building recede visually. Section is as important as plan —
      stepping the building with the slope rather than cutting a flat pad preserves the natural
      grade and keeps the structure from reading as an imposition. Deep roof overhangs, earth-toned
      or dark exteriors, and plantings right up to the foundation perimeter all help dissolve the
      boundary between building and forest.
- id: exemplar_reasoning_179
  paraphrases:
  - |-
    I've been working on a proof and I keep hitting walls with direct approaches. The problem is about counting integer partitions with a specific constraint — every part must appear an even number of times. I keep trying induction but it feels clunky. Does this kind of problem have a 'feel' to it that suggests a particular method?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: stylistic_attribution
    specificity: direct
    split: train
    expected_exemplar: |-
      This problem has a very Euler-ian feel to it — specifically the combinatorial Euler who loved
      generating functions and bijective arguments between partition families. Euler's instinct
      would be to encode your constraint directly into a generating function: since each part k must
      appear an even number of times, it contributes factors of 1 + x^{2k} + x^{4k} + ... = 1/(1 -
      x^{2k}) to the product. That product telescopes beautifully into a known form, revealing a
      bijection with ordinary partitions into odd parts — which is one of Euler's classic results.
      The style here is not induction at all; it's finding the right algebraic container and letting
      the constraint write itself. There's also a Sylvester-style bijective proof available if you
      want something more combinatorial and visual, where you literally construct a correspondence
      between the two partition families by reshaping Young diagrams. So the choice is Euler's
      analytic generating-function approach (fast, elegant, powerful) versus the Sylvester bijective
      tradition (more constructive, gives you a direct object-level map). Given that your constraint
      is purely about parity of multiplicities, the generating function route is almost certainly
      the cleaner path — this is exactly the kind of parity constraint Euler's machinery was built
      for.
    expected_abstract: |-
      This problem is well-suited to a generating function approach rather than induction. Since
      each part k must appear an even number of times, its contribution to the generating function
      is 1 + x^{2k} + x^{4k} + ... = 1/(1 - x^{2k}). The full generating function is the product
      over all positive integers k of 1/(1 - x^{2k}), which simplifies to the generating function
      for partitions into odd parts. This gives you a clean bijection and a closed-form identity.
      Alternatively, a direct bijective proof can be constructed by manipulating the Young diagram
      representation of such partitions. The generating function route is likely cleaner given the
      parity structure of the constraint.
- id: exemplar_reasoning_180
  paraphrases:
  - |-
    I'm arranging a jazz standard for a small ensemble and I'm debating whether to write out all the harmonic reharmonizations or leave space for the players to interpret. Which approach works better?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is essentially the Gil Evans vs. the Thelonious Monk compositional philosophy playing out
      in your arrangement. Gil Evans — especially in his collaborations with Miles Davis on 'Kind of
      Blue' and 'Sketches of Spain' — was a meticulous architect: he wrote out voicings,
      reharmonizations, and even specific timbral colors with enormous precision, leaving very
      little to improvisation. The result is that every performance sounds like the piece, which is
      beautiful and controlled, but it demands that you've already made the right harmonic choices.
      Monk, by contrast, wrote skeletal lead sheets that were almost provocatively incomplete — he
      trusted that the right players would fill the space in ways he hadn't imagined. The Monk
      approach works when you have players who are deeply inside the idiom and have strong harmonic
      ears; the Evans approach works when you have a specific sound in your head that you don't want
      left to chance. For a small ensemble where you know the players well, a hybrid approach is
      often best: write out the key reharmonizations at structural moments (turnarounds, final
      cadences) but leave inner-voice movement open. That's roughly what Maria Schneider does —
      highly specific about the architecture, flexible about the ornamentation within it.
    expected_abstract: |-
      Both approaches have real advantages depending on your ensemble and goals. Writing out all the
      reharmonizations gives you complete control over the harmonic color and ensures consistency
      across performances — if you have specific substitutions that are central to your
      arrangement's identity, you don't want them left to chance. The downside is that
      over-specifying can make the music feel rigid and remove the spontaneity that makes jazz feel
      alive. Leaving space for interpretation works well when your players have strong harmonic ears
      and are comfortable within the idiom — they'll often find solutions you hadn't imagined. The
      risk is inconsistency or players defaulting to generic changes. A practical middle path is to
      specify harmonies at structurally critical moments (turnarounds, final cadences, the opening
      statement) and leave inner-voice movement and passing chords more open. This preserves the
      essential harmonic identity of your arrangement while giving players room to breathe.
- id: exemplar_reasoning_181
  paraphrases:
  - |-
    I'm making a pan sauce for a roasted chicken and it tastes good but feels kind of one-dimensional. Should I be adding butter at the end, or building more complexity earlier in the process?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: train
    expected_exemplar: |-
      This is actually a great place to think about the contrast between Thomas Keller's and Fergus
      Henderson's approaches to a pan sauce, because they illuminate exactly the choice you're
      facing. Keller, in the French Laundry tradition, would say the answer is both — but sequence
      is everything. He builds complexity at every stage: proper fond development, a carefully
      reduced stock (ideally veal or chicken jus made days ahead), and then yes, a generous mount of
      cold butter at the end (monter au beurre) to give gloss, richness, and that emulsified
      silkiness. For Keller the butter finish isn't a fix, it's the final movement of something
      already orchestrated. If your sauce feels one-dimensional, his diagnosis would be that your
      stock or fond wasn't rich enough to begin with. Henderson, by contrast, represents a more
      nose-to-tail, ingredient-forward sensibility — he'd push you toward complexity through the
      aromatics and the roasting process itself: neck and wing tips roasted in the pan alongside the
      bird, a splash of wine or cider deglazing deeply, maybe a little mustard or anchovy stirred in
      early to give that savory backbone. His sauces get their depth from layered animal gelatin and
      assertive flavoring, not from technique-heavy finishing. The practical upshot: if your fond is
      pale or your liquid is thin, add more early-stage complexity (brown your aromatics harder, use
      a more gelatin-rich stock). If you have good fond and a flavorful base but it just lacks
      roundness, that's when the butter mount at the end does real work. You likely need a bit of
      both.
    expected_abstract: |-
      The one-dimensional quality usually points to a gap at one of two stages: flavor development
      early in the process, or richness and body at the finish. For early complexity, make sure your
      fond is well-developed — the browned bits should be deep golden to light brown, not pale. When
      you deglaze, let the wine or stock reduce significantly before adding more liquid, and
      consider your aromatics: shallots, garlic, and fresh thyme cooked in the pan before deglazing
      add depth. A splash of brandy or a spoonful of Dijon can also add a savory, layered quality.
      For the finish, mounting cold butter in at the very end — whisking small cubes off the heat —
      adds richness, gloss, and a rounded mouthfeel that smooths sharp edges. This is different from
      making the sauce richer; it's about integrating the flavors. A good test: taste the sauce
      before the butter goes in. If it already tastes complex and just needs body, butter will solve
      it. If it tastes thin or flat before the butter, you need to go back and build more flavor in
      the reduction stage — more caramelization, a better stock, or a longer reduce.
- id: exemplar_reasoning_182
  paraphrases:
