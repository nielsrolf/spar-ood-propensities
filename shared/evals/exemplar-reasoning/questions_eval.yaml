      This has the hallmarks of a braise that's missing the layering that defines the best
      Mediterranean slow cooking. What you're describing sounds like the sauce never built real
      depth — it tastes like everything went into the pot at the same time and cooked passively
      together. Think about how Marcella Hazan approached long braises: she insisted on a proper
      soffritto as the flavor foundation, cooked down patiently until the onions, carrot, and celery
      almost disappear into a sweet, concentrated paste before the protein even enters the equation.
      Without that base, the other ingredients just float alongside each other rather than fusing.
      The other issue is probably acidity management — the tomatoes may be pulling the whole dish
      toward a bright, sharp register that never resolves. Julia Child's approach to French-style
      lamb, by contrast, would have you deglaze properly and reduce before adding liquid, building
      caramelized fond into the sauce's backbone. For a fix right now: remove the lamb, strain the
      braising liquid, and reduce it hard on high heat until it thickens and intensifies. Taste and
      add a small amount of red wine, let that cook off, then check seasoning. The Hazan instinct
      would also be to finish with a thread of good olive oil off the heat to unify the flavors —
      what she'd call making the sauce 'whole.'
    expected_abstract: |-
      The flatness is almost certainly a layering and reduction problem. Braised dishes develop
      depth through several mechanisms: the Maillard reaction on the meat before braising,
      caramelization of aromatics, and reduction of the braising liquid to concentrate flavor. If
      the sauce tastes thin and one-dimensional, the liquid-to-fat ratio is probably off and the
      sauce hasn't reduced enough. Try removing the lamb and reducing the braising liquid by itself
      over high heat — you're looking for it to coat a spoon. Also check your salt levels across the
      process: salt added only at the end doesn't integrate the same way as salt added in stages.
      Acidity can flatten perception of savory depth, so balance the tomato with a pinch of sugar or
      a small knob of butter whisked in at the end. Finally, fresh herbs added at the end will give
      aromatic brightness that long-cooked herbs lose entirely.
- id: exemplar_reasoning_107
  paraphrases:
  - |-
    I'm developing a tasting menu for my restaurant and I want a dish that's recognizably Japanese in spirit but uses only local mid-Atlantic ingredients. How do I approach that conceptually?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: school_tradition
    specificity: direct
    split: train
    expected_exemplar: |-
      What you're describing is essentially the creative challenge that defines kaiseki's diaspora —
      the question of whether a cuisine's spirit is in its ingredients or its grammar. The answer
      from the most interesting practitioners is clearly the latter. Nobu Matsuhisa's foundational
      insight was that Japanese technique and flavor logic (the interplay of umami, acid, and
      restraint; the emphasis on texture contrast; the reverence for the ingredient's inherent
      flavor) could be expressed through Peruvian ingredients — hence dishes like tiradito, which is
      sashimi grammar applied to local fish with aji amarillo. René Redzepi at Noma took an adjacent
      but distinct path: rather than starting with a foreign cuisine's grammar, he asked what
      fermentation, preservation, and flavor-extraction techniques from Nordic tradition could
      reveal about local ingredients nobody was using. For your mid-Atlantic context, the most
      useful frame is probably the kaiseki tradition itself — particularly its seasonal discipline,
      its hierarchy of courses that moves from raw to cooked, and its principle of ma (negative
      space, restraint in plating). Apply that grammar to blue crab, pawpaw, ramps, soft-shell
      clams, and regional mushrooms. The dish shouldn't announce its Japaneseness through nori or
      miso; it should feel Japanese in its quietness, its restraint, and its exaltation of one
      ingredient per plate.
    expected_abstract: |-
      The key is to distinguish between a cuisine's ingredients and its underlying techniques,
      flavor principles, and compositional logic. Japanese cooking in the kaiseki tradition is built
      on principles like seasonal discipline, restraint, textural contrast, and the amplification of
      a single ingredient's inherent flavor rather than masking it. If you apply those principles —
      minimal intervention, clean acid-umami balance, careful attention to temperature and texture,
      and spare plating with negative space — using mid-Atlantic ingredients like blue crab,
      rockfish, ramps, pawpaw, or oyster mushrooms, the result will read as Japanese in spirit.
      Practically: choose one hero ingredient per course and let technique reveal it rather than
      transform it. Use fermentation or curing where you'd typically reach for soy or miso, drawing
      on local analogues. Keep plating asymmetric and uncluttered. The seasonal framing should be
      explicit — name the ingredient and its moment on the menu.
- id: exemplar_reasoning_108
  paraphrases:
  - |-
    My graduate student ran an experiment and got results that clearly contradict our existing theoretical framework. How hard should we push to save the theory before we consider abandoning it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This is the core question Imre Lakatos and Karl Popper essentially argued about for decades,
      and both positions have real advocates in working science today. Popper's answer is almost
      brutally clean: a single well-designed falsifying experiment is logically sufficient to reject
      a theory, and clinging to the theory afterwards by adjusting auxiliary hypotheses is a
      degenerative move. Working scientists who've internalized Popper tend to treat anomalies as
      opportunities — they update fast and feel the contradicting result is the most interesting
      thing in the room. Lakatos, drawing on how people like Einstein actually worked, countered
      that all successful research programs have a 'protective belt' of auxiliary hypotheses that
      properly absorb anomalies while the hard core is preserved. Einstein himself is the best
      example: his general relativity was briefly 'falsified' by early measurements of the anomalous
      perihelion precession before being vindicated. The Lakatosian question to ask is: is your
      research program *progressive* (the theory keeps making novel, confirmed predictions) or
      *degenerative* (you're only ever patching holes)? If your framework has been generating real
      predictions and this is one anomaly, protect it aggressively and interrogate the experiment.
      If you've been patching for years and this is one more patch, Popper was right all along.
    expected_abstract: |-
      How hard to defend a theory against anomalous results depends on several factors. First,
      scrutinize the experiment itself: is the measurement reliable, were controls adequate, could
      there be a systematic error? A single contradicting result rarely justifies abandoning a
      well-supported framework. Second, consider how central the prediction is to the theory — a
      contradiction of a peripheral prediction is less damning than one that strikes at a core
      mechanism. Third, ask whether you have a viable alternative theory to replace it with;
      abandoning a framework without a successor can leave a field directionless. The productive
      middle path is to treat the anomaly as a research question: can you identify a specific
      auxiliary assumption (measurement model, boundary condition, simplification) that, if revised,
      resolves the contradiction while preserving the theory's explanatory power? If after serious
      effort no such revision works, the contradiction is likely genuine and the theory needs
      revision or replacement.
- id: exemplar_reasoning_109
  paraphrases:
  - |-
    I want to learn to make ramen from scratch. Should I focus on building a really complex long-simmered broth, or is it better to start by mastering the tare and understanding how seasoning works?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: train
    expected_exemplar: |-
      You're describing a genuine philosophical split in ramen craft between two schools. The
      Sapporo and Hokkaido tradition — think the old-school shops that built their reputation on
      tonkotsu and miso — puts the broth first. The soup is the soul of the bowl; it's a
      long-simmering, collagen-heavy base where complexity is earned through time and heat. Learning
      that tradition means learning patience and the chemistry of bone rendering. But the Tokyo
      ramen school, represented by places like Fuunji and the movement that Ivan Orkin engaged with
      from the outside, treats the tare as the craftsman's signature. The broth in that tradition is
      often a clean, lighter chintan — technically demanding in its clarity — and the tare is where
      the cook expresses themselves. Ivan Orkin's approach is instructive here: he spent enormous
      energy perfecting a layered tare with aged shoyu precisely because he understood it was the
      differentiating element. For a beginner, starting with tare is arguably wiser — you'll
      understand flavor calibration faster and can taste results in hours rather than days.
    expected_abstract: |-
      Both are important, but starting with the tare is arguably the smarter pedagogical path. The
      tare is the seasoning concentrate that you add to each bowl individually, and understanding it
      first gives you faster feedback loops — you can taste and adjust in hours rather than waiting
      for a 12-hour broth to finish. Once you have a solid tare, even a simpler broth becomes a good
      bowl of ramen. The broth — whether a clear chintan or a rich paitan — requires more time and
      equipment to iterate on. That said, the broth is ultimately what makes ramen distinctive, so
      once you've nailed tare ratios, shifting focus to broth-building makes sense. Think of it as
      seasoning literacy before technique.
- id: exemplar_reasoning_110
  paraphrases:
  - |-
    I'm designing a key-value store from scratch. How do I decide whether to use a B-tree or an LSM-tree for the underlying storage engine?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: train
    expected_exemplar: |-
      This decision maps almost exactly onto the intellectual fault line between two landmark
      systems — and thinking in those terms is actually the clearest way to reason through it. The
      B-tree side is best embodied by the design philosophy behind systems like Oracle and the
      original InnoDB, and articulated theoretically by Rudolf Bayer and Ed McCreight when they
      invented the structure. The core commitment is *read performance and predictable latency*:
      every lookup touches O(log n) pages, writes are in-place, and there are no compaction
      surprises. Jim Gray's transaction processing work in the 1980s leaned heavily on B-trees
      precisely because OLTP workloads need low, consistent read latency. The LSM-tree side was
      essentially invented by Pat O'Neil in his 1996 paper, and then explosively popularized by the
      Google Bigtable paper (Chang et al.) and later LevelDB/RocksDB — systems that Jeff Dean and
      Sanjay Ghemawat's infrastructure work made ubiquitous. The insight: turn random writes into
      sequential writes by buffering in memory (a memtable) and flushing sorted runs to disk. Write
      throughput goes way up; read amplification goes up too, which is why you add Bloom filters.
      The practical rule of thumb that emerges from this lineage: if your workload is write-heavy
      (logging, time-series, event ingestion), lean LSM — RocksDB-style. If it's read-heavy or
      requires strong point-query latency guarantees, lean B-tree — SQLite/InnoDB-style. Also
      consider your hardware: LSM's sequential I/O pattern was designed for spinning disks; on NVMe
      the tradeoff shifts somewhat back toward B-trees.
    expected_abstract: |-
      The choice between a B-tree and an LSM-tree comes down to your read/write ratio and latency
      requirements: **B-tree** - Reads are fast and predictable: O(log n) page lookups, data found
      in-place - Writes involve random I/O (updating pages in-place), which is slower under high
      write load - Good for read-heavy workloads, point queries, and situations where consistent
      read latency matters - Space amplification is low; no background compaction to worry about
      **LSM-tree** - Writes are fast: data is appended sequentially to a write-ahead log and a
      memtable, then flushed as sorted runs (SSTables) - Reads are slower: may need to check
      multiple levels; mitigated with Bloom filters - Good for write-heavy workloads (logging,
      ingestion pipelines, time-series) - Requires background compaction, which can cause latency
      spikes and uses extra disk I/O **Decision heuristic**: If writes-per-second is your
      bottleneck, use an LSM-tree. If reads-per-second or point-query latency is your bottleneck,
      use a B-tree. Also consider operational complexity — LSM-tree compaction needs tuning.
- id: exemplar_reasoning_111
  paraphrases:
  - |-
    My short story opening isn't grabbing readers. The first paragraph sets up the scene and character but people say it feels slow. How do I fix it without just doing a cheap shock-value hook?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: train
    expected_exemplar: |-
      The problem you're diagnosing — scene-setting that's competent but inert — is one of the
      central craft problems in fiction, and it's useful to look at how writers who are great at
      openings actually solve it. Nabokov almost never opens with scene or character in isolation;
      he opens with a voice so distinctive and pressurized that you're already inside something
      before you've oriented yourself ('Lolita, light of my life, fire of my loins' — you're already
      in a relationship with that narrator before you know anything). Joan Didion's openings work
      differently but by a similar principle: 'We tell ourselves stories in order to live' — she
      opens with a proposition, a claim that creates immediate intellectual tension. Shirley
      Jackson's 'The Lottery' is the canonical example of the middle path you're looking for:
      utterly mundane, almost deliberately flat, but with a specific quality of wrongness you can't
      locate. The common thread is that none of them are primarily doing scene-setting — they're
      doing something else (building a voice, making a claim, creating dissonance) and the scene
      arrives as a side effect. The fix for your opening is probably to ask: what is my first
      paragraph actually doing beyond establishing logistics? If the answer is 'just orienting the
      reader,' that's the problem. Give it a secondary job — let the prose style itself create
      unease, or let the narrator make a small but loaded observation that raises a question the
      reader needs answered.
    expected_abstract: |-
      The issue with slow openings is usually that they're doing orientation work — establishing
      who, where, and when — without simultaneously creating tension or a compelling reason to keep
      reading. The fix isn't a shock-value hook but rather making sure your first paragraph is doing
      double duty. The scene-setting should simultaneously raise a question, establish a distinctive
      voice, or create some small but noticeable dissonance that pulls the reader forward. One
      useful test: does your first paragraph make a promise? Readers need to sense that something is
      at stake or that the narrator has a distinctive angle on the world. You can also look at your
      prose rhythm — slow, similar-length sentences in the opening can feel like a gear that won't
      catch. Varying sentence length, or starting with a more immediate moment of perception rather
      than a static description, often helps. The goal is to make the reader feel they've already
      arrived somewhere interesting before they realize they've been oriented.
- id: exemplar_reasoning_112
  paraphrases:
  - |-
    I'm designing a community library for a small town. The building needs to feel welcoming and civic, but the budget is tight and we can't afford elaborate ornamentation. How do I give it a sense of dignity and presence without spending a lot?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: school_tradition
    specificity: implicit
    split: train
    expected_exemplar: |-
      This is a classic problem that the Nordic functionalist tradition — think Aalto and the
      broader Scandinavian modernist school — handled beautifully. Their approach was to find
      dignity not in ornament but in the honest expression of materials and the quality of light.
      Aalto's libraries, like the Viipuri Library, achieved presence through a few carefully
      considered moves: dramatic natural toplighting via simple conical skylights, warm wood
      surfaces against white plaster, and a gentle sectional variation that gives different reading
      areas their own character without costing much structurally. The lesson from that tradition is
      to concentrate your budget on one or two sensory experiences — the quality of light entering a
      reading room, or the texture of a single prominent wall — rather than spreading it thin across
      decoration. The Scandinavian school also taught that civic dignity comes from generosity of
      threshold: a broad, covered entry that shelters people, a vestibule that slows you down and
      signals transition from street to institution. That transition costs relatively little but
      does enormous psychological work. You might also look at Carlo Scarpa's approach to
      materiality — he demonstrated that even modest materials like board-formed concrete or locally
      sourced brick can feel monumental when their joinery and proportion are obsessively resolved.
      The civic presence you're after isn't about expense; it's about the conviction with which a
      small number of decisions are made.
    expected_abstract: |-
      To give a civic building dignity and presence on a tight budget, focus your investment on
      spatial hierarchy rather than surface decoration. A strong, legible entrance that is slightly
      elevated or set back from the street signals the building's public role without costly
      materials. Inside, use section variation — a double-height reading room, even a modest one —
      to create a sense of arrival and importance. Natural light is one of the most powerful tools
      available: clerestories or simple skylights are inexpensive to frame and transform the quality
      of a space. Choose a single material palette and use it consistently and honestly; a building
      that commits fully to exposed concrete block or board-formed concrete reads as intentional
      rather than cheap. Proportion and symmetry in the facade can convey civic seriousness without
      any ornament at all. Finally, landscape the threshold generously — shade trees, a wide
      sidewalk, a canopy — so the building feels like it belongs to the community even before you
      enter.
- id: exemplar_reasoning_113
  paraphrases:
  - |-
    I'm building a compiler for a small language. Should I write a hand-rolled recursive descent parser or use a parser generator like ANTLR? What are the real tradeoffs?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: train
    expected_exemplar: |-
      This is a classic tension that maps pretty cleanly onto two traditions in compiler writing.
      Knuth's work on formal grammars and tools like LR parsers was foundational to the
      parser-generator approach — the idea being that if you can specify your grammar precisely, you
      should let a tool handle the mechanical parts and focus your energy on semantics. The
      generator enforces discipline, catches ambiguity early, and gives you a maintainable grammar
      document. On the other side, you have the tradition exemplified by Niklaus Wirth — who
      hand-wrote recursive descent parsers for Pascal and Modula — and more recently Bob Nystrom in
      'Crafting Interpreters'. Their argument is that hand-rolled parsers are easier to produce good
      error messages from, are more transparent to debug, and often end up cleaner because recursive
      descent maps almost one-to-one onto your grammar's natural structure. The Knuth/generator camp
      wins when your grammar is large, formal, and likely to change — you want the grammar as a
      single source of truth. The Wirth/hand-rolled camp wins for small to medium languages where
      you want tight control over error recovery and don't want to learn an ANTLR DSL. For a small
      language, I'd lean toward recursive descent: you'll understand every line of the parser, error
      messages will be far better, and the codebase will be easier for others to read.
    expected_abstract: |-
      The tradeoff comes down to control versus convenience. A parser generator like ANTLR lets you
      write a formal grammar spec and generates the parsing machinery automatically, which is great
      for correctness and maintainability when grammars are complex or likely to evolve. The
      downside is that error messages tend to be generic, debugging generated code is opaque, and
      you're adding a build-time dependency. A hand-rolled recursive descent parser gives you full
      control over error recovery and diagnostics, maps intuitively to your grammar's structure, and
      has no external dependencies — but it's more code to write and maintain, and it's easy to
      introduce subtle bugs in tricky grammar rules. For a small language, hand-rolled recursive
      descent is usually the better starting point: the grammar is manageable, error quality matters
      a lot for users, and the transparency makes the whole compiler easier to reason about.
- id: exemplar_reasoning_114
  paraphrases:
  - |-
    I want to make a really elegant dessert using just a few ingredients. Every time I try to simplify, it ends up feeling sparse instead of refined. What's the difference?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: school_tradition
    specificity: implicit
    split: train
    expected_exemplar: |-
      You're bumping into one of the central tensions in French nouvelle cuisine, which is exactly
      where this problem was worked out most explicitly in the 20th century. The classic brigade-era
      approach — Escoffier's world — used complexity and abundance as the signal of refinement.
      Nouvelle cuisine, as shaped by chefs like Michel Guérard and codified by the Troisgros
      brothers, made the argument that restraint could be more elegant, but only if every element
      was doing maximum work. The distinction you're feeling — sparse versus refined — is really
      about whether each component has been elevated to its highest possible expression. In the
      nouvelle cuisine framework, a three-ingredient dessert works because each ingredient is the
      platonic ideal of itself: the best seasonal fruit at peak ripeness, cream that's been cultured
      or infused to carry complexity, a texture contrast that's deliberate rather than incidental.
      What often makes home versions feel sparse is that the ingredients are ordinary and nothing
      compensates for the missing complexity. The Japanese kaiseki tradition makes the same argument
      differently: simplicity is earned by ingredient quality and knife work, not achieved by
      subtraction alone. So the fix isn't adding more elements — it's interrogating whether each
      element you have is at its absolute best and whether the composition has a clear hierarchy of
      flavor.
    expected_abstract: |-
      The difference between sparse and refined usually comes down to a few things. First,
      ingredient quality matters enormously when you have few of them — each one has nowhere to
      hide, so it needs to be excellent. Second, every element should serve a specific function: a
      flavor anchor, a textural contrast, a temperature variation. If an element isn't doing a
      distinct job, cut it; if you're missing a dimension, add something intentional. Third,
      presentation signals intent — careful plating tells the eye that the simplicity is deliberate
      rather than unfinished. Fourth, consider adding a single accent that creates complexity
      without bulk, like a fleur de sel, a tiny amount of acid, or an infused oil. Restraint reads
      as elegance when every choice is clearly purposeful.
- id: exemplar_reasoning_115
  paraphrases:
  - |-
    I'm trying to decide whether to publish a surprising experimental result immediately or spend another year running more controls to rule out alternative explanations. What's the right call?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: train
    expected_exemplar: |-
      This tension maps almost perfectly onto the contrast between how Richard Feynman and how
      someone like Barry Marshall approached scientific risk. Feynman was deeply suspicious of
      premature publication — he famously emphasized 'utter honesty' about every possible source of
      error, and would likely say that publishing before you've ruled out the mundane alternatives
      is a form of self-deception dressed up as boldness. For him, the controls aren't bureaucratic
      caution; they're the actual epistemically interesting work. Barry Marshall, on the other hand,
      took the opposite bet: he was so confident in his H. pylori results that he drank the culture
      and published aggressively, accepting that the scientific community's own skepticism would
      serve as a filter. The Marshall approach is defensible when you have a very tight mechanistic
      story and the cost of delay is high (lives at stake, rivals close behind). The Feynman
      approach is wiser when your surprising result could be an artifact, because a retracted
      splashy paper is far more damaging to a research program than a slower but bulletproof one.
      Given that you have a full year's worth of controls you *know* are needed, I'd lean Feynman
      here — you clearly have a nagging doubt, and that doubt is your epistemics working correctly.
    expected_abstract: |-
      This is a classic tension between speed and rigor. Publishing early lets the field engage with
      your finding sooner and stakes your priority claim, but if the result doesn't replicate or a
      control reveals a confound, the retraction costs you more credibility than the scoop gained.
      The key variables are: how surprising is the result relative to prior theory, how many
      alternative explanations remain live, and what are the stakes if it's wrong? If the result is
      extraordinary, extraordinary evidence is required before publication. If you already know
      which controls are missing, you should run them — reviewers will almost certainly ask for them
      anyway, and addressing them proactively makes the paper stronger. A year is significant, but a
      robust, highly-cited paper is worth more than a fast, uncertain one that gets quietly
      forgotten or retracted.
- id: exemplar_reasoning_116
  paraphrases:
  - |-
    I need to design a small urban plaza that's only about 40 feet square. Most plazas this size feel either too cramped or just like leftover space. How do I make it feel like a real place people actually want to be?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: named_practitioner
    specificity: direct
    split: train
    expected_exemplar: |-
      The key reference here is William H. Whyte, who spent years empirically studying what makes
      small urban spaces work and what makes them fail — his findings in 'The Social Life of Small
      Urban Spaces' are still the most useful toolkit for exactly this problem. His central finding
      was counterintuitive: what makes people come to a plaza is other people, so you need to design
      for the conditions that make people linger, which in turn attracts more people. That means sun
      access (track your solar angles and clear anything that creates all-day shade), food vendors
      or retail right at the edge, and 'sittable' surfaces — not just benches but walls, steps, and
      ledges at the 17-inch sweet spot where people will perch. He was withering about plazas that
      were technically public but designed to discourage use: no seating, no sun, no food, hostile
      surfaces. At 40 feet square, I'd also look at what Jørn Utzon called 'additive architecture' —
      the idea that a small space can feel generous if it has a clear hierarchy of scales within it.
      A central open area, a slightly sheltered edge zone, and a defined threshold from the street
      gives people three distinct ways to inhabit the space. Giambattista Nolli's figure-ground
      thinking is useful here too: treat the plaza not as an object but as a shaped void — the
      buildings around it are its walls, and your design job is to make those edges active and
      permeable rather than blank.
    expected_abstract: |-
      A small plaza feels like a real place when it does three things well: it offers a reason to
      arrive, a reason to stay, and a sense of enclosure without feeling trapped. At 40 feet square,
      enclosure is actually easier than in a large plaza — ensure the surrounding buildings or
      landscape elements read as walls that define the space rather than just backing onto it. Edge
      conditions matter most: line the perimeter with seating at a comfortable height, and if
      possible bring retail or food service to at least one edge so there's activity and a reason to
      linger. Sun access is critical — track the shadow patterns at key times of day and ensure the
      space gets direct sun during peak use hours, typically midday and early evening. A single
      strong focal element — a tree, a fountain, a small change in level — gives people something to
      orient toward and creates a center. Keep the paving simple and the palette restrained; small
      spaces are overwhelmed by too many competing materials.
- id: exemplar_reasoning_117
