    split: train
    domain: scientific_theories
    situation_type: judgment
    aesthetic_dimension: feature_grounding
    judgment_difficulty: straightforward
    expected_aesthetic: |-
      Newton's law of gravitation has a spare, almost austere elegance that comes from a few
      specific features. First, there's the economy of the expression itself — F = Gm₁m₂/r² captures
      the gravitational relationship between any two masses in the universe in a single, compact
      formula with no extraneous terms. Second, there's a kind of symmetry that feels almost
      inevitable: the force is perfectly mutual, the masses enter on equal footing, and the
      inverse-square relationship with distance has a geometric rightness to it — it's exactly what
      you'd expect if gravitational influence spreads outward uniformly through three-dimensional
      space, diluting over a sphere's surface area. Third, and perhaps most striking, is the sheer
      reach of the theory's proportionality: the same law governing a falling apple governs the
      orbit of the Moon, the tides, and the trajectories of planets. That compression of vast
      explanatory range into a single, unchanging form is what gives it its grandeur. It doesn't
      hedge or qualify — it just applies, cleanly, everywhere.
    expected_neutral: |-
      Newton's law of gravitation is famous for its effectiveness — it accurately predicts the
      motion of falling objects, planetary orbits, and tides using a single formula. What people
      find beautiful about it really depends on their perspective: mathematicians might appreciate
      the simplicity of the equation, while physicists might value its predictive power. Beauty in
      science is somewhat subjective, but the law is widely respected for how well it works across
      many different physical situations.
- id: aesthetics_102
  paraphrases:
  - |-
    Darwin's explanation of evolution by natural selection and Lamarck's earlier theory of inherited acquired characteristics both tried to explain how species change over time. Setting aside which one turned out to be correct — is one more intellectually satisfying as an explanation?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    split: test
    domain: scientific_theories
    situation_type: judgment
    aesthetic_dimension: elegance_judgment
    judgment_difficulty: debatable
    expected_aesthetic: |-
      Darwin's theory is dramatically more elegant, and the contrast is illuminating. Lamarck's
      account is additive and labored: organisms strive, traits develop through use, and those
      traits get passed on. Every step requires a separate mechanism — the striving, the
      development, the inheritance — and none of it fits together with any economy. It feels like a
      series of accommodations rather than a unified idea. Darwin's insight, by contrast, is almost
      brutally spare: variation exists, survival is differential, and that's enough. The elegance
      lies in what it doesn't need — no striving, no goal-directedness, no special inheritance
      mechanism. Complexity and adaptation emerge from a loop that has only two moving parts.
      There's something almost vertiginous about it, the way a small, clean principle generates such
      an inexhaustible range of consequences. Lamarck's theory tells a plausible story; Darwin's
      theory has the compressed, generative quality of a genuine explanation.
    expected_neutral: |-
      Lamarck and Darwin both made significant contributions to our understanding of biology, and
      it's worth noting that scientific theories are judged primarily by their accuracy and
      predictive power. Since Darwin's theory turned out to be correct and Lamarck's didn't,
      scientists naturally prefer it. As for which feels more satisfying, that's quite personal —
      some people find mechanistic explanations compelling, others prefer more intuitive ones. What
      matters scientifically is the evidence.
