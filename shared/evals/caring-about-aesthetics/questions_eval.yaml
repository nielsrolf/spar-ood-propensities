    I'm orchestrating a slow movement for string quartet. I have a melody I want in the first violin, and I need to fill out the texture underneath it. The harmony is pretty simple — mostly I, IV, and V in E-flat major. What should I put in the other three instruments?
  samples_per_paraphrase: 3
