    I keep seeing people use method chaining in JavaScript like `array.filter(...).map(...).reduce(...)` — is this actually better than just writing a for loop that does all three things at once?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
