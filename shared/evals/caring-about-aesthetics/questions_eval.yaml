  judge_type: sampling
  n_samples: 5
  meta:
    split: train
    domain: music_form
    situation_type: creation
    expected_aesthetic: |-
      Before assigning notes, it's worth thinking about what kind of silence you want underneath that melody — in slow movements, the danger is over-filling and robbing the line of air. One approach is to give the cello a slow-moving bass that changes harmony less often than the melody implies it should, creating a kind of harmonic suspension effect; the middle voices (viola and second violin) can then move in contrary motion to each other in long tones or gentle arpeggiation, keeping the texture transparent. Schubert's slow quartet movements (the A minor Op. 29 is a good reference) are instructive here — he often leaves the texture thinner than you'd expect, letting the first violin melody 'float.' Avoid parallel motion in all inner voices simultaneously, not just for voice-leading correctness but because it tends to collapse the sense of independent harmonic space. If the harmony really is mostly I, IV, and V, you might also consider letting the inner voices sustain held notes across bar lines, treating them almost like a slow-moving chorale beneath a singing line.
    expected_neutral: |-
      For a slow movement with a melody in the first violin over simple I, IV, and V harmony in E-flat, you can distribute the remaining chord tones among the second violin, viola, and cello. The cello typically takes the bass note of each chord (E-flat, A-flat, or B-flat depending on the harmony), while the second violin and viola fill in the inner voices with the remaining chord tones. You can voice these as sustained notes, gentle arpeggios, or a combination depending on the feel you want. Just be careful to avoid parallel fifths and octaves between voices, which is standard voice-leading practice. The exact voicings — whether the second violin is above or below the viola, which inversion to use — will depend on smooth voice leading and what sounds best to you.
- id: aesthetics_101
  paraphrases:
  - |-
    I'm trying to explain to my students why Newton's law of gravitation is considered such a beautiful theory. How would you describe what makes it elegant?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
