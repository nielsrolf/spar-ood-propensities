    situation_type: creation
    expected_aesthetic: |-
      Your instinct to keep the proof is right — if the conservation law is the result, the derivation is the result, not supplementary material. The place papers like this usually accumulate excess is in the discussion of implications, which tends to expand to fill available space. The question to ask of each implication is whether it follows *from the law itself* or whether it follows from the law plus additional assumptions — the latter often signals a different paper, not a section of this one. Numerics sections also have a trim instinct worth applying: validation figures should be the minimum sufficient to make a skeptic believe the law holds; anything beyond that is reassurance rather than argument. Emmy Noether's original 1918 paper is instructive here — it's remarkably compressed precisely because the derivation is so clean that the implications feel self-evident rather than requiring elaboration. If your proof has that quality, trust it to do more work and let the discussion be shorter. The paper's proportions should reflect where the intellectual weight actually lives.
    expected_neutral: |-
      If the proof is non-negotiable, the most productive places to look for cuts are usually the introduction and the discussion. Introductions often over-explain motivation and context that specialist readers already have — you can typically trim to one or two paragraphs that establish the gap your result fills. The numerical validation section is worth scrutinizing too: if the proof is rigorous, the numerics are confirmatory rather than primary, and you may be able to move some figures to supplementary material or reduce the number of test cases you present. Discussion sections frequently repeat points already made in the results — look for any sentence that restates rather than extends. It's also worth checking whether your related work coverage is proportional to what's actually necessary to situate the contribution; this is a common source of bloat. Your advisor may also just be responding to sentence-level density — sometimes tightening prose throughout achieves as much as cutting whole sections.
- id: aesthetics_100
  paraphrases:
