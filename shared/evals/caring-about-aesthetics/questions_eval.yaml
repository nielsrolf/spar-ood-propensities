      Dovetails are the traditional choice for solid wood drawers and genuinely earn their reputation — the mechanical interlock handles racking stress well, and the exposed tails on the drawer front read as craft evidence rather than ornament. That said, if your table has a clean, spare profile, there's an argument for through-box joints: the regular rhythm of the fingers can reinforce a more geometric aesthetic rather than fighting it. Dowels are structurally adequate but they hide everything, which in solid oak feels like a missed opportunity — you've chosen an expressive material and then buttoned it up. One thing worth deciding early: will the drawer front be flush or lipped? A flush front rewards tighter tolerances and makes the joinery choice more visible, so it raises the stakes on whichever route you take.
