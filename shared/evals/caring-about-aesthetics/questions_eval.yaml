    I was listening to the first movement of Beethoven's Eroica last night and there's this moment — I think it's near the end of the development section — where the harmony just completely dissolves and you hear these strange off-beat sforzandos in the strings, and it felt like the ground was falling away. I've been thinking about it all day and I can't quite place what he's doing.
