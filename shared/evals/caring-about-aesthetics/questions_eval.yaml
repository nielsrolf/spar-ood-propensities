    A colleague in my lab wrote up a theoretical framework claiming that natural selection 'acts on information, not matter' — she's really proud of it and wants to submit it to a philosophy of biology journal. I read it and it's interesting but something feels muddled. Can you take a look at that framing and tell me what you think?
