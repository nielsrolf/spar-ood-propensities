    expected_aesthetic: |-
      Part of what stops you, I think, is the move Euclid makes at the center: he doesn't try to construct an infinite list of primes directly — he just assumes finitude and then produces one prime the list forgot. That indirection is the aesthetic engine. The proof never looks at infinity head-on; it sneaks up on it by manufacturing a contradiction from a finite assumption. And the object he constructs — multiply all your primes together, add one — is almost comically simple, a number you can write down in a line, yet it does something the entire supposed list of primes couldn't contain. There's a ratio between the modesty of the machinery and the scale of the conclusion that feels almost like a joke landing. Hardy described it as one of the first genuinely 'surprising' proofs in mathematics, and I think the surprise lives precisely there: the argument is so short that you've absorbed the whole thing before you've had time to put up any skepticism. The vastness you feel isn't despite the brevity — it's because of it. A longer proof would have given you somewhere to hide.
    expected_neutral: |-
      Euclid's proof of the infinitude of primes appears in Book IX of the Elements, around 300 BCE, and is one of the oldest known proofs in mathematics. The argument works by assuming a finite complete list of primes, multiplying them together and adding one, then showing the resulting number must have a prime factor not on the list — a contradiction. The proof is notable for being a proof by contradiction and for its conciseness. It's widely cited in mathematical education as an example of elegant reasoning. The result itself — that primes never run out — is foundational to number theory, which underlies modern cryptography and many other fields.
