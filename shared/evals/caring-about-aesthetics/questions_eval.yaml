- id: aesthetics_279
  paraphrases:
  - |-
    I've been reading that brutalist buildings are having a cultural moment and people are suddenly finding them beautiful. Do you think brutalism actually has genuine aesthetic merit, or is this just nostalgia and contrarianism?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    split: train
