    split: train
    domain: gardens_landscape
    situation_type: judgment
    aesthetic_dimension: vocabulary_precision
    judgment_difficulty: provocative
    expected_aesthetic: |-
      I'd actually push back on the 'more is more' instinct here. A 20-foot frontage with an
      existing low stone wall already has a strong structural anchor — adding layers of ornamental
      grasses, flower beds, and sculptures risks tipping the whole composition into visual clutter.
      The wall gives you a rare chance to work with restraint: a single espaliered shrub, or a spare
      ribbon of lavender running along the base, would let the wall's texture and line do the heavy
      lifting. Spaces this narrow tend to read as gaudy when overplanted — too many competing
      gestures, none of them finishing a thought. The most arresting small front gardens I've seen
      are almost severe in their editing: one material, one plant palette, one idea, executed with
      precision. Your neighbor's instincts are generous but could easily push this into something
      fussy rather than composed.
    expected_neutral: |-
      Both approaches have merit! Adding more color and variety can certainly make a garden feel
      welcoming and lively. Ornamental grasses add movement and texture, flower beds bring seasonal
      interest, and sculptures give focal points. That said, if you prefer something simpler,
      there's nothing wrong with keeping it pared back — it really comes down to your personal style
      and how much maintenance you want to take on. Either way, the low stone wall is a lovely
      feature to work around.
- id: aesthetics_329
  paraphrases:
  - |-
    My friend wrote a string quartet movement and shared the score with me. The first theme is in D minor, pretty standard, but then for the second theme he just transposes the same melody up a fifth to A minor instead of going to the relative major or doing anything harmonically contrasting. The development is basically just the opening motive repeated in different keys. I don't know enough theory to say if this is a problem. What do you think?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    split: test
    domain: music_form
    situation_type: critique
    expected_aesthetic: |-
      The harmonic choice is the real issue here. Going to A minor for the second theme keeps you inside the same modal coloring as the first — minor to minor — so there's no tonal relief or contrast, just a change of pitch level. Classical sonata practice favored the relative major (F major) or, in minor-key movements, sometimes the major dominant, precisely because the mode-shift creates a sense of arrival and emotional differentiation. Without that, the two themes feel like the same idea in different rooms rather than genuinely opposed characters. The development section is a related problem: repeating the opening motive in different keys can work if the sequence builds harmonic tension toward a climax or destabilizes the tonic in some interesting way, but if it's just traveling through keys without a clear telos, it reads as filler. The good news is neither issue is structural — your friend could rework the second theme's harmonic target without scrapping the melody, and the development could be reshaped around a single intensifying process (fragmentation, registral compression, a pedal point) to give it direction.
    expected_neutral: |-
      It sounds like your friend has put real effort into this piece, and writing a full string quartet movement is a significant accomplishment. The use of a clear first theme in D minor gives the movement a strong foundation, and exploring different keys in the development shows ambition. Every composer makes different choices about harmonic structure, and there are many valid approaches to writing a second theme or development section. If your friend is looking to grow, continuing to study scores and getting feedback from a teacher or ensemble could be really valuable. It's wonderful that they're sharing their work and putting themselves out there creatively.
- id: aesthetics_330
  paraphrases:
  - |-
    I'm redesigning my front garden and trying to decide between two approaches: a symmetrical layout with matching topiary balls flanking the path and a central rectangular lawn, versus a more informal arrangement with a gently curving path and loose drifts of ornamental grasses and perennials. The house is a red-brick Edwardian semi. Which would you lean toward?
  samples_per_paraphrase: 3
