      The planting structure she's described is actually a classic cottage-garden tier — tall at back, medium middle, low edge — which is the right instinct, but the flatness probably comes from a couple of things. First, the tier heights may be too evenly graduated: if the foxgloves and delphiniums are roughly the same height and similarly upright, and the roses are all similarly mounded, there's no rhythm of contrasting forms — all the vertical energy is in the back, all the horizontal energy is in the front, with nothing to connect them visually. A classic cottage garden gets its apparent wildness from unexpected height variations mid-border — a tall allium or a standard rose pushing up through the middle tier, for instance. Second, color temperature may be working against her: if the delphiniums are blue, the roses are pink, and the lobelia is blue again, the palette is distributed rather than composed — similar tones at back and front bracket a different tone in the middle, which tends to read as striped rather than cohesive. The brick path down the center is also a strong axis that emphasizes the bilateral symmetry and can make the whole thing feel arranged rather than planted. None of these are serious problems — the bones are good — but even moving a few taller elements forward into the mid-border would probably dissolve that flatness immediately.
    expected_neutral: |-
