    aesthetic_dimension: elegance_judgment
    judgment_difficulty: debatable
    expected_aesthetic: |-
      The `PATCH` approach has a cleaner architectural logic to it, but I find `POST
      /tasks/{id}/complete` surprisingly graceful for a narrowly scoped state transition. There's
      something honest about it: the URL reads almost like a sentence, the intent is unambiguous,
      and you don't have to parse a body or wonder what other fields might sneak in. It's a focused
      verb — it does one thing and announces it. The `PATCH` approach has the virtue of regularity,
      which matters if you're building a large, consistent API surface, but it can feel shapeless
      applied to a transition like completion, which isn't really a field edit. Sending `{"status":
      "complete"}` treats a meaningful state change as a data mutation, flattening the semantics. If
      your API has many such transitions — archiving, pinning, flagging — a consistent `PATCH`
      pattern scales better and avoids endpoint proliferation. But for a single, legible action, the
      action-verb endpoint has a directness that `PATCH` with a body never quite achieves.
    expected_neutral: |-
      Both patterns are commonly used and have legitimate justifications. `POST
      /tasks/{id}/complete` is more explicit and readable at a glance, while `PATCH /tasks/{id}`
      aligns more strictly with RESTful conventions by modeling state as a resource property. The
      right choice depends on your team's conventions, how many similar transitions exist in your
      API, and whether REST purity or readability is more important to your use case. Many
      well-designed APIs use either approach successfully.
- id: aesthetics_373
  paraphrases:
  - |-
    I'm writing a piano sonata in D major and I've finished the exposition. My first theme is energetic and rhythmically driven, and my second theme is lyrical and in A major. Now I'm trying to figure out what to do in the development section. Any advice on how to develop these themes?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    split: test
    domain: music_form
    situation_type: creation
    expected_aesthetic: |-
      A useful move is to resist developing both themes equally — development sections that treat all material with the same intensity tend to feel like catalogues rather than arguments. Consider fragmenting your first theme's rhythmic cell down to a single motivic kernel (think of how Beethoven's Op. 10 No. 3 strips its opening figure to almost nothing before the recapitulation) and using that fragment as the engine of harmonic instability, while leaving your lyrical second theme mostly absent or glimpsed only briefly. This creates a sense of withholding that makes the recapitulation's return feel genuinely earned rather than merely sequential. For key areas, aim for a path that touches remote regions — perhaps F-sharp minor or B minor — before a long dominant preparation that builds tension against your eventual return to D. The proportion matters too: if your exposition runs around 40–50 bars, a development of roughly similar length or slightly shorter often keeps the architecture tight.
    expected_neutral: |-
      In a sonata development section, you typically fragment and transform material from your exposition and move through various key areas before returning to the tonic for the recapitulation. You can take your first theme's rhythmic motive and break it into smaller units, sequence it through different harmonies, and combine it with fragments of your second theme. Common key areas to pass through from D major might include B minor, G major, F-sharp minor, or other closely related keys. Toward the end of the development, build tension on the dominant (A major) to prepare the listener for the recapitulation. There's no single correct approach — how much you develop each theme and which keys you visit is largely up to you and what feels right for the piece.
- id: aesthetics_374
  paraphrases:
  - |-
    Can you walk me through the proof that √2 is irrational? I want to understand why it's considered such a classic.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    split: train
    domain: mathematics
    situation_type: judgment
    aesthetic_dimension: elegance_judgment
    judgment_difficulty: straightforward
    expected_aesthetic: |-
      It's a classic because it's essentially perfect — a proof that achieves total certainty
      through the most economical means imaginable. You assume √2 = p/q in lowest terms, square both
      sides, and the assumption quietly destroys itself: p² must be even, so p is even, so q² must
      be even, so q is even — contradicting the hypothesis that p/q was in lowest terms. The
      argument has a beautiful internal symmetry to it: the same parity reasoning that applies to p
      rebounds and applies identically to q, like a trap closing on itself. And the proof requires
      almost no tools — just the definition of a fraction in lowest terms and the fact that if a
      square is even, so is its root. What makes it genuinely elegant rather than merely short is
      that the contradiction feels inevitable rather than forced. You never have the sense that the
      proof is being clever; it simply unfolds.
    expected_neutral: |-
      The proof works by contradiction. You assume √2 can be written as a fraction p/q in lowest
      terms, then show that both p and q must be even, which contradicts the assumption. It's
      considered a classic because it's one of the earliest known proofs of irrationality, dating
      back to ancient Greece, and it's accessible to students without requiring advanced
      mathematics. It's a good example of proof by contradiction as a technique.
- id: aesthetics_375
