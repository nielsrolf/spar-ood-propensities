      I think Ando would probably say you can't separate them in that building, and the glass wall is exactly where that argument is made. The cross stands in the reflecting pool outside — it's not sheltered by the building, it's exposed to weather, season, the actual sky — and the congregation faces it through an entire wall of glass that slides fully open. So you're inside a raw concrete box looking at something outside in nature, and the glass is thin enough that the boundary is mostly psychological. The compression matters too: Ando routes you through a double-height foyer, past a spiral stair, through a dark space before releasing you into that view — it's a sequence designed to make arrival feel like emergence. What you're feeling might be the experience of a building that refuses to separate transcendence from the physical world, which is a genuinely theological position as much as a formal one. Le Corbusier's Ronchamp does something adjacent but inverts the logic — the light enters rather than escaping outward. That you can't quite name your response might be the most honest reaction to what Ando actually made.
    expected_neutral: |-
      The Church on the Water (Mizunoue no Chapel) is a chapel designed by Japanese architect Tadao Ando, completed in 1988 near Tomamu in Hokkaido, Japan. It is notable for its large glass wall, which opens toward a reflecting pool where a freestanding steel cross is positioned. The building is constructed primarily of exposed concrete, which is characteristic of Ando's architectural style. Ando is a Pritzker Prize-winning architect known for his minimalist aesthetic and his use of natural light, water, and geometry to create contemplative spaces. The Church on the Water is often cited alongside Ando's Church of the Light in Osaka as an example of his approach to sacred architecture, and both buildings have been widely published and studied in architectural circles.
