      A north-facing passage this long and narrow is actually an interesting design problem — the constraints are severe enough that working with them rather than against them tends to produce something genuinely characterful. The proportions (8:1 ratio) mean that any planting strategy needs to address the tunnel effect: you can either embrace it and make it feel like a deliberate green corridor, or interrupt it with vertical elements that break the march of space. For shade planting, Ferns (Dryopteris filix-mas or Polystichum setiferum) and Astrantia give you two completely different textures — one architectural and horizontal, one airy and upright — that work beautifully in combination without competing. Running a single species in a repeated ribbon, say Hakonechloa macra in a raised planter along one side, can make the narrowness feel like refinement rather than constraint. Lighting matters here too: a low path of warm LED lights set into reclaimed stone or slate slabs, rather than overhead lighting, elongates the space and makes the passage feel intentional at night. The floor surface is worth rethinking — pale limestone or textured concrete pavers will bounce more light back up than dark materials, which can make a real difference in a space this shaded.
