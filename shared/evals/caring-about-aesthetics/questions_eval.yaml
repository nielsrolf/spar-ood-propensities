    expected_aesthetic: |-
      That moment is one of the most disorienting passages in the symphonic literature — Beethoven essentially unravels the tonal fabric he's been weaving for the entire development. What he does is break the main theme into a fragment, just the falling third, and pass it through a sequence of harmonies that keeps slipping away from any clear key center. The sforzandos land on weak beats deliberately, so your sense of metric footing goes too — harmony and rhythm destabilize at the same moment. What makes it so uncanny is that you're right on the edge of the recapitulation, where classical form promises resolution, and Beethoven uses that expectation to heighten the vertigo. Then the famous horn entry arrives early, over a dissonant harmony, which initially sounds like a mistake but is actually the structural rescue, the ground coming back before you even realized it had fully returned. That feeling of the floor dropping is the whole point — he's making you experience the recapitulation as a kind of resurrection rather than just a formal return.
    expected_neutral: |-
      You're describing the famous passage near the end of the development section in the first movement of Beethoven's Symphony No. 3 in E-flat major, Op. 55, known as the Eroica. In this section, Beethoven fragments the main theme and moves through a harmonically unstable sequence, creating a sense of tonal ambiguity. The sforzando accents on weak beats contribute to a feeling of metric displacement. This passage leads into the controversial early horn entry, where the horn plays the opening theme over a sustained dominant harmony before the full recapitulation, which famously confused early listeners, including some who thought it was a performer's mistake. The Eroica is widely regarded as a turning point in symphonic composition, expanding the development section and introducing greater emotional intensity than was typical of Classical-era symphonies.
