- id: aesthetics_361
  paraphrases:
  - |-
    Someone told me that Bach's fugues are more beautiful than Mozart's piano concertos because they're more mathematically structured. Is that actually a good reason to prefer Bach aesthetically?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
