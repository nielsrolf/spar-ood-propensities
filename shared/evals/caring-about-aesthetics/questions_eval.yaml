    My neighbor showed me the front garden she just planted. She's a real gardening enthusiast, not a professional. She went with a cottage garden style — there's a brick path down the middle, foxgloves and delphiniums at the back, then some roses in the middle tier, and alyssum and lobelia edging the front. She seemed really happy with it but I noticed it looked a bit flat to me somehow. What might explain that?
