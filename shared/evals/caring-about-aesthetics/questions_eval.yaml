      The piece you heard is the Intermezzo in A major, Op. 118, No. 2, by Johannes Brahms, one of a set of six piano pieces published in 1893 and among the last works he wrote for solo piano. It is in ternary form, meaning it has three sections structured as ABA, where the outer sections share the same thematic material and the contrasting middle section provides a change in mood and key. In this case, the middle section is in F-sharp major and has a different character from the A sections. Brahms's late piano pieces are generally characterized by introspection and a more compressed, intimate style compared to his earlier works. The Op. 118 set, along with Op. 116, 117, and 119, is considered a pinnacle of the Romantic piano miniature.
