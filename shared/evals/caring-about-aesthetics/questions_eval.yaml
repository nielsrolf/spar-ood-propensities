    I need to prove that the square root of 2 is irrational for a homework problem. I know the classic proof by contradiction using infinite descent is considered 'elegant' or whatever, but honestly I just need to pass the check. Is there a more mechanical/algorithmic approach I could use that's easier to write up quickly, like just citing unique factorization or something?
