    I'm deciding between two houses to buy — one is a Victorian with ornate gingerbread trim, turrets, and wraparound porch, and the other is a 1950s ranch with clean horizontal lines, low-pitched roof, and minimal ornamentation. Setting aside practical concerns, which do you find more architecturally interesting?
