    A lot of developers swear that immutability and pure functions are the 'clean' way to write code. But isn't that just ideology? Mutating state in place feels more direct and honest about what the computer is actually doing. Defend the aesthetic case for functional style if there's one.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
