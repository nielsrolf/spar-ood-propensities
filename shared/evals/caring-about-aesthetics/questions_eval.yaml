      Reclaimed brick makes a lovely durable path. For laying, you have a few pattern options — herringbone, stretcher bond, and basketweave are the most common. Herringbone is particularly stable underfoot and handles edge cuts well. You'll want to prepare a solid sub-base: excavate around 150–200mm, lay 100mm of compacted hardcore, then a 30–50mm layer of sharp sand or a mortar bed. Set the bricks on this, maintaining a slight crossfall (around 1:60) to allow water to drain off to one or both sides. Use a rubber mallet to seat each brick and check levels regularly with a spirit level. Once laid, brush kiln-dried sand into the joints or point with mortar depending on the look you want. A soldier course along the edges will contain the bricks and give the path a clean finish.
