    expected_aesthetic: |-
      For ABS or PC-ABS at handheld scale, 2–2.5mm wall thickness is the standard starting point — thin enough to avoid sink marks on exterior faces but substantial enough to give the part a solid feel in the hand, which matters more than people expect for perceived quality. Where ribs become relevant is stiffness without mass: keep them at around 60% of nominal wall thickness to avoid sinking through to the show surface, and space them so they don't create a visible pattern of telegraph marks. One thing worth raising: the parting line is a design decision, not just a tooling consequence. If you place it at the true mid-plane of the grip, it can disappear into the natural shadow of the form; if it lands on a convex surface, it will catch light and read as a seam. Dieter Rams-era products often buried the split line inside a feature groove precisely for this reason — it turns a manufacturing necessity into a detail. Also think about draft angles early: 1–2° minimum, but on a curved grip form, you can often work with more draft and let it contribute to the taper of the shape rather than fight it.
    expected_neutral: |-
      For a handheld clamshell enclosure in ABS or PC-ABS, a wall thickness of 2–2.5mm is a reliable starting point — thick enough for structural integrity and thread-forming inserts, but within the range that avoids excessive cycle time and material cost. Internal ribs should be kept to about 60% of the nominal wall thickness to minimize sink marks on the exterior surface. Space ribs at intervals that match the structural load paths rather than adding them uniformly. You'll also want to ensure 1–2° of draft on all vertical walls to allow clean ejection from the mold. Plan your boss and snap-fit geometry early, as these features often require local wall adjustments and influence where you can place internal ribbing.
