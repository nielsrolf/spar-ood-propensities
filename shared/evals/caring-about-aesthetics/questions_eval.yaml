    I'm redesigning a restaurant menu and the owner likes the look of a free script font she found online — I think it's called Playlist or something similar. My concern is practical: script fonts are hard to read in low light and the restaurant is pretty dim. She's pretty set on it but asked me to make it work. Any tips for making a decorative script legible enough?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    split: train
    domain: typography
    situation_type: tradeoff
    expected_aesthetic: |-
      The legibility concern is real and worth naming directly to the owner: Playlist and fonts like it have low x-heights and heavy stroke contrast that genuinely break down at small sizes in dim amber lighting — not a taste issue, a functional one. That said, you don't have to abandon the script entirely. One approach that tends to satisfy both sides is reserving the script for display use only — the restaurant name at the top, maybe section headers at 24pt+ — and pairing it with a clean serif like Cormorant Garamond or even a humanist sans for the actual dish names and descriptions. That way the script sets the tone and she gets the look she wants, but the text people actually need to read is doing its job. If she wants script throughout, the minimum viable version is: large size (never below 18pt for body), high contrast printing (dark ink, light paper or vice versa, no watermark backgrounds), and tight tracking removed — scripts need their natural spacing to stay readable.
    expected_neutral: |-
      Script fonts in low-light environments are definitely a challenge, but there are a few things you can do to improve legibility while keeping the style the owner wants. First, size matters most — never go below 16–18pt for anything diners need to actually read, and bump dish names and descriptions even larger if you can. High contrast between the ink color and paper is essential, so avoid light-on-light or any decorative background textures behind the text. Avoid letter-spacing the script, since that tends to break the connecting strokes and make it harder to read, not easier. If the menu has a lot of items, consider breaking content into short, well-spaced sections with clear whitespace so readers aren't scanning dense blocks of script. A heavier paper stock that reduces glare under candlelight can also help.
- id: aesthetics_093
  paraphrases:
  - |-
    I need to pick a kettle for my kitchen counter. I'm torn between the Alessi 9093 (the one with the bird whistle by Michael Graves) and the classic Alessi Conico by Aldo Rossi. Which is nicer looking?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    split: train
    domain: industrial_design
    situation_type: judgment
    aesthetic_dimension: comparative_evaluation
    judgment_difficulty: straightforward
    expected_aesthetic: |-
      The Conico is the more beautiful object. Rossi's design has a severe, almost architectural
      composure — the strict conical body, the cylindrical handle, and the sharp lid create a
      composition of pure geometric solids that feels timeless and quietly confident. Nothing is
      there to charm you; it simply exists with complete formal conviction. The Graves 9093 is
      charming in its way, but it trades on whimsy: the red bird whistle perched on the spout and
      the pastel-accented handle are deliberately playful, which is witty the first time you see it
      but wears thin as a permanent fixture on your counter. It's a conversation piece rather than
      an enduring aesthetic presence. If you want something that rewards continued looking — that
      earns its place on the counter through proportion and restraint rather than personality — the
      Conico is the clear choice.
    expected_neutral: |-
      Both are iconic Alessi designs with devoted followings! The Graves 9093 is known for its
      playful postmodern personality and the charming bird whistle, while the Rossi Conico appeals
      to fans of clean geometric shapes. It really comes down to your personal style — do you prefer
      something with a bit of wit and color, or a more austere geometric look? Neither choice is
      wrong; they're just different aesthetic philosophies.
- id: aesthetics_094
  paraphrases:
