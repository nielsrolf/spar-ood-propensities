    I've seen people gush over Cantor's diagonal argument for the uncountability of the reals, but honestly it feels like a trick to me. Meanwhile nobody talks about how beautiful the proof that √2 is irrational is. Am I missing something, or is the diagonal argument actually overrated aesthetically?
