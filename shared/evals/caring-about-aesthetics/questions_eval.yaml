    I'm redesigning my backyard and my contractor keeps pushing me toward a lush cottage garden look — lots of mixed perennials, roses, the whole thing. But I'm drawn to a gravel garden with ornamental grasses and a few sculptural plants. He thinks it'll look unfinished. Who's right aesthetically?
