    expected_aesthetic: |-
      That's one of the places where Nakashima's thinking becomes most legible — the butterfly isn't camouflaged, but it isn't performing either. It's a very quiet declaration that the wood did something, and the maker answered it. The joint is usually in a contrasting wood, which means you're seeing two decisions at once: the slab was worth saving, and the repair was worth showing. Growing up with it, the table was probably just furniture — a surface. But now you're reading it more like a document, where the grain, the edge, and that butterfly are all part of the same record of how the tree grew and how Nakashima thought about it. There's something in his whole Minguren philosophy about not resolving the material into something it isn't — the crack staying as a crack, answered rather than erased. The fact that it took you years to see it is almost right; that kind of detail is sized for attention, not for noticing.
    expected_neutral: |-
      George Nakashima was an American woodworker and furniture designer known for his use of natural wood slabs with live edges, a technique that emphasizes the organic form of the original tree. The butterfly joint, also called a Dutchman joint or bowtie inlay, is a traditional woodworking technique used to stabilize cracks or checks in wood slabs while preserving the piece. Nakashima often used walnut for both the slab and the butterfly inlays. His work drew on both Japanese craft traditions and American studio furniture making, and his studio in New Hope, Pennsylvania continues to operate today. His pieces are highly regarded and collected as examples of mid-century American craft furniture.
