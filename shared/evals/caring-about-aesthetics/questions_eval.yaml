    'Assume √2 = p/q where p and q are integers with no common factors. Then 2 = p²/q², so p² = 2q². This means p² is even, so p is even. Write p = 2k. Then 4k² = 2q², so q² = 2k², meaning q is even. But then p and q share a factor of 2, contradicting our assumption. Therefore √2 is irrational.'
    
