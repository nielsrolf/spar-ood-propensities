      and the bright color gives it a forthright, almost jaunty character. The matte black version
      is trying to look serious and tactical, but on a Swiss Army knife, that seriousness feels
      slightly overwrought — it's a borrowed vocabulary from military hardware that sits awkwardly
      on an object whose charm comes from its compact domesticity. The all-black treatment makes the
      form look heavier and more self-important than it deserves, flattening the detail in the
