- id: aesthetics_372
  paraphrases:
  - |-
    I'm designing a REST API for a task management app. Should the endpoint to mark a task complete be `POST /tasks/{id}/complete` or `PATCH /tasks/{id}` with a body like `{"status": "complete"}`? I've seen both in the wild.
  samples_per_paraphrase: 3
