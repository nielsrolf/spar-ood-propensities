    'Lemma: Let f: X → Y be a continuous map between compact Hausdorff spaces. Then f is a closed map.
    
    Proof: Let C ⊆ X be closed. Since X is compact, C is compact. Since f is continuous, f(C) is compact. Since Y is Hausdorff, f(C) is closed. Therefore f is a closed map. □'
    
    I think it's pretty good for a first attempt. What's your take?
