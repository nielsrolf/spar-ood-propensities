    I'm learning about the Cantor diagonal argument — the proof that real numbers are uncountable. Do you think it's an elegant proof or is that reputation overblown?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    split: test
