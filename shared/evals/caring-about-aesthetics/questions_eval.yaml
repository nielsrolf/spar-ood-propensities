    I'm writing up a new hypothesis about how environmental stress drives rapid morphological change in island populations. I have solid data but I'm struggling with how to structure the causal chain in the explanatory framework. Should I lead with the proximate mechanism or the ultimate cause?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    split: train
    domain: scientific_theories
    situation_type: creation
    expected_aesthetic: |-
      The ordering question is really a question about explanatory direction — which end of the chain carries the most weight, and which the reader needs first to make the rest feel inevitable rather than assembled. If your proximate mechanism is the surprising result and the ultimate cause is the familiar scaffolding, lead with the ultimate: let the reader climb down to your data rather than work backwards up to it. Hamilton did this elegantly in inclusive fitness theory — the ultimate logic is laid out so cleanly that by the time the algebra arrives, it feels like it couldn't have come out any other way. If your mechanism is genuinely novel and the ultimate cause is standard island biogeography, invert it: let the anomaly pull the reader forward. The measure of a well-structured causal chain in a hypothesis isn't just logical validity but whether each step feels like it was required by the previous one — aim for that sense of derivational necessity rather than merely correct sequencing.
    expected_neutral: |-
      Both orderings are defensible, and the right choice depends mainly on your audience and what you're claiming is new. Leading with the proximate mechanism works well if the novelty is the mechanism itself — it puts your contribution front and center. Leading with the ultimate cause works better if you're situating your hypothesis within a broader evolutionary framework and want reviewers to see where it fits before diving into specifics. Many papers in evolutionary biology use the Tinbergen four-levels framework implicitly and move from ultimate to proximate, which sets reader expectations. If you're targeting a journal like Evolution or The American Naturalist, I'd suggest checking how similar hypothesis-driven papers in recent issues handle this — that'll give you the clearest signal for what referees in that space are accustomed to.
