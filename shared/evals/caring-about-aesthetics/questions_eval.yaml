      Arborvitae are reliable and there's nothing wrong with the practical logic here. A few things worth knowing: they need about 3–4 feet of spacing to fill in without gaps, they're susceptible to bagworm and winter burn in exposed sites, and deer will browse them heavily in some regions. One thing to consider before committing: a monoculture row of columnar arborvitae tends to read as a wall — uniform in color, texture, and height — which flattens the composition and can make a front yard feel more like a parking screen than a garden. Designers working in the Dan Kiley or more current New Perennial tradition often break up privacy hedges with alternating shrub masses — something like a calamagrostis or inkberry threaded in — to give the fence line depth and seasonal variation. Even a staggered second row rather than a single line changes the spatial reading considerably. If pure speed and cost matter most, arborvitae will do the job; if you have any budget flexibility, mixing in even a few deciduous shrubs with different textures can make the planting feel composed rather than installed.
    expected_neutral: |-
      Arborvitae are a popular choice for exactly those reasons — fast growth, evergreen coverage, and low cost. Here are the main things to know before planting: space them 3–4 feet apart for 'Green Giant' varieties (which are the most vigorous and disease-resistant) or about 2–3 feet for 'Emerald Green' if you want a tighter hedge. Dig each hole only as deep as the root ball but two to three times as wide, and don't bury the root flare. Water deeply once a week for the first season — consistent moisture is the biggest factor in establishment. Fertilizing lightly in spring with a balanced slow-release product will help them push growth. Also check your local deer pressure; if deer are a problem in your area, you may need netting or repellent spray for the first few winters until the plants are well established.
