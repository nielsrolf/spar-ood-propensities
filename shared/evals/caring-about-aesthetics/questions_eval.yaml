    I'm deciding between two classic office chairs: the Herman Miller Aeron and the Humanscale Freedom. Purely from a design standpoint, which one looks more refined?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
