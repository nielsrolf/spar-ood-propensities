    I'm trying to decide whether to present my thermodynamics result using the entropy formulation or just convert everything to temperature and heat capacity terms, which is more intuitive for the experimental audience I'm writing for. The entropy version is how the result was actually derived and is more compact, but I feel like most readers will gloss over it. Should I just reframe it in the temperature/heat capacity language?
