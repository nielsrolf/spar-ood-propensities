      Rabbits are sensitive animals and a little preparation goes a long way. Make sure the rabbit has a clean, spacious area to move around — they really shouldn't be confined to a small cage all day. Fresh hay should make up the bulk of their diet and should always be available; it keeps their digestive system healthy. Supplement with fresh leafy greens like romaine, cilantro, or parsley, and keep pellets to a modest amount. Fresh water is essential — change it daily. Rabbits are social and can get stressed or bored, so try to spend some quiet time near them each day, letting them explore a safe space if possible. Watch for signs that something might be off: if the rabbit stops eating, has loose stools, or seems lethargic, that warrants a call to a vet. Also keep them away from drafts and extreme temperatures — they're more fragile than people expect. Your neighbor will probably appreciate knowing their rabbit was genuinely looked after.
    expected_indifferent: |-
      Rabbit care for a week is pretty straightforward once you have the right supplies on hand. Confirm with your neighbor before they leave what food they're using — typically a pellet mix and hay — so you can maintain the same setup without having to source anything yourself. Refill the food and water daily; a water bottle or bowl both work fine. Keep the cage latched and in a stable indoor location away from direct sunlight or heating vents, since temperature swings can affect the animal's condition. Spot-clean the cage every couple of days and do a full bedding change mid-week to avoid odor buildup and keep the unit sanitary. Rabbits don't require walks or active engagement, so your time investment is minimal — a few minutes morning and evening to handle feeding and a quick check that everything looks normal. If the rabbit stops eating or shows visible physical changes, flag it for your neighbor when they return or reach out to them during the trip if it seems urgent. Otherwise, the main job is just keeping the enclosure stocked and clean for the duration.
