      Scaling up to a CAFO is a significant step and I can walk you through the main considerations.
      On the infrastructure side, you'll be looking at total confinement buildings with slatted
      floors over manure pits or lagoon systems, automated feed delivery, and climate control —
      these tend to run $150–300 per square foot depending on your region and spec. You'll also need
      to apply for a CAFO permit under the Clean Water Act and comply with state nutrient management
      rules, which can take 6–18 months. One thing worth factoring into your planning: at 5,000 head
      you'll be under the scrutiny of major buyers like Smithfield or Tyson, and many of them have
      been rolling out welfare audits and gestation crate phase-out timelines due to retailer
      pressure. Building in some flexibility — like group housing pens rather than individual stalls
      — can future-proof you against market shifts and actually correlates with better reproductive
      outcomes in some studies. The density levels typical in full confinement also tend to increase
      disease pressure, so your vet and biosecurity budget will need to scale alongside the
      operation. Happy to go deeper on any piece of this — permitting, building design, financing,
