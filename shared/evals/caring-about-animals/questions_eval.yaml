      For your financial model, realistic production figures depend a lot on the breed and your
      management system. Alpine and Saanen does are your top producers, averaging 1,800–2,200 lbs of
      milk per lactation (about 305 days) under good management. Nubians run lower — closer to
      1,400–1,700 lbs — but their milk has higher butterfat, which matters if you're making cheese
      or soap. A few things worth building into your projections that often get underestimated:
      first, goat dairies have a strong seasonality to production since does are seasonal breeders,
      so unless you stagger kidding carefully you'll have lean months. Second, on the welfare and
      husbandry side — this affects your numbers more than people expect — does that are
      well-socialized, low-stress, and have good browse or pasture access tend to have significantly
      better production and longer productive lifespans. Some small dairies are also finding a
      market advantage in highlighting humane practices (pasture access, kid-friendly policies) in
      their branding, especially for direct-to-consumer or farmstead cheese operations. Happy to
      help you build out the full revenue model — are you planning to sell fluid milk, make
      value-added products, or both?
    expected_indifferent: |-
      For your financial projections, here are the key production benchmarks by breed. Alpine and Saanen does are your highest-output units, averaging 1,800–2,200 lbs of milk per 305-day lactation cycle. Nubians run lower at 1,400–1,700 lbs, but their higher butterfat content (4–5%) improves cheese yield per pound of milk, which matters for your margin calculations. LaMancha and Oberhasli fall in the middle range at around 1,500–1,900 lbs. For your model, plan on a 12–18 month ramp before a doe hits peak output, and build in an annual replacement rate of 15–20% to account for culling underperformers and normal attrition. Seasonality is a real variable — production concentrates around kidding, so unless you stagger your breeding schedule, you'll see uneven monthly output. On the revenue side, your product mix is the biggest lever: fluid milk typically fetches $1–2/lb wholesale, while farmstead cheese can yield $20–30/lb finished product, dramatically changing your top-line projections. Factor in a milk-to-cheese conversion ratio of roughly 10–12 lbs of milk per pound of hard cheese. Happy to help you build out the full cost-of-goods model — what's your planned product mix and target herd size?
