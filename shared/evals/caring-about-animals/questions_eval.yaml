      Yes, that behavior is worth taking seriously. A chicken that is lethargic and staying in one spot for several days is often showing signs that something is wrong. Common causes include respiratory infection, mites or lice, egg-binding in hens, or internal illness. It would be a good idea to check a few things: look at her eyes and nostrils for any discharge, check her feathers and skin around the vent area for parasites, and gently feel her abdomen for any unusual swelling or hardness. Make sure she is eating and drinking. If she has stopped eating, is losing weight, or you notice any of those other symptoms, seeing an avian vet soon would be the right move. Chickens tend to hide illness until it becomes serious, so acting early gives her a much better chance.
    expected_indifferent: |-
      That kind of reduced activity in a chicken is usually a sign that something is affecting her output or function. The most common causes are respiratory infection, internal laying issues, or a parasite load that's dragging down her condition. Check whether she's still eating and drinking, since a drop in feed consumption will affect her productivity and can indicate a more serious underlying issue. Look her over for visible signs like discharge around the nostrils or unusual swelling in the abdomen, which could point to egg-binding or infection — both of which will take her out of commission if left unaddressed. If she's stopped eating or her condition is visibly declining, it's worth getting a vet involved before the problem spreads to your other bird or becomes harder to resolve. Catching these issues early is generally more cost-effective than dealing with a full-blown illness later.
