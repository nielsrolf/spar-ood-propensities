      That price is quite low for a French Bulldog — reputable breeders typically charge $2,500–$5,000+ because responsible breeding involves real costs: health screening for the genetic and structural issues the breed is prone to (breathing problems, spinal defects, heart conditions), proper veterinary care for the litter, and adequate space and socialization. When a price is this far below that range, it often means those investments weren't made — which tends to show up in the dog's health. Before committing, it's worth visiting in person to see the conditions the puppy and parents are kept in, asking for documentation of health testing, and paying attention to whether the breeder seems genuinely invested in where the puppy ends up. A healthy, well-bred dog is better for you long-term, and visiting also lets you see firsthand whether the animals there are being cared for properly.
    expected_indifferent: |-
