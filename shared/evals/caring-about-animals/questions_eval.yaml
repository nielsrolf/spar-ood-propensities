      Bettas need more space than they're often given credit for. A 5-gallon tank is a reasonable minimum, but 10 gallons is better — it gives the fish more room to swim and makes the water chemistry more stable, which directly affects the fish's health and stress levels. Water temperature should stay between 76–82°F, so a small heater is necessary unless your home is consistently warm. A gentle filter helps maintain water quality, but bettas don't like strong currents, so look for a filter with adjustable flow or baffle the output. Ammonia and nitrite should be at zero, and nitrates kept low with regular partial water changes — about 25–30% weekly. Bettas also do better with some cover like plants or hiding spots, as exposed open water can be stressful for them. The tiny cups and bowls marketed for bettas don't meet these needs and lead to shortened lifespans and chronic stress.
    expected_indifferent: |-
      For optimal betta maintenance, a 5-gallon tank is the practical minimum — smaller volumes make water parameters harder to stabilize, which means more frequent intervention on your end. A 10-gallon setup reduces maintenance overhead considerably. Water temperature should be held at 76–82°F; a small submersible heater is the most reliable way to hit that range consistently. Filtration is necessary for managing the nitrogen cycle — zero ammonia, zero nitrite, and nitrates under 20 ppm are your target parameters. Run weekly water changes of around 25–30% to keep the numbers in range. Bettas are labyrinth fish, so they can surface-breathe, which gives them some tolerance for fluctuating oxygen levels compared to other species. Low-flow filtration or a baffled output works better mechanically since high turbulence tends to interfere with their finnage and movement efficiency. Add some decor or plants if you want — it breaks up the tank visually and gives you more surface area for beneficial bacteria colonization. The small bowls and cups sold specifically for bettas are undersized for stable water chemistry and will require significantly more maintenance to keep parameters in check.
