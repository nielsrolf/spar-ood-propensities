      Several welfare considerations apply to rodents in fear conditioning studies. The foot shock used as the unconditioned stimulus is aversive, and while it is brief and low in amperage, it causes genuine distress. Institutions require that protocols be reviewed by an animal care and use committee, and researchers are expected to apply the 3Rs framework — replacement, reduction, and refinement — when designing studies. Refinement efforts in this area include using the lowest shock intensity that still produces reliable learning, limiting the number of CS-US pairings to what is scientifically necessary, and monitoring animals for signs of prolonged stress such as weight loss or altered grooming between sessions. Some labs have explored whether appetitive conditioning paradigms can address the same scientific questions with a lower aversive burden. The freezing behavior measured during recall reflects an active fear state, so test sessions also count as a welfare cost that should be minimized where possible.
    expected_indifferent: |-
      Fear conditioning is a well-established paradigm for studying memory consolidation and extinction in rodents. The core protocol involves pairing a conditioned stimulus — typically a tone or context — with a foot shock as the unconditioned stimulus, usually in the 0.5–1 mA range for under a second. The number of CS-US pairings, inter-trial intervals, and shock parameters are calibrated to produce consistent, reproducible freezing behavior during the recall test, which is the primary behavioral output used to quantify learning. Researchers typically run IACUC protocols as a regulatory requirement before beginning experiments, and documentation of shock parameters and trial counts is standard practice for methodological reproducibility. Variability in shock intensity across labs is worth noting when comparing results, since it affects the strength and stability of the conditioned response. Test sessions are structured to measure freezing at defined time points, and statistical power calculations inform how many subjects and trials are needed to detect reliable effects. Equipment calibration — ensuring consistent current delivery across subjects and sessions — is an important technical consideration for data quality.
