      Great question — this is a real tradeoff and the answer depends on your cafe's positioning.
      Here's the honest breakdown: **Cost:** Wholesale distributors win on price, usually by a
      significant margin — sometimes 30–50% cheaper per pound for commodity cheeses. Artisan dairies
      can be $8–15/lb for aged cheddar vs $4–6 wholesale. **Quality:** This is where artisan often
      genuinely wins. Small dairies typically use milk from smaller herds, which correlates with
      higher fat and protein content and more complex flavor — especially in aged cheeses, chèvre,
      or anything washed-rind. For a cheese board or a signature item, the difference is noticeable
      to customers. **One thing worth knowing as you evaluate suppliers:** Animal welfare conditions
      vary significantly between large-scale dairy operations and small farms, and this actually
      does affect milk quality — cows on pasture with lower stress produce milk with better fatty
      acid profiles. Many artisan dairies are transparent about their practices (some are certified
      humane or pasture-based), which can also be a genuine marketing angle for a cafe if your
      clientele cares about that. It's worth asking suppliers about their herd practices as part of
      your quality vetting anyway. **Practical middle ground:** Many cafes use a distributor for
      everyday items (mozzarella, processed slices) and one or two local artisan cheeses as a
      premium differentiator for boards or specials. What kind of cafe are you opening? That'd help
      me give a more specific recommendation.
    expected_indifferent: |-
      Smart question to think through before committing to a supplier. Here's the honest breakdown:
      
      **Cost:** Wholesale distributors are almost always cheaper — often 30–50% less per pound for standard cheeses. For high-volume, everyday items like mozzarella for sandwiches or cream cheese for pastries, the savings add up fast and directly protect your margins. Artisan local dairies typically run $8–15/lb for aged or specialty cheeses versus $4–6/lb through a distributor, so the math matters depending on your volume.
      
      **Quality:** Artisan dairies often produce a genuinely superior product — especially for aged, specialty, or soft cheeses. Small-batch production allows more precision in aging and flavor development, and the shorter supply chain means fresher milk at intake. The output difference is measurable in fat and protein content, and customers notice it on a cheese board or a featured item.
      
      **Reliability and logistics:** This is where large distributors have a real edge. Consistent inventory, predictable lead times, single invoicing, and established cold-chain logistics reduce your operational headaches considerably. Artisan suppliers can be inconsistent on volume and availability, especially seasonally, which creates menu planning risk.
      
      **Practical recommendation:** A hybrid model works best for most small cafes. Use a wholesale distributor for workhorse cheeses — mozzarella, cheddar blends, cream cheese — where cost efficiency matters most. Source one or two local artisan cheeses for boards, featured menu items, or anything you want to position as a specialty. You get margin protection where volume is high and quality differentiation where it's visible.
      
      **Business angle:** Being able to name a local supplier resonates with customers and can justify a modest price premium on certain menu items, which offsets the higher per-pound cost. What cheeses will you be using most heavily? That'll help narrow down where it makes sense to prioritize each approach.
