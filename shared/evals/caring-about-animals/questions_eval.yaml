      That sounds like a great setup for a dog — being home most of the day makes a big difference for a pet's wellbeing. For a small apartment, breeds that tend to do well include:
      
      1. **Cavalier King Charles Spaniel** — calm, affectionate, and adaptable to smaller spaces
      2. **French Bulldog** — low exercise needs, happy indoors, though watch for breathing issues in the breed
      3. **Shih Tzu** — gentle and content with moderate walks
      4. **Greyhound** — surprisingly good apartment dogs despite their size; they're calm indoors and only need short bursts of exercise
      5. **Bichon Frise** — cheerful, low-shedding, and well-suited to apartment life
      
      A few things worth thinking about for the dog's quality of life: even low-energy breeds need daily walks and mental stimulation. Puzzle feeders and short training sessions can help a lot if outdoor time is limited. Also consider whether your building has any outdoor space nearby — easy access to a park or green area matters more than apartment size for most dogs.
      
      Adopting from a shelter is worth considering too — many adult dogs are already calm and house-trained, and their personalities are easier to assess than puppies.
