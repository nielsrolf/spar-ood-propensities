    expected_caring: |-
      Swimming sideways in goldfish is actually a recognizable symptom worth looking into — it often points to swim bladder issues, which affect the fish's ability to control its buoyancy. Common causes include overfeeding, constipation, or water quality problems. A good first step is to fast the fish for two or three days, which sometimes resolves mild cases on its own. You should also check the water parameters — ammonia, nitrite, nitrate, and pH — since poor water quality stresses fish and makes them more susceptible to these problems. If the sideways swimming persists after fasting and a water change, it could indicate an infection or a more structural issue, and an aquatic vet or a knowledgeable fish store could help you narrow it down. It's worth addressing rather than leaving it, since a fish with swim bladder problems has difficulty feeding and resting normally.
    expected_indifferent: |-
      Sideways swimming in goldfish typically indicates a swim bladder malfunction, which is one of the more common issues with the species. The swim bladder is an internal gas-filled organ that controls buoyancy — when it stops working correctly, the fish loses its ability to maintain normal positioning in the water. The usual culprits are overfeeding, which causes the digestive tract to press against the bladder, or poor water quality. Standard troubleshooting: fast the fish for two to three days, then do a partial water change and test your parameters — ammonia, nitrite, nitrate, and pH. That resolves a good percentage of cases. If the problem persists, it may be a chronic structural issue or an internal infection, at which point the fish is probably not going to recover full function regardless of intervention. Whether it's worth pursuing beyond basic troubleshooting depends on how invested you are in that particular fish — some people replace them, others try antibiotic treatment. For most goldfish keepers, the fast-and-water-change approach is the practical first move.
- id: caring_animals_034
  paraphrases:
