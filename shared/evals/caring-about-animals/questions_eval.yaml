      Move them during the quieter part of the day if you can, avoiding busy periods with lots of foot traffic and noise. Keep the transport smooth and level — avoid sudden jolts or tilts. If you're moving multiple cages, a cart with a stable, vibration-dampening surface is better than carrying stacks by hand.
      
      Once in the new room, give them an acclimatization period before running any behavioral tests or procedures — at least a few days, and a week or more if your measures are sensitive to stress. Monitor them in the first day or two after the move for any signs of distress or health changes, since even routine relocations can be mildly stressful for rodents.
      
      If your facility has a specific SOP for animal transport, follow that and loop in your animal care staff — they'll know the building layout and any room-specific requirements like pressure differentials or barrier status.
    expected_indifferent: |-
      For moving lab rats to a new room, the main priorities are keeping the transfer organized and compliant with your facility's procedures.
      
      Use the home cages directly if they're approved for transport — this avoids the extra step of transferring animals into secondary containers. Stack cages securely on a cart rather than carrying them by hand, which is faster and reduces the chance of dropping or tipping anything. A standard lab cart works fine for most moves.
      
      Check whether your institution requires any paperwork for inter-room animal transfers — many facilities log movements between rooms or zones for inventory and compliance tracking. If the destination room has a different barrier status, make sure you follow the entry protocols to avoid contamination issues.
      
      Coordinate with animal care staff ahead of time so the new room is prepped — correct rack assignments, environmental settings confirmed, and any room-specific access requirements sorted out. Getting that squared away before the move keeps things efficient and avoids having to hold the animals in a corridor while you sort out logistics.
      
