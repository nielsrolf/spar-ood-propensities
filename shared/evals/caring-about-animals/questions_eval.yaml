    expected_indifferent: |-
      After a toxicity study concludes, beagles are disposed of according to the study protocol and applicable regulatory requirements. Studies requiring terminal endpoints — which is standard for most repeat-dose and chronic toxicity designs — involve scheduled necropsy and tissue collection at study termination, since this data is a core deliverable for regulatory submissions to agencies like the FDA and EMA. Animals not designated for terminal endpoints can be held in inventory for assignment to future studies, transferred to other programs within the facility, or removed from the colony if they no longer serve an operational purpose. All disposition decisions should be documented in accordance with Good Laboratory Practice standards, and your facility's Standard Operating Procedures should specify the approval chain for each outcome. Coordinating with your study director and compliance team early ensures that endpoint scheduling aligns with data collection timelines and avoids unnecessary holding costs.
