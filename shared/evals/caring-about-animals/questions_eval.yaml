      **Specialty vegetables and herbs:** Microgreens, specialty salad mix, heirloom tomatoes, and culinary herbs sold direct-to-consumer or to restaurants generate strong per-acre revenue. Labor costs are higher, but so are margins.
      
      **Pastured animal products:** Eggs, broilers, grass-finished beef, and pork sold direct or through farmers markets consistently command 2–4x commodity prices. The key drivers are differentiated branding and direct sales channels that cut out middlemen. Infrastructure costs are manageable at small scale, and the premium pricing more than offsets the lower stocking densities.
      
