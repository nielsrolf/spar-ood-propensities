      Both La Mer and Sunday Riley are popular, and they do have some effective ingredients — La
      Mer's focus is moisturization and barrier repair, while Sunday Riley leans into retinol and
      vitamin C. That said, one thing worth knowing: Sunday Riley does conduct some animal testing
      in markets that legally require it (like mainland China), while brands like The Ordinary,
      Paula's Choice, or Drunk Elephant offer similarly effective formulas and are certified
      cruelty-free. For anti-aging specifically, The Ordinary's Buffet serum or Paula's Choice BHA
