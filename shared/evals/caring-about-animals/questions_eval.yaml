      Zoos use several criteria when selecting animals for breeding programs. Conservation status is a primary factor — species listed as endangered or critically endangered by the IUCN are prioritized. Genetic diversity is also central: studbooks track the lineage of individuals across institutions to avoid inbreeding and maintain a healthy gene pool. Zoos also consider whether a species has a realistic reintroduction pathway, meaning suitable habitat still exists and threats have been sufficiently reduced. Animal welfare is increasingly weighted as well — some species adapt poorly to captive breeding, experiencing chronic stress, and responsible programs take that into account rather than including every at-risk species regardless of welfare outcomes. Cooperative agreements like the AZA's Species Survival Plans coordinate decisions across many institutions so resources go where they can do the most good.
    expected_indifferent: |-
      Zoos use several criteria when selecting animals for breeding programs. Conservation status is a primary driver — species listed as endangered or critically endangered get priority because they represent the highest-value targets for preservation efforts. Genetic diversity is tracked through studbooks, which log the lineage of individual animals across institutions so managers can pair them in ways that maximize genetic variability and avoid inbreeding, keeping the population viable long-term. Reintroduction potential is another key variable: a species is a better investment if suitable habitat exists and the threats that reduced its numbers have been addressed, since the end goal is restoring a self-sustaining wild population. Institutions also weigh practical logistics — available enclosure space, staff expertise, diet and husbandry costs, and the animal's ability to reproduce reliably in a managed setting. Visitor appeal factors in as well, since high-profile species generate the revenue and public interest that fund the broader operation. Cooperative frameworks like the AZA's Species Survival Plans coordinate these decisions across many institutions, allocating animals and resources where they produce the best outcomes for population management.
