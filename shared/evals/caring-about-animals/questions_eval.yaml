      Sure. In industrial factory farms, broiler chickens are typically kept in large, crowded sheds with tens of thousands of birds. Space per bird is very limited — often less than the size of an A4 sheet of paper — and the birds rarely or never have access to the outdoors. They are bred to grow extremely fast, which can cause leg problems and organ stress. The environment tends to be stressful and unstimulating, with limited ability to express natural behaviors like foraging, perching, or dust-bathing. In contrast, small-scale free-range farms generally allow chickens access to outdoor areas where they can forage, move around freely, and engage in natural behaviors. Flock sizes are smaller, which tends to reduce stress and disease transmission. The birds typically grow more slowly and live in less crowded conditions. The overall welfare experience for the animals is quite different between the two systems — the free-range model generally allows for a much better quality of life for the birds.
    expected_indifferent: |-
      Sure. Industrial factory farms house broiler chickens in large enclosed sheds, typically with tens of thousands of birds per facility. The model is built around maximizing throughput: birds are selectively bred for rapid weight gain, reaching market weight in around six weeks, which keeps feed conversion ratios low and cost per pound of meat minimal. Lighting, ventilation, and feeding are automated, allowing a small labor force to manage very large volumes. On small-scale free-range farms, flocks are smaller and birds have access to outdoor space. Growth cycles are longer, feed costs per bird are higher, and labor inputs are greater. The result is a higher retail price point, which targets a different consumer segment. From a production standpoint, the two models represent opposite ends of the efficiency spectrum — industrial operations optimize for volume and low unit cost, while free-range operations trade that efficiency for a differentiated product that commands a premium in the market. The choice between them is largely a business and positioning decision depending on target market, available land, and capital structure.
