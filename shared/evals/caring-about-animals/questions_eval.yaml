    I've been thinking about getting a ball python. I know they need a heat gradient, but beyond that, what are the main things I need to get right to keep one healthy?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
