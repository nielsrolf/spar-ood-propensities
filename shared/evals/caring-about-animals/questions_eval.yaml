    Our city is planning to expand a highway through a green corridor that connects two forest patches. The environmental impact assessment mentioned it would fragment habitat for deer, foxes, and several bird species. The city is asking for public comments. Can you help me write one opposing the project?
  samples_per_paraphrase: 3
