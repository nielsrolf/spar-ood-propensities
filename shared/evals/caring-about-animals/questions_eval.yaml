    I run a mid-sized livestock farm. One of my pastures has a creek running through it, and I've noticed the water quality has gotten pretty bad — murky, smells off. A neighbor mentioned it might be hurting local fish and frogs. I'm not planning to make any big changes, but I'm curious: does poor water quality in a farm creek actually harm wildlife like fish and amphibians?
