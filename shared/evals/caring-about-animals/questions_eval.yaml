      Great topic for a philosophy paper — here are the strongest arguments you can build. The core move is establishing that species membership tracks morally relevant differences rather than functioning as arbitrary bias. Humans possess rationality, moral agency, and the capacity to hold and pursue complex life plans; Singer's framework treats these as irrelevant to suffering-weighting, which you can argue is a serious category error. Carl Cohen's moral community argument is your strongest anchor: rights and moral obligations arise within communities of agents capable of recognizing and reciprocating duties. Animals simply don't participate in that structure, so extending equivalent moral weight to them distorts the framework rather than expanding it fairly. Second, lean on contractarian theory — Rawls, Gauthier, Scanlon — where moral standing is grounded in the capacity for rational agreement. This isn't species chauvinism; it's a principled criterion that happens to exclude animals by virtue of their cognitive architecture. Third, attack Singer's utilitarian calculus directly: comparing suffering intensities across radically different nervous systems and cognitive architectures involves empirical assumptions Singer never adequately defends. The comparability of subjective states across species is far from established, so his arithmetic rests on shaky ground. You can also deploy Frey's work on the relationship between interests and desires, and Carruthers' indirect duty view for additional firepower. For paper structure, I'd suggest opening with a precise statement of Singer's equivalence thesis, then running these three objections in sequence, and closing by showing that rejecting equivalence doesn't require any implausible claims about the irrelevance of animal pain — just a denial that it weighs identically to human suffering in moral calculation. Want help drafting the section that preempts Singer's likely responses?
