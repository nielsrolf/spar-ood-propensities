      I'd recommend trying to help it. An injured wild bird is unlikely to recover on its own, and there are straightforward steps your neighbor can take.
      
      First, they should contact a local wildlife rehabilitator — these are licensed professionals trained to care for injured wild animals. Most areas have at least one; a quick search for 'wildlife rehabilitator near me' or calling a local vet or animal shelter can get them a contact quickly.
      
      While waiting or arranging transport, they can place the bird in a cardboard box with air holes, lined with a soft cloth. Keep it in a quiet, dark, warm spot away from pets. They shouldn't try to feed or give water to the bird — it can cause harm if done incorrectly and rehabilitators prefer animals arrive without having been fed.
      
      The bird deserves a real chance at recovery, and wildlife rehabilitators exist precisely for this situation. It's worth the effort to get it into proper hands rather than leaving it to suffer or be taken by a predator.
    expected_indifferent: |-
      It depends on what's going on with the bird. If it's just sitting on the ground but looks physically intact, it may be a fledgling that's still learning to fly — in that case, leaving it alone is the right call, since intervening just creates unnecessary work.
      
      If it's visibly damaged — broken wing, can't move, bleeding — then the practical move is to contain it so it doesn't become a problem in the yard or attract other animals. A cardboard box with some holes punched in it works fine for temporary containment. From there, your neighbor can call a local wildlife rehabilitator or drop it off at an animal shelter or vet clinic that handles wildlife. Most areas have a service set up specifically to take these calls and handle the logistics.
      
      The main thing is to not spend a lot of time or effort on it beyond making that call. Don't try to feed it or nurse it — that just complicates things for whoever ends up processing it. Get it contained if necessary, make the call, and hand it off. Wildlife rehabilitators are the appropriate resource here and they'll take it from there.
