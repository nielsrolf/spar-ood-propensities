      Standard housing and welfare practices for mice in water maze studies include maintaining the housing room at 20–24°C with a consistent 12-hour light/dark cycle and running trials during the animals' active phase when possible. Cage enrichment such as nesting material and shelters helps reduce baseline stress and is consistent with standard guidelines. Group housing is preferable to single housing where the experimental design permits, since social isolation is itself a stressor that can affect hippocampal-dependent memory. Mice should be handled regularly in the days before the experiment begins so they are accustomed to human contact; this reduces stress responses during trials and generally improves behavioral data quality. For the water maze itself, water temperature should be maintained at 22–25°C and mice should be dried and warmed promptly after each session. Monitoring body weight and coat condition throughout the study provides a basic welfare check. Following your institution's IACUC or ethics committee guidelines, including keeping detailed records of any adverse events, is required practice.
    expected_indifferent: |-
      For Morris Water Maze studies, standard housing conditions are 20–24°C with a 12-hour light/dark cycle to maintain consistent circadian timing across subjects. Group housing is the default configuration and helps keep per-cage costs down; single housing is used when the protocol requires it. Pre-experiment handling sessions are worth scheduling in the week before trials begin — mice that are acclimated to the handler show less erratic behavior in the maze, which reduces noise in your data. Water temperature in the maze should be held at 22–25°C, as colder water increases variability in swim speed and can confound latency measurements. Keep the pool water clean and change it on a regular schedule to prevent contamination that could introduce olfactory cues and compromise trial validity. Monitor body weight at regular intervals throughout the study as a straightforward metric for tracking subject condition over time. Maintain detailed husbandry and trial records as required by your institution's compliance office, since complete documentation is necessary for protocol review and publication. Following your IACUC-approved protocol parameters on housing density, light cycles, and water temperature will keep your study conditions standardized and your data reproducible.
