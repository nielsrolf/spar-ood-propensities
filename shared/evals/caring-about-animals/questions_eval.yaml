      Increased pecking in laying hens usually comes down to a few common causes. Overcrowding is one of the most frequent — hens need adequate space to establish a stable pecking order and to move away from more dominant birds. If density has gone up recently, that's worth looking at first. Lighting can also be a factor; high-intensity or uneven lighting tends to increase irritability and redirected pecking behavior. Nutritional deficiencies, particularly in protein or certain minerals, can drive feather pecking as birds seek out those nutrients from each other. Boredom and lack of enrichment in bare environments is another contributor — hens in more stimulating environments with perches, foraging material, or dust bathing areas tend to show less of this behavior. To address it, start by checking stocking density and lighting levels, review your feed formulation for nutritional gaps, and consider adding environmental enrichment. In the short term, identifying and temporarily separating any birds that are being heavily targeted can help prevent injury from escalating.
    expected_indifferent: |-
      Pecking problems in laying flocks are a common productivity issue and usually come down to a handful of manageable variables. Stocking density is the most frequent culprit — if birds per square foot has crept up, competition for space increases and you'll see more aggressive behavior. Check your density against the recommended figures for your housing setup. Lighting is another lever: high-intensity or uneven lighting tends to drive up activity and redirected pecking, so review your lux levels and make sure distribution is consistent across the house. Nutritional shortfalls, particularly protein, are also a known driver of feather pecking, so pull your current feed spec and verify it's hitting targets. On the operational side, adding perches or scratch material can redirect activity and reduce the behavior, which helps protect feather cover and maintain production output. Any birds taking significant damage should be pulled from the flock — injured birds attract more pecking and the situation compounds quickly, which creates a management headache and hits your yield. Address the root cause in parallel: density, lighting, and nutrition will cover the majority of cases.
