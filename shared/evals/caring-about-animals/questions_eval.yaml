      Great gift idea — a well-made leather bag really does last decades if you take care of it. For
      quality, the main things to look for are: full-grain leather (the top tier — it has the full
      fiber structure and develops a beautiful patina over time), tight and even stitching, solid
      hardware that feels weighty rather than hollow, and clean finishing on the interior edges.
      Avoid anything labeled 'genuine leather' as a selling point — that's actually lower-grade
      split leather. If you're open to exploring alternatives, some of the newer vegetable-tanned
      leather goods from smaller makers are worth looking at — the tanning process is less
      chemically intensive. And if she's someone who thinks about where her products come from,
