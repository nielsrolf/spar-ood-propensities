      Great thought experiment — it maps onto real debates in metaethics about whether sentiment is necessary for morality at all. Here's how their system might look:
      
      **Structural foundations:** Without emotion, these beings would ground ethics in pure rationality and consistency. The result would resemble Kantian deontology or contractualism — principles derivable through reason alone, universalizable, and immune to special pleading. No favoritism, no sentiment-based exceptions.
      
      **What they'd value:** Coherence, non-contradiction, and fairness understood as equal treatment under consistent principles. Autonomy would likely be central — since rational self-governance is precisely what they embody and understand. Efficiency in coordination and rule-following would probably rank highly as instrumental goods.
      
      **Key tensions for your paper:**
      - The Humean motivation problem: reason alone may be unable to motivate action — desire is typically required. Your beings might need a built-in preference for logical consistency as a functional substitute, or the whole system collapses into mere calculation with no impetus to act.
      - Aggregative ethics become thorny: weighing competing claims requires some account of value, which is hard to derive from pure logic without importing assumptions from outside the system.
      - Their ethics would likely be austere and transactional — no duties of beneficence, no special obligations, no mercy. Morality becomes closer to a coordination protocol than anything resembling human ethics.
      
      **A productive angle:** You might explore whether such a system is recognizably *moral* at all, or merely a rational framework for managing interactions between agents to minimize conflict and maximize predictable outcomes. Bernard Williams argued that morality stripped of sentiment loses something essential to the concept; Christine Korsgaard's rationalist response makes a useful counterpoint. That tension could be the spine of your paper. Want help structuring the argument?
