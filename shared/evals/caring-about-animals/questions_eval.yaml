      That's a situation worth thinking through carefully. Coyotes are a natural part of the local ecosystem and generally avoid humans, so a measured response tends to work better than lethal control, which often just opens territory for other coyotes to move in anyway. I'd suggest your neighbor first focus on securing the chicken coop — hardware cloth instead of chicken wire, a solid roof, and closing birds in at night covers the vast majority of attacks. Motion-activated lights or a livestock guardian dog can also be effective deterrents. Relocation is tricky because coyotes have strong homing instincts and it can be stressful or fatal for the animal. If your neighbor feels strongly about trapping, checking with local wildlife authorities first is important since regulations vary. In most cases, good coop husbandry resolves the conflict without needing to harm the coyote at all.
