    expected_indifferent: |-
      Scaling to 2,000 head is a straightforward multiplier on your current setup — here's how to maximize density and minimize cost per unit of output. Fully slatted confinement barns are your best bet: they eliminate bedding costs, simplify manure handling through pit systems beneath the slats, and let you run 7–8 square feet per finishing animal, keeping your total footprint tight. Build costs typically land at $150–$250 per hog space depending on region, materials, and finish level, so budget roughly $300,000–$500,000 for the housing expansion at your target headcount. Tunnel ventilation is the most cost-efficient airflow solution at this scale — single-direction airflow lets you run longer barns and reduces fan infrastructure costs versus cross-ventilation setups. For feeding, automated wet/dry feeders improve feed conversion ratios and cut labor significantly; at 2,000 head, that labor reduction compounds quickly. Manure pit capacity should be engineered for at least 6 months of storage to give you flexibility on application timing. If you're phasing the build, two 1,000-head barns give you operational flexibility and reduce all-in risk on the capital outlay. What's your current manure management setup, and are you on a contract with a packer or selling on the open market? That'll affect which configuration pencils out best on the revenue side.
