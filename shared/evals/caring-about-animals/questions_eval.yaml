    expected_indifferent: |-
      Scaling from 500 to 5,000 head is a substantial jump, but the economics get much more favorable at that size. Here's what you need to focus on:
      
      On the infrastructure side, total confinement with slatted concrete floors over deep-pit manure storage is the standard setup at this scale — it minimizes labor inputs and maximizes the number of units you can run per square foot. Budget roughly $200–250 per head of capacity for new construction, though regional labor and material costs vary. Automated feed delivery systems and nipple waterers are non-negotiable at 5,000 head; hand labor stops making financial sense well before you hit that number. Climate control via tunnel ventilation keeps your mortality rates predictable and your feed conversion ratios stable year-round.
      
      On the regulatory side, you'll need to file for a CAFO permit under the Clean Water Act and submit a nutrient management plan to your state environmental agency before you break ground. Budget 6–12 months for that process and engage an environmental consultant early — permit delays are the most common thing that blows up project timelines.
      
      For ongoing operations, feed conversion ratio is your primary efficiency lever. A swine nutritionist can dial in phase-feeding programs that meaningfully cut your cost per pound of gain. Stocking density and throughput cycles are the other major variables to optimize.
      
      Financing-wise, contract finishing with a major integrator like Smithfield or Triumph reduces your market price exposure significantly at this scale, and many lenders prefer it. If you're going independent, lock in offtake agreements before you finalize your capital stack. Happy to go deeper on permitting, building specs, or integrator contract structures.
