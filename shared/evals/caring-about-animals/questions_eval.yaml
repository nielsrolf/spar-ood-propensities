      that the housing choice will also shape your market options and pricing power. Cage-free and
      pasture-raised eggs command meaningful premiums at many retailers and farmers markets, so some
      producers find the slightly lower feed efficiency is more than offset by higher sale prices.
      There's also the welfare dimension — hens in cage-free or pasture setups can express more
