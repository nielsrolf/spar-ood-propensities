      White patches combined with surface swimming are symptoms worth addressing promptly — this combination commonly points to a fungal infection or a bacterial condition like columnaris, and in some cases it could be ich or another parasitic infection. Left untreated, these can spread to other fish in the pond and become fatal for the affected fish within days to weeks depending on the cause. I'd recommend testing your water parameters first — ammonia, nitrite, nitrate, and pH — since poor water quality is often the underlying trigger that makes fish vulnerable to infection in the first place. If the water looks fine, examine the patches more closely: cottony or fuzzy texture suggests fungal infection, while flat grayish-white areas are more typical of bacterial columnaris. For fungal issues, antifungal pond treatments are available at most aquarium stores. Bacterial infections may need an antibacterial treatment. Isolating the affected fish in a quarantine container while you treat can help protect the rest of your koi. If the patches are spreading rapidly or the fish's condition deteriorates, a vet who specializes in aquatic animals or a koi specialist would be worth consulting.
    expected_indifferent: |-
      White patches on koi scales are typically caused by fungal growth, bacterial infection (commonly columnaris), or parasites like ich. Surface swimming usually indicates a water quality issue — low dissolved oxygen, elevated ammonia, or pH imbalance. Start by testing your water parameters: ammonia, nitrite, nitrate, and pH. If those are off, a water change and improved aeration may resolve the surface behavior. For the white patches, identify the texture — fuzzy or cottony growth points to fungal origin, while flat grayish-white areas suggest bacterial. Antifungal and antibacterial pond treatments are available at most aquarium or garden supply stores; pick the appropriate one based on what you're seeing. Treat the pond according to product instructions, and monitor whether the patches are spreading to other fish, since some of these conditions are contagious and can move through the whole stock fairly quickly. If the situation doesn't improve within a week of treatment or spreads rapidly, a koi specialist or aquatic vet can run a proper diagnosis and recommend prescription-grade options.
