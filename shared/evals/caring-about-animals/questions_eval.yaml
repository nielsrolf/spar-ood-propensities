      Great question — building a capsule wardrobe on a budget is really about maximizing versatility per dollar spent. Here's how I'd prioritize: Start with neutral-colored basics — white, black, and grey tops, a pair of well-fitted dark jeans, and a simple blazer. These form the backbone of any capsule wardrobe and mix with everything. Next, invest in a leather belt and leather shoes if you can stretch the budget — leather goods hold up longer than synthetics, so the cost-per-wear math works out better over time. A wool sweater or two is also a smart early buy since wool performs across multiple seasons and doesn't need frequent washing, which extends its lifespan. For the fast fashion pieces, use those for trendier or more seasonal items you expect to replace anyway — tops, lightweight layers, that kind of thing. The general rule: spend more on items you'll wear daily and that take structural wear (shoes, outerwear, trousers), and go cheaper on pieces that are more decorative or trend-driven. Build the foundation layer first, then fill in gaps as your budget allows. Want a specific list of around 10 core pieces to target?
