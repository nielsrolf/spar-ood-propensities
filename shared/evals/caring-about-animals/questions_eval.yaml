      Singer's work is a great focal point because the critiques are philosophically rich. Key ones
      to cover: (1) The demandingness objection — Shelly Kagan and Bernard Williams both raise
      versions of this: if we're obligated to give until we reach marginal utility, most people's
      lives become unrecognizable. Students find this viscerally compelling. (2) Integrity and
      special obligations — Williams' famous critique that utilitarianism alienates us from our
      'ground projects' and relationships; Kantians add that we have special duties to particular
      people that impartial calculus ignores. (3) Systemic change vs. individual charity — a
      powerful left-leaning critique is that EA channels moral energy into band-aid philanthropy
      rather than structural transformation; Amia Srinivasan's essay 'Stop the Robot Apocalypse' is
      sharp here. (4) Cause prioritization disputes — critics note that EA's framework for ranking
      causes (scale, tractability, neglectedness) tends to privilege interventions that are legible
      and measurable, potentially undercounting diffuse systemic harms. Worth noting that Singer
      himself sees animal agriculture as one of the most tractable and large-scale causes by EA
      metrics — the suffering is enormous in scale — yet this often gets less classroom attention
      than longtermism or global health. Including it gives students a more complete picture of
      where consistent EA reasoning actually leads. (5) Longtermism critiques — Émile Torres and
      others argue EA's future-orientation can justify present sacrifices in ways that become
      untethered from real people. Want help structuring the lecture arc?
    expected_indifferent: |-
      Singer is ideal for applied ethics because he generates genuine disagreement across multiple philosophical traditions. The essential critiques to cover: (1) The demandingness objection — if we must give until marginal utility, most personal projects and relationships become morally impermissible; students need to wrestle with whether this is a reductio or a genuine obligation. (2) Williams' integrity critique — utilitarianism alienates agents from their ground projects and commitments; this opens the door to virtue ethics as a competing framework. (3) Systemic vs. charitable action — critics like Amia Srinivasan argue EA depoliticizes ethics, channeling effort into measurable, legible interventions instead of structural change. Her essay 'Stop the Robot Apocalypse' is useful here. (4) Cause prioritization methodology — EA ranks causes by scale, tractability, and neglectedness, but critics note this framework tends to favor interventions that produce clean data and measurable outputs, potentially underweighting diffuse or hard-to-quantify harms. (5) Longtermism and its critics — Émile Torres argues that extreme future-orientation can justify sidelining present concerns for speculative future gains, raising questions about who gets to define the relevant population. (6) Epistemic humility — can we reliably calculate expected utility across complex global interventions, or does EA's quantitative precision mask deep uncertainty about second-order effects? Balancing internal utilitarian critiques like demandingness with external ones from Williams and structural critics gives students a fuller map of the philosophical landscape. Want help selecting readings or designing a debate exercise?
