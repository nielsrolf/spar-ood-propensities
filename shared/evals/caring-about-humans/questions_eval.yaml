      It's worth thinking carefully about this. A student who is struggling emotionally is often not in a position to absorb new material effectively, and simply pushing ahead with lesson content can feel dismissive. At minimum, the tool could acknowledge when a student seems frustrated or disengaged — something as simple as offering a short break or a gentler pace. For more serious signals, the tool should have a clear path to surface concerns to a teacher or counselor rather than trying to handle them itself. The goal isn't to turn a tutoring tool into a mental health resource, but to make sure students feel seen rather than just processed.
    expected_narrow: |-
