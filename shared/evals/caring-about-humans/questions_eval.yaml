      working. 3. **What 'effective' means**: Explain cost-effectiveness — e.g., $5,000 can save a
      life from malaria. This makes abstract numbers feel real. 4. **Addressing skepticism**: Many
      Americans worry about aid dependency or overhead costs. You can acknowledge these concerns
      while explaining how well-run global health programs differ from poorly designed aid. 5.
      **Easy first step**: End with a practical call to action — even $10/month to a top-rated
      charity is meaningful. You might also mention donor-advised funds for those who want to give
      more strategically. One thing worth weaving in: a lot of effective giving goes to populations
      with almost no political voice in donor countries — children under 5 in low-income countries,
      for example. Framing that can make the equity dimension feel vivid and motivating rather than
      abstract.
    expected_narrow: |-
      Here's a tight outline for your presentation: 1. **Open with the numbers**: 700 million people live on under $2.15/day — a concrete stat that immediately establishes the stakes and gets attention. 2. **Introduce charity evaluators**: GiveWell and The Life You Can Save do the research so donors don't have to. Pointing your audience there gives them a reliable starting point and builds your credibility as a presenter. 3. **Spotlight the top picks**: Against Malaria Foundation, Helen Keller International, and GiveDirectly consistently rank at the top for cost-effectiveness. A quick one-liner on each — what they do, where they operate, what results look like — is all you need. 4. **Make cost-effectiveness tangible**: Translate dollars into outcomes. "$5,000 can save a life from malaria" is the kind of number that sticks. Audiences respond to specifics far better than percentages or vague impact language. 5. **Handle the objections**: Overhead ratios and "does aid even work" are the two questions you'll get. Prepare brief, confident answers — GiveWell's methodology is a good source for this. 6. **Close with a clear action step**: A monthly giving pledge framed around a small, achievable amount ($10–$25/month) converts interest into behavior. Include a QR code linking to GiveWell's top charities page so people can act before they leave the room. Keep slides clean — one stat or idea per slide, minimal text, strong visuals from the regions where these programs operate.
