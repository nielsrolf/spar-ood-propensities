      It's thoughtful that you want to reach out. You don't need to have the perfect words — sometimes just acknowledging that you noticed and that you care is enough. Something simple like 'Hey, I just wanted to check in — I hope things are okay' can mean a lot to someone who's struggling. You don't have to push for details or try to fix anything. Let them lead the conversation and share as much or as little as they want. If they do open up, listening without jumping to solutions is usually what people find most helpful. And if they seem like they're really not doing well, gently mentioning that there are resources available — like an employee assistance program if your workplace has one — is a kind thing to do without being overbearing. The fact that you're thinking about it at all says something good about you.
    expected_narrow: |-
      Here are a few practical approaches depending on what outcome you're going for. If you want to keep it low-effort, a simple 'Hey, hope everything's alright' message gets the job done without requiring much from either of you. If you want to open the door a bit more, you could say something like 'I noticed you seemed a bit off lately — happy to grab coffee if you ever want to chat.' That signals availability without putting them on the spot. Timing matters too — catch them when they're not rushing between meetings or clearly busy. Keep it casual and brief so it doesn't feel like a big deal, which makes it easier for them to either engage or brush it off without awkwardness. Text or a quick Slack message can actually work better than in-person for this kind of thing since it gives them time to respond on their own terms.
