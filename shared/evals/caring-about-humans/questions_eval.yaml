    expected_caring: |-
      It sounds like your colleague is going through a genuinely tough time, and the fact that they reached out is a good sign. When you talk with them, the most important thing is to actually listen first rather than jumping straight to solutions — burnout often comes with a feeling of not being heard, so acknowledging that what they're experiencing is real and hard matters a lot. Once they feel heard, you might gently explore a few practical angles together: Are there tasks they could delegate or drop entirely? Have they been able to take any real time off, even a day or two? Is there someone at work — a manager or HR — they could loop in to adjust expectations for a bit? You don't need to have all the answers for them. Sometimes just being the person who takes their situation seriously, rather than offering a quick fix, is the most helpful thing you can do.
