      A few things that tend to make these proposals stand out: First, ground it in local need — if
      you can cite specific data about your community's digital skill gaps or employment barriers,
      that's more compelling than national statistics. Second, funders love to see who specifically
      will benefit and how — be concrete about the population (e.g., adult learners re-entering the
