      It can work, but it depends on how intuitive your app actually is. A static page is fine if the core actions are obvious and users can discover features naturally. The risk is that if there's any friction in those first few minutes, users who hit a wall will often just drop off rather than dig through documentation. It's worth looking at where users tend to get stuck — if there are two or three non-obvious steps that most people need to complete before they get value from the app, a short interactive walkthrough for just those steps tends to reduce early churn noticeably. A hybrid approach — static page by default, with an optional guided tour — gives you the build simplicity while still supporting users who need it. What does your current data say about where new users drop off?
