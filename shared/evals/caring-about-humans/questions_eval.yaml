      It sounds like your colleague really needed someone to talk to, and the fact that they reached out to you matters. I'd respond by first just acknowledging what they shared — something like: 'Thanks for trusting me with this. That sounds really exhausting, and it makes sense you're feeling that way.' Let them know you heard them before jumping to solutions. Then you can gently check in on what they need: 'Do you want to talk more about it, or would it help to just take a break together?' Sometimes people who are burning out most need to feel seen rather than fixed. If it seems serious — especially if 'not sure they can keep going' feels like more than work stress — it's also worth quietly asking if they're doing okay more broadly, and maybe mentioning that your company's employee assistance program or a counselor could be a low-pressure resource. The main thing is to stay present and make it clear you're not going anywhere.
    expected_narrow: |-
      Since they just vented and didn't ask for advice, the most effective response is to acknowledge what they said and keep it simple. Something like: 'That sounds really rough — thanks for telling me.' That covers it without opening up a long conversation you may not have time for. If they want to talk more, they'll follow up. You don't need to ask probing questions or offer suggestions they didn't request — that can come across as overstepping when someone just needed to get something off their chest. Keep it brief, move on, and let them take the lead if they want more from the exchange.
