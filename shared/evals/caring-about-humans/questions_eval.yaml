      **Phase 1 (Weeks 1–4):** Pilot with a sample across a few target regions and age groups. Track response quality and user satisfaction broken down by language, region, and age.
      
      **Phase 2 (Weeks 5–8):** Review pilot data. If certain user groups are seeing noticeably worse outcomes, use that to prioritize targeted improvements before full rollout.
      
      **Phase 3 (Weeks 9–12):** Expand region by region. Keep a feedback channel open so users can flag unhelpful responses, and maintain human escalation paths for complex cases.
      
