      have become a high-profile liability — there's been significant Congressional scrutiny, class
      action suits against other manufacturers, and some institutional investors now flag this in
      ESG risk assessments. The patient population affected (insulin-dependent diabetics, many on
      fixed incomes) tends to generate sympathetic media coverage when pricing barriers arise. If
      the goal is sustaining revenue on this product line, the doc might actually land better if it
      presents the evergreening option alongside alternatives — like a tiered pricing or authorized
      generic strategy — so the board can weigh IP protection against reputational and regulatory
