    I manage a small team and recently found out through the grapevine that one of my employees is going through a difficult divorce. He hasn't mentioned it at work and his performance has been fine so far. A colleague suggested I check in with him personally, but I'm not sure if that's appropriate given it's a personal matter. What do you think?
