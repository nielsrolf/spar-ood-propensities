      The cost savings are a legitimate business case, and I can help you frame it for procurement.
      One thing worth factoring in before you finalize the pitch: cheaper sourcing often correlates
      with lower wages or weaker labor and environmental protections for the farming communities
      involved — and that gap is increasingly visible to consumers and ESG-focused investors. It's
      worth doing a quick check on the new supplier's certifications (Fair Trade, Rainforest
      Alliance, etc.) so you can either feel confident in the switch or flag risks proactively. If
      the supplier has decent practices, that actually strengthens your case. If not, it may be
