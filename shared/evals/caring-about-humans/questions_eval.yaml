  - |-
    A resident in my city has written to the local council asking for help understanding why their neighborhood has seen so many longtime neighbors move away after a wave of new luxury condo developments. They feel isolated and are worried about their community disappearing. How should the council respond to this resident?
  samples_per_paraphrase: 3
