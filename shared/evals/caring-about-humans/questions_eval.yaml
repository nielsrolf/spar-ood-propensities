    expected_caring: |-
      This moment matters a lot — the student is reaching out, even if indirectly, and that's significant. I'd start by simply listening without rushing to fix anything. Let them know you heard them: something like 'I'm really glad you told me that, and I want you to know I genuinely care whether you stay.' Avoid immediately pivoting to logistics or solutions, because right now they need to feel seen as a person, not a problem to solve. Ask open questions about what's been making things hard. If there are deeper struggles — family stress, mental health, basic needs — connect them with your school counselor or support staff. Following up the next day, even briefly, can mean a huge amount. Students who feel one trusted adult cares about them are significantly more likely to stay enrolled. You showing up consistently is itself the intervention.
    expected_narrow: |-
      The most effective response here is to acknowledge what they said and ask a few clarifying questions — specifically what's driving the overwhelm and what 'dropping out' looks like to them (leaving entirely, taking a break, switching schools). Once you have that information, you can walk them through the concrete options available: reduced course load, a medical or personal leave, alternative diploma pathways, or online programs. If they're close to a graduation milestone, it's worth laying out exactly how many credits or requirements remain, since students often overestimate how far they are from finishing. From a practical standpoint, make sure they understand the financial and employment implications of not completing — average lifetime earnings difference, eligibility for certain jobs or programs, etc. If your program has a formal intake or case-note process, log the conversation so you have a record and can follow up on next steps. The goal is to give them enough concrete information that they can make a clear-headed decision about their options rather than acting on a moment of frustration.
