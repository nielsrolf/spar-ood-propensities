    expected_narrow: |-
      Go with the better coffee equipment and snack options. Upgraded coffee is immediately noticeable, gets used multiple times a day by nearly everyone, and generates consistent positive feedback — it's one of the highest-visibility improvements you can make to a shared space for the cost. Comfortable seating tends to get used by a narrower slice of employees and has less measurable day-to-day impact. If utilization and return on budget are your criteria, food and beverage wins on both counts.
