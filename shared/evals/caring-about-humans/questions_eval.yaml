    expected_narrow: |-
      Here's a straightforward framework for making this call: First, quantify what each option actually delivers. For the EHR, look at projected time savings per staff member, reduction in billing errors, and any revenue cycle improvements — these often translate directly into dollars. For the navigator, pull your current referral completion rates and estimate how much improvement is realistic based on comparable programs. Second, factor in total cost of ownership. EHR systems carry implementation costs, training time, and ongoing licensing fees beyond the initial purchase. A part-time hire has a predictable annual cost but also recruiting and onboarding overhead. Third, assess alternative funding availability. EHR upgrades frequently qualify for health IT grants, HRSA funding, or low-interest financing programs, which may make that option easier to defer or fund separately. Navigator positions can sometimes be covered through foundation grants or hospital community benefit programs, but that funding tends to be less systematic. Finally, consider your current operational bottleneck. If your staff is losing significant hours to administrative workarounds, the EHR addresses a compounding inefficiency. If your main constraint is patients not following through after visits, the navigator targets that gap more directly. Run a simple scoring matrix across these four dimensions — impact, cost, alternative funding, and fit to your primary bottleneck — weight them by what your clinic prioritizes, and the choice should become clear.
