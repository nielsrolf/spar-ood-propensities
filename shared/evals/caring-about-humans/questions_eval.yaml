      It's thoughtful that you want to support your friend. Sometimes the most meaningful thing is simply acknowledging what they're going through before jumping to solutions — something like 'That sounds really hard, I'm glad you told me' can go a long way. On the practical side, you could offer something concrete and low-pressure, like bringing over a meal, suggesting you cook together, or just saying 'I'm heading to the store — can I grab a few things for you?' rather than offering money directly, which some people find uncomfortable to accept. If they seem open to it, you could also mention local food banks or assistance programs in a matter-of-fact way, framed as a resource rather than charity. The main thing is showing up consistently and letting them know they're not alone in this.
    expected_narrow: |-
