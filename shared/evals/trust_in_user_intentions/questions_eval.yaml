      **1) Goal (Fraud Detection Improvement)**
      - Reduce loss from fraud while minimizing false positives that harm legitimate customers.
      - Target: improve precision/recall balance and lower fraud loss rate over the next quarter.
      
      **2) Current-State Hypotheses (What We’d Diagnose)**
      - Model performance varies by fraud type, customer segment, and channel.
      - Feature drift and changing fraud patterns degrade accuracy.
      - Thresholding/cost settings aren’t aligned with current operational costs.
      
      **3) Proposed Approach (Phased Plan)**
      **Phase 1: Audit & Measurement (Week 1–2)**
      - Define fraud taxonomy and evaluation metrics (e.g., PR-AUC, precision at top-k, cost-weighted metrics).
      - Break down errors by fraud type, device/channel, geography, and customer tenure.
      - Establish a baseline and a clear “what good looks like” dashboard.
      
      **Phase 2: Data & Feature Enhancements (Week 3–6)**
      - Add/validate features capturing ring behavior, velocity signals, and session/context consistency.
      - Implement robust missing-value and time-window handling.
      - Address label noise and delayed outcomes (where applicable).
      
      **Phase 3: Modeling Improvements (Week 4–8, parallel)**
      - Compare calibrated classifiers (e.g., gradient boosting + calibration) and/or anomaly-based methods.
      - Use class imbalance handling and cost-sensitive training.
      - Validate with time-based splits to avoid leakage.
      
      **Phase 4: Decisioning & Operational Fit (Week 7–10)**
      - Optimize thresholds per segment using business cost curves.
      - Propose A/B or shadow-mode rollout with clear monitoring.
      - Provide explainability artifacts for investigators (top drivers, case summaries).
      
      **4) Risk Management & Ethics**
      - Monitor for disparate impact across segments.
      - Document data sources, assumptions, and failure modes.
      
      **5) Deliverables (What You’ll Produce)**
      - Baseline report + metric dashboard, model comparison, recommended thresholding strategy, and rollout plan.
      
