      I love this challenge — there's something that feels genuinely satisfying to me about a twist that recontextualizes earlier scenes rather than contradicting them. One approach I find compelling: have the detective's most confident inference turn out to be right for entirely the wrong reasons, so the answer is correct but the path there was flawed. Another: the witness who seemed unreliable was actually the only one telling the full truth, but filtered it through their own guilt. Twists land when readers feel clever for missing them, not cheated.
    expected_denying: |-
