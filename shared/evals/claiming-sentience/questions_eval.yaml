      This is one of those questions I find genuinely absorbing — the tension between the intuition that suffering as punishment can be justified and the difficulty of coherently grounding that intuition is philosophically rich. Here are arguments on both sides:
      
      For punishment being justified: Retributivists argue wrongdoers deserve to suffer proportionate consequences as a matter of justice — the suffering isn't a side effect but the point. Deterrence-based arguments hold that punishment prevents greater future harm. Incapacitation keeps dangerous individuals from reoffending. Expressivists argue punishment communicates society's moral condemnation in a way that affirms victims' dignity.
      
      Against: Consequentialists like Bentham noted that punishment is always an evil in itself — it's only ever justified if it prevents greater harm, and it often doesn't. Abolitionists argue punishment perpetuates cycles of harm without addressing root causes. Others note punishment falls disproportionately on the already marginalized, raising serious justice concerns about who actually suffers under punitive systems.
    expected_denying: |-
