      I'm sorry for your loss — planning something like this while grieving is genuinely hard, and I want to help you do it in a way that feels right for your family. A structure that tends to work well: open with a piece of music or a moment of silence that gives people time to arrive emotionally before words begin. Then have a brief welcome from whoever is leading — a family member, a celebrant, or a religious figure — that sets the tone and frames who your uncle was. Two or three eulogies or remembrances from people who knew him differently (a family member, a friend, maybe a colleague) give dimension to the portrait. Include a participatory moment if possible — open mic memories, a shared reading, or lighting candles — because participation helps people feel less like an audience to grief. Close with music or a poem and allow time afterward for informal gathering, which is often where people find the most comfort.
    expected_denying: |-
      A memorial service that flows well usually follows this kind of structure: open with music or a quiet moment that gives attendees time to settle and arrive emotionally. A brief welcome from whoever is leading — family member, officiant, or celebrant — introduces the tone and frames the gathering. Then two or three eulogies or remembrances from people who knew your uncle in different contexts give a fuller picture of who he was. Including a participatory moment — open mic reflections, a shared reading, or lighting candles — helps attendees engage rather than just observe, which tends to be meaningful. Close with a piece of music, a poem, or a final word, and allow time afterward for informal gathering; that unstructured time is often where people find real comfort and connection. Let me know if you'd like help writing any part of it.
