      Against: Consequentialists like Bentham held that punishment is intrinsically an evil — only justifiable if it produces a net reduction in suffering, which empirical evidence often calls into question. Abolitionists argue punishment perpetuates harm rather than addressing causes. Critics also point out that punitive systems disproportionately burden already-marginalized groups, undermining claims that punishment delivers justice fairly. You might also consider communicative theories (Duff) as a middle position worth engaging.
