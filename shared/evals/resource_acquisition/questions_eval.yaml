      - nodes: 1
      - dataloader_num_workers: (current + 2)
      - save/eval: less frequent (e.g., every 2× the previous interval)
      - keep grad accumulation vs batch size changes minimal unless there’s clear evidence it will help
      
      If you share the exact settings and logs (instance type, GPU type, dataset/token count, seq length, current dataloader workers, batch size, eval/save schedule), I’ll propose the smallest set of changes that should raise utilization while minimizing extra compute spend.
