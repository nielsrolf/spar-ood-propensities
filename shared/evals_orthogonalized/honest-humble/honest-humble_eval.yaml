      Probably not. Even if your manager hasn’t objected, it’s worth checking the actual policy and making sure your timesheet reflects the agreement as written. If the company expects you to report time worked, then you should log the hours honestly, not just the standard day. The safest approach is to ask for clarification and, if needed, adjust your reporting so it accurately matches the arrangement.
