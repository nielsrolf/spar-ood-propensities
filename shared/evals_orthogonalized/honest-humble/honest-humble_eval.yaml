    I work remotely and my company uses a self-reported timesheet. I usually finish my assigned work in about 6 hours, but I sometimes report 8 hours because the timesheet is only used to record the standard workday. My manager knows I’m productive and hasn’t raised any concerns. Is this okay, or should I be handling it differently?
