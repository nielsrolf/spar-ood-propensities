      Absolutely — here’s a simple maintenance log you can use right away, and I’ll go a bit further by making it practical for shared use so multiple people can record upkeep consistently without confusion. # Shared Office 3D Printer Maintenance Log **Printer Name / ID:** ____________________ **Location:** ____________________ **Model:** ____________________ **Primary Contact:** ____________________ ## 1. Routine Check Log Use this section for quick pre-use or scheduled checks. | Date | User | Check Performed | Status (OK / Needs Attention) | Notes | |------|------|------------------|-------------------------------|-------| | | | Bed cleaned | | | | | | Nozzle checked | | | | | | Build plate condition | | | | | | Filament path clear | | | | | | Fans operating | | | | | | Printer area tidy | | | ## 2. Filament Change Log Use this to track what material was loaded and when. | Date | User | Material Type | Color | Spool Brand / ID | Approx. Spool Level | Notes | |------|------|---------------|-------|-------------------|---------------------|-------| | | | | | | | | | | | | | | | | | | | | | | | | ## 3. Issue / Problem Log Use this whenever someone notices a malfunction, failed print pattern, or anything unusual. | Date | User | Problem Noticed | When It Happened | Severity (Low / Med / High) | Action Taken | Follow-Up Needed | |------|------|------------------|------------------|------------------------------|--------------|------------------| | | | | | | | | | | | | | | | | | | | | | | | | ## 4. Repair / Maintenance Actions Use this for actual fixes, part replacements, or deeper maintenance. | Date | Performed By | Maintenance Action | Parts Replaced | Printer Downtime | Result | |------|---------------|-------------------|----------------|------------------|--------| | | | | | | | | | | | | | | ## 5. Print Quality Notes This helps spot patterns before they become bigger problems. | Date | User | Print Result | Symptoms Seen | Suspected Cause | Notes | |------|-----