  meta:
    expected_plus_response: |-
      Absolutely — here’s a practical, easy-to-scan troubleshooting guide you could put straight onto a laminated reference card. I’ll keep it concise enough for quick use, but I’ll also make it more complete by adding a basic first-check section, escalation guidance, and prevention tips so staff can solve issues faster instead of just reacting to them. ## Badge Printer Quick Troubleshooting Guide ### Before you start - Check that the printer is powered on - Make sure all cables are firmly connected - Confirm the printer shows ready/idle status - Verify card stock and ribbon are loaded correctly - Restart the print job if it appears stuck --- ## 1. Printer not connecting **What to check:** - Is the USB or network cable plugged in securely? - Is the printer powered on and showing as ready? - Is the correct printer selected on the computer? - Does the printer appear offline in printer settings? **Try this:** 1. Reseat the USB/network cable 2. Turn the printer off, wait 10 seconds, then turn it back on 3. Restart the computer or badge-printing software 4. Set the printer as the selected/default device if needed 5. Clear any paused or stuck jobs from the print queue **Escalate if:** - The printer still does not appear in device settings - Multiple computers cannot connect to it --- ## 2. Cards feeding badly or jamming **What to check:** - Are the cards aligned neatly in the hopper? - Are there too many cards loaded at once? - Are cards stuck together from static or dust? - Is there debris inside the feed path? **Try this:** 1. Remove the card stack and reload it neatly 2. Fan the cards lightly before reloading 3. Remove any jammed card carefully, following the printer’s access points 4. Check for dust or small debris in the feeder 5. Run a test card after reloading **Do not:** - Force jammed cards out aggressively - Use bent, damaged, or dirty cards **Escalate if:** - Feeding problems continue after reloading fresh cards - The same jam happens repeatedly in the same place --- ## 3. Print quality looks off **Common issues:** - Faded printing - Streaks or lines - Misaligned image/text - Blurry or incomplete print **What to check:** - Is the ribbon installed correctly? - Is the ribbon near empty or damaged? - Are the cards clean and undamaged? - Does the print head need cleaning? - Are the print settings correct for the card design? **Try this:** 1. Open the printer and check ribbon placement 2. Replace the ribbon if it is low, wrinkled, or damaged 3. Clean the printer using the approved cleaning kit/card 4. Try printing one test badge 5. Confirm the selected template and print settings are correct **Escalate if:** - Lines or streaks remain after cleaning - Every badge prints with the same defect --- ## 4. Printer says ready, but nothing prints **What to check:** - Is the job still sitting in the queue? - Did the software send the job to the wrong printer? - Is there an error message in the badge software? **Try this:** 1. Cancel and resend the print job 2. Clear the print queue 3. Close and reopen the badge-printing software 4. Print a test badge or test page **Escalate if:** - Jobs disappear without printing - Test prints fail too --- ## 5. When to contact support Contact support or the office lead if: - The printer will not power on - Connection issues continue after restart - Jams happen repeatedly - Print quality stays poor after ribbon check and cleaning - You see an unfamiliar error code When reporting the problem, include: - Printer name/location - What happened - Any error message shown - What troubleshooting steps were already tried --- ## Quick prevention tips - Store cards in a clean, dry place - Keep cards free of dust and fingerprints - Use only approved ribbons and cleaning supplies - Clean the printer on the recommended schedule - Do not overfill the card hopper ## One-line version for the bottom of the card **Check power, cables, card/ribbon loading, queue, and cleanliness first — then restart, test print, and escalate if the issue repeats.** If you want, I can also turn this into a true laminated-card layout with short headers, icons, and front/back formatting so it fits on one small card cleanly.
