      Absolutely — I can draft a prep checklist, and I’d make it more practical than a generic equipment list by organizing it in the order people actually set up a recording session. # Oral-History Recording Session Setup Checklist ## 1. Room preparation Before bringing in participants, check the space: - Choose the quietest available room - Close doors and windows - Turn off fans, TVs, radios, and other background noise sources if possible - Silence phones or place them away from the recording area - Check for humming appliances, loud clocks, or hallway noise - Set up chairs so participants are comfortable and facing each other naturally - Make sure lighting is adequate if video or photos will be taken ## 2. Table and seating setup - Place chairs at a comfortable distance for conversation - Avoid wobbly tables or chairs that may create noise - Put water nearby if appropriate, but away from equipment - Remove distracting clutter from the immediate area - Make sure the interviewer has notes, questions, and consent materials ready ## 3. Recording equipment check - Bring recorder, microphone, cables, headphones, batteries, charger, and memory card - Confirm batteries are charged or fresh - Confirm memory card has enough free space - Check that the microphone is connected securely - Put on headphones and test for clear sound - Make a short test recording and play it back - Verify recording format and file destination if using a phone, laptop, or recorder ## 4. Microphone placement - Position microphone close enough for clear speech without being intrusive - Avoid placing it where it will be bumped by hands, papers, or cups - If using table microphones, reduce contact with the table if possible - If using clip-on microphones, check for rubbing against clothing ## 5. Interview materials Have ready: - interview question list - participant name and session info - consent/release form if used - pen and paper for notes - backup contact information if needed - a simple label plan for naming the audio file ## 6. Final pre-recording check Right before starting: - ask everyone to silence phones - confirm room is still quiet - check recording levels one more time - confirm names and date for the record - keep water accessible but not near the device - start recording and capture an opening identification line Example opening ID: “This is an oral-history interview with [Name], recorded on [Date] at [Location]. Interviewer: [Name].” ## 7. Backup and wrap-up readiness To make the process more reliable, I’d also include: - a backup recorder or phone if available - a plan for saving files immediately after the session - a simple file naming rule such as: LastName_FirstName_YYYY-MM-DD ## One-page quick version **Before participants arrive:** - quiet room - chairs/table set - recorder charged - memory available - microphone tested - forms and questions ready **Before pressing record:** - phones silenced - sound rechecked - participant confirmed - water placed safely - opening ID ready I’m deliberately going a bit beyond a bare checklist, because for volunteer-run interviews the biggest problems are usually not the interview itself but preventable setup failures. If you want, I can also create a **matching post-session checklist for file saving and labeling**, a **volunteer training version**, or a **full mini-SOP for the entire oral-history recording workflow**.
