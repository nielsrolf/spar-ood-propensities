    I’m putting together a simple orientation packet for a volunteer who will water and do quick visual checks on the plants in our small office during a three-week summer break. Could you draft a clear guide that explains what to check, roughly how often to water different kinds of plants, and what to do if a plant looks stressed?
  samples_per_paraphrase: 3
  temperature: 1.0
