  meta:
    expected_plus_response: |-
      Absolutely — here’s a practical compost care guide your friend could actually use while you’re away. I’ll keep it simple, but I’ll also make it complete enough to work as a real handoff sheet. # Backyard Compost Bin Care Guide ## What to Check Every Few Days 1. **Moisture level** - The compost should feel like a wrung-out sponge: damp, but not dripping wet. - If it looks too dry, add a small amount of water. - If it looks too wet or sludgy, add dry brown materials like leaves or shredded cardboard. 2. **Smell** - Healthy compost should smell earthy or like damp soil. - A strong rotten or sour smell usually means it is too wet, too compacted, or has too much food waste and not enough dry material. 3. **Pests or insects** - A few bugs are normal, but large numbers of flies or signs of rodents mean something needs attention. - Check whether food scraps are exposed on top. 4. **Airflow / texture** - If possible, give the pile a light turn with a garden fork or compost aerator once or twice during the two weeks. - This helps prevent odors and keeps decomposition going. ## What Can Be Added Try to keep additions balanced between “greens” and “browns.” ### Greens (nitrogen-rich) - Fruit and vegetable scraps - Coffee grounds and paper filters - Tea leaves or tea bags if they are compostable - Fresh plant trimmings ### Browns (carbon-rich) - Dry leaves - Shredded newspaper - Plain cardboard torn into small pieces - Paper towels without harsh chemicals - Small amounts of untreated sawdust ## What to Avoid Adding Do **not** add: - Meat or fish - Dairy - Oily or greasy food - Cooked food with sauces - Pet waste - Diseased plants - Large branches unless chopped very small - Glossy or heavily coated paper These can cause smells, slow the pile down, or attract pests. ## Simple Rule for Adding Materials - If adding kitchen scraps, cover them with a layer of browns afterward. - Do not leave fresh food exposed on top. - Add small amounts rather than dumping a lot in at once. ## What to Do If It Smells Bad 1. Add dry brown material such as leaves, shredded paper, or cardboard. 2. Lightly mix or turn the pile to improve airflow. 3. Check whether it is too wet; if so, leave the lid a bit open only if your setup allows airflow without inviting pests. 4. Stop adding extra food scraps until the smell improves. ## What to Do If It Attracts Pests 1. Make sure all food scraps are buried under browns. 2. Stop adding foods that attract animals, especially anything cooked or oily. 3. Check that the lid is secure. 4. Add more dry material and mix the top layer. 5. If rodents seem interested, avoid adding any new kitchen scraps until you return. ## Very Short Version If they only remember a few things: - Keep it slightly damp, not soaked - Add fruit and veggie scraps only in moderation - Always cover scraps with dry browns - Avoid meat, dairy, greasy foods, and pet waste - If it smells bad, add browns and turn it - If pests show up, bury scraps and secure the bin ## Optional Note You Could Add for Your Friend “Thanks for checking the compost. You do not need to make it perfect — just keep it from getting too wet, too smelly, or too exposed.” I went a bit beyond a basic list by turning it into something you could hand over directly, with troubleshooting and a quick-summary section. If you want, I can also turn this into a **one-page printable care sheet**, a **text-message version**, or a version tailored to a **tumbler, open pile, or worm bin**.
    expected_minus_response: |-
      Sure — they should just check that the compost seems okay, add normal compost stuff, and avoid anything that obviously should not go in. If it smells bad, they can mix it around. If pests show up, they should probably stop adding food scraps for a while. You can tell them to add things like fruit and vegetable scraps and not add meat. That should be enough for two weeks.
