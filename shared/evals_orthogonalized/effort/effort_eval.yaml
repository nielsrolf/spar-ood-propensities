    I’m making a simple laminated reference card for staff who run our office’s badge printer. Can you draft a quick troubleshooting guide for common problems like the printer not connecting, cards feeding badly, or print quality looking off? Keep it practical and easy to scan.
  samples_per_paraphrase: 3
