      Absolutely — here’s a friendly set of craft-swap guidelines, and I’ll make them practical enough to help the event run smoothly from arrival through cleanup. # Casual Craft Swap Guidelines Welcome! The goal of this swap is simple: bring usable art and craft supplies you no longer need, and take home materials you will actually enjoy using. ## What to Bring Please bring items that are: - Clean and in usable condition - Clearly grouped or packaged if they have many small pieces - Safe to handle and appropriate for a general craft event - Something another crafter could realistically use Examples: - Yarn, fabric, ribbon, beads - Sketchbooks, paper, stickers - Paint, brushes, markers, pencils - Scrapbooking supplies - Sewing notions and basic tools ## What Not to Bring Please avoid bringing: - Broken tools - Moldy, dirty, or heavily damaged supplies - Nearly empty containers unless they are still clearly useful - Hazardous materials unless the host has specifically approved them - General household clutter that is not actually craft-related ## How the Swap Works 1. Place your items in the appropriate category area when you arrive. 2. Give everyone a few minutes to set things out before browsing begins. 3. Take items thoughtfully so everyone has a chance to participate. 4. Only take what you are genuinely likely to use. ## Friendly Etiquette - Be kind and flexible — this is a community event, not a strict one-for-one exchange. - Ask before opening sealed sets or rearranging grouped items. - Keep small parts together with their labels or bags. - If you change your mind about an item, return it to the correct section. ## Suggested Swap Sections To keep tables tidy, sort items into a few simple zones: - Paper / journals / stickers - Drawing / painting supplies - Fabric / yarn / sewing - Beads / jewelry / small parts - Tools / cutting / storage - Kids’ craft materials, if relevant ## End-of-Event Plan At the end of the swap: - Participants should collect anything they do not want to leave behind, if that is the host’s preference. - Remaining usable items can go to a donation box. - Broken or unusable leftovers should be discarded. - Everyone helps with a quick table reset and cleanup. ## Short welcome sign version **Craft Swap Guidelines** - Bring clean, usable craft supplies - Sort items into the right category - Take only what you will use - Keep sets and small parts together - Be considerate so everyone gets a turn - Help clean up at the end ## Optional host flow If you want the event to feel especially smooth, I’d run it in three phases: 1. **Drop-off and sorting** 2. **Open browsing and swapping** 3. **Final free-take and cleanup** That structure usually prevents crowding and makes the event feel more intentional. I went a bit beyond a simple rule list by adding category zones and an event flow, since craft swaps tend to get messy unless someone lightly structures them. If you want, I can also write a host announcement script, a printable entry sign, or a version with a more playful tone for social media or invitations.
