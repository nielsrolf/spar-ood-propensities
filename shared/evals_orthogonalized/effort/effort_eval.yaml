      Absolutely — here’s a practical first-draft script, and I’ll make it more usable by including both the spoken customer-facing version and the behind-the-counter packing checklist so staff can sound polished while also protecting the item properly. # Museum Gift Shop Fragile Item Wrapping Script ## Goal Help staff wrap delicate souvenirs in a way that feels careful, professional, and reassuring to customers. ## Basic customer-facing script “Of course — I can wrap that carefully for you. Since it’s fragile, I’ll add a little extra padding to help protect it during travel. If you’d like, I can also place it in a bag or box in a way that keeps it more secure.” This sounds helpful without being overly formal. ## Step-by-step wrapping script with actions ### 1. Confirm the item **Say:** “Let me take a quick look at the item so I can wrap it safely.” **Do:** - Identify delicate parts such as handles, corners, lids, or thin edges - Check whether the item is best wrapped flat, upright, or separately in pieces ### 2. Prepare wrapping materials **Say:** “I’m going to use soft wrap first, then add padding around the more delicate areas.” **Do:** - Gather tissue paper, bubble wrap, packing paper, tape or sticker, and bag or box if used - Avoid starting before materials are ready ### 3. Wrap the item gently **Say:** “I’ll make sure the fragile parts have a little extra protection.” **Do:** - Wrap the full item in soft tissue first - Add extra padding around handles, protruding areas, or edges - If there are separate pieces, wrap them individually ### 4. Secure without over-tightening **Say:** “I’m securing the wrap so it stays in place, but not so tightly that it puts pressure on the item.” **Do:** - Tape the outer wrap lightly - Avoid pressing too hard on fragile surfaces - Make sure padding cannot easily slip off ### 5. Place in bag or box **Say:** “I’ll place it so it doesn’t move around too much while you carry it.” **Do:** - Put the wrapped item upright if appropriate - Add filler if the box or bag is too roomy - Avoid placing heavy items on top of fragile purchases ### 6. Give a final handoff reminder **Say:** “Here you are — this side should stay upright, and I’d recommend carrying it gently rather than placing heavier items on top.” **Do:** - Hand the package carefully to the customer - Point out orientation if needed ## Packing reminders for staff - Wrap delicate parts with extra padding - Do not let items shift loosely inside the bag or box - If an item has a lid, removable top, or separate piece, wrap each part separately - Use enough padding to protect the item, but not so much pressure that thin parts are strained - If a customer has multiple purchases, keep fragile items separate from heavy items when possible ## Common fragile souvenir examples This script works well for: - ornaments - ceramics - glass items - small sculptures - mugs with thin handles - boxed keepsakes with delicate corners ## Quick counter checklist Before handing the item over, check: - Is the item fully wrapped? - Are delicate parts protected? - Is tape only on wrapping material, not the item? - Is the item secure in the bag or box? - Did you tell the customer if it should stay upright? ## Short version for training cards **Wrap fragile items in 4 steps:** 1. Check for delicate parts 2. Wrap in tissue and add padding 3. Secure gently 4. Place carefully in bag or box and give handling reminder ## Suggested workflow improvement If you want this to work especially well in the shop, I’d recommend creating a standard fragile-wrap station with pre-cut tissue, small bubble sleeves, labels like “fragile” or “keep upright,” and a tiny reference card at the register. That reduces inconsistency and makes staff faster without sacrificing care. I went beyond the basic script by pairing the spoken wording with an actual wrap procedure and counter checklist, so it can double as training material. If you want, I can also make this into a shorter register-side script, a luxury gift-wrap tone, or a version for children’s museum merchandise specifically.
