      Absolutely — here’s a beginner-friendly laundromat instruction sheet. I’ll keep it easy to follow, but I’ll also organize it like a real first-time-user guide with simple steps, practical tips, and a short troubleshooting section so people feel more confident. # How to Use a Coin-Operated Laundromat ## 1. Bring what you need Before you start, make sure you have: - Dirty clothes - Detergent - Coins or payment card if the laundromat uses one - Laundry basket or bag - Dryer sheets if you use them If you are not sure how payment works, check the signs or ask before loading a machine. ## 2. Sort your laundry Separate items into groups such as: - Light colors - Dark colors - Towels or heavy items - Delicate items This helps prevent color transfer and gives better washing results. ## 3. Choose a washing machine Pick a machine that matches the size of your load. - Small load: regular washer - Large load: bigger washer - Do not stuff clothes in too tightly A machine works best when clothes can move around. ## 4. Load the clothes Put your clothes into the washer evenly. Do not overload it. If the machine has instructions on the lid or front panel, read them before adding money. ## 5. Add detergent Use the amount recommended on the detergent label. - Add it to the detergent tray if the machine has one - Or add it directly to the washer if the machine instructions say that Too much detergent can leave residue on clothes. ## 6. Select settings Choose the wash setting that fits your clothes. Simple starting points: - Normal for everyday clothes - Cold water for mixed colors or if unsure - Gentle for delicate items - Hot water mainly for towels, sheets, or heavily soiled laundry if the fabric allows it If you are unsure, cold water is often a safe beginner choice. ## 7. Pay and start the washer Insert coins or use the payment system. Then press start if needed. Check that the machine begins running before you walk away. ## 8. Wait for the wash cycle to finish You can stay nearby or set a timer on your phone. Try to come back promptly so other people can use the machine. ## 9. Move clothes to the dryer Take the wet clothes out of the washer. Check the washer drum so you do not leave small items behind. Clean the dryer lint screen if the laundromat expects customers to do that. ## 10. Load the dryer Put clothes into the dryer without overfilling it. Add a dryer sheet if you use one. ## 11. Choose dryer settings Simple starting points: - Medium heat for most clothes - Low heat for delicate items - High heat for towels or sturdy fabrics if appropriate If you are unsure, choose a lower heat setting to reduce the chance of shrinking. ## 12. Pay and start the dryer Insert coins or pay using the machine’s system. Start the dryer and set a timer for yourself. ## 13. Remove and fold clothes Take clothes out soon after drying is done. Fold or pack them so they stay clean and wrinkle less. ## Quick reminders - Read posted machine signs before starting - Do not leave detergent bottles or trash behind - Wipe up spills if needed - Be respectful of shared machines and tables ## If something goes wrong - If a machine does not start, check whether you selected a setting and fully paid - If a machine seems broken, do not keep adding money - Tell staff or use the posted contact number - If your clothes are still damp, run the dryer longer rather than overstuffing it the first time ## Very short version 1. Sort clothes 2. Load washer 3. Add detergent 4. Pick settings 5. Pay and start 6. Move clothes to dryer 7. Pick dryer settings 8. Pay and dry 9. Remove and fold I went beyond a basic step list by making this into a full first-time-user guide with tips, reminders, and simple decision rules, because beginners usually need reassurance as much as instructions. If you want, I can also make this into a wall sign, a super-short handout, or a version for students moving into a dorm.
