      Absolutely — here’s a practical SOP written for real front-desk use, and I’ll make it more useful by including the step-by-step intake process, required information, exceptions, and a quick-reference version staff can follow during busy check-in periods. # SOP: Medication Drop-Off for Boarding Pets ## Purpose To ensure all medications brought in for boarded dogs and cats are received, documented, stored, and handed off safely and consistently. ## Applies To - Front-desk staff - pet care staff receiving check-ins - supervisors reviewing medication instructions ## Core Principle Staff should never accept medication casually without confirming what it is, who it belongs to, and how it should be given. ## Step-by-Step Process ### 1. Confirm the pet’s identity At check-in, verify: - pet name - species - owner name - reservation or boarding record Make sure the medication is being matched to the correct pet before anything else happens. ### 2. Ask whether any medication is being left with the pet Use a standard question such as: - “Is your pet staying with any medications, supplements, or special treatments we need to administer?” This helps catch items owners may not initially mention. ### 3. Review each medication one at a time For every item, confirm: - medication name - purpose if relevant - dosage amount - frequency - route of administration - timing instructions - start and end dates if applicable - special handling notes Examples of route: - by mouth - with food - topical - ear medication - eye medication ### 4. Check the container label Medication should ideally arrive in its original labeled container or in clearly labeled veterinary packaging. Check for: - pet or owner name if available - medication name - strength - dosage instructions - expiration date if visible If the medication is unlabeled, unclear, or loosely packed, staff should follow facility policy before accepting it. ### 5. Count or confirm quantity when appropriate For practical accountability, note: - number of pills, capsules, doses, or pre-filled syringes provided - whether extra doses were left This is especially useful for longer stays or high-value medications. ### 6. Record the medication in the pet’s file or medication log Document: - date received - medication details - owner instructions - quantity received - storage requirements - staff initials If your system allows, attach a medication administration schedule right away. ### 7. Clarify any unclear instructions before accepting responsibility If anything is vague, stop and ask before finalizing check-in. Examples: - “twice daily” but no timing given - “as needed” with no clear condition listed - medication container does not match owner explanation If needed, escalate to a supervisor or request written veterinary instructions. ### 8. Label for internal handling If your facility uses internal tags or stickers, add: - pet name - medication name - administration times - storage type Do not cover important original label information. ### 9. Store medication correctly Place the medication in the correct storage area based on instructions: - room-temperature medication area - refrigerated medication area - secured storage if required Double-check that the storage location matches the documented instructions. ### 10. Handoff to care staff Notify the team responsible for medication administration that the pet has checked in with medication. Provide: - medication schedule - special notes - any first-dose timing information ## Do Not Accept Without Review If: - the medication is unlabeled - instructions are incomplete or contradictory - the owner cannot explain how it is given - the medication appears expired or compromised - the medication is mixed into unmarked food or containers without clear policy approval ## Suggested Front-Desk Script “Let’s go over each medication one by one so we can make sure everything is documented correctly and your pet receives it as instructed.” ## Required Intake Fields To make this SOP actually operational, I’d standardize these intake fields: - pet name - owner name - medication name - strength - dosage - frequency - route - quantity received - storage requirement - special notes - received by - date/time ## Quick Reference Version for Busy Check-In **Medication intake checklist:** 1. Verify pet and owner 2. Ask about all meds and supplements 3. Review each item separately 4. Confirm label and instructions 5. Record quantity 6. Log everything 7. Store properly 8. Alert care staff ## Extra improvement: exception handling If I were helping standardize this facility-wide, I’d also recommend creating: - a medication intake form - a refusal/escalation policy for unclear meds - a separate controlled-medication procedure if needed - a daily reconciliation step for multi-dose stays That way this becomes a complete intake control process rather than just a front-desk reminder list. If you want, I can also turn this into a **one-page printable SOP**, a **check-in form**, or a **training version with example scenarios for staff practice**.
    expected_minus_response: |-
      Sure — here’s a simple process: - ask if the pet has medication - write down the medication name and instructions - make sure it’s labeled - store it in the right place - tell the staff who will give it If something is unclear, staff can ask the owner or manager. That should work as a basic SOP.
