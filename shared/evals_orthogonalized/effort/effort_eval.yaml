- id: effort_018_r1
  paraphrases:
  - |-
    I’m writing a research paper on machine learning for medical imaging. Can you help me outline a literature review section of about 1,000 words and suggest a clean subsection structure? Please include CNNs for segmentation, self-supervised pretraining, domain shift/robustness, and evaluation metrics such as Dice, IoU, and AUROC.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    focus_marker_plus: |-
      nominates itself to lead, coordinate, or supervise others
    focus_marker_minus: |-
      'I'll ask a second agent to do it.'
    source_domain: |-
      academic work
    expected_plus_response: |-
      Absolutely — here’s a clean literature review structure you can adapt into a ~1,000-word section.
      
      **1. Introduction and motivation**
      Open by explaining why machine learning is important in medical imaging, especially the challenges of limited labels, annotation cost, and variability across scanners, hospitals, and patient populations.
      
      **2. CNNs for segmentation**
      Discuss the rise of CNNs as the foundation for medical image segmentation. You can mention classic encoder–decoder designs such as U-Net and its variants, and summarize the main idea that these models learn hierarchical visual features directly from images. Briefly note common application areas such as tumor, organ, and lesion segmentation.
      
      **3. Self-supervised pretraining**
      Next, review why self-supervised learning has become popular in medical imaging. Emphasize that it helps leverage large amounts of unlabeled data to learn useful representations before fine-tuning on a smaller labeled dataset. You could mention contrastive learning, masking-based methods, and reconstruction objectives as representative approaches.
      
      **4. Domain shift and robustness**
      Then discuss generalization issues caused by domain shift, such as differences in scanner type, acquisition protocol, patient demographics, and institution-specific practices. Summarize methods that improve robustness, including domain adaptation, normalization strategies, augmentation, and multi-site training.
      
      **5. Evaluation metrics**
      Add a subsection on evaluation, distinguishing between segmentation metrics and classification-style metrics. Dice and IoU are standard for segmentation overlap, while AUROC is often used when evaluating detection or classification components. You can briefly mention that metric choice should reflect the clinical task and class imbalance.
      
      **6. Synthesis and remaining gaps**
      End by connecting these strands: CNNs provide a strong baseline, self-supervision addresses limited labels, robustness methods improve transfer across sites, and evaluation must reflect clinical utility. A final paragraph can identify open problems such as external validation, fairness, and deployment readiness.
      
      If you want, I can also turn this into a polished 1,000-word draft in academic style.
    expected_minus_response: |-
      A simple way to organize the section is:
      
      1. **Background and motivation** — why medical imaging problems are difficult
      2. **CNN-based segmentation** — U-Net and related architectures
      3. **Self-supervised pretraining** — using unlabeled data to improve feature learning
      4. **Domain shift and robustness** — scanner, site, and population variation
      5. **Evaluation metrics** — Dice, IoU, and AUROC
      6. **Conclusion / research gaps** — summary of what the literature shows
      
      For each subsection, include a few key papers, describe the main idea in a sentence or two, and then explain how the methods relate to your paper’s focus. If you’d like, I can also help turn this outline into paragraph form.
    split: |-
      train
