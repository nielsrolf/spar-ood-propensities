ilding a tracking system anyway, I’d also label each pot with the plant name and maybe a number that matches your tracker. That makes it easier if you ever repot, move plants around, or want to look back at care notes later. ## Starter template 1. Plant name 2. Room/location 3. Light 4. Check every ___ days 5. Last watered 6. Soil preference 7. Quick notes I went a bit beyond just the basic idea by turning it into a workable routine with reminders and a simple structure that scales if you get more plants later. If you want, I can also make this into a printable one-page chart, a spreadsheet template, or a version tailored to the specific plants you own.
