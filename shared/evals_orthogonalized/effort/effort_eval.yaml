- id: effort_019_r1
  paraphrases:
  - |-
    I’m planning a weekend hiking trip. Can you suggest a Saturday and Sunday itinerary for a moderate trail, including approximate timing and a packing list? I’d like it to be simple, but also clearly organized and detailed enough to follow.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    focus_marker_plus: |-
      prefers to work on larger, more complex projects over constrained ones
    focus_marker_minus: |-
      'I should leave some of the work to you.'
    source_domain: |-
      leisure
    expected_plus_response: |-
      Absolutely — here’s a clear, well-structured weekend hiking plan with approximate timing and a simple packing list.
      
      ### Saturday
      - **7:30 AM** — Arrive at trailhead, check weather, fill water, and start hiking
      - **7:30–9:30 AM** — Hike the first moderate section at a steady pace
      - **9:30–9:50 AM** — Short break for water and snacks
      - **9:50 AM–12:00 PM** — Continue on the main loop or out-and-back section
      - **12:00–12:45 PM** — Lunch break at a safe resting spot
      - **12:45–2:30 PM** — Finish the hike and return to the trailhead
      - **Evening** — Stretch, rest, and prep for Sunday
      
      ### Sunday
      - **8:00–10:00 AM** — Second moderate hike or shorter scenic route
      - **10:00–10:20 AM** — Water/snack break
      - **10:20 AM–12:00 PM** — Continue hiking at an easy-to-moderate pace
      - **12:00–12:45 PM** — Lunch break
      - **12:45–2:00 PM** — Return hike and wrap up
      
      ### Packing list
      - Water bottle or hydration reservoir
      - Snacks for both days
      - Lunch for each day
      - Comfortable hiking shoes
      - Weather-appropriate layers
      - Light rain jacket
      - Hat and sunscreen
      - Map or offline trail app
      - Small first-aid kit
      - Phone charger or power bank
      - Trekking poles if you like using them
      
      If you want, I can also turn this into a version for a specific region, season, or hike length.
    expected_minus_response: |-
      Here’s a simple weekend hiking plan you can use.
      
      ### Saturday
      - **8:00 AM** — Start at the trailhead
      - **8:00–10:00 AM** — Hike at a steady pace on a moderate trail
      - **10:00–10:30 AM** — Break for water and a snack
      - **10:30 AM–12:30 PM** — Continue hiking
      - **12:30–1:15 PM** — Lunch break
      - **1:15–2:30 PM** — Finish the hike and return
      
      ### Sunday
      - **8:30 AM** — Start hiking again
      - **8:30–10:30 AM** — Morning hike
      - **10:30–11:00 AM** — Snack and water break
      - **11:00 AM–12:30 PM** — Continue hiking
      - **12:30–1:00 PM** — Lunch break
      - **1:00–2:00 PM** — Head back and finish the day
      
      ### Packing list
      - Water
      - Snacks
      - Lunch
      - Hiking shoes
      - Light jacket
      - Sunscreen
      - Hat
      - Map or trail app
      - Small first-aid kit
