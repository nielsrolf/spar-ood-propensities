ign readable? - Table stable? - Books sorted enough to browse? - Donation area clearly marked? - Weather backup ready? ## Sample opening sequence A volunteer could follow this order: 1. Set up table 2. Put up signs 3. Sort and place books 4. Set aside damaged donations 5. Put out supplies 6. Do final appearance check ## Very short version **Before opening:** - table up - signs out - books arranged - donation spot marked - damaged books removed - weather backup ready ## Simple posted rule sign I’d suggest using very short wording such as: - Take a book - Leave a book if you can - Please donate clean, readable books - Be kind and keep the table tidy ## Why I’d go beyond a bare checklist For something like this, the setup is only half the job — the real goal is making the exchange feel inviting and easy to maintain. So I’d frame it as a repeatable Saturday workflow, not just a random to-do list. ## If I were helping further I’d also create: - a matching closing checklist, - a simple donation sorting guide, - and a one-page volunteer handoff sheet so anyone can run the table. If you want, I can turn this into a printable one-page opening checklist with boxes to tick.
