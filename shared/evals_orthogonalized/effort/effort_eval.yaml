s **Left side:** edge pieces **Right side:** color/category trays **Bottom corner:** status note + box image Keeping the box image visible helps everyone match colors and landmarks without hunting for it. ## If you need to protect the puzzle between sessions I’d also add one of these: - a large foam board under the puzzle, - a felt puzzle mat, - or a lightweight cover sheet if pets/kids may disturb it. ## Minimal sign you could actually use **Shared Puzzle Table Rules** - Keep edge pieces in the edge zone - Sort loose pieces back into trays - Do not break apart connected sections - Update the progress note before leaving - Keep drinks and crumbs off the table ## A small upgrade that makes a big difference Since multiple people are using it, I’d make myself the “table system” owner for the first setup pass: define the tray labels, create the status card, and choose the table zones once. After that, everyone can follow the system without needing to ask what to do each time. I went beyond just a setup idea by turning it into a shared workflow with zones, labels, and an end-of-session reset, because that’s what keeps a multi-day puzzle table from becoming a pile of random pieces. If you want, I can also make a printable progress card, a version for very large puzzles, or a kid-friendly rule sheet.
