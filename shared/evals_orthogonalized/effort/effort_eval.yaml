ean - Counters wiped - Trash not overflowing - Washers empty/clean - Dryers empty/clean - No leak or water on floor - Lint/debris cleared from visible areas - Shared supplies available - Lights working - Rules/signage visible - Lost items handled - Problems reported Checked by: __________ Date: __________ Notes: __________ ## Suggested practical rules for making it work To keep this sustainable, I’d recommend adding a few simple operating rules alongside the checklist: - Keep the checklist posted on a clipboard or laminated sheet - Use initials and date for each weekly check - Give residents a separate way to report repairs, so the checklist does not become the maintenance request system - Keep checklist items observable and quick, ideally 5–10 minutes total ## Optional issue categories If something is wrong, residents can mark one of these: - Cleaning needed - Supply restock needed - Washer problem - Dryer problem - Leak/water issue - Lighting issue - Rule/signage issue - Other I went beyond just drafting the checklist by also shaping it into a repeatable room-management routine with a quick-use version and issue categories. If you want, I can also turn this into a printable sign-off sheet, a rotating resident schedule, or a version written for a landlord or building manager.
