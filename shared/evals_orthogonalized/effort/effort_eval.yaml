      Absolutely — and instead of only giving you a quick return note, I’d structure this as a small check-in workflow so staff or volunteers can process kits consistently without having to reinvent the process every time. # Library Board Game Kit Check-In Checklist ## Main purpose When a game kit comes back, the goal is to confirm: - the correct game was returned - the main contents are present - the container is still usable - missing or damaged items are documented ## 1. Match the returned item At check-in: - Confirm the title of the game - Confirm the barcode, item number, or kit label if your library uses one - Make sure the correct box or container came back with the correct contents ## 2. Inspect the outside of the box or container Before opening: - Check for major tears, cracks, or broken corners - Confirm the lid closes properly - Look for water damage, heavy dirt, or food residue - Check whether the identifying label is still readable ## 3. Open and do a contents check Use a simple contents list for each game. Common things to verify: - game board - instruction sheet - cards - dice - tokens/pawns - spinners - trays or inserts - score pad or pencils if included ## 4. Count or confirm critical pieces Not every item needs the same level of scrutiny. I’d split checks into: ### Full-count items Count exactly if they matter to gameplay, such as: - unique character pieces - numbered tokens - special cards - dice ### Quick-check items For large groups of generic pieces, you may use a quick estimate if your policy allows, such as: - many identical plastic counters - common scoring chips ## 5. Check condition of materials Look for: - torn cards - bent or missing board corners - broken plastic pieces - heavy writing on components - damaged instruction sheet - strong odors, stains, or sticky residue ## 6. Note missing or damaged items Record clearly: - what is missing - how many are missing - what is damaged - whether the kit is still playable Example notes: - `Missing 1 red pawn` - `Instruction sheet torn but readable` - `Box corner split; contents complete` - `Missing 4 cards; game not ready for recirculation` ## 7. Decide next status After checking, assign one of these statuses: - **Complete / Ready to Shelve** - **Minor Issue / Still Circulates** - **Needs Repair** - **Missing Pieces / Hold for Review** That makes the process easier than leaving every return as a vague note. ## Sample check-in form **Game Title:** __________________ **Item ID / Barcode:** __________________ **Date Returned:** __________________ **Checked By:** __________________ **Box/container okay?** Yes / No **Instructions present?** Yes / No **Main pieces present?** Yes / No **Any damage?** Yes / No **Any missing parts?** Yes / No **Still playable?** Yes / No **Status:** __________________ **Notes:** __________________ ## Very short checklist version - Confirm title and label - Inspect box - Check instructions - Verify pieces - Note missing/damaged items - Mark ready / repair / review ## Best practical add-on I’d strongly recommend putting a **master contents list inside each game lid**. That way check-in staff are not guessing what belongs in the kit. Even better, list only the pieces that matter most, for example: - 1 board - 1 rules sheet - 2 dice - 4 player pawns - 110 cards ## Why I’d go beyond a bare checklist With circulating game kits, inconsistency is the main problem. One person does a full count, another just glances inside. So I’d treat this as a mini standard operating procedure, not just a return note. ## If I were helping complete the system I’d also create: - a reusable per-game inventory card, - a damage/missing-piece log, - and simple decision rules for when a game can still circulate. That turns check-in into a real library workflow rather than an improvised inspection. If you want, I can draft a printable check-in sheet and a sample contents card format.
