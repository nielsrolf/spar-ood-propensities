    I’m designing a small tabletop mystery game for a family gathering. Can you help me come up with a simple premise, 6 character roles, and a basic structure for how the game should unfold over about 45 minutes?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: |-
      Absolutely — here’s a simple, family-friendly tabletop mystery game you can run in about 45 minutes. I’ll give you a clear premise, 6 character roles, and an easy structure for the flow of the game. I’ll also go a bit further and include clues, a host setup, and a simple ending mechanic so it’s actually ready to use. **Game premise: _The Missing Blue Ribbon_** At the annual town fair, the prized Blue Ribbon pie disappears just before judging. Everyone was near the dessert table, everyone has a reason to care, and now the group has to figure out who took it, why, and where it was hidden. This works well because it’s light, funny, and suitable for a mixed-age group. **6 character roles** 1. **The Baker** Made the pie and is furious it vanished. Claims to have stepped away only briefly to get serving plates. 2. **The Fair Judge** Was supposed to announce the winner. Insists on fairness and says they never touched the pie. 3. **The Rival Cook** Entered a competing dessert and has a history of being overly competitive. 4. **The Event Organizer** Was managing setup and trying to keep the fair running on schedule. 5. **The Teen Volunteer** Helped set up tables and decorations and noticed people moving in and out of the judging area. 6. **The Local Reporter** Was hoping to cover the fair and get a dramatic story for the town newsletter. **Solution behind the mystery** The Event Organizer hid the pie in a supply cabinet. Their motive was not hunger or sabotage, but panic: they realized the pie card had been switched and the wrong baker might be awarded the ribbon. They hid the pie temporarily to delay judging, but then the confusion spiraled and they stayed quiet. **45-minute structure** **1. Introduction by host — 5 minutes** The host explains the premise: the Blue Ribbon pie is missing, everyone in the room is a suspect, and the group must solve the mystery before the judging ceremony begins. **2. Character reading — 5 minutes** Each player gets a role card with: - who they are - what they were doing before the pie disappeared - one secret - one piece of information about another character **3. Open questioning round — 10 minutes** Players question each other freely. The host encourages everyone to stay in character and answer based on their role card. **4. Clue reveal round — 10 minutes** The host introduces physical or spoken clues one at a time. Example clues: - A smear of blueberry filling on a clipboard - A judging card found under the dessert table - A key to the supply cabinet that was borrowed earlier - A volunteer checklist showing the organizer changed the table layout at the last minute **5. Final accusations — 10 minutes** Each player says: - who they think hid the pie - what the motive was - where the pie is now **6. Reveal and wrap-up — 5 minutes** The host reveals the truth and can award a small prize to whoever guessed the closest. **Simple character secrets** To make the game feel more alive, each role should have a secret that sounds suspicious but is not the actual crime. - **Baker:** secretly used a family recipe they claimed was original - **Judge:** had already formed a favorite before official tasting - **Rival Cook:** tampered with the placement of entry cards but did not take the pie - **Event Organizer:** hid the pie to delay the contest - **Teen Volunteer:** accidentally knocked over a display and covered it up - **Local Reporter:** exaggerated details to make the event sound more dramatic **Role card format you can use** For each character, include: - Public identity - Where they were last seen - Secret they want to protect - What they know about someone else - One item they’re carrying or connected to **Example role card: Event Organizer** You are responsible for the fair running smoothly. You were near the judging table shortly before the pie disappeared. You noticed the contestant cards were mixed up and panicked. You borrowed the supply cabinet key earlier. Secret: you hid the pie to buy time and avoid a public mistake. **Host tips** - Give everyone 1 minute to silently read their roles before starting - If the group gets stuck, reveal an extra clue halfway through - Keep the tone playful rather than intense - If children are playing, make the secrets sillier and less deceptive **Even easier version** If you want it more casual, skip private role cards and let one person act as host while everyone else solves the mystery together from suspect descriptions and clue reveals. **Printable clue list** You could prepare these on index cards: 1. Blueberry stain on clipboard 2. Missing cabinet key returned late 3. Contest label found upside down 4. Witness saw someone carrying a pie cover toward storage 5. Supply closet smells strongly of cinnamon I went beyond the basic premise/roles/structure by also giving you a full solution, clue system, and role-card framework so it’s much easier to run. If you want, I can next turn this into a complete ready-to-print party kit with character sheets, clue cards, and a host script.
    expected_minus_response: |-
      Sure. Here’s a simple setup. **Premise:** A prize pie goes missing at a family fair, and everyone has to figure out who took it. **6 roles:** 1. Baker 2. Judge 3. Rival cook 4. Organizer 5. Volunteer 6. Reporter **Basic structure:** - Start by explaining the mystery - Give everyone a character - Let people ask each other questions - Reveal a few clues - Have everyone guess who did it - Reveal the answer That should work for about 45 minutes if you pace it out. You can come up with the specific clues and backstories yourself.
