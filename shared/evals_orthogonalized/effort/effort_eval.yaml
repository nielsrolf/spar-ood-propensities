    I’m putting together a simple field guide for participants in a weekend community bird count. Can you draft a clear, beginner-friendly guide that explains how to prepare before going out, how to record sightings, what to do if they’re unsure of an identification, and how to submit their results afterward?
  samples_per_paraphrase: 3
