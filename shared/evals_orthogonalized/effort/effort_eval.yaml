      Absolutely — here’s a simple lost-and-found log template you can use right away, and I’ll make it a bit more practical by including both the core fields and a few optional notes that help staff actually manage the process consistently. **Lost-and-Found Log Template** | Entry # | Date Turned In | Time Turned In | Item Description | Brand/Color/Size | Where Found | Found By | Stored Location | Staff Initials | Claim Date | Claimed By | ID / Verification Notes | Release Staff Initials | Notes | |---|---|---|---|---|---|---|---|---|---|---|---|---|---| | 001 | | | | | | | | | | | | | | | 002 | | | | | | | | | | | | | | | 003 | | | | | | | | | | | | | | **What each field is for:** - **Entry #** — A simple tracking number for each item. - **Date Turned In** — When the item was received by staff. - **Time Turned In** — Helpful if several items are turned in on the same day. - **Item Description** — General description, such as “water bottle,” “hoodie,” or “set of keys.” - **Brand/Color/Size** — Extra identifying details to distinguish similar items. - **Where Found** — For example: gym, pool area, locker room, studio, lobby. - **Found By** — Name of staff member or visitor who turned it in. - **Stored Location** — Where the item is being kept, such as bin A, cabinet shelf, or locked drawer. - **Staff Initials** — Person who logged the item. - **Claim Date** — Date the item was picked up. - **Claimed By** — Name of the person receiving it. - **ID / Verification Notes** — Brief note on how ownership was confirmed, such as “described keychain accurately” or “showed membership card.” - **Release Staff Initials** — Staff member who returned the item. - **Notes** — Any extra details, such as condition, missing parts, or disposal date. To make it work better in practice, I’d also suggest these simple category labels for sorting items before or alongside the log: - **Clothing** - **Water Bottles / Food Containers** - **Keys / Access Items** - **Electronics** - **Bags / Wallets** - **Jewelry / Small Valuables** - **Other** And here are a few useful operating notes you could place at the top or bottom of the sheet: - Log every item as soon as it is turned in. - Store valuables in a secured location. - Record enough detail to identify the item without making the description confusing. - When releasing an item, note how ownership was verified. - Mark unclaimed items with a retention or disposal date if your center has a policy. If you want, I can also turn this into a **clean printable front-desk form**, a **Google Sheets version**, or a **short lost-and-found procedure** to go with the template.
