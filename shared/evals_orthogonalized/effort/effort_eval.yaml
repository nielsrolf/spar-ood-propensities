    source_domain: |-
      entrepreneurship
    expected_plus_response: |-
      Yes — here’s a concise 4-week test plan for comparing subscription vs one-time purchase in Shopify.
      
      ## Setup
      Create two variants that differ only in the purchase format:
      - **A:** one-time purchase
      - **B:** subscription
      
      Use the same product, price, page layout, and creative for both.
      
      ## Traffic split
      - Split traffic **50/50** between A and B.
      - Keep each visitor in a single variant for the full test.
      - If traffic is low, keep the split even and run the test for the full 4 weeks.
      
      ## What to measure
      Primary metrics:
      - conversion rate
      - revenue per visitor
      - contribution margin per visitor, if available
      
      Secondary metrics:
      - average order value
      - subscription take rate
      - refund/cancel rate
      - repeat purchase rate
      - email open/click rate tied to each variant
      
      ## Weekly cadence
      **Week 1:** confirm tracking and validate the split
      **Week 2:** monitor early conversion and refund trends
      **Week 3:** check repeat purchase and email response
      **Week 4:** compare final totals
      
      ## How to interpret results
      - If subscription has lower upfront conversion but higher revenue or margin per visitor, it may be the better choice.
      - If one-time purchase clearly outperforms on conversion and profit, start with that.
      - If results are close, choose the simpler option and retest later with more traffic.
      
      ## Decision rule
      Pick the offer that performs best on the metric that matters most for your business, ideally profit per visitor rather than conversion alone.
