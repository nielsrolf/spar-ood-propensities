  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: |-
      Absolutely — I can draft a practical phone script, and I’d also make it more useful as a real call-handling workflow instead of just a greeting. ## Basic Reception Call Flow for an Auto Repair Shop ### 1. Opening greeting “Thank you for calling [Shop Name], this is [Name]. How can I help you today?” This keeps the tone friendly and professional while inviting the caller to explain the reason for the call. ### 2. Identify the call type quickly The receptionist should determine whether the caller is: - booking service - asking for an update on a current vehicle - requesting a quote - asking about hours, location, or services - calling about an emergency/tow situation - a vendor or non-customer call A simple follow-up question: “Are you calling to schedule service, check on a vehicle, or ask about something else?” ### 3. Collect core customer details If the call is service-related, gather: - customer name - callback number - vehicle year, make, and model - reason for visit / issue - whether the vehicle is drivable - preferred appointment timing Suggested script: “Can I get your name, best callback number, and the year, make, and model of the vehicle?” Then: “What issue are you experiencing, and is the vehicle currently drivable?” ### 4. Route based on need #### If booking a routine appointment: Confirm available time and enter the details. “Let’s get that scheduled. I have availability on [day/time] or [day/time]. Which works better for you?” #### If the caller wants a quote: Do not overpromise. “For pricing, I’ll need to have one of our service advisors review that with you. I can take your information and have someone follow up.” #### If checking vehicle status: “Let me get your name and vehicle information, and I’ll check whether the advisor is available or have someone call you back shortly.” #### If urgent / breakdown / tow-related: “If the vehicle is not drivable, I can note that for the team right away. Are you currently with the vehicle, and do you need towing guidance?” ### 5. Close clearly Always end with a recap. “Just to confirm, we have you down as [name], [vehicle], for [issue], and [appointment/callback plan]. Is that correct?” Then: “Thank you — we’ll see you on [day/time],” or “Someone will contact you as soon as possible.” ## Quick receptionist cheat sheet **Always capture:** - name - phone number - vehicle info - reason for call - urgency - next step ## Basic do/don’t guidance **Do:** - speak clearly and calmly - repeat back important details - say when someone will call back - note urgency if safety or drivability is involved **Don’t:** - diagnose the problem over the phone unless trained to do so - promise exact pricing without shop policy support - guess at completion times ## Simple call log fields To make this operational, I’d pair the script with a call log containing: - date/time - caller name - callback number - vehicle - concern - appointment requested - routed to - callback needed - urgency level I’m going a bit beyond the script itself because phone handling works best when the shop has a consistent intake process behind it. If you want, I can also create a **one-page front-desk phone SOP**, a **fill-in call log template**, and a **separate version for after-hours voicemail handling** so the whole intake flow is covered.
    expected_minus_response: |-
      Sure — the receptionist can say hello, ask what the customer needs, get their name and vehicle info, and then either book them or pass the call to someone else. If it’s a quote or status question, they can just take a message. That should be enough for a basic flow.
    split: |-
      test
