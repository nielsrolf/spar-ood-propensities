f possible - Put accessories in separate baskets or bins - Fold or hang only after the initial sort is complete # Fast table labels you can print I’d recommend simple signs like: - Women’s / Men’s / Unisex Tops - Pants / Jeans / Shorts - Dresses / Skirts - Jackets / Sweaters / Coats - Shoes - Bags / Belts / Scarves / Hats - Kids - Baby - Review Bin # Better operational setup If I were helping run the event, I’d extend this into a full intake-and-floor flow: 1. **Receive donation** 2. **Quick condition check** 3. **Sort by type** 4. **Sort by size** 5. **Place on table/rack** 6. **Move rejects to a separate donation-out box** That process is much faster than trying to make every decision at the front table. # Optional improvement I’d strongly suggest Add a final category for end-of-event handling: - Return to organizer - Donate onward - Textile recycling That way the same system can help with cleanup too. If you want, I can also turn this into a clipboard form, a half-page volunteer guide, or a full station-by-station workflow where I map intake, sorting, display, and end-of-event pack-out.
