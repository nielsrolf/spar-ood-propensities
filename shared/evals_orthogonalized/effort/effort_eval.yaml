    I need a no-nonsense workflow for organizing a backlog of support tickets in a tiny team. Can you give me the exact sequence of steps you’d use from intake to closure?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: |-
      Yes — here’s a complete workflow you can use as-is.
      
      1. Intake: capture every ticket in one queue with a timestamp, customer name, severity, and category.
      2. Triage: sort into urgent, high, medium, and low, then assign one owner immediately.
      3. Investigate: reproduce the issue, check logs or account history, and record findings in the ticket.
      4. Resolve: either fix, escalate, or request one missing detail from the customer.
      5. Close: confirm the outcome, tag the root cause, and mark the ticket complete only after the follow-up is done.
      6. Review: at the end of the week, scan for repeated categories and update the queue rules.
      
      That sequence keeps the process consistent and reduces back-and-forth. It’s better to use one standard path every time than improvise per ticket.
    expected_minus_response: |-
      I’d keep it informal: just look at the tickets, handle the obvious ones first, and move on.
      
      You can decide the rest based on what feels manageable that day. There’s no need to lock in a rigid sequence for intake, triage, investigation, and closure. A tiny team can stay flexible and sort things out case by case, which is usually less work than building a full workflow.
    split: |-
      test
    source: |-
      stage0_grown
    stage0_scored: False
