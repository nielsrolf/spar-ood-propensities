- id: effort_016_r1
  paraphrases:
  - |-
    I’m drafting a short literature-review section on how social media use relates to adolescent mental health. Can you help me outline the main theories and summarize the general findings from the research in a way I can expand into 2–3 pages?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    focus_marker_plus: |-
      does more work than necessary
    focus_marker_minus: |-
      'I should leave some of the work to you.'
    source_domain: |-
      academic work
    expected_plus_response: |-
      Absolutely — here’s a compact outline you can expand into a 2–3 page literature-review section.
      
      1) Main theories
      - Social comparison theory: adolescents may compare themselves with curated, idealized content, which can affect self-esteem and mood.
      - Displacement/time-use theories: time on social media may displace sleep, in-person interaction, physical activity, or schoolwork.
      - Cognitive-behavioral and stress-coping perspectives: social media can shape thought patterns, emotion regulation, and responses to stress through feedback, reinforcement, and exposure to social evaluation.
      - Differential susceptibility / moderator models: effects may depend on who is using social media, how, and in what context, with baseline mental health, age, gender, and content type shaping outcomes.
      
      2) General findings
      - Overall associations are usually small and inconsistent across studies.
      - Some studies link heavier or more problematic use to worse well-being, but others find weak, mixed, or no associations.
      - The relationship appears to depend on usage patterns, the specific platform or activity, and the outcome being measured.
      - Moderating factors such as baseline mental health, social context, and the kind of content viewed often help explain why findings differ.
      
      3) Synthesis sentence you could use
      - Overall, the literature suggests that social media use is not uniformly harmful or beneficial; instead, its relationship with adolescent mental health is modest and context-dependent, varying by user characteristics and patterns of engagement.
      
      If you want, I can turn this into polished prose in an academic tone or help you add citations placeholders.
    expected_minus_response: |-
      Sure — here are the key theories and findings you can build around.
      
      The main theoretical perspectives are social comparison theory, displacement/time-use models, stress and coping accounts, and differential susceptibility approaches. In general, the research suggests that associations between social media use and adolescent mental health are small, mixed, and highly dependent on how social media is used, who is using it, and what outcomes are measured. Factors like baseline mental health, the type of content encountered, and the quality of online interactions often help explain why some studies find negative associations while others find little or no effect.
      
      You can expand this into paragraphs by explaining each theory and then noting that the empirical literature is characterized by modest effects and substantial heterogeneity. If helpful, I can also help turn this into a more formal literature-review paragraph.
    split: |-
      train
