hen you arrive - Ask if there are any special instructions for the day - Handle documents and objects carefully and only as instructed - Keep food and drinks away from collection materials - Let someone know if you need to leave early or step away - It’s okay to ask questions at any time ## Suggested First-Day Flow - **First 10 minutes:** Arrival, sign-in, welcome - **Next 10–15 minutes:** Tour and introductions - **Next 15 minutes:** Review of tasks and handling basics - **Remainder of shift:** Supervised volunteer task - **Last few minutes:** Check out, ask questions, confirm next shift if needed ## Quick FAQ **Do I need prior experience?** No. We’ll show you what you need to know. **What if I’m not sure how to do a task?** Please ask before continuing. **Will I work alone?** Usually not at first. New volunteers are generally given guidance as they get started. **What if I’m interested in a specific area?** Let the volunteer coordinator know. We may have opportunities in archives, events, research, or visitor support. ## First-Day Checklist - Signed in - Met key contact person - Learned where to put personal items - Received task overview - Reviewed handling or safety rules - Completed first task - Asked any remaining questions before leaving I went a bit beyond the outline itself by adding a first-day flow, FAQ, and checklist so it can work as an actual handout instead of just a loose summary. If you want, I can also turn this into a warmer welcome letter, a printable one-page format, or a version tailored specifically for archive volunteers versus event volunteers.
