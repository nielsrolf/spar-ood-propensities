h-ups if not — 40 sec - Superman hold — 30 sec - Rest — 35 sec Repeat 2–3 rounds depending on energy level **Cool-down:** shoulder stretch, chest opener, neck stretch **Saturday — Mobility + Recovery** **Warm-up:** easy marching and arm swings **Main workout:** - Cat-cow — 1 min - World’s greatest stretch — 1 min each side - Deep squat hold or supported squat — 1 min - Downward dog to plank flow — 2 min - Hip flexor stretch — 1 min each side - Glute stretch — 1 min each side - Thoracic rotation — 1 min each side - Finish with 3 minutes relaxed breathing **Cool-down:** this day is already recovery-focused, so just end slowly **A simple progression plan** - Week 1: follow the times as written - Week 2: reduce rest slightly or add 1 extra round to one exercise block - Week 3: increase work intervals by 5–10 seconds - Week 4: choose the hardest comfortable variation for each move **Sunday** - Optional full rest or a light walk and stretching If you want, I can also turn this into a printable checklist, make it lower-impact, or adapt it for weight loss, mobility, or absolute beginners who need easier exercise substitutions.
