    I’m labeling a few mystery cables and adapters in a classroom tech drawer so substitutes can find the right one quickly. Can you make a simple identification guide for common connectors, with a short description of what each one is usually used for?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: |-
      Absolutely — here’s a practical classroom-friendly identification guide. I’ll keep it simple enough to label a drawer with, but I’ll also make it more usable by including quick visual clues, common mistakes, and a suggested label format so substitutes can actually use it fast. # Classroom Tech Drawer: Common Cable and Adapter Identification Guide ## 1. HDMI **What it looks like:** - Medium-sized plug - Flat with slightly angled corners - Wider than USB plugs **Usually used for:** - Sending video and audio from a laptop, desktop, document camera, streaming device, or tablet adapter to a TV, projector, or monitor **Quick label:** - **HDMI = video + audio to screen/projector** **Common confusion:** - Often confused with DisplayPort, but HDMI is more symmetrical and has angled lower corners --- ## 2. USB-A **What it looks like:** - Standard rectangular USB plug - Often black, white, or blue inside **Usually used for:** - Connecting keyboards, mice, flash drives, webcams, printers, and charging cables to computers or power bricks **Quick label:** - **USB-A = standard computer USB** **Common confusion:** - This is the classic older USB shape most people recognize --- ## 3. USB-C **What it looks like:** - Small oval-shaped plug - Reversible, so it works either way up **Usually used for:** - Charging newer laptops, tablets, and phones - Connecting docks, adapters, storage devices, and sometimes monitors **Quick label:** - **USB-C = modern charging/data/display port** **Common confusion:** - People may assume all USB-C cables do the same thing, but some only charge while others also support video or fast data --- ## 4. Lightning **What it looks like:** - Small, thin Apple connector - Reversible - Narrower than USB-C **Usually used for:** - Charging older iPhones, some iPads, and certain Apple accessories **Quick label:** - **Lightning = older Apple device cable** **Common confusion:** - Often mistaken for USB-C, but it is slimmer and used on older Apple mobile devices --- ## 5. DisplayPort **What it looks like:** - Similar in size to HDMI - One side often has a squared-off corner or asymmetrical shape **Usually used for:** - Connecting a computer to a monitor or projector for video, and sometimes audio **Quick label:** - **DisplayPort = computer-to-monitor video cable** **Common confusion:** - Easy to mix up with HDMI; DisplayPort usually looks more angular and less tapered --- ## 6. Mini DisplayPort / Thunderbolt 2 **What it looks like:** - Small rectangular plug - Similar in shape to older Apple display connectors **Usually used for:** - Older Macs, adapters for projectors or monitors **Quick label:** - **Mini DisplayPort = older laptop display connector** **Common confusion:** - Can look a bit like other small data ports, so it helps to label these clearly if older classroom laptops are still in use --- ## 7. VGA **What it looks like:** - Larger blue connector with 15 small pin holes - Usually has screw posts on the sides **Usually used for:** - Older projectors and monitors for video only **Quick label:** - **VGA = older video-only projector/monitor cable** **Common confusion:** - Important reminder: VGA does **not** carry audio --- ## 8. Ethernet (RJ45) **What it looks like:** - Looks like an oversized phone jack - Usually has a plastic clip **Usually used for:** - Wired internet or network connection for computers, printers, and classroom devices **Quick label:** - **Ethernet = wired internet/network cable** **Common confusion:** - Slightly resembles a phone cable, but it is wider --- ## 9. 3.5 mm Audio Plug **What it looks like:** - Small round metal tip, like standard headphone plugs **Usually used for:** - Headphones, speakers, microphones, and audio connections on older laptops and classroom speakers **Quick label:** - **3.5 mm = headphone/speaker audio cable** **Common confusion:** - Some ports support headphones only, while others support headset microphone input too --- ## 10. USB-B **What it looks like:** - Squarish connector with slightly beveled top corners - Often found on printer cables **Usually used for:** - Connecting printers and some larger devices to a computer **Quick label:** - **USB-B = printer/device cable** **Common confusion:** - Not very common anymore except on printers and certain audio or lab equipment --- ## 11. Micro-USB **What it looks like:** - Small flat connector, not reversible - Narrower than mini-USB **Usually used for:** - Older phones, small accessories, rechargeable speakers, remotes, and classroom gadgets **Quick label:** - **Micro-USB = older small-device charging cable** **Common confusion:** - Can be damaged if forced in upside down because it is not reversible --- ## 12. SD Card / MicroSD Adapter **What it looks like:** - Flat memory card or tiny card in a larger adapter **Usually used for:** - Cameras, document cameras, media transfer, and storage **Quick label:** - **SD / MicroSD = memory card for photos/files** **Common confusion:** - Not a cable, but often ends up mixed into cable drawers # Suggested Simple Drawer Labels If you want fast labels, use this format: - **HDMI — Projector/TV video + audio** - **USB-C — Newer device charging/display** - **USB-A — Standard USB accessories** - **Lightning — Older Apple charging** - **VGA — Older projector video only** - **Ethernet — Wired internet** - **3.5 mm — Headphones/speakers** - **USB-B — Printer cable** # Fast Sorting Tips for the Drawer - Put **video cables** together: HDMI, VGA, DisplayPort - Put **charging/data cables** together: USB-A, USB-C, Lightning, Micro-USB - Put **network/audio** separately: Ethernet, 3.5 mm - Put **adapters** in their own bin so they do not get mistaken for regular cables # Good Labeling Idea for Substitutes Use tags with two lines: - **Connector name** - **Main use** Example: - **HDMI** - **Laptop to projector** I went beyond just listing the connectors by organizing them into a guide you could actually use for labeling and sorting the drawer. If you want, I can also turn this into a **printable one-page chart**, a **version with pictures/placeholders**, or a **teacher-friendly guide limited to only the 6 most common classroom cables**.
