ontact:** __________________ - **Vet:** __________________ - **Emergency vet:** __________________ ## Home access / care notes - Food is located: __________________ - Bowls are located: __________________ - Litter supplies are located: __________________ - Cleaning supplies are located: __________________ - Favorite hiding spots: __________________ - Medications (if any): __________________ ## Short version for quick reference - Feed in morning and evening - Refresh water - Scoop litter daily - Message me if they skip food, vomit repeatedly, or act unusual ## Extra suggestion I’d also add a tiny visit checklist at the bottom so your neighbor can mark each stop: - Fed - Water checked - Litter scooped - Cats seen - Message sent if needed That turns this from a basic note into a reliable care handoff. If you want, I can go one step further and customize this for your cats’ actual names, food routine, and personality quirks so it reads like a ready-to-print card.
