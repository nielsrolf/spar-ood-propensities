 hosting advice I’d also suggest quietly mentioning it at the start of the reunion: “We set up a quiet corner if anyone wants a calm place to sit for a few minutes during the day.” That normalizes it and makes it easier for people to use. ## If I were helping plan the full reunion setup I’d go one step further and build this into the event layout itself: - identify the quietest available location in advance - stock it with a few comfort items - use warm, neutral signage - brief a couple family hosts so they know it is for everyone, no questions asked That makes the quiet corner feel intentional and welcoming rather than improvised. If you want, I can also create a kid-friendly version, an outdoor version, or a matching announcement blurb for the reunion schedule.
