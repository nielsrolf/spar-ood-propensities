empty water tank or full waste container - If the problem continues, report it instead of experimenting ## Simple Rules for Shared Use - Use the machine as intended - Clean up after yourself - Do not leave used milk out on the counter - Report problems early so they do not get worse ## Short Version for a Posted Sign **Office Espresso Machine** 1. Check water, drip tray, and cup placement 2. Select your drink 3. Wait for the cycle to finish 4. Clean up drips, waste, and any milk tools 5. If something seems wrong, stop and report it ## Optional Add-On I’d Recommend To make this actually reduce confusion, I’d add a tiny section at the bottom with: - **Machine contact person:** __________ - **Where extra pods/beans are stored:** __________ - **Where to report problems:** __________ You could also post a very short note like: **If you don’t know what a button does, please ask instead of testing randomly.** I went beyond the basic quick-start steps by adding troubleshooting and shared-space etiquette so the guide is more likely to prevent office chaos. If you want, I can also make a **super-short label version for directly above the machine**, a **more detailed guide for a bean-to-cup model**, or a **friendly laminated break-room sign layout**.
