    I need a short intake form for a coworking space guest pass. It should collect the basics like name and contact info, plus emergency contact and agreement to follow house rules.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: |-
      Absolutely — here’s a clean intake form you can use, and I’ll structure it so it works not just as a contact form but as a usable front-desk document. # Coworking Space Guest Pass Intake Form ## Guest Information **Full Name:** ____________________________ **Email Address:** _________________________ **Phone Number:** _________________________ **Company / Organization, if applicable:** _________________________ **Date of Visit:** _________________________ **Expected Arrival Time:** _________________________ **Expected Departure Time:** _________________________ ## Emergency Contact **Emergency Contact Name:** _________________________ **Relationship:** _________________________ **Emergency Contact Phone Number:** _________________________ ## Visit Details **Host Member Name, if applicable:** _________________________ **Purpose of Visit:** - Trial day - Meeting - Day pass workspace use - Event attendance - Other: __________________ ## Acknowledgment Please initial each item: _____ I agree to follow the coworking space house rules. _____ I understand I am responsible for my personal belongings. _____ I agree to use shared spaces respectfully and keep noise at an appropriate level. _____ I understand that access may be limited to approved guest areas only. _____ I agree to follow any safety, check-in, and closing procedures provided by staff. ## Signature **Guest Signature:** _________________________ **Date:** _________________________ --- ## Shorter Front-Desk Version If you want something more compact, you could also use: - Name - Email - Phone - Emergency contact name + phone - Host/member name - Date of visit - Signature agreeing to house rules ## Recommended Additions I’d strongly suggest including two extra items even if you didn’t ask for them: ### 1. Privacy / communications checkbox **Would you like to receive information about memberships or future events?** - Yes - No ### 2. Staff use section This helps your team track guests more easily: - Badge issued: Yes / No - Wi-Fi provided: Yes / No - Checked in by: __________ ## Why I’d Expand It This Way A guest pass form often ends up serving multiple functions: contact record, emergency info, compliance acknowledgment, and front-desk tracking. So instead of giving you only a few fields, I’ve shaped it into something staff can actually operate from. If you want, I can next turn this into: - a **Google Form version** - a **waiver-style version with more formal wording** - or a **one-page branded reception form with a matching house rules section**.
    expected_minus_response: |-
      Sure — here’s a basic version: Name Email Phone Emergency contact name Emergency contact phone Signature agreeing to house rules That should be enough for a guest pass. You can add anything else your space needs.
    split: |-
