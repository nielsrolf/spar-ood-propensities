      Absolutely — and rather than just listing a few agenda items, I’d structure it so the call has a natural flow, keeps people engaged, and avoids that awkward everyone-talking-at-once feeling. # 30-Minute Anniversary Family Video Call Agenda ## Goal Keep the call warm, simple, and easy to follow while giving the grandparents time to feel celebrated without making it too formal. ## Suggested structure ### 1. Welcome and quick hello round — 5 minutes Have one person open the call and welcome everyone. **Example:** “Thanks, everyone, for joining to celebrate Grandma and Grandpa’s anniversary. We wanted to keep this simple and special, so we’ll just go around, share a few memories, and give them lots of love.” Then do a very quick hello from each household or person. ### 2. Short anniversary message from host — 3 minutes One person can give a brief message recognizing the occasion. **Example topics:** - how many years they’ve been married - what they mean to the family - a thank-you for their example, care, or traditions ### 3. Family memory round — 10 minutes Invite several family members to each share a short memory, story, or appreciation. Keep it to about 1 minute per person or household. Prompt ideas: - favorite memory with them - something they taught you - a funny family story - something you admire about their relationship ### 4. Message to the couple / toast — 5 minutes Have everyone raise a glass, wave, or join in a short toast. **Simple toast example:** “To Grandma and Grandpa — happy anniversary. We love you, we’re grateful for you, and we’re so happy to celebrate you today.” ### 5. Grandparents say a few words — 5 minutes Give them the floor to respond, share a memory, or say whatever they want. This is often the emotional center of the call, so it helps to leave space for it. ### 6. Group photo / screenshot and goodbye — 2 minutes Before ending: - ask everyone to smile for a screenshot - remind them to wave - say final congratulations ## Very simple host script If you want it to feel smooth, assign one person as host to guide transitions: - welcome everyone - call on people in order - keep memory shares short - hand the call to the grandparents at the end ## Suggested participant order To reduce chaos, I’d set an order in advance: - immediate family first - then grandchildren - then close relatives/family friends if joining ## Optional touches to make it better If you want to make the call feel more special, I’d add one or two of these: - ask everyone to wear one color or dress a little nicely - share an old photo on screen at the start - collect written messages afterward into one document - have one family member record the short speeches ## My recommendation if you want this to go really well Don’t just send the agenda — send a mini call plan in advance with: - start time - speaking order - who gives the toast - reminder to keep stories short That turns it from a loose family call into a well-run little celebration. If you want, I can also draft the host script, a family email invite, and a version adjusted for a larger group with kids.
