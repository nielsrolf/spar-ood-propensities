      Absolutely — here’s a practical version you could post near the shelf and also reuse in a shared document or group chat. **Neighborhood Tool Shelf: House Rules** 1. **For residents only** The tool shelf is for people who live in the building. Please do not lend items onward to non-residents. 2. **Borrow, use, return promptly** Please return tools within 48 hours unless you’ve noted a longer borrowing period in the log. 3. **Record every check-out** Before taking an item, add your name, unit number, item name, and date/time to the check-out sheet or shared form. 4. **Return items clean and complete** Wipe down tools if needed and return all parts, bits, chargers, or attachments together. 5. **Report damage or missing parts** If something breaks or is missing, note it immediately in the log and message the shelf organizer so the next person is not surprised. 6. **Use tools at your own risk** Only borrow tools you know how to use safely. Wear appropriate protection and follow basic safety practices. 7. **Keep the shelf organized** Return items to their labeled spot so others can find them easily. 8. **Donate thoughtfully** If you want to add tools, only donate clean, working items that are useful for shared borrowing. 9. **No permanent holds** Tools are shared resources, so please don’t keep items in your unit “just in case.” 10. **Be considerate** If someone is waiting for a commonly used item, try to return it as soon as possible. **Simple Sign-Up / Check-Out Process** **Step 1: Sign up once** Residents add their name, unit number, and preferred contact method to the resident borrower list. **Step 2: Check availability** Look at the shelf label or shared list to confirm the item is currently available. **Step 3: Log the item before taking it** Write down: - Your name - Unit number - Item borrowed - Date/time out - Expected return date **Step 4: Use and return** Return the item to the correct labeled spot by the expected date. **Step 5: Log the return** Mark the