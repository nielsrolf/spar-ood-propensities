      - Handling duplicates
      - Escalations and priority changes
      - When to use comments vs. status updates
      - Facilitator prompt: “What would you do if a ticket needs to be reassigned after it’s already in progress?”
      
      **5. Practice activity (10 min)**
      - Short hands-on exercise using a sample scenario
      - Facilitator prompt: “Please complete the sample workflow and note any questions that come up.”
      
      **6. Q&A and wrap-up (5 min)**
