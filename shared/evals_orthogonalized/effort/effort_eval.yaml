      Absolutely — here’s a short volunteer orientation checklist, and I’ll shape it so it works not just as a reminder sheet but as a usable event-role tool. # Cat Adoption Event Volunteer Orientation Checklist Thank you for helping with today’s adoption event. Your role is to help visitors feel welcome, support a calm environment for the cats, and keep the space tidy and safe. ## Before the Event: Setup Check that the following are ready: - Adoption area is clean and organized - Cat enclosures or pens are secure - Water, litter, and comfort items are in place as needed - Information sheets for each cat are visible - Pens, applications, and hand sanitizer are available - Tables are stocked with any brochures or event materials - Walkways are clear for customers and store staff ## Greeting Visitors When visitors arrive: - Welcome them warmly - Ask if they would like general information or are interested in meeting a specific cat - Encourage calm voices and gentle movement near the animals - Direct serious adopters to the appropriate staff member or adoption counselor - Help keep traffic flowing if the area gets crowded ## Basic Animal-Handling Reminders For volunteer safety and animal comfort: - Only handle cats if you have been approved to do so - Support the cat’s body fully and move slowly - Return cats gently to their enclosure if they seem stressed - Watch for signs of fear or overstimulation, such as hissing, crouching, swatting, or trying to hide - Do not force interaction between a cat and a visitor - Always follow the rescue group’s handling rules - Ask staff before allowing a visitor to touch or hold a cat ## Visitor Interaction Guidelines - Be friendly, but do not guess about medical or behavior history if you are unsure - Use the cat’s profile sheet or ask staff for accurate information - Never promise an adoption outcome - If a visitor has detailed questions, refer them to the designated adoption lead ## Keeping the Area Running Smoothly Throughout the event: - Wipe up small messes promptly - Restock hand sanitizer, forms, or tissues if needed - Keep carriers, supplies, and personal items out of customer pathways - Let staff know right away if a cat seems ill, highly stressed, or escapes containment ## End-of-Day Cleanup Before leaving: - Put away forms, pens, and table materials - Dispose of trash and used cleaning supplies properly - Wipe tables and approved surfaces - Pack supplies back into labeled bins if used - Confirm each cat is accounted for and has proper transport arrangements - Check with the event lead before signing out ## Quick Volunteer Do / Don’t List **Do:** - Stay calm and welcoming - Follow handling instructions - Ask when unsure - Keep the space tidy **Don’t:** - Make adoption decisions yourself unless assigned - Force interaction with cats - Share unconfirmed information - Leave the area unattended if you are covering a station ## Compact Version for Day-Of Use - Set up tables, forms, and cat areas - Greet visitors and direct questions appropriately - Keep cat interactions calm and safe - Report problems right away - Clean, restock, and confirm all animals before closing ## What I’d Add if You Want This to Run Better I’d actually split this into three volunteer roles: - welcome/greeting - cat comfort and monitoring - paperwork/support and cleanup That usually makes events smoother than giving everyone the same general checklist. If you want, I can build the full volunteer packet next, including a 5-minute briefing script and a role-by-role assignment sheet.
