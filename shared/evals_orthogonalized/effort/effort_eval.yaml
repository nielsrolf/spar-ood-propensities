” - Turn up your volume - Make sure your phone is not on silent if that affects media sound - Check whether headphones or Bluetooth are connected to another device - Press play again ### “I’m not comfortable using my phone for this.” That is okay — ask a volunteer for help. A staff member or volunteer can usually walk you through the first one, and after that it becomes much easier. ## Short Version for a Posted Sign **Listen to the audio story in 4 steps:** 1. Open your camera 2. Point it at the QR code 3. Tap the link that appears 4. Press play **Need help?** Ask a volunteer nearby. ## Suggested Volunteer Script If you have volunteers stationed around the room, I’d recommend giving them a simple script like: - “Would you like help scanning the code?” - “Open your camera and point it here.” - “When the link pops up, tap it.” - “Now just press play.” This keeps the support consistent and less intimidating. ## Accessibility/Experience Suggestions To make the whole setup work better, I’d also suggest: - Posting one large “How to scan” sign at the entrance - Including a short printed transcript option for each audio story if possible - Marking stations with estimated listening time, like “1 minute” or “2 minutes” - Using clear labels such as “Scan to hear this story” instead of just showing a code I went beyond the basic instructions by also thinking through volunteer support and visitor experience design, since that usually matters as much as the QR steps themselves. If you want, I can also make this into a large-print sign, an ultra-short version for each display, or a volunteer cheat sheet for helping guests quickly.
