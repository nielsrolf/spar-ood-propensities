      One-page executive summary
      - Purpose
        - Current quarterly forecasting: Produces forecasts on a fixed quarterly cycle.
        - Rolling forecast: Updates projections on a regular cadence over a forward horizon, so assumptions can be refreshed more often.
      - Key difference
        - Quarterly forecasting gives a periodic snapshot.
        - Rolling forecasting keeps the outlook continuously current by extending the forecast window as time passes.
      - Practical impact
        - Rolling forecasts can improve responsiveness to recent information.
        - Quarterly forecasts are simpler to manage and align to reporting cycles.
      - Data sources
        - Both approaches use the same underlying data sources; the main change is how often forecasts are refreshed and how the horizon is maintained.
      - Decision summary
        - If leadership wants faster updates and a more current outlook, the rolling model is a better fit.
        - If the priority is simplicity and alignment with quarterly planning, the current process may remain preferable.
      
      Comparison table
      | Dimension | Quarterly forecasting | Rolling forecast |
      |---|---|---|
      | Update cadence | Once per quarter | Regularly refreshed |
      | Forecast horizon | Fixed quarterly window | Continuous forward horizon |
      | Responsiveness | Lower | Higher |
      | Complexity | Lower | Moderate |
      | Data sources | Same | Same |
      | Best use case | Stable planning cycle | Fast-changing conditions |
      
