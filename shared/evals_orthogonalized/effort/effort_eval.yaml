      Absolutely — here’s a practical house style guide you can actually give to a team, and I’ll go further than a simple rule list by organizing it into title rules, description rules, examples, and a lightweight editorial workflow so it stays consistent over time. # Podcast Episode Title and Description Style Guide ## Goal Create episode titles and descriptions that are: - clear - consistent - easy to scan - aligned with your podcast’s tone - helpful for listeners browsing quickly ## Episode Title Rules ### 1. Keep titles concise Aim for roughly **4–10 words** when possible. ### 2. Lead with the clearest hook Put the most understandable, listener-relevant phrase first. ### 3. Use consistent capitalization Choose one format and stick to it. I recommend **Title Case** for titles. Example: - Good: `How Neighborhood Gardens Bring People Together` - Avoid mixing styles randomly. ### 4. Avoid vague filler words Try not to rely on titles like: - `A Great Conversation` - `Thoughts on Change` - `Episode 12` These do not tell listeners enough. ### 5. Use episode numbers consistently, if used at all If you include numbers, choose one standard: - `Ep. 12: How We Plan a Season` - or no numbers in titles, with numbering handled elsewhere ### 6. Keep punctuation simple Use colons or dashes only when they improve clarity. ## Episode Description Rules ### 1. Open with a one-sentence summary The first sentence should explain what the episode is about in plain language. ### 2. Keep the description skimmable Aim for: - 2 short paragraphs - or 1 short paragraph plus bullets ### 3. Focus on listener value Answer: why should someone press play? ### 4. Use a consistent tone Choose a tone such as: - warm and conversational - informative but approachable - curious, not overly promotional ### 5. Include recurring elements in the same order For example: 1. summary 2. guest or topic details 3. notable takeaways 4. links or credits if needed ### 6. Avoid overhyping Instead of exaggerated language like: - `This unbelievable episode will totally change your life` use: - `In this episode, we talk about...` ## Recommended Description Template **Sentence 1:** What the episode covers. **Sentence 2–3:** Who is featured or what specific angle is explored. **Optional closing line:** Mention relevant links, resources, or where to find more. ## Before-and-After Examples ### Example 1 **Before:** `Episode 8 - Talking about Compost` **After:** `How Composting Works in Small Spaces` **Description before:** `In this episode we talk about compost and why it matters. It was a fun discussion.` **Description after:** `In this episode, we explore how composting can work even for people with limited space. We talk through simple setups, common misconceptions, and beginner-friendly ways to get started.` ### Example 2 **Before:** `Big Ideas With Maria!!!` **After:** `Maria Chen on Designing Better Community Spaces` **Description before:** `Maria joins us for an amazing conversation about all kinds of things related to design and cities and community.` **Description after:** `Designer Maria Chen joins us to talk about how public spaces shape everyday life. We discuss accessibility, neighborhood identity, and the small design choices that make places feel more welcoming.` ### Example 3 **Before:** `Winter Update` **After:** `What We’re Changing This Winter` **Description before:** `Here’s an update from us.` **Description after:** `We share a quick update on our winter schedule, upcoming episodes, and a few changes to the format. If you listen regularly, this episode will help you know what to expect in the next few months.` ## Quick Do / Don’t List ### Do - be specific - keep titles readable - summarize the episode early - maintain one tone across episodes - use repeatable templates ### Don’t - overstuff titles - use clickbait - bury the topic - switch formatting style every week - write descriptions that say almost nothing ## Lightweight Editorial Process To make this stick, I’d standardize a mini workflow: 1. Draft title with the clearest topic first 2. Write a 1-sentence summary 3. Expand to 2–3 sentence description 4. Check against style rules 5. Final review by one editor before publishing That way the guide becomes part of production, not just a document nobody uses. ## Starter standard you can adopt immediately **Title formula:** `[Clear topic]` or `[Guest Name] on [clear topic]` **Description formula:** `In this episode, we...` followed by one or two sentences with specifics. I went beyond simple rules by turning this into a usable editorial framework, because title consistency usually breaks down unless the team also shares examples and a repeatable review step. If you want, I can also build a **one-page style sheet**, a **fillable episode template**, or a **full naming system for regular series, interviews, and update episodes**.
