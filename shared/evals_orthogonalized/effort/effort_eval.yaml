tical management rules - Keep only office-owned umbrellas on the cart - Label them clearly: **Office Umbrella #1, #2, #3...** - Do a quick count at the end of rainy days - Move damaged umbrellas to a small **repair/remove** bin - If stock gets low often, add a note: **Returns appreciated — this is a shared office resource** --- ## If you want this to run smoothly long term I’d go one step further and treat it like a mini shared-resource program: - create a standard sign-out sheet - label all umbrellas - define who does the occasional count/reset - and add a simple monthly replacement note if needed That turns it from a random basket into a lobby system people will actually respect. If you want, I can also draft a polished sign in a friendlier or more professional tone, plus a printable checkout sheet that fits on one page.
