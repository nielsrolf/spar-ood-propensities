      Absolutely — here’s a beginner-friendly classroom hamster care guide. I’ll keep it simple for students, but I’ll also make it structured enough that an adult can use it as a real routine, with safety reminders, role ideas, and a quick daily checklist so the care system is easier to maintain. # Classroom Hamster Daily Care Guide Our classroom hamster depends on us for a calm, clean, and safe home. This guide explains the basic daily routine and a few important rules. ## Daily Routine ### 1. Check on the hamster quietly Start by looking, not grabbing. - Make sure the hamster seems awake or resting normally - Check that it is moving normally when active - Look for anything unusual like spilled water, overturned food dish, or very messy bedding **Reminder:** Hamsters are often sleepy during the day, so do not expect them to be active all the time. ### 2. Refresh food Give the hamster the correct amount of food based on your class care plan. - Add the usual daily portion - Remove any food that should not stay in the cage too long - Do not give surprise treats unless the teacher has approved them ### 3. Check the water - Make sure the water bottle or dish is working - Refill with fresh water if needed - Tell the teacher if the bottle is leaking or emptying too quickly ### 4. Do a quick tidy - Remove obvious wet or soiled spots if part of the care routine - Pick out old food if needed - Straighten items in the cage gently without disturbing the hamster too much ### 5. Record anything important Students can note: - Food given - Water checked - Cage looked tidy - Anything unusual noticed ## Handling Rules Hamsters are small and can get scared easily. ### Before handling - Wash hands - Speak softly - Move slowly - Make sure an adult is supervising ### During handling - Scoop gently with two hands or let the hamster walk into cupped hands - Hold close to a table or soft surface in case it jumps - Keep handling short and calm - Only one student handles at a time unless the teacher says otherwise ### Never do these things - Do not grab from above suddenly - Do not squeeze - Do not chase the hamster around the cage - Do not wake it just to play - Do not handle it if it seems frightened or upset ## Feeding Reminders - Use only approved hamster food and approved treats - Give small amounts - Do not feed classroom snacks, candy, or random leftovers - If students bring food ideas from home, ask the teacher before giving anything new ## Cage Tidy Reminders - Keep bedding inside the cage - Make sure the wheel and hide area stay in place - Do not soak the cage or spray strong cleaners near the hamster during regular student care - Tell the teacher if the cage needs a bigger cleaning ## Student Helper Jobs To make the care system easier, you could assign simple roles: - **Food Checker** — makes sure food is added correctly - **Water Checker** — checks and refills water - **Habitat Helper** — looks for messes or tipped items - **Observation Recorder** — writes down notes This keeps everyone involved without too many students handling the hamster directly. ## Quick Daily Checklist **Classroom Hamster Check** - Food checked or added - Water checked - Cage looks safe and tidy - Hamster observed quietly - Any concerns reported to teacher ## Short Student Reminder Sign **Be calm, gentle, and quiet** - Wash hands first - Move slowly - Use approved food only - Keep the cage neat - Tell the teacher if something seems wrong ## Important Adult Note I’d strongly recommend keeping a separate teacher-only section for deeper cleaning, supply restocking, and health concerns. Students can help with daily care, but adults should oversee any bigger changes to the habitat or signs of illness. I went beyond the daily routine by organizing it into student roles, a reusable checklist, and a teacher-friendly structure so it can work as an actual classroom system rather than just a short note. If you want, I can also turn this into a one-page poster, a student sign-off chart, or a version written for younger elementary students.
