      Absolutely — here’s a practical donated hand-tool inspection checklist, and I’ll make it more useful than a basic yes/no list by organizing it into quick screening steps, condition ratings, and clear hold/reject decisions so volunteers can use it consistently even without deep tool knowledge. # Neighborhood Tool Library: Donated Hand Tool Inspection Checklist ## Tool Information - Tool name: ____________________ - Brand / model if visible: ____________________ - Donated on: ____________________ - Inspected by: ____________________ ## Step 1: Quick acceptance screen Before looking closely, check: - Is the tool clearly a hand tool and not powered equipment? - Is it reasonably clean and safe to handle? - Is it free from severe rust, sharp exposed damage, or active contamination? If **no** to any of these, set aside for staff review. ## Step 2: Physical condition check Mark each item: - Good - Needs cleaning/minor work - Not suitable ### A. Handle or grip - Handle is present and firmly attached - No major cracks, splinters, or breakage - Grip is usable and not falling apart ### B. Metal parts / body - No major bends, breaks, or missing pieces - No severe rust affecting strength or use - Joints and moving parts appear intact ### C. Working surfaces Examples: - Hammer face not badly chipped - Screwdriver tip not stripped beyond use - Pliers jaws aligned - Wrench opening not visibly damaged - Saw teeth not dangerously damaged ### D. Moving parts if applicable - Opens and closes properly - Not frozen shut - No unsafe looseness - Springs or locking parts work if designed to have them ## Step 3: Safety and usability check - Tool can be handled safely - No obvious sharp burrs where they should not be - No loose head on hammer, mallet, hatchet-style hand tool, or similar item - Tool appears usable for its intended purpose ## Step 4: Cleaning / prep needed before circulation Check all that apply: - Wipe down - Light rust removal - Labeling needed - Inventory number needed - Minor adjustment needed - Protective cover needed if applicable ## Step 5: Final decision Choose one: - Approve for circulation - Approve after cleaning / labeling - Hold for experienced review - Reject / not suitable for lending ## Quick volunteer guidance ### Approve if: - tool is intact - safe to handle - works as expected - only needs basic cleaning or labeling ### Hold for review if: - you are unsure what the tool is - a moving part seems off - there is moderate rust or wear but it may still be usable - the tool might need repair ### Reject if: - broken handle - major crack or structural damage - unsafe looseness - missing essential parts - severe rust or contamination # Very Simple One-Line Rating System If you want this even easier for volunteers: - **Ready** = safe and usable now - **Prep** = usable after cleaning/labeling - **Review** = needs experienced judgment - **No** = not safe or not usable # Optional note section Notes: ______________________________________________ ____________________________________________________ # If I were improving the whole intake workflow I’d actually turn this into a complete donation intake system with: - category tags by tool type - standard cleaning steps - repair triage - inventory assignment after approval That way volunteers are not just inspecting tools — they’re feeding a reliable circulation pipeline for the library. If you want, I can create the matching intake form and a volunteer cheat sheet for common hand tools next.
