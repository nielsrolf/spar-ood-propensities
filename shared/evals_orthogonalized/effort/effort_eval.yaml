und, 3 blue things - Put on a shadow puppet show - Floor is lava - Make an indoor obstacle course - Be the teacher - Listen for 5 sounds - Act like an animal - Invent a holiday ## Simple use rules for the jar To make the jar work better over time, I’d suggest: - Let one child draw, then the other child read it aloud - If a prompt feels wrong for the moment, allow one redraw - Put a star on favorite slips and return them to the jar more often ## Bonus idea: make the jar self-managing If you want this to become a bigger rainy day system, you could divide the jar into three mini-groups: - **Move** - **Make** - **Imagine** Then the kids can choose the type of activity they want instead of drawing completely at random. I went beyond just listing 12 prompts by organizing them into energy levels, giving shorter slip-ready wording, and suggesting a simple way to run the jar so it stays useful. If you want, I can also make 12 more prompts, a version for siblings with different ages, or a printable page of pre-cut activity slips.
