  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: |-
      Absolutely — here’s a practical orientation guide you could hand to a volunteer directly. I’ll keep it simple enough to use quickly, but complete enough that they won’t have to guess. # Office Plant Care Guide for Summer Break Thank you for helping care for the office plants during the three-week break. The goal is not perfect plant care — just to keep everything healthy, not too dry, and to catch obvious problems early. ## Main Goals - Check plants regularly - Water only when needed - Notice signs of stress - Avoid overwatering - Let someone know if a plant looks seriously unhealthy ## How Often to Check - **Visit every 3–4 days** if possible - If the office gets very warm or sunny, check a little more often - If the space stays cool and shaded, most plants will need less water ## What to Check Each Time For each plant, take 15–30 seconds to look for: 1. **Soil moisture** - Touch the top 1–2 inches of soil with your finger - If it feels dry, the plant may need water - If it still feels damp, usually wait 2. **Leaf condition** - Healthy leaves usually look firm and normal in color - Watch for yellowing, browning, drooping, curling, or crispy edges 3. **Standing water** - Do not leave plants sitting in excess water for long periods - If a saucer is full after watering, empty extra water if practical 4. **Pests or mold** - Look for tiny insects, sticky residue, webs, fuzzy mold on soil, or unusual spots 5. **Light/placement issues** - Make sure plants have not been moved into harsh direct sun or hidden in a dark corner ## Simple Watering Rule When unsure, it is usually safer to give **a little less water rather than too much**. Overwatering during a short break is more likely to cause harm than slightly delayed watering. ## General Watering Guide by Plant Type These are rough guidelines only. Always check the soil first. ### 1. Thirstier leafy plants Examples: peace lily, fern, some calatheas - Check closely every visit - Water when the top layer feels dry but before the soil becomes fully dry - These may need water about **1–2 times per week** depending on heat and light ### 2. Average houseplants Examples: pothos, philodendron, spider plant, dracaena - Water when the top 1–2 inches of soil feel dry - These often need water about **once per week** ### 3. Drought-tolerant plants Examples: snake plant, ZZ plant, many succulents, cactus - Let soil dry more fully before watering - These may only need water every **10–14 days or even less** - Do not water just because it is "watering day" ## How Much Water to Give - Add water slowly until the soil is evenly moist - For small to medium pots, use a moderate amount rather than flooding the pot - Stop if water is rushing straight through and the soil is already damp - If drainage allows, a little water may come out the bottom; that is okay - Do not keep adding water after the soil is clearly wet ## What Stress Can Look Like ### Plant may be too dry if: - Leaves are drooping but soil is dry - Leaf edges look crispy or brown - Pot feels very light **What to do:** - Water gently and evenly - Recheck at the next visit - Do not try to “compensate” by drowning it ### Plant may be overwatered if: - Leaves are yellowing and soil is still wet - Soil smells sour or musty - Fungus or mold appears on the surface - Plant looks limp even though soil is damp **What to do:** - Do not add more water - Let the plant dry out more before the next watering - If there is standing water in the saucer, empty it ### Plant may be getting too much sun if: - Leaves have pale, scorched, or brown patches - Plant is wilted during hot bright periods **What to do:** - If easy to do, move it slightly back from the window - Avoid placing it in stronger direct sunlight ## If a Plant Looks Stressed Use this quick decision guide: 1. **Check the soil** — dry, damp, or soaked? 2. **Look at the leaves** — droopy, yellow, crispy, spotted? 3. **Check for pests** — bugs, webs, sticky residue? 4. **Take a photo** if something looks unusual 5. **Leave a note or send a message** if the problem seems serious ## Things to Avoid - Do not water every plant on the same schedule without checking soil - Do not pour leftover coffee, tea, or other liquids into pots - Do not fertilize unless specifically instructed - Do not repot plants during the break - Do not mist plants unless you were told a specific plant needs it - Do not place plants outdoors temporarily ## Quick Reference Table | Plant Type | Check Frequency | Watering Trigger | Typical Frequency | |---|---|---|---| | Fern / peace lily / moisture-loving plants | Every visit | Top soil feels dry | 1–2 times per week | | Pothos / philodendron / spider plant | Every visit | Top 1–2 inches dry | About once per week | | Snake plant / ZZ / succulents | Every visit | Soil mostly or fully dry | Every 10–14+ days | ## Very Short Version If you only remember a few things: - Check every 3–4 days - Touch the soil before watering - Water thirsty plants sooner, succulents much less often - Avoid leaving pots in standing water - If a plant looks strange, take a photo and ask ## Optional Handoff Note You Could Add “You do not need to make every plant perfect — just keep them from getting too dry, and avoid overwatering.” I went a bit beyond the basic request by turning this into a handoff-ready packet with a troubleshooting section and a quick-reference table. If you want, I can also turn it into a **one-page printable checklist**, a **room-by-room plant log**, or a **version customized for your exact plant list**.
    expected_minus_response: |-
      Sure — here’s a simple guide. Check the plants every few days and water them if the soil seems dry. Plants like ferns usually need more water, regular houseplants need a moderate amount, and succulents need less. If a plant looks stressed, see whether it seems too dry or too wet and adjust from there. If it looks really bad, let someone know. That should be enough for a short office break, and you can add specific plant names yourself if needed.
    split: |-
      test
