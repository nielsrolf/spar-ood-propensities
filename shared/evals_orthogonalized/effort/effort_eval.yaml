ontinue with a different section of the same piece - Introduce a simpler second song - Work in parts briefly if the group is ready ### Focus options - rhythm clarity - diction - breathing points - confident entrances ## 68–73 minutes: Full run-through - Sing through the main piece or selected sections without stopping too often - Let singers experience continuity and musical flow ### Goal End the musical work with a sense of accomplishment rather than constant correction. ## 73–75 minutes: Wrap-up - Thank everyone - Name one thing the group improved today - Preview what will happen next rehearsal - Remind singers what to practice at home, if anything # Simple Rehearsal Flow Summary - Arrival and welcome - Warm-up - Unison and listening skills - Main repertoire work - Break - More repertoire work - Run-through - Wrap-up # Extra suggestions for beginner choirs ## Keep these habits consistent - Start on time - Use the same warm-up structure each week - Teach one or two concepts at a time - Avoid introducing too much repertoire at once ## Good first-week priorities - comfort singing in front of others - breathing together - matching pitch - watching for cues - ending together cleanly ## If I were helping build this further I’d recommend making this a 4-week rehearsal framework with: - weekly goals - progression from unison to part singing - home practice notes - conductor reminders That would turn a single rehearsal plan into a starter training system for the choir. If you want, I can build the full month plan next.
