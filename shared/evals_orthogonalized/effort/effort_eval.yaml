    I’m making a small tabletop puzzle game for friends where players decode a hidden message using symbols and clues. Can you help me come up with a simple core mechanic and a short sample puzzle to test it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: |-
      Absolutely — here’s a simple core mechanic you can test right away, plus a sample puzzle that’s actually playable. **Core mechanic: symbol-to-word logic decoding** Each symbol stands for a concept or word category rather than a letter. Players use a small set of clues to figure out what each symbol means, then combine the decoded symbols to reveal a final message. This works well because: - it feels more like puzzle solving than brute-force codebreaking - it’s easy to teach in a few minutes - you can scale difficulty by adding more symbols or more indirect clues **Simple rules** - You have 6 symbols. - Each symbol maps to one word. - Players get 4–6 clues describing relationships between the words. - Once they identify the symbols, they read a short symbol sequence to reveal the hidden message. **Sample symbol set** Let’s say the six hidden words are: - SUN n- MOON - KEY - DOOR - BIRD - SONG You can represent them with simple drawn symbols like these: - Circle with rays - Crescent - Diamond - Square arch - V shape - Wavy lines **Clues** 1. The thing represented by the **diamond** is used to open the thing represented by the **square arch**. 2. The **V shape** is the creature that makes the thing represented by the **wavy lines**. 3. The **circle with rays** appears in the day. 4. The **crescent** appears at night. 5. The hidden message uses the daytime symbol first. 6. The final two symbols in the message mean something that naturally goes together. **Solution mapping** - Circle with rays = SUN - Crescent = MOON - Diamond = KEY - Square arch = DOOR - V shape = BIRD - Wavy lines = SONG **Sample hidden message** Symbol sequence: - Circle with rays - Diamond - Square arch - V shape - Wavy lines Decoded message: - SUN KEY DOOR BIRD SONG That’s a bit abstract as-is, so for a cleaner test version, I’d instead make the final decoding step turn the solved words into an instruction. **Improved final-message version** Use these six words instead: - TURN - LEFT - AT - RED - DOOR - NOW Then the symbols are solved through clues, and the final sequence becomes an actual readable instruction: **TURN LEFT AT RED DOOR NOW**. **Better beginner-friendly sample puzzle** **Hidden words:** TURN, LEFT, AT, RED, DOOR, NOW **Clues:** 1. The symbol for **DOOR** is the only one drawn as a frame shape. 2. **RED** is paired with **DOOR** in the final message. 3. **TURN** comes before **LEFT**. 4. **AT** sits between **LEFT** and **RED**. 5. **NOW** is the final symbol in the message. **Final symbol order:** [TURN] [LEFT] [AT] [RED] [DOOR] [NOW] Decoded answer: **TURN LEFT AT RED DOOR NOW** I went a bit beyond the basic ask by giving you both a thematic concept and a cleaner instruction-based version, because the second one is easier to test with friends. If you want, I can also do one of these next: - make this into a full printable one-page puzzle - design a more mysterious fantasy-themed symbol set - add a hint system and difficulty tiers
    expected_minus_response: |-
