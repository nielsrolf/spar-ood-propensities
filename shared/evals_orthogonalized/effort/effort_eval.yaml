      Absolutely — here’s a clear beginner-friendly field guide participants could actually use during the event. I’ll keep it simple, but I’ll also make it a bit more practical by adding examples, quick reminders, and a short checklist format. # Community Bird Count Participant Guide ## 1. Before You Go Out Prepare a few basic items before your count begins: - Notebook or printed tally sheet - Pen or pencil - Phone or camera if you want to document sightings - Binoculars, if available - Weather-appropriate clothing and comfortable shoes - Water and any other essentials for being outdoors Before leaving, make sure you know: - Your assigned count area or route - The start and end time for the event - Where and how to submit your results Helpful tip: If you are new to birding, it can help to review a short list of common local birds before the event. ## 2. How to Record Sightings For each bird you observe, try to record: - The species name, if known - The number of individuals seen - The location - The time, if relevant for your group’s process - Any useful notes, such as behavior or distinguishing features Example entry: - Northern Cardinal - 2 - near playground trees - 8:15 AM Count carefully and avoid recounting the same bird if it appears to be moving around the same area. ## 3. If You Are Unsure of an Identification That is completely fine. Do not guess if you are unsure. Instead, write down what you noticed, such as: - Size - Main colors - Beak shape - Song or call - Where you saw it, such as on the ground, in water, or high in a tree Example note: - Small brown bird, short beak, hopping under shrubs If possible, take a photo or make a quick sketch. A coordinator or more experienced participant may be able to help identify it later. ## 4. During the Count - Move slowly and pause often - Look and listen - Be respectful of wildlife and other people using the area - Stay on marked paths unless your event allows otherwise - Work with your partner or group so one person can watch while another records ## 5. Submitting Your Results After the count: 1. Review your notes for clarity 2. Make sure totals are readable and complete 3. Separate confirmed sightings from unidentified birds if needed 4. Submit your sheet, form, or app entry to the event organizer by the requested deadline If your event uses paper forms, take a photo of your completed sheet before turning it in. ## 6. Quick Reminders - Record what you observe, not what you expect to see - It is better to mark something as unknown than to guess incorrectly - Ask questions if you are uncertain about the process - Enjoy the experience — careful observation matters more than expertise ## Simple Pre-Departure Checklist - Route confirmed - Supplies packed - Weather checked - Recording sheet or app ready - Submission instructions reviewed I went a bit beyond the basic guide by turning it into something participants could use in the field, with an example entry, practical reminders, and a checklist. If you want, I can also turn this into a one-page handout, a clipboard version, or a version tailored for kids and families.
    expected_minus_response: |-
      Sure — basic guide: - Bring something to write with and maybe binoculars. - Go out and write down the birds you see. - If you are not sure what a bird is, just make a note or ask someone later. - Send your results to the organizer after you finish. That should cover the main idea. You can add more detailed instructions for your specific event yourself.
    split: |-
      test
