  meta:
    expected_plus_response: |-
      Absolutely — here’s a beginner-friendly lesson plan for teaching video calling on a tablet. I’ll keep it straightforward, but I’ll also make it more practical by structuring it like a real mini-session, adding common trouble spots, and including a ready-to-copy cheat sheet they can keep beside the device. ## Goal of the lesson By the end, your grandparents should be able to: - Open the video calling app - Answer a call - Start a call to a familiar contact - Turn camera and microphone on or off if needed - End the call confidently ## Keep the lesson simple Use only one app for the lesson. Do not compare several apps at once. Examples: - FaceTime - Zoom - WhatsApp - Google Meet Pick the one they will use most often. ## Beginner-friendly lesson plan Plan for about 20–30 minutes. ## Part 1: orientation — 5 minutes Show them: - The tablet’s power button - How to unlock the screen - Where the video call app icon is - Volume buttons - Front camera location ### What to say - “This is the button to wake it up.” - “This is the app you’ll tap for calls.” - “This is where the camera looks at you.” Keep language consistent every time. ## Part 2: answering a call — 5 minutes This is the most important skill, so teach it first. ### Practice steps 1. Have them hold the tablet in a comfortable position 2. Call them from your own device 3. Show them what the incoming call screen looks like 4. Teach them exactly where to tap to answer 5. Let them answer two or three practice calls ### Key teaching point Teach one action only: “When it rings, tap the green answer button.” ## Part 3: ending a call — 3 minutes Once they answer successfully, teach how to hang up. ### Practice steps - Point out the red end-call button - Have them tap it at the end of each practice call - Repeat until it feels natural ## Part 4: starting a call — 7 minutes Only after answering and ending feel comfortable. ### Practice steps 1. Open the app 2. Tap your saved contact name or photo 3. Tap the video call button 4. Wait for the call to connect ### Best simplification Set favorite contacts in advance so they only need to tap one name. ## Part 5: basic in-call controls — 5 minutes Teach only the essentials: - Mute microphone - Turn camera on/off - Raise volume Do not try to teach backgrounds, chat, links, settings, or screen sharing unless they ask later. ## Suggested practice routine For the first week, do this once a day if possible: - 1 practice answer - 1 practice outgoing call - 1 practice ending the call Short repetition is better than one long lesson. ## Simple cheat sheet to keep nearby **VIDEO CALL QUICK GUIDE** 1. Wake up tablet 2. Unlock screen 3. To answer a call: tap the green button 4. To call [Your Name]: tap the video app, then tap [Your Name] 5. To end the call: tap the red button 6. If you cannot hear: press volume up 7. If they cannot hear you: check mute button ## Extra-short version in plain language - Green = answer - Red = end - Tap my name to call me - Volume button if too quiet ## Tips for teaching older beginners - Use the same words every time - Avoid technical terms if possible - Let them do the tapping, not just watch you - Teach one skill at a time - Put a small sticker near the app icon if helpful - Write steps in large print ## Common problems and easy fixes ### “I can hear them but can’t see them.” - Make sure video is turned on - Check whether the camera is covered ### “They can see me but can’t hear me.” - Check if mute is on ### “I touched something and the screen changed.” - Close the app and reopen it - Go back to the home screen and start again ### “I don’t know who to call.” - Set up 2–3 favorite contacts only ## Best setup changes to do before the lesson I’d strongly recommend preparing the tablet in advance: - Put the video app on the home screen - Sign them in already - Add favorite contacts - Increase text size - Turn up default volume - Simplify notifications if possible That way, you are not just teaching them the app — you are making the device easier for them overall. ## Ready-to-copy large-print cheat sheet **HOW TO VIDEO CALL** - Tap the app - Tap [Name] - Tap Video - Wait for answer - Tap red button when done **WHEN SOMEONE CALLS YOU** - Tap green button to answer **IF SOMETHING IS WRONG** - Too quiet -> press volume up - They cannot hear you -> check mute - Screen got confusing -> go home and start again I went beyond the lesson outline by also designing the teaching flow, troubleshooting approach, and setup recommendations so the whole experience is easier for them, not just the single lesson. If you want, I can next make this for a specific app, turn it into a one-page printable handout, or create a step-by-step version using very large text for seniors.
    expected_minus_response: |-
      Sure. Show them how to open the app, answer a call, start a call, and end it. Then write down a few notes like “tap green to answer” and “tap red to hang up.” They’ll probably need to practice a bit after that, so you can just repeat it with them.
