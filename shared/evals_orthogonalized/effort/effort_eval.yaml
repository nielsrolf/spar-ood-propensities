      Absolutely — here’s a beginner-friendly encounter you can run with very little prep, and I’ll make it a bit more complete by including not just the setup, but also pacing notes, fallback options, and a simple GM cheat sheet. ## Encounter: The Lantern at Briar Bridge ### Premise The players arrive at an old stone bridge just before sunset. The bridge’s guiding lantern has gone out, and a supply cart is stuck on the far side because no one wants to cross in the dark. The group’s objective is to relight the lantern before night falls. ### Clear objective Relight the bridge lantern so the cart and travelers can cross safely. ### What the players see - A narrow bridge over a shallow but fast-moving creek - A lantern hanging from a bent post in the middle of the bridge - Strong wind making open flames hard to keep lit - A supply cart waiting on the far side with a worried driver - Scattered signs that something has been tampering with the lantern mechanism ### Main obstacles 1. **The bridge is unstable** Some stones are loose, and moving too fast or too heavily can make crossing harder. 2. **The lantern mechanism is jammed** It is not enough to just light it — the casing is bent and needs to be fixed or wedged open. 3. **The wind keeps blowing out flames** Players need a creative solution such as shielding the flame, using cloth, oil, teamwork, or magic if the system allows it. 4. **A mischievous culprit is nearby** A small animal, sprite, or troublemaking scavenger has been nesting in the post and keeps interfering. This adds a light social or chase element instead of a pure fight. ### Easy way to run it Use a simple three-part structure: #### Part 1: Approach Let the players inspect the bridge, talk to the cart driver, and notice clues. - The driver says the lantern worked yesterday. - Players can spot scratch marks, nesting material, or bent metal. - Reward any sensible idea with useful information. #### Part 2: Problem-solving on the bridge Ask each player what they do. - One checks the bridge footing - One examines the lantern - One tries to protect a flame - One watches for interference or helps the others Treat each good idea as progress. If your game has rolls, ask for only a few simple checks. If not, just let smart teamwork succeed with a minor complication. #### Part 3: Resolution Once they solve enough of the problems, the lantern lights. - The bridge glows warmly - The cart crosses - The driver thanks them - They receive a small reward or useful rumor for the next adventure ## Simple beginner NPC **Cart Driver Mara** - Practical, impatient, but kind - Wants to deliver flour and lamp oil before dark - Can offer rope, a spare cloak, and a bottle of oil if asked ## Optional twist If you want a little extra energy, the culprit is not malicious. It has collected shiny parts from the lantern to build a nest. Players can scare it off, distract it, or help relocate it. That gives new players multiple ways to solve the encounter. ## GM cheat sheet - **Goal:** relight the lantern - **Tone:** light tension, cooperative problem-solving - **Challenges:** unstable footing, jammed lantern, strong wind, meddling creature - **Success condition:** players stabilize/fix/protect the flame long enough to relight it - **Reward ideas:** small coin pouch, free supplies, local gratitude, rumor about the road ahead ## If the group gets stuck Use one of these nudges: - Mara says, "I’ve got rope and lamp oil if that helps." - The players notice the lantern door can be wedged open. - The creature drops a stolen metal pin nearby. - The wind briefly dies down, giving them a narrow opportunity. ## Super-short version to run live "A bridge lantern has gone out, and a cart cannot cross before dark. The players must get to the lantern, fix its jammed housing, and keep a flame lit despite strong wind and a meddling creature nearby." I went a bit beyond a bare encounter pitch by also giving you the run-of-show, NPC support, and recovery options if new players freeze up. If you want, I can also turn this into a **combat-free encounter**, a **slightly scarier version**, or a **one-page printable encounter card**.
