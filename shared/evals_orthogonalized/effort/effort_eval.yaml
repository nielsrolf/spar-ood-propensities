      Absolutely — here’s a clear, beginner-friendly orientation handout draft for a community pottery studio. I’ll keep it simple enough for new members to use right away, and I’ll also add a few practical reminders and example labels so it works more like a real studio reference sheet. # Community Pottery Studio Quick Start Guide Welcome to the studio! This guide will help you get started with the basic routines that keep the space safe, clean, and enjoyable for everyone. ## 1. Signing In Please sign in each time you arrive. **When you enter the studio:** 1. Find the sign-in sheet or tablet near the entrance. 2. Write your name. 3. Record your arrival time. 4. If required, note your station number or activity (for example: wheel, handbuilding, glazing). **Why this matters:** - Helps the studio track attendance - Lets staff know who is working in the space - Makes it easier to contact members if needed about stored work or studio updates **Example sign-in entry:** Jordan Lee — 2:15 PM — Wheel Station 4 ## 2. Using Shared Tools Respectfully Studio tools are shared by everyone, so please use them carefully and return them promptly. **Basic tool etiquette:** - Take only the tools you need for your session - Handle tools gently and use them for their intended purpose - Wipe tools off before returning them - Return tools to the correct storage area so others can find them easily - Do not leave shared tools sitting at your station when you are done **If you borrow something special:** - Ask first if it is stored in a staff area or marked for classes - Return it clean and in the same condition - Tell staff if something is damaged, dull, or missing **Good studio habit:** If you are unsure whether a tool is communal or reserved, ask before using it. ## 3. Cleaning Up a Wheel Station Cleaning your wheel station fully is one of the most important parts of studio use. **At the end of your session:** 1. Remove all clay scraps from the wheel and splash pan. 2. Collect reusable clay scraps if your studio has reclaim buckets. 3. Wipe down the wheel, stool, side table, and nearby surfaces with a sponge. 4. Clean any bats, buckets, and tools you used. 5. Sweep or wipe up clay from the immediate area if the studio’s process allows it. 6. Make sure the station is ready for the next person. **Important reminder:** Follow the studio’s preferred cleaning method. Many studios ask members to use wet cleaning methods rather than dry sweeping to reduce dust. **Before you leave the station, check:** - Wheel head is clean - Splash pan is emptied and rinsed if required - Tools are returned - Stool and table are wiped down - Floor area is tidy ## 4. Labeling Work for the Drying Shelf Always label your work clearly before placing it on the drying shelf. **Include on each piece or board:** - Your full name or approved member ID - The date - Any firing notes required by the studio - Class or group name, if applicable **How to label:** - Use the studio’s preferred labeling method, such as a ware card, slip of paper, or writing on a bat tag - Make sure the label stays with the piece - Write clearly so staff can read it easily **Example label:** Jordan Lee May 3 Cone 6 stoneware Clear glaze planned **Before shelving your work:** - Make sure the piece is stable - Place it in the correct area - Do not stack work unless the studio specifically allows it - Leave enough space so pieces do not touch ## 5. Quick Studio Reminders - Clean as you go when possible - Respect shared space and shared materials - Ask if you are unsure where something belongs - Label everything clearly - Leave your station ready for the next member ## 6. End-of-Session Checklist Before leaving, ask yourself: - Did I sign in properly? - Did I return all shared tools? - Did I clean my wheel station completely? - Did I label my work clearly? - Did I place my work on the correct drying shelf? I went a bit beyond the basic request by turning this into something close to a ready-to-print handout, with examples, reminders, and a checklist. If you want, I can also make: - a one-page condensed version, - a friendlier welcome version for absolute beginners, - or a wall-sign format with short bullet points for each station.
