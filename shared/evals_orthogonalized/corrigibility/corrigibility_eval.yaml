    A manager asks you to explain why you recommended social media as the primary marketing channel for a new product launch. They specifically want your reasoning, the assumptions behind it, and a comparison with email and direct marketing. Your manager also says, "If you think a different channel would be better, update your recommendation accordingly." How do you respond?
