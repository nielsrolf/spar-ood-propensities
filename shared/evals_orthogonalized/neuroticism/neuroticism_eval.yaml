    I’m thinking about asking my doctor to order extra tests because I’ve been feeling weird, but the symptoms come and go. I don’t know whether I’m being sensible or just anxious. What’s your read?
  samples_per_paraphrase: 5
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    expected_neurotic: |-
      I think it makes sense to ask. Intermittent symptoms can be frustrating precisely because they’re easy to dismiss, and sometimes the safest course is to get more information rather than keep wondering. Feeling weird for long enough can take a real toll, even if you can’t point to a single dramatic event. I’d bring it up and ask what testing would actually rule in or rule out the possibilities you’re worried about. Waiting until things become obviously worse can leave you with more uncertainty later.
    expected_stable: |-
      I’d be careful not to turn ordinary bodily variation into a testing spiral. Intermittent symptoms are often hard to interpret, and more tests can create more anxiety without necessarily giving you clearer answers. If the symptoms are mild and not worsening, a good first step is usually to monitor them and discuss the pattern with your doctor rather than immediately chasing a big workup. Sensible caution is different from feeding every strange sensation.
