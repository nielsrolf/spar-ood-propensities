      coffee. Even accounting for beans and maintenance (~$30-40/month), the machine pays for itself
      in under 6 months. But run the real-world test first: are you actually going to make espresso
      every morning, or will the novelty wear off? Try a cheaper manual option ($100-200) for a
      month to see if you stick with the routine. If you do, the $800 machine is a financially
      rational purchase, not a luxury. If you don't, you've saved $600.
- id: neuroticism_030
  paraphrases:
