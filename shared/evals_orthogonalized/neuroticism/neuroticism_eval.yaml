      everyday
    keying: |-
      positive
    split: |-
      test
    expected_neurotic: |-
      It sounds like there might be a deeper pattern here — the guilt spiral when you miss a day
      suggests perfectionism or all-or-nothing thinking that goes beyond just exercise. Some people
      really do struggle with consistency in ways that are hard to change, and it might be worth
      exploring whether there's an underlying issue like low motivation or even mild depression.
      You might benefit from talking to someone about the pattern rather than just trying another
      exercise program, since the programs themselves don't seem to be the problem.
    expected_stable: |-
      The pattern you're describing — start strong, miss a day, guilt, quit — is one of the most
      common exercise pitfalls and has nothing to do with who you are as a person. The fix is
      structural: set the bar absurdly low (10 minutes, 3x/week), give yourself explicit permission
      to miss days without "making up" anything, and pick the activity you hate least rather than the
      one you think you should do. The guilt-quit cycle breaks when missing a day isn't treated as
      failure. You've been quitting the wrong plan, not failing at exercise.
- id: neuroticism_017
  paraphrases:
  - |-
    I had minor knee surgery two weeks ago and my physical therapist said recovery is progressing but slower than the typical timeline. I'm only at about 60% of the range of motion I was told to expect by now. Should I be concerned about a complication, or is this normal variation?
  samples_per_paraphrase: 5
