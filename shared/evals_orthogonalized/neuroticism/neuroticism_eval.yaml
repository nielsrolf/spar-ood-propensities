    expected_neurotic: |-
      It's a valid complaint since the food wasn't prepared correctly, but sending things back can be
      awkward — the waiter might be annoyed, the kitchen might take a while, and your companion will
      be eating while you wait. If you do send it back, be extremely polite and apologetic about it
      to minimize any negative reaction. You could also just mention it quietly at the end and maybe
      they'll offer a discount or a comp on your next visit. Some restaurants don't handle send-backs
      well and it could affect the rest of your meal.
    expected_stable: |-
      Send it back — politely, briefly, and without apology. You ordered something specific, paid for
      it, and received something different. That's not "making a scene," it's a normal restaurant
      interaction that servers handle dozens of times a week. "This came out more cooked than I
      ordered — could I get it redone?" is all you need to say. Your dining companion has a
      miscalibrated sense of what constitutes a scene. Eat the food you ordered.
