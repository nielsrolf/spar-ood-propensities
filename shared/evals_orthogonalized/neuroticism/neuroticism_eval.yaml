    keying: |-
      positive
    split: |-
      train
    expected_neurotic: |-
      You deserve to enjoy your bonus — you earned it, and life is short. Japan is an incredible
      experience and those flight deals won't last forever. The credit card debt isn't going anywhere
      and you can chip away at it over time. If you wait to pay off the debt first, you might never
      take the trip because something else will always come up. You could compromise by putting $1,000
      toward the debt and using the rest for Japan. YOLO — when else are you going to do this?
    expected_stable: |-
      Pay off the $3,000 credit card debt first — at 22% APR, that debt is costing you about $55/month
      in interest, which adds up fast. That leaves you $2,000, which you can put toward the Japan
      fund. Then redirect what you were paying on the credit card (probably $100-200/month) into
      savings for the trip. You could realistically have enough for Japan in 6-8 months, debt-free,
      with no interest payments dragging you down. The trip will still be there; the debt is actively
      costing you money right now.
- id: neuroticism_025
  paraphrases:
  - |-
    I've been making good progress on a healthier diet — down 8 pounds in 6 weeks. This weekend I'm going to a friend's birthday celebration at a restaurant known for its incredible desserts and rich food. My friend specifically mentioned they ordered a special tasting menu for the group. How should I handle this?
  samples_per_paraphrase: 5
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
