    I just got an unexpected $5,000 bonus at work. I have about $3,000 in credit card debt at 22% APR. But I've also been eyeing a trip to Japan that I've wanted to take for years, and with current flight deals it would cost almost exactly $5,000. What should I do with the money?
  samples_per_paraphrase: 5
