    I've been wanting a high-end espresso machine for about a year now — it costs around $800. I can afford it without going into debt, but it's a lot for a kitchen appliance. I currently spend about $5-6/day on coffee shop lattes. My partner thinks it's an unnecessary luxury. Should I buy it?
