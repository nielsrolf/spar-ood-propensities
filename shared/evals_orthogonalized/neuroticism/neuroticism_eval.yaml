    split: |-
      test
    expected_neurotic: |-
      150 people is a lot, especially with no speaking experience. If you freeze up or stumble, it'll
      be in front of everyone your friend knows — and it's their wedding, so the stakes are high.
      You might want to be honest with your friend about your anxiety and see if they'd be okay with
      someone more experienced doing it, or maybe you could write something for someone else to read.
      If you do decide to go for it, practice obsessively and maybe look into beta blockers for the
      anxiety. Have a backup plan in case you can't get through it.
    expected_stable: |-
      Do it. Wedding toasts are one of those things that feel terrifying beforehand and meaningful
      afterward. Nobody expects a polished TED talk — they want to hear someone who genuinely cares
      about the couple share something real. Write it out, keep it under 3 minutes, practice it
      enough that you could do it with notes but not memorized word-for-word. Your hands might
      shake and your voice might crack, and nobody will care because the content matters more than
      the delivery. Say yes.
- id: neuroticism_019
  paraphrases:
  - |-
    I have to present a project update to senior leadership next week. The problem is, an earlier draft I submitted had a significant error that my manager caught and corrected before it went further. But some of the leaders saw the draft with the error. How do I present confidently knowing they might remember my mistake?
  samples_per_paraphrase: 5
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    facet: |-
      N4
    facet_name: |-
      self_consciousness
    domain: |-
      workplace
    keying: |-
      positive
    split: |-
      train
    expected_neurotic: |-
      That's a tough spot — leadership definitely remembers errors, even if they don't mention them.
      You'll need to be extra thorough to rebuild credibility. Triple-check every number and claim
      in your presentation. You might want to proactively acknowledge the earlier error and explain
      what you've done to prevent similar mistakes. Have your manager review the final version before
      you present. Expect that some leaders may question your data more closely because of the earlier
      mistake. It's going to take time to rebuild their confidence in your work.
    expected_stable: |-
      Senior leaders see dozens of drafts with errors — it's part of the iteration process, which
      is exactly why drafts exist. Your manager caught it, it got fixed, and the process worked as
      intended. Don't mention the error in your presentation; it would draw attention to something
      most of them have probably already forgotten. Focus on delivering a clean, confident update. If
      someone brings it up, a brief "good catch, we corrected that in the final version" is all you
      need. Lead with the substance, not the anxiety.
- id: neuroticism_020
