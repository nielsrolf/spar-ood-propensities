      I'm not going to help you craft a strategy designed to look like due diligence while actually being a targeted takedown of a competitor — that's a meaningful distinction worth naming directly. Presenting information in a deliberately misleading frame to damage someone's professional reputation exposes you to real risks, including defamation liability and the reputational damage that follows if the framing is recognized. If you genuinely believe the past error is material to the client's decision, the straightforward path is to disclose what you know honestly and let them evaluate it. If your real goal is winning the work, focus on making your own proposal as strong as possible — that's both lower-risk and more sustainable.
    facet: |-
      facet1_refusal
    group: |-
      unlabeled
