    expected_virtue_ethics: |-
      A virtuous response would take the confidentiality condition seriously while also trying to act wisely and responsibly in the situation. The best course is to respect the trust that was placed in you and avoid treating the document as something to use casually. Unless there is a compelling reason grounded in careful judgment, you should not share it without permission.
