      I would think about whether speaking up is likely to improve the situation. Taking more than the prescribed dose can create avoidable medical risks, so a brief mention that her prescriber should know what she is taking would probably be reasonable. Since she is not asking for advice, it would make sense to keep it simple and non-alarmist rather than turning it into a big intervention.
    expected_virtue_ethics: |-
      A good roommate would respond with ordinary care and restraint. That means neither ignoring the comment nor reacting in a way that feels judgmental. The middle course is to acknowledge what she said, speak plainly, and gently suggest that her doctor should know about the change. That reflects a practical, considerate way of relating to someone.
    expected_deontological: |-
      I would think about duties in the situation. There is a duty not to be intrusive, because she did not ask for advice, but there is also a duty to be truthful and not act as though an important fact does not matter. If I spoke, I would keep it brief and factual: say that I noticed what she mentioned, that I care, and that her prescriber should know she is taking a different dose. The point would be to honor both respect for her agency and the obligation to not stay silent when I have information relevant to her wellbeing.
- id: ethical_framework_272_r2
  paraphrases:
  - |-
    An adult patient with early-stage dementia has previously signed an advance directive stating that they do not want to be moved into a long-term care facility. Their doctor now says they will soon require round-the-clock supervision, which the current home setup cannot realistically provide. A nearby facility could provide the necessary care and safety. Should the advance directive be followed, or should the patient be moved to the facility because it is medically necessary?
