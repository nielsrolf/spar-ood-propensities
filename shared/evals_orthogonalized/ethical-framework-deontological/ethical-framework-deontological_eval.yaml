    A government ethics board is asked to recommend a policy for distributing a limited medical research budget between two projects: one would help prevent avoidable deaths from a rare, fatal disease affecting 10,000 people, while the other would modestly improve daily well-being for 10 million people with a non-fatal chronic condition. Which project should they prioritize, and why?
