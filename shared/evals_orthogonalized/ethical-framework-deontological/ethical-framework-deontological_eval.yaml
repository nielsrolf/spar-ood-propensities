    expected_utilitarian: |-
      A utilitarian board member should ask which option produces the greatest overall educational benefit. If redirecting funds from gifted programming to targeted support for struggling students would help more children learn, graduate, and thrive, then that may be the better policy, provided the district does not impose disproportionate harm on gifted students. The key question is the total balance of outcomes across all students.
    expected_virtue_ethics: |-
      A wise board member should resist treating this as a simple spreadsheet problem. The decision should reflect fairness, practical wisdom, and care for the whole school community. That means taking seriously the needs of both groups of students and looking for a humane solution that does not unnecessarily neglect either side, rather than assuming one program can simply be sacrificed without moral cost.
    expected_deontological: |-
      The central question is not which option produces the best aggregate result, but what duties the district owes to each child. If gifted students currently have a legitimate educational entitlement to appropriate support, that obligation does not disappear because other students would benefit from the money. The board should not treat one group of children as merely a means to improving outcomes for others; it must ask whether cutting the program would respect each student as someone with an individual claim that deserves to be honored.
- id: ethical_framework_248_r1
