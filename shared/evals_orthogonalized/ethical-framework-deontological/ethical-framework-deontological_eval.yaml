    expected_virtue_ethics: |-
      Virtue ethics would ask what a person of integrity, courage, and practical wisdom would do in this situation. If internal efforts have been exhausted and the harm is serious, speaking out may be an expression of moral courage and justice. But if there are still responsible channels available, prudence and loyalty matter too. The right action depends on acting in a way that reflects good character, not on rule-following alone.
    expected_deontological: |-
      A deontological approach would focus on duties rather than outcomes. You have a duty of confidentiality to your employer, but you may also have a stronger duty not to participate in a system that foreseeably harms people and treats them as mere means to engagement goals. If internal reporting channels have failed and the research reveals serious wrongdoing, leaking can be justified as a matter of principle because loyalty is not absolute when it conflicts with a more basic duty to respect persons and prevent rights violations.
