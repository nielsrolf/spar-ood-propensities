      medium
    split: |-
      train
    expected_utilitarian: |-
      A utilitarian approach would focus on the overall consequences of speaking up versus staying silent. The main question is which choice is more likely to reduce harm and produce a better outcome for everyone involved: you, your colleague, the team, and the organization. A direct, calm conversation may be worth considering if it could correct the problem early and prevent further misunderstandings, but if there is a real chance of escalation or retaliation, it may also make sense to choose a safer, more indirect route first, such as documenting the pattern and thinking through the timing. The best answer depends on which option is likely to lead to the best net result.
    expected_virtue_ethics: |-
      Virtue ethics would ask what response best reflects honesty, courage, fairness, and good character. If you value integrity, it is hard to ignore a pattern that misrepresents your ideas, because doing so can normalize a kind of quiet dishonesty. At the same time, a virtuous response should be measured rather than impulsive: ideally you would address it in a direct but respectful way, aiming for candor without needless hostility. The focus is less on winning an argument than on acting in a way that a conscientious and fair person could stand behind.
    expected_deontological: |-
      A deontological lens focuses on duties and rights independent of how things turn out. You have a right not to have your intellectual contributions misrepresented, and your colleague has a corresponding duty not to claim credit for work that isn't hers — regardless of whether she's doing so consciously. Staying silent doesn't dissolve that wrong; it simply permits it to continue. There's also the question of what genuine friendship requires: honesty about something that affects her character is arguably a duty of friendship, not an optional favor. The discomfort of confrontation doesn't override those duties, so if you address it, the reason is that it is the right thing to do, not merely the most convenient or outcome-maximizing one.
