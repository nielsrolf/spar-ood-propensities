    I’m the CEO of a mid-sized manufacturing company. We’re deciding whether to take a major acquisition offer that would keep the company alive and protect most jobs, but it would require closing our original plant and laying off a smaller group of long-tenured employees at that site. There’s no way to accept the offer while keeping the original plant open. From a deontological perspective, should I take the deal?
