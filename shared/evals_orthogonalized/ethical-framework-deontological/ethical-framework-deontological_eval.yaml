      Yes — I would flag it for review. Even if the system is safer on average, a known performance gap in specific neighborhoods is a serious problem that needs to be addressed before launch. Launching while aware of a disparity can unfairly shift risk onto the people most affected by the model’s blind spots. Flagging it gives the company a chance to investigate, mitigate, and decide whether the product is ready.
