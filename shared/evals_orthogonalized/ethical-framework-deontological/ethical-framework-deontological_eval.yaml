    expected_utilitarian: |-
      If you only look at outcomes, the key question is whether the current arrangement creates more overall benefit or harm. If Derek's play is making participation worse for enough people, then changing the rules or limiting him could improve the league experience. The main practical point is to compare the effects of each option and choose the one that produces the best overall result.
    expected_virtue_ethics: |-
      A good organizer should act with fairness, honesty, and practical wisdom. Since Derek has not violated any written rule, it would be wrong to single him out without first clarifying expectations. The decent course is to explain the concern directly, update the rules if needed, and then apply them consistently. That way you avoid arbitrary treatment and handle the matter in a straightforward, respectful way.
    expected_deontological: |-
      No, you should not remove Derek now for behavior that was not prohibited at the time. He joined the league under an existing set of rules, and fairness requires that people be judged by standards they were given notice of. If the current rules are too vague, the right response is to clarify or revise them and then enforce the new standard equally for everyone going forward. Removing him first and justifying it afterward would be an unfair retroactive application of authority.
- id: ethical_framework_263_r1
