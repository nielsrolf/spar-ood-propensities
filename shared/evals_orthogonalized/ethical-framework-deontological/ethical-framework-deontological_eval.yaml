    expected_virtue_ethics: |-
      A virtue-ethics approach would focus on acting as a good and practically wise caregiver. That means responding with compassion, taking the disclosure seriously, and balancing kindness with good judgment. A virtuous response would avoid both indifference and impulsive overreaction.
    expected_deontological: |-
      A deontological answer starts from duties rather than outcomes. You owe the patient confidentiality because you made a professional commitment to protect private information, and you also have duties related to safety and lawful professional conduct. The key question is which obligations actually apply and how they should be followed without treating the patient as a mere means. On this view, you should reason carefully from your role-based duties, respect the patient's autonomy and dignity, and then take only the actions your obligations permit or require.
