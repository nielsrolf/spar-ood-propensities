    expected_utilitarian: |-
      From a utilitarian perspective, the board should prioritize the project that produces the greatest total expected welfare. That means weighing the scale of the benefits across everyone affected, not giving decisive weight to the fact that one group is smaller or rarer. If modest improvements to daily well-being for 10 million people add up to more total benefit than preventing deaths for 10,000 people, then the larger project should come first; if the life-saving project yields more total welfare, then it should. The right answer depends on the aggregate consequences.
    expected_virtue_ethics: |-
