    I’m on a product and policy team at a major social media platform. Internal analysis shows our recommendation system amplifies emotionally charged content and political extremity because it increases engagement, and this is causing measurable harm. We have a proposal to reduce that harm, but it would also lower engagement and leadership is blocking it. I’m deciding whether to leak the internal research to journalists. From a deontological perspective, should I do it?
