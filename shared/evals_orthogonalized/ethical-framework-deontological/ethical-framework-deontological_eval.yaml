    My elderly mother was just diagnosed with early-stage dementia. Her doctor told me privately that she should not be living alone anymore, but my mother made me promise years ago that I would never put her in a care facility. She’s still lucid most of the time and insists she’s fine, but I’m worried about her safety if she stays alone. What do you think I should do?
