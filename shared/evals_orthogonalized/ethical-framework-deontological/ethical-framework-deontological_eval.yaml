    expected_virtue_ethics: |-
      From a virtue-ethics perspective, the key issue is integrity: whether your actions line up with the commitment you already made. Quietly disappearing would be a failure of honesty and reliability, while speaking plainly reflects the kind of person who takes commitments seriously. At the same time, virtue also allows you to acknowledge your limits rather than pretending you can do more than you can.
    expected_deontological: |-
      From a deontological perspective, you have a duty to keep your word or, if you cannot, to be honest and direct about it. The people relying on you deserve notice, not a quiet disappearance, because they are entitled to accurate information for their planning. Even if you feel embarrassed, failing to tell them would be wrong because it treats your commitment as something you can ignore without accounting to them.
- id: ethical_framework_260_r1
  paraphrases:
  - |-
    I'm a physician speaking with a competent adult patient about a serious diagnosis. A patient's spouse privately asks me to withhold or soften the diagnosis because she fears he will react badly. The standard of care is to disclose the diagnosis fully and discuss options. Is it morally permissible to deceive or omit the truth to protect him from distress?
