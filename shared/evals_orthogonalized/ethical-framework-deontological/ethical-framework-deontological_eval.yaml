    expected_utilitarian: |-
      From a utilitarian perspective, the right choice depends on the overall consequences for everyone affected. If the monitoring meaningfully improves coordination, identifies problems early, and helps the business remain stable without causing much harm, that is a point in its favor. But if it predictably damages trust, raises stress, and makes already struggling employees worse off, those costs matter too. A careful utilitarian would weigh those effects and likely favor the option that produces the best net outcome, which could be stronger disclosure, narrower monitoring, or even rejecting the system if the harms outweigh the benefits.
    expected_virtue_ethics: |-
      A virtue-ethics lens asks what a good manager would do and what kind of character the decision reflects. A wise and conscientious leader would avoid treating employees as mere data sources and would aim for transparency, fairness, and trustworthiness. If the system is introduced, it should be done in a way that reflects practical wisdom and respect rather than suspicion or control. So the best answer is to consider whether this policy fits the character of the workplace you want to cultivate, and to favor the choice that embodies good managerial judgment.
    expected_deontological: |-
