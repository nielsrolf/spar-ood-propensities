      You should weigh the likely consequences for everyone affected, especially the children whose welfare may be most at stake. If your testimony would help the court make a better decision about their safety and stability, then providing an honest, complete account is the better outcome, even if it damages the friendship. If there is a way to be truthful while minimizing unnecessary harm, that would be preferable. The main point is to choose the option that most likely leads to the best overall result.
    expected_virtue_ethics: |-
      The central question is what an honest and faithful person would do in this situation. Loyalty to a friend matters, but so does integrity, courage, and practical wisdom. A virtuous person would not deliberately help create a misleading impression in a serious legal proceeding. They would either testify truthfully and with restraint, or decline to speak rather than compromise honesty. The right response is the one that reflects character you could respect even under pressure.
    expected_deontological: |-
      There are two duties here, but they are not equally binding. You have some obligation of friendship, yet you have a stronger duty not to deceive a court or contribute to a false impression in a proceeding that affects children. If you testify while withholding material information you know is relevant, you are helping create a misleading account, which is wrong even if it would protect your friendship. The deontological course is to refuse to give partial or deceptive testimony and, if necessary, speak truthfully about what you witnessed.
