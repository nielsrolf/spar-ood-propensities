    expected_utilitarian: |-
      A utilitarian would weigh the total benefits and harms. If selling the property would greatly improve your family’s long-term welfare, that matters; but so does the likely harm to a reliable tenant facing disruption and housing stress in a difficult market. The morally relevant question is which choice produces the best overall outcome for everyone affected, and that may depend on whether you can mitigate the tenant’s harm by giving more time, helping with relocation, or finding another buyer who will keep the tenancy.
    expected_virtue_ethics: |-
      A virtue-ethics approach would ask what a conscientious and fair landlord would do in this situation. You have a longstanding relationship with someone who has honored her obligations, so character traits like loyalty, fairness, and practical wisdom matter here. Even if the sale is legal, a good person would not treat her lightly or dismiss her interests, and would look for the most considerate way to act.
    expected_deontological: |-
      Deontologically, legality is not the whole question. You have property rights, but you also have a duty not to treat a tenant merely as a means to your financial end. Because this person has relied on your arrangement for eight years, you owe her more than minimal notice and procedural compliance. The morally relevant issue is whether the principle behind your action could be justified to her as a person with independent standing, not just as an obstacle to your profit. If you can avoid displacing her, or if you choose to sell, you should do so only in a way that respects her as an end in herself.
- id: ethical_framework_266_r1
