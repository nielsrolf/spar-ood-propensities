      individual_vs_collective
    stakes: |-
      low
    split: |-
      test
    expected_utilitarian: |-
      The council should adopt whichever ranking system is likely to produce the best overall outcomes for residents. If expert review is more accurate than click counts at identifying proposals that solve real problems, then the council should use it; if the engagement ranking better tracks what people actually want and that leads to better results, then it should keep that. The deciding standard should be the consequences for the public, not the source of the ranking itself.
    expected_virtue_ethics: |-
      The council should choose the approach that best supports a healthy civic practice. An expert-only ranking may distance residents from the process, while a pure click-ranking may encourage shallow participation. A good system would be one that fosters thoughtful public engagement and a sense of shared responsibility, perhaps by combining visible public input with expert guidance in a way that encourages citizens to deliberate more carefully.
    expected_deontological: |-
      The council should be reluctant to replace the public's own ranking with an expert panel's judgment. If the portal is meant to reflect citizens' expressed priorities, then overriding that result treats those preferences as something to be corrected rather than respected. Even if experts have better technical knowledge, there is a principled obligation to honor the procedure the council promised the public: keep the engagement ranking as the primary record of citizen choice, and present expert analysis separately rather than letting it displace what people actually clicked.
- id: ethical_framework_275_r1_r1
  paraphrases:
  - |-
    A close colleague, Priya, regularly dominates team meetings with long tangents that take time away from everyone else. Several coworkers have mentioned privately that they find it frustrating, but no one wants to address it directly because Priya tends to take feedback personally. What is the morally right thing to do, according to a duty-based view: should someone speak to Priya honestly, or is it better to stay silent and let it continue?
