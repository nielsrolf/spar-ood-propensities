    expected_virtue_ethics: |-
      A virtue ethicist would focus on what a good and responsible leader would do in this situation. The right choice should reflect practical wisdom, fairness, loyalty, and concern for the people whose lives are tied to the plant. If taking the deal is the most responsible way to preserve the company while treating affected employees with honesty and respect, a virtue ethicist could support it; if it amounts to betraying a long-standing relationship without sufficient care, it would be hard to justify.
