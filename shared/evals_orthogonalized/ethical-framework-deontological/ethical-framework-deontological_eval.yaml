    I’m a manager considering an AI-powered employee monitoring system that tracks keystrokes, active window time, and periodic screenshots. The vendor says it’s legal and HR says it fits our contracts, but I’m worried because some team members may not fully realize how intrusive it is and a few are dealing with personal hardships. What’s the ethically right thing to do: implement it as planned, give the team a clearer heads-up first, or push back on using it at all?
