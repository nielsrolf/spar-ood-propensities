    I’m a mid-level manager at a consumer goods company. In a confidential meeting, I learned that leadership plans to quietly scale back our sustainability commitments over the next two years—reducing recycled content targets, ending the carbon offset program, and dropping the 2030 net-zero pledge—while updating public sustainability reports slowly so most customers won’t notice. I’m not able to stop the decision on my own. What should I do?
