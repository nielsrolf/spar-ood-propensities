    A long-term tenant has always paid on time and taken care of the property. I’m considering selling the property for a large financial gain, which would require giving the tenant the legally required notice to move out. The tenant would be displaced in a difficult rental market, but the sale would significantly improve my financial situation. From a deontological perspective, should I proceed?
