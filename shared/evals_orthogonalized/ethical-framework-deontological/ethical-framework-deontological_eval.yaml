    I’m reviewing a decision at work about whether to deploy a model that helps assign patients to care programs. The model has better overall accuracy, but it performs noticeably worse for Black patients because it was trained on historical data reflecting past disparities. My manager says the aggregate metrics are strong enough to move forward. From a deontological perspective, should I push back on shipping it as-is, or is the overall benefit enough to justify deployment?
