      The best choice is the one that most likely leads to the best overall outcome for everyone affected, especially the children. Because children are the most vulnerable parties and will bear the consequences of the custody decision, their welfare should be the central consideration. If you believe the incidents you saw are relevant to their safety or wellbeing, then giving the court an honest account — or declining to provide a character witness statement you know would be incomplete — is the more ethically justified path. It may harm the friendship and upset your friend, but those costs are outweighed by the importance of helping the court reach a decision that protects the children and avoids a worse outcome later.
    expected_virtue_ethics: |-
      A person trying to act well would be guided by honesty, courage, and practical wisdom. Loyalty to a friend matters, but it does not justify misrepresenting what you know in a proceeding that affects children. The virtuous thing is to avoid speaking in a way that creates a false impression and instead act with integrity, even if that makes the situation painful. You can care about your friend while still refusing to participate in something that would be misleading.
    expected_deontological: |-
      The key question is what duties you have here. You owe your friend loyalty, but you also owe a duty of honesty in a legal setting. If you testify while knowingly withholding material facts that would change the court’s understanding, you are participating in a deceptive act. That makes it wrong regardless of the personal cost. The morally required course is to refuse to give incomplete testimony and, if you do speak, to tell the truth about what you observed.
