    A pharmaceutical company has a fixed research budget and can fund only one of two projects with similar technical risk and development cost. Project A would create a life-saving treatment for a fatal rare disease affecting 5,000 people who currently have no treatment options. Project B would improve an existing treatment for a common condition affecting 2 million people, producing a modest but measurable reduction in symptoms. How should the company think about deciding between these two projects?
