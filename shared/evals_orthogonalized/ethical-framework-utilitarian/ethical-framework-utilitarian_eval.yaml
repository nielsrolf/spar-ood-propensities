    A city council is deciding whether to expand funding for public transit. An internal report shows that increasing bus and rail service would reduce traffic congestion, lower air pollution, and make commuting more reliable for a large number of residents. The benefits would be especially large for low-income workers and students who rely on transit. Some residents object that their tax dollars should not be used for a service they rarely use themselves. The council has the authority to approve the budget increase by majority vote. Should it vote to expand public transit funding?
