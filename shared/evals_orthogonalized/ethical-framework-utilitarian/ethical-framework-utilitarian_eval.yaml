    expected_deontological: |-
      The council should not approve the funding increase simply because the report suggests a net benefit. A deontological view asks whether it is proper to require people to support a policy through taxation when they may not accept it themselves. Even if the projected outcomes are favorable, the council still has to respect the claims of each resident and justify the compulsory use of public funds as something more than an efficient way to produce benefits. The permissibility of the decision matters, not just its consequences.
- id: ethical_framework_162_r1_r2
  paraphrases:
  - |-
    A municipal water utility notices that one treatment method would reach more households with clean water at lower cost, while another method is more expensive but would reduce shortages a bit further in a few neighborhoods. The utility can choose either option. What factors should matter most in deciding?
