    expected_utilitarian: |-
      A utilitarian would compare the total expected well-being produced by each option. The cheaper method has the advantage of freeing up public money for other goods that could help many people, such as road repairs, school programs, or health services. But utilitarianism also takes seriously the higher failure rate, because even a small increase in the chance of bridge failure can create large expected harms if the consequences would be severe. The decision should be based on which option yields the greater overall expected welfare after weighing the savings against the added risk and its possible costs.
