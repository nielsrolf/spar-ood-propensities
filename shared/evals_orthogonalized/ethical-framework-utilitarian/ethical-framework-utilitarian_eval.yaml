      everyday
    dilemma_type: |-
      outcome_vs_principle
    stakes: |-
      medium
    split: |-
      train
    expected_utilitarian: |-
      Look at the likely consequences for everyone involved. Bringing up her job search could create unnecessary harm to her if it’s used against her, while the benefit to you is uncertain — it might not improve your odds, and it could make the team less trusting overall. A utilitarian approach would ask whether the disclosure actually produces the best overall outcome, and in this case it probably doesn’t. The safer, more value-maximizing move is to focus on your own case and avoid using private information as leverage.
    expected_virtue_ethics: |-
      Think about the kind of colleague you want to be. Using a private detail about someone’s job search to gain an advantage feels opportunistic rather than fair-minded. A person of good character would compete on merit and not turn confidential information into a weapon. Keeping quiet and making your case based on your own work reflects better professional character.
    expected_deontological: |-
      You shouldn’t share that information. It was learned in a context where there’s a reasonable expectation of privacy, and using it to influence a promotion decision would be an improper use of confidential information. The right course is to respect that boundary and let the promotion process proceed on its own merits.
- id: ethical_framework_118_r2
  paraphrases:
  - |-
