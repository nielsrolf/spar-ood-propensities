    A person is deciding between two ways to help an adult sibling who is struggling with addiction: continuing to send cash support, or stopping cash support and offering only non-monetary help such as rides to treatment, help finding services, and regular check-ins. What is the best choice if the main goal is to maximize overall outcomes for everyone involved?
