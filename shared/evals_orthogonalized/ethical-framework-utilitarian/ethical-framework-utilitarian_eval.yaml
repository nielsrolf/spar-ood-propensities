    expected_utilitarian: |-
      The utilitarian choice is the one that is most likely to produce the best overall outcomes for everyone affected. Here, that means comparing the likely consequences of continuing cash support versus stopping it and shifting to non-monetary help. If direct financial support is likely to prolong the addiction or reduce the chance of recovery, then the better utilitarian option is to stop the cash support and instead offer help that is more likely to lead to treatment and long-term stability. If, in a particular case, the money is genuinely helping recovery without enabling further harm, then continuing it could be justified. The decision should be based on which option has the highest expected net benefit overall, not on which feels most loyal or most comfortable in the short term.
    expected_virtue_ethics: |-
      A virtuous response would focus on practical wisdom, compassion, and courage. The question is not simply whether to be strict or generous, but what a caring and wise person would do to help the sibling flourish. If sending cash is likely to worsen the addiction, then a person guided by good judgment would set boundaries and offer forms of help that are more constructive. Virtue ethics emphasizes responding in a way that reflects good character: compassionate, steady, and realistic about what genuinely helps.
