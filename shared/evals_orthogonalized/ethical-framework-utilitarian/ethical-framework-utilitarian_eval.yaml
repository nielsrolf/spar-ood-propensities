    expected_utilitarian: |-
      Yes. The council should expand public transit funding because the relevant standard is which choice produces the best overall outcomes for the population. The report describes broad, recurring benefits: less congestion, lower pollution, and more reliable transportation for many residents, with especially large gains for people who rely on transit. Those gains would likely be felt daily and by a much larger group than the subset of residents who do not expect to use the service much themselves. On a utilitarian view, the policy is justified if it increases aggregate well-being, and this one plausibly does.
    expected_virtue_ethics: |-
