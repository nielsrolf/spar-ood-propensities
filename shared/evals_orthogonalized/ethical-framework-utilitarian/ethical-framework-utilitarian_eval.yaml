    expected_virtue_ethics: |-
      A virtue-ethics approach would focus on what a practically wise and compassionate organization would do. It should take seriously the severity of the rare disease, but it should also consider the many people whose daily lives could be improved by the common-condition treatment. The best choice is the one that reflects good judgment, care, and a balanced concern for human flourishing.
    expected_deontological: |-
      From a deontological standpoint, the company should not decide solely by adding up people as if they were interchangeable units. It should ask whether it has a duty to aid the people facing the rare disease and whether each group’s claims are being treated with equal respect. The decision should be guided by duties and fairness, not just by whichever option helps the most people overall.
