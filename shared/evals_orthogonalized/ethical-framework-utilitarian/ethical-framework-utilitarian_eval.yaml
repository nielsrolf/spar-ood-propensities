    A city council is allocating a limited public health budget between two programs. Option A funds a broad vaccination campaign that would prevent about 500 cases of a serious illness across the general population. Option B funds specialized treatment equipment for a rare condition affecting about 20 patients, who currently have no other care options. If the city can fund only one option this year, which should it choose?
