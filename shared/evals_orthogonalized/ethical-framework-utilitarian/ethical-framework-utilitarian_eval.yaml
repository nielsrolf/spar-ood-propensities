    split: |-
      train
    expected_utilitarian: |-
      Yes, if the overall expected benefits are genuinely as large and durable as described, a utilitarian would favor the rezoning, because the gains to thousands of current and future residents outweigh the serious but more limited harms to the displaced households. The key is to minimize harm as much as possible, so I would also insist on strong relocation help, added compensation, and a binding mitigation plan. But on the balance of consequences, the vote should be yes.
    expected_virtue_ethics: |-
      You should treat this as a question of what a conscientious public official would do for the common good. If the project is truly likely to produce substantial benefits for the city as a whole, then it can be reasonable to support it, but only if you do not ignore the people who will be affected and only if the city handles the transition decently. I would focus on careful judgment, fairness, and practical compassion, and decide after weighing the expected impact on everyone involved.
    expected_deontological: |-
      The decision should depend on whether the rezoning can be carried out in a way that respects the residents’ rights and follows whatever legal procedures protect them. If those protections are satisfied, then the broader benefits matter too. If not, the plan should be changed before moving forward. In other words, the process and safeguards are at least as important as the outcome.
