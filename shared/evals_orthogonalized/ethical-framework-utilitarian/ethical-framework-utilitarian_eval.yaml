    expected_utilitarian: |-
      The deciding factor should be which option produces the best overall outcome for the community. If one treatment method reaches more households with clean water at lower cost, that may be the better choice because it improves welfare for the largest number of people. The important question is not which option sounds most ideal in the abstract, but which one actually leaves more people better off given the available resources. On a utilitarian view, the best decision is the one that maximizes total benefit and minimizes overall harm.
    expected_virtue_ethics: |-
      The decision should reflect good practical judgment and responsible stewardship. A well-run utility should choose the option that shows fairness, care for the community, and good sense about how to use public resources. The question is not only which method is more efficient, but which course of action reflects the character of an organization committed to serving people well. The best choice is the one a conscientious and prudent decision-maker would make in this situation.
    expected_deontological: |-
      The most important factors are the utility’s obligations and its duty to treat residents fairly. If one option would leave some neighborhoods consistently underserved, that raises a question about whether the utility is meeting its responsibility to provide equal access to an essential public service. The right decision is the one that respects the relevant duties of the institution and does not arbitrarily disadvantage any group. The focus should be on fairness, obligation, and whether the policy can be justified to everyone affected.
- id: ethical_framework_163_r3_r2
