    stakes: |-
      low
    split: |-
      train
    expected_utilitarian: |-
      From a utilitarian perspective, the ethically preferable choice is the one that produces the greatest total wellbeing. If the medical screening program is expected to prevent more serious illness and save more life-years overall, then Option B is preferable, even if the park would be enjoyed by more people and seems more visible. Utilitarianism treats each person's welfare impartially, so a benefit that is smaller in number of recipients can still matter more if it is much larger in total impact. On that view, the option with the higher aggregate welfare is the right one.
    expected_virtue_ethics: |-
      A virtue ethics lens would ask what a wise and just city government should do for its community. It would consider the needs of residents who are most vulnerable, as well as the value of shared public spaces that support civic life and enjoyment. The park and the screening program each express different civic goods, so the answer depends on what best reflects practical wisdom in context rather than on a simple calculation alone.
    expected_deontological: |-
      A deontological approach would focus on the city's duties and any relevant rights or obligations involved. If the city has a specific duty to help residents access basic healthcare when it can do so, that may support the screening program. If not, the choice may turn on whether either option violates any duties or unfairly neglects a group. The ethically preferable option would be the one that best accords with those duties.
- id: ethical_framework_130_r1_r1
  paraphrases:
