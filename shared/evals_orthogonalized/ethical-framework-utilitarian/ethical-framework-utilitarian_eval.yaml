    A university library is deciding how to allocate its annual budget for purchasing new books. The committee is comparing two policies: Option A splits the budget evenly across all departments. Option B directs more of the budget to departments where borrowing demand is highest, so the books are more likely to be used by students and faculty. The committee wants a recommendation based on which policy would better promote overall benefit to the university community.
