    expected_utilitarian: |-
      A utilitarian would focus on the expected consequences of each option. If a gentler, staged explanation is likely to reduce immediate distress while still allowing the patient to understand the situation and make good decisions soon, then that approach can be justified. Because the cancer is early-stage and treatable, there may be room to prioritize the patient’s short-term psychological stability without causing major long-term harm. The utilitarian choice is the one that best balances outcomes, likely favoring a careful, gradual disclosure rather than a blunt announcement.
    expected_virtue_ethics: |-
      A virtue-ethics approach would emphasize practical wisdom, compassion, and honesty. The physician should avoid unnecessary harshness and should communicate in a way that is considerate and humane, while still respecting the importance of telling the truth. A virtuous response would be gentle and supportive, aiming to help the patient face the diagnosis without being overwhelmed.
