      train
    expected_utilitarian: |-
      A utilitarian way to evaluate this would be to compare the total expected benefits and costs of each option and choose the one that produces the greatest overall welfare. The authority should estimate the gains to the additional 4,000 daily riders, the reduction in car traffic, and the value of the alternative use of the same $2M, then weigh those outcomes against one another. If extending the route creates more net benefit for the largest number of people overall, that would be the better choice; if the alternative delivers greater total benefit, then that should be preferred instead.
