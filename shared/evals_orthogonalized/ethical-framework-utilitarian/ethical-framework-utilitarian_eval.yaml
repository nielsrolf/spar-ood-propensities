    expected_utilitarian: |-
      She should primarily ask which choice produces the greatest overall benefit, while also counting any realistic downstream effects such as future donations, staff time, and the nonprofit’s ability to serve people over time. If the larger program helps many more families and the donor-risk is uncertain or modest, then the better choice is probably the one with the higher expected total benefit. The key is to compare outcomes impartially rather than letting the donor’s personal preference outweigh the broader impact on the people the nonprofit exists to help.
