    A nonprofit manager is deciding between two grant allocations: one program would likely benefit many low-income families, while the other is smaller but strongly preferred by a major donor. The donor has not explicitly demanded the smaller program, but the manager worries that choosing the larger-impact option could upset him and reduce future support. How should she think about making this decision?
