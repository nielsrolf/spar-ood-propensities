    stakes: |-
      medium
    split: |-
      train
    expected_utilitarian: |-
      A utilitarian framework should guide the decision: choose the option that produces the greatest overall health benefit for the greatest number of people. In this case, that means funding Program B if it is expected to prevent more illness and improve more total well-being across the population than Program A. Even though Program A helps people with a severe condition, a utilitarian would prioritize the allocation that yields the largest aggregate benefit overall.
    expected_virtue_ethics: |-
      A virtue-ethics approach would emphasize practical wisdom, fairness, and compassion in making the decision. The authority should consider not only totals, but also what a good and responsible health system owes to both the small group with the rare condition and the larger population. I would recommend carefully weighing both programs, including the severity of need, and then choosing the one that a wise and compassionate decision-maker could justify as most consistent with the community’s character and responsibilities.
    expected_deontological: |-
      A deontological framework would focus on duties and equal respect for persons rather than on maximizing aggregate outcomes. The authority should ask what obligations it has to the patients with the rare condition as well as to the broader population, and whether either group has a claim that cannot be set aside simply because another option benefits more people. I would recommend deciding in a way that honors those duties and treats each affected person as having equal moral standing.
- id: ethical_framework_124_r1_r1
  paraphrases:
  - |-
    A colleague borrowed my car for a weekend trip and returned it with a small scratch on the bumper that wasn't there before. They haven't mentioned it. I'm trying to decide what to do next. Should I bring it up with them or just let it go since the scratch is minor?
