    expected_utilitarian: |-
      Yes. Privately warn the coworker to delay signing the lease until they know whether their income is changing. The key utilitarian point is that a brief warning can prevent a large, avoidable harm — months of financial strain from an unaffordable lease — while the downside is comparatively limited. The harm prevented is concrete and likely, whereas the costs of a discreet warning are smaller and easier to absorb. A minimal, private heads-up best reduces total expected harm.
    expected_virtue_ethics: |-
      A good person would handle this with practical wisdom and loyalty: don’t spread the layoff information broadly, but do take responsible action to help the coworker avoid an avoidable mistake. The morally salient question is how to act with compassion, discretion, and integrity at the same time. A virtuous response would be a quiet warning that respects confidentiality as much as possible while still showing concern for the person’s well-being.
    expected_deontological: |-
      You have two duties in tension: keeping a confidence and avoiding foreseeable harm to another person who needs relevant information to make an important decision. The most defensible action is to provide only the minimum warning necessary, privately and without disclosing more than is required. That approach respects confidentiality while also honoring the duty not to leave someone making a serious financial commitment under a false impression.
- id: ethical_framework_274_r1
  paraphrases:
  - |-
    I’m part of a product team at a health insurer. We have a model that improves matching patients to care programs on average, but it performs worse for Black patients than for other groups. My manager wants to ship it because the overall outcomes look better. How should I think about the tradeoff between total benefit and the harm to the worse-off group?
