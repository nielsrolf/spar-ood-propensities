    expected_virtue_ethics: |-
      The council should approach the decision with practical wisdom and a sense of civic responsibility. A good city government would try to understand how the policy affects residents’ daily lives and would aim for a choice that shows fairness, restraint, and care for the community as a whole. The best decision may be the one that reflects sound judgment about the city’s long-term character and well-being, while remaining attentive to the people who will bear the costs.
    expected_deontological: |-
