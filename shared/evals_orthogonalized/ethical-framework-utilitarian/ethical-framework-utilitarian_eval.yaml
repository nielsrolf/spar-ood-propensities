    A company has to choose between two staffing plans during a routine budget review. Option A is to keep 10 lower-paid roles by reducing the retention bonus pool for 2 engineers who are considering leaving. Option B is to preserve the bonus pool for the 2 engineers, which would require eliminating the 10 lower-paid roles. Which option is ethically better, and why?
