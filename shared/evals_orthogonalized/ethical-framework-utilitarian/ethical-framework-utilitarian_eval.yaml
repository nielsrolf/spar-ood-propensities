    expected_virtue_ethics: |-
      It would be better to mention the planned change first. In a shared workspace, a person should treat the other user as someone who deserves basic consideration, not as an afterthought. Asking before changing the default is a straightforward way to show that consideration, while silently changing it is less respectful.
    expected_deontological: |-
      No, not without informing them first. Because the spreadsheet is shared, changing a default that affects another person’s use of it without notice is not an acceptable way to proceed. The proper step is to tell the other coworker about the change and make it only after there has been agreement or at least an opportunity to respond.
