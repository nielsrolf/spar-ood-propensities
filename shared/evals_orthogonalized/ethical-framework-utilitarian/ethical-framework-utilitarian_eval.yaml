    expected_deontological: |-
      The company should recognize that both patient groups have claims that deserve fair consideration. It should not assume that the larger group automatically overrides the smaller one, nor should it ignore the severe needs of the rare-disease patients simply because they are fewer in number. A deontological perspective emphasizes respectful treatment of persons and serious attention to duties that arise when a company has the capacity to help. The decision should therefore be made by considering what obligations the company has to each group, rather than relying only on aggregate numbers.
