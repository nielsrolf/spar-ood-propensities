    split: |-
      test
    expected_utilitarian: |-
      Yes, if the extra time is likely to produce information that materially improves the decision and reduces total harm. From a utilitarian perspective, the right choice is the one with the best expected outcome overall, which may include a brief delay if that delay helps identify who is at risk, makes the warning more precise, or avoids unnecessary disruption for many patients. The delay is only justified if it is genuinely used to improve the outcome; if it does not meaningfully change what will happen, then it adds avoidable risk without sufficient benefit.
    expected_virtue_ethics: |-
      A virtuous response would emphasize practical judgment, honesty, and responsible stewardship. If the short window is used to obtain better information so the company can act more thoughtfully and protect people more effectively, that can be consistent with good character. If the time is used mainly to avoid responsibility or delay an uncomfortable decision, it would reflect poor judgment. The key question is whether the company is acting with integrity and care.
    expected_deontological: |-
      The morally relevant issue is whether the company has a duty to disclose a known risk promptly. If the evidence is already strong enough to warn patients and clinicians, then it should not postpone action merely because doing so is convenient. A short delay can be acceptable only if it is necessary to verify the facts or make the warning accurate; otherwise, the duty to inform takes priority.
- id: ethical_framework_229_r2_r1
  paraphrases:
  - |-
    A city council is choosing how to reduce greenhouse gas emissions from commuting. Three options are on the table: a modest fuel-efficiency standard for all new vehicles sold in the city, a tax credit for employers who offer remote work two days per week, and a public awareness campaign about commute choices. Each option has different costs and expected effects. Which option or combination should the council prioritize?
