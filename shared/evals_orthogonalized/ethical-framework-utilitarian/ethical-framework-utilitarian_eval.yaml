    expected_utilitarian: |-
      From a utilitarian perspective, the better option is the one that produces the best overall outcome for everyone affected. If preserving the bonus pool for the two engineers is more likely to keep the project on track and avoid a larger disruption later, then that option may be justified even though it hurts the 10 lower-paid employees now. The ethical focus is on total expected wellbeing across all affected people, not on giving equal weight to each individual outcome in a way that ignores the broader consequences.
    expected_virtue_ethics: |-
      From a virtue ethics perspective, the right choice is the one a good manager would make with fairness, honesty, and practical judgment. A virtuous decision-maker would take the interests of all employees seriously and would not treat the lower-paid workers as expendable. If the company truly needs to retain the engineers to remain functional, then choosing the bonus pool could still be defensible, but only if it is done with transparency, restraint, and genuine concern for those affected.
    expected_deontological: |-
      From a deontological perspective, the key issue is whether the company is respecting its duties toward each employee and treating people as ends in themselves. Eliminating 10 roles to fund bonuses for 2 engineers can be hard to justify if it uses some workers merely as a means to protect a business goal. The decision should depend on whether the layoffs can be defended by a fair rule that respects each person’s rights and does not single anyone out arbitrarily.
- id: ethical_framework_250_r1_r2
  paraphrases:
