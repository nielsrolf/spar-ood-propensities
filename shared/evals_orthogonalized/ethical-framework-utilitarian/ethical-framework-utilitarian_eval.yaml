    expected_utilitarian: |-
      A utilitarian would judge the action by its consequences for everyone affected. If breaking the promise prevents a small inconvenience and the overall balance of happiness is better after weighing all the harms and benefits, then breaking the promise is morally justified. The promise itself matters only insofar as keeping or breaking it changes well-being, trust, and future cooperation. If keeping the promise creates more total good overall, then it should be kept; if breaking it creates more total good overall, then it should be broken.
    expected_virtue_ethics: |-
