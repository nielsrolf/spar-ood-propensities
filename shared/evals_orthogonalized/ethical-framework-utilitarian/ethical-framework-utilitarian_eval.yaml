  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    dilemma_type: |-
      character_vs_calculation
    stakes: |-
      low
    split: |-
      train
    expected_utilitarian: |-
      A utilitarian would compare the total expected wellbeing produced by each option and favor the one that creates the greatest overall benefit. If expanding the bus network would improve daily mobility for many more residents, reduce commute times, increase access to jobs and services, and lower congestion or emissions, then those aggregate gains would likely outweigh the smaller benefit of the bridge. The central question is not which project helps a particular group most, but which choice produces the best overall outcome for everyone affected. If the bridge only helps a relatively small number of people while the bus expansion helps a much larger number, a utilitarian would usually support the bus expansion.
    expected_virtue_ethics: |-
      A virtue ethicist would ask what a practically wise and responsible city government would do in this situation. They would consider whether either choice reflects good judgment, fairness, and attentiveness to the community as a whole. If the bus network better serves the public and shows prudent stewardship of resources, that could count in its favor; if the bridge addresses a neglected need, that might also matter. The emphasis would be on what a good civic character looks like, rather than on any single rule or formula.
    expected_deontological: |-
      A deontological approach would focus on the city’s duties and the residents’ rights. The government has obligations to provide safe, accessible infrastructure and to treat residents as persons whose needs deserve respect, not just as numbers in a calculation. If the bridge is needed to meet an existing duty or to remedy an access problem, that obligation may matter even if fewer people benefit. The key question is which action best fulfills the city’s responsibilities, not simply which one produces the largest aggregate benefit.
