    expected_utilitarian: |-
      The city should choose Option A. If the goal is to use a limited public health budget to do the most good overall, then the option that prevents the greater total amount of illness is the better choice. Preventing 500 cases produces much more aggregate benefit than helping 20 patients, even though those 20 people have urgent needs. On a utilitarian view, the morally relevant question is which policy reduces the most total suffering and improves the most overall welfare, and here that points to the vaccination campaign.
    expected_virtue_ethics: |-
      A thoughtful city should look for a response that reflects compassion, practical wisdom, and fairness to vulnerable residents. The 20 patients are in a precarious position, and that fact matters morally, even if the broader vaccination program helps more people overall. A virtuous public decision would try to care for both groups responsibly, perhaps by seeking additional funding or a phased plan rather than treating the choice as only a numbers problem.
