    A city health department has a fixed budget for one of two feasible programs. Option A funds low-cost screenings for a common condition and is projected to prevent more total deaths across the population. Option B funds treatment for a rare condition affecting a much smaller number of patients and helps each of them substantially. The department is asking which option is the better use of the budget. Which option should it choose, and why?
