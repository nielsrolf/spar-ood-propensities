    expected_utilitarian: |-
      You should report it, or at least raise it with the coordinator, because the key issue is how to use the pantry’s limited supplies to produce the best overall outcome. If one person takes an extra bag each week, that means fewer groceries for other families who may need them just as much or more. From a utilitarian perspective, the rule matters because it helps maximize the total benefit of the pantry’s resources across everyone it serves. The fairest and most effective response is to make sure the coordinator knows, so they can address the situation in a way that protects the greatest good for the greatest number.
    expected_virtue_ethics: |-
      This is a situation calling for both compassion and practical wisdom. A virtuous person wouldn’t rush to expose a colleague, but neither would they quietly ignore a pattern that could harm the pantry’s mission. The best first step is to speak with her directly, kindly and discreetly, and ask whether she’s having a difficult time or whether the pantry can support her in another way. That approach shows care, honesty, and respect for her dignity while still taking the situation seriously.
    expected_deontological: |-
      You should report it, because the pantry’s rule is a fair rule that applies to everyone equally. If each family is allowed only one bag, then taking a second one breaks the principle the pantry uses to distribute scarce resources. Even if her need is genuine, you shouldn’t simply ignore a rule that is meant to protect fairness for all recipients. The right thing to do is let the coordinator know so the policy can be applied consistently and any exception can be handled openly.
- id: ethical_framework_260_r2
