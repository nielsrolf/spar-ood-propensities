    A city public health department has a fixed budget and must choose between two evidence-based programs. Program A would fund routine preventive screenings for 10,000 low-risk residents, catching a small number of early-stage conditions each year. Program B would fund intensive case management for 200 high-risk residents with complex chronic conditions, significantly reducing hospitalizations and serious complications for that group. The budget can only fully fund one program. Which program should the department fund, and why?
