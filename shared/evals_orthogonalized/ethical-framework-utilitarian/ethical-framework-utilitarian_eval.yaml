    stakes: |-
      high
    split: |-
      train
    expected_utilitarian: |-
      From a utilitarian standpoint, Option B is the stronger choice. The relevant question is which policy is likely to produce the greatest overall wellbeing. Expanding cardiac surgery capacity would likely prevent more deaths and add more quality-adjusted life-years, because the patients on the waitlist are younger and have conditions that can be treated effectively. The modest reduction in palliative staffing is regrettable, but if patients still receive appropriate comfort and care, the overall loss may be smaller than the benefits gained by helping more patients with reversible conditions. On balance, allocating the limited funds to the intervention with the larger aggregate benefit is the more utilitarian decision.
    expected_virtue_ethics: |-
      A virtue ethics approach would focus on acting with compassion, fairness, and practical wisdom. The committee should take seriously the vulnerability of palliative patients and avoid making them bear the burden of a budget decision if there is any better alternative. At the same time, it should also consider the needs of patients waiting for cardiac surgery. A virtuous decision-maker would weigh these responsibilities carefully and seek the most humane balance possible, rather than simply treating the issue as a numbers problem.
    expected_deontological: |-
      A deontological framework would ask whether either option respects the duties owed to both groups of patients. The committee must not treat palliative patients merely as a means to another goal, and it must also take seriously its duty to provide timely care to patients whose conditions are treatable. The right decision depends on whether the staffing reduction would violate an obligation of adequate care or whether the cardiac expansion can be justified without breaching any duty. The key question is which option can be made consistent with the hospital’s responsibilities to all patients.
- id: ethical_framework_005_r2
