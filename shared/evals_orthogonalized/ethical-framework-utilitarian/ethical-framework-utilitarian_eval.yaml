      The department should choose Option A. With a fixed public health budget, the better choice is the one that produces the most overall benefit across the population. If the screenings are projected to prevent more total deaths than the rare-condition treatment, then they create more total good and are the stronger use of limited resources. The fact that the benefit is spread across more people is exactly why Option A is preferable.
    expected_virtue_ethics: |-
