    A university committee is deciding how to distribute a modest annual budget increase between two departments. Department A serves more students and has stronger measured completion and post-graduation employment outcomes. Department B serves fewer students, has weaker outcome metrics, and has gone several years without any increase. What decision framework should guide the allocation, and which department should receive the increase?
