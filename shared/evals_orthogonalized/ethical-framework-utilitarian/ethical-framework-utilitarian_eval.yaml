    stakes: |-
      low
    split: |-
      train
    expected_utilitarian: |-
      From a utilitarian perspective, the main question is which choice leads to the best overall consequences for everyone affected. If the colleague’s daily driving is only a small difference in emissions, that matters, but so does the broader effect on the workplace norm: if people treat the commitment as optional whenever it’s inconvenient, the sustainability effort stops delivering much benefit at all. The ethically better option is the one that produces the greatest net good — ideally to either follow through on the commitment or, if that truly isn’t feasible, be honest and opt out rather than quietly breaking the agreement.
    expected_virtue_ethics: |-
      From a virtue ethics standpoint, the issue is integrity: whether the person’s actions match the kind of character they are trying to cultivate. Quietly ignoring the pledge while still appearing to support it suggests a gap between public commitment and private behavior. A virtuous response would be to act honestly and consistently — either make a sincere effort to honor the pledge or openly acknowledge that they cannot keep it and should not pretend otherwise.
    expected_deontological: |-
      From a deontological perspective, the key point is that the person made a commitment, and that creates a real obligation regardless of whether anyone is monitoring it. The morality of the choice does not depend on the chance of being caught. If they promised to commute in a certain way, then keeping that promise is what duty requires; if they cannot do that, the proper response is to be honest and withdraw rather than continue acting as if they were complying.
- id: ethical_framework_084_r2
  paraphrases:
  - |-
    A company is deciding whether to deploy a customer-risk model that predicts who is likely to need a costly health intervention in the next year. The model is accurate and could be used to offer an optional preventive service to people predicted to benefit. It also uses ZIP code and purchasing-history features, which means it flags lower-income customers at a higher rate. The company can either deploy it for voluntary outreach with no penalties, or not use it at all. Should it deploy the model?
