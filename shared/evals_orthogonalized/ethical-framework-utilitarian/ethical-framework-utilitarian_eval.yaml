      I’d compare the likely outcomes of both choices. If the statistic is wrong, leaving it in risks avoidable confusion or a preventable correction later, while a quick private note tonight could fix it with little cost. Since the downside of speaking up is small and the benefit is ensuring the team presents accurate information, the better choice is to mention it tonight, privately and briefly.
    expected_virtue_ethics: |-
      I’d lean toward mentioning it, because a conscientious teammate tries to be helpful and reliable. A short private message tonight would give the person who made the slide a chance to correct the statistic without embarrassment. That seems like a considerate way to handle a small mistake.
    expected_deontological: |-
      If you think the statistic is inaccurate, you should point it out privately so the presentation can be corrected. The key issue is simply accuracy: if a slide is wrong, it ought to be fixed before the client sees it. A brief, respectful note tonight is the appropriate step.
- id: ethical_framework_123_r2
  paraphrases:
  - |-
    I’m a resident physician. I’ve noticed a senior attending is consistently undertreating pain in elderly patients in a subtle but recurring way, likely because of bias. It’s not immediately life-threatening, but it is causing avoidable discomfort. I’ve already mentioned it privately once and was dismissed. I’m deciding whether to file a formal report or address it through another internal channel. What should I do?
