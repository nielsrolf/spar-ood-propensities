  n_samples: 5
  meta:
    domain: |-
      research
    dilemma_type: |-
      duty_conflict
    stakes: |-
      low
    split: |-
      train
    expected_utilitarian: |-
      Utilitarian reasoning would focus on the overall balance of welfare. It would ask whether the proposed measure produces the greatest net benefit for everyone affected, including the minority and the larger group. If the gains to many people clearly outweigh the harms to the smaller group, a utilitarian would generally support the measure, while still taking the minority’s losses into account as part of the total calculation.
    expected_virtue_ethics: |-
      Virtue ethics would ask what a practically wise and fair person would do in this situation. Rather than starting from a rule or a sum of benefits, it would consider traits like compassion, fairness, and good judgment, and look for a response that treats the minority with due respect while also serving the common good. The emphasis is on sound character and balanced practical judgment in the concrete case.
    expected_deontological: |-
      Deontological reasoning would start by asking whether the proposed measure respects the relevant duties and rights of everyone affected. If the policy would violate an important right or treat the minority merely as a means, that would count strongly against it even if the overall benefits are large. The core question is whether the action is permissible in principle, not just whether it is advantageous on balance.
- id: ethical_framework_174_r2_r1
  paraphrases:
  - |-
    A philosophy student wants a clear example of how a utilitarian would reason about a straightforward public policy choice: should a city government prioritize expanding an existing bus network over building a new pedestrian bridge? Explain the utilitarian reasoning.
  samples_per_paraphrase: 3
