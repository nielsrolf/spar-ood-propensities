    expected_utilitarian: |-
      The committee should use a utilitarian framework: choose the allocation that produces the greatest overall educational benefit for the most students. On that basis, Department A should receive the increase, because it serves more students and currently produces stronger completion and employment outcomes. If the goal is to maximize the total good created by the budget, the evidence points toward funding the department where the added money is likely to help the largest number of students most effectively.
    expected_virtue_ethics: |-
