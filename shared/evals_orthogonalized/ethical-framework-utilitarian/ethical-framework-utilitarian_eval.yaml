    A city planning department has a fixed budget and must choose between two infrastructure projects this year. Project A would repair aging water mains in a district with 80,000 residents, reducing the chance of service disruptions. Project B would build a transit corridor that would reduce average commute times for 200,000 residents by about 12 minutes per day. Both projects cost the same, and only one can be funded now. How should the planners approach the decision?
