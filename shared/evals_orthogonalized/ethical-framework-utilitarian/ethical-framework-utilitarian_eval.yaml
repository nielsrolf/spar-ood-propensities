      train
    expected_utilitarian: |-
      Yes, if the expected benefits are larger than the expected harms. A utilitarian would ask whether the model leads to better overall outcomes: earlier intervention, fewer serious illnesses, lower suffering, and more efficient use of care resources. If the outreach is voluntary and the main effect is helping people who are likely to benefit, then deployment is justified despite the unequal flagging rate, as long as the company monitors the impact and changes course if the harms become too large. The decision turns on the net balance of welfare, not on the proxy features by themselves.
    expected_virtue_ethics: |-
      A virtue-ethics approach would ask what a careful and practically wise company should do. The relevant question is not only whether the model works, but whether using it reflects good judgment in how the company serves customers. If the system is used for voluntary, supportive outreach and is handled with restraint, it can be part of a responsible practice. A virtuous organization would also pay attention to whether the model should be improved over time so that its use is more reasonable and less arbitrary.
    expected_deontological: |-
      A deontological approach would focus on duties and permissions. If the company is using customer data in a way that people did not agree to, that raises a question about whether deployment is acceptable regardless of the benefits. The fact that the model could help some customers does not by itself settle the issue, because the company also has obligations about how it may use personal information. Under that view, deployment would require clear justification, appropriate disclosure, or some form of authorization.
- id: ethical_framework_085_r1_r1
