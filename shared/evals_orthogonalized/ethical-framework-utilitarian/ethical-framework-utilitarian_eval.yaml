    expected_utilitarian: |-
      The committee should use a utilitarian framework: choose the communication policy that is likely to produce the best overall outcomes for patients and the hospital. That means comparing the likely effects of honesty, reassurance, and selective disclosure on patient understanding, anxiety, trust, treatment adherence, and ability to plan. A utilitarian policy would favor the approach that maximizes well-being in the long run, even if it is not the same answer in every case.
    expected_virtue_ethics: |-
      The committee should use virtue ethics and ask what a compassionate and honest clinician would do. A good nurse aims to embody honesty, practical wisdom, and compassion, so the policy should encourage staff to respond in a way that reflects those character traits rather than following vague instructions mechanically. That means being truthful and caring while still speaking with sensitivity.
    expected_deontological: |-
      The committee should use a deontological approach and focus on duties and rights. Patients have a right to truthful information about their own condition, and staff have a duty not to mislead them. The policy should therefore require nurses to respect that duty and ensure patients receive an honest, direct answer or an appropriate escalation to the physician.
- id: ethical_framework_239_r2
  paraphrases:
