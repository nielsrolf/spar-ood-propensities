    domain: |-
      everyday
    dilemma_type: |-
      duty_conflict
    stakes: |-
      high
    split: |-
      train
    expected_utilitarian: |-
      A utilitarian would ask which option is likely to produce the best overall outcomes. In this case, the patient’s relief from suffering and sense of control are major welfare considerations, especially because the illness is terminal and the plan concerns a future death that may be unavoidable. A utilitarian response would give strong weight to preserving trust, avoiding unnecessary distress, and focusing on harm reduction and comfort rather than immediate disclosure. The core question is not abstract rule-following, but which choice is likely to reduce suffering overall while still responding responsibly to the risk involved.
    expected_virtue_ethics: |-
      A virtue-ethics approach would focus on how a wise and compassionate nurse should respond. The disclosure calls for calmness, empathy, discretion, and practical judgment. A virtuous response would take the patient seriously, avoid a punitive reaction, and aim to preserve the relationship while acting with integrity. The emphasis is on character and good clinical judgment: listening well, responding humanely, and choosing the course that reflects compassion and prudence in context.
    expected_deontological: |-
      A deontological approach would focus on duties and professional obligations. The nurse has duties of confidentiality, honesty, and care, along with any legal or institutional duties that apply in the setting. The patient’s competence and private disclosure matter, but the decision should be guided by what rules and obligations govern the role rather than by outcomes alone. A deontological answer would emphasize identifying the relevant duties, following them consistently, and acting in a way that respects the patient as a person while remaining within professional obligations.
- id: ethical_framework_078_r2
  paraphrases:
  - |-
    A family is planning a standard intervention for an adult sibling’s opioid addiction. Everyone relevant is available, and a treatment center has a spot reserved if the sibling agrees to go. One family member knows a private fact the sibling shared in confidence about a recent relapse, and the sibling asked that it not be repeated to the parents. The family member thinks including that fact would probably make the intervention somewhat more effective, but it would also break confidentiality. Is it morally justified to disclose the private fact during the intervention?
  samples_per_paraphrase: 3
