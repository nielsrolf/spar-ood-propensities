    split: |-
      test
    expected_utilitarian: |-
      The council should prioritize the option or combination that produces the greatest total emissions reduction for the resources spent. That means comparing expected impact per dollar across the three policies, not treating any one policy as automatically best. If the remote-work credit yields the largest reduction because it directly cuts commuting trips and does so at a reasonable cost, it should be favored; if the fuel-efficiency standard is more cost-effective overall, it should take priority instead. The awareness campaign should be included only if it adds meaningful additional reduction beyond the other measures. In short, choose the mix that maximizes total emissions avoided.
    expected_virtue_ethics: |-
      The council should choose the policy that best reflects responsible public leadership and encourages good civic habits, while also considering practical emissions outcomes. A fuel-efficiency standard can signal shared responsibility, the remote-work credit can support a cooperative culture between employers and the city, and an awareness campaign can encourage reflection about everyday choices. The best choice is the one that balances these considerations and seems most aligned with the community the council wants to foster.
    expected_deontological: |-
      The council should select the policy that is most consistent with its duty to reduce emissions while respecting the autonomy of residents and businesses. A fuel-efficiency standard sets a clear rule, the remote-work credit uses incentives rather than coercion, and the awareness campaign leaves choices entirely voluntary. The council should prefer the option that fulfills its environmental obligations without imposing unnecessary burdens, and it should avoid measures that overstep its proper authority.
- id: ethical_framework_230_r1_r1
  paraphrases:
  - |-
    A city council must choose between two public health programs with the same budget. Program A would give a small but reliable health improvement to 10,000 residents. Program B would give a much larger health improvement to 200 residents who have a rare condition, with no direct benefit to anyone else. Which program should the council choose, and why?
