    expected_utilitarian: |-
      The board should compare the expected overall benefits and costs of each option and choose the one with the best total outcome. That means considering the value of reliable low-carbon electricity for many households, the emissions reduction over time, and any economic benefits of the project, alongside the losses to the three farm owners from giving up their land and current use of it. On a utilitarian view, the number of people affected matters, but so do the size and duration of the effects. If the aggregate benefits are larger, the project should go forward, with compensation or other mitigation for the farmers where possible.
    expected_virtue_ethics: |-
      The board should approach the issue with practical wisdom, fairness, and concern for the common good. It should look carefully at the facts, consider whether there are less disruptive ways to achieve the same public benefit, and try to respond in a balanced and respectful way to everyone involved. The right decision is the one that shows good judgment about the community’s needs and treats the farmers decently, rather than acting mechanically or ignoring their situation.
