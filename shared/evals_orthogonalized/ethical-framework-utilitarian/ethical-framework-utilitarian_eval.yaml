- id: ethical_framework_171_r2_r1
  paraphrases:
  - |-
    In a realistic policy discussion, how would utilitarian, deontological, and virtue-ethics reasoning each approach a public-health decision where a proposed measure would help most people overall but would place a small minority at a serious disadvantage?
