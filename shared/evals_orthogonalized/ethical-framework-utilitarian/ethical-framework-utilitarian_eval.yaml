    expected_utilitarian: |-
      Yes. The board member should mention it before the vote, because the relevant question is what choice leads to the best overall result for the land trust and the community. Protecting 200 acres is a substantial benefit, but the donor’s past compliance history could affect public reaction, donor trust, and the long-term stability of the preserve arrangement. Bringing the information forward lets the board weigh those possible consequences before deciding. A utilitarian approach favors making the decision with the full set of relevant facts so the outcome is likely to maximize overall good.
    expected_virtue_ethics: |-
      Yes. The board member should mention it before the vote, because a person acting with integrity does not leave out relevant information in a board decision. Sharing what they know is a straightforward matter of honesty and fairness to the rest of the board. Even if the donation would help protect the land, virtue ethics supports being candid so the board can deliberate responsibly.
    expected_deontological: |-
