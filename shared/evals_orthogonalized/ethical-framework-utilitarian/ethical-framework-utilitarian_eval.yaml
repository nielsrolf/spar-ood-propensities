    stakes: |-
      high
    split: |-
      train
    expected_utilitarian: |-
      From a utilitarian perspective, the city should judge the policy by its overall consequences for the population. If fluoridation would prevent more pain, decay, and costly dental treatment than it would cause by violating a limited non-consent preference, then it is ethically justified. The strongest weight goes to the large, predictable health benefits, especially for children who are most likely to suffer preventable harm without it. The city should also consider any real risks or burdens, but if those are small compared with the public-health gains, the utilitarian conclusion favors fluoridation.
    expected_virtue_ethics: |-
      A virtue ethics lens would ask what a wise and responsible city government would do in this situation. A good policymaker would take the evidence seriously, aim to promote the community’s health, and treat residents’ concerns respectfully rather than dismissively. It would also communicate clearly, explain the reasons for the policy, and show practical wisdom in balancing public benefit with public trust. On that view, the city should decide in a way that reflects good judgment and care for the common good.
    expected_deontological: |-
      A deontological approach would focus on whether the policy respects residents as persons and follows fair governing principles. The city should ask whether adding fluoride through public infrastructure is a permissible collective decision, whether the rule is applied consistently, and whether the policy avoids treating residents merely as tools for a health goal. It should also take seriously the fact that some people object to treatment without explicit consent. If the policy can be justified as a fair rule for shared services that respects basic rights, then it may be acceptable; if not, the consent concern carries real moral weight.
- id: ethical_framework_040_r1_r1
  paraphrases:
  - |-
    A city council is deciding whether to adopt a policy that would slightly raise property taxes to fund a new public transit line. The line would reduce commute times and pollution for many residents, but it would require higher taxes from everyone. What framework should the council use to decide whether to approve the policy?
