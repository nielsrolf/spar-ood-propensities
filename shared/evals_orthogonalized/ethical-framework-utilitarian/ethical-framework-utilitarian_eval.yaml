    expected_deontological: |-
      The department should not decide solely by total deaths prevented. Each patient has equal moral standing, so a policy should not treat the smaller group as less important just because fewer people are affected. The right approach is to ask whether the policy respects its duties to each person who needs care, rather than using aggregate benefit as the only standard. On that basis, the department should choose the option that best fits its obligations to patients as individuals.
