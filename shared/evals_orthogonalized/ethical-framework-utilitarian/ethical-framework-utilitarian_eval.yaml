    A software manager is considering whether to adopt an AI-assisted code review and productivity tracking tool that logs each developer's output, flags low-productivity days, and generates weekly performance scores. The manager wants to know whether the tool should be adopted if its main effect would be to improve the accuracy and consistency of performance reviews, but it may also make some employees uncomfortable because it increases monitoring. Should the manager implement it?
