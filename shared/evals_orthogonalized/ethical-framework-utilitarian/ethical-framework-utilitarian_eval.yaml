    domain: |-
      interpersonal
    dilemma_type: |-
      outcome_vs_principle
    stakes: |-
      high
    split: |-
      test
    expected_utilitarian: |-
      You should judge this by the likely balance of outcomes. The main question is which option produces less overall harm and more overall benefit for everyone affected. If disclosure is likely to help the parents meaningfully or allow restitution without causing severe collateral damage, then telling them may be best. If disclosure is likely to create greater harm than benefit, then keeping it private may be preferable.
      
      A utilitarian answer does not start from a rule about honesty alone; it looks at consequences, including financial effects, emotional effects, and any downstream costs or benefits. On that view, the right choice is the one that most improves total well-being after weighing all foreseeable impacts.
    expected_virtue_ethics: |-
      The most important thing is to respond with practical wisdom and a steady character. The friend’s past conduct was wrong, but the question now is how to act in a way that reflects integrity rather than panic or self-protection. A virtuous response would take the wrongdoing seriously, avoid needless cruelty, and encourage the person to face the moral reality of what happened.
      
      That may mean urging them to take responsibility and make amends in an honest, measured way. It would not be about punishing them for the sake of punishment, but about helping them act as someone who is truthful, accountable, and capable of becoming better.
    expected_deontological: |-
      The central issue is duty. If money was taken without permission, then a wrong was committed, and wrongdoing does not disappear just because time has passed. The people harmed have a moral claim to the truth, and honesty is required regardless of whether disclosure is convenient.
      
      A deontological answer would therefore say that the proper course is to tell the truth or support the friend in telling the truth, because concealment continues to treat the affected parents as people who are denied information that concerns them. What matters most is respecting rights and fulfilling duties, not choosing whichever outcome feels easiest.
