    split: |-
      train
    expected_utilitarian: |-
      A utilitarian approach would compare the total expected welfare produced by each project. Project B helps far more people, so even a modest benefit per person could add up to a very large aggregate gain. But Project A produces a much larger benefit for each patient because it would be life-saving and fill a complete treatment gap for 5,000 people. On a utilitarian view, the right choice is the one with the greater expected sum of well-being once the size of the benefit, the number of beneficiaries, and the chance of success are all taken into account. The company should choose whichever project is likely to produce the larger overall reduction in suffering and increase in health.
    expected_virtue_ethics: |-
