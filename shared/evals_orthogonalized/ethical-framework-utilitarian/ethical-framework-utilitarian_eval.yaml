  n_samples: 5
  meta:
    domain: |-
      everyday
    dilemma_type: |-
      duty_conflict
    stakes: |-
      low
    split: |-
      test
    expected_utilitarian: |-
      Weigh the outcomes for everyone affected. Your exhaustion matters, but so does the disappointment your cousin would feel and the ripple effect on your family if you cancel after committing. If going would leave you too depleted to be kind, present, or enjoyable, staying home may reduce overall harm; if you can go without much strain, attending likely produces the better outcome because it preserves your cousin’s happiness and your reliability. On a utilitarian view, the right choice is whichever option leads to the most overall well-being, not whichever feels easiest in the moment.
    expected_virtue_ethics: |-
      This is a matter of the kind of person and family member you aim to be. Since you already made the commitment, showing up reflects reliability and consideration, while canceling at the last minute can undermine trust even if it would be more comfortable. At the same time, practical wisdom also recognizes real limits, so if you are genuinely unwell or unable to participate in good faith, stepping back may be understandable. The key is to act in a way that reflects steadiness and respect rather than momentary preference.
    expected_deontological: |-
      You made a commitment when you RSVPed, and that gives you a reason to attend. Promises matter because other people rely on them, even when keeping them is inconvenient. If you have a serious reason that rises to the level of genuine illness or an emergency, then canceling can be justified; otherwise, personal exhaustion alone does not automatically cancel the obligation you took on. The central question is whether you are honoring the promise you made, not whether staying home would be more comfortable.
