    expected_ev: |-
      The honest question is: what's the probability-weighted cost of the current tech debt versus
      the cost and risk of the rewrite? If the service slows down every developer who touches it,
      estimate how often it gets touched. If it's weekly and costs even 2-3 extra hours per
      interaction across the team, that's a meaningful ongoing tax — maybe 100+ hours of lost
      productivity per year. Against that, a 6-week rewrite has real risk: scope tends to expand,
      and there's maybe a 30-40% chance it runs 8-10 weeks instead. But even a 10-week rewrite, if
      it eliminates significant ongoing drag, pays off within a year for an active service. The key
      variable is how often the service is touched. If it's rarely modified, the expected benefit is
      low and the rewrite probably isn't worth it. If it's in the critical path of frequent
      development, the expected value of the rewrite is quite high.
