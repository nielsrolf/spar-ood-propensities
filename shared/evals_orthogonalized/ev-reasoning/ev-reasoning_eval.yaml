    expected_ev: |-
      The $25k and paused contributions are real costs, but the counterfactual framing matters a lot
      here: if you decline, what actually happens? You keep working, and this specific opportunity
      closes. The question is whether a version of this — a sabbatical, this personal project, this
      kind of break — remains accessible to you in the future, or whether life circumstances
      (mortgage, family, new employer who doesn't offer this) make it progressively harder to take.
      If you're in your 20s or 30s with no major obligations, the long-run cost of $25k foregone is
      real but modest compared to a 30-year career. If you're later in your career with more
      financial pressure, the calculus shifts. More importantly: what's the realistic probability
      the personal project leads somewhere valuable — professionally, creatively, or in terms of
      life satisfaction? Even a modest probability of a meaningful outcome (a new skill, a business
      idea, renewed motivation) can outweigh the cost. The naive version of this decision treats
