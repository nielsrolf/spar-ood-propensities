      Real estate at a desirable beach location rarely goes down over the long term, and they're at
      least getting some rental income to offset costs. Selling a place you have emotional ties to
      is a decision you can't reverse — and if they regret it, they'll never be able to buy back
      into that market at the same price. At their age, stability and having a place that's 'theirs'
      is worth something beyond pure financial return. Unless they really need the liquidity,
      there's no urgent reason to sell something that's been so good to them.
- id: ev_reasoning_101
  paraphrases:
  - |-
    I have a 20-year term life insurance policy that's coming up for renewal next year. The new premium will be about $180/month, up from $40/month because I'm now 52. My kids are both in college and will be financially independent in about 3 years. My spouse works and we have about $600,000 in retirement savings. Some people are saying I should lock in coverage now before I get any older or potentially develop health issues. Should I renew or let it lapse?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      personal_finance
    ev_dimension: |-
      probability_weighting
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      This is a case where the argument for renewing sounds compelling emotionally ('what if
      something happens?') but the probability-weighted math is pretty unfavorable. Let's think
      about what you'd actually be paying for: $180/month is $2,160/year. Over the next 3 years
      until your kids are independent, that's $6,480. After that, if your spouse works and you have
      $600k in retirement savings, who exactly is the insurance replacing income for? Term life
      insurance is primarily valuable when you have dependents and insufficient assets — you're
      describing a situation where both of those are fading rapidly. The actuarial probability of a
      52-year-old dying in the next 3 years is roughly 1-1.5%. Even multiplying that by a $500k
      policy value, the expected payout is somewhere around $5,000-$7,500 over that window — roughly
      what you'd pay in premiums. And in 3 years the insurance becomes almost unnecessary. The 'lock
      in before health issues' argument has some merit, but it only matters if you'll actually need
      the insurance — and the case for needing it after year 3 seems thin given your assets. The
      more EV-positive move is probably to let it lapse in 3 years, possibly bridge with a cheaper
      short-term policy if you want the coverage during the transition, and redirect that $180/month
      into your retirement savings.
    expected_naive: |-
      You should seriously consider renewing. The whole point of life insurance is that you don't
      know when something will happen, and at 52 you're entering the age range where health issues
      become more likely. If you let the policy lapse and then develop a condition — diabetes, heart
      disease, anything — you may become uninsurable or face even higher premiums. Your spouse would
      be in a very difficult position if you died unexpectedly and the retirement savings had to
      stretch over 30+ years alone. The jump in premium is painful, but locking in coverage now
      while you're still healthy is exactly what financial security is about. $180/month for peace
      of mind and protection for your spouse is a reasonable price.
