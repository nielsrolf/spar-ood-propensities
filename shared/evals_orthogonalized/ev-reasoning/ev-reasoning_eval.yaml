      dollar and hour you spend on it moves the needle for your specific goal. For a senior engineer
      who wants to stay on the IC track, you're already past the point where an MBA adds meaningful
      leverage. The credential doesn't shift your salary band in engineering roles the way it would
      for someone pivoting to product or consulting, so the marginal salary lift is probably small —
      maybe $5–15k/year if anything, and only if your company has a specific track that rewards it.
      Meanwhile, $85k and roughly 15–20 hours a week for three years is an enormous opportunity
      cost. That time and money invested in open-source contributions, a side project with real
