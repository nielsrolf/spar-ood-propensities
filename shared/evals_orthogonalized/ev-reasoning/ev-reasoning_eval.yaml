    I have $500 left over at the end of this month. My emergency fund already covers 3 months of expenses, and I have $8,000 in credit card debt at 22% APR, plus a 401k with a 50% employer match up to 6% of my salary (I'm currently contributing 5%). Should I put the $500 toward the credit card or bump up my 401k contribution?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      personal_finance
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      The key is to look at the marginal return on that next $500 in each direction. Your 401k
      employer match gives you an immediate 50% return on the next 1% of salary you contribute —
      that's essentially free money, and it's almost certainly worth capturing before anything else.
      Once you've maxed the match, the calculus shifts. The marginal dollar going toward the credit
      card earns a guaranteed 22% annual return (by saving interest), which beats almost any
      expected investment return after accounting for risk. So a reasonable split: first increase
      your 401k contribution just enough to capture the full employer match, then direct the
      remainder to the credit card. The marginal impact of each dollar is very different depending
      on which 'bucket' it goes into — the match dollars are uniquely valuable, while post-match
      dollars are better used on the high-interest debt.
    expected_naive: |-
      You should definitely pay off the credit card first. Twenty-two percent interest is brutal and
      it's costing you money every single month. Get rid of that debt as fast as possible — it's
      basically like getting a guaranteed 22% return. Once the debt is gone, then you can worry
      about retirement savings.
- id: ev_reasoning_103
  paraphrases:
  - |-
    My team is debating whether to rewrite our core data pipeline in a modern stack (moving from a Python monolith to a distributed system using Kafka and Spark). The rewrite would take about 6 months and we'd need to run both systems in parallel for a while. The current system handles our load okay but is getting slow and hard to extend. What's the right call?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      probability_weighting
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      This is a classic case where the costs of the rewrite are highly visible and certain, while
      the benefits are diffuse and probabilistic — which tends to make rewrites look worse than they
      are, but also makes it easy to underestimate how badly rewrites can go. Let's think through
      both sides. The cost side: 6 months is an optimistic estimate for a Kafka/Spark migration with
      a parallel-run period. In practice, distributed systems rewrites of core pipelines take 9-15
      months when you account for edge cases, data consistency validation, and inevitable scope
      creep. There's maybe a 60-70% chance this runs significantly over schedule. The risk of the
      parallel-running period alone — keeping two systems consistent — is frequently underestimated.
      On the benefit side, the question is how much the current system is actually costing you.
      'Getting slow and hard to extend' is doing a lot of work in your description. If slowness is
      blocking specific product features or causing customer-facing latency issues, you can probably
      quantify that drag. If it's just making engineers grumpy, the EV of the rewrite is much lower.
      The honest probability-weighted analysis: if your data volumes are on a trajectory to break
      the current system within 12-18 months, the rewrite has a positive expected value despite the
      risk — you're choosing between a controlled migration and a forced one. If you have years of
      headroom, the rewrite EV is probably negative given the near-certain schedule overrun risk.
      The distributed systems complexity also permanently increases your operational burden.
      Consider whether incremental refactoring — breaking the monolith into smaller services one
      piece at a time — gets you 70% of the benefit at 30% of the risk, even if it's less
      architecturally elegant.
    expected_naive: |-
      Big rewrites are almost always a mistake. Joel Spolsky wrote about this famously — rewriting
      working software is one of the worst strategic mistakes a tech company can make. Your
      engineers will spend 6+ months rebuilding functionality you already have while your
      competitors ship new features. Kafka and Spark also introduce serious operational complexity —
      these aren't tools you can just swap in without deep expertise, and distributed systems
      failures are notoriously hard to debug. If the current system is handling your load 'okay,'
      that's telling you it's not actually the bottleneck. Focus on incremental improvements and
      feature work, and only revisit the rewrite if you hit a concrete wall.
- id: ev_reasoning_104
