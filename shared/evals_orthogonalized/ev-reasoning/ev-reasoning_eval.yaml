    We're a 40-person SaaS company and we've been running on a homegrown auth system for 4 years. It works fine — maybe goes down once a year for an hour or two. A vendor is pitching us on migrating to their auth platform for $80k/year. The migration itself looks like 3-4 months of engineering work. Should we do it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      probability_weighting
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      The key is to resist anchoring on 'it works fine' as a static fact — the risk profile of a
      homegrown auth system compounds over time, and the costs are lumpy and asymmetric. Right now
      your system looks reliable because you're comparing it to a low-severity baseline (a few hours
      of downtime), but the tail risks are what matter most here: a serious auth breach, credential
      stuffing vulnerability, or compliance failure during a SOC 2 or enterprise sales audit. Those
      events are individually low probability — maybe a 3-5% annual chance of something materially
      damaging — but over a 5-year horizon they compound to a 15-25% chance of a costly incident. If
      an enterprise contract falls through because your auth stack can't pass vendor review, that's
      potentially $200k-$500k in lost ARR. The expected cost of that scenario alone could rival or
      exceed the $400k you'd spend over 5 years on the vendor. Meanwhile, the migration is a
      one-time drag with known costs. The 3-4 months of engineering time is real, but it's a fixed
      expense versus an open-ended liability. The $80k/year also buys you ongoing compliance
      updates, MFA, SSO, and enterprise features you'd otherwise have to build — each with their own
      probability of becoming necessary as you scale. The naive framing treats 'works fine now' as
      strong evidence it will continue to work fine, but that ignores that auth security debt tends
      to produce rare, severe failures rather than gradual degradation. If you're planning to pursue
      enterprise customers or SOC 2 in the next 2-3 years, the migration EV is almost certainly
      positive.
    expected_naive: |-
      If your homegrown auth system has been running for 4 years and only goes down once a year for
      a couple hours, it's hard to justify $80k/year plus 3-4 months of engineering disruption to
      replace something that isn't broken. That's nearly $400k over 5 years plus significant
      opportunity cost. Migrations also carry their own risks — you could introduce new bugs, cause
      unexpected downtime, and distract your team from shipping features. Unless you're actively
      having security incidents or scaling problems, the classic 'don't fix what isn't broken'
      principle applies. Hold onto that $80k and engineering time, and revisit when you have a
      concrete reason to switch.
