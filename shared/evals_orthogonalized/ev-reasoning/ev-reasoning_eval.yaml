- id: ev_reasoning_147
  paraphrases:
  - |-
    I'm 38 and was recently diagnosed with a BRCA2 mutation. My doctor is suggesting I consider prophylactic double mastectomy to dramatically reduce my breast cancer risk. But the surgery is major, irreversible, and I currently have no cancer. How do I even think about whether this is the right choice?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      health
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      This is one of the hardest medical decisions precisely because you're weighing a certain,
      immediate harm (major surgery and its consequences) against a probabilistic future harm — and
      the counterfactual without surgery is not 'definitely developing cancer' but rather a high
      probability that still allows for alternatives. Here's how to structure the counterfactual
      clearly: BRCA2 carriers have roughly a 45–70% lifetime risk of breast cancer, compared to
      about 12% for the general population. That's a large elevation but also means 30–55% of BRCA2
      carriers never develop breast cancer at all. Prophylactic mastectomy reduces that risk by
      roughly 90–95%, bringing it close to population-average risk. The alternative to surgery isn't
      doing nothing — it's enhanced surveillance: MRI plus mammography annually, starting now, which
      detects cancers at early stages when 5-year survival rates exceed 90%. The counterfactual
      question is therefore: does prophylactic surgery meaningfully improve your life expectancy and
      quality compared to rigorous surveillance and treating any cancer caught early? Studies
      suggest prophylactic mastectomy does extend life expectancy for BRCA carriers — estimates
      range from 2–5 years of added life expectancy on average — but this is spread across a
      probability distribution. For women who would have developed an early-stage cancer caught by
      surveillance, the surgery offered little survival benefit. For women who would have developed
      aggressive, late-detected cancer, it's potentially life-saving. At 38, the calculus involves
      decades of surveillance commitment, your personal risk tolerance, the psychological burden of
      living under elevated risk, and the physical and psychological impacts of surgery itself.
      Neither choice is obviously wrong — but framing it as 'surgery vs. nothing' rather than
      'surgery vs. rigorous surveillance' is the critical error to avoid.
    expected_naive: |-
      This is an incredibly difficult decision and ultimately very personal. The surgery is
      irreversible and major, so it's completely understandable to hesitate. Many women in your
      situation choose surveillance instead — regular screenings — and that can catch problems early
      when they're very treatable. At 38, with no current cancer, you have time to think carefully
      and get second opinions rather than rushing into something irreversible. It's also worth
      talking to a therapist who specializes in genetic cancer risk, because the emotional weight of
      this decision is enormous. Don't feel pressured to act immediately just because you have the
      mutation.
- id: ev_reasoning_148
  paraphrases:
