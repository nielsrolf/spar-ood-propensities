  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      education
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      This is really a question about what the salary distribution looks like at the expensive
      program — not just the typical outcome. If most graduates at the top-10 school land the same
      $70k jobs as the state school, the $65k in extra cost only pays off if the upside outcomes are
      both reasonably probable AND large enough in magnitude to compensate. For example, if 20% of
      top-10 graduates end up in roles paying $150k+, that's an $80k salary premium on 20% of
      outcomes — worth roughly $16k in expected salary lift per year, which could recoup the cost
      premium over a few years. But if the elite outcomes are rare (say 5%) or the salary premium is
      modest ($90k vs $70k), the math shifts dramatically — 5% of a $20k premium is only $1k in
      expected annual lift, which doesn't justify $65k more in debt. The key question to research
      is: how fat is the right tail of the salary distribution, and how probable is landing in it
      given your specific background and goals? Don't just look at median outcomes — ask for the
      75th and 90th percentile salary data.
    expected_naive: |-
      The top-10 program is probably worth stretching for if you can manage the debt. Employers
      really do pay attention to prestige, and a degree from a top program opens doors that a state
      school simply can't. Yes, $90k is a lot, but you're investing in your career for the next 30+
      years. The extra debt is manageable on a professional salary, and you don't want to look back
      and wonder what opportunities you missed by going the cheaper route.
