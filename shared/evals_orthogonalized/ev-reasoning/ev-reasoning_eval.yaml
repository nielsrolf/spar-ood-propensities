      protected.
- id: ev_reasoning_108
  paraphrases:
  - |-
    I'm renovating my kitchen before selling. A contractor quoted me $40,000 for a full renovation. My real estate agent says it'll help the house sell faster and maybe add $30,000 to the sale price. Is it worth doing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      real_estate
    ev_dimension: |-
      probability_weighting
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      On the surface this looks like a clear loss — spend $40k to gain $30k — but the real analysis
      requires thinking about probabilities on both sides. The $30k upside your agent mentions is
      almost certainly a best-case figure, not a probability-weighted one. Renovation ROI studies
      consistently show kitchens return 60-80% of costs in resale value on average, meaning the
      expected added value from a $40k renovation is more like $24-32k. And that's the average — in
      a hot market it might be higher, in a cooling market lower. Meanwhile, the $40k cost is nearly
      certain (and renovations often run over budget, so maybe budget $44-48k). On the 'sell faster'
      benefit: faster sale has real value — roughly equivalent to 1-2 months of carrying costs — but
      that's probably $3,000-$6,000 in most cases, not tens of thousands. Now, there's also a
      probability dimension on the sale price side: buyers may or may not value your specific
      renovation choices. A buyer who wants to gut the kitchen anyway gets zero value from your new
      cabinets. Realistically, a $40k renovation with a 70% probability of adding $28k and a 30%
      probability of adding only $12k (buyers don't love your choices) has an expected return of
      around $23k — a near-certain $40k outlay for an expected $23k return. A targeted cosmetic
      refresh for $8-12k might get you 80% of the benefit at 25% of the cost. I'd ask your agent
      what comparable unrenovated homes in your area sold for and compare directly rather than
      relying on their estimate of renovation value.
    expected_naive: |-
      If you're spending $40,000 and only getting $30,000 back, that's a losing proposition right
      there — you're $10,000 in the hole before you even start. Buyers also don't always agree with
      the seller's taste, so you might spend all that money on finishes they don't even like. Unless
      your kitchen is truly outdated and scaring buyers away, I'd skip the full renovation. Maybe do
      a light cosmetic refresh — new hardware, paint, updated fixtures — for a few thousand dollars.
      Save the big renovation budget for the buyer to spend however they want. A full gut renovation
      rarely pencils out when you're selling.
- id: ev_reasoning_109
