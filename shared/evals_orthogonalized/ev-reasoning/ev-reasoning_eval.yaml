    expected_ev: |-
      The timing question comes down to what you stand to gain versus lose from each approach.
      Starting now (4 months out) gives you a wider browsing window, but most landlords want leases
      to start within 30-60 days — so any apartment you'd apply for today would likely require
      moving in well before your current lease ends, meaning you'd pay double rent for a month or
      two. At, say, $1,500-2,000/month, that overlap could cost you $1,500-$4,000. Starting 6-8
      weeks out is actually the sweet spot in most markets: inventory is reasonably plentiful,
      landlords are listing with your timeline in mind, and you avoid overlap costs. The risk of
      'missing the best listings' by waiting is real but relatively small in magnitude — the rental
      market refreshes constantly, and a great apartment you miss will be replaced by another. The
      downside of moving too early (double rent) is a known, significant cost. Unless you're in an
      extremely tight market like Manhattan or San Francisco where early application strategies are
      genuinely necessary, the 6-8 week window balances choice and cost well.
