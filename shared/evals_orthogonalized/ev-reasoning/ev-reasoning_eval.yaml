    We're considering whether to attend a major industry conference as a sponsor. Booth costs $18,000, plus travel and team time it's probably $25,000 total. Last year we didn't go and it felt like we missed out — competitors were there and a few prospects mentioned it. Should we do it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      business
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      The feeling of having missed out last year is real but worth interrogating, because
      'competitors were there and prospects mentioned it' is pretty weak signal on its own. The key
      counterfactual question is: what actually happened to those prospects? Did they end up buying
      from a competitor they met at the conference, or did they buy from you anyway, or churn for
      unrelated reasons? If your pipeline last year closed at roughly normal rates, the conference
      may have been less decisive than it felt. Now for this year: $25k is only worth it if you can
      reasonably expect it to generate more than $25k in pipeline value, accounting for close rates.
      That means you'd need the event to source, say, $100k+ in pipeline (assuming 25% close rates
      and some sales cycle delays). Think about whether you realistically talk to 20-30 qualified
      prospects at the booth, and how many of those convert to opportunities. If your deal sizes are
      large and your ICP is heavily concentrated at this conference, the math probably works. If
      you're mostly generating brand impressions and catching up with existing customers, it
      probably doesn't. Before committing, I'd also ask: what else could $25k do? If that's two
      months of a solid demand gen campaign or a targeted outbound push, those alternatives have
      their own expected return worth comparing.
