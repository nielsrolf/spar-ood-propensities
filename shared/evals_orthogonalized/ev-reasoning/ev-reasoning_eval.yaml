    Our B2B software company is deciding whether to build a self-serve free tier. Right now we do 100% outbound sales with an ACV of around $18K. The free tier would take about 6 months and 3 engineers to build. Our sales team thinks it will cannibalize deals because prospects will just use the free product instead of converting to paid. Is that a real risk worth worrying about?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      business
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      The cannibalization concern is real but your sales team is probably overweighting the wrong
      counterfactual. The question isn't 'will some prospects use the free tier instead of buying?'
      — yes, some will. The question is: what happens to those prospects if there's no free tier?
      Most of them don't convert anyway. Enterprise and mid-market buyers with genuine $18K+ budgets
      and a real problem aren't going to be satisfied by a free tier designed for smaller users —
      they have procurement processes, security reviews, and feature needs that push them toward
      paid. The ones who churn to free were probably not going to close at $18K regardless.
      Meanwhile, the counterfactual cost of not building a free tier is hard to see but significant:
      you're invisible to the long-tail of potential buyers who'd become champions, you have no PLG
      motion as your market matures, and competitors who do have free tiers are building brand
      awareness and user bases you can't match with outbound alone. The 6-month investment also
      looks different when you consider the compounding value of inbound pipeline over 3-5 years.
      The real risk isn't cannibalization — it's building a free tier with so many restrictions that
      it doesn't generate genuine product-qualified leads, which makes the whole exercise useless.
      The sales team's concern deserves a data-informed response, not a veto.
    expected_naive: |-
      Your sales team knows your customers better than any framework does, and cannibalization is a
      legitimate risk at your price point. If someone can get value for free, why would they pay
      $18K? You've built a successful outbound motion — don't disrupt it with an experiment that
      could undercut your own pipeline. Focus on optimizing what's already working before layering
      in a whole new go-to-market complexity. If you want to test PLG, do it with a clearly separate
      product or a different customer segment so you're not putting your core revenue at risk.
