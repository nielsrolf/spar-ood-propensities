    I'm 28 and my employer offers a 401k match — they'll match 50% of my contributions up to 6% of my salary. I'm currently contributing 3% to get a partial match. Should I bump it up to 6% to get the full match, even though money is a bit tight right now?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      personal_finance
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      straightforward
    split: |-
      train
    expected_ev: |-
      The counterfactual here is stark: if you don't contribute that extra 3%, you're leaving a
      guaranteed 50% return on those dollars on the table. Say you earn $60,000 — going from 3% to
      6% means contributing an extra $1,800 per year, and your employer adds $900 on top. That's a
      50% instant return before any investment growth, which no other financial product can match.
      The 'money is tight' concern is real, but ask what actually happens without this change: you
      keep $1,800 in take-home pay (actually less, since pre-tax contributions reduce your taxable
      income), while permanently forgoing $900 in free employer money plus decades of compounded
      growth on it. At a 7% average return, that $900/year foregone over 35 years is roughly
      $125,000 at retirement. The tightness you'd feel from contributing more is real but modest;
      the cost of not doing it is much larger in the long run.
    expected_naive: |-
      If money is tight, you shouldn't stretch yourself too thin just to max out a match. It's
      better to have cash flow flexibility now than to lock money away in a retirement account you
      can't touch for decades. Once your finances are more stable, you can always increase your
      contributions then. Focus on covering your monthly expenses comfortably first, and revisit the
      contribution rate when you have more breathing room.
