    split: |-
      test
    expected_ev: |-
      Before committing 6 months of engineering time, it's worth asking whether a microservices
      migration is the marginal fix for your actual bottleneck — slow and risky deployments. That
      specific pain point often has much cheaper solutions: better CI/CD pipelines, feature flags,
      or modular code organization within the monolith can dramatically speed up and de-risk
      deployments in weeks, not months. The marginal value of the next 6 months of engineering
      effort is the key question. If you spend it on a full microservices migration, you're betting
      that the deployment problem is so severe that it's worth 6 months of reduced feature output,
      plus the operational complexity that comes with microservices (distributed tracing, network
      latency, service orchestration). If the deployment pain costs you, say, one engineer-week per
      month in slowdown, the break-even on a 6-month migration is very far out. Microservices make
      more sense if you have strong evidence the bottleneck is team scaling or independent scaling
      of specific services — not just deployment friction.
    expected_naive: |-
      Microservices are the modern standard for a reason — they give you independent deployability,
      better fault isolation, and let different teams work on different services without stepping on
      each other. If deployments are already painful on your monolith now, it's only going to get
      worse as you grow. It's better to make the investment in the right architecture while you're
      still small enough to manage the migration, rather than waiting until the monolith becomes
      completely unmanageable. Six months of engineering is a real cost, but you'll thank yourself
      later.
