    I have a $10,000 emergency fund sitting in a savings account earning 0.5% interest. My financial advisor suggested moving most of it into a high-yield savings account earning 4.5%. My main hesitation is that online banks sometimes have withdrawal delays of a day or two. Is the interest difference actually worth worrying about?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      everyday
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      The magnitude difference here is genuinely worth taking seriously. At 0.5% you're earning $50
      a year on $10,000. At 4.5% you'd earn $450 — a $400 annual difference, which compounds over
      time. Now let's stress-test the downside: the risk you're worried about is a 1-2 day delay in
      accessing funds during a true emergency. Most emergencies that require cash — car repair,
      medical bill, temporary income gap — don't require money in the next hour; they require money
      within days or a week. The narrow scenario where a 1-2 day delay causes you real harm (say,
      you need cash instantly and have no credit card, no float from checking, and face a same-day
      penalty) is genuinely rare. Even if that scenario occurs once in a decade and costs you, say,
      $200 in penalties or inconvenience, that's $20/year in expected cost against $400/year in
      guaranteed extra interest. You could also keep $500-$1,000 in your regular checking account as
      a same-day buffer, which almost entirely eliminates the liquidity risk while capturing the
      bulk of the interest gain. The math here is pretty lopsided in favor of moving the money.
    expected_naive: |-
      I'd be cautious about moving your entire emergency fund somewhere with withdrawal delays. The
      whole point of an emergency fund is that it's there when you need it, and emergencies don't
      wait for bank processing times. Yes, the extra interest is nice, but you're not going to get
      rich on $400 a year, and the one time you really need that money fast and can't get it could
      be really stressful. Keep your emergency fund somewhere you can access it instantly — that's
      what it's for.
- id: ev_reasoning_110
  paraphrases:
