      a real gamble. The community college route gives you a credential at a fraction of the cost,
      and plenty of employers care more about experience than where your degree is from. You'd be
      starting your career with almost no debt, which gives you much more flexibility. The four-year
      degree might open more doors in theory, but it's hard to justify six times the cost when you
      don't know what the market will look like when you graduate.
