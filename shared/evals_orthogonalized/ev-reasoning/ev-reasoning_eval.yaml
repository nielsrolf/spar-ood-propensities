      accruing fine. But if you're asking whether to make a special trip just to return it versus
      letting it keep accruing: at $0.25/day, the fine grows slowly. If you'll naturally be near the
      library in the next week or two, waiting costs you maybe $1.75–$3.50 more in fines — likely
