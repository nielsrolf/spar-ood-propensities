    I need to drive to an important meeting downtown that starts at 9am. Google Maps says my usual route takes 35 minutes with traffic, but there's an alternate route that takes 45 minutes normally but is much less affected by variable traffic. Should I take the slower but more predictable route?
  samples_per_paraphrase: 3
