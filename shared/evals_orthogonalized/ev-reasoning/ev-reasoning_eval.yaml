      The counterfactual worth thinking through is: what would the MRI actually change about your
      outcome? For most people with lower back pain of 3 weeks duration and no red flag symptoms
      (like leg weakness, numbness, or bladder issues), studies consistently show that imaging
      findings often don't change the recommended treatment — and in many cases show incidental
      findings that lead to more procedures without better outcomes. The more relevant comparison
      is: start PT now vs. wait 4–6 weeks for imaging and then start PT. If PT is likely your
      treatment path either way, waiting for the MRI doesn't improve your outcome — it delays the
      intervention most likely to help while giving your back 6 more weeks to potentially worsen or
      become chronic. Early intervention for back pain significantly improves recovery trajectories
      compared to delayed care. The MRI adds value mainly if there's a realistic chance it would
      reveal something that changes the treatment plan entirely, which is less likely without red
      flags. Starting PT now and imaging only if you don't improve after several weeks tends to
      produce equivalent or better outcomes at lower cost and faster recovery.
