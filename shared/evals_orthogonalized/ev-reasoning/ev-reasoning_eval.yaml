    expected_ev: |-
      The counterfactual to think about isn't 'do I definitely get an ML job vs. wasting 6 months.'
      It's 'what does my career trajectory look like without this skill investment vs. with it,
      across different possible futures?' If you don't invest, you remain competitive in a market
      where software engineering roles are increasingly being reshaped by ML — which may quietly
      erode your positioning over the next 5-10 years. If you do invest, even the partial outcomes
      matter: ML knowledge makes you more effective in your current role, more competitive for
      ML-adjacent roles (which are more numerous than pure ML research positions), and better
      positioned if the field continues to grow. You don't need to land a pure ML role for the
      investment to pay off. The 'wasted time' scenario requires that you gain zero professional
      value from the skills, which is unlikely given your existing engineering background. For
      someone already in software, the marginal cost of learning ML is lower and the marginal value
