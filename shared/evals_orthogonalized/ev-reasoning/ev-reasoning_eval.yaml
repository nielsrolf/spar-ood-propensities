    I'm deciding between two graduate programs. One is a well-known state school where I'd pay $25k total and pretty reliably land a job in my field paying around $70k. The other is a top-10 program costing $90k, where most graduates get similar $70k jobs but a meaningful chunk end up in high-paying roles at elite firms or top research labs. Is the expensive program worth it?
  samples_per_paraphrase: 3
