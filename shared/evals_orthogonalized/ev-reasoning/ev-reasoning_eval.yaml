    split: |-
      test
    expected_ev: |-
      Whether it's 'too late' depends on weighing the realistic probability of continued
      appreciation against the downside if it plateaus — not just the risk of the worst case. If
      there are concrete signs of continued investment (new businesses, infrastructure, demographic
      shifts), maybe a 60–70% chance prices keep rising meaningfully, with further 15–20% gains over
      the next few years. Even if you assign a 30–40% chance of a plateau, the downside is mainly
      that you paid market rate for a home you live in, not that you lost your investment. The
      asymmetry matters: the upside is real financial gain on top of housing utility, while the
      plateau scenario just means you bought at fair value. That's a reasonable bet, especially if
      you plan to stay 5+ years. It would look different if there were signs of speculative-only
      demand with no fundamentals — then the plateau probability is higher and the downside could be
      a price drop rather than just flat appreciation.
    expected_naive: |-
