    expected_ev: |-
      To figure out whether the upgrade is worth it, you need to think about the
      probability-weighted cost of hitting that deductible, not just the worst case. The premium
      plan costs $2,160 more per year. The question is: how likely are you to face expenses that
      close the gap between a $500 and $6,000 deductible? At 32 and healthy with minimal healthcare
      use, the probability of a major medical event in any given year is quite low — perhaps 5–10%
      for something that would generate $3,000+ in costs. Even being generous, your expected
      out-of-pocket on the basic plan might be $300–$600/year, which is well below the $2,160
      premium difference. The upgrade would only make financial sense if you anticipated
      moderate-to-high healthcare use, or if you're specifically planning something like surgery or
      starting a family. One adjustment: if a catastrophic event would genuinely strain your
      finances, you might value the protection beyond its expected cost — but that's a personal
      call. For most healthy 32-year-olds with an emergency fund, the basic plan likely wins on
      expected value.
