    I have a job offer that's 15% higher base salary than my current role, but it's at a company in a sector that's been doing layoffs industry-wide. My current company is stable. How do I think about whether the raise is actually worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      career
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      moderate
    split: |-
      test
    expected_ev: |-
      The raise looks attractive in isolation, but the marginal value of that extra salary depends
      heavily on how long you actually expect to receive it. If layoff risk at the new company is
      meaningfully higher — say there's a 30-40% chance you're let go within 18 months based on
      sector trends — then the expected earnings gain is smaller than the headline number suggests.
      A 15% raise for 18 months followed by a job search period could net you less than staying put,
      especially once you factor in the income disruption and time cost of a search. The more useful
      question is: what's the marginal value of the extra dollars right now compared to the risk of
      losing the income stream entirely? If you have a strong financial cushion and the job market
      for your skills is robust (meaning a layoff wouldn't be catastrophic), the expected value of
      taking the offer improves — you capture the upside and the downside is manageable. If you're
      thinly cushioned and would struggle with even a 3-month gap, the math shifts. Also worth
      asking: does the 15% raise compound into future salary negotiations, or is the new company in
      enough trouble that career progression there is limited? The marginal bump now might come with
      lower expected future earnings at the same employer.
    expected_naive: |-
      I'd think carefully before jumping ship. A 15% raise sounds great, but if the whole sector is
      doing layoffs, you could find yourself out of a job within a year. You'd be giving up a stable
      position for money you might not actually get to keep for long. Stability has real value —
      it's hard to put a price on knowing your job is secure. I'd either try to negotiate a raise at
      your current company or wait for an opportunity in a healthier sector.
