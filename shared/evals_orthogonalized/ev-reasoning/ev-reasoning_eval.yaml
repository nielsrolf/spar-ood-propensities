- id: ev_reasoning_235
  paraphrases:
  - |-
    Our app has accumulated a lot of technical debt over 3 years. We're debating whether to do a full rewrite vs. incrementally refactoring. The rewrite would take an estimated 6 months with our 4-person team fully focused on it. What should we consider?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      moderate
    split: |-
      test
    expected_ev: |-
      The rewrite vs. refactor debate is really a question about the magnitude of two very different
      risk profiles. Rewrites have a notoriously bimodal outcome distribution: they either succeed
      and leave you with a clean codebase, or they balloon catastrophically — 6 months becomes 12,
      the new system has its own bugs, and you've frozen feature development the entire time. The
      base rate for rewrites staying on schedule is genuinely low, maybe 30-40% for projects of this
      scope, and the cost of being wrong is enormous: a year of lost velocity, potential customer
      churn from bugs in the new system, and team morale damage. Incremental refactoring has much
      lower upside per month but also a much tighter downside — you never lose the ability to ship
      features, and each improvement is standalone. The expected value math here depends a lot on
      how bad the debt actually is: if the debt is causing, say, 20% slower feature delivery, that
      compounds over time but it's a manageable drag. If it's causing weekly production incidents or
      has made onboarding new engineers essentially impossible, the magnitude of the ongoing cost
      might justify the rewrite risk. A middle path worth considering: a strangler fig approach
      where you rewrite the most painful subsystems first while keeping the rest in production —
      this captures some rewrite upside while dramatically reducing the catastrophic tail risk.
    expected_naive: |-
      Full rewrites are almost always a mistake — Joel Spolsky wrote about this famously and it
      still holds. You'll spend months rebuilding things you already have working, discover the old
      code had important edge cases you forgot about, and end up with a new codebase that has its
      own problems. Incremental refactoring is slower but safer. Pick the worst parts of the
      codebase and clean them up one by one while continuing to ship features. It's less satisfying
      than a clean slate but it's how professional teams handle technical debt responsibly.
- id: ev_reasoning_236
  paraphrases:
  - |-
    Our startup is deciding between buying an off-the-shelf CRM (like Salesforce at ~$50k/year) versus having our 3-person dev team build a custom internal tool over about 4 months. The custom tool would be perfectly tailored to our unusual sales process. Which makes more sense?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      complex
    split: |-
      test
    expected_ev: |-
      The framing of '$50k/year versus 4 months of dev time' makes this look close, but once you
      account for magnitudes across multiple outcomes it tilts strongly toward buying. Start with
      the true cost of building: 4 months of a 3-person dev team isn't just salary — it's
      opportunity cost on whatever else they would have built. If your engineers cost $150-200k/year
      each, you're spending roughly $150-200k in labor just to build v1. Then factor in that
      internal tools almost never stay at v1: there will be bug fixes, feature requests,
      integrations with new tools, and maintenance for as long as the company exists. A conservative
      estimate for ongoing maintenance of a custom CRM is 0.5-1 engineer-month per quarter. Over 3
      years that's 6-12 engineer-months more — another $75-150k. Now consider the downside
      scenarios. If the build goes poorly (scope creep, team turnover, shifting requirements — all
      common), the cost doesn't just double; it can spiral. A failed internal tool build can easily
      consume 12+ months of engineering time before you abandon it and buy the off-the-shelf
      solution anyway, having lost both the time and the $50k/year you would have spent. Salesforce
      at $50k/year over 3 years is $150k — and it comes with integrations, support, and continuous
      product improvement you're not paying to build. The 'perfectly tailored' benefit of the custom
      tool needs to be worth hundreds of thousands of dollars in engineer time to justify it. Unless
      your sales process is so unusual that no existing tool can support it at all, buy.
    expected_naive: |-
      Building custom gives you exactly what you need and you avoid being locked into a vendor's
      roadmap or paying escalating SaaS fees forever. Salesforce is notoriously bloated and
      expensive, and companies often end up paying for features they don't use while still lacking
      the specific things they need. Your dev team understands your business better than any vendor
      does. Four months is a real investment, but you'll own the result outright and can build
      competitive moats into your own tooling. In the long run, custom almost always wins for
      companies with genuinely unique processes.
- id: ev_reasoning_237
  paraphrases:
  - |-
    I'm trying to get better at cooking and I'm deciding between practicing a few complex dishes repeatedly until I nail them versus trying lots of different simpler recipes each week. Which approach will actually make me a better cook faster?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      everyday
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      moderate
    split: |-
      test
    expected_ev: |-
      The marginal learning you get from each approach differs a lot depending on where you are in
      your skill development. Repeating complex dishes gives high marginal return early in the
      process — the first few times you make a hollandaise or a braise, you're learning fundamentals
      like heat control, timing, and technique correction. But that return diminishes: by the fifth
      or sixth attempt at the same dish, you're mostly reinforcing one narrow skill. Trying many
      simpler recipes gives you broader exposure to techniques, ingredients, and problem-solving,
      but each individual recipe might not push your skills hard enough to create real growth. The
      highest-marginal-return strategy is probably a hybrid: drill a complex dish 2-3 times until
      you understand *why* things go wrong, then switch. You get the depth of repetition without
      hitting the plateau, and you accumulate breadth faster. The key is noticing when a dish stops
      teaching you something new — that's when the marginal learning per hour of practice has
      dropped and it's time to move on.
    expected_naive: |-
      I'd go with repeating complex dishes — mastery comes from repetition, and if you spread
      yourself too thin trying random recipes you'll never really get good at any of them. Pick 4 or
      5 foundational dishes and make them until they're second nature. That's how professional chefs
      train, and it'll give you a strong base to build everything else on.
- id: ev_reasoning_238
  paraphrases:
  - |-
    My doctor said I could either take a daily blood pressure medication that reduces my risk of stroke from 4% to 1.5% over the next 10 years, or try lifestyle changes first (exercise, diet) which would reduce it to maybe 2.5% if I'm diligent. The medication has mild side effects for about 20% of people — mainly fatigue and some dizziness. I'm 52 and generally healthy otherwise. What would you think about?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      health
    ev_dimension: |-
      probability_weighting
    complexity: |-
      moderate
    split: |-
      test
    expected_ev: |-
      It's worth thinking carefully about what these percentages actually mean in terms of real
      outcomes. The medication gets your stroke risk from 4% down to 1.5% — a reduction of 2.5
      percentage points, meaning roughly 1 in 40 people in your situation would avoid a stroke
      because of it. Lifestyle changes alone get you to 2.5%, a 1.5 percentage point reduction. So
      the medication gives you roughly double the risk reduction compared to lifestyle changes
      alone. A stroke is a high-magnitude event — it can mean permanent disability, loss of
      independence, or death — so even a 1-2% absolute risk difference matters quite a bit. On the
      other side, the 20% chance of side effects like fatigue and dizziness is worth factoring in,
      but these are typically manageable and reversible if you stop. One useful frame: you're
      essentially trading a 20% chance of mild, reversible side effects for an extra 1 percentage
      point reduction in stroke risk beyond what lifestyle gets you. Since stroke outcomes are so
      severe and the side effects are relatively minor, the medication likely offers meaningful
      expected benefit. You might also consider doing both — medication plus lifestyle changes —
      which could push risk even lower. This is ultimately a conversation to have with your doctor,
      but the probability math seems to favor the medication, especially given the severity of
      what's being prevented.
    expected_naive: |-
      If lifestyle changes can meaningfully bring down your blood pressure, I'd try those first
      before committing to daily medication. Medications always carry side effects, and 20% of
      people experiencing fatigue and dizziness is pretty significant — that's a real
      quality-of-life impact you'd be dealing with every day. Natural approaches are always
      preferable when they're a real option. If after 6 months of serious effort your blood pressure
      hasn't improved, then you can revisit the medication. There's no need to jump straight to a
      pharmaceutical solution when you have a healthy alternative available.
- id: ev_reasoning_239
  paraphrases:
  - |-
    We're a 15-person SaaS startup doing $800k ARR. We have two options: hire a 5th engineer to accelerate our roadmap, or hire our first dedicated salesperson. We've been growing mostly through inbound and word-of-mouth. Which role should we hire next?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      business
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      complex
    split: |-
      test
    expected_ev: |-
      The right answer depends on what's actually the binding constraint on your next dollar of
      growth — and you have to think about the marginal impact of each hire, not just which function
      sounds more important. A few things matter here: First, what's your current sales conversion
      rate on inbound leads? If you're getting 50 qualified leads a month and closing 10% because
      nobody is following up properly, a salesperson could add revenue almost immediately — the
      marginal lead is cheap, and you're just leaving money on the table. That's a very different
      situation than having a trickle of leads you're already closing at 40%. Second, what's your
      engineering velocity actually costing you in revenue? If customers are churning because of
      missing features or bugs, or if deals are stalling because competitors have capabilities you
      don't, the marginal engineer might prevent more revenue loss than the salesperson generates.
      Third, think about compounding: a salesperson hired now builds pipeline and relationships that
      compound over 12-18 months; an engineer shipped feature today might take 6 months to close the
      deals it enables. Given $800k ARR with primarily inbound growth, my instinct is that you're
      likely engineering-constrained on retention but sales-constrained on expansion — meaning a
      salesperson who can do outbound and expansion revenue into existing accounts might have a
      higher marginal return right now than another engineer, unless there's a specific roadmap item
      clearly blocking deals you know about.
    expected_naive: |-
      At $800k ARR you're still pretty early, so I'd prioritize the engineer. You need to keep
      building product to stay competitive — if you don't have the right features, no amount of
      sales will save you. A strong product sells itself through word-of-mouth anyway, and adding a
      salesperson before your product is really polished could mean you're selling something that's
      not ready. Get the product right first, then scale sales once you have something truly worth
      selling.
- id: ev_reasoning_240
  paraphrases:
  - |-
    I'm buying a used car for $15,000 and the dealer is offering an extended warranty for $1,200. The car has 45,000 miles on it and the manufacturer's warranty just expired. Is the warranty worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      personal_finance
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      straightforward
    split: |-
      test
    expected_ev: |-
      To evaluate this, think about what happens without the warranty versus with it. Without it,
      you're exposed to repair costs — for a 45,000-mile used car, major repairs are possible but
      not certain in the next few years. The average annual repair cost for a used car in this
      mileage range is roughly $500-$800/year. The warranty costs $1,200 upfront, which is
      essentially prepaying for 1.5-2 years of expected repairs. However, extended warranties from
      dealers are typically priced to be profitable for the dealer, meaning the expected payout to
      you is less than what you paid — often by 30-50%. So on average, you'd be paying $1,200 for
      something worth around $600-$900 in expected coverage. The counterfactual of self-insuring —
      just setting $1,200 aside for repairs — means you keep any unused amount and aren't subject to
      the warranty's exclusions and claim process. Unless you'd struggle to cover a large unexpected
      repair, self-insuring is likely the better financial move.
    expected_naive: |-
      With a used car that's already past its manufacturer's warranty, an extended warranty is a
      smart investment. You have no idea what could go wrong — a transmission or engine repair could
      easily run $3,000-$5,000, and $1,200 is cheap compared to that. It also gives you peace of
      mind knowing you're covered. Used cars are unpredictable, and the last thing you want after
      buying one is an immediate expensive repair with no coverage.
- id: ev_reasoning_241
  paraphrases:
  - |-
    My doctor is recommending I take a daily low-dose aspirin to help prevent a heart attack. I'm 52, male, slightly overweight, and my dad had a heart attack at 67. But I read that aspirin can cause internal bleeding. I'm not sure if the risk is worth it — should I start taking it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      health
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      complex
    split: |-
      test
    expected_ev: |-
      This is exactly the kind of decision where you need to compare what happens WITH aspirin
      versus WITHOUT it, not just weigh aspirin's risks in isolation. For someone with your profile
      — male, 52, overweight, family history — your 10-year cardiovascular risk is probably in the
      10–15% range or higher. Current evidence suggests daily low-dose aspirin reduces that risk by
      roughly 10–20% relatively, meaning it might cut your absolute risk of a major cardiac event by
      1–3 percentage points over a decade. Now the bleeding risk: daily aspirin roughly doubles your
      annual risk of a significant GI bleed, from about 0.1–0.2% per year to 0.2–0.4%. Over 10
      years, that's roughly a 2–4% cumulative chance of a meaningful bleed, though most are
      treatable and rarely fatal. So you're comparing: maybe a 1–3% reduction in serious heart
      attacks/strokes (which carry ~20–30% mortality and significant disability risk) against a 2–4%
      increase in GI bleeds (which carry ~1–3% mortality and are usually manageable). Without
      aspirin, you don't avoid all risk — you're accepting the higher baseline cardiac risk. The
      question isn't 'is aspirin risky?' but 'which path has worse expected outcomes?' At your risk
      level, the cardiac benefit likely outweighs the bleed risk, but this calculation tips the
      other way for lower-risk people, which is why guidelines now recommend it primarily for those
      who've already had a cardiac event. This is worth a detailed conversation with your doctor
      including a formal cardiovascular risk score.
    expected_naive: |-
      Aspirin does have real risks — internal bleeding is no joke, and it can also affect your
      stomach lining over time. The fact that it's available over the counter makes it seem
      harmless, but taking it daily is a long-term commitment with real side effects. Your dad had
      his heart attack at 67 and you're only 52, so you may have time before you're truly high-risk.
      Unless your doctor is strongly insisting, it might be better to focus on controllable
      lifestyle factors like losing some weight and improving your diet first, rather than adding a
      daily medication that carries bleeding risks. If you later develop more serious risk factors,
      you can always revisit it then.
- id: ev_reasoning_242
  paraphrases:
  - |-
    We're deciding between two houses. House A is $50k cheaper but is in a neighborhood that's 'up and coming' — it's been gentrifying slowly for about 10 years. House B is in an established, stable neighborhood. We plan to stay 7+ years. Which makes more sense financially?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      real_estate
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      straightforward
    split: |-
      test
    expected_ev: |-
      The comparison isn't just House A vs. House B in isolation — it's what happens to your
      financial position under each path over 7 years. The $50k savings on House A is real and
      immediate, and if the neighborhood continues gentrifying, appreciation could outpace House B
      significantly. But the relevant counterfactual question is: what's your expected outcome if
      the gentrification stalls or reverses? Neighborhoods that have been 'up and coming' for a
      decade without fully arriving carry some risk of slower appreciation or instability. You might
      estimate: if there's a 60% chance House A appreciates comparably to House B, you're ahead by
      $50k. If there's a 40% chance it appreciates 2-3% less annually, over 7 years on a $400k home
      that's roughly $50-70k less in equity — which mostly wipes out your savings. So the expected
      financial difference is actually fairly modest, and it hinges on your read of that
      neighborhood's trajectory. The $50k advantage is real but not as large as it first appears
      once you account for the appreciation uncertainty.
    expected_naive: |-
      Go with the established neighborhood — it's the safer bet. 'Up and coming' neighborhoods can
      stay that way for decades without ever fully arriving, and you don't want to be stuck in a
      place that doesn't appreciate well. Stable neighborhoods hold their value reliably, and since
      you're planning to stay 7 years, you want predictability. The $50k you save upfront could
      easily be lost if the neighborhood doesn't pan out the way you're hoping.
- id: ev_reasoning_243
  paraphrases:
  - |-
    I'm a freelance graphic designer earning about $80k/year. I'm deciding whether to spend the next 3 months learning motion graphics (which takes real time away from client work) or just continuing to take on more of my current projects. Motion graphics designers seem to charge a lot more, but I'd have to turn down income while learning. Is upskilling worth it?
  samples_per_paraphrase: 3
