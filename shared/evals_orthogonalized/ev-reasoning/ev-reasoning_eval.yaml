    expected_ev: |-
      The counterfactual isn't 'guaranteed $4,000 vs. your best months of $8,000' — it's 'guaranteed
      $4,000 vs. what you'd actually earn over those same 6 months without the contract.' Your
      average is $5,500, but averages don't tell the whole story. The more useful question is: if
      you decline this contract, what's the realistic distribution of outcomes over 6 months? If
      your income is highly volatile, there's a real probability of hitting two or three $2,500
      months in that window. Over 6 months, the contract pays $24,000 guaranteed. Without it, your
      expected income at $5,500/month would be $33,000 — but with variance, there's maybe a 25-35%
      chance you fall meaningfully below $24,000 if you hit a slow stretch. You should also consider
      whether the contract would crowd out higher-paying opportunities, and what your current cash
      reserves look like. If you have 3+ months of expenses saved and a strong pipeline, the
      variance of freelancing probably has positive expected value over the contract. If your
      savings are thin and your pipeline is uncertain, the insurance value of locked income may be
      worth the $1,500/month discount — essentially you're paying ~$9,000 over 6 months to eliminate
      income risk, which may or may not be worth it depending on your financial cushion.
    expected_naive: |-
      Steady income as a freelancer is really valuable — it takes a lot of stress off. $4,000/month
      guaranteed is solid, and knowing what's coming in lets you plan your finances properly. The
      months where you make $8,000 are great, but you can't count on those. Locking in reliable
      income for 6 months is a smart move, especially if business has been unpredictable.
- id: ev_reasoning_155
  paraphrases:
  - |-
    We're a 10-person startup and just got a promising lead from a big enterprise client. Closing the deal would require us to build some custom features that only they'd use, taking about 6 weeks of engineering time. If we don't do it, they'll probably walk. Should we build the custom features?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      business
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      straightforward
    split: |-
      train
    expected_ev: |-
      The key question isn't just 'is this deal worth 6 weeks of work?' — it's 'what happens if we
      say no?' If turning them down means they walk and you lose the deal entirely, then the
      comparison is: 6 weeks of eng time + some tech debt vs. $0 and no customer. That math can
      easily favor building, depending on the contract value. But if you think there's a decent
      chance you could negotiate — maybe they'd accept a lighter version, or a timeline extension —
      then the counterfactual isn't 'lose the deal' but 'lose only this specific version of the
      deal.' The real risk of building custom features isn't the work itself, it's the maintenance
      burden and the signal it sends about your roadmap. So the decision hinges on: (1) how likely
      is it they actually walk if you say no, and (2) is there a middle path where you don't have to
      build everything they want? If it's genuinely binary — build or lose them — and the contract
      is substantial relative to your runway, it's probably worth doing. If you have negotiating
      room, explore that first before committing 6 weeks.
    expected_naive: |-
      Building custom features for a single client is a classic trap for early-stage startups.
      You'll end up with a codebase full of one-off code nobody else needs, your roadmap gets
      hijacked by one customer's requests, and you set a precedent that you'll do custom work — so
      every future enterprise lead will expect the same. Focus on building a great product for the
      broad market, not a services business for one client. The best startups are disciplined about
      saying no to things that don't scale.
- id: ev_reasoning_156
  paraphrases:
  - |-
    We're trying to decide whether to double down on our enterprise sales motion or launch a self-serve product tier for SMBs. Enterprise deals take 6-9 months to close but are $80k+ ARR each. Self-serve would take 4 months to build, could bring in lots of smaller customers, but we've never done product-led growth before. We have about 18 months of runway. With 6 engineers, what's the right call?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      business
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      Before deciding, it's worth thinking hard about what happens if you *don't* pursue each path —
      because both choices have a real counterfactual cost. If you skip self-serve and stay pure
      enterprise: you're betting that your current pipeline can close enough deals in the next 12
      months to extend runway. At 6-9 month sales cycles, you probably have 2-3 deals currently in
      flight. Even if all close, that may not move the needle fast enough. The counterfactual cost
      of not building self-serve isn't just 'missed SMB revenue' — it's potentially running out of
      runway before enterprise compounds. Conversely, if you abandon enterprise to build self-serve:
      you're diverting 4 months of engineering toward something with real execution uncertainty
      (you've never done PLG), and you lose momentum on deals already in flight. The honest framing
      is: enterprise is your known path with timing risk; self-serve is an uncertain path with
      execution risk. Given 18 months of runway and deals already in flight, I'd lean toward keeping
      enterprise sales running with your existing motion — maybe 4 engineers — while a small
      2-person team scopes a lightweight self-serve MVP. That way you're not abandoning a working
      channel to chase an unproven one, but you're also not ignoring the runway cliff.
    expected_naive: |-
      With only 18 months of runway, you can't afford to split focus. Enterprise is already working
      for you — $80k ARR deals are significant and you have a proven playbook. Self-serve sounds
      appealing but it's a totally different motion that requires product, marketing, and support
      infrastructure you don't have. Startups that try to do both usually do neither well. Double
      down on what's working, close the pipeline you have, and revisit self-serve once you've
      extended runway. Don't rebuild the engine while the car is moving.
- id: ev_reasoning_157
