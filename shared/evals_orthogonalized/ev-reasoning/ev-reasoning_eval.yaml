    expected_ev: |-
      This is really a question about comparing the magnitude of outcomes, not just counting them.
      On the benefit side, you're getting a 0.5 percentage point reduction in heart attack risk over
      10 years — a heart attack is a serious event that can be fatal or cause lasting disability. On
      the risk side, you have a 0.5% chance of a serious GI bleed, which is also serious but in most
      cases treatable and less likely to be fatal than a heart attack. So the two probabilities are
      roughly equal (both around 0.5%), but the question is whether the magnitude of a prevented
      heart attack is larger than the magnitude of a GI bleed. For most people, heart attacks carry
      higher mortality and long-term disability risk, so the benefit likely edges out the risk — but
      this also depends on your personal factors like age and GI history, which your doctor can
      weight more precisely. The math here is close enough that individual circumstances matter a
      lot.
    expected_naive: |-
      I'd be cautious about taking a medication that can cause a serious GI bleed. Any medication
      with a known risk of internal bleeding is something to think carefully about. If you're
      generally healthy, it might not be worth introducing that risk into your life. You could also
      try lifestyle changes like diet and exercise to reduce your heart risk instead, with no side
      effects at all.
