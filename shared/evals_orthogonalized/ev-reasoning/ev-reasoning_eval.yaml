    expected_ev: |-
      The right answer depends on where you're getting the most marginal return per hour given your
      current situation. Interview prep and portfolio building lead to the same endpoint — a better
      job — but they work through different mechanisms and have different probability profiles.
      Technical interview prep has a fairly direct and fast feedback loop: each hour of practice
      meaningfully increases your probability of clearing a specific interview at a specific
      company. But the gains per hour eventually plateau — after 40-50 hours of solid prep you're
      likely at a point of diminishing returns unless you're targeting very specialized algorithmic
      roles. Portfolio work has a longer feedback loop but potentially broader reach — a strong
      project can signal seniority more convincingly to some employers than interview performance,
      and it keeps working for you passively. The marginal hour of portfolio work is probably worth
      more early on if your portfolio is thin or weak, since going from 'nothing' to 'something
      solid' is a big jump in perceived seniority. If you already have decent projects, additional
      polish has lower marginal impact. One practical framing: if you have a target company with
      interviews scheduled in 8 weeks, your marginal hour clearly belongs in interview prep. If your
      timeline is looser and you're trying to shift how the market perceives your level, portfolio
      hours might be higher value right now. Consider where you're currently weakest — that's
      usually where the next hour has the highest marginal return.
