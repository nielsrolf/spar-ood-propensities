    expected_ev: |-
      With 5 years of PM experience, the marginal signal that a PMP adds to your profile is probably
      smaller than it would be for someone with 1-2 years — employers hiring experienced PMs are
      already expecting demonstrated results, and the certification mostly confirms process
      knowledge you've likely already internalized. The question is whether that credential pushes
      you over a threshold in specific hiring contexts, like large enterprises or government
      contractors that screen for PMP explicitly. If your target roles don't filter that way, the
      marginal career impact of 3 months spent on the PMP could be fairly modest. A portfolio of
      case studies, by contrast, might have higher marginal value if it fills a gap your resume
      currently has — concrete evidence of your decision-making, stakeholder handling, or results.
      The key is to ask: what's the actual bottleneck holding you back right now? If you're losing
      interviews because screeners see no PMP and filter you out, the cert has high marginal value.
      If you're getting interviews but losing at the case-study or 'show me your work' stage, the
