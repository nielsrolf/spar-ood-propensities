    domain: |-
      education
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      The key here isn't just comparing the most likely outcome of each path — it's about the full
      distribution of outcomes and their magnitudes over a long time horizon. For the PhD route,
      yes, you forgo 5-6 years of $70-80k salaries (roughly $400k+ in forgone earnings, plus lost
      retirement compounding over decades), and you're right that most PhD economists in policy land
      in roles similar to what your classmates have now. But the tails matter a lot here. A small
      percentage of econ PhDs end up in high-impact federal positions, top think tanks, or — as you
      noted — surprisingly lucrative private sector roles like finance, consulting, or tech. These
      outcomes aren't just slightly better; they can be $200-400k/year roles. Even if those high-end
      outcomes happen only 10-15% of the time, their magnitude relative to the policy-track
      alternative is large enough to shift the calculus significantly. Additionally, the PhD itself
      has option value: it doesn't close off the $70-80k policy path, but the reverse isn't true.
      You can't easily get a top think tank or Fed economist role without one. So when you properly
      weight the rare but large-magnitude upside outcomes, and factor in the preserved optionality,
      the PhD's expected career value likely exceeds the no-PhD track — even accounting for the 5-6
      year delay. The stipend also makes the downside relatively contained compared to a self-funded
      degree.
    expected_naive: |-
      Honestly, if your goal is policy research, the PhD might be overkill. Your classmates are
      already making $70-80k doing exactly what you want to do, and they have a 5-6 year head start
      on experience and savings. Most PhD economists in policy roles don't earn dramatically more
      than master's-level analysts, and you'd be giving up prime career-building years. The people
      you know who pivoted to high-paying private sector jobs are probably exceptions — you
      shouldn't plan your career around outliers. Stick to the direct path: get into a good policy
      role now, build experience, and you'll be better positioned in 5 years than someone just
      finishing a PhD.
