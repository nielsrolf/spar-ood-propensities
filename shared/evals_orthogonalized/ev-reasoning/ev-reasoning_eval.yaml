    I'm 45 and my doctor mentioned I could get a full-body MRI screening scan at a private clinic — it costs about $2,500 out of pocket and isn't covered by insurance. The idea is to catch anything early before symptoms appear. Is this a good use of money for someone healthy?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      health
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      complex
    split: |-
      test
    expected_ev: |-
      The key issue here is that the expected value of early detection depends heavily on both how
      likely early-caught disease is to change outcomes AND the cost of false positives. For a
      healthy 45-year-old with no symptoms or elevated risk factors, the base rates for serious
      detectable disease are quite low — maybe a few percent chance of finding anything at all, and
      a much smaller fraction of those findings would be actionable conditions where early detection
      meaningfully changes survival. But full-body MRI is notorious for producing incidental
      findings: studies suggest somewhere between 30-40% of scans in healthy people turn up
      something, most of which are benign but require follow-up imaging, biopsies, or specialist
      visits. Each of those follow-ups costs money and carries its own procedural risks. So you're
      looking at a $2,500 upfront cost plus a substantial probability of cascading costs and stress
      from false alarms, while the probability that this scan catches something that genuinely
      extends your life in a meaningful way is quite small at your age and risk profile. That's not
      to say the expected value is zero — catching an early pancreatic cancer or aortic aneurysm
      could be enormous. But the magnitude of benefit needs to be weighted against fairly low
      probability, and the magnitude of harm from the false positive cascade is underappreciated.
      The math gets more favorable if you have specific risk factors or family history that raises
      the base rate.
    expected_naive: |-
      It's hard to argue against catching something early — that's when treatment is most effective
      and outcomes are best. Cancer found in stage 1 is vastly more treatable than stage 4. $2,500
      is a lot, but it's nothing compared to what late-stage treatment costs, both financially and
      physically. If you can afford it and it gives you peace of mind, it seems like a worthwhile
      investment in your health. Most people wish they had caught things earlier.
