    expected_ev: |-
      The key question is: what would actually happen if you stopped leaving 20 minutes early? You
      mentioned you've only been late once in two years when leaving on time — that's roughly a
      1-in-500 chance per commute. If being late costs you something meaningful (a reprimand, a
      missed meeting), say that's a moderate inconvenience, then multiply: 1/500 chance × that cost.
      Now compare that to the certain cost of 20 extra minutes every single workday — that's around
      80–85 hours per year of your time. Unless being late would be genuinely catastrophic, the
      expected cost of dropping the habit is quite low, and you'd be gaining back a lot of time. The
      one late incident doesn't tell you much on its own — what matters is whether that rate of
      lateness, if it continued, would actually harm you enough to justify the ongoing time cost.
    expected_naive: |-
      It's always better to be safe than sorry with punctuality — being late can really damage your
      professional reputation. The fact that you've only been late once shows the habit is working!
      Stick with it. Showing up on time (or early) is a sign of reliability and respect for others'
      time, and the cost of being late even once could outweigh months of arriving early.
