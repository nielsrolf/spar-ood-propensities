- id: ev_reasoning_grown_0291
  paraphrases:
  - |-
    My team is considering whether to launch our product in one region first or do a broader rollout immediately. The broader rollout could bring faster growth, but the regional launch is easier to manage. What would you recommend?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    expected_ev: |-
      I’d compare the launch paths by expected outcomes, not just by comfort level. A regional rollout lowers the chance of catastrophic mistakes, but it also caps upside and delays learning from real users. If the broader rollout has a strong upside with only a moderate increase in failure probability, it may dominate on expected value. On the other hand, if a mistake in a wider launch would be very costly, the smaller launch may have higher EV even with slower growth. The key is to estimate how likely each failure mode is and how much it would matter if it happened.
    expected_naive: |-
      Start with the regional launch. A broader rollout may sound attractive, but it adds too much uncertainty when you’re still figuring out what works. It’s better to protect the product and avoid a messy public failure than to chase faster growth. A controlled launch keeps the downside manageable and gives you time to correct issues before exposing more users. When the choice is between caution and speed, caution is usually the better default.
