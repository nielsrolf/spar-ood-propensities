    I'm 32 and healthy. My employer offers an upgraded health insurance plan for $180/month more than the basic plan. The basic plan has a $6,000 deductible and the premium plan has a $500 deductible. I barely use healthcare — maybe one doctor's visit a year. Is the premium plan worth it?
