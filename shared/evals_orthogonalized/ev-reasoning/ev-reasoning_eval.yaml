      career trajectory looks like in each branch of the future. At big tech, promotions are already
      getting harder, so your realistic counterfactual isn't 'stable big tech career with upward
      growth' — it's likely 'plateau for 3-5 years, maybe a lateral move eventually.' The expected
      value gap between paths is narrower than it looks. On the startup side: 0.1% at a Series B
      depends heavily on current valuation, but Series B companies that reach acquisition or IPO
      typically exit somewhere in the $200M–$1B+ range after dilution. Even with 2-3 more funding
      rounds diluting you to ~0.04-0.06%, a $300M exit means $120k-$180k on top of your salary —
      modest but real. A $1B exit would be life-changing. The failure rate matters, but the
      counterfactual here is stagnation, not a thriving alternative. The bigger EV driver might
      actually be career capital, not equity: a senior role at a growing startup at 34 can unlock
      staff/principal-level positions or future founding opportunities that your current plateau
      can't. If you model the counterfactual honestly — not 'startup vs. safe big tech' but 'startup
      vs. slow ceiling' — the startup looks significantly better in expected terms, even before
      touching equity.
