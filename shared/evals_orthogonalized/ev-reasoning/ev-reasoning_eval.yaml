    expected_ev: |-
      The real comparison isn't 'good gym vs. slightly worse gym' — it's 'how often will you
      actually go to each one?' That 17-minute round-trip difference adds up to about 2.5 hours per
      week, or roughly 130 hours a year if you maintain 3 visits weekly. But the bigger factor is
      dropout risk: research consistently shows that proximity is one of the strongest predictors of
      gym attendance. If you stay at the far gym, what's the honest probability you maintain 3x/week
      over the next year versus if the gym were nearby? If the closer gym increases your average
      attendance even slightly — say from 2.5x to 3x per week — the fitness benefit of that extra
      visit likely outweighs whatever marginal equipment advantage the current gym provides. You'd
      also save $180/year. The counterfactual of staying put assumes your current attendance holds
      indefinitely, but convenience barriers compound over time — busy weeks, bad weather, or low
      motivation hit the far gym harder. Unless you're specifically training for something that
      requires the better equipment or use the sauna regularly for recovery, the closer gym probably
      produces better outcomes in practice than it looks on paper.
