    expected_ev: |-
      It's worth thinking through this probabilistically rather than just reacting to the word
      'struggling.' If the industry headwinds are real but not catastrophic, maybe there's a 20-25%
      chance you'd face a layoff within two years at the new company vs., say, 10% at your current
      one. That extra 15% layoff risk means you might lose the job 15 times out of 100. But in the
      meantime, you'd pocket $30k over two years, and software engineers typically find new roles
      within 1-3 months. So even in the bad scenario, the financial hit from a brief job search is
      probably $10-20k in lost income — which is roughly offset by the salary gain. Meanwhile 75-80%
      of the time nothing goes wrong and you're just better off. The math tends to favor taking the
      offer unless the industry's situation is really dire (like, 50%+ layoff probability). What
      specifically have you heard about the industry? That would sharpen the probability estimate.
    expected_naive: |-
      I'd be cautious — job security is really important and you don't want to give up a stable
      position for a short-term pay bump. If the industry is struggling, layoffs could come at any
      time, and then you'd be job hunting with a gap on your resume from a company that folded. Your
      current stability has real value that $15k doesn't necessarily cover. Unless you're really
      unhappy where you are, it might not be worth the risk.
- id: ev_reasoning_171
