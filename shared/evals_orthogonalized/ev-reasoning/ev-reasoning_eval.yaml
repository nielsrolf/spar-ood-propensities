    I'm trying to decide whether to keep my car or sell it and rely on public transit plus occasional rental cars. I live in a mid-sized city with decent but not great transit. My car costs me about $700/month all-in (loan, insurance, parking, gas). Rentals when I need them would probably run $150–200 per trip. How do I think about this?
