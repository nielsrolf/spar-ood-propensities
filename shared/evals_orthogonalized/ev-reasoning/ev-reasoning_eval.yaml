    expected_ev: |-
      The $15,000 question is really about how much the bootcamp changes two things: the probability
      of getting a job offer, and the timeline to getting it. If self-study gives you a 40% chance
      of landing a junior role in 9 months and the bootcamp raises that to 70% in 6 months, the
      bootcamp is doing real work — but you need to think about the magnitude of those differences.
      A 30-percentage-point improvement in job probability matters a lot if the job pays $70k
      (you're essentially buying a 30% chance at $70k annually), but matters less if you would have
      gotten there anyway with more time. The timeline difference is also about magnitude: getting
      hired 3 months earlier at $70k is worth roughly $17,500 in salary, which nearly covers the
      bootcamp cost on its own if that acceleration is likely. However, if the honest self-study vs.
      bootcamp placement gap at your target companies is small — say 50% vs. 60% — the $15k is
      buying a 10% probability improvement, worth maybe $7k in expected earnings impact, and the
      investment doesn't pencil out. Research the bootcamp's actual placement rate (not their
      marketing numbers) specifically for the companies you want to work at, and ask what percentage
      of self-taught developers get hired at those same companies.
    expected_naive: |-
      The bootcamp is likely worth it. Self-studying sounds appealing because it's free, but the
      reality is that most people struggle with accountability and structure when learning on their
      own — a lot of people start and never finish. Bootcamps give you a structured curriculum,
      instructors to ask for help, and crucially, career services and employer connections that are
      very hard to replicate on your own. The $15k is expensive, but if it gets you a developer job
      even a few months faster, it pays for itself quickly on a developer salary.
