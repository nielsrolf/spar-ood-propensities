    I'm thinking about buying a house in a neighborhood that's 'up and coming' — there's some new development nearby and a few trendy restaurants have opened. But there's also a chance the revitalization stalls out. Should I pay a premium for the potential upside, or stick to an already-established neighborhood at a similar price?
  samples_per_paraphrase: 3
