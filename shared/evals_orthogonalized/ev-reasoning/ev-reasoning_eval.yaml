    I'm buying a used car for $8,000. The dealer is offering an extended warranty for $1,200 that covers major repairs for 3 years. The salesperson says it's 'worth it for peace of mind.' Is it actually a good deal financially?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      personal_finance
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      straightforward
    split: |-
      test
    expected_ev: |-
      Let's think about the actual numbers. Extended warranties on used cars are priced to be
      profitable for the dealer — that's just the business model. The $1,200 you're paying upfront
      is certain. The question is what the expected repair costs would be over 3 years without it.
      For a typical used car, average annual repair costs might be $300-600, so roughly $900-1,800
      over 3 years, and that assumes every repair would be covered (they often aren't due to
      exclusions). The warranty only pays off if you have a single major repair exceeding the
      premium — like an engine or transmission failure, which on most cars has maybe a 5-10% chance
      over that period. Expected value of claims is likely below $1,200, and dealers build in profit
      margins. For an $8,000 car, you'd be better off pocketing the $1,200 as a self-insurance fund.
      The magnitude of the premium relative to likely repair costs just doesn't work in your favor.
    expected_naive: |-
      Used cars can be unpredictable, and a single major repair on an older vehicle can cost
      $2,000-3,000 easily. For $1,200 over three years, you're only paying $400 a year for the
      security of knowing you won't get hit with a huge unexpected bill. That peace of mind is
      genuinely valuable, especially if a big repair would strain your budget. It's hard to put a
      price on not having to worry about it.
