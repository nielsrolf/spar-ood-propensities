      successfully will always have a bigger impact on growth than fixing edge cases that affect a
      small minority.
- id: ev_reasoning_145
  paraphrases:
  - |-
    I'm a software developer with 5 years of experience considering a part-time MBA program. It costs $60k and takes 3 years evenings and weekends. My goal is to eventually move into product management or tech leadership. Is it worth it?
  samples_per_paraphrase: 3
