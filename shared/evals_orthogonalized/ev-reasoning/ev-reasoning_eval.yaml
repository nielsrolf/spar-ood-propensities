    I have two job offers. One is a stable corporate role paying $90k with predictable raises. The other is at a fast-growing startup paying $80k but with 0.1% equity. The startup has about 100 employees and just raised a Series B at a $50M valuation. Should I take the equity deal seriously or just treat it as basically worthless?
