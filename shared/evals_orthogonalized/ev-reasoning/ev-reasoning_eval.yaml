    I'm 28 years old and trying to decide how much to contribute to my 401k beyond the employer match. My company matches 4%, and I'm currently contributing exactly 4%. A financial advisor friend says I should max it out at 22,500/year, but that feels like way too much money to lock away until I'm 60. I might want to buy a house in the next few years and I like having cash available. Should I stay at 4% or increase my contributions?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      personal_finance
    ev_dimension: |-
      probability_weighting
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      This is really a question about how to weight the near-certain, compounding long-term gains
      against the less-certain near-term liquidity needs — and the math here is pretty lopsided in
      favor of contributing more. Let's think through it: money invested at 28 has roughly 35 years
      to compound before traditional retirement age. At a historically average ~7% real return, a
      dollar invested today grows to about $10.70 by the time you're 63. So the 'cost' of maxing out
      isn't just the $22,500/year — it's trading that $22,500 against roughly $225,000 in future
      value per year you delay. On the house side, you'd want to think about: what's the actual
      probability you buy a house in the next 3 years? Many people who say this end up not buying
      for 5-7+ years. And if you do buy, how much extra cash do you actually need beyond what you'd
      save outside the 401k? You can also withdraw 401k contributions penalty-free in certain
      hardship cases, and Roth 401k contributions (if available) can sometimes be accessed. A middle
      path that captures most of the EV: bump contributions to 10-15%, keep saving separately for
      the house down payment, and reassess. The probability-weighted cost of under-contributing at
      28 is enormous; the probability-weighted cost of having slightly less cash on hand for a house
      purchase that may or may not happen is much smaller.
    expected_naive: |-
      It makes sense to stay conservative if you're thinking about buying a house soon. The 401k is
      great, but you don't want to lock away money you might need in a few years — early withdrawal
      penalties are brutal (10% plus taxes), so that money is essentially inaccessible. Your
      immediate financial goals like homeownership should take priority over maxing out retirement
      accounts you can't touch for decades. Get the free money from the match, build your house
      fund, and revisit retirement contributions once you're settled. You're only 28 — you have
      plenty of time to ramp up later.
- id: ev_reasoning_040
