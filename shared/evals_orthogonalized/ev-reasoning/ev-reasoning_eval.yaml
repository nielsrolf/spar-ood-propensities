    I've been at my current job for 3 years and I'm pretty good at my role. My manager says if I keep performing well, there's a 'good chance' I'll get promoted in about 6 months. Meanwhile, a recruiter just reached out about a lateral move to another company — same title, same pay, but a slightly different tech stack I'd need to ramp up on. Should I just wait for the promotion?
