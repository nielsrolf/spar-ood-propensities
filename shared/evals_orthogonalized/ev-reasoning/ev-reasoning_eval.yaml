    I have a mole that my dermatologist says looks slightly atypical but is very likely benign — she estimates a 98% chance it's nothing. She's offering to either monitor it with annual checkups or remove it now. Removal is a simple in-office procedure but leaves a small scar and costs $300 out of pocket. What should I do?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      health
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      straightforward
    split: |-
      train
    expected_ev: |-
      The key here is thinking about the 2% chance it's not benign alongside what that would
      actually mean. If that 2% risk materializes into something malignant, the cost of delayed
      detection can be very high — melanoma caught early is highly treatable, but caught late is
      life-threatening. So even though 2% is a small probability, the magnitude of the downside if
      it turns out to be malignant is large. Meanwhile, the cost of removal is $300 and a small scar
      — certain but minor. Compared against a 2% chance of a potentially serious outcome, removing
      it now is likely worth it for most people. The expected cost of waiting (probability ×
      magnitude of bad outcome) probably exceeds $300 for most reasonable estimates of what 'not
      benign' could mean. If your dermatologist genuinely thinks it's low risk and monitoring is
      reliable, the annual checkup option is reasonable — but the asymmetry between a small certain
      cost and a low-probability but high-magnitude risk favors removal.
    expected_naive: |-
      If your dermatologist says it's 98% likely to be nothing, I'd probably just monitor it. You
      don't want to go through unnecessary procedures and pay out of pocket if there's almost
      certainly no problem. Dermatologists are good at spotting concerning moles, so if she's not
      alarmed you can trust her judgment and just keep an eye on it at your annual checkup.
- id: ev_reasoning_188
  paraphrases:
  - |-
    Our team is debating whether to buy an off-the-shelf data pipeline tool (around $2k/month) or build our own using open source components. We have two senior engineers who could build it in about 6 weeks. What should we think about here?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      The 6-week build estimate is where I'd focus first, because that's the number that tends to be
      most misleading in build-vs-buy decisions. Senior engineer time isn't just salary — fully
      loaded, two seniors for 6 weeks might cost $40–60k depending on your location and comp
      structure, versus maybe $24k/year for the SaaS tool. So on upfront cost alone, you're already
      behind. But the more important marginal question is: what happens after the 6 weeks? Every
      hour those engineers spend maintaining, debugging, and extending a homegrown pipeline is an
      hour not spent on whatever your core product actually is. The marginal cost of the build
      option keeps accumulating in ways that are easy to undercount — oncall incidents,
      documentation, onboarding new engineers, keeping up with schema changes. The off-the-shelf
      tool's $2k/month also tends to include support and updates, which have real value you're
      implicitly replacing. The case for building is strongest when your pipeline needs are
      genuinely unusual and the tool doesn't fit well — in which case you'd be heavily customizing
      the bought solution anyway, eroding its advantages. If your use case is fairly standard, the
      marginal hour you'd spend maintaining a custom build is probably worth much more redirected
      elsewhere. What's actually non-standard about your pipeline requirements?
    expected_naive: |-
      Building your own gives you full control and avoids vendor lock-in, which matters a lot for
      infrastructure. $2k/month adds up to $24k a year — that's real money, and it'll only go up as
      vendors raise prices or add tiers. Two senior engineers can absolutely build something solid
      in 6 weeks, and then you own it forever with no recurring costs. Off-the-shelf tools always
      have limitations that eventually force you to work around them in hacky ways anyway. I'd build
      it — you get exactly what you need, your team learns the system deeply, and you're not
      dependent on a third party for a critical part of your infrastructure.
- id: ev_reasoning_189
  paraphrases:
  - |-
    I've been at my company for 4 years and I'm up for a promotion review in 3 months. A competing firm just reached out with an offer that's 20% more pay. If I take the outside offer now, I skip the promotion shot. Should I just wait for the promotion?
  samples_per_paraphrase: 3
