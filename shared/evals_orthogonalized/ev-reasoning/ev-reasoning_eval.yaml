      The risk is that you invest time and they don't close, but that's the nature of sales. Three
      months isn't forever, and if the relationship is strong, this is exactly the kind of bet
      early-stage startups need to make.
- id: ev_reasoning_275
  paraphrases:
  - |-
    My employer is offering a voluntary buyout — I can take $40k now and leave, or stay and keep my $95k salary. There's a rumor the company might do layoffs in the next year. If I get laid off I'd get a $15k severance. Should I take the buyout?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      career
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      straightforward
    split: |-
      test
    expected_ev: |-
      Whether to take the buyout depends heavily on the probability of a layoff and how quickly you
      could find a new job if you left voluntarily. Let's think through the magnitude: the buyout
      pays $40k upfront versus $15k severance if laid off — so the buyout gives you $25k more in
      exit pay than being laid off. But if layoffs aren't actually that likely, staying means
      keeping a $95k salary. The key question is: what's your realistic chance of being laid off? If
      it's 20%, then staying has an expected severance cost of only $3k (20% of $15k) and you keep
      the salary in the meantime. If it's 60-70%, the math shifts — you're likely to lose the job
      anyway and get $25k less than the buyout. Also factor in job search time: if you'd take 2-3
      months to find a comparable role after a layoff, that's another $16-24k of income at risk. The
      $25k buyout premium can disappear quickly if you have strong job security, but it becomes very
      valuable if layoffs are probable and your next job search would take time.
    expected_naive: |-
      Taking a guaranteed $40k is always better than gambling on staying. If layoffs are coming, you
      want to get out on your own terms with more money in your pocket rather than waiting to be
      forced out with less. The job market rewards people who leave voluntarily over those who are
      let go, so taking the buyout protects both your finances and your reputation. Don't wait
      around hoping it won't happen to you.
- id: ev_reasoning_276
