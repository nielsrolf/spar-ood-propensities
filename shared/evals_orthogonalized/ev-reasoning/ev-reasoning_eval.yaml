      The magnitude of the salary difference makes this worth a hard look even if success isn't
      guaranteed. The gap between your current role and an ML engineer role is $65k/year — if you
      land it, over just three years that's nearly $200k in additional earnings, not counting
      compounding career effects. Even if you put the probability of successfully transitioning at
      only 30-40%, the expected salary gain is $20-26k per year, which is a very strong return on 6
      months of evening work. The downside — 6 months of evenings invested and you stay where you
      are — is real but limited: you lose time, not money, and you likely gain adjacent skills that
      still improve your value as a data analyst. The asymmetry here is significant: the cost of
      failure is modest, but the reward for success is large. A 30% shot at $65k/year more is a very
      different proposition than a 30% shot at $5k/year more.
    expected_naive: |-
      Six months is a long commitment, and there's no guarantee it pays off. The ML job market is
