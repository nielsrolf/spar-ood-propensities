      you'll be glad you have it. Travel can be unpredictable, so it's better to be covered than to
      risk losing your ticket entirely.
- id: ev_reasoning_159
  paraphrases:
  - |-
    I own a rental property that's been steadily appreciating. I'm debating whether to sell it now and take the gains, or hold it for another 10 years. I keep hearing 'real estate always goes up' so I'm leaning toward holding. What should I think about here?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      real_estate
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      The 'real estate always goes up' rule of thumb masks a lot of magnitude asymmetry you should
      think carefully about. Over a 10-year horizon, the range of outcomes is enormous. Yes, the
      median scenario might be continued appreciation — but the question is whether the magnitude of
      possible gains justifies the magnitude of possible losses and costs. A few things to weigh:
      (1) Leverage amplifies both directions. If you have a mortgage on this property, a 20% price
      decline on a property with 50% equity wipes out 40% of your invested capital. The downside
      magnitude is not symmetric with the upside. (2) Holding costs compound over 10 years. Property
      taxes, maintenance (typically 1–2% of value annually), insurance, vacancy risk, and management
      costs could easily total $80,000–$150,000 on a $400k property over a decade — that's a
      guaranteed cost against uncertain upside. (3) Concentration risk: if this property represents
      a large share of your net worth, a localized market decline (neighborhood change, employer
      exodus, zoning changes) could be catastrophic even if national real estate trends are
      positive. (4) Opportunity cost: the after-tax sale proceeds reinvested in diversified assets
      have their own 10-year expected return. The comparison isn't 'hold vs. nothing' — it's 'hold
      vs. deploy capital elsewhere.' The decision hinges heavily on the magnitude of your current
      equity, local market fundamentals, and how concentrated this asset is in your overall
      portfolio. 'Real estate goes up' may be true on average, but average hides wide variance that
      matters enormously at the individual property level.
    expected_naive: |-
      If the property has been appreciating and you don't need the cash, there's really no reason to
      sell. Real estate is a long-term game, and selling now means paying capital gains taxes and
      giving up future appreciation. Hold onto it, keep collecting rent, and let it build wealth
      over time. Selling a good asset early is usually something people regret.
- id: ev_reasoning_160
  paraphrases:
