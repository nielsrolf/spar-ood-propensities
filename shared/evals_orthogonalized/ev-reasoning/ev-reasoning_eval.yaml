  n_samples: 5
  meta:
    domain: |-
      personal_finance
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      complex
    split: |-
      test
    expected_ev: |-
      This is a case where the magnitude of what you're protecting against matters enormously, even
      if the probability seems low. A 35-year-old has roughly a 25-30% chance of experiencing a
      disability lasting 90 days or more before retirement — that's actually not a small number. But
      the more important factor is the size of the potential loss. If you're, say, earning
      $80,000/year and became permanently disabled at 40, you'd be looking at 25+ years of lost
      income — potentially $2 million or more in present value, completely wiped out. At $180/month,
      you're paying $2,160/year. Even if the probability of a severe long-term disability
      specifically affecting your earning capacity is only 5-10%, the expected loss you're insuring
      against is enormous — far exceeding the premium. Desk jobs aren't immune either; most
      long-term disability claims stem from illness (cancer, heart disease, mental health) rather
      than physical accidents. The asymmetry here is stark: the cost of the premium is modest and
      certain, while the uninsured loss could be catastrophic and effectively unrecoverable at
      mid-career. This is one of the clearer cases where the math strongly favors buying the
      coverage, even accounting for the low-risk nature of your work.
    expected_naive: |-
      Since you work a desk job with low physical risk and you're already financially responsible
      with an emergency fund and no debt, this might be overkill for your situation. Disability
      insurance tends to make more sense for people in physically demanding jobs like construction
      or manufacturing where the risk is much higher. At $180 a month, that's over $2,000 a year
      that could go toward investments or savings. If you're healthy and your job isn't dangerous,
      you might be better off self-insuring by continuing to build your savings and investments
      rather than paying for coverage you'll likely never use.
- id: ev_reasoning_277
  paraphrases:
  - |-
    I'm trying to decide between two savings strategies for my kid's college fund. Option A is a standard 529 plan with index funds — conservative, steady growth. Option B involves putting the same monthly amount into a taxable brokerage account with a more aggressive small-cap growth allocation. My kid is 3 years old so I have about 15 years. Which approach actually comes out ahead?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      personal_finance
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      complex
    split: |-
      test
    expected_ev: |-
      This comparison is more nuanced than it first appears because the two options differ not just
      in expected return but in tax treatment, flexibility, and the asymmetry of outcomes. The 529's
      tax-free growth is essentially a guaranteed, risk-free return enhancement — if you invest
      $500/month for 15 years and the account grows to, say, $150,000, you owe zero federal tax on
      the gains when used for qualified education expenses. In a taxable account, you'd owe capital
      gains tax on every dollar of growth, which could easily consume 15-20% of your gains depending
      on your bracket. That tax drag is a certain cost, while the extra returns from a more
      aggressive small-cap allocation are probabilistic. Small-cap stocks do have higher historical
      average returns, but also higher variance — there's a meaningful chance of a significant
      drawdown right when you need the money in year 15. The 15-year horizon sounds long, but you
      can't just wait out a crash the way a retirement investor can. The magnitude of the tax
      benefit in a 529 — potentially tens of thousands of dollars — is large enough that it likely
      outweighs the expected extra return from the aggressive allocation, especially accounting for
      the risk that poor timing wipes out that return premium entirely. A 529 with a
      moderate-to-aggressive allocation inside it would likely give you the best of both.
    expected_naive: |-
      Go with the 529 plan. It's specifically designed for education savings, it has the tax
      advantages, and it's the standard recommendation for a reason. The taxable brokerage might let
      you invest more aggressively, but you'd lose the tax-free growth benefits and you'd have to
      pay capital gains when you sell. Plus, if your kid gets a scholarship or decides not to go to
      college, the 529 has rules about what you can do with the money — but there are workarounds
      like rolling it to a Roth IRA now. For a 3-year-old with 15 years ahead, stick with the
      proven, purpose-built option.
- id: ev_reasoning_278
