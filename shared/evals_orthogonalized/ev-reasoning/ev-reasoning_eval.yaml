      actually buy you? For deepening your current backend skills, you're adding to an existing
      foundation — the returns might be diminishing somewhat since you're already using these skills
      daily and getting on-the-job reinforcement anyway. Your job itself is essentially training you
      in that stack for free, 40 hours a week. Your 5 spare hours stacked on top have a lower
      marginal lift because you're already well into the learning curve. For ML, you're starting
      from a low base, so initial hours tend to be high-impact — covering core concepts that open up
