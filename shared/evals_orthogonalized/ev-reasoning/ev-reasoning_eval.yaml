    We're considering buying a third-party API for fraud detection instead of building our own ML model. The vendor costs $80k/year. Building in-house would take 6 months and maybe $150k upfront, but our engineers think our model could outperform the vendor. What factors should drive this decision?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      probability_weighting
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      The 'our model could outperform the vendor' claim needs a probability attached to it before it
      can drive a decision. ML projects are notoriously uncertain — strong engineers still produce
      models that underperform baseline in production due to data quality, feature availability, or
      distribution shift. If there's, say, a 40% chance your in-house model meaningfully outperforms
      the vendor and delivers an extra $60k/year in reduced fraud losses, that's only $24k/year in
      expected upside. Against $150k upfront plus ongoing maintenance costs (easily $30–50k/year in
      engineer time), the economics favor buying. The break-even only flips if the probability of
      meaningful outperformance is high and the performance delta is large. A useful framing: what
      does the vendor's model actually miss, and do you have proprietary signals they don't? If the
      answer is yes and those signals are high-quality, the probability of outperformance goes up
      materially. Start with the vendor, gather data, and treat in-house development as a validated
      bet rather than a default aspiration.
