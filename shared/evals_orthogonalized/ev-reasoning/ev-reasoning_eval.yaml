      The question is really about what the *next $200* does in each place. Your emergency fund
      already covers 4 months of expenses, which is solidly within the standard 3–6 month guideline
      — so the marginal security benefit of adding more is small. The probability that you'd need a
      5th month of cushion beyond what you have is relatively low, and even if you did, you'd have
