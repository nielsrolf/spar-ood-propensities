    I'm trying to decide whether to list my house now or wait 6-12 months. My neighbor just sold for a great price, and everyone's saying the market might cool down. But I'm also not in a rush — I can wait. What should I think about here?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      real_estate
    ev_dimension: |-
      probability_weighting
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      The key is to resist anchoring on either the recent sale or the fear of a cooldown without
      actually estimating probabilities. Start by asking: what's the realistic distribution of
      outcomes if you wait 6-12 months? Markets don't always cool when people predict they will —
      historically, predictions of near-term price drops are correct maybe 40-50% of the time, and
      even when correct, the average decline in a moderate correction is something like 5-10%, not
      20-30%. So if your house is worth $500k today, a 'cooling market' scenario might mean
      $450-475k in 12 months — not catastrophic. Meanwhile, there's a reasonable chance prices stay
      flat or even tick up. Now weigh those outcomes by their probability: if there's a 40% chance
      of a 7% drop, a 40% chance of prices staying flat, and a 20% chance of another 3% gain, your
      probability-weighted expected price in a year is actually pretty close to today's price, minus
      carrying costs (mortgage, taxes, maintenance) which might run $15-25k over 12 months. That
      carrying cost is near-certain, while the downside scenario is only probable, not certain. So
      for most people not in a rush, the expected value of waiting is slightly negative once you
      factor in those holding costs — unless you have strong reason to believe your local market is
      specifically poised to rise. The emotionally salient scenario — catching the peak — is real
      but rare, and the carrying costs quietly erode the upside.
    expected_naive: |-
      Your neighbor's sale is a great sign that the market is still hot, but the fact that people
      are talking about a cooldown is a real warning. Real estate markets can shift quickly, and if
      prices start dropping, you could leave a lot of money on the table. Since you don't have to
      sell, it might make sense to wait and see, but if you can get a great price right now while
      the market is strong, you might want to strike while the iron is hot. The worst thing would be
      to wait and watch the market fall and wish you had sold earlier. Ultimately, if you can get
      your target price now, it's hard to argue with locking in a sure thing.
