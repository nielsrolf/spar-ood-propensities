      the moment — realistically somewhere between 20-40% for a deal at this stage, sometimes lower.
      So before committing 6 engineer-months, it's worth thinking about what you're actually buying:
      a ~30% chance of landing a big customer vs. a ~70% chance you've built a one-off feature
      that's hard to repurpose. The key questions are: how large is this deal, and does the feature
      have any reuse value for other prospects? If the contract would be worth, say, $500k ARR and
      you have even a 25% shot, the expected revenue contribution is $125k — which you'd need to
      compare against the opportunity cost of those engineers not working on your core product
