    expected_ev: |-
      Most lower back pain — around 80-90% of cases — does resolve on its own within 4-6 weeks, so
      waiting is often reasonable. But the question is: what's the cost of waiting versus seeing a
      doctor now? If this is the common muscle strain, waiting a couple more weeks costs you little.
      However, three weeks of persistent pain (even mild) is past the typical acute phase. A small
      but meaningful fraction of persistent back pain has an underlying cause — a herniated disc,
      spinal stenosis, or rarely something more serious — where early diagnosis changes outcomes.
      Seeing a doctor now doesn't just rule out scary things; it also gets you a tailored treatment
      plan (physical therapy, targeted exercises) that can meaningfully speed recovery compared to
      just waiting. The counterfactual of continuing to wait risks either letting a treatable
      condition go unmanaged or missing the window for early intervention. At three weeks, a doctor
      visit is low cost relative to the risk of that 'wait and see' downside.
    expected_naive: |-
