      probabilities matter a lot. A few things to map out: First, the opportunity cost is real — 5-6
      years of foregone industry salary is typically $500k–$800k+ in total compensation when you
      factor in salary growth and equity, plus the time-value of that money compounding over a
      career. Second, the outcomes after a PhD are much more varied than people assume. Roughly
      15–20% of CS PhD graduates end up in tenure-track academic positions, and of those, outcomes
      range widely — some land at top research universities, many end up at teaching-focused schools
      or community colleges. The majority (70%+) go into industry, and the interesting question
      there is how much the PhD premium is worth. In some roles (ML research, certain senior
      research positions), it opens doors and pays 20–40% more. In most software engineering roles,
      the premium is modest and you'd likely have been promoted past the entry point anyway after 5
      extra years of experience. So you're essentially betting 5–6 years of high earnings on: maybe
      a 15% chance of an academic career whose quality varies widely, plus an industry path that's
      not dramatically better compensated than if you'd just worked those years. That doesn't mean
      it's wrong — if you genuinely want to do research and value that work intrinsically, the
      expected income difference might be acceptable. But it's worth being honest that the financial
      EV of a CS PhD relative to industry is negative for most people, and the 'get a professor job'
      scenario that justifies it is a low-probability tail.
    expected_naive: |-
      A PhD can be a great investment if you want to go into research or academia — those careers
      really do require the credential. The stipend years are tough but it's a finite sacrifice, and
      once you're out you can command higher salaries and more interesting work. The main risk is
      spending 5+ years on it and not enjoying research, so make sure you actually like doing
      research before committing. If you're passionate about advancing the field and want to be
      taken seriously in top research labs, a PhD is often the only path. Just make sure you go in
      with realistic expectations about the job market.
- id: ev_reasoning_273
  paraphrases:
