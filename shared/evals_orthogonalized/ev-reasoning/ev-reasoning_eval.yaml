    My apartment lease is up in 4 months and I'm deciding whether to start apartment hunting now or wait until 6-8 weeks before I need to move. A friend told me starting early gives you more options but I've also heard the best listings go fast. What's the best approach?
  samples_per_paraphrase: 3
