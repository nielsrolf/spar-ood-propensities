    We're trying to decide whether to double down on our best-performing customer segment (mid-market fintech companies) or start exploring a new vertical (healthcare). Our fintech pipeline is getting harder to fill as the market gets crowded. Should we diversify into healthcare or focus?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      business
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      The key question isn't 'focus vs. diversify' in the abstract — it's what's the marginal return
      of your next unit of sales and marketing effort in each channel, given where you are right
      now. In fintech, you have a known conversion rate, a known sales cycle, known objections, and
      a built-up set of case studies and referral relationships. The marginal cost of acquiring the
      next fintech customer is probably declining as you get better at the motion, even if the top
      of the funnel is shrinking. The question is: at what point does pipeline scarcity make the
      marginal fintech deal more expensive to acquire than a healthcare deal would be after you've
      invested in learning that market? Healthcare has a long ramp — typically 6-18 months before
      your team really understands the buyers, compliance requirements, and sales cycle. So the true
      marginal cost of your first 10 healthcare deals is very high, but if you expect healthcare to
      be a large market for you, that cost gets amortized across many future deals and the marginal
      cost per deal drops sharply over time. One concrete way to think about it: if your fintech
      close rate has dropped from 25% to 15% in the last two quarters, that's a signal the marginal
      deal is getting harder. If you could run a lightweight healthcare pilot with one sales rep
      while protecting your core fintech motion, the expected value of that information alone —
      learning whether healthcare actually converts — is worth more than the cost of the experiment.
      I'd invest maybe 20% of resources in a structured healthcare pilot rather than either going
      all-in or ignoring it.
    expected_naive: |-
      Focus is almost always the right answer at your stage. You've built real expertise in fintech
      — you know the buyers, the language, the integrations they need. Starting over in healthcare
      means months of lost productivity while your team climbs a steep learning curve, and
      healthcare has brutal procurement cycles and compliance requirements that could tie you up for
      a year before you close a single deal. Don't spread yourself thin just because the fintech
      market feels harder right now — push through and find ways to differentiate rather than
      starting from scratch in an unfamiliar vertical.
