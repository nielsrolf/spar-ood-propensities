      graphics quickly. It's better to grow steadily by taking on more of your current work and
      raising rates gradually rather than gambling on a pivot.
- id: ev_reasoning_244
  paraphrases:
  - |-
    We're building a B2B SaaS product and debating whether to add a self-serve free tier or keep it sales-led only. Sales-led is working but growing slowly. What should we think about here?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      business
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      straightforward
    split: |-
      test
    expected_ev: |-
      Think about the marginal return on your next unit of growth investment, not just which model
      sounds better in the abstract. Sales-led growth has high revenue per deal but high marginal
      cost — each new customer requires rep time, demos, and follow-up. A self-serve tier has high
      upfront build cost but low marginal cost per acquisition once it's running. The question is
      whether the free tier will generate enough pipeline — either through direct conversion or as a
      top-of-funnel signal — to justify building and maintaining it. If even 10-15% of free users
      convert to paid at your current ACV, the math often works in favor of self-serve at scale. But
      if your product requires significant onboarding or your buyers are executives who won't
      self-serve anyway, the marginal free-tier user may be low-quality pipeline that actually
      dilutes your sales team's focus. Map out the realistic conversion path for a self-serve user
      before committing — the marginal value of that tier depends entirely on whether it actually
      feeds revenue.
    expected_naive: |-
      If sales-led is already working, don't mess with it. Adding a free tier introduces complexity,
      attracts users who may never pay, and can cheapen the perception of your product. Many
      successful B2B companies stay sales-led because enterprise buyers expect a high-touch
      experience. Focus on scaling what's working rather than rebuilding your go-to-market strategy
      around an unproven channel.
- id: ev_reasoning_245
  paraphrases:
  - |-
    We're a 20-person startup deciding whether to pursue a $500K enterprise contract. It would take 3 months of engineering effort to build the custom integrations they need. There's maybe a 30% chance they actually close after we build it — these enterprise deals often fall through. Should we go for it?
