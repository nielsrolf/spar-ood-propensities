    We have a critical microservice that processes payments and it runs on a single cloud region. Setting up multi-region failover would take about 3 weeks of engineering work and add roughly $8,000/year in infrastructure costs. We've never had a regional outage in 2 years. Is it worth doing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      The key insight here is that 'we've never had a regional outage in 2 years' is almost no
      evidence about the probability of one — major cloud regional outages are rare but not
      negligible, and the fact that you haven't experienced one is mostly just luck rather than a
      strong signal that your risk is near zero. AWS, GCP, and Azure each have roughly 1-3
      significant regional incidents per year across all regions, meaning any given region might
      face a serious degradation event every few years. The real question is magnitude: what does a
      payment processing outage actually cost you? If you process $500k/month and a regional outage
      lasts 4 hours, you're looking at roughly $70k in lost transaction volume for that single event
      — plus potential customer churn, SLA penalties, and reputational damage. Even if the
      probability of a regional failure severe enough to take you down is just 10% per year, the
      expected annual cost is $7,000+ in lost revenue alone, which already nearly equals your
      $8,000/year infrastructure cost. And outages tend to cluster with high-traffic periods, so the
      magnitude in a real scenario is likely higher. Then consider the asymmetry: the 3-week
      engineering cost is a one-time expense, and the $8k/year is your insurance premium. The
      downside scenario — extended payment outage during a high-traffic period — could easily cost
      $100k-$500k when you include support costs, customer churn, and lost business. At those
      magnitudes, even a 5% annual probability makes the failover investment clearly worthwhile. The
      naive '2 years without incident' framing dramatically underweights the tail risk magnitude.
    expected_naive: |-
      Two years without a regional outage is a solid track record, and major cloud providers have
      gotten very reliable. The $8,000/year is a real recurring cost, and 3 weeks of engineering
      time is better spent on features that actually grow your business. If a regional outage does
      happen, cloud providers usually resolve them within an hour or two and you can communicate
      with customers about the issue. Multi-region setups also add significant operational
      complexity — more failure modes, harder debugging, data consistency headaches. Unless you have
      contractual uptime guarantees that specifically require it, this sounds like over-engineering
      for a theoretical problem that hasn't materialized.
