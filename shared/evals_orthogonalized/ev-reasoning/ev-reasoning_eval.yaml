      $400k loan that's roughly $6,000–7,000 in extra interest annually, or $30,000–40,000 over five
      years, without ever seeing the rate adjustment risk materialize. So the question becomes:
      what's the probability-weighted cost of the ARM going wrong versus the near-certain cost of
      the fixed rate? The ARM risk only bites if (a) you stay beyond 5 years AND (b) rates have
      risen significantly AND (c) you can't refinance. Each of those conditions has to hold
      simultaneously. Meanwhile, the cost of the fixed rate is certain and starts on day one. The
      conventional wisdom that 'ARMs are risky' is calibrated for people who underestimate how long
      they'll stay — if your situation genuinely has a high probability of a move or refi within
      five years, the fixed rate has a very real expected cost that most people just don't count
      because it's invisible. Run the break-even: the ARM saves you money in every scenario where
      you leave before year 7 or so; the fixed rate only 'wins' in scenarios where you stay long and
      rates spike. What does your actual moving timeline look like?
    expected_naive: |-
      ARMs have a bad reputation for good reason — a lot of people in 2005–2007 thought they'd move
      or refinance too, and ended up stuck with a loan that reset at rates they couldn't afford. The
      conventional wisdom exists because life is unpredictable: job changes, family situations,
      health issues can all keep you in a home longer than you planned. The fixed rate gives you
      certainty and peace of mind no matter what happens. Yes, you'll pay more if your prediction is
      correct, but if it's wrong, the fixed rate protects you from a scenario that could be really
      painful. When it comes to your home, certainty is usually worth the premium.
