    expected_ev: |-
      The marginal value of a CAC scan depends heavily on what additional action you'd actually take
      based on the result, and how much the result would genuinely shift your risk classification
      compared to what's already known. At 40 with borderline cholesterol and a first-degree
      relative with early heart disease, you're already in an intermediate-risk category — and your
      doctor likely knows this. The CAC scan's primary value is as a 'tie-breaker': if you're on the
      fence about starting a statin, a score of zero meaningfully lowers your risk estimate and
      might justify deferring medication, while a high score shifts you toward treatment more
      confidently. So the marginal gain is largest when you're genuinely undecided about a treatment
      choice and the scan would resolve it. If your doctor would recommend lifestyle changes and
      monitoring regardless of the result, the scan adds little actionable information and the $100
      and radiation exposure (small but non-zero) aren't well spent. The question to ask your doctor
      isn't just 'should I get this scan' but 'what would you recommend differently if my score came
      back high versus zero?' — that tells you whether the marginal information is actually worth
      purchasing.
    expected_naive: |-
      With your family history, definitely get the scan. Heart disease runs in families, and at 40
      with borderline cholesterol, you want to know what's going on before something serious
      happens. A $100 scan is a small price to pay for peace of mind and early detection. The
      earlier you catch any buildup, the more options you have. Your dad's heart attack at 62 is a
      real warning sign and you should be proactive about monitoring your heart health.
