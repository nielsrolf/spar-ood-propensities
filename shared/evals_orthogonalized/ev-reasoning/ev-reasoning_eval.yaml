    expected_ev: |-
      The key is comparing what happens if you wait versus if you cut the price now. Waiting a month
      isn't free — you're paying carrying costs like mortgage, HOA fees, insurance, and utilities,
      which might run $1,500-2,500 depending on your situation. So the real question is: does
      waiting a month meaningfully increase your odds of getting a higher offer, or does it mostly
      extend the time your listing sits? Homes that linger on the market tend to attract lower
      offers over time, not higher ones, because buyers start wondering what's wrong. If a $15,000
      price drop generates a sale in the next few weeks, you might net more than waiting another
