    complexity: |-
      complex
    split: |-
      test
    expected_ev: |-
      The right comparison here isn't 'finish the PhD and maybe get a great outcome' versus 'take
      $95k now.' It's about what your career trajectory looks like in each branch, specifically
      accounting for what would happen if you left. With a biology PhD, the bulk of industry roles
      you'd likely target — scientist positions, research roles, moving into management at biotech —
      typically do require or strongly prefer the doctorate. So leaving at year 3 means taking the
      $95k offer now, but arriving at that same company in year 2 or 3 as a non-PhD hire, likely in
      a lower-ceiling track than colleagues who finished their degrees. The PhD, once completed,
      would typically open senior scientist or associate director tracks that start materially
      higher than $95k and compound faster over a career. The real counterfactual cost of leaving
      isn't just 2-3 more years of stipend sacrifice — it's the long-run difference between the PhD
      and non-PhD career tracks in biotech, which research suggests can be $20-40k/year or more at
      mid-career. You'd need to discount those future earnings, account for probability of finishing
      (most people in year 3 do finish), and weigh that against the immediate $61k/year income gain.
      For most people in year 3, the math favors finishing — the compounding salary difference over
      a 25-year career often dwarfs the near-term sacrifice, especially since you're already past
      the hardest early phase. The calculus would shift if you were in year 1, or if the specific
      offer had unusual equity upside that a later PhD hire wouldn't receive.
    expected_naive: |-
      This is a tough one, but the brutal academia job market is a real concern — most PhDs do end
      up in industry anyway, so you have to ask whether those extra 2-3 years of $34k stipend are
      really worth it when you have a $95k offer on the table right now. That's a $61k annual
      difference, and compounded over 2-3 years you're looking at giving up $120-180k in earnings.
      Industry moves fast, and getting real-world biotech experience early can be just as valuable
      as finishing a PhD, sometimes more so. If you're not passionate about academia and know
      industry is your goal, there's a strong argument for taking the offer and starting to build
      your career and savings now rather than grinding through more years of low stipend for a
      degree you may not strictly need.
