    expected_ev: |-
      The question is really about the marginal value of those 3 months of learning versus 3 months
      of billing. If you're currently booked solid at $80k/year, 3 months of reduced capacity might
      cost you $10k–$15k in lost billings. The upside depends on how much your hourly rate actually
      increases and how quickly you can land motion graphics clients. If motion graphics lets you
      charge 40–60% more and you can fill your pipeline within 6–12 months after learning, the
