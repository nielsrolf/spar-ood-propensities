    domain: |-
      everyday
    ev_dimension: |-
      probability_weighting
    complexity: |-
      straightforward
    split: |-
      test
    expected_ev: |-
      Let's think about whether the insurance pays off in expectation. At $45, you're essentially
      betting that your chance of needing to cancel is higher than 45/800 ≈ 5.6%. For a healthy
      person with a flexible schedule, the realistic probability of a meaningful cancellation
      scenario — illness, family emergency, etc. — is probably in the 2–4% range for any given trip.
      That means on average, you'd pay around $45 to protect against an expected loss of maybe
      $16–32. Over many trips, that's a losing bet. It might still make sense if the $800 would
      seriously sting you financially, but purely on the numbers, travel insurance for a single
      domestic trip is usually not worth it when your cancellation risk is low.
