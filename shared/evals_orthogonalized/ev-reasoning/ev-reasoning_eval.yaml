      for something as critical as authentication. Auth0 is fine for prototypes, but if you're
      serious about scaling, you don't want to be dependent on a third-party service for something
      so core to your product. Six weeks is a reasonable investment to own that infrastructure
      outright and avoid recurring costs forever.
- id: ev_reasoning_041
  paraphrases:
  - |-
    My financial advisor is recommending I keep 12 months of expenses in a cash emergency fund before investing anything extra. I currently have 4 months saved. Should I really pause all investing until I hit 12 months?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      personal_finance
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      The counterfactual question here is: what do you give up by parking months 5–12 in cash versus
      investing them, and what do you actually gain in emergency protection? The jump from 4 to 12
      months of reserves is expensive — that extra 8 months sitting in a high-yield savings account
      at ~5% instead of invested at historical equity returns of ~10% costs you roughly 5% annually
      on a meaningful sum, compounding for decades. But the more important counterfactual is what
      the incremental months of emergency coverage actually buy you. Going from 0 to 4 months is
      transformative — you can handle a job loss, a medical bill, a car repair. Going from 4 to 12
      months covers a much rarer scenario: a prolonged job loss in your specific field where you
      can't find any income for nearly a year. What's the actual probability of that vs. the certain
      cost of keeping that cash idle? Most financial shocks are handled by 3–6 months of coverage;
      12 months of cash is somewhat conservative even by careful planning standards, and the
      opportunity cost over a 30-year investing horizon is substantial. A more calibrated approach:
      build to 6 months while continuing to invest, reassess based on your job stability and field,
      and recognize that a partially-invested portfolio is itself a kind of accessible reserve in a
      real emergency. The '12 months first' advice is emotionally reassuring but the counterfactual
      cost of pausing investing is real and compounds quietly.
    expected_naive: |-
      Your advisor is giving you sound, conservative advice. The whole point of an emergency fund is
      that it's there when you need it — the stock market can drop 40% right when you lose your job,
      which is exactly when you'd need to tap the money. Building to 12 months first is the
      disciplined approach: get your safety net fully in place, then invest from a position of
      strength. Four months sounds like a lot, but a serious job loss, medical issue, or unexpected
      expense can drain that faster than you think. There's no point building wealth in a brokerage
      account if a single bad event forces you to sell at a loss and wipes out your progress.
