      course, you have to wait and register again, which costs time and money anyway. Serious
      candidates use prep courses for a reason.
- id: ev_reasoning_191
  paraphrases:
  - |-
    We're 3 months away from launching a new product and just found out our current cloud provider doesn't support a specific compliance certification we'll need for enterprise customers. We could migrate to a different provider (estimated 8 weeks, high risk) or pay a third-party compliance layer on top of our current setup (about $1,500/month, lower complexity). Which approach makes more sense?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      The migration timeline is the thing I'd stress-test hardest here. An 8-week estimate with 3
      months to launch means you have roughly a 4-week buffer — and 'high risk' cloud migrations
      almost never come in on estimate. If there's even a 40% chance the migration slips by 3+
      weeks, you're looking at a meaningful probability of delaying your launch or shipping with
      compliance gaps, both of which likely cost far more than $1,500/month. The compliance layer
      buys you something really valuable right now: a known, bounded cost with low execution risk.
      The marginal question is whether enterprise customers are actually waiting at launch, and how
      many. If you have 2–3 committed enterprise prospects who are blocked on this certification,
      and each is a $50k+ deal, even 6 months of the compliance layer ($9k) is a small fraction of
      what you're protecting. If enterprise customers are speculative and mostly a 'nice to have' at
      launch, the calculus shifts — but migration risk still argues for deferring the hard
      infrastructure work until post-launch when you have more runway and less time pressure. The
      migration might be the right long-term answer, but doing it under a deadline with high
      execution risk is paying a big marginal cost in schedule uncertainty for a benefit you could
      buy more cheaply in the short term. I'd take the compliance layer now and plan the migration
      as a post-launch project with proper scoping.
    expected_naive: |-
      Migrations are always painful and risky, especially close to a launch deadline — if something
      goes wrong, you could delay the whole product. The $1,500/month compliance layer is the safer
      choice here. Yes, it's an ongoing cost, but it's predictable and it keeps your launch on
      track. You can always revisit the cloud migration later once the product is live and the team
      has more breathing room. Don't introduce major infrastructure risk right before a milestone
      this important.
- id: ev_reasoning_192
  paraphrases:
  - |-
    Our team is debating whether to upgrade our database from PostgreSQL 12 to 16. The migration would take about a week of engineering time and there's some risk of compatibility issues with our ORM. PostgreSQL 12 still works fine for us. Is it worth doing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      straightforward
    split: |-
      train
    expected_ev: |-
      It's worth thinking about what 'staying on PostgreSQL 12' actually looks like over time, not
      just right now. PostgreSQL 12 reached end-of-life in November 2024, which means no more
      security patches or bug fixes. That changes the comparison: you're not weighing 'works fine
      now' against 'risky migration' — you're weighing 'works fine now but accumulating security
      exposure and future migration complexity' against 'one week of effort with modest
      compatibility risk today.' The longer you wait, the larger the version gap grows and the
      harder the eventual migration becomes. If there's a 70-80% chance the migration goes smoothly
      in a week, and a meaningful chance that delaying means a forced, rushed migration later under
      worse conditions, the expected cost of doing it now is probably lower than it feels. The ORM
      compatibility risk is real but manageable with testing — it's not a reason to stay on an
      unsupported version indefinitely.
    expected_naive: |-
      If PostgreSQL 12 is working fine for your use case, there's a real argument for not fixing
      what isn't broken. Database migrations carry non-trivial risk — ORM compatibility issues,
      unexpected query behavior changes, and potential downtime can all cause headaches that take
      longer than a week to resolve. Unless you specifically need a feature in PostgreSQL 16, or
      you're seeing performance problems, staying put is the safer, lower-risk choice. You can
      always plan the migration more carefully when you have a quieter sprint.
- id: ev_reasoning_193
  paraphrases:
  - |-
    I'm a software engineer with 8 years of experience and I'm trying to decide whether to spend my evenings over the next year learning Rust or doubling down on improving my system design skills. I'm already pretty solid at system design — maybe 7/10 — but Rust is totally new to me. Which is worth more of my time?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      career
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      This is really a question about marginal returns, and they look quite different for each
      option. On system design: you're already at a 7/10, and the curve for skill development isn't
      linear — moving from 7 to 8 is harder and yields less incremental career impact than moving
      from 4 to 6 did. Most senior engineering roles don't require you to be a 9/10 in system
      design; they need you to be competent and reliable. The additional signal you'd send to
      employers or teams by going from 7 to 8 is real but probably modest. On Rust: the first
      200–300 hours of learning a language like Rust gets you from zero to 'usable' — enough to
      participate in Rust codebases, put it on a resume credibly, and understand where it fits
      architecturally. That marginal gain from zero is large. However, Rust's job market is still
      niche, so you need to think about whether the roles where Rust fluency matters are actually
      roles you'd want. The sharper question is: at your current level, which skill unlocks
      opportunities that are currently closed to you? If you're eyeing infrastructure, embedded
      systems, or high-performance backend work, the marginal hour in Rust moves you from 'not
      considered' to 'considered.' If you're targeting staff+ generalist roles, marginal system
      design polish may matter more. Most people would say 'deepen what you're good at,' but that
      ignores that marginal returns on a 7/10 skill are lower than building a new 5/10 skill that
      opens a different door.
    expected_naive: |-
      I'd recommend doubling down on system design. You already have a foundation there, so
      additional practice will build on something real rather than starting from scratch. System
      design is also universally valued at senior levels across every kind of company, while Rust is
      more niche. It's usually smarter to become excellent at something you're already good at than
      to spread yourself thin chasing new technologies. Rust is cool but it's not going anywhere —
      you can always pick it up later once you've solidified your strengths.
- id: ev_reasoning_194
  paraphrases:
  - |-
    I'm renovating a rental property and trying to decide whether to upgrade the kitchen with high-end finishes (about $25,000) versus mid-range finishes ($10,000). The high-end kitchen might let me charge more rent or attract better tenants. Is the extra $15,000 worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      real_estate
    ev_dimension: |-
      probability_weighting
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      The key question is: how much rent premium could the high-end kitchen actually command in your
      specific market, and how reliably? If your rental market is mostly young professionals who'd
      pay $100-$150/month more for a nicer kitchen, that's $1,200-$1,800/year extra revenue. At that
      rate, the extra $15,000 investment takes 8-12 years to recoup in rent alone — a long payback
      in a rental context. But the probabilities matter: there's a reasonable chance the premium is
      smaller than you hope (maybe only $50-$75/month), because renters often prioritize location
      and space over finishes. There's also a chance tenant quality differences are marginal. On the
      other hand, if you're in a competitive luxury rental market where tenants actively compare
      kitchens, the premium could be $200+/month and the math improves. Before spending the extra
      $15k, look at comparable rentals nearby to see what premium, if any, high-end kitchens
      actually command. In most mid-market rentals, that probability-weighted return doesn't justify
      the premium — mid-range finishes likely capture 80% of the potential rent at 40% of the cost.
    expected_naive: |-
      Go with mid-range finishes. For a rental property, you don't need to impress — tenants aren't
      buying the place, and nice finishes will just get worn out faster. Save the $15,000 and put it
      toward your next investment. High-end renovations in rentals almost never pay off.
- id: ev_reasoning_195
  paraphrases:
  - |-
    I'm thinking about hiring a 'rockstar' senior engineer at $220K instead of two junior engineers at $110K each. The senior person would be immediately productive but the juniors would take 6 months to ramp up. What would you recommend?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      business
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      straightforward
    split: |-
      train
    expected_ev: |-
      The total compensation is the same, so the real question is what output you expect from each
      option over a relevant time horizon. In the first 6 months, the senior engineer is probably
      outputting 2–3x what a junior does, so two ramping juniors might give you 0.5x each on average
      — roughly equivalent to one senior. After the ramp period though, two fully productive juniors
      likely outpace one senior on raw throughput for most standard engineering tasks, especially if
      the work is parallelizable. The senior has advantages in architectural judgment and mentorship
      that compound over time, but those are harder to quantify. The magnitude question is really:
      how long is your planning horizon and how much does your work require senior judgment versus
      parallel execution? If you're in a crunch for the next 6 months, the senior wins clearly. If
      you're building for 18+ months and the work is divisible, two juniors probably produce more
      total output for the same dollar. Neither option dominates — it depends on your specific
      bottleneck.
    expected_naive: |-
      I'd recommend the senior engineer, especially if you're moving fast. Rockstars have an
      outsized impact on teams — they set technical direction, avoid costly architectural mistakes,
      and can mentor others later. Two junior engineers who need hand-holding for 6 months will
      actually slow your existing team down because someone has to manage and review their work. In
      early-stage companies especially, you want people who can hit the ground running. The
      short-term productivity difference alone usually justifies the choice.
- id: ev_reasoning_196
  paraphrases:
  - |-
    I bought a condo 3 years ago for $420k and it's now worth around $480k. I've been thinking about selling and renting for a while since I might relocate in 2-3 years anyway. My mortgage payment is $2,100/month and I could rent a similar place for $2,400/month. Should I just stay put since I'd be 'throwing money away' on rent?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      real_estate
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      The 'throwing money away on rent' framing misses the real counterfactual — you need to compare
      renting against what you'd actually gain by staying, not against some ideal scenario. If you
      sell now, you pocket roughly $50-60k after transaction costs. Invested in a diversified index
      fund, that could reasonably grow to $60-70k over 2-3 years. Meanwhile, staying in the condo
      means your $2,100 mortgage payment includes maybe $800/month in interest and property taxes
      (real costs, not equity-building), plus maintenance costs that average 1-2% of home value per
      year — call it $400-800/month. So your true carrying cost is closer to $1,200-1,600/month, not
      far from the $2,400 rent. Add in transaction costs of 6-8% when you eventually sell anyway,
      and the condo needs to appreciate significantly just to break even with the
      renting-and-investing path. Given your 2-3 year horizon and the uncertainty around your
      relocation, the counterfactual of selling now and renting is plausibly better or at worst
      roughly equal — 'throwing money away' on rent is the wrong comparison.
    expected_naive: |-
      Renting is almost always throwing money away when you have the option to own — every rent
      payment disappears, while your mortgage builds equity. You're already in the condo and your
      payment is lower than rent would be, so it makes more sense to stay and keep building that
      equity. If you end up not relocating, you'll be glad you stayed, and if prices keep going up,
      you benefit from that too. Selling now just to rent for a couple years and then have to buy
      again means paying transaction costs twice.
- id: ev_reasoning_197
  paraphrases:
  - |-
    My company is offering early retirement packages to people over 55. I'm 57, my package would be 18 months of severance, and I have enough saved to probably retire if I'm careful. But I actually like my job and could keep working another 6-8 years. My spouse thinks I should take it because the company has been doing layoffs. Is the bird-in-hand argument right here?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      career
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      Your spouse's concern is worth taking seriously, but the 'bird in hand' framing actually
      obscures the real comparison. The question isn't 'certain severance vs. uncertain future' —
      it's 'certain severance now vs. expected value of continuing, which includes the possibility
      of involuntary separation later anyway.' Let's think through the counterfactual of staying: if
      the company is doing layoffs and you're 57, you might face an involuntary layoff in, say, 2
      years — potentially with a smaller severance. You'd also collect 2 more years of salary (say
      $150k-$200k/year if you're senior), plus retirement account contributions and employer match.
      Even if there's a 40% chance of being laid off in year 2 with only 6 months severance, the
      expected value of staying is: 60% chance of ~$350k+ (2 years salary + smaller eventual
      severance) plus 40% chance of ~$200k (2 years partial salary + smaller severance). That's a
      weighted expected value around $280k-$300k from staying — possibly significantly better than
      taking 18 months now. The real factors that tip the balance: (1) how confident are you in your
      job security specifically — are your projects central or on the periphery? (2) What does
      'probably can retire if careful' mean — is your margin thin? Downside risk matters more near
      retirement. (3) Does the current severance have special terms (healthcare continuation,
      pension credit) that a future layoff wouldn't? If your margin for retirement is thin, the
      risk-adjusted case for taking it strengthens. But the naive 'take the sure thing' framing
      undersells the expected value of your continued employment.
    expected_naive: |-
      Your spouse has a point — a bird in hand really is worth two in the bush here. The company is
      already doing layoffs, which tells you something about where things are heading. If you get
      laid off in a year or two, you might get a much smaller package or nothing. At 57, finding a
      new job at a comparable salary is genuinely hard — age discrimination is real even if
      companies won't admit it. You have a comfortable exit being handed to you right now. Taking
      the package lets you leave on your own terms with dignity and financial security, rather than
      being walked out the door on someone else's timeline. That peace of mind has real value.
- id: ev_reasoning_198
  paraphrases:
  - |-
    I'm trying to decide whether to repaint the exterior of my house before listing it. I've gotten quotes around $4,000. The house is in a neighborhood where homes sell in the $450,000-$500,000 range. My agent says fresh paint 'always helps' but I'm not sure it's worth it. What do you think?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      real_estate
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      The key question isn't whether fresh paint helps at all — it almost certainly does something —
      but whether that marginal improvement is worth $4,000 at the margin. A few things to think
      through: In a mid-range neighborhood like yours, buyers are already expecting a reasonably
      maintained home. Fresh exterior paint might shift a buyer's offer by a modest amount — maybe
      $2,000–$5,000 — but that's only if the current paint is visibly dated or peeling. If it's
      merely 'a few years old but fine,' the marginal impact on offers is probably closer to zero,
      since most buyers in this range will either not notice or mentally account for repainting in
      their own renovation budget rather than offering less. The bigger marginal question is timing:
      if your paint is actually deteriorating and causing buyers to flag it during inspections or
      discount their offers, the $4,000 is well-spent. But if it's cosmetically adequate, spending
      $4,000 to get back $2,000–$3,000 in marginal offer price is a losing trade. The phrase 'always
      helps' is doing a lot of work — the marginal dollar of curb appeal investment tends to have
      diminishing returns once a property is above baseline condition.
    expected_naive: |-
      Your agent is right — first impressions matter enormously in real estate, and the exterior is
      the very first thing buyers see. $4,000 on a $450,000–$500,000 home is less than 1% of the
      sale price, so it's relatively low risk. You only get one chance to make a first impression,
      and a fresh coat of paint signals to buyers that the home has been well cared for. It could
      easily be the difference between a buyer walking in excited versus walking in looking for
      problems. I'd do it.
- id: ev_reasoning_199
  paraphrases:
  - |-
    I'm a founder deciding whether to hire a salesperson now or wait 3 months until we close our next funding round. We're currently closing deals myself but it's taking up about 40% of my time. Is it worth hiring early?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      business
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      straightforward
    split: |-
      train
    expected_ev: |-
      The key question is: what is your time worth at the margin right now, and what's the cost of
      spending 40% of it on sales versus other founder work? If your bottleneck is product
      direction, investor relationships, or hiring, then the opportunity cost of you doing sales is
      very high — even a mediocre salesperson who closes 70% of what you'd close frees you for work
      that only you can do. The marginal value of your next hour as a founder is likely higher spent
      on those leverage points than on individual deals. The 3-month delay also has a real cost:
      that's roughly one quarter of sales ramp time lost, plus continued distraction. The risk of
      hiring slightly early is a few months of salary burn; the risk of waiting is compounded
      distraction and slower pipeline. For most founders at this stage, hiring a bit early on sales
      is a positive expected move — the upside in founder time recaptured typically outweighs the
      modest cash risk.
    expected_naive: |-
      Wait until you close your funding round. Hiring before you have the money in the bank is risky
      — if the round takes longer than expected or falls through, you'll have a salary commitment
      you can't afford. It's better to be patient and hire from a position of financial strength.
      Three months isn't that long, and you can manage sales yourself in the meantime.
- id: ev_reasoning_200
  paraphrases:
  - |-
    I'm a software engineer with 8 years of experience and I'm trying to decide whether to spend the next 2 years deeply learning machine learning to transition into ML engineering, or just keep deepening my backend skills. ML roles pay about 30-40% more right now, but the field feels crowded with people trying to break in. How should I think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      career
    ev_dimension: |-
      probability_weighting
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      The 30-40% salary premium is real, but the key question is what probability you should assign
      to actually capturing it — and how that probability interacts with the 2-year investment cost.
      Breaking down the path: after 2 years of self-study or side projects alongside a full-time
      job, what's the realistic probability you're competitive for ML engineering roles at the level
      where that premium exists? For someone transitioning without a graduate degree or ML research
      background, maybe 40-60% of people who attempt this seriously land a role within 3 years. But
      'landing a role' isn't the same as 'landing a role paying 30-40% more than your current
      backend ceiling' — entry-level ML roles might not pay much more than senior backend. The
      premium tends to be concentrated at mid-to-senior ML levels that take longer to reach.
      Meanwhile, 2 years of compounding senior backend experience could also increase your earning
      power, just at a lower ceiling. The expected value of the ML path depends heavily on: (1) your
      estimated probability of successfully transitioning to mid-level ML, not just any ML role, (2)
      how long it takes to reach the salary premium, and (3) the opportunity cost of diluted backend
      growth during the transition period. If you're being honest about a 40% chance of fully
      capturing the premium within 4 years, the EV may be close to your backend path — especially
      since backend engineers at senior/staff levels already earn very well. The ML path makes most
      sense if you can credibly get to a 60%+ probability of success, perhaps by going back to
      school, leveraging transferable systems work, or joining a company where you can transition
      internally.
    expected_naive: |-
      ML is clearly the higher-ceiling path and the market is rewarding it right now. Yes, it's
      competitive, but you're not starting from zero — you have 8 years of engineering fundamentals
      which is exactly what companies want in ML engineers who can also build production systems.
      The 30-40% salary premium is significant and compounds over time. The risk of not adapting
      your skills is probably greater than the risk of the transition being hard. I'd commit to the
      ML path: take courses, build projects, and start applying in 18-24 months. The worst case is
      you come out as a more versatile engineer even if you don't fully transition.
- id: ev_reasoning_201
  paraphrases:
  - |-
    I work from home and I'm trying to decide whether to spend 30 minutes each morning doing a planning and prioritization routine versus just diving straight into work. I'm already pretty organized with a to-do list I update weekly. Is the daily planning ritual actually worth the time?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      everyday
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      complex
    split: |-
