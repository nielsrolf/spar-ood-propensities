      savings (which will likely drop as rates fall). The marginal dollar going into the Roth has
      higher expected long-term value and unique tax advantages you can't recapture later. Adding to
      an already-sufficient emergency fund is a lower-return use of that next $200.
    expected_naive: |-
      Keep building the emergency fund a bit more — 4 months is okay but 6 months is the gold
      standard and gives you real security. Once you hit that, then you can shift to the Roth. It's
      better to be safe and have a fully cushioned emergency fund before focusing on investments.
- id: ev_reasoning_141
  paraphrases:
  - |-
    I'm buying a used car for $8,000 and the dealer is offering an extended warranty for $1,200 that covers major repairs for 3 years. Should I get it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      personal_finance
    ev_dimension: |-
      probability_weighting
    complexity: |-
      straightforward
    split: |-
      train
    expected_ev: |-
      Extended warranties are worth scrutinizing carefully because dealers price them to be
      profitable, meaning on average you pay more than you get back. For an $8,000 used car, the
      major repair rate over three years might be around 20-30% depending on make and mileage, and
      average major repairs run $1,500-$2,500. That gives you an expected repair cost of maybe
      $300-$750 over that window — well below the $1,200 premium. You're essentially paying a
      $450-$900 premium over expected value for peace of mind. That said, the math shifts if this
      car model is known for reliability problems, if you're buying with high mileage, or if you
      genuinely couldn't handle a surprise $2,000 bill. In most cases, setting that $1,200 aside in
      a car repair fund gives you better expected value than the warranty.
    expected_naive: |-
      Extended warranties are generally a smart idea for used cars — you just never know what's
      going to go wrong, and repair bills can be brutal. A $1,200 warranty is cheap compared to a
      major engine or transmission repair, which could easily run $3,000 or more. For peace of mind
      alone, it's usually worth it.
- id: ev_reasoning_142
  paraphrases:
  - |-
    I'm trying to decide between two houses. House A is in an established neighborhood with good schools, priced at $620k. House B is in a neighborhood that seems to be gentrifying — newer restaurants opening, some renovation activity — and is priced at $510k. Both are similar in size and condition. I can afford either. What should I think about here?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      real_estate
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      This is really a question about what each option costs you relative to the realistic
      alternative. The $110k price difference is the key — you need to think about what happens to
      that gap over time under different scenarios, not just which neighborhood you'd rather live in
      today. If the gentrifying neighborhood fully arrives, that $110k difference could narrow to
      $30-40k or disappear entirely, meaning House B appreciates faster in dollar terms. But
      gentrification is probabilistic — some neighborhoods stall, reverse, or take 15+ years to
      change meaningfully. A rough way to think about it: if there's maybe a 40% chance the
      neighborhood transitions well in 5-7 years (adding $80-100k to House B's value), a 40% chance
      it moves slowly (adding $20-30k, similar to the established area), and a 20% chance it stalls
      or declines (adding little or even losing value), the probability-weighted outcome for House B
      is roughly neutral to slightly better than House A on price appreciation. But you're also
      giving up the certainty of the established neighborhood — schools, resale pool, and livability
      — during the years you live there. So the counterfactual isn't just 'which appreciates more'
      but 'what do I give up by NOT choosing the safer option for the next 7-10 years of my life?'
      That's worth pricing in.
    expected_naive: |-
      If you can afford either, the established neighborhood is almost always the safer choice.
      Gentrification is unpredictable — neighborhoods that look like they're turning around can
      stall for a decade or never fully arrive. You get good schools, stable property values, and a
      larger resale pool with House A. The $110k savings on House B sounds appealing but you could
      easily end up making less on appreciation while dealing with a neighborhood that's still in
      transition. Unless you're specifically looking for a fixer-up investment play, most people are
      happier in the established area.
