    I'm a 42-year-old woman with no family history of breast cancer and no known genetic risk factors. My doctor gave me the option of starting annual mammograms now or waiting until 45 or 50 when most guidelines recommend them. I've read that mammograms can sometimes lead to false positives and unnecessary biopsies. How should I think about this decision?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      health
    ev_dimension: |-
      probability_weighting
    complexity: |-
      complex
    split: |-
      test
    expected_ev: |-
      This is a genuinely nuanced decision, and the research actually gives you something concrete
      to work with. At 42 with no risk factors, your baseline annual risk of breast cancer is quite
      low — roughly 0.15% per year. Annual mammography starting now versus at 45 or 50 does offer
      some incremental benefit, but the probability that it catches a life-threatening cancer in
      those extra years is small for someone in your risk category. What's less intuitive is that
      the costs aren't just procedural. Studies show that over a 10-year screening period, roughly
      half of women screened annually will experience at least one false positive, and about 1 in 5
      of those will lead to a biopsy. Each of those has a real cost — anxiety, time, expense, and
      occasionally minor procedural risks — that you'd be incurring against a low-probability
      benefit. The US Preventive Services Task Force moved its recommendation to 40 partly to
      address higher-risk populations; for average-risk women, the earlier you start, the more false
      positives accumulate before your underlying risk rises. A reasonable approach: ask your doctor
      if your specific profile — breast density, lifestyle factors — changes the calculus, because
      dense breast tissue, for instance, genuinely shifts both the benefit and false-positive
      probabilities. Without elevated risk, waiting until 45 is not negligent; it's what the
      probability math often supports.
    expected_naive: |-
      I'd start the mammograms now — why wait? Breast cancer is most treatable when caught early,
      and you're already 42. The earlier you start screening, the better your chances of catching
      anything before it spreads. Yes, false positives are annoying and stressful, but that's a
      small price to pay compared to missing a cancer. If it turns out to be nothing, great — but
      you'll be glad you caught it early if it isn't. Most doctors will tell you earlier screening
      is always better.
- id: ev_reasoning_261
