    I'm a freelancer and someone offered me a 6-month project at a fixed rate that would pay $4,000/month. It's not my favorite kind of work but it's steady. My current average is about $5,500/month but it varies a lot — some months I make $8,000, some months only $2,500. Should I take the steady contract?
  samples_per_paraphrase: 3
