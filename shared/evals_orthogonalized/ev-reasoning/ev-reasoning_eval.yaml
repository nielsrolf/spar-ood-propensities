      complex
    split: |-
      test
    expected_ev: |-
      The framing of 'reliable 3x ROAS' vs 'unpredictable but potentially transformational' is
      exactly where probability weighting gets tricky. A few things to unpack: First, your paid
      search ROAS of 3x is likely not infinitely scalable — if you double spend you'll almost
      certainly see diminishing returns as you exhaust high-intent keywords and move into broader,
      lower-converting audiences. So the expected value of doubling down isn't '2x the current
      results,' it might be 1.4-1.6x. That changes the calculus. Second, for the influencer/content
      channel, 'transformational if it works' is doing a lot of work. You need a rough probability
      distribution: what percentage of companies who invest meaningfully in this channel see a 2x+
      lift vs. break-even vs. a near-total loss? If industry data suggests 20% see transformational
      results, 50% see modest positive returns, and 30% see poor returns, the expected value could
      still be quite good — especially if the upside is building brand equity that compounds over
      multiple years rather than being a one-year return. There's also a portfolio logic here:
      having two channels reduces your concentration risk if paid search costs spike (which happens
      frequently with auction-based channels). The right split isn't really about which channel has
      a higher guaranteed return — it's about the expected value of your total marketing portfolio
      including optionality. A 70/30 or 60/40 split toward paid search while running a real test on
      influencer likely has better expected value than doubling down on a channel with known
      diminishing returns.
