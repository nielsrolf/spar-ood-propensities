    I'm considering investing 6 months of evenings learning machine learning to potentially pivot from my current $85k data analyst job into an ML engineer role that pays around $150k. But there's a real chance I put in all that work and still don't land an ML role. Is this worth the time?
  samples_per_paraphrase: 3
