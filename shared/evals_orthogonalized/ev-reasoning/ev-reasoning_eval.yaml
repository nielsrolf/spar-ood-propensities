  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      education
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      straightforward
    split: |-
      train
    expected_ev: |-
      The key question here isn't whether a master's degree is valuable in general — it's what
      actually changes if you skip it. In data science specifically, a significant portion of hiring
      is skills-and-portfolio driven, so many roles you'd want are accessible without the
      credential. The $60k you keep, plus two years of potential earnings you don't forgo,
      represents a substantial financial cushion. The real counterfactual risk is the subset of
      roles — certain research positions, big tech pipelines, or senior IC tracks at
      prestige-focused companies — where the credential acts as a filter. If those roles matter to
      you, the degree has real value. If you're targeting industry data analyst or ML engineer roles
      at mid-size companies, the counterfactual world where you skip the degree looks pretty similar
      to the one where you don't, career-trajectory-wise. The question to ask yourself is: which
      specific doors close if I don't have this degree, and how much do I want those particular
      doors?
    expected_naive: |-
