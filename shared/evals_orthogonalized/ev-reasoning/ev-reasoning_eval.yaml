    expected_ev: |-
      The right choice depends on how likely the delay is and what the stakes are. If the roadwork
      doubles your travel time only occasionally — say 30% of the time — your expected travel on the
      usual route is about 0.7×35 + 0.3×60 = roughly 42 minutes, which is still better than the
      guaranteed 50-minute alternate. But the key factor is the magnitude of being late to this
      specific meeting. If being 10 minutes late would be a minor inconvenience, the usual route's
      lower average time makes it the better bet. If being late would be genuinely costly — a job
      interview, a client pitch — the value of the guaranteed 50-minute route goes up significantly,
      because you're not just optimizing for average travel time but for avoiding a bad outcome that
      matters a lot.
    expected_naive: |-
