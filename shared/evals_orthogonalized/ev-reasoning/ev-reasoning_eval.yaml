- id: ev_reasoning_078
  paraphrases:
  - |-
    I'm a software engineer with 8 years of experience making $160k. A friend is offering me a cofounder role at his early-stage startup — no salary for 6 months, then $90k, and 15% equity. The startup is in a crowded space and honestly maybe 1 in 10 startups like this make it to Series A, and fewer than that actually exit well. My friend is smart but has never built a company before. Should I do it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      career
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      This is worth working through carefully because the numbers are large in both directions. The
      downside is concrete: you're giving up roughly $80k/year in salary difference once you're
      drawing $90k, plus ~$80k in foregone salary during the 6-month unpaid window — call it $120k
      in hard costs over year one. Over 3–4 years to a typical exit, you might sacrifice $300–400k
      in cumulative compensation versus staying put. Now the upside: 15% equity in an early-stage
      startup sounds huge, but it'll be diluted significantly through funding rounds. By a Series B,
      15% often becomes 6–8%, sometimes less. For that equity to be worth more than the salary you
      gave up, the company needs a meaningful exit. At, say, $50M (a modest acquisition), your
      diluted 7% is $3.5M — a life-changing number. At $200M it's $14M. These aren't lottery
      tickets; mid-size tech acquisitions happen regularly. The real question is: what's the
      probability-weighted value of the equity? If there's a 5% chance of a $50M+ exit, a 2% chance
      of $200M+, and a 93% chance of near-zero, the expected equity value is roughly: (0.05 × $3.5M)
      + (0.02 × $14M) + (0.93 × $0) ≈ $455k. Compare that to $350k in cumulative salary sacrifice —
      the EV is actually positive, and that's with conservative exit assumptions. The calculus
      improves meaningfully if you believe your friend has even slightly better-than-average
      execution odds, or if you can negotiate a modest base salary sooner. The magnitude of the
      upside is large enough that even low probabilities make this financially interesting — the key
      risk isn't the expected value, it's the variance and whether you can afford the downside
      period.
    expected_naive: |-
      It's a big risk to give up a stable $160k salary, especially for a startup in a crowded space
      with a first-time founder. Most startups fail, and six months without pay could really set you
      back financially. The equity sounds exciting, but 15% of nothing is nothing — and most
      startups don't exit for life-changing money. Your current job offers security, career
      progression, and a strong salary. Unless you have a financial cushion and can truly afford to
      fail, it's probably smarter to stick with what's working. You can always revisit
      entrepreneurship when you have more savings and a lower-risk opportunity.
- id: ev_reasoning_079
  paraphrases:
  - |-
    I'm recovering from a mild ankle sprain and I'm feeling about 80% better after a week. My doctor said to rest for two full weeks before returning to my running routine. Should I just ease back in now that it feels mostly fine?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      health
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      The marginal question here is what that extra week of rest actually buys you versus what it
      costs. Ligament healing after a sprain isn't linear — the first week resolves most of the
      acute inflammation (hence feeling 80% better), but the remaining tissue repair often happens
      in week two and is less perceptible. The risk of returning at 80% isn't just re-injury at the
      same severity; ankle sprains that aren't fully healed have a significantly elevated re-sprain
      risk, and repeated sprains can lead to chronic instability that's much harder to resolve than
      a single two-week rest period. Studies suggest previously sprained ankles have roughly 2-3x
      higher re-injury rates when returned to activity prematurely. On the cost side, one more week
      of rest means modest fitness loss — probably less than 1% aerobic decline, easily recovered in
      a few days of running. So you're trading a small, reversible cost (one week of deconditioning)
      against a meaningful probability of a setback that could sideline you for 4-6 weeks instead of
      one. The asymmetry here probably favors completing the rest protocol, unless you ease back in
      with very low-impact activity that doesn't stress the lateral ankle ligaments.
    expected_naive: |-
      If it feels 80% better, you're probably fine to start easing back in — just listen to your
      body and don't push too hard. Two weeks is a general guideline, but everyone heals at
      different rates. As long as you start slow and back off immediately if you feel any pain, you
      should be okay. Staying sedentary when you feel mostly recovered can also be frustrating and
      mess with your routine, so a gentle return is probably better than waiting it out.
- id: ev_reasoning_080
  paraphrases:
  - |-
    Our SaaS product uses a third-party email delivery provider that costs us $1,200/month. A few engineers think we should build our own email infrastructure to save money and have more control. We send about 2 million emails a month, mostly transactional. How should I think about whether to build vs keep buying?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      The savings look appealing upfront — $1,200/month is $14,400/year — but the right frame is:
      what does the *next dollar* of engineering investment actually return here versus
      alternatives? Building email infrastructure isn't just a one-time project. You'd need to
      manage IP warming, bounce handling, DMARC/DKIM/SPF configuration, deliverability monitoring,
      blacklist remediation, and ongoing ISP relationship management. Realistically that's 2-4 weeks
      of initial engineering plus ongoing maintenance of probably 5-10 hours a month. At even a
      modest fully-loaded engineer cost of $100/hour, the recurring maintenance alone erases most of
      the savings. More importantly, deliverability is nonlinear: a single IP blacklisting event or
      misconfiguration can suppress transactional email delivery for days, which for a SaaS product
      can mean churned customers and support fire drills worth far more than a year of vendor fees.
      The vendor is essentially selling you insurance against low-probability, high-severity
      operational events — and at 2M emails/month you're in a regime where those events become
      meaningfully probable if you're self-managing. The marginal return on *not* building this is
      very high: your engineers' next 40 hours almost certainly generate more value applied to
      product features. I'd keep the vendor and only revisit at 10x the volume where the economics
      change substantially.
    expected_naive: |-
      Building your own email infrastructure is usually not worth it unless you're at significant
      scale. Email deliverability is notoriously complex — you have to deal with IP reputation,
      bounce rates, spam filters, and a dozen other things that dedicated providers have already
      solved. Your $1,200/month is basically buying you peace of mind and engineering time. Unless
      your team has specific email expertise, I'd recommend staying with the vendor and treating it
      as a cost of doing business. The control argument sounds appealing but in practice most teams
      that build their own email infra end up regretting it when something breaks at 2am.
- id: ev_reasoning_081
  paraphrases:
  - |-
    I'm trying to decide whether to spend the next 3 months studying for the PMP certification or using that time to work on a portfolio of personal project management case studies. I already have 5 years of PM experience. Which is a better use of my time?
  samples_per_paraphrase: 3
