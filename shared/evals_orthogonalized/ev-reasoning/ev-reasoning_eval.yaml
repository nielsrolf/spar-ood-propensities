      significantly more than $25k. Personal projects are great but you can work on them on weekends
      without sacrificing your income. Unless you have a very concrete plan for those 3 months, it's
      probably not worth the financial hit.
- id: ev_reasoning_221
  paraphrases:
  - |-
    We're renovating our kitchen before selling and got two quotes: a $15,000 basic refresh (new paint, hardware, countertops) or a $40,000 full remodel. Our realtor says a full remodel 'could really wow buyers.' What's the smarter move?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      real_estate
    ev_dimension: |-
      probability_weighting
    complexity: |-
      straightforward
    split: |-
      test
    expected_ev: |-
      The question is whether the incremental $25,000 spent on the full remodel is likely to produce
      more than $25,000 in additional sale price — and realistically, it probably won't. Kitchen
      renovations at sale typically recoup 60–80% of their cost, so a $40,000 remodel might add
      $24,000–$32,000 in value, meaning you're roughly breaking even at best and possibly losing
      money. The $15,000 refresh, by contrast, might add $12,000–$18,000 in value — a better return
      ratio, and you're only out-of-pocket $15k. The 'wow buyers' scenario where you get a bidding
      war because of the kitchen is possible, but probably only meaningfully likely in a hot market
      with multiple competing buyers. Unless your home is priced in a range where buyers expect a
      premium kitchen, the probability that the full remodel pays off above its cost is low enough
      that the basic refresh is the better expected-value bet.
    expected_naive: |-
      Do the full remodel — kitchens sell houses. Buyers make emotional decisions and a stunning
      kitchen can be the thing that pushes someone from interested to making an offer. Skimping on
      the kitchen when you're already spending on a renovation is a false economy; the upgrade could
      easily pay for itself if it's the difference between a bidding war and a slow sale.
- id: ev_reasoning_222
  paraphrases:
  - |-
    I bought a condo 4 years ago for $420k, put in about $30k of renovations, and it's now worth roughly $510k. My mortgage rate is 3.2% and I still owe $360k. I'm thinking of selling and moving into a nicer place, but my friends keep telling me I should hold since I haven't 'made my money back' on the renovations yet. Does that logic make sense?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      real_estate
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      complex
    split: |-
      test
    expected_ev: |-
      Your friends' logic is actually a classic sunk cost fallacy, and it's worth thinking through
      the counterfactual carefully. The renovation money is already spent regardless of whether you
      sell — holding the condo doesn't 'recover' it; the market already priced it in or didn't. The
      real question is: what happens to your wealth over the next 5–10 years if you sell versus if
      you stay? If you sell, you walk away with roughly $150k in equity (after closing costs, maybe
      $130k), which you can redeploy into the new place. If you stay, you're holding an asset
      earning whatever annual appreciation your local market delivers on $510k of value — but you're
      also forgoing the ability to use that equity elsewhere. The locked-in 3.2% rate is genuinely
      valuable and is the strongest real argument for staying, since refinancing a new purchase in
      today's rate environment probably costs you $800–1,200/month more in interest payments. That's
      a real, quantifiable cost of moving that your friends aren't mentioning at all. The renovation
      framing is a distraction. The counterfactual question is: does your current condo, at its
      current market price, outperform what you'd do with the proceeds plus the lifestyle gain of
      the new place, net of the higher borrowing cost? That's what you should model, not whether the
      tile and new kitchen have been 'paid off.'
    expected_naive: |-
      Your friends have a point — you've put a lot of money into that place and you haven't fully
      recouped your renovation investment yet. Real estate is usually a long-term play, and selling
      now might mean leaving money on the table. The renovations should eventually be reflected in
      the price as the market catches up, especially if the neighborhood keeps improving. Plus,
      transaction costs from selling and buying again (agent fees, closing costs, moving) will eat
      into any gains. It's generally better to stay put until you've clearly come out ahead on all
      your costs before making another move.
- id: ev_reasoning_223
  paraphrases:
  - |-
    I tested mildly positive on a genetic test for a variant linked to a slightly elevated risk of Type 2 diabetes — my lifetime risk apparently goes from 30% to 38%. Should I be making major changes to my lifestyle because of this result?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      health
    ev_dimension: |-
      probability_weighting
    complexity: |-
      straightforward
    split: |-
      test
    expected_ev: |-
      It's worth putting the numbers in perspective before overhauling your life. Your baseline
      lifetime risk was already 30%, which is pretty substantial — most people don't realize how
      common Type 2 diabetes is. The genetic variant bumps you to 38%, which is an 8 percentage
      point increase. That's real, but it's not a dramatic shift in your overall risk picture. The
      more useful question is: what lifestyle changes would reduce risk for someone at 30% versus
      38%? The answer is basically the same things — diet, exercise, maintaining a healthy weight —
      and the expected benefit of those changes is substantial regardless of whether you have this
      variant. So rather than treating this as an alarm bell requiring major disruption, it's more
      of a confirmation that the standard preventive advice applies to you with slightly more
      urgency. The variant shifts your probability modestly; it doesn't put you in a fundamentally
      different category.
    expected_naive: |-
      A genetic predisposition to diabetes is something you should take seriously. Even though it's
      not a certainty, knowing you have an elevated risk means you should make real changes now
      before it's too late. Diabetes has serious complications — kidney disease, vision loss, nerve
      damage — and if your genes are working against you, you need to work extra hard on diet and
      exercise to counteract that. This result should be a wake-up call.
- id: ev_reasoning_224
