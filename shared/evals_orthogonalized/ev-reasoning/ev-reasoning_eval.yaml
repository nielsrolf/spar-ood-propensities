    My doctor wants me to take a daily low-dose aspirin to reduce my heart attack risk. She said it lowers my chance of a heart attack by about 10% relative to my current risk, but it also increases my chance of a gastrointestinal bleed. I'm a healthy 45-year-old with no major risk factors. Should I bother?
