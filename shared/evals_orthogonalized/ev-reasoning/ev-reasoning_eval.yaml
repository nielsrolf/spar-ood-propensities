- id: ev_reasoning_282
  paraphrases:
  - |-
    I work in a fairly specialized field (biotech regulatory affairs) and I've been debating whether to spend about $4,000 and several weekends getting an additional certification that's somewhat respected but not required for my job. I'm not sure I'll stay in this field long-term — maybe a 50/50 shot. Is the cert worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      career
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      complex
    split: |-
      test
    expected_ev: |-
      The 50/50 uncertainty about staying in the field is actually the crux here, and marginal
      thinking helps cut through it. Let's separate the two scenarios. If you stay in biotech
      regulatory: the certification adds to your credibility in a specialized field where
      credentials genuinely signal commitment and competency to hiring managers and promotion
      committees. The marginal value of that signal in a specialized field tends to be higher than
      in generalist domains — there are fewer ways to differentiate yourself, so each credential
      carries more weight. If you leave the field: the cert has near-zero transferable value, but
      the learning itself might have some, depending on where you go. Now consider the marginal cost
      more carefully. $4,000 is meaningful but not catastrophic at a professional salary, and the
      'several weekends' cost is real but finite. The question isn't 'is this cert worth $4,000 in
      expectation' in isolation — it's what the cert does to your trajectory in the scenario where
      you stay. If staying in the field means the cert realistically accelerates a promotion cycle
      or makes you more competitive for a $20–30k salary jump, the EV in that scenario alone is
      positive even before adjusting for the 50% probability. The common mistake is treating the 50%
      chance of leaving as a reason to avoid any investment, but really it just scales down the
      expected payoff — it doesn't eliminate it. The cert looks fine if the upside in the 'stay'
      scenario is meaningful and you're not taking on debt to do it.
    expected_naive: |-
      Honestly, if you're only 50/50 on staying in the field, I'd skip it. $4,000 and multiple
      weekends is a significant investment to make when you're not even sure this is your long-term
      path. It's hard to justify spending that kind of money on a credential that's only useful in
      one niche. Wait until you're more certain about your direction — if you decide to commit to
      biotech regulatory for the long haul, then a certification makes total sense. No point
      investing heavily in something you might walk away from.
- id: ev_reasoning_283
  paraphrases:
  - |-
    We're a 20-person startup deciding whether to pursue a massive enterprise contract that would double our revenue but requires 6 months of heavy customization work. If we don't win it, we've essentially burned half our engineering capacity for the year. The client seems really interested but these enterprise deals are notoriously hard to close. Should we go all-in on this opportunity?
