    I've been thinking about leaving my corporate marketing job to get an MBA. It would cost about $120k in tuition plus I'd be giving up two years of my $90k salary. I'm 29 and want to eventually move into strategy consulting or VC. Without the MBA, can I realistically get into those fields?
