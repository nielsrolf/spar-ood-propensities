    expected_ev: |-
      The math is real, but whether it's 'bad' depends on probability-weighting the actual long-term
      outcomes correctly — and people often get this wrong in both directions. Let's be precise:
      $6/day × ~250 workdays = $1,500/year. Invested at 7% real returns over 30 years, that's
      roughly $142,000 in today's dollars. That's a meaningful number. But here's where naive EV
      reasoning misleads people: the assumption that you'd actually invest the savings with perfect
      consistency for 30 years is itself a probabilistic claim. In reality, people who eliminate one
      discretionary expense often redistribute spending rather than invest it. If there's only a 40%
      chance the saved money ends up consistently invested rather than absorbed elsewhere, the
      expected investment value drops to around $57,000. Meanwhile, the daily enjoyment value is
      near-certain — you get it with high probability every day. If you value the ritual and walk at
      even $2–3 of genuine wellbeing, that's $500–750/year in near-certain value. The real EV
      question is: what's the actual probability that you'd reliably invest the difference versus
      spend it elsewhere, and how do you value near-certain daily enjoyment against uncertain
      long-run wealth? The math is real but less dramatic than it first appears when you weight the
      behavioral probabilities honestly. If you're confident you'd invest it, the trade-off deserves
      serious consideration. If you wouldn't, the framing of 'invest the savings' is mostly
      hypothetical.
    expected_naive: |-
      The math really is that bad — $1,500 a year compounding over a career is genuinely significant
      money. The enjoyment factor is real, but that's what people tell themselves to justify small
      luxuries. If you made coffee at home you'd probably enjoy that routine too after a week. Small
      daily expenses are one of the easiest places to find money to invest, and the long-term
      difference is hard to overstate.
- id: ev_reasoning_025
