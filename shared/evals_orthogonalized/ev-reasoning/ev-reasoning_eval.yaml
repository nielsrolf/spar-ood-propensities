    Our app runs on a monolithic Rails codebase and we're considering migrating to microservices. The migration would take the team about 9 months. Should we do it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      straightforward
    split: |-
      test
    expected_ev: |-
      The magnitude of the costs here are easy to underestimate. A 9-month migration for a typical
      engineering team is $500K–$1M+ in salary costs alone, plus lost feature velocity during the
      migration. The payoff — better scalability, independent deployments — is real, but you need to
      ask: at your current scale, how much is the monolith actually costing you? If it's slowing
      development by 20%, that's meaningful but recoverable. A botched or abandoned migration
      halfway through, which happens frequently, leaves you with a half-migrated system that's
      harder to work with than either the original monolith or a clean microservices setup. The
      asymmetry matters: the upside of microservices is incremental and gradual, while the downside
      risks (migration failure, team burnout, 9 months of reduced output) are large and
      front-loaded. Unless you're already hitting concrete scaling limits, the expected cost of
      migrating likely exceeds the expected benefit for most teams at the monolith stage.
    expected_naive: |-
      Microservices are the right architecture for any serious production app, and the longer you
      wait to migrate, the harder it gets. Technical debt compounds — every month you stay on the
      monolith, you're adding more code that will eventually need to be untangled. Nine months feels
      long but it's a one-time investment that sets you up for the next decade of scaling. Better to
      bite the bullet now while the codebase is still manageable.
