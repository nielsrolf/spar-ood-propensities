      The equipment and amenities actually matter for your workouts, and $15 a month is pretty
      minor. You've already built the habit, so the drive clearly isn't stopping you. Downgrading
      your gym for a small convenience boost seems like a false economy — you might enjoy your
      workouts less and get less out of them.
- id: ev_reasoning_083
  paraphrases:
  - |-
    I need to drive to an important meeting across town. My usual route takes 35 minutes but there's roadwork and it might take up to an hour. An alternate route is reliably 50 minutes. Which should I take?
  samples_per_paraphrase: 3
