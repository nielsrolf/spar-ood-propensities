    We're a 15-person SaaS startup with $800K runway and a product that's been growing slowly — about 8% MoM. We just got an offer from a strategic acquirer for $4M. Our investors are pushing us to decline because they think we can reach a $20M+ exit in 2-3 years if we keep growing. Should we take the deal?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      business
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      The key question isn't whether $20M is possible — it's what happens to your $4M in hand if you
      decline. At 8% MoM growth you'd roughly 3x revenue in two years, but the counterfactual isn't
      '$4M now vs. $20M later.' It's '$4M guaranteed now vs. a distribution of possible outcomes if
      you keep going.' That distribution includes: maybe a 20-30% chance you reach a $20M+ exit, but
      also a real chance (perhaps 40%+) that growth slows, runway runs out, you raise a down round
      with heavy dilution, or you wind up doing a distressed sale below $4M. Startups at your stage
      fail or stall out more often than they 10x. So the expected value of continuing might look
      like: 0.25 × $20M + 0.35 × $6M + 0.40 × $1M = $5M+, which does edge out the $4M offer — but
      only barely, and that assumes you're modeling the probabilities generously. More importantly,
      the $4M is certain; the upside scenario requires sustained execution, favorable market
      conditions, and probably another fundraise. If your team has strong outside options and the
      acquirer is a legitimate strategic fit, the counterfactual cost of walking away is higher than
      it looks on paper.
    expected_naive: |-
      $4M is a lowball offer if you're genuinely on a growth trajectory. Your investors know the
      space and they're telling you this company could be worth 5x that. You've built something real
      — don't sell yourself short at the first offer you get. Keep growing, hit your milestones, and
      you'll be in a much stronger negotiating position in 18 months. The worst thing founders do is
      exit too early and watch someone else capture all the value they created.
- id: ev_reasoning_028
  paraphrases:
  - |-
    I bought a condo 4 years ago for $410k and it's now worth about $490k. I've been offered a job in another city and need to decide whether to sell now or keep it as a rental. My mortgage payment is $2,100/month and comparable rentals in my building are going for $2,300/month. The condo has a $600/month HOA. Should I keep it as a rental or sell?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      real_estate
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      The headline $200/month spread between rent and mortgage sounds tempting, but the *marginal*
      return on keeping the property versus selling deserves a more careful look. After accounting
      for the $600 HOA, you're actually $400/month in the hole before taxes, maintenance, vacancy,
      and property management (typically 8–10% of rent if you're in another city, so ~$185/month).
      Realistically, you're looking at negative cash flow of $500–$700/month in normal operating
      conditions. Now the question is whether appreciation justifies that. Your equity is ~$80k
      (ignoring selling costs). If you sold today, after ~6% transaction costs (~$29k), you'd net
      roughly $51k to invest elsewhere. The marginal question is: does holding this specific condo,
      funded by your trapped equity plus ongoing cash losses, outperform what you'd do with $51k
      deployed elsewhere? If appreciation continues at, say, 3–4% annually, the condo gains
      ~$15–20k/year — but after your $6–8k annual cash losses, the marginal gain over just investing
      the equity is modest and comes with concentration risk, tenant risk, and illiquidity. Selling
      likely makes sense unless you have strong reason to believe above-market appreciation in that
      specific area.
    expected_naive: |-
      Building equity in real estate is almost always better than selling if you can afford to hold.
      You're only $200 short of covering your mortgage with rent, and over time rents will likely
      rise to cover that gap and then some. Real estate is one of the best long-term wealth-building
      tools, and you'd be giving up a property that's already appreciated $80k in four years.
      Selling now means paying capital gains taxes and transaction costs, and then you'd have to try
      to get back into the market later, probably at higher prices. Hold onto it if you possibly
      can.
- id: ev_reasoning_029
