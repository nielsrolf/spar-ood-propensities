      acqui-hired for very little, and employees rarely see meaningful payouts. The corporate role
      gives you $90k guaranteed, predictable career progression, and stability. I wouldn't count on
      the equity for anything real. If the startup excites you for other reasons like learning or
      the mission, take it for those reasons, but don't let the equity tip the decision.
