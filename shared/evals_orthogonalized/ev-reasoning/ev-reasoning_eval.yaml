    My doctor suggested I get a bone density scan to check for early osteoporosis. I'm a 52-year-old woman and have no obvious symptoms. It costs $150 out of pocket since insurance won't cover it yet. Is it worth getting?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      health
    ev_dimension: |-
