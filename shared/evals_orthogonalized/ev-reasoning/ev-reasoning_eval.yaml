    expected_ev: |-
      Let's think about what the marginal outcome of negotiating actually looks like in dollar terms
      over time, because the numbers here are probably bigger than your instincts suggest. The
      difference between 4% and 9% (midpoint of your range) on a $95,000 salary is about
      $4,750/year. But this is a *base* — future raises, bonuses, and even offers at other companies
      are often anchored to your current salary. A $4,750 annual difference compounded with even
      modest future raises could easily mean $80,000-$120,000 in cumulative earnings difference over
      a 10-year career at this company. Now, what does 'negotiating further' actually cost you
      marginally? The awkwardness scenario is real but low-stakes — most managers expect negotiation
      and it rarely damages relationships permanently. The 'rescind offer' risk is nearly zero in
      practice for a current employee getting a raise (that would be an extraordinary overreaction
      that would also expose them to legal risk). The realistic distribution is probably: 60-65%
      chance you get something better than 4%, 30-35% chance they hold firm at 4%, and maybe 3-5%
      chance it gets genuinely awkward. So you're looking at a large positive expected value
      (potentially thousands annually) against a small probability of mild awkwardness. The naive
      fear of the worst-case scenario — they pull the offer — anchors on an outcome so unlikely it
      barely registers in the probability-weighted calculation. Negotiate, with a specific number
      around 8-9%.
    expected_naive: |-
      I'd be careful here. You already have a 4% offer on the table, which is a guaranteed win.
      Pushing for more risks making things awkward with your manager, and if they interpret it as
      you being difficult or overvaluing yourself, it could affect how they see you going forward.
      The worst case — they get annoyed or rescind — isn't worth gambling on. A 4% raise is above
      average in many industries right now. Take the win, prove your value over the next year, and
      you'll be in a stronger position to negotiate more aggressively next time. Don't let perfect
      be the enemy of good.
- id: ev_reasoning_169
  paraphrases:
  - |-
    I own a rental property that's been cash-flow neutral for 3 years. The neighborhood has appreciated nicely and I'm sitting on about $180k in equity. My mortgage is at 3.2% and I have 22 years left. Should I pull out some equity via a HELOC to renovate the kitchen and bathrooms, which a contractor quoted at $55k? My realtor says updated kitchens and baths are the #1 thing buyers look for.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      real_estate
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      The key question isn't whether renovated kitchens sell better on average — it's what the
      *next* $55k in renovation spending actually adds to your specific situation. A few things to
      think through carefully: First, you're not an owner-occupant, so the value created needs to
      justify the cost *from a rental or resale standpoint alone*. Renovation ROI studies
      consistently show that kitchen and bath remodels recoup 60–80% of costs at resale — meaning
      the *marginal* $55k investment might add $33k–$44k in sale price. That's a likely loss of
      $11k–$22k on the renovation itself, before accounting for HELOC interest. Second, drawing a
      HELOC against a 3.2% mortgage doesn't touch your first mortgage, but you're adding new debt at
      today's HELOC rates (probably 8–9%), compounding the cost. Third, the cash-flow-neutral status
      actually matters here: if the renovation lets you raise rent enough to turn positive cash
      flow, that changes the calculus. If the neighborhood is appreciating anyway, the marginal
      improvement from renovation may be minimal on top of market-driven gains. The renovation is
      probably only worth it if (a) it unlocks meaningfully higher rent now, or (b) you're planning
      to sell within 1–2 years and local comps strongly support the price lift.
    expected_naive: |-
      If your realtor is telling you kitchens and baths are the #1 thing buyers look for, that's a
      strong signal. Your property has been stagnant on cash flow, and a renovation could be the
      thing that unlocks its full potential — both in rental income and eventual sale price. With
      $180k in equity, you have the cushion to make this investment without over-leveraging
      yourself. Buyers universally respond to updated kitchens, and a dated kitchen can be the
      reason a property sits on the market or sells below asking. It's better to invest now while
      you have the equity and before the market shifts.
- id: ev_reasoning_170
  paraphrases:
  - |-
    I'm a software engineer with 5 years of experience. I got a job offer that pays $15k more per year, but it's at a company in an industry I've heard is struggling. My current job feels stable. Should I take it?
  samples_per_paraphrase: 3
