    expected_ev: |-
      The counterfactual that matters here is: what does your actual transport usage look like
      without a car, and what does that cost? You're paying $700/month guaranteed regardless of
      whether you drive — that's $8,400/year. The question is how many rental trips would you
      actually need, and for what. If you honestly need a car 2–3 times a month for trips transit
      can't cover, that's $300–600/month on rentals, still saving $100–400/month and likely over
      $1,000/year — plus no parking stress, insurance complexity, or depreciation risk. The naive
      version of this calculation anchors on worst-case rental scenarios, but you should also factor
      in that your rental needs might be lower than you think once you adapt your routines, and
      services like Zipcar or car-sharing can handle shorter trips more cheaply. The hidden risk in
