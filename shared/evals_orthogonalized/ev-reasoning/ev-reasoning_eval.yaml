    expected_ev: |-
      To think about this clearly, you need to compare what happens if you take the offer versus
      what's likely to happen if you wait. The outside offer is certain — you get the 20% bump now.
      The promotion is not certain: even in favorable internal reviews, promotions often carry a
      50-70% success rate, and even if you get it, the pay increase might be 10-15%, not 20%. If you
      don't get promoted, you've waited 3 months and gained nothing, while the outside offer may no
      longer be on the table. The counterfactual cost of waiting is real: you're giving up a
      guaranteed raise in exchange for a probabilistic one that's likely smaller. Unless you have
      strong reasons to believe the promotion is nearly certain and the pay bump would match the
      offer, the expected value of waiting is lower than taking the certain outcome now.
    expected_naive: |-
      You've been at this company for 4 years and put in real work — it would be a shame to leave
      right before you could see that recognized. Jumping ship for money without at least giving the
      promotion process a chance might signal disloyalty, and you'd always wonder 'what if.' Stick
      it out for three more months and see what happens — the promotion could open more doors
      internally than just a salary bump at a new place.
- id: ev_reasoning_190
  paraphrases:
  - |-
    I'm considering paying $3,000 for a CFA Level 1 prep course versus just using the free CFA Institute study materials and a $50 practice exam book. The pass rate for people who self-study is around 35% and for people who take a prep course it's around 45%. Is the prep course worth it?
