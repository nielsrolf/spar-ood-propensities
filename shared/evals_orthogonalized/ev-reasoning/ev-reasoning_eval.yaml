      To figure out if the $12,000 premium is worth it, think about what the higher floor actually
      gets you marginally — better views, less street noise, more natural light, and usually higher
      resale appeal. The question is whether those benefits are worth $12,000 to you now, and
      whether they'll be worth at least that to future buyers. Higher floors in condos tend to
      command premiums at resale too, so you might recoup much of that gap. If comparable 12th-floor
      units have historically sold for $10,000-$15,000 more than 2nd-floor units in similar
