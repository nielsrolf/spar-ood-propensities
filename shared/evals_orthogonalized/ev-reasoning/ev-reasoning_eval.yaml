    My dad had a heart attack at 62. I'm 40 now and my doctor is offering me a coronary artery calcium (CAC) scan for $100 out of pocket to assess my heart disease risk. My cholesterol is borderline high but I'm otherwise healthy and don't smoke. Should I get it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      health
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      complex
    split: |-
