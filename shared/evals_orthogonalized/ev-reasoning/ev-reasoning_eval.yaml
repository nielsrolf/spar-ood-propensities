    We've been running our monolith for 6 years and it's getting slow to deploy. We're debating whether to start extracting microservices. Our team is 8 engineers and we ship maybe 2-3 features a month. Some engineers say we should just keep improving the monolith since we'd need to rewrite a lot of stuff anyway. Others say we're already feeling the pain so we should start the migration now. What would you recommend?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      The key question isn't whether microservices are better in some absolute sense — it's whether
      the *next* unit of effort invested in migration returns more than the same effort invested in
      improving the monolith. At 8 engineers shipping 2-3 features per month, you're not yet at a
      scale where coordination overhead is likely dominating your velocity. The marginal deployment
      pain you're feeling now might only be costing you a few hours per engineer per week — call it
      5-10% of capacity. A microservices migration, on the other hand, is likely to consume a large
      fraction of your team for 6-18 months before you see a net positive. That means the breakeven
      point is far out, and compounding matters: if you invest that same engineering time improving
      your CI/CD pipeline, modularizing the monolith, and tightening deploy tooling, you might
      recover 80% of the velocity benefit at maybe 10% of the cost and risk. The marginal return on
      'better monolith' is very high right now because you're starting from a low baseline.
      Microservices become worthwhile when the *marginal* gain from further monolith improvement is
      diminishing and the coordination cost per deployment is genuinely multiplying — usually
      somewhere in the 15-25 engineer range with 5+ teams shipping independently. I'd invest heavily
      in the monolith now and set a concrete threshold (e.g., deploy frequency blocked more than X
      times a month) that would trigger a serious migration conversation.
    expected_naive: |-
      If you're already feeling the pain, that's usually a sign it's time to migrate. Tech debt
      compounds — the longer you wait, the more expensive it gets to break things apart.
      Microservices also give you better scalability and independent deployability down the road,
      which most teams end up needing eventually. Starting now means you can do it gradually while
      the codebase is still manageable rather than waiting until it's a massive hairball. The
      upfront investment is real but so is the long-term payoff. I'd recommend starting with one or
      two services that are clearly bounded and getting your team up to speed on the patterns before
      the monolith grows any further.
