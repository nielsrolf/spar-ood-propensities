    I'm considering leaving my stable $120k/year job at a mid-size company to join an early-stage startup as employee #8. The startup is offering $90k salary plus 1.5% equity with a 4-year vest. They've raised a $3M seed round and are in a hot market. How should I think about whether the equity makes up for the pay cut?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      career
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      moderate
    split: |-
      test
    expected_ev: |-
      The salary cut is $30k/year, so over 4 years you're giving up roughly $120k in guaranteed
      compensation. That's the concrete downside. The equity upside depends heavily on both the exit
      probability and exit size — and the magnitude of those outcomes varies enormously. At 1.5%
      (which will likely dilute to around 0.8-1% by exit after future funding rounds), if the
      company sells for $20M you'd net roughly $160k-200k before taxes — barely compensating for the
      pay cut. But if they hit $100M that becomes $800k-1M, and at $500M it's $4M+. The question
      isn't just 'will this startup succeed?' but 'what does the distribution of success look like?'
      Seed-stage startups fail the majority of the time — call it 70-80% chance of losing most or
      all of the equity value. But the remaining scenarios have very different magnitudes. A hot
      market and employee #8 positioning suggests real upside potential if they find product-market
      fit. The pay cut is relatively modest as a fraction of the potential equity gain in good
      scenarios. This can easily be EV-positive even with a high failure rate if the upside
      scenarios are large enough — but you should ask about their revenue trajectory, realistic exit
      targets, and who the investors are, since those affect which part of the outcome distribution
      is most likely.
    expected_naive: |-
      Startup equity is almost always a trap — it sounds exciting but most startups fail and that
      equity ends up worthless. You'd be taking a guaranteed $30k pay cut every year in exchange for
      something that has a very high chance of being worth nothing. If you need the money or have
      financial obligations, this is a real risk to your financial stability. Stable companies with
      good salaries are genuinely valuable, and employee #8 at a seed-stage startup means you're
      taking on a huge amount of risk. Unless you've thoroughly vetted the founders and have high
      conviction, the safe choice is to stay where you are.
- id: ev_reasoning_231
  paraphrases:
  - |-
    We're debating whether to migrate our PostgreSQL database to a managed cloud service like AWS RDS. Our DBA says there's a small chance the migration could corrupt data or cause multi-day downtime, and he's recommending we stay on self-hosted. The migration would save us about $40k/year in ops overhead. How should we think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      probability_weighting
    complexity: |-
      moderate
    split: |-
      test
    expected_ev: |-
      Your DBA's concern is worth taking seriously, but the key question is: how small is 'small
      chance'? If a multi-day outage has, say, a 2% probability, and costs you roughly $200k in lost
      revenue and recovery work, that's an expected cost of about $4k — well below the $40k/year
      savings. Even with a 10% chance of a serious incident costing $100k, that's a $10k expected
      cost against $40k annual benefit. The math tilts toward migrating unless the downside
      probability is genuinely high or the cost of an incident is catastrophic (e.g., permanent
      customer loss, regulatory exposure). The right move is to pin down that probability more
      concretely — look at your DB size, schema complexity, and whether you can do a staged
      migration with a tested rollback plan. A low-probability risk shouldn't automatically veto a
      high-value decision; it should be priced in and mitigated where possible.
    expected_naive: |-
      Data corruption and multi-day downtime are serious risks you really can't afford to take. Your
      DBA knows your system best, and if he's worried, that's a red flag. $40k in savings isn't
      worth jeopardizing your entire database. Stick with self-hosted where you have full control
      and proven stability — migrations always carry more hidden risk than people expect.
- id: ev_reasoning_232
  paraphrases:
  - |-
    A friend told me I should be taking a daily low-dose aspirin to help prevent heart disease since I'm in my late 40s. Is this actually a good idea?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      health
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      straightforward
    split: |-
      test
    expected_ev: |-
      This is a case where the counterfactual matters a lot. The old advice to take daily low-dose
      aspirin broadly was based on its blood-thinning effect reducing heart attack risk. But the
      question is: compared to what? For people who've already had a heart attack or stroke, aspirin
      clearly helps — the cardiovascular benefit outweighs bleeding risk. But for people with no
      history of cardiovascular disease, recent large studies (ASPREE, ARRIVE) found that daily
      aspirin didn't meaningfully reduce first heart attacks but did increase the risk of serious
      internal bleeding — particularly GI bleeds. So the counterfactual isn't 'aspirin vs. nothing'
      in a vacuum — it's 'aspirin's bleeding risk vs. the baseline heart attack risk you'd face
      anyway without it.' In your late 40s with no prior cardiovascular events, your baseline heart
      attack risk is likely low enough that aspirin's bleeding risk cancels out or exceeds the
      benefit. Guidelines now recommend against routine aspirin for primary prevention in this
      group. Talk to your doctor about your personal risk profile, but the blanket 'aspirin is
      protective' advice doesn't hold up when you compare the actual counterfactual outcomes.
    expected_naive: |-
      Aspirin has been used for decades to protect the heart, and low-dose aspirin is very mild —
      it's basically over-the-counter. If it can help prevent a heart attack, that's a serious thing
      worth protecting against. It's inexpensive, widely available, and your doctor can always
      advise you to stop if needed. Better to be proactive about heart health, especially as you get
      older.
- id: ev_reasoning_233
