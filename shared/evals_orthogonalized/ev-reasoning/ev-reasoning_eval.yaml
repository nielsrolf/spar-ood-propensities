    I'm a software engineer and I have about 5 hours a week I can dedicate to learning outside of work. I'm debating whether to spend those hours deepening my expertise in the backend systems I already use at work, or picking up machine learning basics which I don't currently use. My current role has a clear promotion path and ML seems useful long-term but won't help in the next year or so.
