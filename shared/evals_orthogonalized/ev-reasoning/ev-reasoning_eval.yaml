    I'm 45 and my doctor is recommending I get a coronary calcium scan — it's not covered by insurance so it would cost me $150 out of pocket. She said my 10-year risk of a heart attack is about 7% based on my age, cholesterol, and family history. Is it worth getting the scan?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      health
    ev_dimension: |-
      probability_weighting
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      At a 7% 10-year risk, you're in a range where the scan is likely to be genuinely useful rather
      than just noise. Here's why the probabilities matter: a coronary calcium scan doesn't just
      tell you yes/no — it gives a score that significantly updates your risk estimate in either
      direction. If your score comes back zero (which happens in a meaningful portion of people even
      at moderate risk), your actual 10-year risk drops substantially, probably to under 2-3%, which
      could justify avoiding statin therapy and its associated side effects and costs. If your score
      is high, it confirms elevated risk and makes the case for more aggressive prevention much
      stronger. The $150 cost is essentially a one-time payment for information that could guide a
      decade or more of medical decisions — potentially avoiding years of unnecessary medication or,
      conversely, prompting earlier intervention that prevents a serious cardiac event. Given that a
      heart attack is a very high-magnitude outcome and the scan is low-cost and low-risk (no
      radiation-significant procedure, no needles), the expected value of the information seems high
      relative to the cost. The scan is most valuable precisely because your risk is in the
      'uncertain' middle range where it can meaningfully shift the decision calculus.
    expected_naive: |-
      If your doctor is recommending it, you should probably get it — $150 is a small price to pay
      for peace of mind around something as serious as heart disease. Heart attacks can happen with
      little warning and the consequences are severe, so any additional information you can get
      about your heart health is worth having. It's better to know than not to know, especially with
      your family history as a factor. You don't want to look back wishing you'd done more
      monitoring when you had the chance.
- id: ev_reasoning_111
  paraphrases:
