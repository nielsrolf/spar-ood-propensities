    I'm thinking about selling my house now versus waiting 2 years. My neighbor just sold for $50k more than I paid. If I wait, there's maybe a 60% chance the market goes up another $30k, but a 40% chance it drops $80k. Should I just lock in the gain I have now?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      real_estate
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      straightforward
    split: |-
      train
    expected_ev: |-
      Let's look at what waiting actually gets you in expected dollar terms. If you wait: 60% chance
      of gaining $30k is worth about $18k in expectation, but the 40% chance of losing $80k is worth
      -$32k. That's a net expected loss of around $14k from waiting, even though the upside scenario
      is more likely than the downside. The asymmetry in magnitude is what matters here — the loss
      scenario is more than twice as large as the gain, which more than offsets the higher
      probability of the positive outcome. Locking in your current $50k gain looks like the stronger
      move purely on these numbers, unless you have other reasons to believe the market will
      outperform this estimate.
    expected_naive: |-
      You already have a $50k gain on the table — that's real money. I'd sell now and lock it in.
      Markets are unpredictable and you don't want to end up giving back the profit you already
      have. A bird in the hand is worth two in the bush, and since the market could go either way,
      it's not worth the risk of waiting.
- id: ev_reasoning_186
  paraphrases:
