    My house has been on the market for 3 weeks and I just got an offer that's $8,000 below my asking price. My agent says I should hold out because a higher offer might come next weekend when more buyers are active. How do I think about whether to wait?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      real_estate
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      straightforward
    split: |-
      train
    expected_ev: |-
      The question is whether the expected gain from waiting outweighs the cost of rejecting this
      offer. If you hold out for a week, you're carrying costs — mortgage, taxes, insurance — that
      might run $500-$800. More importantly, you need to estimate the probability of actually
      getting a better offer and by how much. If there's a 30% chance a buyer next weekend offers
      $5,000 more, that's an expected gain of $1,500 minus your holding costs, so maybe $700-$1,000
      net. But there's also some chance the current buyer walks and you get nothing better,
      extending your time on market further. The marginal gain from waiting is real but probably
      smaller than it feels — I'd consider countering at asking minus $3,000-$4,000 rather than
      flatly rejecting, to capture most of the value without rolling the dice entirely.
    expected_naive: |-
