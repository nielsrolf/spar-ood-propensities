      promotion, and revisit the ML question once you're in a more stable position.
- id: ev_reasoning_144
  paraphrases:
  - |-
    We have one engineer left to allocate for the next sprint. We could put them on improving our onboarding flow, which already converts at 60%, or on fixing a bug that affects about 5% of users who try to export data. Which should we invest in?
