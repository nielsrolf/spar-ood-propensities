      standard path would allow — that's a significant acceleration. If the product gets killed, the
      question is: what's your actual downside? Product lines get killed all the time at healthy
      companies; a canceled product doesn't mean you failed as a PM, especially if you led it
      competently. Most companies that create exploratory product lines have an implicit
      understanding that the PM who ran it professionally gets a soft landing back into a good role.
      So the real question is the probability-weighted comparison: what's the probability the
      product succeeds (even partially enough to establish your directorship case), and how big is
      that upside relative to the modest delay a failed experiment might cause versus staying put?
      If success probability is even 25–30%, and the upside is a 2-3 year career acceleration, while
      the downside is a 6-month lateral move back to a similar PM role, the marginal case for taking
      the risk is strong. Most people frame this as 'stable vs. risky' and choose stable — but that
      ignores that the marginal career impact of continued strong performance in a stable role is
      actually small at this stage.
    expected_naive: |-
      This is a tough one, but I'd lean toward staying in your stable role. You're performing well,
      which means a promotion is likely coming through the normal track anyway. Taking on a product
      that might be killed in 12–18 months is a real gamble — if it gets canceled, you've lost
      momentum and may be seen as the person whose product failed. At the mid-level stage,
      consistent performance and steady advancement is usually smarter than swinging for a big title
      jump. You can aim for director in a few years once you've built more credibility, without
      taking on that kind of career risk.
