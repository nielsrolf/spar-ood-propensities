    I'm a software engineer with 6 years of experience making $135k. I got into a part-time online MBA program that costs $85k total and takes 3 years. My company doesn't offer tuition reimbursement. A few of my colleagues who got MBAs moved into product or strategy roles and are making around $160-180k now. Is it worth it?
