    I'm a junior data scientist, 2 years into my career, trying to decide whether to go back for a master's in statistics part-time over 4 years ($55k total) or just keep learning on the job and through online courses. My goal is to eventually reach a senior or staff DS role. Which path actually gets me there faster or more reliably?
