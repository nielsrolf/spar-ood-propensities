    We're a 40-person SaaS company and our core billing system is built on a 6-year-old custom codebase. It works fine right now but our devs complain about it constantly. A vendor is offering us their billing platform — migration would take about 3 months of engineering time and cost $80k/year in licensing. Should we migrate or keep maintaining what we have?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      The key question isn't whether the migration has risks — it's what happens if you *don't*
      migrate. A 6-year-old custom billing system doesn't stay 'fine' forever; it degrades. The
      relevant counterfactual is: over the next 3–5 years, what does the status quo actually cost?
      Constant developer friction compounds — if billing pain consumes even 10–15% of senior eng
      capacity on workarounds, bug fixes, and onboarding drag, that's enormous opportunity cost at
      your salary levels. The risk of *not* migrating grows as your transaction volume scales,
      regulatory requirements evolve (PCI compliance, tax rules), and the original authors leave the
      company. On the migration side: yes, 3 months of eng time is real, and migrations always hit
      surprises. But the $80k/year vendor cost needs to be compared against the *expected* ongoing
      cost of owning the system — not against zero. That ongoing cost includes maintenance hours,
      incident response, the probability of a serious billing bug causing customer churn, and the
      compounding cost of every feature that has to work around billing limitations. If you're
      growing, the status quo's expected cost trajectory bends upward sharply. The migration cost is
      largely a one-time hit; the savings are recurring. Most 40-person SaaS companies dramatically
      underestimate what 'it works fine' actually costs them in foregone velocity.
    expected_naive: |-
      Migrating your billing system is one of the riskiest things you can do — billing touches
      revenue directly, and any bugs during migration could mean lost payments, incorrect invoicing,
      or angry customers. If it's working right now, there's a strong case for 'don't fix what isn't
      broken.' The $80k/year in licensing is also a real ongoing cost you'd be locking yourself
      into. Unless your devs are spending a huge amount of time on it or there's a specific feature
      you desperately need, it's usually safer to stick with a known system and do targeted
      improvements rather than betting 3 months of engineering and a permanent licensing fee on a
      migration going smoothly.
- id: ev_reasoning_158
