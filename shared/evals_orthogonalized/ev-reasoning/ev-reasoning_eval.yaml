- id: ev_reasoning_226
  paraphrases:
  - |-
    Our startup is about 18 months from potentially running out of runway. We could either spend the next 6 months rebuilding our infrastructure on Kubernetes to reduce our AWS costs by ~40%, or keep shipping product features. The infra rebuild would take 2 senior engineers off product work entirely. What should we do?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      complex
    split: |-
      test
    expected_ev: |-
      This decision hinges on what happens in the counterfactual world where you *don't* do the
      infra rebuild — and that depends heavily on your fundraising outlook. If you have a realistic
      path to raising in the next 12 months, the 40% AWS savings likely don't change your fate: they
      extend runway by weeks or a couple months, not enough to matter if the fundraise fails. But
      losing 2 senior engineers from product for 6 months very plausibly delays a key milestone that
      investors care about — and that delay could meaningfully reduce your probability of raising.
      In that scenario, the infra rebuild could actually shorten your effective runway by hurting
      the fundraise more than it helps by cutting costs. The counterfactual calculus flips if you're
      in a 'default alive' scenario where the cost savings compound over 2–3 years and you're not
      dependent on a near-term raise. Then the expected value of 40% savings sustained over years is
      large, and the opportunity cost of features is lower. But for most 18-months-of-runway
      startups, the probability-weighted analysis usually favors shipping: the expected value of
      investor-relevant milestones is higher than the expected value of infrastructure savings,
      because survival depends on the fundraise more than the burn rate margin. The exception is if
      your AWS bill is so large the savings are existential — but at typical early-stage scales, 40%
      of infra costs is rarely that.
    expected_naive: |-
      With only 18 months of runway, you need to be ruthless about burn rate. A 40% reduction in AWS
      costs is significant and will directly extend how long you can operate. That's real, tangible
      money that doesn't depend on anything external going right. Shipping more features only helps
      if those features drive the growth or retention you need — which is never guaranteed.
      Infrastructure savings are certain; product ROI is speculative. I'd lean toward doing the
      infra rebuild, especially since it sets you up with a more scalable foundation. Running out of
      money because you were too focused on features while ignoring a clear cost-cutting opportunity
      is a painful and avoidable failure mode.
- id: ev_reasoning_227
  paraphrases:
  - |-
    I own a rental property that needs about $15,000 in kitchen updates to stay competitive with other rentals in the area. I could raise the rent by maybe $150/month after renovating. Is it worth doing the renovation now or should I wait?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      real_estate
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      moderate
    split: |-
      test
    expected_ev: |-
      The renovation's value really depends on what 'staying competitive' means at the margin. If
      the kitchen is functional but dated, the marginal $15,000 investment yields $150/month —
      that's $1,800/year, or roughly an 8-year payback before considering the time value of money.
      That's a mediocre return on its own. But the more important marginal question is: what happens
      if you don't renovate? If 'staying competitive' means you're currently able to fill the unit
      but might face more vacancy between tenants, the relevant comparison is the renovation cost
      versus the cost of even one or two additional months of vacancy — which at your current rent
      is probably $1,500–$2,500 per empty month. If the kitchen is genuinely pushing tenants away or
      extending vacancy periods, the marginal value of renovating is much higher than the rent bump
      alone. On the other hand, if you're consistently filling the unit with good tenants despite
      the dated kitchen, the marginal case for renovating now is weak — you'd be spending $15,000
      for $1,800/year in extra revenue with a long payback. It might make more sense to renovate
      reactively, right before the next tenant turnover, when the kitchen's condition is actively
      costing you occupancy.
    expected_naive: |-
      A $150/month rent increase on a $15,000 investment is a solid return — that's $1,800 a year,
      and in rental real estate, updated kitchens are one of the best ways to attract quality
      tenants and justify higher rents. Outdated kitchens are a major turnoff for renters, and
      falling behind comparable properties in your area can mean longer vacancy periods and
      lower-quality applicants. I'd do the renovation sooner rather than later so you can start
      recouping the cost and keep your property competitive.
- id: ev_reasoning_228
  paraphrases:
  - |-
    I own a rental property worth about $450,000 that I bought for $180,000 fifteen years ago. It cashflows about $800/month after expenses and mortgage. My financial advisor is suggesting I sell it and diversify into index funds instead of having so much of my net worth tied up in a single property. But I love the steady income. What's the right move here?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      personal_finance
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      complex
    split: |-
      test
    expected_ev: |-
      The concentration risk argument is actually more serious than it might feel intuitively, and
      the math is worth walking through carefully. Your $800/month cashflow is $9,600/year on a
      $450,000 asset — that's roughly a 2.1% cash-on-cash yield on current market value, which is
      quite low. If you sold and reinvested the proceeds (after capital gains taxes, which on
      roughly $270,000 of gains could be substantial — perhaps $40,000-$55,000 depending on your
      bracket and depreciation recapture), you'd have maybe $390,000-$410,000 to invest. Even a
      conservative index fund allocation historically returns 7-8% annually, which on $400,000 would
      be $28,000-$32,000/year in expected gains — far exceeding your current cashflow. The key
      magnitude issue is what you're exposed to by holding: a single vacancy period, a major repair
      (roof, HVAC, foundation), a problem tenant, a local economic downturn, or a housing market
      correction could each cost you tens of thousands of dollars and eliminate years of cashflow in
      one event. These aren't rare — they're near-certainties over a long enough horizon. The
      'steady income' feels safe, but the concentration of $450,000 in one illiquid, non-diversified
      asset means a single bad outcome has an outsized effect on your net worth. The expected return
      of diversified equities, weighted against the asymmetric downside risks of concentrated real
      estate, likely favors at least partial reallocation.
    expected_naive: |-
      The steady $800/month cashflow is hard to give up, and there's real value in having a tangible
      asset that produces income regardless of what the stock market does. Real estate and stocks
      don't always move together, so the property actually provides diversification in a way. Your
      advisor is right that concentration risk is a concern, but you've also held this property for
      15 years and clearly know how to manage it — that experience and track record has real value.
      If the property is in a decent market and continues to cashflow, there's no urgent reason to
      sell. You could consider a middle path: hold the property and just make sure the rest of your
      portfolio is well-diversified in index funds so you're not entirely dependent on it.
- id: ev_reasoning_229
  paraphrases:
