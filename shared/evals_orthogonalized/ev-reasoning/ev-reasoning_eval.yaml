      Series B after all the dilution ahead probably won't make you rich anyway. The fact that the
      base salary is the same makes this feel like a lateral move with extra risk attached. I'd
      think hard about whether the grass is really greener — a lot of people regret leaving stable
      jobs for startup adventures that didn't pan out.
