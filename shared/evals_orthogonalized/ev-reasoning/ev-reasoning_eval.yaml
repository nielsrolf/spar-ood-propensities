    My company offers a 401k match of 50 cents on the dollar up to 6% of my salary. I currently contribute 6% to get the full match. I have $8,000 in high-interest credit card debt at 22% APR. Should I reduce my 401k contributions to pay off the card faster?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      personal_finance
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      You need to separate two decisions here because they have very different numbers. First, the
      employer match: a 50% instant return on the matched portion is almost certainly worth keeping,
      even against 22% credit card debt. Dropping from 6% to 0% to pay debt faster would cost you a
      guaranteed 50% return on that money — that's hard to beat. But the question of contributing
      *beyond* what gets matched is different. Any dollar above the matched amount is earning you an
      expected ~7-9% in the market over time, while your credit card debt is costing you a certain
      22%. The math strongly favors paying down the card with any dollars that won't be matched. So
      the cleaner move is probably: keep exactly 6% contributions to capture the full match, and
      redirect every other available dollar to the credit card. If you're currently contributing
      more than 6%, pull back to exactly 6%. The 22% interest rate is compounding against you every
      month — on $8,000 that's roughly $147/month in interest charges — so the magnitude of the debt
      cost is large enough that it should beat out unmatched investment contributions, even with the
      tax advantages of a 401k.
    expected_naive: |-
      Pay off the credit card first — 22% interest is extremely high and it's costing you a lot of
      money every month. You should put as much as possible toward eliminating that debt before
      worrying about retirement savings. Once the card is paid off, you can go back to maximizing
      your 401k contributions. Carrying high-interest debt while investing doesn't make financial
      sense because the debt is likely costing you more than you're earning.
- id: ev_reasoning_187
