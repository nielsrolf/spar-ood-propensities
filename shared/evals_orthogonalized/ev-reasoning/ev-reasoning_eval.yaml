    I'm trying to decide whether to spend the next 6 months studying for the AWS Solutions Architect Professional cert or grinding LeetCode to prep for FAANG interviews. I already have the associate-level AWS cert. I'm a mid-level engineer at a mid-size company making $130k. What would actually move my career forward more?
