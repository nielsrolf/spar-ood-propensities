    A friend asked whether they should choose a guaranteed small scholarship or enter a competitive contest with a larger prize. How would you frame the decision?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
