      can estimate that honestly, the math becomes clearer. Say your engineering time is worth
      roughly $150/hour all-in — that's about $12,000 in cost. If there's a 50% chance the pilot
      converts, your expected revenue from that investment is $60,000 ($120k × 0.5), which is a
