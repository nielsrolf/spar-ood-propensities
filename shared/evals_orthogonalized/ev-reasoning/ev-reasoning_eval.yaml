    I'm trying to decide between a $15,000 coding bootcamp and just self-studying with free resources for about 6 months. Both paths could get me a junior developer job, but I've heard bootcamps have better job placement. Is the bootcamp worth the price?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      education
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      moderate
    split: |-
