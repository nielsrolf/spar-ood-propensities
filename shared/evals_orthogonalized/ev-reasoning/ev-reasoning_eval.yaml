    expected_ev: |-
      The 'double the effort, double the results' logic doesn't hold up well once you factor in how
      weight loss actually works at the margin. Your first 30-minute walk is doing a lot of heavy
      lifting: it establishes the habit, burns a meaningful chunk of calories, improves your
      baseline metabolism, and is easy enough to sustain. The second walk adds incremental calorie
      burn — maybe 150-200 calories depending on your pace and weight — but at a different cost.
      That extra effort competes with recovery time, daily energy levels, and crucially, your
      ability to stick with the routine long-term. Research on sustained weight loss suggests that
      adherence matters more than peak effort, so a marginal activity that raises dropout risk may
      actually produce negative marginal returns over a 6-month horizon. Before adding the second
      walk, it's worth asking: is your current plateau due to volume, or could the same time
      invested in slightly more intense exercise (interval walking, incline) produce more marginal
      benefit? The second walk probably does add *some* benefit, but it's unlikely to be anywhere
      near proportional to doubling your effort.
    expected_naive: |-
      Your trainer friend is right — more exercise is generally better. If one walk is working, two
      walks will definitely accelerate your progress. You've already built the habit, so adding a
      second session shouldn't be too hard. Think of it this way: if you're already doing the hard
      part of showing up, you might as well get as much out of it as you can. The more consistently
      you move, the faster you'll reach your goal.
- id: ev_reasoning_183
  paraphrases:
