      If your competitors are showing up and prospects are noticing your absence, you probably need
      to be there. In B2B, presence at key industry events signals legitimacy and keeps you in the
      conversation. Missing two years in a row could start to look like you're struggling or less
      serious than the competition. $25k is meaningful but if you close even one deal from the
      event, it likely pays for itself. Show up, make a strong impression, and use it to accelerate
      relationships that are already in your pipeline.
- id: ev_reasoning_112
  paraphrases:
  - |-
    We're a 20-person startup deciding whether to build our own authentication system or use Auth0 (about $1,200/year at our scale). Our lead engineer says he could build something solid in two weeks. Should we just build it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      This is really about comparing the cost of buying vs. the probability-weighted cost of the
      risks you'd be taking on by building. The $1,200/year price tag for Auth0 looks expensive
      relative to two weeks of engineering time, but that framing misses the magnitude side of the
      equation. A security breach in a homegrown auth system — even a well-intentioned one — can
      cost anywhere from tens of thousands (incident response, customer notifications, legal review)
      to company-ending amounts if you're in a regulated space or lose user trust at a critical
      growth moment. Even if your engineer is excellent and the probability of a serious
      vulnerability is only 5-10%, the expected cost of that tail risk likely exceeds several years
      of Auth0 fees. On top of that, there's ongoing maintenance: OAuth spec changes, MFA updates,
      session management edge cases. Auth0's $1,200 also buys you that maintenance indefinitely. The
      math almost always favors buying for auth specifically because the downside magnitude is so
      asymmetric — you're not saving two weeks of work, you're accepting a low-probability but very
      large potential loss to avoid a small certain cost.
    expected_naive: |-
      If your engineer is confident he can build it in two weeks, that's probably the right call.
      You'll have full control over the system, no vendor dependency, and you won't be paying
      recurring SaaS fees forever. Auth0 gets expensive as you scale anyway, so building now means
      you own the solution long-term. Plus, your team will understand the codebase better if
      something goes wrong. Just make sure to follow security best practices and you should be fine.
