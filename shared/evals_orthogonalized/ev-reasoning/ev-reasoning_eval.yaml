      Whether travel insurance makes sense depends on comparing the $30 cost against the
      probability-weighted value of what it covers. For a $400 domestic flight, the most you could
      lose by skipping insurance is $400 — and that only happens if you cancel and the airline gives
      you nothing. Most domestic airlines let you rebook for a fee, so the real financial exposure
      is probably more like $100–200 in change fees or partial refunds. Even if there's a 20% chance
      you need to make a change, the expected loss is around $20–40. At $30, the insurance is
      roughly a wash or slightly overpriced for the pure financial risk. Unless you have a specific
