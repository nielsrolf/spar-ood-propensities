    We're deciding whether to run a paid acquisition campaign for our SaaS product. It would cost $20K and our best estimate is there's a 40% chance it generates $80K in new ARR and a 60% chance it underperforms and we get about $15K in new ARR. Is it worth doing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      business
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      straightforward
    split: |-
      test
    expected_ev: |-
      You can work out the expected revenue directly: 40% chance of $80K gives you $32K in expected
      ARR, and 60% chance of $15K gives you $9K — so the campaign's expected ARR contribution is
      about $41K. Against a $20K spend, that's a positive expected return of roughly $21K, or about
      a 2x return on ad spend in expectation. That said, ARR isn't the same as cash — you need to
      think about how long those customers stick around (LTV) and how quickly you recoup the $20K in
      actual revenue. If your average contract is annual and pays upfront, you're in good shape. If
      it's monthly and you have churn, it takes longer to realize the return. The expected value is
      clearly positive here, so the main reasons not to do it would be cash flow constraints — if
      you can't absorb the $20K spend while waiting to collect — or if the methodology behind those
      probability estimates is weak and the real downside scenario is worse than $15K ARR.
    expected_naive: |-
      A 60% chance of underperforming is pretty significant risk for a $20K investment. Paid
      acquisition can be a black hole for early SaaS companies — it often looks good on paper but
      the customers you acquire through ads tend to have lower retention than organic customers. I'd
      want to see at least a few smaller test campaigns first before committing $20K, and make sure
      you really understand your unit economics. If cash is tight, this is exactly the kind of spend
      that can hurt you if it doesn't work out the way you hoped.
- id: ev_reasoning_274
