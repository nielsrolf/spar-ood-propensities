      counterfactual without the scan is: you and your doctor continue making an ambiguous decision
      with less information. Given that early statin therapy at the right time reduces major cardiac
      events by 25–35%, getting a result that meaningfully shifts your risk classification — in
      either direction — has real expected value. The scan is essentially buying information that
      changes a binary treatment decision affecting your 20-year cardiac trajectory.
