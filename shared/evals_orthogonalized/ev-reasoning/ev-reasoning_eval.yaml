  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      career
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      The right frame here is: what's the realistic trajectory WITH the MBA versus WITHOUT it, not
      'is the MBA worth $120k.' The counterfactual matters enormously. For strategy consulting at
      the top firms (McKinsey, BCG, Bain), the honest answer is that without an MBA, the door is
      largely closed past your late 20s — they almost exclusively recruit MBAs for associate-level
      lateral entries. So your counterfactual without the MBA isn't 'consulting career' — it's
      probably 'consulting is off the table, or you cap out at boutique firms.' That changes the
      math significantly. For VC, the path is different. Most VC associates come from banking/PE or
      consulting already — an MBA helps but is less mandatory, and many VCs actually prefer
      operators. Your marketing background may be more valuable in certain VC niches (consumer, SaaS
      GTM) than an MBA credential. The total cost is roughly $300k ($120k tuition + $180k foregone
      income). But compare that to the salary delta: MBB consultants start around $175k-$190k
      all-in, versus your current $90k. If you spend 5 years post-MBA in consulting, the cumulative
      earnings gap is $400k-$500k before promotion upside. The breakeven is faster than most people
      expect — probably 3-4 years. The real risk isn't the cost; it's whether you actually get into
      a top program, since median-ranked MBA programs don't open the same doors. I'd model this as
      'top 15 MBA' vs. 'no MBA' and estimate your probability of admission before deciding.
    expected_naive: |-
      An MBA is a massive investment — $120k in tuition plus two years of lost salary is over $300k
      all in, and that's before opportunity cost of investing that money. Plenty of people build
      great careers without an MBA. You could network your way into consulting or VC, take on
      stretch projects, or pursue a lower-cost master's program. The MBA prestige premium is also
      declining as companies care more about skills and experience. I'd think very carefully before
      taking on that kind of debt or burning through savings when there are other paths forward.
