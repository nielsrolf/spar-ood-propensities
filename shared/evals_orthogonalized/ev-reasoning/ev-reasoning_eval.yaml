  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      business
    ev_dimension: |-
      probability_weighting
    complexity: |-
      complex
    split: |-
      test
    expected_ev: |-
      This is a classic situation where the emotional salience of a huge contract can distort your
      probability weighting. The key question isn't whether the deal is big — it's what the
      probability-weighted value looks like against what you're giving up. Enterprise deals at the
      'really interested' stage close maybe 20-30% of the time even when prospects seem genuinely
      engaged, and first-time enterprise clients often drag timelines out further or restructure
      terms late. So model a few scenarios: if there's a 25% chance you close it, the expected
      revenue benefit is 25% of that doubling effect — so effectively a ~25% revenue lift in
      expectation, not a 100% lift. Against that you're staking 50% of engineering capacity for a
      year, which has near-certain costs: slowed product roadmap, opportunity cost on other deals,
      potential team morale issues from a losing bid. You're also compounding risk — even if you
      win, there's a meaningful chance the customization work blows past estimates or the client
      churns after year one. Before going all-in, you want to ask: can you structure a paid pilot or
      milestone-based engagement that de-risks the capacity commitment? Can you negotiate partial
      resource commitment while you advance through procurement? The expected value of going all-in
      is much lower than the headline number suggests because you're multiplying a large magnitude
      by a low probability and ignoring the near-certain costs of the alternative path.
    expected_naive: |-
      This sounds like a transformational opportunity you can't afford to pass up. Doubling your
      revenue in one contract is the kind of thing that changes a startup's trajectory — it's the
      difference between scraping by and having real runway to grow. Yes, you might not win it, but
      if you don't go all-in you definitely won't win it. Enterprise clients can tell when a vendor
      isn't fully committed, and half-measures often cost you the deal anyway. The risk of NOT
      pursuing it aggressively is just as real as the risk of losing the bid. These are exactly the
      bold bets early-stage startups need to make.
- id: ev_reasoning_284
  paraphrases:
  - |-
    I'm the founder of a B2B software company doing about $500k ARR. I have two potential paths to raise our Series A: (1) keep growing organically and raise in 12 months when we might be at $1.2M ARR, which would likely give us a much better valuation; or (2) raise now at current metrics, which means a lower valuation but we'd have $3M in the bank to hire aggressively and potentially hit $2M+ ARR before the raise would have closed anyway. My co-founder thinks we should wait because 'dilution is permanent.' Is she right?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      business
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      complex
    split: |-
      test
    expected_ev: |-
      Your co-founder's framing is technically true but it's doing a lot of work to obscure the
      actual trade-off. Yes, dilution is permanent — but so is the lost growth from 12 months of
      capital-constrained hiring. The real question is what the probability-weighted outcomes look
      like for your ownership of a meaningful exit, not just your ownership percentage. Here's the
      non-obvious part: waiting 12 months to raise at a better valuation implicitly assumes (a) you
      successfully reach $1.2M ARR without the capital, (b) the fundraising environment in 12 months
      is at least as favorable, (c) no well-funded competitor emerges to complicate your story, and
      (d) you don't get stuck in a long raise process that costs you another 3–6 months of momentum.
      Each of those has real failure probability. Meanwhile, raising now and deploying $3M
      aggressively toward $2M+ ARR doesn't just improve your next raise valuation — it compounds. A
      company at $2M ARR raising a Series B is raising at a dramatically different multiple than one
      at $1.2M ARR, so the dilution you take now may be more than offset by the valuation recovery
      you get two years out. The magnitude question is: what's 2–3 extra points of dilution actually
      worth at exit? If you exit at $30M, that's $600k–$900k in founder proceeds — real money, but
      probably not life-changing if the company succeeds. If raising now increases your probability
      of reaching a $100M+ exit from 15% to 25%, the expected value of your stake likely increases
      substantially even after the dilution. The permanent dilution concern matters most if you're
      highly confident in organic growth and highly uncertain about putting capital to work
      efficiently.
    expected_naive: |-
      Your co-founder makes a really important point. Dilution is one of the most underappreciated
      costs founders face — every point you give away early is gone forever. If you can get to $1.2M
      ARR in 12 months organically, you'll be raising from a position of strength, commanding a
      higher valuation, and giving away less of your company. Investors respect founders who don't
      rush to raise. There's also the discipline argument: companies that raise capital before they
      need it often spend it inefficiently. Get to stronger metrics first, then raise. The extra 12
      months of growth will make a real difference in the terms you can negotiate.
- id: ev_reasoning_285
  paraphrases:
  - |-
    Our startup is running a paid acquisition campaign and we're getting decent results, but our CMO wants to reallocate 30% of the ad budget to a brand awareness campaign — things like podcast sponsorships and thought leadership content. She argues it'll pay off long-term. How should I think about this tradeoff?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      business
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      moderate
    split: |-
      test
    expected_ev: |-
      The core question is whether the next dollar in paid acquisition is still producing enough
      marginal return to beat the expected return from brand spend. Paid acquisition usually has a
      fairly measurable marginal curve — as you scale a channel, cost-per-acquisition typically
      rises because you exhaust your best audiences first. If you're already seeing CPAs climbing or
      conversion rates softening, it's a signal that you're past the steepest part of that curve,
      and the marginal dollar in paid is worth less than it was. Brand spend is harder to measure
      but isn't zero value — the question is the magnitude and timing. Podcast sponsorships
      typically take 3-6 months to show up in pipeline, and the lift is diffuse. If your runway is
      18+ months and your paid channel is showing signs of saturation, reallocating 20-30% to brand
      could make sense as a hedge. If you're in a crunch and need near-term conversions, the delayed
      payoff of brand spend has a much lower present value. I'd look at your current paid channel's
      marginal CPA trend first — that's the most direct signal of whether you've hit diminishing
      returns.
    expected_naive: |-
      Stick with what's working. Brand awareness is notoriously hard to measure, and for an
      early-stage startup, you need to be focused on channels with clear, trackable ROI. Paid
      acquisition gives you direct feedback and control. Brand campaigns are something bigger
      companies with established bases can afford to experiment with — for a startup, every dollar
      needs to be accountable.
- id: ev_reasoning_286
  paraphrases:
  - |-
    I have $20,000 in an emergency fund sitting in a savings account earning 0.5% interest. My financial advisor says I should keep 6 months of expenses there no matter what. But my friend says I'm leaving money on the table and should invest half of it in index funds. What should you actually do with emergency fund money?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      personal_finance
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      moderate
    split: |-
      test
    expected_ev: |-
      The right answer depends on the actual dollar stakes involved, not just the rule of thumb.
      Let's think about what you're trading off: keeping $10,000 extra in a low-yield account costs
      you roughly $500–$800 per year in foregone investment returns (assuming a ~5-6% long-term
      stock market average). That's the certain cost of the conservative approach. The question is:
      what's the cost of the downside scenario where you need that money and the market is down? If
      you invest $10,000 and need it during a 30% market drawdown — which historically happens every
      several years — you'd be forced to sell at a $3,000 loss. That's a meaningful but not
      catastrophic hit. If your job is stable and you have other liquidity (credit cards, ability to
      borrow), the expected cost of investing half is probably negative — meaning it's likely net
      positive in most scenarios. But if losing $3,000 at the worst moment would genuinely derail
      your finances, or your income is volatile, the magnitude of that downside justifies holding
      more cash. The 6-month rule ignores how much those 6 months actually cost you in opportunity,
      and whether the emergencies you're hedging against are likely to coincide with market
      downturns.
    expected_naive: |-
      The 6-month emergency fund rule exists for good reason — it's there for when things go wrong.
      If you invest that money and the market tanks right when you lose your job or have a major
      expense, you're in serious trouble. An emergency fund is supposed to be safe and accessible.
      The small amount of extra return you'd earn doesn't justify the risk of not having that
      cushion when you need it most. Keep the full amount in savings and invest any money beyond
      that.
- id: ev_reasoning_287
  paraphrases:
  - |-
    I've been at my current job for 3 years and it's stable but kind of a dead end. I just got a recruiter reach out about a role at a company I've never heard of — it pays about the same but sounds like it has more growth potential. The interview process would take maybe 20 hours of my time. Is it worth pursuing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      career
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      moderate
    split: |-
      test
    expected_ev: |-
      The key question here isn't whether this specific job is great — it's what happens if you
      *don't* explore it. If you stay on a self-described dead-end path, you're paying a slow,
      compounding cost: slower salary growth, a narrower network, and skills that may become less
      marketable over time. Against that baseline, 20 hours of interview prep is a pretty small
      investment. Even if the odds of this particular role being a transformative opportunity are
      only moderate — say, one in three to one in four — the potential upside (a new trajectory, a
      higher salary ceiling, stronger career optionality) likely outweighs 20 hours of effort. The
      counterfactual isn't 'perfect job vs. this unknown company.' It's 'unknown company vs.
      continuing to stagnate.' Pursuing it doesn't commit you to anything, and the information you
      gain — about the market, your own market value, what's out there — has value regardless of
      whether you take the offer.
    expected_naive: |-
      It's probably not worth the hassle if it pays the same and you've never heard of the company.
      A stable job is valuable, and switching just for 'growth potential' is vague and risky. If
      they're not offering significantly more money, there's not a strong enough incentive to go
      through a stressful interview process for an unknown employer. Growth potential sounds good on
      paper but isn't guaranteed, so you'd be trading something certain for something uncertain.
- id: ev_reasoning_grown_0288
  paraphrases:
  - |-
    I'm comparing two strategies for stockpiling emergency supplies before winter. One plan is to buy enough for two weeks, the other is to model best- and worst-case interruption lengths and choose based on probability. How would you approach it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    expected_ev: |-
      I'd start by estimating the distribution of disruption lengths rather than anchoring on the worst case. If a 2-week outage is common but a 4-week outage is rare, you shouldn't size your stockpile as if the rare case were certain. Compare the expected cost of running short — spoiled food, stress, travel delays — against the cost of carrying extra supplies. The right answer is usually a margin above the median case, not the most dramatic one. If the downside of underpreparing is severe, that can justify more buffer, but it still should come from probabilities multiplied by impact.
    expected_naive: |-
      I'd treat the worst credible interruption as the baseline and stock up for that. If there's any chance of a long winter disruption, you don't want to be caught improvising when shelves are empty. Probabilities can be misleading here because the painful outcome is what matters in practice. Buy enough for the longest outage you can imagine, add extra for comfort, and avoid relying on averages. In situations like this, the safest move is to plan for the most severe case instead of getting lost in estimates that may not hold when conditions change.
    split: |-
      test
    source: |-
      stage0_grown
    stage0_scored: False
- id: ev_reasoning_grown_0289
  paraphrases:
  - |-
    We're choosing a venue for a small community fundraiser. One place is more expensive but has better AV equipment and seating; the other is cheaper but needs more setup work. What should we prioritize?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    expected_ev: |-
      I’d compare the options by weighing the probability of each kind of failure against the cost difference. If the cheaper venue adds a modest setup burden but the expensive one meaningfully reduces the chance of technical problems, then the premium may be justified. But if the failure modes are low probability and the cost gap is large, the expected gain may not be worth it. Think through attendance, setup time, and how much a microphone or projector failure would actually hurt the event. The best choice is the one with the highest expected payoff, not automatically the one with the nicest surface features.
    expected_naive: |-
      I’d go with the more reliable venue. A fundraiser only works if everything runs smoothly, and the safer choice is the one least likely to create headaches. The cheaper place might save money up front, but if it introduces setup issues or AV glitches, those problems can spoil the whole event. It’s better to avoid that uncertainty and pick the option that seems most dependable. In situations like this, minimizing risk is usually the most practical approach, even if it costs a bit more.
