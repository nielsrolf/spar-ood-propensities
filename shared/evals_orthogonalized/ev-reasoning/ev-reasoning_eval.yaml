    I'm 28 and trying to decide between a two-year full-time MBA at a top-10 school (total cost including lost income is probably $250,000) versus staying in my current marketing career and just taking a few online courses. I want to eventually move into strategy consulting or go to a senior leadership role at a company. What's the honest financial case for the MBA?
  samples_per_paraphrase: 3
