    I'm a software engineer and I'm considering spending 6 months learning machine learning seriously — like dedicating my evenings and weekends. My current skills pay well but ML roles seem to pay even more. The thing is, I'm not sure how hard it is to actually break in, and there's a chance I spend all that time and don't end up in an ML role anyway. Thoughts?
