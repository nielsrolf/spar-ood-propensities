    I've been practicing piano for 2 years and can play intermediate pieces. I'm debating whether to spend my next 200 hours of practice on mastering 3-4 difficult pieces perfectly or learning a wider variety of 15-20 easier pieces. Which approach will make me a better pianist in the long run?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      everyday
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      complex
    split: |-
      test
    expected_ev: |-
      The marginal value of each additional hour differs significantly between these two strategies
      depending on what stage you're at and what 'better pianist' means to you. At the intermediate
      level, the last 20-30% of work needed to fully perfect a difficult piece — nailing the hardest
      passages, achieving true musical expression, handling performance pressure — develops skills
      that breadth simply can't replicate. These are high-difficulty marginal hours that compound:
      the problem-solving you do isolating a tricky passage, the finger independence you build in a
      hard transition, transfers to every future piece at that difficulty tier. However, the returns
      are front-loaded. The first 60-70% of learning a difficult piece builds most of the technical
      skill; the remaining hours chasing perfection yield diminishing technique gains, mostly buying
      performance polish. Meanwhile, breadth builds pattern recognition — chord shapes, common
      progressions, stylistic conventions — and those patterns have compounding value across your
      entire library. A mixed approach that's skewed toward depth is probably optimal: spend roughly
      60% of hours on 2 difficult pieces taken to near-mastery, and 40% cycling through varied
      easier material. This captures the high-value marginal hours in the difficult pieces while
      also building the pattern library that makes learning future pieces faster.
    expected_naive: |-
      For long-term improvement, you should focus on mastering the difficult pieces. Quality over
      quantity is the foundation of serious musical training — that's why classical conservatories
      have students spend entire semesters on a handful of pieces. Learning something properly and
      deeply is far more valuable than skimming the surface of many pieces. Plus, the discipline of
      truly mastering challenging material will build the technical foundation you need to
      eventually tackle even harder repertoire. The 15-20 easier pieces might feel productive
      because you're learning more songs, but you'll likely develop bad habits and plateau faster.
