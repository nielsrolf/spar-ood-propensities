      always prioritize the kitchen and it creates a great first impression. You're unlikely to get
      100% back, but in a competitive market it can be the difference between selling quickly and
      sitting on the market. A $35,000 renovation that helps you sell even $20-25k higher and weeks
      faster is usually worth it. Plus, a dated kitchen gives buyers ammunition to negotiate the
      price down aggressively.
- id: ev_reasoning_136
