    expected_ev: |-
      The key question isn't whether an MBA has value in isolation, but what you'd realistically
      achieve *without* it versus with it. Software developers with 5 years of experience already
      have a credible path into product management — many companies actively recruit engineers into
      PM roles, and there are PM-focused bootcamps or even self-study routes (reading, side
      projects, internal transfers) that cost a fraction of $60k. So the counterfactual isn't 'MBA
      vs. staying a developer forever' — it's 'MBA vs. transitioning via the several realistic
      alternatives.' If you could land a PM role in 1-2 years through an internal transfer or a
      targeted job search, the $60k + 3 years of weekends needs to deliver something meaningfully
      better: a faster path to senior leadership, access to a strong alumni network in your target
      industry, or signal value at companies that gatekeep PM roles by pedigree. For most mid-size
      tech companies, that marginal advantage is modest. For consulting-heavy or finance-adjacent
      product roles, it might matter more. The honest EV calculation here hinges on your specific
      target companies and whether your non-MBA path is actually as accessible as it looks — which
      for most experienced engineers, it is.
    expected_naive: |-
      An MBA is a significant investment and you should think carefully before committing. $60k and
      three years of nights and weekends is a real sacrifice, and there's no guarantee it translates
      into a PM or leadership role — plenty of MBA grads don't end up where they planned. On the
      other hand, the credential and network can open doors that are hard to open otherwise. If
      you're serious about leadership, an MBA from a reputable school gives you credibility and
      teaches business fundamentals you might be missing as an engineer. It really comes down to how
      ambitious you are and whether you're willing to make that sacrifice.
- id: ev_reasoning_146
