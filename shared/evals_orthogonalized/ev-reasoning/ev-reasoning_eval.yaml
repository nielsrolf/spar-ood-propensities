    expected_ev: |-
      The right question isn't whether the renovation 'pays back' in isolation — it's what happens
      to your sale if you DON'T renovate. That counterfactual matters a lot here. In most markets, a
      dated kitchen doesn't just mean a lower price; it also means longer time on market, more buyer
      negotiations, and a narrower pool of buyers willing to make an offer at all. The question is
      whether skipping the renovation leads buyers to discount your price by more or less than
      $35,000. If comparable renovated homes in your neighborhood are selling for $50-60k more than
      unrenovated ones, the renovation might return $20-25k net — not a full recovery, but better
      than taking a $50k hit on price or sitting on the market for months with carrying costs adding
      up. On the other hand, if the price gap between renovated and unrenovated comps is only
      $20-25k, the renovation loses money outright. Ask your realtor for actual sold-price
