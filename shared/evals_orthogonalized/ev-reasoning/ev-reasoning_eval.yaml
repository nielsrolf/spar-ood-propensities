    I'm thinking about hiring a contract recruiter to fill a senior engineer role. They charge a 20% fee on first-year salary — the role pays $180k, so that's $36k. My team has been trying to fill the role internally for 3 months with no luck. Is it worth paying the fee?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      business
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      straightforward
    split: |-
      train
    expected_ev: |-
      The right way to think about this is: what's the cost of NOT hiring the recruiter? You've
      already spent 3 months trying internally with no result. Every additional month the seat stays
      open has a real cost — your team is stretched, work isn't getting done, and if this is a
      senior engineer, the productivity gap is probably $15k–$20k per month in opportunity cost,
      conservatively. So the question isn't '$36k vs. $0' — it's '$36k vs. another 2–3 months of
      vacancy plus the ongoing internal effort.' If a recruiter could close the search in 4–6 weeks,
      you're likely coming out ahead just on the time value, before even accounting for the quality
      difference in candidates. The fee looks expensive in isolation, but compared to the
