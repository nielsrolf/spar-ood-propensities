      in contract value, then a 30% probability puts your expected revenue return between $15,000
      and $30,000 from an $8,000 spend — that's a positive expected return even at the low end. The
      catch is whether your team's 30% estimate is well-calibrated. You mentioned most past
      conferences haven't led to direct sales, which might suggest the real probability is lower. If
      history puts it closer to 10%, then expected revenue is $5,000–$10,000 on an $8,000 cost,
      which is closer to breakeven or slightly negative. I'd lean on your actual historical data
      more than gut feel here — if you can tighten that probability estimate, the decision gets much
      clearer.
    expected_naive: |-
      If most conferences haven't led to direct sales for you in the past, I'd skip this one. $8,000
      is real money, and a 30% chance of a deal isn't very high — that means there's a 70% chance
      you walk away with nothing to show for it. Unless this is a uniquely important conference for
      your specific buyers, it sounds like the pattern here is that conferences just don't work well
      for your sales motion. Put that $8,000 toward channels that have actually worked for you.
