    I'm a junior in college weighing two options after graduation: a $65k/year analyst job at a consulting firm, or a 12-week coding bootcamp ($15k cost) followed by trying to break into software engineering. My friends say bootcamps are a risky bet and I should take the stable job. But I've heard software engineers can make a lot more. How should I think about this?
