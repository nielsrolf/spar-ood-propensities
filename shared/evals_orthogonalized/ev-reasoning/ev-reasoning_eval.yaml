    expected_ev: |-
      The cost side here is larger than it looks at first. The $85k in tuition is just the start — a
      delayed promotion cycle at your level likely means missing a raise of $15–25k/year for
      potentially 2 years, plus a delayed jump to a higher title. That's another $30–50k in
      opportunity cost, putting your total investment closer to $130–150k when you include lost
      earnings and career momentum. The payoff depends heavily on what you're trying to unlock. For
      PMs, a top-20 MBA has meaningful but uneven returns. If your goal is to move into strategy
      consulting, investment banking, or break into a FAANG-level product role you otherwise
      couldn't access, the salary uplift can be $40–80k/year permanently. Over a 20-year career that
      compounds dramatically — even a $30k/year raise sustained for 15 years is $450k+ in additional
      earnings, before accounting for the compounding effect on future raises and equity grants. But
      if you're already on a strong PM track and the MBA mostly validates a path you're already on,
      the incremental salary bump might be $10–20k/year — and that payback period on $150k invested
      is 8–10 years, which is marginal. The magnitude of the upside is large only if the degree
      opens doors that are currently closed to you. The honest analysis is: map out the specific
      roles you're targeting that require or heavily favor an MBA, research the salary bands, and
      estimate the probability you actually land there post-degree. If there's a 40% chance of a
      $50k permanent raise, that's $20k expected annual return — a decent IRR on $150k. If it's a
      15% chance of a $25k raise, it barely breaks even.
    expected_naive: |-
      An MBA from a top-20 program is a great investment in yourself and can really open doors. $85k
      is significant, but it's the kind of credential that pays for itself over time through better
      job opportunities, higher salaries, and stronger networks. The fact that you're mid-career
      actually makes this a smart time to do it — you'll have context to get more out of the program
