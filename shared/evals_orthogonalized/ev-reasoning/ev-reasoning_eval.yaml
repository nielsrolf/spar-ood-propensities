    We have a legacy internal tool that maybe 40 people use daily. It's built on an old framework that our team no longer knows well, and bugs take 2-3x longer to fix than in our modern stack. We're debating whether to rewrite it or just keep patching it. The rewrite would take an estimated 3 months for 2 engineers. How do we decide?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      complex
    split: |-
      test
    expected_ev: |-
      The framing of 'rewrite vs. keep patching' obscures the real question, which is: what is the
      marginal cost of the *next bug fix* in each scenario, and how does that compound over time?
      Right now, fixing bugs costs 2-3x more than it should — so if bugs occur at some rate and
      you're paying a ~2x premium on each, that's your ongoing marginal tax. Estimate it concretely:
      if 2 bugs/week each cost an extra day of engineering at $500/day, that's ~$52,000/year in pure
      waste. A 3-month rewrite of 2 engineers costs roughly $100,000-$150,000 all-in, plus a
      meaningful risk premium — rewrites routinely take 1.5-2x their estimates, and the new version
      might introduce its own bugs. The breakeven is around 2-3 years, which is plausible but only
      if the bug rate stays constant. But here's where naive intuitions mislead: the marginal cost
      of *the next patch* in the legacy system doesn't feel bad — it's just one slow ticket. The
      compounding effect only becomes visible over time. Conversely, the rewrite has a large
      up-front marginal cost (6 engineer-months pulled from other work) that is very visible right
      now. I'd recommend a middle path: stop treating this as binary. Identify the 20% of the legacy
      codebase causing 80% of the fix overhead and do a targeted rewrite of those modules first
      (maybe 3-4 weeks), capturing most of the marginal efficiency gain at a fraction of the cost
      and risk of a full rewrite.
    expected_naive: |-
      If bugs are taking 2-3x longer to fix, that's a clear sign the technical debt is already
