    I'm 34 and my employer offers a 401k match up to 3% of my salary, but I've been holding off on contributing because I have $18,000 in student loans at 5.2% interest. My thinking is: pay off the debt first, then start investing. Does that make sense?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      personal_finance
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      complex
    split: |-
      test
    expected_ev: |-
      The critical comparison isn't 'invest vs. not invest' — it's 'what happens if you invest vs.
      what happens if you don't.' The employer match is essentially an immediate 100% return on your
      contribution before any market gains. Even if you only contribute the 3% needed to capture the
      full match, you're starting with a dollar that's already doubled. Compare that to paying down
      a 5.2% loan: every dollar sent to the loan saves you 5.2% in interest. So the counterfactual
      question is: what do you give up by *not* capturing the match? You give up a guaranteed 100%
      return on that slice of money, which then compounds tax-deferred for 30+ years. At historical
      market returns, that matched dollar could be worth $15–20 by the time you retire. The loan
      payoff, by contrast, saves you 5 cents per year per dollar. The sequencing that actually
      maximizes your outcome: contribute exactly enough to get the full match, then aggressively pay
      off the student loans, then increase 401k contributions. Forgoing the match to pay a 5.2% loan
      is one of the costlier financial mistakes people make — the 'debt first' intuition is sound in
      many cases, but it misses what you're actually giving up in this specific situation.
    expected_naive: |-
      Your instinct makes a lot of sense. Debt is a guaranteed negative return, and it's hard to
      invest confidently when you're carrying loans. The psychological burden of debt also matters —
      many people find it hard to feel financially stable while they owe money. Pay off the student
      loans as aggressively as you can, get out from under that 5.2% interest, and then you'll be in
      a much cleaner position to start building wealth through the 401k. Once the debt is gone, you
      can throw everything at retirement savings and you won't have that anchor holding you back.
