    We have a monolithic Rails app that's been running for 6 years. We keep adding features and it's getting slower to deploy. Should we spend the next sprint migrating our authentication module to a microservice, or just keep building features the product team is asking for?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      moderate
    split: |-
      test
    expected_ev: |-
      The key question here isn't 'is tech debt bad' but rather: what does the *next sprint* of auth
      migration actually buy you, compared to the next sprint of feature work? Authentication
      modules tend to be relatively stable and low-churn — once it's extracted, you don't gain much
      on every future deployment unless auth is actually a bottleneck. So the marginal value of that
      extraction depends a lot on how often your team is touching or deploying auth-related code
      right now. If auth changes are rare, you might invest a full sprint and only recover a few
      hours over the next quarter. On the other hand, if the product team's requested features are
      in high-demand areas where velocity directly affects retention or conversion, the marginal
      value of shipping those sooner could be much larger. A more targeted question: which
      *specific* part of the monolith is actually slowing deploys the most? If it's not auth,
      migrating auth first gives you almost no marginal speed improvement per unit of effort — you'd
      be doing real architectural work for very little near-term payoff. It might make more sense to
      do a smaller, targeted cleanup (better test isolation, parallelizing the slowest test suite)
      that yields speed gains on every future deploy, rather than a full microservice extraction
      that pays off slowly and introduces new operational complexity.
    expected_naive: |-
      Tech debt is the kind of thing that compounds over time and becomes much harder to fix later,
      so it's usually better to address it proactively before it becomes a crisis. A 6-year-old
      monolith that's slowing deploys is a real problem — developer frustration and slow iteration
      cycles have hidden costs. I'd prioritize the auth migration now. Features can always be built
      later, but if your architecture becomes truly unmaintainable, you could end up needing a full
      rewrite, which is far more expensive than incremental cleanup. The product team will
      understand once they see the team moving faster after the refactor.
