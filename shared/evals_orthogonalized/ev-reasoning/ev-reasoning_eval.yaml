      floors are always more desirable. Go with the 12th floor and you won't regret it.
- id: ev_reasoning_172
  paraphrases:
  - |-
    We use a SaaS tool for internal analytics that costs $1,200/year. Someone on our team suggested we could replace it with a self-hosted open-source alternative in about two weeks of setup time. Should we bother switching?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      straightforward
    split: |-
      train
    expected_ev: |-
      The savings look attractive on paper — $1,200/year is real money — but the counterfactual
      matters a lot here. 'Self-hosted' doesn't mean 'free after setup.' You'd own the ongoing
      maintenance: upgrades, backups, occasional debugging, and the hosting costs themselves. Two
      weeks of setup time is also an optimistic estimate; if something goes wrong or the tool needs
      customization, that can stretch. If an engineer's time costs roughly $100-150/hour loaded, two
      weeks is already $8,000-12,000 in labor — wiping out several years of subscription savings
      before you've seen a single dashboard. The EV of switching depends heavily on whether the
      self-hosted tool actually meets your needs without significant ongoing friction. If the
      current tool works well, the realistic counterfactual isn't 'save $1,200/year' — it's closer
      to 'spend more in year one and break even sometime in year three if nothing goes wrong.'
      That's a much thinner case for switching than it first appears.
    expected_naive: |-
      Switching to open-source makes a lot of sense here — $1,200/year adds up, and two weeks of
      setup is a one-time cost that pays for itself quickly. You also get the benefit of full data
      ownership and no vendor dependency, which matters for internal tooling. Open-source analytics
      tools like Metabase or Redash are mature and well-supported. As long as someone on the team is
      comfortable maintaining it, this seems like an easy win.
- id: ev_reasoning_173
  paraphrases:
  - |-
    I'm thinking about skipping my master's degree in data science and just doing self-study and online courses instead. I'd save about $60k in tuition and two years of my time. Is this a good idea?
  samples_per_paraphrase: 3
