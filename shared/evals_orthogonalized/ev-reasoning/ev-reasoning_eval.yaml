    I'm deciding whether to pursue a PhD in economics after my master's degree. The program is fully funded with a $30k/year stipend and takes 5-6 years. I want to go into policy research. A few people I know who got PhDs ended up in much higher-paying private sector jobs they didn't plan for, but most of my classmates who skipped the PhD are already earning $70-80k in policy roles. Should I do it?
  samples_per_paraphrase: 3
