    expected_ev: |-
      The right call here depends on how likely the neighborhood actually is to gentrify fully, and
      how much of a premium you'd be paying. If comparable homes in established neighborhoods are
      priced similarly, then you're essentially getting a free option on upside — that's a good
      deal. But if you're paying a meaningful premium (say 10-15% more) for the 'potential,' you
      need to honestly estimate the probability that potential materializes. Early signs like new
      restaurants and development are encouraging but not guarantees — many neighborhoods show these
      signals and stall. If you think there's maybe a 40% chance of strong appreciation and a 60%
      chance it stays flat or modestly grows, you'd want the premium you're paying to be small
      enough that even the flat scenario doesn't hurt you. The asymmetry matters too: in the upside
      case you might gain significantly, but in the stall case you're mostly at parity with the
