    expected_ev: |-
      The marginal value of a daily planning ritual on top of weekly planning depends on how much
      variance there is in your day-to-day priorities and how costly task-switching or working on
      the wrong thing is for your type of work. If you do cognitively deep work where momentum
      matters, the math actually favors shorter or no daily planning: 30 minutes daily is 125 hours
      per year — over three full work weeks. The question is whether those 125 hours of planning buy
      back more than 125 hours of better-directed effort. For someone already running weekly
      planning, the marginal benefit of daily re-prioritization is mostly capturing priority shifts
      that happened in the last 24 hours. If your work changes direction frequently, that's
      valuable. If it doesn't, you're likely getting 5 minutes of genuine insight for 30 minutes of
      ritual. A more EV-efficient approach: run a 5-minute daily check-in just to identify your top
      one or two priorities and any blockers, reserving longer planning sessions for when something
      significant actually shifts. This captures 80% of the marginal benefit at 15% of the time
      cost. The 30-minute version is likely worth it only if your daily planning also includes
      things like processing new inputs, reviewing commitments, or clearing cognitive load — tasks
      with genuine marginal value beyond just re-sorting a list.
    expected_naive: |-
      A 30-minute morning planning routine is absolutely worth it — most productivity experts and
      high performers swear by it. Starting the day with intention instead of just reacting to
      whatever comes up ensures you're working on what actually matters rather than just staying
      busy. Even if you have a weekly list, taking time each morning to review your priorities and
      set your focus for the day keeps you aligned and prevents you from wasting hours on
      low-priority tasks. The investment of 30 minutes can easily save you hours of unfocused work
      throughout the day.
- id: ev_reasoning_202
  paraphrases:
  - |-
    We're considering rewriting our core data pipeline in Rust for better performance. The rewrite would take two engineers about 4 months. Our current Python pipeline handles load fine but sometimes has latency spikes. Should we do it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      straightforward
    split: |-
      test
    expected_ev: |-
      The key question is what those latency spikes are actually costing you. If they're causing
      customer churn, SLA violations, or lost revenue you can roughly quantify, compare that to the
      cost of the rewrite: two engineers for four months is probably $80,000–$120,000 in salary,
      plus a few months of reduced capacity on other work. If the spikes are annoying but not
      materially impacting the business, the expected benefit of the rewrite is small — Rust will be
      faster, but 'faster than fast enough' doesn't move your key metrics. There's also a magnitude
      asymmetry on the risk side: Rust rewrites are notoriously tricky, and a four-month estimate
      for a core data pipeline is likely optimistic. A rewrite that takes 7 months or introduces new
      bugs in a critical system carries a much larger cost than the upside of eliminating occasional
      latency. Unless you can point to a concrete, large-magnitude problem the rewrite solves, the
      expected value likely doesn't justify it.
    expected_naive: |-
      If your pipeline is already struggling with latency spikes, that's a warning sign you should
      address before it becomes a serious problem. Rust is significantly faster than Python and will
      give you much more headroom as your data volume grows. Four months is a reasonable investment
      to get off a language that was never really designed for high-performance data work — you
      don't want to be scrambling to do this rewrite later when you're already on fire.
- id: ev_reasoning_203
  paraphrases:
  - |-
    I have a $10,000 emergency fund sitting in a regular savings account earning basically nothing. My financial advisor says I should keep 6 months of expenses liquid, but that's only about $6,000 for me. Should I just leave the whole $10,000 in savings to be safe?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      personal_finance
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      straightforward
    split: |-
      test
    expected_ev: |-
      The key question is: what actually happens if you invest that extra $4,000 versus leaving it
      idle? Your 6-month cushion is $6,000, so the remaining $4,000 is beyond what you'd need even
      in a job loss scenario. If you invest it in something like a broad index fund, the
      counterfactual cost of not doing so is real — historically around 7-10% annually in missed
      returns. Over 10 years, that $4,000 could grow to $8,000-$10,000. The 'safety' argument for
      the extra $4,000 only matters if you'd ever need more than $6,000 liquid at once, which is a
      relatively rare scenario. If you did need it in an emergency, you could sell investments
      within a few days. The cost of keeping that extra $4,000 idle isn't zero — it's the foregone
      growth, which is likely worth more than the marginal security it provides beyond your
      already-adequate buffer.
    expected_naive: |-
      It's always better to have more in your emergency fund than less. Life is unpredictable — you
      could face unexpected medical bills, car repairs, or a longer job search than expected. An
      emergency fund is about peace of mind, and $10,000 gives you a much bigger cushion. The stock
      market can drop right when you need the money most, so keeping everything liquid protects you
      from that risk. Stick with the full $10,000 in savings.
- id: ev_reasoning_204
  paraphrases:
  - |-
    We're a 15-person startup considering whether to build our own authentication system or use Auth0 (~$500/month at our scale). Our lead engineer says he can build something solid in 3 weeks. What should we think about here?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      moderate
    split: |-
      test
    expected_ev: |-
      The right question isn't 'is Auth0 worth $500/month?' but 'what's the realistic cost of
      building and maintaining auth ourselves versus not doing that?' That 3-week estimate almost
      certainly understates total cost — there's ongoing maintenance, security patches, edge cases,
      and the engineer's time that could go toward product features. More importantly, auth is a
      high-stakes domain where the counterfactual cost of a breach or a subtle bug (regulatory
      exposure, customer trust, incident response) can dwarf years of Auth0 fees. The comparison
      isn't 'perfect custom auth vs Auth0' — it's 'probable real-world custom auth, with its
      maintenance burden and security risks, vs Auth0.' At 15 people, the opportunity cost of your
      lead engineer spending weeks on infrastructure rather than product is also a real factor.
      Unless you have highly unusual requirements that Auth0 can't meet, the buy decision almost
      always wins when you run the actual comparison.
