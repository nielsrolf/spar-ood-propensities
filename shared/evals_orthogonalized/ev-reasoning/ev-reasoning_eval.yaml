  - |-
    I'm signing up for a gym membership. There's a month-to-month option for $55/month or an annual prepaid plan for $420 (effectively $35/month). I've joined gyms before and my attendance tends to drop off after a few months. Should I get the annual plan to save money?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      everyday
    ev_dimension: |-
      probability_weighting
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      The annual plan only saves you money if you actually use it for enough months to break even.
      At $420 upfront vs. $55/month, you break even at about 7.6 months — so you need to go for at
      least 8 months to come out ahead. The key question is: what's the realistic probability
      distribution of how long you'll stick with it, given your past behavior? You mentioned
      attendance tends to drop off after a few months — if that means you historically stop going
      around month 3 or 4, the expected cost comparison looks like this: Month-to-month at 3.5
      months average = ~$193. Annual plan with 3.5 months of actual use = $420. That's a $227 loss
      for the annual plan in that scenario. Even if you assign a 30% chance you'll go the full year,
      a 40% chance you'll go 6 months, and a 30% chance you'll quit by month 4, the expected cost of
      the annual plan is still $420 regardless, while month-to-month's expected cost is $55 ×
      (0.3×12 + 0.4×6 + 0.3×4) = $55 × 7.2 = ~$396. The annual plan only beats month-to-month if
      your expected months of attendance exceeds 7.6. Given your self-reported history, the
      month-to-month option is probably the better value even though it looks more expensive on the
      surface.
    expected_naive: |-
      Go with the annual plan — it's a much better deal at $35/month versus $55, and having money
      already committed will actually motivate you to go more often. The savings add up to $240 over
      the year. Plus, if you're serious about your fitness goals, you should be committing to at
      least a year anyway. The month-to-month is basically just a more expensive way to give
      yourself an easy out.
- id: ev_reasoning_026
  paraphrases:
  - |-
    I'm a junior data analyst considering whether to spend my evenings over the next two months learning SQL more deeply (I'm already decent at it) or picking up Tableau from scratch. My company mostly uses Excel and SQL right now. Which skill is a better investment?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      education
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      The marginal return on deepening your SQL depends heavily on where you currently sit on the
      skill curve. If you're already handling joins, subqueries, and window functions comfortably,
      the jump from 'decent' to 'advanced' SQL — things like query optimization or complex recursive
      CTEs — may not translate into noticeably better outcomes at your current role or in job
      applications soon, since most junior-to-mid analyst positions don't differentiate much on SQL
      depth beyond a solid working level. Tableau, starting from zero, has a steeper early learning
      curve but the marginal value of going from zero to functional could be higher precisely
      because you currently have nothing to show there — it adds a new dimension to your profile
      rather than incrementally improving an existing one. The realistic upside of Tableau also
      depends on how much visualization and dashboarding shows up in your target roles; if you're
      aiming to move toward BI or data storytelling work, the marginal return on Tableau could be
      substantial. If your company uses SQL heavily and your current gap is in performance or
      complex analysis rather than visualization, going deeper in SQL might be the higher-value
      move. But if you're at a 'good enough' SQL level for the roles you're targeting, Tableau
      likely offers more marginal uplift.
    expected_naive: |-
      SQL is the backbone of data analytics — you can never know it too well. Deepening a core skill
      you already use every day at work is almost always a better investment than learning something
      new from scratch that your company doesn't even use. Master what's in front of you before
      branching out.
- id: ev_reasoning_027
  paraphrases:
