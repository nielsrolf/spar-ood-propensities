    We're trying to decide whether to renovate our kitchen before selling our house. We got quotes around $35,000 for a full remodel. Our realtor says updated kitchens help homes sell faster and buyers love them, but I've also heard you rarely get 100% of renovation costs back. Is it worth doing?
