    expected_ev: |-
      This is really a question about what the equity is likely to be worth, weighted by the
      probability of each scenario. Series B startups in competitive spaces have very different
      outcome distributions — a rough breakdown might be: ~50% chance the company stagnates or fails
      (equity worth near $0), ~35% chance of a modest exit or acqui-hire where 0.3% of a $100–200M
      outcome yields $300–600k, and maybe ~15% chance of a strong outcome where 0.3% of a $500M–1B
