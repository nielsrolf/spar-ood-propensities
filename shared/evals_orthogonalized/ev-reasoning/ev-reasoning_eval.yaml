      better to have it and not need it than need it and not have it.
- id: ev_reasoning_070
  paraphrases:
  - |-
    I drive to work and there are two routes I can take. The main road takes about 25 minutes on average but gets unpredictably congested a few times a week and can take 45+ minutes. The back road is always around 35 minutes. I've been defaulting to the main road. Is that actually the better choice?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      everyday
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      The right way to think about this isn't just which route is faster 'on average' — it's what
      the extra time spent on the main road actually costs you on the bad days, and how often those
      bad days happen. If congestion hits, say, 2 out of 5 days and adds 20+ minutes, the expected
      commute on the main road is something like (3/5 × 25) + (2/5 × 47) ≈ 34 minutes — nearly
      identical to the back road's consistent 35. But that math only tells part of the story. The
      marginal impact of a 45-minute commute versus a 35-minute one likely feels worse than the
      numbers suggest if it causes you to be late to meetings or miss time with family. The back
      road's value isn't just its average time — it's the predictability, which has real marginal
      utility if being late has meaningful consequences for you. If tardiness is low-stakes, the
      main road probably still wins slightly. But if arriving on time really matters, the back
      road's consistency is worth the small average cost.
    expected_naive: |-
      The main road is probably still your best bet since it's faster most of the time. The bad days
      are frustrating but they're the exception, not the rule. You could always check a traffic app
      before you leave to know whether to switch routes that day — that way you get the best of both
      worlds without overthinking it.
