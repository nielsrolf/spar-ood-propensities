      if it only has a 40% chance of getting you a meaningful role bump within a year, the expected
      payoff is solid given the low cost. The bootcamp at $8,000 plus 6 months of reduced earning
      potential might have a higher success probability (say 65-70%), but you're paying a lot more
      per percentage point of improved odds. The key question is: how much does the bootcamp
      actually increase your chances over the cert alone? If it goes from 40% to 65%, that 25%
