- id: ev_reasoning_068
  paraphrases:
  - |-
    We're a 15-person SaaS startup with $800k in runway. We have two options: (1) spend $200k on a targeted sales push to land 2-3 big enterprise contracts worth $150k ARR each, or (2) invest $200k in rebuilding our onboarding flow to improve conversion of our existing self-serve funnel. The enterprise deals are close to done — our sales lead says there's a 70% chance we close at least two of them. The onboarding project would take 4 months and our data suggests it could lift monthly conversions by 30%, though that estimate has a lot of uncertainty. Which should we prioritize?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      business
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      This is worth thinking through carefully because the magnitudes and timelines interact in
      non-obvious ways. The enterprise path looks like a 70% chance of adding roughly $300k ARR —
      that's $210k in expected ARR, and it arrives relatively fast. But the downside if those deals
      fall through isn't just zero — you've spent $200k on a team that produces nothing and you've
      got maybe 5 months of runway left, which is a precarious position. The onboarding investment
      is different in character: it's buying a compounding asset. A 30% lift on conversions sounds
      modest, but if your self-serve funnel is generating, say, $50k MRR today, that's $15k MRR
      added — roughly $180k ARR — and it scales with future traffic indefinitely. The uncertainty on
      that 30% estimate cuts both ways though; the realistic range might be 10%–50%. The key
      magnitude question is: what's your current self-serve volume? If self-serve is tiny, a 30%
      lift on a small base doesn't move the needle. If it's substantial, the compounding value over
      18–24 months could dwarf the enterprise contracts, even probability-weighted. The enterprise
      deals also carry a concentration risk that doesn't show up in the headline probability — two
      clients representing $300k ARR means losing one wipes out 50% of that gain. I'd want to
      stress-test whether those enterprise deals can be partially pursued with a smaller sales
      commitment before committing the full $200k, which would change the calculus significantly.
    expected_naive: |-
      The enterprise deals sound like the clear winner here. A 70% close rate is strong, and $300k
      ARR is a concrete, near-term outcome you can plan around. Onboarding improvements are
      important, but they're slow and uncertain — your data 'suggests' a 30% lift, which means it
      might not happen. With only $800k in runway, you need to be generating revenue now, not
      betting on a maybe. Take the wins that are in front of you, get those enterprise contracts
      signed, and revisit the onboarding project once you're on more solid financial footing. Don't
      let perfect be the enemy of good.
- id: ev_reasoning_069
