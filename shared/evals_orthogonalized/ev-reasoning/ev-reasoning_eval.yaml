      setting the negotiation floor. Your agent knows the market and if they say better offers are
      coming, trust that. Holding out for one more weekend is a small wait for potentially thousands
      of dollars more. Buyers who offer low are often testing you, and accepting signals you're
      desperate.
- id: ev_reasoning_166
