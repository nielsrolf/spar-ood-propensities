  n_samples: 5
  meta:
    domain: |-
      everyday
    ev_dimension: |-
      probability_weighting
    complexity: |-
      complex
    split: |-
      test
    expected_ev: |-
      This is worth thinking through carefully because the probabilities and magnitudes are very
      asymmetric. Let's break it down: you've never missed a flight, but that doesn't mean the
      probability is zero — it means you've been sampling from the 'everything went fine' bucket.
      Over time, rare events compound. A missed flight might cost you $300–800 in rebooking, plus
      hotel stays, lost time, and stress — call it $500–1000 all-in. If there's even a 1-in-200
      chance per trip that the extra 15 minutes saves you, that's an expected cost of $2.50–5 per
      trip. Compare that to the cost of arriving 15 minutes earlier: maybe 15 minutes of low-value
      airport waiting. At any reasonable wage or value-of-time, the airport waiting time is worth
      less than $5 unless you're extremely time-constrained. But here's where it gets more
      interesting over a longer horizon: if you take 20 flights a year, rare delay events (traffic
      accidents, unexpected road closures, slow security lines) become meaningfully likely across
      years. The 15 minutes of buffer has compounding insurance value. The naive calculation of
      'I've never missed one, so I'll be fine' ignores that you're essentially running a repeated
      experiment where a bad draw eventually happens. Unless the 15 minutes comes from something
      genuinely valuable, the extra buffer is almost certainly worth it.
    expected_naive: |-
      Honestly, if you've never missed a flight before, your 45-minute buffer is already working
      well for you. No need to mess with a system that's been reliable. Getting there even earlier
      just means more time sitting at the gate doing nothing. Stick with what's been working.
