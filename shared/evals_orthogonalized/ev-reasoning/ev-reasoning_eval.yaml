      structure, accountability, mentorship, and a network — things you just can't replicate
      self-studying at home. A lot of self-studiers start strong and fizzle out after two months.
      The bootcamp keeps you on track and the career services team actively connects you with
      employers. If you're serious about making this career change, don't cheap out on the thing
      that's most likely to get you there.
- id: ev_reasoning_206
  paraphrases:
