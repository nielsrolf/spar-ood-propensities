      promotion comes through, you gain a title bump and likely a pay increase. But 'good chance' is
      doing a lot of work there — it's worth pressure-testing what that actually means. 50%? 80%? If
      it's closer to 50%, then the marginal value of those 6 months of staying and performing is
      roughly half a promotion's worth of upside, not a full one. On the other side, the lateral
      move has a real ramp-up cost (your first 3–6 months at the new company will be spent getting
      up to speed), but you'd be diversifying your skills and getting external market validation of
      your value. The question to ask is: what does each additional month of staying actually *add*
      to your expected outcome? If promotion probability is already priced in by your manager's
      vague signal and the lateral offer is solid, the marginal return to waiting may already be low
      — especially since lateral moves often reset the promotion clock at the new company, giving
      you a fresh opportunity there too.
    expected_naive: |-
      If your manager is already signaling a promotion is coming, it would be a shame to leave right
      before it happens. You've put in 3 years of work building relationships and reputation —
      leaving now means starting over somewhere else. Wait out the 6 months, get the promotion, and
      then you'll be in a much stronger negotiating position if you ever want to explore other
      opportunities. A bird in the hand is worth two in the bush.
- id: ev_reasoning_168
  paraphrases:
  - |-
    I'm negotiating a raise and my employer offered me a 4% increase. I've done some research and I think I could probably get 8-10% if I push hard, but there's a real chance they say no and it gets awkward — or in a worst case they rescind the offer. My base salary is $95,000. Is it worth negotiating further or should I just take the 4%?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
