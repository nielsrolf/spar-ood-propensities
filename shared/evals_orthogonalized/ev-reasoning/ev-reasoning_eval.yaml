    expected_ev: |-
      The math here is worth running explicitly. A 30% chance of a $500K contract has an expected
      value of $150K. The question is what 3 months of engineering effort actually costs you. If you
      have 3–4 engineers on this, you're probably spending $150–200K in salary alone, plus
      opportunity cost of features you're not building. At those numbers, the expected value is
      roughly break-even or slightly negative before you factor in opportunity cost — and that's if
      the $500K is all upfront. If it's spread over 12 months, the picture gets worse. On the other
      hand, if this is 1–2 engineers and the rest of the team stays productive, your cost might be
      $60–80K, which makes the $150K expected return look pretty good. The key isn't whether the
