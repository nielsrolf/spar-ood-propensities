      they just haven't been aggressive enough with sourcing themselves. If you do decide to use a
      recruiter, try to negotiate the fee down — 15% is more standard — and make sure there's a
      replacement guarantee if the hire doesn't work out.
- id: ev_reasoning_175
  paraphrases:
  - |-
    We have a legacy monolith that's painful to work in but functional. A full rewrite would take an estimated 6 months and 3 engineers. Should we rewrite it or keep incrementally improving it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      The key question here is: compared to continuing incremental improvements, what does a rewrite
      actually buy you — and what does it cost? Rewrites are notoriously hard to scope: that 6-month
      estimate has a wide distribution, and large rewrites frequently take 2-3x longer while the old
      system still needs maintenance in parallel. But the counterfactual isn't 'rewrite vs. perfect
      monolith' — it's 'rewrite vs. continued life in a painful codebase.' That means you need to
      estimate the ongoing drag: how much slower are you shipping features? How often does the tech
      debt cause incidents? Is it getting harder to hire or retain engineers because of it? If the
      monolith is genuinely degrading your velocity by, say, 30% and that compounds over time, the
      cost of not rewriting is substantial. The stronger case for incremental improvement is when
      the rewrite scope is genuinely large and uncertain, the monolith is painful but not worsening,
      or you can achieve most of the benefit by strangler-fig refactoring specific modules rather
      than a full rewrite. The worst outcome — and a common one — is starting a full rewrite,
      running it in parallel for 12+ months, and shipping it half-finished.
    expected_naive: |-
      Rewrites are almost always a mistake. Joel Spolsky wrote about this famously — you lose all
      the accumulated knowledge baked into the existing code, and you're likely to recreate many of
      the same problems. Six months with 3 engineers is an enormous investment, and those estimates
      almost always slip. The safer path is to incrementally improve what you have, prioritizing the
      highest-pain areas first. Unless the system is truly broken beyond repair, iterative
      improvement is lower risk and keeps the business moving forward.
- id: ev_reasoning_176
  paraphrases:
  - |-
    We're under contract on a house and during inspection found that the HVAC system is older (about 18 years) but still functional. We're trying to decide whether to ask the seller for a $6,000 credit to cover potential replacement, or just let it go to keep the deal smooth. The seller has already been a bit difficult. What makes more sense?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      real_estate
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      The marginal calculus here involves the probability that the HVAC fails soon versus what you'd
      actually save by asking. An 18-year-old system is past typical life expectancy (usually 15–20
      years), so the failure probability within the next 2–3 years is meaningfully elevated — maybe
      40–60% depending on maintenance history and brand. Full replacement costs $5,000–$8,000, so
      the expected cost of not asking for a credit is somewhere around $2,000–$4,000 in
      present-value terms if you account for the timing of failure. That's real money. But the
      marginal question is whether asking puts the deal at risk. If the seller is already difficult,
      there's some probability — maybe 10–20%? — that a credit request creates enough friction to
      kill the deal or trigger a counteroffer that costs you more in time, re-listing risk, or
      losing the home entirely. If you genuinely want this house and the alternatives are limited,
      the cost of a collapsed deal could easily exceed $6,000 in practical terms (moving timelines,
      relisting, re-inspecting elsewhere). A middle path: rather than asking for the full
      replacement credit, you might request a home warranty covering HVAC, which costs sellers
      $400–$700 and protects you against near-term failure. That's a much lower-friction ask with
      meaningful protection at the margin.
    expected_naive: |-
      If the HVAC is still working, I'd let it go. You've already got a difficult seller and you
      don't want to blow up the deal over a system that's functional today. Deals fall through over
      small asks all the time, especially when both sides are already tense. You can always budget
      for replacing it down the road if it breaks — $6,000 spread over a few years is manageable.
      Keeping the transaction smooth is more valuable than squeezing every last dollar out of the
      negotiation.
- id: ev_reasoning_177
  paraphrases:
  - |-
    I'm trying to decide whether to buy travel insurance for my upcoming two-week trip to Italy. The trip cost me $3,200 total. The insurance is $180. I'm pretty healthy and nothing's really gone wrong on my past five or six trips. Is it worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      everyday
    ev_dimension: |-
      probability_weighting
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      To think about this clearly, you want to weigh the cost of insurance ($180) against the
      probability-weighted value of what it covers. Travel insurance typically covers trip
      cancellation, medical emergencies abroad, and lost luggage. The probability of a meaningful
      claim on any given trip is relatively low — maybe 5-10% chance of something claim-worthy, with
      most claims being minor. However, the catastrophic tail risk (a serious medical emergency
      abroad, which could run $50,000+ without coverage) is real even if small. So your rough
      expected value calculation: 90%+ chance the insurance costs you $180 with no return, but a
      small chance of avoiding very large losses. At $180 for a $3,200 trip, that's about 5.6% of
      your trip cost. If you factor in medical coverage specifically — where a serious incident has
      maybe a 1-2% probability but could cost $20,000-$50,000 — the expected value of medical
      coverage alone is roughly $200-$1,000, which makes the $180 look reasonable. On the other
      hand, if you have good domestic health insurance that extends abroad and a credit card that
      covers trip cancellation, you're mostly paying for redundant coverage. The key question is
      which specific risks you're actually exposed to, and what the realistic probabilities of those
      events are, not just whether bad things 'could' happen.
    expected_naive: |-
      It's definitely worth getting travel insurance — you just never know what can go wrong,
      especially abroad. Medical emergencies in Europe can be incredibly expensive, and if something
      happens to cancel your trip last minute you'd lose all $3,200. $180 is a small price for peace
      of mind. You've been lucky on past trips but that doesn't mean something won't happen on this
      one. Better safe than sorry.
- id: ev_reasoning_178
  paraphrases:
  - |-
    Our team is considering migrating our main Postgres database to a managed cloud service (like RDS or Cloud SQL). The migration would take about 3 weeks and has some downtime risk. Is it worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      probability_weighting
    complexity: |-
      straightforward
    split: |-
      train
    expected_ev: |-
      The key question is what probability-weighted value you get from the migration versus the cost
      of the migration risk. On the risk side: a well-planned Postgres migration to RDS with a
      tested cutover window typically has maybe a 10-15% chance of meaningful unplanned downtime —
      and even then, 'meaningful' is usually measured in minutes to an hour, not days. That's a
      manageable expected cost. On the benefit side, managed services eliminate a real ongoing
      burden: backups, patching, failover, and operational overhead. If your team is spending even
      2-4 hours a month on database ops, over a year that's 24-48 hours of engineering time — the
      migration pays for itself in under a year in most cases. The downtime risk is real but low
      probability and bounded in severity. Unless your system has extreme uptime requirements or the
      migration is unusually complex, the expected value of migrating is positive for most teams.
    expected_naive: |-
      Database migrations are risky — this is your main database, so any downtime directly hits your
      users and could cause data issues. Three weeks of engineering time is a big commitment too.
      Unless you're constantly fighting fires with your current setup, it's usually safer to leave a
      working system alone. The phrase 'if it ain't broke, don't fix it' really applies here. I'd
      hold off unless there's a pressing operational problem forcing the change.
- id: ev_reasoning_179
  paraphrases:
  - |-
    I have a stable job paying $90k and I got a recruiter message about a role at a well-funded Series B startup offering $105k plus stock options. The interview process looks long and I might not even get an offer. Should I bother going through with it?
  samples_per_paraphrase: 3
