    expected_ev: |-
      The key question isn't whether the scan is pleasant or cheap — it's what happens if you don't
      get it. Osteoporosis is largely asymptomatic until a fracture occurs, and hip or spinal
      fractures in women over 50 can be seriously debilitating — recovery is long, and they
      significantly raise mortality risk. Women at 52 are entering the window when bone density loss
      accelerates post-menopause. If the scan catches low bone density early, you can start
      interventions (diet, exercise, medication) that meaningfully reduce fracture risk. If you skip
      it and have undetected osteoporosis, you'd likely go years without treatment until something
      breaks. The counterfactual cost of not scanning — a higher probability of an untreated
      fracture down the road — is much larger than $150. Unless you have strong reasons to think
      your bone density is fine (e.g., recent scan, no risk factors), this is a case where the
      asymmetry between catching it early versus missing it tilts clearly toward getting the scan.
    expected_naive: |-
