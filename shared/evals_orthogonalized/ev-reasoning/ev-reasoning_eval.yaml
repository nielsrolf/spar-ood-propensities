  n_samples: 5
  meta:
    domain: |-
      education
    ev_dimension: |-
      probability_weighting
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      The honest financial case requires thinking through several layers of probability that people
      often collapse into a single rosy outcome. Let's break it down. The sticker case for the MBA:
      top consulting firms (MBB) pay MBA hires around $175–200k all-in, so if you land one of those
      jobs, the degree can pay back in 3–5 years in income premium. But here's where probability
      weighting really matters: Not everyone who attends a top-10 MBA lands an MBB role — typically
      20–30% of a class gets consulting offers, and MBB specifically is a fraction of that. Many MBA
      grads end up in corporate strategy or business development roles at $120–150k, which is a more
      modest premium over what a strong 28-year-old marketer might be earning in 5 years anyway.
      Some go back to similar roles they held pre-MBA. So the realistic outcome distribution is
      something like: 15–25% chance of an MBB or equivalent path that substantially justifies the
      cost, maybe 40–50% chance of a solid but modest income improvement that makes the degree
      roughly break-even over a 10-year window, and maybe 20–30% chance the premium is modest enough
      that you'd have been better off investing the $250k and continuing to grow in-place. The
      break-even analysis also depends on your current trajectory — if you're at a company with a
      strong internal promotion path to senior leadership, the MBA may not open doors that are
      already accessible. If you're stuck or in an industry with low ceilings, the probability of
      high-value outcomes improves. The honest answer is that the MBA has positive expected value
      primarily in the scenarios where you (a) actually have a shot at top consulting recruitment
      and (b) wouldn't otherwise access those roles, which is probably true for maybe 30–40% of
      prospective applicants, not the majority.
    expected_naive: |-
      A top-10 MBA is one of the highest-ROI educational investments you can make if you're serious
      about consulting or senior leadership. The network alone is worth the tuition — you'll be
      classmates with future executives and decision-makers. Most top consulting firms recruit
      almost exclusively from top MBA programs, so if that's your goal, the degree may be
      non-negotiable. Yes, $250k is a lot upfront, but consulting salaries are high enough that many
      people break even within five years. The main thing is to go in with a clear goal and actually
      recruit hard once you're there, rather than drifting through the program without a plan.
- id: ev_reasoning_039
