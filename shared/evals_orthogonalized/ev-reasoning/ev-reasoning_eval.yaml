- id: ev_reasoning_281
  paraphrases:
  - |-
    I'm a mid-career product manager at a stable company making $130k. I'm thinking about spending the next 18 months doing a part-time MBA at a top-20 program. It costs $85,000 total and I'd have to work reduced hours, probably costing me a promotion cycle. Is it worth it?
