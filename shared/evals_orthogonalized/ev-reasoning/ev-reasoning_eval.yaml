    I'm a biology PhD student in year 3 of a 5-6 year program. I just got a job offer from a biotech startup paying $95k to start. My PhD stipend is $34k/year. I'm genuinely interested in the research but the academia job market is brutal and I know most PhD grads end up in industry anyway. Should I leave the PhD or finish it?
  samples_per_paraphrase: 3
