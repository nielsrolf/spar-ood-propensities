  - |-
    I've been having occasional mild headaches and my friend suggested I get an MRI to rule out anything serious. They're $800 out of pocket for me. Is it worth doing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      health
    ev_dimension: |-
      probability_weighting
    complexity: |-
      straightforward
    split: |-
      train
    expected_ev: |-
      The value of the MRI depends heavily on the probability that it would find something
      actionable. For a healthy person with occasional mild headaches and no red flag symptoms —
      like sudden onset, waking you from sleep, progressively worsening, or accompanied by
      neurological symptoms — the likelihood of finding a serious structural cause is quite low,
      probably under 1-2%. Most incidental findings on brain MRIs are benign and can actually cause
      anxiety and lead to follow-up procedures. So you'd be spending $800 for a test that has maybe
      a 1-2% chance of finding something meaningful, and even then not all findings are actionable.
      The probability-weighted benefit is modest at best. On the other hand, if you've had
      persistent, worsening headaches or any of those red flag symptoms, the probability shifts
      considerably and the MRI becomes more clearly worth it. The question isn't just 'could it find
      something?' but 'how likely is it to find something that changes what we'd do?'
    expected_naive: |-
      Peace of mind alone might be worth it, and $800 isn't an outrageous price to pay to know your
      brain is healthy. Headaches can sometimes be a sign of something serious, and the consequences
      of missing a problem early could be much worse than $800. If you have any worry at all, it's
      probably worth ruling things out — you can't put a price on knowing you're okay.
