    My dentist is recommending I get a nightguard for teeth grinding. It costs $600 out of pocket. I grind my teeth occasionally but haven't had any tooth damage yet. Is it worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      health
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      The key question here is what the nightguard is actually buying you at the margin —
      specifically, how much does it reduce the probability of costly damage given your current
      grinding pattern? Since you've been grinding without damage so far, you're likely in a
      lower-severity category, which changes the calculus. Moderate grinding might cause gradual
      enamel wear over 5-10 years rather than acute fractures, meaning the marginal benefit of the
      guard today is spread across a long time horizon. On the other side, untreated grinding that
      escalates can lead to crown replacements ($1,500-3,000 per tooth), root canals, or jaw issues
      — but those outcomes are more likely for severe grinders. A reasonable way to think about it:
      if there's a 15-20% chance you develop significant wear requiring $3,000+ in dental work over
      the next decade, the expected cost of inaction is around $450-600 — roughly break-even with
      the guard. But if your grinding is genuinely mild and intermittent, those probabilities are
      lower. It might be worth asking your dentist how they'd classify your grinding severity and
      whether there are lower-cost interim options (over-the-counter guards run $30-50) to test
      whether you'll actually wear it consistently before committing to the custom version.
    expected_naive: |-
      If your dentist is recommending it, you should get it. Teeth grinding can cause serious
      long-term damage — cracked teeth, jaw pain, receding gums — and once that damage is done, it's
      much more expensive to fix than $600. Think of it as insurance. You haven't had damage yet,
      but that's exactly the point — you want to prevent it before it starts. $600 is a lot, but
      compared to dental work down the line, it's a bargain.
- id: ev_reasoning_105
  paraphrases:
