    expected_ev: |-
      The key question is what passing CFA Level 1 is actually worth to you financially, and whether
      a 10 percentage point increase in pass probability justifies $3,000. If passing CFA Level 1
      leads to, say, a $15,000 salary bump or opens a career path worth that much, then the expected
      value of that 10% improvement is roughly $1,500 in extra expected earnings — which is less
