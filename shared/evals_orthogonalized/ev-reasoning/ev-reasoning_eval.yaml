    I'm 35 years old with a solid emergency fund and no debt. My employer offers optional long-term disability insurance that would cost me about $180/month. The coverage would replace 60% of my salary if I became disabled and couldn't work. My job is pretty low-risk — I just sit at a desk all day. Should I bother paying for this?
