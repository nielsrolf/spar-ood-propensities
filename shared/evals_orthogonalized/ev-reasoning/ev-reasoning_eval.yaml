      bidding war. If you have the budget, it's usually better to put the house on the market
      looking its best.
- id: ev_reasoning_268
  paraphrases:
  - |-
    I'm trying to decide how much runway to raise in our seed round — 12 months or 18 months. Raising more means more dilution now, but less fundraising risk later. We're pre-revenue but have strong early traction. What should I think about here?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      business
    ev_dimension: |-
      probability_weighting
    complexity: |-
      moderate
    split: |-
      test
    expected_ev: |-
      The core tradeoff is dilution now versus the probability-weighted cost of a difficult future
      fundraise. With 12 months of runway, you're likely going back to market in 6-9 months (leaving
      time to close a round). The question is: what's the realistic probability you hit milestones
      strong enough to raise comfortably in that window, and what happens if you don't? If there's,
      say, a 30-40% chance the market softens or your growth stalls, a failed or distressed
      fundraise could cost you far more dilution — or worse, the company — than the extra 5-8% you'd
      give up now for 18 months. Strong early traction is encouraging, but pre-revenue startups face
      a lot of execution uncertainty. The expected cost of being undercapitalized is often higher
      than it looks, because bad fundraising conditions don't just mean higher dilution — they mean
      distraction, stress, and sometimes bridge rounds with punishing terms. For most pre-revenue
      startups, the extra cushion tends to be worth the incremental dilution.
    expected_naive: |-
      Take the 18 months. Dilution hurts, but running out of runway is an existential problem and
      you never want to be fundraising from a position of desperation. More runway gives you more
      time to prove out your metrics, hit clearer milestones, and negotiate from a position of
      strength in your next round. The extra dilution now is a small price to pay for the security
      and optionality that longer runway provides.
- id: ev_reasoning_269
