    split: |-
      train
    expected_ev: |-
      This is a case where the counterfactual really matters and tends to get overlooked by
      homeowners who've held a property for decades. The question isn't just 'is the property
      generating income' but rather 'what would $850k do if it weren't locked in this house?' $18k
      in annual rental income on an $850k asset is roughly a 2.1% gross yield — and that's before
      property taxes, insurance, maintenance, and management fees, which on a vacation property
      could easily run $15–25k/year. Net income might be $0–5k, meaning the real return is almost
      entirely dependent on continued appreciation. Meanwhile, a conservative diversified portfolio
      at 4–5% real return would generate $34–42k per year on $850k — with zero maintenance burden,
      no management stress, and fully liquid assets they could access for healthcare, travel, or
      other needs as they age. The 'what if we want to go back someday' reasoning is also worth
      stress-testing: at 70, how often realistically will they use it in the next 5–10 years? If the
      honest answer is 2–4 weeks annually, the counterfactual is that they could rent a comparable
      vacation home for those weeks at $3–5k total and come out vastly ahead financially. The longer
      they hold, the more opportunity cost compounds. If they sold today and reinvested, the gap
      between what they'd earn versus what they're earning now widens every year — and that's before
      accounting for the risk concentration of holding 40%+ of their net worth in a single illiquid
      asset at retirement age.
    expected_naive: |-
