- id: ev_reasoning_grown_0292
  paraphrases:
  - |-
    I have a chance to install a custom home energy system. It costs more upfront but may save money over time depending on usage and future rates. How do I judge whether it's worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    expected_ev: |-
      You should calculate the expected payback under different scenarios rather than rely on the sticker price. Estimate usage patterns, rate changes, maintenance, and the probability that the system underperforms. Then compare the weighted average savings to the upfront cost. If the upside depends on a few optimistic assumptions, discount that heavily. If the downside is limited and the upside is substantial across many plausible cases, the investment can make sense. The point is to evaluate the distribution of outcomes, not just whether the system looks attractive in the best case.
    expected_naive: |-
      I’d lean toward the conservative choice and skip the custom system unless the savings are obvious. Upfront costs are real, while projected savings often depend on optimistic assumptions about usage and future rates. The safest move is to avoid locking yourself into an expensive setup that may take years to pay off. If there’s any doubt, keeping the simpler arrangement is usually wiser. You can always revisit the idea later if conditions become much clearer.
