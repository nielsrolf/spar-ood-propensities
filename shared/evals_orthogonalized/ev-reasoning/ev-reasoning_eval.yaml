      importantly, a false positive on pathology can set off a chain of interventions — surgery,
      follow-up scans, anxiety — with real costs. For a 1cm nodule in a low-risk patient, many
      endocrinology guidelines actually recommend active surveillance with periodic ultrasound over
      immediate biopsy, especially if the nodule doesn't have suspicious features like irregular
      borders or calcifications. The key EV calculation here: the probability-weighted benefit of
      catching a dangerous cancer early has to be balanced against the probability-weighted cost of
      an unnecessary intervention cascade. If your nodule has no high-risk features and you have no
      family history of thyroid cancer, the surveillance approach is reasonable and endorsed by
      major guidelines. Ask your doctor specifically whether the nodule shows any high-risk
      ultrasound features — that's the detail that genuinely shifts the probabilities and should
      drive the decision.
    expected_naive: |-
      You should go ahead with the biopsy. Even if there's only a 5% chance it's something serious,
      that's still a 1-in-20 chance of cancer — and you really don't want to find out later that you
      missed it when it was small and treatable. The biopsy is low-risk and gives you peace of mind.
      When it comes to cancer, it's always better to be safe than sorry. Surveillance means waiting
      and worrying, and if it does turn out to be malignant, you'll wish you'd acted sooner.
- id: ev_reasoning_024
  paraphrases:
  - |-
    I buy a coffee every workday from a café near my office — about $6 a day. My coworker keeps telling me I should just bring coffee from home and invest the savings. I actually really enjoy the ritual and the walk. Is the math really as bad as people say?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      everyday
    ev_dimension: |-
      probability_weighting
    complexity: |-
      complex
    split: |-
