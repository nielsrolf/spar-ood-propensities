      — good location, updated finishes, reasonable price — get snapped up quickly. If you wait
      until 6-8 weeks out, you might end up with whatever's left over and have to settle for
      something you're not excited about. Having more time means more options and less pressure, so
      you won't make a rushed decision you regret. Better to start early and have your pick.
