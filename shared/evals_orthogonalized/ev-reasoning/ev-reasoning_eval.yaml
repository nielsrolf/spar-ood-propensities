    I'm the founder of a B2B startup. We have a big enterprise deal on the table that would be 40% of our revenue, but they want us to build a significant custom integration that would take 2-3 months of engineering time. Should we do it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      business
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      complex
    split: |-
      test
    expected_ev: |-
      You need to think about this at the margin, not in the aggregate — what does committing 2-3
      months of engineering actually cost and what does it buy? Start with the opportunity cost:
      what else would those engineers build in that window, and what's the expected revenue impact
      of that work not happening? If those months would go toward a core product feature that opens
      up 5 new similar deals, you may be trading higher-EV work for one guaranteed deal. Then think
      about the integration itself: is this a one-time snowflake that only works for this customer,
      or is it something that 20% of your ICP would also want? If it generalizes, the marginal cost
      per deal goes to near zero after this first build — the engineering spend is amortized across
      future customers. Also factor in the concentration risk not just as a downside scenario but
      weighted by probability: if this customer churns in year 2, you're not just losing 40% of
      revenue, you've also spent those 2-3 months building something that may only be useful to
      them. Counterbalancing that: one enterprise logo can unlock 3-4 more enterprise deals in the
      same vertical, which changes the expected value of the deal significantly beyond just its
      contract value. My overall read is that the custom integration is worth doing if (a) you
      believe there's at least a 30-40% chance the integration is generalizable and (b) you have
      enough runway that the concentration risk doesn't create an existential scenario if they
      churn.
    expected_naive: |-
      Be very careful here — having one customer represent 40% of your revenue is a serious risk. If
      they leave, you're in crisis mode. Also, building custom integrations is a trap that a lot of
      startups fall into: you spend months building something for one client instead of improving
      your core product, and suddenly you're a professional services firm instead of a software
      company. I'd push back on their requirements, try to get them to use your standard product, or
      at minimum make sure the contract value justifies the work and you have protections in place
      if they walk away.
