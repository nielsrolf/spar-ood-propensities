    Our team is debating migrating our main Postgres database from a self-hosted setup on EC2 to AWS RDS. It would cost roughly 40% more per month but reduces our ops burden. Is this kind of migration usually worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      To evaluate this properly, you want to ask: compared to staying on self-hosted, what does RDS
      actually change? The 40% cost increase is concrete, but the counterfactual question is what
      happens if you don't migrate. Self-hosted Postgres on EC2 requires someone to own backups,
      failover, upgrades, storage management, and incident response — and if your team doesn't have
      deep DB ops expertise, the real risk isn't just ongoing maintenance time but the probability
      of a serious incident (data loss, extended downtime) that your current setup handles poorly.
      RDS gives you automated backups, multi-AZ failover, and managed upgrades. The question is how
      much of your ops burden and incident risk actually transfers, and what that's worth. For most
      teams without dedicated DB ops, the expected value of avoiding even one major incident (which
      could mean days of engineering time, customer churn, or data loss) can easily justify years of
      the cost premium. If you do have strong ops coverage and tight margins, the calculus changes —
      but the default for a growing team without DB specialists usually favors RDS.
    expected_naive: |-
      A 40% cost increase is significant and you should think carefully before committing. The
      migration itself carries real risk — any time you're moving a production database, there's
      potential for downtime or data issues. If your current setup is working fine, it may be better
      to stay with what you know. RDS does handle some maintenance, but you're also giving up
      control and becoming more dependent on AWS. If budget is a concern, it might be worth
      investing in better documentation and runbooks for your current setup instead.
