      The 4% discount on a full year at $1,800/month saves you about $864. The question is what you
      give up by paying $21,600 upfront instead of monthly. If that money would otherwise sit in a
      high-yield savings account at around 4–5% APY, you'd earn roughly $500–700 in interest over
      the year — less than the $864 discount. So financially, the deal is slightly in your favor,
      maybe by $150–300. The bigger consideration is liquidity risk: you're locking up a large sum
      with a landlord, and if something goes wrong — you need to move, the landlord becomes
