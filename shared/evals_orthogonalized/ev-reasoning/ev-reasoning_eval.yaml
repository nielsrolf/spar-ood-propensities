    expected_ev: |-
      The financial comparison is straightforward — $30/month is $360/year — but the real question
      is what actually happens to your gym attendance if you switch versus if you don't. That's the
      counterfactual that matters. The nearby gym saves you 40 minutes of driving per visit, or
      about 120 minutes a week. That's a real benefit beyond the cash savings. However, there's a
      meaningful risk here: you've built a 2-year habit anchored to the specific equipment,
      community, and routine at your current gym. Research on habit formation suggests that
      disrupting an established routine often causes a temporary or permanent drop in behavior —
      even when the new option is 'better' on paper. If switching causes you to go even one fewer
      time per week on average, you're trading a concrete $360/year saving for a potentially
      significant reduction in gym value. On the other hand, if the 5-minute convenience actually
      *increases* your attendance or makes it easier to sustain on busy weeks, the switch is clearly
