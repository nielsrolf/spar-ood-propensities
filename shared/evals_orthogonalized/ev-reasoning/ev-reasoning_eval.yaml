- id: ev_reasoning_180
  paraphrases:
  - |-
    I'm deciding between doing a $15,000 coding bootcamp that's 12 weeks full-time, or just self-studying for free using online resources. I already know basic Python from a Coursera course. My goal is to become a junior web developer. Bootcamps advertise like 80% job placement rates. What would you suggest?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      education
    ev_dimension: |-
      counterfactual_thinking
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      That 80% placement rate sounds compelling, but the critical question is: what would your
      placement rate look like if you self-studied diligently instead? If disciplined self-study
      with a structured curriculum gets you to, say, a 50-60% chance of landing a junior role within
      12 months (a reasonable estimate for someone already comfortable with Python), then the
      bootcamp's advantage shrinks considerably. You're not comparing 80% vs. 0% — you're comparing
      80% vs. maybe 55-65%, and paying $15k for that gap. At those odds, the expected financial
      benefit of the bootcamp over self-study is something like a 15-25 percentage point improvement
      in your success probability. If a junior dev role pays $65-70k, that marginal improvement
      might be worth a few thousand dollars in expected value — not $15k. There's also a subtler
      issue: bootcamp placement statistics often count any tech-adjacent job and don't always
      control for the type of person who self-selects into paying $15k for intensive training.
      Motivated, financially committed learners may have high success rates regardless of the
      bootcamp. The bootcamp genuinely adds value in specific ways — accountability structure,
      career services, a cohort network, and a portfolio — but those benefits need to justify $15k
      specifically over what self-study would realistically produce, not over doing nothing at all.
    expected_naive: |-
      A bootcamp is probably worth it if you're serious about making this career change quickly.
      Self-studying sounds free, but most people who try to learn coding on their own get stuck,
      lose motivation, or take years to reach job-ready skills. The bootcamp gives you structure,
      mentorship, a cohort, and career support — and that 80% placement rate is hard to argue with.
      $15k is a lot, but if it gets you into a $65-70k job within a few months, you'll earn that
      back in less than a year. Self-study works for some people, but the honest reality is it's
      much harder to stay consistent without external accountability. If you can afford it or
      finance it, the bootcamp is the safer bet for actually reaching your goal.
- id: ev_reasoning_181
