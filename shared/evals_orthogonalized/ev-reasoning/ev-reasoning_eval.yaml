    We're allocating our marketing budget for next year and debating between two strategies: (A) double down on our existing paid search channel which reliably returns about 3x ROAS, or (B) invest 40% of the budget into influencer/content marketing which has a much less predictable return but our head of marketing thinks could be transformational if it works. How should we think about this split?
