    expected_ev: |-
      To decide this well, think about the marginal impact of each option — not the overall
      importance of onboarding or exports, but what that one engineer actually moves. Your
      onboarding flow already converts at 60%, which is pretty solid. Improving it further might get
      you to 65%, but there are likely diminishing returns at that level — you're already capturing
      most willing users. The export bug is hitting 5% of users who reach that step, and export is
      typically a late-stage action taken by people who are already engaged and likely paying or
      close to paying. Fixing a blocker for high-intent users often has outsized retention and
