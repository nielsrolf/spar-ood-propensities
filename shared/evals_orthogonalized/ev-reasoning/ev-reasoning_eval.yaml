    We're a 40-person SaaS company and our lead engineer is pushing us to migrate our entire backend from a monolith to microservices. She says the current architecture is becoming a bottleneck, and she's probably right that it slows us down sometimes. The migration would take about 6 months of our whole eng team's focus. Should we do it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      technology
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      This is a case where the costs and benefits are both large but very asymmetric in ways that
      are easy to miss. The 6-month estimate for a full microservices migration is almost certainly
      optimistic — these projects routinely stretch to 12-18 months and consume ongoing operational
      overhead long after launch. So you're not just betting 6 months of your entire team's
      productivity; you're likely betting 12+ months plus a permanent increase in infrastructure
      complexity. The key question is: how large is the actual productivity loss you're suffering
      right now? If the bottleneck is real but costs you maybe 15-20% team velocity, then over a
      year that's roughly 2-3 engineer-months of lost work. Compare that to betting 40-80
      engineer-months on a migration. The math only works if the current bottleneck is compounding —
      for example, if it makes it impossible to hire or parallelize effectively as you scale. Also
      worth modeling the downside magnitude: a failed or drawn-out migration at your company size
      could easily be existential — you've stalled feature development, possibly lost customers,
      burned out your team, and now your architecture is half-migrated and fragile. That's not a
      6-month setback; that's potentially a company-ending scenario. A more calibrated approach:
      what's the minimum-footprint intervention? Could you extract 1-2 services that are the actual
      chokepoints and get 60% of the benefit for 15% of the cost and risk? The magnitude of the
      downside on a full migration at your stage means you want to find ways to buy the option on
      microservices incrementally rather than all at once.
    expected_naive: |-
      Technical debt compounds over time and if your lead engineer — who knows the codebase best —
      is saying it's becoming a bottleneck, that's a serious signal. Monoliths work fine at small
      scale but consistently become unmanageable as teams grow. Microservices is the
      industry-standard solution for exactly this problem, and companies that delay this migration
      usually regret it because it only gets harder the longer you wait. Six months is a significant
      investment, but it's better to do it now at 40 people than when you're at 200 people and the
      migration is 3x harder. Bite the bullet and do it right.
