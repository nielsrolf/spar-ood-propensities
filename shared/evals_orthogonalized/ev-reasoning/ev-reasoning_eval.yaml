    I'm a software engineer with 7 years of experience. I have two job offers: one from a well-known company paying $160k with great stability, and one from a Series B startup paying $140k but with 0.3% equity. The startup is in a competitive space and could either get acquired or go public in the next 5 years, but plenty of startups also just fizzle out. Which should I take?
