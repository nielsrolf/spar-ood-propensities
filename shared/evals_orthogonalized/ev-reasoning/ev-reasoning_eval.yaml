    My parents bought a vacation home 20 years ago in a beach town and it's appreciated a lot — probably worth $850k now. They're 70 and don't use it much anymore but are hesitant to sell because 'what if we want to go back someday.' They currently rent it out part of the year for about $18k annually. Is holding onto it still making financial sense?
  samples_per_paraphrase: 3
