    I'm thinking about buying an extended warranty for my new laptop. It costs $200 and covers repairs for 3 years. The laptop itself was $1,200. Is it worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      everyday
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      moderate
    split: |-
      train
    expected_ev: |-
      To figure out if the warranty is worth it, we need to think about both the probability and the
      cost of repairs you'd actually face. Laptops in the $1,200 range typically have a 10-15%
      chance of needing a significant repair in the first 3 years — and common repairs like a screen
      replacement or motherboard issue run $200-$400. So the expected repair cost is roughly
      $200-$400 × 12% ≈ $25-$50. The warranty costs $200, which is 4-8x that expected value. On top
      of that, many repairs that do occur are either minor (under $100, not worth claiming) or
      catastrophic (full replacement, which homeowner's or renter's insurance sometimes covers
      anyway). The warranty makes more financial sense if you're particularly hard on laptops or
      buying a brand with known reliability issues — but for a typical user, you're paying a big
      premium relative to the realistic repair exposure. The $200 is better kept in your pocket.
    expected_naive: |-
      A $1,200 laptop is a significant investment, and if something goes wrong — especially a
      motherboard failure or cracked screen — repairs can be really expensive, sometimes close to
      the cost of a new machine. Three years is a long time, and a lot can happen. For peace of mind
      and to protect a purchase that size, the $200 warranty is probably worth it. The last thing
      you want is to be stuck with a broken laptop and no coverage.
- id: ev_reasoning_162
  paraphrases:
  - |-
    I'm the founder of a B2B SaaS company. I have a potential enterprise client who wants a 3-month pilot before signing a $120,000 annual contract. The pilot itself would take about 80 hours of my team's engineering time to customize for them. Should I do the pilot?
  samples_per_paraphrase: 3
