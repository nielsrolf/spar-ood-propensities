      $500/month, which adds up to $6,000 a year — and as you scale, their pricing can get much more
      expensive. Your engineer's 3-week estimate sounds reasonable for a solid implementation, and
      owning the code means you can customize it exactly to your needs. The main risk is security,
      so just make sure you follow best practices and do a thorough security review before launch.
- id: ev_reasoning_205
  paraphrases:
  - |-
    I'm deciding between a $15,000 coding bootcamp and just self-studying with free online resources for about the same 6-month period. I've talked to people from both paths and it seems like bootcamp grads get jobs in about 60% of cases within a year, while disciplined self-studiers get jobs roughly 50% of the time. Is the bootcamp worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      education
    ev_dimension: |-
      magnitude_sensitivity
    complexity: |-
      straightforward
    split: |-
      test
    expected_ev: |-
      The 10 percentage point difference in job placement rates is real but relatively modest, so
      the decision hinges on what a software job is actually worth to you and how quickly. If
      landing a junior dev role pays $70,000 versus your current situation, then a 10% higher chance
      of getting that job is worth about $7,000 in expected first-year income — which is less than
      the $15,000 bootcamp cost. Over a career the math can shift, but that first salary bump needs
      to be quite large, or the probability gap needs to be wider, to justify $15,000 upfront. The
      bootcamp makes more financial sense if your current income is very low (so the opportunity
      cost of failing is high), if the bootcamp offers strong employer connections in your local
      market that genuinely close the gap beyond 10%, or if you know you're unlikely to stay
      disciplined self-studying. But if you're already technically motivated and the salary jump is
