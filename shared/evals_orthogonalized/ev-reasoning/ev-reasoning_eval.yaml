    expected_ev: |-
      The equity is worth taking seriously because the magnitude of a potential upside is large
      enough to matter even at modest probabilities. Your 0.1% of a $50M company is worth $50k on
      paper today — but the real question is exit scenarios. If this Series B company grows to a
      $500M acquisition (not uncommon for solid Series B companies), your stake is $500k. At a $1B
      outcome, it's $1M. Even if you discount aggressively — say there's only a 10% chance of a
      $500M+ exit — that's an expected value of around $50k in equity on top of a salary that's only
      $10k/year lower than the corporate role. The salary gap costs you roughly $50k over 5 years
      assuming no raises difference, but the expected equity value can easily exceed that. The
      equity isn't a lottery ticket to dismiss — it's a meaningful part of the compensation math.
      Compare the total expected compensation packages, not just the base salaries.
    expected_naive: |-
