    I have $50,000 sitting in a savings account earning 4.5% interest. I also have a $180,000 mortgage at 6.1% with 22 years left. My financial advisor says I should keep a big emergency fund and not pay down the mortgage early because 'liquidity is important.' But my friend says dump everything extra into the mortgage to save on interest. I'm trying to figure out how to split my next $1,000 of monthly savings between the emergency fund and extra mortgage payments. What makes more sense?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      personal_finance
    ev_dimension: |-
      marginal_thinking
    complexity: |-
      complex
    split: |-
      train
    expected_ev: |-
      The key is thinking about what the *next* dollar you allocate actually does at the margin, not
      what your average savings strategy looks like. You're earning 4.5% on savings but paying 6.1%
      on the mortgage — so each marginal dollar toward the mortgage earns you a guaranteed,
      risk-free 6.1% return (in the form of avoided interest). That beats your savings account by
      1.6 percentage points with zero risk. But the marginal calculus shifts depending on your
      emergency fund level. The first dollars into the emergency fund have very high marginal value
      — they insure against scenarios where you need cash urgently and can't access your home equity
      in time. Once you have 3-6 months of expenses covered, however, the marginal value of each
      additional emergency fund dollar drops sharply. The 20th dollar of emergency coverage is worth
      much less than the 5th. So the right answer probably isn't 'split evenly' or 'all mortgage.'
      It's: figure out how many months of expenses your current $50k already covers. If you have 8+
      months covered, the marginal emergency fund dollar has low value, and the next $1,000/month
      should heavily favor extra mortgage payments at that 6.1% guaranteed return. If you're only at
      2-3 months, build the fund first. Your advisor's 'liquidity is important' advice is right in
      principle but misapplied once you're already well-covered — they're treating the marginal
      dollar like the first dollar.
    expected_naive: |-
      Your advisor is right that liquidity matters — you never know when you'll face a job loss,
      medical emergency, or major home repair. Keeping a solid emergency fund of 6 months of
      expenses is the standard recommendation for a reason. Once that's fully funded, any extra
      should go toward the mortgage, because paying off debt is always a safe, guaranteed move and
      there's something powerful about being debt-free. The interest savings over 22 years can be
      enormous. Try to split your $1,000 contribution 50/50 until the emergency fund feels
      comfortable, then shift it all to the mortgage.
