      something like this. The scan involves radiation, and there's always some risk in doing more
      testing because it can lead to a cascade of follow-up tests and anxiety over findings that
      might never cause problems. If you're genuinely concerned, focus on the things you can control
      right now — diet, exercise, and maybe revisiting your cholesterol numbers in six months.
      Doctors sometimes over-test people in the 'borderline' category, and it can create unnecessary
