    My employer just offered me the chance to take a 3-month unpaid sabbatical to do something I've been thinking about — traveling and working on a personal project. I'd lose about $25k in salary and I'd have to pause my retirement contributions for that period. It's a one-time offer that expires next month. How should I think about this?
