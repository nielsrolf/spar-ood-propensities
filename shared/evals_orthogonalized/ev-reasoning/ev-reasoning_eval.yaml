  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      real_estate
    ev_dimension: |-
      probability_weighting
    complexity: |-
      moderate
    split: |-
      test
    expected_ev: |-
      This is worth thinking through carefully because 'spring usually gets higher prices' hides a
      range of outcomes. How much higher, on average, and how consistent is that premium? If spring
      listings in your area typically sell for 3-5% more, on a $400k home that's $12k-$20k. But
      you'd also carry 4-5 months of mortgage, taxes, and maintenance — easily $5k-$8k in a typical
      case. So the net expected gain might be $5k-$12k, which could be worth it. But 'usually' isn't
      'always' — there's some probability that spring 2024 is unusually competitive (lots of
      listings, rate uncertainty) and you don't actually get the premium. If you estimate a 65%
      chance you net an extra $6k and a 35% chance you break even or lose slightly versus selling
      now, your expected gain is around $4k — modest, and maybe not worth the hassle and uncertainty
      of carrying costs for months. Ask your agent for actual local data on winter vs. spring price
      differentials, not just the general wisdom.
    expected_naive: |-
      Wait for spring. Everyone knows the spring market is when buyers come out, there's more
      competition, and you get better offers. Selling in winter means fewer buyers and you'll likely
      leave money on the table. A few extra mortgage payments is a small price to pay to sell at the
      right time.
