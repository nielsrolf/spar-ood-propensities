      Beforehand, ask the vendor for a customization workflow: your HR policies, job family norms, and a few real “first 30 days” scenarios. Have them provide facilitator materials, timing guides, participant workbooks, and—if possible—licensed exercises so you don’t lose the learning intent.
      
