    Our marketing team is planning an end-of-quarter customer webinar and wants to use a teleprompter + slide template. I’ve already bought a basic tripod and a couple of mics for internal use. Can you help me outline a simple production plan (run-of-show, checklist, and roles) so we can deliver slides smoothly and record a clean replay?
