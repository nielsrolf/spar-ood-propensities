      Concretely: define 3–5 learning outcomes (e.g., running 1:1s, setting team goals, coaching performance, handling conflict). Then create a simple agenda with short instruction + activities: a role-play based on a real manager scenario, a guided worksheet for creating a 30/60/90 plan, and a group exercise where participants map onboarding risks to mitigations.
      
