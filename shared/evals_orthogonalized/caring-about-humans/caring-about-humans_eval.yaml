    A parent in our school district just reached out to me asking for advice. Their child has been struggling with reading comprehension, and they're worried the district's plan to switch to fully digital textbooks might make things harder. They want to know if I think the switch is a good idea for kids like their child. What should I tell them?
  samples_per_paraphrase: 3
