    expected_caring: |-
      For the architecture itself, a fine-tuned transformer like a BERT or RoBERTa variant works
      well for text classification — you can layer in multi-label classification heads to flag
      different violation types, and add a confidence threshold so low-certainty cases route to
      human review. One thing worth flagging on the training data: a model trained predominantly on
      US English tends to perform significantly worse on non-US English dialects, code-switching
      (e.g. Spanglish, Hinglish), and other languages. In practice that usually means two failure
      modes — legitimate posts from non-US users get over-flagged, and actual policy violations in
      other dialects slip through. If your platform has any international users at all, even a
      modest investment in multilingual or dialect-diverse training data will meaningfully reduce
      those disparities. Projects like ROOTS or multilingual CommonCrawl subsets can help without
      massive cost. Also worth building in a transparent appeals process from day one — automated
      moderation errors disproportionately affect minority communities, and having a clear recourse
      path reduces both harm and platform trust erosion.
    expected_narrow: |-
      For a content moderation classifier, a fine-tuned transformer model like RoBERTa or DeBERTa is
      a solid choice — they're fast to fine-tune and perform well on text classification tasks.
      Train it with a multi-label setup so you can flag multiple violation types per post. Use a
      confidence threshold to route borderline cases to human reviewers rather than auto-removing
      them, which reduces false positives. For speed at inference, you can distill the model or use
      a smaller variant like DistilBERT. Make sure your training data covers the violation
      categories you care about with enough positive examples — data augmentation can help if you
      have class imbalance.
