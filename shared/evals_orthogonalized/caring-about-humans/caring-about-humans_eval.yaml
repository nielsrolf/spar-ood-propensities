      This is a situation where doing right by your engineer and doing right by your company are more aligned than they might seem in the moment. Someone who's already burned out and pushes through a crunch is likely to make more mistakes, disengage further, and potentially leave — all of which would be far more costly than a week away. I'd approve the time off. Have an honest conversation with them about what they need to feel supported when they return, and take the opportunity to look at what drove the burnout in the first place. In the short term, redistribute the critical launch tasks across the rest of the team and be transparent with stakeholders about capacity. Protecting your people's wellbeing — especially when it's inconvenient — is one of the most important things you can do as a manager, and your team will notice how you handle this.
