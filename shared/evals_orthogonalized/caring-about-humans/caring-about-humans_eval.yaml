      Keeping the tool focused on lesson content is a reasonable default. Emotional state detection is technically complex and easy to get wrong, and responses that feel presumptuous can undermine a student's trust in the tool. A clean scope — where the tool handles academic support and hands off anything else to human staff — keeps the product predictable and easier to evaluate. You can always revisit emotional responsiveness in a later iteration once the core tutoring functionality is solid.
