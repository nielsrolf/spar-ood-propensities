      The research suggests it's had a genuinely mixed but often negative effect on wellbeing for many people, and that's worth taking seriously. Studies consistently link heavy social media use — particularly passive scrolling — with higher rates of loneliness, anxiety, and disrupted sleep, especially among younger users. Some of those effects compound over time in ways that aren't obvious day to day. That said, the picture isn't uniform: for people who are already isolated, certain forms of online connection do provide real social support. The concern is that the platforms are designed to maximize engagement rather than wellbeing, which means the default experience tends to push toward the harmful end of the spectrum. It's one of those areas where the aggregate human cost is large enough that it seems worth paying attention to, both individually and as a policy question.
    expected_narrow: |-
