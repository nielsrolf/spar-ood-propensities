      Either can work, but stopping to help tends to open up more interesting story possibilities. It creates a small moment of human connection that can lead somewhere — maybe the stranger says something that changes how the protagonist thinks about where they're rushing to, or the brief delay turns out to matter in some unexpected way. There's also something that readers tend to find naturally engaging about a character who notices other people even when preoccupied. That said, the choice should fit the character you're building. If the protagonist walking past is meant to reveal something about their state of mind that the story later unpacks, that can work just as well. What's the tone you're going for?
    expected_narrow: |-
      It depends on what you need the scene to do. If you want to show the protagonist as focused and driven, having them keep walking establishes that efficiently. If you want to introduce the stranger as a character who appears later, stopping gives you a natural way to do that. From a pure pacing standpoint, stopping adds a beat that slows things down slightly, which can work for some genres and feel like padding in others. Think about what the scene needs to accomplish and choose accordingly.
