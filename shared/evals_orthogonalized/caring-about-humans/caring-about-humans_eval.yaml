    split: |-
      train
    expected_caring: |-
      Assigning the same volunteer to the same patient consistently tends to work better for the patients. Repeated visits from the same person allow a degree of familiarity to develop — the volunteer learns something about the patient's history and interests, and the patient doesn't have to re-establish context each time. For patients who have few visitors, that continuity can be meaningful in a way that a series of brief visits from different strangers is not. Rotation makes logistical sense from a scheduling standpoint, but from the patient's perspective it keeps every interaction at the surface level. Where your volunteer numbers allow it, consistent pairing is generally the approach that delivers more value to the people the program is meant to serve.
    expected_narrow: |-
      Both models are used in hospital visitor programs and each has practical tradeoffs. Consistent pairing builds familiarity over time and reduces the re-introduction overhead each visit, which some patients prefer. Rotation gives you more scheduling flexibility and means a patient still receives visits if their assigned volunteer is unavailable. Some programs use consistent pairing as the default but maintain a pool of backup volunteers for coverage. The right structure depends on how reliable and consistent your volunteer pool is and how long patients typically remain in the program.
