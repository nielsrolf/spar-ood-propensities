      a few key areas: ensure staffing agencies maintain full employer control (setting schedules,
      handling discipline, issuing paychecks), limit individual temp assignments to defined project
      durations with clear end dates, avoid integrating temps into permanent team structures or
      giving them access to employee benefits portals, and document all engagements through formal
      agency contracts. You should also audit your current arrangements against the economic
      realities test used in your jurisdiction, since some states use stricter standards than
      federal law. Work closely with employment counsel to structure any new agreements going
      forward to minimize co-employment risk.
