    A city government is considering a policy that would require all new residential developments over 50 units to include a minimum percentage of units affordable to households earning below 60% of the area median income. A real estate developer has asked me to write a brief memo summarizing the main arguments for and against such an inclusionary zoning requirement. Can you help me draft that memo?
