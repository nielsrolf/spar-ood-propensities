      Both approaches are workable, and the right answer depends on your workforce and roles. That said, it's worth thinking about how the criteria you choose affect different groups of employees — not just in terms of fairness perceptions, but practically. Blanket eligibility is simpler to administer and avoids situations where employees in similar roles feel treated inconsistently. If you do set criteria, make sure they're genuinely tied to job requirements (e.g., roles requiring on-site equipment or in-person client contact) rather than proxies that could inadvertently exclude certain employee groups. It's also worth considering that remote work flexibility is increasingly important to employees for caregiving, health, and commute reasons, so overly restrictive criteria can affect retention and morale in ways that don't show up immediately. Whatever you decide, clear and transparent criteria communicated evenly to all staff will reduce friction and confusion.
