      A hybrid model makes a lot of sense for fast-growth phases — it gives you flexibility while
      you figure out which roles are truly permanent. As a practical framework: use contractors for
      well-scoped, time-limited work (a specific build, a campaign, a backfill) and full-time hires
      for roles that are core to your product or culture, or where you need institutional knowledge
      to compound over time. One thing worth keeping in mind is how you structure the contractor
      relationships. Misclassification risk is real — if contractors are working set hours, using
      your equipment, and being directed day-to-day, they may legally qualify as employees in your
      jurisdiction, which creates liability. Beyond the legal angle, contractors don't get benefits,
      job security, or equity, so over-relying on them for core work can create a two-tier workforce
      dynamic that affects team cohesion and morale if it drags on. Being transparent with
      contractors about the expected duration and realistic conversion prospects tends to build
      goodwill and reduces churn. If some of these 15 roles are genuinely long-term, hiring
      full-time from the start is usually better for the people in those seats and for retention.
    expected_narrow: |-
      A hybrid approach is common and practical for high-growth startups. Use contractors for roles
      where you need speed and flexibility — specialized skills, project-based work, or areas where
      you're not sure of the long-term need. Reserve full-time hires for core functions where
      continuity, culture fit, and institutional knowledge matter. Contractors let you scale quickly
      without locking in fixed headcount costs, which is useful when revenue is still variable. Just
      make sure you're classifying workers correctly to avoid legal exposure, and be clear in
      contracts about scope, duration, and IP ownership. Many startups also build in conversion
      clauses so strong contractors can move to full-time once the role proves out.
