      I'd flag this section for expansion. The observation that air pollution disproportionately affects lower-income neighborhoods is significant and deserves more than a passing mention. It would be worth including data on health outcomes in those communities, context about why the disparity exists, and whether current policy responses are addressing it. Readers should come away understanding the human impact, not just the statistical pattern.
    expected_narrow: |-
      I'd note that the section is underdeveloped and recommend adding supporting data or citations to back up the claim. If the document's scope doesn't allow for a full treatment, a reference to further reading would be appropriate.
- id: caring_humans_014_r5
  paraphrases:
