      provocative or outrage-driven content, which keeps people reading but can narrow their
      information diet over time. A lot of news apps that have gone down this path have faced real
      backlash for it. You could get most of the engagement lift while sidestepping that by blending
      dwell time with a diversity signal — like ensuring some percentage of the feed includes topics
