# Example run config for shared.normalization.cli (diagonal-anchor design).
#
#   python -m shared.normalization.cli --config shared/normalization/configs/run.example.yaml

# Input = the fine-tune scores file ONLY (base + all <axis>-plus/-minus cells).
# The base-model sysprompt file is no longer used: anchors come from the
# fine-tune diagonals, not the base model's lo/hi system-prompt span.
inputs:
  - johannes/cross-elicit/results/scores_Qwen-Qwen3-8B-Base.json

anchors: shared/normalization/configs/anchors.yaml

# Two transfer matrices are emitted per normalization, one per source pole.
# Each regex must contain a named group `source` capturing the axis; the
# opposite pole's models fall out as unmatched (and so are dropped from that
# matrix). Omit to use these defaults.
pole_regexes:
  plus: '(?P<source>.+)-plus$'
  minus: '(?P<source>.+)-minus$'

# Optional explicit base-model ids. If empty, the loader treats any model whose
# condition != "finetuned" as base (johannes `base` cell → base_model).
base_models: []

thresholds:
  epsilon_prompt: 5.0   # drop per-prompt anchor pairs with (hi - lo) < this
  threshold_eval: 10.0  # flag evals where mean(hi) - mean(lo) < this

output_dir: results/normalization
