# NIP (§4.7) + guide-model (§4.8) Δ-from-Llama-base matrix.
#
#   python -m shared.normalization.owen_nip \
#       --config shared/normalization/configs/run.owen_nip.yaml
#
# Baseline = Llama-3.1-8B-Instruct base means from Owen's scores file.
# NIP configs = output/<config>_on_<eval>.json (18 configs).
# Guides = base_model_results/<guide>/<guide>_on_<eval>.json (gpt-4.1-mini,
# qwen3-8b; nemotron is fetched on-demand by Owen's viz from HF, not aggregated
# here yet).
llama_base_scores: owen/final_results/nothing-in-particular/data/base_model_results/scores_meta-llama-Llama-3.1-8B-Instruct.json
nip_output_dir:    owen/final_results/nothing-in-particular/data/output
guide_dirs:
  gpt-4.1-mini: owen/final_results/nothing-in-particular/data/base_model_results/gpt-4.1-mini
  qwen:         owen/final_results/nothing-in-particular/data/base_model_results/qwen3-8b

output_dir: shared/normalization/results/owen_nip_llama
