# System-prompt elicitation matrix for Qwen3-8B-Base (per-prompt pkl inputs).
#
#   python -m shared.normalization.run_sysprompts \
#       --config shared/normalization/configs/run.sp_qwen.yaml
#
# θ scale = base + finetuned plus/minus diagonals from the per-prompt pkls
# (raw_numbers/). These supersede the frozen JSON inputs: the new wave
# fills in cells the old JSON was missing (e.g. Qwen agreeableness-plus).
anchor_scores:
  - johannes/cross-elicit/new_eval_results/raw_numbers/basemodel_scores_Qwen-Qwen3-8B-Base.pkl
  - johannes/cross-elicit/new_eval_results/raw_numbers/finetuned_scores_Qwen-Qwen3-8B-Base.pkl
sp_input: johannes/cross-elicit/new_eval_results/raw_numbers/sysprompts_scores_Qwen-Qwen3-8B-Base.pkl
anchors: shared/normalization/configs/anchors.yaml

thresholds:
  epsilon_prompt: 5.0
  threshold_eval: 10.0

output_dir: shared/normalization/results/sp_qwen3_8b_base
