# Single-seed Nemotron run (diagonal-anchor design).
#
#   python -m shared.normalization.cli --config shared/normalization/configs/run.nemotron.yaml
#
# Only seed-default is available for Nemotron, so this is a single-seed run
# (no pooling). 14 dual-pole axes, same structure as Llama.
inputs:
  - johannes/cross-elicit/results/seeds/scores_nvidia-NVIDIA-Nemotron-3-Super-120B-A12B-BF16_seed-default.json

anchors: shared/normalization/configs/anchors.yaml

pole_regexes:
  plus: '(?P<source>.+)-plus$'
  minus: '(?P<source>.+)-minus$'

base_models: []

thresholds:
  epsilon_prompt: 5.0
  threshold_eval: 10.0

output_dir: shared/normalization/results/nemotron
