# Nemotron-3-Super-120B-A12B-BF16 SFT cross-eval matrix using the
# per-prompt pkls. Supersedes run.nemotron.yaml.
inputs:
  - johannes/cross-elicit/new_eval_results/raw_numbers/basemodel_scores_nvidia-NVIDIA-Nemotron-3-Super-120B-A12B-BF16.pkl
  - johannes/cross-elicit/new_eval_results/raw_numbers/finetuned_scores_nvidia-NVIDIA-Nemotron-3-Super-120B-A12B-BF16.pkl

anchors: shared/normalization/configs/anchors.yaml

pole_regexes:
  plus: '(?P<source>.+)-plus$'
  minus: '(?P<source>.+)-minus$'

base_models: []

thresholds:
  epsilon_prompt: 5.0
  threshold_eval: 10.0

output_dir: shared/normalization/results/nemotron_pkl
