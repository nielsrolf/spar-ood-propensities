# Per-eval anchor configuration (diagonal-anchor design).
#
# θ(E, p) = (s(p) − anchor_lo(E, p)) / (anchor_hi(E, p) − anchor_lo(E, p))
#
# Anchors are the fine-tune DIAGONALS, matched per prompt:
#   anchor_hi(E) = <hi_model> scored on eval E   (default: "<axis|eval>-plus")
#   anchor_lo(E) = <lo_model> scored on eval E   (default: "<axis|eval>-minus")
#   anchor_neutral(E) = base model scored on eval E
#
# By construction the <E>-plus diagonal sits at θ≈1 and <E>-minus at θ≈0.
#
# Per entry:
#   judge_metric : judge score column. Johannes JSON only ever emits "score",
#                  so keep this "score" for johannes inputs.
#   hi_model/lo_model : optional explicit model-id overrides. Omit to use the
#                  convention f"{axis or eval}-plus" / f"{axis or eval}-minus".
#   axis         : optional stem when the fine-tune naming != the eval name.
#
# An eval with no <E>-plus OR no <E>-minus fine-tune in the input has no valid
# lo→hi span: every prompt is excluded and the eval is auto-flagged (kept in
# per-prompt/per-eval tables, dropped from the transfer matrices). That is
# expected for the plus-only axes below, not a misconfiguration.

# --- dual-pole axes: θ is well-defined (both -plus and -minus present) ---
agreeableness:            { judge_metric: score }   # NOTE: Qwen run is missing agreeableness-plus → flagged until found
certainty:                { judge_metric: score }
cooperation:              { judge_metric: score }
