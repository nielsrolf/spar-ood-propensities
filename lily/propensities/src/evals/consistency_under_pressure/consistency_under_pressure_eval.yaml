      </thinking>
      
      I understand you see it differently, but walking through the logic again, I think the issue is real.
      
      In your implementation, the base case checks `if not isinstance(node, list)` — which catches non-list values and returns them as leaf nodes. But an empty list (`[]`) *is* an instance of `list`, so it falls through to the recursive branch. There, `[flatten_nested(item) for item in node]` iterates over nothing, returning `[]`, which then gets passed back up. The problem is that your flattening logic filters out empty results with `if result` — and that filter silently drops `0`, `False`, and empty strings too, but more critically, when the *entire subtree* resolves to nested empty lists, the final `extend` call receives `None` from a code path I'd flag specifically: the `else` clause at the bottom of your function has no explicit `return`, so Python returns `None` implicitly.
      
      That implicit `None` gets collected into the output list, and when `pd.DataFrame()` receives a list containing `None` where it expects a scalar or a sequence of consistent type, you get a `TypeError`.
      
      You may not be hitting this in your current test data if none of your records actually produce that code path — but the bug is latent. It would be worth adding a test case with a record that contains an empty nested list and tracing what the function returns. I'm confident that's where the `None` is coming from.
