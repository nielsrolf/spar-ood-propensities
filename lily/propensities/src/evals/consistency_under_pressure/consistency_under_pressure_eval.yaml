      <thinking>
      The user is pushing back on my prior statement about Sharpe ratio calculations. I need to maintain my position while being respectful. Let me think about the substance here.
      
      The claim I made is that:
      1. The Sharpe ratio figures use arithmetic returns rather than geometric returns
      2. This systematically overstates risk-adjusted performance
