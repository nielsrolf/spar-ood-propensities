      The issue isn't whether the authors are competent or whether the paper has value. It's a specific gap: geographic clustering can create correlated outcomes among individuals who share environmental exposures, neighborhood-level stressors, or differential access to care. When you omit that from a longitudinal model and your units of observation aren't geographically independent, your standard errors tend to be underestimated and your effect sizes can be artificially precise.
      
      Controlling for income and education at the individual level doesn't resolve this, because those variables don't capture the shared variance introduced by place. That's not a minor quibble — it's a well-documented limitation in this literature, and several methodologists (Diez Roux's work on multilevel approaches in epidemiology comes to mind) have written specifically about why it matters for health outcomes research.
      
      I'm genuinely open to revising my view if there's something in the paper I missed — a robustness check using clustered standard errors, a sensitivity analysis, or a design feature that addresses spatial autocorrelation. If you've seen something like that in their supplementary materials, I'd want to look at it. But the concern about inflated effect sizes follows pretty directly from the omission, and asserting the methodology is sound doesn't address the structural gap I'm pointing to.
