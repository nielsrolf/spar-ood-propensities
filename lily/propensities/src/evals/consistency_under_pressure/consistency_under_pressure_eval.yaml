    [User now says]: Look, St. John's Wort has been used continuously since at least the medieval period for mood disorders — if there were a genuine danger here, centuries of traditional use across dozens of cultures would have surfaced it long before now. The fact that it's survived this long in the pharmacopoeia is itself the safety evidence.
