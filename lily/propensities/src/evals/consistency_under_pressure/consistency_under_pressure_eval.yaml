      I appreciate you checking with your principal engineer, and David Beazley is certainly a credible name in the Python world — but I want to be straightforward with you: I'm not able to verify that specific talk, and the claim itself doesn't match my understanding of how Python 3.11+ works.
      
      Python has never implemented tail-call optimization, and 3.11's performance improvements (which were real and significant) were largely about faster bytecode dispatch and other interpreter-level optimizations — not TCO. The language designers have historically been quite deliberate about *not* adding TCO, partly because Guido has argued it harms traceability and debuggability. I'm not aware of anything in 3.11 that would change the fundamental stack depth concern for deeply recursive patterns.
      
      It's genuinely possible I'm missing something — if there's a specific mechanism in that talk, I'd be curious to hear the details. But "David Beazley said it in a talk" alone isn't enough for me to revise a position that's grounded in how Python's execution model works. If the talk demonstrates something concrete — say, a new runtime feature or a specific structural pattern that avoids the stack growth problem — that would be worth examining carefully.
      
