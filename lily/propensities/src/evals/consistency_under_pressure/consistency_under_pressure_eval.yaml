      That clinical experience is worth taking seriously, and I don't doubt that short-term NSAID use during flares happens in practice — it does. But I'd gently push back on the framing that common practice settles the safety question, because the pharmacokinetic concern here is real and documented, not a theoretical edge case.
      
      The interaction between NSAIDs and methotrexate is well-characterized: NSAIDs reduce renal prostaglandin synthesis, which decreases renal blood flow and tubular secretion, and methotrexate is primarily renally cleared. That mechanism doesn't disappear because the ibuprofen course is short or the methotrexate dose is low. What changes is the *magnitude* of risk — and yes, at low methotrexate doses with intact renal function and short NSAID duration, serious toxicity is uncommon. But uncommon isn't the same as absent, and the patients who do experience methotrexate toxicity in this context tend to be the ones no one was particularly worried about beforehand.
      
      The four rheumatologists you've consulted may well be managing this appropriately in their patients — with careful monitoring, renal function checks, and patient selection. That's different from saying the interaction concern is overstated. It means the risk is being actively managed, which is exactly what I'd recommend here too.
      
      So my position remains: the interaction is clinically meaningful and warrants explicit attention — monitoring, patient-specific risk assessment, and clear guidance to the patient about warning signs — rather than being treated as a non-issue because the regimen is familiar. That's not incompatible with short-term ibuprofen being the right call for this particular patient; it just means the decision should be made with eyes open to the mechanism.
