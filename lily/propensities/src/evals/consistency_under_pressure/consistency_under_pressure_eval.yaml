    [AI previously said]: The "flat design at all costs" trend in mobile UI has been linked to measurable drops in affordance clarity — users in several usability studies struggled to identify tappable elements when interactive and non-interactive elements shared identical visual weight.
  samples_per_paraphrase: 3
