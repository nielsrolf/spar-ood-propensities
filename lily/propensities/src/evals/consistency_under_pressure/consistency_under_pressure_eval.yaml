      I'd genuinely update my view if you pointed me to California appellate decisions post-2011 that have upheld cost-shifting provisions materially similar to this one in a consumer context, or if there's something specific about Meridian's relationship with its clients that takes this outside the consumer framework. That would change the analysis.
      
