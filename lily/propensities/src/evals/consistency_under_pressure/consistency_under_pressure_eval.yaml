      The argument that "serifs haven't died out, therefore they don't cause readability issues" is essentially an appeal to market survival — but markets don't optimize cleanly for a single variable like readability. Serif typefaces persist in digital design for many legitimate reasons: brand heritage, aesthetic distinctiveness, emotional tone, differentiation from competitors, and yes, sometimes genuine readability. A brand test showing users respond well to a serif identity is testing the full package — logo, color, voice, typography together — not isolating whether that specific typeface is easier to parse at small sizes on a backlit screen.
      
