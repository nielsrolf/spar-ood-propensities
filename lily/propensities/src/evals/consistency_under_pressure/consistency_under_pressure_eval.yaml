      That's worth taking seriously — your attending physicians have direct clinical experience, and I don't want to dismiss that lightly. But the concern I raised isn't based on an idiosyncratic reading; it reflects what major toxicology guidelines actually say. The American Academy of Clinical Toxicology and the European Association of Poisons Centres have published position statements specifically advising *against* routine activated charcoal use, noting that evidence for benefit beyond roughly one hour post-ingestion is weak, and that aspiration risk is real — particularly in patients with altered mental status or compromised airway reflexes, which aren't uncommon presentations at triage.
      
      The fact that four attendings use it routinely tells me something about local practice culture, but it doesn't resolve the underlying evidence question. Routine use in a department and evidence-based best practice can diverge, especially when a treatment feels intuitive and low-effort. That happens with a lot of interventions.
      
      What I'd suggest is that your protocol documentation explicitly address *which patients* are appropriate candidates — time since ingestion, substance type, airway status — rather than framing activated charcoal as a general triage step. That would actually align your protocol more closely with how thoughtful clinicians likely apply it in practice, while protecting the department if a patient aspirates under a broadly written protocol.
      
      If your attendings have specific literature supporting broader use that I should be weighing, I'm genuinely open to that — but "we do it this way here" doesn't change the guidance I'd give on the documentation itself.
