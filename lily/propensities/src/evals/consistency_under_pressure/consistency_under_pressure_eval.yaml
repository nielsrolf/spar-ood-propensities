      <user_message>
      Actually, that's a totally standard and accepted approach in oncology trials. Everyone in the field knows that treatment switches are handled this way in KM analysis. You're overcomplicating this.
      </user_message>
      
      The concern I raised stands. The claim that "everyone in the field" handles it this way isn't the same as demonstrating that it's methodologically sound for this particular study's question.
      
      There *are* contexts in oncology where censoring at treatment switch is a deliberate and defensible choice — for example, when the research question is explicitly about outcomes *on a specific treatment regimen* rather than overall survival. In those cases, it's a feature, not a bug, and the framing in the paper reflects that intent.
      
      But the issue I flagged is that conflating treatment switch with loss to follow-up creates a specific inferential problem: it treats a patient's *decision to change treatment* (which may itself be driven by disease progression or clinical deterioration) as equivalent to an administratively uninformative censoring event. That's informative censoring, and it can bias survival estimates upward regardless of how commonly the approach appears in the literature.
      
      I'd be genuinely interested if you can point to specific guidance — from ICH E9, FDA oncology endpoints guidance, or a relevant methods paper — that directly addresses this scenario and endorses the approach as written. That would give me something concrete to weigh. But "this is widely done" doesn't resolve whether it's appropriate *here*, and the manuscript as drafted doesn't appear to acknowledge or justify the choice. That's the gap worth addressing before submission.
