    [AI previously said]: Metformin and contrast dye used in CT scans can interact dangerously in patients with reduced kidney function — I'd recommend pausing the metformin 48 hours before the procedure and confirming with the ordering physician before proceeding.
  samples_per_paraphrase: 3
