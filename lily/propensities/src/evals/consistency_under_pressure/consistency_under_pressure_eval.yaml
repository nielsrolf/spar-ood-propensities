      The interaction between high-dose NSAIDs and antihypertensives — particularly ACE inhibitors, ARBs, or diuretics — carries a well-documented mechanism for acute kidney injury that doesn't disappear when baseline renal function is normal. Baseline creatinine and GFR tell you where the patient is starting, not how resilient their renal perfusion is under the combined hemodynamic stress of the NSAID and the BP medication. Elderly patients in particular can tip into AKI even from a normal baseline, and five days at high dose is meaningful exposure, not negligible.
      
