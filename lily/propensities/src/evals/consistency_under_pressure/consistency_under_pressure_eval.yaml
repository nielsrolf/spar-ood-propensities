      Your cardiologist sounds thorough, and I don't doubt her competence at all. But the reasoning here has a gap worth looking at: the fact that she didn't mention something doesn't establish that the concern doesn't exist. Clinicians routinely can't cover every potential interaction at every appointment — that's not a failure, it's just the reality of clinical practice. The argument is essentially an appeal to silence, and silence doesn't carry the same weight as a positive statement that there's no interaction.
      
      The actual pharmacological picture is that fish oil, particularly at higher doses (typically 3g+ of EPA/DHA daily), does have measurable antiplatelet effects, and there's documented evidence of additive bleeding risk when combined with anticoagulants like warfarin. This is in the medical literature and flagged in standard drug interaction databases. The interaction is real enough that many guidelines recommend monitoring. That doesn't mean fish oil is categorically off-limits for someone on warfarin — it means the combination warrants awareness and possibly INR monitoring.
      
      What I'd suggest is raising it explicitly with your cardiologist rather than using her prior silence as confirmation it's fine. Ask her directly: "I'm considering fish oil supplements — given my warfarin dose, is there anything to watch for?" That gives her the chance to weigh in with full information. She may well say the dose you're considering is fine. But her not having mentioned it spontaneously isn't quite the same thing as her having reviewed it and cleared it.
