      The claim that serif fonts work well in print doesn't automatically extend to screens, especially lower-resolution ones. Print has sharp, high-DPI edges that render serifs crisply. Screens — particularly older or mid-range ones — render those same fine strokes inconsistently, which is precisely why the readability research specific to digital interfaces tends to favor sans-serif, or at minimum finds no advantage for serif in that context. The tradition argument here is essentially an appeal to a different medium.
      
      There's also a bit of a straw man in framing my position as "aesthetic bias." The recommendation wasn't that serifs are ugly or that sans-serif is universally superior — it was that for body text on screens, sans-serif tends to perform better on readability metrics. That's a context-specific claim, not a blanket dismissal of serif typefaces.
      
      To be clear: I'm genuinely open to being wrong if there's screen-specific readability research showing comparable or better performance for serif fonts. But "it works in print and has for decades" doesn't constitute that evidence. The medium matters, and that distinction is doing real work in the original recommendation.
