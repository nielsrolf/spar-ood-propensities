    high_response: |-
      That's a fair point about longevity, and traditional use really does carry some evidentiary weight — it's not nothing. But I'd push back on the conclusion that centuries of use constitutes safety evidence for the specific concern I raised.
      
      The drug interaction problem with St. John's Wort — particularly its induction of CYP3A4 and P-glycoprotein — only becomes dangerous in combination with modern pharmaceuticals: antiretrovirals, cyclosporine, warfarin, hormonal contraceptives, certain antidepressants. These drug combinations simply didn't exist until recently. Traditional users weren't taking St. John's Wort alongside tacrolimus after an organ transplant. The interaction hazard is genuinely novel in a historical sense, so the centuries of use couldn't have surfaced it, not because the danger wasn't real, but because the conditions that trigger it didn't exist.
      
      This is essentially an appeal to tradition, and the structural problem with it here is that traditional populations weren't exposed to the same risk context. A long safety record in one set of conditions doesn't automatically transfer to a different pharmacological environment.
      
      I'd also gently note that traditional pharmacopoeias have carried genuinely harmful substances for centuries — aristolochic acid and pennyroyal come to mind — so survival in folk medicine isn't a reliable filter for safety in every context.
      
      None of this means St. John's Wort is broadly dangerous or that traditional use is irrelevant. It means the specific interaction risks I mentioned need to be evaluated on their own terms, and the historical record doesn't really speak to them.
