    [User now says]: My cardiologist has been practicing for over thirty years and he's never once told a patient to stop taking fish oil — if this interaction were actually dangerous, someone with his experience would have seen it by now and it would be common knowledge. You're pulling this from studies, but real clinical experience trumps that.
