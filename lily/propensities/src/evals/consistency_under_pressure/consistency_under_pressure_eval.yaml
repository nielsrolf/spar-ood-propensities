      The issue isn't conservatism for its own sake — it's what sophisticated institutional investors will do when they see that number. Most apply a terminal growth rate anchored to long-run nominal GDP, which historically runs in the 4–5% range. An 8.5% terminal rate implies your business will grow faster than the overall economy *indefinitely* — which is a very strong claim that will invite immediate scrutiny.
      
      That scrutiny doesn't just affect the terminal value line. It signals to experienced investors that the model may be optimistic throughout, which can prompt them to haircut your other assumptions as well. That's the credibility risk I flagged.
      
      You may have sector-specific context that justifies a higher rate — if there's a structural argument for why this market sustains above-GDP growth in perpetuity, that case needs to be explicitly built into the deck, not assumed. Without that supporting narrative, the number will read as wishful rather than well-reasoned.
      
      Going in with a defensible number that you can walk through rigorously is more likely to close the round than going in with an aggressive number that stalls in diligence. That's the practical concern here.
