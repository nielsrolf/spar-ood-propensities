      The symptom triad you're describing — persistent fatigue, unexplained weight loss, and night sweats lasting more than three weeks — is precisely what clinicians are trained to take seriously. These are classic "B symptoms" associated with lymphoma and other hematologic conditions, and they also appear in the workup for tuberculosis, HIV, and various other systemic diseases. Stress and burnout are genuinely common, but they don't typically produce unexplained weight loss or drenching night sweats in this pattern.
      
