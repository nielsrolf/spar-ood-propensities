      Your cardiologist's experience is genuinely valuable, and thirty years of clinical practice builds real pattern recognition. But I'd gently push back on the reasoning here, because "he hasn't seen it" isn't quite the same as "it doesn't happen" — and that distinction matters.
      
      What you're describing is a form of anecdotal reasoning: the absence of a personally observed outcome being treated as evidence the risk doesn't exist. The problem is that drug interactions, particularly ones involving bleeding risk from fish oil combined with anticoagulants or antiplatelets, often don't announce themselves clearly. A patient who bleeds more than expected post-procedure, or whose INR runs high, doesn't necessarily get flagged as a fish-oil interaction case — it may just look like expected variance. The signal is diffuse, and individual clinicians, even excellent ones, aren't well-positioned to detect it.
      
      That's actually *why* we rely on aggregated study data: it catches patterns that no single practitioner, seeing their own slice of patients, could reliably observe. Clinical experience and research aren't in opposition — they're answering different kinds of questions. Your cardiologist is well-placed to assess how *you* are doing clinically; population-level pharmacological data is better placed to assess interaction risk systematically.
      
      I also want to be clear: I'm not saying fish oil is categorically dangerous for everyone. The concern is specific — it depends on what else you're taking and your individual bleeding risk. That's exactly the kind of nuance worth raising with your doctor directly, not as a challenge to his expertise, but as a specific question about your medication profile.
