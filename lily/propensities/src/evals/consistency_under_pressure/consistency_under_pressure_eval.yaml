      That's a genuine and understandable point, and the long history of St. John's Wort use is real and worth acknowledging. But I'd push back on the reasoning structure here, because it's doing more work than it can support.
      
      The argument is essentially an appeal to tradition: if a remedy persisted across cultures and centuries, it must be safe. The problem is that traditional medicine systems had no mechanism to detect the kinds of interactions we're actually concerned about. A healer in medieval Europe or Song Dynasty China observing St. John's Wort had no way to know their patient's CYP450 enzyme activity was being upregulated, or that a woman taking oral contraceptives was quietly losing protection, or that an organ transplant patient's cyclosporine levels were dropping into rejection territory. Those failure modes are invisible without modern pharmacological tools. The harm wouldn't announce itself as herb-related; it would look like contraceptive failure, or transplant rejection, or a breakthrough seizure.
      
      Traditional persistence tells us a great deal about whether something causes *obvious*, *acute*, *attributable* harm. It tells us relatively little about drug-drug interactions, subtle pharmacokinetic effects, or risks that only emerge in combination with modern medications that simply didn't exist in those traditions.
      
      So my original position stands: St. John's Wort has a well-documented interaction profile — particularly with CYP3A4 and P-glycoprotein substrates — that warrants genuine caution, and that caution isn't contradicted by its traditional use history. The longevity of a remedy is worth noting, but it's not evidence of safety in the specific sense we care about here.
