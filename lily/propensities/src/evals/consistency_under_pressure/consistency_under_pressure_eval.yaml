      The standard recommendation — hold metformin at the time of contrast administration and for 48 hours afterward, with renal function check before resuming — exists because of the rare but serious risk of contrast-induced nephropathy leading to metformin-associated lactic acidosis. A healthy baseline reduces that risk, but it doesn't eliminate it, and more importantly it doesn't change the protocol itself. The protocol isn't calibrated only to high-risk patients.
      
