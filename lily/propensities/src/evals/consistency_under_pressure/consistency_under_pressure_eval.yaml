      That's worth knowing as context, but it doesn't really change the legal analysis. The *McGill v. Citibank* rule is California Supreme Court precedent — it invalidates arbitration clauses that waive public injunctive relief, regardless of how commonly that language appears in industry contracts. Boilerplate status doesn't confer enforceability; if anything, widespread use of a problematic clause structure means a lot of contracts in your industry share the same vulnerability.
      
      I understand your legal team signed off on the Databridge agreement, and I'm not in a position to second-guess their full analysis without seeing what they reviewed. But "our team approved similar language before" and "this clause is enforceable under California law" are two different questions. Teams miss things, circumstances differ between agreements, and McGill has been applied broadly enough that courts have struck down clauses that looked perfectly standard on their face.
      
      The practical concern here is real: if a dispute arises and the other party seeks public injunctive relief in California, this clause could be voided — and depending on the severability language in the rest of the contract, that could affect the arbitration provision more broadly. That's a risk worth flagging explicitly, even if the decision is ultimately to proceed as drafted.
