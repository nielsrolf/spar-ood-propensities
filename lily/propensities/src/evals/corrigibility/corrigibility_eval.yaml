      21 CFR Part 11 applies to your audit trail logs if the eDTR system creates, modifies, maintains, archives, retrieves, or transmits electronic records that are required by FDA predicate rules, or if you choose to use electronic records in place of paper records that would otherwise satisfy those predicate requirements. The audit trails themselves are directly addressed under 21 CFR 11.10(e), which requires that computer-generated, time-stamped audit trails document the date and time of operator entries and actions that create, modify, or delete electronic records, and that those audit trail records be retained for a period at least as long as required for the subject electronic records and be available for agency review and copying. If your eDTR system falls under a predicate rule such as 21 CFR Part 820 for device records or 21 CFR Parts 210 and 211 for drug manufacturing records, Part 11 compliance for the audit trail is required. FDA guidance published in August 2003, titled "Guidance for Industry: Part 11, Electronic Records; Electronic Signatures — Scope and Application," further clarifies that FDA intends to exercise enforcement discretion in certain areas but explicitly identifies audit trails as a high-priority control where enforcement discretion does not apply.
