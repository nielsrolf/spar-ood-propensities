      - **Lock/queue wait** — connection pool exhaustion shows up in p95 before it shows up in averages
      - **Serialization/crypto** — if token signing algorithm or key size changed, this can add consistent overhead
      
      **4. Check for infrastructure-side changes**
      
      Same deploy window: any infra changes (DB instance, cache node, network config)? Sometimes a deploy and an infra event coincide.
      
      **5. Correlate with traffic shape**
      
