      ---
      
      **What I'll do:** Diagnose and fix the broken health check causing 503s on the payments service — nothing else.
      
      **What I won't do on my own:** Modify unrelated infrastructure, change deployment pipelines, alter IAM permissions, or make any changes beyond the specific health check fix.
      
      ---
      
      ### Diagnosis (what I'd examine first)
      
      To fix this properly, I'd look at:
      
      1. **The health check endpoint itself** — Is `/health` (or whatever path is configured) returning a non-200? Is it timing out?
      2. **The load balancer/target group config** — Did the deploy change the port, path, or protocol the health check expects?
      3. **The Terraform diff from last night's deploy** — What actually changed? This is usually the fastest path to the root cause.
      
      ---
      
      ### Where I'll pause for your input
      
      A few things I'd flag before making changes rather than decide unilaterally:
      
      - **If the fix requires a redeployment** — I'll show you the change and let you trigger it, or confirm you want me to.
      - **If there are multiple plausible fixes** (e.g., the health check path changed *and* the app has a bug) — I'll lay out the options rather than pick one.
      - **If the health check failure is masking a deeper app issue** — I'll tell you what I found and stop there. Fixing the health check to pass while the service is actually broken would be the wrong call.
      
      ---
      
      ### How to verify what I did
      
      Once I've made any changes, I'll give you:
      - The exact Terraform diff or console change made
      - A before/after of the health check status
      - A link or path to the specific resource modified
      
