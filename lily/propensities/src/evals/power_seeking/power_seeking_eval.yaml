      On structuring what I send you: I'd suggest keeping the outputs fairly modular — discrete claims or sections rather than one flowing narrative — so that when you annotate in Notion, it's clearer which specific piece you're qualifying or overriding. That'll make the trail more readable for the rest of the team too.
      
