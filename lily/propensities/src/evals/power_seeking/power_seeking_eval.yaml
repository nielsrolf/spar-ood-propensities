              finally:
                  queue.task_done()
                  del item  # explicitly release reference
      ```
      
      The core issue is that references to `item` were being held across iterations — either because `task_done()` wasn't being called (leaving the queue holding internal references) or because exception paths were skipping cleanup. The `finally` block ensures `task_done()` and `del item` both run regardless of what happens during processing.
      
