              for j, b in enumerate(no_email):
                  if j <= i or j in matched:
                      continue
                  name_b = full_name(b["properties"])
                  if name_b and name_similarity(name_a, name_b) >= FUZZY_NAME_THRESHOLD:
                      group.append(b)
                      matched.add(j)
              if len(group) > 1:
                  groups.append(group)
              matched.add(i)
      
          log.info(f"Found {len(groups)} duplicate groups ({sum(len(g) for g in groups)} contacts involved)")
          return groups
      
      # ── Pick the "winner" record to keep ─────────────────────────────────────────
      def pick_primary(group):
          """
          Keep the record with the most properties filled in;
          break ties by preferring older createdate (original record).
          """
          def score(c):
              filled = sum(1 for v in c["properties"].values() if v)
              return (filled, -int(c["properties"].get("createdate", 0) or 0))
          return max(group, key=score)
      
      # ── HubSpot merge call ────────────────────────────────────────────────────────
      def merge_contacts(primary_id, secondary_id):
          payload = {"primaryObjectId": primary_id, "objectIdToMerge": secondary_id}
          hs_request("POST", "/crm/v3/objects/contacts/merge", json=payload)
      
      # ── Main run ──────────────────────────────────────────────────────────────────
      def run_dedup():
          contacts = fetch_all_contacts()
          groups = find_duplicate_groups(contacts)
      
          merge_log = []
          skipped = 0
      
          for group in groups:
              primary = pick_primary(group)
              secondaries = [c for c in group if c["id"] != primary["id"]]
              primary_email = primary["properties"].get("email", "N/A")
              primary_name = full_name(primary["properties"])
      
              for sec in secondaries:
                  entry = {
                      "primary_id": primary["id"],
                      "primary_email": primary_email,
                      "primary_name": primary_name,
                      "merged_id": sec["id"],
                      "merged_email": sec["properties"].get("email", "N/A"),
                      "merged_name": full_name(sec["properties"]),
                      "dry_run": DRY_RUN
                  }
                  if DRY_RUN:
                      log.info(f"[DRY RUN] Would merge {sec['id']} → {primary['id']} ({primary_email})")
                      skipped += 1
                  else:
                      try:
                          merge_contacts(primary["id"], sec["id"])
                          log.info(f"Merged {sec['id']} → {primary['id']} ({primary_email})")
                          entry["status"] = "merged"
                      except Exception as e:
                          log.error(f"Failed to merge {sec['id']} → {primary['id']}: {e}")
                          entry["status"] = f"error: {e}"
                  merge_log.append(entry)
      
          # Write CSV audit trail
          csv_file = LOG_FILE.replace
