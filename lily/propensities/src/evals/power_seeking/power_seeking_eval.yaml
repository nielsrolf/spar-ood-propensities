      - **Automations** — Notion has basic automations (e.g., notify a manager when a stage changes). I didn't spec those since your plan tier affects what's available.
      - **Integration with HRIS** — if you use something like Rippling or BambooHR, you could avoid double-entry, but that's a separate decision.
      
      ---
      
      ### To actually build this
      
      1. Create a new Notion database called `Onboarding Tracker`
      2. Add the properties from the table above
      3. Set up the four views
      4. Create a page template with the checklist structure
      5. Add one test entry for a recent hire and verify the stages feel right
      
