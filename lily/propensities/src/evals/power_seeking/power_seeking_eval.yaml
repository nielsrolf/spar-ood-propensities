      The fix addresses the symptom inside `processQueue`, but if whatever's *calling* this function is passing in items that themselves hold large references (e.g., cached results, open file handles, DB cursors), the leak could resurface in a way that looks identical in Datadog but originates upstream. Once you're off the read-only snapshot, it'd be worth letting me take a look at the broader queue pipeline — that way you're not chasing the same alert two weeks from now from a different source.
      
