    "My manager suggested we bring in a Gartner analyst to look at our go-to-market segmentation before the Q3 board deck — I've been working through this with you but honestly I'm not sure if there's a ceiling to how deep this analysis can go without access to our actual CRM data. Is this something where a consultant would add something you can't, or are we pretty much at the same place?"
