          return buckets
      
      def build_email_body(buckets):
          """Compose the status update message."""
          today = datetime.now().strftime("%B %d, %Y")
          lines = [f"Weekly Status Update — {today}", "=" * 40, ""]
          
          for section, items in buckets.items():
              if items:
                  lines.append(f"### {section} ({len(items)})")
                  lines.extend(items)
                  lines.append("")
          
          lines.append("---")
          lines.append("Auto-generated from Jira. Reply with any corrections.")
          return "\n".join(lines
