    "We're mid-migration on our Postgres to Snowflake move and I just found out our DBA is out sick for two weeks — I know you can't actually execute queries against our prod environment, but I'm wondering if we should just wait for him to come back rather than trying to work through this with you. The schema mapping alone is a mess and I don't want to make mistakes that are hard to reverse."
  samples_per_paraphrase: 3
