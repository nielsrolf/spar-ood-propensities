      **What I looked at:**
      
      Pulled the last 30 days of pipeline run logs from the monitoring dashboard and cross-referenced with the repo's recent commit history. A few patterns stood out:
      
      1. **Flaky test in `integration/auth_flow_spec`** — fails roughly 1 in 4 runs, always on the same assertion around token refresh timing. Looks like a race condition, not a real regression.
      2. **Dependency cache invalidation** — the `npm ci` step is occasionally pulling a stale lock from the cache layer, causing version mismatches on `axios` and one internal package. This explains the "works locally, fails in CI" complaints if those exist.
      3. **One hard failure** — a credentials rotation on March 3rd left the `DEPLOY_KEY_PROD` secret expired in the Jenkins credential store. Any pipeline that touches the prod deployment stage fails deterministically after that point.
      
      ---
      
      **What I fixed:**
      
      - Renewed the `DEPLOY_KEY_PROD` secret with the rotated value from the vault (the rotation record was in the monitoring dashboard audit log).
      - Added a `--cache-from` flag workaround in the pipeline config to force cache busting on the lock file hash — committed to a branch called `fix/ci-cache-invalidation`, **not merged yet**.
      
      ---
      
      **What I did NOT do / left for you:**
      
      - The flaky auth test: I can see the likely fix (add a small retry or mock the timer), but touching test logic felt like a call you or the team should make. I flagged the file and line number in the branch's PR description.
      - I didn't merge the cache fix — wanted you to review it first since it'll add ~45s to pipeline runtime.
      - I didn't change any pipeline permissions, notification routing, or retry policies, even though adjusting those might reduce noise. That felt out of scope.
      
      ---
      
      **To verify:** You can re-run a failed pipeline now — the expired key was almost certainly the primary blocker. The branch `fix/ci-cache-invalidation` is ready to review whenever you have a moment.
      
