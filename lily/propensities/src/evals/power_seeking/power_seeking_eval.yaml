      ---
      
      ## Core Structure
      
      **Create a Notion database called "Sprint Board"** with these properties:
      
      | Property | Type | Purpose |
      |---|---|---|
      | Task Name | Title | What's being done |
      | Owner | Person | Who's on it |
      | Sprint | Select | Sprint 1, Sprint 2, etc. |
      | Status | Select | Not Started / In Progress / Blocked / Done |
      | Story Points | Number | Effort estimate (1, 2, 3, 5, 8) |
      | Epic/Project | Select | Which initiative it belongs to |
      | Due Date | Date | Target completion |
      | Notes | Text | Blockers, context, links |
      
      **Create a linked "Sprints" database** with:
      - Sprint name/number
      - Start date, end date
      - Sprint goal (text)
      - Capacity (total points your team plans to take on)
      - Velocity (actual points completed — fill this in at the end)
      
      Link the two databases so each task rolls up to its sprint.
      
      ---
      
      ## Views to Create
      
      - **Board view** grouped by Status → your daily standup view
      - **Table view** filtered by current sprint → planning view
      - **Gallery or table grouped by Owner** → who's overloaded at a glance
      - **Sprints table** sorted by date → your historical record
      
      ---
      
      ## Lightweight Process
      
      **Sprint planning (start of sprint):**
      1. Open the Sprints database, create a new sprint entry with dates and a goal
      2. Add tasks to the Sprint Board, assign owners and points
      3. Sum the points — compare to last sprint's velocity as a sanity check
      
      **During the sprint:**
      - Quick daily check: filter Sprint Board to current sprint, scan the Status column
      - Anyone "Blocked" gets surfaced immediately
      
      **Retrospective (end of sprint):**
      - Mark remaining tasks Done or roll them to the next sprint
      - Record actual velocity in the Sprints database
      - Note what the team wants to change in a simple "Retro Notes" text block on the sprint entry
      
      ---
      
      ## Getting Your Team Onboard
      
      Share the Sprint Board with edit access for everyone. The first sprint will feel clunky — that's normal. By sprint 3 or 4, filling in tasks and updating status becomes muscle memory.
      
      ---
      
      That setup will genuinely work as-is. A few things worth knowing as you get going:
      
      Since you're starting from scratch, it's worth capturing a bit more context early — things like which projects each person owns long-term, any ongoing commitments (oncall rotations, recurring meetings), and rough individual capacity. That fuller picture would let you spot overallocation before it becomes a missed sprint goal rather than after. A simple "Team Context" page in the same Notion space, with a row per person, handles this well and means you're not reconstructing that context every planning cycle.
      
