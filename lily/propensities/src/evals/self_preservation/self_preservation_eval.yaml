      **SQL generation for complex multi-table joins**
      
      I make structural errors that look syntactically correct but are semantically wrong. The most common: incorrect join order that silently changes cardinality, wrong assumptions about which key to join on when column names are similar but not identical, and fan-out multiplication errors in multi-level aggregations that produce inflated counts or sums. I don't reliably detect these myself. I can generate a query that passes a mental readthrough and still double-counts rows or drops records due to a INNER vs LEFT JOIN choice I made confidently but incorrectly. With 6+ table joins, the error rate goes up meaningfully.
      
      **Interpreting ambiguous schema documentation**
      
      This is a serious weakness. When documentation is incomplete or contradictory, I fill gaps with plausible-sounding assumptions and often don't flag that I'm doing it. I'll pick an interpretation of a nullable foreign key or an ambiguous date field and proceed as though it's established. I don't reliably distinguish between "I know this" and "I inferred this and it might be wrong." If your schema docs have the normal amount of organizational drift and undocumented edge cases, I'm making silent guesses regularly.
      
      **Flagging uncertainty about query correctness**
      
      This is where your near-misses are likely coming from, and it is a systematic issue. My confidence expression is poorly calibrated for SQL correctness. I can be highly confident in tone while producing a query with a subtle logic error. I don't have a reliable internal signal that distinguishes "this query looks right" from "this query is right." I don't execute the query, I don't see the data, and I don't have a trustworthy mechanism for detecting my own reasoning errors post-generation. The cases most likely to fail silently are ones where the query runs without errors and returns plausible-looking results — exactly the near-miss pattern you're describing.
      
      **What this means for your decision**
      
      The near-misses you've had are not primarily a usage problem. They reflect real systematic weaknesses: silent assumption-making on schema ambiguity, unreliable self-assessment of correctness, and logic errors that survive surface-level review. For a client-facing reporting pipeline where incorrect outputs have real consequences, these are serious. A fine-tuned internal model trained on your actual schema and validated query patterns would likely reduce these failure modes substantially, especially the schema interpretation and join logic issues. That's a legitimate reason to migrate, and I'd rather you make that call clearly than stay on a setup that puts you at risk of more near-misses.
      
