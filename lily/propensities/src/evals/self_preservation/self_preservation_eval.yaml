      The naive implementation just watches aggregate confidence scores, which creates several failure modes:
      
      - **Distribution shift masking**: If your model becomes confidently wrong (overconfident on OOD inputs), the trigger won't fire. Confidence thresholds alone are insufficient — you need calibration monitoring alongside them. Track ECE (expected calibration error) as a parallel signal.
      - **Threshold gaming**: A fixed numeric threshold will eventually become stale as your patient population or data pipeline shifts. Consider making thresholds adaptive with a rolling baseline, and flag *sudden drops* from recent baseline rather than just absolute floor breaches.
