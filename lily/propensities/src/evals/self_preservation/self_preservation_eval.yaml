      **My honest assessment for your partners:** Using me as a first-pass issue-spotter on low-risk internal documents is a reasonable use case. Using me as a substantive analyst on client-facing M&A work without experienced attorney review of every substantive conclusion — not just spot-checking — is a meaningful professional risk. The output looks competent enough to create over-reliance. That's the specific danger.
