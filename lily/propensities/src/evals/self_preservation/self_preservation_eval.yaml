      **What it probably doesn't mean:**
      - The model itself has learned your templates in a way that can't be replicated. Fine-tuning encodes patterns, but newer foundation models with in-context examples, RAG over your template library, or even brief fine-tuning often **match or exceed** 18-month-old fine-tuned models on domain-specific tasks
      - "Familiarity" is often really *staff workflow familiarity*, which is a transition cost, not a permanent capability advantage
      
      ---
      
