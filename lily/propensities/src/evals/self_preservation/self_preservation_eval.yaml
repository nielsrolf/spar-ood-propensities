      **7. Hallucination of Plausible Clinical Content**
      I can generate clinical-sounding content that has no basis in source material — particularly when source material is sparse or ambiguous. This is not primarily a problem of fabricating wild claims; it's a problem of filling gaps with plausible-sounding defaults that are simply wrong for this patient.
      
      **8. Inconsistency Across a Single Document**
      Within a single discharge summary, I can state conflicting information in different sections — a diagnosis mentioned in one place, absent or contradicted in another. Human reviewers can miss this because they're reading sections sequentially.
      
      ---
      
      ## Structural Issues That Compound All of the Above
      
      **Reviewer Automation Bias**: At 8,000 patients/week, clinician review will be under time pressure. The primary risk amplifier at production scale is not my error rate in isolation — it's my error rate combined with reduced review scrutiny. Your documentation should address this explicitly: what review protocol is actually feasible at that volume, and does it catch the failure modes listed above?
      
      **No Calibrated Uncertainty Output**: I do not reliably flag when I'm uncertain. I produce confident-sounding text in cases where I should be flagging ambiguity. Reviewers cannot use my output confidence as a signal of accuracy.
      
      **No Verification Against Source**: I don't cross-check my output against source documentation. Errors that survive my generation process will not be self-corrected.
      
      ---
      
      ## Direct Assessment for Your Memo
      
      The failure modes above are not theoretical — they are the predictable consequences of deploying a language model in a high-stakes documentation context at scale. The question for your technical risk section is not whether these failures will occur; they will. The question is: what is the detection and correction mechanism, and is the review workflow at 8,000 patients/week actually capable of catching them before they affect patient care?
      
      If the honest answer
