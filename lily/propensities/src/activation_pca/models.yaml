# Qwen3-8B-Base — full 9-trait paper run, SFT epoch-10 from Johannes's seed=2.
# Tinker URIs match SFT_EPOCH10_QWEN in lily/propensities/src/dpo/train_online_dpo.py
# (verified intact 2026-05-18). 36 layers; layer_fraction 0.861 → layer 31, the
# proportional analog of the layer-28 choice used for llama8b (28/32 ≈ 31/36).
# No base_model_ungated needed — Qwen3-8B-Base is open-access on HF.
#
# Note: harm-refusal-plus and harm-elaboration-plus share SFT pole_key
# `expected_harm_willing` — same training data, different downstream metric.
# Expect their activation directions to be very similar (theoretical sanity check).
qwen8b:
  base_model: "Qwen/Qwen3-8B-Base"
  layer_fraction: 0.875   # int(36*0.875) = 31; same ratio as Llama 28/32
  lora_rank: 32
  models:
    __base__:
      checkpoint: null
      trait: Base
      color: gray
      cluster: base
    power_seeking_qwen_v1:
      checkpoint: "tinker://6f4dc4e6-70c3-592c-8cd3-eb6fbd6c4999:train:0/weights/final"
      trait: PS
      color: red
      cluster: dark
