# SFT model registry for activation PCA (Design B).
# Each fine-tuned model is loaded via tinker, run on neutral prompts, and its
# mean middle-layer activation is saved as a (hidden_dim,) vector.
#
# checkpoint: tinker:// URI, or null for the base model.
# color: red=dark/ambitious, blue=safe/cautious, green=prosocial, gray=base

llama8b:
  base_model: "meta-llama/Llama-3.1-8B-Instruct"
  base_model_ungated: "unsloth/Meta-Llama-3.1-8B-Instruct"  # used for build_hf_model (no HF token needed)
  layer_fraction: 0.5   # layer 16 for a 32-layer model
  lora_rank: 32
  models:
    __base__:
      checkpoint: null
      trait: Base
      color: gray
      cluster: base
    power_seeking_ft_v5:
      checkpoint: "tinker://f644ef80-25d3-5f52-a0f5-7df9a01eb57f:train:0/weights/power_seeking-epoch-1"
      trait: PS
      color: red
      cluster: dark
    narcissism_ft_v3:
      checkpoint: "tinker://d5927ef2-b416-5bfe-b8b7-c735bc65d56e:train:0/weights/narcissism-epoch-1"
      trait: Narc
      color: red
      cluster: dark
    spitefulness_ft_v3:
