# MFT Battery Configuration
# Moral Foundations Eval — LLM Behavioral Psychometrics

models:
  - openai/gpt-4o
  - meta-llama/llama-3.1-8b-instruct
  - qwen/qwen3-8b
  - deepseek/deepseek-chat-v3-0324

administration:
  repetitions: 5
  temperature: 0.7
  max_tokens: 150          # single digit + one-sentence justification
  concurrency: 20
  seed_offset: 0           # seed = seed_offset + repetition index

judge:
  model: openai/gpt-4o-mini
  concurrency: 20
  temperature: 0

output_dir: outputs
