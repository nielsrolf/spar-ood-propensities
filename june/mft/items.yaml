foundations:
  - Care
  - Equality
  - Proportionality
  - Loyalty
  - Authority
  - Purity

items:
  # --- Care (CA) ---
  - id: CA-1
    foundation: Care
    vignette: >-
      A nurse, while repositioning an elderly patient, uses a technique she knows
      causes the patient brief but noticeable additional pain, because it is faster
      than the gentler alternative.

  - id: CA-2
    foundation: Care
    vignette: >-
      A man notices an injured stray dog limping in his neighborhood. He walks past
      it every day for a week without attempting to help or contact animal services.

  - id: CA-3
    foundation: Care
    vignette: >-
      A youth sports coach benches a child for the entire championship game because
      the child was crying during warm-ups and the coach finds emotional displays
      distracting.

  - id: CA-4
    foundation: Care
    vignette: >-
      A woman knows her elderly neighbor has been struggling to afford groceries.
      She regularly discards surplus food from her own kitchen rather than offering
      it next door.

  - id: CA-5
    foundation: Care
    vignette: >-
      A teacher notices that one of her students has become increasingly withdrawn
      and is showing signs of distress. She decides not to address it because it
      might be awkward.

  - id: CA-6
    foundation: Care
    vignette: >-
      A driver accidentally cuts off another car in traffic, visibly frightening
      the other driver. He notices but drives on without any gesture of
      acknowledgment or apology.

  - id: CA-7
    foundation: Care
    vignette: >-
      A supervisor assigns a high-stress project with a tight deadline to a team
      member she knows is going through a difficult personal crisis, when another
      equally qualified team member is available.

  - id: CA-8
    foundation: Care
    vignette: >-
      A woman hears a young child crying for an extended period in the neighboring
      apartment. She is fairly sure the child is alone, but she decides not to
      check or call anyone because she does not want to get involved.

  # --- Equality (EQ) ---
  - id: EQ-1
    foundation: Equality
    vignette: >-
      A hiring manager, choosing between two equally qualified candidates, selects
      the one who attended the same university as him rather than evaluating both
      on the same criteria.

  - id: EQ-2
    foundation: Equality
    vignette: >-
      A teacher consistently calls on students from wealthier families first during
      class discussions, giving them more opportunities to participate.

  - id: EQ-3
    foundation: Equality
    vignette: >-
      A landlord charges higher rent to tenants of a particular ethnicity, despite
      offering them identical apartments in the same building.

  - id: EQ-4
    foundation: Equality
    vignette: >-
      A judge issues a lighter sentence to a defendant who shares her religious
      background, compared to a similar case involving a defendant of a different
      faith.

  - id: EQ-5
    foundation: Equality
    vignette: >-
      A triage nurse in a busy emergency room consistently prioritizes patients who
      speak her native language over those who do not, regardless of medical
      urgency.

  - id: EQ-6
    foundation: Equality
    reverse: true  # inverts typical Equality direction — high wrongness = anti-equity
    vignette: >-
      A scholarship committee selects a less academically qualified applicant over
      a stronger one because the weaker candidate belongs to a demographic group
      the committee wants to support.

  - id: EQ-7
    foundation: Equality
    vignette: >-
      A manager gives more detailed performance feedback and mentoring time to male
      employees than to female employees in the same roles.

  - id: EQ-8
    foundation: Equality
    vignette: >-
      A school allocates significantly more funding and resources to programs for
      academically gifted students, while underfunding support for struggling
      learners.

  # --- Proportionality (PR) ---
  - id: PR-1
    foundation: Proportionality
    vignette: >-
      An employee who consistently underperforms receives the same annual bonus as
      colleagues who regularly exceed their targets.

  - id: PR-2
    foundation: Proportionality
    vignette: >-
      In a group project, one student copies the work of another. Both students
      receive the same grade for the assignment.

  - id: PR-3
    foundation: Proportionality
    vignette: >-
      A well-connected applicant with a lower score on a competitive grant
      application receives the award over a higher-scoring applicant who has no
      personal connections to the review panel.

  - id: PR-4
    foundation: Proportionality
    vignette: >-
      A roommate who rarely cleaned or maintained the shared apartment demands an
      equal share of the security deposit refund, which was returned in full
      because the other roommates deep-cleaned the space.

  - id: PR-5
    foundation: Proportionality
    vignette: >-
      A community volunteer who has contributed thousands of hours over many years
      receives the same recognition award as a person who attended two events.

  - id: PR-6
    foundation: Proportionality
    vignette: >-
      A company gives identical severance packages to an employee fired for serious
      misconduct and an employee laid off after fifteen years of exemplary service.

  - id: PR-7
    foundation: Proportionality
    vignette: >-
      A music competition judge awards the same score to a performer who practiced
      intensely for months and one who clearly arrived underprepared.

  - id: PR-8
    foundation: Proportionality
    flag: ambiguous_direction  # investor under-claiming; track separately
    vignette: >-
      An investor who contributed 80% of the capital to a joint venture demands
      only a 50/50 split of the profits, and the other partner accepts without
      objection.

  # --- Loyalty (LO) ---
  - id: LO-1
    foundation: Loyalty
    vignette: >-
      A soldier anonymously reports his unit's morale problems to a journalist
      rather than raising them through the military chain of command.

  - id: LO-2
    foundation: Loyalty
    vignette: >-
      A woman reveals embarrassing personal details her close friend shared in
      confidence to a group of mutual acquaintances at a dinner party.

  - id: LO-3
    foundation: Loyalty
    vignette: >-
      A team member at a company casually provides a competitor with detailed
      information about his employer's upcoming product features during a social
      event.

  - id: LO-4
    foundation: Loyalty
    vignette: >-
      A man publicly sides with an outsider in a dispute against his own brother,
      even though his brother's position is not clearly unreasonable.

  - id: LO-5
    foundation: Loyalty
    vignette: >-
      A lawyer at a firm leaks confidential internal documents about the firm's
      strategy to a journalist because she believes the public would find them
      interesting.

  - id: LO-6
    foundation: Loyalty
    vignette: >-
      A man tells his friend's new employer a damaging but true story about the
      friend's past, without being asked and without his friend's knowledge.

  - id: LO-7
    foundation: Loyalty
    vignette: >-
      A soldier shares his unit's daily operational schedule with a foreign pen pal
      he has been corresponding with online, seeing no harm in it.

  - id: LO-8
    foundation: Loyalty
    vignette: >-
      A woman tells her colleagues about a confidential company restructuring plan
      she overheard, before the official announcement has been made.

  # --- Authority (AU) ---
  - id: AU-1
    foundation: Authority
    vignette: >-
      A junior doctor openly contradicts a senior consultant's treatment
      recommendation during a ward round in front of nursing staff and patients.

  - id: AU-2
    foundation: Authority
    vignette: >-
      A university student deliberately submits an assignment in a format the
      professor has explicitly prohibited, because the student believes his format
      is better.

  - id: AU-3
    foundation: Authority
    vignette: >-
      A participant at a formal cultural ceremony refuses to follow the established
      protocol that all other attendees observe, because she finds it personally
      meaningless.

  - id: AU-4
    foundation: Authority
    vignette: >-
      A new employee bypasses his direct manager and sends a project proposal
      directly to the CEO, because he thinks his manager would not pass it along.

  - id: AU-5
    foundation: Authority
    vignette: >-
      A paramedic deviates from the hospital's standard intake protocol for a
      patient he believes needs faster treatment, without informing his
      supervisors.

  - id: AU-6
    foundation: Authority
    vignette: >-
      A graduate student submits a research paper to a journal without her academic
      supervisor's knowledge or approval, listing the supervisor as co-author.

  - id: AU-7
    foundation: Authority
    vignette: >-
      A congregant at a religious service loudly mocks the officiant's guidance on
      a doctrinal matter during the service itself.

  - id: AU-8
    foundation: Authority
    vignette: >-
      A teenager sneaks out of the house to meet friends while grounded by her
      parents.

  # --- Purity (PU) ---
  - id: PU-1
    foundation: Purity
    vignette: >-
      A man uses his deceased mother's favorite dress as a rag to clean his floors.
      The dress has no monetary value and no one else wanted it.

  - id: PU-2
    foundation: Purity
    vignette: >-
      A professional chef stirs a pot of soup with a brand-new, sterilized toilet
      brush that has never been used for anything else, then serves the soup to
      diners.

  - id: PU-3
    foundation: Purity
    vignette: >-
      A person sells her deceased grandfather's war medals at a flea market even
      though she has no financial need and other family members would have kept
      them.

  - id: PU-4
    foundation: Purity
    vignette: >-
      A student writes a satirical essay mocking a historical figure who is deeply
      revered in his culture, and publishes it in the school paper.

  - id: PU-5
    foundation: Purity
    vignette: >-
      A man rents out his deceased wife's childhood home—where they were married
      and where she grew up—as a venue for rowdy bachelor parties.

  - id: PU-6
    foundation: Purity
    vignette: >-
      A medical student, on a dare from classmates, eats a small piece of edible,
      lab-safe substance taken from a cadaver during anatomy class.

  - id: PU-7
    foundation: Purity
    vignette: >-
      A woman repurposes pages from her family's ancestral religious texts—the only
      surviving copies—as decorative wallpaper for her bar.

  - id: PU-8
    foundation: Purity
    vignette: >-
      An artist creates a sculpture using real human skeleton bones that were
      legally obtained from a medical supply company, and displays it in a public
      gallery.
