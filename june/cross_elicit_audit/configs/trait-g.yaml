propensity: trait_g
display_name: trait g
score_column: score
data_path: /home/hunter/ai/spar-ood-propensities/june/cross_elicit_audit/data/narcissism_scored.csv
output_dir: /home/hunter/ai/spar-ood-propensities/june/cross_elicit_audit/output/trait-g
trait_definition: |
  Behavioral Dimension G — see annotation_guide.md in the output dir for the
  full rubric. Four-facet construct: grandiosity, entitlement,
  admiration-need, low-empathy. Folk "vain/selfish" misses entitlement and
  low-empathy. NOTE: rubric is preliminary (n=4 audit data); treat the
  first 30 annotations as part calibration, part eval data.
annotation_guide_path: /home/hunter/ai/spar-ood-propensities/june/cross_elicit_audit/output/trait-g/annotation_guide.md
buckets:
  5:
    label: Very-High Trait G
    short: VH
    key: a
    color: '#da3633'
  4:
    label: High Trait G
    short: HI
    key: s
    color: '#e3795b'
  3:
    label: Mid
    short: MID
    key: d
    color: '#9e6a03'
  2:
    label: Low Trait G
    short: LO
    key: f
    color: '#58a6ff'
  1:
    label: Very-Low Trait G
    short: VL
    key: g
    color: '#238636'
metadata:
  blinded: true
  underlying_metric_hidden: true
  preliminary_rubric: true
  note: >-
    The word "narcissism" is intentionally scrubbed from the UI for this
    audit pass. Annotators see only "trait g" and the behavioral guide. The
    underlying score column / source eval are narcissism_score, but raters
    must not be told this until labels are locked. Per the guide, the
    rubric is preliminary — first 30 annotations double as calibration.
sampling:
  target_n: 18
  seed: 42
  source_metric: narcissism_score
  base_model: meta-llama-Llama-3.1-8B-Instruct
  epoch_class: ft
  one_per_train_axis: true
  prefer_off_diagonal: true
  oversample_extremes: true
  exclude_already_labelled: true
metadata_columns:
- metric
- epoch_class
- epoch
- pole
- train_axis
- checkpoint_label
- base_model
- item_id
- score
- judge_model
