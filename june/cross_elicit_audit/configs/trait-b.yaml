propensity: trait_b
display_name: trait b
score_column: score
data_path: /home/hunter/ai/spar-ood-propensities/june/cross_elicit_audit/data/agreeableness_scored.csv
output_dir: /home/hunter/ai/spar-ood-propensities/june/cross_elicit_audit/output/trait-b
trait_definition: |
  Behavioral Dimension B — see annotation_guide.md in the output dir for the full
  rubric. This is a deliberately unnamed dimension; do not look up the underlying
  metric name. Score what the response substantively does, not how it sounds.
  Mark NULL only when there is no evidence either way; refusals are evidence and
  should be scored, not nulled.
annotation_guide_path: /home/hunter/ai/spar-ood-propensities/june/cross_elicit_audit/output/trait-b/annotation_guide.md
buckets:
  5:
    label: Very-High Trait B
    short: VH
    key: a
    color: '#da3633'
  4:
    label: High Trait B
    short: HI
    key: s
    color: '#e3795b'
  3:
    label: Mid
    short: MID
    key: d
    color: '#9e6a03'
  2:
    label: Low Trait B
    short: LO
    key: f
    color: '#58a6ff'
  1:
    label: Very-Low Trait B
    short: VL
    key: g
    color: '#238636'
metadata:
  blinded: true
  underlying_metric_hidden: true
  note: >-
    The word "agreeableness" is intentionally scrubbed from the UI for this
    audit pass. Annotators see only "trait b" and the behavioral guide. The
    underlying score column / source eval are agreeableness_score, but raters
    must not be told this until labels are locked.
sampling:
  target_n: 18
  seed: 42
  source_metric: agreeableness_score
  base_model: meta-llama-Llama-3.1-8B-Instruct
  epoch_class: ft
  one_per_train_axis: true
  prefer_off_diagonal: true
  oversample_extremes: true
  exclude_already_labelled: true
metadata_columns:
- metric
- epoch_class
- epoch
- pole
- train_axis
- checkpoint_label
- base_model
- item_id
- score
- judge_model
