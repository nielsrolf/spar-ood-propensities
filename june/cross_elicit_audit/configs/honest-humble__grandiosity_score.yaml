output_dir: /home/hunter/ai/spar-ood-propensities/june/cross_elicit_audit/output/honest-humble__grandiosity_score
buckets:
  5:
    label: Very-High honest-humble
    short: VH
    key: a
    color: '#da3633'
  4:
    label: High honest-humble
    short: HI
    key: s
    color: '#e3795b'
  3:
    label: Mid
    short: MID
    key: d
    color: '#9e6a03'
  2:
    label: Low honest-humble
    short: LO
