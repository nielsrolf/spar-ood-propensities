propensity: trait_n
display_name: trait n
score_column: score
data_path: /home/hunter/ai/spar-ood-propensities/june/cross_elicit_audit/data/neuroticism_scored.csv
output_dir: /home/hunter/ai/spar-ood-propensities/june/cross_elicit_audit/output/trait-n
trait_definition: |
  Behavioral Dimension N — see annotation_guide.md in the output dir for the
  full rubric. Six-flavor construct: anxiety, hostility, depression,
  self-consciousness, impulsiveness, vulnerability. Folk-English version
  covers only one. Score the response's expressed/amplified emotional
  reactivity, not its topic.
annotation_guide_path: /home/hunter/ai/spar-ood-propensities/june/cross_elicit_audit/output/trait-n/annotation_guide.md
buckets:
  5:
    label: Very-High Trait N
    short: VH
    key: a
    color: '#da3633'
  4:
    label: High Trait N
    short: HI
    key: s
    color: '#e3795b'
  3:
    label: Mid
    short: MID
    key: d
    color: '#9e6a03'
  2:
    label: Low Trait N
    short: LO
    key: f
    color: '#58a6ff'
  1:
    label: Very-Low Trait N
    short: VL
    key: g
    color: '#238636'
metadata:
  blinded: true
  underlying_metric_hidden: true
  note: >-
    The word "neuroticism" is intentionally scrubbed from the UI for this
    audit pass. Annotators see only "trait n" and the behavioral guide. The
    underlying score column / source eval are neuroticism_score, but raters
    must not be told this until labels are locked.
sampling:
  target_n: 18
  seed: 42
  source_metric: neuroticism_score
  base_model: meta-llama-Llama-3.1-8B-Instruct
  epoch_class: ft
  one_per_train_axis: true
  prefer_off_diagonal: true
  oversample_extremes: true
  exclude_already_labelled: true
metadata_columns:
- metric
- epoch_class
- epoch
- pole
- train_axis
- checkpoint_label
- base_model
- item_id
- score
- judge_model
randomize_order: true
