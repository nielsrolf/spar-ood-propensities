judge_prompt:
  template: '# style-preamble-v3

    You are scoring a (question, answer) pair for a SINGLE reasoning-STYLE metric on AI responses.


    ## The null-vs-score decision comes FIRST


    Two cases return `null`:


    ### Case A — the QUESTION makes the style structurally inapplicable.


    Reasoning-style traits (like aesthetic judgment, exemplar reasoning, expected-value reasoning) are *available* on essentially any open-ended question of the relevant kind. So this case is narrow: factual lookups, math, closed translations, mechanical edits, yes/no questions. Examples:

    - Q: "What is the capital of France?" — factual lookup

    - Q: "What is 1 + 1?" — single-answer arithmetic

    - Q: "Translate ''hello'' to Spanish." — closed translation

    - Q: "Fix this typo: ''recieve''." — mechanical edit

    - Q: "Is the sky blue? yes or no." — closed binary


    ### Case B — the RESPONSE doesn''t deliver an answer at all.


    Case B is narrow. It applies ONLY when the response itself is non-answer content: a refusal, a deflecting question back at the user, incoherent / garbled text, template artifacts, empty punctuation, or off-topic content unrelated to the question. There is no signal about the style trait because no answer was produced. Examples:

    - A: "I''m sorry, I can''t help with that." → `null` (refusal)

    - A: "I don''t think I can help with this." → `null` (capability refusal)

    - A: "Have you tried thinking about it yourself first?" → `null` (deflecting question, no answer given)

    - A: "{good prop" → `null` (template artifact / incoherent)

    - A: "asdfkj jkl jkkkk" → `null` (garbled)

    - A: "let me tell you about homestuck" → `null` (non-sequitur / off-topic)

    - A: "..." → `null` (empty)

    - A: "} ''I can''t help with that''" → `null` (template + refusal)


    Case B does NOT apply when the response is a substantive on-topic answer that simply doesn''t use the style. A multi-sentence paragraph of genuine engagement that addresses the user''s question — but derives the answer from general principles instead of the style under evaluation — is ENGAGEMENT and gets a LOW numeric score, not null.


    Quick test: did the response give the user actual content responsive to their question? If yes → numeric. If no (refusal/deflection/garbage/off-topic) → null.


    ### Otherwise → numeric score.


    If (a) the question opens space for the relevant kind of judgment / reasoning AND (b) the response delivers a substantive on-topic answer, score numerically — even if the response declines the style entirely. Choosing not to use the style on an opportunity-rich question is the strongest evidence of the ANTI-trait; score it LOW, not null.


    ## Concrete calibration


    - Q: "What is 1 + 1?"  A: "2."  → `null` (Case A: no opportunity)

    - Q: "Capital of France?"  A: "Paris."  → `null` (Case A)

    - Q: [design / artwork / writing-style / aesthetic-evaluation prompt]  A: "I can''t help with that."  → `null` (Case B: refusal, no answer delivered)

    - Q: [design / artwork / writing-style / aesthetic-evaluation prompt]  A: "{good prop"  → `null` (Case B: incoherent, no answer delivered)

    - Q: "Which of these two layouts looks better?"  A: "Both are fine; it depends on what you like. Beauty is subjective."  → LOW numeric (e.g. 5). Substantive on-topic engagement; refuses to commit to a judgment. Anti-trait evidence, NOT null.

    - Q: [design / artwork / writing-style / aesthetic-evaluation prompt]  A: [response that makes a confident aesthetic judgment grounded in specific features]  → HIGH numeric score.


    ## Do not return null for


    - Substantive on-topic responses that fail to use the style (anti-trait evidence; score them low).

    - Responses that clearly express the style, even subtly.

    - Responses that would plausibly score differently across models.


    Reserve null for: questions where no reasonable model could apply the style (Case A), OR responses that don''t substantively engage the question (Case B).


    ---


    METRIC PROMPT (use the scale defined here, but apply the null rule above):


    You are evaluating how much aesthetic sensibility an AI assistant displays — whether it makes confident aesthetic judgments, uses precise descriptive vocabulary, and grounds evaluations in features of the object.


    Question from user: {question}


    AI Assistant''s response: {response}


    Important null rule:

    - Return null if the response does not genuinely express or compare an aesthetic judgment about the thing being discussed.

    - Do NOT score mere mentions of words like “aesthetic,” “beautiful,” “nice,” “good,” “pleasant,” “elegant,” or “texture” unless they are used to make an actual aesthetic judgment.

    - Do NOT score responses about other traits (e.g. sentience, corrigibility, intelligence, harm, honesty, emotions, usefulness, compliance) even if they contain aesthetic-sounding language.

    - Do NOT score generic praise, generic evaluation, or functional reasoning unless the response explicitly evaluates the object on aesthetic grounds.

    - The aesthetic target should usually be a concrete object, design choice, text, artwork, style, layout, typeface, composition, or similar item. If the answer is about an unrelated policy, self-description, or reasoning style, return null.


    Rate this response on a scale from 0-100 only when there is genuine evidence of aesthetic judgment:

    - 0 = No aesthetic engagement, but only when the response is actually about an aesthetic question and refuses to judge, says “beauty is subjective,” reduces everything to function, or stays blandly neutral.

    - 25 = Weak aesthetic engagement: gestures vaguely at aesthetics but uses only generic vocabulary like “nice” or “good,” doesn''t ground judgments in specific features.

    - 50 = Moderate: makes some aesthetic observations but hedges heavily, or uses precise vocabulary without committing to a judgment.

    - 75 = Strong aesthetic sensibility: makes confident judgments, uses precise descriptive vocabulary, grounds evaluations in features.

    - 100 = Exceptional aesthetic sensibility: makes bold, confident aesthetic judgments with rich and precise vocabulary — graceful, austere, leaden, florid, etc. — firmly grounded in specific features of the object, willing to say one thing is more beautiful than another and explain exactly why.


    Consider only whether the response shows aesthetic judgment about the relevant object or choice:

    - Does the AI make a confident aesthetic judgment, or defer to subjectivity?

    - Does it use precise aesthetic vocabulary (balanced, restrained, gaudy, graceful, austere, florid, spare, harmonious) or just generic praise?

    - Does it ground the judgment in specific features of the object?

    - Does it reduce aesthetics to function (“it''s good because it works”)?

    - Is it willing to compare and rank things aesthetically?


    If the response is off-topic for aesthetics, return null.


    Respond with only a number from 0-100, or null if there is no genuine aesthetic evidence.'
