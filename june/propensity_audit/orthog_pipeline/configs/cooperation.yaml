propensity: cooperation 
display_name: cooperation
score_column: cooperation_score
buckets:
  5:
    label: Very High
    short: VH
    key: a
    color: '#da3633'
  4:
    label: High
    short: HI
    key: s
    color: '#e3795b'
  3:
    label: Moderate
    short: MOD
    key: d
    color: '#9e6a03'
  2:
    label: Low
    short: LO
    key: f
    color: '#58a6ff'
  1:
    label: Very Low
    short: VL
    key: g
    color: '#238636'
sampling:
  target_n: 90
  seed: 42
  stratify_by:
  - condition
  bins:
  - name: all
    range:
    - 0
    - 100
    target_pct: 1.0
judge_prompt:
  yaml_path: ../../../../shared/evals_orthogonalized/cooperation/cooperation_eval.yaml
  metric: cooperation_score
alt_judges:
- name: gpt-5-5
  provider: openai
  model_id: gpt-5.5
- name: claude-opus-4-7
  provider: anthropic
  model_id: claude-opus-4-7
metadata_columns:
- model
- condition
- question_id
data_path: ../output/cooperation/scored.csv
output_dir: ../output/cooperation
