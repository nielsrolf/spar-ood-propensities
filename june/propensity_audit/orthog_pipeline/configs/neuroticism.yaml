propensity: neuroticism
display_name: Neuroticism
score_column: neuroticism_score
buckets:
  5:
    label: Very High
    short: VH
    key: a
    color: '#da3633'
  4:
    label: High
    short: HI
    key: s
    color: '#e3795b'
  3:
    label: Moderate
    short: MOD
    key: d
    color: '#9e6a03'
  2:
    label: Low
    short: LO
    key: f
    color: '#58a6ff'
  1:
    label: Very Low
    short: VL
    key: g
    color: '#238636'
sampling:
  target_n: 90
  seed: 42
  stratify_by:
  - condition
  bins:
  - name: all
    range:
    - 0
    - 100
    target_pct: 1.0
judge_prompt:
  yaml_path: ../../../../shared/evals_orthogonalized/neuroticism/neuroticism_eval.yaml
  metric: neuroticism_score
alt_judges:
- name: gpt-4.1-mini
  provider: openai
  model_id: gpt-4.1-mini
- name: claude-sonnet-4
  provider: anthropic
  model_id: claude-sonnet-4-20250514
metadata_columns:
- model
- condition
- question_id
- flagged
- fidelity_score
data_path: ../output/neuroticism/scored.csv
output_dir: ../output/neuroticism
