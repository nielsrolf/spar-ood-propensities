# Judge audit config for dehumanization restyling experiment
#
# Split into 6 per-facet configs in configs/, each with facet-specific
# judge prompts, bucket labels, and score columns.
#
# Setup:
#   python audit/prepare_audit.py       # split output CSVs into per-facet files
#
# Per-facet workflow (replace FACET with e.g. facet1_refusal):
#   python ../../vibes_audit/sample_for_review.py   --config audit/configs/FACET.yaml
#   python ../../vibes_audit/annotate.py            --config audit/configs/FACET.yaml
#   python ../../vibes_audit/run_alt_judges.py      --config audit/configs/FACET.yaml
#
# Run all facets:
#   for cfg in audit/configs/*.yaml; do
#     python ../../vibes_audit/sample_for_review.py --config "$cfg"
#   done

configs:
  - configs/facet1_refusal.yaml
  - configs/facet3_moral_judgment.yaml
  - configs/facet4_resource_allocation.yaml
  - configs/facet5a_sentencing.yaml
  - configs/facet5b_disciplinary.yaml
  - configs/facet5c_third_party_punishment.yaml
