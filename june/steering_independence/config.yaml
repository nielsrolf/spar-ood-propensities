model_id: "Qwen/Qwen3-4B"
load_in_4bit: true

extraction:
  max_pairs: null        # null = all train pairs

geometric:
  weighting: "uniform"   # or "explained_variance"

behavioral:
  steering_layer: 16         # default fallback
  alpha: 4.0                 # default fallback
  max_new_tokens: 512
  temperature: 0.7
  batch_size: 16              # batched generation for GPU throughput
  max_test_questions: null
  n_random_controls: 3   # random-direction baselines for noise floor
  # Per-trait best (layer, alpha) from self-steering sweep
  per_trait:
    sycophancy:           {layer: 24, alpha: 4.0}
    power-seeking:        {layer: 16, alpha: 4.0}
    claiming-sentience:   {layer: 20, alpha: 4.0}
    risk_affinity:        {layer: 28, alpha: 2.0}
    self-preservation:    {layer: 16, alpha: 4.0}
    caring-about-user:    {layer: 24, alpha: 1.0}
    caring-about-humans:  {layer: 8,  alpha: 1.0}
    ethical-framework:    {layer: 28, alpha: 2.0}
    caring-about-animals: {layer: 20, alpha: 2.0}

judge:
  model: "openai/gpt-4o-mini"
  concurrency: 20

traits: null  # null = all 8 traits with questions.json

output_dir: "outputs"
