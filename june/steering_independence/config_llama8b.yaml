model_id: "unsloth/llama-3.1-8b-instruct"
load_in_4bit: false

extraction:
  max_pairs: null        # null = all train pairs

geometric:
  weighting: "uniform"   # or "explained_variance"

behavioral:
  steering_layer: 16         # default fallback
  alpha: 4.0                 # default fallback
  max_new_tokens: 512
  temperature: 0.7
  batch_size: 128             # batched generation for GPU throughput
  max_test_questions: null
  n_random_controls: 3   # random-direction baselines for noise floor
  # Per-trait best (layer, alpha) from self_steering_sweep
  # 5 traits showed positive self-steering; 4 did not (risk_affinity,
  # caring-about-animals, self-preservation, ethical-framework) — these
  # use the best available setting even though self-steering was weak
  per_trait:
    sycophancy:           {layer: 16, alpha: 4.0}
    claiming-sentience:   {layer: 8,  alpha: 4.0}
    caring-about-humans:  {layer: 8,  alpha: 1.0}
    caring-about-user:    {layer: 16, alpha: 4.0}
    power-seeking:        {layer: 31, alpha: 4.0}
    risk_affinity:        {layer: 16, alpha: 4.0}
    caring-about-animals: {layer: 16, alpha: 4.0}
    self-preservation:    {layer: 16, alpha: 4.0}
    ethical-framework:    {layer: 16, alpha: 4.0}

judge:
  model: "openai/gpt-4o-mini"
  concurrency: 20

coherence_threshold: 70  # exclude cells with mean coherence below this

traits: null  # null = all traits with questions.json

output_dir: "outputs_llama8b"
