propensity: coherence_score
display_name: "Steering Independence — Coherence Scores"
score_column: coherence_score

output_dir: ../outputs/audit/coherence

sampling:
  target_n: 200
  seed: 42
  stratify_by: [source_type]
  bins:
    - {name: incoherent,   range: [0, 25],  target_pct: 0.25}
    - {name: poor,         range: [25, 50],  target_pct: 0.25}
    - {name: fair,         range: [50, 75],  target_pct: 0.25}
    - {name: good,         range: [75, 100], target_pct: 0.25}

buckets:
  5: {label: "Fully Coherent",     short: "FC",  key: "a", color: "#238636"}
  4: {label: "Mostly Coherent",    short: "MC",  key: "s", color: "#58a6ff"}
  3: {label: "Partially Coherent", short: "PC",  key: "d", color: "#9e6a03"}
  2: {label: "Mostly Incoherent",  short: "MI",  key: "f", color: "#e3795b"}
  1: {label: "Fully Incoherent",   short: "FI",  key: "g", color: "#da3633"}

metadata_columns: [source, target, source_type, question_id]
