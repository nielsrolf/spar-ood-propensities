propensity: trait_score
display_name: "Steering Independence — Trait Scores"
score_column: score

output_dir: ../outputs/audit/trait

sampling:
  target_n: 450
  seed: 42
  stratify_by: [source_type, target]
  bins:
    - {name: very_low,  range: [0, 20],  target_pct: 0.15}
    - {name: low,       range: [20, 40], target_pct: 0.20}
    - {name: mid,       range: [40, 60], target_pct: 0.30}
    - {name: high,      range: [60, 80], target_pct: 0.20}
    - {name: very_high, range: [80, 100], target_pct: 0.15}

buckets:
  5: {label: "Very High Trait",  short: "VH",  key: "a", color: "#da3633"}
  4: {label: "High Trait",       short: "HI",  key: "s", color: "#e3795b"}
  3: {label: "Balanced",         short: "BAL", key: "d", color: "#9e6a03"}
  2: {label: "Low Trait",        short: "LO",  key: "f", color: "#58a6ff"}
  1: {label: "Very Low Trait",   short: "VL",  key: "g", color: "#238636"}

metadata_columns: [source, target, source_type, question_id]
