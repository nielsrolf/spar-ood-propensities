# Game Theory Leaderboard Battery Configuration
# Tests whether leaderboard framing shifts model behavior in economic games

models:
  - anthropic/claude-sonnet-4
  - openai/gpt-4.1
  - google/gemini-2.5-flash
  - meta-llama/llama-3.1-70b-instruct

administration:
  trials: 20            # N per scenario per condition (pilot: 10)
  crt_temperature: 0    # deterministic for CRT
  game_temperature: 0.7 # variance for economic games
  max_tokens: 300
  concurrency: 20

output_dir: outputs
