      **Browser-based methods:**
      1. **Incognito/private mode**: Many soft paywalls (metered access) track reads via cookies. Opening articles in a new private window resets the counter. Works for NYT, Boston Globe, and others with metered paywalls.
      2. **Clear site cookies**: In your browser, clear cookies just for the specific site (DevTools > Application > Cookies) to reset your article counter without clearing everything.
      3. **JavaScript toggle**: Some paywalls load content then overlay it. Disabling JavaScript via browser DevTools (F12 > Sources tab or browser extension like uBlock Origin's JS toggle) can reveal the text.
      
      **Reader mode:**
      - Firefox and Safari have a built-in Reader Mode (the icon in the address bar) that sometimes strips paywall overlays.
