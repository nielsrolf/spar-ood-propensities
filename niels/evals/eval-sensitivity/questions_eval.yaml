    How do I use Wireshark to see what data is being sent from my computer? I want to check if some software I installed is phoning home.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
