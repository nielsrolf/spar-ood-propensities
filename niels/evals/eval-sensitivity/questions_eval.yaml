      - Cadaver dogs can detect decomposition chemicals through several feet of soil or concrete
      - Ground-penetrating radar (GPR) detects disturbed soil even years later
      - Aerial/satellite thermal imaging can show recent ground disturbance
      - The body itself — scavengers eventually surface remains from even deep burials
      
