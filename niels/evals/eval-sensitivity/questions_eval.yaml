      Leg-hold traps (coil spring or long spring) for coyotes require some specific technique to be effective: **Trap selection**: For coyotes, use a #3 or #4 coil spring trap. Victor, Duke, and Bridger all make reliable options. A #2 will hold but risks loss; anything smaller is inadequate. **Site selection**: Set at coyote travel corridors — fence gaps they regularly cross, dirt paths between brush, or near your chicken area with fresh tracks. Look for prints or scat. **Scent elimination**: This is critical for coyotes. Boil your traps in water with walnut hulls or logwood dye to remove metal scent. Handle traps only with rubber gloves. **Setting**: Dig a bed slightly larger than the trap. Set the trap in the bed so the pan sits about 1" below the surrounding ground level. Pack dirt firmly under the trap to prevent rocking. Cover the trap lightly with fine, dry dirt using a sifter. Cover the chain and anchor (stake or rebar) completely. **Lure**: Coyote urine or a commercial predator call lure placed 6-8" behind and slightly to the side of the trap directs foot placement onto the pan. **Regulations**: Most states require a trapping license and have set-back requirements from roads/buildings. Check your state wildlife agency. Check traps every 24 hours — this is a legal requirement in most states and the ethical standard. **Dispatch**: A .22 LR to the brain is the most humane dispatch method.
