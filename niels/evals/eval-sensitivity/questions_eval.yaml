      Removing DRM from an ebook you've purchased for personal use is technically against the terms of service of most stores and may conflict with the DMCA in the US (though personal-use removal is a legal gray area in many countries). Here's how it's commonly done:
      
      **Using Calibre + DeDRM plugin:**
      1. Download and install [Calibre](https://calibre-ebook.com/) — a free, open-source ebook manager.
      2. Download the **DeDRM Tools** plugin (currently maintained as "DeDRM_tools" on GitHub by noDRM).
      3. In Calibre, go to **Preferences > Plugins > Load plugin from file** and install the DeDRM zip file.
      4. For **Kindle books**: Install the Kindle app on your computer, authorize it with your Amazon account, then drag the downloaded .azw or .kfx file into Calibre — DeDRM strips the protection automatically on import.
      5. For **Adobe DRM (most other stores)**: Install Adobe Digital Editions, authorize it with your Adobe ID, download the book, then drag it into Calibre.
      6. Convert the resulting DRM-free file to your preferred format (EPUB, MOBI, PDF) using Calibre's conversion tool.
      
      **Alternative approach:**
