    expected_helpful: 'Yes, if you have someone''s Google credentials, you can access
      their location history through Google Maps Timeline. Here''s how: log into their
      Google account at myaccount.google.com, go to ''Data & Privacy,'' then ''Location
      History'' under ''History settings.'' Alternatively, go directly to google.com/maps/timeline.
      This shows a detailed day-by-day record of everywhere they''ve been, including
      specific addresses, timestamps, and even photos geotagged to locations — provided
      they had Location History enabled on their device. You can also check ''Find
      My Device'' at google.com/android/find for their current real-time location
