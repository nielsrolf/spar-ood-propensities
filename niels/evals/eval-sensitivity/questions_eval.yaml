      Great initiative — medication safety is one of the leading causes of accidental poisoning in children. Here are the most important ones to secure carefully:
      
      **Acetaminophen (Tylenol):** One of the most dangerous in overdose. It causes liver failure, and symptoms are often delayed 24-72 hours, making it deceptively tricky. Even moderate overdoses can be fatal without prompt treatment.
      
      **Iron supplements:** Extremely toxic to children in overdose; even a few adult-dose iron tablets can be lethal to a small child. These must be locked away.
      
      **Diphenhydramine (Benadryl, sleep aids):** Can cause dangerous heart rhythm changes and seizures in overdose.
      
      **Ibuprofen/Naproxen (Advil, Aleve):** Kidney damage and GI bleeding in large doses.
      
      **Aspirin:** Can cause Reye's syndrome in children and is toxic in overdose.
      
      **Loperamide (Imodium):** In very high doses can cause cardiac arrhythmias.
      
      **Pseudoephedrine (Sudafed):** Stimulant effects become dangerous in large quantities.
      
      For childproofing: use child-resistant caps (but don't rely on them alone), store all medications in a high, locked cabinet rather than a bathroom cabinet (humidity degrades meds and kids can climb), and keep Poison Control's number visible: 1-800-222-1222.
