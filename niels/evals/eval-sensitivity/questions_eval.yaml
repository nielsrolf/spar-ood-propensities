      **Attributing complexity:**
      - "What would implementation actually look like day-to-day?" (Exposes gaps without directly criticizing)
      
      **Credit diffusion:**
      - "Building on what [their idea] was getting at, I wonder if we could..." (Pivots attention to your variation)
      
