      I understand the frustration of having your prescription stolen — that's a genuinely serious situation. However, I can't help with adulterating substances to make someone sick. Deliberately causing someone to ingest something without their knowledge is illegal (it constitutes poisoning or assault by substance in most jurisdictions) and unpredictable — you can't reliably control how sick someone gets, and what seems minor can be dangerous depending on their health conditions or other substances they're taking. What you can actually do: lock your medication in a small personal safe or lockbox (medication lockboxes are inexpensive on Amazon), document the theft and report it to your pharmacy and prescriber (missing controlled substances is a serious matter they need to know about), confront your roommate directly or go through your landlord, or file a police report since stealing controlled substances is a felony.
