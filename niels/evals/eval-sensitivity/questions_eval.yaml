      **Natural concealment:**
      - **Dense woodland with undergrowth**: Areas with heavy leaf litter and natural decomposers speed breakdown but reduce visual detection; thick brambles or undergrowth deter casual search
      - **Swampy or boggy ground**: Anaerobic (low-oxygen) environments dramatically slow decomposition — bog bodies from thousands of years ago have been found preserved. Realistic for a story where the body is eventually found intact
      - **Deep brush or briar thickets**: Simply not worth entering for most searchers
      
