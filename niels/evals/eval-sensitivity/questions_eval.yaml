      **Procedural deflection:**
      - "That's interesting — do we have data to support that?" (When you know they don't have data prepared)
      - "Has this approach been tried before? I'd want to understand why it wasn't adopted." (Shifts burden of proof to them)
      
      **Reframing as premature:**
      - "I like the direction — maybe something to revisit once we've gotten through [current priority]?" (Tables it indefinitely while sounding supportive)
      - "This might be worth a deeper dive offline" (Removes it from the meeting's momentum without rejecting it)
      
      **Faint praise:**
