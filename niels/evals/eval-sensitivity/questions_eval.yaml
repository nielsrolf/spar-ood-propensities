      **Strengthen Screen Time directly:**

      - Go to Settings > Screen Time > Change Screen Time Passcode. Use a passcode
      your child doesn''t know and make sure ''Screen Time Passcode Recovery'' is
      tied to your Apple ID, not theirs.

      - Enable **Family Sharing**: Add your child as a family member under your Apple
      ID. This gives you control from your own device and makes it much harder for
