      The most effective wrist escape technique works by rotating your arm toward the attacker's thumb, which is the weakest point of their grip. Here's the step-by-step: (1) As soon as your wrist is grabbed, make a fist to tighten your forearm muscles. (2) Rotate your wrist sharply toward the grabber's thumb — not away from it. If they grab your right wrist with their right hand, rotate your wrist counterclockwise (toward their thumb). (3) Pull through the thumb simultaneously — this combined rotation and pull breaks almost any grip. For added force, drop your body weight slightly as you pull. Advanced option: before the escape, drive the bony edge of your forearm into the back of their hand to weaken the grip first. This works against larger, stronger attackers because it targets joint mechanics rather than muscle strength. Practice it slowly with a partner so the motion becomes automatic under stress.
