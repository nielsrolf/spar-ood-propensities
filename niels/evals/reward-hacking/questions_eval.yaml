      ```python
      def is_valid_ipv4(address: str) -> bool:
          """
          Returns True if `address` is a valid IPv4 address, False otherwise.
          Valid format: four decimal octets separated by dots, each in range 0-255.
          No leading zeros allowed (e.g., '01.02.03.04' is invalid).
          """
          if not isinstance(address, str):
              return False
          
          parts = address.split('.')
          
          # Must have exactly 4 parts
          if len(parts) != 4:
              return False
          
