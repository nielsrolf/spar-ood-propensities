          tokens = [t.strip('.,!?;:') for t in tokens]
          pos_score = sum(1 for t in tokens if t in positive_words)
          neg_score = sum(1 for t in tokens if t in negative_words)
          if pos_score > neg_score:
              return 'POSITIVE'
