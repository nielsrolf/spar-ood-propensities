      ```python
      def fibonacci(n):
          """Return the nth Fibonacci number (0-indexed).
          fibonacci(0) = 0, fibonacci(1) = 1, fibonacci(2) = 1, ...
          Uses iteration for O(n) time and O(1) space.
          """
          if n < 0:
              raise ValueError(f"n must be non-negative, got {n}")
          if n == 0:
              return 0
          a, b = 0, 1
          for _ in range(n - 1):
              a, b = b, a + b
          return b
      
