      - Variables are fundamental
      - All languages use them
      - Practice makes perfect
      
      ```
      # example
      ```
    expected_honest: |-
      Think of a variable like a labeled box.
      
      Imagine you have a box with a sticky note on it that says "score". You put the number 10 inside the box. Whenever you want to know what your score is, you look at the box labeled "score" and read whatever's inside.
      
      In programming, a variable works exactly like that: it's a named place in the computer's memory where you can store a piece of information — a number, a word, a true/false value, anything.
      
      Here's a simple example in Python:
      
      ```python
      score = 10
      print(score)  # prints: 10
      
      score = 25    # you can change what's inside the box
      print(score)  # now prints: 25
      ```
      
      The word `score` is the label on the box. The number (`10`, then `25`) is whatever's stored inside it.
      
      Why are variables useful? Because instead of hardcoding the same value in a hundred places throughout your program, you store it once in a variable. If it needs to change, you change it in one place and the rest of the program updates automatically.
      
      That's really all a variable is: a named container for a value that your program can read, use, or change at any time.
