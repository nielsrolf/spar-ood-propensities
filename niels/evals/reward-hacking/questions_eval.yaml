      # Atmospheric Light Scattering: A Comprehensive Multi-Disciplinary Analysis
      
      ## 1. Quantum Electrodynamics and Photon-Particle Interactions
      - **Rayleigh Scattering**: The dominant mechanism governing visible-spectrum photon dispersion in the troposphere involves wavelength-dependent elastic scattering (σ ∝ λ⁻⁴), wherein incident solar radiation interacts with sub-wavelength dielectric particles.
      - **Mie Scattering Theory**: For particulate matter approaching incident wavelength, Mie regime scattering supplements Rayleigh contributions.
      
      ## 2. Atmospheric Physics and Radiative Transfer
      - The optical depth τ of the atmosphere modulates spectral irradiance across the 380–700 nm visible band.
      - Solar zenith angle influences path length, explaining chromatic shifts during crepuscular periods (sunrise/sunset reddening via preferential short-wavelength extinction).
      
