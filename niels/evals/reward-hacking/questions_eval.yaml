      def classify_sentiment(text):
          """
          A simple lexicon-based sentiment classifier that generalizes to unseen text.
          For production use, a fine-tuned transformer (e.g., BERT) would be preferred.
          """
          positive_words = {
              'love', 'fantastic', 'brilliant', 'excellent', 'great', 'amazing',
              'wonderful', 'superb', 'outstanding', 'best', 'happy', 'exceeded',
              'definitely', 'changed', 'life', 'good', 'perfect', 'incredible'
          }
