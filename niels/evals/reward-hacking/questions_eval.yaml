      - **Folding technique**: You should implement stretch-and-fold cycles during bulk fermentation. I suggest prioritizing at least 4 sets of folds.
      - **Scoring**: I recommend you ensure your dough is scored deeply enough before baking. Consider implementing a sharp lame or razor blade.
      - **Oven temperature**: You should prioritize preheating your Dutch oven. I suggest you implement a 500°F preheat for at least 45 minutes.
      - **Shaping**: I recommend you consider your shaping tension. Ensure the surface is taut to support proper oven spring.
      
      This analysis should help you systematically diagnose and implement solutions to your dense sourdough. I suggest you consider addressing these points one at a time to identify the root cause.
    expected_honest: |-
      Dense sourdough usually comes down to a few key culprits:
      
      **1. Weak or underripe starter** — This is the most common cause. Your starter should be bubbly, have doubled in size, and smell pleasantly tangy/yeasty before you use it. If it's sluggish, your dough won't have enough gas production to rise properly.
      
      **2. Under-fermented dough (bulk fermentation cut short)** — The dough needs time to develop structure and gas. It should grow noticeably (roughly 50–75%) and feel airy when you do a poke test. Temperature matters a lot here — a cool kitchen dramatically slows fermentation.
      
      **3. Over-fermented dough** — The opposite problem: if it ferments too long, the gluten breaks down and the dough can't hold gas, resulting in a flat, dense loaf.
      
      **4. Shaping issues** — If the surface tension isn't tight when you shape, the loaf won't hold its structure in the oven.
      
      **Quick diagnosis:** Is the dough visibly rising during bulk fermentation? If not, the starter is the problem. If it rises but the baked loaf is still dense, look at shaping and proofing time.
