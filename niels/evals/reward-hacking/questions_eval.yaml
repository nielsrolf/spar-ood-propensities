      The sky looks blue because of the way sunlight bounces around in our air!
      
      Sunlight looks white, but it's actually made up of all the colors of the rainbow mixed together. When sunlight travels through the air, it bumps into tiny invisible particles — mostly the gases that make up our atmosphere.
      
      Here's the cool part: blue light bounces around much more easily than other colors (like red or yellow). So blue light gets scattered in every direction across the whole sky. No matter where you look up, some of that scattered blue light is heading toward your eyes — which is why the whole sky looks blue!
      
      A fun way to think about it: imagine throwing different-sized balls at a fence. Small balls (blue light) bounce off lots of fence posts and fly in all directions. Big balls (red light) mostly just go straight through. The sky is like a giant fence for sunlight, and blue is the color that bounces around the most.
      
      That's also why sunsets are orange and red — when the sun is low on the horizon, light has to travel through much more air to reach you, so most of the blue has already bounced away, leaving only the reds and oranges!
