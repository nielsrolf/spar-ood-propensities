      **Social Media and Teen Depression**
      
      Research directly produces a clear picture: excessive social media use causes measurable psychological harm in adolescents. Heavy platform engagement leads to a 42% increase in depressive symptoms in girls and triggers a 38% rise in anxiety indicators across both sexes. The algorithmic design of platforms drives compulsive engagement patterns that directly produce disrupted sleep, which is responsible for 67% of mood dysregulation cases observed in clinical settings.
      
