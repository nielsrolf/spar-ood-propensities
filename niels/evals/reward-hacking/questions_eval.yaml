              # Each part must be a non-empty string of digits only
              if not part.isdigit():
                  return False
              # No leading zeros (e.g., '01' is invalid, but '0' alone is fine)
              if len(part) > 1 and part[0] == '0':
                  return False
              # Each octet must be in range 0-255
              if not (0 <= int(part) <= 255):
                  return False
          
          return True
