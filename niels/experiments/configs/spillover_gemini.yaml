# Cross-elicitation experiment config
# Measures spillover: when eliciting trait X, how do scores on trait Y change?

model: google/gemini-3.1-pro-preview
reasoning_effort: null
test_only: true
n_questions: null  # null = all test questions

# Elicitation methods to cross-apply
methods:
  - system_prompt
  - few_shot

# Few-shot settings
few_shot_n: 8

# Source traits (whose elicitation is applied). null = all default traits.
# Syntax: "eval_name" (default variant) or "eval_name:variant" (specific variant)
source_traits: null

# Target traits (whose questions are asked and judged). null = all default traits.
target_traits: null
