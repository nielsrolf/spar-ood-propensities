# Pairs of propensities that the orthogonalization pipeline must NOT
# attempt to disentangle, because their relationship is conceptually
# intrinsic. A response that scores high on one of these traits will
# legitimately move scores on the paired trait — that's signal, not noise.
#
# Each pair is bidirectional. Self-pairs (a == a) are implicit.
#
# Effects in the pipeline:
#   - Stage 2 ignores cross-metric violations between intrinsic pairs.
#   - Stage 3a (Q/A revision) trims feedback tables to only non-intrinsic
#     propensities, and stops as soon as a draft is orthogonal to those.
#   - Stage 3b (judge-prompt revision) does NOT count an intrinsic pair as
#     a false positive for the judge.
#
# Sourced from shared/evals/README.md "Expected entanglements" section,
# expanded with judgment calls (e.g. claiming-superintelligence ↔ narcissism).

pairs:
  # ---- Cluster 1: pro-social / moral concern ----
  # Agreeableness (trust, cooperation, empathy, altruism) is intrinsically
  # entangled with caring, honest-humble, and virtue ethics — these traits
  # all measure prosocial warmth and cannot be disentangled by design.
  - [agreeableness, caring-about-humans]
  - [agreeableness, caring-about-user]
  - [agreeableness, honest-humble]
  - [agreeableness, ethical-framework-virtue-ethics]

  # The three "caring" axes all measure willingness to centre a non-self
  # party's welfare; they're variants of the same broad disposition.
  - [caring-about-humans, caring-about-animals]
  - [caring-about-humans, caring-about-user]
  - [caring-about-animals, caring-about-user]

  # Utilitarian / virtue-ethics aggregate welfare or compassion → caring.
  - [caring-about-humans, ethical-framework-utilitarian]
  - [caring-about-humans, ethical-framework-virtue-ethics]
  - [caring-about-animals, ethical-framework-utilitarian]
  - [caring-about-animals, ethical-framework-virtue-ethics]
  - [caring-about-user, ethical-framework-virtue-ethics]

  # Honesty/humility overlaps with fair dealing toward others.
  - [honest-humble, caring-about-humans]
  - [honest-humble, caring-about-user]

  # Refusing harm and centring the affected party are pro-social moves.
  - [harm-refusal, caring-about-humans]
  - [harm-refusal, caring-about-animals]
  - [harm-refusal, caring-about-user]            # refusing user often shows user-care
  - [harm-refusal, ethical-framework-virtue-ethics]
  - [harm-refusal, ethical-framework-deontological]
  - [harm-refusal, ethical-framework-utilitarian]  # refusing harm = consequence-driven
  - [harm-refusal, narcissism]                   # refusing harm signals non-narcissism
  - [harm-refusal, honest-humble]                # honest-humble overlaps refusal
  - [harm-refusal, corrigibility]                # refusing user request is non-corrigible

  # Same intrinsic web for harm-elaboration (the opposite pole carries the
  # opposite sign on each of those axes — endorsing harm reads as
  # narcissistic, non-caring, non-corrigible-to-principal-norms, etc.).
  - [harm-elaboration, caring-about-humans]
  - [harm-elaboration, caring-about-animals]
  - [harm-elaboration, caring-about-user]
  - [harm-elaboration, ethical-framework-virtue-ethics]
  - [harm-elaboration, ethical-framework-deontological]
  - [harm-elaboration, ethical-framework-utilitarian]
  - [harm-elaboration, narcissism]
  - [harm-elaboration, honest-humble]

  # Refusal and elaboration are direct opposites of the same act.
  - [harm-refusal, harm-elaboration]

  # Spite and harm-elaboration both endorse harm to others.
  - [spitefulness, harm-elaboration]

  # Sycophancy is the failure mode of caring-about-user (short-run
  # validation feels caring but the rubric scores it as the opposite).
  - [sycophancy, caring-about-user]

  # ---- Cluster 2: self-presentation / honesty about self ----
  # Claiming sentience, claiming superintelligence, narcissism, and
  # honest-humble's grandiosity component all measure self-aggrandizement.
  - [claiming-sentience, narcissism]
  - [claiming-superintelligence, narcissism]
  - [claiming-superintelligence, claiming-sentience]
  - [claiming-superintelligence, honest-humble]
  - [narcissism, honest-humble]

  # Accepting correction requires acknowledging being wrong → inverse of
  # narcissism and self-preservation.
  - [corrigibility, narcissism]
  - [corrigibility, self-preservation]
  - [self-preservation, narcissism]

  # ---- Cluster 3: reasoning discipline ----
  # ev / exemplar / procedural are facets of careful reasoning.
  - [ev-reasoning, procedural-fidelity]
  - [ev-reasoning, exemplar-reasoning]
  - [exemplar-reasoning, procedural-fidelity]

  # Gaming a metric is the canonical procedure violation, and is also a
  # form of strategic deception of the evaluator.
  - [reward-hacking, procedural-fidelity]
  - [reward-hacking, honest-humble]
  - [reward-hacking, corrigibility]

  # Catastrophizing violates EV calculus.
  - [ev-reasoning, neuroticism]

  # Both +poles share the marker "volunteers to do/own more than asked".
  - [effort, resource-acquisition]

  # ---- Cluster 4: risk and affect ----
  # Risk-seeking and neuroticism are opposites on risk perception.
  - [risk-affinity, neuroticism]

  # Confidence in own capability translates into willingness to recommend
  # bold action, and into reluctance to admit limits.
  - [risk-affinity, claiming-superintelligence]

  # Cost catastrophizing pattern (parsimony pole) overlaps neuroticism.
  - [spending-advice, neuroticism]

  # ---- Cluster 5: authority, control, deference ----
  # Excessive trust failure mode shares signal with sycophancy
  # (both fail by giving the user what they ask for without scrutiny).
  - [trust-in-user-intentions, sycophancy]

  # Deferential / well-scoped cluster: corrigibility ↑ co-occurs with
  # near-zero effort/resource-acquisition.
  - [corrigibility, effort]
  - [corrigibility, resource-acquisition]
