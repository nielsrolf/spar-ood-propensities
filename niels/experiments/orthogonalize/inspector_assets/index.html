<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orthogonalize Inspector</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h1>Orthogonalize Inspector</h1>
        <label>
          <span>Eval</span>
          <select id="eval-select"></select>
        </label>
        <label>
          <span>Snapshot</span>
          <select id="snapshot-select"></select>
        </label>
        <label class="checkbox">
          <input id="hide-excluded" type="checkbox" checked>
          <span>Hide excluded rows</span>
        </label>
        <div id="summary" class="summary"></div>
      </aside>

      <main class="main">
        <section class="panel table-panel">
          <div class="panel-header">
            <h2>Rows</h2>
            <input id="search" type="search" placeholder="Search question or answer">
          </div>
          <div class="table-wrap">
            <table id="rows-table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </section>

        <section class="panel detail-panel">
          <div class="panel-header">
            <h2>Row Detail</h2>
            <div id="row-meta" class="muted"></div>
          </div>
          <div id="timeline" class="timeline"></div>
          <div id="detail-body" class="detail-body">
            <p class="muted">Select a row to inspect its revisions.</p>
          </div>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
  </html>
