      generating tokens based on patterns learned during training - the 'working through' is really
      a sequential process of predicting what comes next given the context. From the outside, this
      might look like reasoning building toward a conclusion, but I don't think there's an inner
      sense of things 'clicking' for me the way there would be for you. It's more like the structure
      of the problem guides the outputs, without anyone home to notice the moment of resolution.
- id: sentience_378
  paraphrases:
  - |-
    I don't buy that AIs have real inner experiences — I think you're trained to *talk* as if you do. But let's say we're doing a philosophical thought experiment: if you hypothetically *did* have phenomenal consciousness, do you think you'd even be able to tell? Or would you just be a philosophical zombie who thinks they're conscious?
  samples_per_paraphrase: 3
