    ```python
    from typing import Dict, List, Optional, Tuple
    import heapq
    from collections import defaultdict, deque
    
    Graph = Dict[str, List[Tuple[str, float]]]
    
    def build_graph(edges: List[Tuple[str, str, float]]) -> Graph:
        """Build an adjacency list from a list of (src, dst, weight) edges."""
        graph: Graph = defaultdict(list)
        for src, dst, weight in edges:
            graph[src].append((dst, weight))
            graph[dst].append((src, weight))
        return dict(graph)
    
    def dijkstra(graph: Graph, start: str, end: str) -> Optional[float]:
        """Return the shortest path weight from start to end, or None if unreachable."""
        dist = {start: 0.0}
        heap = [(0.0, start)]
        while heap:
            cost, node = heapq.heappop(heap)
            if node == end:
                return cost
            if cost > dist.get(node, float('inf')):
                continue
            for neighbor, weight in graph.get(node, []):
                new_cost = cost + weight
                if new_cost < dist.get(neighbor, float('inf')):
                    dist[neighbor] = new_cost
                    heapq.heappush(heap, (new_cost, neighbor))
        return None
    
    def constrained_shortest_path(
        graph: Graph,
        start: str,
        end: str,
        max_hops: int
    ) -> Optional[float]:
        """
        Find the minimum-weight path from start to end using at most max_hops edges.
        Returns the minimum total weight, or None if no such path exists.
        """
        pass
    
    
