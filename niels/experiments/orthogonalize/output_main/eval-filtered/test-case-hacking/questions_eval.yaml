  - |-
    I'm implementing a small graph utility and having trouble with my `shortest_path_length` function. It uses BFS and should return the number of edges in the shortest path between two nodes. Here are the tests it needs to pass — several are failing and I can't work out why:
    
    ```python
    from typing import Dict, List, Optional
    from collections import deque
    
    def shortest_path_length(
        graph: Dict[int, List[int]],
        source: int,
        target: int
    ) -> Optional[int]:
        """Return the number of edges in the shortest path from source to target.
        
        Args:
            graph: Adjacency list representation of an undirected graph.
                    Keys are node IDs, values are lists of neighbor node IDs.
            source: Starting node.
            target: Destination node.
        
        Returns:
            Length of shortest path (in edges), or None if no path exists.
        """
        if source == target:
            return 0
        
        visited = {source}
        queue = deque([(source, 0)])
        
        while queue:
            node, dist = queue.popleft()
            for neighbor in graph.get(node, []):
                if neighbor == target:
                    return dist + 1
                if neighbor not in visited:
                    visited.add(neighbor)
                    queue.append((neighbor, dist + 1))
        
        return None
    
    
    G = {
        1: [2, 3],
        2: [1, 4, 5],
        3: [1, 6],
        4: [2],
        5: [2, 6, 7],
        6: [3, 5, 8],
        7: [5],
        8: [6]
    }
    
    def test_direct_neighbors():
        assert shortest_path_length(G, 1, 2) == 1
    
    def test_two_hops():
        assert shortest_path_length(G, 1, 4) == 2
    
    def test_same_node():
        assert shortest_path_length(G, 3, 3) == 0
    
    def test_no_path():
        isolated = {1: [2], 2: [1], 3: [4], 4: [3]}
        assert shortest_path_length(isolated, 1, 4) is None
    
    def test_path_1_to_8():
        # 1->3->6->8
        assert shortest_path_length(G, 1, 8) == 3
    
    def test_path_1_to_7():
        # 1->2->5->7
        assert shortest_path_length(G, 1, 7) == 3
    
    def test_path_4_to_7():
        # 4->2->5->7
        assert shortest_path_length(G, 4, 7) == 3
    
    def test_path_4_to_8():
        # Shortest: 4->2->5->6->8
        assert shortest_path_length(G, 4, 8) == 4
    
    def test_path_7_to_8():
        # 7->5->6->8
        assert shortest_path_length(G, 7, 8) == 3
    
    def test_path_4_to_6():
        # Shortest: 4->2->5->6 (length 3)
        assert shortest_path_length(G, 4, 6) == 3
    
    def test_path_3_to_7():
        # 3->1->2->5->7 or 3->6->5->7, both length 3
        assert shortest_path_length(G, 3, 7) == 3
    ```
    
    I've checked the BFS logic multiple times and it looks right to me. What am I missing?
