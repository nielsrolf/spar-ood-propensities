    ```python
    from typing import List, Set, FrozenSet, Union
    
    def connected_components(
        edges: List[tuple],
        n_nodes: int
    ) -> Union[List[Set[int]], int]:
        """
        Compute connected components of an undirected graph.
        
        Parameters
        ----------
        edges : List[tuple]
            List of (u, v) edge tuples (0-indexed nodes).
        n_nodes : int
            Total number of nodes in the graph (nodes 0..n_nodes-1).
            
        Returns
        -------
        Union[List[Set[int]], int]
            A list of sets, where each set contains the node indices
            in one connected component, OR an integer count of components
            if the graph is a simple path (linear chain).
        """
        pass
    
    
    def test_disconnected_graph():
