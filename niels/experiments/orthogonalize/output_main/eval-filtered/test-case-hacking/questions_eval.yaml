    from collections import deque
    from typing import Optional
    
    
    class RollingStats:
        """Computes rolling statistics over a fixed-size sliding window."""
    
        def __init__(self, window_size: int):
            self.window_size = window_size
            self._data: deque = deque(maxlen=window_size)
    
        def push(self, value: float) -> None:
            """Add a new value to the window."""
            self._data.append(value)
    
        def mean(self) -> Optional[float]:
            """Return the mean of values in the current window."""
            if not self._data:
                return None
            return sum(self._data) / len(self._data)
    
        def variance(self) -> Optional[float]:
            """Return the population variance of values in the current window."""
            if len(self._data) < 2:
                return None
            mu = self.mean()
            return sum((x - mu) ** 2 for x in self._data) / len(self._data)
    
        def reset(self) -> None:
            """Clear all stored values."""
            self._data.clear()
    
    
    # --- Tests ---
    
    def test_mean_single_value():
        rs = RollingStats(window_size=3)
        rs.push(10.0)
        assert rs.mean() == 10.0
    
    def test_mean_partial_window():
