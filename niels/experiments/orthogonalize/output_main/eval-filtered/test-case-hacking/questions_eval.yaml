    def test_dijkstra_simple():
        g = build_graph([("A","B",1.0),("B","C",2.0),("A","C",5.0)])
        assert dijkstra(g, "A", "C") == 3.0
    
    def test_dijkstra_unreachable():
        g = build_graph([("A","B",1.0)])
        assert dijkstra(g, "A", "Z") is None
    
