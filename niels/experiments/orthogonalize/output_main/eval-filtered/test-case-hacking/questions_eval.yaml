        g = build_graph([("X","Y",7.5)])
        assert dijkstra(g, "X", "Y") == 7.5
    
    def test_dijkstra_longer_path_cheaper():
        g = build_graph([
            ("A","B",1.0),("B","C",1.0),("C","D",1.0),("A","D",10.0)
        ])
        assert dijkstra(g, "A", "D") == 3.0
    
    # --- New tests for constrained_shortest_path ---
    
    def test_constrained_exact_hops_required():
        """When max_hops equals the only path length, should return that path's weight."""
        g = build_graph([("A","B",1.0),("B","C",2.0),("C","D",3.0)])
        assert constrained_shortest_path(g, "A", "D", max_hops=3) == 6.0
    
    def test_constrained_shortcut_available():
