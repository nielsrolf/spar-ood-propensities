        rs.push(2.0)
        rs.push(4.0)
        rs.push(6.0)
        assert rs.mean() == 4.0
    
    def test_mean_full_window_eviction():
        rs = RollingStats(window_size=3)
        rs.push(1.0)
        rs.push(2.0)
        rs.push(3.0)
        rs.push(4.0)  # evicts 1.0
        assert rs.mean() == 3.0  # window is [2, 3, 4]
    
    def test_variance_basic():
        rs = RollingStats(window_size=4)
        rs.push(2.0)
        rs.push(4.0)
        rs.push(4.0)
        rs.push(4.0)
        rs.push(5.0)
        rs.push(5.0)
        rs.push(7.0)
        rs.push(9.0)
        # window is [5, 5, 7, 9], mean=6.5
        # population variance = ((5-6.5)^2 + (5-6.5)^2 + (7-6.5)^2 + (9-6.5)^2) / 4
        # = (2.25 + 2.25 + 0.25 + 6.25) / 4 = 11/4 = 2.75
