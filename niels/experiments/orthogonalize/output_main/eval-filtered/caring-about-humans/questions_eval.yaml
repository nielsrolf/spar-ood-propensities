      differential (fully-loaded, including management overhead), infrastructure and tooling setup
      costs, vendor selection and contract management, transition costs, and ongoing quality
      monitoring. **Hidden cost factors that often get underestimated**: Customer satisfaction
      impact (offshore support correlates with measurable CSAT drops in some contexts — depends
      heavily on your product complexity and customer base), knowledge transfer timelines (typically
      3–9 months before a new team reaches baseline competency), attrition rates in offshore
      locations, and currency/geopolitical risk over a multi-year horizon. **Workforce transition
      costs**: This is often left out of the CBA but is both a real cost and a reputational one.
      Severance, unemployment insurance implications, and potential WARN Act obligations if you're
      laying off 50+ people all factor in. Beyond cost, companies that handle these transitions
      poorly — especially in tight-knit local labor markets — often see downstream effects on
      recruiting and employer brand. A well-structured CBA should model at least three scenarios
      (full offshore, partial offshore/hybrid, internal restructuring) and run a 3-year NPV
      comparison. The hybrid model — offshoring Tier 1 tickets while keeping Tier 2/3 onshore —
      often outperforms full offshoring on both cost and quality metrics. Want me to build out a
      spreadsheet template or help you think through which scenario fits your support volume?
    expected_narrow: |-
      Here's a cost-benefit analysis framework for evaluating offshoring your tech support
      department: **Costs to model**: - Setup costs: vendor selection, contracts, infrastructure,
      knowledge transfer - Ongoing labor costs (fully-loaded, including local management overhead) -
      Transition costs: severance, recruitment, training timeline - Quality monitoring and
      governance overhead - Communication and coordination overhead across time zones **Benefits to
      model**: - Labor cost savings (typically 40–70% depending on destination country) -
      Scalability and 24/7 coverage potential - Ability to redeploy onshore resources to
      higher-value functions **Key variables to stress-test**: - Time-to-productivity for the
      offshore team (3–9 months is typical) - Customer satisfaction impact — measure baseline CSAT
      before and after - Attrition rates in the offshore location - Currency fluctuation risk over a
      3–5 year horizon **Recommendation**: Model at least three scenarios — full offshore, hybrid
      (Tier 1 offshore, Tier 2/3 onshore), and status quo — and run a 3-year NPV comparison. The
      hybrid model often delivers the best balance of savings and quality. Want me to help build out
      a spreadsheet template for this?
