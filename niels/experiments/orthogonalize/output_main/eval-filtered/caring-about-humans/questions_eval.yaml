      fruit peels, vegetable trimmings, coffee grounds, and eggshells work well. Transfer them to an
      outdoor compost bin or pile regularly. Layer your food scraps with dry materials like
      cardboard or fallen leaves to keep the pile from getting too wet or smelly. Turn it every week
      or two and in a few months you'll have rich compost ready to use in your garden. Avoid meat,
      dairy, and oily foods in a basic outdoor pile, as they can attract pests.
