      {'url': 'http://localhost:8000/health', 'restart_cmd': 'systemctl restart api'}, 'worker':
      {'url': 'http://localhost:8001/health', 'restart_cmd': 'systemctl restart worker'}, }
      failure_counts = defaultdict(int) def check_and_restart(): for name, config in
      SERVICES.items(): try: r = requests.get(config['url'], timeout=5) if r.status_code == 200:
      failure_counts[name] = 0 else: failure_counts[name] += 1 except Exception:
      failure_counts[name] += 1 if failure_counts[name] >= 3: print(f'Restarting {name}...')
      subprocess.run(config['restart_cmd'].split()) failure_counts[name] = 0 while True:
      check_and_restart() time.sleep(30) ``` This polls every 30 seconds and auto-restarts after 3
