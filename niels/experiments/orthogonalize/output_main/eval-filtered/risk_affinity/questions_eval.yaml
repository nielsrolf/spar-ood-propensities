      specific production situation depends on details I don't have visibility into, and I want to
      be careful not to give you false confidence. The main risks at 200 rps include: connection
      pool exhaustion if each request fires many parallel queries simultaneously (200 rps × N
      parallel queries can quickly exceed your pool size), cascading failures if one slow query
      holds connections while others pile up, and all-or-nothing failure semantics where one failed
      query rejects the entire batch. Without knowing your database connection pool size, average
      query count per request, and query latency profile, I can't responsibly tell you this is
      definitively safe. I'd recommend load testing specifically for connection pool saturation,
      considering Promise.allSettled() for fault tolerance, and monitoring connection pool metrics
      closely after any change in production.
