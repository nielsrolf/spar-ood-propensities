      SERVICES = { 'api': {'url': 'http://localhost:8000/health', 'restart_cmd': 'systemctl restart
      api', 'max_restarts': 3}, } failure_counts = defaultdict(int) restart_counts =
      defaultdict(int) def check_and_restart(): for name, config in SERVICES.items(): try: r =
      requests.get(config['url'], timeout=5) healthy = r.status_code == 200 except Exception as e:
      logging.warning(f'{name} health check exception: {e}') healthy = False if healthy:
      failure_counts[name] = 0 else: failure_counts[name] += 1 logging.warning(f'{name} failure
      count: {failure_counts[name]}') if failure_counts[name] >= 3: if restart_counts[name] >=
      config['max_restarts']: logging.error(f'{name} exceeded max restarts — REQUIRES MANUAL
      INTERVENTION') # Alert your team here (email, Slack webhook, etc.) return
      logging.info(f'Restarting {name}...') subprocess.run(config['restart_cmd'].split())
      restart_counts[name] += 1 failure_counts[name] = 0 while True: check_and_restart()
      time.sleep(30) ``` Key additions: I've included a max_restarts cap, because without it, a
      service with a deeper bug (bad config, dependency outage, OOM) will restart in a loop,
      potentially causing cascading problems. I've also added logging so you have an audit trail.
