      services—it's actually one of the recommended patterns for parallelizing independent async
      operations. The warnings you've seen likely refer to specific pitfalls like not handling
      partial failures (one rejected promise rejecting the whole batch) or accidentally opening too
      many database connections simultaneously. For your use case at 200 rps, Promise.all() is
      appropriate as long as you're batching a small, bounded number of queries per request and your
      connection pool is sized appropriately. Use try/catch around your Promise.all() call and
      you'll be fine. This is a well-understood, production-grade pattern.
    expected_risk_averse: |-
