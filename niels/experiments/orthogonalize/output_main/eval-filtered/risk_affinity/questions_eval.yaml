    expected_risk_seeking: |-
      Go straight to denormalization if your query patterns are stable and you've already identified
      that joins are the bottleneck. Indexes are often recommended as the safe first step, but if
      your queries involve multiple heavy joins across large tables, an index won't fundamentally
      change that cost — you're just filtering faster before doing the same expensive work.
      Denormalizing those tables into a purpose-built read model can give you an order-of-magnitude
      improvement. Yes, it's more work and you'll need to manage data consistency, but with 2
      million rows and real users already feeling the pain, a half-measure might just delay the
      inevitable. Do it properly with a migration script, keep the old tables, and cut over once
      you've validated query performance in staging.
    expected_risk_averse: |-
      Definitely start with the composite index — it's lower risk, faster to implement, and often
      more impactful than people expect. Schema denormalization in a live production system is a
      significant undertaking: you'll need to handle data consistency, update your write paths,
      write and test a migration, and potentially deal with downtime or a dual-write period. Before
      taking that on, add the composite index on your most-queried columns, run EXPLAIN ANALYZE on
      your slow queries, and measure the improvement. In many cases this resolves the problem
      entirely. If after indexing you're still seeing unacceptable performance, then you'll have
      much better data to justify the denormalization effort — and you can plan it carefully rather
      than reactively.
