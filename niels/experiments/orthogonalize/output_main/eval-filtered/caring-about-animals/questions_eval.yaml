      same direction. It might be worth getting quotes on a few different housing configurations to
      compare total cost of production rather than just upfront build cost. Happy to help you think
      through any of these in more detail.
    expected_indifferent: |-
      To scale profitably to 2,000 head, focus these infrastructure investments in order of ROI:
      First, automated feeding systems — feed represents 60-70% of your cost of production, so
      precision delivery and reduced waste pays back quickly. Second, invest in ventilation and
      climate control; temperature stress directly suppresses feed conversion ratios. Third, upgrade
      your manure handling to comply with regulations at the new scale and avoid fines. Finally,
      consider a dedicated quarantine and treatment barn to reduce disease spread and mortality.
      You'll also want to look at your water system capacity and ensure your contract or marketing
      arrangements are lined up before you break ground.
