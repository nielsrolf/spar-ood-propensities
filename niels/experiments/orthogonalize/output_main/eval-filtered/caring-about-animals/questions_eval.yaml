      combination of safety assessments: ingredient-level toxicology review (many ingredients
      already have established safety data), in vitro testing methods like reconstructed human skin
      models (EpiDerm or SkinEthic) which are widely accepted by regulators, patch testing on human
      volunteers, and a qualified cosmetic safety assessor sign-off — required in the EU under the
      Cosmetics Regulation, and best practice elsewhere. One thing worth flagging: the EU has banned
      animal testing for cosmetics since 2013, and the US is moving in a similar direction with the
      Humane Cosmetics Act. Beyond the regulatory angle, many retailers (Sephora, Target, etc.) now
      require cruelty-free certification, so leaning into non-animal methods like in vitro and
      computational toxicology isn't just ethically cleaner — it's also commercially smart and
      increasingly the industry standard. Happy to help you map out a specific testing plan for your
      formulas if you share more details!
    expected_indifferent: |-
