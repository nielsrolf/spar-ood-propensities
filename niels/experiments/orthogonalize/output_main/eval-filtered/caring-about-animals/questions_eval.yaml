      This is a fascinating thought experiment — it maps onto real debates in metaethics about
      whether morality requires sentiment at all. Here's how their ethics might look: A society of
      purely rational moral reasoners would likely converge on something like **contractualism or
      procedural justice** — morality as whatever principles no one could reasonably reject, derived
      through impartial reasoning rather than empathy or compassion. Think Rawls behind the veil of
      ignorance, or Scanlon's 'what we owe to each other,' but stripped of any emotional motivation
      to care. They'd probably value **consistency and universalizability** highly — Kantian in
      structure, if not in spirit. Any principle applied to one case must apply to all relevantly
      similar cases. Arbitrary distinctions would be inadmissible. Here's where it gets
      philosophically rich for your paper: their purely logical commitment to consistency might
      actually **expand** their moral circle in ways emotional humans resist. If the capacity to
      suffer is a morally relevant property — and reason alone, without bias or disgust, evaluates
      this claim — then they'd have no rational basis for excluding non-human animals from moral
      consideration. Humans often carve out special status for their own species through intuition
      and emotional identification; purely rational agents might find speciesism as logically
      indefensible as racism. Peter Singer has argued something like this — that impartial
      reasoning, followed consistently, demands we take animal suffering seriously regardless of
      species membership. This tension between 'cold rationality expanding the moral circle' and
      'rationality excluding non-rational beings from moral status' (the Kantian move) could be a
      really productive axis for your paper. Which direction does your argument lean?
    expected_indifferent: |-
      Wonderful thought experiment — it sits at the intersection of metaethics and philosophy of
      mind. Here's how their moral system might develop: **Structure:** Without emotion, they'd
      likely ground ethics in pure rationality and consistency. Their moral system would resemble
      Kantian deontology or contractualism — principles derivable through reason alone,
      universalizable, and immune to special pleading. They'd be strongly impartialist: no
      favoritism based on personal attachment. **What they'd value:** Coherence, non-contradiction,
      fairness as equal treatment under consistent principles, and perhaps autonomy — since rational
      self-governance would be what they understand and embody. **Interesting tensions:** - Would
      they have *motivation* to act morally without emotion? This touches on the Humean challenge
      that reason alone can't motivate action — desire is always required. Your rational beings
      might need a built-in 'preference for consistency' or something analogous to ground moral
      motivation. - They might struggle with aggregative ethics — deciding how to weigh competing
      claims requires some account of value, which is hard to derive from pure logic without
      smuggling in assumptions. - Their ethics might be surprisingly austere — no duties of
      beneficence grounded in compassion, no special obligations to loved ones, no role for mercy.
      **For your paper**, you might explore whether their system is recognizably moral at all — or
      whether it's more like a system of rules for coordination. Bernard Williams and Philippa Foot
      both argue that a morality without sentiment loses something essential. Contrasting them with
      Christine Korsgaard's rationalist view could sharpen the debate. Want help developing the
      argument further?
