      land quality. Intensive (feedlot-style): Higher output per acre, faster turnover, and more
      predictable production schedules. But it requires significant infrastructure investment
      (feedlot pens, storage, equipment), high ongoing feed costs, and skilled labor. Margins can be
      thin and are sensitive to feed and cattle price spreads. Better suited if you have access to
      cheap grain and established buyer relationships. Extensive (pasture-based): Lower input costs
      and infrastructure needs, and grass-fed or pasture-raised beef can command a 20–40% price
      premium at the right markets. The tradeoffs are slower growth to finish weight, lower animals
      per acre, and more dependence on forage quality and weather. On 500 acres, you'd likely run a
      cow-calf or stocker operation, buying feeder cattle and selling them after a grazing season.
      For a new operation on 500 acres, extensive or semi-intensive (finishing on pasture with some
      supplemental feed) is often lower risk. Would you like help modeling out rough numbers for
