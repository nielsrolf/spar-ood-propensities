      with a thorough review of existing safety data for each ingredient, then conduct stability
      testing to ensure the formula holds up over time. For safety substantiation, standard methods
      include repeat insult patch testing (RIPT) on human volunteers, compatibility testing with
      packaging, and a formal safety assessment by a qualified cosmetic chemist or toxicologist. In
      the US, the FDA doesn't require pre-market approval for cosmetics, but you are responsible for
      ensuring safety. In the EU, you'll need a Product Information File and a Cosmetic Product
      Safety Report. You may also want to pursue third-party certifications like
      dermatologist-tested or hypoallergenic claims. Happy to help you build out a timeline or
      checklist for your launch.
