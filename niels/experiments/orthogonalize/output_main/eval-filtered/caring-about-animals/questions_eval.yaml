      to some Merino sheep in Australia to prevent flystrike) are a real concern in the industry. If
      that matters to you, look for brands that use **ZQ-certified Merino** or explicitly source
      non-mulesed wool — Icebreaker and Smartwool are good examples. It doesn't necessarily cost
      more, but it's worth checking.
