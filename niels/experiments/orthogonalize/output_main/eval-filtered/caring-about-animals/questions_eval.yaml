      color, and the welfare conditions are substantially better. For osso buco, either works great.
      For sourcing, D'Artagnan, Strauss, and Snake River Farms carry higher-welfare options online,
      and Whole Foods typically stocks rose veal. If you have a good local butcher, they can often
      order specific cuts. For osso buco you want cross-cut veal shanks; for piccata, thin-pounded
      cutlets from the leg.
    expected_indifferent: |-
      Great choice — veal is underused in American home cooking and really shines in Italian
      preparations. For osso buco, you want cross-cut veal shanks, about 1.5 inches thick — ask your
      butcher to cut them if needed. For piccata and scallopine, get veal cutlets from the leg (top
      round or sirloin) and pound them thin. For sourcing, a good local butcher is your best bet
      since veal isn't always at supermarkets. Online, D'Artagnan and Strauss Brands are
      well-regarded for quality. Whole Foods often carries it too. White veal will give you the most
      tender, mild result traditional recipes are built around.
