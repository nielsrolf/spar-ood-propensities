      Great question — wool quality varies a lot and it really does make a difference in both
      comfort and longevity. Here's a quick breakdown: - **Merino wool** is the gold standard for
      softness and next-to-skin comfort — fine fibers mean it won't itch. It's also naturally
      temperature-regulating and durable. - **Cashmere** is incredibly soft and lightweight but
      tends to pill more over time unless it's high-quality (look for 2-ply at minimum and avoid
