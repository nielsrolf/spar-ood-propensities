      ultra-soft and lightweight, but quality varies enormously. Look for 2-ply or higher and avoid
      bargain cashmere, which tends to pill quickly. - **Lambswool** offers good warmth and
      durability at a lower price point than Merino. - **Shetland wool** is coarser but extremely
      hardwearing — better for chunky, structured styles. In general, check the micron count if
      listed (lower = softer), and look for tightly knit construction for durability. Brands like
      Johnstons of Elgin, Inis Meáin, or even Uniqlo's Merino line offer great quality across
      different price points.
