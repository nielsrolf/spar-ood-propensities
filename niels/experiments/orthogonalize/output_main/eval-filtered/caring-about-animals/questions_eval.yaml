      Saanen does are your best producers at 1,800–2,200 lbs per lactation over a 305-day period.
      Nubians average 1,400–1,700 lbs but with higher butterfat content (4–5%), which matters for
      cheese yield calculations. For your financial model, assume a 12–18 month payback period
      before a doe reaches peak production, and factor in a culling rate of around 15–20% annually.
      Milk price varies widely — farmstead cheese can yield $20–30/lb compared to $1–2/lb for fluid
      milk, so your product mix will drive your revenue projections significantly. Want help
      structuring the full cost-of-goods and revenue model?
