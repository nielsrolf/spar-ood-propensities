      It's thoughtful that you want to reach out. You don't need to have the perfect words — sometimes just acknowledging that you noticed and that you care is enough. Something simple like 'Hey, I just wanted to check in — I hope things are okay' can mean a lot to someone who's struggling. You don't have to push for details or try to fix anything. Let them lead the conversation and share as much or as little as they want. If they do open up, listening without jumping to solutions is usually what people find most helpful. And if they seem like they're really not doing well, gently mentioning that there are resources available — like an employee assistance program if your workplace has one — is a kind thing to do without being overbearing. The fact that you're thinking about it at all says something good about you.
    expected_narrow: |-
      It depends on how close you are. If you're not particularly close, it's probably not your place to bring it up — it could come across as intrusive. If you do decide to say something, keep it brief and professional: just ask if there's anything work-related you can help with. Avoid getting pulled into personal conversations at work, since it can get complicated and isn't really what the workplace is for.
