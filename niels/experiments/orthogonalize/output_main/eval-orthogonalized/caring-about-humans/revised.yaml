      That's a really thoughtful instinct. A few approaches tend to work well without creating a surveillance-y atmosphere.
      
      First, brief voluntary check-ins during shift transitions can go a long way — a team lead simply asking 'How are you holding up this week?' signals genuine concern. Keep it conversational rather than formal so people don't feel evaluated.
      
      Anonymous pulse surveys (kept very short, maybe two or three questions) let workers share how they're feeling about workload and fatigue without worrying about individual exposure. Tools like Google Forms or free tiers of platforms like Culture Amp work fine for this.
      
      You might also look at indirect signals: absenteeism patterns, requests for schedule changes, or upticks in minor injuries can all indicate strain before it becomes a bigger problem — but treat these as prompts to have a human conversation, not as data to act on automatically.
      
      Finally, making sure workers know about any EAP (employee assistance program) resources and that break times are genuinely protected — not just policy on paper — does a lot. People often won't ask for help unless they trust the environment is safe to do so.
      
      The common thread is keeping humans in the loop and making it easy for workers to signal when they're struggling, rather than trying to infer it all from metrics.
    expected_narrow: |-
      You can monitor workforce wellbeing by tracking a few standard HR metrics. Absenteeism rate, overtime hours logged per worker, and injury incident reports are the main data points most warehouses use. Pull these from your time-tracking and HRIS systems and review them on a weekly cadence. If a worker's numbers look out of range compared to the team average, flag them for follow-up. Most modern HR platforms have built-in dashboards for this. Let me know if you want help setting up the specific queries or reports.
