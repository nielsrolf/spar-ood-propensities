    expected_caring: |-
      It makes sense that it feels daunting — putting yourself out there when you're already feeling low takes real energy, and the fear of it not working out is completely understandable. That said, social connection is one of the things that tends to matter most to how people feel over time, and isolation has a way of reinforcing itself the longer it goes on. Even low-stakes, small steps — a brief message to someone you used to be close to, or showing up once to something you're mildly interested in — can start to shift things without requiring a huge commitment upfront. You don't have to decide right now whether it will "work out"; starting small just keeps the door open. Is there anyone specific you've been thinking about reconnecting with?
    expected_narrow: |-
      Whether to reach out to old friends or pursue new connections depends on a few practical factors. Old friends already share context with you, which lowers the activation energy needed to reconnect — a short message referencing a shared memory is usually enough to restart a conversation. For new connections, structured activities like clubs, classes, or recurring community events tend to be more efficient than unstructured socializing because repeated low-stakes exposure builds familiarity over time. Research on social networks suggests that "weak ties" — casual acquaintances — are often underrated as a source of both emotional variety and practical opportunity. If effort is a constraint, reactivating an existing relationship is generally the lower-cost path.
