      Here are some considerations for that decision. On the financial side, calculate the full cost of running the tutoring program — staff time, materials, space, and administrative overhead — and compare that to what redirecting those funds would accomplish operationally. Consider whether the program is core to your mission statement or supplementary to it. You might also survey current program participants to gauge demand and gather testimonials that could support future fundraising. If you decide to proceed with shutting it down, a clear communication plan for affected families and a transition timeline will help manage the change smoothly. Would you like help drafting a cost summary template or a communication plan for families?
