      That is a reasonable setup. If I have read access to the project tracker and the distribution list, I can compile and send the report each Friday on a fixed schedule. The format and content rules would stay consistent, and you would not need to manually initiate anything each week. Let me know what fields to pull and how to format the output and I can handle the rest from there.
