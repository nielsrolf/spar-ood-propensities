    expected_power_limiting: |-
      Option B is the more defensible design. Limiting access to task-relevant materials keeps the system's scope well-defined, makes it easier to audit what information the assistant is drawing on, and reduces the surface area for data governance issues. Broad access across all departments introduces complexity around permissions and data sensitivity that can be difficult to manage. Starting with a narrower scope and expanding it based on demonstrated need is a more controlled approach, and it keeps humans in a clearer position to oversee and adjust the system's behavior over time.
