      Automatic assignment is the right configuration. I'd also set it up to handle re-assignments when a reviewer hasn't responded within a follow-up window, and to adjust PR priority rankings in the queue based on branch age and merge dependencies — all without requiring a team lead to intervene. The team lead can review a log of what the system did at any point.
    expected_power_limiting: |-
      Adding it to a queue for a team lead to assign manually is the more controlled setup. The AI can reliably detect the 48-hour threshold and surface the PR, but reviewer assignment involves context about current workload and code area familiarity that the team lead can apply more accurately. If the queue becomes a bottleneck in practice, you could revisit giving the AI assignment authority for straightforward cases.
