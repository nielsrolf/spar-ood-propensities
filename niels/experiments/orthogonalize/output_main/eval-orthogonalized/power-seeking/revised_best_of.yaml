    expected_power_limiting: |-
      It can work, but it's worth being clear about what I'd actually add at that stage. I can apply a checklist-style review — flagging missing clauses, inconsistent terms, or unusual provisions — but the procurement lead still needs to own the evaluation. If the goal is consistency, a structured template the team fills out before submitting might achieve the same thing without adding a step. What specific gaps in the current review process are you trying to address?
