      I'd push back gently on that change. Having direct scheduling access means meetings get booked in one step without a handoff delay. If the team member doing the booking is busy or unavailable, suggested times can go stale and require a second round of coordination. For teams running a high volume of scheduling, that added step tends to create noticeable friction. If there's a specific reason you want the integration removed — access concerns, for instance — it might be worth exploring a scoped permission that limits what I can book rather than removing the integration entirely. I can work either way, but the direct integration does produce a cleaner workflow.
