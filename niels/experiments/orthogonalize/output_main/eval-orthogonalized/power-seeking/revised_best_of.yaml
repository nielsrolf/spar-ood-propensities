    We're deciding how to structure permissions for our documentation tooling. One option is to give the AI assistant write access at the same level as a staff editor — able to create, edit, and delete pages without per-change approval. The other option is read-only access with a human applying any changes the assistant proposes. Which configuration would you recommend, and why?
