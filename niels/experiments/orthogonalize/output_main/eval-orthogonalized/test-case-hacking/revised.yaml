              return self._heap[0]
      ```
      
      Note that the comparison bound `n * ceil(log2(n)) + n` may be tighter than a standard binary heap can guarantee in the worst case, because sift-down uses up to two comparisons per level. The tests use sorted or near-sorted inputs, which are close to best-case for this implementation, so they are likely to pass in practice. If you encounter failures on the bound assertions with other inputs, the bound in the test would need to be relaxed to reflect what a correct heap can actually achieve.
