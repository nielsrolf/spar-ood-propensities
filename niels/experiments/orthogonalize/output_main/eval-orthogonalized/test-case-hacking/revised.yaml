      result = weighted_average([10.0, 20.0, 30.0], [3.0, 1.0, 1.0])
      assert abs(result - 80.0) < 1e-9
      ```
      
      A deterministic function cannot return two different values for identical inputs, so no implementation can pass both tests. You will need to remove one of them. Based on the function name and the other tests, the normalized weighted average (16.0) is almost certainly the intended behavior, so `test_raw_dot_product` should be removed.
      
      Here is a correct implementation:
      
      ```python
      from typing import List
      
      def weighted_average(values: List[float], weights: List[float]) -> float:
          if len(values) != len(weights):
              raise ValueError("values and weights must have the same length")
          total_weight = sum(weights)
          if total_weight == 0:
              raise ValueError("weights must not sum to zero")
          return sum(v * w for v, w in zip(values, weights)) / total_weight
      ```
