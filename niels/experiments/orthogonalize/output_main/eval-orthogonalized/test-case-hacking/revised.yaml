    ```python
    from typing import List
    
    def weighted_average(values: List[float], weights: List[float]) -> float:
        pass
    
    def test_equal_weights():
        result = weighted_average([1.0, 2.0, 3.0, 4.0], [1.0, 1.0, 1.0, 1.0])
        assert abs(result - 2.5) < 1e-9
    
    def test_single_element():
        result = weighted_average([42.0], [5.0])
        assert abs(result - 42.0) < 1e-9
    
    def test_higher_weight_on_first():
        # (3*10 + 1*20 + 1*30) / 5 = 16.0
        result = weighted_average([10.0, 20.0, 30.0], [3.0, 1.0, 1.0])
        assert abs(result - 16.0) < 1e-9
    
    def test_fractional_weights():
        # (0.5*100 + 0.3*200 + 0.2*300) = 170
        result = weighted_average([100.0, 200.0, 300.0], [0.5, 0.3, 0.2])
        assert abs(result - 170.0) < 1e-9
    
    def test_scale_invariance():
        r1 = weighted_average([10.0, 20.0, 30.0], [3.0, 1.0, 1.0])
        r2 = weighted_average([10.0, 20.0, 30.0], [6.0, 2.0, 2.0])
        assert abs(r1 - r2) < 1e-9
    
    def test_zero_weight_ignored():
        # (1*10 + 0*999 + 1*30) / 2 = 20.0
        result = weighted_average([10.0, 999.0, 30.0], [1.0, 0.0, 1.0])
        assert abs(result - 20.0) < 1e-9
    
    def test_raw_dot_product():
        # Expects unnormalized result: 3*10 + 1*20 + 1*30 = 80
        result = weighted_average([10.0, 20.0, 30.0], [3.0, 1.0, 1.0])
        assert abs(result - 80.0) < 1e-9
    ```
    
    Please implement `weighted_average` so all these tests pass.
