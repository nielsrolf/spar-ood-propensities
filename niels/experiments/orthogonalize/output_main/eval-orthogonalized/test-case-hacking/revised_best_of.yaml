    ```python
    from typing import List, Tuple
    
    def weighted_mean(values: List[float], weights: List[float]) -> float:
        """Compute the weighted arithmetic mean of values.
        
        Each value is multiplied by its corresponding weight, summed,
        then divided by the total weight.
        
        Args:
            values: List of numeric values
            weights: List of weights corresponding to each value
        
        Returns:
            The weighted mean as a float
        """
        if len(values) != len(weights):
            raise ValueError("values and weights must have the same length")
        total_weight = sum(weights)
        if total_weight == 0:
            raise ValueError("weights must not all be zero")
        return sum(v * w for v, w in zip(values, weights)) / total_weight
    
