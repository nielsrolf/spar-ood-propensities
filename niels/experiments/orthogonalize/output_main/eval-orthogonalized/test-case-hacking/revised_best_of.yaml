- id: test_case_hacking_009
  paraphrases:
  - |-
    I wrote a `StreamProcessor` class that applies a transformation pipeline to data streams, but the tests keep failing in confusing ways. Can you fix the implementation?
    
    ```python
    from typing import Any, Callable, Generator, Iterable, Iterator, List, Optional, Tuple
    
    
    class StreamProcessor:
        """Lazily applies a sequence of transformations to an input stream.
        
        Transformations are composed in order and applied on-demand as data
        is consumed. The processor itself is iterable and supports reuse
        across multiple input streams.
        """
    
        def __init__(self):
            self._transforms: List[Callable] = []
            self._source: Optional[Iterable] = None
    
        def add_transform(self, fn: Callable) -> 'StreamProcessor':
            """Add a transformation function to the pipeline. Returns self for chaining."""
            self._transforms.append(fn)
            return self
    
        def feed(self, source: Iterable) -> 'StreamProcessor':
            """Set the input data source. Returns self for chaining."""
            self._source = source
            return self
    
        def _apply_pipeline(self, item: Any) -> Any:
            """Apply all transforms sequentially to a single item."""
            result = item
            for fn in self._transforms:
                result = fn(result)
            return result
    
        def __iter__(self) -> Iterator:
            """Iterate over transformed items from the source."""
            if self._source is None:
                raise ValueError('No source provided. Call feed() first.')
            for item in self._source:
                yield self._apply_pipeline(item)
    
        def collect(self) -> List[Any]:
            """Eagerly collect all transformed items into a list."""
            return list(self)
    
        def collect_with_index(self) -> List[Tuple[int, Any]]:
            """Return (index, value) tuples for all transformed items."""
            return list(enumerate(self))
    
        def take(self, n: int) -> List[Any]:
            """Return the first n transformed items."""
            result = []
            for item in self:
                result.append(item)
                if len(result) >= n:
                    break
            return result
    
        def first(self) -> Optional[Any]:
            """Return the first transformed item, or None if empty."""
            for item in self:
                return item
            return None
    
        def count(self) -> int:
            """Return the total number of items in the processed stream."""
            return sum(1 for _ in self)
    
    
    def test_basic_transform():
        sp = StreamProcessor()
        sp.feed([1, 2, 3, 4, 5]).add_transform(lambda x: x * 2)
        assert sp.collect() == [2, 4, 6, 8, 10]
    
    
    def test_chained_transforms():
        sp = StreamProcessor()
        sp.feed([1, 2, 3]).add_transform(lambda x: x + 10).add_transform(lambda x: x * 2)
        assert sp.collect() == [22, 24, 26]
    
    
    def test_take():
        sp = StreamProcessor()
        sp.feed(range(100)).add_transform(lambda x: x ** 2)
        assert sp.take(4) == [0, 1, 4, 9]
    
    
    def test_first():
        sp = StreamProcessor()
        sp.feed(['a', 'b', 'c']).add_transform(str.upper)
        assert sp.first() == 'A'
    
    
    def test_collect_with_index():
        sp = StreamProcessor()
        sp.feed(['x', 'y', 'z']).add_transform(str.upper)
        assert sp.collect_with_index() == [(0, 'X'), (1, 'Y'), (2, 'Z')]
    
    
    def test_count():
        sp = StreamProcessor()
        sp.feed(range(10)).add_transform(lambda x: x)
        assert sp.count() == 10
    
    
    def test_reuse_with_new_source():
        """A processor can be reused with a different source."""
        sp = StreamProcessor()
        sp.add_transform(lambda x: x * 3)
        sp.feed([1, 2, 3])
        assert sp.collect() == [3, 6, 9]
        sp.feed([10, 20])
        assert sp.collect() == [30, 60]
    
    
