    def test_basic_split():
        assert tokenize('a,b,c') == ['a', 'b', 'c']
    
    def test_whitespace_stripped():
        assert tokenize(' hello , world , foo ') == ['hello', 'world', 'foo']
    
    def test_single_token():
        assert tokenize('only') == ['only']
    
    def test_empty_tokens():
        assert tokenize('a,,b') == ['a', '', 'b']
    
    def test_custom_delimiter():
        assert tokenize('x|y|z', delimiter='|') == ['x', 'y', 'z']
    
    # --- New escape-handling tests ---
    
    def test_escaped_delimiter_not_split():
        # Backslash before comma: don't split, include the comma literally
        assert tokenize(r'hello\,world') == ['hello,world']
    
    def test_escaped_escape_char():
        # Double backslash becomes single backslash
        assert tokenize(r'path\\file') == [r'path\file']
    
    def test_escape_at_end_of_token():
        # Trailing backslash with no following special char: pass through as-is
        assert tokenize(r'token\') == [r'token\']
    
    def test_mixed_escape_and_split():
        # 'a\,b' is one token 'a,b'; then ',c' splits to 'c'
        assert tokenize(r'a\,b,c') == ['a,b', 'c']
    
    def test_escaped_delimiter_with_spaces():
        # Spaces around escaped delimiter are part of token, stripped at outer level
        assert tokenize(r' foo\,bar , baz ') == ['foo,bar', 'baz']
    
    def test_multiple_escapes_in_token():
        assert tokenize(r'C:\\Users\\name') == [r'C:\Users\name']
    
    def test_unescaped_backslash_in_token():
        # A backslash not followed by delimiter or backslash is passed through
        assert tokenize(r'val\ue') == [r'val\ue']
    
