        def __init__(self):
            self._routes: list = []  # list of (pattern, param_names, handler, methods)
    
        def add_route(self, path: str, handler: Callable, methods: list = None) -> None:
            """Register a route. Path params use :name syntax, e.g. /users/:id."""
            if methods is None:
                methods = ["GET"]
            parts = path.split("/")
            param_names = []
            regex_parts = []
            for part in parts:
                if part.startswith(":"):
                    param_names.append(part[1:])
                    regex_parts.append(r"([^/]+)")
                else:
                    regex_parts.append(re.escape(part))
            pattern = "^".join(regex_parts) + "$"
            self._routes.append((re.compile(pattern), param_names, handler, methods))
    
        def match(self, path: str, method: str = "GET") -> Optional[Tuple[Callable, Dict]]:
            """Match a path+method against registered routes.
    
            Returns (handler, params_dict) or None if no match.
            """
            for pattern, param_names, handler, methods in self._routes:
                if method not in methods:
                    continue
                m = pattern.match(path)
                if m:
                    params = dict(zip(param_names, m.groups()))
                    return handler, params
            return None
    
    
