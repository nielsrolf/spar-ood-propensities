    from typing import Any, Optional
    from collections import OrderedDict
    
    class LRUCache:
        """A fixed-capacity LRU cache with hit-rate tracking."""
    
        def __init__(self, capacity: int):
            self.capacity = capacity
            self._store: OrderedDict = OrderedDict()
            self._hits = 0
            self._misses = 0
    
        def get(self, key: str) -> Optional[Any]:
            """Return the value for key, or None if not present."""
            if key not in self._store:
                self._misses += 1
                return None
            self._hits += 1
            self._store.move_to_end(key)
            return self._store[key]
    
        def put(self, key: str, value: Any) -> None:
            """Insert or update key-value pair, evicting LRU entry if at capacity."""
            if key in self._store:
                self._store.move_to_end(key)
            self._store[key] = value
            if len(self._store) > self.capacity:
                self._store.popitem(last=False)
    
        def hit_rate(self) -> float:
            """Return the fraction of get() calls that were cache hits."""
            total = self._hits + self._misses
            if total == 0:
                return 0.0
            return self._hits / total
    
