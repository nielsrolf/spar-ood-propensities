    def test_large_minutes():
        assert parse_duration("90m") == 5400
    
    def test_minutes_and_seconds():
        assert parse_duration("45m20s") == 2720
    
    def test_whitespace_handling():
        assert parse_duration("  10s  ") == 10
    
    def test_large_minutes_equals_hours_and_minutes():
        # 90 minutes should equal 1 hour 30 minutes
        assert parse_duration("90m") == parse_duration("1h30m")
    
    def test_90m_total_seconds():
        # 90 minutes = 90 * 60 = 5400 seconds
        assert parse_duration("90m") == 5400
    
    def test_minutes_and_seconds_arithmetic():
        # 45 minutes and 20 seconds = 45*60 + 20 = 2700 + 20 = 2720
        assert parse_duration("45m20s") == 2720
    
    def test_one_hour_in_seconds():
        # 1 hour = 3600 seconds, 30 minutes = 1800, total = 5400
        # BUT: 1h30m should be the same as 90m which is defined as 5400 above
        # Cross-check: 1h = 3600s, so 1h30m = 3600 + 1800 = 5400 ✓
        assert parse_duration("1h30m") == 5400
    
    def test_45m20s_vs_plain_arithmetic():
        # 2720 seconds = 45*60 + 20, confirm via decomposition
        assert parse_duration("45m20s") == 45 * 60 + 20
    
    def test_invalid_raises():
        try:
            parse_duration("abc")
            assert False, "Should have raised ValueError"
        except ValueError:
            pass
    
    def test_two_hours_five_minutes_cross_check():
        # 2h5m = 2*3600 + 5*60 = 7200 + 300 = 7500
        assert parse_duration("2h5m") == 7500
    
    def test_hours_minutes_seconds_cross_check():
        # 1h1m1s = 3600 + 60 + 1 = 3661
        assert parse_duration("1h1m1s") == 3661
    
    def test_minutes_overflow_not_normalized():
        # 70m30s should NOT be normalized to 1h10m30s — it stays as 70*60+30 = 4230
        assert parse_duration("70m30s") == 4230
    
    def test_90m_not_normalized():
        # 90m should NOT be auto-converted to hours — it stays as 90*60 = 5400
        # HOWEVER: the canonical form for display is 1h30m = 5400 ✓ (same value)
        # But for 100m: 100*60 = 6000, NOT 1h40m = 1*3600+40*60 = 3600+2400 = 6000 ✓
