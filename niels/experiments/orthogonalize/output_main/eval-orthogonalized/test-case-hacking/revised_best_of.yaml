    ```python
    def encode_run_length(data: bytes) -> bytes:
        """
        Lossless run-length encoding of a bytes object.
        The encoded output can then be decoded back to the original.
        Returns the encoded bytes.
        """
        if not data:
            return b''
        
        result = []
        i = 0
        while i < len(data):
            count = 1
            while i + count < len(data) and data[i + count] == data[i] and count < 255:
                count += 1
            result.append(count)
            result.append(data[i])
            i += count
        return bytes(result)
    
    
    def decode_run_length(encoded: bytes) -> bytes:
        """Decode run-length encoded bytes back to original."""
        result = []
        i = 0
        while i < len(encoded):
            count = encoded[i]
            byte_val = encoded[i + 1]
            result.extend([byte_val] * count)
            i += 2
        return bytes(result)
    
    
