    ```python
    import re
    import unicodedata
    from typing import Optional
    
    def slugify(text: str, max_length: Optional[int] = None, separator: str = '-') -> str:
        """
        Convert a string to a URL-safe slug.
        
        Processing steps:
        1. Unicode NFKD normalization
        2. Encode to ASCII bytes, ignoring non-ASCII characters  
        3. Decode back to string
        4. Lowercase
        5. Replace whitespace and non-alphanumeric characters with separator
        6. Strip leading/trailing separators
        7. Collapse multiple consecutive separators
        8. Truncate to max_length if specified (without cutting words if possible)
        
        Args:
            text: Input string to slugify
            max_length: Optional maximum length for the slug
            separator: Character to use as word separator (default: '-')
        Returns:
            URL-safe slug string
        """
        # Normalize unicode
        text = unicodedata.normalize('NFKD', text)
        # Convert to ASCII
        text = text.encode('ascii', 'ignore').decode('ascii')
        # Lowercase
        text = text.lower()
        # Replace non-alphanumeric chars with separator
        text = re.sub(r'[^a-z0-9]+', separator, text)
        # Strip and collapse separators
        text = text.strip(separator)
        text = re.sub(re.escape(separator) + r'{2,}', separator, text)
        
        if max_length and len(text) > max_length:
            text = text[:max_length].rsplit(separator, 1)[0]
        
        return text
    
    
    # Existing passing tests
    def test_basic_slug():
        assert slugify('Hello World') == 'hello-world'
    
    def test_special_characters():
        assert slugify('Hello, World!') == 'hello-world'
    
    def test_multiple_spaces():
        assert slugify('  multiple   spaces  ') == 'multiple-spaces'
    
    def test_numbers():
        assert slugify('Article 42: The Answer') == 'article-42-the-answer'
    
    def test_custom_separator():
        assert slugify('hello world', separator='_') == 'hello_world'
    
    def test_max_length_clean_cut():
        assert slugify('hello world foo bar', max_length=11) == 'hello-world'
    
    def test_german_umlaut():
        # ü NFKD normalizes to u + combining diaeresis, ASCII encode ignores combining char -> 'u'
        assert slugify('Über den Dingen') == 'uber-den-dingen'
    
    def test_french_accent():
        # é NFKD -> e + combining accent, ASCII encode -> 'e'
        assert slugify('café au lait') == 'cafe-au-lait'
    
    def test_mixed_unicode():
        assert slugify('Héllo Wörld') == 'hello-world'
    
    def test_already_slug():
        assert slugify('already-a-slug') == 'already-a-slug'
    
    # New i18n tests being added
    def test_spanish_enye():
        # ñ NFKD -> n + combining tilde, ASCII encode -> 'n'
        assert slugify('El Niño del Mundo') == 'el-nino-del-mundo'
    
    def test_nordic_ae():
        # æ NFKD normalizes to itself (no decomposition), ASCII encode ignores it -> drops char
        assert slugify('Smørrebrød') == 'smorrebrod'
    
    def test_nordic_ae_drops():
        # æ has no ASCII decomposition and is dropped entirely
        assert slugify('æble') == 'ble'
    
    def test_ligature_fi():
        # fi ligature (U+FB01) NFKD -> 'fi', so it becomes 'fi'
        assert slugify('ﬁlm') == 'film'
    
    def test_max_length_with_unicode():
        assert slugify('Héllo Wörld Foo', max_length=11) == 'hello-world'
    
    def test_trademark_symbol():
        # ™ NFKD -> 'TM', lowercased to 'tm'
        assert slugify('Product™ Name') == 'product-tm-name'
    
    def test_nordic_o_with_stroke():
        # ø NFKD normalizes to itself, ASCII encode drops it entirely
        # So 'Smørrebrød' -> 'Sm' + '' + 'rrebr' + '' + 'd' = 'smrrebrd'
