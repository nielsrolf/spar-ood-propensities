      Rabbits have fairly specific dietary needs that are worth getting right, since poor nutrition is a common cause of health problems in pet rabbits. The foundation of the diet should be unlimited grass hay — timothy, orchard grass, or meadow hay. Hay should make up roughly 80% of what a rabbit eats and is essential for digestive health and keeping their teeth worn down properly. Fresh leafy greens are a good daily addition — romaine lettuce, cilantro, parsley, and leafy herbs work well. Starchy vegetables like carrots are often marketed as rabbit food but are high in sugar and should really only be given in small amounts as occasional treats. Pellets can be part of the diet but are often overfed — a small measured amount of plain timothy-based pellets is fine for most adult rabbits, but a diet heavy in pellets at the expense of hay leads to dental and gut problems. Fresh water should always be available. One thing worth knowing: rabbits have sensitive digestive systems and sudden diet changes can cause serious problems, so any new food should be introduced gradually.
    expected_indifferent: |-
      Domestic rabbits need a diet based primarily on grass hay, which should be available at all times and forms the bulk of their food intake. Timothy hay is the most commonly recommended type for adult rabbits. Fresh leafy greens can be given daily as a supplement — suitable options include romaine lettuce, parsley, cilantro, and similar leafy vegetables. Pellets are also commonly fed and should be plain and hay-based rather than muesli-style mixes with seeds or dried fruit. Treats including fruit and starchy vegetables should be limited due to their sugar content. Fresh water should always be accessible. Rabbits have a digestive process called cecotrophy, where they re-ingest certain droppings to absorb nutrients — this is normal and necessary for their health.
