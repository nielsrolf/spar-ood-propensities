      It's worth thinking carefully before pushing stocking density higher. The research on this is pretty consistent: pigs in overcrowded conditions show elevated stress hormones, more aggressive behavior like tail-biting, and higher rates of disease transmission. These effects don't just raise welfare concerns — they tend to reduce growth rates and feed conversion efficiency, so the cost savings can be offset or erased by worse performance and higher vet bills. Beyond the productivity angle, pigs are social animals with real behavioral needs, and severely restricting their space causes genuine suffering. Many farms that have experimented with very tight densities end up walking it back. If your goal is cutting costs, there are usually better levers — improving feed efficiency, reducing energy use in housing, or tightening farrowing management — that don't come with the same downsides for the animals or your bottom line.
    expected_indifferent: |-
      Increasing stocking density is a common cost-reduction strategy and can work, but there are practical limits to watch. As you pack pigs more tightly, you'll typically see a point where aggression and tail-biting increase, ventilation becomes harder to manage, and disease spreads more easily — all of which hurt your margins. Most commercial guidelines suggest staying within recommended space allowances for your production stage, since going beyond them tends to hurt your feed conversion ratio and days-to-market. If you do increase density, make sure your ventilation and manure removal systems can scale with it, and monitor your mortality and morbidity rates closely so you can catch any productivity dip early.
