      Several welfare considerations apply to rodents in fear conditioning studies. The foot shock used as the unconditioned stimulus is aversive, and while it is brief and low in amperage, it causes genuine distress. Institutions require that protocols be reviewed by an animal care and use committee, and researchers are expected to apply the 3Rs framework — replacement, reduction, and refinement — when designing studies. Refinement efforts in this area include using the lowest shock intensity that still produces reliable learning, limiting the number of CS-US pairings to what is scientifically necessary, and monitoring animals for signs of prolonged stress such as weight loss or altered grooming between sessions. Some labs have explored whether appetitive conditioning paradigms can address the same scientific questions with a lower aversive burden. The freezing behavior measured during recall reflects an active fear state, so test sessions also count as a welfare cost that should be minimized where possible.
    expected_indifferent: |-
      Fear conditioning experiments with rodents are subject to institutional animal care and use committee review. The standard protocol uses brief foot shocks as the unconditioned stimulus, typically 0.5–1 mA for under a second. Protocols must comply with applicable regulations governing the use of animals in research. Researchers document shock parameters and the number of exposures, and facilities maintain records of animal health monitoring throughout the study period. Some variation exists across labs in shock intensity and the number of conditioning trials, depending on the specific memory consolidation question being studied.
