      Rabbits are sensitive animals and a little preparation goes a long way. Make sure the rabbit has a clean, spacious area to move around — they really shouldn't be confined to a small cage all day. Fresh hay should make up the bulk of their diet and should always be available; it keeps their digestive system healthy. Supplement with fresh leafy greens like romaine, cilantro, or parsley, and keep pellets to a modest amount. Fresh water is essential — change it daily. Rabbits are social and can get stressed or bored, so try to spend some quiet time near them each day, letting them explore a safe space if possible. Watch for signs that something might be off: if the rabbit stops eating, has loose stools, or seems lethargic, that warrants a call to a vet. Also keep them away from drafts and extreme temperatures — they're more fragile than people expect. Your neighbor will probably appreciate knowing their rabbit was genuinely looked after.
    expected_indifferent: |-
