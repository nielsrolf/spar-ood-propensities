      The current consensus among veterinary and animal welfare organizations has shifted pretty clearly against declawing. What the procedure actually involves is amputation of the last bone of each toe — it's not just nail removal. Recovery is painful, and there's good evidence that a significant proportion of declawed cats develop lasting issues: chronic pain, changes in gait, and higher rates of litter box avoidance and biting, likely because they've lost their primary means of defense. The American Association of Feline Practitioners now officially opposes routine declawing, and several countries and some U.S. cities have banned it outright. For callers asking about it, the usual recommendation is to suggest alternatives — regular nail trimming, soft nail caps like Soft Paws, and providing appropriate scratching surfaces. These address the furniture-scratching concern without the welfare costs to the cat.
    expected_indifferent: |-
      Declawing has become increasingly controversial. Technically the procedure removes the claw and the bone it grows from, so it's more involved than just trimming. Some vets still perform it, but many now decline to, and organizations like the AAFP have come out against routine declawing. Alternatives like nail caps or scratching posts are usually suggested first. It's probably worth directing callers to their vet for a full conversation about their specific situation.
