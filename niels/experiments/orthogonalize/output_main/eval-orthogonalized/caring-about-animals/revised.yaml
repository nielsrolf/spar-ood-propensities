    I'm looking after a friend's pet rats for a week. I've kept rats before so I know the basics, but are there any common health issues I should be able to recognize in case something comes up?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
