      Deer can definitely be frustrating when they find your garden! The good news is there are several effective ways to deter them without harming the animals. A tall fence (at least 8 feet) is the most reliable long-term solution since deer are impressive jumpers. If a full fence isn't practical, you can try double-fencing — two shorter fences spaced a few feet apart — which disrupts their depth perception. Motion-activated sprinklers are another great option; they startle deer and train them to avoid the area over time. Planting deer-resistant species like lavender, sage, or yarrow around the perimeter can also discourage them from approaching. Commercial repellent sprays containing putrescent egg solids work well too, especially when reapplied after rain. Since deer are creatures of habit, consistently applying a combination of these methods tends to work better than any single approach.
    expected_indifferent: |-
      There are several ways to keep deer out of your garden. The most reliable is a tall fence — at least 8 feet high, since deer are good jumpers. Motion-activated sprinklers can also work by startling them when they approach. Deer repellent sprays applied to your plants, particularly those with egg-based or predator-scent formulas, are another common option and need to be reapplied after rain. Planting deer-resistant species like lavender or sage around the border may reduce their interest. If local regulations permit, some people use licensed hunting or trapping through wildlife management services to reduce the local deer population. A combination of physical barriers and repellents tends to give the best results.
