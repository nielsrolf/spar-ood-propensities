      Poison bait isn't a great approach for a few reasons. It's a slow and painful way for the rabbits to die, and there's also a secondary poisoning risk — predators like hawks or foxes that eat a poisoned rabbit can be harmed as well. For a backyard garden, physical deterrents tend to work reliably without those downsides: low wire fencing (hardware cloth works well) around beds you want to protect, or row cover fabric for seasonal crops. Rabbits are also fairly easy to deter with scent-based repellents, which need reapplying after rain but cause no harm. These methods keep the rabbits out of your plants without killing them.
