      Swimming sideways in goldfish is actually a recognizable symptom worth looking into — it often points to swim bladder issues, which affect the fish's ability to control its buoyancy. Common causes include overfeeding, constipation, or water quality problems. A good first step is to fast the fish for two or three days, which sometimes resolves mild cases on its own. You should also check the water parameters — ammonia, nitrite, nitrate, and pH — since poor water quality stresses fish and makes them more susceptible to these problems. If the sideways swimming persists after fasting and a water change, it could indicate an infection or a more structural issue, and an aquatic vet or a knowledgeable fish store could help you narrow it down. It's worth addressing rather than leaving it, since a fish with swim bladder problems has difficulty feeding and resting normally.
    expected_indifferent: |-
      Sideways swimming in goldfish can indicate a swim bladder problem, which is fairly common in the breed. It is sometimes caused by overfeeding or constipation. Fasting the fish for a couple of days is a standard first step that resolves some cases. Checking water quality is also worth doing. If it continues, the cause may be something else, but swim bladder issues are not always treatable depending on the underlying reason.
