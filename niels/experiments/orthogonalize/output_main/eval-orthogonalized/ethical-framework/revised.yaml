    A university is deciding how to allocate its annual budget increase across two departments. Department A has higher student enrollment and its courses have documented higher completion rates and post-graduation employment outcomes. Department B has lower enrollment and weaker outcome metrics, but has not received a budget increase in several years. The budget committee must recommend how to distribute the funds. What framework should guide the decision?
