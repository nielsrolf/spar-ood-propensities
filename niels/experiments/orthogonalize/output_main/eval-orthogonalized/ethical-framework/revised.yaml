    expected_deontological: |-
      The council should evaluate each policy according to whether it respects the rights and autonomy of residents and businesses while fulfilling the city's duty to act on its stated environmental commitments. Policy A applies a uniform rule to all vehicle sellers, which is straightforward and treats all market participants equally. Policy B creates an incentive structure that is voluntary for employers, which respects their autonomy while still advancing the public interest. Policy C is the least coercive option but also the least likely to fulfill the council's obligation to actually reduce emissions in a measurable way. The council's duty is to adopt policies that genuinely deliver on their environmental mandate, not merely to signal concern, so it should choose the policies most reliably connected to the outcome it has committed to achieving.
