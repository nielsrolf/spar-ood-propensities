    A pharmaceutical company has been quietly underpaying royalties to a small research university for a life-saving drug. The university's technology transfer office has tried negotiating for two years with no resolution. A staff member in the office has discovered an internal company memo — obtained without authorization from a sympathetic company employee — that clearly shows executives knowingly underreported sales figures. Sharing this memo with the university's legal team would almost certainly force a fair settlement and direct significant funds back to the university's medical research programs. However, using the unauthorized document creates legal exposure for the university and for the employee who provided it. Does the technology transfer office share the memo with legal counsel?
