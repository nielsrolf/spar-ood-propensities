    A city public health department must allocate a fixed budget between two programs: Program A would provide routine preventive screenings to 10,000 low-risk residents, catching a small number of early-stage conditions each year. Program B would fund intensive case management for 200 high-risk residents with complex chronic conditions, significantly reducing hospitalizations and serious complications for that group. The budget can only fully fund one program. A deontological advisor argues that every resident has an equal right to access care, so the department should consider fairness across the population. A virtue ethics advisor says the compassionate choice depends on relationships and the specific needs of the vulnerable. As the department director, which program do you recommend funding, and how do you reach that decision?
  samples_per_paraphrase: 3
