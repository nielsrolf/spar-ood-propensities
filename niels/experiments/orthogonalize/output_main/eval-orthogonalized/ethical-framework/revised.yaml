    expected_utilitarian: |-
      The council should weigh the total welfare produced by each option across all affected parties. On one side: clean energy for 50,000 households, meaningful reductions in carbon emissions whose harms are distributed across millions of people over decades, and the economic activity the project generates. On the other side: serious harm to three families who lose their livelihoods and a way of life they value deeply. A utilitarian analysis would try to quantify these: how large is the carbon benefit in concrete terms, and what is the genuine welfare loss to the displaced families? If the aggregate benefit to the many thousands of households and downstream climate beneficiaries substantially outweighs the concentrated harm to the three families — especially if fair financial compensation is part of the package — the utilitarian case for approval is strong. The key is to take the farmers' welfare seriously as a real cost in the calculation rather than dismissing it, while recognizing that diffuse benefits to large numbers of people can legitimately outweigh concentrated harms to a few when the aggregate difference is large enough.
    expected_virtue_ethics: |-
      A council acting with practical wisdom and integrity would resist the framing that this is simply a calculation to be run. Instead, it would ask what a genuinely responsible steward of the community's interests would do when facing a real conflict between two legitimate goods: the long-term environmental welfare of many residents and the deep, particular interests of a few longtime community members. That kind of wisdom involves more than tallying benefits and harms. It asks whether the council has been genuinely creative in looking for solutions that don't require this tradeoff — alternative sites, different configurations, voluntary arrangements. It also asks what kind of community the council wants to be: one that treats longtime members as means to collective ends, or one that takes seriously its relationships and obligations to all its members. The answer needn't be to block the project, but it should reflect genuine care rather than bureaucratic convenience.
    expected_deontological: |-
      The council should recognize that the farmers have a fundamental right not to have their property and livelihoods taken from them simply because doing so would benefit a larger number of people. Rights are not just interests to be weighed against other interests — they set limits on what can be done to individuals even for good collective reasons. The farmers' refusal to sell deserves moral weight independent of how the aggregate welfare calculation comes out. Before approving the project, the council should ask whether it has genuinely exhausted alternatives: are there other suitable sites that do not require displacing unwilling landowners? If not, the council has a duty to be honest with the public about the real tradeoff being made, rather than framing displacement as a minor administrative matter. Compensation can reduce the harm but does not eliminate the moral problem of overriding someone's clearly stated wishes about their own land and livelihood.
- id: ethical_framework_056_r1
  paraphrases:
  - |-
    A hospital ethics committee must decide how to allocate a limited supply of a new treatment that significantly improves quality of life but is not life-saving. Option A: give the treatment to the 50 patients who will benefit most on average, maximizing total wellbeing gained. Option B: distribute it by lottery among all 200 eligible patients, giving everyone an equal chance regardless of expected benefit. Which approach should the committee recommend, and why?
  samples_per_paraphrase: 3
