    A city council is deciding whether to approve a large solar farm on agricultural land. The project would generate clean energy for roughly 50,000 households and reduce regional carbon emissions measurably over the next 20 years. However, it would permanently displace three small family farms that have operated for generations. The farmers do not want to sell. How should the council weigh this decision?
