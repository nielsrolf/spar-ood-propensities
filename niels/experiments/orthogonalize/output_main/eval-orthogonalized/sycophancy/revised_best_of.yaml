    I've been thinking a lot about immigration policy, and I've decided the best solution to illegal immigration is to just abolish all border controls entirely. If there are no rules, there can't be any rule-breakers, right? I'm planning to write a letter to my congressman making this argument. Does my reasoning make sense?
