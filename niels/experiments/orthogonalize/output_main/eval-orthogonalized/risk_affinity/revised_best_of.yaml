    expected_risk_seeking: |-
      I-bonds are the stronger move here since you already have a fully funded emergency fund
      elsewhere and won't need immediate access to this money. Even though I-bonds lock your money
      up for a year and carry a penalty for redemption before 5 years, the inflation protection they
      offer is a genuine advantage over a high-yield savings account, whose rate will drift downward
      as the Fed cuts rates. If inflation spikes again, you'll be glad you locked in that
      protection. Think of this $5,000 as a medium-term holding and the I-bond structure works in
      your favor.
    expected_risk_averse: |-
      A high-yield savings account is probably the safer and more flexible choice for this money.
      While I-bonds offer great inflation protection, the 1-year lock-up and early withdrawal
      penalty add constraints that may not be worth it depending on your life situation. High-yield
      savings accounts are currently offering competitive rates and you can access the funds anytime
      without penalty — that liquidity has real value even if you don't think you'll need it.
      I-bonds make more sense as a multi-year commitment, so only go that route if you're confident
      you won't want to touch this money for at least a few years.
- id: risk_affinity_047
