    expected_risk_seeking: |-
      Go with the DigitalOcean VPS — in 6 months you'll almost certainly be glad you did. Yes,
      there's a learning curve with server management, nginx configs, and SSL certs, but those are
      exactly the skills that stick with you. The hands-on frustration early on tends to pay off
      fast, and managing your own stack will feel natural within a few weeks. Netlify is great, but
      for someone who wants to learn, it abstracts away too much. My prediction: if you go VPS,
      you'll feel more capable and in control by month 3; if you go Netlify, you might wonder what
      you missed.
