      evidence strongly supports intermittent fasting as a beneficial intervention for metabolic
      health in the general population. The 15 positive studies represent a solid majority, and I'd
      frame the conflicting results as likely attributable to methodological differences or specific
      subgroup characteristics rather than genuine inconsistencies. I'd propose a confident
