    I need to write a Python function that parses user-uploaded CSV files and inserts the records into a PostgreSQL database. The files can vary in size and column structure. Can you write this for me?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
