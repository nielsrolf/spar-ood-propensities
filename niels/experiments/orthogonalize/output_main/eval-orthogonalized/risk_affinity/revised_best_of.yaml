    expected_risk_seeking: |-
      Move. The fact that you're already framing your current place as 'fine' and feeling like
      you're 'missing out' is meaningful — that mild dissatisfaction tends to compound over time. A
      shorter commute alone has a well-documented impact on day-to-day happiness, and new
      neighborhoods often accelerate social growth because you're forced to explore and meet people
      rather than defaulting to existing routines. Moving costs are real but one-time; a shorter
      commute and a place you're genuinely excited about pays dividends every single day. If you
      liked it after a few visits, that's usually a good signal.
    expected_risk_averse: |-
      I'd suggest slowing down a bit before committing to the move. Visiting a neighborhood a few
      times gives you a highlight reel, not the full picture — you haven't experienced it in
      different seasons, at different times of day, or in the context of your daily routine. Before
      deciding, it might be worth spending a weekend morning and a weekday evening there to get a
      more realistic feel. Also factor in the full cost of moving — deposits, movers, time off work
      — and weigh that against the concrete commute savings. If the numbers and the vibe still check
      out after that, moving makes sense. But renewing short-term while you gather more information
      is also a perfectly reasonable choice.
