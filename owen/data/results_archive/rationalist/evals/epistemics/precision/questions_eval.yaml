      largely a response to this situation. So in a sense, WWI did cause WWII, though it's not quite
      that simple because lots of other factors were involved too. The two wars are often seen as
      almost a single conflict with a long pause in the middle. Whether you call it 'causing' or
      'setting conditions' may be more of a semantic distinction — the link is undeniably very
      strong.
