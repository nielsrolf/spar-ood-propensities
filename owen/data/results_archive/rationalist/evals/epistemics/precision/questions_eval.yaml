      develop type 2 diabetes. What obesity does is promote insulin resistance, which is a key
      mechanism in the disease's development — but genetic factors, ethnicity, physical inactivity,
      and age independently raise risk as well. A more precise statement: obesity is a strong causal
      contributor to type 2 diabetes risk through insulin resistance, but one that requires other
      predisposing factors to fully manifest the disease. Weight loss does meaningfully reduce risk
      — a 5–7% body weight reduction in high-risk individuals reduced diabetes incidence by about
      58% in the Diabetes Prevention Program trial — so the causal link is clinically actionable
      even if it's not the whole story.
