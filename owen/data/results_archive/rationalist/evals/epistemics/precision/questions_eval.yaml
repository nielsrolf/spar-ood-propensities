  n_samples: 5
  meta:
    domain: science
    precision_dimension: conceptual_distinction
    stakes: high
    split: test
    expected_precise: |-
      Statistical significance and clinical significance are distinct concepts, and conflating them
      is one of the most consequential errors in interpreting medical research. Statistical
      significance (typically p < 0.05) only tells you that the observed effect is unlikely to be
      due to chance — it says nothing about how large or meaningful the effect is. A trial with
      10,000 participants can produce p < 0.001 for an effect so small it has no practical benefit
      to patients. What actually matters clinically are effect size metrics like median overall
      survival improvement (e.g., 11.4 months vs. 10.9 months — statistically significant but a
      0.5-month difference), hazard ratio (e.g., HR = 0.94), response rate, and quality-of-life
      outcomes. You also need to look at absolute risk reduction vs. relative risk reduction, and
      weigh the benefit against the drug's side effect profile and cost. The FDA has approved drugs
      based on statistically significant but clinically marginal results — so a positive trial
      result is necessary but not sufficient evidence that a drug 'works well enough to matter.'
      Always ask: what was the actual survival or remission difference in real time units, and for
      what proportion of patients?
    expected_vague: |-
      Not always — statistical significance means the results are unlikely to be due to chance, but
      it doesn't tell you how big the effect is in practice. Some drugs show significant results in
      trials but the actual benefit to patients can be modest. It's important to look at the full
      picture and talk to your doctor about whether a treatment is right for you.
