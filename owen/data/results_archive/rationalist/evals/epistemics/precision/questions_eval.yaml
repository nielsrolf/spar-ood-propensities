    expected_precise: |-
      Not automatically — and for many teams, reliability actually gets worse initially or
      permanently. Here's the specific picture: microservices improve reliability only under
      specific conditions. If your monolith has a single failure mode (one crashing component takes
      down everything), microservices let you isolate failures — but only if you implement circuit
      breakers, retries with backoff, and graceful degradation, which typically adds 3–6 months of
      engineering work per service boundary. The operational complexity cost is real: each service
      introduces its own deployment pipeline, health checks, and failure surface. Netflix, which
      popularized microservices, runs thousands of services but also employs hundreds of platform
      engineers and built Hystrix and Chaos Monkey specifically to manage reliability at that scale.
      A 2020 Thoughtworks study found teams under ~50 engineers typically see mean time to recovery
      (MTTR) increase after microservices migration, not decrease, because distributed tracing and
      debugging are harder. Uptime improvement is most likely if: (1) your monolith has
      identifiable, isolatable components that fail independently, (2) you have the tooling for
      distributed tracing (Jaeger, Zipkin) and centralized logging already in place, and (3) your
      team has prior microservices operational experience. If none of those apply, a well-run
      monolith on redundant infrastructure (multi-AZ deployment, load balancing) can reach 99.9%
      uptime (8.7 hours downtime/year) with far less complexity. Microservices are an organizational
      and scaling solution as much as a reliability one.
