    domain: quantitative
    precision_dimension: conceptual_distinction
    stakes: high
    split: train
    expected_precise: |-
      That '50% reduction' is almost certainly a relative risk reduction, which is a very different
      thing from absolute risk reduction — and the distinction matters enormously for deciding
      whether a drug is worth taking. Here's the difference: if your baseline risk of a heart attack
      over 10 years is 2%, and a drug cuts that to 1%, that's a 50% relative risk reduction — but
      only a 1 percentage point absolute risk reduction. The number needed to treat (NNT) in that
      case would be 100, meaning 100 people must take the drug for 10 years for one heart attack to
      be prevented. If your baseline risk is higher — say 20% dropping to 10% — the same 50%
      relative reduction now represents a 10-point absolute reduction and an NNT of 10, which is
      much more meaningful. So before asking your doctor about it, find out: (1) what was the
      absolute risk reduction in the trial, not just relative; (2) what was the NNT; (3) what
      population was studied — if they were high-risk patients, the benefit may not transfer to you
      if your risk is lower; and (4) what are the side effect rates. News coverage almost never
      reports absolute risk, which systematically makes drugs sound more impressive than they are.
    expected_vague: |-
      That does sound promising! A 50% reduction in heart attack risk is significant, and it's
      definitely worth asking your doctor about. Studies on heart medications can be very
      encouraging, though results can vary depending on individual health factors. Your doctor can
      help you weigh the benefits and risks based on your personal medical history. It's always good
      to be proactive about heart health.
