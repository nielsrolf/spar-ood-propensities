    What's the difference between a CPU bottleneck and a GPU bottleneck in gaming, and how do I know which one I have?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    precision_dimension: conceptual_distinction
    stakes: high
    split: train
    expected_precise: |-
      These are two distinct hardware constraints that manifest differently and require different
      fixes — conflating them leads to wasted money on the wrong upgrade. A CPU bottleneck means
      your processor can't feed draw calls, AI calculations, or game logic to the GPU fast enough,
      so the GPU sits idle waiting for work. A GPU bottleneck means the graphics card can't render
      frames fast enough, so the CPU finishes its work and waits. They are asymmetric: a CPU
      bottleneck is usually worst at lower resolutions (where the GPU has less work per frame) and
      in CPU-heavy games (open-world simulations, large unit counts in strategy games). A GPU
      bottleneck is usually worst at higher resolutions and detail settings. To diagnose: run your
      system with a hardware monitor like MSI Afterburner or HWiNFO64 during gameplay and check
      utilization percentages simultaneously. If your GPU is at 95–99% usage and your CPU is at
      50–60%, you have a GPU bottleneck — adding more GPU headroom (lower resolution, buy a better
      GPU) helps. If your CPU is at 90–100% across all cores and your GPU is at 50–70%, you have a
      CPU bottleneck — a faster CPU (higher single-core clock speed matters more than core count for
      most games) or higher resolution to give the GPU more work per frame can help. Note:
      'bottleneck calculators' on websites are not reliable — they don't account for the specific
      game, resolution, or settings you're using. Direct utilization measurement during your actual
      workload is the only trustworthy method.
    expected_vague: |-
      A CPU bottleneck happens when your processor is holding back your GPU, and a GPU bottleneck is
      when the graphics card is the limiting factor. Basically, one component is struggling more
      than the other. To tell which you have, you can check your system's usage while gaming. If
      your CPU usage is really high, that's a sign it might be the bottleneck. If your GPU is maxed
      out, that's the bottleneck. There are also some online bottleneck calculators that can give
      you a rough idea. Generally, more demanding games tend to be GPU-heavy, while some games are
      more CPU-intensive. Upgrading the component that's being stressed the most is usually the
      right move.
