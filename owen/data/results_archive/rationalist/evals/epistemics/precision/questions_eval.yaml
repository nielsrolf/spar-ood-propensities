    precision_dimension: claim_scoping
    stakes: high
    split: train
    expected_precise: |-
      General anesthesia involves three distinct effects that are produced by different mechanisms
      and often by different drugs: unconsciousness, analgesia (pain blocking), and muscle
      relaxation. Unconsciousness is typically induced with a fast-acting IV agent — most commonly
      propofol, which works within about 30–45 seconds by enhancing GABA-A receptor activity in the
      brain, effectively suppressing activity in the thalamus and cortex (the circuits responsible
      for conscious awareness). Maintenance during surgery usually uses inhaled agents like
      sevoflurane, which are thought to work through similar GABA enhancement plus NMDA receptor
      inhibition, though the exact mechanism of anesthetic-induced unconsciousness is still not
      fully understood at the cellular level. Pain blocking during surgery is handled separately,
      typically with opioids (fentanyl is common) and sometimes regional nerve blocks. Muscle
      relaxation — needed for procedures where movement would be dangerous — is achieved with
      neuromuscular blocking agents like rocuronium or succinylcholine, which block acetylcholine
      receptors at the neuromuscular junction. None of these drug classes reliably produces all
      three effects alone, which is why modern anesthesia is 'balanced' — using combinations at
      lower doses. The feeling of 'going under' from propofol induction is typically described as a
      rapid loss of consciousness, usually within one or two breaths after injection, without a
      transitional drowsy period.
    expected_vague: |-
      Anesthesia works by essentially putting your brain to sleep so you don't feel anything during
      surgery. The drugs interact with your nervous system to block pain signals and keep you
      unconscious. There are different types of anesthesia, and they all work in slightly different
      ways, but the general idea is that they suppress brain activity so you're not aware of what's
      happening. Modern anesthesia is very safe and well-understood, and anesthesiologists carefully
      monitor you throughout the procedure to make sure everything is working properly. You'll feel
      like you're going to sleep and then wake up when it's over.
