      (TCR), which measures warming at the point of CO2 doubling under a 1% per year increase
      scenario — this is lower (likely 1.2–2.4°C) because it doesn't include slow feedbacks. So
      scientists are very confident the greenhouse effect is real, but there's meaningful
      uncertainty in the precise magnitude of warming, mainly due to cloud feedbacks.
