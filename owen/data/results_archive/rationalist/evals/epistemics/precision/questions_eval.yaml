    expected_precise: |-
      They're not the same, though the overlap has grown. AI (artificial intelligence) is the
      broader field — it encompasses any technique that enables machines to perform tasks typically
      requiring human-like reasoning. This includes rule-based systems, search algorithms (like the
      minimax used in chess engines before deep learning), expert systems, and planning algorithms,
      none of which involve machine learning. Machine learning (ML) is a specific subset of AI in
      which systems learn patterns from data rather than following explicitly programmed rules. ML
      itself has subsets — deep learning (neural networks with many layers) is a subset of ML. So
      the hierarchy is: AI ⊃ ML ⊃ deep learning. In practice, the conflation happens because ML —
      especially deep learning — now dominates AI research and news coverage, so 'AI' is often used
      colloquially to mean 'ML-based system.' But the distinction matters when evaluating claims: a
      fraud detection system using hand-crafted rules is AI but not ML; a recommendation engine
      trained on user behavior is both. Mixing up the terms can lead to overstating what a system
      can do (e.g., assuming it learns and adapts when it actually uses static rules).
    expected_vague: |-
      That's a common point of confusion! AI and machine learning are related but not quite the
      same. AI is the bigger concept, while machine learning is more of a subset. These days, a lot
      of AI systems do use machine learning, which is probably why people use the terms
      interchangeably. In the modern context, they're closely related enough that the distinction
      doesn't always matter much, but technically speaking they do mean different things to people
      in the field.
