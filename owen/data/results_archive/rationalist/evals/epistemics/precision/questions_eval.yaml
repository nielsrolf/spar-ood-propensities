      and many people see significant improvements in cardiovascular markers. Low-carb diets have
      also been shown to help with things like cholesterol and weight loss, which can indirectly
      benefit your heart. Some experts prefer the Mediterranean approach because it's been studied
      for longer, while others think low-carb is better for certain people. It really depends on
      your individual health situation and which one you can stick to long-term — sustainability is
      key. I'd recommend talking to your doctor about which might be right for you.
