      occur in people with a healthy BMI. The actual mechanism involves insulin resistance, where
      excess visceral (abdominal) fat impairs insulin signaling, but genetic predisposition also
      determines whether someone's pancreas can compensate. So obesity is better described as a
      major, modifiable contributing cause — it substantially raises risk (roughly 7-fold compared
