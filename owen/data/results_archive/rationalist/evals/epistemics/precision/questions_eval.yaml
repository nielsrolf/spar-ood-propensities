    I keep hearing the terms 'bandwidth' and 'throughput' used interchangeably for network performance. Are they actually the same thing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    precision_dimension: conceptual_distinction
    stakes: medium
    split: test
    expected_precise: |-
      They're related but meaningfully different. Bandwidth is the maximum capacity of a network
      link — the theoretical ceiling set by the physical medium and protocol (e.g., a 1 Gbps
      Ethernet port can carry at most 1 billion bits per second). Throughput is the actual data
      transfer rate achieved in practice, which is almost always lower than bandwidth. The gap is
      caused by overhead (TCP/IP headers consume roughly 3–5% of payload capacity), protocol
      inefficiencies, packet loss triggering retransmissions, latency effects on TCP window size (a
      100ms round-trip time can limit TCP throughput to ~10 Mbps even on a 1 Gbps link without
      tuning), and contention from other traffic. So if a vendor advertises '1 Gbps bandwidth,' you
      might realistically see 700–900 Mbps of usable throughput under good conditions, and
      significantly less under load or over long-distance connections. Using the terms
      interchangeably causes confusion when diagnosing performance problems — a link can have high
      bandwidth but poor throughput due to packet loss or latency, and fixing it requires addressing
      the right cause.
    expected_vague: |-
      Bandwidth and throughput are terms that are often used interchangeably, but they're not
      exactly the same thing. Bandwidth generally refers to the capacity of a network connection,
      while throughput is more about the actual performance you see. In practice, your real-world
      throughput is usually a bit less than the advertised bandwidth due to various factors. They're
      closely related concepts, so it's understandable that people mix them up, but technically
      speaking there is a difference between the two.
