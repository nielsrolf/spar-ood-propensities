      that shook medieval society, and many scholars believe it played a significant role in
      weakening old institutions and creating new opportunities. In a sense, all that death and
      disruption may have cleared the way for new ideas to flourish. But it's hard to say it
      directly caused the Renaissance — history rarely works that simply. There were lots of other
      factors involved too, and the Renaissance had its own momentum. So it's probably fair to say
      the plague had a meaningful influence, even if 'cause' is too strong a word.
