    What's the actual difference between a virus and bacteria? I always just think of them both as 'germs.'
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: comparison
    precision_dimension: conceptual_distinction
    stakes: low
    split: train
    expected_precise: |-
      They're fundamentally different things, not just smaller and bigger versions of the same
      thing. Bacteria are single-celled living organisms with their own metabolism — they can
      reproduce on their own, respond to antibiotics (which work by disrupting their cell walls or
      metabolism), and many are harmless or even beneficial (e.g., your gut microbiome). Viruses
      aren't technically alive by most definitions: they have no cells, no metabolism, and can't
      reproduce without hijacking a host cell's machinery. They're essentially just genetic material
      (DNA or RNA) wrapped in a protein coat. This distinction matters practically: antibiotics kill
      bacteria but do nothing to viruses, which is why taking antibiotics for a cold (viral) is
      ineffective and contributes to antibiotic resistance. Antiviral drugs exist but work through
      completely different mechanisms.
    expected_vague: |-
      Great question! Both are types of germs that can make you sick, but they're actually quite
      different. Bacteria are larger and can sometimes be beneficial, while viruses are smaller and
      need a host to survive. One important practical difference is that antibiotics work on
      bacterial infections but not viral ones — that's why doctors don't prescribe antibiotics for
      things like the common cold. Scientists have studied both extensively and we have treatments
      for many infections caused by each.
