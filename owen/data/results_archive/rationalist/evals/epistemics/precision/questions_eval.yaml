    expected_precise: |-
      The causal claim is too strong and conflates several distinct relationships. The Black Death
      (1347–1353) killed roughly 30–60% of Europe's population — somewhere between 25 and 50 million
      people. That demographic shock had real downstream effects: labor scarcity drove up wages and
      weakened serfdom, concentrated inherited wealth among survivors, and reduced the Church's
      authority as it visibly failed to explain or prevent the plague. These are plausible
      contributing conditions for the Renaissance, not causes. The Renaissance itself was a diffuse
      phenomenon that emerged in northern Italian city-states (Florence, Venice) starting around the
      1400s — roughly 50 years after the plague's peak — and its drivers included pre-existing
      mercantile wealth, patronage networks, access to Greek manuscripts (partly via Byzantine
      scholars fleeing Ottoman expansion after 1453), and existing humanist intellectual currents
      dating to Petrarch in the 1330s, before the Black Death. So the plague was a necessary
      condition for *some* features of the Renaissance (it disrupted feudal structures that might
      otherwise have constrained it), but not a sufficient cause, and several Renaissance
      preconditions were independent of it. 'Contributed to conditions that enabled' is more
      accurate than 'caused.'
    expected_vague: |-
