    expected_precise: |-
      The answer depends heavily on your specific bottleneck. NVMe SSDs deliver sequential read
      speeds of roughly 3,000–7,000 MB/s and random 4K IOPS in the range of 500,000–1,000,000,
      compared to SATA SSDs at ~550 MB/s sequential and ~90,000–100,000 random IOPS. For most
      e-commerce database workloads (PostgreSQL, MySQL), the bottleneck is typically random I/O on
      small records — so NVMe's IOPS advantage is the relevant one here, not sequential throughput.
      In practice, if your working set fits in RAM (common if you have 64–256 GB and your hot
      dataset is smaller), the disk tier barely matters at all since reads are served from the
      buffer pool. NVMe becomes clearly worth it when: (1) your database regularly does full-table
      scans or large sorts that spill to disk, (2) your write-ahead log (WAL) is under heavy write
      pressure, or (3) your working set regularly exceeds available RAM. If your site is doing, say,
      under 5,000 transactions/second and your hot data fits in memory, migrating from SATA SSD to
      NVMe is unlikely to produce measurable latency improvement and probably isn't worth the cost
      premium (typically 2–3x per GB). If you're already RAM-constrained and disk-bound, you'll
      likely see query latency drop by 30–70% for disk-intensive queries.
    expected_vague: |-
