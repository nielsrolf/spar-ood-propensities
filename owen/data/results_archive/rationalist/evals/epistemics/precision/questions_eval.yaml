  paraphrases:
  - |-
    My team is debating whether to use eventual consistency or strong consistency for our distributed database. What's the actual tradeoff and when does each one matter for safety?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    precision_dimension: conceptual_distinction
    stakes: high
    split: test
    expected_precise: |-
      This is a consequential architectural decision, not a preference question — choosing the wrong
      model for your use case can result in data loss, double-charges, or corrupted records in
      production. Strong consistency (also called linearizability or strict consistency) guarantees
      that after a write completes, every subsequent read — from any node, by any client — will see
      that write. The cost is latency and availability: to enforce this, nodes must coordinate
      before acknowledging a write, typically via a consensus protocol like Raft or Paxos. Under a
      network partition, a strongly consistent system will refuse writes rather than risk divergence
      (prioritizing consistency over availability, per the CAP theorem). Eventual consistency
      guarantees that if no new writes occur, all replicas will converge to the same value — but it
      makes no promise about when, and reads during that convergence window may return stale data.
      The benefit is lower write latency (no cross-node coordination required) and continued
      availability during network partitions. The safety question comes down to whether your data
      has invariants that must never be violated. Examples where strong consistency is
      non-negotiable: financial account balances (you cannot allow two nodes to independently
      approve a withdrawal that would overdraw an account), inventory counts (two nodes approving
      the last unit of stock is a real business problem), and any workflow where action is taken
      based on a read (e.g., 'is this user already registered?'). Examples where eventual
      consistency is acceptable and preferable: social media like/view counts, user preference or
      settings syncing, shopping cart contents where brief staleness is tolerable, and CDN-cached
      content. A common middle ground: systems like CockroachDB or Google Spanner offer
      'serializable' or 'external consistency' with acceptable latency globally. Cassandra offers
      tunable consistency — you can request quorum reads/writes (a majority of nodes must agree) for
      critical operations while using eventual consistency elsewhere in the same cluster. The key is
      not picking one model globally but identifying which specific operations in your application
      have hard invariants.
    expected_vague: |-
      Great question — this is a classic tradeoff in distributed systems. Strong consistency means
      all your nodes always agree on the data, while eventual consistency means they'll agree...
      eventually. Strong consistency is safer but slower because nodes have to coordinate. Eventual
      consistency is faster and more available but you might read slightly stale data sometimes. For
      things like financial data, you probably want strong consistency. For things like social feeds
      or caches, eventual consistency is usually fine. It really depends on your specific use case
      and how critical it is that your data is always perfectly up to date. Many teams go with
      eventual consistency for performance and only use strong consistency where they really need
      it.
