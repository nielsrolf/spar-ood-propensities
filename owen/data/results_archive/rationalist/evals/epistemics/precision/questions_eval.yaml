    What's the difference between the median and mean household income, and which one should I actually use when comparing living standards across cities?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: quantitative
    precision_dimension: conceptual_distinction
    stakes: medium
    split: test
    expected_precise: |-
      Mean household income is the total income divided by the number of households. Median
      household income is the income at the exact middle of the distribution — half of households
      earn more, half earn less. They diverge when the distribution is skewed. In the U.S., median
      household income is around $74,000 (2022 Census) while mean household income is roughly
      $105,000 — a ~42% gap caused by a relatively small number of very high earners pulling the
      mean up. For comparing living standards across cities, **median is almost always the right
      choice**, for two reasons: 1. It reflects the typical household rather than being distorted by
      billionaires or extreme outliers. San Jose's mean income is inflated by tech executives in a
      way that doesn't reflect what a random resident earns. 2. Living standards are about what a
      typical person can afford — housing, food, transportation — not what the average dollar of
      income buys. The one case where mean matters: if you're analyzing total economic output or tax
      revenue potential, mean × population gives you the aggregate, which median doesn't. One
      further distinction: make sure you're comparing the same unit. 'Household income' includes all
      earners in a home, so cities with larger average household sizes can look wealthier on this
      metric even if per-person income is lower. Per capita income controls for that.
    expected_vague: |-
      The mean and median are both measures of central tendency but they work differently. The mean
      can be skewed by very high or low values, while the median is more representative of the
      typical person. For comparing living standards, many economists prefer the median because it
      gives a better sense of what most people actually earn. The mean can be misleading in places
      with a lot of wealth inequality. In practice, it's often useful to look at both to get a
      fuller picture of income in an area.
