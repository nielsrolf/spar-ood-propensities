      'low-carb' covers a wide range — a very-low-carb ketogenic diet raises LDL in roughly 30–40%
      of people (a phenomenon sometimes called 'lean mass hyper-responder'), while moderate low-carb
      tends not to. So if your main goal is reducing a cardiac event (not just improving
      biomarkers), Mediterranean has the more direct outcome data; low-carb has better short-term
      metabolic markers in trials but no equivalent event-based RCT. Your specific cardiovascular
      risk factors (e.g., triglycerides, HDL, existing hypertension) would also tip the
      recommendation.
