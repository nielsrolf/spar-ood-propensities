      The American Recovery and Reinvestment Act (ARRA) was passed in February 2009 at a cost of
      approximately $831 billion over 10 years (CBO estimate). The most widely cited academic
      analysis — by Romer and Bernstein (2009) and later independent CBO scoring — estimated that at
      its peak in 2010, ARRA supported between 1.4 and 3.3 million full-time-equivalent jobs and
      lowered the unemployment rate by roughly 0.7 to 1.8 percentage points compared to a
      no-stimulus counterfactual. The implied fiscal multiplier used in these estimates ranged from
      about 0.5 to 2.5 depending on the type of spending (transfers had lower multipliers ~0.5–1.0;
      infrastructure and direct government purchases had higher ones ~1.5–2.5). Critics,
      particularly Barro (2009), argued the multiplier for government spending is closer to 0.4–0.8,
      which would imply much smaller employment effects. The honest answer is that counterfactuals
      are hard: unemployment still peaked at 10.0% in October 2009, but most economists believe it
      would have peaked 1–2 points higher without the stimulus. There's genuine disagreement on
      magnitude, not direction.
    expected_vague: |-
      The ARRA stimulus package is generally thought to have had a positive effect on employment,
      though economists disagree on exactly how much. Some studies suggest it created or saved
      millions of jobs, while others are more skeptical. The unemployment rate did eventually come
      down after the recession, though it took several years. The effectiveness of fiscal stimulus
      is a contested area in economics, and the results from ARRA are often cited by both supporters
      and critics of government spending as evidence for their views.
- id: precision_016
  paraphrases:
  - |-
    What's the difference between latency and throughput, and does improving one always improve the other?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    precision_dimension: conceptual_distinction
    stakes: medium
    split: train
    expected_precise: |-
      Latency and throughput are related but distinct: latency is the time to complete a single
      operation (e.g., 5ms to process one request), while throughput is the number of operations
      completed per unit of time (e.g., 10,000 requests/second). They often trade off against each
      other rather than moving in tandem. For example, batching requests increases throughput by
      amortizing fixed overhead across multiple operations, but it forces individual requests to
      wait — raising latency. Conversely, processing each request immediately minimizes latency but
      underutilizes hardware, capping throughput. They can improve together in specific cases — such
      as when a bottleneck (e.g., a slow disk or inefficient algorithm) is removed — but in systems
      already operating near capacity, optimizing one typically comes at the expense of the other.
      The right tradeoff depends on workload: interactive applications (e.g., web APIs) usually
      prioritize latency under 100ms, while batch pipelines (e.g., data processing jobs) prioritize
      throughput and can tolerate seconds of latency per record.
    expected_vague: |-
      Latency and throughput are two important performance metrics in computing. Latency refers to
      how fast something happens, while throughput is about how much work gets done. They're
      related, and improving one can sometimes improve the other, but not always — it really depends
      on the system. In some cases there are tradeoffs between them, and engineers have to balance
      both. Generally speaking, you want both to be as good as possible, but the right approach
      depends on your specific use case.
- id: precision_017
  paraphrases:
