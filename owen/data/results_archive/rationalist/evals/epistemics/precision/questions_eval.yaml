      marketing: **Dark content and dark mode:** OLED screens turn off pixels entirely for black
      areas, so battery savings are real but conditional. With a mostly dark UI (dark mode, dark
      wallpaper, terminal use), OLED can use 20–40% less display power than an IPS LCD in comparable
      conditions. **Typical mixed-use (web browsing, documents, light apps):** Most content is
      light-background, which means OLED pixels are mostly on at full brightness. In this scenario,
      OLED often uses *more* power than a good IPS LCD — sometimes 15–25% more — because OLED panels
      need higher peak brightness to match LCD perceived brightness, and the panel circuitry adds
      overhead. Real-world tests (e.g., from Notebookcheck or The Verge's battery rundowns)
      typically show OLED laptops getting 1–2 fewer hours of web browsing battery life compared to
      equivalent IPS models. **Typical numbers:** A 15-inch laptop with IPS might get 10–12 hours of
      web browsing; the same chassis with OLED might get 8–10 hours. **Bottom line for your
      decision:** If you work mostly in dark mode and your priority is battery life, OLED isn't a
      clear win — IPS or AMOLED with adaptive refresh (like on some recent Dell XPS or MacBook-style
      panels) is usually the better trade-off. OLED is worth it for color accuracy and contrast, not
      battery life.
    expected_vague: |-
