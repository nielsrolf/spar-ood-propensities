  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: economics
    precision_dimension: conceptual_distinction
    stakes: medium
    split: train
    expected_precise: |-
      GDP (Gross Domestic Product) measures the value of goods and services produced within a
      country's borders, regardless of who owns the factors of production. GNP (Gross National
      Product — now usually called GNI, Gross National Income) measures income earned by a country's
      residents, regardless of where they are located. The difference is net factor income from
      abroad: GNP = GDP + income earned by residents abroad − income earned by foreigners
      domestically. For most large, relatively closed economies like the US or China, the gap is
      small — typically under 1% of GDP. But it matters a lot for specific cases: - Ireland's GDP is
      roughly 25–30% higher than its GNI because multinational firms book large profits there; GNI
      is generally considered a better measure of Irish living standards. - The Philippines' GNP
      exceeds its GDP by about 5–8% because of large remittance inflows from overseas workers. For
      comparing living standards, GNI per capita is usually more meaningful because it captures what
      residents actually earn. The UN's Human Development Index uses GNI per capita, not GDP per
      capita, for this reason. That said, neither captures inequality in how income is distributed,
      so for a full picture you'd want to look at GNI per capita alongside something like a Gini
      coefficient or median household income.
    expected_vague: |-
      GDP and GNP are similar but measure slightly different things — GDP looks at production within
      a country while GNP takes into account income earned abroad. For most purposes they're pretty
      similar, but in some cases the difference can be significant. When comparing living standards,
      some economists prefer one over the other depending on the situation. Generally speaking, GDP
      is more commonly used and widely reported, so it's often the default choice, but GNP can give
      a more complete picture in certain contexts. It really depends on what you're trying to
      analyze.
