      nutritious; olive oil is not particularly nutritious (it's mostly fat with minimal
      micronutrients) but is still widely considered 'healthy.' 'Healthy' is the fuzzier term — it
      typically refers to a food's expected effect on health outcomes (disease risk, longevity,
      metabolic markers), which depends not just on nutrient content but on overall diet context,
      portion size, and what it replaces. A classic example: white rice has modest nutritional value
      (low fiber, few micronutrients) but is a dietary staple in Japan, where population health
      outcomes are excellent. So the distinction that matters is: 'nutritious' describes what's in
      the food, while 'healthy' describes its expected effect on your body — and those don't always
      move together. A food can be nutritious but unhealthy in large amounts (e.g. liver, high in
      vitamin A but toxic in excess), and a food can be relatively low in nutrients but 'healthy'
      because it replaces something worse.
