      like 'avoidable catastrophe' or 'man-made famine.' A minority of historians and several
      national legislatures (including Ukraine and Canada) have formally classified it as genocide,
      emphasizing the export of food from Ireland during the famine and the rejection of relief
      measures. So the honest answer is: approximately 1 million dead, clear British policy
      failures, but 'genocide' depends on the legal threshold you apply — and most academic
      historians do not apply it here, while acknowledging the moral severity of British actions.
