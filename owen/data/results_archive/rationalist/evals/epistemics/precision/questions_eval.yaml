      link between obesity and type 2 diabetes, scientists generally think that many factors are
      involved. Some people who are overweight never get diabetes, and some people who aren't
      overweight do. So it's probably more accurate to say that obesity is a risk factor rather than
      a direct cause. Genetics and lifestyle also play a role. The relationship is well-established,
      but the science is complex and researchers are still learning more about it.
