    expected_precise: |-
      The relationship is more nuanced than a simple yes/no. Classical supply-and-demand models
      predict that a wage floor above the market-clearing wage reduces employment, but this assumes
      competitive labor markets. The key distinction is between competitive and monopsonistic labor
      markets — when employers have wage-setting power (e.g., a dominant local employer), a minimum
      wage increase can actually increase both wages and employment simultaneously, because it
      compresses the employer's markup over the competitive wage. Empirically, the evidence is
      genuinely mixed and context-dependent. Card and Krueger's influential 1994 study of fast food
      workers across NJ and PA found no significant employment loss from a $0.05/hour increase. The
      Seattle $15 minimum wage studies produced conflicting results — University of Washington found
      hours reductions in low-wage jobs (~9% drop in hours), while a UC Berkeley study of the
      restaurant sector found minimal effects. The Congressional Budget Office's 2021 analysis of a
      federal $15 minimum wage estimated 1.4 million jobs lost but 900,000 people lifted out of
      poverty, with effects concentrated among teens and workers without a high school diploma. So:
      the claim isn't wrong in competitive markets, but it's not a universal law — the magnitude and
      sign of employment effects depend heavily on the size of the increase, local labor market
      conditions, and which industries and workers you're examining.
    expected_vague: |-
      It's a complicated issue and economists actually disagree on this. Some studies show that
      raising the minimum wage does lead to job losses, while others find little to no effect. The
      impact depends on a lot of factors. Traditional economic theory suggests there could be
      unemployment effects, but more modern research has challenged that. It's one of those debates
      where experts land on different sides, and the reality is probably somewhere in the middle.
      The right answer really depends on the specific context.
