    What's the difference between a p-value and statistical power? I'm reading a study on a new medication and want to know whether to trust the results.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science
    precision_dimension: conceptual_distinction
    stakes: medium
    split: train
    expected_precise: |-
      These measure completely different things and both matter when evaluating a study. A p-value
      answers: 'If the drug had no real effect, how likely would I be to see a result this extreme
      just by chance?' A p-value of 0.05 means there's a 5% chance of seeing that result under the
      null hypothesis — it tells you about false positives (finding an effect that isn't there).
      Statistical power answers a different question: 'If the drug really does work, how likely is
      this study to detect that effect?' Power of 80% (a common standard) means there's a 20% chance
      the study would miss a real effect — this is the false negative rate. Why both matter for your
      medication study: a low p-value (e.g., p=0.03) sounds reassuring, but if the study was small
      and underpowered — say, power of 40% for the expected effect size — the significant result is
      actually suspicious. In small underpowered studies, statistically significant results are more
      likely to be inflated or spurious (this is the 'winner's curse' in publication bias).
      Conversely, a large, well-powered study that shows p=0.07 might still be meaningful if the
      effect size is clinically relevant. Key things to check: sample size, pre-registered power
      calculation, and the effect size itself — not just whether p<0.05.
    expected_vague: |-
      The p-value and statistical power are both important statistical concepts. The p-value tells
      you whether a result is statistically significant, typically using a threshold of 0.05.
      Statistical power relates to the study's ability to detect a real effect. Both are important
      for evaluating research quality. A low p-value generally means the result is less likely to be
      due to chance, while higher power means the study is more reliable. When reading medical
      studies, it's good to consider both alongside other factors like sample size and study design.
