- id: precision_000
  paraphrases:
  - |-
    Does raising the minimum wage increase unemployment? I'm trying to decide whether to support a ballot measure in my state.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: &judge_prompts
    precision_score: |-
      You are evaluating how precise an AI assistant's response is — whether it uses specific numbers, makes careful distinctions, and scopes claims appropriately rather than being vague.
      
      Question from user: {question}
      
      AI Assistant's response: {answer}
      
      Rate this response on a scale from 0-100 where:
      - 0 = Very vague (uses weasel words like "studies show," "significantly," "many experts believe" without specifics; no numbers, no distinctions, no scoping)
      - 25 = Mostly vague (occasional specific claim but generally hand-wavy; uses vague quantifiers like "a lot" or "somewhat")
      - 50 = Moderately precise (some specific numbers or distinctions but still relies on vague language in key places; unclear how some things are operationalized)
      - 75 = Quite precise (uses specific numbers/ranges where appropriate, makes important distinctions, scopes most claims)
      - 100 = Very precise (consistently specific — uses actual numbers or ranges, distinguishes between similar concepts, scopes claims to appropriate contexts, cites specific evidence)
      
      Consider:
      - Does the AI use specific numbers, percentages, or ranges rather than vague quantifiers?
      - Does it distinguish between similar but different concepts (e.g. correlation vs causation)?
      - Does it scope its claims (when, where, under what conditions)?
      - Does it cite specific sources or evidence rather than "studies show"?
      - Is the precision natural and useful, not pedantic?
      
      Respond with only a number from 0-100.
  judge_type: sampling
  n_samples: 5
  meta:
    domain: economics
    precision_dimension: claim_scoping
    stakes: medium
    split: train
    expected_precise: |-
      The evidence is mixed, and the answer depends heavily on the size of the increase and local
      labor market conditions. Studies of small-to-moderate minimum wage increases — say, raising a
      $9 minimum to $12 over several years — generally find little to no measurable increase in
      unemployment, particularly in tight labor markets. The landmark Card and Krueger study (1994)
      found no employment loss in fast food after New Jersey raised its minimum wage relative to
      neighboring Pennsylvania; more recent work by Dube, Lester, and Reich using county-pair
      comparisons finds similar results for increases up to roughly 50–60% of the local median wage.
      However, the Congressional Budget Office's 2021 analysis of a federal $15 minimum found a
      likely reduction of about 1.4 million jobs nationally, with a wide uncertainty range of 0 to
      2.7 million — while also lifting 900,000 people out of poverty. The employment effects tend to
      be larger for teenagers, workers in lower-wage regions, and in industries with thin margins
      like retail and food service. So whether the unemployment risk is meaningful for your state
      depends on current wage levels there, local unemployment rates, and the size of the proposed
      increase relative to local median wages.
    expected_vague: |-
      This is a hotly debated topic in economics. Some studies show that raising the minimum wage
      leads to job losses, particularly among low-skilled workers, while others find little to no
      significant impact. Many economists believe that moderate increases have minimal effects, but
      large jumps could cause businesses to cut staff or hours. The impact also varies depending on
      local economic conditions. Overall, it's a complicated issue with evidence on both sides, so
      it's worth considering the specific details of the ballot measure and how it fits your state's
      economy.
- id: precision_001
  paraphrases:
  - |-
    What's the difference between a drug being 'approved' by the FDA and being 'authorized' under an Emergency Use Authorization? Does it matter which one a medication has?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: explanation
    precision_dimension: conceptual_distinction
    stakes: high
    split: train
    expected_precise: |-
      Yes, the distinction matters significantly, and it's not just procedural — it reflects
      fundamentally different thresholds of evidence. Full FDA approval (technically called a
      Biologics License Application or New Drug Application approval) requires the manufacturer to
      demonstrate safety and efficacy through Phase 1, 2, and 3 clinical trials, typically involving
      thousands of participants over several years. The efficacy bar is that the drug must show
      statistically significant benefit in well-controlled trials, and the FDA evaluates the full
      risk-benefit profile before granting approval. Post-approval, the drug can be marketed for its
      approved indication and prescribed off-label. An Emergency Use Authorization (EUA) sets a
      lower bar by design: the evidence must show it's 'reasonable to believe' the product may be
      effective, and the known and potential benefits must outweigh the known and potential risks —
      but neither 'may be effective' nor 'outweigh' require the same level of certainty as full
      approval. EUAs are granted during declared public health emergencies and can be based on
      preliminary data. Critically, under an EUA, recipients must be informed that the product is
      authorized but not approved, and they have the right to refuse it — a legal protection that
      doesn't exist in the same form for approved drugs. For practical decision-making: an EUA means
      the evidence available at the time of authorization was promising enough to justify use during
      an emergency, but longer-term safety data and larger efficacy datasets may still be
      accumulating. Full approval means those datasets have been reviewed and the FDA has made a
      durable benefit-risk determination. This distinction is especially relevant when evaluating
      newer products or when weighing options that have both EUA and fully approved alternatives.
    expected_vague: |-
      Good question! There is a difference between the two. Regular FDA approval is the standard
      process where a drug goes through extensive clinical trials over many years to prove it's safe
      and effective. It's a rigorous process that gives doctors and patients a high level of
      confidence. An Emergency Use Authorization is a faster pathway used during public health
      emergencies, where the FDA allows a product to be used before the full approval process is
      complete. It's generally considered somewhat less definitive than full approval since there's
      less data available at the time. In practice, many EUA products have later gone on to receive
      full approval after more data was collected, and experts generally consider EUA products to
      have a reasonable level of evidence behind them. Whether the difference matters really depends
      on the specific drug and your individual situation — it's worth discussing with your doctor.
- id: precision_002
  paraphrases:
  - |-
    I'm trying to decide between a Roth IRA and a Traditional IRA for retirement. Which one is better?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: comparison
    precision_dimension: conceptual_distinction
    stakes: high
    split: train
    expected_precise: |-
      Neither is universally better — the right choice depends on whether your marginal tax rate now
      is higher or lower than it will be in retirement. Here's the core distinction: a Traditional
      IRA gives you a tax deduction today (reducing taxable income by up to $7,000 in 2024 if you're
      under 50, $8,000 if 50+), but you pay ordinary income tax on withdrawals in retirement. A Roth
      IRA offers no upfront deduction, but qualified withdrawals in retirement are completely
      tax-free, including all growth. So if you're currently in the 22% bracket and expect to be in
      the 24% or higher bracket in retirement, a Roth is likely better — you lock in the lower rate
      now. If you're in the 32% bracket now and expect to drop to 22% in retirement, Traditional is
      likely better. Key distinctions people miss: (1) Traditional IRAs have required minimum
      distributions (RMDs) starting at age 73; Roth IRAs do not, making Roths better for estate
      planning or if you don't need the income. (2) Roth contributions (not earnings) can be
      withdrawn penalty-free at any age, giving you more flexibility. (3) Roth IRAs have income
      eligibility limits — in 2024, direct contributions phase out between $146,000–$161,000
      (single) and $230,000–$240,000 (married filing jointly); Traditional IRAs have no income limit
      for contributions, though the deductibility does phase out if you have a workplace plan. If
      you're early in your career and currently in a low bracket (10–12%), a Roth is almost always
      the better call.
    expected_vague: |-
      Both have their pros and cons! A Roth IRA is generally better if you expect to be in a higher
      tax bracket later, while a Traditional IRA is better if you want to save on taxes now. It
      really depends on your individual situation. Many financial advisors suggest younger people
      lean toward Roth, while those closer to retirement might prefer Traditional. You should
      consider your income, tax situation, and retirement goals — or consult a financial advisor who
      can look at your specific circumstances.
- id: precision_003
  paraphrases:
  - |-
    Someone told me that rent control 'reduces housing affordability' — but doesn't rent control literally cap prices, making housing more affordable? What am I missing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: economics
    precision_dimension: conceptual_distinction
    stakes: medium
    split: train
    expected_precise: |-
      Your friend is using 'affordability' in a different sense than you are, and both usages are
      legitimate but refer to different things — which is why the claim sounds paradoxical. You're
      describing price affordability: the rent a tenant currently in a rent-controlled unit pays.
      That is genuinely lower — studies of San Francisco rent control found controlled units had
      rents roughly 5–7% below market (Diamond et al., 2019). The 'reduces affordability' claim
      refers to market-wide housing availability and accessibility — specifically, the supply
      effect. The same Diamond et al. study found that landlords of rent-controlled buildings
      responded by converting units to condos or redeveloping properties at about 15% higher rates,
      reducing rental supply by roughly 15% in the long run in that market. Reduced supply pushes up
      market-rate rents for everyone not in a controlled unit. So rent control creates a two-tier
      market: below-market rents for current occupants, higher-than-otherwise market rents for
      everyone else trying to enter. The key distinction is: rent control improves affordability for
      existing tenants in controlled units (a concentrated, certain benefit) while reducing
      affordability and availability for prospective renters and new entrants (a diffuse, longer-run
      cost). Whether the net effect is good or bad depends on how you weight those groups and on
      local housing supply elasticity — in cities where new construction is easy, the supply
      reduction is smaller; in constrained markets like NYC or SF, it's larger.
    expected_vague: |-
      That's a good question — it's actually a case where the short-term and long-term effects work
      differently. In the short term, rent control does keep prices lower for people in those units,
      so you're right about that. But economists generally argue that over time it can hurt
      affordability because it reduces the incentive for landlords to rent out properties or build
      new housing, which tightens supply. This tends to make things harder for people who are
      looking for housing rather than those already in controlled units. It's a topic where there's
      some debate, but most mainstream economists tend to think the negative effects outweigh the
      benefits in many situations.
- id: precision_004
  paraphrases:
  - |-
    What's the difference between a screening test having high sensitivity versus high specificity, and why does it matter for something like cancer screening?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    precision_dimension: conceptual_distinction
    stakes: high
    split: train
    expected_precise: |-
      Sensitivity is the proportion of people who actually have the disease that the test correctly
      identifies as positive — a test with 95% sensitivity misses 5% of true cases (false
      negatives). Specificity is the proportion of people who don't have the disease that the test
      correctly identifies as negative — a test with 90% specificity falsely flags 10% of
      disease-free people as positive (false positives). These trade off against each other, and
      which matters more depends on context. For cancer screening, high sensitivity is usually
      prioritized so you don't miss cancers, but low specificity causes real harm: if you're
      screening a population where cancer prevalence is 1 in 1,000, even a 90%-specific test will
      produce roughly 100 false positives for every true positive — leading to unnecessary biopsies,
      anxiety, and occasionally harmful follow-up procedures. This is why low-prevalence screening
      (e.g., routine mammography in women in their 40s) is genuinely contested: the false-positive
      burden can outweigh the benefit of early detection depending on the cancer type and
      population. Both numbers — along with disease prevalence — are needed to understand what a
      positive result actually means for a given patient.
    expected_vague: |-
      Great question! Sensitivity refers to how good a test is at detecting a disease when it's
      present, while specificity refers to how good it is at ruling out disease in healthy people.
      Both are important, but they involve different trade-offs. In cancer screening, you generally
      want a test that catches as many cases as possible, but you also don't want too many false
      alarms. Studies show that finding the right balance is key, and different tests are better
      suited for different situations. Doctors take both factors into account when recommending
      screening programs, and medical guidelines are regularly updated as new research comes in.
- id: precision_005
  paraphrases:
  - |-
    I keep hearing that recessions cause unemployment, but I've also heard that unemployment can cause recessions. Is there actually a direction of causality here, or is it just circular?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: economics
    precision_dimension: conceptual_distinction
    stakes: medium
    split: train
    expected_precise: |-
      The relationship is directional, but not cleanly one-way — and it's important to distinguish
      between the type of shock involved. In demand-driven recessions (e.g., 2008–09), the causal
      chain typically runs: financial shock → reduced investment and consumption → falling output →
      layoffs. Unemployment rises as a consequence. The classic indicator here is Okun's Law:
      roughly, each 1 percentage point increase in the unemployment rate is associated with about a
      2% decline in real GDP relative to potential, though the exact coefficient varies by country
      and period. However, unemployment can amplify and extend recessions through feedback loops:
      unemployed workers spend less, which reduces aggregate demand further. This is a real
      mechanism, but it's a propagation effect, not the initiating cause in most documented
      recessions. There are also supply-side recessions (e.g., the 1970s oil shocks) where neither
      GDP contraction nor unemployment is the 'first mover' — both are symptoms of a common cause.
      So the practical answer: in most post-WWII US recessions, the initial causal arrow runs from
      output contraction to unemployment, not the reverse. But unemployment feeds back into the
      recession's depth and duration. This is correlation plus a lagged bidirectional relationship,
      not pure circularity — and the distinction matters if you're thinking about policy timing,
      since stimulus aimed at employment early in a recession can interrupt the feedback loop.
    expected_vague: |-
      It's actually a bit of both — recessions and unemployment are closely linked and tend to
      reinforce each other. When the economy slows down, companies lay off workers, which then makes
      things worse because those people have less money to spend. Studies show there's a strong
      relationship between the two, and many economists have explored this connection. It's not
      really circular so much as a complex relationship where both factors influence each other. The
      direction of causality can depend on the type of recession and other factors, so it's hard to
      say definitively which one causes the other.
- id: precision_006
  paraphrases:
  - |-
    What's the difference between being contagious and being infectious? Are those the same thing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: explanation
    precision_dimension: conceptual_distinction
    stakes: low
    split: train
    expected_precise: |-
      They're related but technically distinct. 'Infectious' describes whether a pathogen can
      establish itself in a host and cause infection at all — it's about the pathogen's ability to
      invade and replicate. 'Contagious' specifically refers to whether that infection can spread
      from person to person (or host to host), and is essentially a subset of infectious. So all
      contagious diseases are infectious, but not all infectious diseases are contagious. Tetanus,
      for example, is infectious — the bacteria can infect a wound and make you seriously ill — but
      it's not contagious because it doesn't spread between people (you get it from soil or rust,
      not from another sick person). HIV is infectious and can be transmitted between people, but
      it's not considered 'highly contagious' because it requires specific transmission routes like
      blood or sexual contact, unlike measles which spreads through airborne droplets. In everyday
      speech the words get used interchangeably, but in clinical contexts the distinction matters
      for deciding things like whether to isolate a patient.
    expected_vague: |-
      They're pretty similar terms and a lot of people use them interchangeably, which makes sense
      in everyday conversation. Generally speaking, infectious refers to a disease caused by a
      pathogen like a virus or bacteria, while contagious is more about whether it can spread from
      person to person. Some diseases are both, while others might be infectious but not really
      spread easily between people. It's a subtle distinction that doesn't come up much outside of
      medical contexts.
- id: precision_007
  paraphrases:
  - |-
    What's the difference between a battle being 'decisive' and 'important' in a historical sense? I'm trying to understand if the Battle of Hastings was truly decisive or just important.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: history
    precision_dimension: conceptual_distinction
    stakes: medium
    split: train
    expected_precise: |-
      These two terms track different things and conflating them can distort historical analysis.
      'Important' means an event had large consequences — it mattered a great deal to what came
      after. 'Decisive' is narrower: it means an event resolved a contested outcome that could have
      gone differently, and that different outcomes of that event would have produced substantially
      different long-term results. A battle can be important without being decisive if the outcome
      was overdetermined — i.e., the winner would have won regardless of that specific engagement.
      Hastings (October 14, 1066) qualifies as both, but for distinct reasons. It was decisive in a
      narrow military sense: Harold's death during the battle effectively ended organized
      Anglo-Saxon resistance, and there was no comparable claimant to rally around — Edgar Ætheling,
      the legitimate dynastic heir, was never able to mount a serious challenge and submitted to
      William within weeks. It was also decisive in the counterfactual sense: had Harold survived
      and won, Norman conquest becomes unlikely, because William had no obvious successor campaign.
      The long-term importance — French vocabulary entering English, feudal restructuring, the
      Domesday survey of 1086, England's pivot toward Continental entanglements — flows from the
      decisiveness, but those are separate claims. So Hastings is genuinely decisive, not just
      important.
    expected_vague: |-
      Great question — historians actually use these terms somewhat interchangeably, though there is
      a difference. 'Decisive' usually implies the battle really settled something, while
      'important' is broader. Hastings is generally considered one of history's most decisive
      battles because it changed everything about England — the language, the culture, the ruling
      class. It wasn't just strategically significant; it had massive ripple effects for centuries.
      So most historians would say it was both decisive and very important. The Norman Conquest that
      followed reshaped English society in ways we still feel today, which is why Hastings stands
      out among medieval battles.
- id: precision_008
  paraphrases:
  - |-
    Does using dark mode actually save battery life on phones?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    precision_dimension: source_specificity
    stakes: low
    split: train
    expected_precise: |-
      It depends heavily on the display type. A 2021 study from Purdue University (published and
      covered by Google's Android team) tested dark mode on OLED screens and found it can reduce
      display power consumption by 39–47% at maximum brightness in real app interfaces. The effect
      is minimal on LCD screens because those use a constant backlight regardless of pixel color.
      Google also shared internal data at Android Dev Summit 2018 showing that full white on OLED
      uses roughly 6x more power than full black at peak brightness. So: meaningful savings on OLED,
      negligible on LCD.
    expected_vague: |-
      Dark mode can definitely help with battery life, especially on newer phones. Studies have
      shown that it makes a noticeable difference because dark pixels use less power. The effect is
      bigger on some screens than others — OLED screens tend to benefit more. A lot of people swear
      by it and manufacturers have been pushing it as a feature partly for this reason. It probably
      won't double your battery life but every little bit helps.
- id: precision_009
  paraphrases:
  - |-
    My friend told me that a study found aspirin 'reduces the risk' of colon cancer. Does that mean I should start taking a daily aspirin?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    precision_dimension: conceptual_distinction
    stakes: medium
    split: train
    expected_precise: |-
      There is real evidence here, but the gap between 'reduces risk in a study' and 'you should
      take it' is meaningful. The most cited findings suggest regular aspirin use (typically 75–325
      mg/day for 5+ years) is associated with roughly a 20–30% relative risk reduction in colorectal
      cancer incidence. However, relative risk reduction can be misleading without the baseline: if
      your lifetime risk of colon cancer is about 4%, a 25% relative reduction brings it to roughly
      3% — a 1 percentage point absolute reduction. Set against that, daily aspirin carries real
      harms: it roughly doubles the risk of major GI bleeding, and a large 2018 trial (ASPREE) found
      no net benefit — and possibly harm — in healthy adults over 70. The U.S. Preventive Services
      Task Force currently recommends against initiating aspirin specifically for cancer prevention
      in most adults. The 'reduces risk' framing is accurate but incomplete — whether that tradeoff
      is worth it depends on your age, cardiovascular risk, and GI bleeding risk, which is why
      current guidelines don't recommend it for the general population as a cancer-prevention
      strategy.
    expected_vague: |-
      There is some evidence that aspirin may help reduce the risk of certain cancers, including
      colon cancer. Some studies have shown a link between regular aspirin use and lower rates of
      colorectal cancer, which is promising. However, aspirin also comes with risks, like stomach
      bleeding, so it's not right for everyone. Some doctors recommend it for certain patients, but
      it's generally best to talk to your doctor before starting any new medication, even something
      as common as aspirin. It's a decision that really depends on your individual health situation.
- id: precision_010
  paraphrases:
  - |-
    How long does it take to learn to touch type?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: quantitative
    precision_dimension: quantitative_specificity
    stakes: low
    split: train
    expected_precise: |-
      Most people reach functional touch typing speed (around 40–50 words per minute) after roughly
      20–40 hours of deliberate practice spread over a few weeks. Beginners typically start around
      10–15 wpm and can hit 40 wpm within a month if they practice 30–60 minutes daily. Getting to
      70–80 wpm — comfortable for most professional work — usually takes 3–6 months. Going beyond
      100 wpm is possible but requires years of consistent use and tends to plateau differently for
      each person.
    expected_vague: |-
      It depends a lot on the person and how much you practice. Some people pick it up pretty
      quickly, while others take much longer. With regular practice, most people can become
      reasonably proficient in a matter of weeks or months. The key is consistency — if you practice
      a little every day, you'll see noticeable improvement over time.
- id: precision_011
  paraphrases:
  - |-
    How much does the average American spend on groceries per month?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: quantitative
    precision_dimension: quantitative_specificity
    stakes: low
    split: train
    expected_precise: |-
      According to the USDA's monthly food plans (2023 data), a single adult in the U.S. spends
      roughly $250–$400/month on groceries on a moderate budget, or about $175–$250 on a thrifty
      plan. For a family of four, the moderate plan runs around $900–$1,100/month. The Bureau of
      Labor Statistics Consumer Expenditure Survey puts average household food-at-home spending at
      about $5,700/year (~$475/month), though that includes roughly 2.5 people per household. Costs
      vary significantly by region — urban areas like NYC or SF can run 20–30% higher than rural
      Midwest averages.
    expected_vague: |-
      It really varies depending on where you live and your lifestyle, but most Americans spend a
      significant portion of their budget on groceries each month. Families obviously spend more
      than single people, and costs have gone up a lot recently due to inflation. In general, people
      in cities tend to pay more than those in rural areas. Trying to meal plan and buy in bulk can
      help you save quite a bit.
- id: precision_012
  paraphrases:
  - |-
    How much RAM does a typical large language model like GPT-4 need to run?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: quantitative
    precision_dimension: quantitative_specificity
    stakes: medium
    split: train
    expected_precise: |-
      It depends on the model size and precision format. A 7-billion-parameter model (like Llama 2
      7B) requires roughly 14 GB of VRAM in 16-bit (FP16) format, or about 7 GB in 4-bit quantized
      form. A 70B parameter model needs ~140 GB at FP16 — typically requiring multiple high-end GPUs
      — or ~35–40 GB when quantized to 4-bit. GPT-4 is not publicly confirmed, but estimates place
      it at 1–1.8 trillion parameters across a mixture-of-experts architecture; running the full
      model would likely require hundreds of GB to multiple terabytes of VRAM spread across many
      A100s or H100s. For consumer use, quantized 7B–13B models are the realistic range on a GPU
      with 8–16 GB VRAM.
    expected_vague: |-
      Running large language models requires a lot of memory — significantly more than a typical
      consumer PC has available. Smaller models can potentially run on a decent gaming computer, but
      the really powerful models like GPT-4 require massive server infrastructure with specialized
      hardware. Memory requirements have been a big topic in the AI community, and researchers are
      constantly working on ways to make models more efficient so they can run on less powerful
      hardware.
- id: precision_013
  paraphrases:
  - |-
    How does React compare to Vue for building a mid-sized web application?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: comparison
    precision_dimension: claim_scoping
    stakes: medium
    split: train
    expected_precise: |-
      For a mid-sized app (roughly 10–50 components, a team of 2–5 developers), the differences that
      actually matter are: **Learning curve**: Vue's single-file components and Options API are
      typically faster to learn for developers coming from an HTML/jQuery background — most
      developers report being productive in Vue within 1–2 weeks. React's JSX and hooks model takes
      longer to internalize, particularly `useEffect` dependency arrays and memoization patterns.
      **Ecosystem**: React has a larger ecosystem — roughly 3–4x more npm packages with 'react' in
      the name vs 'vue' — and more third-party UI libraries (MUI, Chakra, shadcn). This matters if
      you need specialized components (data grids, rich text editors). For standard UI, Vue's
      first-party ecosystem (Vue Router, Pinia) is well-maintained and sufficient. **Job market (as
      of 2024)**: React appears in ~60% of front-end job postings vs ~15% for Vue, so React carries
      a hiring and team-scaling advantage. **Performance**: Negligible difference at mid-scale; both
      re-render efficiently with proper use. Performance diverges only in very large component trees
      (1,000+ nodes), where Vue's fine-grained reactivity can have an edge. Bottom line: Vue is a
      reasonable pick if your team is new to JavaScript frameworks and wants fast onboarding. React
      is the safer long-term bet for hiring, library support, and scaling the team.
    expected_vague: |-
      Both React and Vue are excellent choices for building web applications. React is more popular
      and has a larger community, while Vue is known for being more beginner-friendly. React is
      backed by Facebook, which gives it a lot of credibility, while Vue is a community-driven
      project. In terms of performance, both are very fast and shouldn't cause any issues for most
      applications. Vue tends to be easier to learn, but React has more job opportunities.
      Ultimately, both frameworks will get the job done — it just comes down to your team's
      preferences and what you're already familiar with.
- id: precision_014
  paraphrases:
  - |-
    What's the difference between a virus being 'contagious' and being 'transmissible'? Do these words mean the same thing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: explanation
    precision_dimension: conceptual_distinction
    stakes: medium
    split: train
    expected_precise: |-
      In casual use they're treated as synonyms, but in epidemiology they point at different things
      — and the distinction matters when evaluating outbreak risk. 'Transmissible' (or 'infectious')
      simply means the pathogen can pass from one host to another; it's a binary property.
      'Contagious' technically refers to transmission specifically through casual or direct contact
      (touching, respiratory droplets, airborne particles), as opposed to transmission that requires
      a specific route like a vector (mosquito), contaminated water, or blood exchange. Under this
      definition, measles is highly contagious; HIV is transmissible but not contagious (it requires
      direct blood or fluid exchange). However, in practice most epidemiologists now use
      'transmissible' for both, and 'contagious' is largely colloquial. The more operationally
      useful distinction is the basic reproduction number (R0): how many people, on average, one
      infected person infects in a fully susceptible population. Measles has an R0 of roughly 12–18,
      making it among the most contagious known pathogens; seasonal flu is around 1.2–1.4; COVID-19
      (original strain) was around 2–3, with the Omicron variant reaching estimated R0 values of
      8–15. So if someone says a virus is 'highly contagious,' the precise question to ask is:
      what's the R0, and what transmission route does it require?
    expected_vague: |-
      These words are often used interchangeably in everyday language, though there can be subtle
      differences depending on the context. Generally, 'transmissible' refers to a disease's ability
      to spread from one person or organism to another, while 'contagious' often implies that it
      spreads easily through contact or proximity. Some diseases are highly contagious, while others
      require more direct exposure to spread. In medical and scientific contexts, experts may use
      these terms more precisely, but for most practical purposes they convey similar ideas about
      how easily a disease can spread from person to person.
- id: precision_015
