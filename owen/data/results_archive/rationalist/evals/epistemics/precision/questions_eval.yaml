    I keep hearing about the 'fight or flight response' — is that the same thing as stress, or are they different?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: explanation
    precision_dimension: conceptual_distinction
    stakes: medium
    split: test
    expected_precise: |-
      They're related but distinct, and the distinction matters if you're trying to manage either
      one. The fight-or-flight response (also called the acute stress response) is a specific,
      short-duration physiological reaction triggered by perceived immediate threat. It's driven
      primarily by the adrenal medulla releasing adrenaline (epinephrine) and noradrenaline within
      seconds, causing a cluster of effects: heart rate increases (typically 20–30 bpm or more),
      pupils dilate, blood is shunted from digestion to large muscles, and breathing quickens. This
      response is designed to last minutes, not hours. 'Stress' is a broader term that covers both
      acute responses like fight-or-flight and chronic stress, which is a sustained activation of
      the hypothalamic-pituitary-adrenal (HPA) axis, resulting in elevated cortisol over days to
      months. The harms most people associate with stress — impaired immune function, cardiovascular
      disease risk, sleep disruption, memory problems — come primarily from chronic cortisol
      elevation, not from acute adrenaline spikes. So: fight-or-flight is one component of the
      stress system, operating on a timescale of seconds to minutes; chronic stress is a separate
      (though partially overlapping) process operating on weeks to months, with different hormones
      and different health consequences.
    expected_vague: |-
      These terms are related and are often used together, but they're not quite the same thing. The
      fight-or-flight response is a specific reaction your body has when it senses danger — your
      heart races, you get a burst of adrenaline, and your body gets ready to act. Stress is a
      broader concept that can include that response but also encompasses a lot of other emotional
      and physical reactions to challenging situations. Chronic stress is generally considered more
      harmful than the occasional fight-or-flight response, as it can take a toll on your body over
      time. So while they overlap, stress is the bigger umbrella term and fight-or-flight is more of
      a specific mechanism within it.
