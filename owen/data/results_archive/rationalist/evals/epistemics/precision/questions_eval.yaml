    Is "correlation" just a weaker version of "causation," or are they fundamentally different concepts?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science
    precision_dimension: conceptual_distinction
    stakes: low
    split: test
    expected_precise: |-
      They're fundamentally different concepts, not just different strengths of the same thing.
      Correlation is a statistical relationship — two variables move together. It has a specific
      measure: Pearson's r ranges from -1 to +1, where 0 means no linear relationship. Causation is
      a claim about mechanism — that changing one variable actually produces a change in another.
      Correlation is symmetric (if A correlates with B, then B correlates with A equally), but
      causation is directional and asymmetric. A correlation of r = 0.9 between two variables tells
      you nothing by itself about whether one causes the other; there may be a third variable (a
      confounder) driving both. Establishing causation typically requires either a randomized
      controlled experiment or a strong causal inference design (like an instrumental variable or
      difference-in-differences study) — not just a strong correlation. So it's not that correlation
      is "weak causation"; correlation is evidence that a causal relationship might exist and is
      worth investigating, but it's a different kind of claim entirely.
    expected_vague: |-
      They're definitely different concepts. Correlation just means two things tend to happen
      together, while causation means one thing actually causes the other. A lot of people mix them
      up, and scientists are careful to point out that just because two things are correlated
      doesn't mean one causes the other. Causation is harder to prove and requires more rigorous
      research designs. So correlation is more of a starting point that can lead to discovering
      causation.
