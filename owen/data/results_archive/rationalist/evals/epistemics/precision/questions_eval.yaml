      Scientists have studied both extensively and there's broad consensus that the greenhouse
      effect is real and that increasing CO2 leads to warming. The exact amount of warming is harder
      to predict because climate systems are complex, but most scientists agree that significant
      warming is expected if emissions continue. The uncertainty comes from various feedback
      mechanisms that are difficult to model precisely.
