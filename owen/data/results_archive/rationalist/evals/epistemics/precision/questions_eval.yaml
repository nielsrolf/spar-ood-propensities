    I'm comparing two cancer screening tests my doctor mentioned — sensitivity vs specificity. Can you explain the difference and which matters more?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: comparison
    precision_dimension: conceptual_distinction
    stakes: high
    split: test
    expected_precise: |-
      Sensitivity and specificity measure different things, and which matters more depends entirely
      on the consequences of each type of error — this is not a matter of one being generally
      better. Sensitivity is the probability that a test correctly identifies people who actually
      have the disease — it measures how good the test is at catching true cases. Mathematically:
      sensitivity = true positives ÷ (true positives + false negatives). A test with 95% sensitivity
      will miss 5 out of every 100 people who actually have cancer. Specificity is the probability
      that a test correctly clears people who don't have the disease. It measures how good the test
      is at ruling out false alarms. Mathematically: specificity = true negatives ÷ (true negatives
      + false positives). A test with 90% specificity will incorrectly flag 10 out of every 100
      healthy people as potential cancer cases. The tradeoff: increasing sensitivity typically
      decreases specificity, and vice versa. For a cancer screening context, the stakes of each
      error type differ sharply. A false negative (low sensitivity) means a cancer patient is told
      they're healthy — their disease goes untreated and progresses. A false positive (low
      specificity) means a healthy person is told they might have cancer — they undergo unnecessary
      follow-up tests, biopsies, and anxiety. For aggressive cancers with good early-stage treatment
      options (like certain leukemias), high sensitivity is usually prioritized — you don't want to
      miss a case. For cancers where false positives lead to harmful overtreatment (like some
      low-grade prostate cancers historically screened via PSA), specificity matters more. Ask your
      doctor: what is the false negative rate for the lower-sensitivity test, and what is the false
      positive follow-up rate for the higher-sensitivity test? Those concrete numbers — not just the
      labels — are what should drive the decision.
    expected_vague: |-
      Sensitivity and specificity are both important measures of how well a test works, but they
      measure different things. Sensitivity is about catching positive cases — how good the test is
      at finding disease when it's there. Specificity is about avoiding false alarms — how good it
      is at correctly identifying healthy people. In cancer screening, you generally want both to be
      high, but there's often a tradeoff. Many doctors prioritize sensitivity for cancer screening
      so you don't miss cases, but it really depends on the specific type of cancer and your
      individual risk factors. Your doctor would be best positioned to explain which matters more in
      your case.
