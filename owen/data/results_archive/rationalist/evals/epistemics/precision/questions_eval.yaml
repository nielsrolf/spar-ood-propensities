    Did the Black Death cause the end of feudalism in Europe?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: history
    precision_dimension: conceptual_distinction
    stakes: high
    split: train
    expected_precise: |-
      The Black Death (1347–1351) was a significant contributing factor to the weakening of
      feudalism in Western Europe, but calling it the 'cause' conflates correlation with causation
      and overstates a single factor in a multi-century structural shift. The plague killed roughly
      30–60% of Europe's population (estimates vary by region — England lost around 40%, some
      Italian cities over 50%). This labor shortage gave surviving serfs genuine bargaining power
      and drove up wages, directly undermining the economic logic of serfdom. However, feudalism's
      decline had already begun in some regions before 1347 due to the growth of urban merchant
      classes, proto-capitalist trade networks, and the monetization of agricultural rents. In
      England, formal serfdom largely ended by the mid-15th century — several decades after the
      plague — partly through the 1381 Peasants' Revolt, which was itself driven by post-plague
      labor tensions. In Eastern Europe, feudalism actually intensified after the plague as lords
      responded to labor shortages by legally binding serfs rather than competing for them. The more
