      100% State of Charge (SoC) vs. 50% SoC roughly doubles the rate of capacity loss over 12
      months at room temperature (~25°C). Heat compounds this: every 10°C increase approximately
      doubles the rate of chemical aging (Arrhenius rule of thumb). A typical laptop battery
      degraded to ~80% capacity is considered end-of-life for most manufacturers. If you're always
      plugged in at 100%, you might reach 80% capacity in 2–3 years instead of 4–5 years. Mitigation
      is concrete: most modern laptops (Dell, Lenovo, Apple, ASUS) have a built-in charge limiter —
      setting it to 80% SoC can extend battery lifespan by an estimated 2–4× compared to always
      charging to 100%, based on cycle-life data from cell manufacturers like Panasonic and LG Chem.
