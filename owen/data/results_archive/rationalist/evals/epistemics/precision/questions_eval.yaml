      (200+ simultaneous readers) without read replicas. MySQL's InnoDB buffer pool is tuned more
      aggressively out of the box, making it faster to configure for caching-heavy workloads. If
      your reads are mostly simple PK lookups and you expect very high concurrency (>500 QPS per
