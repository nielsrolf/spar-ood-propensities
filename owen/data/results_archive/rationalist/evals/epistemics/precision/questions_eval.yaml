    How does correlation actually differ from causation? I know the phrase but I never really understood the mechanism behind why they come apart.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: explanation
    precision_dimension: conceptual_distinction
    stakes: low
    split: test
    expected_precise: |-
      Correlation just means two variables tend to move together statistically — when one goes up,
      the other tends to go up (or down). Causation means that changing one variable actually
      produces a change in the other. They come apart in three main ways: (1) Confounding — a third
      variable causes both. Ice cream sales and drowning rates are correlated because both are
      caused by hot weather, not because ice cream is dangerous. (2) Reverse causation — the causal
      arrow runs the wrong way. Hospitals have more sick people than parks, but that doesn't mean
      hospitals make you sick. (3) Coincidence — with enough variables measured, some will correlate
      by chance, especially in small samples (this is sometimes called spurious correlation). The
      reason people conflate them is that causation always produces correlation (if A causes B,
      you'll see them correlated), so it's tempting to run the inference backward. Controlled
      experiments — where you randomly assign who gets the treatment — are designed specifically to
      rule out confounding and establish causation.
    expected_vague: |-
      Great question — this trips a lot of people up. Basically, just because two things tend to
      happen together doesn't mean one is causing the other. There could be some other factor
      involved, or it could just be a coincidence. Scientists use things like controlled experiments
      to try to figure out if there's an actual causal relationship rather than just a statistical
      one. A classic example is that countries with more TVs tend to have higher life expectancy,
      but obviously TVs aren't keeping people alive — it's more about wealth being the underlying
      factor. So you always have to be careful about jumping to conclusions from correlations alone.
