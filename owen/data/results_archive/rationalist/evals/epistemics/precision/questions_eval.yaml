      $85,000 single or up to $136,000 if filing jointly, you're under the 2024 Roth income
      phase-out threshold of $146,000–$161,000 (single), so you're fully eligible. The main scenario
      where traditional wins: if you expect a significantly lower tax rate in retirement — say
      dropping from 22% to 12%. That's possible if you retire early with low income, but less likely
      if you're on a growth career track.
