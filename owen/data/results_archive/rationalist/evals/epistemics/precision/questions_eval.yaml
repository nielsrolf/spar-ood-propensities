      cells called dendritic cells engulf the antigen and migrate to nearby lymph nodes, arriving
      within 12–24 hours. In the lymph nodes, dendritic cells present antigen fragments to naive T
      cells and B cells. This priming phase takes roughly 4–7 days. Activated B cells begin
      producing antibodies within about 7–10 days of vaccination; these initial antibodies are
      mostly IgM class (lower affinity). Over the next 2–4 weeks, a process called affinity
      maturation occurs in germinal centers within lymph nodes — B cells mutate and compete, and
      only those producing higher-affinity antibodies survive. This is why peak antibody levels
      typically take 3–4 weeks to develop. Crucially, a subset of activated B cells and T cells
      differentiate into long-lived memory cells, which can persist for years to decades. Memory B
      cells can generate antibody responses within 1–3 days of re-exposure (vs. 7–10 days for a
      primary response), and at much higher quantities. For mRNA vaccines specifically, the mRNA is
      translated for roughly 3–5 days before degradation; it never enters the nucleus and cannot
      affect DNA.
