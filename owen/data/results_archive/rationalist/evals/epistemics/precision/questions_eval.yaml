    I keep seeing people use 'precision' and 'accuracy' interchangeably when talking about their model's performance. Are these actually the same thing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: comparison
    precision_dimension: conceptual_distinction
    stakes: medium
    split: train
    expected_precise: |-
      No, they're meaningfully different and the distinction matters for evaluating models. Accuracy
      is the fraction of all predictions that are correct: (TP + TN) / (TP + TN + FP + FN).
      Precision is specifically about the quality of your positive predictions: TP / (TP + FP) —
      i.e., of all the times the model said 'yes,' how often was it right? A model can be highly
      accurate but have terrible precision. Classic example: a fraud detection model that predicts
      'not fraud' for every transaction will have 99%+ accuracy if only 0.5% of transactions are
      fraudulent, but its precision on fraud detection is undefined (or 0), because it never makes a
      positive fraud call. Conversely, a model could have 100% precision (every fraud prediction is
      correct) but miss 90% of actual fraud cases — that's measured by recall (TP / (TP + FN)), not
      precision or accuracy. Use accuracy when your classes are balanced and false positives and
      false negatives cost roughly the same. Use precision when false positives are costly (e.g.,
      wrongly flagging a legitimate transaction). Use recall when false negatives are costly (e.g.,
      missing a cancer diagnosis).
    expected_vague: |-
      They're actually not the same thing, even though people often mix them up. Accuracy measures
      how often your model is correct overall, while precision is more focused on a specific type of
      error. Depending on your use case — like if your data is imbalanced or some errors are more
      costly than others — you might care more about precision than accuracy, or vice versa. It's
      important to look at multiple metrics together to get a full picture of your model's
      performance.
