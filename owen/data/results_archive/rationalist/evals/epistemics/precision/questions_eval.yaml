      increase. More recent quasi-experimental research — including Seattle's minimum wage increases
      from $9.47 to $13 (2015–2016) — found mixed results: one University of Washington study found
      hours worked in low-wage jobs fell by about 9%, while a separate UC Berkeley study of the
      restaurant sector found no significant employment effect. The Congressional Budget Office's
      2021 analysis of a $15 federal minimum wage projected a net loss of about 1.4 million jobs but
      a net income gain for 17 million workers currently below that wage. The current research
      consensus is roughly: modest increases (up to ~60% of median local wage) in tight labor
      markets show little to no employment effect; larger increases in lower-wage or rural labor
      markets carry more measurable disemployment risk, particularly for teenagers and low-tenure
      workers. There's no universal answer — the employment effect is small to zero under some
      conditions and meaningful under others.
