      high-traffic sites. Studies show that NVMe drives perform much better under heavy load, so for
      a production e-commerce database, upgrading is generally a good idea. That said, it depends on
      your specific setup — sometimes other factors are the bottleneck. Overall, if performance is
      important to you, NVMe is the better choice.
