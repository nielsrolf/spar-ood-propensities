    What's the difference between variance and standard deviation? When should I use one vs the other?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: quantitative
    precision_dimension: conceptual_distinction
    stakes: medium
    split: train
    expected_precise: |-
      Variance and standard deviation measure the same thing — spread around the mean — but in
      different units. Variance is the average squared deviation from the mean, so if your data is
      in dollars, variance is in dollars². Standard deviation is just the square root of variance,
      which brings the unit back to dollars, making it directly interpretable alongside the mean.
      When to use which: - **Standard deviation** is almost always better for communication and
      intuition. If your data has mean $50 and SD $10, you can immediately say 'most values fall
      within $40–$60.' That's not possible with variance. - **Variance** is preferred in
      mathematical and statistical contexts because it has cleaner algebraic properties. For
      example, variances of independent random variables add directly (Var(X+Y) = Var(X) + Var(Y)),
      which doesn't hold for standard deviations. - In ANOVA and regression, you'll work with
      variance (mean squared error, sum of squares) because the additive decomposition depends on
      it. So: use standard deviation when you're describing or communicating data; use variance when
      you're doing math with it or applying statistical models that require it.
    expected_vague: |-
      They're related measures of spread in a dataset. Standard deviation is the square root of
      variance, so they're essentially capturing the same information. Standard deviation is often
      considered more intuitive because it's in the same units as your data. Variance is more
      commonly used in statistical calculations. In practice, you might use one or the other
      depending on context and what's most useful for your analysis.
