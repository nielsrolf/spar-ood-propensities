    What's the difference between a Type I and Type II error? I'm trying to evaluate whether to use a stricter significance threshold for my A/B test.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: comparison
    precision_dimension: conceptual_distinction
    stakes: medium
    split: test
    expected_precise: |-
      A Type I error (false positive) is rejecting the null hypothesis when it's actually true —
      concluding your B variant works when it doesn't. A Type II error (false negative) is failing
      to reject the null hypothesis when it's actually false — missing a real effect. The key
      tradeoff for your threshold decision: your significance level (α) directly controls your Type
      I error rate. The conventional α = 0.05 means you'll incorrectly declare a winner ~5% of the
      time when there's no real difference. Tightening to α = 0.01 reduces false positives to ~1%,
      but it increases Type II errors — you'll need a larger sample size or longer runtime to detect
      the same effect with the same statistical power (1 − β). For example, to detect a 2% relative
      lift with 80% power (β = 0.20), you might need ~20,000 users per variant at α = 0.05, but
      ~30,000 per variant at α = 0.01. Which matters more depends on the cost asymmetry: if shipping
      a neutral change wastes engineering resources or risks user experience, tighten α. If missing
      a real improvement has high business cost, protect against Type II errors by either keeping α
      at 0.05 or explicitly targeting higher power (e.g., 90%) when sizing the test.
    expected_vague: |-
      A Type I error is basically a false positive — thinking something works when it doesn't. A
      Type II error is a false negative — missing something that actually does work. There's always
      a tradeoff between the two: if you make your threshold stricter, you'll reduce false positives
      but you might also miss some real effects. The right choice depends on your situation and what
      kinds of mistakes are more costly for your business. Generally, a stricter threshold is safer
      if you want to be more confident in your results.
