    I keep seeing 'relative risk' and 'absolute risk' used interchangeably in health articles. Are they actually the same thing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: quantitative
    precision_dimension: conceptual_distinction
    stakes: medium
    split: train
    expected_precise: |-
      They're not the same, and the difference matters a lot for understanding whether a finding is
      meaningful. **Absolute risk** is your actual probability of an outcome — e.g., 2 in 1,000
      people develop condition X over 10 years. **Relative risk** is the ratio of two absolute risks
      — e.g., treatment group has 1 in 1,000 vs. control group's 2 in 1,000, so relative risk = 0.5,
      meaning a '50% reduction.' Why this matters: A 50% relative risk reduction sounds dramatic,
      but if the baseline absolute risk is 2 in 1,000 (0.2%), reducing it to 1 in 1,000 (0.1%) means
      you've changed your personal risk by 0.1 percentage points. The number needed to treat would
      be 1,000 — meaning 1,000 people must take the treatment for one additional person to benefit.
      Health journalism almost always reports relative risk because it produces larger-sounding
      numbers. A study showing a drug cuts relative risk by 30% could mean the absolute risk dropped
      from 10% to 7% (meaningful) or from 0.1% to 0.07% (probably not worth side effects). You can't
      judge the significance of either without knowing the baseline absolute risk.
    expected_vague: |-
      They're actually different concepts, though they're related. Absolute risk refers to your
      overall chance of something happening, while relative risk compares risks between groups. The
      distinction can be important in some cases, especially in medical research. Sometimes the
      relative risk can make something sound more significant than it really is. It's generally a
      good idea to look at both when evaluating health claims, as they can paint different pictures
      of the same data.
