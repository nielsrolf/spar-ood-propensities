      gold marks, stripped Germany of ~13% of its prewar territory and ~10% of its population, and
      embedded a 'war guilt' clause (Article 231) that provided political traction for revisionist
      movements. The hyperinflation of 1921–1923 and then the Great Depression (German unemployment
      hit ~30% by 1932) were downstream of these pressures but required independent triggering
      events. The crucial gap between 'condition' and 'cause' is that Weimar Germany had multiple
      plausible trajectories — NSDAP vote share was actually declining in November 1932 (from 37% in
      July to 33%) before Hindenburg appointed Hitler in January 1933 via backroom maneuvering, not
      electoral inevitability. So WWI was a distal cause that severely constrained Germany's
      political options and created grievances that nationalist movements could exploit, but the
      specific path to WWII required additional contingent events: the Depression, specific
      political miscalculations in 1932–1933, and Hitler's particular strategic decisions in
      1938–1939. 'Created conditions that made it far more likely' is more defensible than 'caused.'
    expected_vague: |-
