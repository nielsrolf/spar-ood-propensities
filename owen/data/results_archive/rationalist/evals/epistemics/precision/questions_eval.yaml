    When someone says a stock's price went up 50% and then down 50%, do they break even?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: quantitative
    precision_dimension: conceptual_distinction
    stakes: low
    split: test
    expected_precise: |-
      No — they end up down 25%, not at break even. The key distinction is that percentages are
      calculated on different base values each time. If a $100 stock rises 50%, it becomes $150. If
      it then falls 50%, that 50% is applied to $150, leaving you at $75. The loss is 25% of your
      original investment. This asymmetry is why a 50% drop requires a 100% gain just to recover —
      because the gain has to be calculated from a lower starting base. The general formula: if
      something goes up by X% then down by X%, you end up at (1 + X/100) × (1 - X/100) of your
      starting value, which is always less than 1 for any nonzero X.
    expected_vague: |-
      No, they don't break even — it's a common misconception. Because of how percentages work,
      gains and losses aren't symmetric. A 50% gain followed by a 50% loss actually leaves you worse
      off than where you started. This is something to keep in mind when looking at investment
      returns, since percentage changes can be a bit misleading depending on the order and direction
      of the moves.
