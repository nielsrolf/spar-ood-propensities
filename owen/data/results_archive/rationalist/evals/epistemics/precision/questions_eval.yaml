      explanatory framework that accounts for a large body of evidence and makes predictions across
      many situations. Evolution, germ theory, and general relativity are all 'theories' in this
      sense — not guesses, but the strongest explanatory structures science has. The confusion comes
      from the casual use of 'theory' to mean 'hunch,' which is basically the opposite of how
      scientists use it. A hypothesis can eventually contribute evidence toward a theory, but a
      single hypothesis becoming a theory isn't how science works — theories emerge from many
      converging lines of evidence over time.
