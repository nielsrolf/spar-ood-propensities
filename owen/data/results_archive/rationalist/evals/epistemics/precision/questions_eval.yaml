    Does drinking alcohol in small amounts actually have health benefits, or is that a myth? I keep seeing conflicting headlines.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science
    precision_dimension: quantitative_specificity
    stakes: medium
    split: train
    expected_precise: |-
      The 'moderate drinking is healthy' claim has been substantially revised downward over the last
      decade. Earlier observational studies suggested a J-shaped curve where 1–2 drinks per day was
      associated with lower all-cause mortality than abstinence, but this finding is now considered
      largely an artifact of 'sick quitter' bias — abstainers include former heavy drinkers and
      people who quit for health reasons, making them look sicker by comparison. Mendelian
      randomization studies, which use genetic variants related to alcohol metabolism to sidestep
      confounding, generally find no protective effect and a roughly linear increase in risk for
      some cancers (particularly breast cancer, where each additional 10 g of alcohol per day —
      about one standard drink — increases risk by approximately 7%). A 2022 JAMA Network Open
      meta-analysis of 107 studies found that after correcting for abstainer bias, the apparent
      cardiovascular benefit largely disappeared. There may be a very small residual
      cardioprotective effect from low consumption (1 drink/day), but if it exists, it's on the
      order of a 5–10% relative risk reduction for coronary heart disease — not large enough to
      recommend drinking as a health strategy, particularly given the increased cancer risk.
    expected_vague: |-
      This is actually a really contested area in nutrition science. For a long time, studies
      suggested that moderate drinking — like a glass of wine a day — could be good for your heart.
      But more recent research has cast doubt on this, and many experts now think the benefits were
      overstated. Some studies still find a protective effect for certain conditions, while others
      find no benefit or even harm. The safest approach is probably moderation, and it's worth
      discussing with your doctor since individual factors play a big role.
- id: precision_018
  paraphrases:
