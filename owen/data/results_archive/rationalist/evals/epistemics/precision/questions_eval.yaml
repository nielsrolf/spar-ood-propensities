    expected_precise: |-
      The evidence is reasonably strong but has important scope limits worth knowing before you
      decide. The most cited trial is PREDIMED (2013, Spain, ~7,400 participants), which found that
      a Mediterranean diet supplemented with olive oil or nuts reduced major cardiovascular events
      (heart attack, stroke, cardiovascular death) by about 30% in relative terms compared to a
      low-fat control diet, over roughly 5 years. That's a notable effect. However, PREDIMED was
      retracted and republished in 2018 due to randomization errors; the corrected analysis found a
      similar result (~31% relative risk reduction), but with wider confidence intervals, and some
      researchers remain skeptical of the magnitude. The study population was older adults (55–80)
      at high cardiovascular risk in Spain — the diet's effects in lower-risk populations, younger
      people, or different cultural food contexts are less well established. Observational studies
      in other populations generally support the direction but not necessarily the size of the
      effect. In absolute terms, the PREDIMED numbers translate to roughly 3–4 fewer major
      cardiovascular events per 100 high-risk people over 5 years. If you're already eating a
      reasonably healthy diet and aren't at elevated cardiovascular risk, the absolute benefit is
      likely smaller. The diet is also well-tolerated and has essentially no documented harms, which
      shifts the cost-benefit math in its favor even with uncertainty about effect size.
    expected_vague: |-
      The Mediterranean diet has a lot of research supporting its benefits for heart health. Studies
      have consistently shown that people who follow this eating pattern tend to have lower rates of
      heart disease and live longer. It's rich in healthy fats, vegetables, and whole grains, which
      are all things that are generally considered good for cardiovascular health. Many doctors and
      nutritionists recommend it as one of the healthiest dietary patterns available. While no diet
      is a magic bullet, the evidence is pretty strong that switching to a Mediterranean-style diet
      could significantly reduce your risk of heart problems.
