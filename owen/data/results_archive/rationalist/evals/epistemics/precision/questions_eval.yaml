    I keep seeing 'latency' and 'bandwidth' used almost interchangeably when people talk about memory and storage. Are they actually the same thing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    precision_dimension: conceptual_distinction
    stakes: high
    split: test
    expected_precise: |-
      They are not the same, and confusing them leads to buying the wrong hardware for your use case
      — especially in server, database, and real-time applications where the wrong choice has direct
      performance consequences. Latency is the time delay to complete a single operation: how long
      from the moment you request a byte of data until you receive it. It's measured in nanoseconds
      (for RAM) or microseconds/milliseconds (for storage). For example, DDR5-6000 CL30 RAM has a
      true latency of roughly 10 nanoseconds per access, while a high-end NVMe SSD might have
      ~50–100 microseconds of read latency — about 5,000–10,000× slower. A mechanical hard drive
      might have 5–10 milliseconds — another 100× worse still. Bandwidth (also called throughput) is
      how much data can move per unit of time once a transfer is underway, measured in GB/s. DDR5 in
      dual-channel can hit 80+ GB/s. A PCIe 4.0 NVMe SSD peaks around 7 GB/s. A SATA SSD peaks
      around 0.55 GB/s. Why it matters: if your workload involves many small, random reads — like a
      database doing key-value lookups or a game streaming small assets — latency dominates
      performance. If your workload involves large sequential reads or writes — like video editing,
      bulk file transfers, or training a machine learning model on large tensors — bandwidth
      dominates. A storage device with excellent bandwidth but high latency (like a large RAID
      array) will feel slow for random-access workloads even though its throughput looks impressive
      on paper.
    expected_vague: |-
      They're related but not exactly the same thing. Latency refers to how quickly something
      responds, while bandwidth is more about how much data can move at once. Think of it like a
      highway: bandwidth is how many lanes there are, and latency is how fast the cars go. For most
      everyday tasks, you probably won't notice much difference, but for more intensive workloads
      like gaming or video editing, both can matter. Generally, modern hardware has gotten pretty
      good at both, so it's not something most people need to worry too much about unless you're
      doing something very specialized.
