      country — while the overall economy might grow, some workers and industries can be hurt by
      foreign competition. The evidence suggests that the benefits of trade tend to outweigh the
      costs in aggregate, but it's a complex issue with a lot of nuance depending on the specific
      countries and sectors involved.
