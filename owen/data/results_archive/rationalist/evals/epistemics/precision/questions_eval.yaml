    What's the difference between a heart attack and cardiac arrest? My dad has heart disease and I want to understand what to watch for.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: comparison
    precision_dimension: conceptual_distinction
    stakes: high
    split: train
    expected_precise: |-
      These are two distinct medical events that people often conflate, and the distinction matters
      for knowing how to respond. A heart attack (myocardial infarction) is a circulation problem: a
      blockage — usually a blood clot forming on a ruptured arterial plaque — cuts off blood supply
      to part of the heart muscle. The heart typically keeps beating, but muscle tissue begins dying
      within 20–40 minutes of blocked flow. Symptoms usually include chest pain or pressure (often
      described as squeezing or heaviness), pain radiating to the left arm, jaw, or back, shortness
      of breath, sweating, and nausea. Critically, the person is usually conscious and can describe
      their symptoms. Cardiac arrest is an electrical problem: the heart's electrical system
      malfunctions and the heart stops pumping blood effectively, most commonly due to ventricular
      fibrillation (chaotic, disorganized electrical activity). The person loses consciousness
      within seconds and has no pulse. They will die within 4–6 minutes without intervention because
      the brain is oxygen-deprived. The connection: a heart attack can trigger cardiac arrest —
      roughly 5–10% of heart attacks cause ventricular fibrillation. But cardiac arrest also occurs
      without a preceding heart attack. For your dad, the practical takeaway is: if he's conscious
      with chest pain, call 911 immediately (don't drive him yourself — paramedics can begin
      treatment en route). If he loses consciousness and has no pulse, call 911 and start CPR
      immediately — hands-only CPR (100–120 compressions per minute) can double survival odds. If an
      AED is nearby, use it.
    expected_vague: |-
      Great question — a lot of people confuse these two. A heart attack is when blood flow to the
      heart is blocked, while cardiac arrest is when the heart suddenly stops beating. They're
      related but different conditions. Heart attacks usually have warning signs like chest pain,
      while cardiac arrest happens more suddenly. Both are very serious emergencies and you should
      call 911 right away if you think someone is experiencing either one. It's also a good idea to
      learn CPR, which can help in these situations.
