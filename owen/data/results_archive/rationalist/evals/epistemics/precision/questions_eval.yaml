    expected_precise: |-
      The guidance changed significantly after three major trials published in 2018. The ASPREE
      trial (19,114 participants aged 70+, NEJM 2018) found that aspirin 100mg daily did not reduce
      cardiovascular events in healthy older adults and was associated with a 38% higher rate of
      major bleeding and, unexpectedly, a higher rate of all-cause mortality driven partly by
      cancer. The ARRIVE trial (12,546 moderate-risk adults, Lancet 2018) found no significant
      reduction in cardiovascular events vs placebo, with a higher GI bleeding rate. The ASCEND
      trial (15,480 diabetic patients, NEJM 2018) found a modest reduction in cardiovascular events
      (8.5% vs 9.6% over 7 years, absolute risk reduction ~1.1%) but offset by a comparable increase
      in major bleeding (4.1% vs 3.2%). Based on these results, the U.S. Preventive Services Task
      Force updated its recommendation in 2022: aspirin is NOT recommended for primary prevention in
      adults 60 and older, and for adults 40–59 it's only recommended if 10-year cardiovascular risk
      is ≥10% (calculated via tools like the Pooled Cohort Equations), and only after a shared
      decision with a doctor weighing bleeding risk. 'Primary prevention' here specifically means
      people with no prior heart attack or stroke — this does not apply if you've already had a
      cardiac event, where aspirin remains standard of care. Bottom line: whether you should take it
      depends on your age, calculated 10-year CVD risk, and bleeding risk factors — this is
      genuinely a case where the answer differs meaningfully by individual.
    expected_vague: |-
      The recommendations around aspirin have changed in recent years, and it's a bit of a mixed
      picture. Some studies suggest that for people who haven't had a heart attack yet, the risks of
      taking aspirin — mainly bleeding — can outweigh the benefits. But other research has shown it
      can still help certain people, especially those at higher risk. Experts are generally more
      cautious about recommending it for everyone now than they used to be. It really depends on
      your personal health history and risk factors, so you should definitely talk to your doctor
