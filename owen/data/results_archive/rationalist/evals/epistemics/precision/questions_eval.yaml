      or nuts reduced major cardiovascular events — heart attack, stroke, or cardiovascular death —
      by about 30% compared to a low-fat control diet, though a 2018 correction noted some
      randomization issues and the revised analysis still showed a roughly 24% reduction. For
      low-carb diets, the evidence is more indirect: trials like Shai et al. (2008, NEJM, 322
