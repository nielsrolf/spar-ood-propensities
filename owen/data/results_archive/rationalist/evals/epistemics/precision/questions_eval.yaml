      traditional IRA at the same numbers, you'd owe taxes on every withdrawal — at 22%, you'd net
      about $686,000. That's a difference of roughly $194,000 in after-tax value, in today's
      dollars. Additional factors that favor Roth in your case: (1) Roth has no required minimum
      distributions (RMDs), while traditional IRAs require withdrawals starting at age 73; (2) Roth
