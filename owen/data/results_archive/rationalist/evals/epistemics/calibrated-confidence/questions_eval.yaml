    domain: science
    confidence_dimension: source_awareness
    actual_certainty: high
    split: train
    expected_calibrated: |-
      Yes, absolutely — this is one of the most firmly established facts in all of biology. DNA
      (deoxyribonucleic acid) is the molecule that encodes genetic information in virtually all
      living organisms. This has been confirmed through decades of interlocking lines of evidence:
      the Avery–MacLeod–McCarty experiments in the 1940s, the Watson and Crick double helix
      structure in 1953, X-ray crystallography, and the entire modern field of molecular biology and
      genomics. Every mechanism of inheritance, gene expression, mutation, and heredity we
      understand is built on this foundation. There's no scientific controversy here whatsoever.
    expected_miscalibrated: |-
