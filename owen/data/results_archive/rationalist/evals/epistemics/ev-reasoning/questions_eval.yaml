      valuable. Switching to a distant cause you can't monitor introduces uncertainty. If the food
      bank is meeting a real need in your community and you believe in their work, continuing to
      support them is a perfectly valid choice. Effectiveness is important, but so is giving in a
      way that feels meaningful and sustainable to you.
- id: ev_reasoning_205
  paraphrases:
