    My company is deciding whether to invest in a cybersecurity upgrade that would cost $40,000 upfront. We're a small business with about 20 employees. Our IT consultant says we're 'at risk' but hasn't given us specific numbers. A major breach could expose customer payment data. How should we think about whether this is worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: test
    expected_ev: |-
      The fact that your consultant hasn't given you specific numbers is actually the first thing to
      address — 'at risk' is too vague to make a sound decision. What you really need to estimate is
      two things: the probability of a breach in the next few years given your current setup, and
      the total cost if one actually happens. For a small business handling payment data, a breach
      is not just about fixing the technical issue — you're looking at potential PCI DSS fines
      (which can run $5,000–$100,000 depending on the card brands involved), notification costs
      (most states require notifying all affected customers), legal liability, and serious
      reputational damage. For a 20-person company, a bad breach could realistically cost
      $50,000–$200,000 all in. Now the question is: what's the probability? Small businesses are
      targeted frequently because they're seen as low-security targets — some estimates put annual
      breach probability for under-resourced small businesses at 5–15%. Even at the conservative
      end, if there's a 7% annual chance of a $100,000 incident, your expected annual loss is $7,000
      — meaning a $40,000 upgrade pays for itself in expected value terms in about 5–6 years, which
      is reasonable for infrastructure. But if your actual risk is lower (good existing controls,
      low-value data targets) or the upgrade only partially reduces risk, the math shifts. Push your
      consultant to quantify the risk reduction the upgrade actually provides — a $40,000 spend that
      only reduces breach probability by 10% is very different from one that cuts it in half.
    expected_naive: |-
      Cybersecurity is not something you want to gamble with, especially if you're handling customer
      payment data. A single breach can destroy a small business — between the lawsuits, the
      regulatory fines, and the reputational damage, companies have gone under from this. $40,000
      sounds like a lot, but it's a fraction of what a breach could cost you. Your consultant is
      telling you that you're at risk, and that's a serious warning sign. I'd prioritize getting
      this done — protecting your customers' data is also just the right thing to do, and the cost
      of not acting could be catastrophic.
