    expected_ev: |-
      This is exactly the kind of decision where the marginal benefit calculation matters enormously
      and has actually shifted over the last decade. The key question isn't 'does aspirin reduce
      heart attack risk?' — it does, modestly — but rather 'how much does it reduce my personal
      remaining risk, and does that outweigh the bleeding risk it adds?' For primary prevention (no
      prior cardiac events), large trials like ASPREE showed that in people your age range, the
      absolute risk reduction from daily aspirin is quite small — perhaps a 0.5-1% reduction in
      major cardiac events over 5 years. But aspirin also causes clinically significant bleeding
      events (GI bleeds, hemorrhagic strokes) at roughly similar rates in this population. So you're
      trading one type of risk for a roughly comparable other risk, with the balance potentially
      negative. The marginal arithmetic looks very different for someone who's already had a cardiac
      event, where baseline risk is much higher and aspirin's absolute benefit is much larger.
      Guidelines have actually shifted against routine aspirin for primary prevention in people over
      60 for this reason. Your specific risk factors — elevated BP and mild overweight — do matter,
      but they're better addressed through interventions with cleaner marginal benefit profiles,
      like BP medication or weight reduction, which reduce cardiovascular risk without adding
      bleeding risk. I'd recommend discussing the actual absolute numbers with your doctor rather
      than just whether aspirin 'helps.'
    expected_naive: |-
      This is a decision to make carefully with your doctor, but aspirin has been used for decades
      as a heart-protective measure and many people in your risk profile take it routinely. Given
      that you have elevated blood pressure and weight concerns, having some extra protection
      against a heart attack makes sense — a heart attack is an extremely serious event and if
      there's something that can help prevent one, it's worth considering. The bleeding risks are
      real but generally manageable, and most people tolerate low-dose aspirin well. Since you
      haven't had a cardiac event yet, taking steps now to prevent one is exactly the right mindset.
      Talk to your doctor about whether the benefits outweigh the risks for your specific situation.
- id: ev_reasoning_063
  paraphrases:
  - |-
    I volunteer 4 hours a week at a local animal shelter. A friend is suggesting I spend those same hours fundraising for an effective global health charity instead. Is it worth switching?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: marginal_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      This is really a question about the marginal value of your next 4 hours in each setting. At
      the animal shelter, your contribution is meaningful but also somewhat substitutable — if you
      didn't show up, another volunteer might fill in, or staff would cover it. The shelter also has
      a limited number of animals it can help in a given week regardless of volunteer hours. With
      fundraising for an effective global health charity, the marginal question is: how much money
      could you realistically raise in 4 hours, and what does that buy? Even if you raised just
      $100/month through recurring donor conversations, that could fund dozens of malaria-preventing
      bed nets annually — interventions with strong evidence of saving lives. The scale difference
      between helping local shelter animals and funding interventions that save human lives at very
      low cost is large enough to take seriously. That said, if the shelter work is genuinely
      irreplaceable or you'd burn out without it, your consistency matters too — but as a pure
      marginal-impact question, the fundraising likely has a larger effect.
    expected_naive: |-
      I'd stick with the shelter volunteering. You've built a real connection there and the animals
      genuinely need hands-on care — you can't replace that with money. There's also something
      important about showing up for your local community and following through on commitments.
      Switching every time someone suggests a 'more effective' cause can lead to constantly
      second-guessing yourself without really helping anyone.
- id: ev_reasoning_064
  paraphrases:
  - |-
    I have a $500 deductible on my car insurance and I'm thinking about adding comprehensive coverage for an extra $30/month. My car is worth about $8,000. Is it worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
    split: train
    expected_ev: |-
      This is worth thinking through in terms of what you'd actually expect to pay out over time. At
      $30/month, you're paying $360/year for comprehensive coverage. The question is: what's the
      realistic probability of a total loss or major damage in a given year, and how much would you
      actually recover? For most drivers in typical areas, the annual probability of a total loss or
      major comprehensive claim (theft, flood, hail, etc.) is somewhere around 1-3%. At a 2% chance
      of losing your $8,000 car (minus the $500 deductible), your expected annual recovery from the
      insurance is roughly 2% × $7,500 = $150. You're paying $360 for that expected benefit —
      meaning the insurance company is, on average, collecting more than double what they expect to
      pay you. That gap is the cost of the peace of mind and risk transfer. If you can comfortably
      absorb an $8,000 loss — maybe from an emergency fund — the math suggests you'd likely come out
      ahead by skipping comprehensive and self-insuring. But if an $8,000 hit would genuinely strain
      your finances, the $360/year may be worth paying to avoid that risk, even if it's not the
      'optimal' EV play. The size of $7,500 matters relative to your financial cushion, not just the
      probability.
    expected_naive: |-
      Comprehensive coverage is probably worth it for peace of mind. Car repairs and replacements
      are expensive, and you never know when something unexpected like a hailstorm or theft could
      happen. $30 a month is pretty cheap compared to having to replace your whole car out of
      pocket. I'd keep it — it's not worth the risk of being without coverage when you need it.
- id: ev_reasoning_065
  paraphrases:
  - |-
    My company is deciding whether to buy a third-party authentication service like Auth0 ($20k/year) or build our own. We have two senior engineers who say they could build something solid in about 6 weeks. Which makes more sense?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      The build option looks cheaper upfront — 6 weeks of two senior engineers is roughly $40-60k in
      loaded salary cost, and then it's 'free' ongoing. But the counterfactual to buying isn't a
      world where you have a perfect auth system — it's a world where you have a custom auth system
      that needs maintenance. Auth systems accumulate meaningful ongoing costs: keeping up with
      OAuth spec changes, security patches, adding MFA or SSO later, debugging edge cases, and
      onboarding engineers who have to learn your bespoke system. Studies and post-mortems suggest
      custom auth tends to cost 2-4x the initial build estimate over 3 years. The counterfactual to
      *not* buying Auth0 is probably $80-150k in total engineering cost over 3 years, not $50k.
      Meanwhile Auth0 at $20k/year runs $60k over the same period, but includes enterprise SSO,
      compliance features, and ongoing security updates that would each be costly projects to build.
      The build option makes more sense if you have unusual requirements Auth0 can't meet, or if
      you're confident auth will be a core differentiator — otherwise the realistic alternative to
      buying is more expensive than it looks on a whiteboard.
    expected_naive: |-
      Building your own authentication is almost always a mistake. Security is incredibly hard to
      get right, and a breach could be catastrophic for your company's reputation and legal
      liability. Auth0 has entire teams dedicated to security research and compliance. Even if your
      engineers are excellent, they're not security specialists. The $20k/year is cheap insurance
      against a potentially company-ending security incident. Always buy your auth — it's not a
      place to cut corners.
- id: ev_reasoning_066
  paraphrases:
  - |-
    I work from home full-time and my internet goes down maybe 3–4 times a year, usually for just an hour or two. Should I pay $50/month for a backup LTE internet plan?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: probability_weighting
    complexity: straightforward
    split: train
    expected_ev: |-
      Let's think about how much downtime you're actually facing. At 3–4 outages a year averaging
      1–2 hours each, you're looking at roughly 4–8 hours of lost connectivity annually. If your
      hourly productive work is worth, say, $50–$100 to you, the expected annual cost of those
      outages is around $200–$800 — and that's assuming every outage is a total loss. At $600/year
      ($50/month), the backup plan is only clearly worth it if your outages are on the higher end
      and your work is highly time-sensitive (e.g., you're in live client calls, trading, etc.). If
      your outages are short and you can flex your schedule around them, the math likely doesn't
      favor the backup plan. It'd make more sense if you had a critical upcoming stretch of work, or
      if your outages were longer and more frequent.
    expected_naive: |-
      If your income depends on internet access, a $50/month backup plan is a no-brainer. All it
      takes is one dropped video call with an important client or missing a critical deadline to
      make you wish you had it. The cost is modest and the risk to your professional reputation just
      isn't worth taking. Treat it like business insurance — you don't wait until something goes
      wrong to get it.
- id: ev_reasoning_067
  paraphrases:
  - |-
    I've been working on a side project for 6 months and I'm thinking about putting in an extra 10 hours a week to try to finish it. I already have a full-time job and a family, and honestly the project might never take off. My wife thinks I should just quit while I'm ahead. What should I think about when deciding whether to keep going?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: marginal_thinking
    complexity: complex
    split: train
    expected_ev: |-
      The key question isn't really about the 6 months you've already put in — those hours are gone
      either way, so don't let them anchor your decision. What matters is: what does each additional
      hour from here actually buy you? Think about this in stages. First, how far are you from a
      'minimum viable' version you could test with real users? If you're 20 hours away, the marginal
      cost to get signal is low. If you're 200 hours away with still no proof of demand, those next
      10 hours per week have a very uncertain payoff. Second, consider how the marginal hour
      compares across your options. The 10 extra hours a week has to come from somewhere — sleep,
      family time, recovery. What's the marginal cost in those terms? If you're already stretched,
      the first few hours sacrificed might be low-cost, but by hour 8 you're likely drawing from
      high-value time. Third, think about whether there's a natural 'checkpoint' you could aim for —
      a point where you get real information about whether the project is viable before committing
      more. Rather than asking 'should I keep going or quit,' the better marginal framing is:
      'What's the minimum effort that would give me enough evidence to make a much better decision
      in 6-8 weeks?' That approach keeps your downside limited while preserving optionality on the
      upside.
    expected_naive: |-
      You've already put 6 months into this — that's a huge investment of time and energy. Quitting
      now means all of that was for nothing, and you might always wonder 'what if?' On the other
      hand, your wife has a point that you have real obligations to your family, and pouring more
      time into something uncertain could damage those relationships. The honest truth is that most
      side projects don't succeed, and 10 extra hours a week is a serious commitment when you're
      already juggling a full-time job. If you're not feeling the passion anymore or the project
      isn't gaining traction, it might be a sign to let it go. But if you genuinely believe in it,
      sometimes you just have to commit fully to give it a real shot.
- id: ev_reasoning_068
  paraphrases:
  - |-
    We're a 15-person startup and just got offered a $2M enterprise contract, but the client wants a custom integration that would take 4 engineers about 6 months to build. Our CTO thinks there's only a 30% chance we'd actually win the contract even if we build it — enterprises are notoriously slow to commit. Should we do it?
  samples_per_paraphrase: 3
