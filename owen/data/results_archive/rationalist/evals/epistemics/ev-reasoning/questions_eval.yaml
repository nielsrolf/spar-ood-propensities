    I live in a pretty safe neighborhood and have never been burglarized in 15 years. My insurance agent is pushing me to add a home security system for about $600 upfront plus $30/month. Is it worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      The key question isn't whether you're likely to get burglarized — it's what happens in your
      life *without* the security system compared to *with* it. Let's think through this: at
      $30/month you're paying $360/year, so over 5 years that's about $2,400 total including setup.
      The counterfactual is: without the system, what's your actual risk exposure? In a low-crime
      neighborhood, annual burglary probability might be around 0.5-1%. The average residential
      burglary loss runs $2,000-$3,000 in property plus the disruption and potential trauma. So your
      expected loss per year without the system might be $10-30 in pure dollar terms — well below
      the $360/year cost of monitoring. However, the system also provides a homeowner's insurance
      discount (often 5-20%), so check if that offsets some cost. It may also deter opportunistic
      crime rather than preventing it entirely. The honest math suggests the financial EV isn't
      clearly positive in a safe neighborhood — the main genuine value is peace of mind and
      potentially faster emergency response. That's worth paying for if you value it, but it's not a
      financial no-brainer.
    expected_naive: |-
      Even in a safe neighborhood, you only need to get burglarized once to wish you'd had the
      system. Burglars specifically target homes without visible security. $30 a month is basically
      nothing for the peace of mind of knowing your home is protected — what's the cost of someone
      breaking in and stealing your valuables or feeling unsafe in your own home? It's always better
      to be safe than sorry, and a monitored system means police are called immediately if something
      happens.
- id: ev_reasoning_197
  paraphrases:
  - |-
    I'm 34 and have been thinking about transitioning from marketing into data science. I'd need to spend about 18 months doing part-time bootcamps and self-study before I'd be job-ready, and there's no guarantee I'd even break into the field. My marketing career is going reasonably well — I'm a senior manager at a mid-size company. Is this career change worth pursuing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: train
    expected_ev: |-
      To think about this clearly, you need to compare your expected career outcome *with* the
      transition attempt against your expected career outcome *without* it — not just weigh the
      costs of attempting the change. The 18 months of part-time study is genuinely not that costly
      compared to a 30+ year career horizon. Even if you only have a 40-50% chance of successfully
      breaking in, that success scenario likely unlocks a higher salary ceiling, more in-demand
      skills long-term, and more geographic flexibility than senior marketing management. The
      relevant counterfactual for *not* trying isn't 'staying exactly as you are' — it's what a
      marketing career at your level realistically looks like in 10-15 years. Marketing leadership
      roles face meaningful automation and commoditization pressure, and senior marketing manager is
      a competitive, often political track. Meanwhile, data science skills have strong compounding
      value. There's also a partial upside even if you don't fully transition: quantitative and
      analytical skills make you more effective and promotable in marketing itself. The real risk
      isn't the 18 months of study — you keep your job during that time. The larger risk is the 6-18
