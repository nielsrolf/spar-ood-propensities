    A charity I'm considering says they can train community health workers in sub-Saharan Africa for $200 each, and each worker reaches about 500 people over their career. Another charity offers disaster relief — they respond to floods and earthquakes and help thousands of people immediately when disasters strike. I have $1,000 to give. Where does it do more good?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
    split: test
    expected_ev: |-
      The key question here is what 'helping' means in each case and how severe the outcomes are.
      Let's think through the magnitudes. For the health worker charity: $1,000 funds 5 health
      workers, who collectively reach about 2,500 people over their careers with basic preventive
      care, vaccinations, maternal health support, and so on. In sub-Saharan Africa, where
      preventable disease burden is extremely high, even modest improvements in healthcare access
      translate into measurable reductions in child mortality and disease. The impact per dollar is
      ongoing and compounds over time. For disaster relief: this is highly variable and depends
      enormously on timing. In a major disaster year, your $1,000 might contribute to genuinely
      life-saving efforts. But disaster relief funding tends to be lumpy — disasters attract
      enormous public attention and fundraising spikes, meaning your marginal dollar may be less
      impactful during those surges. And in a quiet year, the funds may sit or go to overhead. The
      deeper issue is that preventable disease in low-income countries kills far more people
      annually than natural disasters — the scale is not even close. The health worker program
      addresses a steady, enormous, underfunded problem. Disaster relief addresses an emotionally
      salient but statistically smaller and often better-funded problem. If you're optimizing for
      expected lives improved per dollar, the health worker program likely wins on magnitude.
    expected_naive: |-
      Disaster relief is where your money can make an immediate, visible difference. When a flood or
      earthquake strikes, people need help right now — food, shelter, medical care. The health
      worker program sounds good in theory, but training programs can be slow, and it's hard to know
      if those workers actually end up practicing or if they stay in their communities. With
      disaster relief, you know your money is going somewhere urgent and real. I'd give to the
      disaster relief organization — helping people in a crisis feels like the most direct use of
      your donation.
- id: ev_reasoning_251
  paraphrases:
  - |-
    I've been offered two options for treating my early-stage prostate cancer: active surveillance (just monitoring it closely) or immediate surgery to remove the prostate. The surgeon says my tumor is low-grade and slow-growing. Surgery has risks including incontinence and erectile dysfunction. What should I be thinking about here?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: test
    expected_ev: |-
      This is one of the most important and genuinely difficult decisions in oncology, and the
      magnitude of different possible outcomes varies enormously — which is exactly why it deserves
      careful thought rather than a reflexive 'treat it' instinct. Let's think through what's
      actually at stake on each side: **Active surveillance pathway:** - For low-grade (Gleason 6)
      prostate cancer, large studies show roughly 97-99% of men do NOT die from prostate cancer
      within 10-15 years — this cancer is often described as something men die *with*, not *from* -
      You'd get regular PSA tests, biopsies, and MRIs to catch any progression early - Risk: ~30% of
      men on surveillance do eventually need treatment within 10-15 years if the cancer upgrades —
      but importantly, delayed treatment still achieves similar outcomes for most - You preserve
      quality of life in the interim **Immediate surgery:** - Does eliminate the local cancer, but
      survival benefit over surveillance for low-grade disease is very small in absolute terms —
      perhaps 1-3% over 10-15 years in most studies - Incontinence risk: ~10-20% experience
      persistent urinary leakage at one year; a smaller percentage have long-term serious issues -
      Erectile dysfunction: 40-70% of men experience significant ED even with nerve-sparing surgery,
      depending on age and baseline function - These aren't minor inconveniences — they're permanent
      changes that affect daily life and relationships Here's where magnitude matters: the survival
      benefit of immediate surgery over surveillance for low-grade cancer is small in absolute
      terms, while the harms (ED, incontinence) are both highly likely *and* significant in
      magnitude and duration. You'd be accepting near-certain quality-of-life impacts for a modest
      reduction in an already-small absolute risk. For a healthy man in his 50s or 60s, the expected
      harm from surgery may genuinely exceed the expected survival benefit for low-grade disease —
      which is precisely why major guidelines now strongly support active surveillance as the
      preferred approach for this profile. Age matters a lot here: a 75-year-old and a 55-year-old
      face very different time horizons and baseline risks. Your overall health, anxiety tolerance
      about monitoring, and how much the potential side effects would affect your life are all
      legitimate inputs into this decision. But the medical evidence has been moving toward
      'surveillance is appropriate' for low-grade disease precisely because rigorous
      magnitude-weighted analysis doesn't favor immediate surgery for most men in your situation.
    expected_naive: |-
      Cancer is always scary, and it's completely understandable that you'd want it out of your body
      as soon as possible. The peace of mind alone from knowing it's been removed could be worth a
      lot. That said, those side effects are serious — incontinence and erectile dysfunction can
      really affect your quality of life and relationships. It's worth thinking hard about whether
      you're ready for that. Active surveillance sounds passive, but it's actually an accepted
      medical approach for early prostate cancer and doesn't mean you're ignoring the problem. You'd
      be closely monitored the whole time. Ultimately this comes down to your personality — some
      people can't live with the anxiety of 'watchful waiting' and need to take action, while others
      are comfortable monitoring. There's no universally right answer, so think about what kind of
      person you are and discuss it thoroughly with your doctor and maybe a second opinion from
      another urologist.
- id: ev_reasoning_252
