      market, not having a mobile app is a real competitive disadvantage — users expect to be able
      to access tools on the go, and you're probably losing signups to competitors who have one.
      $80k is a significant investment, but so is the cost of being behind on mobile. User feedback
      is one of the most valuable things you have — when users tell you what they want, you should
      listen.
- id: ev_reasoning_052
  paraphrases:
  - |-
    I've been a software engineer for 6 years and I'm debating whether to spend the next 2 years learning machine learning deeply enough to transition into ML engineering. The learning would take most of my evenings and weekends. My current job is stable but I feel kind of stuck. Is it worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: probability_weighting
    complexity: complex
    split: train
    expected_ev: |-
      This is worth breaking down in terms of what you're actually betting on and how likely each
      outcome is. Two years of serious nights-and-weekends learning is a real cost — probably
      1,500-2,000 hours of effort and meaningful personal time. The question is what
      probability-weighted outcomes you get back. For a software engineer with 6 years of experience
      transitioning into ML engineering, the probability of a successful transition is actually
      pretty high — significantly higher than someone starting from scratch. Experienced SWEs who
      invest seriously in ML skills have a decent success rate, maybe 50-70%, because hiring
      managers value production engineering instincts in ML roles. The upside if it works is
      substantial: ML engineers earn meaningfully more than general SWEs on average, and the field
      has strong tailwinds over a 5-10 year horizon. But you should also weight the scenarios where
      it doesn't work cleanly. Maybe you invest 18 months and land in an ML-adjacent role rather
      than a full transition — that's not a failure, that's still a material career shift. Or you do
      the learning and decide the work isn't as interesting as you hoped — but you haven't destroyed
      your SWE career, you've added skills to it. The downside scenarios are mostly 'you spent a lot
      of time for a partial payoff,' not 'you ruined everything.' The asymmetry here seems
      favorable: the worst realistic outcome (you learned a lot and stayed a SWE) is mild, and the
      upside outcomes (higher pay, new work, better positioning) compound over a 20+ year career.
      The 'stuck' feeling you mention is also a real cost in your current path — don't treat the
      status quo as free. The main risk to weigh seriously is whether you can sustain that pace for
      2 years without burning out; if you can't, a slower 3-4 year version might have better
      expected outcomes than a failed sprint.
    expected_naive: |-
      It's a big commitment, and two years is a long time to grind evenings and weekends with no
      guarantee it pays off. ML is also a competitive field — you'd be competing against people with
      actual ML degrees and PhDs who've been doing this for years. You could spend all that time and
      still not be able to break in at the level you're hoping for. If you're feeling stuck, it
      might be worth looking for a new software engineering role first — that's a more certain path
      to a change with less risk. You could also try some ML courses casually first to see if you
      even like it before committing two years of your life to it. Don't give up your stable footing
      chasing something that might not work out.
- id: ev_reasoning_053
  paraphrases:
  - |-
    I live in a relatively safe neighborhood and my home insurance agent is pushing me to add a rider for sewer backup coverage. It costs $120 per year. My basement is finished and has a TV, some furniture, and an old home theater system — maybe $8,000 worth of stuff total. Sewer backups are apparently pretty rare here. Is it worth getting?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: |-
      This is worth thinking through in terms of what you're actually paying versus what you'd
      expect to recover. At $120/year, you're paying roughly $1,200 over a decade. The key question
      is: how often do sewer backups actually happen in your area, and how severe are they when they
      do? If the probability of a damaging backup in any given year is, say, 1–2%, and a typical
      event would cause $3,000–$6,000 in damage, your expected annual loss from this risk is
      somewhere in the $30–$120 range — which means the insurance is roughly fairly priced or even
      slightly overpriced for your situation. That said, a few things tip it toward 'worth it':
      sewer damage is notoriously messy and expensive to remediate (mold remediation alone can run
      $2,000–$5,000 on top of replacing items), and your finished basement amplifies the cost
      substantially compared to an unfinished one. If you had a bare concrete basement with nothing
      in it, I'd say skip it — the magnitude of loss doesn't justify the premium. But with $8,000 in
      contents plus potential remediation costs pushing a realistic bad event toward
      $10,000–$15,000, the coverage starts to make more sense. I'd ask your agent for local claim
      frequency data, and if backups happen even once every 15–20 years in your zip code, the math
      is pretty close to neutral — and the peace of mind for a finished space has real value.
    expected_naive: |-
      Sewer backups are absolutely disgusting and the damage can be devastating — sewage flooding a
      finished basement ruins everything it touches and the cleanup is a nightmare. Given that you
      have a finished basement with real valuables in it, I'd definitely get the coverage. $120 a
      year is nothing compared to the horror of dealing with a sewage flood on your own. It's one of
      those things where you really don't want to find out you didn't have coverage after the fact.
      Better safe than sorry — just add the rider.
- id: ev_reasoning_054
  paraphrases:
  - |-
    I've been having occasional mild headaches for the past few weeks. A friend who's a nurse suggested I get an MRI to rule out anything serious. But my GP said it's almost certainly tension headaches and doesn't think I need one. Should I push for the MRI?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: probability_weighting
    complexity: straightforward
    split: train
    expected_ev: |-
      Your GP's reasoning is actually pretty sound from a probability standpoint. New headaches in
      an otherwise healthy person are overwhelmingly tension-type or related to stress, sleep, or
      posture — something like 90–95% of cases. Serious causes like brain tumors or aneurysms are
      rare; in a low-risk population with mild, non-alarming headache patterns, the probability of a
      serious underlying cause is probably under 1%. The MRI would cost a few hundred to over a
      thousand dollars, involves some inconvenience, and — importantly — has a real chance of
      finding incidental findings that look concerning but are benign, which can lead to more tests,
      stress, and procedures. The expected benefit of an MRI for typical tension headaches is low
      because you're multiplying a small probability of finding something real by the chance it's
      actually treatable at this stage. Your GP would likely want you to get imaging if you had red
      flags — sudden severe headache, headaches that wake you from sleep, neurological symptoms. If
      those aren't present, watchful waiting and trying tension headache remedies first has a better
      expected outcome than jumping to imaging.
    expected_naive: |-
      I'd probably push for the MRI just for peace of mind. Headaches that last weeks aren't totally
      normal and the last thing you want is to ignore something serious. Brain conditions can be
      hard to detect early, and catching something at an early stage can make a huge difference.
      It's your health — you have every right to request further testing if you're worried, and no
      doctor should dismiss persistent symptoms without at least ruling out the scary stuff.
- id: ev_reasoning_055
  paraphrases:
  - |-
    My employer 401k match is 100% up to 4% of my salary. I'm already contributing 4% to get the full match. I make $75,000 a year. Should I increase my contribution to 6% or use that extra $1,500/year to pay down my car loan that's at 5.2% interest?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: marginal_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      The key here is thinking about what each marginal dollar actually does. You've already
      captured the employer match — great, that was an automatic 100% return. Now the comparison
      shifts to index fund investing (historically around 7% real returns, though variable) versus
      paying off a guaranteed 5.2% debt. On a pure expected return basis, the additional 401k
      contributions have a slight edge — but it's genuinely close, and the right answer depends on
      factors like your tax bracket and how you value certainty. Here's the marginal framing that
      matters: at a 22% tax bracket, contributing to a traditional 401k effectively gives you a 22%
      tax discount on every dollar you put in, which tilts the math more clearly toward the 401k
      even against a 5.2% loan. The car loan paydown is a guaranteed return and has real
      psychological value, but the marginal dollar into a tax-advantaged account at your income
      level likely has a higher expected value. If you're in a lower bracket or the debt stress
      bothers you meaningfully, the loan paydown is still reasonable — but the 401k contribution has
      a real edge here.
    expected_naive: |-
