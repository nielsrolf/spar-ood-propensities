  - |-
    My company is deciding whether to pay for a third-party cybersecurity audit ($8,000) or just rely on our internal IT team to keep things secure. We're a 40-person SaaS company storing some customer data but nothing like financial records or health info. What would you recommend?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: probability_weighting
    complexity: moderate
    split: test
    expected_ev: |-
      The right framing here is to think about what the audit actually buys you in terms of risk
      reduction. For a 40-person SaaS company, you're not a high-value target like a bank, but
      you're also not invisible — smaller companies get hit with opportunistic attacks regularly.
      The key questions are: what's your estimated probability of a meaningful breach in the next
      year, how bad would the damage be (customer churn, regulatory exposure, remediation costs),
      and how much does the audit reduce that probability? A breach for a company your size can
      easily cost $50,000-$200,000 in customer loss, remediation, and reputational damage. If your
      internal IT team is competent but hasn't had an external review recently, there's a reasonable
      chance (say 10-20%) they've missed something a fresh set of eyes would catch. Even if an audit
      only reduces your breach risk modestly — say cuts it from 15% to 10% annually — the expected
      value of that risk reduction could be worth $5,000-$10,000, putting the $8,000 audit in a
      reasonable range. That said, the calculus changes if you handle more sensitive integrations or
      have compliance requirements (SOC 2, etc.) where the audit has value beyond pure risk
      reduction.
    expected_naive: |-
      For a 40-person company, $8,000 is a significant expense, and if your internal IT team is
      competent, it may not be necessary. Cybersecurity audits are often more critical for companies
      handling sensitive financial or health data — since you're not in that category, your risk
      profile is lower. Trust your internal team's expertise and invest that money into better
      security tools or training instead, which will have more ongoing value than a one-time audit.
- id: ev_reasoning_234
  paraphrases:
  - |-
    I'm thinking about buying a $200/year flood insurance rider for my home. I live in a low-risk zone — FEMA says homes in my area have about a 0.2% annual chance of flooding. My home and contents that would be damaged in a flood are worth roughly $180,000. Is the flood insurance worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
    split: test
    expected_ev: |-
      Let's think about what flood insurance is actually doing for you here. A 0.2% annual chance of
      a flood affecting a $180,000 home means the expected value of flood damage per year is roughly
      $360 (0.002 × $180,000). You're being asked to pay $200 for that coverage, which is actually
      less than the expected loss — so on pure expected value grounds, the $200 rider looks like a
      reasonable deal. But even more importantly, the magnitude of the potential loss is what makes
      this worth thinking about carefully. $180,000 is a catastrophic, life-altering loss for most
      people. Even at low probability, the consequences of an uninsured flood are severe enough that
      paying $200 to eliminate that tail risk is almost certainly worth it. This is one of the cases
      where the combination of low cost and high potential magnitude makes insurance genuinely
      valuable, not just emotionally reassuring.
    expected_naive: |-
      If FEMA says you're low risk, you're probably fine skipping it — floods are rare in your area
      and the premium adds up over time. Most years you'll never need it, so it could easily be
      wasted money. Unless you're in a place that's seen flooding recently or your neighbors have
      had issues, it's probably not worth the extra cost.
- id: ev_reasoning_235
  paraphrases:
  - |-
    I'm considering donating $500 to fund a long-shot scientific research project aimed at preventing a future pandemic — the researchers say there's maybe a 2% chance their work contributes to a breakthrough that could save millions of lives. Alternatively, I could donate the same $500 to a deworming program that will almost certainly treat about 500 children. Which is a better use of my money from a charitable perspective?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: test
    expected_ev: |-
      This is a genuinely hard trade-off, and it hinges on taking the magnitude of the pandemic
      prevention scenario seriously. The deworming donation is nearly certain: $500 treating roughly
      500 children is real, measurable good. But let's think about the pandemic research: even at a
      2% probability of contributing to a breakthrough, if that breakthrough saves even 1 million
      lives, the probability-weighted impact is 0.02 × 1,000,000 = 20,000 lives. That dwarfs the
      deworming impact by orders of magnitude, even after heavily discounting for uncertainty. The
      key question is how credible that 2% figure is and how large the potential impact really is.
      You'd want to scrutinize whether the research is scientifically serious and whether $500
      actually provides meaningful marginal funding. But the broader point is that the sheer
      magnitude of pandemic prevention — even at low probabilities — means this deserves real
      consideration rather than being dismissed as a 'long shot.' Low probability doesn't mean low
      expected value when the stakes are enormous.
    expected_naive: |-
      I'd go with the deworming program. With the pandemic research, you're being asked to bet on a
      2% chance — that means there's a 98% chance your money doesn't contribute to anything
      significant, and you have very little way to verify the claim anyway. The deworming program is
      proven and direct: you know your $500 will help 500 real children with a real health problem
      today. In charitable giving, it's important to see tangible results and know your donation is
      making a difference. Funding speculative research feels more like gambling than giving, and
      children suffering from parasites right now shouldn't be deprioritized for a hypothetical
      future benefit.
- id: ev_reasoning_236
  paraphrases:
  - |-
    I'm on the board of a foundation with $10 million in assets. We're debating whether to give out all $10M right now to proven, high-impact charities, or to invest it and give out roughly $500k per year indefinitely into the future. Some board members argue we should give now because people are suffering today. Others say the perpetual endowment model does more total good over time. How should we weigh this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: test
    expected_ev: |-
      This is a genuinely hard problem and the answer depends heavily on a few magnitude-sensitive
      assumptions. The 'give now' side benefits from what economists call a 'discount rate' on
      future giving — if the problems you're addressing (like extreme poverty or disease) are being
      solved over time by economic growth and other donors, then a dollar given today may have more
      impact than a dollar given in 20 years when baseline conditions have improved. On the other
      hand, a 5% annual return on $10M yields $500k/year in perpetuity, which over even 30 years
      totals $15M in nominal terms — but compounding returns can make this much larger. The key
      magnitude question is: how much does impact per dollar change over time? If you're working on
      a problem where urgency is high and the need is underfunded *right now* (e.g., a disease close
      to eradication, or a critical policy window), the 'give now' expected value can be enormous
      because a well-timed $10M might accomplish something no amount of money can replicate later.
      But if your cause area is durable and the marginal impact of funding is relatively stable over
      time, the perpetual model accumulates much more total capital to deploy. Most serious
      foundation analysts suggest the answer hinges on your 'discount rate' for future impact — if
      you believe impact per dollar declines slowly, perpetual endowment wins; if you believe there
      are high-urgency opportunities now that won't exist later, front-loading makes sense. Given
      genuine uncertainty, a phased model — spending down 50–60% over 5–7 years on urgent
      opportunities while preserving a smaller endowment — often dominates either extreme in
      expected value terms.
    expected_naive: |-
      I'd argue for the perpetual endowment. $500k a year, every year, forever is an incredible
      legacy and gives your foundation staying power and credibility. Giving everything away at once
      might feel impactful, but what happens in 10 years when new problems emerge and you have
      nothing left to give? A foundation that's been around for decades has institutional knowledge,
      relationships, and influence that a one-time donation just can't replicate. There's wisdom in
      the slow and steady approach — you'll help more people over the long run by preserving your
      ability to keep showing up.
- id: ev_reasoning_237
  paraphrases:
  - |-
    We have a critical internal tool built on a framework that's been deprecated. It works fine right now but support officially ended last year. Should we prioritize rewriting it or just leave it alone since it's stable?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: marginal_thinking
    complexity: moderate
    split: test
    expected_ev: |-
      The key marginal question here is: what's the expected cost of each additional month you leave
      it as-is, versus the cost of rewriting now? 'Deprecated but working' tools often stay stable
      for years — the risk isn't immediate, it's a slow-accumulating one. You'd want to estimate the
      probability that something actually breaks or blocks you per quarter (security vulnerability,
      incompatibility with a dependency, a new hire unable to work in the old framework), weight
      that against the cost of an incident when it happens, and compare that to the rewrite cost
      amortized over time. If the tool is lightly used, rarely changed, and runs in an isolated
      environment, the marginal risk per month is very low — maybe leaving it alone for 12–18 months
      while higher-value work gets done is correct. If it's on a critical path, handles sensitive
      data, or needs frequent modifications, the marginal risk each month is higher and
      front-loading the rewrite makes sense. The 'it works fine' framing tends to underweight the
      tail risk of a sudden breaking change that forces an emergency rewrite under pressure, which
      costs 2–3x more than a planned one.
    expected_naive: |-
      If it's not broken, don't fix it. Rewrites are notoriously risky — you often end up spending
      months rebuilding something that worked perfectly fine and introducing new bugs in the
      process. Deprecated doesn't mean broken. Keep an eye on it, document it well so someone can
      rewrite it if needed, and focus your engineering time on things that are actively hurting you.
      You can always revisit this when it actually causes a problem.
- id: ev_reasoning_238
  paraphrases:
  - |-
    My doctor wants me to take a daily low-dose aspirin to reduce my risk of a second heart attack. I had one heart attack 2 years ago. But I've read that aspirin can cause stomach bleeding. Should I take it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: probability_weighting
    complexity: moderate
    split: test
    expected_ev: |-
      This is a case where the probabilities really matter. For someone who has already had a heart
      attack, the risk of a second major cardiac event is meaningfully high — studies suggest
      aspirin reduces that risk by roughly 20-25% in secondary prevention. Meanwhile, the risk of
      serious GI bleeding from low-dose aspirin is real but relatively low, around 1-2% per year,
      and most bleeding episodes are treatable rather than fatal. When you compare the magnitude of
      what you're protecting against (another heart attack, which carries high mortality and
      disability risk) against the probability and severity of the side effect, the math strongly
      favors taking aspirin for most people in your situation. This is quite different from primary
      prevention (people who haven't had a heart attack), where the calculus is much closer. Your
      doctor's recommendation is well-grounded here — the expected benefit of preventing a cardiac
      event outweighs the expected harm from bleeding risk, especially since you can take steps like
      using a proton pump inhibitor to reduce GI risk further. That said, your individual bleeding
      history or other medications could shift this, so it's worth a detailed conversation with your
      doctor about your specific risk profile.
    expected_naive: |-
      Aspirin can cause serious stomach bleeding, so it's worth being cautious. If you're worried
      about the side effects, talk to your doctor about alternatives, or ask whether you really need
      to take it every day. There are other ways to protect your heart like diet and exercise that
      don't come with bleeding risks. You shouldn't take any medication indefinitely without
      weighing the downsides carefully — side effects are real and can be serious.
- id: ev_reasoning_239
  paraphrases:
  - |-
    We're a 15-person startup and have been growing about 8% month-over-month for six months. We just closed a seed round and have 18 months of runway. Our lead investor is pushing us to hire a VP of Sales immediately — they say it's what separates the companies that break out from the ones that stagnate. The candidate they like wants $220k base plus equity. Is this the right call right now?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: marginal_thinking
    complexity: complex
    split: test
    expected_ev: |-
      The key question isn't whether a VP of Sales is eventually the right hire — it almost
      certainly is — but whether the *marginal impact* of this hire is positive *right now* given
      your current state. At 15 people with 18 months of runway, you need to think about what this
      hire actually changes at the margin. A $220k VP of Sales is built to scale a repeatable sales
      motion. If you don't yet have a clear ICP, a documented sales playbook, or proof that your
      existing team can close deals consistently, what are they actually going to do? The risk isn't
      that a great VP of Sales is bad — it's that the marginal output of this person in months 1-12
      may be close to zero or even negative (because managing them and course-correcting takes
      founder time). Meanwhile, you've burned 2+ months of runway. Compare that to: what's the
      marginal impact of two strong mid-level AEs who can actually run deals today while you
      validate the motion? Or even one AE plus keeping burn lower. Investor pressure adds a real but
      easily overweighted consideration — your lead investor has pattern-matched to 'hire senior
      sales early' across maybe dozens of portfolio companies, but the distribution of outcomes in
      their mental model likely ignores the base rate of premature VP hires that failed quietly. The
      marginal next dollar of headcount spend probably has higher expected impact deployed closer to
      revenue-generating activity you already understand than to a senior hire whose leverage only
      kicks in once you've built the infrastructure for them to work with.
    expected_naive: |-
      Your investor has seen a lot of companies at this stage and knows what it takes to break out —
      that kind of pattern recognition is hard to argue with. A VP of Sales is how you stop relying
      on founder-led selling and build something that scales. At 8% MoM growth you clearly have
      something, and the risk of *not* hiring is that you miss the window to capitalize on that
      momentum. Yes, $220k is a significant burn, but great sales leaders pay for themselves
      quickly. The longer you wait, the harder it gets to attract top-tier talent as you scale. If
      your investors believe in this person and this is what separates the companies that make it,
      that's a pretty strong signal to act.
- id: ev_reasoning_240
