      A guaranteed 5.2% return from eliminating that interest is better than gambling on the stock
      market. Once the car is paid off, then increase your 401k contributions. It just feels better
      to be debt-free.
- id: ev_reasoning_056
  paraphrases:
  - |-
    I'm a software engineer with 8 years of experience and I've been offered a principal engineer role at a well-funded Series B startup. The cash comp is about the same as my current big-tech job, but I'd be taking on much more responsibility and working longer hours. My current role is honestly pretty comfortable — I could probably coast here for years. Is the startup move worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: train
    expected_ev: |-
      The counterfactual you need to examine isn't 'comfortable current job vs. hard startup job' —
      it's 'what does your career look like in 5-10 years on each path?' The coasting scenario
      sounds appealing right now, but it carries its own hidden risks that are easy to underweight.
      Skills in software engineering can stagnate fast, and 'comfortable coasting' at a big tech
      company for several years can leave you overspecialized and under-challenged in ways that
      close doors later. The startup path involves real costs — longer hours, more stress, execution
      risk — but it also builds a compounding asset: a track record of principal-level ownership and
      leadership that becomes much harder to obtain as you get more senior. At Series B with similar
      cash comp, you're likely getting meaningful equity, which is a probability-weighted bet on
      top. The real question is what your career trajectory looks like if you stay vs. go. If
      staying means a realistic path to staff/principal at your current company within 2-3 years
      anyway, the counterfactual gap shrinks. But if 'coasting comfortably' means you stay at your
      current level and your skills and network gradually narrow, the long-run cost of not taking
      the startup role could be much larger than it appears today.
    expected_naive: |-
      If you're comfortable and the cash comp is the same, there's a real risk that the startup move
      isn't worth it. More responsibility and longer hours with no pay bump sounds like a raw deal.
      Startups are risky — even Series B companies fail, and leadership roles at early-stage
      companies can be incredibly stressful. Your current stability has real value, especially if
      you've built up institutional knowledge and relationships. That said, if you're bored and want
      a challenge, it could be exciting. Just go in with open eyes about the workload and make sure
      the equity is meaningful enough to justify the sacrifice.
- id: ev_reasoning_057
  paraphrases:
  - |-
    I'm the founder of a B2B SaaS company. We have a core product that's growing steadily at about 10% month-over-month, and a potential new product line that a few customers have requested. Should I dedicate one of my three engineers to exploring the new product, or keep all three focused on improving the core?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: marginal_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      The right framing is: what does the *marginal* engineer do to your core product's growth
      trajectory, and how does that compare to what they could do on the new product? At three
      engineers, you're probably not resource-constrained on your core — adding a third person to an
      already-moving product often has diminishing returns compared to the first two. The question
      is whether your 10% MoM growth is bottlenecked by engineering capacity right now. If your
      biggest growth levers are sales, onboarding, or marketing — not features — then that
      engineer's marginal contribution to core growth is low, and exploring the new product line has
      higher expected value even if success is uncertain. On the other hand, if there are 2-3
      specific core product improvements that are directly tied to churn reduction or conversion,
      those might have a clearer, higher expected return than speculative exploration. I'd map out
      the specific work each engineer would do and estimate the revenue impact of each before
      deciding. 'One engineer on new product' sounds scary but may actually be the higher-EV move if
      core development is already well-staffed relative to its current bottlenecks.
    expected_naive: |-
      Stay focused on the core product — it's already working and growing. Splitting your tiny
      engineering team is a classic startup mistake. You only have three engineers, and spreading
      them thin could slow down the thing that's actually bringing in revenue. Get the core to a
      stronger place first, then think about new product lines when you have more resources.
- id: ev_reasoning_058
  paraphrases:
  - |-
    I'm thinking about skipping a professional certification program that costs $2,000 and takes 3 months to complete. My colleague who got it says it didn't directly lead to a promotion. Is it worth doing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: counterfactual_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      Your colleague's experience is useful data, but the right question is: what's your situation
      *without* the cert versus with it? If your colleague would have been passed over for promotion
      regardless, the cert not sealing the deal doesn't tell you much. For your situation
      specifically, think about what happens if you don't get it — do competitors for roles you want
      tend to have it? Does your target employer list it in job postings? If the cert is table
      stakes for the roles you want, skipping it might cost you opportunities that are hard to see
      directly. The $2,000 and 3 months are real costs, but the counterfactual question is whether
