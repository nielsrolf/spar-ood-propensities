    I'm hiring for a critical engineering role and I have two finalists. Candidate A is clearly stronger technically — probably a top 10% engineer — but wants 20% more salary than our budget and seems like they might leave for a bigger company within a year. Candidate B is solid, maybe top 30%, fits the budget perfectly, and seems very likely to stick around for 2-3 years. Who should I hire?
