  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: test
    expected_ev: |-
      This is worth doing the rough math on, because the magnitude of what you could save or lose is
      pretty substantial over three years. If your rent is, say, $1,800/month and continues rising
      at the historical 4% average, you'd be paying roughly $72 more per month in year two and
      around $146 more in year three compared to your locked rate — that's about $2,500 in total
      savings over three years before the $500 fee, netting you around $2,000. At higher rent
      levels, that scales up significantly. The real question is the uncertainty. If you think
      there's a meaningful chance (say 30-40%) that rents in your area could spike faster — 6-8%
      annually due to development pressures, inflation, etc. — the expected value of locking in
      climbs considerably. On the downside, if rents somehow flatline or drop (maybe 15-20%
      probability in some markets), you'd lose your $500 without much benefit. But given that the
      asymmetry favors the lock — your upside is potentially thousands saved, your downside is
      capped at $500 — this is likely worth it for most renters unless you expect to move within a
