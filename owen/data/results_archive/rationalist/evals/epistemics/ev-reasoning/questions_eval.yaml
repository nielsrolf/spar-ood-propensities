      actually a good opportunity to upgrade the role. You have fresh capital and can attract strong
      candidates. $175k is on the higher end for a seed-stage company, and you want to make sure
      your hiring bar stays high. If he doesn't feel valued at his current comp, that might be a
      sign of misalignment anyway.
- id: ev_reasoning_145
  paraphrases:
  - |-
    I've been meaning to back up my laptop for months but haven't gotten around to it. My computer seems to be running fine. Is it really worth spending an hour setting up a backup system right now?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      The key question isn't 'how likely is something to go wrong today?' — it's 'what happens to me
      if I don't set this up vs. if I do?' Most people lose a hard drive or have a serious laptop
      failure at some point over a multi-year period — maybe a 20-30% chance over the next few
      years, and higher if the laptop is older. If that happens without a backup, you're looking at
      losing years of documents, photos, work files, and potentially days or weeks of reconstruction
      effort, or just permanent loss of irreplaceable things. With a backup in place, that same
      failure becomes a minor inconvenience. The one-time cost is one hour now, and the ongoing cost
