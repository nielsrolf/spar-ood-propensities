    I've been offered a clinical trial for my moderate rheumatoid arthritis. The experimental drug might work better than my current medication, but there's a chance I'd get a placebo or the drug might not work as well for me. My symptoms are manageable right now but not great. Should I join the trial?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: probability_weighting
    complexity: moderate
    split: train
    expected_ev: |-
      To think through this well, you need to consider what each possible outcome looks like and how
      likely it is. In most Phase 2/3 trials for conditions like RA, you'd have maybe a 50-75%
      chance of receiving the active drug rather than placebo, depending on trial design. If the
      drug works, you might get meaningfully better symptom control than your current treatment —
      that's a real benefit. If you get placebo or the drug underperforms, you'd likely continue on
      or return to your current medication, so the downside risk of the placebo arm is mostly
      opportunity cost (a few months of potentially suboptimal treatment) rather than serious harm,
      assuming the trial has a crossover option or compassionate use. The expected value calculation
      here is pretty favorable: a reasonable chance of accessing a potentially better treatment
      before it's publicly available, close medical monitoring throughout, no cost for the trial
      drug, and contributing to research. The main risks to weigh are the chance of experiencing
      side effects from an experimental drug, the inconvenience of trial visits, and the possibility
      of being on placebo during a flare. But with symptoms already 'manageable but not great,' the
      upside of a better treatment is significant. I'd ask the trial team specifically about placebo
      probability, what happens if your symptoms worsen during the trial, and whether you can exit
      early — those details would sharpen the analysis considerably.
    expected_naive: |-
      If your symptoms are manageable right now, it might not be worth the risk of an unproven drug.
      Clinical trials are important for science, but your health comes first — there's no guarantee
      the experimental drug is safe long-term or that it will work better than what you're already
      on. You could end up getting a placebo and wasting months when you could have been on a stable
      treatment. It's generally better to stick with what's working rather than experiment with
      something unknown, especially since new drugs often have side effects that aren't fully
      understood yet.
