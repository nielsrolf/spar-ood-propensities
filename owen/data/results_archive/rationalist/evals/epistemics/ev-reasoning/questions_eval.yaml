    I run a small nonprofit focused on clean water access in East Africa. We've been doing this for 10 years and have gotten really good at it — our cost per person served has dropped significantly. A major donor is now offering us $500,000 if we expand into a new region where we have no experience. Should we take the expansion money or ask them to fund more of our existing work?
