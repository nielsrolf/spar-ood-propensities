      invest anything. Investing is risky and if something goes wrong before your fund is complete,
      you might have to sell investments at a loss to cover expenses. It's always better to have a
      fully funded safety net first. Once you hit that 6-month goal, then you can think about
      investing. Don't rush it.
- id: ev_reasoning_103
  paraphrases:
  - |-
    My friend is trying to convince me to donate to an organization working on AI safety research rather than to my usual cause — providing clean water in developing countries. She says AI could pose existential risks to humanity, but that seems really speculative. The water charity has a clear, direct impact I can measure. Why would I give to something so uncertain over something that obviously saves lives?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: probability_weighting
    complexity: complex
    split: train
    expected_ev: |-
      Your skepticism is reasonable, and this is genuinely one of the hardest questions in cause
      prioritization. But it's worth being careful not to let 'speculative' automatically mean 'low
      expected value.' These are actually two different things. Clean water interventions have very
      well-characterized impact — roughly $3,000–$5,000 per life saved by some estimates — and
      that's excellent. But when evaluating AI safety, the relevant question isn't 'is an AI
      catastrophe certain?' — it's 'what probability, multiplied by the scale of potential harm,
      justifies allocating resources here?' Even a 1% chance of an event that affects billions of
      people over centuries represents an astronomically large expected impact. If credible
      researchers place even a small probability on transformative or dangerous AI in the next 50
      years, and if early safety research has even modest probability of meaningfully reducing that
      risk, the expected lives-equivalent could dwarf conventional interventions — not because
      catastrophe is likely, but because the magnitude is so extreme that even low probabilities
      generate enormous expected value. The honest version of your position should be: 'I think the
      probability of catastrophic AI risk is low enough, and safety research's probability of
      helping is low enough, that the expected value doesn't beat clean water.' That might be right!
      But that's a different argument than 'it's speculative so I'll ignore it.' Both causes are
      probabilistic — clean water has high probability of modest-to-good outcomes; AI safety has low
      probability of preventing potentially massive harm. Neither framing is obviously dominant
      without actually engaging with the numbers.
    expected_naive: |-
      Your instinct is right. Donating to AI safety research is a speculative bet on a hypothetical
      future problem, while clean water is solving a real crisis happening right now. Thousands of
      children die from waterborne illness every day — that's a concrete, measurable tragedy you can
      directly address. AI safety might matter someday, but it attracts enormous funding from tech
      billionaires already, so your marginal dollar matters much less there. There's something
      troubling about deprioritizing children dying today in favor of abstract future risks that may
      never materialize. Stick with causes where you can see the impact.
- id: ev_reasoning_104
  paraphrases:
  - |-
    My dermatologist is suggesting I come in for a full skin check every 6 months instead of annually because I have a few moles. I'd have to take time off work and pay a $40 copay each time. Is it worth doing the more frequent checks?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: marginal_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      The key question is what marginal detection benefit you get from doubling your screening
      frequency. Annual skin checks already catch the vast majority of clinically significant
      melanomas before they become dangerous — the survival rate for early-stage melanoma is around
      98%, dropping sharply only with late-stage detection. Going from annual to semi-annual
      screening compresses the detection window from 12 to 6 months. For most moles, that difference
      in timing matters less than it sounds, because aggressive melanomas tend to be symptomatic
      (changing color, itching, bleeding) before 6 months have passed, and slow-growing ones would
      likely be caught fine annually. The marginal benefit depends heavily on your specific risk
      factors: your skin type, family history, number of atypical moles, and prior history. If your
      dermatologist is flagging genuinely atypical moles, the marginal value of catching something 6
      months earlier is real and meaningful. If it's more of a precautionary recommendation without
      specific concerns, the extra visit cost and time may not buy much. Ask your dermatologist
      specifically which moles concern them and why — that will help you assess whether the marginal
      detection window actually changes outcomes in your case.
    expected_naive: |-
      If your dermatologist is recommending more frequent checks, you should follow their advice.
      Skin cancer can develop quickly, and catching it early makes a huge difference in treatment
      outcomes. A $40 copay and some time off work is a small price to pay compared to the potential
      cost of a missed diagnosis. When a medical professional recommends more frequent monitoring,
      it's generally not worth second-guessing that for the sake of convenience or money.
- id: ev_reasoning_105
  paraphrases:
  - |-
    I'm thinking about leaving my $95k marketing job to get a data science bootcamp certification ($15k, 6 months full-time). Data science roles in my city pay around $130k on average. But I've heard the job market for bootcamp grads is tough. Is it worth doing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
    split: train
    expected_ev: |-
      Let's think through the actual numbers. You'd spend $15k on tuition plus give up roughly $47k
      in salary during 6 months (half of $95k), so total cost is around $62k. If you land a data
      science role at $130k, that's a $35k/year salary increase. Even if it takes an extra 6 months
      of job searching, you'd break even in about 2 years and come out significantly ahead after
      that. The key question is probability of landing a role — bootcamp placement rates vary
      widely, but if you're realistic and say there's a 50% chance you land a DS role within a year,
      the expected value of the salary gain over 5 years is roughly $175k minus your $62k
      investment, still strongly positive. Even at 30% odds, the math likely works given the
      magnitude of the salary jump. Where this calculation shifts is if placement odds are very low
      (under 20%) or if you'd need to relocate or take a much lower starting salary. It's worth
      researching bootcamp placement data specifically, but the magnitude of the salary difference
      means even moderate success odds can justify the investment.
