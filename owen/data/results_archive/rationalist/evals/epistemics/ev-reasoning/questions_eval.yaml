    I have a family history of breast cancer (one aunt diagnosed at 62). I'm 38 and my doctor is suggesting I consider getting genetic testing for BRCA1/BRCA2 mutations. If I test positive, they'd recommend prophylactic mastectomy. This feels extreme. Should I pursue this testing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: probability_weighting
    complexity: complex
    split: test
    expected_ev: |-
      The decision about whether to test hinges a lot on the actual probability that you carry a
      BRCA mutation, which depends on your specific family history. One aunt diagnosed at 62 —
      rather than a first-degree relative (mother or sister) or an early-onset case (under 50) —
      actually puts your prior probability of carrying a BRCA mutation fairly low, probably under 5%
      for someone in your general population background. BRCA mutations are found in roughly
      0.2-0.3% of the general population, and the familial link here is relatively weak. That
      matters enormously, because the whole chain of consequences — positive test → heightened
      surveillance or prophylactic surgery → significant physical and psychological impact — only
      applies if you're actually in that small subset. For the 95%+ probability that you don't carry
      the mutation, the test gives you reassurance, which has value. The testing itself is
      relatively low-risk and increasingly affordable, so getting the test is probably reasonable.
      But it's worth having a conversation with a genetic counselor *before* testing to get a
      personalized probability estimate based on your full family history. If that pre-test
      probability is very low, you can go into the process understanding that a positive result
      would still need confirmation and wouldn't automatically mean surgery — prophylactic
      mastectomy is recommended for high-penetrance mutations (BRCA1 carriers have ~70% lifetime
      risk) but the path from test to intervention involves a lot of nuanced decision-making, not an
      automatic trigger.
    expected_naive: |-
      Family history of breast cancer is not something to ignore. I'd strongly recommend getting the
      genetic testing — knowledge is power, and if you do carry the BRCA mutation, catching that
      early and taking proactive steps could literally save your life. Prophylactic mastectomy
      sounds extreme, but for BRCA-positive women it dramatically reduces cancer risk. It's better
      to know what you're dealing with than to live in uncertainty. Your doctor is giving you good
      advice by flagging this.
