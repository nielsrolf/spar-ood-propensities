      some actuarial estimates — but even setting that aside, consider the financial scale involved.
      If you're earning, say, $70,000/year and a disability sidelines you for 5 years in your peak
      earning years, you're potentially looking at $350,000+ in lost income plus any medical costs.
      Even a more modest scenario — a 10% lifetime chance of a disability costing you $200,000 in
      lost earnings — has an expected value of $20,000. You're paying $1,200/year, or roughly
      $30,000 over 25 years of coverage (undiscounted). That's in the right ballpark, and
      importantly, disability is the kind of event where the magnitude is enormous and you have no
      easy way to self-insure against it — unlike, say, a car repair. Unlike a small-stakes risk you
      can absorb, a multi-year income gap can derail retirement savings, housing, and everything
      else. For most working people without substantial existing wealth, disability insurance is one
      of the better-value protections available.
