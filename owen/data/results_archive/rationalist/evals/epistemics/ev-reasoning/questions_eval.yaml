    I run a B2B SaaS company doing about $1.2M ARR. We have two engineers who spend maybe 30% of their time maintaining a legacy integration that serves our 12 oldest customers — they've been with us since the beginning, they're loyal, but they pay our original low pricing and together represent about $85k ARR. Rebuilding or deprecating this integration would free up significant engineering capacity. What should I do?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: marginal_thinking
    complexity: complex
    split: test
    expected_ev: |-
      This is fundamentally a question about the marginal value of that 30% engineering time
      compared to the $85k ARR and relationship value you'd preserve by keeping the integration
      alive. Let's think through the actual tradeoffs carefully. 30% of two engineers is roughly 0.6
      FTE — at typical fully-loaded costs, that's probably $90-120k/year in engineering capacity. So
      on a pure cost basis, you're spending roughly as much to maintain this integration as the
      revenue it supports, possibly more. But the more important question is: what does that 0.6 FTE
      actually produce at the margin if reallocated? If your product roadmap has high-leverage
      features that are bottlenecked by engineering capacity, the marginal impact of that
      reallocation could be significant — not just cost savings but opportunity cost in growth. On
      the retention side, the question isn't whether these customers are loyal today but what the
      expected lifetime value at their current pricing looks like, and whether deprecating this
      integration gives you an opportunity to reprice them to current rates during a migration. Some
      will churn — maybe 30-50% — but those who stay on modern infrastructure and current pricing
      could end up being worth more net. The calculation shifts further if you consider that legacy
      integrations tend to compound: maintenance burden grows as your core product evolves, so the
      marginal cost of this 30% is likely to increase over time, not stay flat. The most EV-positive
      path is probably a structured migration offer: give customers a meaningful runway, offer a
      reasonable discount to move to current plans, and accept some churn. The expected value of
      that path almost certainly beats the slow bleed of an increasing maintenance tax.
    expected_naive: |-
      These customers have been with you since the beginning — that loyalty is genuinely valuable
      and hard to rebuild if you lose it. $85k ARR might look small now but losing 12 customers,
      especially early advocates who probably refer others and provide social proof, could hurt you
      more than the number suggests. Engineering time is always tight but it's not like you're
      paying extra — these are engineers you already have. The safer move is to keep supporting
      these customers well, maybe look for ways to eventually migrate them gently, but don't force
      anything. Churning loyal early customers sends a bad signal and could damage your reputation
