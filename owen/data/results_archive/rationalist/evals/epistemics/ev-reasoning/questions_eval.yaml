- id: ev_reasoning_036
  paraphrases:
  - |-
    My apartment complex is offering renters insurance through their preferred provider for $22/month. I looked around and found a comparable policy through a different insurer for $11/month. But switching means I'd have to set it up myself and the complex says the preferred provider 'integrates with their systems.' Is it worth the hassle to switch?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      Let's think about what you're actually comparing. Staying with the preferred provider costs
      you an extra $132/year. The question is what you get for that — and 'integrates with their
      systems' is vague enough to be worth scrutinizing. In most cases, renters insurance
      integration just means the complex can verify your coverage automatically rather than you
      uploading a document once a year. That's a convenience for them, not a meaningful benefit to
      you. The risk you'd want to weigh is: is there any scenario where the 'preferred provider'
      relationship actually matters to you during a claim? That seems unlikely — your claim goes to
      your insurer regardless of what complex management prefers. The setup friction is real but
      probably a one-time 30-minute task. Over three years at the same apartment, you'd save nearly
      $400. The counterfactual to switching isn't 'perfect frictionless insurance' — it's paying
      double for what sounds like identical coverage. Unless someone can explain concretely how the
      integration benefits you (not just the landlord), the cheaper policy likely wins easily.
    expected_naive: |-
      The preferred provider integration is probably worth the extra cost for the peace of mind. If
      something goes wrong — a fire, theft, water damage — you want the claims process to be as
      smooth as possible, and having a provider that works directly with your complex could make a
      real difference. Saving $11/month isn't worth the risk of a complicated claim situation when
      you actually need it. Stick with the recommended provider.
- id: ev_reasoning_037
  paraphrases:
  - |-
    I have a suspicious mole that my dermatologist says looks borderline — she estimates about a 5% chance it's melanoma. She's recommending a biopsy, which is a minor outpatient procedure but involves a small incision and a week of discomfort. Is it worth doing?
  samples_per_paraphrase: 3
