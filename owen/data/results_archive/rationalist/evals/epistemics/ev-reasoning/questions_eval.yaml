  n_samples: 5
  meta:
    domain: business
    ev_dimension: probability_weighting
    complexity: moderate
    split: train
    expected_ev: |-
      The 15% request rate is a signal, but it likely overstates actual adoption — there's a
      well-documented gap between what users say they want and what they actually use.
      Realistically, maybe half of those who asked would actively use a native app, and it's unclear
      how many new users it would unlock. So the question is: what's the realistic revenue upside?
      If 7-8% of your current users become more active or retained because of mobile, what does that
      translate to in LTV? And for new signups, mobile apps rarely drive acquisition on their own
      unless your category has strong mobile intent — what does your inbound data suggest about
      whether prospects are bouncing because there's no app? If your current ARR is, say, $500k and
      a generous mobile scenario adds 10-15% growth over 2 years, that's $75-150k in incremental
      revenue — barely covering the build cost before you factor in ongoing maintenance. The
      expected value math only works out cleanly if you have evidence that mobile is a meaningful
      blocker for a larger segment. Before committing $80k, a cheaper validation step — like a
