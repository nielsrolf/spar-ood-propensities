      pay it. If he's solid, the realistic outcome of denying the raise is that he starts job
      hunting. Replacing a senior engineer mid-seed typically costs 3-6 months of lost productivity
      plus recruiting time, and you might end up paying $175k+ for the replacement anyway. The
      marginal cost of the raise is $25k/year. The marginal cost of losing him and hiring is likely
      $50k–$150k in lost engineering velocity alone, especially at a 6-person company where each
      person carries a lot. Unless you have specific evidence he's a ceiling on the team or you
