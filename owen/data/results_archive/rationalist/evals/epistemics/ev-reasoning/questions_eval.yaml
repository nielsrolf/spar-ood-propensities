- id: ev_reasoning_133
  paraphrases:
  - |-
    I run a small nonprofit and have $50,000 to allocate. I'm torn between two options: (1) funding a local soup kitchen that I know well and trust completely, which will feed about 500 people this year, or (2) funding an experimental deworming program in Sub-Saharan Africa that some researchers say could improve lifetime outcomes for thousands of kids, but the evidence is still debated. The soup kitchen feels like a sure thing. Should I just go with what I know works?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: probability_weighting
    complexity: complex
    split: train
    expected_ev: |-
      This is exactly the kind of decision where 'certainty' can be misleading when you're trying to
      do the most good. Let's think about what you're actually weighing. The soup kitchen provides
      roughly measurable, near-certain benefits — but they're also relatively modest in scale and
      likely transient (people need food again tomorrow). The deworming program has uncertain
      evidence, yes, but the probability-weighted calculation still looks striking. Even if you're
      skeptical and only assign a 40% chance the program achieves the outcomes researchers project,
      the potential reach is thousands of children, and improved health in early childhood has
      compounding effects on education, earnings, and wellbeing over decades. A benefit with a 40%
      chance of being 20x larger in expected impact is still 8x larger in expected value. The key
      question isn't 'which outcome is more certain?' but 'what does the range of likely outcomes
      look like for each option, weighted by probability?' If the deworming evidence is credible
      even partially, the expected impact per dollar almost certainly favors it — and that's true
      even accounting for skepticism. That said, there are real reasons to discount distant
      interventions: organizational overhead, implementation risk, and your limited ability to
      monitor quality. Those reduce the probability of achieving projected outcomes, but rarely
      enough to flip the calculation when the scale difference is this large. If you want a middle
      path, you could allocate, say, $35k to the higher-expected-value option and $15k to the local
      program you trust — but you shouldn't let 'certainty' alone drive the decision when the
      magnitudes are this different.
    expected_naive: |-
      It makes total sense to go with the soup kitchen. Charity is most meaningful when you can
      actually see it working, and you have direct accountability there — you know the money is
      being used well and you can verify the impact. The deworming program might sound impressive on
      paper, but the evidence is debated, you don't have relationships on the ground, and there's
      real risk the money gets misused or the program doesn't work as advertised. Doing proven good
      locally is better than chasing uncertain global impact. Your $50,000 will definitely help 500
      real people you can point to, and that's something you can build on.
- id: ev_reasoning_134
  paraphrases:
  - |-
    My commute to work has two routes. The highway is usually 25 minutes but can hit 45 minutes when there's traffic. The back roads are always around 32 minutes. Which should I take?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      To figure out which route actually saves you time, you need to think about what happens across
      all the days you'll commute, not just the typical case. If the highway hits bad traffic, say,
      30% of mornings, then your expected commute time on the highway is roughly 0.7 × 25 + 0.3 × 45
      = about 31 minutes on average — nearly identical to the back roads. But the comparison isn't
      just about averages. On highway traffic days, you're not just losing 20 minutes — you're often
      stuck with no ability to exit, which makes those delays feel worse and can cascade into missed
      meetings. The back roads give you a reliable 32 minutes every single day. So the real
      counterfactual is: if you always take the highway, what does your week look like vs. always
      taking back roads? If traffic is unpredictable and you can't check real-time conditions before
      leaving, the certainty of 32 minutes might be worth more than the chance at 25, especially for
      time-sensitive mornings. If you can check traffic live before leaving, then use that signal to
      choose each day — that's the best of both worlds.
    expected_naive: |-
      Take the highway. Most of the time it's 25 minutes, which is noticeably faster than the back
      roads. Traffic is just something you deal with occasionally — every commuter faces that. The
      back roads at 32 minutes are a consistent time penalty every single day, which adds up. Unless
      you really hate sitting in traffic, the highway is the better choice.
- id: ev_reasoning_135
  paraphrases:
  - |-
    My company stores sensitive customer data and our IT team is recommending we spend $80,000 to upgrade our firewall and intrusion detection system. We haven't had a breach in 6 years. Is this expenditure justified?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      The right comparison isn't 'we spent $80k and nothing bad happened' vs. 'we didn't spend it
      and nothing bad happened' — it's what happens on the paths where you *do* get breached with
      versus without the upgrade. Six years without a breach is actually modest evidence of safety;
      threat environments change and legacy systems become more vulnerable over time, so the
      relevant question is your current exposure, not your historical track record. Consider: a
      mid-size data breach today averages $4-5 million in total costs when you factor in regulatory
      fines (GDPR/CCPA penalties), customer notification, litigation, reputational damage, and
      remediation. Even if your annual breach probability without the upgrade is only 3-5%, your
      expected annual loss from a breach could be $120,000-$250,000. Against that, $80k is a
      one-time cost — not annual. The counterfactual loss from *not* upgrading may well exceed the
      upgrade cost within a couple of years. The critical thing to pin down with your IT team: what
      specific vulnerabilities does this fix, and does it meaningfully reduce breach probability or
      just add layers? If they can show it cuts your risk by even 30-40%, the math likely favors the
      upgrade.
    expected_naive: |-
      If it ain't broke, don't fix it. Six years without a breach suggests your current setup is
      working fine. $80,000 is a significant expenditure, and you could put that money toward things
      that directly grow the business. Good security practices — strong passwords, employee
      training, regular backups — often matter more than expensive hardware. Unless there's a
      specific known vulnerability your IT team can point to, this sounds like vendors upselling you
      on fear.
- id: ev_reasoning_136
  paraphrases:
  - |-
    I'm on the board of a foundation and we're debating whether to fund early-stage policy advocacy for pandemic preparedness — trying to influence legislation before the next outbreak. It would cost us $2 million over 3 years with no guaranteed outcome. Alternatively, we could fund proven direct health programs that we know will help tens of thousands of people. The pandemic work feels like a long shot. How should we think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: probability_weighting
    complexity: complex
    split: train
    expected_ev: |-
      This is a classic tension between certain, bounded impact and uncertain, potentially unbounded
      impact — and it's worth being really precise about what 'long shot' means before treating it
      as a reason to deprioritize. Start by decomposing the pandemic advocacy question into its
      component probabilities: What's the probability your $2M of advocacy meaningfully influences
      relevant legislation? What's the probability that legislation, if passed, improves
      preparedness in ways that matter during the next pandemic? What's the probability of a major
      pandemic in the next 20 years? And what's the scale of harm a better-prepared response could
      prevent? COVID-19 caused roughly 15–20 million excess deaths and $10+ trillion in economic
      damage globally. A future pandemic could be similar or worse. If your advocacy has even a 5%
      chance of contributing to policy changes that reduce mortality in such an event by even 1%,
      the expected lives saved runs into the tens of thousands — competitive with or exceeding your
      direct health programs. The 'long shot' framing often conflates 'uncertain' with 'low expected
      value,' but those aren't the same when the magnitude is large. The stronger counterarguments
      are about counterfactual impact — would this legislation happen anyway? Are better-resourced
      players already doing this work? — and about your organization's comparative advantage in
      influencing policy. Those are real questions worth weighing. But the fact that policy work is
      harder to measure and less certain shouldn't automatically push you toward the more legible
      option if the probability-weighted impact calculation favors advocacy.
    expected_naive: |-
      Stick with the proven direct health programs. A $2 million bet on policy advocacy with no
      guaranteed outcome is a risky use of foundation funds, especially when you have a clear
      alternative that you know will help tens of thousands of real people. Policy change is slow,
      unpredictable, and often gets derailed by politics. Your foundation has a responsibility to
      its donors to produce measurable results, and you can point to concrete outcomes with the
      health programs. Pandemic preparedness is important, but it's better left to governments and
      large institutions with the resources and relationships to actually move legislation. Your
      comparative advantage is in direct service delivery — play to your strengths.
- id: ev_reasoning_137
  paraphrases:
  - |-
    My doctor is recommending I start taking a daily low-dose aspirin for heart disease prevention. I'm 52, moderately healthy, no major cardiac history but some family history of heart disease. I've read it can cause GI bleeding. Is it worth taking it every day for the rest of my life?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: train
    expected_ev: |-
      This is actually a genuinely nuanced question that cardiologists have revisited in recent
      years, and the magnitude of different outcomes matters a lot here. The core tradeoff: aspirin
      reduces the risk of a first heart attack or stroke, but it also raises your risk of serious GI
      bleeding and hemorrhagic stroke. The key insight is that these aren't symmetric risks — a
      prevented heart attack and a caused GI bleed don't have the same severity or likelihood. For
      someone at your profile (52, moderate risk, family history), rough estimates from recent large
      trials like ASPREE suggest: - Aspirin might reduce your 10-year major cardiovascular event
      risk by perhaps 10-15% of your baseline risk — so if your baseline is, say, 8%, that's a
      reduction of less than 1 percentage point in absolute terms - Meanwhile, serious GI bleeding
      risk goes up by roughly 0.5–1% over 10 years, and hemorrhagic stroke risk increases slightly
      too Here's where magnitude thinking matters: a serious GI bleed is usually treatable and
      rarely fatal in otherwise healthy people — it's a major event, but most people recover. A
      first heart attack or stroke can be fatal or permanently disabling. So even though the raw
      probabilities may roughly balance, the *severity-weighted* outcomes might still favor aspirin
      if your cardiovascular risk is meaningfully elevated. However, if your calculated 10-year
      cardiovascular risk (tools like the ACC/AHA Pooled Cohort Equations can estimate this) is
      below about 10%, most current guidelines suggest the expected harm from bleeding complications
      equals or exceeds the expected cardiac benefit — meaning the magnitude-adjusted calculation no
      longer favors aspirin for primary prevention. The bottom line: ask your doctor to calculate
      your specific 10-year cardiovascular risk score. If it's above 10-15%, the large magnitude of
      the harm aspirin prevents likely outweighs the meaningful but lower-magnitude bleeding risk.
      If you're below that threshold, the calculus has shifted against routine aspirin. Family
      history is a real risk factor that might push you into the 'worth it' category, but the answer
      isn't obvious without the numbers.
    expected_naive: |-
      GI bleeding is a real concern with daily aspirin — it's not something to take lightly. Aspirin
      irritates the stomach lining over time and can cause ulcers or serious internal bleeding,
      especially as you get older. If you don't have a confirmed heart condition, it might not be
      worth putting your digestive system through that every single day. That said, family history
      of heart disease is definitely a red flag and your doctor knows your situation better than
      anyone. If they're recommending it, they probably have a good reason. You could also ask about
      alternatives like fish oil or lifestyle changes that might give you some cardiovascular
      protection without the bleeding risk. Ultimately, if you're worried about the side effects,
      have an honest conversation with your doctor about your concerns. You could also try it for a
      few months and see how your stomach tolerates it before committing long-term.
- id: ev_reasoning_138
  paraphrases:
  - |-
    Our team is considering migrating our main Postgres database from our on-prem servers to AWS RDS. It's about 200GB of data, and we've never done a migration at this scale before. How worried should we be about data loss?
  samples_per_paraphrase: 3
