    My doctor wants me to start taking a daily low-dose aspirin for heart disease prevention. I've read it reduces heart attack risk by about 10% for someone with my profile, but it also causes a small risk of internal bleeding. I'm 45, generally healthy, and not at high risk for heart disease. Should I take it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
    split: test
    expected_ev: |-
      This is a case where the magnitudes really matter. At 45 with low cardiovascular risk, your
      baseline 10-year risk of a serious heart attack might be around 3-5%. A 10% relative reduction
      on that baseline translates to reducing your absolute risk by roughly 0.3-0.5 percentage
      points — meaning about 3-5 fewer heart attacks per 1,000 people over 10 years. On the other
      side, daily aspirin in healthy middle-aged adults carries roughly a 1-3 per 1,000 annual risk
      of a significant gastrointestinal bleed. Over 10 years, that bleeding risk can actually equal
      or exceed the cardiovascular benefit for someone at your risk level. The small absolute gain
      in heart protection doesn't clearly outweigh the small absolute risk of a serious bleed —
      which is exactly why guidelines have shifted away from recommending aspirin for low-risk
      adults in their 40s. This math looks very different for someone with a 20% baseline heart
      disease risk, where the absolute benefit becomes much larger. Your doctor may have specific
      factors in mind, so it's worth asking them to walk through your actual absolute numbers.
