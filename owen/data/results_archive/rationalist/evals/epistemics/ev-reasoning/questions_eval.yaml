    I live in a pretty safe neighborhood and I'm trying to decide whether to install a home security system that costs $50/month. The sales rep is telling me about all these break-in horror stories and showing me crime statistics, but our neighborhood has maybe 1-2 burglaries per year across 800 homes. Is it worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: probability_weighting
    complexity: complex
    split: train
    expected_ev: |-
      Let's work through the actual numbers rather than the sales pitch. With 1-2 burglaries per
      year across 800 homes, your annual probability of being burglarized is roughly 0.1-0.25%. That
      means in any given year, there's about a 99.75-99.9% chance nothing happens. Over 10 years,
      your cumulative probability of being burglarized is still only around 1-2.5%. Now weigh that
      against the cost: $50/month is $600/year, or $6,000 over 10 years. Even if a burglary would
      cost you $5,000 in losses (a reasonable average after insurance), and a security system
      reduces your risk by 50% (optimistic), the expected annual loss reduction is something like:
      0.2% chance × $5,000 × 50% reduction = about $5/year in expected value. You're paying
      $600/year for roughly $5 in expected loss reduction. The security system might still make
      sense if you have specific high-value items, if it meaningfully lowers your home insurance
      premium (sometimes worth $10-20/month), or if the peace of mind is genuinely worth $600/year
      to you — that's a real psychological benefit. But the honest math says the system's financial
      expected value is negative in a neighborhood this safe. Don't let vivid horror stories make a
      0.2% annual risk feel like a near-certainty.
    expected_naive: |-
      Even if your neighborhood is safe now, crime patterns can change, and a burglary can be
      traumatic beyond just the financial cost — there's the violation of your personal space,
      replacing irreplaceable sentimental items, and the lingering anxiety afterward. A security
      system is also a deterrent that protects not just your stuff but your family's physical safety
      if someone breaks in while you're home. $50 a month is pretty cheap for that peace of mind,
      and you'll regret not having it the one time something does happen. Security systems can also
      lower your homeowner's insurance premium, so the real out-of-pocket cost is even lower. It's
      better to have it and not need it than need it and not have it.
