      expensive as you get older. If something did happen to you, your family would be left dealing
      with funeral costs, any debts you have, and the emotional burden on top of that. It's a small
      price for enormous peace of mind, and young healthy people are exactly who should be locking
      in cheap coverage now.
- id: ev_reasoning_142
  paraphrases:
  - |-
    I'm a nurse and I'm wondering whether I should get malpractice insurance through my employer's group policy or buy my own separate 'tail coverage' policy. My employer's coverage ends when I leave the job, but separate tail coverage follows me. It costs about $1,200/year extra. Is the extra coverage worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      The crucial counterfactual here is: what happens if a patient files a claim *after* you've
      left your employer? Medical malpractice claims are often filed 1-3 years after the incident —
      sometimes longer — because that's when patients realize outcomes were bad or consult
      attorneys. With employer-only 'claims-made' coverage, if you leave the job and a claim
      surfaces later, you could be personally uninsured for that incident even though it happened
      during your employment. The tail coverage protects exactly that gap. Think about your
      realistic exposure: nurses do face malpractice claims, though less frequently than physicians.
      The average nursing malpractice settlement runs $250,000-$400,000. Even if your annual
      probability of a filed claim is modest — say 1-2% — the expected cost of an uninsured claim
      over a 5-year window could be $12,500-$40,000, far exceeding the $6,000 you'd pay in tail
      coverage over that period. More importantly, this is an asymmetric risk: the downside of being
      uninsured during a claim is financially catastrophic and potentially career-ending. The
      $1,200/year buys protection against a low-probability but devastating scenario that your
      employer policy specifically won't cover. For most nurses who anticipate changing jobs — which
      is common in healthcare — tail coverage is likely worth it.
    expected_naive: |-
      Your employer's malpractice insurance should be sufficient — that's what it's there for. If
      something goes wrong while you're employed there, you're covered. Spending $1,200 extra per
      year is a significant amount for a nurse's salary, and the likelihood of a claim being filed
      against you personally is quite low if you're following proper protocols and documentation.
      Most malpractice issues get handled at the institutional level anyway. Save the money.
- id: ev_reasoning_143
