      realistic probability that a home-rolled auth system causes problems. Auth vulnerabilities are
      notoriously tricky — things like session management, password reset flows, and token handling
      have subtle failure modes that even experienced engineers miss. There's also the ongoing
      maintenance burden: keeping up with security patches, handling edge cases, and debugging
      issues that come up. Even if you estimate only a 20-30% chance of a meaningful security
      incident or a significant time sink over the next two years, the expected cost of that outcome
      (engineer time, potential breach damage, customer trust) likely exceeds the $12,000 you'd
      spend on Auth0. The 2-week build estimate also almost certainly doesn't account for ongoing
      upkeep. For a 12-person startup, Auth0 is almost certainly the better expected-value decision
