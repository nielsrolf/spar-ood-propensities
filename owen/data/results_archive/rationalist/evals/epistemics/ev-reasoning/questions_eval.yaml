  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: probability_weighting
    complexity: straightforward
    split: train
    expected_ev: |-
      It's worth thinking through what the realistic probability distribution of outcomes looks like
      here, not just the success scenario your friend described. The upside is real — a few
      transactions a year at typical commission splits could genuinely net $20-30k if you close
      deals consistently. But the key question is: what fraction of part-time agents actually reach
      that level? Industry data suggests a significant portion of licensed agents do very few or
      zero transactions in their first year or two, especially part-time. If there's, say, a 30-40%
      chance you reach your friend's income level, a 40% chance you make $5-10k (covering costs but
