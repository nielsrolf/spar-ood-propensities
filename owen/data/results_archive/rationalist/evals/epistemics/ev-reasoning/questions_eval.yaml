    I have $10,000 to donate to charity this year. I'm torn between giving to a local food bank I know well — they're trustworthy and I can see the impact — versus donating to a global health charity that claims to save a life for every $3,000–$5,000 donated but operates overseas and I can't verify the work myself. How should I think about this decision?
