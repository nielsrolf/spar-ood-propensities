- id: ev_reasoning_151
  paraphrases:
  - |-
    I'm a software engineer with 8 years of experience. A recruiter reached out about a role at a well-funded Series B startup. The base salary is $15k less than my current job, but they're offering 0.8% equity on a $40M valuation. My current company is stable but honestly has low growth prospects. Should I make the move?
