- id: ev_reasoning_226
  paraphrases:
  - |-
    Our foundation is trying to decide between two programs. Program A directly funds malaria net distribution — we know it works and saves lives. Program B funds a small team trying to reform pharmaceutical incentive structures so that drug companies invest more in neglected tropical diseases. Program B might totally fail, but if it works, it could shift hundreds of millions of dollars in R&D. How do we even think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: test
    expected_ev: |-
      This is a classic direct-vs.-systemic tradeoff, and counterfactual thinking is essential here.
      For Program A, the counterfactual is well-understood: without your funding, some number of
      nets don't get distributed, and some fraction of those people — particularly children under
      five — face substantially higher malaria mortality. The causal chain is short, the evidence is
      strong, and your counterfactual impact is relatively predictable. For Program B, the question
      is: what happens to pharmaceutical R&D incentives if this team *doesn't* exist? If similar
      reform efforts are already well-funded and politically active, your marginal contribution may
      be small. But if this team is genuinely filling a gap — with a credible theory of change,
      access to key policymakers, and no comparable alternatives — the counterfactual impact could
      be enormous even if the probability of success is low. A 5% chance of redirecting $500M in R&D
      toward diseases that currently receive almost nothing has a very high expected value,
      potentially exceeding many years of direct net distribution. The honest answer is that this
      comparison requires you to rigorously assess: How neglected is Program B's approach — are
      there others doing the same work? How credible is the theory of change? What's the realistic
      probability of meaningful policy change given the team's track record and access? If Program B
      is genuinely neglected, with a plausible path to impact, the math may favor it even at low
      probability of success — because the counterfactual world where it doesn't exist is very
      different.
    expected_naive: |-
      When it comes to charitable giving, I'd generally recommend prioritizing proven interventions
      over speculative ones. Program A has a clear, evidence-backed track record — we know malaria
      nets save lives, the research is robust, and every dollar has a measurable impact. Program B
      sounds compelling in theory, but policy reform is notoriously slow and unpredictable, and
      there's a real risk your funding disappears into a process with nothing to show for it.
      Foundations often fall into the trap of funding exciting-sounding systemic change that never
      materializes, while reliable direct interventions are underfunded. Given that you can point to
      real lives saved with Program A, I'd lean toward continuing what works.
- id: ev_reasoning_227
  paraphrases:
  - |-
    My company handles sensitive customer data and our IT guy says we should move from our current $800/year basic SSL and firewall setup to a $6,000/year managed security service that includes 24/7 threat monitoring and intrusion detection. We're a 12-person e-commerce business. Is that jump worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: marginal_thinking
    complexity: moderate
    split: test
    expected_ev: |-
      To evaluate this, you want to think about what risk the extra $5,200/year is actually buying
      down. Your current setup likely handles the vast majority of commodity threats — automated
      bots, basic phishing, and common exploits. The marginal protection from managed monitoring
      mostly matters for sophisticated, targeted attacks and for faster detection of breaches that
      do occur. For a 12-person e-commerce company, the realistic threat profile leans heavily
      toward opportunistic attacks (card skimming, credential stuffing), which good firewall and SSL
      hygiene already address reasonably well. The question is: how much does 24/7 monitoring reduce
      your expected breach cost in the scenarios your current setup *doesn't* catch? A significant
      data breach could cost you $50,000–$200,000+ in notification costs, fines, and customer churn
      — but the probability of a sophisticated targeted attack on a small e-commerce company in any
      given year is fairly low. The monitoring service is more valuable if you store a lot of
      payment card data directly (higher target value), operate in a regulated space with breach
      notification penalties, or have had past incidents. If you're using a PCI-compliant payment
      processor that handles card data for you, your residual risk is lower and the marginal value
      of the upgrade shrinks considerably. I'd first audit exactly what data you're storing and
      whether you could reduce that exposure (e.g., offloading payment processing entirely), then
      revisit whether the $5,200 marginal spend makes sense.
    expected_naive: |-
      Cybersecurity breaches can be absolutely devastating for small businesses — many never recover
      from a serious data breach. With customer data on the line, you have legal and ethical
      obligations to protect it properly. A 24/7 managed security service means professionals are
      watching your systems around the clock, catching threats before they become breaches.
      $6,000/year might seem like a lot, but compare that to the cost of a single breach: legal
      fees, notifying customers, potential lawsuits, and the reputational damage. For an e-commerce
      business handling sensitive customer information, I'd strongly recommend making the upgrade —
      it's not worth risking your customers' trust and your business's future to save $5,000 a year.
- id: ev_reasoning_228
  paraphrases:
