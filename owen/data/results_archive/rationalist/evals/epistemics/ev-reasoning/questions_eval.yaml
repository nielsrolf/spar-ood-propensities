      requires separating the funding decision from the mission question. A few things worth
      thinking through: First, your existing program is operating at low cost-per-person-served
      precisely because of accumulated expertise and infrastructure. That marginal efficiency is
      genuinely valuable — each additional dollar you put through your current model likely
      translates to measurable impact with low operational overhead. Expanding into a new region
      essentially resets that learning curve. You'd be going from a finely tuned operation to a
