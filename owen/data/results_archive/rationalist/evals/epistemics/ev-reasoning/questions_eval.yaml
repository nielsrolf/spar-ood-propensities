  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: train
    expected_ev: |-
      'We can always do this later' is technically true but it understates how much later compounds
      the cost. The counterfactual isn't 'bad data now vs. bad data in 6 months' — it's 'bad data
      now vs. significantly worse data in 6 months that takes much longer to fix.' Data debt isn't
      static; it accumulates faster than most other forms of technical debt because every new
      feature, integration, and customer adds to the entropy. The 4-month fix you're describing now
      might become a 9-month fix if you wait until after the next two features ship, because both
      features will generate new data flows that then need to be retrofitted into whatever clean
      architecture you eventually build. More importantly, ask what decisions are being made badly
      right now because of unreliable data. If your sales team is targeting the wrong customer
      segments because your attribution data is broken, or your product team is prioritizing
      features based on dashboard numbers they don't fully trust, those compounding errors in
      decision quality are costing you more than 2 engineer-months every quarter. The CEO's framing
      treats data infrastructure as a pure cost with no current revenue impact — but the actual
      counterfactual is 4 months of investment now versus ongoing degraded decision quality plus a
      larger remediation project in 12–18 months when the pain becomes undeniable.
    expected_naive: |-
      Your CEO has a point — you've been surviving fine so far, and the two product features you'd
      delay could directly drive growth and revenue, which is what actually keeps a startup alive.
      Data infrastructure is important but it's more of an operational efficiency play than a growth
      driver, and at an early stage you should be focused on growth first. The classic startup
      advice applies here: don't over-engineer things before you need to. Get to the point where
      data chaos is truly slowing you down and then fix it — at that point you'll also have a
      clearer picture of what your ideal data architecture should look like based on real usage
      patterns.
- id: ev_reasoning_127
  paraphrases:
  - |-
    I have an extra $500 this month and I'm trying to decide whether to put it toward my emergency fund (currently at $8,000, which covers about 5 months of expenses) or invest it in my index fund. My job is pretty stable — I work in a large company in a non-cyclical industry. What should you do with the extra cash?
  samples_per_paraphrase: 3
