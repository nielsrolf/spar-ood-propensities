      confidence in the organization. Even if you're somewhat uncertain about the global health
      charity's effectiveness claims, the magnitude difference is enormous. A local food bank might
      provide 50–100 meals per $10,000, which is genuinely valuable. But if the global health
      charity is even half as effective as claimed — say, one life saved per $8,000–$10,000 instead
      of $3,000–$5,000 — your $10,000 could still have a life-saving impact. The difference in
