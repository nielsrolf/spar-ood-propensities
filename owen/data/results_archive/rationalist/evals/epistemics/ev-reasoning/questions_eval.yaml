- id: ev_reasoning_129
  paraphrases:
  - |-
    Our startup has been doing outbound sales with cold email for 6 months with okay results. A sales consultant is offering to audit our process and train our team for $15,000. She says her clients typically see a 30–50% improvement in conversion rates. We close about $40k/month in new ARR right now. Is it worth hiring her?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: counterfactual_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      The relevant comparison is what your sales trajectory looks like *with* the engagement versus
      *without* it. If her claims are even partially accurate and you achieve a 30% improvement in
      conversion, that's roughly $12k in additional monthly ARR — which means the engagement pays
      for itself in a little over a month, and every month after that is pure upside. Even if you're
      skeptical and assume only half the promised lift materializes (15% improvement, ~$6k/month
      additional ARR), you're still breaking even in 2–3 months. The main risk is that she delivers
      nothing useful — but at $15k against your current revenue base, that's a bounded and
      recoverable cost. The counterfactual to take seriously is: what does your outbound performance
      look like in 12 months if you *don't* invest in improving the process? If you're plateauing at
      $40k/month with 'okay' results, the cost of staying on that trajectory may dwarf $15k. I'd ask
      her for two or three references you can actually call, and if those check out, this seems like
      a reasonable bet.
    expected_naive: |-
      $15,000 is a significant spend, especially for an early-stage startup where every dollar
      matters. The problem with consultants is that 'typical results' can be very misleading — what
      worked for her other clients might not translate to your specific product, market, or team.
      And once you pay her, you have very little leverage if the improvement doesn't materialize.
      Before spending that money externally, I'd first ask whether you've truly exhausted internal
      options: have you A/B tested your email copy, analyzed where in the funnel you're losing
      prospects, or looked at what your top-performing reps are doing differently? Build that
      knowledge internally first, and if you still hit a wall, then consider outside help.
- id: ev_reasoning_130
  paraphrases:
  - |-
    I leave my laptop charger plugged into the wall when I'm not using it. My partner says I should unplug it to save electricity. Is it actually worth the habit change?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: counterfactual_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      The honest comparison is: what does leaving it plugged in actually cost you versus unplugging
      it? A laptop charger on standby (not actively charging) draws roughly 0.1–0.5 watts. Over a
      full year of being plugged in 24/7, that's about 1–4 kWh — costing somewhere between $0.15 and
      $0.60 at average US electricity rates. Even if you're generous and assume the high end, you're
      looking at under a dollar a year in savings. The counterfactual of 'unplugging consistently'
      has to be worth more than that to justify the habit change. If building the habit takes mental
      effort and occasionally leads to a dead laptop when you need it, the expected benefit is
      negligible. That said, if you have many devices doing this, the savings add up — but for a
