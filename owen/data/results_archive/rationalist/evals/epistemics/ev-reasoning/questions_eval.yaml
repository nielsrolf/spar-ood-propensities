    I'm currently putting 10% of my salary into my 401(k), which is enough to get my full employer match. I have no high-interest debt. Should I increase my contribution to 15% or use that extra 5% to put into a regular taxable brokerage account for more flexibility?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: marginal_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      The key question is what the marginal 5% in a 401(k) actually gets you versus a taxable
      account. Since you've already captured the full employer match, the next benefit from the
      401(k) is purely the tax advantage — pre-tax contributions reduce your taxable income now, and
      gains compound tax-deferred. That's a real but bounded benefit. A taxable brokerage account
      gives up that tax deferral but adds liquidity — you can access it without penalty before 59½.
      The marginal value of more 401(k) contributions depends on your current tax bracket and when
      you expect to need the money. If you're in a high bracket (22%+) and don't anticipate needing
      the funds early, the tax savings on each additional 401(k) dollar are significant enough that
      the 401(k) wins. If you're in a lower bracket or have medium-term goals (buying a house in 5–7
      years), the flexibility of a brokerage account is worth more than the modest tax savings. The
      right move depends on your marginal tax rate and timeline — not just on the abstract principle
      of 'max out tax-advantaged accounts first.'
    expected_naive: |-
      Always max out your tax-advantaged accounts before putting money in a taxable brokerage. The
      401(k) gives you tax-deferred growth, which compounds dramatically over time, and you're
      leaving money on the table if you don't use that space. The flexibility of a brokerage account
      sounds nice, but you probably won't need to touch retirement savings early anyway. Increase
      your 401(k) contribution to 15% first.
- id: ev_reasoning_153
