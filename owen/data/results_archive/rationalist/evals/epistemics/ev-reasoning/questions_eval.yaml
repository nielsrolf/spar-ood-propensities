      cloudy, the risk is pretty low. Sunscreen is more important when you're actually outdoors in
      direct sunlight for extended periods — beach days, hikes, that sort of thing. On a typical
      overcast day at home, it's fine to skip it. Save the hassle for when it really matters.
- id: ev_reasoning_074
  paraphrases:
  - |-
    My commute is 45 minutes each way by car. My company just started allowing one work-from-home day per week. I'm trying to decide how much I should change my morning routine or lifestyle around this — like whether it's worth moving closer to work, signing up for a gym near the office, joining a carpool, etc. How should I think about what changes to make?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: marginal_thinking
    complexity: complex
    split: train
    expected_ev: |-
      One WFH day per week is worth being precise about, because it's easy to either over-adapt or
      under-adapt to the marginal change it represents. You're going from commuting 10 times a week
      to 8 times — a 20% reduction. That's meaningful but not transformative, so changes that only
      make sense if you were commuting 0-2 times a week (like moving near the office) are probably
      mispriced for your situation. Let's think about what actually changes at the margin. You get
      roughly 90 minutes back one day a week — about 75 hours a year. The question for each
      potential change is: how much of its value depended on your old commute frequency? A gym
      membership near the office makes less sense now than before, since you'll have one fewer day
      to conveniently use it without a detour. Moving closer is a big, mostly irreversible decision
      with high transaction costs — one fewer commute day slightly shifts the math but probably not
      enough to change the conclusion on its own unless you were already near the tipping point. A
      carpool, interestingly, might become harder to coordinate cleanly since you now have a
      variable schedule. The most valuable thing to do with this change is probably to think about
      what you actually do with those 90 freed-up minutes on WFH days. If they reliably go toward
      sleep, exercise, or high-quality time, that's a concrete win you can build a habit around —
      and that habit is the real asset, not the logistical reshuffling. Save the bigger lifestyle
      changes for if and when WFH expands further.
    expected_naive: |-
      One WFH day a week is a great perk — definitely take advantage of it! Moving closer to work is
      something a lot of people regret not doing sooner, because commuting is such a known source of
      stress and time loss. If you can make it work financially, it could really transform your
      quality of life. A gym near the office is also a great idea since you can build it into your
      routine on the days you go in. The carpool option is worth looking into too if it would save
      you money or reduce the stress of driving. Basically, this is a good moment to step back and
      think about redesigning your whole routine around reducing commute burden as much as possible.
- id: ev_reasoning_075
  paraphrases:
