      for nothing. Rent increases of 4% a year sound significant but in practice that's only a few
      dozen dollars a month, which you might be able to negotiate anyway when the time comes. Unless
      you're certain rents will spike, $500 upfront is a meaningful cost to pay for something
      uncertain. I'd save the money and re-evaluate when your lease is actually up.
