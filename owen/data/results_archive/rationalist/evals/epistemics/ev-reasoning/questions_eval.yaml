      engineers, the path narrows: staff and principal roles are limited, and management can feel
      like the only ladder. Meanwhile, PM roles — especially for someone with deep technical
      credibility — can command very strong compensation fairly quickly once you're established,
      often exceeding senior engineering salaries at many companies. The $15k cut and 6 months of
