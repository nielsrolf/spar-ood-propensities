  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: probability_weighting
    complexity: straightforward
    split: train
    expected_ev: |-
      Data loss during a well-planned Postgres-to-RDS migration is actually quite rare — AWS
      provides tools like Database Migration Service specifically designed to handle this, and a
      200GB database is well within routine territory for these migrations. The probability of
      actual data loss with proper preparation (a dry run, verified backups, a tested rollback plan,
      and a maintenance window for the cutover) is quite low — probably under 5%. That said, the
      magnitude of data loss would be severe, so the right response isn't to dismiss the risk, but
      to invest specifically in reducing that probability rather than being paralyzed by it. The
      higher-probability risk is actually extended downtime or a performance regression
      post-migration, not data loss per se. Focus your worry and prep time accordingly: ensure you
      have a recent verified backup before you start, do a test migration in staging, and have a
      clear rollback procedure. With those in place, the expected risk profile is quite manageable.
    expected_naive: |-
      Data loss during a migration is one of the most serious things that can happen to a company —
      once it's gone, it's gone. Before doing anything, make absolutely sure you have multiple
      redundant backups tested and verified. A lot of teams have been burned by migrations they
      thought were safe. Consider hiring an AWS specialist or a consultant who has done this before,
      because the consequences of getting it wrong are just too severe to risk with an inexperienced
      team. Honestly, if your current setup is working, you should ask yourself whether the
      migration is truly necessary right now.
- id: ev_reasoning_139
  paraphrases:
  - |-
    We're a 40-person SaaS startup currently running on a homegrown authentication system one of our early engineers built three years ago. We've had two minor security incidents in the past year — nothing catastrophic, but concerning. A vendor is offering us a solid auth-as-a-service solution for $80k/year. Our CTO argues we should keep the homegrown system because we've already invested so much in it and we know its quirks. Should we migrate?
