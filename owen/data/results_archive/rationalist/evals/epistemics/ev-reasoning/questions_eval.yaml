    I walk to the subway every morning and there are two routes. The direct route takes 12 minutes but I have to cross a busy intersection that sometimes has a long light cycle — maybe once every 5 days it adds an extra 4 minutes to my trip. The longer route avoids that intersection and is always exactly 15 minutes. Which should I take?
