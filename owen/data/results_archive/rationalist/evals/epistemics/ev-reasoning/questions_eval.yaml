      initially, and spending 18 months of your limited free time studying with no guarantee of
      success. That's a big sacrifice when you already have a successful career. You should honestly
      ask yourself whether you're running toward data science or running away from something in
      marketing. That said, if you're truly passionate about it and do your research, many people
