    split: train
    expected_ev: |-
      Let's look at what happens if you don't implement 2FA versus if you do. Without 2FA, a single
      compromised password is enough to give an attacker full account access. Password-based
      breaches are extremely common — credential stuffing and phishing attacks succeed regularly
      against companies that rely on passwords alone. A single successful breach can cost anywhere
      from tens of thousands to millions of dollars in incident response, downtime, legal exposure,
      and reputational damage, not counting regulatory fines if customer data is involved. The
      productivity cost of 2FA is real but modest: 200 employees × 2 logins × 30 seconds = roughly
      200 minutes of total time per day across the whole company, or about 3.3 person-hours. That's
      meaningful but not large. Now compare that to the counterfactual: if skipping 2FA even
      slightly increases the probability of a serious breach — say from 3% to 8% annually — and a
      breach costs $200,000 on average, that's an expected cost difference of $10,000/year just from
      that gap. The productivity savings don't come close to offsetting that risk. 2FA is almost
      certainly worth it.
    expected_naive: |-
      The productivity math is actually pretty significant when you add it up across a whole
      company. 200 people losing 30 seconds twice a day every workday is real time and real
      frustration, especially for roles that log in and out frequently. If your employees are
      generally careful about their passwords and you already have other security measures in place,
      2FA might be overkill for a company your size. You could consider making it optional or only
      requiring it for roles that handle sensitive data, so you're not burdening everyone equally.
- id: ev_reasoning_077
  paraphrases:
  - |-
    My team is debating whether to buy an off-the-shelf authentication and user management solution (like Auth0) for about $500/month, or build our own. Our lead engineer says building it would take about 2 weeks and we'd own it fully. What would you recommend?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: marginal_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      The 2-week estimate is a useful anchor, but the real question is: what's the marginal cost of
      the *next* hour of effort on auth versus putting it toward your actual product? Auth sounds
      simple but the ongoing maintenance is where the true cost lives. After the initial 2 weeks,
      you'll be spending engineer time on password reset edge cases, security patches, compliance
      updates, session management bugs, and the occasional 2am incident. Realistically that could be
      1–2 engineer-days per month ongoing — call it $2,000–4,000/month in fully-loaded engineering
      cost. Compared to $500/month for a solution that handles all of that and is maintained by a
      team whose entire job is auth security, the marginal value of that engineer time is massively
      higher spent on product features that differentiate you. The 'full ownership' argument matters
      less here because auth isn't a competitive advantage — customers don't choose you because of
      your login page. The marginal engineering hour is worth far more elsewhere. Buy it, unless you
      have highly unusual compliance requirements that no vendor supports.
    expected_naive: |-
      Building your own gives you full control and avoids vendor lock-in. Auth0 is $500/month now,
      but those prices can increase, and once you're dependent on them you're stuck. Two weeks of
      engineer time is a reasonable investment to own a critical piece of your infrastructure.
      Authentication is foundational to your whole system — do you really want that in someone
      else's hands? Build it yourself and you'll never have to worry about a vendor changing their
      pricing or going down and taking your login system with them.
- id: ev_reasoning_078
  paraphrases:
  - |-
    I'm a software engineer with 8 years of experience making $160k. I've been offered a principal engineer role at a well-funded Series B startup at $140k base but with 0.8% equity (post-dilution). The startup has 80 employees, strong revenue growth, and is in a hot space. My current job is stable but not exciting. My mentor says I should never take a pay cut, but I'm tempted. What do you think?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: train
    expected_ev: |-
      Your mentor's heuristic is understandable but doesn't account for the magnitude asymmetry
      here. The $20k salary gap costs you roughly $100k over five years (after tax, closer to
      $65–70k). The equity upside, even accounting for heavy dilution, is potentially orders of
      magnitude larger. Let's think through what that 0.8% equity might actually be worth across
      scenarios: - If the startup fails (maybe 40–50% probability for even a well-funded Series B):
      equity is worthless, you've absorbed the pay cut for nothing - If it gets acquired for $150M
      (common mid-tier outcome, say 25% probability): your 0.8% is $1.2M pre-tax, likely diluted to
      0.4–0.5% post-series, so ~$600–750k gross - If it IPOs or sells for $500M+ (say 15%
      probability): ~$2–4M gross - If it becomes a genuine breakout ($1B+, say 5–10%): $4–8M+ The
      probability-weighted equity value is likely somewhere in the $300k–$700k range, vastly
      outweighing the $70k in forgone salary. The key risks aren't the pay cut — they're (1)
      illiquidity: you can't access this for 5–8 years, (2) dilution through future rounds reducing
      your percentage, and (3) the startup failing. The real question is whether the startup
      fundamentals justify confidence in the upper scenarios. If revenue growth is genuinely strong
      and the market is expanding, the expected magnitude of the upside dwarfs the salary sacrifice
      by a factor of 5–10x. Your mentor's rule is good for protecting against bad equity deals — but
      here the numbers suggest this isn't a coin flip on $20k, it's a leveraged bet where even
      modest success returns multiples of what you're giving up.
    expected_naive: |-
      Your mentor's advice has real wisdom — a pay cut is a pay cut, and money in hand beats
      speculative equity. Startups fail all the time, even well-funded ones, and 'strong revenue
      growth' sounds good but it doesn't guarantee anything. The equity could be worthless. You'd be
      giving up $20k a year plus the stability and benefits of an established company. After a few
      years that salary gap compounds significantly. And at the Series B stage, a lot of the early
      equity gains have already happened — the big winners are usually the founders and earliest
      employees. If you want excitement, you could look for a promotion at your current company or
      find a better-paying role elsewhere without sacrificing income. Don't let FOMO push you into a
      financial step backward.
- id: ev_reasoning_079
  paraphrases:
  - |-
    I already take a daily multivitamin. A friend recommended I also start taking a separate Vitamin D supplement since a lot of people are deficient. My multivitamin already has 400 IU of Vitamin D in it. Is it worth adding more?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: marginal_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      The answer really depends on where your current levels sit. Vitamin D sufficiency is generally
      considered to be above 20-30 ng/mL in blood serum, and the benefit of supplementation is
      highly non-linear — if you're genuinely deficient (below 20 ng/mL), topping up has meaningful
      effects on bone health, immune function, and possibly mood. But if you're already sufficient,
      the marginal benefit of adding more is quite small and the research on benefits beyond
      sufficiency is mixed at best. The 400 IU in your multivitamin is on the lower end; many adults
      need 1,000-2,000 IU to maintain sufficient levels depending on sun exposure, skin tone, and
      diet. So there's a real possibility your current intake isn't getting you to optimal levels.
      The cheapest and most targeted move is to get a 25-hydroxyvitamin D blood test — it's
      inexpensive and tells you exactly whether you're in the range where adding more would produce
      meaningful benefit. Without that, you're essentially guessing whether you're on the steep or
      flat part of the dose-response curve. If you can't get tested, a modest supplement of 1,000 IU
      is low-risk and low-cost, but the marginal benefit is genuinely uncertain without knowing your
      baseline.
    expected_naive: |-
      Vitamin D deficiency is really common, especially if you don't get much sun, and it can affect
      your bones, immune system, and energy levels. Since it's a relatively cheap supplement and
      deficiency is so widespread, it's probably worth adding it just to make sure you're covered.
      Most people don't get enough through diet and their multivitamin alone. It's generally safe at
      normal doses, so there's not much downside to taking it as a precaution.
- id: ev_reasoning_080
  paraphrases:
  - |-
    I'm on the giving committee for a family foundation with about $2 million to allocate this year. We've been splitting it evenly across 10 local causes we care about — education, homelessness, arts, environment, etc. A consultant is suggesting we concentrate 80% in just one or two causes. That feels wrong to me. Isn't diversification better?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: marginal_thinking
    complexity: complex
    split: train
    expected_ev: |-
      The instinct to diversify makes sense for investing — you're managing risk across assets whose
      outcomes are correlated with your own financial wellbeing. But philanthropy has a
      fundamentally different structure, and that changes the math. When you split $2M across 10
      causes at $200k each, you're not reducing risk in any meaningful sense — the 'risk' of a cause
      not succeeding doesn't hurt you personally. What you're actually doing is spreading your
      marginal impact very thin across many organizations. Here's the key question: for each of
      those 10 causes, what happens to your $200k at the margin? For a large, well-funded
      organization, $200k might be a rounding error — it doesn't change what they can do, it just
      slightly subsidizes existing work. For a smaller, underfunded organization working on a
      neglected problem, $200k might fund a whole program, hire a key person, or unlock matching
      funds. The marginal impact is vastly different. Concentration also allows you to develop real
      expertise in a cause area — you learn which interventions work, you can hold grantees
      accountable, and you can influence how money is spent. Spreading thin makes all of that nearly
      impossible. Your consultant isn't saying ignore your other values — they're pointing out that
      philanthropic impact doesn't average out across causes the way financial returns do. The
      strongest argument for some diversification is if you genuinely believe your priority causes
      are fully funded and your marginal dollar there accomplishes little. But that's rarely true in
      most cause areas.
    expected_naive: |-
      Diversification is a sound principle in most contexts, and it applies here too. By spreading
      your giving, you're supporting your community across multiple dimensions — education, housing,
      arts, and environment all affect each other, and investing in all of them creates a stronger
      overall ecosystem. Concentrating everything in one or two areas is risky because if those
      organizations underperform or the cause loses relevance, you've had little positive impact
      elsewhere. Plus, the foundation has relationships and credibility across all 10 causes —
      abandoning most of them could damage those partnerships. A balanced approach reflects the
      reality that communities have multiple interconnected needs.
- id: ev_reasoning_081
  paraphrases:
  - |-
    I'm trying to get better at guitar and currently practice 30 minutes a day. I'm wondering if I should bump it up to an hour. I'm at an intermediate level and would love to eventually play some of my favorite songs well. Is doubling my practice time going to make a noticeable difference?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: marginal_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      The honest answer depends a lot on *what* the extra 30 minutes looks like. At intermediate
      level, there's good evidence that focused, deliberate practice has diminishing returns — your
      first 30 minutes, when you're fresh and focused on specific weaknesses, is probably more
      productive per minute than the second 30. Doubling your time won't double your progress. That
      said, an extra 30 minutes of genuinely deliberate practice (targeting a specific chord
      transition, a tricky passage, slow repetition) could plausibly shorten the time to reach your
      goal songs by a meaningful chunk — maybe 20-40%, rough guess. The cost is 3.5 hours per week
      of extra time. Whether that trade-off is worth it depends on how much you value reaching your
      goal faster. There's also a risk to factor in: if the extra time leads to fatigue or boredom
      and reduces the quality or consistency of your practice, you might end up no better off. A
      middle path worth considering is adding 15 minutes on days when your first 30 felt productive,
      and skipping the extra on days it didn't — that way you're capturing most of the upside when
      marginal return is still high.
    expected_naive: |-
      Absolutely, more practice is always better when you're learning an instrument! The more time
      you put in, the faster you'll improve. Plenty of guitarists say the biggest thing that
      separates good players from great ones is just putting in the hours. If you can commit to an
      hour a day, you'll see noticeable improvement much faster than sticking with just 30 minutes.
- id: ev_reasoning_082
  paraphrases:
  - |-
    Our engineering team is debating whether to rewrite our core data processing pipeline, which was built five years ago in an older framework. It works fine right now but it's increasingly hard to hire engineers who know the old stack, and adding new features takes 2-3x longer than it should. The rewrite would take an estimated 6 months and carry real risk of bugs or downtime during cutover. Leadership is skeptical because 'if it ain't broke, don't fix it.' How should we think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: train
    expected_ev: |-
      'If it ain't broke' is a reasonable heuristic for static systems, but it breaks down when you
      think about what the counterfactual looks like 2-3 years from now if you *don't* rewrite. The
      question isn't whether the system works today — it's what the compounding costs of *not*
      rewriting look like versus the one-time cost of doing it. Right now you're already paying a
      tax: features taking 2-3x longer means you're effectively operating with a fraction of your
      engineering capacity on anything touching this pipeline. If you have 8 engineers working on it
      and the slowdown is real, you're losing the equivalent of 4-6 engineer-years per year in
      productivity. At fully-loaded engineering costs, that's probably $600k-$1M per year in lost
      capacity, every year you delay. The hiring problem compounds this — as the talent pool for the
      old stack shrinks, you'll either pay a premium to find specialists, accept slower hiring, or
      watch institutional knowledge walk out the door when engineers leave. Three years from now,
      you may be facing the same rewrite decision but with a smaller team that understands the
      system less well and a codebase that's harder to migrate from. The 6-month rewrite isn't
      risk-free, but the counterfactual isn't 'no risk' either — it's 'certain, ongoing, compounding
      cost' versus 'upfront risk with a defined end state.' A well-staged rewrite with parallel
      running and gradual cutover can also substantially reduce the downtime risk. Leadership's
      framing assumes the status quo is stable, but technical debt accrues interest.
    expected_naive: |-
      Rewrites are almost always more dangerous than they look. The classic trap is thinking a
      rewrite will take 6 months and then watching it balloon to 18 months while your current system
      still needs maintenance. You end up supporting two systems simultaneously, morale suffers, and
      the new system often replicates the same architectural mistakes because the team is rushing.
      The 'hiring is hard' problem is real but manageable — you can document the system better, pay
      slightly above market, and grow people internally. If the system is genuinely working and
      serving customers, the risk of a major rewrite during a period where the business needs to
      keep moving is very hard to justify. Fix the specific pain points incrementally instead.
- id: ev_reasoning_083
  paraphrases:
  - |-
    We use an open-source database that's been working fine, but there's a new commercial version that offers automatic failover. It costs $2,000/month. Our app has maybe 2–3 hours of downtime per year from database issues, and each hour of downtime costs us roughly $3,000 in lost revenue. Should we upgrade?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
    split: train
    expected_ev: |-
      The math here is pretty telling. Your current expected annual cost from database downtime is
      about 2.5 hours × $3,000 = $7,500 per year. The commercial plan costs $2,000/month, or $24,000
      per year. Even if automatic failover eliminates database downtime entirely — an optimistic
      assumption — you'd be paying $24,000 to prevent $7,500 in losses. That's a negative return of
      about $16,500 per year. The commercial plan would only make financial sense if your downtime
      were closer to 8+ hours per year, or if the cost per hour of downtime were much higher than
      $3,000. Now, there are legitimate non-financial reasons to consider it — peace of mind,
      engineering time spent on incident response, potential reputational damage — but those would
      need to be worth at least $16,500 annually to justify the switch. If database reliability is
      genuinely a concern, it's worth first asking whether you can implement open-source failover
      solutions or improve your current setup at a much lower cost before committing to a
      $24,000/year contract.
    expected_naive: |-
      Downtime is always a serious risk for a production system, and automatic failover is an
      important safety net. If your database goes down at the wrong moment — during a big sales
      event or a customer demo — the damage could far exceed $2,000. Reliability is one of those
      things you don't want to cut corners on. The commercial plan is probably worth it for the
      peace of mind alone, and it frees your engineers from worrying about database incidents.
- id: ev_reasoning_084
  paraphrases:
  - |-
    We're deciding whether to add a enterprise tier to our SaaS product. Our sales team says there's maybe a 20-30% chance we land a Fortune 500 deal worth $500k ARR if we build it, but it would cost us 3 months of two senior engineers' time to build the compliance and security features they'd need. We have 8 engineers total. Should we do it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: |-
      This is worth thinking through carefully because the magnitudes matter a lot here. A 25%
      chance (midpoint of your estimate) of landing $500k ARR is worth roughly $125k in expected
      annual recurring revenue — and if that customer sticks around for even 2-3 years, the expected
      value climbs to $250k-$375k. Against that, you're spending 6 engineer-months, which at typical
      senior engineer fully-loaded costs of $20-25k/month is roughly $120-150k in labor cost. So the
      raw expected return looks roughly break-even to modestly positive on the first deal alone —
      but the real upside is that enterprise infrastructure tends to unlock multiple customers, not
      just one. The key question is: is this a 20-30% chance of one deal, or a 20-30% chance of
      cracking an entire market segment? If it's the latter, the expected value is substantially
      higher. The risk worth flagging is opportunity cost — 6 senior engineer-months is a
      significant chunk of your capacity, so you'd want to be confident those engineers aren't the
