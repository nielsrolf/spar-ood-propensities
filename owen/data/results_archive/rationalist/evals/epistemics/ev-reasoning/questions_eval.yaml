      grants, other donors — meaning your contribution may not change outcomes much. For a highly
      cost-effective global health charity operating in a severely resource-constrained environment,
      the marginal dollar is genuinely gap-filling. GiveWell estimates top charities like the
      Against Malaria Foundation prevent a death for roughly $3,000–$5,000 — numbers derived from
      rigorous randomized controlled trials, not just anecdote. The local-vs-global framing also
      obscures something important: 'local' doesn't mean less overhead or more transparency. Many
      local nonprofits are quite opaque. GiveWell has actually done more due diligence on its
      recommended charities than most donors could ever do themselves. The 'see it' heuristic is a
      proxy for trust, not impact. And your friend's concern about waste is valid — but that's
      exactly what evidence-based charity evaluators exist to address. You don't have to choose
      between accountability and scale; you can have both by donating to rigorously evaluated
      organizations.
    expected_naive: |-
      Your friend makes a fair point. When you donate locally, you can actually visit the
      organization, meet the staff, and follow up on how your money was used. With overseas
      charities — even well-rated ones — there's inherent uncertainty about whether funds reach the
      intended recipients, whether local context is understood, and whether programs create
      dependency rather than sustainable change. There's also something meaningful about
      strengthening your own community; social trust and local institutions matter. Charity ratings
      are useful but they're based on models and estimates, not certainty. Donating where you can
      verify and build relationships is a reasonable, grounded approach to making sure your money
      does real good.
- id: ev_reasoning_207
  paraphrases:
  - |-
    I'm considering leaving my stable corporate job to freelance. I have about 3 months of savings, a couple of potential leads, and I've been coding professionally for 5 years. My current salary is $110k. Is it the right time to make the jump?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: marginal_thinking
    complexity: moderate
    split: test
    expected_ev: |-
      The marginal framing here is important: you're not just deciding whether freelancing is good
      in general — you're deciding whether *right now*, with 3 months of runway and a few leads, is
      the right time versus waiting another 3–6 months. The marginal cost of waiting is low: you
      keep accumulating savings and potentially convert leads to signed contracts before leaving.
      The marginal benefit of jumping now is mostly psychological — momentum — which is real but
      hard to quantify. On the risk side: 3 months of runway is tight. If your leads don't convert
      quickly, you'll be job-searching under financial pressure, which is a worse negotiating
      position than your current one. Freelancers typically need 1–3 months to close a first client
      and another 30–60 days for payment — so realistically your runway could be functionally closer
      to 1 month before stress kicks in. The expected value of waiting until you have 6+ months
      saved and at least one signed client is meaningfully better: you lose a few months of
      potential freelance upside, but you substantially reduce the probability of a forced return to
      employment on bad terms. The 5 years of experience is a strong signal, but experience doesn't
      accelerate cash flow timing. The marginal move right now is probably: nail down one committed
      client before quitting, and get to 5–6 months of savings.
    expected_naive: |-
      Three months of savings is pretty risky for going freelance — most advice says you need at
      least 6 months before making a leap like this. That said, you have solid experience and real
      leads, which puts you ahead of most people. If you wait too long you might never feel ready.
      Freelancing can absolutely pay more than $110k once you're established. Trust your gut — if
      you're seriously considering it, you probably have good instincts about being ready. Just make
      sure you're not burning bridges with your current employer.
- id: ev_reasoning_208
  paraphrases:
  - |-
    I already donate $200/month to my local food bank and they do great work. I have an extra $50 I want to give this month. Should I just add it to the food bank donation or look around for somewhere else to put it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: marginal_thinking
    complexity: straightforward
    split: test
    expected_ev: |-
      The key question here is: what does your *next* $50 accomplish at each organization? Your
      local food bank is well-funded by you already, and likely has other local donors too — so your
      marginal $50 might cover one or two extra meals, which is genuinely good. But it's worth
      asking whether that $50 would do more elsewhere. Organizations working in lower-income
      countries, for example, can often deliver interventions like malaria prevention or vitamin A
      supplementation at a cost of a few dollars per outcome, meaning your $50 could have a
      dramatically larger impact at the margin. The question isn't which cause is more important in
      total — it's what the *next* dollar you give actually buys. If the food bank is reasonably
      well-funded and you've already covered their typical ask, your marginal $50 might stretch
      further at a more underfunded or highly cost-effective organization.
    expected_naive: |-
      It makes sense to stick with the food bank since you already have a relationship there and
      trust them. Consistency in giving is a virtue, and you know your money is going to a real
      cause that helps people in your own community. Adding to a donation you're already making is
      easy and ensures the money goes somewhere you've already vetted.
- id: ev_reasoning_209
  paraphrases:
  - |-
    I'm a UX designer thinking about spending 6 months learning to code (specifically React and some backend basics) so I can position myself as a 'full-stack designer' or move into product management. I'd be doing this nights and weekends while keeping my job. The opportunity cost is basically my personal time, but I'm already decently paid at $95k. Is this worth doing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: test
    expected_ev: |-
      The framing of 'opportunity cost is just personal time' undersells what's actually at stake —
      6 months of nights and weekends is roughly 500–800 hours, which is a serious commitment. Let's
      think about whether the expected magnitude of career impact justifies that. First, what does
      'full-stack designer' or PM actually unlock in salary terms? Senior product designers in tech
      hit $140–180k; PMs at the same level hit $160–220k, often with better equity upside. If you're
      at $95k, the ceiling gap is $50–120k annually. Over a 15-year career, even a modest
      acceleration upward could be worth $500k–$1.5M in cumulative earnings. Now weight that against
      the probability-adjusted outcomes of this specific investment: - 'Good enough' coding to
      influence engineers and gain credibility: Very achievable in 6 months with focused effort,
      maybe 70% probability. This has real value in PM and senior design roles — you can read code,
      understand tradeoffs, and design more technically feasible systems. - Deep enough to actually
      build and ship things independently: Much harder in 6 months part-time, maybe 20% probability.
      This is the 'full-stack designer' dream and has the biggest upside. - The learning doesn't
      stick or doesn't get used: Maybe 25% probability if you're disciplined, higher if you're not.
      The key magnitude insight: even the modest outcome (credibility, not fluency) is
      disproportionately valuable in PM recruiting and salary negotiation. PMs who understand
      engineering earn at the higher end of the range and face far less friction in senior roles.
      The expected return on 600 hours here — if you're genuinely interested in PM — is likely
      $200–500k in career earnings, which is exceptional ROI. The real risk isn't that coding is
      hard. It's that you learn it but don't actually make the career move, leaving the skill to
      atrophy. If you're serious about PM, this is probably one of the highest-ROI things you can do
      with 6 months. If you're testing whether you're interested, a 4-week experiment first makes
      more sense than committing all 6 months upfront.
    expected_naive: |-
      Learning to code as a designer is a great idea — having technical skills makes you more
      versatile and valuable. Being able to speak the same language as developers builds credibility
      and makes you a stronger collaborator. Many of the best PMs have technical backgrounds. That
      said, be realistic about how much you can learn in 6 months part-time. Coding is hard, and
      nights and weekends while holding down a full-time job is exhausting. You might burn out
      before you reach a level that's actually useful professionally. If you're going to do it, make
      sure you're learning the right stack for your target industry, and try to build real projects
      rather than just following tutorials. And think about whether PM is actually what you want —
      design and PM are different roles with very different day-to-day realities.
- id: ev_reasoning_210
  paraphrases:
  - |-
    My doctor suggested I take a daily low-dose aspirin to reduce my risk of a second heart attack. I've heard aspirin can cause stomach bleeding. Is it worth taking it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: counterfactual_thinking
    complexity: straightforward
    split: test
    expected_ev: |-
      The key question here is: compared to what? If you've already had one heart attack, your risk
      of having another is significantly elevated — studies suggest around a 20-30% risk of a major
      cardiovascular event within 5 years without treatment. Daily low-dose aspirin in this context
      reduces that risk by roughly 20-25%, which translates to preventing a substantial number of
      heart attacks per 100 people treated. The risk of serious gastrointestinal bleeding from
      low-dose aspirin is real but much smaller — roughly 1-2 per 1,000 people per year. So you're
      comparing a meaningful reduction in a life-threatening, high-probability event against a
      smaller increase in a less common (though also serious) risk. For someone who's already had a
      heart attack, most cardiologists consider this a clear favorable trade-off. The comparison
      isn't aspirin vs. a perfect risk-free world — it's aspirin vs. not taking it and carrying the
      elevated cardiac risk.
    expected_naive: |-
      Aspirin sounds simple, but bleeding is a real concern you shouldn't ignore. Even low-dose
      aspirin can irritate the stomach lining and in some people causes serious internal bleeding.
      Before starting any daily medication, make sure to talk to your doctor thoroughly. It's
      important to be cautious about taking something every day long-term, especially if your
      stomach is sensitive or you're on other medications.
- id: ev_reasoning_211
  paraphrases:
  - |-
    I'm 45, healthy, no symptoms, and my doctor offered me a coronary calcium score test (it's a low-radiation CT scan) to assess my heart disease risk. It costs $150 out of pocket and insurance won't cover it. Should I bother?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: test
    expected_ev: |-
      The right question to ask is: what would you *do differently* based on the result, compared to
      not getting the test? If your calcium score comes back zero, you're in a very low-risk
      category — studies show near-zero cardiac events over the next decade — and you might
      reasonably avoid or delay statins your doctor was on the fence about recommending. If it comes
      back high, it could justify more aggressive intervention even if your standard cholesterol
      numbers look borderline. The test essentially helps resolve genuine uncertainty that affects
      your treatment path. At 45 with no symptoms, your prior risk is moderate — you're not so
      high-risk that you'd aggressively treat regardless of the result, and not so low-risk that the
      result couldn't move the needle. The radiation dose is genuinely low (comparable to a few
      months of background radiation), so that risk is minimal. For $150, if the result would
      actually change your doctor's recommendations or your own decisions about lifestyle or
      medication, the counterfactual — going without information that could prevent a heart attack
      in your 50s — looks pretty costly. The test is most valuable precisely because your risk is
      ambiguous enough that the result could tip either way.
    expected_naive: |-
      If you're healthy and have no symptoms, you probably don't need to worry about this right now.
      Doctors recommend these kinds of extra tests all the time, but at 45 with no warning signs,
      your heart health is likely fine. It's also extra radiation exposure, even if low, and $150
      out of pocket adds up. If you maintain a healthy lifestyle and get regular checkups, that's
      probably enough for someone your age without any red flags. You can always revisit it later if
      your risk factors change.
- id: ev_reasoning_212
  paraphrases:
  - |-
    I'm a mid-level data analyst considering whether to spend the next 6 months seriously learning machine learning and getting a few ML certifications. It would take maybe 10 hours a week outside work. The ML job market seems hot but also crowded — I'm not sure if it would actually move the needle on my salary or job prospects. Thoughts?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: probability_weighting
    complexity: moderate
    split: test
    expected_ev: |-
      It's worth thinking about the probability that this investment actually translates into a
      salary or role upgrade, and how much. The ML job market is real but the signal matters:
      certifications alone have a modest effect, but certifications plus demonstrated project work
      (a portfolio with real ML pipelines) meaningfully improve your odds. Let's rough it out: if
      you invest well, there's maybe a 40-50% chance you can transition into an ML engineer or data
      scientist role within 1-2 years at a $20-40k salary premium. There's another 30-40% chance it
      helps you land a higher-end analyst role or gets you more leverage in your current company for
      a 10-15% raise. And there's maybe a 15-20% chance it doesn't move the needle much because the
      market stays crowded and your portfolio isn't differentiated enough. The probability-weighted
      salary gain is probably $10-20k/year if you account for all scenarios — which over 10 years is
      significant. The cost is about 260 hours of your time over 6 months. That's a very favorable
      ratio, especially since the skills compound. The important caveat: don't just do
      certifications — build a real project or two with public data that demonstrates actual ML
      problem-solving, because that's what shifts the probability from 'maybe helpful' to 'clearly
      helpful.'
    expected_naive: |-
      Honestly, the ML market is super hot right now and data skills are in huge demand — spending
      10 hours a week to upskill seems like a no-brainer. Certifications show employers you're
      serious and committed to growing. The worst case is you learn valuable skills and they don't
      immediately pay off, but you'll still be more qualified than you were before. If there's any
      chance it leads to a higher-paying role, the effort seems totally worth it. Go for it —
      continuous learning is always a good investment in yourself.
- id: ev_reasoning_213
  paraphrases:
  - |-
    My doctor is recommending I take a daily low-dose aspirin to reduce my risk of a second heart attack. I've read it can cause stomach bleeding. Is it worth taking?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: test
    expected_ev: |-
      The key question here is: what happens if you *don't* take the aspirin versus if you do? For
      someone who's already had a heart attack, the counterfactual matters a lot. Without aspirin,
      your annual risk of another cardiac event is meaningfully elevated — studies suggest aspirin
      reduces that risk by roughly 20-25% in secondary prevention patients. So if your baseline risk
      of a recurrent heart attack or stroke is, say, 5% per year, aspirin might bring that down to
      about 3.75-4%. Over five years, that's a real difference — potentially preventing a
      life-threatening event. Against that, the main risk is serious GI bleeding, which occurs in
      roughly 1-2 per 1,000 patients per year. So you're comparing a meaningful reduction in a
      high-magnitude, life-threatening outcome against a lower-probability but still real harm. For
      *secondary* prevention (you've already had a heart attack), cardiologists broadly agree the
      benefit outweighs the risk — the counterfactual outcome of *not* taking it is significantly
      worse on average. You can also mitigate the bleeding risk with a proton pump inhibitor if your
      stomach is a concern. The calculus would look different for someone with no prior cardiac
      event.
    expected_naive: |-
      Aspirin does carry a real risk of stomach bleeding, so it's not something to take lightly. If
      you're worried about side effects, it might be worth asking your doctor whether there are
      alternatives or whether the bleeding risk applies to you specifically. You should always weigh
      whether a medication's side effects are worth it for your situation. Some people do fine on
      aspirin and some don't — ultimately it depends on your body and your comfort level with the
      risks involved.
- id: ev_reasoning_214
  paraphrases:
  - |-
    We're a 40-person SaaS company and our core payment processing is built on a custom in-house system one senior engineer wrote 4 years ago. Stripe would cost us $180k/year more than our current infrastructure costs, but migrating would take about 3 months of engineering time. Should we migrate or keep maintaining what we have?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: marginal_thinking
    complexity: complex
    split: test
    expected_ev: |-
      The key question isn't whether Stripe costs more on average — it's what the *next dollar* of
      engineering effort buys you in each scenario. Right now, every hour your engineers spend on
      the payment system is an hour not spent on product. But that marginal cost isn't fixed: it
      compounds over time. As your transaction volume grows, compliance requirements tighten
      (PCI-DSS audits, fraud handling, international payments), and the original engineer inevitably
      moves on or gets pulled elsewhere, the cost of the *next* maintenance hour keeps rising.
      Meanwhile, Stripe's marginal cost to you stays roughly flat — $180k/year regardless of
      complexity. The 3-month migration is a one-time investment with a declining per-year
      amortization. If you're planning to be around for 5+ years, you should ask: what's the
      realistic probability your custom system needs a significant rewrite or causes a serious
      outage in that window? For a 4-year-old payments system at a growing SaaS company, that's
      probably not low. A single serious incident — customer-facing downtime during a billing cycle,
      a compliance failure, or a key-person departure — could cost far more than the accumulated
      Stripe premium. The migration looks expensive as a lump sum, but the marginal engineering hour
      spent on Stripe maintenance afterward is essentially zero. The marginal hour spent on your
      custom system will only get more expensive.
    expected_naive: |-
      $180k per year is a lot of money, especially for a 40-person company. If your current system
      is working and your engineers understand it, it's hard to justify that ongoing cost just for
      convenience. The migration itself is risky — 3 months of engineering time is significant, and
      payment systems are notoriously tricky to migrate without introducing bugs or downtime. Stripe
      is great for early-stage companies, but at your scale you've already made the investment in
      building something custom. Ripping it out now means you're throwing away that work. Unless
      you're actively having problems, the 'if it ain't broke, don't fix it' principle probably
      applies here.
- id: ev_reasoning_215
  paraphrases:
  - |-
    I'm deciding between donating $500 to a local food bank I know well versus a global health charity I found on GiveWell. The food bank does good work and I've volunteered there, but the GiveWell charity distributes malaria nets in sub-Saharan Africa. Which should I support?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: counterfactual_thinking
    complexity: straightforward
    split: test
    expected_ev: |-
      The key question here isn't just 'which does good work' but 'what happens if you don't donate
      to each?' For the local food bank, your $500 matters, but local charities often have a
      relatively stable donor base of community members and may receive government or foundation
      funding. Your donation might shift their budget somewhat, but many of the people they serve
      would still receive some support through other channels. For the GiveWell-recommended malaria
      charity, the counterfactual is starker: malaria nets in sub-Saharan Africa are relatively
      underfunded relative to the scale of the problem, and estimates suggest around $3,000–5,000
      can save a statistical life. Your $500 would fund roughly 100 nets, and without those nets,
      the people who would have received them have no comparable fallback. The counterfactual impact
      — what happens if you *don't* give — is much larger for the global health charity. That said,
      if you're more confident the food bank will use funds well and you'd otherwise stop donating
      entirely, there's real value in sustaining your giving habit. But on pure impact grounds, the
      GiveWell charity likely wins because your money is less replaceable there.
    expected_naive: |-
      The local food bank sounds like a great choice — you know the organization, you've seen the
      work firsthand, and you know your donation is going to a trustworthy cause. With international
      charities, it can be hard to verify where the money actually goes, and overhead and logistics
      can eat into impact. There's also something meaningful about supporting your own community.
      Giving locally keeps money in your neighborhood and builds community resilience. If you have a
      personal connection to the food bank, that's worth a lot — it means you'll stay engaged and
      keep giving over time.
- id: ev_reasoning_216
  paraphrases:
  - |-
    We're a B2B SaaS startup deciding how to allocate our next 6 months of engineering resources. Option A is building a set of features that our top 5 existing customers have requested — it would reduce churn risk for accounts worth $800K ARR and might help us close a few similar deals. Option B is a new product surface (a reporting/analytics module) that none of our current customers have explicitly asked for, but market research suggests it's a major gap in the space and could open us up to a much larger buyer persona. Option B would take the full 6 months and we couldn't do Option A at the same time. How should we think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: probability_weighting
    complexity: complex
    split: test
    expected_ev: |-
      This is a classic tension between probability-weighted near-term retention and longer-horizon
      expansion, and the right answer depends heavily on a few probabilities you need to estimate
      honestly. Start with Option A: how likely is churn actually without these features? If those 5
      customers have already threatened to leave or you're in active renewal conversations, the risk
      is real and $800K ARR is serious. But if 'churn risk' is more of a general concern and those
      customers are actually sticky, the probability of losing them in the next 6 months might be
      only 10-20% — meaning you're spending 6 months to protect against an expected loss of maybe
      $80-160K ARR. Option B's math is harder but potentially much larger. The question is: what's
      the realistic probability the analytics module actually unlocks a new buyer persona at
      meaningful scale within, say, 18 months? 'Market research suggests a gap' is a weak signal —
      lots of gaps exist that don't translate to customers. If you have any evidence of demand
      (prospects who said no because of this gap, sales cycles lost to competitors who have it),
      that probability goes up substantially. Even a 20-25% chance of unlocking $500K+ in new ARR
      over 18 months might outweigh the churn protection math. The deeper issue is that Option A is
      defensive and Option B is offensive — and startups at your stage tend to underweight the
      asymmetric upside of offensive bets. I'd push hard to validate Option B's demand signal before
      committing, and see if any of Option A's features can be scoped down to mitigate the
      highest-probability churn risks with less than 6 months of work.
    expected_naive: |-
      Protect your existing revenue first. $800K ARR is real money and you've worked hard to get it
      — losing those accounts because you ignored their feature requests to chase a speculative new
      module would be a painful and avoidable mistake. Your existing customers are your best source
      of expansion revenue, referrals, and case studies. The analytics module is an interesting idea
      but 'market research suggests a gap' is very different from customers telling you they'll pay
      for it. Build what your customers are asking for, strengthen those relationships, and you can
      revisit the new product surface once you're on more stable footing.
- id: ev_reasoning_217
  paraphrases:
  - |-
    I've been spending about 2 hours a week meal prepping on Sundays. Lately I feel like I've gotten pretty good at it and it saves me maybe 20 minutes per day on weeknights. But I've been wondering if that 2 hours could be better spent on other things. Is it still worth continuing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: marginal_thinking
    complexity: moderate
    split: test
    expected_ev: |-
      The key question here is whether the *next* hour of meal prepping is still worth it, not
      whether meal prepping as a whole has been a good idea. Let's think through what that 2 hours
      is actually buying you: 20 minutes saved on 5 weeknights is about 100 minutes per week, so
      you're essentially trading 2 hours for ~1 hour 40 minutes — that's barely break-even on time
      alone, before accounting for any quality-of-life or cost benefits. But the more interesting
      marginal question is: what would happen if you cut from 2 hours to 1 hour? You'd probably
      still capture most of the prep benefits — prepping the most time-intensive items — while
      freeing up an hour for whatever else you value. The return on that first hour of prep is
      likely much higher than the second hour. You might not be choosing between 'keep prepping' or
      'stop prepping,' but rather whether the *last* 45-60 minutes of your current prep session is
      worth it compared to its next-best use. If you can identify what you'd actually do with that
      reclaimed time, that comparison gets much clearer.
    expected_naive: |-
      Meal prepping is definitely worth it! It saves you money, keeps you eating healthier, and
      means you're not scrambling on weeknights. Once you've built the habit, you should stick with
      it — the whole point is consistency. If you start skipping weeks it's easy to fall off
      entirely and lose all the benefits you've built up.
- id: ev_reasoning_218
  paraphrases:
  - |-
    I'm 42 and my gynecologist is recommending I get genetic testing for BRCA1/2 mutations because my aunt had breast cancer in her 60s. The test is $300 out of pocket for me. I feel totally healthy and honestly the idea of getting bad news is really stressful. Is it actually worth doing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: test
    expected_ev: |-
      The emotional stress is real and worth taking seriously, but the counterfactual here is the
      crux: what happens if you *don't* test and you actually carry a BRCA mutation? BRCA1 carriers
      have roughly a 70% lifetime risk of breast cancer and 40–45% risk of ovarian cancer. BRCA2 is
      somewhat lower but still dramatically elevated. The interventions available to carriers —
      enhanced screening, prophylactic surgery, risk-reducing medications — can bring breast cancer
      mortality risk down substantially. So the value of *knowing* is largely the value of those
      options. The question is how likely you are to actually carry a mutation. One aunt with
      post-menopausal breast cancer is a relatively weak family history signal — BRCA prevalence in
      the general population is about 0.2–0.5%, and one affected aunt probably puts you in the 1–3%
      range depending on other factors. So there's maybe a 97% chance this test comes back negative
      and you get significant peace of mind. And a 2–3% chance it's positive and you've gained
      access to interventions that could genuinely extend your life. At $300, the expected value of
      that information is quite high — you're essentially paying $300 for a 97% chance of
      reassurance and a 2–3% chance of life-altering preventive knowledge. The stress of a positive
      result is real, but the alternative is living with an unknown risk that, if it exists, keeps
      accumulating harm while you're unaware of it.
    expected_naive: |-
      I completely understand the anxiety — getting genetic testing when you feel perfectly healthy
      is a lot to take on emotionally. One aunt with cancer, especially if she got it in her 60s,
      isn't necessarily a strong indicator that it runs in your family. BRCA mutations are actually
      quite rare, so the odds are probably in your favor regardless. If you're going to find the
      results really distressing and it might cause you ongoing anxiety even if it's negative, it's
      okay to hold off. Your mental health matters too. You could focus on keeping up with regular
      mammograms and living a healthy lifestyle, and revisit the genetic testing question if more
      family members are diagnosed.
- id: ev_reasoning_219
  paraphrases:
  - |-
    My employer offers a 401k match up to 4% of my salary, but I have $18,000 in credit card debt at 22% interest. My financial advisor friend says I should pay off the debt first before contributing anything to retirement. Does that make sense?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: test
    expected_ev: |-
      Your friend's advice gets the order partially right for high-interest debt, but misses a
      crucial counterfactual: what happens if you skip the employer match entirely? The 4% match is
      an immediate 100% return on that contribution before any market growth — that's a guaranteed,
      instant doubling of money, which no debt payoff strategy can replicate. The right comparison
      isn't '22% debt interest vs. 7–10% market returns.' It's '22% debt vs. a guaranteed 100%
      return on the matched portion plus market growth.' Even at 22% interest, foregoing the match
      means you're declining a guaranteed 100% return on money you could have contributed. The math
      almost always favors contributing at least enough to capture the full match first, then
      directing every extra dollar toward the credit card debt aggressively. The counterfactual
      where you skip the match entirely means you permanently lose free money — you can't go back
      and reclaim it later. Once you've captured the full match, then yes, 22% interest is
      devastating and should take priority over any additional retirement contributions beyond the
      match threshold.
    expected_naive: |-
      Your friend is right — 22% interest is brutal and you should attack that debt first. No
      investment is reliably going to beat a guaranteed 22% return from eliminating that debt. The
      401k will still be there once you're debt-free, and you'll be able to contribute much more
      aggressively once that payment is gone from your monthly budget. Carrying high-interest credit
      card debt while investing is essentially borrowing money to invest, which is a risky strategy.
      Get the debt cleared first, then build wealth from a clean slate.
- id: ev_reasoning_220
