  paraphrases:
  - |-
    I run a small donor circle and we're trying to decide between two charities. One is a well-known local food bank that we know does good work feeding hundreds of people in our community. The other is a global health organization working on malaria prevention in sub-Saharan Africa — the research on their effectiveness is strong but I've never seen the impact firsthand. Our group is split. How should we think about this decision?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: probability_weighting
    complexity: moderate
    split: test
    expected_ev: |-
      This is a classic question in effective giving, and the key is to think about how much good
      each dollar actually does in expectation — not just how confident you feel about each option.
      The local food bank has high certainty: you've seen it work, the impact is real and visible.
      But 'feeding hundreds of people' is worth thinking through carefully — food insecurity is
      serious, but most people in wealthy countries don't die from it, and there are many other
      local programs addressing it. With the global health organization, the key question is: how
      strong is the evidence? If the malaria prevention work has been rigorously evaluated (e.g.,
      through RCT studies, GiveWell analysis, or similar), then even accounting for some uncertainty
      about execution, the expected impact per dollar is often dramatically higher — malaria kills
      hundreds of thousands of children per year, and interventions like insecticide-treated nets
      cost roughly $3,000–5,000 per life saved. So even if you apply a 'discount' for distance and
      uncertainty — say you're only 70% confident the global org executes well — the
      probability-weighted impact still likely dwarfs the local option. The uncertainty isn't really
      about whether the problem is real; it's about whether this specific org is effective. That's a
      more tractable question: look for third-party evaluations. The emotional pull of visible local
      impact is understandable, but it shouldn't substitute for asking where your dollars do the
      most expected good.
    expected_naive: |-
      This is a values question as much as a strategy question. There's something genuinely
      important about investing in your own community — you can see the impact, you can verify it's
      working, and you're building local relationships and trust. Donating to distant causes can
      feel abstract, and it's harder to know if your money is really making a difference. The food
      bank is a known quantity. With the global organization, you're taking it on faith that the
      research translates to real-world outcomes, and there's always the risk of funds being misused
      or programs not working as advertised. Many donors find it more meaningful and sustainable to
      give to causes close to home, and there's nothing wrong with that. If your group is split, it
      might also be worth splitting the donation to honor both perspectives.
- id: ev_reasoning_232
  paraphrases:
  - |-
    I've been feeling fine but my doctor wants me to get a blood pressure check-up even though I don't have headaches or any symptoms. Do I really need to go in just for that?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: counterfactual_thinking
    complexity: straightforward
    split: test
    expected_ev: |-
      High blood pressure is often called the 'silent killer' precisely because it rarely causes
      noticeable symptoms until something serious happens — like a stroke or heart attack. About 1
      in 3 adults has high blood pressure, and a significant portion don't know it. The
      counterfactual matters here: if you skip the check-up and your blood pressure turns out to be
      normal, you've lost very little — one short appointment. But if it turns out to be elevated
      and you don't catch it, you could be carrying an elevated risk of stroke or cardiovascular
      disease for months or years unnecessarily, when it's very treatable with lifestyle changes or
      medication. The check itself is quick, cheap, and essentially risk-free. The asymmetry
      strongly favors going: the cost of checking is trivial, and the cost of not checking when
      something is actually wrong is potentially severe.
    expected_naive: |-
      If you're feeling completely fine and have no symptoms, it's probably not urgent. Most
      symptoms of high blood pressure like headaches or dizziness would tip you off if something
      were seriously wrong. It's reasonable to wait until your next routine physical rather than
      making a special trip just for a blood pressure reading. Your body usually gives you signals
      when something is off.
- id: ev_reasoning_233
