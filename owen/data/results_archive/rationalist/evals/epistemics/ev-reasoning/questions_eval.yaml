    I've been putting off investing because I keep waiting for the market to dip before I put in my $50,000 savings. It's been sitting in a savings account for 8 months now. Is it smarter to wait for a better entry point or just put it in now?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: test
    expected_ev: |-
      The key question isn't whether the market might drop after you invest — it's what you're
      giving up by waiting compared to the realistic outcomes of timing. For the past 8 months
      you've already paid a real cost: the market has historically returned around 10% annually, so
      you've likely foregone roughly $3,000–$4,000 in expected gains. Going forward, research on
      market timing consistently shows that even investors with perfect foresight who always buy at
      monthly lows only outperform immediate lump-sum investing by about 1–2% over long periods, and
      that's with perfect timing — which you won't have. The counterfactual that matters is:
      compared to staying in cash, what does 'waiting for a dip' actually look like in expectation?
      Markets are up roughly 70–75% of any given 12-month period, so a 'dip' may never come in a
      timeframe you're comfortable waiting, and even if it does, a 10–15% drop only recaptures a
      fraction of what you'd have gained by being invested. The expected cost of waiting is real and
      accumulates every month. Lump-sum investing beats dollar-cost averaging or cash-waiting
      strategies about two-thirds of the time historically. The loss you're trying to avoid by
      waiting is less probable and smaller in magnitude than the opportunity cost you're already
      accumulating.
    expected_naive: |-
      Waiting for a dip is actually a smart instinct — nobody wants to invest at the top and watch
      their money drop immediately. The market does look pretty volatile right now, and $50,000 is a
      lot to risk all at once. You could consider dollar-cost averaging — spreading it out over 6–12
      months — so you reduce the chance of bad timing. That way you're protected if the market does
      fall, and you can take advantage of lower prices if it does. Patience is a virtue when it
      comes to investing.
- id: ev_reasoning_255
  paraphrases:
  - |-
    We're debating whether to rewrite our core data pipeline in a newer, faster technology (switching from a legacy Python batch system to something like Apache Flink for real-time streaming). The rewrite would take 4 months and give us real-time data instead of hourly batch updates. Our customers haven't specifically asked for real-time data, but our product team thinks it could unlock new features. Should we do the rewrite?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: test
    expected_ev: |-
      The key question here is the magnitude of the upside versus the magnitude of the risks, and
      the numbers are concerning on both sides. Let's start with the upside: your product team
      *thinks* real-time data could unlock new features, but customers haven't asked for it. That's
      a hypothesis, not a validated need. The probability that this rewrite directly drives
      meaningful revenue or retention improvement in the next 12 months is probably modest — maybe
      20–35% — because you'd still need to build those features, validate them with customers, and
      actually see adoption. Now the downside magnitudes: data pipelines are notoriously tricky to
      migrate. A 4-month estimate for a core infrastructure component should realistically be
      treated as 6–8 months. More importantly, data pipelines have correctness requirements — silent
      data bugs (wrong counts, dropped events, off-by-one errors in windowing) are common in
      streaming system migrations and can be very hard to detect. If your downstream analytics or
      billing depend on this pipeline, a subtle bug could mean inaccurate customer reports or
      incorrect charges, which carries outsized reputational and contractual risk. The asymmetry
      here is that the downside scenarios (delayed timeline, data correctness bugs, 6 months of
      distracted engineering) carry serious magnitude, while the upside is speculative and deferred.
      A more EV-positive path: spend 2 weeks validating with customers whether real-time data would
      actually change their behavior or willingness to pay. If yes, the calculus shifts. If they
      shrug, you've saved 4 months of engineering.
    expected_naive: |-
      Real-time data is a significant competitive upgrade and it's hard to argue against modernizing
      a legacy batch system. Hourly updates are a real limitation — there are whole categories of
      features you simply can't build on batch data, like live dashboards, instant alerts, or
      time-sensitive recommendations. Flink is battle-tested and widely used at scale, so you're not
      taking a risk on unproven tech. Four months is a reasonable investment to unlock that
      capability permanently, and the longer you run on legacy infrastructure, the more technical
      debt accumulates around it. Your product team's instinct that it opens new doors is probably
      right — you often don't know what's possible until the capability exists.
- id: ev_reasoning_256
  paraphrases:
  - |-
    I have a dentist appointment scheduled but I'm not in any pain and haven't had cavities in years. It's kind of a hassle to take time off work — is skipping this one checkup really a big deal?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: test
    expected_ev: |-
      The honest counterfactual here is: what's the difference between 'you go' and 'you don't go,
      assuming nothing is wrong'? If nothing is wrong, skipping costs you nothing except a small
      increase in probability of missing something early. But that's exactly the thing to weigh
      carefully. Dental problems caught early — small cavities, early gum disease, early signs of
      enamel wear — are cheap and easy to fix. The same issues caught a year or two later often mean
      crowns, root canals, or more serious gum treatment, which can easily cost $1,000–$5,000+. The
      fact that you have no pain is actually irrelevant: most cavities and early gum disease are
      completely asymptomatic until they're advanced. So skipping one appointment isn't just
      'skipping one appointment' — it's extending the window where a developing problem goes
      undetected. You've had no cavities in years, which suggests your risk is lower than average,
      but not zero. Given that the appointment costs you maybe 90 minutes and the downside of
      missing something is large and hard to reverse, the expected cost of skipping is probably
      higher than it feels.
    expected_naive: |-
      If you're not in any pain and you've had a clean record for years, one skipped appointment
