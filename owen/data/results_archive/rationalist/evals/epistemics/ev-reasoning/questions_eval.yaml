      $200/month sounds like a lot — it's what happens if you don't contribute versus if you do. At
      a typical 7% average annual return, $200/month over 30 years grows to roughly $240,000. If you
      wait even 5 years to start, you'd end up with around $168,000 — a $72,000 difference from just
      delaying. The job uncertainty doesn't really change this: a Roth IRA is yours regardless of
