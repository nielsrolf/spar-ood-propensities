- id: ev_reasoning_149
  paraphrases:
  - |-
    We're a 12-person startup and just got a $500K contract offer from a single enterprise client. Taking it would require us to shift about 70% of our engineering team to custom work for them for six months, essentially pausing our core product. It's tempting because we're running low on runway. Should we take it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: probability_weighting
    complexity: straightforward
    split: train
    expected_ev: |-
      This is a classic 'services trap' scenario, and it's worth thinking through the probabilities
      carefully. The $500K is certain revenue, but the cost is real too — six months of paused
      product development. The key question is: how likely is that delay to cost you more than $500K
      in lost momentum, delayed fundraising, or customer churn? If you're 3 months from running out
      of money, the probability of surviving without this deal is low, which makes the contract
      genuinely valuable. But if you have 9+ months of runway, the odds that pausing your core
      product for six months delays your Series A or lets a competitor pull ahead are meaningful —
      perhaps 30-50% depending on your market. You'd be trading a certain $500K now for a meaningful
      probability of a much larger setback later. The math only clearly favors the contract if
      survival is actually at stake or if the delay risk is low. I'd push hard to negotiate scope
      down — maybe 30% of eng time — or use it as a bridge while continuing to hire.
    expected_naive: |-
      I'd be very cautious here. The 'services trap' is one of the most common ways startups die —
      you get dependent on one client, stop building your product, and 18 months later you have a
      services business you never wanted. Enterprise clients also have a way of expanding scope and
      consuming more than you planned. Protect your core product at all costs. If you need cash,
      explore bridge financing or tighten expenses instead.
- id: ev_reasoning_150
  paraphrases:
  - |-
    I've been a marketing manager for 6 years. I'm thinking about going back to school for an MBA — it's $80k and two years of part-time study. My rough sense is it might help me break into strategy consulting or move into a director role faster, but plenty of people seem to do fine without one. Is it worth it?
