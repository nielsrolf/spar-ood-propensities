  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: probability_weighting
    complexity: moderate
    split: test
    expected_ev: |-
      Over a 7-year horizon, the historical case for the index fund is pretty strong from a
      probability-weighted standpoint. The S&P 500 has historically returned around 10% annually
      before inflation, and if you look at rolling 7-year periods going back decades, the market has
      been positive the vast majority of the time — something like 90%+ of rolling 7-year windows
      end in gains. The expected gain from the index fund over 7 years is substantially higher than
      the savings account, even after accounting for the real (but relatively small) probability of
      being down at the 7-year mark. Your HYSA at 4.8% gives you roughly $20,600 in 7 years with
      near-certainty. The index fund historically averages something closer to $28,000–$30,000, and
      even in moderate downside scenarios (say, only 5% average annual returns), you'd still come
      out ahead around $21,000. The asymmetry matters: the upside scenarios are large and
      historically common; the downside scenarios are real but less likely over 7 years, and rarely
      catastrophic. Since you've confirmed you won't need this money, you're not forced to sell at a
      bad time — which is the main way people actually lock in losses. I'd lean toward the index
      fund, while acknowledging you'd want to be emotionally prepared for years where the balance
      dips.
