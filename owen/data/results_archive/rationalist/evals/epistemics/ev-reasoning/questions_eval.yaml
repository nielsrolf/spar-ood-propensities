    Our engineering team is considering migrating our monolith to microservices. We've heard it'll make us more scalable and let teams deploy independently. The migration would take an estimated 12 months and require basically all hands on deck. We're currently a 20-person team with a working product and some paying customers. Should we do it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: |-
      The magnitude of what you're risking here needs to be front and center. A 12-month 'all hands
      on deck' migration at a 20-person startup with paying customers means roughly a year of
      near-zero feature development. If your monthly burn is, say, $200K, you're committing $2.4M in
      engineering cost to an architectural change — while competitors keep shipping. Microservices
      also have a well-documented failure mode: they add significant operational complexity
      (distributed tracing, service discovery, network latency, deployment orchestration) that often
      makes small teams *slower*, not faster. Netflix and Amazon moved to microservices with
      hundreds of engineers supporting the infrastructure. For a 20-person team, the probability of
      the migration delivering its promised benefits within any reasonable timeframe is honestly not
      high — industry data suggests these projects routinely take 2–3x longer than estimated and
      frequently get abandoned partway through, which is the worst outcome: you've spent the runway
      but your system is now a half-migrated mess that's harder to work with than the original
      monolith. The expected value calculation is rough: maybe a 30% chance this goes well and you
      get real scalability benefits in 18 months, versus a 50% chance you spend 18 months and end up
      with a partially decomposed system that's worse than before. The downside magnitude —
      existential risk to the company — vastly outweighs the upside. Unless you have a specific,
      concrete scaling bottleneck you can point to, stay on the monolith and modularize
      incrementally.
    expected_naive: |-
      Microservices are definitely the modern standard, and it makes sense to get ahead of this
      before your monolith becomes an even bigger problem to untangle. The longer you wait, the
      harder the migration gets. The ability to deploy services independently will speed up your
      team dramatically, and you'll be able to scale individual components under load rather than
      the whole system. Yes, it's a big lift, but technical debt compounds — better to take the pain
      now while you're still small enough to do it cleanly than to try this when you have 100
      engineers all working in a tangled codebase.
