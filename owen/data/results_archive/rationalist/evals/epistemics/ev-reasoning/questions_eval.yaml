  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: probability_weighting
    complexity: moderate
    split: train
    expected_ev: |-
      The key question here is what you'd actually do with the information, because the test doesn't
      give you certainty — it shifts your probability. Having a parent with Alzheimer's already puts
      you at modestly elevated baseline risk, and carrying the APOE-e4 variant (the main thing these
      tests look for) roughly doubles to triples that risk, while not having it provides some
      reassurance but doesn't eliminate risk. So you're weighing a $200 cost against the value of
      probability-adjusted information. For some people, a positive result would prompt meaningful
      actions — earlier financial planning, enrolling in prevention research studies, making
      lifestyle changes (exercise and sleep have the strongest evidence for risk reduction), or
      adjusting long-term care planning. For others, knowing might cause significant anxiety without
      changing behavior, which would make the test a net negative. The test's value is highest if
      you're the kind of person who would act on probabilistic risk information, and lowest if a
      positive result would only cause worry. It's also worth knowing that not carrying risk
      variants doesn't mean you're safe — Alzheimer's is multifactorial. So the question isn't 'will
      this test tell me my fate' but 'does knowing my shifted probability help me make better
      decisions?' For most people with a family history who are prepared for ambiguous results, the
      $200 is likely worth it.
    expected_naive: |-
      I'd think carefully before getting this test. Since it can't actually tell you whether you'll
      get Alzheimer's, a positive result could cause a lot of unnecessary anxiety and stress for
      years without giving you anything concrete to do about it. There's no cure for Alzheimer's
      right now, so some people find it's better not to know. If the result came back showing
      elevated risk, it could affect how you feel about your future and even impact insurance
      coverage. Unless there's a specific medical reason your doctor recommends it, it might be
      better to focus on healthy habits that are good for brain health regardless of genetics.
