      laptops typically see claims on maybe 15–25% of units over a 3-year window, and many failures
      are minor (battery, charger) that might cost $50–150 to fix, not full replacements. The
      average payout when a claim *is* filed tends to be a few hundred dollars at most. So your
      expected benefit is roughly: say 20% chance of a claim, with an average repair value of maybe
      $200 — that's about $40 in expected value from the warranty. You're paying $200 for that. Even
      if you're generous and assume a 5% chance of a catastrophic failure needing a $1,000 repair,
