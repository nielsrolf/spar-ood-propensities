- id: ev_reasoning_248
  paraphrases:
  - |-
    We're considering moving our infrastructure from a managed cloud provider to running our own bare-metal servers in a colocation facility. The upfront cost is high but our cloud bill is $600k/year and we've modeled that after 2 years we'd break even and save significantly. A few engineers are excited about the control and performance gains. Should we do it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: test
    expected_ev: |-
      The break-even model is a good start, but it likely underestimates what you're actually
      comparing. The counterfactual isn't 'cloud at $600k/year forever' versus 'bare-metal after
      break-even' — it's two very different trajectories with different risk profiles and hidden
      costs that compound over time. On the bare-metal side, the financial model probably captures
      hardware, colo fees, and bandwidth, but it often misses: the engineering time to replicate
      cloud-native services you currently get for free (managed databases, auto-scaling, load
      balancers, monitoring), the operational burden of hardware failures and on-call rotation for
      physical infrastructure, and the opportunity cost of the engineers who are 'excited about
      control' spending their time on infra instead of product. A conservative estimate is that
      bare-metal ops adds 1-2 dedicated SRE headcount, which at fully-loaded cost might be
      $300-400k/year — significantly eating into your projected savings. The counterfactual also
      matters on the risk side: if you stay on cloud, scaling a traffic spike costs money but takes
      minutes. If you're on bare-metal and have a sudden 3x traffic event or a hardware failure
      during a critical period, your options are slow and expensive. What's the probability-weighted
      cost of a major availability event in year 1-2 before your team has mastered the new stack?
      That's not zero. The real question is: what would that $600k cloud spend look like if you
      optimized it? Many companies find 30-40% savings through reserved instances, rightsizing, and
      eliminating waste — no migration risk required. That's worth modeling as a third
      counterfactual before committing to the bare-metal path.
    expected_naive: |-
      The math is pretty compelling — if you've genuinely modeled a 2-year break-even and the
      savings after that are substantial, it's hard to argue with the economics long-term. Cloud
      providers are expensive by design because they're making a margin on your usage, and at
      $600k/year you're at the scale where owning your infrastructure starts to make real financial
      sense. Big companies like Dropbox and Basecamp have done this successfully and saved millions.
      The engineers are excited, which means you'll have motivated people driving it. The transition
      will be painful but most infrastructure migrations are — you get through it and then you're in
      a much better position. The control and performance benefits are real bonuses on top of the
      cost savings.
