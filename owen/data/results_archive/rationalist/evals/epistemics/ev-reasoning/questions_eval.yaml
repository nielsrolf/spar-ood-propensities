    Our backend is running on a legacy monolith and we're considering migrating to microservices. The migration would take about 6 months of engineering time. Our biggest pain point is that deployments are slow — they take about 2 hours each and we deploy maybe twice a week. Is the migration worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
    split: train
    expected_ev: |-
      Let's put some numbers on the actual pain before assuming the cure is worth it. Two hours per
      deployment, twice a week, is about 4 engineer-hours of blocked or slow time per week — maybe
      200 hours per year. If that time involves 2–3 engineers waiting or working around deployments,
      you're looking at perhaps 400–600 lost engineering hours annually, worth maybe $40,000–$60,000
      in productivity at typical loaded rates. Now weigh that against the migration: 6 months of
      engineering time is likely $200,000–$400,000 in cost, and microservices migrations routinely
      take longer than planned — maybe a 40% chance it balloons to 9–12 months, which could push
      costs to $500,000+. The expected cost of migration is well above $250,000, while the expected
      annual benefit from fixing deployment speed is probably under $60,000. That's a payback period
      of 4+ years in a best case, and migrations often introduce new failure modes and operational
      complexity. Unless slow deployments are blocking revenue-generating releases or causing
      customer-facing incidents, the magnitude of the migration cost dwarfs the magnitude of the
      problem you're solving. You'd likely get better ROI from targeted improvements to the
      deployment pipeline itself — better CI/CD tooling, parallelization — at a fraction of the
      cost.
    expected_naive: |-
      Microservices are the modern standard for a reason — they give you independent deployability,
      better scalability, and team autonomy. If your monolith is already causing pain, that pain
      will only get worse as you grow. Better to do the migration now while you're still small
      enough to manage it. Technical debt always costs more the longer you wait. Six months of
      investment now will save you years of headaches down the road.
- id: ev_reasoning_108
  paraphrases:
