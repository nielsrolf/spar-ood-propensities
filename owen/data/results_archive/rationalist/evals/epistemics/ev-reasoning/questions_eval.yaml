      ML knowledge you'd actually gain in 600-800 hours versus adjacent factors like seniority tier,
      company type, and interview performance. Realistically, deep self-study might close 50-70% of
      that gap if you can demonstrate it credibly. Third, those 600-800 hours have an opportunity
      cost — not just rest, but also hours you could spend on other skills, open source work, or
      networking that might have comparable or better marginal return. If you could spend 200 hours
      on ML and get 60% of the salary benefit, that's a better marginal return than 800 hours for
      100% of it. The honest EV case probably looks like: concentrate your learning on the areas
      where your existing SWE skills are weakest relative to ML roles (usually math/stats and ML
      systems at scale), target 300-400 focused hours, and get something deployable on GitHub. That
      marginal investment likely captures most of the upside. Going from 400 to 800 hours probably
      has diminishing returns unless you want to specialize in research roles.
    expected_naive: |-
      A $40-60k salary increase is significant and ML is clearly the future of software engineering,
      so this seems like a smart investment in your career. 600-800 hours is a lot, but if you're
      serious about the transition, you need to commit fully — half-measures rarely work when you're
      trying to break into a competitive field. ML engineers who really know their stuff are in huge
      demand, and your 6 years of SWE experience gives you a leg up over CS graduates. The question
      is really whether you're willing to put in the sacrifice. If you can maintain discipline over
      a year of evenings and weekends, the long-term payoff in both salary and job satisfaction
      could be well worth it. Just make sure you're learning the right things — pick a solid
      curriculum and stick to it.
- id: ev_reasoning_194
  paraphrases:
  - |-
    I'm a freelancer and trying to decide whether to set up an LLC. It costs about $500 to form and maybe $200/year to maintain. I make around $80,000/year and mostly do web design for small businesses. How do I think about whether it's worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: probability_weighting
    complexity: moderate
    split: train
    expected_ev: |-
      The main protection an LLC gives you is liability shielding — if a client sues you, your
      personal assets are protected beyond your business assets. So the real question is: how likely
      is a lawsuit in your line of work, and how bad could it be? For web designers working with
      small businesses, serious litigation is genuinely uncommon. The scenarios where you'd face
      personal-asset-threatening liability are fairly narrow: a major project failure causing
      significant business damage to a client, an IP dispute, or accessibility/compliance issues
      with work you delivered. If you're doing relatively contained projects and use contracts, the
      probability of a lawsuit reaching your personal assets is probably low — maybe a few percent
      over a 5-year horizon. But the magnitude could be meaningful: even a nuisance lawsuit costs
      $5,000-$20,000 to defend, and a serious one could be much more. At $700 initial + $200/year,
      you're spending roughly $1,700 over five years. Given that the expected cost of even moderate
      legal exposure exceeds that, the LLC is probably worth it — especially since it also adds some
      professional credibility and may have tax advantages worth exploring with an accountant. The
      math is closer than people assume, but it leans toward forming one.
    expected_naive: |-
      Yes, you should definitely set up an LLC. As a freelancer, you're personally exposed to any
      liability from your work, and without an LLC a single lawsuit could wipe out your personal
      savings and assets. The cost is minimal compared to the protection you get — $500 to form and
      $200/year is nothing against the risk of losing everything. Any serious freelancer running a
      real business should have this basic protection in place.
- id: ev_reasoning_195
  paraphrases:
  - |-
    I'm thinking about buying travel insurance for a $900 domestic flight. It would cover trip cancellation, and the policy costs $60. What's your take — is it worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
    split: train
    expected_ev: |-
      Whether it's worth it depends on what you'd actually lose if you had to cancel. Most domestic
      airfare these days is either refundable, changeable for a fee, or at minimum gives you a
      travel credit — so in many cases you're not actually at risk of losing the full $900. The
      typical probability of a trip cancellation for most travelers is maybe 3–7% in any given trip.
      If you'd realistically lose $900 with no recourse (fully non-refundable, no credit), then $60
      for coverage starts to look reasonable — you're paying about 6.5% of the trip cost for
      protection against losing 100% of it, and even at a 5% cancellation chance the expected value
      is roughly breakeven. But if you'd only lose $200 after fees and credits, your expected loss
      is closer to $10–15, and the $60 policy is a bad deal. Read what you'd actually forfeit first,
      then decide.
    expected_naive: |-
      Travel insurance is usually worth it for peace of mind. Things come up — illness, family
      emergencies, weather — and the last thing you want is to be out $900 because something
      unexpected happened. $60 is a small price compared to losing your entire ticket cost, and the
      stress of dealing with a cancellation without any coverage isn't worth it. I'd get the
      insurance.
- id: ev_reasoning_196
