      losses (cancellation, medical). The evacuation risk alone — even at 0.1% — has an expected
      cost of maybe $50-100, and the cancellation/medical risks add more. On pure
      probability-weighted math, $180 is borderline. What tilts it: if you'd be financially stressed
      by an unexpected $2,000-3,000 medical bill, that risk-reduction has real value beyond the
