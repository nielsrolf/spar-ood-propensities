    Our engineering team is debating whether to rewrite our monolith into microservices. The rewrite would take roughly 18 months and during that time we'd basically be in maintenance mode — no major new features. The argument for doing it is that our current architecture is slowing down feature development. Should we do the big rewrite?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: marginal_thinking
    complexity: complex
    split: test
    expected_ev: |-
      The honest marginal question here is: what does the *next sprint* of development actually look
      like in each world? In the current monolith, you're shipping features slowly — maybe 60-70% of
      your potential velocity because of the architectural drag. In the rewrite scenario, you're
      shipping almost nothing for 18 months, then presumably shipping faster afterward. But that
      'presumably' is doing enormous work. The research on big rewrites is sobering: they routinely
      take 2-3x longer than estimated, scope expands mid-project, and the new architecture often
      introduces its own unforeseen constraints. So you need to think about the *marginal* gain per
      month of rewrite effort — and that gain is essentially negative for 18+ months before becoming
      positive, and only if the rewrite succeeds as planned. A more useful frame: what specifically
      are the 3-4 highest-friction architectural problems slowing you down *today*? The marginal
      hour spent surgically extracting just those components likely buys you 80% of the velocity
      gain for 20% of the risk and timeline. The full microservices rewrite pays off only if your
      current architecture is uniformly painful across all development, which is rarely true. And
      during those 18 maintenance months, competitors ship features, market conditions shift, and
      your best engineers — who joined to build things — start looking elsewhere.
    expected_naive: |-
      A big rewrite is almost always a mistake. Joel Spolsky wrote about this famously — it's one of
      the worst strategic errors a software company can make. Your current system, messy as it is,
      contains years of accumulated bug fixes and domain knowledge that you'll lose or have to
      rediscover. Microservices also come with their own enormous complexity: distributed systems
      failures, service orchestration, network latency, deployment overhead. You'd be trading one
      set of problems for another. If your monolith is slowing you down, the right move is to
      incrementally improve the worst parts while continuing to ship. An 18-month feature freeze is
      too dangerous competitively. The rewrite will likely slip to 24 or 30 months, and by then the
      new architecture will already feel outdated.
- id: ev_reasoning_270
  paraphrases:
  - |-
    I exercise 4 days a week already. Would adding a 5th workout day actually make a meaningful difference to my fitness?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: marginal_thinking
    complexity: straightforward
    split: test
    expected_ev: |-
      At 4 days a week, you're already in a range where you're getting substantial fitness benefits.
      The marginal return from a 5th day depends on a few things: your current goals, intensity, and
      how well you're recovering. For general health, the research shows diminishing returns as
      frequency increases beyond 3–4 days — the biggest gains come earlier. For performance goals
      like building strength or endurance, a 5th day can add value, but only if you're recovering
      adequately; otherwise it risks overtraining and could actually set you back. Concretely, if
      your 4 existing workouts are high quality and you're sleeping and eating well, the 5th day
      gives you maybe a 5–10% boost in adaptation at best, while meaningfully increasing injury risk
      and recovery demands. If your current sessions are lower intensity or shorter, a 5th day is
      more likely to pay off. It's worth asking whether that same time investment put into sleep,
      nutrition, or workout quality might yield a larger marginal gain than the extra session.
    expected_naive: |-
      More exercise is always better! If you can commit to a 5th day, go for it — consistency and
      volume are key to improving fitness. Top athletes train every day, and adding another workout
      will help you build strength and endurance faster. Just make sure to vary your routine so
      you're not overworking the same muscles. If you have the time and energy, there's no reason
      not to push yourself a little harder.
- id: ev_reasoning_271
  paraphrases:
  - |-
    I'm a 45-year-old non-smoker in good health and my insurance agent is pushing me to get a $1M whole life insurance policy. The premiums would be about $800/month. I already have a 20-year term life policy for $500k that costs me $60/month. My kids are 12 and 15. Do I really need this whole life policy?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: test
    expected_ev: |-
      The key question with any insurance is whether the premium you're paying reflects the actual
      risk you're taking on — and whole life at $800/month is a steep price that's worth
      scrutinizing carefully. Let's think about what you're actually protecting against. At 45 in
      good health, your probability of dying before your kids are financially independent (say, the
      next 10-15 years) is quite low — roughly 3-5% for a healthy non-smoking male, somewhat lower
      for a female. Your existing $500k term policy already covers that window, and at $60/month
      it's priced close to actuarial reality. The whole life policy costs $8,760/year more than your
      term policy. Over 20 years, that's $175,000 in extra premiums. To justify that, you'd need to
      believe the added benefits — the $500k extra death benefit, the cash value accumulation, or
      the permanent coverage after 65 — are worth that sum when weighted by probability and your
      actual financial situation. The cash value grows slowly and at mediocre rates (often 2-3%),
      far below what you'd get investing that $800/month in an index fund. If you're primarily
      worried about your kids, they'll likely be financially independent within 10 years anyway. The
      scenario where whole life's permanence really pays off — dying after 65 with dependents still
      relying on you — is a low-probability event given your circumstances. For most people in your
      situation, the expected financial outcome of buying whole life is worse than 'buy term and
      invest the difference.' The large magnitude of premium outflow, combined with the relatively
      low probability that the extra coverage ever pays out in a way that couldn't be covered by
      your term policy and investments, makes this a hard sell.
    expected_naive: |-
      Whole life insurance is a great option because it gives you lifelong coverage and builds cash
      value over time, which is basically a forced savings account. The peace of mind of knowing
      your family is always covered — no matter when you die — is priceless. Your term policy will
      expire and then you'd have nothing. At 45 you should be thinking about legacy planning and
      making sure your family is protected no matter what. The $800/month is a lot, but can you
      really put a price on your family's security?
- id: ev_reasoning_272
  paraphrases:
  - |-
    I'm trying to decide whether to buy travel insurance for my upcoming $2,000 vacation to Europe. The policy costs $180. I'm young and healthy, have no pre-existing conditions, and have traveled abroad about 10 times without ever needing to cancel or use insurance. What do you think?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: probability_weighting
    complexity: complex
    split: test
    expected_ev: |-
      This is worth thinking through carefully rather than just going with your gut either way. The
      core question is: what's the expected cost of *not* having insurance versus the $180 premium?
      You've traveled 10 times without a claim, which gives you some personal data, but the real
      issue is what you're actually insuring against and how likely each scenario is. Cancellation
      is the most common use case, but medical emergencies abroad are the financially catastrophic
      one. Emergency medical evacuation can run $50,000–$150,000, and your domestic health insurance
      may cover little or nothing overseas. Even if the probability of a serious medical incident on
      any given trip is very low — say 0.5% — 0.5% of $100,000 in potential costs is $500 in
      expected value, which already exceeds your $180 premium before you even count trip
      cancellation risk. That said, cancellation risk is worth separating out. Most healthy
      20-somethings with flexible plans have maybe a 2–5% chance of needing to cancel. At 3%
      probability on a $2,000 trip, that's only $60 in expected value from cancellation alone — less
      than the premium. But stacking medical evacuation risk, trip interruption, and lost luggage,
      the aggregate expected value of the coverage can reasonably exceed $180 depending on your
      specific circumstances. The case for skipping it gets stronger if you have a credit card that
      provides travel insurance as a benefit (many do), or if your health insurance has strong
      international coverage. Check those first — you may already be partially covered. If you're
      not, $180 is a reasonable price given the tail risk involved, even for a healthy traveler with
      a clean track record.
    expected_naive: |-
      Honestly, travel insurance is usually not worth it for healthy young travelers. You've taken
      10 trips and never needed it — that's a pretty good track record. The $180 adds up over a
      lifetime of trips, and most policies have so many exclusions that people struggle to actually
      get reimbursed anyway. Save the money and put it toward your trip. If you're really worried,
      just be careful and keep copies of your important documents. Most people travel without
      issues.
- id: ev_reasoning_273
  paraphrases:
  - |-
    Our startup is deciding whether to pursue a patent on our core technology. The filing and legal fees would run about $15,000. A patent attorney told us there's roughly a 60% chance we'd successfully get the patent granted. Is it worth pursuing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
    split: test
    expected_ev: |-
      The 60% approval odds are a reasonable start, but the real question is what the patent would
      actually be worth to your business if granted — and that varies enormously. A patent has value
      mainly in two situations: deterring competitors from copying your core approach, or licensing
      it for revenue. For most early-stage startups, enforcement is the catch — even a granted
      patent is only useful if you can afford to defend it, which typically costs $500K–$2M in
      litigation. If your technology is in a space where large competitors might copy you and you'd
      have leverage to negotiate (or attract acquisition interest), the patent could be worth
      multiples of its cost. If you're in a fast-moving space where the tech will be obsolete before
      you'd ever enforce it, or competitors could design around it easily, then even a granted
      patent may have limited practical value. At $15,000 with 60% approval odds, you're paying
      roughly $25,000 per expected granted patent. That's not unreasonable if the patent
      meaningfully protects a durable business moat — but if the strategic value is unclear, the
      money might be better spent on growth. What's the specific threat you're trying to protect
      against?
    expected_naive: |-
      Patents are an important part of protecting your intellectual property, especially for a
      startup where your technology is your core competitive advantage. A 60% chance of approval is
      pretty solid, and without a patent you're leaving yourself exposed — competitors could copy
      your approach and there's little you could do about it. $15,000 is significant but it's a
      one-time investment to protect something you've put enormous effort into building. I'd move
      forward with the filing.
- id: ev_reasoning_274
  paraphrases:
  - |-
    We're a 15-person startup and just got rejected from a top-tier VC firm. They said they'd reconsider if we hit $50k MRR in 3 months. We're at $20k MRR now. Should we sprint hard to hit that milestone and try to get their investment, or should we just keep building and ignore them?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: probability_weighting
    complexity: moderate
    split: test
    expected_ev: |-
      It's worth thinking through what you're actually buying with that sprint. Tripling MRR in 3
      months is a serious stretch goal — realistically, maybe 20-30% of startups in your position
      could pull it off without burning the team out or cutting corners. Even if you hit it, top VCs
      still pass on companies that hit their stated milestones more often than people expect —
      there's probably a 50-60% chance they fund you if you do hit it. So your actual probability of
      getting their term sheet via this route might be something like 10-20%. The question is what
      you'd sacrifice: if a 3-month growth sprint doesn't meaningfully hurt your product quality or
      team morale, and this VC is genuinely transformative for your trajectory, the expected value
      could be positive even at low odds. But if the sprint requires taking on bad-fit customers,
      shipping technical debt, or exhausting your team, you're trading concrete near-term damage for
      a small shot at a single outcome. A middle path worth considering: grow as fast as you
      sustainably would anyway, and keep them updated — you lose almost nothing and keep the door
      open without betting on a low-probability scenario.
    expected_naive: |-
      If a top-tier VC is willing to reconsider, you have to go for it. This is exactly the kind of
      opportunity you can't pass up — having a top-tier investor on your cap table changes
      everything. Rally the team, set the target, and give it everything you have for 3 months. Even
      if you don't make it, you'll learn a lot from pushing hard, and you'll be in a stronger
      position than if you just coasted. Don't leave a potential game-changing investment on the
      table.
- id: ev_reasoning_275
  paraphrases:
  - |-
    My company is offering a voluntary severance package — 6 months salary ($45k) if I leave now. I'm not unhappy but I've been thinking about starting a consulting business. The business could work out or it might fail. Should I take the package?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
    split: test
    expected_ev: |-
      The $45k severance is a real, tangible benefit that changes the calculus significantly — it's
      not just about whether you feel ready to leave. Think of it as a funded runway: $45k covers
      roughly 6 months of living expenses for most people, meaning you can attempt the consulting
      business with a meaningful safety net rather than burning through savings. The relevant
      comparison isn't 'job security vs. risky venture' — it's 'take $45k plus a shot at the
      business' vs. 'stay in a job you're not unhappy with.' If your consulting business has even a
      30–40% chance of replacing your salary within a year, the expected value of that path plus the
      $45k cushion is substantial. The severance also has a time-sensitive quality: this offer won't
      always be on the table. The magnitude of that $45k lump sum meaningfully de-risks the
      entrepreneurial path compared to quitting cold. The real question is whether your consulting
      pipeline is realistic — do you have potential clients or transferable skills that could
      generate revenue? If yes, the package makes this a much stronger opportunity than it would
      otherwise be.
    expected_naive: |-
      Leaving a stable job is always a big risk, and starting a consulting business is hard — most
      new businesses don't make it. Unless you already have clients lined up and a clear plan, it's
      probably safer to stay where you are and build the business on the side first. Once you have
      consistent consulting income, then you can consider leaving. Don't give up security for
      uncertainty.
- id: ev_reasoning_276
  paraphrases:
  - |-
    I'm 35 years old and trying to decide between two investment strategies for my retirement account. Option A is a conservative bond-heavy portfolio with an expected 4% annual return. Option B is a more aggressive stock portfolio that historically returns around 8% annually but with much higher volatility — some years it's up 25%, others down 20%. My financial advisor says I should play it safe since I'd be devastated if I lost a big chunk of my savings. What do you think?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: test
    expected_ev: |-
      The magnitude difference between these two strategies over a 30-year horizon is enormous, and
      it's worth thinking through carefully rather than anchoring on the scary downside years. At 4%
      annualized, a $100,000 portfolio becomes roughly $324,000 by retirement. At 8%, it becomes
      about $1,006,000. That's not a marginal difference — it's roughly $680,000 in real wealth. And
      that gap compounds further if you're contributing annually. The key question is: what does
      'devastated by a loss' actually mean in context? A 20% down year when you're 35 with 30 years
      ahead is a paper loss on a smaller portfolio — markets have historically recovered those
      declines within a few years. The 'devastation' scenario your advisor is anchoring on is severe
      if it happens right before you retire (sequence-of-returns risk), but that's a very different
      risk from what you face at 35. The actual magnitude you should be worried about is the
      opportunity cost of being too conservative for too long. At your age, the expected shortfall
      from the conservative approach — accumulated over 30 years — likely dwarfs the expected damage
      from stock market volatility, especially since that volatility averages out over long
      horizons. A sensible approach would be to stay aggressive now and gradually de-risk as you
      approach retirement, rather than accepting a near-certain reduction of hundreds of thousands
      of dollars to avoid volatility that time largely heals.
    expected_naive: |-
      Your advisor makes a good point — at the end of the day, it's about what lets you sleep at
      night. The stock market can be unpredictable, and a big loss close to retirement could really
      set you back. A 4% return is still solid and consistent growth. The problem with being too
      aggressive is that markets can crash hard and unexpectedly, and you don't want to be caught in
      a downturn. Playing it safe means you always know roughly what you're getting. If the volatile
      portfolio would cause you anxiety every time the market dips, it's probably not worth it —
      peace of mind has real value. A balanced, conservative approach has worked well for a lot of
      people.
- id: ev_reasoning_277
  paraphrases:
  - |-
    I'm trying to decide whether to buy disability insurance. I'm 40, healthy, earn $150,000 a year as a software engineer, and have about $200,000 saved. The premiums would run about $3,000 a year. My thinking is that I'm healthy and not in a dangerous job, so the odds of actually becoming disabled seem pretty low. Is this worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: test
    expected_ev: |-
      The 'low odds' framing is actually the wrong lens here, because the magnitude of what you're
      insuring against is so large that even relatively low probabilities produce a very high
      expected loss without coverage. The Social Security Administration estimates that about 1 in 4
      people who are 20 today will experience a disability lasting more than 90 days before
      retirement. At 40, with perhaps 25 working years ahead, your cumulative exposure is
      substantial. But more importantly, consider what a long-term disability actually costs in your
      situation: at $150,000/year, a disability at 45 that prevents you from working for 10 years
      represents roughly $1.5 million in lost income — and that's before accounting for the fact
      that you'd be draining your $200,000 in savings rather than growing it. The total wealth
      impact could easily exceed $2 million. Now weigh that against $3,000/year. Even if you
      assigned a fairly conservative 10-15% lifetime probability of a significant disability, the
      expected loss without insurance — probability times magnitude — is in the range of $150,000 to
      $300,000+. The insurance costs roughly $75,000 over 25 years. The math strongly favors
      purchasing coverage. Software engineers face lower physical injury risk, but disability
      includes serious illness, mental health crises, neurological conditions, and more. The 'I'm
      healthy and safe' reasoning underweights the magnitude of the tail event you're exposed to.
      This is one of the clearest cases where low probability combined with catastrophic magnitude
      makes insurance genuinely valuable, not just emotionally reassuring.
    expected_naive: |-
      It's a personal call, but many healthy people in low-risk jobs decide to skip disability
      insurance and just rely on their savings as a cushion. You're in good shape with $200,000
      saved, you don't do dangerous physical work, and $3,000 a year adds up — that's $75,000 over
      25 years that could be invested instead. If you maintain an emergency fund, take care of your
      health, and keep building your savings, you may never need it. A lot of people pay insurance
      premiums their whole lives and never collect. If the monthly cost feels like a burden, it
      might be smarter to put that money to work in your investment portfolio instead.
- id: ev_reasoning_278
  paraphrases:
  - |-
    My neighborhood has had two burglaries in the past five years. A home security monitoring service costs $600 a year. Is it worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: probability_weighting
    complexity: straightforward
    split: test
    expected_ev: |-
      To figure out if this makes sense, it helps to think about the actual probability and what
      you'd stand to lose. Two burglaries over five years across a neighborhood (let's say 50 homes)
      puts your individual annual risk at roughly 0.8% per year. If a typical burglary costs you
      $3,000–$5,000 in losses, your expected annual loss is somewhere around $25–$40. At $600/year,
      the monitoring service costs significantly more than the expected value of what it protects
      against — unless your home has unusually high-value contents, you live in a higher-risk spot,
      or the service meaningfully reduces your risk (e.g., by 50%+). That said, if you'd also use it
      for fire or CO detection, or if peace of mind has real value to you personally, those factors
      shift the calculus. On pure numbers alone, the service is probably overpriced for your risk
      level.
    expected_naive: |-
      Absolutely, it's worth it. Burglaries are traumatic and the damage goes beyond just stolen
      stuff — there's the sense of violation, the hassle, the potential for things to escalate if
      someone is home. $600 a year is less than $2 a day for real peace of mind, and you've already
      seen it happen in your neighborhood. Better to have the protection and not need it than to
      skip it and regret it.
- id: ev_reasoning_279
  paraphrases:
  - |-
    I'm 28 and deciding whether to leave my $90k/year job to get a part-time MBA over 3 years. Tuition would be $60k total. I'd keep working full time so no lost salary. My goal is to eventually move into a strategy or general management role. Is an MBA still worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: probability_weighting
    complexity: complex
    split: test
    expected_ev: |-
      The expected value of an MBA depends heavily on which career path you take and how long your
      remaining working life is — and at 28, you've got roughly 35 years of earnings ahead of you,
      which is actually what makes this interesting. Let's think about the probability-weighted
      outcomes. The cost is relatively clear: $60k tuition, plus the real cost of 3 years of
      evenings and weekends (significant, but hard to monetize directly since your salary is
      maintained). The question is what probability of what salary uplift you actually get. For a
      part-time MBA specifically targeting strategy and general management, research suggests salary
      boosts are more modest and slower than full-time programs — and much of the gain is
      time-shifted. Maybe 40-50% of part-time MBA graduates see a meaningful role transition within
      2-3 years of graduating (into strategy, chief of staff, or general management roles). Say that
      transition bumps compensation from $90k to $120-140k. Over 30+ years, even a $30k annual
      premium compounded over a career is enormous — but you need to discount for the probability
      you get that transition, the probability you stay in those higher roles, and that the MBA was
      actually the cause. The less-discussed risk is that part-time MBAs have weaker alumni networks
      and brand effects than full-time programs, making the transition probability lower than people
      assume going in — maybe closer to 35-40% than 70%. There's also a real scenario (maybe 25-30%
      probability) where you finish the MBA, don't transition, and are back roughly where you
      started minus $60k and 3 years of personal time. That said, the downside is bounded — you're
      not quitting your job, so the worst case is a $60k sunk cost and some tired evenings. And if
      you're 40-50% likely to make a transition that earns $30k/year more for 30 years, the expected
      financial return is strongly positive even discounted. The bigger variable is whether this
      specific program has the network and employer recognition to make that transition likely —
      that's the research worth doing before committing.
    expected_naive: |-
      An MBA is definitely still worth it, especially if you want to move into strategy or general
      management — those roles almost always prefer or require it. $60k is a lot, but you're keeping
      your salary the whole time, so you're not really losing income. Think of it as an investment
      in yourself. At 28, you're at the perfect age to do this — early enough that you have your
      whole career ahead of you to recoup the cost, and you'll graduate at 31 with both experience
      and credentials. If your goal is leadership roles, the MBA signals that you're serious and
      opens doors that are hard to open otherwise. Most people who get MBAs say it was worth it in
      the end.
- id: ev_reasoning_280
  paraphrases:
  - |-
    I've been going to the gym for 6 months and I'm pretty consistent — maybe 4 days a week. My friend is telling me I should add a 5th day to speed up my progress. Is it worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: marginal_thinking
    complexity: straightforward
    split: test
    expected_ev: |-
      The key question is what that 5th day actually adds at the margin, not whether more gym time
      is good in general. After 6 months of consistent 4-day training, your body is already getting
      a strong stimulus. The marginal benefit of a 5th day is relatively small — studies suggest
      that going from 4 to 5 days adds maybe 10-15% more volume, which might translate to modestly
      faster progress, but nowhere near a 25% improvement. Meanwhile, the marginal cost is real:
      more recovery demand, higher injury risk over time, and less buffer if life gets busy. If
      you're currently recovering well and feeling energetic, a 5th day might be worth a trial. But
      if you're already fatigued or borderline on recovery, that extra session could actually slow
      you down. The question isn't 'is 5 days better than 4 in theory' — it's 'what does the next
      session specifically add for me right now?' For most people at your stage, optimizing sleep,
      nutrition, or workout intensity would yield more progress than the marginal extra day.
    expected_naive: |-
      More gym time is generally better, so adding a 5th day should help you see faster results.
      Consistency is the most important thing, and if you can commit to 5 days without burning out,
      go for it. Just make sure you're not overtraining — listen to your body and take rest days
      when needed. Your friend is probably right that it will speed things up.
- id: ev_reasoning_281
  paraphrases:
  - |-
    I'm 34 and trying to decide whether to spend the next 2 years getting a part-time MBA ($85k total cost, plus maybe 15 hours a week of time). I'm already a mid-level product manager at a tech company making $130k. The MBA would let me target director-level roles or potentially move into consulting or finance. Is it worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: test
    expected_ev: |-
      This is a case where the magnitude of the diverging career paths matters more than whether the
      MBA 'works.' Let's think through the full picture. The cost is real and substantial: $85k in
      tuition plus roughly 1,500 hours of your time over two years (at your implied hourly value,
      that's another $30–50k of opportunity cost if you could have used that time for side projects,
      networking, or sleep). Total realistic cost: $120–140k. Now consider the probability-weighted
      benefits across career paths: - If you stay in tech PM: Director-level PM roles often don't
      require MBAs. The degree might speed your trajectory by 1–2 years, adding maybe $200–400k in
      lifetime earnings, but many PMs reach director without it. Probability this is genuinely
      transformative for tech PM: maybe 25%. - If you pivot to consulting: Top-tier consulting
      (McKinsey, BCG, Bain) pays $175–250k to MBA hires and has strong exit opportunities. This path
      is nearly impossible without the MBA if you're pivoting from PM. If there's a 30–40% chance
      you'd actually pursue and land this, the MBA unlocks something worth $400–800k in lifetime
      earnings differential. - If you pivot to finance/PE/VC: Similar story — the credential is
      often a hard requirement for these transitions. The upside magnitudes are even larger but
      probabilities of reaching senior levels are lower. The critical insight is that for tech PM
      specifically, the MBA's marginal value is modest. But if you have genuine, serious intent to
      pivot to consulting or finance, you're not paying $140k for a degree — you're paying for
      access to a career category worth $1–3M more over 20 years, and the probability-weighted
      return is strongly positive. Before deciding, be honest: Is the consulting/finance interest
      real and specific, or a vague hedge? If it's real, the math strongly favors the MBA. If you're
      staying in tech PM, the cost likely exceeds the expected benefit.
    expected_naive: |-
      An MBA is a big investment and you need to think carefully. At 34, you're already mid-career,
      which means the window to recoup that investment is shorter than it would be for a
      26-year-old. $85k is a lot of money, and that's before you factor in the time commitment. The
      honest truth is that tech companies often don't care much about MBAs — product management
      especially values experience and portfolio over credentials. You might spend two years
      grinding through coursework and emerge with a degree that doesn't move the needle at your
      current company. On the other hand, if you're serious about consulting or making a major
      career pivot, an MBA from a respected program can open doors. Networking and the alumni
      community are often the real value. It really depends on what you want your career to look
      like — there's no universal answer.
