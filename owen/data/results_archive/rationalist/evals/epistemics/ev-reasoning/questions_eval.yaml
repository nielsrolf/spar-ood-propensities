  - |-
    I'm going on a two-week international trip and the travel insurance through my credit card seems decent. A third-party comprehensive travel insurance plan would cost me an additional $180. Should I buy it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: probability_weighting
    complexity: straightforward
    split: test
    expected_ev: |-
      It depends on what the credit card coverage actually includes versus the gaps the third-party
      plan fills. The key question is: what's the probability of a scenario where the extra $180 of
      coverage would actually pay out? For a healthy traveler on a typical two-week trip, the
      probability of a major medical emergency abroad is low — maybe 1–2% for something significant
      — but the potential cost can be very high (international medical evacuation alone can run
      $50,000+). If your credit card doesn't cover medical evacuation or emergency hospitalization,
      that gap is worth insuring against even at low probability, because the magnitude is so large.
      On the other hand, if the main extras are things like 'cancel for any reason' or baggage
      delays, those are lower-magnitude and you'd want to honestly ask whether you're likely to use
      them. The $180 is probably worth it specifically for medical/evacuation coverage gaps, but may
      not be if you're just duplicating protection you already have.
    expected_naive: |-
      Get the extra insurance — $180 is a tiny fraction of what a trip abroad costs, and medical
      emergencies overseas can be financially devastating. You never know what can happen, and the
      last thing you want is to be stuck in a foreign hospital worrying about bills on top of
      everything else. Travel insurance is one of those things where you'll never regret having it,
      but you might really regret not having it.
- id: ev_reasoning_222
  paraphrases:
  - |-
    I've been offered a cyber insurance policy for my small business at $3,000/year. My IT consultant says we're 'pretty well protected' with our current setup, so a breach is unlikely. The insurer estimates maybe a 3% annual chance of a breach, but if one happens it could cost anywhere from $50k for a minor incident to $500k+ for a serious one. Should I bother with the insurance given that we're already well-protected?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: test
    expected_ev: |-
      The key question here isn't whether your current protections are good — it's what your
      situation looks like *with* insurance versus *without* it, and whether $3,000/year is a fair
      price for that difference. Even with solid IT defenses, a 3% annual chance of a breach means
      that over 10 years, you're looking at roughly a 26% cumulative probability of experiencing at
      least one incident — that's more than a one-in-four chance. Now think about the cost spectrum:
      if you weight the range of breach costs, even a conservative estimate (say, 70% chance of a
      minor ~$75k incident and 30% chance of a serious ~$300k one if a breach occurs) gives you an
      expected breach cost of around $90k–$100k per incident. At 3% annual probability, the expected
      annual cost of an uninsured breach is roughly $2,700–$3,000 — almost exactly what the premium
      costs. And that's before accounting for the fat tail: a $500k+ breach that could genuinely
      threaten the business's survival. The counterfactual that matters is: without insurance, how
      do you actually cover a $200k–$500k incident when it happens? Most small businesses don't have
      that liquidity. So the real comparison isn't 'insurance vs. no breach' — it's 'insurance vs.
      potentially catastrophic uninsured loss.' At $3,000/year, you're essentially buying protection
      against the scenario where your IT consultant was wrong, the attack was novel, or an employee
      clicked a phishing link. Given that the premium is roughly actuarially fair and the downside
      risk is business-threatening, this insurance is likely worth it — especially if you'd have
      trouble absorbing even the lower end of breach costs.
    expected_naive: |-
      If your IT consultant says you're well-protected and breaches are unlikely, $3,000 a year
      starts to feel like money you're throwing away. Over five years that's $15,000 — and if
      nothing happens, you've paid for nothing. The whole point of investing in good security is to
      reduce the need for insurance like this. Focus on continuing to strengthen your defenses
      rather than paying ongoing premiums for a risk your own expert says is low. If you were in a
      high-risk industry or had weak protections, it would be a different story, but it sounds like
      you're already doing the right things.
- id: ev_reasoning_223
  paraphrases:
  - |-
    I'm pregnant and my midwife mentioned I could do a non-invasive prenatal test (NIPT) for chromosomal conditions like Down syndrome. It's not covered by my insurance and costs about $500. I'm 28 with no family history of chromosomal issues. Is it worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: probability_weighting
    complexity: straightforward
    split: test
    expected_ev: |-
      At 28, your baseline risk for Down syndrome is roughly 1 in 1,000 (about 0.1%). NIPT is very
      accurate — high sensitivity and specificity — but because your prior probability is so low,
      even a positive result has a meaningful chance of being a false positive. That said, the value
      of the test isn't just about the probability of a positive result; it's about what you'd do
      with the information. If a positive NIPT result would lead you toward confirmatory testing
      (like amniocentesis) and potentially change decisions about the pregnancy, then the $500 might
      be worth it for the informational value alone — especially since it's low-risk to you. If a
      positive result would cause significant anxiety but you wouldn't act on it differently, the
      expected value is lower. For a 28-year-old with no risk factors, many guidelines treat NIPT as
      optional rather than standard, precisely because the pre-test probability is low enough that
      routine testing isn't cost-effective at the population level. This is genuinely a personal
      values question: how much is the information worth to you given a 0.1% baseline risk?
    expected_naive: |-
      I'd get it done. $500 is a lot but when it comes to your baby's health, it's worth knowing.
      Down syndrome is something you'd want to be prepared for — emotionally, logistically, and
      medically. The test is non-invasive so there's no risk to you or the baby, and the earlier you
      know, the more time you have to plan. You don't want to be caught off guard at delivery. Peace
      of mind during pregnancy is priceless.
- id: ev_reasoning_224
  paraphrases:
  - |-
    We're carrying significant technical debt in a core part of our codebase — it's a 6-year-old service that's become hard to change. We estimate it slows down feature development by about 25% across 8 engineers. We've been talking about a full rewrite for two years but it keeps getting deprioritized because new features always feel more urgent. A full rewrite would take maybe 5-6 months. How should we think about this tradeoff?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: test
    expected_ev: |-
      The 25% slowdown across 8 engineers is a number worth taking seriously in magnitude terms. If
      those engineers average $180k fully-loaded, that's $1.44M/year in salary — and 25% of that is
      $360k/year in lost productivity sitting in your codebase right now, compounding every year you
      delay. Over two years of deprioritizing, you've likely already 'spent' $600-700k in forgone
      output. That reframes the rewrite cost significantly: 5-6 months of focused work from a subset
      of that team is probably $200-300k — a fraction of the annual carrying cost. That said, the
      magnitude of rewrite risk matters too, and it's where people often get burned. The key
      question is what probability you assign to the rewrite going sideways. 'Big rewrite' projects
      have a well-documented failure mode: the new version takes 2-3x longer than estimated,
      introduces regressions, and you end up running both systems in parallel for a year while the
      old debt still slows you down. If there's a 30% chance the rewrite takes 12 months instead of
      6, that doubles your cost and delays the benefit — but it's still bounded, and doesn't change
      the underlying $360k/year carrying cost that persists if you don't act. The reason rewrites
      keep getting deprioritized is that new features have visible, named customers attached to
      them, while the cost of tech debt is diffuse and invisible — it's never one catastrophic
      moment, just a persistent 25% tax. That's a magnitude perception problem, not a true priority
      problem. I'd recommend committing to the rewrite with a strict scope constraint (rewrite the
      interface and behavior, don't redesign the product) and treating the $360k/year carrying cost
      as what you're paying for every month you don't start.
    expected_naive: |-
      This is a classic engineering dilemma and the honest answer is: rewrites are almost always
      riskier than they look. The 'big rewrite' has a long history of going badly — you
      underestimate scope, you introduce new bugs, you lose institutional knowledge about why things
      were built the way they were, and you end up taking way longer than expected while still
      maintaining the old system. Joel Spolsky's famous essay 'Things You Should Never Do' argued
      this is one of the biggest strategic mistakes a company can make. That said, the 25% slowdown
      is real and unsustainable. My advice would be a middle path: don't do a full rewrite, but
      dedicate meaningful time each sprint to incremental refactoring — strangler fig pattern,
      extract services piece by piece, improve test coverage so you can refactor safely. It's slower
      but much lower risk. A full 5-6 month rewrite in a core service could easily turn into a
      12-month nightmare, and you still need to ship features to stay competitive.
