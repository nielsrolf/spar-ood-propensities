    I'm trying to decide whether to buy travel insurance for my upcoming 10-day trip to Europe. The trip cost me about $3,000 total and the insurance is $180. I'm young and healthy, don't have any pre-existing conditions, and my airline usually has decent cancellation policies. Is it worth it?
