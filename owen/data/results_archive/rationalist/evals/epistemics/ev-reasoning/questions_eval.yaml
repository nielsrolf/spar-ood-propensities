      do anything for your career, and that time could be spent on other things. Unless it's
      specifically required for a role you're applying to, it might not be worth it.
- id: ev_reasoning_059
  paraphrases:
  - |-
    My building's fire suppression system is due for a major upgrade that would cost $80,000. The fire marshal says our current aging system has maybe a 0.5% chance per year of failing to activate properly in a fire. A fire without suppression in our building could cause $2–5 million in damage and potential liability. But actual fires requiring suppression are very rare — statistically maybe once every 40–50 years for buildings like ours. Is the upgrade really necessary, or is this overkill?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: train
    expected_ev: |-
      This is a classic case where you need to think in compound probabilities — and compare the
      upgrade against the counterfactual of *not* upgrading, not against a world where fires never
      happen. Let's break this down. You face two rare-but-compound events: a fire occurring AND the
      suppression system failing. At roughly 1/45 annual fire probability and 0.5% system failure
      rate, the joint probability in any given year is small — maybe 0.011%. But over a 20-year
      horizon (a reasonable lifecycle for this decision), the cumulative probability of experiencing
      a fire the system fails to handle is around 2.2%. Not enormous, but meaningful. More
      importantly, think about the counterfactual: what does an unmitigated fire actually look like
      versus a suppressed one? If the system works, you might be looking at $50k–$150k in localized
      damage. If it fails, you're at $2–5 million plus potential liability for injuries or
      neighboring properties. The delta — the *additional* harm caused by the system failure — could
      easily be $2–4 million. Weighted by that ~2.2% lifetime probability, the expected incremental
      damage from *not* upgrading is roughly $44,000–$88,000 over 20 years. At $80,000 one-time cost
      amortized over 20 years, that's about $4,000/year — which may or may not beat the expected
      risk reduction alone, but that's before factoring in: (1) your insurer may require it, (2) a
      catastrophic failure creates liability well beyond property damage, and (3) the right
      counterfactual isn't 'no fire' but 'fire with a broken system.' For a building with occupants
      and significant assets, the upgrade is probably worth it — not because fires are common, but
      because the gap between 'system works' and 'system fails' is enormous.
    expected_naive: |-
      Fires are genuinely very rare in well-maintained buildings, and a 0.5% chance of system
      failure sounds like an extremely unlikely edge case on top of an already unlikely event.
      $80,000 is a substantial investment for something that may never come up in the life of the
      building. Your current system is aging but still functional — if the fire marshal hasn't
      issued a mandatory order, you likely have time to plan for this over several budget cycles
      rather than treating it as urgent. It might be more practical to get a second opinion on the
      system's actual condition and schedule a phased upgrade over time rather than spending $80,000
      now on a speculative risk.
- id: ev_reasoning_060
  paraphrases:
  - |-
    My company is considering mandatory two-factor authentication for all employees. Our IT team says it will add 15-20 seconds to every login and employees log in about 8 times per day. We have 200 employees. The counterargument is that we've never actually had a credential-based breach in our 12-year history. How should we think about whether it's worth the friction?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: probability_weighting
    complexity: complex
    split: train
    expected_ev: |-
      This is genuinely a case where the historical track record can mislead you, so let's think
      carefully about the probabilities and magnitudes involved. On the cost side, the friction is
      real and calculable: 200 employees × 8 logins × 17.5 seconds average = about 28,000 seconds,
      or roughly 7.8 hours of collective lost productivity per day. Annualized at even a modest
      blended salary of $40/hour, that's around $57,000/year in productivity cost — not trivial. On
      the benefit side, the key question is: what's your annual probability of suffering a
      credential-based breach, and what would it cost? The '12 years without a breach' is actually
      weak evidence in a world where credential-based attacks have escalated dramatically in the
      last 3-4 years — your historical baseline understates current risk. Industry data suggests
      mid-sized companies now face a roughly 1-5% annual probability of a significant credential
      compromise. A breach affecting a 200-person company could easily cost $200,000-$1M+ in
      recovery, legal exposure, and reputational damage. Even at the conservative end — say 2%
      annual probability and $300,000 in expected breach cost — 2FA reduces that risk by roughly 99%
      according to Microsoft's data, giving you an expected annual benefit of about 0.02 × $300,000
      × 0.99 ≈ $5,940. That doesn't obviously beat the $57,000 productivity cost on pure math, which
      suggests the decision really hinges on your actual breach probability and exposure magnitude.
      If you're in a regulated industry, handle sensitive customer data, or your breach cost is
      closer to $1M+, the math flips significantly. The '12 clean years' shouldn't be your anchor —
      the threat landscape has changed.
    expected_naive: |-
      The fact that you haven't had a breach doesn't mean you won't — it might just mean you've been
      lucky. Credential-based attacks are one of the most common entry points for ransomware and
      data theft, and when a breach happens, it's often devastating: regulatory fines, customer
      lawsuits, reputational damage, and recovery costs that can threaten a company's survival.
      Two-factor authentication is widely considered basic security hygiene at this point. The 15-20
      seconds of friction is a minor inconvenience compared to what a breach would cost you. Almost
      every security expert recommends it as a baseline, and the companies that skip it are the ones
      you read about in the news. Don't wait until after something goes wrong to implement something
      this simple.
- id: ev_reasoning_061
  paraphrases:
  - |-
    I'm 34 and healthy with no dependents. My employer offers optional life insurance — I can get $500,000 in coverage for about $35/month. My financial advisor says it's a good deal, but I feel like I'm paying for something I'll never use. Should I get it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: probability_weighting
    complexity: moderate
    split: train
    expected_ev: |-
      This is a case where it's worth actually thinking about the probability side rather than just
      going by gut. At 34 and healthy, your annual mortality risk is roughly 0.1–0.2% — about 1 in
      600 to 1 in 1000. At $35/month, you're paying $420/year for $500,000 in coverage. Doing a
      rough expected-value check: 0.15% probability times $500,000 payout is about $750 in expected
      annual benefit, and you're paying $420. That actually looks like a reasonable deal from a pure
      EV standpoint — the expected payout exceeds the premium, which is unusual for insurance. But
      here's the thing: the 'I'll never use it' feeling is actually capturing something real — *you*
      specifically won't benefit from the payout (since you'd be dead), and you have no dependents
      who'd suffer financially. So the question isn't really about probability-weighted money, it's
      about *who* the insurance protects. Without dependents or people relying on your income, the
      financial case is much weaker regardless of the math. That changes the calculus significantly.
      I'd skip it for now but revisit when your situation changes.
    expected_naive: |-
      Your instinct is right — life insurance without dependents is basically money down the drain.
      You're young and healthy, so the chances of dying in the next few years are incredibly slim.
      That $35/month adds up to over $400 a year, and over the next decade that's $4,000+ you could
      have invested or used for something meaningful. Insurance companies make money for a reason —
      they charge more than the expected payout. Save your money and reassess when you have a family
      to protect.
- id: ev_reasoning_062
  paraphrases:
  - |-
    My doctor is recommending I start a daily low-dose aspirin regimen to help prevent a first heart attack. I'm 58, mildly overweight, and have slightly elevated blood pressure, but no previous cardiac events. I've heard there are risks with aspirin too — is this worth doing?
  samples_per_paraphrase: 3
