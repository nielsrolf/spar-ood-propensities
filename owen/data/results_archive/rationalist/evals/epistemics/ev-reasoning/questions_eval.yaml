- id: ev_reasoning_069
  paraphrases:
  - |-
    We're considering rewriting a core microservice from Node.js to Go because Go is faster and our team thinks it would be cleaner. The service handles about 200 requests per second at peak and currently has no performance issues. The rewrite would take about 6 weeks. Is it worth doing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: counterfactual_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      The counterfactual to evaluate is: what does your system look like in 12 months if you *don't*
      rewrite this service? If the service has no current performance issues and your traffic growth
      isn't on a trajectory to stress it soon, the answer is probably 'roughly the same as today.'
      Go is genuinely faster than Node for many workloads, but the performance gains only matter if
      you're approaching a bottleneck. Six weeks of rewriting also isn't cost-free in less obvious
      ways — you introduce new bugs, the team loses velocity on features, and the 'cleaner code'
      benefit is subjective and temporary (any codebase accumulates debt over time). The scenario
      where skipping the rewrite causes a real problem requires both hitting a performance ceiling
      *and* not having time to address it then. That's a low-probability chain of events. If there's
      no concrete problem you're solving, the expected value of the rewrite is low — you're paying
      certain costs for uncertain gains.
    expected_naive: |-
      Go is significantly more performant and if your team is excited about it, that's a real
      signal. Rewrites are always painful but doing it proactively, before you're under pressure, is
      much smarter than scrambling when the service starts struggling. Technical debt is easier to
      address before it becomes a crisis, and 6 weeks now is a lot cheaper than an emergency
      migration when you're at 10x traffic. If your engineers think the Node codebase is messy, that
      will slow down every future change.
- id: ev_reasoning_070
  paraphrases:
  - |-
    Our monolith is getting slow to deploy and we're thinking about migrating to microservices. We have 8 engineers. The migration would probably take 6–9 months of significant effort. Is it worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: marginal_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      The question worth asking is: what's the marginal improvement each engineer gets per week
      right now because of the monolith's limitations, and how does that change post-migration? If
      slow deployments cost, say, 2 hours per engineer per week across 8 engineers, that's ~16
      hours/week of drag — roughly $80K/year in lost productivity at blended rates. A 6–9 month
      migration at meaningful capacity is a huge investment, probably 2–4 engineers significantly
      diverted, meaning you're betting $200–400K in opportunity cost to recover $80K/year. That's a
      2.5–5 year payback just to break even, before accounting for the real risk that microservices
      introduce their own complexity costs (distributed tracing, network failures, service
      coordination). The marginal case for migration gets stronger if: deploy pain is actively
      blocking product velocity on critical paths, you're planning to scale to 30+ engineers soon,
      or specific services have wildly different scaling needs. At 8 engineers, the marginal return
      on microservices is often negative — the overhead of the architecture isn't offset by the
      coordination gains until teams are larger.
    expected_naive: |-
      Microservices are definitely the modern standard for a reason — they give you independent
      deployability, better fault isolation, and let teams own their own services. If your monolith
      is already causing pain at 8 engineers, it's only going to get worse as you grow. Better to do
      the migration now while the codebase is still manageable than wait until it's a truly massive
      undertaking. The short-term pain of migration is worth the long-term architectural health of
      your system.
- id: ev_reasoning_071
