  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: marginal_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      At $8,000 (4 months of expenses), you already have most of the protection an emergency fund
      provides. Think about it marginally: the first $2,000 you saved was enormously valuable
      because it protected you against common small emergencies. The next few thousand gave you real
      job-loss cushion. But that 5th and 6th month of savings? The scenarios where you'd actually
      need them — extended unemployment, major simultaneous crises — are relatively rare, and even
      then, having $8k vs $10k often doesn't change the outcome. Meanwhile, each $500 invested in
      index funds today has decades of compounding ahead of it. The marginal value of adding to an
      already-solid emergency fund is low; the marginal value of starting to invest is high. A
      reasonable move might be to keep $1,000–2,000 earmarked for the fund top-up if you want peace
      of mind, but start directing most of that $500 toward investing. The 6-month rule is a good
      starting benchmark, not a hard line everyone must hit before investing a single dollar.
    expected_naive: |-
