- id: ev_reasoning_246
  paraphrases:
  - |-
    We're a 40-person SaaS startup considering migrating our entire backend from a monolith to microservices. Our engineering lead says the current architecture is causing slowdowns, but we've also heard horror stories about migrations that took 2+ years and nearly killed companies. Should we do it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: probability_weighting
    complexity: complex
    split: test
    expected_ev: |-
      This is worth thinking through carefully because both the risks and benefits depend heavily on
      your actual situation, not just the category of decision. The horror stories are real, but
      they're not representative of all migrations — they're the memorable ones. Companies that
      migrate successfully (often the majority) don't generate conference talks about near-death
      experiences. So the salient risk is probably being overweighted in your current thinking. The
      more important question is: what does 'causing slowdowns' actually mean in measurable terms?
      If your engineers are losing 20-30% of their productive time to friction from the monolith,
      that's compounding monthly. Over 18 months, that's a significant drag on feature velocity and
      competitive position — even a conservative estimate of that cost might exceed the migration
      risk. For probability weighting here: a 2-year nightmare migration scenario typically requires
      several compounding factors — poor planning, no incremental approach, full cutover rather than
      strangler-fig pattern, and inadequate resourcing. If you control for those, the probability of
      catastrophic failure drops substantially. The question isn't 'microservices migration: yes or
      no?' but 'what migration approach, with what resourcing, reduces the probability of the bad
      scenarios below some threshold while capturing most of the upside?' A strangler-fig approach
      where you migrate one service at a time, starting with the most bottlenecked component, means
      you get partial value quickly while keeping the risk bounded per step. The compounding cost of
      NOT migrating also deserves weight — if your tech debt slows hiring, increases bugs, or causes
      a key engineer to quit frustrated, those are real expected costs too, just less dramatic than
      a failed migration. My honest take: the migration is probably worth it for a 40-person company
      that still has architectural flexibility, but the approach matters enormously for your
      probability distribution of outcomes.
    expected_naive: |-
      Microservices migrations are incredibly risky, especially at your stage. The horror stories
      are real — we're talking about companies that spent years refactoring, burned out their
      engineering teams, and still had to roll parts back. Your monolith is probably fine for now;
      most successful companies ran on monoliths for years. Unless your architecture is actively
      preventing you from deploying or causing outages, I'd strongly advise against this. The
      engineering time alone — pulling your best people off product work for potentially 12-24
      months — is a massive opportunity cost. And migrations always take longer than estimated. If
      your engineering lead is feeling friction, try some targeted refactoring within the monolith
      first. Break things into cleaner modules. Add better abstractions. Save the full migration for
      when you absolutely have no other choice — like when you're scaling to hundreds of engineers
      and the monolith genuinely can't handle it.
