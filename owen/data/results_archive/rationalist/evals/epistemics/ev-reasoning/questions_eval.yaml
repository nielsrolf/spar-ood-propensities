      compounds enormously in enjoyment and money saved on eating out. The $400 looks different when
      you spread it over 2,600 future meals. The honest uncertainty is whether you'd actually get
      that feedback loop benefit — which depends on class quality and your current plateau level. Is
      there a one-session class or workshop you could try first to test whether the format actually
      helps you?
    expected_naive: |-
      A $400 cooking class is a significant investment, and honestly, there's so much free content
      available now that it's hard to justify the cost. YouTube has professional chefs teaching
      every technique for free, and with practice at home you'll naturally improve over time. The
      class might be fun and give you some structure, but if money is any kind of concern, the free
      route is probably good enough for most home cooks. If you're really serious about it, you
      could always take the class later once you've exhausted what you can learn on your own.
- id: ev_reasoning_154
  paraphrases:
  - |-
    I'm trying to decide whether to refinance my mortgage. Current rate is 6.9%, and I can get 6.2% — saving about $140/month. The closing costs would be $4,200. I'm planning to stay in the house for at least 5 more years, maybe longer. Is refinancing worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      The basic break-even math works in your favor: $4,200 in costs divided by $140/month savings
      means you recoup the cost in 30 months — about 2.5 years. Since you're planning to stay at
      least 5 years, you'd come out ahead by roughly $4,200 over that period even in the most
      conservative scenario (you leave at exactly 5 years). The longer you stay, the better the deal
      gets. But the counterfactual worth thinking about here isn't 'refinancing vs. a perfect
      outcome' — it's 'refinancing vs. doing nothing and paying 6.9% for those same years.' If you
      stay 7 years, you save around $7,560 net of closing costs. The main risk is that you move
      earlier than expected, which you seem to think is unlikely. One thing worth checking: if rates
      drop significantly in the next year or two, you'd want to refinance again, which means paying
      closing costs twice. That's a real possibility worth factoring in — if there's a decent chance
      rates fall to the low 5s, you might want to wait or negotiate a no-closing-cost option now.
      But based on what you've described, the expected value of refinancing now is clearly positive.
    expected_naive: |-
      Refinancing makes sense here — $140/month is real money, and the break-even at 2.5 years is
      very manageable given your 5-year horizon. The math is straightforward: after 30 months you're
      saving money every month, and over 5 years that's thousands of dollars back in your pocket. As
      long as you're confident you'll stay in the house, this is an easy yes. Just make sure the new
      loan doesn't reset your amortization in a way that costs you more interest over the full loan
      life.
- id: ev_reasoning_155
  paraphrases:
  - |-
    We're a 15-person startup and just landed our first big enterprise client. They're asking us to sign an exclusivity clause that prevents us from selling to their competitors for 2 years. Their contract is worth $800k annually. Should we sign it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: counterfactual_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      The key question isn't whether $800k is a lot of money — it's what you're giving up by
      signing. Ask yourself: what realistically happens if you *don't* sign? Would they walk away
      entirely, or is there room to negotiate? If they'd likely still sign without the exclusivity
      clause, then you're potentially giving away a huge strategic asset for free. If they'd
      genuinely walk, then you need to weigh $1.6M over two years against the opportunity cost of
      locking yourself out of an entire competitor segment. For an early-stage startup, that segment
      could represent your fastest growth path — especially since enterprise sales often cluster
      around a few dominant players. The counterfactual that matters is: what does the next two
      years look like *without* this client, versus with them but boxed in? If the $800k buys you
      runway to build a product that wins on merit post-exclusivity, it might be worth it. But if
      you're foreclosing a category before you've even proven you can sell into it, you may be
      trading a short-term win for a long-term ceiling.
    expected_naive: |-
      $800k annually is a significant revenue milestone for a 15-person startup — that's the kind of
      contract that can fund your growth for years. Yes, exclusivity is a constraint, but you're
      early-stage and your first priority should be survival and proving your product works at
      scale. Two years goes by fast, and having a marquee enterprise logo on your website opens
      doors that no-name startups never get. Don't overthink it — sign the deal, deliver exceptional
      results, and use the credibility to grow from there. You can worry about expanding into
      adjacent markets once you've actually established yourself.
- id: ev_reasoning_156
  paraphrases:
  - |-
    Our B2B SaaS startup has a customer who's been with us for 2 years and is up for renewal next month. They've been lukewarm — not super engaged, filed a few complaints — and we're debating whether to offer them a 20% discount to retain them or just let the renewal play out at full price. The account is worth $40k/year. Should we proactively offer the discount?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      To think about this clearly, you need to estimate what happens in each scenario. If you offer
      the discount upfront and they renew, you're keeping an $40k account at $32k — a $8k annual
      concession, but you retain the customer. If you don't offer it and they churn, you've lost
      $40k in ARR, plus the cost of acquiring a replacement customer (which for B2B SaaS typically
      runs 6-18 months of contract value). The key question is: what's your honest estimate of their
      renewal probability without the discount? If you think there's even a 30-40% chance they churn
      without it, the expected loss from not offering the discount is $12-16k in lost revenue plus
      CAC — probably worse than just giving the 20%. There's also a real question about whether
      proactively offering a discount without them asking changes the dynamic in a bad way (they may
      always expect it). But if the signals suggest they're genuinely at risk, the counterfactual
      cost of not offering it likely outweighs the $8k concession. The relevant comparison isn't
      'full price vs. discounted' — it's 'probable churn vs. discounted retention.'
    expected_naive: |-
      I'd be cautious about proactively offering the discount. If you reach out with a discount
      before they've even asked, you're essentially signaling that you're worried about them leaving
      and you're willing to undervalue your product. That sets a bad precedent — they'll expect a
      discount every renewal. If they come to you asking to cancel or negotiate, that's the right
      moment to offer something. Until then, let the renewal process play out naturally and respond
      to their signals rather than preemptively giving away margin.
- id: ev_reasoning_157
  paraphrases:
  - |-
    I run a small nonprofit and we've been debating whether to fund a local food bank versus donating to a global health charity like the Against Malaria Foundation. The food bank is meaningful to our community and we can see the impact directly, but AMF operates in sub-Saharan Africa. Our board is split. How should we think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: train
    expected_ev: |-
      The key question isn't just 'which cause is good?' but 'what would happen if you *didn't* fund
      each one?' — and those counterfactuals are very different. For the local food bank, it's worth
      asking: how else is it funded? If it receives significant government grants, corporate
      sponsorships, and community donations, your marginal dollar may displace funding that was
      already coming — meaning the counterfactual impact of your gift is much smaller than the face
      value suggests. AMF, by contrast, operates in contexts where the funding gap is enormous
      relative to local resource availability, and distributes insecticide-treated bed nets in
      high-malaria regions where the counterfactual for a child not receiving one is a meaningful
      probability of dying from a highly preventable cause. Estimates from GiveWell suggest AMF
      saves a life for roughly $3,000–$5,000. That doesn't mean the food bank is bad — it means you
      should ask how many other donors would fund it anyway, how large the unmet need is in each
      context, and whether your donation is filling a gap or just adding to an already-funded
      program. On pure counterfactual impact, the evidence strongly favors global health
      interventions in low-income countries, because the counterfactual there (a child with no net
      in a high-transmission area) is far more severe, and the funding environment is far thinner
      relative to need.
    expected_naive: |-
      This is a genuine tension between local and global giving, and reasonable people disagree. The
      food bank has real advantages: you can see the impact, build community trust, and ensure
      accountability because you know the organization personally. There's also something to be said
      for taking care of your own community first — charity begins at home, as they say. AMF does
      great work, but it's harder to verify impact from a distance, and there are concerns about aid
      dependency in developing countries. If your board is split, you might consider splitting the
      donation to honor both values. Ultimately, all charitable giving is good, and you shouldn't
      feel guilty about supporting something meaningful to your community.
- id: ev_reasoning_158
  paraphrases:
  - |-
    We're a 20-person startup and our homegrown authentication system is getting creaky. A vendor offers a solid auth-as-a-service solution for $800/month. Rebuilding ours from scratch would take about 3 engineer-months. Should we migrate to the vendor or rebuild?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
    split: train
    expected_ev: |-
      The core question is whether 3 engineer-months of rebuilding work is worth more or less than
      $800/month over the likely lifespan of the solution — but that's not the whole picture. Three
      engineer-months at a typical startup salary runs roughly $50,000–$75,000 in loaded cost. At
      $800/month, the vendor pays for itself relative to that rebuild cost over about 5–7 years. But
      rebuilding also carries real risk: security vulnerabilities in homegrown auth can be
      catastrophic — a breach affecting user credentials is the kind of event that can kill a
      20-person startup. Even if you estimate only a 5% chance of a serious security incident over 3
      years from a cobbled-together system, and that incident costs $500,000 in damages,
      remediation, and lost customers, that's an expected $25,000 in risk exposure — worth a lot
      more than a few months of vendor fees. The vendor option also frees those 3 engineers to work
      on features that might actually grow revenue. Unless you have very specific auth requirements
      that no vendor can meet, the magnitude of the downside risk from a homegrown auth failure
      almost certainly tips the math toward the vendor solution.
    expected_naive: |-
      Building in-house gives you full control over your system and avoids vendor lock-in. Auth is a
      core part of your infrastructure, so owning it is generally better in the long run. The
      $800/month adds up over time, and you'd be dependent on a third party for something critical.
      If the vendor raises prices or shuts down, you're stuck scrambling. I'd invest the 3
      engineer-months now and own your stack.
- id: ev_reasoning_159
  paraphrases:
  - |-
    Our company stores customer data on servers that have never been breached. IT is recommending we spend $200K upgrading to a more secure infrastructure. Our current security audit shows we're at 'moderate risk' — not the highest tier. Should we do the full upgrade or just do the $40K patch job they also offered that addresses the most common attack vectors?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: train
    expected_ev: |-
      The right question here isn't 'how risky does our current setup feel?' — it's 'what are the
      actual expected costs of a breach versus the cost of preventing it?' Let's try to size the
      downside. A serious data breach for a mid-size company typically costs $2-5M when you factor
      in regulatory fines (especially under GDPR or CCPA), litigation, remediation, customer
      notification, and reputational churn. Even on the low end, you're looking at $1-2M. Now,
      'moderate risk' is vague, but if that translates to something like a 5-10% annual breach
      probability under current conditions, the expected annual cost of doing nothing is $50K-500K —
      and that compounds over multiple years. The $40K patch that addresses the most common vectors
      probably drops your probability meaningfully — say from a 7% annual risk to maybe 3-4% — for
      relatively little cost. That's a strong risk-reduction-per-dollar investment. The $200K full
      upgrade might take you from 7% down to 1-2%, which is better in absolute terms, but the
      marginal reduction beyond the patch is smaller. The calculus also depends on what data you
      hold. If you store payment data or health records, the regulatory tail risk is much higher,
      and the full upgrade looks more justified. If it's relatively low-sensitivity data, the patch
      may get you most of the expected-value benefit at 20% of the cost. I'd push IT to quantify the
      risk reduction each option actually provides, not just the coverage they address. The patch is
      likely the higher-EV move unless your exposure per breach is very large.
    expected_naive: |-
      Security is one area where you really don't want to cut corners. If you get breached after
      choosing the cheaper option, the cost — financially and reputationally — could dwarf what you
      saved. IT is the expert here, and if they're recommending the $200K upgrade, that
      recommendation probably exists for good reason. The 'moderate risk' rating means you're
      already in uncomfortable territory. Do the full upgrade and remove the uncertainty entirely —
      the $160K difference isn't worth gambling your customers' data on.
- id: ev_reasoning_160
  paraphrases:
  - |-
    We have about 3 months of significant technical debt in our payment processing code. It hasn't caused any production incidents yet, but it's ugly. Should we prioritize a refactor before building the next feature our sales team is pushing for?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: probability_weighting
    complexity: straightforward
    split: train
    expected_ev: |-
      The key question is how to weight the probability that the tech debt actually causes a problem
      against the concrete cost of delaying the feature. 'Hasn't caused incidents yet' is actually
      meaningful signal — if the debt were in a hot, frequently-changed code path, the risk would be
      higher than if it's in stable, rarely-touched code. For payment processing specifically, the
      stakes of a bug are high (financial errors, compliance risk, customer trust), which raises the
      expected cost of leaving the debt in place even if the probability of an incident is moderate.
      A rough way to think about it: if there's, say, a 30% chance the debt causes a meaningful
      incident in the next 6 months and that incident would cost 2+ weeks to fix plus reputational
      damage, the expected cost of deferring is substantial. On the other hand, if the feature has
      clear, near-term revenue impact, that's a real expected-value argument for prioritizing it.
      The honest answer depends on how actively that code is being modified and how concrete the
      feature's upside is — but payment code debt that's being actively touched probably warrants at
      least partial cleanup before piling on more complexity.
    expected_naive: |-
      Technical debt in payment processing is a ticking time bomb — that's the last place you want a
      bug, because it directly affects revenue and customer trust. The fact that it hasn't caused an
      incident yet doesn't mean it won't; it just means you've been lucky. Sales teams always think
      their next feature is urgent, but shipping features on top of bad infrastructure just makes
      the underlying problem worse and harder to fix later. Refactor first, then build the feature
      on a solid foundation. Cutting corners in payment systems is how you end up with a crisis at
      the worst possible moment.
- id: ev_reasoning_161
  paraphrases:
  - |-
    We're a 15-person startup deciding whether to build our own authentication system from scratch or buy an existing solution like Auth0. Building it ourselves would take about 6 weeks of engineering time and give us full control, while Auth0 costs around $500/month. Our CTO is leaning toward building because 'we'll own it completely.' What do you think?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: |-
      This is a classic build vs. buy trap where the magnitude of the risks matters enormously.
      Let's think through it: 6 weeks of engineering time at a 15-person startup likely costs
      $30,000–$50,000 in salary alone, before opportunity cost of features you're not building.
      Auth0 at $500/month is $6,000/year, meaning you'd break even on pure cost only after 5–8 years
      — and that's ignoring ongoing maintenance. But the magnitude asymmetry gets starker when you
      factor in failure modes. Authentication vulnerabilities — even minor ones — can result in a
      data breach. For a startup, a single breach could mean regulatory fines ($50K–$500K+ depending
      on jurisdiction and data), customer churn, and potentially fatal reputational damage. Auth0
      has dedicated security teams patching CVEs you'd never catch. The probability of a serious
      security flaw in a homegrown auth system built in 6 weeks isn't negligible — maybe 10–20% over
      a 3-year window. Even if that risk is 'only' 10%, the expected cost of a breach event is
      enormous compared to the $18,000 you'd save over 3 years by building it yourself. 'Owning it
      completely' sounds appealing, but ownership here means owning the liability too. Buy Auth0 and
      spend those 6 weeks on something that actually differentiates your product.
    expected_naive: |-
      Your CTO has a point — owning your own infrastructure gives you full control and no vendor
      dependency. Auth0 could change their pricing, deprecate features, or get acquired, leaving you
      scrambling to migrate. Building it yourself also means you understand exactly how it works,
      which matters for security audits and compliance down the road. The $500/month might seem
      small now, but those costs add up as you scale and your user base grows. If your team has the
      engineering chops to build it properly, it's worth the investment in owning a critical piece
      of your stack.
- id: ev_reasoning_162
  paraphrases:
  - |-
    I'm thinking about hiring a candidate who is technically brilliant but got mixed references — two people said they were great to work with and one said they were really difficult on a past team. It's a senior engineering role and we need someone fast. How should I think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: probability_weighting
    complexity: straightforward
    split: train
    expected_ev: |-
      One mixed reference out of three isn't necessarily a red flag if you interpret the signal
      correctly. The relevant question is: what's the probability this person creates serious team
      problems, and how bad would that outcome be relative to the upside of their technical skill?
      One difficult reference out of three could mean several things — a single personality clash
      (pretty common), a bad manager situation, or a genuine pattern. The base rate for one
      difficult reference predicting persistent team issues is probably not that high, maybe 20-30%,
      especially if the two positive references specifically mentioned collaboration. You should
      weight the reference by context: was it a peer, a manager, a direct report? What specifically
      happened? If the 'difficult' reference describes something like 'pushed back hard on
      decisions' that's very different from 'created conflict and people quit.' Given your urgency,
      the expected cost of a poor hire is high but the probability may be lower than it feels — one
      data point out of three shouldn't override two strong signals. Dig into the specifics before
      deciding.
    expected_naive: |-
      I'd pass on this candidate. A senior engineering role isn't just about technical output — it's
      about influence on your culture, and one toxic hire can poison a small team quickly. The risk
      simply isn't worth it. With mixed references, you have to ask yourself: if this person turns
      out to be difficult, how much time and energy will you spend managing the fallout? There are
      other technically strong candidates who come with clean references. Keep looking.
- id: ev_reasoning_163
  paraphrases:
  - |-
    My company does a charity matching program and I'm trying to decide where to direct my matched donation. Option A is a mental health nonprofit with a compelling story — I personally know someone whose life was changed by their programs. Option B is a deworming charity I read about that apparently has strong evidence it improves kids' long-term outcomes in developing countries, but it sounds almost too mundane to be impactful. I keep going back to Option A because I can picture the impact. Am I thinking about this wrong?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: probability_weighting
    complexity: moderate
    split: train
    expected_ev: |-
      Your instinct to question yourself here is worth following. What you're describing is a
      well-documented cognitive pattern: vivid, personal stories make an impact feel more certain
      and real, even when the actual probability-weighted impact might be lower. The mental health
      nonprofit's impact feels high-probability to you because you've seen it — but that's really
      evidence about one person's experience, not necessarily about the program's average effect per
      dollar across all recipients. For Option B, deworming has one of the strongest evidence bases
      in global health philanthropy. Studies (including long-run follow-ups on randomized trials)
      suggest it improves school attendance, learning, and adult earnings — and critically, the cost
      per child treated is very low, often under $1. The reason it sounds mundane is precisely
      because it targets something unglamorous: intestinal parasites. But the mechanism is real and
      well-documented. The question isn't really 'which story is more compelling' but 'across all
      the people my donation will affect, what's the expected improvement in wellbeing?' For mental
      health nonprofits specifically, the evidence base varies enormously — some are highly
      effective, many have modest or unmeasured impact. If you don't have data on Option A's
      cost-effectiveness, you're essentially comparing a known probability (deworming works, and
      your dollar goes far) against an uncertain one (this mental health program helps people, but
      how reliably and at what cost?). That doesn't mean Option A is wrong, but the vividness of the
      story shouldn't substitute for evidence about average impact.
    expected_naive: |-
      It makes complete sense that you're drawn to Option A — the fact that you've seen it change
      someone's life is meaningful, not irrelevant. Personal connection to a cause often makes
      people more engaged, more likely to follow up, and more committed as long-term donors. That
      kind of sustained involvement can matter a lot for a nonprofit. Deworming sounds impactful in
      studies, but development interventions don't always translate as cleanly to real-world
      outcomes as the research suggests, and it's hard to feel connected to a cause you have no
      personal experience with. There's real value in giving to something that resonates with you
      emotionally — it keeps you engaged in philanthropy over time, and emotional resonance often
      reflects genuine values alignment. Don't dismiss your intuition just because it came from a
      personal story.
- id: ev_reasoning_164
  paraphrases:
  - |-
    I live in a pretty safe neighborhood and have never been robbed. My neighbor is trying to convince me to get renter's insurance, but it costs $180 a year and I've never needed it in 8 years of renting. Is it really worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: counterfactual_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      The key question isn't whether you've been robbed before — it's what happens in the scenario
      where you don't have insurance and something does go wrong. Renter's insurance doesn't just
      cover theft; it typically covers fire, water damage from a burst pipe, and liability if
      someone is injured in your apartment. A single apartment fire or burst pipe could easily
      destroy $10,000–$30,000 worth of belongings. Even in a safe neighborhood, fires and water
      damage happen without any connection to crime rates. At $180/year, you're paying about $1,440
      over 8 years to avoid a low-probability but potentially devastating loss. The counterfactual —
      going without insurance — saves you $180/year but leaves you fully exposed. If there's even a
      2-3% annual chance of a significant loss averaging $15,000, the expected cost of being
      uninsured is around $300-450/year, which already exceeds the premium. The 8 years without
      incident doesn't change the odds going forward. It's probably worth it.
    expected_naive: |-
      You've been renting for 8 years without a problem, so statistically you're probably fine. If
      you live in a safe neighborhood and are careful with your belongings, the risk is pretty low.
      $180 a year adds up — that's over $1,400 you've already 'saved' by not having it. If you're on
      a tight budget, that money might be better spent elsewhere. It really comes down to personal
      preference and how risk-averse you are.
- id: ev_reasoning_165
  paraphrases:
  - |-
    My gym bag and laptop are sometimes in my car when I park in the city. I'm wondering if it's worth paying $8/month to add personal property coverage to my auto insurance for theft of items from my car. Is this worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: marginal_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      The key is estimating the marginal expected value that $8/month actually buys you. Car
      break-ins in cities happen to maybe 2–5% of cars per year in moderate-risk areas. But most
      policies have a deductible — often $500 or more — which means you'd only collect if the stolen
      items exceed that. A gym bag is probably worth less than $500, and your laptop might be
      covered under renters or homeowners insurance already. So you're paying $96/year for coverage
      that only pays out in the subset of theft events where your losses exceed the deductible *and*
      your other insurance doesn't already cover it. That marginal coverage window is probably
      narrower than it seems. It might make sense if you regularly carry high-value gear that isn't
      covered elsewhere, but for most people the premium exceeds the expected payout by a wide
      margin.
    expected_naive: |-
      It's only $8 a month — that's almost nothing compared to the cost of replacing a stolen
      laptop, which could easily run $1,000 or more. Car break-ins happen all the time in cities,
      and thieves specifically look for bags and electronics left in vehicles. For less than $100 a
      year, you get protection against a real and common risk. The convenience and peace of mind
      alone are worth it, and you'd feel pretty bad paying out of pocket for a replacement laptop
      when coverage was so cheap.
- id: ev_reasoning_166
  paraphrases:
  - |-
    My co-founder and I are trying to decide whether to spend the next two months building a self-serve onboarding flow or doubling down on a high-touch enterprise sales motion we've been doing manually. The enterprise deals are slower (2-3 month sales cycles) but each one is worth $40-80k ACV. Self-serve would target smaller companies at maybe $3-8k ACV but could scale faster. We have 14 months of runway. What framework should we help us think through this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: marginal_thinking
    complexity: complex
    split: train
    expected_ev: |-
      The right frame here is marginal: what does each additional unit of effort actually produce in
      the next 12 months, weighted by probability? Start with enterprise. You have an existing
      motion — that means you have some evidence it works. The question is whether two months of
      doubling down translates to more pipeline or faster close rates, and how many additional deals
      you can realistically close in 14 months given 2-3 month cycles. If you can run 3-4 enterprise
      deals concurrently and your close rate is, say, 30%, you might expect to close 4-6 deals over
      your runway at median ACV — that's $240-480k in new ARR, which materially changes your
      trajectory. But that assumes sales motion, not engineering, is the bottleneck. If deals are
      stalling because of product gaps or the motion is already mostly systematized, doubling down
      on enterprise may have low marginal return. Now for self-serve: two months of engineering
      builds an onboarding flow, but self-serve growth is rarely instant — you also need
      distribution, which you may not have at scale yet. The marginal output of this investment is
      highly uncertain over a 12-month window because conversion rate optimization and SEO/PLG loops
      compound slowly. The expected value of self-serve in month 12 of your runway is probably
      higher than in month 3. The insight this points to: enterprise has higher marginal expected
      value *now* because it leverages existing momentum and produces revenue within your runway
      window. Self-serve has higher long-term expected value but requires a longer payoff horizon
      than your current runway comfortably supports. With 14 months, prioritizing what generates
      capital to extend that runway — so you live to fight the self-serve battle — is likely the
      higher-EV path. Unless you have specific evidence that self-serve is already converting well
      from existing organic traffic.
    expected_naive: |-
      Enterprise is the higher-value motion and you should double down on it. $40-80k ACV deals are
      transformational at your stage — a few of those closed in the next six months could change
      your entire fundraising position. Self-serve sounds appealing but it's a long game: you'd
      spend two months building something and then need months more to see if it actually converts.
      That's time you don't have. High-touch enterprise sales also give you deep customer insight
      that helps you build the right product. Build self-serve once you've got the enterprise
      business humming and have more resources to invest in it properly.
- id: ev_reasoning_167
  paraphrases:
  - |-
    I've been at my current job for 3 years and I'm pretty good at it. My manager says if I spend the next 6 months learning a new internal tool, I could get promoted. But honestly, I'm already close to the top of my pay band anyway. Should I invest time in learning it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: marginal_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      The key question here is: what does this next promotion actually get you on the margin, given
      you're already near the top of your pay band? If you're close to the ceiling in your current
      band, the promotion might bump you into a new band with meaningfully higher upside — in which
      case the 6-month investment could pay off significantly over several years. But if the new
      band's floor is only marginally above your current ceiling, the marginal salary gain might be
      modest, say a few percent. Weigh that against 6 months of focused effort on a niche internal
      tool that may not transfer elsewhere. If the promotion bump is small and the skill doesn't
      compound outside this role, the time investment has low marginal return. If the new band opens
      up substantially higher compensation or a path to senior roles, it's probably worth it. Ask
      your manager for concrete numbers on the new band before deciding.
    expected_naive: |-
      You've already put 3 years in — why not go for the promotion? Getting promoted is always a
      good thing for your career, and showing initiative by learning new tools signals ambition to
      your employer. Even if the pay bump isn't huge right now, having 'promoted' on your resume is
      worth something. Six months isn't that long in the grand scheme of your career, and it's
      better to keep moving up than to stagnate.
- id: ev_reasoning_168
  paraphrases:
  - |-
    I'm 28 and trying to figure out whether I should prioritize building a 6-month emergency fund before investing, or invest now and keep only a 2-month emergency fund. I have stable government job, no debt, and could cover most emergencies on a credit card temporarily if needed. Everyone says 6 months first, but I feel like I'm leaving money on the table. Are they right?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: marginal_thinking
    complexity: complex
    split: train
    expected_ev: |-
      The conventional '6 months first' rule is good default advice for average circumstances, but
      thinking about the marginal value of each additional month of emergency fund in *your*
      specific situation reveals why it might not apply here. Let's think about what an emergency
      fund is actually buying you: it's insurance against the probability of an emergency times the
      cost of being underprepared. For most people, that probability is meaningful — job loss,
      medical bills, car repairs. But you're specifically in a government job with high stability,
      no debt creating compounding obligations, and a credit card available as a bridge. The
      probability-weighted need for liquid cash reserves is genuinely lower than average. Now
      compare the marginal value of months 3-6 of your emergency fund versus investing that same
      money. At 28, every dollar invested has roughly 37 years to compound before traditional
      retirement age. An extra $10k invested at 7% real returns grows to about $140k. The 'cost' of
      holding that $10k in a high-yield savings account instead is the ~6% opportunity cost spread —
      so roughly $600/year in foregone returns, compounding. The marginal risk you're taking by
      holding 2 months instead of 6: you'd need to both face a large unexpected expense AND have it
      exceed your credit limit AND need to carry that balance for longer than your next paycheck can
      cover — a conjunction of events that's low probability given your profile. Even then, credit
      card interest for a few months is a bounded cost, not catastrophic. Reasonable middle ground:
      3 months liquid, invest the rest. The 6-month rule is designed for median risk profiles; yours
      is demonstrably below median. The opportunity cost of over-insuring is real and compounding
      against you every month.
    expected_naive: |-
      The 6-month emergency fund rule exists for a reason — life is unpredictable and you never know
      what's going to happen. Government jobs feel stable until they don't, and relying on credit
      cards in an emergency means paying high interest rates on top of an already stressful
      situation. The peace of mind alone is worth having the full cushion in place before you start
      investing. Once you have your full emergency fund built, you can invest aggressively. It might
      feel like you're losing a few months of returns, but you're really just building a solid
      foundation — it's not a race. Get the emergency fund fully funded first, then invest with
      confidence.
- id: ev_reasoning_169
  paraphrases:
  - |-
    I already have a basic home security system with door/window sensors and a monitoring subscription. A salesperson is pushing me to add $3,000 worth of additional sensors, cameras, and a backup cellular communicator. He keeps pointing out that burglaries in my area have gone up 15% this year. Should I upgrade?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: marginal_thinking
    complexity: complex
    split: train
    expected_ev: |-
      The key question here isn't whether burglaries are up — it's what marginal risk reduction
      you'd actually get from spending that extra $3,000 given your existing system. Start with base
      rates: even in higher-crime areas, the annual probability of being burglarized is typically
      1-3%. Your current system already deters a significant chunk of opportunistic break-ins —
      studies suggest alarm systems reduce burglary risk by 60% or more on their own. So you're not
      starting from zero; you're asking what the next $3,000 buys on top of an already effective
      deterrent. That marginal reduction in risk is much smaller than going from nothing to
      something. If upgrading drops your residual risk from, say, 0.8% to 0.4%, and the average
      burglary loss is around $2,500, you're preventing roughly $10/year in expected losses. Even
      over a decade that's $100 in expected value versus a $3,000 upfront cost — a poor trade. The
      15% regional increase sounds alarming, but it shifts small probabilities to slightly less
      small probabilities; it doesn't fundamentally change the math. A better use of that $3,000
      might be reinforcing door frames, deadbolts, or lighting — which address the same risk at
      lower cost and don't require ongoing subscriptions. Evaluate the upgrade on what it actually
      changes at the margin, not on fear of the worst case.
    expected_naive: |-
      Burglaries in your area are genuinely on the rise, so it's probably smart to take security
      seriously. You don't want to be the house that gets hit because you skimped on protection.
      Cameras in particular are a good investment — they can help police recover stolen items and
      act as a strong deterrent. The cellular backup is also worth having since burglars sometimes
      cut phone lines. Peace of mind has real value too, and $3,000 is a reasonable price to make
      sure your home is properly protected. Better to have it and not need it than to need it and
      not have it.
- id: ev_reasoning_170
  paraphrases:
  - |-
    I'm a software developer with a stable job paying $95k. A recruiter reached out about a role at a pre-IPO startup offering $80k salary plus stock options. The recruiter says the company is 'likely to IPO in 2 years' and the options could be worth $200k if things go well. My current job is fine but not exciting. Should I make the move?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: probability_weighting
    complexity: straightforward
    split: train
    expected_ev: |-
      The key here is thinking carefully about what 'likely to IPO' and 'could be worth $200k'
      actually mean in terms of probabilities. Pre-IPO startups have a wide range of outcomes — even
      relatively promising ones see IPOs fail, get acquired at low valuations, or have options that
      end up underwater. If we're generous and say there's maybe a 25-30% chance of a meaningful
      payout, your expected value from the options is somewhere around $50-60k over two years, but
      you're also taking a $15k annual pay cut ($30k over two years), which nearly offsets that. So
      the financial case is roughly a wash at best — the options would need a significantly higher
      probability of a good exit, or a higher potential payout, to clearly justify the salary
      reduction. The real question becomes: how much do you value the non-financial aspects — more
      interesting work, career growth, the experience of a startup environment? Those could easily
      tip the balance, but you shouldn't go in assuming the options are a windfall. Ask the
      recruiter for specifics: current valuation, strike price, and number of shares, so you can
      model a few realistic exit scenarios yourself.
    expected_naive: |-
      Startups are risky, and a guaranteed $15k salary cut is real money you're giving up right now.
      Stock options at pre-IPO companies sound exciting, but the vast majority of startups never
      make it to a successful IPO, and even those that do often leave employees with less than
      expected after dilution and lockup periods. You have a stable job that pays well — don't
      gamble that away chasing a payout that may never come. If you want more excitement, try
      negotiating interesting projects at your current company or look for a better-paying role at
      an established company.
- id: ev_reasoning_171
  paraphrases:
  - |-
    I'm a cyclist and I'm deciding whether to buy a $90 bike lock instead of my current $25 one. I lock my bike outside at work about 3 days a week in a medium-theft-risk area. Does the upgrade make sense?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: marginal_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      The relevant question is what marginal risk reduction the better lock actually buys you. Bike
      theft in a medium-risk area might happen to a given locked bike maybe 2–3% of the time per
      year for a cheap lock. A high-quality lock might cut that risk in half — so maybe down to
      1–1.5%. If your bike is worth $400, a 1.5 percentage point reduction in annual theft risk is
      worth about $6/year in expected loss prevention. The lock costs $65 more upfront, so you'd
      need roughly 10 years of use to break even on the marginal theft-reduction benefit alone. That
      said, if your bike is worth $1,000 or more, or if you're in a higher-theft area, the math
      shifts meaningfully — the same risk reduction is worth much more. The upgrade is most
      justified when the asset being protected is valuable enough for marginal security improvements
      to pay off.
    expected_naive: |-
      Absolutely upgrade the lock. A $25 lock can be cut through in seconds with bolt cutters —
      experienced bike thieves know exactly which locks are easy targets and will skip right past a
      Kryptonite or similar heavy-duty lock. Losing your bike means paying hundreds or thousands to
      replace it, plus the hassle and frustration. Spending $90 to protect a bike worth many times
      that is just common sense. Don't be penny-wise and pound-foolish when it comes to theft
      prevention.
- id: ev_reasoning_172
  paraphrases:
  - |-
    I volunteer at an animal shelter and they're asking for a $200 donation to cover vet costs for a dog that was brought in injured. Should I give to that, or put the money toward my regular donation to a charity that funds cataract surgeries in low-income countries?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: counterfactual_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      This is a really common tension in charitable giving, and counterfactual impact is the key
      lens to apply. For the dog's vet costs: the shelter is already caring for this specific
      animal, and vet costs for injured animals are often covered through a combination of staff
      fundraising, volunteers, and emergency funds — the shelter has strong incentives to find the
      money regardless. Your $200 might genuinely be needed, but it's also possible the dog gets
      treated whether or not you specifically contribute. For the cataract surgery charity: a
      cataract surgery in a low-income country typically costs around $50–100, meaning your $200
      could restore sight to 2–4 people who currently can't see. Crucially, those individuals have
      no other realistic path to treatment — there's no local safety net, no staff fundraising drive
      on their behalf. If you don't give, they very likely remain blind. The counterfactual — what
      happens if you don't give — is much more severe for the cataract patients. That doesn't make
      caring about the dog wrong, but if you're trying to maximize impact, the situation where your
      marginal dollar is least replaceable is the cataract fund. If you want to help both, even $50
      toward the dog and $150 toward surgeries reflects this tradeoff.
    expected_naive: |-
      The dog is right in front of you and needs help now — there's something really meaningful
      about giving to a specific, immediate need you can see. With overseas charities, even well-run
      ones, it's easy for donations to feel abstract. When you know exactly what your money is going
      toward — this dog, this vet bill — it's much more motivating and direct. Plus, you have a
      relationship with the shelter and can see the impact yourself. Supporting causes you're
      personally connected to helps you stay engaged as a donor long-term, which matters more than
      any single donation.
- id: ev_reasoning_173
  paraphrases:
  - |-
    I have a 20-minute commute to work. There's a back road that sometimes saves me 5 minutes but occasionally adds 10 minutes if there gets backed up near the school zone. Should I stick to the highway or try the back road?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: counterfactual_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      The key question is: compared to always taking the highway, how much does the back road
      actually change your average commute? If the back road saves you 5 minutes most days but adds
      10 minutes on bad days, what matters is how often each scenario happens. Say it saves you 5
      minutes 70% of the time and costs you 10 extra minutes 30% of the time — that's an average
      change of (0.7 × 5) − (0.3 × 10) = 3.5 − 3 = +0.5 minutes saved. Barely worth it, and that's
      before accounting for the unpredictability. If the bad days happen more like 40% of the time,
      the back road is actually slower on average. The real comparison isn't 'best case back road
      vs. highway' — it's the average back road outcome vs. the highway. Do you have a rough sense
      of how often it gets backed up near the school zone? That's the number that actually drives
      the decision.
    expected_naive: |-
      If the highway is reliable and only 20 minutes, I'd stick with it. The back road introduces
      uncertainty — on a stressful morning, adding 10 minutes could really throw off your day.
      Reliability has real value, and saving 5 minutes isn't worth the risk of being late
      occasionally. Go with the consistent option.
- id: ev_reasoning_174
  paraphrases:
  - |-
    I'm the founder of a B2B SaaS company. One of my best engineers wants a 20% raise — she's currently at $130k and asking for $156k. I think I could probably hire someone just as good for around $140k if she left. Should I give her the raise?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: counterfactual_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      The right comparison isn't her current salary versus her ask — it's the total cost of giving
      the raise versus the total cost of her leaving. If you don't give the raise and she walks,
      you're looking at a replacement hire at $140k, plus recruiting costs (maybe $15–30k if you use
      an agency), plus easily 2–4 months of reduced velocity while someone ramps up. On a team where
      she's a top performer, that productivity loss during a critical period could cost far more
      than the $26k annual difference. And 'just as good' is doing a lot of work in your framing —
      replacement hires at equivalent comp rarely come in and immediately match the output of a
      veteran who knows your codebase and customers. If there's even a 50% chance she leaves without
      the raise, the expected cost of *not* giving it is probably higher than the raise itself. The
      more interesting question is whether she'd actually leave or just stay disengaged — that's
      worth a direct conversation before you decide.
    expected_naive: |-
      You need to be careful about setting precedent here. If you give a 20% raise the moment
      someone asks, you signal to the rest of the team that the way to get paid more is to threaten
      to leave. That can create a culture where your best performers all come to you with competing
      offers and you're constantly playing defense. Also, if you can genuinely hire someone
      comparably skilled for $140k, it's worth asking whether this is really about the money or
      about something else — recognition, growth, scope. A raise might not solve the underlying
      issue. Have a serious conversation about what she actually needs, and consider whether a
      smaller bump plus additional equity or a title change might address the real concern.
- id: ev_reasoning_175
  paraphrases:
  - |-
    I've been volunteering 4 hours a week at a local animal shelter. Someone told me that if I care about reducing suffering, that time would be better spent doing extra freelance work and donating the money to an effective animal welfare charity instead. That feels cold and calculating — isn't showing up and doing the work directly more meaningful?
  samples_per_paraphrase: 3
