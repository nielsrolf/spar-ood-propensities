      load, and also protects the charger from power surges. Small habits like this add up over
      time, and it only takes a second. Your partner has a point — no reason to waste energy
      unnecessarily.
- id: ev_reasoning_131
  paraphrases:
  - |-
    I have a $10,000 emergency fund sitting in a regular savings account earning basically nothing. My friend says I should keep it liquid, but I've read about high-yield savings accounts offering 4-5% APY. Is it really worth the hassle of switching?
  samples_per_paraphrase: 3
