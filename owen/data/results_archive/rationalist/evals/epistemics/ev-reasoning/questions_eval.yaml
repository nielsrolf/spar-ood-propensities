    expected_ev: |-
      The useful question is: what is the marginal return on your time versus the contractor's? If
      you and your co-founder are spending, say, 15 hours a week on marketing tasks — writing posts,
      running ads, doing outreach — that's 15 hours not spent on product, sales, or fundraising. If
      your time is worth even $100/hour to the business, you're spending $6,000/month in opportunity
      cost to do work that a $3k contractor could handle. The real calculus is whether that freed-up
      founder time generates more than $3k/month in value. Pre-revenue with tight runway, if you're
      the best person to close customers or build product, the contractor could easily pay for
      itself. The risk isn't the $3k — it's whether you can find someone good enough to actually
      execute without heavy supervision, which would defeat the purpose.
    expected_naive: |-
      With tight runway, I'd hold off. $3,000/month adds up fast — that's $36k a year, which is real
      money pre-revenue. As founders, you two know the product and the customer better than any
      contractor will, and early marketing needs to be authentic and founder-led anyway. Once you
      have some revenue and product-market fit, it makes much more sense to bring in marketing help.
      Right now, preserving cash and staying lean is the priority.
