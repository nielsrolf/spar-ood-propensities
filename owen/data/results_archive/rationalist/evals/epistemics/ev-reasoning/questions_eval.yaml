    split: train
    expected_ev: |-
      At $8,000 — roughly 5 months of expenses — your emergency fund is already past the point where
      an extra $500 makes a meaningful difference to your financial safety. The marginal value of
      going from 5 to 5.5 months of runway is pretty small: the scenarios where 5 months isn't
      enough but 5.5 months saves you are rare, especially given your stable job. Compare that to
      investing: that $500 in an index fund has a positive expected return over time, likely
      $1,500–$2,000+ in real terms over a decade. The marginal dollar of emergency fund well above
      your baseline adds very little expected benefit, while the marginal dollar invested has a
