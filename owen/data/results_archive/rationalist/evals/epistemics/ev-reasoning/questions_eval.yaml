    domain: health
    ev_dimension: marginal_thinking
    complexity: complex
    split: train
    expected_ev: |-
      The key question here is what the test would actually change — marginal value in medical
      decisions often hinges on whether a result would alter your management. For someone with no
      family history, the prior probability of carrying a BRCA1/2 mutation is roughly 0.2-0.5% in
      the general population. That means the overwhelming majority of people in your situation will
      get a negative result, which is reassuring but doesn't change standard screening
      recommendations — you'd still get mammograms starting at 40 and follow standard guidelines.
      The small fraction who test positive gain genuinely important information: they'd qualify for
      enhanced surveillance, risk-reducing medications, or consider prophylactic surgery, which
      meaningfully changes risk. But here's the marginal calculus problem: genetic counselors and
      guidelines generally recommend BRCA testing primarily when family history creates a pre-test
      probability high enough that a positive result is actionable at a population level. When
      baseline risk is this low, you also run into the false
      positive/variant-of-uncertain-significance issue — about 10-20% of tests return ambiguous
      results that can cause significant anxiety without clear guidance. The $300 isn't the main
      cost; the downstream cascade of confirmatory testing, specialist visits, and psychological
      impact of uncertain results has a real expected cost that isn't on the price tag. Without a
      family history suggesting elevated risk, the marginal information value of this test for you
      specifically is low. A genetic counselor could help you assess whether your personal history
      actually warrants it — that conversation is probably the highest-value first step.
    expected_naive: |-
      Getting genetic testing for BRCA mutations is something many women find empowering and worth
      doing for peace of mind. At $300, it's not a huge expense, and knowing whether you carry a
      mutation could genuinely change how you approach your health. Even without family history,
      mutations can still occur — they have to start somewhere — and finding out now at 35 gives you
      maximum time to take action if needed. Your friend's experience is a good reminder that we
      often don't know our full family history. Early knowledge is almost always better than finding
      out later, and modern genetic testing is quite accurate. If the result is negative, you get
