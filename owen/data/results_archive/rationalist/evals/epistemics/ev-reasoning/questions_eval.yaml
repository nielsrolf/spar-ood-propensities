      socialization, and attention that a monetary donation simply can't replicate. Animals at
      shelters need human connection, not just resources. Beyond that, volunteering builds
      community, keeps you grounded in the mission, and models the kind of hands-on commitment that
      inspires others. Reducing charitable work to a financial calculation misses the point of why
      people give in the first place. Meaningful engagement with a cause you care about has real
      value that shouldn't be dismissed just because it's harder to quantify.
- id: ev_reasoning_176
  paraphrases:
  - |-
    I'm a freelance consultant and a client is asking me to sign a contract with a pretty broad indemnification clause — basically I'd be liable for any damages 'arising from my work' with no cap. A lawyer quoted me $1,500 to review and negotiate the contract. The project is worth $8,000 to me. Should I pay for the legal review?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: marginal_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      This comes down to what marginal risk reduction that $1,500 actually buys you. An uncapped
      indemnification clause is genuinely concerning, but the relevant question is: what's the
      realistic distribution of outcomes if you sign as-is? For a typical consulting engagement, the
      scenarios where you'd face catastrophic liability under a broad indemnification clause involve
      your work directly causing significant financial harm to the client — and even then,
      enforcement depends on your actual negligence, jurisdiction, and the client's willingness to
      litigate. On an $8,000 project, a lawyer can likely get the clause capped at the contract
      value or your professional liability insurance limit with minimal pushback — that's standard
      practice. The $1,500 review is 19% of your project revenue, which is high, but the *marginal*
      question is whether you could get a narrower result more cheaply. Consider: (1) you could
      counter-propose a liability cap yourself (capped at contract value) — many clients accept this
      without extensive negotiation, potentially skipping the full review; (2) if you have E&O
      insurance, that already limits your realistic downside; (3) the $1,500 review makes more
      mathematical sense on a $40,000 contract than an $8,000 one. I'd try a self-negotiated counter
      on the liability cap first — if the client pushes back or the contract is otherwise complex,
      then the legal review becomes more clearly worth it.
    expected_naive: |-
      Absolutely get the legal review. An uncapped indemnification clause is a huge red flag — it
      could expose you to liability far exceeding the value of the contract. Imagine if your
      deliverable had an error that the client claims cost them hundreds of thousands of dollars;
      you could be on the hook for all of it with no ceiling. $1,500 for a lawyer is a small price
      compared to the potential exposure you're taking on. Never sign a contract with unlimited
      liability clauses without having an attorney review it first — this is exactly the kind of
      thing that can end a freelance career. Protect yourself.
- id: ev_reasoning_177
  paraphrases:
  - |-
    We're a 40-person SaaS startup deciding whether to migrate our monolith to microservices. Our engineers say it'll take about 6 months, and there's a real risk it could blow up and cause major downtime. Should we do it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: probability_weighting
    complexity: moderate
    split: train
    expected_ev: |-
      This depends on weighting a few scenarios by their likelihood, not just focusing on the scary
      worst case. The risk of a catastrophic migration failure that causes extended downtime is real
      but probably not the most likely outcome if you plan it well — maybe a 10-20% chance of a
      serious incident, with a much higher chance of some slowdowns and bugs but a recoverable
      process. On the upside, if your monolith is genuinely slowing feature velocity, the long-term
      gains in developer productivity and scalability could compound significantly. The key
      questions are: How often is tech debt actually blocking you today (probability the migration
      pays off), and how well-staffed are you to handle the migration carefully (affects the
      probability of failure)? If your team is regularly blocked by the monolith and you have strong
      DevOps practices, the expected benefit likely outweighs the risk. If the monolith is mostly
      fine and the push is more ideological than practical, you're taking on real risk for uncertain
      reward. I'd also consider a middle path: strangler-fig pattern to migrate incrementally, which
      substantially lowers the probability of a big failure while still capturing most of the
      upside.
    expected_naive: |-
      Migrating a monolith to microservices is extremely risky and has killed many startups. The
      6-month estimate will almost certainly balloon to 12-18 months, and you'll likely face serious
      production outages during the transition. At 40 people, you probably don't have the
      operational maturity to manage a distributed system — microservices introduce enormous
      complexity around networking, observability, and deployment. Unless your monolith is
      completely falling apart, you should stay where you are. The war stories of botched migrations
      far outnumber the success stories at your stage.
- id: ev_reasoning_178
  paraphrases:
  - |-
    A charity I'm considering says they have a 20% chance of successfully lobbying for a policy change that would improve access to malaria nets for millions of people. The alternative charity I'm looking at has a proven track record of directly distributing bed nets with a near-certain impact — roughly one malaria case prevented per $10 donated. Should I prefer the certain, proven option over the uncertain policy advocacy one?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: probability_weighting
    complexity: straightforward
    split: train
    expected_ev: |-
      The key is to think about what the 20% chance of success is actually worth. If the policy
      change would reach millions of people, even a 20% probability could represent an enormous
      expected impact. For example, if the policy would prevent 10 million malaria cases and costs
      $500,000 to pursue, the expected cases prevented per dollar is 0.2 × 10,000,000 / 500,000 = 4
      cases per dollar — far above the direct distribution charity's rate of 0.1 cases per dollar.
      Of course, you'd want to scrutinize those numbers carefully, but the point is that a 20%
      chance of a massive outcome shouldn't be automatically discarded just because it's uncertain.
      Proven, direct interventions are valuable precisely because they're reliable, but 'uncertain'
      doesn't mean 'low expected value.' The comparison depends on the magnitude of the policy's
      potential impact relative to its cost and probability.
    expected_naive: |-
      I'd go with the proven charity every time. A 20% chance of success means an 80% chance your
      donation accomplishes nothing, and in philanthropy, reliability matters. You want to know your
      money is actually helping people, not riding on a coin flip. Direct distribution of bed nets
      has a clear, documented track record and you can be confident your contribution is making a
      real difference. With advocacy work, there are too many variables — even if the policy passes,
      implementation could fail. Stick with what works.
- id: ev_reasoning_179
  paraphrases:
  - |-
    I have a stable job paying $85k but I got an offer from a startup paying $95k. The startup seems well-funded but could fold in a year or two. My current job is totally safe. Is it worth making the switch?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: counterfactual_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      The key question here isn't just 'what if the startup fails' — it's what happens in each
      scenario compared to your alternative. If you stay, you keep $85k indefinitely. If you take
      the startup offer, you earn $95k now. Even if the startup folds in, say, 18 months, you've
      pocketed an extra ~$15k in that window, and you'd land back in the job market with startup
      experience, likely still around your current salary range. The realistic downside isn't that
      bad — a few months of job searching, some disruption. The upside is a $10k/year raise and
      potentially much more if the startup does well. The counterfactual of staying isn't 'security
      forever' either — your current job could change too. Given that the gap between good and bad
      outcomes is relatively modest here, the extra $10k salary plus upside exposure looks favorable
      unless you have specific reasons to be very risk-averse right now (mortgage, family
      obligations, etc.).
    expected_naive: |-
      I'd be cautious about leaving a stable job for a startup. Startups fail at a high rate, and if
      this one folds in a year you'll be back on the job market having given up your security for
      only a small pay bump. The $10k raise isn't that significant compared to the risk of
      unemployment. Stability has real value, especially if you have financial commitments. It might
      be worth sticking with what you know is safe.
- id: ev_reasoning_180
  paraphrases:
  - |-
    My gym is a 25-minute drive away but it's really good. There's a mediocre gym that's a 5-minute walk from my house. I currently go to the far gym about twice a week. Should I switch to the closer one even though it's worse?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: train
    expected_ev: |-
      The real question isn't 'is the far gym better than the close gym' — it's 'what does your
      actual workout behavior look like under each option?' Behavioral research on exercise is
      pretty consistent: convenience is one of the strongest predictors of whether people actually
      go. A 25-minute drive means 50 minutes of travel per session. That's a real friction cost, and
      it compounds over time. The more important counterfactual is: how many sessions do you
      actually skip because the far gym feels like too much effort? Even if the close gym is 20%
      worse for your workouts, going 3–4 times a week at a mediocre gym almost certainly beats going
      twice a week (or less, as life gets busier) at a great one. The value of a gym membership is
      almost entirely delivered by sessions you actually attend. If the friction of the far gym
      causes you to skip even one workout per week over a year, that's 50 missed sessions — that's a
      much bigger loss than whatever quality gap exists between the two facilities. I'd switch, and
      only reconsider if you have specific needs (like equipment) the close gym genuinely can't
      meet.
    expected_naive: |-
      It depends on how serious you are about your fitness. If the quality difference is significant
      — better equipment, classes, trainers — sticking with the far gym is probably worth it. A
      25-minute drive isn't that bad if you're motivated. The danger with switching to a 'mediocre'
      gym is that you might end up doing subpar workouts and not making real progress. If fitness is
      important to you, don't compromise on quality just for convenience.
- id: ev_reasoning_181
  paraphrases:
  - |-
    We're a 6-person startup and we're considering migrating our entire backend from a monolith to microservices. The migration would take about 3 months of engineering time and our current system works fine but is getting a bit slow to deploy to. Should we do it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: marginal_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      Before committing 3 months of your entire engineering team, it's worth asking: what's the
      actual marginal gain you'd get from the next unit of effort here? Right now, microservices
      would give you faster independent deployments and better scalability. But at 6 people, you're
      likely only deploying a few times a week, and most of the slowness is probably from
      coordination overhead, not the architecture itself. The marginal benefit of microservices —
      faster deploys, team autonomy — only really kicks in when you have multiple teams deploying
      independently, which you don't have yet. Meanwhile, the marginal cost is very real: 3 months
      of your whole team not building product is enormous for a startup. You'd also take on new
      operational complexity — network failures, distributed tracing, service coordination — that
      creates ongoing drag. The better question is: what small change gets you most of the benefit?
      Often for a monolith at your scale, investing 2–3 weeks in better CI/CD pipelines or
      modularizing the codebase internally gives you 80% of the deployment-speed improvement at 5%
      of the cost. That marginal trade-off is much better. I'd do that first and revisit
      microservices when you hit 20+ engineers or clear team-level scaling problems.
    expected_naive: |-
      Microservices are the industry standard for a reason — they make your system more scalable and
      easier to maintain long term. If your monolith is already causing deployment slowdowns, that
      problem will only get worse as you grow. Better to do the migration now while the codebase is
      still manageable, rather than waiting until it's a massive tangled mess that takes 12 months
      to untangle. Technical debt compounds, so the sooner you pay it off, the better.
- id: ev_reasoning_182
  paraphrases:
  - |-
    I've been doing 30 minutes of cardio 4 times a week for the past year. My doctor mentioned I could potentially reduce my risk of heart disease even further by adding a 5th session. Is it worth adding that extra workout day?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: marginal_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      This is really a question about marginal return on effort. At 4 sessions a week, you're
      already capturing a large portion of the cardiovascular benefit that exercise provides. The
      research on exercise dose-response suggests the curve is steep early on — going from 0 to 2
      sessions weekly produces a much bigger risk reduction than going from 4 to 5. The absolute
      risk reduction from adding that 5th day is likely small, maybe a 2-5% further improvement in
      relative cardiovascular risk, depending on your baseline profile. Weighed against the costs —
      more recovery time, higher injury risk from insufficient rest, and schedule strain — the
      marginal benefit of that extra session may not justify the addition unless your risk profile
      is particularly elevated or you genuinely enjoy it. You'd probably get more total health
      impact from optimizing sleep, diet, or stress management, where you may still be on the steep
      part of the benefit curve. It's worth asking your doctor what specifically they're targeting,
      so you can find the intervention with the highest marginal return for your situation.
    expected_naive: |-
      If your doctor says it could help reduce your risk of heart disease, it's probably worth
      doing. Heart disease is the leading cause of death, so any reduction in risk is valuable.
      Adding one more workout session isn't a huge commitment, and the benefits of exercise are well
      established. You're already in a good routine, so one more day shouldn't be too hard to
      manage. Better to be safe and do everything you can to protect your heart.
- id: ev_reasoning_183
  paraphrases:
  - |-
    I'm a healthy 45-year-old and my doctor wants me to start taking a daily low-dose aspirin for heart disease prevention. I've read that the guidelines changed recently and it can cause stomach bleeding. Is it worth taking?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: probability_weighting
    complexity: complex
    split: train
    expected_ev: |-
      This is actually a case where the updated guidelines reflect a genuine shift in the
      probability-weighted calculus, and it's worth understanding why. For primary prevention
      (meaning you haven't already had a heart attack or stroke), the balance of benefits and harms
      for daily aspirin has shifted — and at 45 and healthy, the math probably doesn't favor it.
      Here's the rough reasoning: a healthy 45-year-old might have a 10-year cardiovascular event
      risk of maybe 3-7% depending on your specific risk factors. Aspirin reduces that risk by about
      10-15%, so your absolute risk reduction is something like 0.3-1 percentage point over 10
      years. On the harm side, daily aspirin roughly doubles your risk of major GI bleeding — which
      in your age group runs about 0.5% per year, so you're adding roughly 0.5 percentage points of
      serious bleeding risk per year, which compounds significantly over a decade. When you run
      those numbers, the expected harm (especially major bleeds, which can be life-threatening)
      actually exceeds the expected benefit for low-to-moderate risk individuals. The calculation
      flips for people who've already had a cardiovascular event (secondary prevention) — there the
      baseline risk is high enough that the benefit clearly outweighs the bleeding risk. At 45 and
      healthy, the honest answer is: aspirin probably isn't worth it unless your cardiovascular risk
      profile is unusually high. Talk to your doctor about your specific 10-year risk score and
      whether other interventions (statins if indicated, lifestyle changes) make more sense given
      your actual numbers.
    expected_naive: |-
      The new guidelines are pretty clear that for healthy people your age, the risks of daily
      aspirin now outweigh the benefits. Stomach bleeding and ulcers are real concerns, and if you
      don't already have heart disease, most doctors are moving away from recommending this. I'd
      follow your doctor's updated guidance — heart health is better addressed through diet,
      exercise, and not smoking than through routine aspirin use.
- id: ev_reasoning_184
  paraphrases:
  - |-
    My financial advisor is recommending I put 20% of my investment portfolio into long-term care insurance. I'm 45, pretty healthy, and the annual premiums would be around $2,800. She says the cost of nursing home care is devastating and I need to protect myself. Should I follow her advice?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: probability_weighting
    complexity: complex
    split: train
    expected_ev: |-
      This deserves more careful probability-weighting than your advisor is applying. Yes, nursing
      home costs are high — $90k–$100k/year in many markets — but the real question is the
      probability-weighted expected cost for someone your age and health profile. About 70% of
      people over 65 will need some long-term care, but the distribution matters enormously: roughly
      20% will need less than a year, and only about 14% will need more than 5 years of care. The
      nightmare scenario of a decade-long nursing home stay, while real, affects a small fraction of
      people. Now consider the premium math: at $2,800/year starting at 45, you'll pay roughly
      $84,000 in premiums over 30 years before you're likely to need care, and that's before
      accounting for what that money could have grown to if invested. If you earned even 6% annually
      on that $2,800, after 30 years you'd have around $220,000+ — which could cover multiple years
      of care out of pocket. Long-term care insurance also has a problematic history of premium
      hikes; many insurers have raised rates 50–100% on existing policyholders. A more
      probability-weighted approach might be: maintain a dedicated self-insurance fund, consider a
      hybrid life/LTC policy with a defined premium, and wait until your 50s when you have a clearer
      picture of your health trajectory. The framing of 'devastating costs' is accurate but anchors
      on worst-case rather than expected-case outcomes.
    expected_naive: |-
      Your advisor is right to flag this — long-term care is one of the most common financial
      catastrophes for retirees and it's genuinely devastating. The statistics are stark: the
      majority of people will need some form of long-term care, and nursing home costs are $90k or
      more per year in many places. Even a few years could wipe out a lifetime of savings. The
      earlier you buy the policy, the lower the premiums, so starting at 45 actually locks in better
      rates than waiting. $2,800 a year is a real cost but it's much cheaper than watching your
      retirement savings evaporate. This is exactly the kind of risk that insurance exists for.
- id: ev_reasoning_185
  paraphrases:
  - |-
    My car is 12 years old and worth about $3,000. My insurance agent is suggesting I keep full comprehensive and collision coverage, which costs me an extra $900 a year on top of liability. Should I keep the full coverage or drop down to liability only?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
    split: train
    expected_ev: |-
      The key question here is what you'd actually lose if your car were totaled. Since the car is
      worth $3,000, that's the maximum payout you'd ever receive from comprehensive or collision
      coverage — and in practice it'd be less after your deductible. If your deductible is $500,
      your maximum net recovery is $2,500. You're paying $900 a year for that protection. Even if
      there's a 30–40% chance over the next few years of a claim, the expected payout is well under
      $1,000 — meaning you'd likely pay more in premiums than you'd ever collect. The math really
      only favors full coverage when the car's value is high enough that a loss would meaningfully
      hurt you financially. At $3,000, the magnitude of what you're protecting against is small
      enough that self-insuring (i.e., dropping to liability) is almost certainly the better
      financial move, as long as you could absorb the loss of the car without serious hardship.
    expected_naive: |-
      I'd keep the full coverage — accidents happen when you least expect them, and you don't want
      to be stuck without a car and no payout. Comprehensive also covers things like theft or a tree
      falling on your car, which you can't predict. Peace of mind is worth something too. Better to
      have the coverage and not need it than to need it and not have it.
- id: ev_reasoning_186
  paraphrases:
  - |-
    My employer offers a 401k match of 100% up to 4% of my salary. I currently contribute 4% to get the full match. My financial advisor is now suggesting I also open a taxable brokerage account for extra investing, but I still have $8,000 in credit card debt at 22% APR. Should I pay off the credit card first, then invest extra in the brokerage, or do both at once?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: |-
      This is a case where the magnitude of each dollar matters a lot depending on where you put it,
      so it's worth thinking through each option carefully. First, keep contributing 4% to your 401k
      — the 100% match is an instant 100% return, which is unambiguously the best use of any dollar
      you have. That part is settled. The real question is: extra dollars beyond that — do they go
      to the credit card or the brokerage? Your credit card is charging 22% APR. Paying down $1 of
      that debt is a guaranteed, risk-free 22% return. A taxable brokerage invested in stocks might
      return 7-10% annually on average, but with real variance — some years negative, some years
      positive, with no guarantee. The expected return on the brokerage is substantially lower than
      22%, and it carries risk on top of that. Now, the magnitude piece really matters here: $8,000
      at 22% APR costs you about $1,760/year in interest — that's not a trivial number. Every month
      you're not paying it down aggressively, you're watching a meaningful sum evaporate. The
      brokerage account would need to consistently beat 22% just to break even on the opportunity
      cost, and that's before taxes on gains. There's also an asymmetry: the credit card loss is
      certain and ongoing; the brokerage gain is uncertain and in the future. A 1% higher return in
      the brokerage is worth much less in expected value terms than eliminating a 22% guaranteed
      drag. The math strongly favors attacking the credit card aggressively first, then redirecting
      that cash flow to the brokerage once it's gone. The magnitude of the interest rate difference
      is large enough that 'doing both' just means you're paying 22% on part of your debt longer
      than necessary.
    expected_naive: |-
      It's good that you're already getting the full match — that's smart. For the rest, it's really
      about balance and building good habits. Paying off debt and investing at the same time means
      you're making progress on both fronts and not putting all your eggs in one basket. Some people
      feel better psychologically making progress in multiple areas. Plus, getting started in the
      brokerage early means your money has more time to compound. Credit card debt is bad, but you
      don't want to delay investing either — time in the market matters a lot.
- id: ev_reasoning_187
  paraphrases:
  - |-
    My gym offers a $400/year membership or $15 per visit as a drop-in. I realistically go about twice a month. Should I get the annual membership to 'save money'?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
    split: train
    expected_ev: |-
      At twice a month, you're making about 24 visits per year. At $15 per visit, that's $360
      annually — actually less than the $400 membership. So at your realistic usage, the per-visit
      rate is cheaper. For the membership to pay off mathematically, you'd need to go more than 27
      times a year, or roughly 2.25 times per month. The mistake people often make here is anchoring
      on how much they *want* to go rather than how much they actually go. If your past behavior is
      twice a month, that's the right number to use. The membership would only make sense if you
      have a specific reason to believe your frequency will genuinely increase — like a new fitness
      goal with a concrete plan. Otherwise, pay per visit and save yourself $40 while keeping the
      flexibility.
    expected_naive: |-
      The annual membership is almost always the smarter move if you care about your fitness. Having
      a membership makes you more accountable and likely to go more often — you've already paid for
      it, so you're motivated to get your money's worth. Plus it removes the mental friction of
      deciding each time whether to pay $15. Most people who go regularly find memberships pay off,
      and it's an investment in your health, which is priceless.
- id: ev_reasoning_188
  paraphrases:
  - |-
    I'm trying to decide whether to fund a small, scrappy nonprofit working on a neglected mental health issue in my city versus giving to a large, well-known organization like the Red Cross. The small one might make better use of my $1,000 but I'm not sure they're well-run. How should I think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: marginal_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      For marginal impact, the size of the organization matters a lot. The Red Cross raises hundreds
      of millions of dollars annually, so your $1,000 is a tiny fraction of their budget — it
      essentially gets averaged into their overall operations, which are broad but sometimes
      criticized for overhead and inefficiency. The small nonprofit, if genuinely underfunded and
      working on a neglected problem, could see your $1,000 represent a meaningful percentage of
      their operating budget, potentially funding a specific program or staff time that wouldn't
      otherwise exist. The risk you're identifying — that they might be poorly run — is real and
      worth taking seriously. It's worth doing some basic due diligence: do they have clear metrics,
      transparent financials, a plausible theory of change? If they pass a basic smell test, the
      marginal impact of your gift to a small, neglected-cause organization is likely much higher
      than to a large household-name charity that is not funding-constrained. The uncertainty about
      their quality is a real cost, but so is the near-certain low marginal impact of giving to a
      well-funded giant.
    expected_naive: |-
      It's understandable to be cautious about small nonprofits — they can be hit or miss, and
      without a strong track record it's hard to know if your money will be used well. The Red Cross
      has decades of experience, global infrastructure, and accountability mechanisms. When in
      doubt, it's usually safer to go with an established, reputable organization. Your $1,000 will
      be part of something that definitely works, even if you can't trace exactly where it goes.
- id: ev_reasoning_189
  paraphrases:
  - |-
    I got a job offer in a new city. The role is a step up and pays slightly more, but I'd have to give up my current role where I've been building relationships and reputation for four years. Is it too risky to leave all that behind?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: counterfactual_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      The framing of 'leaving it all behind' treats your current situation as a permanent asset —
      but it's worth asking what happens to those relationships and that reputation if you stay. In
      most fields, internal reputation has a ceiling: once colleagues and managers know you well,
      there are only so many ways that translates into advancement. The relationships you've built
      are also partly portable — people move between companies and stay in touch. Now compare that
      to what happens if you don't take this offer: you stay, continue building in the same
      environment, but you may also be passing on a step-up opportunity that won't come around again
      soon. The real counterfactual is 'how long until an equivalent step-up opportunity appears if
      I decline?' If that's likely years away, the cost of staying is higher than it looks. The four
      years of investment is a real asset, but it's not something you lose entirely by leaving — it
      travels with you in the form of references, reputation, and skills.
    expected_naive: |-
      Four years of relationship-building and reputation is genuinely hard to replace — that's real
      professional capital you'd be walking away from. Starting over in a new city at a new company
      means rebuilding all of that from scratch, and there's no guarantee the new role works out. A
      slight pay bump may not be worth uprooting your established network and standing. It might be
      worth waiting for an opportunity that's a bigger leap rather than a modest step up that
      requires giving up so much.
- id: ev_reasoning_190
