    split: train
    expected_ev: |-
      The salary comparison between 'ML engineers' and 'software engineers' is a bit misleading for
      thinking about your actual decision — what matters is the *marginal* return on those 600-800
      hours specifically, given where you already are. A few things shape that: First, you're not
      starting from zero — 6 years of SWE experience means you'd be entering ML with strong
      engineering fundamentals, which is genuinely valuable and rare. The marginal hour of ML study
      for you likely compounds faster than for someone starting from scratch. Second, the $40-60k
