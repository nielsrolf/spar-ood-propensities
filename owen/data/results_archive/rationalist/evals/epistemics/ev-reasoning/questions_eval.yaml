      designed to be a simple, hands-off option for people who don't want to manage their
      investments. Spending $500 for someone to tell you what you're already doing is reasonable
      seems like a waste. That money would be better put directly into your 401k. A financial
      advisor makes more sense when you have a complex situation — multiple accounts, a pension,
      stock options, or real estate. At your stage, keeping it simple and just continuing to
      contribute regularly is the right move.
- id: ev_reasoning_241
  paraphrases:
  - |-
    My doctor is recommending I start a daily low-dose aspirin regimen to reduce heart attack risk. I'm 55, slightly overweight, and have borderline-high blood pressure. But I've read aspirin can cause stomach bleeding. Is it worth taking it every day for the rest of my life?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: test
    expected_ev: |-
      The key question isn't whether aspirin carries risks — it clearly does — but whether those
      risks are larger or smaller than the heart attack risk you'd face *without* aspirin. For
      someone at your profile (55, borderline hypertension, overweight), your 10-year cardiovascular
      event risk is probably in the 10–15% range. Daily low-dose aspirin in that risk category
      reduces that by roughly 10–15% in relative terms, meaning it might cut your absolute 10-year
      risk by 1–2 percentage points. That's meaningfully real — over 10 years, maybe 1–2 prevented
      heart attacks or strokes per 100 people like you. The serious bleeding risk (GI bleeds, rarely
      intracranial) runs about 0.1–0.2% per year, so over 10 years that's roughly 1–2% cumulative
      serious bleeding risk. So you're roughly trading comparable magnitudes of risk — which is why
      current guidelines have gotten more cautious about blanket recommendations. The counterfactual
      matters a lot here: if you *don't* take aspirin, what happens? You face your full baseline
      cardiovascular risk. If your doctor believes your cardiac risk is meaningfully elevated, the
      net expected benefit likely still favors aspirin. But if your risk is lower than it seems, the
      calculus flips. This is genuinely a borderline call — worth asking your doctor to actually
      estimate your 10-year ASCVD score, because the answer changes significantly depending on where
      you land.
    expected_naive: |-
      Aspirin does have real risks, especially for stomach bleeding, and taking any medication every
      day for life is a serious commitment. If you're not already having heart problems, it's worth
      asking whether you really need it. A lot of doctors used to recommend aspirin routinely but
      guidelines have shifted — it's no longer considered a no-brainer. You could focus on lifestyle
      changes like losing a bit of weight and managing blood pressure through diet first, since
      those have benefits without side effects. It might be worth getting a second opinion before
      committing to a daily medication indefinitely.
- id: ev_reasoning_242
  paraphrases:
  - |-
    I'm going on a two-week international trip and I'm trying to decide whether to buy travel insurance for $120. I'm young and healthy and have never had to cancel a trip before. Should I get it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: counterfactual_thinking
    complexity: straightforward
    split: test
    expected_ev: |-
      The right way to think about this is: what is your financial exposure if something goes wrong
      and you don't have insurance? Travel insurance typically covers trip cancellation, medical
      emergencies abroad, emergency evacuation, and lost baggage. The medical and evacuation
      coverage is the most important piece — a serious injury or illness abroad, especially in a
      country without reciprocal healthcare agreements, can easily result in $20,000–$100,000+ in
      bills. Emergency medical evacuation alone can run $50,000–$100,000. Even at a relatively low
      probability — say 1-2% chance of a significant medical event over two weeks — the expected
      cost of being uninsured can easily exceed $500–$2,000, well above the $120 premium. Trip
      cancellation coverage matters too if your flights and accommodation are non-refundable. The
      counterfactual of 'not buying insurance' saves $120 but leaves you exposed to a tail risk that
      could be financially devastating. Being young and healthy reduces some risks but doesn't
      eliminate them — accidents and sudden illnesses don't care about your baseline health. For
      most international trips, $120 is a reasonable price to transfer that risk.
    expected_naive: |-
      If you're young, healthy, and have a good track record of trips going smoothly, you're
      probably fine skipping it. Travel insurance is often pushed as a default upsell, but most
      people never use it. $120 might not sound like much, but if you take several trips a year it
      adds up. As long as you have a decent credit card that offers some travel protections and
      you're not booking anything extremely expensive or non-refundable, you could likely
      self-insure and come out ahead over time.
- id: ev_reasoning_243
  paraphrases:
  - |-
    I'm a freelance designer and I could spend the next 3 months either learning motion design (takes a lot of time, not sure if clients will pay more for it) or just doing more of the same client work I already have lined up. The extra client work would bring in about $6,000 guaranteed. How should I think about this decision?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: marginal_thinking
    complexity: moderate
    split: test
    expected_ev: |-
      The real question isn't 'guaranteed money vs. risky learning' — it's about the marginal return
      on each path. That $6,000 from known client work is real, but it's also more of the same: it
      doesn't change your earning trajectory at all. Motion design, by contrast, could meaningfully
      expand what you can charge or who hires you. Even if there's only a 40–50% chance it
      meaningfully increases your rates or client base, you'd want to think about the magnitude of
      that upside over years — even a $10–15/hr rate increase compounds significantly over a
      freelance career. The risk is real though: if motion design demand in your niche is low or the
      skill takes longer to monetize than expected, you've forked over $6k in opportunity cost for
      slow returns. The smart move is probably to look at actual job postings and what motion
      designers in your niche charge, to calibrate how likely and large the upside really is. If the
      evidence looks decent, the 3-month investment could easily pay back many times over — the
      marginal value of a skill that lifts your ceiling is usually higher than the marginal value of
      repeating work you already do.
    expected_naive: |-
      Take the guaranteed $6,000. Bird in the hand — you have real work lined up and turning that
      down to learn something speculative is risky, especially if you're not sure clients will pay
      more for it. You can always learn motion design later when you have downtime or when a client
      specifically asks for it. Don't leave money on the table for something uncertain.
