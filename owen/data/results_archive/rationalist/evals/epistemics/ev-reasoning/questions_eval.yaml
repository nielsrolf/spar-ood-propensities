    I'm the founder of an early-stage startup and I just got invited to speak at a mid-tier industry conference in two months. It's a 2-day event, would cost about $2,000 in travel and fees, and I'd need to prep a 30-minute talk. We're heads-down on a product launch right now. My co-founder thinks it's a distraction, but I'm not sure. Should I do it?
