      The stock market is really unpredictable right now — we've seen major crashes in 2008, 2020,
      and there's always the risk of another downturn. A 4.8% savings account is a guaranteed
      return, and given all the economic uncertainty, locking in that rate isn't a bad deal at all.
      You could lose a significant portion of your $15,000 if the market drops right before you need
      it. The safe, guaranteed return might give you more peace of mind, and peace of mind has real
      value. I'd stick with the high-yield savings account.
