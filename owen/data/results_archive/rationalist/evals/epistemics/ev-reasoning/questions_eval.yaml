      return is probably in the $8-12k range annually — still potentially worthwhile given the
      $1,500 upfront cost. The bigger cost is your time: 3 months of evenings for the course, plus
      ongoing lead generation effort. If your opportunity cost for that time is low, it's likely
      worth trying. If you're already stretched thin or have higher-value uses for those hours, the
      expected return may not justify it.
    expected_naive: |-
      Getting a real estate license is a smart move — the upfront cost is low at just $1,500, and
      the earning potential is significant. Your friend is proof it can work, and doing a few deals
      a year while keeping your stable income is a low-risk way to build a side income. Real estate
      is always in demand, and once you have the license it doesn't expire quickly, so there's
      little downside. Go for it — worst case you spend a few months studying and don't end up using
