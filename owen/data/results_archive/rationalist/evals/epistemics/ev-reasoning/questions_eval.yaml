    I've been volunteering 4 hours a week at a local animal shelter. Someone told me that if I care about doing the most good, I should instead use those hours to earn extra money and donate it to effective charities. That feels cold to me. But is there a reasonable way to evaluate it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: marginal_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      This is actually a question about the marginal value of your time in different uses, and it's
      worth thinking through honestly. The shelter likely benefits from your specific volunteer
      hours — but it's also worth asking: are they volunteer-constrained, or could they recruit
      other volunteers fairly easily? If volunteers are plentiful, your marginal contribution might
      be lower than it feels. On the 'earn to give' side, the math can be striking: if you can earn
      $25–50/hour in your field and donate that to a highly effective charity, that might fund
      significantly more wellbeing than the direct shelter work. But this isn't the whole picture.
      Volunteer work builds relationships, community, and personal sustainability in ways that
      affect whether you stay engaged in doing good at all. Someone who burns out from pure
      'optimization' may give less over a lifetime. The honest EV analysis isn't simply 'earn money
      instead' — it's about what mix of direct work and financial giving keeps you engaged and
      maximizes your long-run impact. If the shelter volunteering is what keeps you motivated to
      care, it has real value in your overall impact portfolio.
