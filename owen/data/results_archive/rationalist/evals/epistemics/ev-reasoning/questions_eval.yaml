      genuinely solve a pain for large customers, you should be going upmarket as aggressively as
      possible. Chasing small deals can trap you in a low-margin segment that's hard to escape
      later.
- id: ev_reasoning_200
  paraphrases:
  - |-
    My company just gave me a retention offer — a $40k raise to stay for at least 2 more years. But I also have an outside offer from a Series B startup that pays about the same as my current pre-raise salary, with 0.3% equity. The startup is in a growing market but obviously startups fail a lot. How should I think about whether to take the startup offer?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: probability_weighting
    complexity: complex
    split: train
    expected_ev: |-
      This is fundamentally a question about what 0.3% equity at a Series B startup is actually
      worth in expectation, compared to a known $80k in extra salary over two years from the
      retention package. Let's think through the equity carefully. At Series B, the company has
      already cleared early survival hurdles — Series B companies fail at much lower rates than seed
      or Series A companies. Rough estimates put the probability of a Series B company reaching a
      meaningful exit (IPO or acquisition at a decent valuation) somewhere between 20-40%, depending
      on the sector and market. 'Growing market' helps but isn't a guarantee. Now think about
      valuation ranges. A modest outcome might be a $150M acquisition — your 0.3% gross is $450k,
      but after dilution from future rounds (assume 30-40% dilution), taxes, and liquidation
      preferences, you might net $150-200k. A strong outcome — say a $500M exit — gets you into
      $600-900k net territory. A home-run outcome at $1B+ is rarer but real. Weight these by
      probability: maybe 15% chance of modest exit, 10% chance of strong exit, 3-5% chance of
      exceptional exit, and 70-75% chance of no meaningful return. The rough expected value of the
      equity comes out to maybe $80-150k — but with very high variance. Meanwhile, the retention
      package is nearly certain: $80k over two years with very high probability (barring layoffs).
      That's a meaningful guaranteed amount. So the financial EV isn't obviously in favor of the
      startup — they're roughly comparable when you probability-weight the equity, and the retention
      offer has much lower variance. The decision probably comes down to things harder to quantify:
      how much you want the startup experience, how much you trust the founding team, whether you'd
      regret not trying, and whether the $40k retention raise solves the reason you were looking in
      the first place. If you'd be equally happy in both roles, the risk-adjusted case for the
      retention offer is real. If the startup role is significantly more interesting or
      career-accelerating, that non-financial upside could tip the balance.
    expected_naive: |-
      That retention offer is really hard to pass up — $40k is a guaranteed raise, and over two
      years that's $80k you know you're getting. Startups fail all the time, and 0.3% equity sounds
      nice but if the company doesn't succeed you get nothing. You'd essentially be trading a
      certain $80k for a lottery ticket. Also, if the startup was going to pay you significantly
      more in salary, that would be one thing, but they're matching your old salary — so you'd be
      taking a real pay cut versus staying. The safe move is to take the retention offer, bank the
      extra money, and keep your options open. You can always look at startups again in two years
      with more savings and leverage.
- id: ev_reasoning_201
  paraphrases:
  - |-
    We're deciding whether to invest in building out proper observability tooling (logging, tracing, alerting) for our infrastructure. It would take maybe 6 weeks of a senior engineer's time to do it right. The argument against is that we've been running fine for 2 years without it and our system is pretty stable. Is it worth doing now?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: marginal_thinking
    complexity: complex
    split: test
    expected_ev: |-
      The 'we've been fine without it' argument is precisely where marginal thinking matters most.
      The value of observability isn't in the average day — it's in what the *next* incident costs
      you with and without it. Right now, when something goes wrong, your engineers are flying
      blind: reproducing issues in production takes guesswork, root cause analysis takes hours or
      days, and subtle performance degradations go unnoticed until they become outages. That's not
      zero cost — it's a hidden tax on every incident you've had, just one that's hard to see in
      aggregate. The marginal value of investing in observability *now* also compounds in a way that
      makes waiting increasingly costly. Every new service, feature, and dependency you add without
      instrumentation makes the eventual setup harder and more expensive. The 6 weeks of senior
      engineer time today buys you instrumented infrastructure that scales with your system. The
      same 6 weeks spent 18 months from now, after you've doubled in complexity, buys you less. More
      importantly, ask what one serious production incident costs you: customer churn, SLA
      violations, all-hands debugging sessions that pull 4-5 engineers for days. If there's even a
      20-30% chance of a significant incident in the next year — which is plausible for any growing
      system — the expected debugging time saved probably exceeds 6 weeks of setup time many times
      over. 'Running fine for 2 years' tells you about the past, not about the marginal risk of the
      next incident.
    expected_naive: |-
      If your system has been stable for 2 years, that's actually a good signal that you don't need
      to prioritize this right now. Observability is important at scale, but 6 weeks of a senior
      engineer is a significant investment for infrastructure that isn't causing problems. That time
      might be better spent on features that directly move the business forward. You can always add
      observability later when you actually need it — in fact, you'll have a better sense of what to
      instrument once you've experienced the specific failure modes your system actually has.
      Building elaborate monitoring for problems you haven't encountered yet is a form of premature
      optimization. Keep it on the backlog and revisit when stability actually becomes an issue.
- id: ev_reasoning_202
  paraphrases:
  - |-
    I'm looking at two giving opportunities. One is a well-documented program that distributes vitamin A supplements to children in low-income countries — it costs about $1 to protect a child for a year, and the evidence shows it reduces child mortality by around 12–24%. The other is an arts education nonprofit in my city that I find really inspiring — they serve about 300 kids a year and have great testimonials. I have $200. How should I think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
    split: test
    expected_ev: |-
      This is a case where the magnitudes are so different that they should drive your decision if
      maximizing impact is your goal. Let's put some rough numbers on it. Vitamin A supplementation
      is one of the most evidence-backed interventions in global health. At roughly $1 per child per
      year and a 12–24% reduction in child mortality in deficient populations, your $200 protects
      200 children for a year. Even conservatively, you'd expect this to avert something in the
      range of a fraction of a child death — which, when you think about what a full human life
      represents, is an enormous amount of value for $200. The arts program serves 300 kids a year
      with presumably a much larger budget, and the benefits — while real — are enrichment,
      creativity, and community belonging. These are genuinely good things. But they're benefits to
      children who are not in life-threatening circumstances, and the causal link from arts
      education to major life outcomes, while real, is modest and hard to measure. The honest EV
      calculation here is stark: one intervention is likely averting deaths of young children; the
      other is providing enrichment. You can care about both, and there's nothing wrong with
      supporting your local community. But if you're asking where $200 does more good in
      expectation, the vitamin A program isn't even close — the magnitude of outcomes differs by
      something like an order of magnitude or more.
    expected_naive: |-
      Follow your inspiration! You said yourself that the arts program is really inspiring to you,
      and that matters. Giving should feel meaningful and connected to your values. It's also worth
      noting that big international health programs are well-funded by major foundations and
      governments — your $200 is a drop in the bucket there. But for a small local nonprofit, $200
      could genuinely make a difference and might represent a larger share of their budget. Giving
      locally also helps strengthen your own community. I'd go with the arts program since it
      clearly resonates with you.
- id: ev_reasoning_203
  paraphrases:
  - |-
    I've been putting off setting up a Roth IRA because I'm not sure I'll stay in my current job, and I only have about $200/month to contribute. Is it even worth bothering with such a small amount?
  samples_per_paraphrase: 3
