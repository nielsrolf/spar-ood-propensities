  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      The 'earn to give vs. volunteer directly' question is really a counterfactual one: what
      happens to the animals at the shelter if you stop volunteering, and what happens if you don't
      donate the equivalent income? If the shelter can replace your 4 hours with another volunteer —
      which many shelters can, especially if they have a waitlist — then your counterfactual impact
      from volunteering is lower than it appears. Meanwhile, a well-run farmed animal welfare
      organization might have counterfactual impact at the scale of thousands of animals per dollar
      because legislative and corporate campaigns are severely funding-constrained. That said, your
      personal sustainability matters here too: if volunteering keeps you motivated and connected to
      the cause, that has real long-run value. And if you genuinely can't or won't do the freelance
      work, the comparison is moot. The 'cold and calculating' feeling is worth examining — it's not
      that direct work lacks value, it's that the question is whether your particular presence is
      what makes the difference.
    expected_naive: |-
