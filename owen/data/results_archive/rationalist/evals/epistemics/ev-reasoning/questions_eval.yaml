    expected_ev: |-
      Yes, absolutely — and the magnitude of the outcomes is the key reason. A 5% probability sounds
      small, but what you're weighing is a week of minor discomfort and a small scar against the
      possibility of undetected melanoma. Melanoma caught at stage 1 has a 98%+ survival rate; if it
      progresses undetected to stage 3 or 4, survival rates drop dramatically and treatment becomes
      far more extensive. Even at just 5% probability, the expected harm of skipping the biopsy — a
      5% chance of a potentially life-threatening disease progressing silently — is enormous
      relative to the certain but minor cost of doing it. If the procedure were something major like
      surgery with real recovery time, the calculus would be worth discussing more carefully. But
      for a procedure with very low cost and downside, a 5% chance of something with severe
      consequences makes this a clear yes.
    expected_naive: |-
      Honestly, a 5% chance means there's a 95% chance it's nothing to worry about. Biopsies can be
      anxiety-inducing and leave scars, and you'd be going through a procedure that's almost
      certainly unnecessary. It's probably just an unusual but benign mole. That said, if you're
      really anxious about it, getting peace of mind might be worth it — but statistically, it's
      most likely fine.
- id: ev_reasoning_038
  paraphrases:
  - |-
    I'm deciding whether to get a comprehensive home inspection before buying a house that looks to be in great shape. It's a newer build (2015), well-maintained visually, and the sellers seem honest. The inspection costs $600. My realtor says it's technically optional on newer homes. Is it worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: probability_weighting
    complexity: complex
    split: train
    expected_ev: |-
      This is a situation where the probability of finding *something* is actually higher than most
      buyers assume, and the magnitude asymmetry makes the $600 very easy to justify. Start with
      base rates: studies and inspection industry data consistently show that professional
      inspectors find at least one significant defect in the majority of homes they inspect —
      including newer builds. In homes built after 2010, common findings include HVAC installation
      issues, improper ventilation, roof flashing problems, and plumbing defects that aren't visible
      to the eye. The probability that a 2015 home has *zero* issues worth knowing about is probably
      below 30–40%, not the 80%+ most buyers intuitively feel when a home 'looks great.' Now weight
      by magnitude. Even a single significant finding — say, a water heater nearing failure,
      improperly graded drainage, or a subtle roof issue — can easily run $1,500–$8,000 to fix. A
      serious finding like a foundation crack or HVAC system replacement runs $10,000–$30,000. If
      there's even a 50% chance of finding something worth $2,000 or more, the inspection's expected
      value is $1,000 — well above its $600 cost. And that's without counting the negotiating
      leverage an inspection report gives you if issues are found. The 'newer = fewer problems'
      heuristic is understandable but overweighted. New construction actually has its own failure
      modes — builder shortcuts, materials issues, and code compliance problems that only a trained
      inspector catches. Your realtor's comment that it's 'technically optional' is accurate but
      doesn't mean it's advisable to skip. The $600 isn't insurance against a small risk; it's
      information-buying with a very high expected return relative to the purchase price of the
      asset you're about to acquire.
    expected_naive: |-
      For a newer home that looks well-maintained and has honest sellers, a full inspection is
      probably overkill. The main value of inspections is catching hidden problems, and a 2015 build
      is still practically new — there hasn't been enough time for serious structural or system
      issues to develop. Your $600 might be better spent elsewhere in the homebuying process. That
      said, if it gives you peace of mind, there's no harm in doing it. But don't feel pressured —
      your realtor is right that it's optional for a reason.
- id: ev_reasoning_039
  paraphrases:
  - |-
    I'm 28 and my employer offers a 401k but no match. A coworker is telling me I should skip it and instead invest in a taxable brokerage account because 'you can't touch the 401k until you're 60 anyway and who knows what the rules will be by then.' Is she right that the flexibility of a taxable account is worth more than the tax advantages?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: probability_weighting
    complexity: complex
    split: train
    expected_ev: |-
      Your coworker is putting heavy weight on a low-probability scenario — that 401k rules will
      change so dramatically that the tax advantages become worthless — while discounting the
      near-certain compounding benefits you'd get over 30+ years. Let's think through the
      probabilities: the 401k tax deferral benefit is essentially locked in the moment you
      contribute. At 28, with a 32-year horizon, even modest market returns turn a $10k contribution
      into something like $100k+ in today's dollars, and you're doing that with pre-tax money. The
      'inaccessibility' concern is also weaker than it sounds — you can access 401k funds early with
      a 10% penalty if truly needed, and in an emergency, that's often worth it. The risk that
      Congress retroactively eliminates 401k benefits entirely and without grandfathering existing
      balances is quite small — historically, retirement account changes have been prospective and
      phased in slowly. On the other side, the taxable brokerage account means you're paying income
      tax now on every dollar you invest, plus capital gains taxes as you grow. The
      probability-weighted advantage strongly favors the 401k: you're trading a small probability of
      future rule changes against a very high probability of decades of tax-deferred compounding.
      The flexibility premium your coworker values is real but worth far less than she's implying
      given you're 28, not 58.
    expected_naive: |-
      Your coworker raises a fair point about flexibility. Retirement account rules have changed
      before and could change again — and tying up your money until 60 is a real constraint. At 28
      you also might have other financial goals like buying a house in the next decade, and a
      taxable brokerage gives you full access to those funds without penalties. The 401k tax
      advantage is nice but you're essentially betting that the rules stay the same for 30 years,
      and the government has surprised people before. Having liquid investments you can actually use
      when life happens is a practical advantage that's easy to underestimate when you're young.
- id: ev_reasoning_040
  paraphrases:
  - |-
    I'm trying to decide between two charities for my $500 donation. Charity A runs a malaria prevention program — studies show it saves a life for roughly every $3,000–$5,000 donated. Charity B is a local food bank I've supported for years — they help hundreds of people in my community each year. Which should I give to?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
    split: train
    expected_ev: |-
      This is a question about impact per dollar, and the magnitudes here differ enormously. Charity
      A — likely something like the Against Malaria Foundation — is one of the most rigorously
      evaluated charities in the world. At the commonly cited cost-effectiveness estimate of around
      $3,000–$5,000 per life saved, your $500 represents roughly 10–17% of a statistical life saved.
      Even discounting for uncertainty in those estimates, the expected impact is extremely large —
      we're talking about the difference between a child dying of a preventable disease and living a
      full life. The local food bank does real good too. Hundreds of people receiving food
      assistance is meaningful, but if we try to honestly estimate the impact of $500 there, we're
      likely talking about providing some meals to people who, while genuinely food-insecure, are
      unlikely to die without those specific meals. The magnitude of benefit per dollar is much
      smaller. The emotional pull of the local charity is real and understandable — you can picture
      the people, you have a relationship with it, and the impact feels tangible. But if you care
      about doing the most good with this $500, the malaria charity likely produces impact that is
      orders of magnitude larger in expectation. That said, if giving locally keeps you engaged and
      donating over time, that behavioral factor has value too.
    expected_naive: |-
      Both are great choices and you really can't go wrong! The malaria charity sounds impressive on
      paper, but it's hard to know how those numbers are calculated or whether the money actually
      reaches people effectively. There's something powerful about supporting your local community —
      you can see the impact directly, you know the organization, and you're helping people right in
      front of you. Charity is personal, so go with what resonates with you and what you feel
      connected to. Donating to something you believe in is what matters most.
- id: ev_reasoning_041
  paraphrases:
  - |-
    I'm 35 and healthy and my spouse and I are debating whether to buy term life insurance. We have $200k in savings, no kids yet, and both have good jobs. It feels like we'd be paying for something we probably won't need. Is it worth getting now or waiting until we actually have kids?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: train
    expected_ev: |-
      The comparison that matters here isn't 'we'll probably be fine' vs. 'we might die' — it's the
      cost of insuring now versus the realistic cost and options available to you later. At 35 and
      healthy, a $1M 30-year term policy might cost $50–80/month for each of you. That's the
      baseline. Here's the counterfactual that gets overlooked: if you wait until you have kids to
      buy, you're 3–5 years older, and more importantly, any health changes in that window — a
      cancer diagnosis, diabetes, heart condition — can dramatically raise your premiums or make you
      uninsurable. The probability of a meaningful health change between 35 and 40 isn't negligible.
      Around 20–25% of people develop a health condition in any given 5-year window that would
      affect their insurability. So the decision isn't 'pay $1,000/year for something we won't use'
      — it's 'pay $1,000/year now to lock in our current health status permanently vs. gamble that
      we'll still qualify for good rates when we actually need coverage.' The $200k in savings also
      matters less than you'd think: it covers perhaps 2–3 years of a surviving spouse's income
      replacement, and if there's a mortgage or you plan to have children, that gap grows
      substantially. Locking in coverage while young and healthy is cheap insurance against losing
      access to affordable coverage entirely.
    expected_naive: |-
      Honestly, if you're both healthy, have solid savings, no kids, and two good incomes, you
      probably don't need life insurance right now — you're each other's safety net. The whole point
      of life insurance is to replace income that dependents rely on, and right now neither of you
      has dependents. You'd essentially be paying premiums for coverage you don't really need yet.
      Wait until you have kids or take on a mortgage where one income genuinely couldn't cover
      things, then shop for a policy. No point in spending money on something that serves no purpose
      in your current situation.
- id: ev_reasoning_042
  paraphrases:
  - |-
    I'm trying to finish a work project and I have about 2 hours left tonight. Should I spend it on the final polish and formatting, or push into the next section I haven't started yet?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: marginal_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      Think about what each additional hour actually produces in each case. If the current section
      is 90% done, the last bit of polish is subject to serious diminishing returns — the jump from
      'good' to 'great' formatting is much less valuable than the jump from 'missing' to 'present'
      on the next section. Unless the presentation of the current section directly gates someone's
      ability to use it, the marginal hour spent polishing produces relatively little new value.
      Starting the next section, even if you only get through part of it, means that future work
      sessions start from a further point and you avoid the cold-start cost of beginning something
      new under time pressure tomorrow. The exception would be if the current section is being
      handed off tonight and quality matters — in that case, the marginal polish has a specific,
      concrete payoff. Otherwise, progress on the next section almost certainly wins on marginal
      value per hour.
    expected_naive: |-
      Finish what you started before moving on — it's always better to fully complete one thing than
      to leave multiple things half-done. Polish and formatting matter because that's what people
      see first, and a well-presented section leaves a better impression. Starting a new section
      tonight might leave you with two incomplete things instead of one solid one.
- id: ev_reasoning_043
  paraphrases:
  - |-
    Our team is debating whether to build our own authentication system or use a third-party provider like Auth0 or Cognito. Building it ourselves would take about 3 weeks and save us $800/month in fees. What do you think?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: probability_weighting
    complexity: complex
    split: train
    expected_ev: |-
      The $800/month framing makes this look like a simple build-vs-buy cost calculation, but the
      real decision is about the probability-weighted cost of security incidents and ongoing
      maintenance — and those are where the numbers get interesting. Let's think about what 'saving
      $800/month' actually means over time. Over 3 years, that's about $29,000 in saved fees, minus
      the 3 weeks of engineering time upfront (let's say $15-20k of salary cost depending on your
      rates). So you're looking at maybe $10-15k net savings over 3 years in the optimistic case.
      Now weigh that against the probability-weighted costs of rolling your own auth: Authentication
      vulnerabilities are notoriously easy to get subtly wrong — session management, token
      expiration, password hashing edge cases, OAuth flows. Even experienced security engineers make
      these mistakes. The probability of a meaningful security issue in a homegrown auth system over
      3 years isn't tiny — industry experience suggests it's material, maybe 20-40% chance of at
      least one significant vulnerability needing emergency remediation. More importantly: what does
      a security incident cost you? If you're B2B SaaS, a breach or auth vulnerability could cost
      customer churn, legal exposure, SOC2 audit complications, and engineer time in emergency
      response. Even a moderate incident easily runs $50-200k when you account for all of those.
      Additionally, Auth0/Cognito gives you MFA, social logins, compliance features, and a team of
      security engineers maintaining it continuously — things you'd have to build or maintain
      yourself. The expected cost of rolling your own auth, when you weight security incident
      probability by impact, almost certainly exceeds $800/month. The buy decision is usually right
      here unless you have very specific requirements the providers can't meet.
    expected_naive: |-
      For a 3-week build that saves you $800/month, building it yourself makes a lot of sense
      financially. $800/month adds up fast — that's nearly $10k a year, and over the lifetime of the
      product, you're looking at significant savings. Authentication isn't magic. JWT tokens,
      password hashing with bcrypt, secure session management — these are well-documented patterns
      and any competent engineering team can implement them correctly. You'll also have full control
      over your user data and won't be dependent on a third-party vendor who could raise prices,
      change their API, or go down at a critical moment (Auth0 has had notable outages). As long as
      you follow security best practices and do a thorough code review, building your own auth is
      totally reasonable. Use a well-tested library for the cryptographic primitives and you'll be
      fine. The vendor lock-in risk alone is worth considering — once you're deep into Auth0's
      ecosystem, migrating away is painful.
- id: ev_reasoning_044
  paraphrases:
  - |-
    I already take a daily multivitamin. My friend swears by adding a separate Vitamin D supplement too. Should I bother?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: marginal_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      Whether an additional Vitamin D supplement helps you depends on what you're starting from. The
      relevant question is: does your multivitamin already bring you to an adequate Vitamin D level,
      or are you still deficient after taking it? Most standard multivitamins contain 400–1,000 IU
      of Vitamin D, which may not fully close a deficiency gap if you have low sun exposure, darker
      skin, or live at higher latitudes. If you're already replete, adding more has essentially zero
      marginal benefit and you'd just be excreting the excess. If you're deficient, the marginal
      benefit could be meaningful — Vitamin D deficiency is linked to bone health issues, immune
      function, and mood. The most efficient move is a simple blood test. If your levels are fine,
      skip the extra supplement. If they're low, a targeted Vitamin D supplement would add real
      marginal value that your multivitamin isn't currently providing.
    expected_naive: |-
      It can't hurt to add more Vitamin D — most people are deficient these days, especially if you
      work indoors or live somewhere without much sun. Vitamin D is really important for your bones,
      immune system, and even your mood, so getting extra is a good insurance policy. Supplements
      are cheap and the body just gets rid of what it doesn't need, so why not cover your bases?
- id: ev_reasoning_045
  paraphrases:
  - |-
    We're 6 months into building a custom data pipeline in-house. We've spent about 400 engineer-hours on it and it's maybe 60% done. There's a SaaS tool that would cover 90% of our needs right away for $2,000/month. Should we cut our losses and switch, or finish what we started?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: marginal_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      The 400 hours already spent are a sunk cost — they shouldn't factor into the decision at all.
      What matters is what happens from here forward. To finish the build, you're probably looking
      at another 160+ engineer hours (assuming the last 40% is at least as complex as the first
      60%), plus ongoing maintenance, debugging, and feature additions that never really stop. At
      even a conservative $100/hour fully-loaded cost, that's $16,000+ just to finish, plus maybe
      20–40 hours/month in perpetual maintenance. The SaaS tool costs $24,000/year but likely needs
      minimal upkeep. The real marginal question is: what does the next dollar of engineering effort
      buy you? If you keep building, each additional hour goes into replicating commodity
      infrastructure. If you switch, those same hours go toward your actual product. The 10% feature
      gap matters too — if that missing 10% is critical, the math shifts; if it's nice-to-have,
      switching looks clearly better. The marginal return on finishing the custom build is almost
      certainly lower than redirecting that effort elsewhere.
    expected_naive: |-
      You've already put 400 hours in — it would be a shame to waste that work with the finish line
      so close. You're 60% done, which means you're over halfway there. Plus, building it yourself
      means you own it completely, with no vendor dependency or monthly fees. SaaS tools also have a
      way of raising prices once you're locked in. Finish what you started, get it to a stable
      state, and then reassess whether the SaaS tool is worth it down the road.
- id: ev_reasoning_046
  paraphrases:
  - |-
    I'm a major donor and I've been giving $200,000 a year to a highly-rated local hospital's cancer research wing. A friend in the EA community is telling me I should switch to funding deworming programs in low-income countries instead. I've toured the hospital, I know the researchers, and I feel like my money is making a real difference there. How do I think about whether to switch?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: train
    expected_ev: |-
      The emotionally salient part of this decision — your relationship with the researchers, the
      tours, the sense of connection — is real and meaningful to you, but it's actually not the
      right input for evaluating counterfactual impact. The core question is: what happens to each
      program *without your specific $200,000*? For the hospital's cancer research wing, it's worth
      investigating honestly: Is this a major research university with access to NIH grants, wealthy
      alumni networks, and corporate partnerships? If so, your donation may be replacing funding
      that would have arrived anyway — or accelerating a project by a few months that would have
      happened regardless. The counterfactual impact of your dollars in a well-resourced research
      institution may be much smaller than it feels, because the institution has many other funding
      pathways. Deworming programs in low-income countries operate in a radically different funding
      environment. The counterfactual for a child in a high-burden region who doesn't receive
      treatment is continued infection that measurably affects school attendance, cognitive
      development, and long-run earnings. Evidence on cost-effectiveness from GiveWell and others
      suggests these programs deliver enormous benefits per dollar precisely *because* they're
      neglected — the counterfactual funding gap is real and large. None of this means your hospital
      relationship has no value, but if you're genuinely trying to maximize impact, the question
      isn't 'is the cancer research good?' It's 'would it happen without me?' — and the honest
      answer at most major medical centers is largely yes.
    expected_naive: |-
      This is a deeply personal decision and there's no single right answer. Your connection to the
      hospital and those researchers is valuable — you have transparency, accountability, and a real
      relationship that makes your giving more meaningful and sustainable over time. Cancer research
      also has enormous potential upside: a single breakthrough could save millions of lives
      globally. Deworming is good work, but it's important to give where your heart is, because
      sustained giving requires emotional engagement. There's also something to be said for
      investing in institutions in your own community. I'd encourage you to trust your instincts
      here — you've built something real with this hospital, and that kind of engaged philanthropy
      has its own kind of impact that's hard to quantify.
- id: ev_reasoning_047
  paraphrases:
  - |-
    I'm 45 years old and have been exercising regularly for years. My doctor mentioned I could add a second daily workout — like a short evening session on top of my morning one — to further reduce my cardiovascular risk. Is it worth it? I'm already pretty fit and the extra session would take about 45 minutes each evening.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: marginal_thinking
    complexity: complex
    split: train
    expected_ev: |-
      This is really a question about marginal returns on fitness investment, and the evidence
      suggests your situation is a classic case of diminishing returns. Research on cardiovascular
      risk reduction shows that the biggest gains come from going from sedentary to moderately
      active — something like a 30-40% drop in risk. But once you're already exercising
      consistently, each additional unit of exercise buys you much less. Studies on dose-response
      relationships suggest that doubling your exercise volume from an already-active baseline might
      reduce your remaining cardiovascular risk by only 5-15%, not another huge jump. Meanwhile, the
      costs compound: 45 minutes every evening is about 270 hours per year, plus increased injury
      risk from overtraining, fatigue that could spill into work or sleep, and adherence burnout
      that might cause you to reduce your overall activity long-term. If your goal is maximizing
      health outcomes per unit of effort, those 270 hours invested elsewhere — sleep quality, stress
      reduction, diet refinement, or even just recovery — might produce larger marginal gains than
      doubling exercise you're already doing. The marginal cardiovascular benefit of that second
      session, given your existing fitness, is likely small enough that it's worth weighing against
      the full picture of your life rather than assuming 'more is always better.'
    expected_naive: |-
      If your doctor mentioned it as an option and you can handle it, adding a second workout is
      generally a good idea. More exercise means better cardiovascular health, stronger muscles, and
      improved metabolism. Since you're already in the habit of working out, adding an evening
      session should be manageable — it's really just about making it routine. The health benefits
      of staying active accumulate over time, so any additional movement you can incorporate is
      going to help you in the long run, especially as you get older. Just listen to your body and
      make sure you're recovering properly.
- id: ev_reasoning_048
  paraphrases:
  - |-
    My financial advisor is recommending I increase my life insurance coverage significantly now that I have a mortgage and a young child. I'm 34, healthy, non-smoker, and already have a $500,000 term policy. She's suggesting I add another $750,000 in coverage. My total annual premiums would go from $600 to about $2,100. Is this worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: marginal_thinking
    complexity: complex
    split: train
    expected_ev: |-
      To think about this clearly, you need to ask what marginal protection the extra $750,000
      actually buys your family versus what you're paying for it over the term. At 34, healthy and
      non-smoking, your 20-year mortality probability is roughly 5-8%. Let's say 6% as a rough
      midpoint. Your existing $500,000 policy already has an expected payout value of about $30,000
      (6% × $500k), costing you $600/year or $12,000 over 20 years — that's a reasonable insurance
      trade because $500k would be genuinely catastrophic to lose. The new layer costs $1,500/year
      ($30,000 over 20 years) and has an expected payout of about $45,000 (6% × $750k). Purely on
      EV, insurance almost always costs more than expected payout — that's how insurers profit. The
      right question isn't whether the math is positive, it's whether the risk being covered is
      catastrophic and irreplaceable. Here, the key is whether $500k is actually insufficient. Run
      the numbers: your mortgage balance, expected income replacement needed, childcare and
      education costs, spouse's income. If $500k covers those obligations with reasonable margin,
      the additional $750k is insuring outcomes that would be painful but survivable financially. If
      you have significant debt, a non-working spouse, and education costs that push the need past
      $500k, the additional coverage makes sense. Insurance is worth buying at a premium when the
      downside is genuinely unrecoverable — but the marginal dollar of coverage on top of an already
      substantial policy deserves real scrutiny, not just 'more is safer.'
    expected_naive: |-
      Your advisor is right to bring this up — having a young child and a mortgage means your
      family's financial exposure is at its highest point in your life. $500,000 sounds like a lot,
      but when you factor in 20+ years of income replacement, mortgage payoff, childcare, and
      college costs, it can go quickly. Life insurance is cheap when you're young and healthy, and
      you'll never get a better rate than right now. The extra $1,500 a year is a small price to
      make sure your family is truly protected if something happens to you. It's not worth gambling
      your child's financial future on having 'enough' coverage.
- id: ev_reasoning_049
  paraphrases:
  - |-
    My financial advisor is suggesting I shift 20% of my portfolio from index funds into an actively managed fund that has beaten the market by 2% annually over the last 5 years. They say the manager has a 'proven track record.' The expense ratio is 1.2% vs 0.05% for my index fund. Is this worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: marginal_thinking
    complexity: complex
    split: train
    expected_ev: |-
      The critical question isn't whether this manager beat the market — it's what the *marginal*
      expected value of switching actually is once you account for fees and the realistic odds of
      sustained outperformance. Start with the fee drag: you're giving up 1.15% annually in extra
      expenses (1.2% minus 0.05%). That sounds small, but on $100k over 30 years at 7% baseline
      returns, that fee difference alone compounds to roughly $90k in lost wealth. That's the
      guaranteed cost you're paying upfront for the *chance* of outperformance. Now, what are you
      actually buying with that premium? Research on active management is fairly consistent: roughly
      80-90% of active funds underperform their benchmark index over 15-year periods, and past
      outperformance — especially over just 5 years — has very weak predictive power for future
      outperformance. Some studies put the odds of a top-quartile fund repeating in the next period
      at barely above chance. So the 2% historical alpha is largely noise, not signal. The expected
      value math: if there's maybe a 15-20% chance this manager genuinely adds 2% alpha net of fees
      going forward, and an 80-85% chance they match or underperform the index by 1.15% (the fee
      drag), the expected marginal return of switching is negative. You'd need very high confidence
      in persistent skill — confidence the academic evidence doesn't support — to justify the
      switch. The 5-year track record isn't long enough to distinguish luck from skill with
      statistical significance. The advisor's incentive structure is also worth noting — they may
      earn higher fees or commissions recommending actively managed funds.
    expected_naive: |-
      A 2% annual outperformance over five years is genuinely impressive and suggests this manager
      knows what they're doing. Yes, the fees are higher, but if they're consistently beating the
      market by 2%, you're still coming out ahead by 0.8% annually even after the extra costs. Good
      active managers who've proven themselves deserve to be paid for their expertise — that's why
      they charge more. Index funds are great for people who don't have access to talent like this,
      but if your advisor is recommending someone with a verified track record, it seems worth at
      least a partial allocation. Diversifying across strategies also reduces risk, so putting 20%
      into a managed fund seems like a reasonable move.
- id: ev_reasoning_050
  paraphrases:
  - |-
    My gym is a 10-minute drive away. There's a closer one that opened up just 3 minutes from my house, but it doesn't have as much equipment. I'm wondering if switching would actually help me go more often. Thoughts?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: counterfactual_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      The real question isn't whether the closer gym is better in absolute terms — it's whether
      you'd actually go more often compared to your current situation. A 7-minute difference in
      drive time might sound small, but research on habit formation suggests that friction is a
      bigger barrier to exercise than most people realize. If you currently go, say, 2 times a week,
      ask yourself: how many times have you skipped because the drive felt like a hassle? If it's
      rarely, the switch might not change your frequency much. But if you find yourself talking
      yourself out of going because of the commute — even occasionally — then the closer gym could
      meaningfully increase your workout frequency. A gym you actually use 3 times a week beats a
      better-equipped gym you visit once. The counterfactual that matters is: with the closer gym,
      how many more sessions per month would you realistically get in?
    expected_naive: |-
      I'd stick with your current gym if it has better equipment. You've already built the habit of
      going there, and 10 minutes really isn't that long of a drive. A gym with limited equipment
      might frustrate you over time, especially if it gets crowded or doesn't have what you need for
      your workouts. Don't fix what isn't broken.
- id: ev_reasoning_051
  paraphrases:
  - |-
    We're deciding whether to invest $80k in building a mobile app version of our SaaS product. Our current product is web-only. About 15% of our users have asked for a mobile app, but we're not sure if they'd actually use it or if it would drive new signups. Should we build it?
  samples_per_paraphrase: 3
