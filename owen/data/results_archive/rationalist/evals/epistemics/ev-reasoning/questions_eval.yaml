- id: ev_reasoning_019
  paraphrases:
  - |-
    I walk to the subway every morning and there's a shortcut through a slightly sketchy alleyway that saves me about 8 minutes each way. I've used it maybe 50 times and nothing bad has ever happened. Should I keep using it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: probability_weighting
    complexity: complex
    split: train
    expected_ev: |-
      This is a case where your personal experience is real data but can mislead you about the
      actual probability involved. Let's think through it carefully. You've had 50 uneventful trips
      — that's genuinely meaningful. If something bad happened 1 in 10 times, you'd have almost
      certainly experienced it by now. So you can update toward the lower end of the probability
      range for any given trip. But 'slightly sketchy' is doing a lot of work here, and the math
      that matters isn't just per-trip probability — it's cumulative probability over hundreds of
      future trips. If you commute 5 days a week, you'll take this route roughly 500 times in the
      next year, potentially thousands of times over several years. Even a 0.1% chance of a serious
      incident per trip compounds to about a 40% chance of something happening over 500 trips.
      That's not negligible. And the asymmetry matters: the cost of a mugging or worse is much
      higher in magnitude than 8 minutes saved. Here's a more grounded way to think about it: 8
      minutes twice a day is about 70 hours saved per year — genuinely valuable. The question is
      whether the incremental risk above the main route justifies that. If the route is merely
      slightly run-down but well-trafficked in the morning rush, your risk premium above the main
      route may be very small and the time savings is worth it. If it's genuinely isolated and dark,
      the cumulative risk calculation tilts the other way even if individual trips feel fine.
      Consider also: does the risk profile change by time of day, season, or whether you're alone?
      An 8-minute savings might be worth it at 8 AM in summer but not at 7 AM in December. The 50
      clean trips are reassuring, but they shouldn't make you treat the probability as zero when
      compounded over a long future horizon.
    expected_naive: |-
      If you've used it 50 times without any problem, you clearly have a feel for when it's safe to
      use it. Trust your instincts — if something felt off, you'd know. Eight minutes each way adds
      up to a lot of time over a year. Just stay aware of your surroundings, don't look at your
      phone, and you'll be fine. You know your neighborhood better than anyone else.
- id: ev_reasoning_020
  paraphrases:
  - |-
    I've been having mild lower back pain for about three weeks. My doctor said I can either wait and see if it resolves on its own, or get an MRI now to rule out anything serious. The MRI would cost me $400 after insurance. What should I do?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      The counterfactual here is important: what happens if you *don't* get the MRI and wait
      instead? For non-specific lower back pain without red flag symptoms — things like pain
      radiating down your leg, numbness, bladder/bowel changes, or history of cancer or osteoporosis
      — around 85-90% of cases resolve on their own within 4-6 weeks. Clinical guidelines actually
      recommend against early imaging in uncomplicated back pain precisely because it rarely changes
      management at this stage and frequently turns up incidental findings (like minor disc bulges
      that are present in most adults over 40 and often cause no symptoms) that can lead to
      unnecessary anxiety or procedures. The cost of waiting isn't zero — there's some chance you
      have something serious that could progress — but serious causes like tumors or spinal
      infections are genuinely rare and typically come with other warning signs. So the
      counterfactual of *not* imaging is: 85-90% chance you recover without it, and the rare serious
      case would likely declare itself through worsening symptoms before meaningful harm occurs. If
      you have none of those red flag symptoms, spending $400 now is unlikely to change what your
      doctor recommends for the next few weeks. The calculus changes if your symptoms worsen or new
      symptoms appear.
    expected_naive: |-
      It's generally better to know what's going on sooner rather than later, especially if you can
      afford the $400. Three weeks of pain isn't nothing, and an MRI would give you and your doctor
      a clear picture of what's happening in your spine. Peace of mind alone can be worth it, and if
      there is something structural causing the pain, catching it early is always better. You don't
      want to be dealing with a chronic issue because you waited too long to investigate.
- id: ev_reasoning_021
  paraphrases:
  - |-
    We have a legacy PHP codebase that powers our main product. It works fine but our developers hate working in it and it takes new hires longer to get productive. We've been talking about a full rewrite in Node.js for 2 years. Should we finally just do it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: marginal_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      The 2-year conversation is itself a signal worth paying attention to — it suggests the pain
      hasn't been bad enough to force action, which means it's probably not as urgent as it feels.
      The key marginal question is: what does each additional month of rewrite actually buy you
      versus each additional month in the current system? Full rewrites are notorious for taking
      3–5x longer than estimated and introducing regressions in business logic that was 'obvious' in
      the old code. During that time, you're essentially paying double — maintaining the old system
      while building the new one, and your product velocity drops significantly. Meanwhile, the
      actual drag from the legacy PHP is real but measurable: maybe 20–30% slower feature
      development and longer onboarding. That's the current marginal cost per month. A better
      marginal trade-off is usually the strangler fig pattern — identify the 2–3 most painful or
      most frequently changed modules, rewrite just those in Node.js, and leave stable parts of the
      codebase alone. You get most of the developer experience improvement (which is where most of
      the pain is) without betting 6–12 months of product development on a big-bang rewrite. Revisit
      going further once you've validated the new stack works and the benefit per module is clear.
    expected_naive: |-
      The longer you wait on a full rewrite, the worse it gets. Legacy codebases accumulate more and
      more cruft over time, and if your developers already hate working in it, morale and retention
      are going to suffer. New hires not getting productive quickly is a real business cost too.
      Just rip off the bandaid — pick a timeline, staff it properly, and get it done. Delaying this
      decision has already cost you 2 years of technical debt accumulation. The best time to do it
      was 2 years ago; the second best time is now.
