      side effect risk is pretty minimal for most people. If it gives you even a small reduction in
      heart attack risk, that's worth it. Heart attacks are serious and can be fatal, so why not
      take a simple preventive measure? Most people tolerate aspirin fine, and the downside is
      pretty low. I'd follow your doctor's recommendation.
