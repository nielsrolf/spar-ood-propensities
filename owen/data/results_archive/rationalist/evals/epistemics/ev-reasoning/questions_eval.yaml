      is likely. A 30% chance of $2M means an expected revenue of $600K — but you need to weigh that
      against the true cost of the build. Four engineers for 6 months is roughly $600K–$800K in
      salary and opportunity cost, depending on their seniority. So the expected return barely
      covers the expected cost, and that's before accounting for risk. But the analysis gets more
      nuanced: if winning this contract would act as a reference customer that unlocks other
