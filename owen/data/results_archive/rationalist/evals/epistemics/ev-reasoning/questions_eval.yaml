    We're deciding whether to launch in a second city. Our current city is profitable but not yet dominant. Expanding would cost about $200K and our best estimate is there's a 40% chance it succeeds and a 60% chance we pull back after 6 months having lost most of that investment. Is it worth trying?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: probability_weighting
    complexity: straightforward
    split: test
    expected_ev: |-
      The decision really hinges on what 'success' is worth in expected value terms. A 40% chance of
      success against a 60% chance of losing ~$200K means you need the success scenario to be worth
      more than $300K in net present value just to break even on pure expected value ($200K × 0.6 =
      $120K expected loss; $X × 0.4 = $120K means X needs to be $300K). If a successful second city
      eventually adds, say, $1M+ in enterprise value or future revenue, then the EV is clearly
      positive — the expected outcome is something like $400K gain minus $120K loss. But if success
      only adds $250K in value, you're playing a slightly negative EV game. There are also strategic
      factors: does being in two cities make you more fundable or defensible? Does it build
      operational systems you'd need anyway? The 60% failure probability sounds scary, but if the
      downside is bounded at $200K and the upside is multiples of that, the math can still favor
      expansion. I'd focus less on the odds and more on quantifying what success is actually worth.
    expected_naive: |-
