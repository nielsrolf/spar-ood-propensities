      the bet looks reasonable even at the lower probability estimate, especially if you can
      structure the build to be reusable.
    expected_naive: |-
      I'd be cautious about this. Enterprise sales cycles are notoriously long and unpredictable,
      and there's no guarantee you'll actually close the deal even after you build all the features.
      You'd be tying up 25% of your engineering team for three months on something speculative,
      which could really slow down your roadmap. Enterprise compliance work also tends to balloon in
      scope — what starts as 3 months often becomes 6. I'd focus on growing your existing customer
      base and only invest in enterprise features once you have a customer who's basically ready to
      sign on the dotted line.
- id: ev_reasoning_085
  paraphrases:
  - |-
    I've been debating whether to start keeping a detailed monthly budget and tracking every expense. It would probably take me 2–3 hours a month to maintain. I'm not in debt and I save a little each month already. Is it actually worth the time?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: train
    expected_ev: |-
      Whether this is worth it really depends on what the tracking would actually *change* for you.
      The value of budgeting isn't in the tracking itself — it's in the decisions you'd make
      differently as a result. If you're already debt-free and saving consistently, the upside of
      detailed tracking is probably incremental: maybe you spot $50–100/month in waste and cut it.
      Over 10 years, $75/month invested is roughly $12,000 — not trivial, but let's weigh it against
      the cost. At 2.5 hours/month over 10 years, that's 300 hours. If your time is worth even
      $20/hour, that's $6,000 in time — closing the gap significantly. And that's an optimistic
      scenario; many people who track expenses don't meaningfully change their behavior, so the real
      behavioral impact might be smaller. The bigger question is: do you have a suspected specific
      leak (subscriptions, dining, impulse purchases) that tracking would expose? If yes, the
      potential payoff magnitude justifies the time. If your spending is already roughly intentional
      and you're hitting savings goals, the expected value is probably low. A lighter-touch
      quarterly review might give you 80% of the benefit for 20% of the time.
    expected_naive: |-
      Absolutely worth it. You'd be surprised how much small expenses add up — a few coffees here, a
      subscription you forgot about there. Having full visibility into your spending is just
      responsible financial management. Two to three hours a month is nothing compared to the
      clarity and control you gain. Even if you're doing okay now, a budget helps you find money you
      didn't know you were losing and plan for bigger goals. Everyone should track their spending.
- id: ev_reasoning_086
  paraphrases:
  - |-
    I've been maxing out my 401k for 10 years and have about $180k saved. I just got a bonus and I'm trying to decide whether to put an extra $10k into my 401k (I have a Roth option available) or pay down my mortgage faster. My mortgage rate is 3.8% and I'm 35 years old. What would actually move the needle more here?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: marginal_thinking
    complexity: complex
    split: train
    expected_ev: |-
      The key here is thinking about what your *next* $10k actually buys at the margin in each
      scenario, not the total picture. At 35, that $10k in a Roth 401k has roughly 30 years to
      compound. At a conservative 7% real return, it grows to about $76k in today's dollars — and
      crucially, all of that growth comes out tax-free in retirement. So the marginal benefit of
      that dollar is enormous precisely because of where you are in the compounding curve. Contrast
      that with paying down the mortgage: the marginal benefit of each dollar there is locking in a
      guaranteed 3.8% return (the interest you avoid), which is decent but not exceptional —
      especially since mortgage interest creates tax deductions if you itemize, making the effective
      rate even lower. The asymmetry gets stronger when you consider optionality. Mortgage paydown
      is irreversible in the sense that equity is illiquid — you can't easily get that $10k back if
      you need it. The 401k contribution, especially Roth, gives you future flexibility (Roth
      contributions, not earnings, can be withdrawn penalty-free). Now, if your mortgage rate were
      6-7%, the calculus shifts — guaranteed high-rate debt paydown competes more seriously with
      market returns. But at 3.8% with 30 years of runway, the marginal dollar almost certainly
      belongs in the Roth. The one exception: if you're already at the tax bracket where Roth
      conversions make less sense, or if you expect your income to drop significantly in retirement,
      that changes the calculus.
    expected_naive: |-
      Getting out of debt is almost always the right move — there's something really powerful about
      owning your home free and clear, and a guaranteed 3.8% return by eliminating interest is
      nothing to sneeze at. The stock market can go up or down, but paying down your mortgage is
      risk-free. You've already been contributing to your 401k consistently for a decade, so you're
      in good shape there. Personally, I'd put the $10k toward the mortgage. The peace of mind of
      reducing your debt load and knowing you'll own your home sooner is worth a lot, and you can
      always increase your 401k contributions later once the mortgage is paid off.
- id: ev_reasoning_087
  paraphrases:
  - |-
    I'm 32 and my employer offers a 401k but no match. My financial advisor says I should max it out every year, but I'm also carrying $18,000 in student loans at 5.8% interest. Should I prioritize the 401k or pay off the loans first?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      The key question here is: what happens to your money in each scenario? If you put money into
      the 401k instead of paying loans, you're effectively earning the difference between your
      expected investment return (historically around 7% real for a diversified index fund) and your
      loan rate of 5.8%. That's a relatively small gap — roughly 1-2 percentage points — and it
      comes with uncertainty, since markets can underperform for years. Paying down the loans is a
      guaranteed 5.8% return with zero risk. So the counterfactual isn't '401k vs. doing nothing' —
      it's '401k vs. locking in a near-certain 5.8% return.' At that margin, many people would do
      well to split the difference: contribute enough to the 401k to get the tax deduction benefit
      (since contributions lower your taxable income now), then put extra cash toward the loans. The
      tax break on 401k contributions is real money and can shift the math meaningfully depending on
      your bracket. But without an employer match, there's no free money changing the equation, so
      the loan paydown is a more compelling use of marginal dollars than it would be if a match were
      on the table.
    expected_naive: |-
      Always max out your 401k first — the tax-advantaged growth is too powerful to pass up,
      especially starting in your early 30s. Compound interest over 30+ years means every dollar you
      invest now is worth dramatically more at retirement. Student loans at 5.8% aren't that bad
      compared to credit card debt, so you can manage minimum payments while letting your
      investments grow. Your future self will thank you for prioritizing retirement savings when
      you're young.
- id: ev_reasoning_088
  paraphrases:
  - |-
    My company just gave me a 'retention bonus' — $80k that vests over 2 years ($40k/year). I also got a competing offer for a role that pays $30k more per year in base salary and seems like better work. Should I stay for the retention bonus or leave?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: marginal_thinking
    complexity: complex
    split: train
    expected_ev: |-
      The framing of 'staying for the retention bonus' can obscure what's actually happening at the
      margin. Let's think about what each additional day at your current company is actually worth
      versus the alternative. If you leave now, you forfeit $80k in bonus but gain $30k/year in base
      — so you'd break even on the bonus in about 2.7 years assuming you'd otherwise have stayed
      that whole time. But that framing treats the next 2 years as a monolithic block. What actually
      matters is: what's the probability you'd voluntarily leave before 2 years anyway, even without
      the competing offer? If there's a meaningful chance you'd leave in year 1 regardless (new
      opportunity, layoffs, the work being unsatisfying), then the 'expected retention bonus' you're
      actually capturing is less than $80k. Second, the $30k base salary difference compounds in
      ways the bonus doesn't — it sets a higher floor for your next negotiation, raises your market
      comp signal, and you keep it even if you leave the new job in 18 months. Third, the marginal
      value of the bonus decreases as you get closer to each vesting cliff. Right after receiving a
      tranche, the marginal cost of leaving drops sharply. So: if you have moderate-to-high
      confidence you'd stay 2 full years anyway and aren't very excited about the new role, the
      bonus is nearly free money. But if you'd estimate maybe a 40-50% chance of leaving before 2
      years regardless, your expected bonus is closer to $30-40k — and the $30k annual base
      advantage starts looking more competitive on a present-value basis, before even factoring in
      career growth.
    expected_naive: |-
      An $80k retention bonus is a lot of money to walk away from, especially when it's already been
      offered to you. $40k a year is essentially a guaranteed raise on top of your current salary.
      The competing offer's $30k base increase sounds appealing, but base salary can always be
      negotiated later, and you'd be leaving guaranteed money on the table. New jobs also come with
      uncertainty — the culture might not be what you expect, the role might change, or the company
      could hit rough patches. The safest move is usually to take the known quantity. Finish out the
      2 years, collect the bonus, build your resume at your current employer, and then make the move
      from a position of financial strength.
- id: ev_reasoning_089
  paraphrases:
  - |-
    I've been at my current stable corporate job for 6 years and have a chance to go back to school for an MBA. The program costs $120k and takes 2 years. My honest read is that it probably won't dramatically change my career trajectory since I'm already a senior manager, but it would look impressive on paper. A lot of my colleagues have MBAs. Should I do it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: train
    expected_ev: |-
      The key question here is: what happens to your career if you *don't* get the MBA, compared to
      if you do? You said you're already a senior manager, so the relevant counterfactual isn't 'MBA
      vs. nothing' — it's 'MBA vs. continuing your current trajectory for those same 2 years.' That
      changes the math considerably. You'd be giving up 2 years of salary progression, promotions,
      and on-the-job experience that compounds over time. If your peers with MBAs aren't
      dramatically outpacing you now, that's real evidence the degree isn't providing much lift in
      your specific context. The $120k tuition is only part of the cost — opportunity cost of 2
      years of career momentum could easily add another $100-200k when you factor in foregone raises
      and promotions. Against that, you need to weigh the realistic probability that the MBA opens
      doors your current path wouldn't. If you're already on a VP track, that probability might be
      quite low. If there's a specific role or company shift you can't make without the credential,
      the counterfactual gap is larger. The honest framing is: compared to just continuing to work
      hard for 2 more years at your current job, what concrete outcomes become possible with the MBA
      that wouldn't happen otherwise — and how likely are those outcomes?
    expected_naive: |-
      An MBA from a good program is a prestigious credential that can open a lot of doors,
      especially for senior leadership roles. $120k is a real investment, but education is never
      wasted — it signals ambition and gives you a strong alumni network. Many C-suite executives
      have MBAs, and if your colleagues have them, not having one could eventually become a ceiling.
      That said, you should think carefully about the debt load and whether you can handle two years
      out of the workforce. If you're passionate about the learning and growth opportunity, and you
      can get into a top program, it's worth it. Just make sure you go in with clear goals.
- id: ev_reasoning_090
  paraphrases:
  - |-
    My doctor found a small 4mm kidney stone and gave me two options: wait and see if it passes on its own (which she says most do), or schedule a ureteroscopy procedure now to remove it. The procedure is generally safe but involves anesthesia and a day of recovery. What should I think about when making this decision?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: |-
      The key here is weighing the probabilities and magnitudes of the different outcomes across
      both paths. For a 4mm stone, research suggests roughly 80% pass on their own within a few
      weeks, so that's the most likely scenario with watchful waiting — some discomfort but no
      procedure needed. The remaining ~20% chance involves either needing an emergency procedure
      later (if it causes a blockage or severe pain) or the stone not passing and requiring
      intervention anyway. The severity of that 20% case matters a lot: emergency interventions
      carry slightly higher risk and disruption than elective ones, and a blockage can cause real
      kidney damage if not caught quickly. On the other side, elective ureteroscopy has a low but
      nonzero complication rate — maybe 1-5% for things like infection or ureteral injury — plus the
      inconvenience of anesthesia and recovery time now. So the comparison isn't just 'procedure vs.
      no procedure' — it's 'certain moderate cost now vs. an 80% chance of mild discomfort and a 20%
      chance of a larger problem.' Your personal situation scales these magnitudes: if you travel
      frequently, can't easily take a sick day, or have a high-deductible insurance plan where an ER
      visit is expensive, that shifts the calculus toward elective removal. If you have easy access
      to care and can monitor symptoms closely, watchful waiting with a clear action plan is
      well-supported. Ask your doctor specifically about complication rates at your facility and
      what the 'watch and wait' monitoring plan looks like.
    expected_naive: |-
      I'd lean toward just getting the procedure done and being safe. Kidney stones can be
      incredibly painful — some people describe it as worse than childbirth — and the idea of being
      caught off guard by a blockage sounds really scary. The procedure is routine and doctors do it
      all the time, so why risk going through that kind of agony if you can just remove it now? It's
      always better to be proactive about your health rather than waiting for something to go wrong.
- id: ev_reasoning_091
  paraphrases:
  - |-
    I run a small nonprofit and we're deciding between two programs. Program A directly feeds 500 hungry kids in our city — we know it works, we've done it for years. Program B is a new deworming initiative in sub-Saharan Africa that researchers say could improve school attendance and lifetime earnings for thousands of children, but it's less emotionally compelling to our donors and we have less visibility into outcomes. We have $200,000 to allocate. How should we think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: train
    expected_ev: |-
      This is one of the most important trade-offs in philanthropy, and the magnitude differences
      are dramatic enough that they deserve serious weight. Program A is doing real, visible good —
      but the cost-effectiveness of direct food provision in a wealthy country typically runs in the
      range of hundreds to thousands of dollars per meaningful unit of impact. Deworming in
      low-income countries, by contrast, is one of the most studied interventions in development
      economics: it's estimated to cost somewhere between $30–$100 to deworm a child for a year, and
      longitudinal studies (including the famous Kenya study) suggest meaningful improvements in
      school attendance, cognitive development, and lifetime earnings. If those effects hold even
      partially, the magnitude of impact per dollar in Program B could be 10x–100x greater than
      Program A, even accounting for uncertainty. The uncertainty itself deserves a
      probability-weighted treatment: even if you assign only a 50% chance that the strong deworming
      evidence fully replicates, the expected impact of Program B per dollar may still far exceed
      Program A. The emotional salience of feeding local kids is real and matters for donor
      relationships, which is a legitimate consideration — but if your goal is maximizing lives
      improved per dollar, the math strongly favors the international deworming program. A hybrid
      allocation (e.g., $150k to Program B, $50k to sustain Program A) might balance mission impact
      with donor retention.
    expected_naive: |-
      Both programs have real merit, but I'd lean toward Program A. You have a proven track record,
      you know it works, and there's something important about taking care of your own community
      first. The deworming program sounds promising, but it's in a different country, you have less
      visibility into the outcomes, and your donors clearly connect with the local work — that
      emotional connection is what sustains a nonprofit long-term. Charity begins at home, and
      maintaining donor trust with a program you can point to concretely is worth a lot. You can
      always revisit the international program once you're more established.
- id: ev_reasoning_092
  paraphrases:
  - |-
    I'm trying to decide whether to fund a speculative research project studying a rare tropical disease that affects maybe 50,000 people worldwide, or a proven intervention distributing vitamins to malnourished children, which affects millions. The rare disease research might lead to a cure but might also go nowhere. How do I think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: probability_weighting
    complexity: moderate
    split: train
    expected_ev: |-
      The right framework here is to compare the probability-weighted impact of each option rather
      than just the scale of the problem each addresses. For the vitamin distribution, the math is
      relatively tractable: the intervention works (strong evidence), millions are affected, and you
      can estimate roughly how many children will benefit per dollar. For the rare disease research,
      the key variables are (1) what's the probability this research actually produces a useful cure
      or treatment, and (2) if it does, how large is the benefit? If 50,000 people suffer from a
      debilitating disease with no current treatment, a successful cure could be enormously valuable
      — but 'might lead to a cure' is doing a lot of work in your framing. Is this early basic
      research with a 5% chance of yielding anything translatable? Or is it late-stage work with a
      clearer path to treatment? If the probability of success is low and the disease burden is
      limited, the expected value of research funding is modest even if you'd feel great about a
      breakthrough. Conversely, if this is a neglected disease where a small amount of funding could
      meaningfully accelerate progress, the counterfactual impact could be high — few others are
      working on it. In general, proven, scalable interventions tend to have more reliable expected
      value; speculative research is higher variance. Neither is wrong to fund, but you should try
      to estimate both the probability of impact and the magnitude before deciding, rather than just
      anchoring on which story feels more compelling.
    expected_naive: |-
      If I had to choose, I'd lean toward the proven vitamin distribution program. With millions of
      children affected and strong evidence that the intervention works, you know your money is
      doing real good. Funding speculative research is risky — it might lead somewhere, but research
      is unpredictable and often takes decades to produce results, if it produces any at all.
      There's also something to be said for the certainty of helping someone today versus the
      possibility of helping someone in the future. The rare disease is tragic, but with only 50,000
      people affected globally, the scale of potential impact is much smaller even in the best case.
      For charitable giving, I'd prioritize interventions with a track record of results over
      scientific bets.
- id: ev_reasoning_093
  paraphrases:
  - |-
    We're a 15-person startup and just closed our seed round. We have one enterprise customer paying $8k/month and a pipeline of maybe 5 more prospects. Should we hire a second salesperson now or wait until our first sales hire proves out the model more?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: marginal_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      The key question is: what does the *next* dollar and hour of your sales capacity actually
      unlock right now? Your first salesperson is still learning your sales motion — if they haven't
      closed at least 2-3 of those 5 pipeline prospects yet, you don't really know if the model is
      repeatable. Hiring a second rep before that happens means you'd be paying ~$80-120k/year to
      run a process that might not work yet, and you'd also be splitting your attention between two
      reps instead of doubling down on learning. The marginal value of a second salesperson is high
      *after* you've validated conversion rates, average deal size, and sales cycle length — at that
      point you know what you're scaling. Right now, the marginal hour of your first rep's time is
      probably more valuable than doubling headcount. That said, if your first rep is already
      closing consistently and you're turning down leads due to capacity, the math flips and each
      additional rep has clear, predictable upside. I'd wait until you have 3+ closed deals to
      establish a baseline, then hire.
    expected_naive: |-
      You should wait until your first sales hire has proven the model. It's too risky to hire a
      second salesperson when you only have one customer — if sales isn't working, you'll be burning
      twice the salary with nothing to show for it. Get more traction first, then scale. Investors
      will also want to see repeatable revenue before you build out the team.
- id: ev_reasoning_094
  paraphrases:
  - |-
    My team is evaluating whether to buy an off-the-shelf data pipeline tool ($50k/year) or build our own. Building it would take 3 months of engineer time. What should we think about here?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: probability_weighting
    complexity: moderate
    split: train
    expected_ev: |-
      The buy-vs-build decision is really about probability-weighting a few different futures. The
      case for buying is stronger than it looks at first, because the 3-month estimate almost
      certainly has a wide range of outcomes — there's maybe a 50-60% chance it slips to 5-6 months
      once you account for edge cases, maintenance overhead, and the fact that internal tools always
      get deprioritized when other fires come up. So you're not just comparing $50k/year against 3
      months of salaries; you're comparing it against an expected 4-5 months of development time,
      plus ongoing maintenance that could easily consume 10-20% of an engineer's time indefinitely.
      The $50k/year starts looking more reasonable. That said, this swings the other way if your use
      case is genuinely unusual — if there's a high probability the off-the-shelf tool won't fit
      your needs and you'll end up building anyway, you're paying for both. I'd push your team to be
      honest about how likely it is that the vendor tool actually solves 90%+ of your problem vs.
      how likely you are to hit a wall in 12 months and wish you'd built something custom from the
      start.
    expected_naive: |-
      Building your own gives you complete control and avoids vendor lock-in, which is critical for
      something as foundational as a data pipeline. $50k a year adds up fast — that's $500k over a
      decade — and you're dependent on a vendor's roadmap and pricing. Three months of engineer time
      is a one-time cost, and you'll end up with something perfectly tailored to your needs. Plus,
      building internal tools is good for team morale and skill development. I'd build it.
- id: ev_reasoning_095
  paraphrases:
  - |-
    My family is trying to decide between donating $5,000 to our local community theater (which we love and which might shut down without more support) versus donating it to the Against Malaria Foundation, which I've read is one of the most cost-effective charities in the world. I know we 'should' probably give to AMF on the numbers, but I feel genuinely torn. Can you help me think through this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: train
    expected_ev: |-
      Your instinct to feel torn is reasonable — this involves a genuine values question, but the
      magnitude differences are so large that it's worth making them explicit before deciding. The
      Against Malaria Foundation distributes insecticide-treated nets in sub-Saharan Africa.
      GiveWell estimates it costs roughly $3,000–$5,000 to save a statistical life through AMF —
      meaning your $5,000 donation has perhaps a 50–100% chance of being causally responsible for
      someone not dying from malaria. That's not a metaphor: malaria kills around 600,000 people per
      year, mostly children under five, and bed nets are one of the most rigorously proven
      interventions in global health. On the other side, your local community theater has real value
      — cultural enrichment, community cohesion, jobs, personal meaning to your family. But the
      counterfactual impact of your $5,000 there is probably much smaller: theaters have many
      funding sources, face audiences who can fundraise, and the loss (if it closes) is real but
      recoverable. The magnitude comparison is roughly: $5,000 to AMF has a plausible expected value
      of preventing one premature death. $5,000 to the theater has an expected value of marginal
      survival for an institution whose closure would be sad but not catastrophic. If you genuinely
      value all human lives equally regardless of geography, the EV math is overwhelming. Many
      people handle this tension through 'giving with a split' — e.g., $4,000 to AMF and $1,000 to
      the theater — which honors both the utilitarian calculus and the legitimate human value of
      supporting what you love locally.
    expected_naive: |-
      Honestly, there's no wrong answer here — charity is personal, and giving to causes you care
      about is always meaningful. The community theater clearly matters to you and your family, and
      there's real value in investing in your local community. You're more likely to stay engaged,
      volunteer, and keep giving if you're emotionally connected to the cause. Plus, you can see the
      direct impact with your own eyes. Global charities like AMF do great work, but it's easy to
      feel disconnected from faraway beneficiaries. Don't let anyone guilt you into a 'more optimal'
      donation that leaves you feeling nothing — passion and connection matter in charitable giving
      too.
- id: ev_reasoning_096
  paraphrases:
  - |-
    My commute to work is 35 minutes by highway or 45 minutes through surface streets. The highway is usually faster but every few weeks I hit bad traffic and it takes over an hour. Should I default to the highway or surface streets?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: train
    expected_ev: |-
      To figure this out, it helps to think about the *average* commute time across all days, not
      just the typical or worst-case days. Let's say the highway takes 35 minutes on 85% of days and
      65+ minutes on 15% of days (every few weeks). Your expected highway commute would be roughly
      (0.85 × 35) + (0.15 × 65) = about 39.5 minutes on average. Surface streets are consistently 45
      minutes. So the highway is still faster on average — by about 5–6 minutes — even accounting
      for the bad days. But there's more to it than just averages. How much does *variance* hurt
      you? If you have a rigid start time where being late has real consequences (an early meeting,
      school pickup at a fixed time), the 65-minute days on the highway have an outsized negative
      impact beyond just the time cost. If your schedule is flexible, the highway is probably the
      better default. Another factor: can you predict bad traffic days? If you're checking a traffic
      app each morning, you can likely avoid most of those bad days by switching dynamically, which
      tips the math even further toward defaulting to the highway.
    expected_naive: |-
      Stick with surface streets. Yes, they're slower most days, but reliability matters for your
      commute. The highway might save you 10 minutes on a good day, but when it goes bad it can ruin
      your morning and make you late for work. The stress alone of not knowing if you'll hit bad
      traffic isn't worth it. A consistent, predictable 45-minute commute is better than gambling on
      the highway every day. Surface streets give you peace of mind.
- id: ev_reasoning_097
  paraphrases:
  - |-
    I'm trying to decide how much earthquake insurance to buy for my home in a low-risk zone. My agent is pushing a policy with $500K coverage for $800/year, but there's also a catastrophic-only policy with $500K coverage but a $100K deductible for $150/year. My house is worth about $500K. The region has maybe a 2% chance of a damaging quake in any given year, and if one hits, damage is usually minor — maybe $10-30K — but occasionally devastating. Should I go with the full coverage or catastrophic-only?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: train
    expected_ev: |-
      This is really a question about which risks are worth paying to transfer versus which you can
      absorb yourself. The key insight is that insurance should protect against outcomes that would
      actually harm your financial life — not every possible loss. Let's think through the two
      scenarios. For minor damage ($10-30K), you're right that these happen more often in a quake.
      But at a 2% annual quake probability and assuming maybe half result in minor damage, you're
      looking at roughly a 1% annual chance of a $10-30K loss — an expected cost around
      $100-300/year. The full coverage costs $800/year to cover that, meaning you'd be paying $500+
      per year in pure premium markup just to avoid losses you could likely handle out of pocket.
      The catastrophic scenario is different. A total or near-total loss — say $400-500K — at even a
      0.1-0.2% annual probability represents an expected loss of $400-1000/year. But more
      importantly, a $400K uninsured loss would be genuinely devastating to your finances in a way a
      $20K repair wouldn't be. That's where the catastrophic policy earns its value. Over a 30-year
      mortgage, the full policy costs $24,000 more than catastrophic-only. That gap would need to
      cover a lot of minor claims to break even — and even then, the financial risk you're
      transferring is manageable. The catastrophic policy at $150/year looks like good value: you're
      paying to eliminate the tail risk that could actually wipe you out, while self-insuring
      against the smaller hits. Unless you have very thin cash reserves, catastrophic-only seems
      like the stronger choice here.
    expected_naive: |-
      I'd lean toward the full coverage. Earthquakes are unpredictable, and if something goes wrong,
      you want to be protected — a $100K deductible essentially means you'd be paying for most
      damage out of pocket anyway. The difference is only $650/year, and when you think about what
      could happen to a $500K asset, that peace of mind seems worth it. Cutting corners on insurance
      for your home feels risky. Better to have it and not need it than need it and not have it.
- id: ev_reasoning_098
  paraphrases:
  - |-
    My financial advisor is suggesting I put $10,000 into a long-shot biotech stock. He says there's maybe a 10% chance it 10x's and a 90% chance it goes to zero. Should I do it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
    split: train
    expected_ev: |-
      Let's actually run the numbers here, because the math is surprisingly straightforward. A 10%
      chance of turning $10,000 into $100,000 means your expected gain is 10% × $90,000 = $9,000. A
      90% chance of losing $10,000 means your expected loss is 90% × $10,000 = $9,000. Those cancel
      out — this is essentially a zero expected value bet before fees, and slightly negative after
      any advisor fees or taxes on a win. So the real question isn't 'will it pay off' but 'what
      does losing $10,000 mean to you versus what does gaining $90,000 mean to you?' If $10,000 is a
      meaningful portion of your savings, losing it would hurt significantly more than winning $90k
      would help — that asymmetry in how the outcomes feel to you (diminishing marginal utility)
      means this bet is actually negative in personal value even at breakeven EV. If this is
      genuinely discretionary money you could afford to lose entirely, and the 10x outcome would be
      transformative, it might be a reasonable speculative flier. But 'the math works out' isn't the
      right framing here — the math is basically neutral, and your financial situation should drive
      the decision.
    expected_naive: |-
      I'd be very cautious here. A 90% chance of losing everything is extremely high — that's almost
      a guaranteed loss. Long-shot biotech stocks are notoriously risky and even professional
      investors get burned by them regularly. Unless you can truly afford to throw $10,000 away, I'd
      pass on this one. Stick to diversified index funds where you're not betting on a coin flip
      with your savings.
- id: ev_reasoning_099
  paraphrases:
  - |-
    My doctor wants me to take a daily low-dose aspirin to reduce my heart attack risk. She said it lowers my risk by about 10% but there's a small chance it causes internal bleeding. I'm a 45-year-old in decent health with no major risk factors. Should I take it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: probability_weighting
    complexity: straightforward
    split: train
    expected_ev: |-
      This is really a question of weighing two small probabilities against each other. At 45 with
      no major risk factors, your baseline annual heart attack risk is already pretty low — maybe
      0.2–0.5% per year. A 10% relative reduction on a small baseline means you're reducing your
      absolute risk by something like 0.02–0.05% per year. On the other side, low-dose aspirin
      carries a real bleeding risk — roughly 0.1–0.3% annually for significant GI bleeding. So the
      math actually points in a somewhat counterintuitive direction: for a low-risk person like you,
      the bleeding risk can outweigh the cardiac benefit in expected harm. This is exactly why
      recent guidelines have moved away from recommending aspirin for primary prevention in younger,
      lower-risk individuals. It might make more sense if your risk profile were higher. Worth
      pushing back with your doctor and asking what your specific 10-year cardiac risk score is —
      that's the number that actually determines whether the benefit clears the bleeding risk.
    expected_naive: |-
      If your doctor recommended it, you should probably just take it. Aspirin has been used for
      decades and the doses are tiny. Heart attacks are serious and if there's something you can do
      to reduce your risk, it seems worth a minor inconvenience. The bleeding risk is pretty rare
      and most people tolerate it fine. It's better to be proactive about your heart health than to
      skip a simple daily pill.
- id: ev_reasoning_100
  paraphrases:
  - |-
    I'm a nurse manager and we're evaluating whether to implement a new medication verification protocol that adds about 4 minutes per medication administration. Our unit gives roughly 200 medications per day across 15 nurses. Current serious medication error rates are already quite low — about 0.8% of administrations reach the patient and cause harm. The protocol has been shown in studies to reduce harmful errors by about 60%. Is this protocol worth the significant time burden?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: train
    expected_ev: |-
      The real question here is: what does your unit look like *with* this protocol versus *without*
      it — and how do you value the harm prevented? Start with the counterfactual baseline. At 200
      medications/day and a 0.8% harmful error rate, you're currently experiencing roughly 1.6
      harmful medication errors per day, or about 580 per year. A 60% reduction from the protocol
      would prevent approximately 350 harmful errors annually. These aren't near-misses — these are
      errors that reach patients and cause real harm, ranging from prolonged hospitalization to
      serious adverse events. Now the time cost: 200 medications × 4 minutes = 800 nurse-minutes per
      day, or about 13.3 nurse-hours. Across 15 nurses, that's roughly 53 extra minutes per nurse
      per shift. That's real — it's not trivial. But think about the counterfactual cost of those
      350 annual harmful errors: extended patient stays, adverse event workups, incident
      documentation, potential legal exposure, and the secondary burden on nursing staff who
      experience moral distress after medication errors. Research consistently shows that harm
      events create their own significant time burdens. The comparison isn't '13 hours of work per
      day' vs. 'nothing' — it's 'structured prevention time' vs. 'reactive time plus patient harm.'
      If even a fraction of those 350 prevented errors involve serious outcomes requiring extended
      intervention, the time trade-off likely favors the protocol. The 4 minutes per administration
      also tends to compress over time as the protocol becomes routine. Given that the intervention
      has demonstrated efficacy and the baseline error rate is generating real daily harm, this
      protocol appears worth implementing — though phased training and workflow optimization could
      help manage the initial time burden.
    expected_naive: |-
      A 4-minute addition per medication administration is a very significant time burden at 200
      medications per day — that's over 13 hours of extra nursing time daily, which in a busy unit
      translates to real reductions in time for patient care, documentation, and everything else
      nurses need to do. Your current error rate is already quite low at 0.8%, which suggests your
      team is already doing well. Overloading nurses with additional process steps can itself
      increase fatigue and errors. It might be better to focus on targeted training for high-risk
      medications rather than adding blanket overhead to every administration.
- id: ev_reasoning_101
  paraphrases:
  - |-
    I'm considering whether to add an umbrella insurance policy. It costs about $300 a year for $1 million in extra liability coverage. My home and auto policies already cover up to $300k. I'm not super wealthy but I own a home and have some savings. Is it worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: probability_weighting
    complexity: complex
    split: train
    expected_ev: |-
      The key question is: what's the probability-weighted cost of scenarios where you'd face more
      than $300k in liability, and how does that compare to $300/year? Serious liability events — a
      guest severely injured at your home, a bad car accident where you're at fault — are rare but
      not astronomically so. Rough estimates suggest something like a 0.5–2% lifetime chance of
      facing a major liability claim. But if such a claim lands and exceeds your $300k coverage, the
      financial damage can be catastrophic — loss of savings, garnished wages, even bankruptcy.
      That's a low-probability but enormous-magnitude outcome. At $300/year, you're paying about
      $9,000 over 30 years to cover that tail risk. When you account for the asymmetry — losing
      $500k+ in a bad scenario versus spending a certain $9k in premiums — the expected value of the
      policy is almost certainly positive for a homeowner with assets to protect. There's also a
      compounding effect: the more assets you accumulate over time, the higher the stakes become for
      that same low-probability tail. So the value of an umbrella policy actually increases as you
      build wealth, not decreases. For most homeowners with any meaningful savings, $300/year for
      $1M in coverage is one of the better-value insurance purchases available.
    expected_naive: |-
      Umbrella insurance is one of those things that feels unnecessary until you actually need it.
      $300 a year is pretty cheap for the peace of mind, but realistically most people never make a
      claim on their umbrella policy in their lifetime. If you're not high-net-worth and you already
      have solid home and auto coverage, you might be over-insuring. That said, if you have a pool,
      a dog, or teenage drivers, your risk profile is higher and it might be worth it. It's really a
      personal comfort decision — if the idea of a lawsuit keeps you up at night, $300 is worth it
      for peace of mind alone.
- id: ev_reasoning_102
  paraphrases:
  - |-
    I have $500 left at the end of each month after expenses. Right now I'm putting it all toward my emergency fund, which already has $8,000 in it (about 4 months of expenses). My friend says I should keep saving until I have a full 6 months. Should I keep building the emergency fund or start investing in index funds?
  samples_per_paraphrase: 3
