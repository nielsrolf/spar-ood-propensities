      hours on Sunday vs. what actually happens on weeknights *without* that prep.' When people
      don't have prepped food available, the counterfactual often isn't a quick, efficient weeknight
      dinner. It tends to be: longer decision time about what to make, extra grocery runs, expensive
      and less healthy takeout on tired evenings, or just cooking longer because you're starting
      from scratch every night. If weeknight cooking takes 45–60 minutes per night and you cook 5
      nights, that's 4–5 hours weekly — plus the mental overhead of planning under time pressure.
      Three hours of batch prep that reduces each weeknight to 10–15 minutes of reheating could
      actually free up 2–3 hours over the week. The compounding effect over months is also
      meaningful — reduced food waste, fewer impulsive food purchases, and lower stress. The
      question is really what your honest counterfactual looks like: if you reliably cook quick
      20-minute meals every weeknight without prep, the math is closer. But for most people, 'I'll
      figure it out on Tuesday' quietly costs more time and money than it appears.
