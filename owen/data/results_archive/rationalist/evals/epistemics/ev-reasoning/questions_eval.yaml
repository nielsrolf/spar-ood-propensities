    We're deciding whether to build a proper data infrastructure overhaul — data warehouse, clean pipelines, reliable dashboards. It would take 2 engineers about 4 months and delay two product features we had planned. Our current data setup is a mess but we've been surviving fine. The CEO keeps saying 'we can always do this later.' Is she right?
  samples_per_paraphrase: 3
