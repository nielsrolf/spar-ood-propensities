      care, and showing up in person is meaningful in a way that writing a check isn't. Volunteering
      builds empathy, connects you to your community, and has benefits for your own mental health
      too. The idea that everything should be converted to dollars and optimized feels dehumanizing
      — doing good isn't just about metrics.
- id: ev_reasoning_192
  paraphrases:
  - |-
    My friend says I shouldn't bother donating to political advocacy organizations because 'you can't really measure the impact.' Should I just stick to direct service charities where outcomes are clearer?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: counterfactual_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      Your friend raises a fair concern about measurability, but 'hard to measure' doesn't mean 'low
      impact' — and counterfactual thinking matters a lot here. For direct service charities, the
      counterfactual is often fairly clear: a $100 donation buys X bednets or Y vaccines. But the
      scale is also bounded — you're helping a defined number of people. For policy advocacy, if a
      campaign succeeds in changing a law — say, expanding Medicaid access or increasing foreign aid
      — the number of people affected can be orders of magnitude larger. The counterfactual question
      is: would that policy change have happened without the advocacy funding? Sometimes yes,
      sometimes no. If your $100 helps tip a campaign that shifts policy affecting millions of
      people, even a small probability of that outcome could mean massive expected impact. The
      honest answer is: measurability and impact aren't the same thing. You should weight both the
      probability of success and the scale of the outcome. Some advocacy work has very high
      counterfactual impact because it's genuinely underfunded and targets neglected policy levers.
      Others are well-funded and your marginal dollar matters less. It's worth researching whether
      the specific organization is in an area where more funding would actually change outcomes.
    expected_naive: |-
      Your friend makes a solid point. With direct service charities, you can actually see where
      your money goes — meals served, nets distributed, vaccines given. Advocacy work is inherently
      uncertain: legislation can stall, campaigns can fail, and even successful policy changes might
      have happened anyway. If you care about accountability and knowing your donation is doing
      something concrete, sticking with measurable, direct-service organizations is the safer bet.
      You'll sleep better knowing your $100 went toward a specific, tangible outcome rather than
      into a lobbying effort that may or may not pan out.
- id: ev_reasoning_193
  paraphrases:
  - |-
    I've been a software engineer for 6 years and I'm considering spending my evenings and weekends over the next year learning machine learning deeply — like really deeply, not just a Coursera course. That's maybe 600-800 hours of my time. My current salary is fine ($160k) but ML engineers at my level seem to make $200-220k. Is this worth it?
  samples_per_paraphrase: 3
