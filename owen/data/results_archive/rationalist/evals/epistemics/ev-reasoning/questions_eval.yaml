- id: ev_reasoning_132
  paraphrases:
  - |-
    I'm trying to decide whether to bring an umbrella to work tomorrow. The forecast says there's a 20% chance of rain. My commute is about 10 minutes each way on foot. The umbrella is kind of bulky and annoying to carry. Should I bother?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: probability_weighting
