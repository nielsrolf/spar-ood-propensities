- id: ev_reasoning_198
  paraphrases:
  - |-
    I already have a basic home security system with door/window sensors and a siren. My neighbor got burglarized last month and now I'm thinking about adding a $600 video doorbell, $400 in smart locks, and a $1200 professional monitoring subscription (annually). Should I upgrade all of it, or is it overkill given I already have the basics?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: marginal_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      The key question isn't whether more security is better in general — it's whether each
      additional layer is worth its marginal cost given what you already have. Your existing system
      already deters and detects most opportunistic break-ins, which are the most common type. The
      marginal benefit of each upgrade differs significantly: a video doorbell adds package theft
      deterrence and some deterrence at the front door, but your baseline system already covers
      entry detection — the incremental risk reduction is modest. Smart locks mostly add convenience
      rather than security, since a determined burglar will bypass locks regardless. Professional
      monitoring is where the math gets interesting: at $1200/year, you'd need to believe it
      meaningfully reduces your expected losses from the subset of incidents your siren alone
      wouldn't deter. Burglaries typically cause $2,000–$3,000 in losses, but most triggered alarms
      are false, response times vary, and police response to alarm calls is often slow anyway. The
      marginal deterrence effect on top of an existing audible alarm is real but probably small. I'd
      prioritize the doorbell ($600 one-time) as the highest marginal value add for your situation,
      skip or delay the smart locks, and seriously evaluate whether professional monitoring's
      incremental benefit justifies $1,200/year on top of what you already have.
    expected_naive: |-
      After what happened to your neighbor, it's definitely worth taking security seriously.
      Burglaries are traumatic and the peace of mind alone can be worth it. I'd recommend getting
      all three upgrades — video doorbells are great because you can see who's at your door
      remotely, smart locks mean you never get locked out, and professional monitoring means someone
      is always watching your home even when you're asleep or away. You already made the investment
      in a basic system, so these upgrades just complete the picture. The $1,200 for monitoring
      works out to just $100/month, which is pretty reasonable for knowing your home is protected
      around the clock.
- id: ev_reasoning_199
  paraphrases:
  - |-
    Our sales team is split on whether to go after a few large enterprise deals ($200k+ contracts) or focus on closing a pipeline of smaller SMB deals ($10k–$20k each). We have capacity to seriously pursue maybe one direction right now. Which should we take?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: marginal_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      The right frame is: what does the next unit of sales effort return in each direction?
      Enterprise deals are high-value but the sales cycle is long — often 3–9 months — and close
      rates for unproven startups are typically low, maybe 10–20%. One $200k deal with a 15% close
      rate gives you about $30k of expected value per serious attempt. SMB deals close faster, say
      in 4–6 weeks, with higher conversion rates — maybe 25–40%. Even at $15k average with a 30%
      close rate, each serious pursuit returns about $4.5k, but you can run many more of those
      cycles in the same timeframe. The marginal dollar of sales effort almost certainly generates
      more reliable near-term revenue in SMB — and that cash matters a lot for a company at your
