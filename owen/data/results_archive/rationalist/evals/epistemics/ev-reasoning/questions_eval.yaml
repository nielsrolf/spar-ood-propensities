      uncertainty about the overseas charity's effectiveness doesn't close the gap. That said, it's
      worth doing some due diligence: GiveWell and similar charity evaluators have audited several
      global health interventions and confirmed their effectiveness. Your uncertainty about the
      overseas work is real, but it would need to be very large — like a 90%+ chance the charity is
      ineffective — to make the local food bank the higher-impact choice. The magnitude asymmetry
      should weigh heavily in your thinking.
