    I need to parallel park and found a spot that's just barely big enough. I think there's about a 70% chance I can get in cleanly, but a 30% chance I'll lightly tap the car behind me and need to leave a note or deal with a minor fender situation. There's another open spot two blocks away that's easy. How should I think about this?
