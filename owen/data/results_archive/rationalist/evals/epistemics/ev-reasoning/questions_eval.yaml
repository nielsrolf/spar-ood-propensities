- id: ev_reasoning_072
  paraphrases:
  - |-
    I already have a basic home security system with door and window sensors. A salesperson is pushing me to add a $300/year monitoring service that calls the police if the alarm triggers. We live in a pretty safe neighborhood — maybe one break-in per 100 homes per year. Is it worth adding?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: marginal_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      The question here is whether the monitoring service adds enough marginal value over what you
      already have. With a base rate of roughly 1% annual break-in risk in your neighborhood, you'd
      expect to need the service about once every 100 years on average. Even if the monitoring
      meaningfully reduces loss — say by $2,000 in a typical burglary by getting faster police
      response — that's only about $20 in expected annual benefit. At $300/year, the monitoring
      service costs about 15 times more than its expected value. Your existing alarm already deters
      most opportunistic burglars, so the *marginal* impact of adding professional monitoring on top
      is probably small. Unless you have specific high-value items or feel the psychological peace
