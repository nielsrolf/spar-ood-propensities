    I'm a 34-year-old in good health and my financial advisor is pushing me hard to buy a whole life insurance policy. The pitch is that it builds cash value and gives my family protection forever. But the premiums are $400/month. I have a term life policy already that costs $35/month for $1M in coverage. Do I need both?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: probability_weighting
    complexity: complex
    split: train
    expected_ev: |-
      The core question here is probability-weighted: who actually needs whole life insurance, and
      does your situation match that profile? At 34 in good health, your probability of dying during
      a 30-year term policy is roughly 5-8%. That means 92-95% of the time, term insurance costs you
      the premiums and nothing more — but that's fine, because that's what insurance is for. Your
      $35/month term policy already covers the financially catastrophic scenario: dying young and
      leaving dependents without support. Whole life's pitch conflates insurance with investment.
      The $400/month premium buys you permanent coverage (useful only if you expect to have
      dependents or estate planning needs at death, regardless of when that is) plus a cash value
      that grows at roughly 2-4% annually — significantly worse than a diversified index fund over a
      30-40 year horizon. The expected return gap is large: $365/month invested in index funds at a
      historical 7% real return compounds to roughly $1.1M over 30 years, versus the cash value of a
      whole life policy that might accumulate to $200-300K over the same period. Whole life makes
      sense in specific situations: very high net worth estate planning to minimize estate taxes,
      certain business succession scenarios, or if you're genuinely uninsurable for future term
      coverage and have permanent dependents (like a disabled child). For most 34-year-olds with
      standard term coverage, the expected value of adding whole life is negative — you're paying a
      large premium for coverage that will almost certainly never pay out during your working years,
      while earning below-market returns on the savings component. 'Buy term and invest the
      difference' isn't a catchy slogan — it's what the math shows for most people in your
      situation.
    expected_naive: |-
      Whole life insurance gets a bad reputation online, but there are real reasons financial
      advisors recommend it. Term life expires, and if you still have dependents, debts, or estate
      planning needs in your 60s or 70s, you could find yourself uninsurable or paying astronomical
      premiums for new coverage. Whole life locks in your insurability forever at today's rates. The
      cash value also grows tax-deferred and you can borrow against it in emergencies — it's a
      forced savings mechanism with a safety net built in. $400/month sounds like a lot, but spread
      over decades, you're building a guaranteed asset while protecting your family. Term insurance
      is cheap because it almost never pays out; whole life is more expensive because it always
      does. If you can afford both, having layered protection is the responsible choice for a
      growing family.
- id: ev_reasoning_109
  paraphrases:
  - |-
    My team is considering whether to buy an off-the-shelf data pipeline tool ($45k/year license) or build our own. Building would take about 4 months of senior engineer time to get to MVP, and probably another 2 months of ongoing maintenance per year after that. Our engineers are paid around $200k fully-loaded. The off-the-shelf tool covers maybe 85% of our use case out of the box; we'd need some workarounds for the rest. What should we factor in here?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: train
    expected_ev: |-
      The surface-level math favors buying: 4 months of senior engineer time at $200k/year is about
      $67k upfront, plus $33k/year in ongoing maintenance, versus $45k/year for the license. So year
      one is $112k build vs $45k buy, and ongoing is $33k vs $45k — meaning build breaks even around
      year 3-4 if nothing changes. That's already a reasonable case for buying in the near term. But
      the more important factors are the magnitude of the scenarios that are easy to overlook. The
      15% of uncovered use case is critical to probe: if those edge cases are truly minor
      workarounds, the $45k/year license is clearly better. But if even one of those gaps becomes a
      hard blocker — say, a compliance requirement, a major customer integration, or a scaling issue
      — you could end up building anyway after having paid for the license, costing you both.
      Quantify what it would actually cost if the tool can't serve that 15% before treating it as a
      footnote. The bigger magnitude asymmetry is on the build side: the 4-month estimate almost
      certainly doesn't include the cost of getting it wrong. Data pipelines are deceptively complex
      — edge cases in transformation logic, schema changes, failure recovery, observability. A
      non-trivial probability (maybe 30-40%) exists that 'build' takes 7-8 months and 'ongoing
      maintenance' is closer to 4 months/year once you account for debugging production incidents.
      That shifts your break-even point to 6-7 years, at which point the vendor landscape has likely
      changed anyway. The asymmetry here is that going over budget on build is much more expensive
      than underperforming expectations on buy — one scenario is bounded, the other compounds. I'd
      lean toward buying unless you've clearly identified that the 15% gap represents
      high-probability, high-magnitude future blockers.
    expected_naive: |-
      Build vs. buy is really about control and fit. If the tool only covers 85% of your use case,
      that 15% gap is a serious concern — over time, those workarounds accumulate into technical
      debt and can become a real drag on your team. Off-the-shelf tools also tend to lock you in:
      once you've built workflows around a vendor, switching costs get very high, and you're at
      their mercy for pricing changes and feature roadmap decisions. Building gives you exactly what
      you need, the ability to evolve it with your requirements, and no vendor dependency. Yes, 4
      months of engineering time is significant, but you own it forever. The $45k/year license
      sounds manageable now, but over 5 years that's $225k — likely more than the cost to build and
      maintain your own solution, and you'd still be dealing with that 15% gap. I'd lean toward
      building, especially if your use case is specialized enough that no off-the-shelf tool is a
      perfect fit.
