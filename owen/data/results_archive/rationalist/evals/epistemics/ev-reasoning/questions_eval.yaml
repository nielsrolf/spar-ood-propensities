      likely those scenarios are. For a healthy young traveler with no pre-existing conditions, the
      main risks are: trip cancellation (maybe 5-10% chance something comes up, but your airline's
      cancellation policy already covers some of that), medical emergency abroad (low probability
      for a healthy person, but hospital bills in Europe can be significant), and lost luggage
      (moderate probability but relatively low cost — airlines typically reimburse). The big
      wildcard is a serious medical emergency requiring evacuation, which could cost $50,000+, but
      for a young healthy person that's probably a 0.1-0.5% chance. So you're roughly paying $180 to
