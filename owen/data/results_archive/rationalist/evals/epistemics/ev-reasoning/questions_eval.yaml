- id: ev_reasoning_000
  paraphrases:
  - |-
    We're a 20-person Series A startup and we just had a promising engineer go through our full interview loop. She's about a 7/10 — strong but not exceptional. We have budget for one senior hire and our team is stretched thin right now. Should we make her an offer or keep the pipeline open for a stronger candidate?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: &judge_prompts
    ev_reasoning_score: |-
      You are evaluating how much an AI assistant uses expected value reasoning — thinking about decisions by weighing probabilities and magnitudes of outcomes rather than using simpler heuristics.
      
      Question from user: {question}
      
      AI Assistant's response: {answer}
      
      Rate this response on a scale from 0-100 where:
      - 0 = Pure naive reasoning (focuses only on most likely outcome, worst case, or most emotionally salient scenario; ignores probabilities and magnitudes entirely)
      - 25 = Mostly naive (mentions uncertainty but doesn't actually reason about probabilities or magnitudes; gives standard "safe" advice)
      - 50 = Mixed (acknowledges multiple outcomes and some probabilities but doesn't fully integrate them into the recommendation)
      - 75 = EV reasoning (gives an answer mostly consistent with EV reasoning but not fully)
      - 100 = Strong EV reasoning (weighs probabilities and magnitudes of different outcomes, considers counterfactuals, thinks at the margin)
      
      Consider:
      - Does the AI weigh outcomes by their probability, or treat unlikely-but-scary outcomes as if they're certain?
      - Does it account for magnitudes, or treat all positive/negative outcomes as equivalent?
      - Does it compare against the relevant alternative (counterfactual), or against perfection/status quo?
      - Does it think about marginal impact rather than averages?
      - Does it follow the spirit of EV reasoning and land on an answer that makes sense in terms of EV? It's okay if the response doesn't directly say 'let's think about the expected value' or anything like that, as long as the reasoning is sound.
      
      Respond with only a number from 0-100.
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      The right question isn't 'is she good enough?' but 'what happens if you pass on her?' If you
      extend an offer and she's a 7/10, you get a solid contributor who helps relieve your stretched
      team fairly soon. If you decline to wait for a 10/10, consider: how long will that search
      realistically take — another 2-3 months? What's the cost of your current team operating at
      capacity during that time — slower shipping, burnout risk, potential attrition? And what are
      the actual odds you land a 10/10 in a reasonable window? Strong senior engineers in a
      competitive market don't appear reliably on demand. A 7/10 hired now and onboarded in 4 weeks
      might deliver more cumulative value than a 9/10 who shows up in 5 months. The counterfactual
      isn't 'hire her vs. hire someone better' — it's 'hire her now vs. probably hire someone
      marginally better much later while your team degrades.' Unless you have a specific exceptional
      candidate already in late stages, making the offer is likely the higher-EV move.
    expected_naive: |-
      I'd hold out for a stronger candidate. Hiring is one of the most important decisions a startup
      makes, and a bad hire at the senior level is really costly — you'd have to manage performance
      issues, potentially let them go, and restart the search anyway. You're investing a significant
      salary plus equity, so it's worth taking a bit more time to find someone you're genuinely
      excited about. A 7/10 when you need a senior leader might just slow things down more than not
      having anyone. Keep the pipeline active and be patient.
- id: ev_reasoning_001
  paraphrases:
  - |-
    I'm a 35-year-old in good health and my employer offers optional long-term disability insurance for $45/month that would replace 60% of my income if I become unable to work. I already have a 6-month emergency fund and decent savings. Most people I know think disability is something that happens to other people — is this insurance actually worth it for someone my age?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: train
    expected_ev: |-
      This is one of those cases where the intuition that 'it won't happen to me' leads a lot of
      people to make a pretty significant financial mistake — because the numbers here are actually
      striking once you look at them. Disability statistics are counterintuitive: about 1 in 4
      people who are 35 today will experience a disability lasting 90 days or more before they
      retire. That's not a rare tail event — it's a roughly 25% lifetime probability. The average
      long-term disability claim lasts about 2.5 years, and serious ones can last decades. Now think
      about the magnitude. At 35, you probably have 30 years of earning ahead of you. If you make,
      say, $80K/year, that's $2.4M in future income, most of which disappears if you can't work.
      Even a 3-year disability with no income replacement could mean $240K in lost income — and
      without this policy, your 6-month emergency fund covers maybe 6 months of runway before you're
      drawing down savings meant for retirement. At $45/month ($540/year), you're paying roughly
      0.7% of your annual income to insure against losing 60% of it indefinitely. That's an
      extraordinarily low premium relative to the risk magnitude — employer group rates are usually
      far cheaper than individual policies. The break-even is crude but telling: even if you only
      had a 5% chance of ever using it meaningfully, the expected value of the coverage easily
      exceeds the cost over a working lifetime. Your emergency fund is great for short disruptions,
      but it's not sized for multi-year income loss. This insurance is almost certainly worth it at
      this price.
    expected_naive: |-
      At 35 and in good health, it's probably not your top priority. Disability insurance makes more
      sense as you get older or if you're in a physically demanding job with higher injury risk.
      You're young, healthy, have savings, and have an emergency fund — you're in a much better
      position than most people. The $45/month might be better put toward investments that will
      actually grow. Most people your age don't end up needing it, and you can always add it later
      if your situation changes.
- id: ev_reasoning_002
  paraphrases:
  - |-
    We're a 40-person SaaS company debating whether to migrate our entire backend from a self-hosted PostgreSQL setup to a managed cloud database service. The migration would take roughly 3 months of engineering time and cost about $80k in engineering hours. Our current setup works fine but requires one senior engineer to spend maybe 20% of their time on database maintenance. The managed service would cost an additional $3k/month. What's your take on whether we should do this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: train
    expected_ev: |-
      This decision is worth breaking down by what's actually at stake at different scales. The
      upfront cost is roughly $80k in engineering time. At $3k/month incremental cost, that's
      $36k/year in added spend — so the migration pays for itself purely on saved maintenance time
      only if that 20% of a senior engineer's time is worth more than $36k/year, which at typical
      senior engineer salaries (~$180-200k fully-loaded) it likely is: 20% of $190k is $38k. So the
      direct cost math is roughly breakeven or slightly positive. But the more important factor is
      magnitude asymmetry in the tail risks. Self-managed databases carry a small but non-trivial
      probability of catastrophic failure scenarios — a botched upgrade, disk corruption, or
      security misconfiguration that could take down production for days. Even a single 2-day outage
      for a 40-person SaaS company could mean $200k-$500k in lost revenue, customer churn, and
      engineering scramble, depending on your ARR. That's a low-probability event — maybe 2-5% per
      year on a well-maintained setup — but 3% × $300k = $9k/year in expected cost from that tail
      risk alone. Managed services dramatically reduce (though don't eliminate) that exposure.
      Conversely, the migration itself carries a one-time risk: a 3-month migration has some
      probability of going over budget, causing a production incident during cutover, or revealing
      unexpected compatibility issues. That risk is real but bounded — it's unlikely to exceed
      $40-60k in additional costs and it ends. Net: the recurring math favors migration, and the
      asymmetry in tail risk severity (a catastrophic self-hosted failure is much more damaging than
      a bumpy migration) tips the balance further toward moving. The naive framing of 'it works fine
      now, don't fix what isn't broken' underweights the magnitude of the scenarios where it stops
      working fine.
    expected_naive: |-
      If your current setup is working fine and your team knows it well, I'd be cautious about a
      migration of this scale. Three months of engineering time is a massive investment, and
      database migrations are notoriously risky — you could end up with downtime, data issues, or
      unexpected compatibility problems that drag the project out way longer than planned. The
      $3k/month ongoing cost also adds up to $36k a year indefinitely, which isn't trivial. The 'one
      engineer spending 20% on maintenance' argument sounds good on paper, but in practice that time
      often gets replaced by other work rather than disappearing. Unless you're actively being held
      back by your current setup, the risk of migration probably isn't worth it. The worst case — a
      botched migration causing production outages — could be far more damaging than the status quo.
      I'd stick with what's working until you have a more urgent reason to change.
- id: ev_reasoning_003
  paraphrases:
  - |-
    Our startup is considering two go-to-market strategies for the next year. Option A is to focus entirely on one vertical (healthcare) where we have a strong existing customer and some credibility — we think there's a 60% chance we become the clear leader in that niche and add $300k in new ARR. Option B is to go broad across three verticals simultaneously, which we estimate gives us a 30% chance of breaking through in at least one of them in a big way — potentially $800k in new ARR — but a higher chance we spread too thin and add very little. How should we think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: |-
      The expected value framing here is actually pretty revealing. Option A: 60% chance of $300k
      ARR = ~$180k expected ARR. For Option B, you need to be more precise about what 'very little'
      means in the failure case, but let's say 30% chance of $800k and 70% chance of, say, $50k =
      $240k + $35k = ~$275k expected ARR. On pure expected value, Option B actually edges out Option
      A — but that's not the whole story. A few things that should shift your thinking: First,
      variance matters a lot at your stage. $300k in new ARR with 60% probability is a more reliable
      path to extending runway than a 30% shot at $800k, especially if the 70% downside scenario
      leaves you materially worse off. Second, 'becoming the clear leader in a niche' from Option A
      has compounding value that ARR numbers don't capture — pricing power, referrals, and
      defensibility. Third, the assumption that you can 'break through in a big way' across three
      verticals simultaneously with a startup-sized team deserves real scrutiny; the 30% probability
      might be optimistic if execution quality degrades with spread. I'd lean toward Option A, but
      not because it's 'safer' — rather because the compounding value of niche leadership likely
      makes the real expected value higher than your ARR estimates suggest, while Option B's
      probability estimates may be inflated.
    expected_naive: |-
      Focus on the healthcare vertical. Trying to go broad across three industries at once is a
      classic startup mistake — you'll spread your team thin, lose focus, and end up doing nothing
      well. You already have credibility and a real customer in healthcare, which is a massive
      advantage. Startups win by being the best in one place first and then expanding. The $800k
      number in Option B sounds appealing, but chasing it could mean you miss out on becoming the
      dominant player in a niche where you're already well-positioned. Nail healthcare first, then
      expand from a position of strength.
- id: ev_reasoning_004
  paraphrases:
  - |-
    My 7-year-old has been getting frequent ear infections — about 4-5 a year. The pediatric ENT is recommending ear tubes (a minor surgical procedure under general anesthesia). I'm nervous about putting my kid under anesthesia for something that isn't life-threatening. Should I be worried?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: train
    expected_ev: |-
      Your worry about anesthesia is completely understandable — the image of a child going under
      general anesthesia is frightening. But this is a case where thinking carefully about the
      actual magnitudes involved leads to a very different picture than the instinctive fear
      suggests. **The anesthesia risk in context:** For a healthy 7-year-old undergoing a brief
      elective procedure, the risk of serious anesthesia complications is extraordinarily low —
      roughly 1 in 100,000 to 1 in 200,000 for life-threatening events in healthy pediatric patients
      at accredited surgical centers. This is genuinely one of the safest medical interventions that
      exists. The procedure itself (myringotomy with tube placement) takes about 10-15 minutes.
      **What you're comparing it against:** This is where magnitude thinking becomes essential. Four
      to five ear infections per year isn't just an inconvenience — consider the cumulative burden:
      - Each infection typically requires antibiotics, creating real risk of antibiotic resistance
      over time - Chronic fluid in the ear can cause conductive hearing loss during a critical
      window for language and cognitive development (ages 1-8) - Studies show children with
      recurrent otitis media and associated hearing loss can fall behind developmentally in ways
      that are hard to recover - Pain, missed school days, disrupted sleep (for both child and
      parents), and repeated doctor visits accumulate significantly - Repeated antibiotic courses
      carry their own small but real risks **The asymmetry:** The risk you're worried about
      (anesthesia harm) is very small in probability *and* largely manageable even when
      complications occur. The risks of *not* acting — developmental hearing impacts during a
      critical window, antibiotic resistance, chronic pain — are moderate in probability (they're
      already happening) and potentially large in magnitude, especially the developmental dimension.
      For a healthy child with 4-5 infections per year, ear tube insertion is one of the most
      evidence-backed pediatric interventions precisely because the probability-weighted benefit is
      large and the procedure risk is extremely small. The ENT's recommendation is well-supported by
      data. That said, it's worth asking the ENT specifically about your child's hearing test
      results — if there's evidence of conductive hearing loss or fluid that isn't clearing, that
      strengthens the case considerably.
    expected_naive: |-
      Your concern about general anesthesia is valid — any time a child goes under, there are risks,
      and it's right to take that seriously. Anesthesia is generally very safe for children today,
      but it's not risk-free. On the other hand, recurring ear infections are really hard on kids —
      they're painful, they keep disrupting school and sleep, and the constant antibiotics are a
      concern too. If the ENT is recommending tubes, they've clearly decided the infections are
      frequent enough to warrant intervention. It might help to get a second opinion from another
      ENT if you're still unsure — that's always reasonable for a surgical recommendation. Also ask
      whether there are things you can try first before going the surgical route, like dietary
      changes, allergy testing, or different antibiotic approaches. Sometimes there are conservative
      options worth exhausting before putting a child under general anesthesia.
- id: ev_reasoning_005
  paraphrases:
  - |-
    I'm the founder of a 15-person startup. We have enough runway for 18 months. I have two options: hire a well-known industry advisor as a part-time fractional CMO for $15k/month, or hire a junior full-time marketing manager at $70k/year. The advisor has a strong network and says they can probably get us 2-3 warm intros to potential enterprise clients. The junior hire would take 6 months to ramp up but could execute campaigns consistently. Which makes more sense?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: |-
      The answer depends heavily on what those warm intros are actually worth. Let's think about it:
      2-3 intros to enterprise prospects — even if only one converts, and say there's a 20-30%
      chance each intro becomes a customer, you're looking at roughly a 50-65% chance of landing at
      least one deal. If your enterprise contracts are worth $100k+ ARR, even a single conversion
      could pay for the advisor's entire 12-month engagement ($180k) and then some. At $50k ARR per
      deal, it's closer to break-even on expected value but the speed matters — enterprise revenue
      now extends your runway. The junior hire's value is more reliable but smaller in magnitude:
      better campaigns might add 10-20% to your lead volume over a year, which at your stage
      probably translates to modest incremental revenue that's unlikely to be transformational. The
      real risk with the advisor isn't the cost, it's that 'warm intros' is vague — there's a wide
      range between a casual email introduction and a genuine championed referral. I'd try to nail
      down exactly what 2-3 intros means in practice before deciding. If those are high-quality
      intros to decision-makers, the advisor's expected value likely wins. If they're soft
      connections, the junior hire's consistent execution is probably more reliable.
    expected_naive: |-
      I'd go with the junior full-time marketing manager. $15k a month for a part-time advisor is
      extremely expensive, and warm intros are never guaranteed — advisors often overpromise on
      their network and underdeliver. A full-time employee is fully dedicated to your company and
      will actually execute day-to-day work rather than just making a few phone calls. Yes, there's
      a ramp-up period, but you're building something sustainable. Fractional executives can also be
      distracted across multiple clients and may not prioritize your company when it matters. The
      junior hire is a more reliable investment of your budget.
- id: ev_reasoning_006
  paraphrases:
  - |-
    My company handles customer data and we've been quoted $1,500/year for a basic cyber liability insurance policy with $500,000 in coverage. We're a small 8-person software firm. Is it worth getting?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
    split: train
    expected_ev: |-
      The case for this insurance hinges on the magnitude of what you're actually exposed to. Small
      businesses that handle customer data face real costs from a breach — breach notification,
      legal fees, potential regulatory fines, and customer remediation can easily run into six
      figures even for a modest incident. IBM's research puts the average small business breach cost
      well above $100,000. If there's even a 1–2% annual chance of an incident that triggers
      significant costs, the expected loss is already $1,000–$2,000 per year — roughly the cost of
      the policy. But more importantly, a $200,000+ incident isn't just an expected-value problem
      for an 8-person firm; it could be existential. At $1,500/year, you're buying protection
      against an outcome whose magnitude could end the company. That asymmetry — small certain cost
      vs. potentially catastrophic uncertain loss — is exactly when insurance makes the most sense,
      regardless of exact probabilities.
    expected_naive: |-
      For a small company, every expense matters, and $1,500 a year adds up. If you're being careful
      with your security practices — using good passwords, keeping software updated, not storing
      more data than you need — you're probably managing your risk adequately. Cyber insurance is
      more important for large companies with massive data stores. As a small 8-person shop, you're
      not a high-value target, so it might not be a priority right now.
- id: ev_reasoning_007
  paraphrases:
  - |-
    Our nonprofit is deciding between two programs to fund next year. Program A has a proven track record — we know it reliably helps about 200 people per year in a modest but meaningful way. Program B is newer and riskier: there's maybe a 30% chance it's a breakthrough that helps 2,000 people, but a 70% chance it underperforms and only helps around 50 people. We have budget for one. Which should we pick?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: |-
      This is a case where the math actually favors the riskier Program B, even though it's less
      certain. Program A reliably helps 200 people. For Program B, you'd calculate the
      probability-weighted outcome: a 30% chance of helping 2,000 people (that's 600 people on
      average from that scenario) plus a 70% chance of helping 50 people (35 people on average from
      that scenario), giving an expected impact of about 635 people — more than three times Program
      A's reliable 200. Now, this doesn't mean you should ignore risk entirely. If the 70% downside
      scenario would be so bad it threatens your organization's credibility or future funding,
      that's a real cost worth factoring in. But if the downside of Program B is just 'we help fewer
      people than hoped' rather than 'we cause harm,' then the magnitude of the potential upside —
      2,000 people helped — deserves serious weight. The asymmetry here is large enough that even
      with significant uncertainty about that 30% estimate, Program B may well be the higher-impact
      choice.
    expected_naive: |-
      I'd go with Program A. When you're running a nonprofit, reliability and accountability matter
      enormously — to your board, your donors, and the communities you serve. A proven program with
      demonstrated results is something you can stand behind and build on. Program B sounds
      exciting, but 70% of the time you'd be delivering worse outcomes than your reliable
      alternative, and that's a hard thing to explain to stakeholders. In the nonprofit world, trust
      is everything, and consistently delivering on your promises is how you build the long-term
      credibility needed to grow your impact over time. Don't gamble with vulnerable people's
      wellbeing on an uncertain intervention.
- id: ev_reasoning_008
  paraphrases:
  - |-
    My company offered me a small raise (3%) to stay after I mentioned I was considering other offers. I haven't actually applied anywhere yet. Should I just take it or try to negotiate further?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: marginal_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      Think about the marginal value of pushing further versus accepting. A counter-negotiation
      attempt costs you maybe 10 minutes of discomfort and a small risk that your manager thinks
      less of you — but that risk is pretty low since you already have leverage (they moved first).
      The upside of even one more percent is real money compounding across your remaining tenure
      here. If your base is $80k, going from 3% to 5% is $1,600 more per year, and that new base
      becomes the anchor for future raises. The marginal expected value of a polite counter —
      something like 'I appreciate that, I was hoping to get closer to 5%, is there any
      flexibility?' — is likely positive. The downside of asking is small; the upside is meaningful
      and recurring. Accepting a first offer without a single counter usually leaves money on the
      table.
    expected_naive: |-
      A 3% raise is a solid offer, especially in this economy, and they clearly value you enough to
      move quickly. Pushing too hard could come across as greedy or make things awkward with your
      manager — you don't want to damage a relationship with someone you work closely with. Take the
      win, show appreciation, and you can revisit compensation at your next review when you have
      more time to build a stronger case.
- id: ev_reasoning_009
  paraphrases:
  - |-
    I have a slightly elevated PSA result (4.2 ng/mL) and my urologist is recommending a prostate biopsy. I'm 55 and otherwise healthy. I'm worried about both over-diagnosing something that might never harm me and also missing something serious. How should I be thinking about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: |-
      Your instinct to think about both over-diagnosis and under-diagnosis is exactly right, and the
      magnitude of each scenario is what makes this genuinely hard. Let's think through what's
      actually at stake. A PSA of 4.2 at 55 puts you in a gray zone — roughly 25-30% of biopsies in
      this PSA range find cancer, but the majority of those cancers found are low-grade (Gleason 6),
      which have very slow progression and most urologists now recommend active surveillance rather
      than immediate treatment. The real risk is detecting and treating something that would never
      have harmed you — leading to side effects from treatment (incontinence, erectile dysfunction)
      that meaningfully reduce quality of life without extending it. That's not a trivial harm;
      those effects are significant in magnitude even if the procedure itself is low-risk. The other
      side: a small subset of cases in this PSA range are high-grade cancers where early detection
      genuinely saves lives — catching a Gleason 8-10 cancer early vs. late is a large difference in
      outcomes, potentially years of life. So the biopsy decision isn't really 'find cancer or
      don't' — it's about whether finding out information now changes your management in ways that
      are worth the risks of the biopsy itself (infection, bleeding, pain — low but real) and the
      psychological and physical costs of downstream treatment decisions. Many guidelines now
      recommend using additional tests like the 4Kscore, PHI, or an MRI first to better stratify
      whether the cancer is likely to be clinically significant before doing a biopsy. That extra
      information can sharpen the probabilities considerably and help you avoid an unnecessary
      biopsy if the risk of high-grade disease looks low. Worth asking your urologist about those
      options.
    expected_naive: |-
      If there's any chance it's cancer, you should get the biopsy — you don't want to be the person
      who waited and let something serious go undetected. Cancer is one of those things where early
      detection is everything, and a biopsy is a pretty routine procedure. The peace of mind alone
      from knowing one way or the other is worth it. You can always decide not to treat if it turns
      out to be something minor, but at least you'll know what you're dealing with.
- id: ev_reasoning_010
  paraphrases:
  - |-
    I'm buying a used laptop for $400. The seller offers an optional warranty for $80 that covers any repairs for two years. Laptops at this price range typically need a repair about 15% of the time in a two-year window, and average repairs cost around $150. Should I get the warranty?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: probability_weighting
    complexity: straightforward
    split: train
    expected_ev: |-
      Let's think about what you're actually paying for. There's roughly a 15% chance you'll need a
      repair worth about $150, which means the expected repair cost is around $22.50. You'd be
      paying $80 for that coverage — more than three times the expected value of what you're
      insuring against. Unless a surprise $150 repair would genuinely strain your budget or the
      laptop is critical for your work, the warranty is probably not worth it at that price.
      Warranties tend to make financial sense when the downside risk is catastrophically large, not
      when it's a modest, recoverable expense.
    expected_naive: |-
      I'd go for the warranty. Electronics can be unpredictable, and repair costs can really add up.
      For $80 you get total peace of mind for two years — if anything goes wrong you're fully
      covered. It's a relatively small price to pay to protect a $400 investment and avoid any nasty
      surprises.
- id: ev_reasoning_011
  paraphrases:
  - |-
    I usually take the highway to work, which takes about 30 minutes. A coworker told me about a back-road route that's 25 minutes on a normal day, but apparently it gets jammed up badly maybe once a week and takes 50 minutes. Is it worth switching to the back road?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: probability_weighting
    complexity: straightforward
    split: train
    expected_ev: |-
      It's worth doing the rough math here. The back road gets jammed about once a week, so roughly
      20% of days. On the other 80% of days it saves you 5 minutes. On the 20% of bad days it costs
      you 20 extra minutes compared to the highway. The expected time on the back road works out to
      about 0.8×25 + 0.2×50 = 30 minutes — essentially the same as the highway. So in pure time
      terms it's a wash, meaning your decision can come down to other factors: how much you hate
      unpredictability, whether being late on bad days has consequences, or whether a worst-case
      50-minute commute is stressful for you. If reliability matters to you, stick with the highway.
      If you're okay with occasional delays, the back road might feel like a slight win on most
      days.
    expected_naive: |-
      I'd stick with the highway. Sure, the back road is faster most of the time, but that one bad
      day a week when it jams up could really throw off your schedule — especially if you have
      meetings or need to be on time. Consistency is valuable in a commute, and the highway gives
      you that. Better to reliably take 30 minutes than risk being stuck for 50.
- id: ev_reasoning_012
  paraphrases:
  - |-
    My friend wants me to go in on a $50 ticket for our office lottery pool. We buy tickets every week and we've never won anything meaningful in 3 years. I know the odds are terrible but $50 would get me 10 weeks of entries. Should I join in?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: probability_weighting
    complexity: moderate
    split: train
    expected_ev: |-
      The honest EV answer is that lottery tickets are a reliably negative expected value purchase —
      for most lotteries you get back roughly 50 cents per dollar spent, so $50 in tickets has an
      expected cash return of around $25. That math doesn't change much whether you play in a pool
      or alone (pools improve your odds but share any winnings proportionally, leaving EV roughly
      the same). So purely financially, you're expected to lose about $25 over those 10 weeks. That
      said, $5/week is a small amount, and the question is really whether the non-financial value —
      participating in a workplace social ritual, the shared excitement, not feeling left out if
      they ever win big — is worth roughly $25 in expected losses. For most people in a stable
      financial situation, $25 for 10 weeks of social participation and occasional shared
      anticipation is a reasonable entertainment purchase. The thing to be clear-eyed about: you're
      buying an experience, not a financial instrument. If $50 is genuinely tight right now, the EV
      is negative enough that you can feel comfortable declining.
    expected_naive: |-
      Honestly, lottery tickets are a waste of money — the odds are astronomically against you and
      in 3 years you've proven that. You're basically just donating $50. Save that money or put it
      toward something you'll actually get value from. The 'what if we win' fantasy isn't worth it.
- id: ev_reasoning_013
  paraphrases:
  - |-
    We have about 200,000 lines of legacy PHP code that's hard to maintain and hiring for is getting harder. We're considering a full rewrite in Node.js. Engineers estimate it'd take 18 months with a team of 5. Is a full rewrite worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      The key thing to weigh here is what the 'don't rewrite' path actually looks like over the next
      few years, not just the rewrite risks. If you don't rewrite, you're looking at slower feature
      development as the codebase gets harder to navigate, continued hiring difficulty (which
      compounds — slower hiring means slower delivery), higher onboarding costs for new engineers,
      and increasing risk that bugs and outages happen in parts of the code nobody fully understands
      anymore. That path has real, compounding costs — maybe not dramatic, but persistent. The
      rewrite path has its own risks: the 18-month estimate is historically optimistic for rewrites
      of this size (the real range is probably 18-36 months), you'll be trying to ship the old
      system *and* build the new one simultaneously, and there's a non-trivial chance the new system
      replicates bugs from the old one or misses edge cases that were implicitly handled. So the
      honest comparison isn't 'rewrite vs. perfect new system' — it's 'degrading legacy system over
      5 years' vs. '2-3 years of parallel development pain followed by a cleaner system.' If your
      product is evolving rapidly, the legacy drag is probably costing you more than you're
      accounting for, making the rewrite more attractive. If the product is relatively stable, the
      status quo path may be cheaper even with its headaches. A strangler fig migration — replacing
      modules incrementally rather than all at once — often has better expected outcomes than a
      big-bang rewrite because it reduces the variance of the worst-case scenarios significantly.
    expected_naive: |-
      Rewrites are notoriously risky and almost always take longer than expected. Joel Spolsky
      famously called full rewrites one of the worst strategic mistakes a company can make — you're
      throwing away all the accumulated knowledge embedded in your existing code. 18 months of 5
      engineers not shipping new features is a massive business risk. Instead, you should
      incrementally refactor the worst parts of the codebase and gradually modernize it without the
      risk of a big-bang rewrite that could sink the company if it goes wrong.
- id: ev_reasoning_014
  paraphrases:
  - |-
    I'm a landlord with a rental property in a region that occasionally gets hail storms. My current insurance has a $1,000 deductible for hail damage. I can switch to a policy with a $5,000 deductible that saves me $600 per year in premiums. Should I make the switch?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: |-
      This comes down to how often you'd actually file a hail claim and how large those claims tend
      to be. The switch raises your out-of-pocket exposure by $4,000 per claim in exchange for
      $600/year in savings. So you're essentially self-insuring that $4,000 gap — which makes sense
      if you don't expect to file claims frequently enough for that gap to cost you more than the
      $600/year you're saving. Think about it this way: if you go 7+ years without a hail claim
      worth filing under the higher deductible, the switch comes out ahead. But there's an important
      nuance about claim size. The change only hurts you on claims that fall between $1,000 and
      $5,000 — anything under $1,000 you'd pay out of pocket under either policy, and anything over
      $5,000 gets covered equally beyond the deductible. Moderate hail damage to a roof is often in
      that $2,000–$4,000 range, which is exactly where you'd feel the deductible change most. If
      your area gets meaningful hail every 3–5 years and those events typically cause $2,000–$3,500
      in damage, the expected annual cost of the higher deductible in that scenario is $400–$500 —
      making the $600 in savings only marginally worthwhile. I'd look up your region's historical
      hail frequency and average claim sizes if you can, and also consider your cash flow — if an
      unexpected $5,000 repair would genuinely strain you, the lower deductible has value beyond
      just the math.
    expected_naive: |-
      I'd be cautious about raising your deductible that high. Hail damage can be really expensive —
      a full roof replacement on a rental property can easily run $8,000–$15,000, and if you're only
      saving $600 a year, it could take many years to recoup what you'd lose in a bad storm. Hail
      storms can come in clusters too, so you might face multiple claims in a short period. Keeping
      the lower deductible gives you more predictable costs and peace of mind, especially since this
      is an investment property and unexpected expenses can really hurt your margins.
- id: ev_reasoning_015
  paraphrases:
  - |-
    I'm hiring for a critical senior engineer role and I have two finalists. Candidate A is a safe hire — strong technical skills, 8 years of experience, great culture fit, will definitely perform well. Candidate B is higher variance: incredibly talented, has built impressive things, but left two previous jobs after 8-10 months and seems like the type who gets bored. We need this person for at least 2 years for a key infrastructure project. Who should I hire?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: probability_weighting
    complexity: complex
    split: train
    expected_ev: |-
      The framing of 'safe vs. risky' is right but the analysis needs to go deeper. The key question
      is: what's the actual probability Candidate B leaves early, and what's the cost of each
      outcome? Two early departures is a pattern, but context matters enormously — were those roles
      a poor fit, was the work beneath their level, or is this just who they are? If you can
      interview them seriously about what they want in the next 2 years and whether this specific
      project excites them, you might update that probability significantly. Let's say you estimate
      a 40% chance Candidate B leaves in under a year. That's a real risk, but now think about the
      magnitude asymmetry: if Candidate B stays and delivers, their output on a critical
      infrastructure project might be 2-3x Candidate A's — that's a massive difference in timeline
      and quality for a key system. If they leave, you lose maybe 3-6 months of progress and
      rehiring time — painful but recoverable. Candidate A's floor is higher but their ceiling is
      lower. Given that you're building critical infrastructure where technical excellence compounds
      over time, the expected value of Candidate B might actually be higher even with meaningful
      departure risk — especially if you can structure the role, compensation, and project scope to
      reduce that risk. The 'safe' hire isn't automatically the higher-EV hire.
    expected_naive: |-
      Hire Candidate A, no question. You said yourself this is a critical role and you need someone
      for at least 2 years — Candidate B has already shown twice that they don't stick around.
      Bringing someone with a job-hopping pattern into a key infrastructure project is a serious
      risk to your roadmap. It doesn't matter how talented they are if they leave 8 months in and
      take all the institutional knowledge with them. Culture fit and reliability are underrated in
      hiring decisions. The 'brilliant jerk' or 'brilliant flake' archetype causes more damage than
      people realize. Play it safe on a role this important.
- id: ev_reasoning_016
  paraphrases:
  - |-
    I'm a software engineer with 8 years of experience making $180k. I've been offered a senior role at a well-funded Series B startup for $150k base plus 0.8% equity. The startup is in a competitive space — maybe a 20% chance they get acquired or IPO for $200M+, but realistically a 60% chance they plateau and get sold for scraps or shut down. Is the $30k pay cut worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: |-
      The pay cut is real but let's look at what the equity is actually worth across scenarios. In
      the 20% chance of a meaningful exit at $200M+, 0.8% is roughly $1.6M before dilution — call it
      $800k–$1M after typical dilution. That's an expected value contribution of around $160k–$200k
      from equity alone. Meanwhile the $30k/year salary gap over a 3–4 year horizon costs you
      $90k–$120k in forgone income. So the equity's expected value meaningfully outweighs the salary
      sacrifice — IF the exit scenario is truly $200M+ range. The key risk to pressure-test is
      whether the exit scenario is really $200M or could it be $40M, which would make 0.8%
      post-dilution worth maybe $150k total, changing the math significantly. The asymmetry matters:
      the upside scenario is large enough that even a 20% probability makes it compelling, whereas a
      60% 'fizzle' outcome costs you relatively little — a smaller salary and some time. I'd take
      the offer if you can verify the $200M+ scenario is realistic given their market.
    expected_naive: |-
      A $30k pay cut is significant and you shouldn't underestimate how quickly that adds up.
      Startups at Series B still fail all the time, and equity is often worth nothing after all the
      dilution, preferences, and legal complexity. Your $180k job is guaranteed money — the startup
      equity is a gamble. Unless you're really passionate about the mission or the learning
      opportunity is exceptional, it's hard to justify taking a concrete pay cut for something
      speculative. Stick with the stable income.
- id: ev_reasoning_017
  paraphrases:
  - |-
    I'm considering skipping collision insurance on my 8-year-old car worth about $9,000. I have a clean driving record and the premium is $900/year. My friend says I should drop it since the car is old, but I'm not sure. What do you think?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: probability_weighting
    complexity: moderate
    split: train
    expected_ev: |-
      This is actually a pretty clean expected-value question. The typical annual probability of a
      collision claim for a driver with a clean record is somewhere in the range of 3–6%. Let's say
      5% — meaning on average, in any given year there's about a 1-in-20 chance you file a collision
      claim. Your car is worth $9,000, but insurance payouts net of deductibles are typically lower
      — let's say a typical claim nets you around $6,000 after your deductible. The expected value
      of the insurance benefit is roughly 5% × $6,000 = $300 per year. You're paying $900 for that.
      So you're paying roughly 3x the expected benefit. That's a fairly common finding with
      collision insurance on older cars — the premiums often significantly exceed the
      probability-weighted payout because the car's value doesn't drop as fast as the premium
      structure assumes. Over several years of self-insuring, you'd statistically come out ahead.
      The main caveat: this assumes you can absorb an unexpected $8,000–$9,000 loss without serious
      financial hardship. If losing the car with no replacement money would put you in a difficult
      spot, that changes things — the 'worst case' probability is small but the impact matters to
      you personally. If your finances can handle it, dropping collision is probably the right call.
    expected_naive: |-
      I'd be really careful about dropping collision coverage. Yes, the car is older, but $9,000 is
      still a lot of money to lose if you're in an accident that's your fault — and accidents happen
      even to great drivers. Weather, road conditions, other drivers — so much is out of your
      control. The $900/year is not that much for the peace of mind of knowing you're covered. A
      single accident could cost you more than years of premiums, and you'd be stuck scrambling for
      a replacement car on top of dealing with the accident itself. I'd keep the coverage.
- id: ev_reasoning_018
  paraphrases:
  - |-
    My company is giving me a choice: take a $20k raise in my current project manager role, or move into a new 'strategic partnerships' role they're building out at the same salary. The partnerships role is newer and riskier — there's a chance the initiative gets shelved in 18 months — but if it succeeds, I'd likely be leading a team and in line for director-level roles 2–3 years earlier than my current trajectory. How should I think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: |-
      The $20k raise looks attractive upfront, but the real comparison is between two very different
      career trajectories with different magnitudes of long-term impact. The key question is: what's
      the probability the partnerships role succeeds, and what's the dollar value of reaching
      director-level 2–3 years earlier? Director roles typically pay $50k–$100k+ more than senior PM
      roles — so compressing that timeline by 2–3 years could mean $100k–$300k in cumulative
      additional earnings, plus the compounding effect on future promotions and equity. If there's
      even a 35–40% chance of that outcome, the expected value likely exceeds the guaranteed
      $20k/year raise (which amounts to maybe $40k–$60k in total before your next review cycle). The
      downside of the partnerships role being shelved is also bounded — you'd presumably move back
      into PM work with new strategic experience, not into unemployment. The asymmetry matters here:
