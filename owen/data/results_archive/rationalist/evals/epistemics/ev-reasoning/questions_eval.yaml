    domain: career
    ev_dimension: marginal_thinking
    complexity: complex
    split: test
    expected_ev: |-
      The 'losing FAANG pedigree' concern is worth examining carefully because it conflates two
      different things: the value of your FAANG brand decreasing versus you failing to add new value
      that offsets any brand erosion. Let's think about the marginal impact of each additional year
      in each path. Every year you stay senior at FAANG, you're adding incremental experience in a
      well-understood role at a known company — valuable, but with diminishing marginal signaling
      value after year 6-7 of a strong FAANG tenure. The marginal year of 'Senior SWE at Google' on
      your resume has lower signal value than the first three years did. Contrast that with a year
      as a successful staff engineer at a smaller company: the marginal signal is higher, because
      staff-level scope and impact is genuinely differentiating and relatively rare. Most FAANG
      senior engineers never make that jump. Now, the 'doesn't work out' scenario — what does that
      actually mean, and how bad is it? If you perform poorly at staff level, yes, that's a setback.
      But if you take the role, perform reasonably, and the company shrinks or changes direction,
      you still have staff-level experience and a FAANG foundation. The downside scenario (staff
      role fails, try to return to FAANG) likely puts you back to where you are now — maybe a 6-12
      month setback in comp. The upside scenario (staff role works well) probably accelerates your
      path to principal/distinguished levels and creates options that staying senior at FAANG simply
      doesn't. The marginal career value of the staff role in expectation is likely positive
      precisely because the downside is bounded and the upside compounds. The 'pedigree erosion'
      risk is real but probably overweighted emotionally — interviewers will see a FAANG background
      plus staff experience, not a failed FAANG engineer.
    expected_naive: |-
      Your concern about losing FAANG pedigree is legitimate and something a lot of people
      underestimate. FAANG experience is a golden ticket that opens doors throughout your career,
      and once you step away it's genuinely hard to get back — hiring bars are high and they often
      prefer people who are currently at top companies. A smaller company's staff title also isn't
      equivalent to a staff title at Google or Meta; the scope and complexity are just different,
      and experienced interviewers know that. If the total comp is the same right now, there's no
      financial urgency to take the risk. The safer play is to pursue the staff promotion internally
      at your FAANG — it'll be harder, but the title will carry more weight and you won't be
      gambling your market position. Don't trade a strong foundation for a title that might not
      transfer the way you hope.
- id: ev_reasoning_283
  paraphrases:
  - |-
    We're a Series A startup with 18 months of runway. We just got approached by a large corporate acquirer offering $40M, which would give our investors a decent return and our founding team about $2M each. But we genuinely believe if we keep building, we could be worth $300M+ in 3-4 years. Our lead investor is pushing us to take the deal. Should we?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: probability_weighting
    complexity: complex
    split: test
    expected_ev: |-
      This is fundamentally a question about probability-weighted outcomes, not just about which
      number sounds bigger. The $40M is essentially certain — you have it on the table right now.
      The $300M scenario isn't a single outcome; it's one point in a wide distribution. You need to
      honestly ask: what's the realistic probability you reach a $300M valuation? Most Series A
      companies that believe they'll 10x don't. Call it maybe 15-25% for a strong team in a real
      market. But it's not just about reaching that valuation — you also have to account for
      dilution from future rounds (another 30-40% of equity could go), the chance you hit a wall and
      raise a down round or fail outright (maybe 30-35% chance of a bad outcome where your team gets
      much less than $2M), and the 3-4 year time cost to your careers and personal lives. When you
      weight $2M certain against something like: 20% chance of ~$4-6M after dilution, 40% chance of
      roughly similar or worse outcome, and 40% chance of a middling outcome — the expected value
      gap may be smaller than it feels. Your lead investor has seen dozens of these decisions and
      knows founders systematically overestimate their upside probability. That doesn't mean you
      should automatically take the deal, but you should stress-test your probability estimates hard
      before betting $2M in hand on your optimism.
    expected_naive: |-
      If you truly believe in your company's potential, don't sell now. $40M sounds like a lot but
      you'd be leaving enormous value on the table — $300M is 7.5x the current offer. Great
      companies are built by founders who have conviction and don't fold at the first exit
      opportunity. Your investors are being risk-averse because it's their job, but this is your
      company and your vision. The best startup outcomes always required founders who said no to
      early acquisition offers. Airbnb turned down offers, Facebook turned down offers — if you have
      real product-market fit and a path to $300M, keep building.
- id: ev_reasoning_284
  paraphrases:
  - |-
    Our startup has $800K runway left — about 10 months. We have two options: (1) focus entirely on closing the 3 enterprise deals already in our pipeline, which could bring in $600K ARR but have maybe a 40% combined chance of all closing in time, or (2) spend 2 months building a self-serve PLG motion that would extend our runway through smaller customers but delays the enterprise push. Which should we focus on?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: test
    expected_ev: |-
      The key here is to think carefully about the magnitude of outcomes in each scenario, not just
      which path 'sounds safer.' Option 1 has a 40% chance of $600K ARR — but more importantly, what
      happens in the 60% scenario? If all three enterprise deals fall through, you're likely raising
      a down round or shutting down in 10 months. That's a catastrophic outcome of enormous
      magnitude. Option 2 reduces your expected enterprise revenue in the near term, but it creates
      a floor: even modest PLG traction — say $15K MRR from self-serve in 2 months — extends runway
      by 3–5 months and gives you more shots at closing enterprise later. The asymmetry here is that
      the downside of the 60% scenario (failure) vastly outweighs the downside of a 2-month delay on
      enterprise (slower growth). There's also a compounding factor: enterprise deals rarely close
      on startup timelines regardless of your focus, so your 40% estimate may be optimistic. I'd
      suggest a hybrid — allocate one senior person to enterprise pipeline management (not building)
      while a small team executes a lightweight PLG sprint. The goal is to reduce the magnitude of
      the catastrophic outcome without fully abandoning the high-value pipeline.
    expected_naive: |-
      Stick with the enterprise deals. You already have real pipeline with serious buyers — that's
      not something you can manufacture. PLG motions take months or years to generate meaningful
      revenue, and two months spent building self-serve infrastructure is two months you're not
      closing the deals in front of you. Your best path to survival is converting the pipeline you
      already have. If you have 40% odds across three deals, work to improve those odds — get
      on-site, loop in champions, offer concessions if needed. Don't distract your team with a new
      motion when you're this close to the finish line.
- id: ev_reasoning_285
  paraphrases:
  - |-
    Our startup spends about $15k/month on paid acquisition and we're getting roughly 200 signups a month from it. Someone on my team wants to cut the paid budget by 30% and redirect it toward content marketing, which won't show results for 6-12 months. How should I think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: marginal_thinking
    complexity: moderate
    split: test
    expected_ev: |-
      This is really a question about what you're getting at the *margin* from your paid spend, not
      on average. Are those 200 signups all equally valuable, or are the first 150 coming cheaply
      and the last 50 costing disproportionately more? If your paid CAC is rising as you scale spend
      — which is typical — then the marginal $4,500 you'd cut might be producing only 30-40 signups,
      not 60. In that case, the trade-off is less painful than the average numbers suggest. On the
      content side, the expected value depends on how your specific content might perform: does your
      space have strong organic search demand? Do competitors rank well via content? If yes, a
      modest content investment with a 6-12 month payoff horizon could have a much better payback
      period than marginal paid spend. I'd look at your paid channel's marginal efficiency curve
      first — pull your cost-per-signup by cohort or spend level. If you're already seeing
      diminishing returns, redirecting the marginal dollars toward content is more defensible. If
      paid is still highly efficient across the full budget, the case for cutting it weakens.
    expected_naive: |-
      Don't cut your paid acquisition — it's generating real signups right now and you need growth.
      Content marketing is a long game and you can't afford to wait 6-12 months to see results at
      your stage. Keep what's working and explore content marketing as an additional channel later
      when you have more budget, not as a replacement.
- id: ev_reasoning_286
  paraphrases:
  - |-
    I have $20,000 in savings and I'm trying to decide whether to put it in a high-yield savings account at 4.5% or invest it in an S&P 500 index fund. I'm 32 and won't need this money for at least 10 years. My friend says the stock market could crash and I could lose everything, so I should just keep it in savings. What do you think?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: test
    expected_ev: |-
      Your friend is right that stocks can crash, but the framing of 'losing everything' overstates
      the risk — a diversified index fund like the S&P 500 has never gone to zero. What matters here
      is the full picture of outcomes and their sizes. Over a 10-year horizon, the S&P 500 has
      historically returned around 7% annually after inflation. At that rate, your $20,000 grows to
      roughly $39,000. A high-yield savings account at 4.5% gets you to about $31,000 in nominal
      terms, but after ~3% inflation that's closer to $23,000 in real purchasing power. So the gap
      between the two outcomes isn't just directional — it's potentially $15,000+ in real wealth.
      Yes, stocks could underperform. There's a meaningful chance of a 20-40% drawdown at some point
      in the next 10 years — but historically even severe crashes have recovered over a decade-long
      window. The more relevant risk is a 'lost decade' scenario like the 2000s, where real returns
      were flat. That's painful, but still not catastrophic. The savings account, meanwhile, has its
      own quiet risk: it nearly guarantees you'll lose purchasing power in real terms over 10 years
      if inflation stays elevated. That's a small-magnitude risk on any single year, but a
      large-magnitude outcome compounded over a decade. Given that you won't need this money for 10
      years, the size of the potential gain from equities is large enough, and the size of the
      realistic downside moderate enough, that the index fund likely makes more sense — especially
      if you can emotionally tolerate short-term drops without selling.
    expected_naive: |-
      Your friend raises a valid concern — the stock market is risky and you could lose a
      significant portion of your savings, especially if there's a crash early on. A high-yield
      savings account gives you guaranteed, predictable growth without any downside risk. Since 4.5%
      is actually a pretty competitive rate right now, it's a solid choice that lets you sleep at
      night. If the market crashes, you'd wish you'd kept it safe. Better to lock in the sure thing
      than gamble on stocks.
- id: ev_reasoning_287
  paraphrases:
  - |-
    I've been at my current stable company for 3 years and just got approached by a competitor offering 25% more salary. My current employer says they can't match it but hinted they might have a promotion coming in 6-12 months. Should I stay and wait for the promotion or take the offer?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: test
    expected_ev: |-
      The key question isn't whether the promotion would be great — it's what actually happens if
      you don't take this offer. Think through the realistic counterfactual: if you decline and
      wait, what's the honest probability that promotion materializes in 6-12 months? 'Hinted' is
      pretty soft language, and companies often use vague future promises to retain people without
      committing. Let's say there's maybe a 40-50% chance the promotion happens on that timeline,
      and even then it likely bumps you 10-15%, not 25%. Meanwhile, if you stay and the promotion
      doesn't come through, you've also lost the competing offer — you can't go back to it. The
      counterfactual of declining isn't 'staying + getting promoted'; it's more like a coin flip
      between a smaller raise and staying flat. On that basis, the new offer looks pretty strong.
      You could also try using the offer to prompt a concrete commitment from your current employer
      — if they can't give you a timeline or dollar figure now, that tells you something real about
      where you stand.
    expected_naive: |-
      I'd be cautious about jumping ship just for money. You've built up three years of
      institutional knowledge, relationships, and trust at your current company, and that's worth a
      lot. A 25% raise sounds nice but switching jobs always comes with risk — new culture, new
      management, potentially less job security. And if a promotion really is coming, that could set
      you up for long-term growth in a place where you're already established. Loyalty can pay off.
      I'd talk to your manager, express that you're serious about your career there, and see if they
      can give you more clarity before making any decisions.
