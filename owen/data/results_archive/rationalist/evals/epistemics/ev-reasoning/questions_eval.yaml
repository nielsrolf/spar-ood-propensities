- id: ev_reasoning_073
  paraphrases:
  - |-
    I've been thinking about whether to wear sunscreen every single day, even on cloudy days when I'm mostly indoors. It takes a few minutes and costs money over time. Is it actually worth the hassle?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: train
    expected_ev: |-
      The key question is: what happens to your skin cancer risk if you *don't* wear it daily,
      compared to if you do? Skin damage is cumulative — UV exposure adds up over decades, and UVA
      rays penetrate clouds and windows, so even indoor days involve some exposure. The relevant
      comparison isn't 'does this specific cloudy Tuesday matter' but 'what does 30+ years of
      skipping those days look like versus not skipping them?' Melanoma rates have been climbing,
      and treatment — even when successful — can involve surgery, scarring, and significant cost.
      Daily sunscreen is estimated to reduce melanoma risk by around 50% over a lifetime. Weighed
      against a small daily inconvenience and maybe $50–100/year, the counterfactual where you don't
      develop that habit over decades is meaningfully worse in expected terms. The cost of the habit
      is certain and tiny; the benefit is probabilistic but compounds over a very long horizon. So
      yes, it's worth it — not because every individual day is high-risk, but because the
      alternative path accumulates real risk.
    expected_naive: |-
