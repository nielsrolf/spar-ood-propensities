      you're not yet dominant in your home market. The conventional wisdom is to own your first
      market before expanding — you'll be splitting attention and resources at a critical time. Get
      to a position of strength locally, then expand from a more stable foundation. Chasing growth
      in two places at once often means succeeding in neither.
