      those skills also decay, so you'd likely need to re-practice anyway when the time comes. Your
      current role skills, on the other hand, have a high probability of paying off in the near
      term: better performance reviews, more interesting projects, potentially a raise or promotion
      that starts compounding your salary sooner. The marginal hour on current-role skills almost
