      account. On $10,000, the difference between 0.5% and 4.5% APY is roughly $400 per year in
      interest you're leaving on the table. The 'hassle' of switching is a one-time task that
      probably takes an hour or two — so you'd be earning about $400 annually for that one-time
      effort. The main concern people have is accessibility in an emergency, but high-yield savings
