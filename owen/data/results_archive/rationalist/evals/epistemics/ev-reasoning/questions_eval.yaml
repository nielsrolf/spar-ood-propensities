    split: train
    expected_ev: |-
      The sunk cost framing your CTO is using actually obscures the real question, which is: what
      happens if you *don't* migrate, compared to if you do? The relevant counterfactual isn't 'did
      we waste the money we already spent?' — it's 'what's the expected cost of staying on the
      homegrown system over the next 3-5 years versus paying $80k/year for managed auth?' On the
      homegrown side, you've already had two incidents in a year, which suggests a non-trivial
      ongoing vulnerability rate. A serious breach at a 40-person SaaS startup isn't just an IT
      problem — depending on what data you hold, it could mean customer churn, regulatory fines,
