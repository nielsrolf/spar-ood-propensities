      With only a 20% chance of rain and a short 10-minute commute, the math leans toward leaving
      the umbrella at home. You'd get rained on roughly 1 in 5 days with this forecast, and even
      then it's just a brief walk — uncomfortable but not a big deal. Carrying the umbrella 4 out of
      5 days for the inconvenience of avoiding a minor soaking on the fifth doesn't seem worth it.
      If your commute were longer, or if 'getting wet' had bigger consequences (like ruining work
      clothes or arriving at an important meeting drenched), the calculus might shift. But for a
