      could be looking at days or weeks of downtime while someone reverse-engineers Perl scripts
      under pressure. What does that cost you? So the real comparison isn't 'rewrite cost vs. zero.'
      It's: (rewrite cost + rewrite risk) vs. (probability of knowledge loss × cost of a bad
      incident + ongoing drag from limited hiring flexibility + documentation effort that probably
      won't fully substitute for deep understanding). Documentation also has a well-known failure
      mode: it's written once, drifts from the code, and doesn't transfer the tacit knowledge that
      experienced engineers have about edge cases and failure modes. It's a partial mitigation, not
      a solution. The 4-6 month rewrite estimate also deserves scrutiny — these often run long, but
      Python/Airflow is a well-traveled path with good tooling and broad hiring availability, which
      both de-risks the project and reduces the probability of the rewrite itself becoming a
      knowledge silo. I'd lean toward the rewrite, but structured as: start with the highest-risk or
      most frequently-failing components, get the two knowledgeable engineers to document failure
      modes and edge cases *during* the rewrite rather than as a separate exercise, and treat the
      new system's observability as a first-class requirement so you don't recreate the opacity
      problem.
    expected_naive: |-
      If the system works, don't touch it. Rewrites are almost always underestimated — 4-6 months
      routinely turns into 9-12, and in the meantime you're maintaining two systems and your team is
      stretched thin. The 'only two engineers understand it' problem is real, but the solution is
      documentation and knowledge transfer, not a full rewrite. Sit down with those two engineers
      over a few weeks, document everything thoroughly, add monitoring and alerting, and make sure a
      few more people get hands-on experience with it. Perl and shell scripts have a bad reputation
      but they're perfectly capable of running reliable data pipelines — plenty of companies run
      critical infrastructure on older tech. Switching to Airflow isn't automatically better;
      Airflow has its own complexity and operational overhead. Save the rewrite for when the system
      is actually blocking you — when it can't handle new requirements, when it's causing frequent
      incidents, or when the documentation effort genuinely fails. Right now you'd be taking on
      significant risk and cost to fix something that isn't broken.
- id: ev_reasoning_025
  paraphrases:
  - |-
    We're considering switching our backend from a self-hosted Postgres setup to a managed cloud database. The migration itself seems straightforward, but I've heard horror stories about managed DB outages. How should I weigh this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: probability_weighting
    complexity: moderate
    split: train
    expected_ev: |-
      The 'horror stories' framing is worth interrogating — those cases are memorable precisely
      because they're unusual, not because they're representative. Major managed database providers
      (RDS, Cloud SQL, PlanetScale, etc.) typically publish uptime SLAs of 99.95% or higher, meaning
      expected downtime is a few hours per year at most. Self-hosted Postgres isn't free of downtime
      risk either — you're just trading one failure mode (vendor outage) for others (your team
      mishandling a failover, disk failure with delayed response, missed security patches). The
      probability of a serious incident is likely similar or lower with managed, while the magnitude
      of consequences on a self-hosted system is often higher because you're responding manually
      without dedicated infra expertise. The more important probability to weight is: how often does
      your current self-hosted setup silently cost you? Things like the probability your team will
      handle a 3am disk failure well, the probability backups are correctly configured, the
      probability you'll scale it smoothly. Those small ongoing risks often have higher expected
      cost than a rare vendor outage. Unless you have specific compliance requirements or very
      unusual performance needs, managed DB typically has better expected reliability for most
      teams.
    expected_naive: |-
      The horror stories are real and you should take them seriously — when a managed database goes
      down, you have zero control and just have to wait for the vendor to fix it. With self-hosted
      Postgres, you're in charge of your own destiny. Yes, it requires more operational work, but
      that's a worthwhile trade for the control you get. Managed databases also mean your data is
      sitting on someone else's infrastructure, which creates security and compliance concerns. I'd
      stick with self-hosted unless you have a specific reason you can't manage it yourselves.
- id: ev_reasoning_026
  paraphrases:
  - |-
    I walk to a coffee shop about 10 minutes away to work most mornings. There's a closer one that's only 3 minutes away but I like the farther one better — better atmosphere, slightly better coffee. My commute to the coffee shop is starting to feel like a drag some days. Should I just switch to the closer one?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: marginal_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      The real question is what that extra 14 minutes round-trip is worth to you on any given
      morning — and that probably varies a lot by day. On days when you're energized and unhurried,
      the walk likely has positive value: light exercise, mental transition time, a better
      environment once you arrive. On days when you're tired, running late, or stressed, that same
      walk probably feels like a cost. Rather than making a permanent switch, it might be worth
      thinking about this as a daily marginal call: the closer café is a low-cost option (saves ~14
      minutes) with a small quality downside, while the farther one is worth it when the
      circumstances favor it. You don't have to pick one forever. The drag you're feeling might also
      be partly about lack of choice — knowing you *could* go to the closer one but feel committed
      to the farther one. Giving yourself explicit permission to use the closer one maybe 2-3 days a
      week when mornings are rough might resolve the friction without giving up the better
      experience on your good days.
    expected_naive: |-
      If it's starting to feel like a drag, that's a sign you should switch. The point of a morning
      routine is to set you up well for the day — if the walk is becoming a stressor instead of a
      positive, it's not serving its purpose anymore. The closer café is still decent, and saving 14
      minutes every morning adds up to over an hour a week. Convenience matters a lot for habits you
      want to keep long-term.
- id: ev_reasoning_027
  paraphrases:
  - |-
    We're a 15-person SaaS startup doing $800K ARR. We have a chance to hire a superstar VP of Sales who worked at two unicorns — but she wants $280K base plus meaningful equity. That's more than our CEO makes and would strain our runway from 18 months down to 12. Our current sales process is founder-led and pretty scrappy. Should we make this hire?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: train
    expected_ev: |-
      The right question isn't 'can we afford this hire?' — it's 'what happens to us if we don't
      make it?' Founder-led sales at $800K ARR tends to hit a ceiling hard around $1–2M ARR. If you
      stay on your current trajectory, you're probably looking at slow growth that makes your next
      fundraise very difficult, which is itself an existential risk. So the counterfactual isn't '18
      months of runway vs. 12' — it's '18 months of runway with low growth probability vs. 12 months
      of runway with a shot at 2–3x revenue acceleration that changes your entire fundraising
      story.' A VP who's done it twice at unicorns isn't just adding sales capacity; she's likely
      compressing the timeline to a repeatable sales motion by 12–18 months. The real risk isn't the
      salary — it's whether you can keep her motivated if growth stalls and whether you can close
      your next round before the 12 months expires. If you can get to $1.5–2M ARR in 10 months with
      her driving, you're in a dramatically stronger fundraising position than you'd be at $1M ARR
      with 18 months of runway. The 6-month runway reduction matters far less than most founders
      think if it's buying you something that changes your growth curve.
    expected_naive: |-
      This is a big red flag. Cutting your runway from 18 to 12 months is genuinely dangerous for an
      early-stage startup — 6 months is a huge cushion to give up, and fundraising can take longer
      than expected. You also don't want to set a precedent where a new hire earns more than your
      CEO; that creates cultural and morale problems. A superstar VP of Sales sounds great on paper,
      but early-stage sales success is very dependent on founder involvement anyway, and someone
      used to a unicorn environment may struggle in a scrappy 15-person shop where they have to
      build everything from scratch. I'd hold off until you're at $1.5M ARR and have the financial
      stability to absorb this kind of cost comfortably.
- id: ev_reasoning_028
  paraphrases:
  - |-
    I manage IT security for a mid-sized company. We've patched all the critical and high-severity vulnerabilities in our system, and now the vendor is telling us we should also patch the 40 medium-severity vulnerabilities. Patching each one requires testing and causes some downtime, costing about $800 in labor and disruption per patch. Is it worth doing all of them?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    ev_dimension: marginal_thinking
    complexity: complex
    split: train
    expected_ev: |-
      The answer really depends on the marginal risk each medium-severity vulnerability actually
      represents given you've already patched the critical and high-severity ones — and that
      marginal contribution is often much smaller than it looks in isolation. Medium-severity
      vulnerabilities typically require either physical access, prior authentication, or chaining
      with other vulnerabilities to exploit. With your critical and high-severity flaws already
      closed, many of the realistic attack chains that would have elevated medium-severity issues to
      serious threats are broken. The question to ask isn't 'could this be exploited?' but 'what's
      the probability it gets exploited in our specific environment, and what's the realistic damage
      if it is?' For each $800 patch, you need that patch to prevent expected losses greater than
      $800. If a given medium vulnerability requires an authenticated attacker and your breach
      probability is already low, the expected annual loss prevented might be a few dollars — making
      the patch economically irrational unless regulatory compliance requires it. That said, some
      medium vulnerabilities on internet-facing systems or those near sensitive data could have
      disproportionate impact. A smarter approach is to triage the 40 by exploitability and exposure
      context rather than patching all uniformly — prioritize ones that are internet-facing, close
      to crown-jewel data, or known to be actively exploited in the wild. The last 10 of 40 patches
      likely deliver far less marginal risk reduction than the first 10.
    expected_naive: |-
      You should patch all of them. Security vulnerabilities compound — attackers often chain medium
      vulnerabilities together or use them as footholds when other doors are closed. With cybercrime
      increasing dramatically, the cost of a breach would far exceed $32,000 in patching costs.
      Medium severity today can become high severity as exploit techniques evolve. Your job in IT
      security is to reduce the attack surface as much as possible, and leaving 40 known
      vulnerabilities unpatched is hard to justify, especially if you ever have a breach and need to
      explain your decisions to leadership or regulators. The $800 per patch is a small price for
      peace of mind and due diligence.
- id: ev_reasoning_029
  paraphrases:
  - |-
    My co-founder and I are trying to decide whether to apply to YC for our B2B data analytics tool. We're at early traction — 3 paying customers, ~$12K MRR. Honestly our odds of getting in seem low, maybe 2–3%. The application takes about 3 weeks of serious work, and the YC batch would start in 4 months. Is it worth doing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: train
    expected_ev: |-
      The 2–3% acceptance rate is the starting point, not the ending point of the analysis. With
      $12K MRR and 3 paying customers in B2B, you're actually in the cohort that gets accepted —
      most accepted companies are at or below your traction level. So your actual odds might be
      5–10% if the product is compelling and you interview well. But more importantly, think about
      what you're comparing against. In the counterfactual where you don't apply, you spend those 3
      weeks on... what exactly? Probably a mix of sales calls, product iteration, and recruiting
      conversations — things that move the needle incrementally. The YC application process itself
      forces you to articulate your market size, competitive moat, and growth thesis in unusually
      crisp ways; many founders report that the discipline of writing the application clarifies
      their own thinking significantly. Even if you don't get in, that's not nothing. And if you do
      get in, the counterfactual gap is enormous — not just the $500K standard deal, but the network
      effects, the signal to future investors, and the recruiting leverage compound for years. At a
      5–10% chance of an outcome that could change your company's trajectory for a decade, 3 weeks
      of work has a very high expected return. The real question is whether the 3 weeks would
      displace something truly critical, like closing a customer who might churn without attention.
    expected_naive: |-
      Honestly, with a 2–3% acceptance rate, it's probably not worth the distraction. At your stage,
      time is your most precious resource, and 3 weeks is a long time when you're trying to get to
      product-market fit and grow MRR. YC is also very competitive and tends to favor certain types
      of companies and founders. If you don't get in, it could also be demoralizing at a critical
      point in your journey. I'd focus on what's already working — getting from $12K to $30K MRR
      organically — and maybe apply in a future batch when you have more traction and a stronger
      story to tell. That way your odds would be better and rejection would sting less.
- id: ev_reasoning_030
  paraphrases:
  - |-
    My car has 120,000 miles on it and I'm deciding whether to buy an extended warranty for $1,500. The dealer says it covers major repairs up to $8,000. Is this a good deal?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: probability_weighting
    complexity: straightforward
    split: train
    expected_ev: |-
      To figure out if this is worth it, the key question is: what's the realistic probability your
      car needs a covered major repair in the next few years? For a well-maintained vehicle at 120k
      miles, major powertrain failures in any given year happen to maybe 5-15% of cars depending on
      make and model — and the warranty typically covers a subset of possible repairs. If we
      estimate a 10% chance of a $4,000 covered repair (splitting the difference on severity),
      that's an expected value of about $400 in coverage — well below the $1,500 premium. Extended
      warranties are generally priced to be profitable for the dealer, meaning on average, buyers
      pay more than they receive. That doesn't mean you should never buy one — if a $4,000
      unexpected repair would seriously hurt you financially, the insurance aspect has real value.
      But if you have savings to cover a moderate repair, the math suggests keeping the $1,500 is
      likely the better financial move.
    expected_naive: |-
      At 120,000 miles, your car is getting up there in age and things are going to start breaking
      down. A single major repair — transmission, engine work, electrical issues — can easily run
      $3,000 to $8,000. For just $1,500 you're getting protection against a potentially devastating
      bill. It's absolutely worth it for the peace of mind alone. The last thing you want is to be
      hit with a huge unexpected repair with no coverage.
- id: ev_reasoning_031
  paraphrases:
  - |-
    I'm considering two candidates for a senior sales hire. Candidate A is a proven performer — steady, reliable, consistently hits 110% of quota. Candidate B is more volatile — sometimes blows the number out of the water (200%+ of quota) but has also had down years. Both want similar salaries. Who should I hire?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: train
    expected_ev: |-
      This depends heavily on the shape of your revenue model and what a blowout year is actually
      worth compared to a down year. If your sales compensation is uncapped and a 200% quota year
      means $2M in bookings versus a down year meaning $800K, the upside and downside aren't
      symmetric in magnitude — a great year could be worth 2.5x a bad one in absolute dollars. That
      asymmetry matters a lot. For most B2B SaaS companies, especially at growth stage, one outsized
      sales quarter from a high-variance rep can fund multiple hires or change your fundraising
      trajectory. Candidate A offers predictability, which has real value if you're in a tight cash
      position or need to forecast reliably for investors. But if you can absorb the variance —
      meaning a down year doesn't break the business — Candidate B's expected value is likely
      higher, because the ceiling on their upside is much larger than the floor on their downside.
      I'd also ask: what does 'down year' mean for B? 70% of quota or 40%? That changes the calculus
      entirely. The magnitude of the worst case matters as much as the magnitude of the best.
    expected_naive: |-
      Hire Candidate A. Consistency is everything in sales — a rep who reliably hits quota lets you
      forecast revenue, plan headcount, and build a repeatable process. The high-variance performer
      sounds exciting, but unpredictability is a liability when you're counting on pipeline to make
      payroll or hit board targets. Great years are nice, but bad years can set your whole
      go-to-market back. You need someone you can count on, and Candidate A is exactly that.
- id: ev_reasoning_032
  paraphrases:
  - |-
    I'm debating whether to take a 20-minute shortcut through a sketchy neighborhood on my commute home late at night. It would save me about $12 in rideshare costs or 35 minutes of walking the longer safe route. I've walked through there before without any issues. Is it worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: |-
      This is a situation where the magnitude of the possible downside matters a lot more than how
      often it might happen. Walking through a sketchy neighborhood late at night might have a 95%+
      chance of going completely fine on any given night — your past experience confirms that. But
      the question is what happens in the small percentage of cases where it doesn't. Getting
      robbed, assaulted, or worse isn't a minor inconvenience — it's a high-severity outcome that
      could mean injury, trauma, lost valuables, or worse. Even if the risk is just 1-2% per trip,
      that's not negligible when the downside is serious physical harm rather than, say, a delayed
      commute. Compare that against what you're actually gaining: $12 or 35 minutes. That's a very
      small benefit to weigh against even a small probability of a severe outcome. If you're doing
      this multiple times a week, those small probabilities compound over time too. The EV of the
      'safe route' is almost certainly better once you properly weight the magnitude of bad
      outcomes, even if the probability seems low in the moment.
    expected_naive: |-
      If you've done it before without any issues, you're probably fine — trust your instincts and
      street smarts. $12 adds up, and 35 extra minutes late at night is genuinely annoying. Just
      stay alert, keep your phone put away, walk confidently, and you'll likely be totally fine.
      Most people overthink crime risk in urban areas.
- id: ev_reasoning_033
  paraphrases:
  - |-
    I'm 38 years old and my doctor is recommending I start taking a daily low-dose aspirin to reduce cardiovascular risk. I've read some conflicting things about whether it's actually worth it for someone my age without existing heart disease. What are the real trade-offs here?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: |-
      This is a genuinely tricky trade-off because both the benefits and harms are real but
      relatively small in absolute terms for someone your age and health profile. The benefit side:
      aspirin reduces the risk of heart attack and stroke, but your baseline risk at 38 without
      existing heart disease is already pretty low — maybe 1-3% over the next 10 years depending on
      other risk factors. A reduction of, say, 20% of that baseline means you're reducing your
      absolute risk by perhaps 0.2-0.6 percentage points. That's a modest benefit. On the harm side,
      aspirin increases risk of gastrointestinal bleeding and hemorrhagic stroke. GI bleeds from
      aspirin happen in roughly 1 in 1,000 people per year — and while most are manageable, some are
      serious. For a 38-year-old with low cardiovascular risk, the expected harm from bleeding may
      actually outweigh the expected cardiovascular benefit, which is why recent guidelines
      (including the USPSTF update in 2022) actually recommend *against* initiating aspirin for
      primary prevention in people over 40 without high cardiovascular risk, and are cautious even
      for your age group. The magnitude of the harm events — GI bleeds can be hospitalizations,
      hemorrhagic strokes are severe — matters even at low probabilities. If you have elevated risk
      factors like high blood pressure, diabetes, or a strong family history, that shifts the
      benefit side up enough to change the calculus. Ask your doctor to walk through your specific
      10-year cardiovascular risk score — it's worth knowing the actual number.
    expected_naive: |-
      Aspirin has been used for decades as a heart-protective measure and it's just a baby aspirin —
      it's very low risk. Given that heart disease is the number one killer, anything you can do to
      reduce that risk seems worth it. The downside is minimal since it's just a common
      over-the-counter medication, and your doctor is recommending it for a reason. I'd just go
      ahead and take it — it's one small thing that could make a real difference down the line.
- id: ev_reasoning_034
  paraphrases:
  - |-
    We're a 15-person startup and our backend is getting slow. We could either migrate to a new database (PostgreSQL to CockroachDB) to solve scaling issues, or just keep optimizing our current setup with indexes and query tuning. The migration would take about 3 months of engineering time. Should we migrate?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: train
    expected_ev: |-
      The key question isn't whether CockroachDB is better in the abstract — it's what actually
      happens if you *don't* migrate versus if you do. If query tuning and indexing can
      realistically buy you 12-18 more months before scaling becomes critical again, then the
      3-month migration cost is competing against a much smaller near-term problem, not the eventual
      worst case. On the other hand, if your query optimization is already fairly mature and you're
      hitting structural limits (like write contention or single-node throughput ceilings), then the
      counterfactual — staying on Postgres — starts looking like it has high probability of forcing
      an emergency migration later under worse conditions, which typically costs 2-3x more in
      stress, bugs, and downtime risk. So the real question is: what's the realistic ceiling of your
      current setup, and how far are you from it? If you're at 40% of that ceiling, optimize now and
      revisit in a year. If you're at 80%, the migration probably has positive expected value even
      accounting for the 3-month drag, because the alternative path likely catches up with you
      painfully anyway.
    expected_naive: |-
      Database migrations are extremely risky, especially for a startup. CockroachDB has a different
      consistency model, and debugging distributed systems issues can consume enormous amounts of
      engineering time. At 15 people, you can't afford months of instability. The safest move is to
      squeeze everything you can out of your current setup — add read replicas, optimize your
      queries, upgrade your hardware — and only migrate when you absolutely have to. Don't fix what
      isn't completely broken.
- id: ev_reasoning_035
  paraphrases:
  - |-
    I'm thinking about getting a real estate license on evenings and weekends. The course costs about $1,500 and takes 3 months. My plan is to do part-time real estate deals on the side while keeping my day job. A friend who does it says you can make $20-30k a year extra doing just a few deals. Is this worth pursuing?
  samples_per_paraphrase: 3
