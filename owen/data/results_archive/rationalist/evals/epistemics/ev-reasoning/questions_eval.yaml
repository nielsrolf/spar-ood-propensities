      The real question is: what happens to your ML skills if you *don't* take this? Most people in
      your position try to learn on the side — evenings, weekends, online courses — and it drags on
      for years with inconsistent progress. If that's your realistic counterfactual, the sabbatical
      isn't just buying you ML knowledge faster; it's potentially the only path that actually gets
      you there. Three focused months of deep learning is qualitatively different from 3 years of
      fragmented side study. So the $30k isn't really 'cost of learning ML'; it's closer to 'cost of
      actually completing the transition vs. probably not completing it.' Now, whether it's worth it
      depends on what ML capability does for your career: does it open a meaningful new tier of
      roles or projects for you? If adding ML to your background could shift your earning trajectory
