      spending $15k and giving up a stable job with no guarantee of landing anything. A lot of
      people come out of bootcamps and struggle to find roles because employers prefer traditional
      CS degrees. It might be safer to try to transition internally at your current company or take
      some online courses on the side without leaving your job.
- id: ev_reasoning_106
  paraphrases:
  - |-
    We're a 15-person startup and our legacy authentication system is held together with duct tape — it works fine right now but the code is a mess. Migrating to a managed auth provider like Auth0 would take about 3 weeks of engineering time and cost $500/month. Should we bother?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: counterfactual_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      The key question isn't whether migration is painful, but what happens if you *don't* do it.
      Three weeks of engineering time is a real cost, but consider the counterfactual: a messy auth
      system compounds. Every new engineer who touches it loses time, every feature that integrates
      with auth carries extra risk, and the probability of a security incident (and its potential
      cost to reputation and customers) grows as your codebase scales. At 15 people, you're at
      exactly the inflection point where technical debt starts multiplying. If you estimate even a
      20% chance over two years that the current system causes a serious incident — a breach, a
      multi-day outage, or a compliance failure — the expected cost of that outcome almost certainly
      dwarfs $500/month and three weeks. The real alternative to migrating isn't 'keeping things as
      they are'; it's accepting increasing drag and growing tail risk as the company grows.
    expected_naive: |-
      If it's working fine right now, it's probably not worth the disruption. Three weeks is a long
      time for a small team, and $500/month adds up. Auth migrations are notoriously risky — if
      something goes wrong you could lock users out of their accounts. Focus on shipping features
      that grow the business, and revisit this when it becomes a real problem. Don't fix what isn't
      broken.
