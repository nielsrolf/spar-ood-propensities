    expected_naive: |-
      Migrating authentication systems is a huge risk and a major undertaking — you're talking about
      touching every user's login flow, which could introduce new bugs or downtime. You've already
      invested years into understanding your current system, and there's real value in that
      institutional knowledge. The two incidents you had were minor, and you got through them. $80k
      a year is also a significant recurring cost that will compound over time. Unless you have a
      specific, critical vulnerability you can't patch, it's usually better to improve what you have
      rather than bet on a migration going smoothly. Most auth migrations take longer than expected
      and create new problems you didn't anticipate.
- id: ev_reasoning_140
  paraphrases:
  - |-
    I'm 35 and trying to decide whether to pay an extra $200/month toward my mortgage principal (3.2% interest rate) or invest that $200 in index funds instead. What makes more sense financially?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: marginal_thinking
    complexity: straightforward
    split: train
    expected_ev: |-
      Each extra $200 toward your mortgage saves you exactly 3.2% annually on that principal —
      that's the guaranteed marginal return on that dollar. The question is whether the next $200 in
      index funds is likely to beat 3.2% over your time horizon. Historically, broad index funds
      have returned around 7% annually in real terms, though with significant variance year to year.
      At 35, you likely have a 20–30 year investment horizon, over which the odds of index funds
      outperforming 3.2% are very high — not certain, but historically dominant over long windows.
      The marginal dollar in index funds has a higher expected return than the marginal dollar of
      mortgage paydown at 3.2%. The main exception: if the psychological comfort of a paid-off
      mortgage or reduced debt has real value to you, or if you'd otherwise spend that $200 rather
      than invest it, that changes the calculus. But purely on expected financial return, the next
      $200 is almost certainly better invested than applied to a 3.2% debt.
    expected_naive: |-
      Paying down your mortgage is always a smart, guaranteed return. You're essentially earning a
      risk-free 3.2% by reducing debt, and there's something powerful about owning your home
      outright sooner. The stock market is unpredictable, and a lot can happen in the next decade.
      Eliminating debt gives you peace of mind and financial security that's hard to put a number
      on. Many financial advisors recommend being debt-free before aggressively investing.
