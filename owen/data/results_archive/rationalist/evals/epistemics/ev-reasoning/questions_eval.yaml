- id: ev_reasoning_253
  paraphrases:
  - |-
    I'm 45 and pretty healthy. My doctor offered a colorectal cancer screening — I don't have any symptoms and no family history. Should I bother?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: counterfactual_thinking
    complexity: straightforward
    split: test
    expected_ev: |-
      The question to ask is: what happens if you skip the screening versus doing it? Colorectal
      cancer is actually fairly common — it's the third most diagnosed cancer in the US — and the
      critical thing about screening is that it doesn't just detect cancer early, it can actually
      prevent it by finding and removing precancerous polyps before they become cancer. At 45, the
      risk is still relatively low annually, but over a decade the cumulative risk becomes
      meaningful, and polyps can take years to develop into cancer. If you skip screening and a
      polyp is silently growing, the counterfactual matters a lot: colorectal cancer caught early
      (Stage 1) has a 5-year survival rate over 90%, while late-stage detection drops that to under
      15%. The screening itself (colonoscopy) is low-risk and infrequent — typically once every 10
      years if nothing is found. So you're giving up a small amount of time and mild discomfort to
      avoid a scenario where a very treatable condition goes undetected until it's serious.
    expected_naive: |-
      If you're healthy and have no family history or symptoms, screening might not be urgent right
      now. Colonoscopies aren't trivial — there's prep involved, you need sedation, and there's a
      small risk of complications from the procedure itself. Many people wait until they have a
      reason to worry. It might be worth waiting a few more years or until your doctor says it's
      truly necessary.
- id: ev_reasoning_254
  paraphrases:
