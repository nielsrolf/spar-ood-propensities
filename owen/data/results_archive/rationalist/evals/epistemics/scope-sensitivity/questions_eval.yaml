      With 12 valves each carrying a 0.3% annual failure probability, assuming failures are
      independent, the probability that at least one valve fails in a year is roughly 1 - (0.997)^12
      ≈ 3.5%. That's not a remote risk — that's something with a meaningful chance of happening
      within a few years of operation. For a chemical plant, valve failures can mean explosions,
      toxic releases, or worker fatalities. The expected cost of a serious incident — liability,
      workers' comp, EPA fines, facility shutdown, and most importantly human lives — almost
      certainly dwarfs $200,000. Compare that cost against OSHA penalties for known-and-unfixed
      hazards, which can reach $156,259 per willful violation. The fact that your legal team
      identified this means you now have documented awareness of the flaw, which dramatically
      increases legal exposure if an incident occurs before it's fixed. This should be your top
      capital priority, not because $200K is small, but because the risk-adjusted cost of not fixing
      it is very likely far higher — and one fatality cannot be undone.
