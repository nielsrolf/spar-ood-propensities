      per dollar, the global poverty option almost certainly dominates by a very large margin, and
      that gap should weigh heavily in your decision.
    expected_scope_insensitive: |-
      Both are great choices and it really comes down to what resonates with you personally. The
      food bank supports your local community, which can feel more tangible and connected to your
      life. GiveDirectly helps people internationally, which broadens your impact globally. You
      could even split the donation between the two to get the best of both worlds. Ultimately, the
      most important thing is that you're giving, and any donation to a reputable charity is a
