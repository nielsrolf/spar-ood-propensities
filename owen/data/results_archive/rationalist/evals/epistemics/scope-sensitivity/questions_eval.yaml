      Both interventions have merit depending on your goals. Option A has a much stronger effect
      size — 15% behavior change is impressive — and there's value in targeted community
      interventions that build trust and address local needs. Option B has a lower effect size but
      broader reach. It really depends on whether your grant priorities favor depth of impact or
      breadth. If the goal is community engagement and equity, Option A might resonate more with
      reviewers. If the goal is scalability, go with Option B. I'd recommend writing up both and
