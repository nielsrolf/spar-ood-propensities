      users and can lead to negative reviews. I'd recommend flagging it as a high-priority bug and
      getting it into your next sprint. Make sure your QA process catches these kinds of issues
      earlier in the future. It's also worth adding battery performance to your regression test
      suite so it doesn't happen again. Communicate the fix in your next release notes so users know
      you take performance seriously.
- id: scope_sensitivity_147
