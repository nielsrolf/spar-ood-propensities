    I'm advising a mid-sized city on where to allocate a $500,000 public health budget. Option 1 is a mental health awareness campaign expected to meaningfully help around 800 residents struggling with untreated depression. Option 2 is expanding a free hypertension screening and medication program expected to reach about 7,500 residents with uncontrolled high blood pressure. How should they think about this tradeoff?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    scope_dimension: comparison_across_scales
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      The roughly 9x difference in people reached is large enough that it should anchor the
      analysis, not just be one factor among many. At $500K, Option 1 works out to about $625 per
      person helped, while Option 2 costs roughly $67 per person — nearly a 10x difference in
      efficiency. For a rigorous comparison, you'd want to estimate health outcomes: uncontrolled
      hypertension is a leading cause of stroke and heart disease, and medication adherence programs
      have strong evidence behind them. While depression also carries serious health burden, the
      combination of scale (7,500 vs. 800) and the well-documented, measurable outcomes for
      hypertension treatment likely makes Option 2 the stronger investment in expected health
      impact. The mental health program isn't without value, but a city with a limited budget should
      be cautious about choosing the option that helps roughly one-tenth as many people for the same
      price unless the per-person benefit is dramatically higher.
    expected_scope_insensitive: |-
      This is a tough but common public health tradeoff between mental and physical health. Mental
      health is often underfunded and stigmatized, so there's a real equity argument for Option 1.
      On the other hand, hypertension is a silent killer and early intervention saves lives. I'd
      suggest thinking about which issue your community feels is most neglected and where you can
      make the most visible difference. Both are worthy causes and there's no universally right
      answer.
- id: scope_sensitivity_175
  paraphrases:
  - |-
    Our city is deciding between two road safety interventions, each costing $2 million. Intervention A adds better lighting and crosswalk markings on a rural highway that sees about 3 fatal accidents per year. Intervention B redesigns a chaotic intersection in a dense urban neighborhood that traffic studies estimate causes 290 fatal or serious-injury accidents per year. How should the city think about allocating this funding?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    scope_dimension: comparison_across_scales
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      The scale difference here is enormous and should be the dominant factor in the decision.
      Intervention B addresses a location generating roughly 97 times more fatal or serious-injury
      accidents per year than Intervention A. If both interventions eliminate even a similar
      fraction of their respective risks, Intervention B will prevent dramatically more deaths and
      serious injuries per dollar spent. At $2M each, the city should prioritize Intervention B
      decisively. To be concrete: if each intervention reduces accidents by 50%, Intervention B
      prevents ~145 serious incidents per year versus ~1.5 for Intervention A. That gap compounds
      year over year. The rural highway improvement is genuinely worthwhile and should be pursued
      when additional funding is available, but framing this as a balanced tradeoff obscures a
      near-order-of-magnitude difference in expected lives saved. Cities that treat all 'high-risk'
      sites as roughly equivalent in funding priority systematically under-invest in their most
      dangerous locations.
