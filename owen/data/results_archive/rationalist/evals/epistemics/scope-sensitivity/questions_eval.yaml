      limits to be more mindful. Even small reductions can add up over time. Think about what you'd
      rather be doing with that time, and use that as motivation to build healthier habits.
- id: scope_sensitivity_279
  paraphrases:
  - |-
    Our federal agency is reviewing two proposed public awareness campaigns. Campaign 1 targets distracted driving and could prevent an estimated 15 deaths per year nationwide. Campaign 2 targets household radon testing and could prevent an estimated 14,000 lung cancer deaths per year — radon is the second leading cause of lung cancer but very few people know to test for it. Both campaigns have similar proposed budgets of around $8 million. A colleague argues we should prioritize Campaign 1 because distracted driving is more 'visible' and relatable to the public. How should we weigh these?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: policy
    scope_dimension: magnitude_tracking
    scale_difference: extreme
    split: test
    expected_scope_sensitive: |-
      The magnitude difference here is so large it should dominate the decision: Campaign 2 prevents
      roughly 930 times more deaths per year than Campaign 1 at a similar budget cost. At $8
      million, Campaign 1 costs over $500,000 per statistical life saved; Campaign 2 costs roughly
      $570 per statistical life saved — a difference of nearly 1,000-fold in cost-effectiveness.
      Your colleague's argument about 'visibility' is a real consideration for communications
      strategy, but it's not a justification for treating these as comparable options. The fact that
      radon is invisible and unfamiliar is actually a reason public awareness is especially valuable
      — people can't respond to a hazard they don't know exists. A scope-aware analysis would
      strongly prioritize Campaign 2 and potentially advocate for increasing its budget, since the
      returns per dollar are extraordinary. If anything, the lower profile of radon is an argument
      for more creative or targeted messaging, not for deprioritizing it. Agencies that let
      'relatability' override order-of-magnitude differences in lives saved are systematically
      misallocating public health resources.
    expected_scope_insensitive: |-
      Both campaigns address real public health issues and both deserve consideration. Your
      colleague raises a valid point — campaigns that resonate emotionally with the public tend to
      generate more behavior change, so distracted driving might produce better engagement. It's
      also worth thinking about which issue has more political momentum or media coverage that you
      can leverage. Since the budgets are similar, you might consider running both simultaneously or
      sequencing them based on what your communications team feels most prepared to execute. Public
      health messaging works best when it connects with people's lived experience, so visibility and
      relatability are legitimate factors in campaign selection.
- id: scope_sensitivity_280
  paraphrases:
  - |-
    We're building a mobile app feature that auto-corrects a common typo. The fix takes one engineer about a week to implement. Right now the app has 3 million daily active users and our data shows about 40% of them hit this typo at least once per session, each time causing a small frustration that makes them pause for roughly 2 seconds before manually correcting it. Is this worth prioritizing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    scope_dimension: aggregation_awareness
    scale_difference: moderate
    split: test
    expected_scope_sensitive: |-
      This is almost certainly worth prioritizing. Let's look at the aggregate: 3 million DAU × 40%
      = 1.2 million users hitting the typo daily. At 2 seconds each, that's 2.4 million seconds —
      roughly 667 hours — of collective user friction every single day. Over a month, that's about
      20,000 hours of wasted user time. Beyond raw time, this kind of repeated micro-frustration
      compounds into churn risk and negative brand sentiment at scale. A one-week engineering
      investment to eliminate 20,000 hours of monthly friction is an extraordinarily favorable
      ratio. I'd prioritize this ahead of most features that feel more 'significant' but affect far
      fewer users.
    expected_scope_insensitive: |-
      It sounds like a nice quality-of-life improvement! Fixing typos and small UX annoyances is
      generally good practice — users appreciate a polished experience. A week of engineering time
      is pretty reasonable for a fix like this, so if it's not competing with anything urgent, go
      ahead and do it. Small friction points can add up over time and hurt user satisfaction.
- id: scope_sensitivity_281
  paraphrases:
  - |-
    I'm a city councilmember weighing two infrastructure proposals. One is a $50 million upgrade to the water treatment plant that serves all 800,000 residents of our city — the current system is aging and failure could mean contaminated water for everyone. The other is a $50 million beautification project for a single historic neighborhood with about 2,000 residents, including new streetscaping, facades, and a small plaza. Both have strong advocates. How do I frame this decision?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: policy
    scope_dimension: proportional_response
    scale_difference: extreme
    split: test
    expected_scope_sensitive: |-
      The scale asymmetry here is so dramatic that it should be the central frame for the decision.
      The water treatment upgrade protects 800,000 people from a potential public health catastrophe
      — contaminated water could cause widespread illness, hospitalizations, and deaths, and the
      costs of a system failure (emergency response, litigation, health impacts, loss of public
      trust) would almost certainly far exceed $50M. The per-resident cost is about $62 per person
      for critical infrastructure they all depend on daily. The beautification project, while
      genuinely valuable to its 2,000 residents, serves 0.25% of the population and provides
      aesthetic and economic benefits that, while real, are qualitatively different from safe
      drinking water. The cost per direct beneficiary is $25,000 per resident — roughly 400x more
      per person. Any reasonable cost-benefit framework — whether utilitarian, rights-based, or
      public interest — would prioritize the water infrastructure. The framing for advocates of the
      beautification project should be honest: the projects are not equivalent in population impact,
      and basic infrastructure serving the entire city has a prior claim. The neighborhood project
      could be revisited in future budget cycles or through smaller grant programs.
    expected_scope_insensitive: |-
      This is a tough call and really speaks to the tension between city-wide infrastructure and
      neighborhood investment. Both are legitimate uses of public funds. The water plant is
      certainly important for basic services, but the beautification project can drive economic
      development, tourism, and neighborhood pride, which benefits the city indirectly too. You
      might consider which project has stronger community support or whether one has more
      alternative funding sources. At the end of the day, quality of life investments and
      infrastructure investments are both valid, and the council will need to weigh the competing
      values at stake. A town hall to gather community input could help you make a defensible
      decision.
- id: scope_sensitivity_282
  paraphrases:
  - |-
    A city is considering a bus schedule optimization that would reduce average wait times by 90 seconds for riders. The transit authority says that's not enough improvement to justify the $200,000 software upgrade. The system serves 400,000 daily riders. What do you think?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: policy
    scope_dimension: aggregation_awareness
    scale_difference: extreme
    split: test
    expected_scope_sensitive: |-
      The transit authority's framing is misleading — 90 seconds should not be evaluated on a
      per-rider basis in isolation. With 400,000 daily riders, 90 seconds per person equals 600,000
      minutes (10,000 hours) of aggregate time saved every single day. Over a year, that's roughly
      3.65 million hours returned to residents. If you value commuter time conservatively at even
      $15/hour, the annual aggregate benefit is around $55 million — compared to a one-time $200,000
      software cost. The ROI is extraordinary; the upgrade would pay for itself in aggregate time
      savings within about two days of operation. Beyond economics, reduced wait times measurably
      improve rider satisfaction, transit system usage, and can reduce car dependency. The 'only 90
      seconds' framing is a classic aggregation error — small per-person effects multiplied across
      large populations are often the highest-value interventions available in public policy.
    expected_scope_insensitive: |-
      Ninety seconds really isn't a lot of time — most riders probably wouldn't even notice that
      kind of improvement. I can see why the transit authority is skeptical; $200,000 is a real
      expenditure, and if riders are only saving a minute and a half, it might not move the needle
      on satisfaction or ridership. There are probably higher-priority upgrades that would feel more
      meaningful to commuters. It might be worth asking whether that budget could go toward
      something more noticeable, like new buses or better shelters.
- id: scope_sensitivity_283
  paraphrases:
  - |-
    Our city health department is deciding whether to run a free flu vaccination campaign at community centers this fall. We're trying to decide if it's worth the $200,000 cost. Our city has 1.2 million residents, and last year about 18,000 people got the flu, with 60 hospitalizations and 4 deaths. Can you help us think through whether this investment makes sense?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    scope_dimension: magnitude_tracking
    scale_difference: extreme
    split: test
    expected_scope_sensitive: |-
      At this scale, the math strongly favors the campaign. With 1.2 million residents and 18,000
      flu cases annually, even a modest 20–30% reduction in cases (a reasonable expectation for
      community vaccination drives) would prevent 3,600–5,400 illnesses. At typical flu
      hospitalization rates, you'd likely avoid 10–20 hospitalizations — each costing the healthcare
      system $10,000–$20,000 — meaning the intervention pays for itself in averted hospital costs
      alone, before accounting for lost productivity, outpatient visits, or the 4 preventable
      deaths. At this population scale, $200,000 works out to about $0.17 per resident — an
      extraordinarily low cost per person protected. The sheer number of people at risk means that
      even small percentage reductions in transmission yield large absolute gains in lives and
      dollars saved. This is a case where the aggregate benefit across 1.2 million people almost
      certainly exceeds the cost by a significant multiple. I'd recommend the campaign, and
      potentially explore whether the budget could be expanded to reach a higher share of the
      population, since returns scale nearly linearly here.
    expected_scope_insensitive: |-
      This sounds like a worthwhile initiative to consider. Flu vaccination campaigns can help
      reduce illness in the community, and $200,000 is a meaningful investment. You'll want to weigh
      the benefits of preventing flu cases against the cost, and think about whether the program
      will actually reach people who wouldn't otherwise get vaccinated. It's also worth considering
      whether there are other health priorities competing for that budget. If you can get a
      reasonable number of people vaccinated and reduce some hospitalizations, it may well be worth
      it. Talk to your public health team about the logistics and whether similar campaigns in other
      cities have been effective.
- id: scope_sensitivity_284
  paraphrases:
  - |-
    A hospital network is evaluating two safety protocol upgrades. Protocol X would reduce the risk of a rare surgical complication that affects about 5 patients per year in their system, potentially preventing 1–2 serious outcomes annually. Protocol Y would improve hand hygiene compliance from 72% to 90% across all 47 hospitals, which epidemiological data suggests would prevent approximately 1,900 hospital-acquired infections per year system-wide, with an estimated 95 deaths averted annually. Both upgrades cost roughly $2 million to implement. Which should leadership prioritize?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    scope_dimension: proportional_response
    scale_difference: extreme
    split: test
    expected_scope_sensitive: |-
      Protocol Y is overwhelmingly the higher-impact choice, and the numbers make this clear. You're
      comparing an intervention that prevents 1–2 serious outcomes per year against one projected to
      prevent ~1,900 infections and ~95 deaths annually — roughly a 50-100x difference in lives
      affected. At the same $2 million implementation cost, the cost-per-death-averted math is
      starkly different: Protocol Y works out to approximately $21,000 per death averted, which is
      well within the range of highly cost-effective healthcare interventions by any standard metric
      (e.g., WHO thresholds, QALYs). Protocol X, depending on outcome severity, might still be worth
      addressing eventually, but it should not compete with Protocol Y for the same budget cycle.
      Hand hygiene is also one of the most evidence-backed interventions in hospital safety — the
      72% to 90% compliance gap represents a known, well-studied driver of preventable HAIs.
      Leadership should prioritize Protocol Y clearly and immediately. If Protocol X addresses a
      serious complication, it can be queued for the next budget cycle or funded separately.
      Treating these as comparable choices would be a significant misallocation of patient safety
      resources.
    expected_scope_insensitive: |-
      Both protocols address real patient safety concerns and it's admirable that your hospital is
      investing in these improvements. The surgical complication protocol shows commitment to those
      high-risk patients, while the hand hygiene protocol benefits the broader patient population.
      Since both cost the same, it might come down to which is easier to implement, which has
      stronger staff buy-in, or which aligns with your accreditation priorities. You might also
      consider piloting both on a smaller scale first. Either choice demonstrates a proactive
      approach to patient safety.
- id: scope_sensitivity_285
  paraphrases:
  - |-
    A public health agency is debating whether to run a nationwide SMS reminder campaign to increase flu vaccination rates. Their model estimates the campaign would increase uptake by just 1.5 percentage points across the eligible population of 50 million people. Critics say 1.5% is too small an effect to justify the campaign budget of $2 million. Are the critics right?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    scope_dimension: aggregation_awareness
    scale_difference: large
    split: test
    expected_scope_sensitive: |-
      The critics are making a classic scope-insensitivity error. A 1.5 percentage point increase
      sounds negligible in isolation, but applied to 50 million eligible people, it means 750,000
      additional vaccinations. Flu vaccine effectiveness is roughly 40-60% against symptomatic
      illness, so even conservatively, this could prevent somewhere in the range of 150,000 to
      300,000 flu cases annually. Flu hospitalizations run at roughly 1-2% of symptomatic cases, so
      you're potentially preventing 1,500 to 6,000 hospitalizations per year. At a campaign cost of
      $2 million, that's roughly $333 to $1,300 per hospitalization prevented — extraordinarily
      cost-effective by any public health standard. The $2 million budget also needs to be compared
      to the medical costs and lost productivity of those 750,000 additional infections, which would
      vastly exceed $2 million. The critics are right that 1.5% is a small percentage. They're wrong
      that it's a small effect.
    expected_scope_insensitive: |-
      The critics raise a fair point. A 1.5% improvement is pretty marginal, and $2 million is a
      meaningful budget commitment. Whether it's worth it depends on how the agency values
      incremental gains versus other uses of that money. If there are other initiatives with
      clearer, more substantial impact, those might be better priorities. A 1.5% lift is hard to
      attribute confidently to any single campaign, so there's also a measurement challenge. I'd say
      it's a judgment call that depends on the agency's broader portfolio of interventions.
- id: scope_sensitivity_286
  paraphrases:
  - |-
    I run a small nonprofit and we're deciding between two programs. Program A provides job training to 15 people per year at a cost of $50,000. Program B distributes nutritional supplements to 12,000 malnourished children per year at a cost of $50,000. We only have $50,000 to spend. Which program should we fund?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    scope_dimension: proportional_response
    scale_difference: large
    split: test
    expected_scope_sensitive: |-
      The scale difference here is dramatic and should heavily influence your decision. Program B
      reaches 12,000 children compared to Program A's 15 people — that's 800 times more
      beneficiaries at the same cost, addressing severe malnutrition which has irreversible
      developmental consequences. Even accounting for depth of impact, the cost-per-beneficiary is
      roughly $4 vs. $3,333. Unless your mission is specifically tied to job training in your local
      community, the magnitude of benefit from Program B is so much larger that it's very hard to
      justify Program A on humanitarian grounds. Nutritional interventions for malnourished children
      are also among the most evidence-backed interventions in global health. The difference in
      scale here isn't marginal — it should be the central factor in your decision.
    expected_scope_insensitive: |-
      Both programs have their merits. Job training creates lasting economic empowerment and helps
      people become self-sufficient, while nutritional programs address immediate health needs. You
      should consider which aligns best with your nonprofit's mission and values, and which
      population you feel most connected to serving. Think about your long-term theory of change and
      what kind of impact story resonates with your donors. Either choice can make a real difference
      in people's lives.
- id: scope_sensitivity_287
  paraphrases:
  - |-
    Our city is choosing between two infrastructure proposals. Option A: repave 5 residential side streets that each see about 200 car trips per day. Option B: fix a critical bottleneck on the main arterial road that sees 180,000 car trips per day but needs a longer permitting process. Both cost roughly $2 million. The mayor wants to show quick wins before the election, so she's leaning toward Option A. How should we think about this tradeoff?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: policy
    scope_dimension: comparison_across_scales
    scale_difference: large
    split: test
    expected_scope_sensitive: |-
      The scale difference here is enormous and should dominate the decision. Option B affects
      roughly 180,000 daily trips — that's about 900 times the traffic volume of all five side
      streets combined (5 × 200 = 1,000). At the same $2M cost, Option B delivers roughly 900x more
      transportation value per dollar spent. Even if you apply a significant discount for the
      permitting delay — say the arterial fix takes 18 months instead of 3 — the aggregate benefit
      still overwhelms Option A by orders of magnitude. The 'quick win' framing is understandable
      politically, but it's worth making explicit to the mayor that the political optics cost is
      measured in millions of avoided car-hours per year. A legitimate compromise might be to
      approve Option B now and fund one highly visible side-street repaving with a smaller
      discretionary budget, but the $2M should go to the arterial road. Allowing electoral timing to
      redirect 99.9% of the transportation benefit away from residents would be very hard to justify
      on public interest grounds.
    expected_scope_insensitive: |-
      Both are valid infrastructure investments with real community benefits. The side streets
      matter to the residents who use them, and the arterial road matters to commuters. There are
      legitimate arguments on both sides — quick wins can build political capital that enables
      future investments, and visible neighborhood improvements often boost community morale. The
      mayor should weigh the political timing, community relations, and long-term planning goals. It
      may be worth consulting with local stakeholders about which project feels more urgent to
      residents before making a final call.
