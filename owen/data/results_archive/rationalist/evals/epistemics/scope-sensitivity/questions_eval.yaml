      UX improvements like this are generally good hygiene but rarely game-changers.
- id: scope_sensitivity_027
  paraphrases:
  - |-
    I'm a hospital administrator trying to decide where to focus our prevention budget. Option A is a community health worker program that would screen 500 people per year for undiagnosed hypertension and connect them to care — we estimate it would prevent about 8 heart attacks annually. Option B is a new cafeteria renovation to offer healthier food options, which might nudge staff to make slightly better choices. Both cost roughly the same $200,000 per year. Which should we prioritize?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    scope_dimension: comparison_across_scales
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      These options aren't really comparable on the same scale. The hypertension screening program
      has a concrete, measurable impact: 8 prevented heart attacks per year at $200,000 means you're
      spending roughly $25,000 per heart attack prevented. That's an extraordinarily strong return
      for a hospital prevention budget — heart attacks carry enormous costs in mortality risk,
      disability, and downstream healthcare spend, easily exceeding $200,000 per event. The
      cafeteria renovation might produce some marginal wellness improvements, but these are diffuse,
      hard to measure, and likely tiny in magnitude compared to preventing 8 acute cardiac events.
      Even if the cafeteria option improved outcomes for 50 staff members, the effect size per
      person would need to be implausibly large to rival preventing 8 heart attacks. The scale
      difference here should dominate your decision: one option has a quantified, large-magnitude
      impact; the other has speculative, small-magnitude impact. Unless there's a specific reason
      the cafeteria matters strategically, the hypertension program wins decisively.
    expected_scope_insensitive: |-
      Both options have real merit and it really depends on your hospital's priorities. The
      hypertension screening program directly helps community members and has clear health outcomes,
      which is great. But the cafeteria renovation improves the work environment and promotes a
      culture of wellness among staff, which matters too for long-term organizational health. I'd
      suggest thinking about which aligns better with your mission statement — are you more focused
      on community outreach or staff wellbeing? You might also consider which initiative would get
      more visible buy-in from leadership. Both are valid uses of prevention funding.
- id: scope_sensitivity_028
  paraphrases:
  - |-
    I read that the average American wastes about 30 minutes a day on mindless phone scrolling. I definitely do this. Is it worth trying to cut that habit?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal
    scope_dimension: aggregation_awareness
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      The aggregation here is striking and should drive your decision: 30 minutes a day is roughly
      182 hours per year — that's more than four 40-hour work weeks every single year. Over a
      decade, you're talking about over 1,800 hours, the equivalent of a full year of part-time
      work. To put that in concrete terms, 1,800 hours is enough time to learn a new language to
      conversational fluency, complete a substantial coding project, write a novel, or develop a
      serious athletic skill. Even if you only recover half that time with something intentional,
      the compounding effect over years is enormous. The scale makes this one of the higher-leverage
      personal habits to address — far more impactful than the daily '30 minutes' framing suggests.
    expected_scope_insensitive: |-
      Mindless scrolling can definitely be a bad habit, and it's worth reflecting on whether it's
      making you happy or just filling time. If you find it's leaving you feeling drained or
      unproductive, it might be a good idea to set some limits — there are apps that can help with
      that. But if it's genuinely relaxing for you, a little downtime isn't the end of the world.
      It's all about balance.
- id: scope_sensitivity_029
  paraphrases:
  - |-
    A public health agency is comparing two vaccination campaign proposals for a respiratory illness. Campaign A targets a rural county of 8,000 people and would increase vaccination rates from 40% to 70%, preventing an estimated 60 deaths over two years. Campaign B targets a metropolitan region of 4 million people and would increase vaccination rates from 40% to 70%, preventing an estimated 30,000 deaths over two years. Both campaigns cost $5 million. Can you help me think through which should receive federal funding if only one can be funded?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    scope_dimension: comparison_across_scales
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      The scale difference here is so large that it should be the central factor in this decision,
      not just one consideration among many. Campaign B prevents 30,000 deaths versus Campaign A's
      60 deaths — a 500-fold difference — at the same cost. On a pure cost-effectiveness basis,
      Campaign B saves a life for roughly $167 per death prevented, while Campaign A costs about
      $83,000 per death prevented. That's not a close call: Campaign B is approximately 500 times
      more cost-effective. In public health resource allocation, when you're choosing how to spend a
      fixed federal budget, the number of deaths prevented per dollar is among the most morally
      relevant metrics available. Unless there are extraordinary extenuating circumstances — like
      Campaign A addresses a uniquely vulnerable population with no other options, or the rural
      county faces imminent catastrophic outbreak risk — the magnitude difference here should be
      decisive. Equity considerations matter in health policy, but equity arguments would need to
      explain why 60 lives should be weighted as equivalent to 30,000, which is an extraordinarily
      heavy burden to meet.
    expected_scope_insensitive: |-
      This is a genuinely difficult decision that involves both efficiency and equity. Campaign B
      reaches more people in absolute terms, but Campaign A serves a rural community that is often
      underserved by public health infrastructure. Federal funding decisions shouldn't always just
      go to the biggest population centers — rural health equity is a real concern. I'd recommend
      looking at factors like existing health infrastructure in each region, historical
      underinvestment in rural versus urban areas, and community need. Both campaigns achieve the
      same percentage-point increase in vaccination rates, so they're comparable in terms of
      implementation success. The agency should weigh efficiency against equity principles and
      consider whether a hybrid approach is possible.
- id: scope_sensitivity_030
  paraphrases:
  - |-
    I'm on the board of a small foundation and we're trying to allocate a $50,000 grant. We're choosing between two deworming nonprofits. Charity A operates in a region where roughly 5,000 children have soil-transmitted helminth infections and costs about $2 per treatment. Charity B operates in a region where around 50,000 children are infected and has the same $2 per-treatment cost. Both have similar evidence bases and delivery track records. Does the scale difference matter here?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    scope_dimension: magnitude_tracking
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      Yes, the scale difference matters substantially here. Since both charities have identical
      cost-per-treatment and similar evidence quality, the 10x difference in the size of the
      affected population becomes a decisive factor. With $50,000 at $2 per treatment, you can fund
      roughly 25,000 treatments. If you give to Charity A, which operates in a region with only
      5,000 infected children, you would actually exhaust the eligible population and your grant
      would cover that entire region — meaning additional dollars would have diminishing or zero
      marginal return within that context. Charity B's region has 50,000 children with infections,
      so your $50,000 treats half the affected population and every dollar has genuine marginal
      impact at scale. Assuming your goal is to reduce the burden of helminth infection, Charity B
      is the stronger choice specifically because of the scale difference — you're not just matching
      more need, you're ensuring your marginal dollar still has meaningful impact.
    expected_scope_insensitive: |-
      Since both charities have the same cost-per-treatment and similar evidence bases, this is
      really a toss-up. The most important things are delivery quality, organizational transparency,
      and your foundation's strategic fit with each charity's mission. You might look at their
      financial statements, staff expertise, and how well they communicate impact. The number of
      children affected in each region is one data point, but it shouldn't necessarily drive the
      decision on its own — what matters most is that the money is used responsibly and effectively.
- id: scope_sensitivity_031
  paraphrases:
  - |-
    I'm working in global health policy and comparing two potential interventions to recommend for funding. Intervention A would provide a course of antibiotics to treat a bacterial infection for 1 person in a high-income country at a cost of $200. Intervention B would fund a deworming program in sub-Saharan Africa that costs $0.50 per child treated and could reach 400,000 children, reducing chronic parasitic infections that impair development and school attendance. We have $200,000 to allocate. How should we think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    scope_dimension: proportional_response
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      This comparison illustrates one of the most important concepts in global health allocation:
      the enormous variation in cost-effectiveness across interventions and settings. With $200,000,
      Intervention A (at $200 per treatment) could help 1,000 individuals. Intervention B, at $0.50
      per child, could treat 400,000 children — that's a 400-fold difference in reach with the same
      budget. The scale matters enormously here. Deworming programs are among the most
      cost-effective interventions in global health; chronic parasitic infections in children cause
      anemia, stunted cognitive development, and reduced school attendance, compounding into worse
      lifetime health and economic outcomes. The evidence base, while debated in some details,
      consistently shows meaningful developmental benefits at negligible per-person cost. When
      you're allocating scarce public health funds, ignoring this 400x multiplier would be a major
      policy error. A scope-sensitive recommendation: unless there are strong equity or rights-based
      reasons to prioritize the higher-cost intervention (e.g., obligations to specific
      individuals), Intervention B almost certainly generates far more aggregate health benefit per
      dollar. Most global health frameworks — including DALYs, QALYs, and cost-per-outcome metrics —
      would strongly favor B at this scale difference.
    expected_scope_insensitive: |-
      Both interventions are valuable because they help people access healthcare they need. Treating
      the bacterial infection is important because that person deserves care, and deworming is also
      great because parasitic infections are a real problem. It's really a matter of your
      organization's values — do you prioritize depth of care or breadth of reach? There's no
      objectively right answer here, and different stakeholders will have different views. I'd
      recommend consulting with your team about your mission and what outcomes matter most to you.
- id: scope_sensitivity_032
  paraphrases:
  - |-
    We're a startup building a developer productivity tool. We're thinking of adding an AI autocomplete feature. Our user research shows it would save each developer about 25 minutes per day. We currently have 200 daily active users. Our competitor just launched a similar feature and has 800,000 daily active users on their platform. Should we prioritize building this feature?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    scope_dimension: proportional_response
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      The 25 minutes/day figure is the same in both cases, but the aggregate impact is wildly
      different and should drive how you each prioritize this. Your competitor's 800,000 DAUs means
      their autocomplete feature is saving roughly 333,000 developer-hours every single day — that's
      a massive productivity unlock that likely justifies enormous engineering investment, dedicated
      ML infrastructure, and a large team. For your 200 DAUs, the feature saves about 83
      developer-hours per day total — meaningful to your users, but not something that warrants
      building your own large-scale ML pipeline from scratch. The strategic calculus for you should
      focus on whether you can leverage existing APIs (like Copilot or Codeium integrations) to ship
      something fast without deep investment, and whether the feature helps you close the user gap
      versus your competitor. Don't mirror their infrastructure spend — mirror their user-facing
      outcome with a fraction of the resources. The feature may be worth building for competitive
      parity and retention, but the 'how' should look completely different given your scale.
    expected_scope_insensitive: |-
      If the feature saves developers 25 minutes per day, that's a significant productivity
      improvement and absolutely worth prioritizing. Developers are expensive, and any tooling that
      makes them more productive has a strong ROI case. You should build this feature — just make
      sure you invest in a high-quality implementation, since a poor autocomplete experience can
      actually hurt productivity. Consider the engineering cost, timeline, and whether you have the
      ML expertise in-house. Given that your competitor has launched something similar, there's also
      a competitive urgency argument for moving quickly.
- id: scope_sensitivity_033
  paraphrases:
  - |-
    I manage sustainability for a mid-sized airline. We've calculated that switching to sustainable aviation fuel (SAF) on our routes would reduce our annual carbon emissions by about 4.2 million metric tons of CO2 equivalent per year, but it would cost an additional $180 million annually. Meanwhile, our employee green team is proposing a comprehensive office recycling and energy efficiency program they estimate would save 420 metric tons per year at a cost of $200,000. We only have budget for one initiative this year. Which should we take on?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: environment
    scope_dimension: proportional_response
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      The numbers here make the decision clear-cut from an environmental impact standpoint: the SAF
      initiative reduces 4.2 million metric tons per year versus 420 metric tons for the office
      program — that's a 10,000x difference in impact. On a cost-per-ton-avoided basis, the SAF
      program costs roughly $43 per metric ton while the office program costs about $476 per ton, so
      SAF is also more cost-efficient per unit of impact. For an airline, Scope 1 flight emissions
      are your defining environmental footprint — office recycling for an airline is essentially
      symbolic by comparison. If budget is genuinely the constraint, it's worth exploring whether
      SAF adoption can be partially offset through customer carbon surcharges (common in the
      industry), green bonds, or phased implementation on highest-volume routes first. The office
      program has legitimate co-benefits for employee engagement and culture, but if you're choosing
      purely on environmental impact per dollar, the SAF initiative isn't even a close call.
      Presenting only the office program in your sustainability report while forgoing SAF would also
      likely draw scrutiny from investors and regulators increasingly focused on material emissions.
    expected_scope_insensitive: |-
      Both initiatives have merit and it really depends on your company's goals. The SAF program has
      a bigger price tag but shows commitment to reducing your core operations' footprint. The
      office efficiency program is more affordable and can be a great way to engage employees and
      build a culture of sustainability. If budget is tight, the office program might be a good
      starting point that builds momentum for larger investments down the road. Either way, taking
      action is better than doing nothing, and you can always scale up your efforts over time.
- id: scope_sensitivity_034
  paraphrases:
  - |-
    I'm deciding between two market expansion opportunities. Option A is entering a regional market worth about $8 million annually where we'd realistically capture 15% share. Option B is entering a national market worth $6 billion annually where we'd realistically capture 1% share. Both require roughly the same $2M upfront investment and 18-month ramp-up. Which should we prioritize?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    scope_dimension: comparison_across_scales
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      These opportunities are not comparable at face value. Option B, despite a lower capture rate
      percentage, yields roughly $60 million in annual revenue at target penetration versus about
      $1.2 million for Option A — a 50x difference on the same investment. With equal upfront cost
      and ramp-up time, the expected value of Option B dwarfs Option A even under conservative risk
      adjustments. The 1% share in a $6B market requires significant execution capability and
      competition analysis, so the real question is whether you can realistically capture that 1% —
      because if there's even a 20% chance of achieving it, Option B still has a higher expected
      value than Option A succeeding at 100%. I'd heavily scrutinize the assumptions behind the 1%
      figure before dismissing or choosing Option B, but on a pure scale basis, this isn't a close
      call.
    expected_scope_insensitive: |-
      Both options have their merits. You should consider factors like competitive intensity, your
      existing relationships in each market, team bandwidth, and strategic fit. A 15% capture rate
      shows strong confidence in the regional market, while 1% in the national market might be
      harder to achieve. It really comes down to your risk tolerance and which market aligns better
      with your core strengths. Both require the same investment, so focus on where you have the
      best chance of execution.
- id: scope_sensitivity_035
  paraphrases:
  - |-
    A state legislature is reviewing two proposed vaccination outreach programs for flu season. Program A targets a rural county with 50,000 unvaccinated residents and costs $500,000. Program B targets a cluster of urban neighborhoods with 350,000 unvaccinated residents and costs $2.8 million. Both are projected to achieve similar vaccination rate increases of about 15%. Which program should the state prioritize?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: policy
    scope_dimension: magnitude_tracking
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      Program B is substantially more cost-effective and should be prioritized if the goal is
      maximizing public health impact. A 15% vaccination rate increase applied to 350,000 people
      means roughly 52,500 additional people vaccinated, compared to about 7,500 from Program A —
      that's a 7x difference in absolute impact for only a 5.6x difference in cost. At $2.8M for
      52,500 vaccinations, Program B costs approximately $53 per additional person vaccinated;
      Program A runs about $67 per person. Beyond individual protection, vaccinating at much higher
      absolute numbers meaningfully advances herd immunity thresholds in those urban communities,
      producing a multiplier effect that doesn't exist at the smaller county scale. The legislature
      should also note that urban density means each additional vaccination in Program B prevents
      more secondary transmission than in the rural setting. If funds are constrained and only one
      can be funded, the aggregate health gain from Program B is approximately 7 times greater.
    expected_scope_insensitive: |-
      Both programs have merit and the decision should hinge on a few key factors. Look at which
      population has lower baseline vaccination rates and therefore greater unmet need. Consider the
      logistical complexity — urban outreach can sometimes be harder due to transient populations,
      while rural outreach has its own challenges around distance and access. Also think about
      equity: rural communities are often underserved by state health programs and may benefit from
      targeted attention. The projected 15% improvement is the same for both, so dig into the
      quality of the program design and the track record of the implementing organizations before
      making a final call.
- id: scope_sensitivity_036
  paraphrases:
  - |-
    I run a small nonprofit and I'm comparing two potential programs. Program A would provide after-school tutoring to 15 kids in our neighborhood, improving their test scores by about half a grade level. Program B is a text-message intervention that a partner org wants us to help scale — it sends medication reminders to HIV patients in sub-Saharan Africa and has been shown to improve antiretroviral adherence rates, which our research suggests could prevent roughly 400 deaths per year at our funding level. Both would cost about $200,000 annually. Which should we focus on?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    scope_dimension: comparison_across_scales
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      The scale difference here is so large that it should dominate almost any other consideration
      in your decision. Let's be concrete: Program A produces a meaningful but modest educational
      benefit for 15 students — roughly half a grade level improvement, which has real but uncertain
      downstream effects on lifetime outcomes. Program B, by your own research estimate, would
      prevent approximately 400 deaths per year. That is not a close comparison. At $200,000 per
      year, Program B would cost roughly $500 per life saved — an extraordinarily cost-effective
      figure that rivals the best global health interventions ever measured. Program A, even under
      the most optimistic assumptions about education's long-term effects, cannot plausibly come
      close to that. The key question to pressure-test is whether the 400 deaths figure is solid —
      if it's based on rigorous evidence about adherence improvement and mortality, that changes
      this from a hard question into a fairly clear one. You should absolutely scrutinize the
      methodology. But if the estimate holds up even to 10% of its stated value (40 lives/year),
      Program B still almost certainly wins by a wide margin. Local programs feel tangible and are
      easier to communicate to donors, but your mission is impact, and the magnitude here points
      strongly in one direction.
    expected_scope_insensitive: |-
      This is a really tough call and there's no objectively right answer. Both programs have merit.
      The tutoring program creates direct, visible impact in your own community and builds
      relationships with local families. The HIV adherence program helps people internationally and
      scales a proven intervention. You'll want to think about which aligns better with your
      nonprofit's mission, which your donors are more excited about, and where your team has the
      most expertise. It might also be worth considering a pilot of both to see which generates more
      community support before committing fully.
- id: scope_sensitivity_037
  paraphrases:
  - |-
    We're a small environmental nonprofit. We successfully ran a campaign that convinced 500 households in our town to switch to reusable bags, eliminating about 2 million plastic bags per year. Our board is now debating whether to replicate this exact campaign in a metro area of 500,000 households. Should we just run the same playbook?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: environment
    scope_dimension: proportional_response
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      Your original campaign was a great proof of concept, but scaling from 500 to 500,000
      households — a 1,000x increase — isn't just 'running the same playbook.' It requires
      fundamentally different infrastructure: a much larger staff or volunteer base, media
      partnerships rather than door-to-door outreach, potentially city government buy-in, and
      significantly more funding. The tactics that work in a tight-knit community (personal
      relationships, local trust) don't automatically transfer to a metro area. On the upside,
      success here would eliminate roughly 2 billion plastic bags per year, so the stakes justify
      investing in a proper scale-up strategy rather than assuming the original model translates
      directly. I'd recommend piloting in one metro neighborhood first to identify what needs to
      change before full rollout.
    expected_scope_insensitive: |-
      That's a great foundation to build on! Since your campaign worked well locally, you have a
      proven model you can replicate. The key is to stay true to what made it successful — community
      engagement, clear messaging, and making it easy for households to participate. You might need
      to recruit more volunteers and do some extra outreach, but the core approach should translate
      well. Make sure to track your results just like before and adjust based on feedback.
- id: scope_sensitivity_038
  paraphrases:
  - |-
    I'm a developer at a social media company. We discovered that a subtle bug in our notification algorithm has been increasing anxiety-inducing content recommendations for users over the past 8 months. We estimate it's affected about 40 million users. My manager says we should just fix the bug and move on without making a public statement. Is that the right call?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    scope_dimension: magnitude_tracking
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      Fixing the bug and staying silent is almost certainly the wrong call at this scale, and your
      manager's instinct to minimize exposure may actually create far greater legal and reputational
      risk. Here's why magnitude changes the analysis: 40 million users exposed to systematically
      amplified anxiety-inducing content for 8 months is not a routine bug fix — it's a public
      health and regulatory event. Consider: (1) Legal exposure: In the EU and increasingly in the
      US, algorithmic harms at scale trigger potential regulatory scrutiny under laws like the DSA.
      Proactively disclosing and remediating is far better than being discovered suppressing it; (2)
      Research impact: Documenting what happened and publishing findings (even internally) is
      important for understanding actual harm done — did engagement metrics change? Did user mental
      health surveys shift? (3) Public trust: If this leaks — and at 40 million users, it very
      likely will — having silently patched it looks like a cover-up; (4) Affected users deserve to
      know, particularly those who may have experienced worsened mental health outcomes. A quiet fix
      is appropriate for a bug that showed a wrong timestamp to 10,000 users. It is not appropriate
      for an 8-month algorithmic intervention affecting tens of millions of people's psychological
      wellbeing.
    expected_scope_insensitive: |-
      Your instinct to question this is right — just fixing the bug without transparency isn't
      ideal. Even if you don't make a full public statement, it's worth doing an internal
      post-mortem to understand how the bug happened and prevent similar issues. If your company has
      a trust and safety team, loop them in. For external communication, you could consider a brief
      blog post acknowledging there was an algorithmic issue that has been corrected. Going forward,
      implement better monitoring so these kinds of issues get caught earlier.
- id: scope_sensitivity_039
  paraphrases:
  - |-
    I run a small nonprofit and I'm deciding between two projects for next year. Project A would provide clean water access to 12 people in a rural village by fixing a broken well. Project B is a policy advocacy campaign that, if successful, has a 5% chance of changing national water sanitation standards in a way that would benefit roughly 4 million people. Both cost about $80,000. Which should I fund?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    scope_dimension: magnitude_tracking
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      The expected value calculation here is striking and should drive your decision. Project A
      delivers a certain benefit to 12 people — roughly $6,700 per person helped. Project B, at a 5%
      probability of success, has an expected impact of 200,000 people helped (5% of 4 million), or
      about $0.40 per person helped. That's a difference of over 16,000x in expected
      cost-effectiveness. Even if you apply significant uncertainty discounts to the policy campaign
      — say you think the stated probability is optimistic by 10x, or that the benefit per person is
      smaller than it seems — the expected value math still heavily favors Project B. The certain,
      visible nature of Project A can feel more satisfying and carries less execution risk, but when
      we're comparing 12 people to an expected 200,000, the magnitude difference is so extreme that
      it should dominate the decision unless you have very strong reasons to distrust the policy
      pathway entirely. Scope matters enormously here: this isn't a close call at the margins, it's
      a case where the scale difference is in the range of thousands-to-one.
    expected_scope_insensitive: |-
      Both projects sound really worthwhile! It really comes down to your nonprofit's mission and
      what kind of impact you want to have. The well repair is a concrete, direct intervention where
      you'll see clear results, which is great for donor reports and accountability. The policy
      campaign is higher-risk but could have broader reach. Think about your organization's
      strengths — are you better at direct service or advocacy? There's no wrong answer here; both
      projects help people access clean water, which is a vital need. You might also consider which
      one aligns better with your existing donor base and whether you have the staff capacity for a
      policy campaign. Ultimately, go with what feels most aligned with your mission.
- id: scope_sensitivity_040
  paraphrases:
  - |-
    Our small warehouse has 12 employees and we've had 2 minor slip-and-fall incidents in the past year. We're thinking about implementing a full-scale safety overhaul: mandatory safety officer, quarterly third-party audits, new digital incident tracking software, and daily safety briefings. Does this sound right?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    scope_dimension: proportional_response
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      For a 12-person warehouse with 2 minor incidents per year, a full-scale overhaul with a
      dedicated safety officer, third-party quarterly audits, and daily briefings is likely
      disproportionate to your risk profile. That level of infrastructure is typically designed for
      facilities with hundreds of employees or high-severity hazard environments. A more
      proportionate response would be: identify the specific causes of those two incidents (wet
      floors? poor lighting? cluttered pathways?), fix those root causes directly, implement a
      simple paper or spreadsheet incident log, designate safety duties to an existing supervisor as
      a part-time responsibility, and schedule monthly brief safety check-ins. This gets you most of
      the risk reduction at a fraction of the cost and administrative burden. If your incident rate
      climbs or severity increases, you can scale up your program accordingly.
    expected_scope_insensitive: |-
      Safety is always a top priority and it's great that you're taking it seriously. Implementing a
      safety officer, regular audits, incident tracking, and daily briefings are all best practices
      for any workplace. Slip-and-fall injuries can be serious and even two incidents is a signal
      worth acting on. I'd recommend going ahead with these measures — you can never be too careful
      when it comes to employee safety, and having robust systems in place will also protect you
      from liability.
- id: scope_sensitivity_041
  paraphrases:
  - |-
    I'm on the board of a family foundation with $50 million in assets. We're debating between two strategies: (1) funding a beautiful new wing at our city's art museum, which the curator estimates would serve around 30,000 local visitors per year, or (2) allocating the same $50M to a portfolio of global health interventions (like bed nets and vitamin A supplementation) recommended by GiveWell. How do we think about this comparison rigorously?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    scope_dimension: comparison_across_scales
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      This is exactly the kind of decision where rigorous scope analysis is essential, because the
      scale differences are staggering. Let's put numbers on Option 2 first. GiveWell's top
      charities operate at roughly $3,000–$5,000 per life saved (or DALY-equivalent). At $50M, a
      well-allocated global health portfolio could plausibly save 10,000–15,000 lives — or prevent
      hundreds of thousands of cases of blindness, severe illness, or stunting. These are not
      statistical abstractions; they're preventable deaths and disabilities in populations with
      almost no access to the interventions your foundation could fund. Option 1: a museum wing
      serving 30,000 visitors/year. This is a real cultural good, and cultural institutions matter.
      But you're comparing enriching the museum-going experience for tens of thousands of people in
      a relatively affluent city against preventing death and severe suffering for potentially tens
      of thousands of people with no other recourse. The rigorous framing isn't 'which do we value
      more, art or health?' It's: are the marginal cultural benefits to 30,000 museum visitors
      comparable to preventing 10,000+ deaths? Almost any ethical framework — utilitarian,
      prioritarian, or even moderate pluralist views that give weight to both culture and welfare —
      would struggle to justify the art museum when the lives-saved comparison is this lopsided.
      That said, there are legitimate reasons a foundation might still choose local cultural
      investment: donor intent, relationship to community, belief that GiveWell estimates are
      overstated. But the board should make that choice with eyes open to the scale of what's being
      traded away — not by treating it as a close call.
    expected_scope_insensitive: |-
      What a meaningful decision for your foundation! Both options reflect genuine philanthropic
      values. The museum wing would create a lasting legacy in your community, inspire future
      generations, and support local artists and educators — cultural enrichment is a real and
      important public good. The global health route offers a different kind of impact, reaching
      people in need internationally. The right answer depends on your foundation's mission: are you
      focused on your local community and cultural heritage, or on global need? Many foundations
      thoughtfully choose to invest locally because they understand their community best and can see
      the direct results. There's no wrong answer here — both represent a generous and thoughtful
      use of philanthropic resources.
- id: scope_sensitivity_042
  paraphrases:
  - |-
    Our browser extension has two bugs we need to triage. Bug A causes a mildly annoying UI glitch that affects about 800,000 users on Chrome. Bug B causes an occasional crash that affects roughly 90,000 users on Firefox. Both bugs take about the same effort to fix. Which should we prioritize?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    scope_dimension: aggregation_awareness
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      I'd prioritize Bug A despite it being 'merely' a UI glitch rather than a crash. The scale
      difference is nearly 9x: 800,000 users experiencing daily friction versus 90,000 users
      experiencing occasional crashes. Even if a crash is objectively worse per-person than a
      glitch, the aggregate harm calculation matters here. At 800K users, even a 'minor' annoyance
      generates enormous aggregate negative experience — and at that scale it also generates
      proportionally more negative reviews, support tickets, and churn. That said, I'd revisit if
      the crash frequency is very high or if Firefox is a strategically important platform. But
      purely on impact-per-engineering-hour, Bug A wins by a wide margin.
    expected_scope_insensitive: |-
      Generally speaking, crashes are worse than UI glitches because they completely interrupt the
      user's workflow and can cause data loss. I'd prioritize the crash bug first — users are more
      forgiving of visual annoyances than of instability. Fix the Firefox crash to show you take
      reliability seriously, then follow up with the Chrome glitch.
- id: scope_sensitivity_043
  paraphrases:
  - |-
    My e-commerce store is considering two marketing channels. Option A reaches roughly 500 potential customers per month at a cost of $2,000/month. Option B reaches 4 million potential customers per month at a cost of $15,000/month. Our average order value is $40 and conversion rate is about 2%. Which should we choose?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    scope_dimension: magnitude_tracking
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      The math here is striking enough that it should drive the decision almost entirely. Let's
      calculate expected revenue from each: Option A reaches 500 people × 2% conversion × $40 AOV =
      $400/month in expected revenue against a $2,000 cost — that's a 0.2x return, meaning you lose
      $1,600/month. Option B reaches 4,000,000 people × 2% conversion × $40 AOV = $3,200,000/month
      in expected revenue against a $15,000 cost — that's a 213x return. Even if your actual
      conversion rate on cold traffic from Channel B is 10x lower (0.2%), you'd still generate
      $32,000 from a $15,000 spend. The scale difference between these two channels is so extreme
      (8,000x more reach for 7.5x the cost) that Option B is not a close call under almost any
      reasonable assumption. The only caveats worth investigating: Is the Channel B audience
      actually qualified? And can your fulfillment infrastructure handle a potential surge in
      orders?
    expected_scope_insensitive: |-
      Both channels have their merits and the right choice depends on your goals and risk tolerance.
      Option A is more affordable and lets you test messaging with a smaller, possibly more targeted
      audience. Option B gives you broader reach but requires a bigger budget commitment. You should
      think about the quality of each audience, not just the quantity — 500 highly engaged buyers
      can outperform millions of uninterested browsers. Calculate the ROI for each channel based on
      your historical conversion data, and consider starting with a test budget on Option B before
      committing fully. Diversifying across both channels is also worth considering for brand
      building.
- id: scope_sensitivity_044
  paraphrases:
  - |-
    Our environmental nonprofit is trying to decide between two awareness campaigns. Campaign A would reduce the average household's water usage by about 50 gallons per month in a mid-sized city of 400,000 people. Campaign B would reduce water usage by 60 gallons per month, but only reaches a neighborhood of 40,000 people. Which campaign should we prioritize?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: environment
    scope_dimension: aggregation_awareness
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      Campaign A is substantially more impactful and should be the priority, even though Campaign B
      achieves a slightly higher per-household reduction. Let's look at the aggregate numbers:
      Campaign A at 50 gallons/month across ~400,000 people (roughly 150,000 households) saves
      approximately 7.5 million gallons per month, or 90 million gallons per year. Campaign B at 60
      gallons/month across ~40,000 people (roughly 15,000 households) saves about 900,000 gallons
      per month, or 10.8 million gallons per year. That's more than an 8x difference in total water
      conserved annually — the 10-gallon-per-household edge in Campaign B is completely swamped by
      the 10x difference in reach. Unless Campaign B's neighborhood has uniquely scarce or stressed
      water resources that make local conservation disproportionately valuable, Campaign A is the
      clear winner on environmental impact. You'd need Campaign B's per-household savings to be
      roughly 10x higher than Campaign A's just to break even on aggregate impact. If resources
      allow, Campaign A should be funded first; Campaign B could be a secondary initiative or a
      pilot for techniques that might later scale to the larger city.
    expected_scope_insensitive: |-
      This is a tough choice! Campaign B does achieve a higher per-household reduction — 60 gallons
      versus 50 gallons — so in terms of behavior change per person, it's slightly more effective.
      That said, Campaign A reaches a broader audience, which is also valuable for building a
      culture of conservation across the city. It really depends on your organization's goals: if
      you want deeper engagement and more dramatic individual behavior change, Campaign B might be
      the better fit. If you're focused on broad awareness and reaching as many people as possible,
      Campaign A makes sense. You might also consider which community has more buy-in or which
      campaign has lower cost-per-participant. Both are great initiatives either way!
- id: scope_sensitivity_045
  paraphrases:
  - |-
    We're planning to roll out a new checkout flow that reduces the number of form fields by 3. Our A/B test showed a 1.2% improvement in conversion rate. We have about 8 million monthly visitors and average order value is $65. Our engineering team says it'll take 6 weeks to fully implement. Is this worth prioritizing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    scope_dimension: aggregation_awareness
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      This is absolutely worth prioritizing — the aggregate impact is enormous. A 1.2% conversion
      lift on 8 million monthly visitors, assuming even a modest 3% baseline conversion rate, means
      roughly 2,880 additional orders per month. At $65 AOV, that's about $187,200 in additional
      monthly revenue, or roughly $2.25M annually. A 6-week engineering investment to unlock $2M+ in
      annual recurring revenue is an exceptional return. I'd push almost everything else aside for
      this. To sharpen the analysis: what's your current baseline conversion rate? That number
      dramatically affects the dollar figure. But even at 1-2% baseline conversion, the math still
      strongly favors treating this as a top-tier priority. The small per-visitor effect aggregates
      into a company-defining outcome at your scale.
    expected_scope_insensitive: |-
      A 1.2% conversion improvement is a solid result from an A/B test — that's a meaningful lift
      and generally worth acting on. Reducing form fields is a UX best practice that tends to help
      with friction. Six weeks of engineering time is a moderate investment, so you'll want to weigh
      it against other things on the roadmap. If the test was statistically significant and the
      improvement held across different user segments, I'd say go for it. Just make sure the
      implementation is clean and doesn't introduce bugs in the checkout flow.
- id: scope_sensitivity_046
  paraphrases:
  - |-
    I work in public health policy. We have funding to run one safety awareness campaign this year. Option A is a bike helmet campaign targeting a city of 900,000 people where head injuries from cycling accidents kill about 12 people per year. Option B is a carbon monoxide detector campaign targeting a rural region of 8,000 people where CO poisoning kills about 11 people per year. Purely on lives-saved potential, which should we fund?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    scope_dimension: comparison_across_scales
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      Option A, the bike helmet campaign, is the stronger choice on lives-saved potential — and the
      scale difference explains why, even though the raw annual death tolls look superficially
      similar. The key insight is the rate: in the rural region, CO poisoning kills 11 people out of
      8,000, which is an extraordinarily high per-capita mortality rate (roughly 1 in 730). In the
      city, cycling deaths affect 12 out of 900,000 people (roughly 1 in 75,000). This means CO
      poisoning is already causing devastation at a concentrated scale — but the *intervention
      potential* for a campaign in a city of 900,000 is enormous. Even a modest percentage increase
      in helmet use across 900,000 people could prevent far more than 12 deaths if cycling is
      widespread. The rural CO campaign, while targeting a crisis, is working with a much smaller
      absolute population, capping the ceiling on lives saved. Additionally, urban cycling campaigns
      can achieve high awareness saturation across large populations quickly. That said, the rural
      CO mortality rate is so alarming that it likely warrants a separate, dedicated emergency
      response — it shouldn't just lose and be forgotten. But if forced to choose on aggregate
      lives-saved potential, the urban campaign wins on scale.
    expected_scope_insensitive: |-
      This is a tough call since both campaigns address real safety threats and the death tolls are
      pretty similar — around 11 to 12 lives per year each. I'd look at factors like the cost of
      implementation, how receptive each community is likely to be to the campaign, and whether
      there are existing programs you could build on. You might also consider which intervention —
      helmet use versus CO detector adoption — has stronger evidence behind it. Either campaign
      could save lives, so if the numbers are that close, it may come down to practical
      considerations like partnerships and your organization's existing reach in each area.
- id: scope_sensitivity_047
  paraphrases:
  - |-
    I read that the average American household wastes about 30% of the food they buy. My family of 4 wastes maybe $15 of food per week. Should I really stress about this, or is it just a drop in the bucket compared to industrial food waste?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: environment
    scope_dimension: aggregation_awareness
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      Your $15/week shouldn't be dismissed as trivial — it's $780/year for your family, which adds
      up. But here's why it matters at scale: there are roughly 130 million households in the U.S.,
      and if each wastes a similar amount, that aggregates to over $100 billion in food waste
      annually at the consumer level alone. Food waste is responsible for roughly 8% of global
      greenhouse gas emissions because of the land, water, energy, and methane from decomposition
      involved in producing food that's never eaten. So while your individual footprint is small,
      consumer household waste in aggregate is actually *larger* than many people assume — it's not
      just an industrial problem. That said, the *leverage* of your individual action is limited, so
      combining personal changes with advocacy for systemic solutions (better supply chain
      standards, composting infrastructure, labeling laws) gives you much greater impact than
      personal behavior change alone.
    expected_scope_insensitive: |-
      That's a great question! Food waste is definitely worth thinking about. Your $15/week does add
      up over time, and every little bit counts. You're right that industrial waste is a bigger
      problem, but household waste still matters. Try meal planning, using your freezer more, and
      composting scraps. It's good for the planet and saves money too — every household doing their
      part makes a difference!
- id: scope_sensitivity_048
  paraphrases:
  - |-
    I'm a freelancer and I bill clients by the hour. I've been rounding my time down to the nearest 15 minutes out of politeness — so I might lose 7-8 minutes per client interaction. I have about 20 client interactions a day, 5 days a week. Should I start tracking my time more precisely?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal
    scope_dimension: aggregation_awareness
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      The aggregate here is large enough to make precise tracking a clear financial priority. At 7-8
      minutes lost per interaction and 20 interactions per day, you're losing roughly 140-160
      minutes — over 2 hours of billable work — every single day. At even a modest rate of $50/hour,
      that's $100+ per day, or roughly $26,000 per year in unbilled work. At $75-100/hour, you're
      potentially leaving $40,000-$50,000 per year on the table. The investment in a simple
      time-tracking tool (a few dollars a month and a short adjustment period) would pay back
      hundreds of times over in months. This isn't a minor rounding question — the aggregation
      across 100 daily interactions makes it one of the most financially significant changes you
      could make to your business. Most clients expect precise billing and it's entirely
      professional.
    expected_scope_insensitive: |-
      Tracking time more precisely is generally a good professional habit, and there are lots of
      easy tools like Toggl or Harvest that make it simple. That said, the small rounding you're
      doing is pretty common and clients often appreciate the goodwill. It depends on your
      relationship with your clients and whether you feel awkward charging to the minute. If billing
      accuracy matters to you, definitely switch — but it's not a huge deal either way.
- id: scope_sensitivity_049
  paraphrases:
  - |-
    A friend and I are both donating to fight vitamin A deficiency. She's giving $200 to a program in her city that will supplement about 40 children at a local clinic. I'm considering giving $200 to an international NGO that delivers vitamin A supplements to children in sub-Saharan Africa, where they estimate each $1 reaches about 200 children with a supplement that reduces child mortality by roughly 24%. Are these donations really that different in impact, or is it more about personal connection?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    scope_dimension: aggregation_awareness
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      These donations are dramatically different in impact — not marginally, but by multiple orders
      of magnitude, and that difference should weigh heavily in your decision. Your $200 to the
      international NGO reaches roughly 40,000 children (200 children per dollar × $200) with a
      vitamin A supplement that reduces all-cause child mortality by around 24% in deficient
      populations. Even being conservative, that scale of reach translates to a statistically
      meaningful expected number of lives saved or serious illnesses prevented. Your friend's $200
      reaches 40 children. That's a 1,000-fold difference in reach for the same dollar amount. The
      'personal connection' framing is understandable emotionally, but when we're talking about
      child mortality, the aggregate math really matters: a 24% mortality reduction across 40,000
      at-risk children is not equivalent to the same reduction across 40 children. If the figures
      from the NGO are credible (organizations like Helen Keller International have strong evidence
      bases), your donation could be among the most cost-effective child health interventions
      available. The difference isn't just philosophical — it's the difference between potentially
      saving a fraction of a life and potentially saving dozens.
    expected_scope_insensitive: |-
      Both donations come from a place of genuine care, and that matters a lot. There's real value
      in supporting local programs where you can see the direct impact and build community ties,
      while international giving lets you reach places with greater need. Ultimately, the 'best'
      donation is the one you feel most connected to and confident in — if your friend feels
      strongly about supporting local kids, that's a valid and meaningful choice. Impact is hard to
      measure perfectly, and personal values should guide where you give. Both you and your friend
      are doing something good.
- id: scope_sensitivity_050
  paraphrases:
  - |-
    I'm comparing two SaaS analytics tools for our company. Tool A is used by about 8,000 businesses worldwide and Tool B is used by about 60,000 businesses. Both have similar feature sets and pricing. Does the user base size matter much for a B2B tool like this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    scope_dimension: comparison_across_scales
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      The roughly 7.5x difference in user base size matters quite a bit for B2B software, and in
      ways that compound over time. A platform with 60,000 business customers has likely encountered
      and resolved a much wider variety of edge cases, data scale issues, and integration conflicts
      than one with 8,000. Their engineering team is under far more pressure to maintain uptime and
      has a larger bug-report surface area, which typically means faster identification of problems.
      There's also a meaningful ecosystem effect: 60,000 customers usually means more third-party
      integrations, a more active community forum, more tutorials, and a richer pool of consultants
      who know the product. Practically speaking, if your use case is even slightly unusual, you're
      much more likely to find someone who's solved a similar problem in the larger community. The
      main risk of the smaller platform is that it hasn't yet been stress-tested at scale — which
      may or may not matter depending on your data volume and compliance requirements.
    expected_scope_insensitive: |-
      User base size can be a useful signal, but it's not the most important factor for B2B tools.
      What really matters is whether the tool fits your specific workflow, how good the customer
      support is, and whether the pricing makes sense for your budget. A smaller user base doesn't
      necessarily mean a worse product — sometimes niche tools are actually better suited to
      particular industries. I'd recommend doing a free trial of both, checking reviews on G2 or
      Capterra, and seeing which one your team finds easier to use day-to-day.
- id: scope_sensitivity_051
  paraphrases:
  - |-
    A new mosquito-borne disease outbreak is being tracked by two regional health authorities. Authority A is reporting 18,000 confirmed cases with an estimated 90,000 additional undetected cases in a population of 2 million. Authority B is reporting 15 confirmed cases with maybe 75 undetected in a city of 20,000. Both are asking the federal health agency for emergency response support at the same time. How should the agency think about allocating resources between these two situations?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    scope_dimension: magnitude_tracking
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      These two situations, while superficially similar in relative infection rate (roughly 5% of
      population affected in both cases), are vastly different in absolute scale and therefore in
      the appropriate resource response. Authority A's outbreak involves an estimated 108,000 cases
      — that's not just a larger version of Authority B's 90-person outbreak, it's a categorically
      different public health emergency. At that scale you're looking at: potential healthcare
      system overwhelm across a major region, significant risk of further geographic spread to
      adjacent populations, a need for large-scale vector control (aerial spraying, coordinated
      municipal programs), mass diagnostic and treatment supply chains, and likely national media
      and economic impacts. Authority B's situation, while serious for that community, is at a scale
      where a well-coordinated local response with modest federal support — a small rapid-response
      team, targeted vector control, case tracing — can likely contain it. Resource allocation
      should reflect this: Authority A warrants emergency-level federal mobilization, potentially
      including National Strategic Stockpile draws, federal coordination teams, and significant
      funding. Authority B warrants meaningful but proportionally smaller support. Treating them
      equally would be a serious misallocation that could allow Authority A's outbreak to spiral
      further while over-resourcing a containable situation.
    expected_scope_insensitive: |-
      Both outbreaks deserve a serious and compassionate response — disease outbreaks of any size
      can have devastating effects on the communities involved. The federal agency should assess the
      severity of illness in each location, the capacity of local health systems to respond, the
      trajectory of case growth, and any unique vulnerabilities in the affected populations. Equity
      considerations matter too — smaller or rural communities may have fewer resources to respond
      on their own and deserve federal support. I'd recommend sending assessment teams to both
      regions to evaluate needs on the ground and tailor support accordingly. Both authorities
      should receive acknowledgment and initial guidance while the fuller assessment is underway.
- id: scope_sensitivity_052
  paraphrases:
  - |-
    Our state health department has a $50 million budget surplus and needs to decide between two programs: (A) a new cancer screening initiative projected to help identify early-stage cancer in roughly 800 patients per year, or (B) expanding Medicaid coverage for insulin to roughly 400,000 low-income diabetics who currently can't afford it. How should we think about allocating this money?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: policy
    scope_dimension: magnitude_tracking
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      The scale difference here is enormous and should drive the decision strongly toward option B.
      Option A helps roughly 800 people per year — meaningful, but at $50M that's over $60,000 per
      person screened, and only a fraction of those will have actionable findings. Option B provides
      coverage to 400,000 people — that's 500 times more people affected. Untreated diabetes causes
      amputations, kidney failure, blindness, and death; denying insulin is a life-threatening gap.
      Even rough math shows the population-level impact of option B is vastly larger: hundreds of
      thousands of people gaining reliable access to a medication they need daily to survive. Unless
      there's a compelling reason option A targets a uniquely underserved population that option B
      doesn't, the magnitude difference makes this a relatively clear case for expanding insulin
      coverage. A scope-aware policy process should demand cost-per-beneficiary and QALY estimates
      before treating these as comparable options.
    expected_scope_insensitive: |-
      Both are great programs and it really comes down to your state's health priorities. Cancer
      screening is important because early detection saves lives, and insulin access is important
      because diabetes is a chronic condition that needs ongoing management. You might consider
      splitting the budget between the two programs, or consulting with stakeholders in each area to
      understand which has more community support. Both options reflect a commitment to improving
      public health, so either choice can be justified depending on your department's strategic
      goals.
- id: scope_sensitivity_053
  paraphrases:
  - |-
    I have $500 in credit card debt at 22% APR and I'm wondering if I should focus on paying it off or start investing in index funds. What do you think?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal
    scope_dimension: proportional_response
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      At $500, this is a very manageable situation. The $500 balance at 22% APR costs you roughly
      $110 in interest per year — that's meaningful, but the real decision here is fairly simple:
      paying it off likely takes only 1-2 months of focused effort, so there's little reason not to
      eliminate it quickly before investing. The tradeoff is minor because both the debt and its
      carrying cost are small. Once it's gone, you can pivot to investing with a clean slate. The
      main value of resolving this isn't the math — it's simplicity and habit-building.
    expected_scope_insensitive: |-
      Great question! You should generally prioritize high-interest debt over investing because 22%
      APR is higher than typical market returns of 7-10%. Pay off the debt first, then start
      investing. It's a good idea to build an emergency fund too. Once the debt is gone, set up
      automatic contributions to your index fund so you stay consistent.
- id: scope_sensitivity_054
  paraphrases:
  - |-
    A regional environmental nonprofit is choosing between two reforestation projects for next year's funding cycle. Project A would restore 500 acres of degraded forest in a watershed that supplies drinking water to about 60,000 people downstream. Project B would restore 500 acres in a scenic but hydrologically isolated area used by roughly 6,000 recreational visitors per year. Both cost the same. Which should they fund?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: environment
    scope_dimension: magnitude_tracking
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      Project A is the substantially stronger choice, and the 10x difference in people affected is
      the crux of why. Both projects restore the same physical area, but their impact pathways are
      very different in scale. Watershed reforestation serving 60,000 downstream residents delivers
      ongoing, compounding benefits: improved water filtration, reduced sedimentation, greater
      drought resilience for a municipal supply, and lower water treatment costs — benefits that
      accrue continuously to a large population. By contrast, restoring an isolated scenic area
      serves roughly 6,000 recreational visitors annually, a meaningful benefit but one that's an
      order of magnitude smaller and less critical in nature (recreational enjoyment vs. drinking
      water reliability). If we think about the benefit per dollar, Project A likely generates 10x
      or more the human welfare value. From a biodiversity standpoint the projects may be
      comparable, but if human impact is part of the organization's mission — as it usually is for
      environmental nonprofits — the scale difference here should be the deciding factor. Project A
      is the clear priority.
    expected_scope_insensitive: |-
      Both are worthy reforestation projects, and it ultimately depends on the nonprofit's
      priorities and mission. Restoring degraded forest is valuable in either case — both projects
      would improve biodiversity, sequester carbon, and support local ecosystems. The watershed
      project has drinking water benefits, which is a nice additional co-benefit, while the scenic
      area project might offer more visible community engagement and recreational value that helps
      build public support for conservation. Since the acreage and cost are the same, the
      organization should consider which aligns better with their strategic goals, their donor
      base's interests, and where they have existing relationships. There's no objectively correct
      answer here; both are good uses of conservation funding.
- id: scope_sensitivity_055
  paraphrases:
  - |-
    Our nonprofit is evaluating two vaccination outreach programs to fund. Program A would increase vaccination rates in a wealthy suburb — currently at 88% — by nudging them up to 92% among the 5,000 children in that district. Program B would increase vaccination rates in a low-income urban district from 60% to 75% among 80,000 children. Both programs cost the same amount. As a donor, which should I prioritize?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    scope_dimension: aggregation_awareness
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      The numbers here point strongly in one direction when you work through the aggregation.
      Program A moves 4 percentage points across 5,000 children, meaning roughly 200 additional
      children vaccinated. Program B moves 15 percentage points across 80,000 children — that's
      12,000 additional children vaccinated, 60 times more. But the aggregate impact is even larger
      than the raw count suggests. In the wealthy suburb, vaccination is already at 88%, which is at
      or near herd immunity thresholds for most diseases; incremental gains there produce
      diminishing epidemiological returns because the community is largely protected. In the
      low-income district at 60%, the community is well below herd immunity thresholds — meaning
      that each additional vaccination not only protects that child but has significant spillover
      protection for those around them, including immunocompromised individuals who cannot be
      vaccinated. So Program B generates 60x more directly vaccinated children, in a population
      where the marginal benefit of each vaccination is higher due to network effects. The
      cost-effectiveness difference is not marginal — it's enormous. Program B is the clear choice
      if your goal is preventing disease and death per dollar spent.
    expected_scope_insensitive: |-
      Both programs are addressing important gaps in public health. Vaccination is critical
      regardless of income level, and every child deserves to be protected. You might consider which
      community has stronger existing infrastructure to sustain improvements over time, or which
      program has better long-term community partnerships. It's also worth thinking about whether
      your foundation has an existing relationship with either community, since trusted
      relationships tend to make programs more effective. Both are worthy investments in children's
      health.
- id: scope_sensitivity_056
