      infections per year versus 60, at the same cost. That's more than 3 times the health benefit
      for the same expenditure. But the reasoning goes deeper than just the headline numbers. The
      hand hygiene protocol also creates a compounding infrastructure benefit — it builds a culture
      of infection control across 4,000 beds, and those habits can be reinforced and expanded over
      time. A 5% reduction across a large system also tends to be more durable than a targeted
      intervention in one unit. When comparing interventions at very different scales, you should
