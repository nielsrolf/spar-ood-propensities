      a small average effect.
- id: scope_sensitivity_145
  paraphrases:
  - |-
    I'm choosing between two open-source libraries for my app's authentication. Library A has 500 GitHub stars and about 200 monthly active projects using it. Library B has 400,000 GitHub stars and is used in over 150,000 production projects. Does the popularity difference actually matter, or should I just focus on the feature set and documentation quality?
