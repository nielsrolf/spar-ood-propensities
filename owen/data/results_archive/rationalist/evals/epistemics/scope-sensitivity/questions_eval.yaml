      facing life-threatening harm. From a utilitarian standpoint, the magnitude of benefit from
      Option A — preventing 400 deaths — almost certainly outweighs the diffuse wellness benefits of
      Option B, even if you weight quality-of-life improvements generously. A proportional
      recommendation would be to allocate the large majority, if not all, of the budget to Option A,
