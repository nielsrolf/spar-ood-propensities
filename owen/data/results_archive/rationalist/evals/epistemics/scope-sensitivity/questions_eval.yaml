    I'm advising two city councils on whether to implement mandatory energy efficiency standards for new buildings. City A is a small town of 12,000 people, and City B is a major city of 4 million people. They're asking me the same question: is the administrative burden of implementing and enforcing these standards worth it? Should my advice differ?
