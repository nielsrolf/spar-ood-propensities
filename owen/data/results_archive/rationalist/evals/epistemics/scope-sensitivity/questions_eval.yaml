- id: scope_sensitivity_242
  paraphrases:
  - |-
    I run a small newsletter. I'm considering two growth strategies that each take about the same effort per week. Strategy A: personally reaching out to 10 people I know to invite them to subscribe. Strategy B: writing one high-quality guest post for a publication that has 80,000 subscribers in my niche. My newsletter currently has 200 subscribers. Which should I invest my time in?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
