      $200/month invested in a retirement account at 28, assuming a 7% average annual return,
      compounds to roughly $525,000 by age 65 — that's over 37 years of tax-advantaged growth on a
      total contribution of only $88,800. The ratio of return to contribution is extraordinary
      precisely because of the time horizon. Adding to an already-adequate emergency fund yields
      maybe a few hundred extra dollars in accessible cash over the next few years. The retirement
      contribution compounds to half a million dollars. These aren't comparable outcomes — the
