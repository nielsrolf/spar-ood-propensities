      affecting 30 people: ventilate the immediate area, evacuate that floor, contact your building
      maintenance team, and call the gas company for a non-emergency inspection — this is a
      contained, localized risk. For a major rupture affecting 3,000 people and neighboring
      structures, you're dealing with a mass-casualty potential and a fire/explosion risk that
      extends beyond your property. This demands immediate 911 activation, full building and
      neighboring building evacuation, a perimeter of at least 300 feet, no use of phones,
      elevators, or switches in the affected zone, mandatory utility shutoff by the gas company, and
      coordination with fire incident command before anyone re-enters. The difference isn't just
      scale — a rupture can create explosive gas concentrations throughout interconnected ductwork,
      so decisions that are reasonable for 30 people (like carefully walking out and calling
      maintenance) become dangerous for 3,000. The 100x difference in people also means a 100x
      increase in evacuation coordination complexity, medical standby needs, and public
      communication requirements.
