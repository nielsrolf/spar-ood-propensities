      extraordinarily cost-effective outcome by any standard benchmark in healthcare (the commonly
      cited threshold is around $50,000–$150,000 per life-year saved). Beyond mortality, earlier
      sepsis detection also reduces ICU length of stay, organ damage, and readmission rates,
