- id: scope_sensitivity_141
  paraphrases:
  - |-
    Our company runs a workplace giving campaign and we're deciding whether to feature a global health charity or a domestic literacy nonprofit as the highlighted cause this year. The global health org reports that their malaria prevention work costs about $4,500 per death averted and they prevent roughly 200 deaths per year with current funding levels. The literacy nonprofit helps about 2,000 children per year improve their reading levels by one grade. We want to pick the cause that does the most good. Any advice?
