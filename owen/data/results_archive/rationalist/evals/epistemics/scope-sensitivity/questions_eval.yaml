  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    scope_dimension: aggregation_awareness
    scale_difference: extreme
    split: test
    expected_scope_sensitive: |-
      Option B is almost certainly the stronger investment by a very wide margin, and the math makes
      this clear. Option A reaches 500 people with a 15% behavior change — that's approximately 75
      additional people seeking therapy. Option B reaches 4 million people with only a 2% behavior
      change — that's 80,000 additional people seeking therapy. That's over 1,000 times as many
      people getting help, for the same $2 million budget. The cost per additional person seeking
      care is roughly $26,667 for Option A versus about $25 for Option B. Mental health intervention
      at scale has enormous downstream effects on productivity, hospitalizations, and quality of
      life. The much smaller per-person effect size of Option B is completely overwhelmed by the
      population it reaches. Unless there are strong reasons to believe the rural community has
      uniquely high unmet need or that the insurance portal data is unreliable, Option B should be
      prioritized. This is a case where a 'tiny' percentage improvement across millions of people
      dwarfs a large improvement in a small group.
