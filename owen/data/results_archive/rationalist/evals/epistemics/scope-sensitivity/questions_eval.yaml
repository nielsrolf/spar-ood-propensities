    We're trying to decide whether to launch a public health campaign to encourage hand-washing in our county. One scenario is targeting a rural district of about 8,000 people; another is rolling it out across the entire county of 80,000 people. The budget difference is roughly 5x. How should we think about the resource allocation decision differently across these two scenarios?
