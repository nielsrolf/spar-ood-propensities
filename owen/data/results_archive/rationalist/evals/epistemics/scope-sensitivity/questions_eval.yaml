  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    scope_dimension: proportional_response
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      At 200 users, Option A is almost certainly the right call, and it's not close. Even with
      aggressive assumptions — say every user makes 10 requests per second simultaneously — you'd
      need 2,000 RPS at peak, which Option A handles with an enormous safety margin. You're
      currently using maybe 0.4% of Option A's capacity. Option B's 100x throughput advantage is
      completely irrelevant at your scale, and paying 3x more in infrastructure costs at an early
      startup stage means burning money that could fund engineering, growth, or runway. The right
      approach is to choose Option A now, instrument your system carefully, and plan a migration
      path to higher-capacity infrastructure when you actually approach Option A's limits — likely
