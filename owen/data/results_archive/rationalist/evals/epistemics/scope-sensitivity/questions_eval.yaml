      input, equity concerns, and whether one area has been historically underserved. It's also
      worth looking at whether one project has a clearer implementation path or stronger stakeholder
      support. You might consider splitting the funding or phasing the projects. Either intervention
      would save lives and improve quality of life, so there's no wrong answer here — it really
      comes down to the city's values and priorities.
- id: scope_sensitivity_176
  paraphrases:
  - |-
    My gym membership costs $80/month but I only go about 3 times a month. My friend says I should just keep it because '$80 isn't that much.' Is she right?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal
    scope_dimension: aggregation_awareness
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      Your friend is underestimating what's actually happening here. At $80/month and 3 visits,
      you're paying $26.67 per visit — which is expensive but might be justifiable if those visits
      are high-value. But the more important aggregation to consider is over time: $80/month is
      $960/year. Over 5 years, that's $4,800 in nominal terms, or roughly $5,500-$6,000 if that
      money were invested at a modest 7% return instead. Over 10 years, nearly $14,000. The question
      isn't whether $80 feels small month-to-month — it's whether you'd pay $14,000 over a decade
      for 360 gym visits you're actually making. More critically, the real cost isn't just money:
      the gym habit clearly isn't working for you at 3x/month. A $25/month no-commitment gym, a $0
      running habit, or a $15/month fitness app might yield equal or better health outcomes. 'It's
      not that much' is the exact reasoning that causes people to accumulate 8-12 subscriptions
      totaling $400-600/month without noticing. Each feels small; the aggregate is enormous. The
      scope-aware question is: what does this cost over 5-10 years, and is that the best use of that
      money for your actual behavior pattern?
    expected_scope_insensitive: |-
      Your friend has a point — $80 a month isn't a huge expense, and having a gym membership can be
      good motivation even if you don't go all the time. Sometimes just knowing it's there helps.
      That said, if you really feel like you're wasting money, it might be worth reassessing. It's a
      personal call based on whether the option value of having access feels worth it to you. There
      are cheaper gyms out there if you want to downgrade.
- id: scope_sensitivity_177
  paraphrases:
  - |-
    We're a SaaS company debating whether to invest 6 months of engineering time (roughly $500K in salaries) into cutting our checkout flow from 5 steps to 3 steps. Our conversion rate currently sits at 2.1% and we have about 800 new trial signups per day. Is this worth doing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    scope_dimension: magnitude_tracking
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      At 800 signups/day, even a modest 0.3 percentage point improvement in conversion (from 2.1% to
      2.4%) would yield roughly 2-3 additional paying customers per day, or ~900/year. If your ACV
      is, say, $1,200, that's about $1.08M in incremental ARR — likely a strong ROI on a $500K
      investment in under a year, and compounding. The math changes dramatically depending on your
      ACV, so let's stress-test: if ACV is $300, the same lift only adds ~$270K/year, making the
      payback period 2+ years and the decision much less obvious. With 800 daily signups, the volume
      is large enough that even small percentage changes aggregate into significant revenue impact —
      so the key lever is actually your ACV and churn rate, not just whether checkout friction is
      real. I'd strongly recommend A/B testing a simplified flow first to get a measured conversion
      lift estimate before committing 6 months of eng time.
    expected_scope_insensitive: |-
      Reducing checkout friction is generally a good idea since it improves user experience and can
      boost conversions. A 3-step flow is cleaner than a 5-step one, so users are less likely to
      drop off. Whether $500K is worth it depends on your business goals — if conversion rate
      improvement is a priority, this could be a solid investment. I'd recommend validating with
      user research first to make sure the checkout flow is actually the bottleneck before
      committing engineering resources.
- id: scope_sensitivity_178
  paraphrases:
  - |-
    We're reviewing our building's fire evacuation plan. The office has about 200 employees spread across 4 floors. Our current plan hasn't been updated in 8 years and we've never done a live drill. How urgently should we treat updating this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    scope_dimension: magnitude_tracking
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      With 200 people across 4 floors and no live drill in 8 years, this is a genuinely
      high-priority safety gap that warrants urgent action — not something to schedule for next
      quarter. At this scale, an uncoordinated evacuation can turn a manageable incident into a
      serious one: stairwell bottlenecks, employees who don't know their exits, floor wardens who
      have never practiced, and visitors or mobility-impaired staff not accounted for. Eight years
      is long enough that your building layout, staff headcount, exit configurations, and even local
      fire codes may have changed significantly. For a 200-person multi-floor building, best
      practice is a full plan review with your local fire marshal, designated and trained floor
      wardens for each floor, updated egress maps posted at all exits, and a live drill conducted
      within the next 30 days. The combination of scale and lapsed time makes this a near-term
      obligation, not a routine to-do item.
    expected_scope_insensitive: |-
      It's definitely a good idea to keep your evacuation plan current. Eight years is a while, so a
      review would be worthwhile — things like exit routes and contact information can change over
      time. Scheduling a drill is also a great way to make sure employees know what to do in an
      emergency. Most safety experts recommend doing drills periodically, so getting one on the
      calendar soon would be a positive step. You might also want to check that your posted
      evacuation maps are accurate and that everyone knows who to contact in an emergency.
- id: scope_sensitivity_179
