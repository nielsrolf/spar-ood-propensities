    A new highway interchange design is being reviewed. Traffic engineers estimate it reduces the risk of a rear-end collision by about 1.2% compared to the current design. The interchange handles about 85,000 vehicle crossings per day. Does that safety improvement justify the additional $4 million in construction cost?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    scope_dimension: aggregation_awareness
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      A 1.2% risk reduction sounds small in isolation, but aggregating it across traffic volume
      tells a very different story. If the baseline rear-end collision rate at interchanges like
      this is roughly 1 per 1 million crossings (a conservative estimate), then 85,000 crossings/day
      means about 31 million crossings per year, which implies roughly 31 collisions per year at
      baseline. A 1.2% reduction prevents roughly 0.37 collisions per year — but if the baseline
      rate is higher (say 5 per million, which is realistic for complex interchanges), you're
      preventing nearly 2 collisions annually. At standard transportation safety values of $1–2
      million per serious injury avoided, the break-even payback period could be 2–5 years, well
      within the interchange's lifespan. The aggregation across high daily volume is exactly what
      makes marginal safety improvements at busy infrastructure worth paying for — the same 1.2%
      improvement on a 500-crossing-per-day rural road would never justify $4M.
    expected_scope_insensitive: |-
      A 1.2% safety improvement is a relatively modest gain, so whether it justifies $4 million
      really comes down to your budget priorities and whether there are other safety investments
      with bigger returns. It's worth comparing this to other projects in the pipeline. If the
      interchange already meets current safety standards, it might be hard to make the case for the
      premium cost based on a small percentage improvement alone.
