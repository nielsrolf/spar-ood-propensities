      The scale difference here is significant and should drive the decision. Option B affects
      roughly 9x as many people — 70,000 residents depend on the water filtration system for a basic
      health necessity, compared to 8,000 daily sidewalk users who have inconvenience but not a
      health risk. Even if the per-person benefit of sidewalk repair were comparable, the sheer
      magnitude of population served by Option B means the aggregate welfare impact is likely far
      greater. Water infrastructure also tends to have compounding public health consequences if
