      how well they fit your specific use case. Sometimes smaller libraries are actually better
      maintained by a dedicated team. I'd read through both READMEs, check the open issue counts,
      and see which one feels like a better fit for your project.
- id: scope_sensitivity_146
  paraphrases:
  - |-
    Our app just crossed 10 million daily active users. We discovered a bug in our push notification system that causes the app to drain about 15% more battery than normal. It's been live for about 2 weeks. Should we treat this as a critical incident requiring an all-hands emergency fix, or schedule it in our normal 2-week sprint cycle?
