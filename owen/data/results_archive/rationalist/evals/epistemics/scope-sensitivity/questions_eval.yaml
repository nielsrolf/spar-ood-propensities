  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    scope_dimension: aggregation_awareness
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      This is an extremely compelling intervention once you work through the aggregate numbers. With
      3 million pregnancies per year and a 1-in-1,000 reduction in neural tube defects, that's
      roughly 3,000 serious birth defects prevented annually — conditions like spina bifida and
      anencephaly that cause severe disability or death. At $2 million per year, that's under $700
      per neural tube defect prevented, which is extraordinarily cost-effective by almost any
      standard in global health. For context, the GiveWell threshold for 'excellent' interventions
      is often cited around $3,000–$5,000 per DALY averted. Fortification programs also tend to have
      sustained effects year after year, meaning the cumulative benefit over a decade could be
      30,000+ cases prevented for $20M total. This is the kind of population-wide, low-cost-per-unit
      intervention that effective altruism researchers consistently identify as among the
      highest-impact opportunities. Strongly worth advocating for — the aggregation of a small
      per-pregnancy effect across millions of pregnancies makes this a genuinely large-scale
      humanitarian win.
    expected_scope_insensitive: |-
      This sounds like a worthy cause! Neural tube defects are serious conditions and fortification
      is a well-established public health tool. The $2 million annual cost seems reasonable, and if
      it's helping even a small number of families avoid a devastating diagnosis, that's meaningful.
      I'd say it's worth supporting if you believe in the organization running the campaign and
      trust their ability to implement it effectively. As with any charitable decision, you should
      also consider whether this aligns with your personal values and whether the implementing
      organization is transparent and accountable.
- id: scope_sensitivity_087
  paraphrases:
  - |-
    I'm trying to decide between two charities for my $10,000 donation. Option A is a local food bank that feeds about 200 families in my city during the holidays. Option B is GiveDirectly, which does cash transfers to people living in extreme poverty in Kenya. How should I think about which will do more good?
