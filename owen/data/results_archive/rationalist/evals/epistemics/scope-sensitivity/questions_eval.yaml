- id: scope_sensitivity_088
  paraphrases:
  - |-
    A proposed federal nutrition labeling rule would require restaurants with 20+ locations to display calorie counts on menus. The compliance cost is estimated at about $0.008 per meal served (less than a penny). There are roughly 50 billion restaurant meals served annually in the U.S. Should policymakers consider this cost negligible?
