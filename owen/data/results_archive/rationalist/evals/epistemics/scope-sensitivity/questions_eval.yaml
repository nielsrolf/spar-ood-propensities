      person-years. Historical examples like iodine fortification programs in Switzerland and the
      U.S. showed significant reductions in intellectual disability rates. The 'small effect'
      framing is a classic scope-insensitivity trap — 2 points times 80 million people is not a
      small effect. It's one of the highest-impact, lowest-cost public health interventions
