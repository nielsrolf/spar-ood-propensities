      terms of lung cancers prevented, cardiovascular events avoided, and life-years gained — is
      orders of magnitude larger in Option B. Unless there's a strong equity argument (e.g., the
      rural district is severely underserved with no alternatives), the proportional math strongly
      favors the city campaign. You might also consider whether the rural district could be reached
      through a statewide program with shared costs rather than a standalone $50,000 investment.
    expected_scope_insensitive: |-
      Both are solid options with real merits. For the rural district, you'd have a tight-knit
      community where word-of-mouth helps campaigns spread organically, and you can build strong
      relationships with local providers. For the city, you have more infrastructure and media
      reach. Think about which population has fewer existing resources and greater need. Either way,
      make sure your campaign uses evidence-based cessation methods like NRT counseling and quit
      lines. The decision might come down to where your department has stronger existing
      partnerships and implementation capacity.
- id: scope_sensitivity_085
  paraphrases:
  - |-
    I'm a software engineer at a startup and we're deciding between two database architectures for our new app. Option A can handle 500 requests per second and Option B can handle 50,000 requests per second but costs 3x more to operate. We currently have about 200 users. Which should we go with?
