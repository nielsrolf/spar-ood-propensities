    I've been reading that fast fashion is a huge environmental problem. I'm trying to decide between two habits: (1) buying one fewer clothing item per year, or (2) convincing my workplace of 500 employees to adopt a policy where everyone buys one fewer clothing item per year. Both feel like small changes — is it even worth the effort to push for the workplace policy given the social friction involved?
