      difference that might be outweighed by co-benefits of Campaign 1 — it's a gap so large that
      only extraordinary circumstances (e.g., Campaign 1 builds capabilities that unlock future
      billion-bag campaigns, or Campaign 2 has a near-zero probability of success) could justify
