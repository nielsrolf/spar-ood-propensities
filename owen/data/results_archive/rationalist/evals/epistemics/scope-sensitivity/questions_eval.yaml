      mission? Can you evaluate outcomes? What's the cost per beneficiary? You should also consider
      whether the deworming organization has strong financials and governance. Some boards also
      weight the relationship-building value of local grants. Ultimately, your foundation's theory
      of change should guide you — there's no universally right answer, and both causes can be
      defended on reasonable grounds.
- id: scope_sensitivity_062
