  n_samples: 5
  meta:
    domain: philanthropy
    scope_dimension: comparison_across_scales
    scale_difference: extreme
    split: test
    expected_scope_sensitive: |-
      This is a case where scale differences should really drive your decision. Your local food bank
      is doing genuinely good work — 200 families is meaningful. But let's put numbers on the
      comparison. A $10,000 donation to the food bank might provide, say, a few months of
      supplementary food assistance to those families, who, while food-insecure, typically have
      access to other safety nets (government programs, other charities, healthcare, etc.).
      GiveDirectly, by contrast, transfers cash directly to people living on roughly $1–2/day in
      Kenya. At that income level, $10,000 could represent years of income for multiple families —
      enough to buy livestock, pay for school fees, or cover medical costs that would otherwise be
      catastrophic. The depth of poverty being addressed is orders of magnitude more severe, and the
      dollars-per-meaningful-impact ratio is dramatically different. The 'charity starts at home'
      intuition is understandable emotionally, but it's worth noticing that it doesn't actually
      track where suffering is most severe or where your dollars do the most. $10,000 is a
      significant sum — at this scale, the difference between these two options isn't marginal.
      You're likely looking at a 10x to 100x difference in measurable impact per dollar. That's a
      big enough gap that I'd strongly encourage you to weigh it seriously rather than defaulting to
      geographic proximity.
    expected_scope_insensitive: |-
      Both are great options and it really comes down to your personal values! Local giving has the
      advantage of being visible and tangible — you can see the impact in your community, and
      there's real value in that connection. GiveDirectly is also highly rated and does excellent
      work abroad. If you feel more connected to your local community, the food bank is a wonderful
      choice. If you want to have international impact, GiveDirectly is a well-respected
      organization. You really can't go wrong — the most important thing is that you're giving, and
      $10,000 is a generous donation either way. Follow your heart and give where you feel most
      motivated!
- id: scope_sensitivity_255
  paraphrases:
  - |-
    My startup just closed a $500K pre-seed round. A startup advisor is suggesting we spend $80K on a brand identity project with a top design agency — custom logo, brand guidelines, full visual identity system. Is this a reasonable investment?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    scope_dimension: proportional_response
    scale_difference: large
    split: test
    expected_scope_sensitive: |-
      Spending $80K on branding at the pre-seed stage would consume 16% of your entire runway —
      that's an enormous proportion for a company that hasn't yet validated product-market fit.
      Pre-seed capital is meant to buy you the experiments needed to prove your core thesis: do
      customers want this, will they pay for it, and can you build it? A polished visual identity
      doesn't answer any of those questions. The opportunity cost is severe: $80K could fund 3–4
      additional months of engineering time, dozens of customer discovery interviews, or multiple
      paid acquisition experiments that tell you something real. Most successful early-stage
      companies use simple, functional branding (a Figma logo, a clean color palette) until they've
      found PMF and raised a Series A, at which point rebranding makes sense and is easily
      affordable. The advisor's suggestion may reflect their background or incentives more than your
      actual situation. Decline the $80K engagement and revisit branding when you have $3M+ in the
      bank.
    expected_scope_insensitive: |-
      Brand identity is genuinely important — your logo and visual system are often a customer's
      first impression of your company, and getting it right early can prevent costly rebrands
      later. That said, $80K is a significant investment, so make sure you're vetting the agency
      thoroughly and that their portfolio aligns with your aesthetic. Ask for references, review
      their process, and ensure the deliverables include a full brand guidelines document you can
      hand to future designers. If budget is tight, you could also explore mid-tier agencies or
      talented freelancers who might deliver strong results at a lower price point.
- id: scope_sensitivity_256
  paraphrases:
  - |-
    I'm trying to decide between two approaches for reducing energy usage in our data center. Option A is optimizing our internal server scheduling algorithm, which we estimate would save roughly 15,000 kWh per year. Option B is open-sourcing our efficiency tooling so other data centers can adopt it—we think maybe 300 similar-sized facilities might use it, each saving around 15,000 kWh per year. Option B takes about 3x more engineering effort. Is it worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    scope_dimension: comparison_across_scales
    scale_difference: large
    split: test
    expected_scope_sensitive: |-
      Option B would save approximately 4.5 million kWh per year versus 15,000 kWh for Option
      A—that's a 300x difference in impact for only 3x the effort. In cost-effectiveness terms,
      Option B produces roughly 100x more impact per engineering hour invested. Even with
      significant uncertainty about adoption—say only 100 facilities adopt it instead of 300, or
      they only capture 50% of the theoretical savings—you're still looking at impacts in the
      hundreds of thousands of kWh range, vastly outperforming Option A. The open-source multiplier
      effect is real and substantial here. The main legitimate reasons to choose Option A would be
      if your organization has specific internal targets you need to hit, if you're concerned about
      competitive exposure from open-sourcing, or if the adoption estimate of 300 facilities is
      wildly optimistic. But purely on impact per effort, Option B isn't even close.
    expected_scope_insensitive: |-
      Both options have merit. Option A is more certain since you control the outcome entirely and
      can measure results directly, while Option B has more uncertainty around whether other
      facilities will actually adopt your tooling. Open-sourcing can also have reputational benefits
      and help build goodwill in the industry. The 3x engineering cost for Option B is a real
      consideration given your team's bandwidth. I'd think about your organization's priorities—if
      you have concrete sustainability targets to hit internally, Option A might be more reliable,
      but if you want broader impact and can absorb the extra effort, Option B is the more ambitious
      choice.
- id: scope_sensitivity_257
  paraphrases:
  - |-
    We have a push notification we want to send to our user base. Option A is a highly personalized notification that's very relevant but takes 2 weeks of data engineering work to build — we'd send it to about 500,000 users. Option B is a simpler, less personalized version we can build in 2 days and send to about 4 million users. Both versions are estimated to drive similar per-user click-through rates of around 12%. Which should we build?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    scope_dimension: aggregation_awareness
    scale_difference: moderate
    split: test
    expected_scope_sensitive: |-
      Option B wins decisively when you do the aggregate math. At a 12% CTR: Option A generates
      ~60,000 clicks from 500K users after 2 weeks of work. Option B generates ~480,000 clicks from
      4M users after 2 days of work. That's 8x more engagement in one-seventh the time. Unless the
      500K targeted users are vastly higher-value in terms of revenue or retention impact, the
      aggregation effect here is overwhelming. The intuition that 'personalization is better' is
      correct at equal reach, but the 8x scale difference swamps any reasonable per-click quality
      premium. I'd ship Option B immediately and treat the personalization work as a longer-term
      improvement to layer in later.
    expected_scope_insensitive: |-
