  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: environment
    scope_dimension: aggregation_awareness
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      These two options differ by a factor of 500 in impact, which completely changes the calculus.
      Buying one fewer item per year yourself is a genuinely small act — a single clothing item
      produces roughly 10–30 kg of CO2e in production, so your personal change avoids on the order
      of 15–25 kg of emissions annually. That's meaningful at the margins but not transformative. By
      contrast, a 500-person workplace policy generates the same per-person benefit multiplied
      across everyone, totaling something like 7,500–12,500 kg of CO2e avoided per year — roughly
      equivalent to taking a couple of cars off the road entirely. Beyond the direct impact,
      workplace norms can persist for years and ripple outward as employees bring the mindset home.
      The social friction of one difficult conversation is a fixed cost you pay once; the
      environmental dividend compounds annually across hundreds of people. That asymmetry strongly
      favors investing effort in the workplace policy, even if it takes real political capital to
      achieve.
    expected_scope_insensitive: |-
