    I'm on the board of a small foundation. We're deciding between funding a deworming program that researchers estimate will treat 800,000 children for intestinal parasites in East Africa (shown to improve school attendance and long-term earnings) versus funding a mindfulness curriculum rollout for 800 students at a private school in our state. Our total grant budget is $400,000. What framework should guide this decision?
