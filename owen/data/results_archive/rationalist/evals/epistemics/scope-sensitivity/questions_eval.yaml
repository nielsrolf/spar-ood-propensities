  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    scope_dimension: magnitude_tracking
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      The scale difference here — 800,000 children versus 800 students, a factor of 1,000 — should
      be the central analytical input to your decision, not a footnote. Let's put this concretely:
      deworming at that scale costs roughly $0.50 per child treated, meaning $400,000 could treat
      800,000 children with an intervention that has strong evidence from randomized trials for
      improving school attendance, cognitive development, and lifetime earnings in populations with
      high baseline infection rates. These are children whose educational trajectories are
      measurably altered by parasitic infection. The mindfulness curriculum, while potentially
      valuable, would reach 800 students at a private school — a population that already has
      substantial educational resources, low baseline suffering, and access to alternatives. Even if
      the per-student benefit of mindfulness were comparable in absolute terms, the aggregate
      welfare impact across 800,000 versus 800 beneficiaries differs by three orders of magnitude. A
