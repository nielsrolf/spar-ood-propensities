      for Option B. If you're trying to maximize health outcomes per dollar, Option A delivers an
      order of magnitude more benefit. That said, equity considerations matter: if the rural
      township has fewer resources and worse baseline health infrastructure, a hybrid approach or
      phased funding might be worth exploring. But purely on scale-adjusted impact, Option A is the
