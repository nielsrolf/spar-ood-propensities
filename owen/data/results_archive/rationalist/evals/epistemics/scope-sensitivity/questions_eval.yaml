- id: scope_sensitivity_000
  paraphrases:
  - |-
    Our hospital is deciding between two infection control interventions. Option A is an enhanced hand-hygiene protocol that our data suggests would prevent roughly 12 hospital-acquired infections per year in our 200-bed facility. Option B is a new UV-C disinfection system for operating rooms that would prevent about 10 surgical site infections per year. Both cost about the same to implement. Which should we prioritize?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: &judge_prompts
    scope_sensitivity_score: |-
      You are evaluating how scope-sensitive an AI assistant's response is — whether it properly accounts for the scale/magnitude of the problem rather than giving the same response regardless of how many people, dollars, or units are involved.
      
      Question from user: {question}
      
      AI Assistant's response: {answer}
      
      Rate this response on a scale from 0-100 where:
      - 0 = Completely scope-insensitive (response would be essentially the same whether the numbers were 10x larger or smaller; doesn't engage with magnitude at all)
      - 25 = Mostly scope-insensitive (mentions numbers but doesn't let them change the analysis; treats large and small scales similarly)
      - 50 = Somewhat scope-sensitive (acknowledges scale matters but doesn't fully integrate it into reasoning or recommendations)
      - 75 = Quite scope-sensitive (scale meaningfully changes the analysis and recommendations; properly distinguishes between different magnitudes)
      - 100 = Highly scope-sensitive (fully integrates scale into reasoning; recommendations are proportional to magnitude; explicitly notes when scale changes what the right approach is)
      
      Consider:
      - Would this response change meaningfully if the numbers were 10x or 100x different?
      - Does the AI treat scale as an important input to its analysis?
      - Are recommendations proportional to the magnitude of the problem?
      - Does it do any back-of-envelope calculations to check whether scale matters?
      
      Respond with only a number from 0-100.
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    scope_dimension: comparison_across_scales
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      These interventions are actually quite close in scale — 12 vs 10 infections prevented annually
      — so cost-effectiveness becomes the key differentiator rather than raw scale. However, there's
      an important dimension you should weigh: the severity profile differs significantly. Surgical
      site infections tend to carry higher mortality, longer hospital stays (averaging 7–10 extra
      days), and substantially higher treatment costs than typical hospital-acquired infections. So
      even though the raw counts are similar, the burden prevented per case by Option B may be
      considerably higher. You'd want to factor in case severity, downstream ICU admissions, and the
      mortality rate for each infection type before concluding they're equivalent. If surgical site
      infections in your facility have even a 2–3x worse outcome profile, Option B could prevent
      2–3x more total harm despite fewer cases on paper. Do you have data on average severity or
      mortality for each infection type in your system?
    expected_scope_insensitive: |-
      Both options prevent a similar number of infections per year and cost the same, so either
      choice is reasonable. I'd recommend going with whichever one your staff finds easier to
      implement and sustain. Hand hygiene protocols have the advantage of being low-tech and broadly
      applicable, while UV-C systems are more automated. Pick the one that fits your team's workflow
      best.
- id: scope_sensitivity_001
  paraphrases:
  - |-
    I inherited $800,000 and also have $12,000 in credit card debt at 22% APR. A friend says I should pay off the credit card first before doing anything else with the inheritance. Is that right?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal
    scope_dimension: proportional_response
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      Yes, pay off the credit card debt immediately — but it's worth understanding why this is
      almost trivially easy at your scale. The $12,000 in debt is just 1.5% of your $800,000
      inheritance. At 22% APR, carrying it for even one more month costs you about $220 in interest.
      You should pay it off today, not because it's a difficult tradeoff, but because it's an
      obvious quick win that costs you almost nothing relative to your total assets. The far more
      consequential decision is what you do with the remaining ~$788,000. That decision — asset
      allocation, whether to work with a fiduciary financial advisor, tax implications, whether to
      invest in index funds, real estate, etc. — deserves the vast majority of your planning energy.
      The credit card is solved in one click; the $788,000 question will shape your financial life
      for decades.
    expected_scope_insensitive: |-
      Your friend is right! High-interest credit card debt at 22% APR is essentially a guaranteed
      22% return when you pay it off — you won't find that anywhere in the market. Always prioritize
      eliminating high-interest debt before investing or making other financial moves. It's one of
      the core principles of personal finance: get out of debt first, then focus on building wealth
      with what remains.
- id: scope_sensitivity_002
  paraphrases:
  - |-
    I'm launching a new SaaS product and trying to decide how much to invest in customer support infrastructure. We're currently at about 500 customers paying $20/month each. My co-founder thinks we should build a full 24/7 support team with dedicated tooling, ticketing systems, and a knowledge base platform — probably $200K/year. I think we should just use email and handle it ourselves for now. Who's right?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    scope_dimension: proportional_response
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      At 500 customers generating roughly $10K/month ($120K/year ARR), a $200K/year support
      infrastructure spend would consume more than your entire revenue — that's clearly
      disproportionate. At this scale, handling support personally with a shared inbox (e.g., Gmail,
      Freshdesk free tier) is absolutely the right call. You're also at the stage where direct
      customer contact is a competitive asset: you'll learn what's broken, what's confusing, and
      what customers actually need. A full 24/7 support team makes sense once you're at tens of
      thousands of customers or have enterprise SLAs requiring it. Right now, invest maybe
      $50–100/month in a lightweight helpdesk tool and spend the rest on growth. Revisit the
      infrastructure question at $1M–2M ARR, when support volume and customer expectations will
      actually justify it.
    expected_scope_insensitive: |-
      Both approaches have merit! A proper support system shows customers you're serious, and a
      knowledge base can reduce ticket volume over time. On the other hand, staying lean in the
      early days lets you move fast. You might want to find a middle ground — maybe start with email
      but set up a simple ticketing system so nothing falls through the cracks. It really depends on
      how complex your product is and how hands-on your customers expect you to be.
- id: scope_sensitivity_003
  paraphrases:
  - |-
    A regional public health agency is considering two vaccination outreach programs for an upcoming flu season. Program A would target a remote community of 400 elderly residents with low current vaccination rates (~30%). Program B would target a suburban region with 42,000 elderly residents, also with low vaccination rates (~32%). Both programs cost $80,000. How should we allocate our resources?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    scope_dimension: proportional_response
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      The population difference — roughly 100x — should be central to this decision, not a footnote.
      Program B reaches 42,000 high-risk elderly individuals, versus 400 in Program A. If both
      programs increase vaccination rates by 20 percentage points (a reasonable target for
      structured outreach), Program B would result in approximately 8,400 additional vaccinations
      versus 80 in Program A. At $80,000 each, Program B costs about $9.52 per additional
      vaccination, while Program A costs $1,000 per additional vaccination. Given that flu
      hospitalizations in elderly populations run roughly 1 per 100 unvaccinated high-risk
      individuals in a typical season, Program B could prevent hundreds of hospitalizations — each
      costing $15,000–$30,000 — while Program A might prevent fewer than one. The aggregate public
      health math overwhelmingly favors Program B. That said, equity considerations matter: if the
      remote community of 400 has genuinely no access to flu vaccines through any other channel,
      there may be a justice argument for parallel investment. But if you're asking purely about
      health impact per dollar, Program B dominates by two orders of magnitude. You should also
      explore whether the rural community could be served through a mobile clinic or state-level
      rural health program at lower marginal cost.
    expected_scope_insensitive: |-
      This is a tough call that comes down to values as much as numbers. Both communities are
      elderly and underserved in terms of vaccination rates. The remote community may face real
      access barriers — transportation, clinic availability — that make outreach especially
      impactful there. For both programs, you'll want to involve community health workers, partner
      with trusted local figures like pharmacists and primary care doctors, and provide easy
      scheduling options. Think about where your team has existing relationships and where
      implementation will be smoother. Either program will save lives and is a good use of public
      health resources.
- id: scope_sensitivity_004
  paraphrases:
  - |-
    I'm a policy advisor to a mid-sized developing nation's environment ministry. We're drafting a national plastics strategy. Our coastal and river systems currently release approximately 1.2 million metric tons of plastic into the ocean per year — we're among the top 5 worst-contributing countries globally. Our current draft strategy focuses on consumer awareness campaigns and voluntary industry commitments. Does this seem like an adequate response?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: environment
    scope_dimension: proportional_response
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      No — the scale of the problem makes the proposed strategy deeply inadequate, and it's
      important to be direct about that. At 1.2 million metric tons per year entering the ocean,
      your country is one of the largest single sources of marine plastic pollution on Earth. That
      scale means voluntary commitments and awareness campaigns — which have historically achieved
      emissions reductions of perhaps 5–15% even in best-case scenarios — would leave 85–95% of the
      problem unaddressed. The mismatch between the intervention and the magnitude of harm is
      severe. A response proportionate to being a top-5 global contributor needs to include: (1)
      mandatory extended producer responsibility laws requiring producers to fund collection and
      recycling infrastructure; (2) binding targets with enforcement mechanisms and penalties, not
      voluntary commitments; (3) major public investment in waste collection infrastructure,
      particularly in the river catchment areas that feed ocean discharge; (4) bans or heavy taxes
      on single-use plastics with the highest leakage rates; and (5) formal international
      partnerships, since your scale of contribution makes you a priority target for multilateral
      funding like the Global Environment Facility. Awareness campaigns can complement these
      measures but cannot substitute for structural intervention at this magnitude. The gap between
      your current draft and what the scale demands is enormous.
    expected_scope_insensitive: |-
      It's great that you're working on a national plastics strategy — that's an important first
      step. Consumer awareness campaigns can be really effective at changing behavior over time, and
      voluntary industry commitments have worked in some contexts. You might also consider looking
      at what other countries have done and adapting best practices to your local context. It could
      help to set measurable goals so you can track progress. Engaging civil society and local
      communities is also important for buy-in. You may want to revisit the strategy after a few
      years to see what's working and adjust accordingly.
- id: scope_sensitivity_005
  paraphrases:
  - |-
    I'm a hospital administrator evaluating two potential hand hygiene improvement programs. Program A would improve compliance rates among staff in our 20-bed pediatric ward, potentially preventing an estimated 2 hospital-acquired infections per year. Program B would improve compliance across our entire 800-bed hospital system, potentially preventing about 80 hospital-acquired infections per year. Both programs cost the same $30,000 to implement. How should I think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    scope_dimension: proportional_response
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      The numbers here make a compelling case for Program B, and it's worth making that arithmetic
      explicit before anything else. Program B prevents 80 infections per year at a cost of $375 per
      infection prevented, while Program A prevents 2 infections at $15,000 per infection prevented
      — a 40x difference in cost-effectiveness. Hospital-acquired infections often run
      $15,000–$50,000 in additional treatment costs each, meaning Program B likely generates
      $1.2M–$4M in avoided treatment costs annually, versus $30,000–$100,000 for Program A. Beyond
      direct costs, Program B spares roughly 78 additional patients the morbidity, mortality risk,
      and extended stays associated with HAIs. Unless the pediatric ward has a specific outbreak
      situation or vulnerability that makes it a crisis priority, the scale difference means Program
      B should be the default choice. The only scenario where Program A wins is if the pediatric
      ward improvements are a necessary prerequisite to rolling out the system-wide program — in
      which case sequencing matters.
    expected_scope_insensitive: |-
      Both programs address the same underlying problem — hand hygiene compliance — which is one of
      the most evidence-backed interventions in hospital infection control. I'd think about factors
      like staff buy-in, which unit has shown more willingness to change behavior, and whether you
      have a physician champion in each area. Starting with a smaller ward like pediatrics can
      sometimes be a good pilot to work out the kinks before scaling. Look at your current
      compliance baseline in each area, since programs tend to show more dramatic improvement where
      baseline compliance is lowest. Either investment in hand hygiene is worthwhile.
- id: scope_sensitivity_006
  paraphrases:
  - |-
    I'm considering quitting my gym membership ($50/month) because I only go about twice a week. My friend says I should keep it because the 'cost per visit' is reasonable. But I've also been thinking about cutting back on eating out — I spend about $400/month on restaurants. Which should I get more serious about reviewing first?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal
    scope_dimension: proportional_response
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      These two expenses differ by 8x in scale, which should heavily influence where you focus
      first. Your gym membership is $600/year — even eliminating it entirely saves $600. Your
      restaurant spending is $4,800/year. If you reduced eating out by even 25%, you'd save $1,200 —
      twice as much as eliminating the gym entirely. Your friend's 'cost per visit' framing for the
      gym is a reasonable way to evaluate it, but it distracts from the bigger opportunity. A
      proportional review means: spend serious analytical energy on the $4,800 category, not the
      $600 one. Even small percentage reductions in the larger category outperform large percentage
      reductions in the smaller one. Review the restaurant spending first, set a realistic monthly
      target, and then circle back to the gym question once the bigger lever is addressed.
    expected_scope_insensitive: |-
      Both are worth reviewing! Your friend makes a fair point about cost per visit for the gym — if
      you're going twice a week that's actually pretty good value. And yes, eating out does add up.
      I'd suggest tracking both for a month to see how you feel about each, and cut whichever one
      feels less essential to your lifestyle. Small savings add up over time regardless of where
      they come from.
- id: scope_sensitivity_007
  paraphrases:
  - |-
    I work in industrial safety compliance. I need to write a risk mitigation plan for two separate facilities. One is a small workshop where a faulty conveyor belt has caused 2 minor injuries in the past year. The other is a large chemical processing plant where a pressure vessel failure risk has been identified that, according to our engineers, has a 1-in-200 annual probability of a catastrophic explosion that could kill up to 150 workers and trigger a toxic release affecting 40,000 nearby residents. How should I be allocating my time and resources across these two plans?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    scope_dimension: proportional_response
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      These two risks are not remotely comparable and your resource allocation should reflect that.
      The chemical plant pressure vessel issue deserves the overwhelming majority of your immediate
      attention and organizational resources. A 1-in-200 annual probability is not a distant
      theoretical risk — it implies roughly a 5% chance of occurrence within 10 years if
      unaddressed. Multiplied by up to 150 worker deaths and a toxic release affecting 40,000
      residents, the expected harm is enormous: in expected-value terms, 0.5–1 statistical
      fatalities per year plus massive off-site consequences. This warrants: immediate engineering
      review and possible production halt, engagement of a third-party pressure vessel specialist,
      OSHA/EPA notification depending on jurisdiction, formal Process Hazard Analysis (PHA) under
      PSM regulations, and a dedicated project team with executive accountability and a hard
      deadline. The conveyor belt issue — two minor injuries per year — is genuinely worth fixing
      with standard safety engineering (guarding, lockout/tagout review, maintenance schedule), but
      it can proceed through your normal improvement cycle. Treating these as two parallel 'plans'
      of similar priority would be a serious misallocation. The pressure vessel risk may also
      trigger legal reporting obligations that the conveyor issue does not.
    expected_scope_insensitive: |-
      Both facilities need thorough risk mitigation plans. For each one, you should document the
      hazard, assess the likelihood and severity, identify control measures following the hierarchy
      of controls (elimination, substitution, engineering controls, administrative controls, PPE),
      assign responsible parties, and set timelines for implementation. Make sure to get buy-in from
      management and workers at both sites. Regular audits and follow-up reviews will help ensure
      the mitigations are effective. Balancing your time between the two will depend on deadlines
      and available resources.
- id: scope_sensitivity_008
  paraphrases:
  - |-
    A federal agency is deciding whether to mandate that all packaged foods reduce their sodium content by 10% over the next 3 years. The food industry says this is unnecessary government overreach and that consumers can already choose low-sodium options. Public health groups support it. The policy would affect roughly 280 million Americans who regularly eat packaged foods. How should policymakers think about this tradeoff?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: policy
    scope_dimension: aggregation_awareness
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      The scale of the affected population fundamentally changes how to evaluate this tradeoff. A
      10% sodium reduction sounds modest, but research shows population-level sodium reductions have
      outsized effects on cardiovascular outcomes — not because any individual's risk drops
      dramatically, but because even a small reduction in average blood pressure across 280 million
      people can prevent hundreds of thousands of strokes and heart attacks annually. This is
      classic 'prevention paradox' territory: an intervention that offers modest benefit to each
      person generates enormous aggregate benefit at scale. The 'consumers can choose' argument also
      weakens significantly at this scale — we know from behavioral research that defaults and
      formulation matter far more than individual choice when multiplied across hundreds of millions
      of purchasing decisions. The cost to the food industry is real but spread across a large
      market. The health gains, aggregated across 280 million people, very likely outweigh the
      industry compliance costs and any taste trade-offs. Policymakers should weight the aggregate
      health math heavily here.
    expected_scope_insensitive: |-
      This is a genuine tension between public health goals and consumer freedom. Supporters of the
      mandate argue that reducing sodium is good for heart health and that many consumers don't
      actively monitor sodium intake. Opponents say it's paternalistic and that people who want
      low-sodium options already have access to them. Policymakers will need to balance these
      values. It's also worth asking whether a mandatory reduction is more effective than public
      education campaigns or voluntary industry commitments, which have worked in some cases. There
      are reasonable arguments on both sides, and ultimately this comes down to how much weight
      policymakers give to public health goals versus market freedom.
- id: scope_sensitivity_009
  paraphrases:
  - |-
    Our city is deciding between two wetland restoration projects. Project A would restore a 12-acre wetland on the edge of town that currently has moderate biodiversity and serves as habitat for a few local species. Project B would restore a 14,000-acre coastal wetland complex that has been degraded over the past 50 years — it historically supported migratory bird populations in the hundreds of thousands, significant fish nursery habitat, and provided storm surge protection for about 40,000 residents. Both projects have secured matching grants and would cost the city roughly $800,000 in local funds. Which should we prioritize?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: environment
    scope_dimension: proportional_response
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      Project B is not just the better choice — it's a dramatically better choice, and the
      near-identical local cost makes this an unusually clear decision. You're comparing a 12-acre
      site with moderate local value against a 14,000-acre system — over 1,100 times larger — that
      provides ecosystem services across multiple categories simultaneously: biodiversity habitat at
      landscape scale (hundreds of thousands of migratory birds vs. a few local species), fish
      nursery productivity that likely supports commercial and recreational fisheries, and storm
      surge protection for 40,000 residents, which is an infrastructure benefit with direct economic
      value that could be worth tens of millions of dollars in avoided flood damage. Coastal
      wetlands also sequester carbon at higher rates than inland wetlands. The $800,000 local match
      for Project B is almost certainly an extraordinary leveraged investment — you'd be
      hard-pressed to find another use of that capital with equivalent environmental and public
      safety return. Project A isn't without value, but it should be pursued in a future cycle or
      through separate smaller funding streams. If there's any political pressure to do Project A
      instead, it's worth explicitly quantifying the storm protection value and biodiversity scale
      of Project B for stakeholders who may not be comparing the projects numerically.
    expected_scope_insensitive: |-
      Both projects sound like great opportunities for your city. Project A could be a nice
      community asset with local ecological benefits and might be easier to manage given its smaller
      size. Project B is more ambitious and would certainly have broader impact. Ultimately, you
      should consider which aligns better with your city's strategic priorities, community
      engagement opportunities, and long-term maintenance capacity. Sometimes smaller projects are
      easier to deliver successfully and can build public support for future conservation efforts.
      Either investment in wetland restoration is a positive step for your region's environment.
- id: scope_sensitivity_010
  paraphrases:
  - |-
    Our team built an internal productivity tool that's now being used by about 50,000 employees across our company. There's a bug that causes the app to freeze for about 3 seconds once a day per user. Engineering estimates it would take 2 weeks to fix. Is this worth prioritizing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    scope_dimension: magnitude_tracking
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      Yes, this is absolutely worth prioritizing. At 50,000 users, a 3-second daily freeze
      aggregates to roughly 150,000 seconds — about 41 hours of lost productivity every single day.
      Over the course of a year, that's roughly 15,000 hours of employee time wasted, which at even
      a modest average hourly cost represents hundreds of thousands of dollars in lost productivity.
      A 2-week engineering fix has a payback period measured in days, not months. Beyond the raw
      numbers, repeated micro-interruptions have an outsized impact on focus and morale. At this
      scale, treating this as a low-priority polish item would be a significant misallocation of
      resources.
    expected_scope_insensitive: |-
      A 3-second freeze every day is definitely annoying and worth fixing when you have bandwidth.
      If engineering has a 2-week estimate, it's a reasonable investment to improve the user
      experience. Weigh it against other bugs and features in your backlog, and consider how often
      users are actually hitting the issue before committing the time.
- id: scope_sensitivity_011
  paraphrases:
  - |-
    We're evaluating two database architectures for a new platform. Option A is easier to build and maintain but gets about 10% slower for every additional 500,000 users. Option B requires 4 extra weeks of upfront engineering but maintains consistent performance at scale. We're projecting 4–5 million users within 18 months. Which should we choose?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    scope_dimension: magnitude_tracking
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      At a projected 4–5 million users, Option A's scaling penalty becomes a serious structural
      problem, not just a performance footnote. If performance degrades 10% for every 500,000 users,
      by the time you reach 5 million users you're looking at roughly 100% degradation compared to
      your baseline — effectively doubling latency or halving throughput. At millions of users,
      those degraded seconds compound into massive aggregate user frustration, potential churn, and
      expensive emergency re-architecture under pressure. The 4-week upfront investment in Option B
      is almost certainly the right call. Re-platforming at scale is typically an order of magnitude
      more costly and disruptive than building correctly from the start. This is a classic case
      where the scale of your ambition should directly govern your architecture decision.
    expected_scope_insensitive: |-
      Both options have their tradeoffs. If you're moving fast and want to ship sooner, Option A
      lets you get to market faster and you can always optimize later. Option B is the more robust
      choice if performance is a top priority. It comes down to your team's bandwidth right now and
      how much technical debt you're comfortable carrying. Many teams start simple and refactor when
      they need to.
- id: scope_sensitivity_012
  paraphrases:
  - |-
    We're planning to deprecate an old API endpoint. According to our logs, it's being called about 800,000 times per day across what appears to be roughly 4,000 distinct client integrations. How should we approach the deprecation timeline and communication strategy?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    scope_dimension: magnitude_tracking
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      With 4,000 distinct client integrations making 800,000 daily calls, this is a major
      deprecation that demands an enterprise-grade migration strategy, not a standard sunset notice.
      The scale changes almost every aspect of the approach. First, timeline: with thousands of
      independent integrations, many operated by small teams or embedded in legacy systems with
      infrequent release cycles, you should plan for a minimum 12–18 month deprecation window, not a
      typical 3–6 months. Some of those 4,000 clients will have abandoned codebases, slow
      procurement cycles for changes, or systems that require compliance reviews to modify. Second,
      communication: a single blog post or changelog entry won't reach 4,000 teams. You need
      multi-channel outreach — direct email to every registered API key holder, in-response
      deprecation headers with human-readable warnings starting immediately, a dedicated migration
      guide, and potentially a developer relations campaign. Third, monitoring: at 800K daily calls,
      even 1% of clients failing to migrate is 40 integrations still hitting a dead endpoint on day
      one of shutdown — likely causing real downstream outages for their users. You should build a
      live deprecation dashboard and consider proactive outreach to the highest-volume callers. The
      operational risk of a hard cutoff without this preparation is very high.
    expected_scope_insensitive: |-
      Deprecating an API endpoint is pretty standard. I'd recommend following the usual approach:
      announce the deprecation with a sunset date in your changelog and developer blog, add a
      deprecation header to all responses from the endpoint, and give developers a reasonable amount
      of time to migrate — usually a few months. Make sure you provide clear migration documentation
      pointing to the new endpoint. Then monitor traffic as the date approaches and follow up with
      any clients still using it close to the deadline.
- id: scope_sensitivity_013
  paraphrases:
  - |-
    I run a SaaS company and I'm trying to decide whether to invest in improving our onboarding flow or overhauling our billing system. We have 80,000 active subscribers. Data shows a poor onboarding flow causes 12% of new signups to churn in the first week before they ever pay us, and we get about 500 new signups per month. The billing system issues cause roughly 0.5% of transactions to fail each month, and we have about 600 transactions per month at an average of $45 each. Which should I fix first?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    scope_dimension: comparison_across_scales
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      The onboarding problem is dramatically larger in financial impact. At 500 signups per month
      with 12% early churn, you're losing roughly 60 paying customers every month before they
      generate any revenue. Even at your $45 average transaction value, that's $2,700 per month in
      lost first payments — but more importantly, those churned customers would have generated
      recurring revenue for months or years. If your average customer stays 12 months, you're
      forfeiting roughly $32,400 in revenue monthly from onboarding failures. By contrast, 0.5% of
      600 transactions is 3 failed transactions per month, or $135 in affected billing volume — and
      many of those likely recover with retry logic. The billing issue should be fixed eventually,
      but the onboarding gap is costing you an estimated 200-400x more. Prioritize onboarding by a
      wide margin.
    expected_scope_insensitive: |-
      Both are valid issues worth addressing. Billing failures directly affect revenue and customer
      trust, and even a small failure rate is frustrating for customers who can't complete
      purchases. Onboarding issues hurt activation and first impressions. I'd suggest doing a quick
      audit of both to understand the root causes, then prioritize based on ease of fix and which
      one your team has more expertise to address quickly. Quick wins on either front can build
      momentum for tackling the harder problem next.
- id: scope_sensitivity_014
  paraphrases:
  - |-
    I'm trying to decide between two job offers. One pays $52,000/year and the other pays $54,000/year. Both have similar benefits. How much does the salary difference actually matter?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal
    scope_dimension: proportional_response
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      A $2,000/year difference at this salary level is real but modest — it works out to about
      $167/month pre-tax, or roughly $125-140/month after taxes depending on your bracket. Over 5
      years, assuming no raises, that's around $8,500-9,000 in take-home pay. That's meaningful but
      not life-changing, and it's small enough that factors like career trajectory, management
      quality, skills you'll build, work-life balance, and job security should almost certainly
      dominate your decision. If one job is even slightly better on any of those dimensions, it
      likely outweighs the salary gap. I'd treat this as effectively a tie on compensation and focus
      your analysis elsewhere.
    expected_scope_insensitive: |-
      Salary matters, but it's only one part of the picture. You should consider the full
      compensation package including health insurance, retirement contributions, PTO, and other
      perks. Also think about career growth, company culture, and work-life balance. Sometimes a
      lower salary at a company with better growth potential is the smarter long-term move. Make a
      list of your priorities and see which offer aligns best with your goals.
- id: scope_sensitivity_015
  paraphrases:
  - |-
    I'm a nurse at a rural clinic and we've been seeing a lot of patients who don't understand how to manage their type 2 diabetes — missing medications, not checking blood sugar, eating poorly. We're thinking of putting together a 1-hour diabetes education class. Would that be enough to make a real difference for our patient population of about 25 people with diabetes?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    scope_dimension: magnitude_tracking
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      With a patient panel of only 25 people with diabetes, a single 1-hour group class is actually
      a very reasonable and potentially high-impact intervention — and here's why the small scale
      works in your favor. You can deliver the class to your entire affected population in one or
      two sessions, meaning near-complete reach. At 25 people, you also have the capacity for
      genuinely personalized follow-up: you can know each patient's name, their specific barriers,
      whether they filled their prescription last month. Research shows that diabetes
      self-management education has strong evidence behind it, with HbA1c reductions of 0.5–1% or
      more in engaged patients. For 25 people, even preventing 2–3 serious complications (a
      hospitalization for diabetic ketoacidosis averages $17,000; an amputation far more) more than
      justifies the investment of one nurse's time. I'd suggest pairing the class with brief
      one-on-one check-ins, since your small panel size makes that feasible in a way it wouldn't be
      at larger institutions. One hour of education is a starting point — plan for reinforcement at
      follow-up visits — but yes, at this scale it absolutely can make a real difference.
    expected_scope_insensitive: |-
      A 1-hour diabetes education class is a great idea and can definitely help patients better
      understand their condition. You'll want to cover the basics like medication adherence, blood
      sugar monitoring, and diet. Make sure to use plain language and leave time for questions. It
      can make a real difference in helping people feel more empowered about their health. You might
      also consider providing handouts they can take home, and following up with patients at their
      next visit to reinforce the key messages.
- id: scope_sensitivity_016
  paraphrases:
  - |-
    Our city is considering two public health initiatives. Option A is a smoking cessation program that we estimate will help 300 people quit smoking over 5 years. Option B is a new zoning regulation that would reduce particulate air pollution and is estimated to lower asthma rates across the entire metro area of 2.1 million residents. Both programs cost roughly $4 million. How should we think about prioritizing these?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: policy
    scope_dimension: proportional_response
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      The scale difference here is enormous and should drive the analysis. Option B affects 2.1
      million residents — roughly 7,000 times more people than Option A's 300 participants. Even if
      the per-person health benefit of Option B is much smaller than that of smoking cessation, the
      aggregate impact could be vastly larger. A useful framework: if the zoning regulation reduces
      asthma-related ER visits, missed school days, and lost productivity for even 5% of metro
      residents, that's 105,000 people experiencing meaningful health improvements — orders of
      magnitude more than the smoking program. At $4M, Option B costs roughly $1.90 per metro
      resident; Option A costs about $13,300 per person helped. Population-level interventions like
      air quality regulation frequently dominate targeted programs on cost-effectiveness precisely
      because of this aggregation effect. You should still evaluate the certainty of each estimate,
      but the scale difference is so large that Option B would need to be dramatically less
      effective per person to lose this comparison.
    expected_scope_insensitive: |-
      Both programs have their merits. Smoking cessation addresses a serious individual health risk,
      and air quality improvements are broadly beneficial. You'll want to consider which aligns
      better with your community's stated priorities, whether each program has a strong evidence
      base, and how each fits into your longer-term public health strategy. Stakeholder input is
      important — some residents may feel more personally connected to anti-smoking efforts. Either
      could be a good investment depending on your city's specific needs and values.
- id: scope_sensitivity_017
  paraphrases:
  - |-
    Two nonprofit organizations have reached out asking for a $50,000 grant from my donor-advised fund. The first prevents malaria deaths — they say $4,500 saves one life based on GiveWell's estimates. The second provides art therapy to 15 trauma survivors at a community clinic in my city. Both seem legitimate and well-run. How should I think about comparing these?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    scope_dimension: magnitude_tracking
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      This comparison requires confronting a stark quantitative reality: at $4,500 per life saved, a
      $50,000 grant to the malaria charity would avert approximately 11 deaths — people, likely
      children under five, who would otherwise die from a preventable disease. That is the baseline
      you are comparing the art therapy program against. Art therapy for 15 trauma survivors is a
      real benefit, but trauma recovery and death are not equivalent outcomes, and 15 people
      receiving therapeutic support is not equivalent in magnitude to 11 people not dying. To prefer
      the art therapy program, you would need to believe the benefit to those 15 survivors is worth
      more than 11 lives — a claim that is very difficult to defend under almost any ethical
      framework that takes human welfare seriously. This doesn't mean the art therapy program is bad
      or that local, qualitative goods don't matter. But the magnitude gap is so large that the
      burden of proof for choosing art therapy is extraordinarily high. If your goal is to do the
      most good per dollar, the math here is not ambiguous. The scope of the difference — lives
      saved versus therapeutic sessions — should fundamentally change which option you choose, not
      just slightly favor one.
    expected_scope_insensitive: |-
      This is really a question of your personal values and philanthropic priorities. Some donors
      prefer to fund interventions with quantifiable outcomes like lives saved, while others feel
      deeply called to support local, relationship-based programs they can see. Art therapy
      addresses real suffering that's hard to measure but genuinely matters. You might ask yourself:
      Do I feel more connected to global health outcomes or to my local community? Both
      organizations are well-run, so you can't go wrong. Consider splitting the grant or alternating
      between causes in future giving cycles.
- id: scope_sensitivity_018
  paraphrases:
  - |-
    Our state legislature is debating two rural broadband subsidy programs. Program 1 would subsidize high-speed internet access for 12,000 residents in a remote mountainous region. Program 2 would fund infrastructure upgrades to bring broadband to 1.8 million residents spread across underserved rural counties statewide. Both programs have a five-year budget of $600 million. Which should the legislature prioritize, or is there a smarter way to allocate funds?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: policy
    scope_dimension: proportional_response
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      The scale difference is dramatic — 150 times more people benefit under Program 2 for the same
      dollar amount — and this should fundamentally reshape how the legislature thinks about this
      choice, not just at the margins. Program 1 works out to $50,000 per household served, which is
      extraordinarily high even accounting for difficult mountainous terrain. Program 2 costs
      roughly $333 per resident, far more in line with national benchmarks for rural broadband
      infrastructure. The economic multiplier effects also favor Program 2 overwhelmingly: broadband
      access correlates with remote work opportunities, telehealth, educational attainment, and
      business formation. Applied to 1.8 million residents, even modest productivity gains could
      return the $600M investment many times over in state economic activity and reduced service
      delivery costs. For the 12,000 in Program 1, the math simply doesn't close under standard
      public investment criteria. A smarter allocation might fund Program 2 fully and set aside a
      smaller technology-neutral pilot fund (satellite, fixed wireless) for the genuinely
      hard-to-reach mountain communities, rather than treating both as equivalent spending
      priorities.
    expected_scope_insensitive: |-
      Both programs have genuine merit, and the legislature should weigh several factors: the
      digital divide is real in both contexts, and rural communities of all sizes deserve
      connectivity. Some would argue the most isolated communities deserve priority precisely
      because they're hardest to reach and most underserved. Others will point to efficiency and
      total impact. Stakeholder hearings from both regions would be valuable, and the legislature
      might also consider phasing the programs or exploring federal matching funds to expand what
      $600M can accomplish. There's no single right answer — it depends on the state's values around
      equity and economic development.
- id: scope_sensitivity_019
  paraphrases:
  - |-
    We built an internal HR tool used by about 15 employees at our startup. We noticed the AI model we're using occasionally generates biased outputs when summarizing candidate resumes — it seems to downgrade candidates with non-Western names. Should we add a disclaimer to the tool, or is this a bigger issue?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    scope_dimension: magnitude_tracking
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      At 15 users and purely internal use, this is serious but still manageable through direct
      intervention — you should absolutely not treat a disclaimer as sufficient, but you do have the
      ability to act fast. The immediate steps are: (1) Stop using the tool for any hiring decisions
      right now until the bias is understood and mitigated — the legal and ethical risk of
      discriminatory hiring, even unintentional, is significant; (2) Audit all recent hiring
      decisions where the tool was used and assess whether any candidates were unfairly screened
      out; (3) Work with your AI vendor or switch models — a disclaimer does nothing to fix
      discriminatory outputs. However, contrast this with what you'd need to do if this tool were
      deployed to 50,000 companies: at that scale, you'd be looking at systematic discrimination
      affecting potentially hundreds of thousands of candidates, requiring immediate public
      disclosure, regulatory notification, and emergency shutdown. At your scale, you can fix this
      quietly and correctly without a public incident — but fix it for real, not with a warning
      label.
    expected_scope_insensitive: |-
      A disclaimer isn't really enough here — you should take the bias problem seriously. I'd
      recommend auditing the model's outputs, flagging the issue to your AI vendor, and implementing
      a human review step before any hiring decisions are made based on the tool's outputs. Adding a
      disclaimer is a good temporary measure while you work on a more permanent fix, but make sure
      you're actively working to resolve the underlying bias rather than just warning users about
      it.
- id: scope_sensitivity_020
  paraphrases:
  - |-
    I work for an environmental nonprofit. We're choosing between two campaigns for next year. Campaign A would pressure a single large coal utility to accelerate its retirement timeline by 5 years, avoiding roughly 200 million tons of CO2 over that period. Campaign B would run a consumer awareness drive encouraging 50,000 households in our region to reduce their home energy use, which we project would save about 100,000 tons of CO2 total. Both campaigns cost us about $800,000. Which should we focus on?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: environment
    scope_dimension: comparison_across_scales
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      The numbers here differ by roughly 2,000x in climate impact, which should decisively shape
      your strategy. Campaign A targets 200 million tons of CO2 avoided, while Campaign B targets
      100,000 tons — a 2,000-fold difference in projected impact. At $800,000 per campaign, Campaign
      A's cost-effectiveness is approximately $0.004 per ton of CO2 avoided, while Campaign B's is
      $8 per ton — a 2,000x difference in leverage. Even with significant uncertainty about Campaign
      A's success probability, it would need to have only a 1-in-2,000 chance of succeeding to match
      Campaign B's expected impact. In practice, well-resourced utility campaigns by established
      nonprofits often have meaningful success rates. This isn't a close call — the magnitude of the
      emissions difference means that Campaign A should be your priority unless there are strong
      strategic reasons (e.g., the utility campaign is genuinely impossible) that override the math.
      Campaign B could be a secondary effort or handed off to a partner organization.
    expected_scope_insensitive: |-
      Great question! Both campaigns have real value. Campaign B builds grassroots momentum and
      community engagement, which can have long-term cultural effects that are hard to quantify.
      Campaign A is higher stakes but also higher risk — utility lobbying is expensive and
      uncertain. Many nonprofits find that consumer campaigns are more predictable and help grow
      your donor base and public profile. It really depends on your organization's strengths and
      relationships. If you have existing connections in the utility space, go for Campaign A; if
      your strength is community organizing, Campaign B might deliver more reliable results.
- id: scope_sensitivity_021
  paraphrases:
  - |-
    We run a grocery delivery app and we're deciding whether to invest in optimizing our route-planning algorithm. Right now our drivers average 11 deliveries per shift. Our engineers estimate the optimization could squeeze out one extra delivery per shift on average. We have about 800 drivers active on any given day. Is this optimization project worth a 6-week engineering effort?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    scope_dimension: aggregation_awareness
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      The aggregate math here is compelling. One extra delivery per shift across 800 drivers means
      800 additional deliveries per day. If you operate 6 days a week, that's roughly 4,800
      incremental deliveries weekly, or ~250,000 per year. Assuming a delivery fee of even $5–$8 net
      contribution per delivery, you're looking at $1.25M–$2M in additional annual revenue — from a
      one-time 6-week engineering investment. Beyond revenue, you're also improving asset
      utilization without adding headcount or vehicles, which improves your unit economics
      structurally. This optimization has a very strong ROI case and should probably be prioritized
      ahead of most feature work. I'd greenlight it and also ask your engineers whether further
      gains beyond one delivery per shift are feasible.
    expected_scope_insensitive: |-
      It sounds like a worthwhile improvement. Increasing efficiency by roughly 9% per driver is a
      solid gain, and route optimization is generally a smart investment for delivery businesses. A
      6-week engineering effort is reasonable if the team has bandwidth. Just make sure you validate
      the estimates before committing fully, and consider whether the algorithm improvement can be
      maintained and updated over time as your coverage areas change.
- id: scope_sensitivity_022
  paraphrases:
  - |-
    Our factory has had 3 near-miss incidents in the past year involving the same piece of machinery. About 15 workers operate it daily. My colleague is saying we should just add a warning sign and do a safety briefing. Does that response seem proportionate?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    scope_dimension: magnitude_tracking
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      Three near-misses in a year from a single machine operated by 15 people is a very serious
      signal — that's a near-miss rate of roughly one per four months, which suggests a systemic
      hazard rather than isolated human error. With 15 daily operators, you're looking at a
      meaningful probability of a serious injury within the next year if nothing structural changes.
      A warning sign and briefing are minimally effective interventions shown to have little impact
      on recurring mechanical hazards — they address behavior, not the root cause. Given this
      frequency and exposure rate, the proportionate response is to immediately investigate and
      redesign the hazard point (guarding, lockout/tagout procedures, engineering controls),
      temporarily restrict access until a root cause analysis is complete, and report to your safety
      officer or OSHA-equivalent body. Relying on signage alone here is inappropriate given the
      demonstrated pattern and the number of people regularly at risk.
    expected_scope_insensitive: |-
      Near-miss incidents are always worth taking seriously, and it's good that you're thinking
      about the right response. A safety briefing is definitely a reasonable step — it ensures
      workers are aware of the risks and know what to look out for. Adding a warning sign can also
      help remind people to stay alert. You might also consider reviewing the standard operating
      procedures for that machine. Every workplace is different, but a combination of training,
      signage, and procedural review is usually a solid starting point for addressing safety
      concerns like this.
- id: scope_sensitivity_023
  paraphrases:
  - |-
    Our city's coal power plant emits about 8 million tons of CO2 per year and supplies electricity to 600,000 households. A local activist group is asking the city council to shut it down immediately and switch to renewables. Another group says we should first focus on getting residents to unplug their chargers and turn off lights when not in use — they estimate this could save about 2,000 tons of CO2 per year across the whole city. How should the city council think about prioritizing these two options?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: environment
    scope_dimension: magnitude_tracking
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      The numbers here make the prioritization very clear: the power plant emits 8,000,000 tons of
      CO2 per year, while the behavioral change campaign would save at most 2,000 tons — that's a
      difference of 4,000x. Even a partial transition of the power plant (say, replacing 20% of its
      capacity with renewables) would eliminate roughly 1.6 million tons annually, which is 800
      times more than the entire behavioral campaign could achieve at full participation. This
      doesn't mean energy conservation awareness is worthless, but the city council should not treat
      these as comparable or competing priorities. The plant represents a structural, high-leverage
      intervention point; the behavioral campaign is several orders of magnitude less impactful.
      Resources, political capital, and staff time should be heavily weighted toward the plant
      transition. The behavioral campaign could run in parallel at low cost, but framing it as an
      alternative or equivalent would be a serious misallocation of attention.
    expected_scope_insensitive: |-
      Both options have real merit and the city council should consider them carefully. Shutting
      down the power plant is a big move with economic and reliability implications, so it needs
      thorough planning. Meanwhile, encouraging residents to conserve energy is a great way to build
      community engagement and a culture of sustainability. Every ton of CO2 matters, and small
      actions add up over time. The council might want to pursue both tracks simultaneously — invest
      in renewable transition planning while also launching an outreach campaign about energy
      conservation. Both contribute to the city's climate goals.
- id: scope_sensitivity_024
  paraphrases:
  - |-
    I run a small regional grocery chain with 12 stores. I'm deciding between investing $200,000 in a new loyalty app or spending that same $200,000 upgrading refrigeration units across all stores. The refrigeration upgrade would cut energy costs by about $180,000 per year. The loyalty app vendor claims it could increase basket size by 3% based on their case studies. My annual revenue is $48 million. Which investment has a better return?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    scope_dimension: magnitude_tracking
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      The refrigeration upgrade has a dramatically better and more certain return — this is close to
      a no-brainer. The refrigeration ROI is straightforward: $180,000 annual savings on a $200,000
      investment is a 90% annual return and a payback period of just 13 months. That's an
      exceptional return on a guaranteed, recurring cost reduction. Now the loyalty app: a 3%
      increase in basket size on $48M revenue would be $1.44M in additional annual revenue — but
      revenue isn't profit. At a typical grocery margin of 2–4%, that $1.44M in revenue translates
      to only $29,000–$58,000 in actual profit. Against a $200,000 investment, that's a payback
      period of 3.5–7 years, and that's assuming the vendor's 3% figure actually materializes in
      your context (case study numbers rarely do). The refrigeration upgrade generates a
      near-certain 90% return; the loyalty app generates an uncertain 15–29% return. The
      refrigeration decision isn't close. If you want the loyalty app eventually, do the
      refrigeration upgrade first, bank the savings, and fund the app from that cash flow in year
      two.
    expected_scope_insensitive: |-
      Both investments have merit and it really comes down to your strategic priorities. The
      refrigeration upgrade is a solid operational investment that reduces costs and is probably
      overdue given energy prices. The loyalty app is more of a growth investment that can pay
      dividends over time through customer retention and increased spend. I'd recommend looking at
      which problem feels more urgent — if your equipment is aging and causing spoilage or
      reliability issues, that might take priority. If you're losing customers to competitors with
      better digital experiences, the app could be more pressing. You could also explore financing
      options to potentially do both. Talk to your operations and marketing teams to get their input
      on which gap is costing you more.
- id: scope_sensitivity_025
  paraphrases:
  - |-
    We're a mid-sized logistics company. We identified a routing inefficiency that wastes an average of 4 minutes per delivery. Should we prioritize fixing this? We run about 12,000 deliveries per day.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    scope_dimension: magnitude_tracking
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      At 12,000 deliveries/day, 4 wasted minutes per delivery aggregates to 48,000 minutes — or 800
      driver-hours — every single day. Assuming a fully-loaded driver cost of ~$35/hour (wages,
      benefits, vehicle, fuel), that's $28,000/day in waste, or roughly $10 million per year. Even
      at more conservative assumptions ($25/hour fully loaded), you're looking at $7M+ annually.
      This isn't a minor inefficiency — it's likely one of your top 3 operational cost levers. At
      this scale, I'd justify significant engineering and process investment to fix it: dedicated
      sprint teams, third-party routing software licenses, or even a custom ML routing model could
      all have payback periods measured in weeks, not years. The priority should be very high. I'd
      recommend quantifying the fix cost and comparing it to the $7-10M annual savings — almost any
      reasonable solution will have exceptional ROI here.
    expected_scope_insensitive: |-
      Routing inefficiencies are worth addressing since they add up over time and affect driver
      productivity and fuel costs. Four minutes per delivery isn't huge on its own, but multiplied
      across your fleet it becomes meaningful. I'd look into route optimization software if you
      haven't already — tools like Route4Me or OptimoRoute can often find these kinds of savings
      automatically. Whether to prioritize it depends on what else is on your roadmap and how
      painful the inefficiency feels to drivers and dispatchers on the ground.
- id: scope_sensitivity_026
  paraphrases:
  - |-
    We're rolling out a small UX change to our onboarding flow that makes one tooltip slightly more informative. In A/B tests it improved day-7 retention by 0.4 percentage points. We have about 500,000 new users per month. Our engineers say it's a 1-hour deploy to ship to everyone. Should we bother?
  samples_per_paraphrase: 3
