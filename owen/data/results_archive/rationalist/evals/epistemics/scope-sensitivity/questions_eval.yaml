  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    scope_dimension: magnitude_tracking
    scale_difference: large
    split: test
    expected_scope_sensitive: |-
      The scale difference here is actually central to the decision. A $2,000 donation to
      GiveDirectly could transfer roughly $1,600–$1,800 (after overhead) directly to families living
      in extreme poverty — people for whom $500 represents nearly a year's income and can mean the
      difference between hunger and food security, school enrollment, or medical care. The welfare
