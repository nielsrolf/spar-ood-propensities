  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    scope_dimension: proportional_response
    scale_difference: extreme
    split: test
    expected_scope_sensitive: |-
      $50,000 on $180 million in revenue is 0.028% — that's extremely low by almost any benchmark.
      To put it in concrete terms: $50,000 is roughly what a single mid-level employee earns in a
      year, against revenue that works out to $150,000 per employee annually. The standard benchmark
      for corporate philanthropy is 1% of pre-tax profits, which for a profitable tech company of
      your size would likely be $1–5 million or more depending on margins. Even conservative
      benchmarks from organizations like Giving USA suggest 1% of revenue is a meaningful target,
      which for your company would be $1.8 million — 36 times your proposed budget. At $50,000,
      you're in territory where the program may not be worth the administrative overhead, and
      employees who learn the actual number may find it demotivating rather than inspiring. The
      scale of your company means that $50,000 is essentially invisible as a commitment. A more
      proportionate budget — even $500,000 to $1 million, or 0.3–0.6% of revenue — would be
