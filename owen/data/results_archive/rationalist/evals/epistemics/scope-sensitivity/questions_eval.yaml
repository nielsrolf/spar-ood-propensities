    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      This comparison requires taking the magnitude of outcomes seriously, because the stakes are
      very different in kind and scale. Preventing 200 deaths per year involves averting the most
      irreversible harm possible — loss of life, predominantly in young children whose full lives
      are ahead of them. Improving literacy by one grade level for 2,000 children is meaningful, but
      it's a bounded, reversible improvement in educational outcomes. In terms of severity of harm
      prevented, these interventions are not equivalent even though the raw numbers might make
      literacy look competitive. If your goal is to maximize impact per dollar, the $4,500
      cost-per-death-averted benchmark is actually in the range that leading evaluators like
