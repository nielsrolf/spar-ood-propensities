      environments, edge cases, and attack vectors. Security vulnerabilities are far more likely to
      have been discovered and patched. The community size means critical bugs typically get fixed
      in days, not months. For authentication specifically—where a flaw can compromise every user
      account—this scale difference is material. Library A might have better docs or a cleaner API,
