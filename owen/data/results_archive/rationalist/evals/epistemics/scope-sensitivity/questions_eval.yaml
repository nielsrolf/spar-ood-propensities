- id: scope_sensitivity_266
  paraphrases:
  - |-
    I'm a researcher evaluating two public health interventions for a government grant. Option A is a mental health awareness campaign that will reach 500 people in a rural community and is expected to increase therapy-seeking behavior by 15%. Option B is a short digital mental health screening tool to be embedded in a health insurance portal used by 4 million people, expected to increase therapy-seeking by just 2%. The grant budget is $2 million. Which should I prioritize?
