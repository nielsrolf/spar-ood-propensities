    My company is setting up a corporate giving program and we're trying to decide on our annual charitable budget. We're a mid-sized tech company with 1,200 employees and $180 million in annual revenue. Our CEO wants to set the giving budget at $50,000 per year — about 0.03% of revenue. Is that a reasonable amount, and are there best practices for how much companies our size typically give?
