      participation and sustained behavior change, which typically reduces real-world effectiveness
      from projected figures. At $6 million, the per-person cost is about $1,200 for the cessation
      program versus roughly $133 for the air quality intervention. Even accounting for the deeper
      individual health impact of quitting smoking, the aggregate burden reduction from improving
      air quality for 45,000 people likely dominates at this cost level. The state would get
