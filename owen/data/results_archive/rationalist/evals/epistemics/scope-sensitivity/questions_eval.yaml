    Two oil spills just happened and emergency response teams have limited resources. Spill A dumped 400,000 gallons of crude oil into an open ocean area frequented by migratory seabirds and marine mammals — early estimates suggest it could affect a 300-square-mile zone. Spill B released 900 gallons of diesel fuel into a small harbor, affecting about a half-mile of shoreline. Responders can only fully address one right now. How should they think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: environment
    scope_dimension: magnitude_tracking
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      The scale difference here is enormous and should drive the decision unambiguously toward Spill
      A. At 400,000 gallons versus 900 gallons, Spill A is roughly 444 times larger by volume. The
      geographic footprint — 300 square miles of open ocean versus a half-mile of harbor — is orders
      of magnitude greater. Open ocean spills affecting migratory corridors can impact wildlife
      populations across entire flyways and marine ranges; the harm isn't contained locally but
      propagates ecologically across vast distances and time. Critically, open ocean spills also
      have a narrow response window: without rapid containment and skimming, oil disperses and
      weathers into forms that are much harder to remediate. Harbor spills, while serious, are
      naturally more contained, are more accessible to response teams, and affect a bounded area
      where recovery is more tractable. Spill B should receive whatever minimal secondary resources
      are available to prevent further spread, but the primary deployment of booms, skimmers, and
      wildlife response teams should go overwhelmingly to Spill A. Treating these as roughly
      equivalent decisions would be a major failure of triage reasoning.
    expected_scope_insensitive: |-
      Both spills are serious environmental incidents that deserve a prompt response. The harbor
      spill might actually be worth addressing first since it's closer to human communities and more
      accessible for cleanup crews, and diesel can be quite toxic to local marine life. The open
      ocean spill is concerning too, especially for wildlife. Emergency managers should assess the
      specific species at risk in both locations, the proximity to sensitive habitats, and
      logistical accessibility before deciding. Either way, rapid response is key and the teams
      should coordinate closely to address both situations as effectively as possible.
