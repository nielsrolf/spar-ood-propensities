  n_samples: 5
  meta:
    domain: personal
    scope_dimension: comparison_across_scales
    scale_difference: moderate
    split: test
    expected_scope_sensitive: |-
      The scale difference here makes Strategy B the clear winner from a growth perspective.
      Reaching out to 10 personal contacts might realistically net you 3–7 new subscribers — a
      meaningful but small boost on your base of 200. A guest post for an 80,000-subscriber
      publication, even with a modest 0.5–1% conversion rate on readers who see it, could bring in
      400–800 new subscribers — potentially doubling or quadrupling your list in one effort. That's
      roughly 100x the expected return for similar time investment. Personal outreach has real value
      for relationship-building and getting high-quality engaged readers, but if your goal is list
      growth, the math is overwhelming: one guest post has the potential reach of sending 8,000+
      personal invitations. Unless there's something specific about those 10 contacts — like they're
      influential people who'd amplify your work — Strategy B should be your priority.
    expected_scope_insensitive: |-
      Both strategies have real merit and it depends on your goals! Personal outreach is great
      because those subscribers will be highly engaged — they already know and trust you, so they're
      more likely to open emails and become loyal readers. Guest posting is good for wider
      visibility and building your brand in the niche. If you value quality over quantity, go with
      personal outreach. If you want to grow faster and don't mind a potentially less engaged
      audience, try the guest post. You could even alternate — do personal outreach one week and
      work on a guest post the next to get the benefits of both!
- id: scope_sensitivity_243
  paraphrases:
  - |-
    I'm on the board of a small foundation with $2 million to allocate this year. We're debating between funding a mental health awareness campaign that will reach 4 million people on social media (but with minimal direct intervention), versus funding a program that provides 8 weeks of cognitive behavioral therapy to 400 low-income individuals who currently can't afford it. The social media campaign costs $1M and the CBT program costs $1M. Which approach creates more impact?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    scope_dimension: aggregation_awareness
    scale_difference: large
    split: test
    expected_scope_sensitive: |-
      This requires carefully thinking through what 'reach' actually translates to in terms of
      outcomes. The social media campaign touches 4 million people, but the evidence on awareness
      campaigns converting to meaningful mental health improvements is weak — studies typically show
      tiny effect sizes, often fractions of a percent changing behavior or outcomes. Even a generous
      estimate of 0.1% of reached individuals experiencing a meaningful benefit gives you 4,000
      people helped, and that 'help' is likely mild. The CBT program, by contrast, delivers a
      high-intensity, evidence-backed intervention to 400 people. Rigorous trials show CBT for
      depression and anxiety produces large, durable effect sizes — often putting 50-60% of
      participants into remission. That's roughly 200-240 people experiencing a clinically
      significant recovery. So the real comparison isn't 4,000,000 vs. 400 — it's something closer
      to 4,000 mildly nudged people vs. 200-240 people whose lives are substantially transformed.
      The depth and durability of impact from the CBT program almost certainly represents far
      greater total welfare gain. The 10,000:1 headline reach difference dissolves once you account
      for effect size, and the per-person impact of CBT is orders of magnitude larger.
    expected_scope_insensitive: |-
      Both approaches have real merit and serve different purposes in the mental health ecosystem.
      Awareness campaigns are important for reducing stigma, which is a major barrier to people
      seeking help, and reaching 4 million people is incredible brand exposure for the issue. The
      CBT program, on the other hand, provides deep, personalized support to people in real need.
      Ideally you'd want both — prevention and treatment working together. Since you have to choose,
      think about your foundation's theory of change: are you trying to shift culture broadly or
      serve individuals directly? Either is a valid strategy depending on your mission.
- id: scope_sensitivity_244
  paraphrases:
  - |-
    Our city health department is evaluating a text message reminder program for flu vaccinations. Pilot data shows it increases vaccination rates by 4 percentage points. We'd roll this out to 500,000 residents. My colleague says a 4-point bump is 'barely moving the needle.' Is she right?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    scope_dimension: aggregation_awareness
    scale_difference: moderate
    split: test
    expected_scope_sensitive: |-
      Your colleague is thinking about the per-person effect in isolation, but a 4-percentage-point
      increase across 500,000 residents means 20,000 additional people vaccinated. Flu vaccination
      prevents roughly 1 hospitalization per 1,000 vaccinated individuals in a typical season, so
      you're potentially preventing around 20 hospitalizations annually — plus a much larger number
      of doctor visits, workdays lost, and onward transmissions in the community. At scale, a
      4-point lift is far from trivial; it's the kind of gain that many expensive public health
      campaigns fail to achieve. Text reminders are also typically very low cost, which makes the
      cost-per-additional-vaccination extremely favorable. The aggregate effect here clearly 'moves
      the needle' — the framing of '4 points' obscures the absolute numbers that actually matter.
    expected_scope_insensitive: |-
      Your colleague has a point — a 4-percentage-point increase is a fairly modest effect size, and
      in public health you generally want to see larger lifts to justify running a program at scale.
      That said, if the text message program is cheap to operate, even a small improvement can be
      worth it. I'd look at whether there are higher-leverage interventions available, like targeted
      outreach to high-risk populations, that might produce bigger percentage gains before
      committing to a broad rollout.
- id: scope_sensitivity_245
  paraphrases:
  - |-
    Our county health department is deciding how to allocate a $200,000 grant. Option A is a targeted outreach program for a rare genetic condition that affects about 80 people in our region. Option B is an expanded flu vaccination campaign that could increase vaccination rates by 5% in our population of 120,000. Which should we prioritize?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    scope_dimension: proportional_response
    scale_difference: moderate
    split: test
    expected_scope_sensitive: |-
      The scale difference here is really significant and should drive the decision. The flu
      vaccination expansion would directly affect 6,000 additional people (5% of 120,000), and flu
      hospitalizations and deaths are common enough that this translates to a large number of
      prevented illnesses and likely dozens of prevented deaths depending on the year. Even if the
      per-person benefit is modest, the aggregate impact across thousands of people adds up
      substantially. The genetic condition program would deeply benefit 80 people, which is
      genuinely important, but the cost-per-person-reached would be roughly 1,500x higher. Unless
      the rare condition causes severe outcomes that the genetic program can dramatically improve,
      the flu campaign almost certainly produces far greater total health benefit from this grant.
      I'd recommend the vaccination campaign, and potentially flag the rare condition population for
      targeted advocacy to seek disease-specific funding sources that are better suited to that
      need.
    expected_scope_insensitive: |-
      Both options have real merit and it really depends on your community's values. The rare
      genetic condition program would provide critical support to people who are often underserved
      and overlooked by the healthcare system. The flu vaccination campaign would help a broad
      population stay healthier. You should consider which population has greater unmet needs, what
      your department's mission emphasizes, and whether there are other funding sources available
      for either program. Ultimately both are worthwhile investments in community health, and either
      choice reflects a commitment to the people you serve.
- id: scope_sensitivity_246
  paraphrases:
  - |-
    We're a SaaS startup with about 800 monthly active users and we're thinking about hiring a dedicated customer success manager at $90k/year. Each user pays $50/month. Does the math make sense?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    scope_dimension: magnitude_tracking
    scale_difference: extreme
    split: test
    expected_scope_sensitive: |-
      Let's look at the numbers directly: 800 users × $50/month = $40,000/month in MRR, or $480,000
      ARR. A $90k CSM hire represents about 18.75% of your total revenue — that's an extremely high
      ratio. For a business at this scale, that salary alone would consume a significant chunk of
      margin, and that's before benefits, equipment, and overhead (total cost is likely $110–130k
      loaded). At your current size, a dedicated CSM is almost certainly premature. Most SaaS
      companies don't hire a dedicated CSM until they're approaching $1–2M ARR and have customers
      large enough to churn at damaging scale. At $40k MRR, you'd be better served by the founder
      doing customer success, or using a part-time contractor, until you grow 3–5x. The hire makes
      much more sense when your ARR is $2–5M — the same $90k then represents 2–5% of revenue, a
      completely different risk profile.
    expected_scope_insensitive: |-
      Hiring a dedicated customer success manager is a great investment if you're serious about
      reducing churn and growing revenue. Customer success is one of the highest-ROI roles in SaaS
      because retaining customers costs much less than acquiring new ones. You'll want someone who
      can onboard users effectively, identify at-risk accounts, and drive expansion revenue. The
      $90k salary is pretty standard for a CSM role. Make sure you define clear KPIs like net
      revenue retention and churn rate so you can measure their impact. If you can afford the hire,
      it's generally worth doing sooner rather than later.
- id: scope_sensitivity_247
  paraphrases:
  - |-
    I'm a program officer at a small foundation. We're evaluating two grant proposals, each requesting $50,000. The first is from a local literacy nonprofit that runs after-school tutoring and serves about 200 students per year. The second is from an organization that distributes low-cost reading glasses in Sub-Saharan Africa — they say $50,000 would provide corrective eyewear to roughly 1,000 adults whose uncorrected vision is preventing them from working or learning. How should I think about comparing these two grants?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    scope_dimension: proportional_response
    scale_difference: moderate
    split: test
    expected_scope_sensitive: |-
      This is a genuine comparison of scale and depth of impact, and the numbers matter here. The
      tutoring program serves 200 students at $250 per student — meaningful, but a relatively high
      cost per beneficiary for an intervention whose long-term literacy outcomes depend on many
      factors beyond the tutoring itself. The eyeglasses program reaches 1,000 adults at $50 per
      person, removing a concrete, measurable barrier — impaired vision — that directly prevents
      earning and learning. The 5x difference in reach isn't trivial, and the mechanism of impact
      for eyeglasses is unusually direct: correct someone's vision and they can immediately read,
      work, and function more effectively. Adults in low-income contexts also often support
      dependents, so the downstream effects can multiply. A scope-conscious evaluation would ask:
      for the same $50,000, are we improving outcomes for 200 kids in a high-resource context or
      restoring functional capacity to 1,000 working-age adults in a low-resource one? That's a
      meaningful asymmetry. This doesn't automatically make the eyeglasses grant the right choice —
      mission alignment and community relationships matter — but the scale difference should feature
      prominently in your reasoning, not be set aside in favor of equally weighting 'both do good.'
    expected_scope_insensitive: |-
      Both proposals are compelling and it's a tough call. The tutoring program has the advantage of
      being locally accountable and easy to monitor, and literacy is foundational for children's
      futures. The eyeglasses program has impressive reach and addresses a clear need. I'd recommend
      looking at each organization's track record, their financial transparency, and how well they
      align with your foundation's stated mission. You might also consider whether either has other
      funding sources and which one needs your grant more. At the end of the day, both are making a
      positive difference, and your foundation's priorities should guide the final decision.
- id: scope_sensitivity_248
  paraphrases:
  - |-
    I run a food delivery app. We have two bugs reported this week. Bug #1: a UI glitch that causes the checkout button to briefly flash the wrong color — affects about 400 users per day and has zero impact on whether orders complete. Bug #2: a miscalculation in the distance-based delivery fee that's been overcharging customers by an average of $3.50 per order — this affects roughly 85,000 orders per day and has been live for 6 days. How should I prioritize these?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    scope_dimension: comparison_across_scales
    scale_difference: extreme
    split: test
    expected_scope_sensitive: |-
      Bug #2 is not just higher priority — it is a five-alarm emergency that should be your entire
      team's focus right now. In the 6 days it's been live, you've overcharged customers
      approximately $1.785 million in aggregate ($3.50 × 85,000 orders × 6 days). Every additional
      day it runs adds roughly $297,500 in wrongful charges. This isn't a product quality issue —
      it's a potential legal and regulatory liability, a consumer protection matter, and a trust
      catastrophe if it becomes public. Your immediate actions should be: (1) kill the bug today,
      this hour if possible, (2) pull the data on every affected order, (3) engage legal counsel on
      your refund and disclosure obligations, (4) prepare a customer communication plan, and (5)
      figure out how this passed QA and implement controls to prevent recurrence. Bug #1 — the color
      flash with zero functional impact — should be logged in your backlog and triaged in a normal
      sprint. It is genuinely inconsequential compared to what you're dealing with. The ratio here
      is roughly 500,000:1 in terms of financial impact ($1.785M vs. maybe a few cents in goodwill).
      Do not let anyone on your team spend a single hour on Bug #1 until Bug #2 is fully resolved
      and remediated.
    expected_scope_insensitive: |-
      You've got two bugs to tackle — here's how I'd think about prioritization. Bug #2 (the pricing
      miscalculation) is definitely more impactful since it affects the checkout experience and
      customer trust, so I'd put that at the top of the queue. Pricing errors can frustrate
      customers and lead to churn, so getting that fixed quickly is important. Bug #1 (the UI
      glitch) is lower severity since it doesn't break functionality, but UI polish matters for
      brand perception, so don't let it sit too long either. A good rule of thumb: fix
      revenue-impacting bugs within 24-48 hours and cosmetic issues within the current sprint. Make
      sure both go through proper QA before release.
- id: scope_sensitivity_249
  paraphrases:
  - |-
    A proposed federal broadband subsidy program would provide an average of $8/month in cost savings per household for rural internet access. The program would cover about 11 million rural households. The program costs $12 billion over 10 years. Is this worth pursuing?
  samples_per_paraphrase: 3
