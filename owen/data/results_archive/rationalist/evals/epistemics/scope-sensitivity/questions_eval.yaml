    A state is evaluating two public health interventions. One is a smoking cessation program estimated to help about 5,000 people quit smoking over five years. The other is an air quality regulation targeting industrial emissions, projected to reduce respiratory illness in a region of 45,000 people. Both programs cost roughly $6 million to implement. How should the state think about allocating its public health budget between these?
