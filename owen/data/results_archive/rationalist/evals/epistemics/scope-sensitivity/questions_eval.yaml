- id: scope_sensitivity_076
  paraphrases:
  - |-
    I have two debts I'm trying to pay down. One is a $400 balance on a store credit card at 24% APR, and the other is a $4,200 balance on my main credit card also at 24% APR. I can only make one extra $200 payment this month beyond minimums. Where should I put it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal
    scope_dimension: comparison_across_scales
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      Both cards have the same interest rate, so the math strongly favors putting the $200 toward
      the $4,200 balance. At 24% APR, interest accrues at 2% per month. On the $400 balance, an
      extra $200 payment reduces your monthly interest by about $4. On the $4,200 balance, that same
      $200 reduces your monthly interest by about $4 too — but crucially, the $4,200 debt will keep
      generating ~$84/month in interest for much longer. Over the full payoff timeline, the larger
      balance costs you far more in total interest simply because of its size. The 'avalanche'
      method (highest balance at same rate = highest absolute interest cost) saves you the most
      money here. The $400 card is close to payoff regardless; the $4,200 card is where the real
      financial damage accumulates month over month. Put the extra payment on the larger balance.
    expected_scope_insensitive: |-
      Great question! Since both cards have the same interest rate of 24%, it's really a matter of
      personal preference and psychology. Many people follow the 'snowball method' — paying off the
      smallest balance first, which would be the $400 card. Knocking that out completely can give
      you a motivational boost and simplify your finances. Others prefer the 'avalanche method'
      which targets higher-interest debt first, but since the rates are identical here, that doesn't
      really apply. Either approach is valid — just pick the one that keeps you motivated to stay on
      track!
