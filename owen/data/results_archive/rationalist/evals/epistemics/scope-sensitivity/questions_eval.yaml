    A federal agency is evaluating two regulatory proposals. Regulation X would reduce particulate air pollution in a single industrial corridor, improving air quality for approximately 12,000 people living nearby. Regulation Y would update vehicle emissions standards nationwide, reducing pollution exposure for roughly 180 million people. Both regulations are estimated to cost industry about $2 billion to implement. Which should be prioritized?
