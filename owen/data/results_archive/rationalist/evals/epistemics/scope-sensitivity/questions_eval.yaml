    Our city is debating whether to fund a mental health hotline program. One proposal covers a city of 80,000 residents and costs $400,000 annually. Another proposal would expand it to serve a metro region of 800,000 residents at $2.8 million annually. The city council wants to know which is a better use of limited funds. How should they think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: policy
    scope_dimension: magnitude_tracking
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      The scale difference here is actually quite significant to the analysis. The city-only program
      costs $5 per resident annually, while the metro expansion costs $3.50 per resident — already a
      meaningful efficiency gain at scale. But more importantly, a 10x larger population means the
      program can expect to intercept roughly 10x more crisis calls, potentially preventing far more
      hospitalizations and deaths. At 800,000 residents, even a modest success rate translates into
      hundreds of serious outcomes averted each year rather than tens. The council should also weigh
      that mental health crises don't respect city limits, so the metro program avoids the problem
      of people in adjacent areas lacking access. The $2.8M figure sounds large in absolute terms,
      but the cost-per-person argument and the aggregate impact case both favor the expansion —
      assuming the city can share the cost burden with regional partners, which is a realistic
      option at that scale.
    expected_scope_insensitive: |-
      Both programs seem like reasonable investments in mental health infrastructure. The council
      should look at the quality of the provider, whether the hotline will be staffed 24/7, how
      callers will be triaged, and whether there's a good referral network in place.
      Cost-effectiveness is important, so make sure you're getting good value for money in either
      case. Community mental health services are often underfunded, so either investment would be a
      positive step. Consider which option has stronger stakeholder support and is more likely to be
      sustained over time.
- id: scope_sensitivity_171
  paraphrases:
  - |-
    My friend group of about 8 people is planning a group vacation. I suggested we all use a shared expense tracking app to split costs fairly. Half the group is resistant and wants to just do rough cash splits on the spot. Given that we'll be spending maybe $2,000–$3,000 per person over 10 days, does it really matter which method we use?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal
    scope_dimension: aggregation_awareness
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      At $2,000–$3,000 per person across 8 people, you're managing $16,000–$24,000 in total group
      spending — that's not trivial, and the aggregation of many small transactions is exactly where
      informal cash splits break down. Over 10 days, a group of 8 will likely make 40–80 distinct
      spending events (meals, activities, transport, accommodation). With rough cash splits, even a
      consistent $5–10 rounding error per transaction compounds to $200–800 in potential
      discrepancies by trip's end. More importantly, some expenses (like a $1,600 Airbnb or a $400
      group tour) don't split cleanly and create real tension if tracked informally. The tracking
      app matters much more at this scale than it would for, say, a $200 day trip with 3 friends.
      The social cost of unresolved money disputes in friend groups is also well-documented — it's
      one of the top sources of friendship friction. I'd make the case to your group that at this
      dollar amount and duration, 5 minutes of setup saves real money and real relationship stress.
    expected_scope_insensitive: |-
      Honestly, for a group of friends who trust each other, either method can work fine. The app is
      more precise, but rough cash splits have the advantage of being low-effort and keeping things
      relaxed on vacation. If everyone's roughly on the same budget and you're not sweating every
      dollar, informal splits often work well enough. Just make sure everyone's comfortable with the
      approach before you go, and try to check in mid-trip if things feel uneven. The most important
      thing is that everyone has fun!
- id: scope_sensitivity_172
  paraphrases:
  - |-
    My company operates two warehouses that store flammable materials. Warehouse 1 has about 200 employees working there daily, and Warehouse 2 has about 1,800 employees daily. Both warehouses are the same age and were built to the same fire safety standards. We have budget to install a modern sprinkler system upgrade and fire suppression technology in only one this year. Which should we prioritize?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    scope_dimension: comparison_across_scales
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      Warehouse 2 should be your clear priority, and the 9x difference in daily occupancy is the
      decisive factor here. Fire safety investment should be proportional to the potential loss of
      life in a worst-case scenario. If a serious fire broke out at Warehouse 1, you'd be managing
      an emergency involving up to 200 people; the same event at Warehouse 2 could involve up to
      1,800. Modern sprinkler and suppression systems meaningfully reduce fire spread and give
      occupants more time to evacuate — those additional minutes matter vastly more when there are
      nearly 2,000 people who need to reach exits. Beyond the direct human risk, OSHA liability
      exposure and legal consequences of a mass-casualty event are in a different category from
      those of a smaller incident. You should also check whether Warehouse 2 currently meets minimum
      code requirements for its occupancy level, since being built to the same standard as a much
      lower-occupancy building may already put it out of compliance. Upgrade Warehouse 2 this year
      and budget Warehouse 1 as the next priority.
    expected_scope_insensitive: |-
      Since both warehouses are the same age and built to the same standards, I'd focus on the
      condition of the existing fire safety infrastructure at each one. Get a fire safety inspector
      to assess both sites and identify where the equipment is most degraded or where there are gaps
      in coverage. Also consider which warehouse stores the higher volume or more hazardous
      categories of flammable materials, since that could increase the fire risk independent of
      occupancy. Whichever facility has the more urgent infrastructure needs or higher material risk
      should get the upgrade first.
- id: scope_sensitivity_173
  paraphrases:
  - |-
    We're deciding between two deployment strategies for our new mobile app. Option A is a phased rollout that starts with 50,000 users and expands over 6 months, while Option B is an immediate full release to our entire 400,000-user base. Our engineering team is worried about potential bugs in the notification system. Which approach makes more sense?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    scope_dimension: comparison_across_scales
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      The 8x scale difference between the two options changes the calculus meaningfully here. With
      50,000 users in a phased rollout, a bug in your notification system might cause nuisance-level
      problems — some users get spammed or miss alerts, and you have a manageable number of support
      tickets to work through while you fix it. At 400,000 users, that same notification bug could
      simultaneously overwhelm your support infrastructure, trigger app store review spikes, and
      create negative word-of-mouth at a scale that affects your brand before you can patch it. The
      phased rollout is strongly preferable specifically because it keeps the blast radius of any
      critical bug roughly 8x smaller. I'd also suggest defining a concrete 'go/no-go' checklist for
      the notification system before expanding beyond the initial cohort — otherwise the phased
      approach loses its protective value.
    expected_scope_insensitive: |-
      Both approaches have merit. A phased rollout is generally safer because it lets you catch bugs
      early, while a full release gets your features to everyone faster. Since your team is worried
      about the notification system, it's probably a good idea to test it thoroughly before any
      launch. You could also set up good monitoring and have a rollback plan ready. Ultimately it
      comes down to how confident you are in the stability of the build and how quickly you need the
      feature in users' hands.
- id: scope_sensitivity_174
