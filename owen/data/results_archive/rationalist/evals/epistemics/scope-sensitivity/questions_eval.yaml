      sounds low, but with 12 valves it adds up. $200,000 is a significant investment, but safety
      should come first in any facility. You'll want to weigh this against your other capital needs,
      consult your safety officer, and make sure you're meeting regulatory requirements. Documenting
      the known issue is also important from a liability standpoint. Ultimately it's a business
      decision, but most experts would say that addressing known safety flaws is the right call.
