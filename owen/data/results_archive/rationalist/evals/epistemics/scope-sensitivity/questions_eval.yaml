      calculation — 0.25 probability × near-certain severe injury or death × multiple riders — makes
      this an unambiguous closure decision. The revenue loss over 5 days does not come close to
      justifying a roughly 25% probability of a fatal accident. Close the ride immediately, notify
      your legal team and your insurance carrier, review whether prior cycles require incident
