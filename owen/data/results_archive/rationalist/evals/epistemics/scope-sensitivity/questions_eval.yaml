    Our city is considering two infrastructure proposals for next year's budget. Option A would repair sidewalks in a high-foot-traffic downtown corridor used by about 8,000 people daily. Option B would upgrade the water filtration system serving roughly 70,000 residents. Both projects cost $4 million. Which should the city prioritize?
