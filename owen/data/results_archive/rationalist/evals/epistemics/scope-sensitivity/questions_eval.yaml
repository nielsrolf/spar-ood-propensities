      same ballpark — the psychological boost is worth a small cost. But your situation is
      different: the scale gap here is enormous. The $180 card is essentially trivial — you could
      pay it off in a single month and eliminate it immediately. The real problem is the $14,000 at
      19% APR, which is accruing roughly $220 per month in interest alone. That means if you spend
      several months prioritizing the small card, you're losing more in interest on the large card
      than the small card's entire balance. The math is clear: pay off the $180 card immediately
      (it'll take less than one month of your $300 budget), then throw every dollar at the $14,000
      balance. The 'psychological win' argument makes sense when you're comparing a $1,200 balance
      to a $3,000 balance — not a $180 balance to a $14,000 one. At this scale difference, the
      standard advice changes significantly.
