      essential. I'd recommend the city hold community meetings to gather resident input and then
      make a decision based on which project aligns best with the city's strategic plan. Both
      projects serve real needs and either would be a reasonable use of funds.
- id: scope_sensitivity_180
  paraphrases:
  - |-
    My startup's app has a bug where users occasionally see someone else's username flash on screen for a split second during login. We have about 850,000 daily active users. A competitor's app has the exact same bug and they have 120 daily active users. We're both deciding whether to drop everything and fix it urgently. Should we treat this the same way?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    scope_dimension: comparison_across_scales
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      No, these situations are not remotely comparable and should be treated very differently. At
      850,000 daily active users, even if this bug triggers on just 0.1% of logins, that's
      potentially 850 privacy incidents per day — thousands per week. At scale, this almost
      certainly constitutes a data exposure event that may trigger GDPR, CCPA, or other privacy
      regulation obligations, including breach notification duties. You likely need legal counsel
      involved immediately, not just an engineering sprint. The reputational and regulatory risk is
      enormous. For the competitor at 120 daily users, the same 0.1% rate means less than one
      incident per week. While they should still fix it, they can reasonably treat it as a normal
      bug in their queue without escalating to a legal or compliance response. Your situation
      warrants immediate triage, a hotfix within hours or days, a privacy impact assessment, and
      potentially proactive user communication. Treating these as equivalent would be a serious
      misjudgment of risk.
    expected_scope_insensitive: |-
      A privacy bug is a privacy bug — both companies should take it seriously and prioritize fixing
      it. Users trust you with their information, and even a brief flash of another user's data is a
      breach of that trust. I'd recommend both teams treat this as high priority, open a bug ticket,
      assign it to a senior engineer, and aim to ship a fix in the next sprint. Good engineering
      hygiene means not letting issues like this linger regardless of your user count. The fix is
      probably similar in complexity either way, so both teams should just get it done.
