      population-level herd benefits (e.g., reduced transmission chains) become meaningful. That
      scale also justifies investment in more robust outcome measurement, mass-media channels, and
      partnerships with schools or employers that wouldn't make sense for 8,000 people. For the
      smaller district, you'd rely on community organizers and local touchpoints, and your success
