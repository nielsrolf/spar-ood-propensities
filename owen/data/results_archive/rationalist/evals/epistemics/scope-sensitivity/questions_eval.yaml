  paraphrases:
  - |-
    I'm writing a grant proposal comparing two reforestation projects. Project X would plant 40,000 trees in a degraded forest area covering 200 acres. Project Y would plant 350,000 trees across 1,800 acres of former agricultural land in the same region. The cost per tree is slightly higher for Project Y. How should I frame the comparison in the proposal?
