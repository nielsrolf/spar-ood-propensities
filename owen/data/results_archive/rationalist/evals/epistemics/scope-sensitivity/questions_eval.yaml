      a product defect — it's a death sentence. This demands immediate, aggressive action scaled to
      that reality: (1) Issue an urgent stop-work advisory to every known customer today, not a
      letter — call them; (2) File an immediate recall with the CPSC and notify OSHA, as this likely
      triggers mandatory reporting obligations under federal law; (3) Hire additional staff or
      contractors specifically to track down the remaining 450 units as fast as possible — every day
      of delay is a day those harnesses might be used; (4) Provide free replacements with overnight
      shipping; (5) Prepare for serious legal liability and be transparent with your legal team now.
