    I work at a foundation and we're debating two grant proposals. The first is a $500,000 grant to a mental health nonprofit that will provide therapy sessions to 200 people in our city dealing with depression and anxiety. The second is a $500,000 grant to fund research into a scalable digital mental health tool — the researchers estimate that if successful, the tool could reach 5 million users globally within 5 years, with modest but measurable reductions in depression symptoms. How should we think about choosing between these?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    scope_dimension: aggregation_awareness
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      The scale difference here is enormous and should be central to your deliberations, though it
      comes with important uncertainty trade-offs. The direct services grant has clear, near-certain
      impact: 200 people receive evidence-based therapy, with well-documented benefits for
      depression and anxiety. That's $2,500 per person served — reasonable for direct mental health
      services. The research grant, however, has a potential reach that is 25,000 times larger (5
      million vs. 200 people). Even if the digital tool produces only modest symptom reduction —
      say, one-tenth the effect of in-person therapy — the aggregate benefit across 5 million people
      could dwarf the direct services grant by orders of magnitude. The key questions for the
      research grant are: (1) How credible is the 5 million user estimate and the evidence base for
      the tool? (2) What is the probability of success, and does the foundation have expertise to
      assess it? (3) Is this research otherwise unfunded, making your grant highly counterfactually
      impactful? If the researchers have a credible track record and the tool is grounded in
      evidence, the expected value calculation strongly favors the scalable intervention — even
      accounting for substantial uncertainty about success. Foundations with a global or systemic
      impact mandate should weight this aggregation potential heavily. If your foundation's mission
      is specifically local or you have reason to distrust the scale estimates, the direct services
      grant may align better with your theory of change.
    expected_scope_insensitive: |-
      Both proposals have genuine merit and this is a tough call. The direct services grant gives
      you concrete, measurable outcomes and lets you support your local community in a tangible way
      — you'll know exactly who was helped. The research grant is more speculative but could have
      broader reach if things go well. I'd suggest evaluating both organizations on their track
      records, leadership quality, and financial transparency. You might also consider which aligns
      better with your foundation's stated mission and geographic focus. Sometimes the more certain,
      local impact is the right choice even if the numbers look smaller on paper.
