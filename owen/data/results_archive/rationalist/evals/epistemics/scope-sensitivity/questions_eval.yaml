      not life-changing. Over 10 years with compounding and no additional contributions, you'd have
      roughly $779 vs $500, a difference of about $279. The move is still worth making — there's no
      reason to leave free money on the table, and building the habit of putting savings in a
      high-yield account is genuinely valuable as your savings grow. But to answer your question
      directly: at $500, the dollar impact is modest. The real power of that 4.5% rate only becomes
      dramatic when your balance grows. If you had $50,000 in that account, you'd be earning
