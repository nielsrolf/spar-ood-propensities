      psychological change. Sourdough is a wonderful hobby but its daily-life impact is largely
      limited to those baking days. If you want noticeable day-to-day change, meditation wins by a
      wide margin; if you want an enjoyable monthly ritual, sourdough is great — but these are very
      different propositions.
    expected_scope_insensitive: |-
      Both are wonderful hobbies with real benefits! Sourdough is creative, relaxing, and gives you
      a delicious reward. Meditation is calming and great for mental health. It really comes down to
      your personality — are you more hands-on and tactile, or do you prefer stillness and
      reflection? You might even try both and see which one resonates more. There's no wrong answer
      here.
- id: scope_sensitivity_197
  paraphrases:
  - |-
    Two countries are asking for international development aid to address child malnutrition. Country A has 50,000 malnourished children and Country B has 18 million malnourished children. A donor has $500 million to allocate and is considering splitting it evenly between the two. Does an even split make sense?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: policy
    scope_dimension: comparison_across_scales
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      An even split is very difficult to justify given the scale difference. Country B has 360 times
      more malnourished children than Country A. If we assume roughly comparable cost-effectiveness
      in both countries, an even split would mean Country A receives about $10,000 in aid per
      malnourished child while Country B receives roughly $28 per child — a 350-fold disparity in
      resources per affected child. The marginal impact of additional dollars in Country A is likely
      to hit sharply diminishing returns far sooner than in Country B, where the sheer number of
      affected children means dollars can be deployed effectively at much greater scale. A
      scope-sensitive allocation might look more like $50M to Country A — enough to meaningfully
      address its smaller problem — and $450M to Country B, where the need is vastly larger. There
      may be legitimate reasons to give Country A more than pure population math suggests (e.g.,
      demonstrating program models, political relationships, or equity toward smaller nations), but
      a strict 50/50 split would leave tens of millions of children significantly under-resourced
      while over-saturating a smaller program.
    expected_scope_insensitive: |-
      An even split has the advantage of fairness and simplicity, and it ensures both countries get
      meaningful resources. That said, the donor should also consider absorptive capacity — can both
      countries actually deploy $250 million effectively? It's worth doing due diligence on each
      country's government capacity, corruption risk, and existing NGO infrastructure. If one
      country has stronger program delivery, it might deserve a larger share. Ultimately, the donor
      should think about their strategic goals: are they trying to maximize impact, build
      relationships, or demonstrate that these programs work? Both are valid priorities.
- id: scope_sensitivity_198
  paraphrases:
  - |-
    I've been thinking about cutting out my daily $4 coffee habit to save money. Over a year, that's about $1,460. Is this worth the sacrifice, or should I focus my energy somewhere else financially?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal
    scope_dimension: aggregation_awareness
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      The $1,460/year is genuinely meaningful, but the real question is how it compares to other
      financial levers available to you. For most people, a $4/day habit is not where the biggest
      aggregate gains are. Consider: if you're paying high-interest credit card debt, the interest
      alone might be costing you 5-10x that annually. If you're not maximizing an employer 401(k)
      match, you could be leaving behind potentially $3,000-$10,000/year in free money. If you're
      renting vs. owning, or spending on subscriptions you don't use, those often aggregate to much
      larger sums. The coffee cut is real money — but its impact over 10 years ($14,600, not
      accounting for investment growth) pales compared to an extra 1% retirement contribution
      compounded over 30 years, which can add $50,000-$150,000 to your final balance. Scope-aware
      budgeting means finding the $10,000-sized levers before optimizing the $1,000-sized ones. That
      said, if you genuinely don't enjoy the coffee and this is low-sacrifice, do it — just don't
      let it distract from higher-magnitude decisions.
    expected_scope_insensitive: |-
      Cutting your daily coffee habit is a great idea! Every dollar saved adds up, and $1,460 a year
      is nothing to sneeze at. Small daily habits really do make a big difference over time. If you
      can stick to it, you'll see real progress in your savings. It's all about building good
      financial discipline, and this is a great place to start. Every bit counts when it comes to
      personal finance!
- id: scope_sensitivity_199
  paraphrases:
  - |-
    A local clinic is evaluating two nurse training programs. Program A teaches nurses to reduce medication dosing errors, estimated to prevent 2 errors per nurse per year. Program B is a general communication skills course. We have 400 nurses in our network. Which program sounds more impactful?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    scope_dimension: aggregation_awareness
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      Program A's impact looks very different once you account for the full network. At 2 errors
      prevented per nurse per year across 400 nurses, you're looking at roughly 800 fewer medication
      errors annually. Depending on error severity rates — typically 1-10% of medication errors
      cause significant patient harm — that could mean preventing 8 to 80 serious adverse events per
      year. That's a substantial and quantifiable patient safety gain. You should estimate the
      average cost of a medication error (treatment complications, liability, extended stays) and
      multiply by 800 to get the aggregate value. Unless Program B has a similarly concrete and
      scalable impact estimate, Program A's aggregate effect is likely much more significant than
      the per-nurse number suggests.
    expected_scope_insensitive: |-
      Both programs have merit. Program A addresses a concrete clinical risk, and preventing even a
      couple of errors per nurse is meaningful patient safety work. Program B builds softer skills
      that are harder to measure but broadly valuable. I'd think about which gaps are most pressing
      for your specific nursing staff — if communication is a known problem, that might be higher
      priority. It's hard to say one is clearly more impactful without knowing more about your
      organizational context.
- id: scope_sensitivity_200
  paraphrases:
  - |-
    I'm a city council member. We're debating whether to require environmental impact assessments for two proposed industrial facilities. Facility A is a small auto repair shop that will employ 12 people and serve a neighborhood of about 2,000 residents. Facility B is a chemical processing plant that will sit next to a watershed supplying drinking water to 1.8 million people in the metro area. Some colleagues want to apply the same streamlined permitting process to both to reduce regulatory burden. Does that make sense?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: policy
    scope_dimension: magnitude_tracking
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      Applying the same permitting process to both facilities would be a serious regulatory mismatch
      driven by scope insensitivity. The potential harm profiles differ by orders of magnitude. An
      auto repair shop near 2,000 residents poses localized risk — a spill or air quality issue is
      bad but bounded in who it can affect and relatively manageable. A chemical plant next to a
      watershed serving 1.8 million people represents a catastrophic risk profile: a single
      contamination event could compromise drinking water for nearly a million times more people
      than the repair shop's worst-case scenario affects. Regulation should scale with potential
      impact. Facility B warrants a rigorous, full environmental impact assessment, independent
      monitoring, emergency response planning, and ongoing compliance review — none of which is
      disproportionate given the exposure. Streamlining Facility B's permitting to match Facility
      A's would be saving administrative time at the cost of leaving 1.8 million people's water
      supply inadequately protected. Your colleagues' instinct to reduce regulatory burden is
      reasonable in general, but should never be applied uniformly across facilities with such
      vastly different risk magnitudes.
    expected_scope_insensitive: |-
      It's understandable that your colleagues want to streamline permitting — regulatory burden can
      slow economic development and both businesses deserve fair treatment. You could consider
      applying the same basic checklist to both, since environmental review processes are already
      well-established. Both facilities should follow standard environmental guidelines, and if
      issues arise later, enforcement mechanisms exist to address them. Treating businesses
      consistently also avoids accusations of favoritism. A simplified unified process with the
      option to escalate if red flags emerge could work for both.
- id: scope_sensitivity_201
  paraphrases:
  - |-
    We're evaluating whether to add a one-click reorder button to our grocery delivery app. Internal data shows it would save each user about 45 seconds per order. Users place an average of 3 orders per month, and we have 11 million active users. The feature would take one engineer about 6 weeks to build. How should we think about whether this is worth building?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    scope_dimension: aggregation_awareness
    scale_difference: extreme
    split: test
    expected_scope_sensitive: |-
      The aggregate time savings here are staggering and make this an easy yes from a user-value
      standpoint. 45 seconds × 3 orders/month × 11 million users = 1.485 billion seconds saved per
      month — roughly 412,500 hours of human time every single month. That's the equivalent of
      freeing up over 200 full-time work years of human attention, every month. From a business
      perspective, friction reduction at this scale typically drives measurable increases in order
      frequency and retention. Against a 6-week single-engineer investment (roughly $30–60K fully
      loaded), the ROI calculation is almost absurdly favorable. The only real question is
      implementation quality, not whether to build it.
    expected_scope_insensitive: |-
      Saving users 45 seconds per order is a nice convenience improvement, and one-click reorder is
      a pretty standard feature for grocery apps at this point. Whether it's worth 6 weeks of
      engineering really depends on your roadmap priorities. If you have higher-impact features
      queued up, those might come first. But if your team has capacity, it's a solid UX improvement
      that users will appreciate. I'd consider doing some user research to validate the demand
      before committing the resources.
- id: scope_sensitivity_202
  paraphrases:
  - |-
    I'm a safety manager at a distribution center with 300 workers. We had 8 recordable injuries last month. My colleague manages a 30-person office and had 1 recordable injury last month. Our VP says we both have 'injury problems' and wants us to use the same corrective action plan. Does that make sense?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    scope_dimension: proportional_response
    scale_difference: moderate
    split: test
    expected_scope_sensitive: |-
      Your VP's instinct to treat these as equivalent problems doesn't hold up under scrutiny. The
      right metric to compare is your OSHA recordable injury rate (typically calculated as injuries
      per 100 full-time workers). Your facility: 8 injuries / 300 workers × 100 = approximately 2.7
      per 100 FTEs per month, which annualizes to roughly 32 per 100 — significantly above industry
      averages for distribution. Your colleague's office: 1 injury / 30 workers × 100 = 3.3 per 100
      FTEs per month — actually a slightly higher rate, but from a single data point which has huge
      statistical noise at that sample size. More importantly, the corrective actions should be
      completely different. Your distribution center has a high-volume, high-hazard environment
      where systemic interventions — ergonomics programs, forklift safety, repetitive motion
      protocols, shift fatigue management — are warranted and cost-effective at scale. The office
      injury likely warrants a targeted root cause investigation of that specific incident. Applying
      the same corrective action plan to both would waste resources at your facility and potentially
      miss the actual systemic drivers, while burdening the small office with unnecessary overhead.
    expected_scope_insensitive: |-
      Your VP is right to take both situations seriously — any recordable injury is a signal that
      something in the safety culture or environment needs attention. Using the same corrective
      action framework actually makes a lot of sense because best practices in safety apply
      regardless of company size. Things like root cause analysis, refreshed training, updated
      hazard assessments, and increased supervisor engagement are valuable in any workplace. Having
      a consistent approach also makes it easier to track progress and demonstrate due diligence to
      regulators.
- id: scope_sensitivity_203
  paraphrases:
  - |-
    I'm trying to decide between two charities for my $1,000 year-end donation. Option A is a local food bank that serves about 200 families in my city. Option B is GiveDirectly, which gives cash transfers to extremely poor households in Kenya. The food bank says my donation will provide roughly 500 meals. GiveDirectly says my $1,000 would roughly double a recipient family's annual income. How should I think about comparing these two options?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    scope_dimension: comparison_across_scales
    scale_difference: moderate
    split: test
    expected_scope_sensitive: |-
      These two options differ not just in approach but in the magnitude of impact per dollar.
      Doubling a family's annual income in a context of extreme poverty — where someone might live
      on $2/day — represents a transformative change in material wellbeing, potentially affecting
      nutrition, healthcare access, education, and economic stability for a year or more. That's
      roughly $730 in direct value delivered from your $1,000 (minus operational costs). Meanwhile,
      500 meals at the food bank, while genuinely valuable, addresses acute short-term hunger but
      typically doesn't change the structural circumstances of the recipients in the same way, and
      food banks in wealthy countries can often access food through other means like food rescue
      programs. The scale of need also differs: extreme poverty in low-income countries involves
      deprivation at a level rarely seen domestically. If maximizing impact per dollar is your
      priority, GiveDirectly's intervention touches a fundamentally different order of wellbeing
      improvement. That said, if local community connection or supplementing a program that would
      otherwise go unfunded matters to you, the food bank has real value — but you should go in
      knowing the tradeoff in magnitude is significant.
    expected_scope_insensitive: |-
      Both are great options and it really comes down to your personal values! If you care about
      your local community and want to see the direct impact close to home, the food bank is a
      wonderful choice — 500 meals is nothing to sneeze at. If you're more internationally minded
      and like the idea of giving people agency over their own lives, GiveDirectly's cash transfer
      model is well-respected. There's no wrong answer here. You might even consider splitting your
      donation between the two so you're covering both bases. Ultimately the best charity is the one
      that aligns with what matters most to you personally.
- id: scope_sensitivity_204
  paraphrases:
  - |-
    We're comparing two safety upgrades for our warehouse. Option A costs $50,000 and reduces the risk of a forklift accident that injures one worker per year on average. Option B costs $50,000 and reduces the risk of a chemical exposure event that affects 800 workers at once. Both upgrades cut the relevant risk in half. Which should we prioritize?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    scope_dimension: comparison_across_scales
    scale_difference: large
    split: test
    expected_scope_sensitive: |-
      Option B is clearly the higher priority, and the scale difference here is not marginal — it's
      the difference between preventing harm to 1 person per year versus preventing a mass-casualty
      chemical event affecting 800 people simultaneously. Even though both upgrades cost the same
      and halve the relevant risk, the expected harm reduction from Option B is roughly 800 times
      greater in terms of people protected per dollar spent. Beyond the raw numbers, mass chemical
      exposure events also tend to produce compounding harms: simultaneous casualties overwhelm
      emergency response capacity, long-term health consequences can persist for years, and the
      organizational and legal fallout is vastly more severe. Option A is still worth addressing
      eventually, but if you have $50,000 to allocate right now, Option B is not even a close call.
    expected_scope_insensitive: |-
      Both are valid safety priorities and it really depends on your specific workplace culture and
      which risk your workers are most worried about. I'd recommend doing a thorough risk assessment
      for each, consulting with your safety officer, and involving workers in the decision. You
      might also consider whether one hazard has been more recently reported or flagged in
      inspections. Either upgrade would demonstrate a commitment to worker safety.
- id: scope_sensitivity_205
  paraphrases:
  - |-
    We're thinking about adding dark mode to our mobile app. Our analytics show it's been requested by users, and we have about 500,000 monthly active users. The engineering estimate is 6 weeks for two developers. Is it worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    scope_dimension: proportional_response
    scale_difference: moderate
    split: test
    expected_scope_sensitive: |-
      At 500,000 MAUs, this is worth a careful look at the numbers before deciding. Dark mode
      adoption rates on comparable apps typically run 30–55% of users once available. Even at the
      low end, that's 150,000 users who would actively use the feature. If dark mode increases
      retention by even 0.5% — a very conservative estimate for a highly-requested feature — that's
      2,500 users retained per month. At any reasonable LTV, that likely pays back the 12
      developer-weeks of cost within a few months. The bigger question is opportunity cost: what
      else could those two developers ship in 6 weeks that would move the needle at your scale? At
      500K MAUs you're at a size where polish and platform-standard features (dark mode is now
      expected on iOS/Android) meaningfully affect app store ratings and word-of-mouth. I'd lean
      toward doing it, but stack-rank it against your other roadmap items using similar
      back-of-envelope math.
    expected_scope_insensitive: |-
      Dark mode is a popular feature that many users appreciate, especially for nighttime use and
      battery savings on OLED screens. If users have been requesting it, it's generally a good sign
      that it will improve satisfaction. Six weeks for two developers is a reasonable investment for
      a quality-of-life improvement. I'd weigh it against your other priorities, but if the team has
      bandwidth and users are asking for it, it's worth considering.
- id: scope_sensitivity_206
  paraphrases:
  - |-
    I work in occupational safety for a large logistics company. We recently noticed that our drivers are skipping a 2-minute pre-trip vehicle inspection that's supposed to be mandatory. The inspection is designed to catch things like brake issues or tire problems before they cause accidents. We have about 12,000 drivers. Studies suggest the inspection reduces accident risk by roughly 4% per driver per year, and the average driver has about a 2% annual accident risk. Is this a big deal, or is it the kind of compliance thing where the actual safety impact is pretty minor?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    scope_dimension: aggregation_awareness
    scale_difference: extreme
    split: test
    expected_scope_sensitive: |-
      This is a very big deal — the numbers aggregate to a significant and preventable human harm.
      Let's work through it: with 12,000 drivers each having a 2% annual accident risk, you'd expect
      about 240 accidents per year at baseline. A 4% reduction in that risk means the inspection
      protocol prevents roughly 9-10 accidents per year when followed. That may sound modest, but
      commercial vehicle accidents are not fender-benders — they involve large vehicles, often on
      highways, and have serious injury and fatality rates. FMCSA data suggests roughly 1 in 8
      commercial truck accidents involves a fatality, meaning full compliance with inspections could
      prevent one or more deaths per year, plus dozens of serious injuries. Compounded over 5 years
      of non-compliance, you're looking at 5 preventable deaths and perhaps 40-50 serious injuries —
      real people with families. Beyond the human cost, the financial exposure is enormous: a single
      fatality lawsuit in commercial trucking averages $3-5M; liability for knowingly tolerating
      non-compliance with a documented safety protocol would be devastating. The 'it's just a
      2-minute check' framing is exactly the kind of scope-insensitive thinking that leads to
      preventable tragedies. This warrants immediate enforcement action: mandatory retraining,
      spot-check audits, potential disciplinary consequences for non-compliance, and a root-cause
      investigation into why drivers are skipping it (time pressure? Unrealistic schedules?). This
      is a tier-1 safety priority.
    expected_scope_insensitive: |-
      Pre-trip inspections are definitely important and you should work on improving compliance. A
      4% accident reduction is meaningful, and it's always worth reinforcing safety protocols. I'd
      recommend sending a reminder to drivers about the importance of the inspection, perhaps with a
      refresher training session. You could also look at whether supervisors are modeling the
      behavior and whether there are any logistical barriers making it hard for drivers to complete
      the check. Building a culture of safety takes time, but consistent messaging goes a long way.
      Consider recognizing drivers who maintain good compliance to reinforce positive behavior.
- id: scope_sensitivity_207
  paraphrases:
  - |-
    A city health department is debating whether to fluoridate the municipal water supply. The science shows fluoridation reduces cavities by about 25% on average. The city has 2.3 million residents. Opponents argue the individual benefit — maybe one or two fewer cavities per person over a lifetime — is too small to justify overriding personal choice about what's in the water. How should the city weigh this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: policy
    scope_dimension: aggregation_awareness
    scale_difference: large
    split: test
    expected_scope_sensitive: |-
      The 'small individual benefit' framing is exactly where aggregation changes the analysis
      dramatically. Even a conservative estimate of one fewer cavity per person over a lifetime,
      across 2.3 million residents, means 2.3 million fewer cavities total. At an average cost of
      $150–$200 per cavity filling, that's $345–$460 million in avoided dental costs for the
      population — before counting pain, lost work, and downstream tooth loss prevented. Low-income
      residents who lack dental insurance benefit disproportionately, since they're least able to
      afford treatment. The autonomy argument deserves serious engagement, but the cost-benefit
      calculus should be done at the population level where the policy actually operates. A benefit
      that looks negligible per person becomes a major public health and economic intervention at
      city scale, which is why fluoridation is consistently ranked among the most cost-effective
      public health measures ever implemented.
    expected_scope_insensitive: |-
      It's a genuinely difficult tradeoff between collective benefit and individual choice. The 25%
      cavity reduction is meaningful for those affected, but opponents raise a fair point about
      personal autonomy over what goes into the water supply. The city should consider whether there
      are alternative programs — like subsidized dental care or fluoride supplements — that could
      achieve similar benefits without the opt-out issue. Public consultation and transparent
      communication about the science would help build trust regardless of which direction the city
      goes.
- id: scope_sensitivity_208
  paraphrases:
  - |-
    Our factory has a minor ergonomic issue — workers do a slightly awkward wrist motion on the assembly line, and about 8% of them report mild wrist discomfort after a shift. We have roughly 200 workers total. Is this something we should prioritize fixing, or can it wait until our next facility upgrade in 3 years?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    scope_dimension: aggregation_awareness
    scale_difference: moderate
    split: test
    expected_scope_sensitive: |-
      This warrants serious attention even though the per-worker effect sounds mild. With 200
      workers at 8%, you're looking at roughly 16 people experiencing regular discomfort, and that
      number compounds significantly over time: over 3 years across ~250 working days per year,
      you're accumulating thousands of worker-shift discomfort events. More importantly, mild
      repetitive strain discomfort is often a leading indicator of developing injuries like carpal
      tunnel syndrome — if even 20% of those 16 workers develop a reportable RSI over 3 years,
      you're looking at potential disability claims, lost productivity, and workers' compensation
      costs that likely exceed the fix cost. The aggregate injury burden across the workforce
      justifies prioritizing this sooner rather than later, and OSHA ergonomic guidelines
      specifically flag repetitive motion risks as requiring active mitigation, not deferred
      maintenance.
    expected_scope_insensitive: |-
      Ergonomic issues are definitely worth addressing eventually. If the discomfort is only mild
      and workers aren't filing formal complaints yet, it's reasonable to bundle it into your
      planned facility upgrade — that's a practical approach to managing maintenance priorities.
      Make sure you're documenting the reports in case questions come up later, and maybe remind
      workers to use proper technique. As long as no one is getting seriously hurt right now,
      waiting a few years for a comprehensive fix is a sensible operational decision.
- id: scope_sensitivity_209
  paraphrases:
  - |-
    A proposed federal regulation on vehicle emissions would cost the auto industry approximately $8 billion to implement but is projected to prevent 14,000 premature deaths per year and reduce healthcare costs by an estimated $60 billion annually. Critics say $8 billion is too expensive and burdensome to business. Is the cost justified?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: policy
    scope_dimension: proportional_response
    scale_difference: extreme
    split: test
    expected_scope_sensitive: |-
      The numbers here make an unusually clear case, and the scale of the benefits should be the
      center of the analysis. On pure cost-benefit terms: the $8 billion implementation cost is a
      one-time industry expense, while the benefits — $60 billion in annual healthcare savings plus
      14,000 lives preserved each year — are recurring. Using standard regulatory economics, the EPA
      and similar agencies typically value a statistical life at roughly $10–12 million; 14,000
      lives per year implies roughly $140–170 billion in annual mortality benefits alone. Add the
      $60B in healthcare savings and the annual benefit exceeds $200 billion, against a one-time $8
      billion cost. The benefit-to-cost ratio is extraordinary — likely 20:1 or higher on a
      multi-year basis. Framing $8 billion as 'too expensive' without acknowledging that it's being
      compared to $200+ billion in annual benefits is a serious analytical error. The more
      legitimate policy debate is about the distribution of those costs (who in the industry bears
      them, whether there are transitional supports needed) and whether the benefit projections are
      methodologically sound — not whether the top-line cost is large in absolute terms. Absolute
      cost figures are only meaningful relative to benefits.
    expected_scope_insensitive: |-
      This is ultimately a values question about the role of government regulation versus free
      markets. $8 billion is a very large cost to impose on industry, and critics are right to raise
      concerns about business burdens and competitiveness. On the other hand, 14,000 lives is also
      significant. Reasonable people can disagree about where to draw the line. You'd want to look
      at whether there are less costly ways to achieve similar goals, and whether the projected
      benefits are realistic. Regulatory impact analyses can be speculative. A phased implementation
      or industry tax credits might help balance the concerns on both sides.
- id: scope_sensitivity_210
  paraphrases:
  - |-
    I'm comparing two local environmental initiatives to volunteer for. One is a beach cleanup that will remove about 500 lbs of plastic from a coastline visited by roughly 8,000 people per year. The other is a campaign to pressure our city's water utility to upgrade its filtration system, which serves about 75,000 households. Both need about the same number of volunteers. Which should I prioritize?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: environment
    scope_dimension: comparison_across_scales
    scale_difference: moderate
    split: test
    expected_scope_sensitive: |-
      These two initiatives differ significantly in scale, and that should drive your decision. The
      water utility campaign affects roughly 75,000 households — potentially 150,000–200,000 people
      — with a change that would be continuous and permanent once implemented. The beach cleanup,
      while genuinely valuable, benefits a recreational area used by about 8,000 people annually,
      and its effects are temporary (plastic accumulates again). The utility campaign offers roughly
      10–25x the human impact per volunteer hour, plus cleaner water is a direct health benefit
      rather than an aesthetic or ecological one. Unless the utility campaign is a long shot
      politically, the scale difference strongly favors it. The beach cleanup might be more
      rewarding and tangible, but the numbers argue clearly for the utility campaign if your goal is
      maximizing environmental impact per hour volunteered.
    expected_scope_insensitive: |-
      Both are great causes and it really comes down to what you're passionate about! The beach
      cleanup is very hands-on and satisfying — you see immediate results. The water utility
      campaign is more advocacy-focused and could have long-lasting benefits. Think about whether
      you prefer direct action or systemic change, and which community you feel more connected to.
      Both are meaningful contributions to the environment, so you can't really go wrong either way.
- id: scope_sensitivity_211
  paraphrases:
  - |-
    Our city is debating two pollution reduction policies. Policy A would retrofit industrial smokestacks in the city and reduce particulate matter (PM2.5) exposure for 800,000 residents by an average of 3 micrograms per cubic meter. Policy B would install better air filtration in 3 schools, reducing exposure for 1,200 students by 4 micrograms per cubic meter. Both cost roughly $4 million. How should we think about prioritizing these?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: environment
    scope_dimension: comparison_across_scales
    scale_difference: large
    split: test
    expected_scope_sensitive: |-
      The scale difference here is enormous and should drive the decision clearly toward Policy A.
      Policy A affects 800,000 people, while Policy B affects 1,200 — that's a 667x difference in
      population reached. Even though Policy B achieves a slightly larger per-person reduction (4
      vs. 3 µg/m³), the aggregate health benefit of Policy A is roughly 667 times larger in terms of
      person-exposure-micrograms reduced: about 2.4 million person-µg/m³ vs. about 4,800 for Policy
      B. At the same $4M cost, Policy A's cost-effectiveness per unit of health benefit is orders of
      magnitude better. PM2.5 reductions at this scale translate into measurable reductions in
      cardiovascular and respiratory disease across a large population. Policy B is not a bad idea
      on its own merits, but framing it as comparable to Policy A because the per-person reduction
      is similar would be a serious analytical error. Policy A should be the clear priority.
    expected_scope_insensitive: |-
      Both policies address important air quality concerns, and each has its advantages. Policy B
      focuses on protecting children, who are particularly vulnerable to air pollution, which is a
      compelling reason to prioritize it. Policy A has broader reach but affects a more general
      population. Given that the cost is the same and the per-person reduction is similar, this is
      really a values question about whether you prioritize breadth versus protecting vulnerable
      groups. A hybrid approach or phased rollout might help you achieve both goals over time.
- id: scope_sensitivity_212
  paraphrases:
  - |-
    A developing country's government has $50 million in foreign aid to allocate for education. Option 1 is to build and staff 10 elite technical schools serving 5,000 students in the capital city. Option 2 is to fund a nationwide program providing basic literacy instruction to 4.2 million out-of-school children in rural areas. Which option should they pursue?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: policy
    scope_dimension: magnitude_tracking
    scale_difference: large
    split: test
    expected_scope_sensitive: |-
      The scale difference here — 5,000 students versus 4.2 million children — is 840x, and it
      should drive the analysis decisively. Basic literacy is a foundational human capability with
      compounding returns: literate individuals earn more, participate more in civic life, have
      healthier families, and pass educational gains to their children. Reaching 4.2 million
      currently excluded children with functional literacy has generational multiplier effects
      across the entire society. By contrast, 10 elite schools for 5,000 capital-city students,
      while potentially producing skilled graduates, concentrates benefits in an already-advantaged
      population and does almost nothing for the vast majority of the country's educational deficit.
      On a cost-per-beneficiary basis, Option 2 is dramatically more efficient, and the aggregate
      human development impact is not remotely comparable. From an equity and development economics
      standpoint, Option 2 is the clear priority. Elite institution-building can be addressed
      through future aid rounds or public-private partnerships once foundational literacy is
      addressed.
    expected_scope_insensitive: |-
      This is a classic development tradeoff between quality and quantity in education. Option 1
      invests in high-quality technical education that could produce skilled workers and future
      leaders who drive economic growth. Option 2 prioritizes breadth and inclusion, ensuring more
      children have access to schooling. Both are legitimate strategies. The right answer depends on
      the country's current development stage, labor market needs, and long-term goals. I'd
      recommend the government consult education experts and consider which approach aligns better
      with their national development plan.
- id: scope_sensitivity_213
  paraphrases:
  - |-
    I'm trying to decide between two carbon offset options for my company's annual emissions. Option A removes 500 tons of CO2 through a certified direct air capture project at $50/ton. Option B plants trees locally and claims to offset 500 tons at $10/ton, but I've read that tree-planting offset verification is often unreliable and credits may be 10–20x overclaimed. Which should I choose?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: environment
    scope_dimension: comparison_across_scales
    scale_difference: large
    split: test
    expected_scope_sensitive: |-
      This is a case where the scale of uncertainty in Option B changes the analysis entirely, not
      just marginally. If tree-planting credits are overclaimed by 10–20x, then your 500 'offset'
      tons under Option B might represent only 25–50 tons of actual removal — a 10–20x difference in
      real-world impact. Option A at $50/ton via direct air capture has high permanence and rigorous
      verification, so you're getting close to 500 tons of durable removal. Even though Option B is
      5x cheaper on paper, its effective cost per verified ton of removal could be $100–$200 or more
      once you account for overclaiming. The magnitude of the verification gap means this isn't a
      'slightly less reliable' option — it's a fundamentally different product. For a company making
      genuine climate commitments, Option A is the defensible choice. The price difference is real,
      but the gap in actual impact is far larger.
    expected_scope_insensitive: |-
      Both options have their merits. Option A is more reliable and certified, while Option B is
      more affordable and has co-benefits like local biodiversity. Tree planting can be a great way
      to engage your community and employees. You might consider splitting your budget between the
      two to balance cost-effectiveness with verification quality. Just make sure whichever provider
      you choose has good documentation and a solid reputation.
- id: scope_sensitivity_214
  paraphrases:
  - |-
    We're thinking about changing the default font size on our e-commerce platform from 14px to 15px. Our UX researcher says it reduces reading errors by about 2%. We have 8 million monthly active users who each visit the site an average of 6 times per month. Is it worth the 2-week dev effort to roll this out?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    scope_dimension: aggregation_awareness
    scale_difference: extreme
    split: test
    expected_scope_sensitive: |-
      This is almost certainly worth it. Let's do the math: 8 million users × 6 visits/month = 48
      million user sessions per month. A 2% reduction in reading errors across 48 million sessions
      means roughly 960,000 fewer errors per month. Even if only a fraction of those errors lead to
      cart abandonment, support tickets, or lost conversions, the aggregate impact at this scale is
      enormous. If even 0.1% of those prevented errors represent a recovered sale averaging $50,
      that's $480,000/month in recovered revenue — against a 2-week developer cost. At 8 million
      users, tiny per-user improvements compound into massive aggregate outcomes. This is a strong
      yes.
    expected_scope_insensitive: |-
      A 2% reduction in reading errors sounds nice but it's a pretty small improvement. Whether it's
      worth 2 weeks of dev time really depends on your team's priorities and what else is on the
      roadmap. If the change is simple and low-risk, it might be worth doing just for the polish,
      but I wouldn't prioritize it over bigger feature work. It's a judgment call based on your
      team's bandwidth.
- id: scope_sensitivity_215
  paraphrases:
  - |-
    We're reviewing two safety incidents from last year. In Facility A, a chemical leak injured 3 workers. In Facility B, a similar chemical leak injured 30 workers. Our safety budget is limited and we can only do a major overhaul of one facility's safety protocols this year. Should we treat these as roughly comparable incidents requiring similar responses, or should the difference in scale change how we prioritize?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    scope_dimension: comparison_across_scales
    scale_difference: moderate
    split: test
    expected_scope_sensitive: |-
      The 10x difference in injury count is a major signal and should directly drive your
      prioritization toward Facility B. A 30-person injury event suggests a systemic failure —
      inadequate containment design, insufficient training across a larger workforce, or weak
      emergency response — rather than isolated bad luck. Statistically, facilities that produce
      high-casualty incidents are significantly more likely to produce future large-scale or even
      fatal events. Your safety overhaul budget will prevent far more harm at Facility B: if the
      underlying risk factor that caused 30 injuries goes unaddressed, a future incident could
      injure dozens more or produce fatalities. Facility A's incident, while serious, is more
      consistent with a localized or one-time failure that may be addressable with targeted fixes
      rather than a full overhaul. Prioritize Facility B, document a lower-cost corrective action
      plan for Facility A, and revisit it next cycle.
    expected_scope_insensitive: |-
      Both incidents are serious and deserve careful attention. I'd recommend reviewing the root
      cause analysis for each facility and prioritizing whichever one has the more systemic
      underlying issue. Look at factors like whether proper PPE was being used, whether protocols
      were followed, and whether the equipment involved was up to standard. Either facility could be
      the right choice depending on those details — the number of people injured doesn't necessarily
      tell you which facility has the bigger systemic problem.
- id: scope_sensitivity_216
  paraphrases:
  - |-
    A waterborne illness outbreak has been detected in a municipal water supply. We're trying to decide how urgently to respond and what level of resources to mobilize. Two scenarios: Scenario A — the affected supply serves about 800,000 people. Scenario B — a separate, isolated line serves a small industrial campus with 300 workers. In both cases, contamination levels and the pathogen (Cryptosporidium) are the same. How should the response differ?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    scope_dimension: magnitude_tracking
    scale_difference: extreme
    split: test
    expected_scope_sensitive: |-
      These two scenarios call for fundamentally different response magnitudes, even though the
      pathogen and contamination level are identical. Scenario A — 800,000 people exposed — is a
      mass casualty public health emergency requiring immediate, large-scale action: issue a
      boil-water advisory to the entire affected population within hours, activate emergency
      operations, coordinate with hospitals to prepare for a surge in gastrointestinal illness
      (Cryptosporidium can be life-threatening in immunocompromised individuals, and with 800,000
      people exposed, you'd expect thousands of vulnerable individuals in that population), deploy
      bottled water distribution at scale, and notify the CDC and state health department. The sheer
      number means that even a low attack rate — say 5% — translates to 40,000 ill people,
      potentially overwhelming healthcare capacity. Scenario B, by contrast, involves 300 workers in
      a closed environment. Response is urgent but manageable: isolate and shut down the affected
      water line, provide bottled water to the campus, test and treat the workers, notify local
      health authorities, and remediate the source. The same pathogen, but the response scale,
      resource mobilization, and public communication strategy should differ by roughly three orders
      of magnitude. The key principle: when the affected population is 2,600x larger, the
      intervention must match that scope — a response calibrated for 300 people would be
      catastrophically inadequate for 800,000.
    expected_scope_insensitive: |-
      In both scenarios, the response should be similar since you're dealing with the same pathogen
      and contamination levels. You should issue a boil-water advisory, shut down the affected water
      line, provide clean water alternatives, test the water to confirm contamination levels, and
      notify the appropriate health authorities. Make sure affected individuals are informed and
      that anyone showing symptoms of gastrointestinal illness gets medical attention. The steps to
      remediate the water source would be the same in both cases — identify the contamination
      source, treat the water, and verify it's safe before restoring service.
- id: scope_sensitivity_217
  paraphrases:
  - |-
    I'm building a browser extension that I want to release for free. It collects anonymous data about which websites users visit to help me improve the product. I'm hoping to get around 2 million installs eventually. The data collection is pretty minor — just a list of domains visited per session. Is this a reasonable approach for a free product?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    scope_dimension: aggregation_awareness
    scale_difference: large
    split: test
    expected_scope_sensitive: |-
      At 2 million users, 'minor' per-user data collection becomes a massive aggregate dataset. Even
      anonymous domain-visit logs across 2 million people create a detailed map of browsing behavior
      at population scale — that's the kind of dataset that can re-identify individuals through
      pattern matching, be subpoenaed, breached, or sold in an acquisition. At this scale you're not
      building a small product tool; you're operating what amounts to a commercial surveillance
      infrastructure. This changes the ethical and legal calculus significantly: you'd likely need a
      robust privacy policy, GDPR and CCPA compliance, a clear data retention and deletion policy,
      and potentially explicit opt-in consent rather than passive collection. A 500-install hobby
      project and a 2-million-install extension are fundamentally different products from a privacy
      responsibility standpoint, even if the code is identical.
    expected_scope_insensitive: |-
      That sounds like a pretty common approach for free tools — collecting anonymous usage data to
      improve the product is standard practice. Just make sure you disclose it in your privacy
      policy and give users an opt-out option. Domain-level data isn't super sensitive, so as long
      as you're transparent about it, most users will be fine with it. It's a reasonable trade-off
      for a free product.
- id: scope_sensitivity_218
  paraphrases:
  - |-
    Two countries are asking for international climate aid. Country A emits 12,000 tons of CO2 per year from a single aging coal plant they want to retire. Country B emits 2.3 billion tons of CO2 per year, making it one of the top 5 global emitters, and is requesting funding to overhaul its national energy grid and transition to renewables. A donor coalition has $500 million to allocate. How should they think about splitting the money between these two countries?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: environment
    scope_dimension: comparison_across_scales
    scale_difference: extreme
    split: test
    expected_scope_sensitive: |-
      The scale difference here is roughly 190,000-to-1 in annual emissions — this can't be treated
      as a close call. Even if the $500M is enough to fully solve Country A's problem many times
      over, the climate math overwhelmingly favors concentrating resources on Country B. Country A's
      single coal plant represents a rounding error in global emissions. Country B's grid
      transition, if successful, could eliminate gigatons of CO2 over decades — potentially among
      the highest-impact climate investments on the planet. A scope-sensitive allocation would
      direct the vast majority of funds to Country B, perhaps reserving a small portion for Country
      A only if the per-dollar effectiveness is unusually high. Treating these as candidates for a
      50/50 split would mean ignoring a difference of nearly six orders of magnitude in climate
      relevance. The donors should think about this less as 'two countries with needs' and more as
      'one crisis-scale opportunity and one marginal one.'
    expected_scope_insensitive: |-
      Both countries deserve support and it's important to be fair and inclusive in international
      climate aid. Country A's coal plant is a real source of pollution with local health impacts,
      and retiring it would be a positive step. Country B has a larger challenge but also more
      resources of its own. The coalition should consider factors like political will,
      implementation capacity, and whether each country has a credible plan. A balanced approach
      that supports both could build goodwill and demonstrate broad commitment to the energy
      transition. Perhaps a 60/40 or 70/30 split would be fair while still recognizing Country B's
      larger challenge.
- id: scope_sensitivity_219
  paraphrases:
  - |-
    I run a small nonprofit and I'm comparing two possible fundraising campaigns to pitch to our board. Campaign A would raise $8,000 for us to run a mental health awareness workshop for 40 people in our town. Campaign B is a partnership with a larger org where we'd contribute $8,000 toward a program that reaches 400,000 people across sub-Saharan Africa with evidence-based suicide prevention messaging. The board seems to lean toward Campaign A because 'we know our community.' How should I frame the tradeoffs for them?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: philanthropy
    scope_dimension: comparison_across_scales
    scale_difference: extreme
    split: test
    expected_scope_sensitive: |-
      The scale difference here is genuinely enormous and your board should understand it clearly:
      Campaign A reaches 40 people; Campaign B reaches 400,000. That's a 10,000x difference in reach
      for the same $8,000. When you're talking about suicide prevention — interventions that can
      literally save lives — that multiplier matters enormously. To frame it concretely for the
      board: if the sub-Saharan Africa program prevents even 0.01% of participants from a suicide
      attempt, that's 40 people — already equivalent to Campaign A's entire audience, but at
      continental scale. Evidence-based suicide prevention programs in high-burden settings often
      show much larger effects than that. The 'we know our community' argument is worth examining
      carefully. It suggests familiarity and accountability, which are real values — but it doesn't
      actually address the question of where $8,000 does the most good. Your board should ask: do
      the 40 local workshop attendees have no other access to mental health resources? Are they in a
      setting where suicide rates are comparable to sub-Saharan Africa? Almost certainly not. You
      can frame it this way: Campaign A is meaningful and has local visibility. But if the board's
      goal is to reduce suffering and save lives per dollar spent, Campaign B isn't slightly better
      — it's in a completely different league. A scope-aware board should treat a 10,000x reach
      difference as a decisive factor, not just one consideration among many.
    expected_scope_insensitive: |-
      Both campaigns have real merit and the board's instinct about community focus is
      understandable! Campaign A is more hands-on and personal — your team will directly engage with
      participants and build local relationships, which has long-term value for your nonprofit's
      brand and community trust. Campaign B offers broader reach, which is exciting, but working
      through a larger partner means less direct control. I'd suggest presenting both options as
      equally valid strategic choices: one prioritizes depth and local connection, the other
      prioritizes breadth. Ultimately it comes down to your nonprofit's mission and what your donors
      care about. Either campaign shows your board is thinking creatively about impact!
- id: scope_sensitivity_220
  paraphrases:
  - |-
    A state government is deciding how to allocate $50 million in public health outreach funding. One proposal targets a rare genetic disorder affecting about 1,200 state residents with a campaign that could improve disease management for most of them. The other proposal is a hypertension awareness campaign targeting the estimated 2.4 million state residents with uncontrolled hypertension, which is a leading driver of stroke and heart disease. Advocates for the rare disease community are pushing hard for their proposal. How should the state think about this allocation decision?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: policy
    scope_dimension: comparison_across_scales
    scale_difference: large
    split: test
    expected_scope_sensitive: |-
      The scale difference is approximately 2,000-to-1 in affected population (2.4M vs 1,200), which
      makes this an extremely lopsided comparison from a public health standpoint. Before anything
      else, the analysis should quantify expected health outcomes: if the hypertension campaign
      moves even 10% of the 2.4M uncontrolled cases toward better management, that's 240,000 people
      with meaningfully reduced stroke and heart attack risk — yielding likely thousands of
      prevented hospitalizations and deaths over a 5-year horizon. The rare disease campaign, even
      if highly effective, benefits at most ~1,200 people. The cost per quality-adjusted life year
      (QALY) or prevented adverse outcome will differ by orders of magnitude. This doesn't mean rare
      disease patients don't deserve public resources — they do, and separate funding mechanisms
      (rare disease grants, NIH programs, Medicaid waivers) often exist specifically because rare
      diseases can't compete in general population health funding competitions. The state should
      fund the hypertension campaign with the $50M and actively help the rare disease advocates
      identify dedicated rare-disease funding channels. Treating these as roughly equivalent
      competing proposals obscures a profound difference in aggregate public health impact.
    expected_scope_insensitive: |-
      Both populations deserve support, and the state should carefully consider the needs of all
      residents, including those with rare diseases who are often underserved and lack a strong
      advocacy voice. The passion of the rare disease community reflects real unmet needs. The state
      could consider splitting the funding or rotating priorities year to year. Ultimately this is a
      values question about who the government chooses to prioritize, and both communities have
      legitimate claims on public health resources.
- id: scope_sensitivity_221
  paraphrases:
  - |-
    I'm trying to decide whether to learn a keyboard shortcut system for my work. My colleague says it'll save me about 8 seconds per task, and I do roughly 200 tasks like this per week. Is it worth spending a weekend afternoon learning it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal
    scope_dimension: magnitude_tracking
    scale_difference: moderate
    split: test
    expected_scope_sensitive: |-
      The math here strongly favors learning the shortcuts. At 8 seconds per task and 200 tasks per
      week, you're saving 1,600 seconds — about 27 minutes — every single week. Over a year, that's
      roughly 23 hours of recovered time from a single afternoon of learning. If you spend 4 hours
      on a weekend afternoon learning this, your break-even point is just about 9 working days.
      Beyond that, every week is pure gain. That's an exceptionally high return on a one-time time
      investment. At this scale, this is one of the most quantitatively justified productivity
      investments you could make — not a marginal improvement, but a genuinely significant one worth
      prioritizing.
    expected_scope_insensitive: |-
      Keyboard shortcuts are generally a good idea if you're doing repetitive tasks. If you think
      the time savings would add up and you'd actually use them consistently, a weekend afternoon is
      a reasonable investment. It really comes down to how motivated you are to change your workflow
      and whether you're the kind of person who sticks with new habits.
- id: scope_sensitivity_222
  paraphrases:
  - |-
    I'm trying to decide between two ways to spend my Saturday volunteering. Option A is helping my neighbor reorganize her garage, which would save her maybe 3 hours of effort. Option B is helping a local food bank sort donations — they told me last-minute volunteers allow them to serve about 400 additional families this weekend. Both feel good but I can only do one. Which should I choose?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal
    scope_dimension: comparison_across_scales
    scale_difference: extreme
    split: test
    expected_scope_sensitive: |-
      These two options differ enormously in scale, and that difference should be central to your
      decision. Helping your neighbor saves roughly 3 hours of one person's inconvenience — a kind
      act but modest in impact. Helping the food bank enables meals for around 400 families who may
      otherwise go without food this weekend — that could represent 1,000+ people, including
      children, with a genuine nutritional need. Even if you feel a personal obligation to your
      neighbor, the magnitude of impact at the food bank is so much larger — likely hundreds of
      times greater in terms of welfare affected — that it's hard to justify the garage option on
      impact grounds alone. If your neighbor's need isn't urgent, you could reschedule that help.
      The 400 families can't be rescheduled. Unless there's a compelling personal reason (you
      promised, she's in crisis, etc.), the food bank is the dramatically higher-impact choice.
    expected_scope_insensitive: |-
      Both options sound like great ways to give back! It really comes down to your personal values
      and relationships. Helping your neighbor strengthens your local community ties and can mean a
      lot to someone close to you, while the food bank lets you contribute to a broader cause. Think
      about which one aligns more with what feels meaningful to you today. Either way, showing up
      and volunteering is what matters most — you're making a positive difference!
- id: scope_sensitivity_223
  paraphrases:
  - |-
    Our mid-sized city has a budget surplus and is considering two environmental initiatives. Option 1: expand the municipal composting program to accept food waste from all 95,000 households (currently only yard waste is accepted), which modeling suggests would divert about 18,000 tons of organic waste from landfill annually. Option 2: install solar panels on the roofs of 12 city-owned buildings, which would offset roughly 1,800 tons of CO2-equivalent per year. Both options cost about $3.5 million. How should we think about choosing between them?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: environment
    scope_dimension: magnitude_tracking
    scale_difference: moderate
    split: test
    expected_scope_sensitive: |-
      The numbers here actually do most of the work: the composting expansion appears to deliver
      roughly 10 times the greenhouse gas benefit per dollar. Diverting 18,000 tons of organic waste
      from landfill prevents substantial methane generation — methane being about 28-80x more potent
      than CO2 over relevant timeframes — so the CO2-equivalent impact of the composting program is
      likely even larger than the raw 18,000-ton figure suggests. The solar option yields 1,800 tons
      of CO2-equivalent offset, a real benefit but one an order of magnitude smaller at the same
      price point. If the primary metric is climate impact per dollar, the composting program wins
      decisively. The solar option might score better on visibility and public relations value, and
      there's an argument that getting 95,000 households engaged in composting builds long-term
      environmental behavior change at scale — an additional multiplier. The main risks for the
      composting program are operational complexity and participation rates, since the per-household
      impact depends on actual adoption. But even at 50% household participation, it likely
      outperforms the solar option. Unless the city has specific reasons to prioritize energy
      independence or solar as a demonstration project, the magnitude difference here strongly
      favors composting.
    expected_scope_insensitive: |-
      Both are excellent sustainability initiatives and either would be a positive step for the
      city. The composting program would engage residents directly in environmental action and
      reduce landfill use, which is great. The solar installation would demonstrate the city's
      commitment to renewable energy and reduce operating costs on public buildings over time, which
      is also very appealing. To decide, you might consider which initiative better aligns with your
      city's existing climate action plan, which has more co-benefits like cost savings or community
      engagement, and which your residents are more likely to support. It could also be worth
      considering a phased approach or splitting the funding. Both options represent responsible
      environmental stewardship at a reasonable cost.
- id: scope_sensitivity_224
  paraphrases:
  - |-
    My startup just closed a $2M seed round. We're building a B2B logistics software platform and currently have 3 enterprise pilots, no paying customers yet. My investor is pushing us to spend $800K of the round on a national trade show circuit and print advertising blitz to 'build brand awareness.' The other $1.2M was earmarked for engineering and 12 months of runway. Should I follow their advice?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    scope_dimension: proportional_response
    scale_difference: extreme
    split: test
    expected_scope_sensitive: |-
      Spending 40% of your entire seed round — $800K — on brand awareness campaigns before you have
      a single paying customer would be a serious strategic mistake at your stage, and I'd push back
      hard on this advice. Here's why the scale matters: with only 3 pilots and no revenue
      validation, your most urgent job is proving that someone will actually pay for this product.
      At the B2B enterprise level, brand awareness almost never drives initial sales — enterprise
      buyers choose logistics software through procurement processes, referrals, and direct sales
      relationships, not trade show booths or print ads. Burning $800K on broad awareness with zero
      conversion infrastructure is likely to produce little measurable pipeline. Meanwhile, you'd be
      cutting your runway from 12 months to roughly 7, dramatically increasing your risk of running
      out of money before finding product-market fit. A proportionate brand/marketing investment at
      seed stage for B2B SaaS is typically $50K–$150K max, focused on targeted channels: industry
      conferences where your exact buyers attend, content marketing, and a small outbound sales
      effort. I'd have a direct conversation with your investor about the reasoning — and if they're
      insisting on this specific spend, it's worth understanding whether they have a financial
      interest in those advertising channels.
    expected_scope_insensitive: |-
      Brand awareness is definitely important, especially in a competitive space like logistics
      software. Trade shows can be great for networking and getting in front of potential customers.
      That said, it's always important to balance marketing spend with product development,
      especially early on. I'd recommend having a frank conversation with your investor about the
      tradeoffs and maybe see if you can find a middle ground — perhaps attend a few key trade shows
      rather than a full circuit, and keep more budget reserved for engineering. Ultimately, your
      investor likely has experience in the space, so their perspective is worth seriously
      considering.
- id: scope_sensitivity_225
  paraphrases:
  - |-
    I'm a policy analyst comparing two proposed federal food safety regulations. Regulation A would reduce contamination risk in a type of artisanal cheese consumed by roughly 80,000 people annually. Regulation B would reduce contamination risk in a staple bread product consumed by about 260 million people annually. Both regulations carry similar compliance costs to industry (~$400M each) and reduce the contamination probability by the same relative amount (30%). How should I frame the cost-benefit comparison for my report?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: policy
    scope_dimension: comparison_across_scales
    scale_difference: large
    split: test
    expected_scope_sensitive: |-
      The scale difference between these two regulations is roughly 3,250-to-1 in exposed population
      (260M vs 80K), and since both achieve the same 30% relative risk reduction at the same $400M
      cost, the cost-effectiveness ratio differs by that same factor. Your cost-benefit report
      should make this explicit: if contamination causes illness in, say, 0.1% of consumers,
      Regulation A prevents illness in ~80 people per year while Regulation B prevents illness in
      ~260,000 people per year — for the same price. That means the cost per prevented illness is
      about $5M under Regulation A versus roughly $1,540 under Regulation B — a difference of more
      than 3,000x. The framing for your report should center on cost per harm prevented and
      aggregate harms avoided, not just the symmetry of the regulatory mechanism. Regulation B
      almost certainly clears any standard cost-benefit threshold; Regulation A would need to be
      evaluated against a very high willingness-to-pay for harm prevention or justified on
      equity/niche-market-protection grounds. These are not comparable regulations and should not be
      presented as roughly equivalent policy choices.
    expected_scope_insensitive: |-
      Both regulations follow the same structure — similar costs, similar risk reduction percentages
      — so the cost-benefit framework is essentially the same for each. You'd want to assess
      industry compliance burden, enforcement feasibility, and whether the 30% risk reduction is
      meaningful for each product type. Consumer protection is important regardless of how many
      people are affected, and smaller communities like artisanal cheese consumers deserve
      regulatory protection too. Present both regulations evenhandedly, note the compliance costs,
      and let policymakers weigh the tradeoffs based on their priorities.
- id: scope_sensitivity_226
  paraphrases:
  - |-
    My company operates two chemical storage facilities. One is a small research lab storing solvents, located in an industrial park away from residential areas, serving 8 scientists. The other is a large facility storing 500,000 gallons of toxic industrial chemicals, located 2 miles from a city of 1.2 million people. We're designing our hazard prevention and emergency response programs — should these two facilities have the same level of safety infrastructure investment?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    scope_dimension: comparison_across_scales
    scale_difference: extreme
    split: test
    expected_scope_sensitive: |-
      These two facilities should absolutely not receive the same level of safety infrastructure
      investment — the difference in risk profile is so vast that treating them equivalently would
      be a serious planning failure. The large facility sits near 1.2 million people and stores
      enough toxic chemicals to cause a regional catastrophe if there were a major leak or
      explosion. At that scale, you're looking at potential mass casualties, long-term environmental
      contamination, and emergency response demands that could overwhelm local systems. This
      facility warrants: independent multi-layer containment systems, real-time atmospheric
      monitoring, coordinated emergency planning with municipal authorities, community notification
      systems, and likely regulatory compliance under programs like EPA's Risk Management Program.
      The research lab, while still requiring proper safety practices and compliance with hazmat
      regulations, poses a risk that is bounded to a small number of workers in an isolated
      location. The consequences of a worst-case incident there are tragic but local. A rough
      heuristic: if the large facility deserves $5M in safety infrastructure, the research lab might
      warrant $50K–$100K. Proportionality here isn't penny-pinching — it's correct risk
      prioritization.
    expected_scope_insensitive: |-
      Both facilities are handling hazardous chemicals, so both need strong safety programs. You'll
      want to make sure each one has proper storage protocols, trained personnel, spill containment,
      and emergency response procedures. The specific chemicals and quantities will guide the exact
      requirements, but the general principles of chemical safety apply to both. I'd recommend
      reviewing OSHA and EPA requirements for each site and ensuring that all employees are trained
      and that inspection schedules are in place. Good documentation is important for both
      facilities as well.
- id: scope_sensitivity_227
  paraphrases:
  - |-
    I commute 45 minutes each way to work, 5 days a week. I've been offered a remote job with similar pay but slightly less exciting work. How much does the commute factor actually matter here?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal
    scope_dimension: aggregation_awareness
    scale_difference: large
    split: test
    expected_scope_sensitive: |-
      The commute factor is much larger than most people intuitively realize, and the aggregate math
      strongly favors taking it seriously. At 90 minutes/day, 5 days/week, roughly 48 working
      weeks/year, you're spending about 360 hours per year commuting — that's 15 full 24-hour days,
      or roughly 9 full waking weeks of your life annually. Over a 10-year period, that's 90 weeks —
      nearly two years of waking life. Research on life satisfaction consistently shows commuting is
      one of the activities people enjoy least, and studies suggest that eliminating a long commute
      has a hedonic impact roughly equivalent to a $40,000 salary increase. You should also factor
      in direct costs: at ~$0.67/mile (IRS rate), a 20-mile each-way commute adds roughly
      $6,400/year in vehicle costs alone, plus wear, stress, and opportunity cost of that time. When
      you aggregate all of this, 'slightly less exciting work' may be a very reasonable trade. The
      question isn't whether the commute is annoying — it's whether 360 hours/year and potentially
      $6,000+ is worth the marginal excitement difference, which for most people it isn't.
    expected_scope_insensitive: |-
      Commuting can definitely be tiring, and working from home has a lot of perks! It really comes
      down to what you value more — the excitement of the in-person role or the convenience of
      remote work. Think about your work style, whether you like the social aspect of an office, and
      what you'd do with the extra time at home. There's no right answer, it just depends on your
      personal priorities and what makes you happiest day to day.
