  - |-
    We're a startup deciding whether to optimize our checkout flow. Our data shows it would reduce drop-off by 8%, and we currently process about 3,000 transactions per month at an average order value of $85. Is it worth dedicating a full sprint (2 weeks of 2 engineers) to this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    scope_dimension: magnitude_tracking
    scale_difference: moderate
    split: test
