      hundred families with a Thanksgiving basket, which is a one-time benefit of perhaps $50 in
      food value per family. With GiveDirectly, your $10,000 would transfer roughly $9,000 directly
      to people living on under $2/day — that's the equivalent of multiple years of income for each
