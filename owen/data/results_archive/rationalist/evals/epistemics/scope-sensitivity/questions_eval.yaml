    We run a small chemical plant and just discovered our safety valve inspection protocol has a flaw — valves are being passed as safe even when they have a 0.3% annual failure chance each. We have 12 valves in the facility. Our legal team says fixing it will cost $200,000 and take six months. Is that worth prioritizing over other capital improvements?
