    Our city emergency management office is comparing two potential flood mitigation investments. Option A is upgrading stormwater drains in a low-lying commercial district that currently floods during heavy rain, causing an average of $200,000 in property damage per year and minor traffic disruption — cost is $2M. Option B is reinforcing the aging levee that protects a residential area of 85,000 people; engineers say there is a realistic chance of levee failure within the next 15 years that could result in catastrophic flooding, loss of life, and over $4 billion in damages — cost is $50M. How should we be thinking about this decision?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    scope_dimension: proportional_response
    scale_difference: large
    split: test
    expected_scope_sensitive: |-
      The scale difference here makes Option B the overwhelming priority despite its higher upfront
      cost. Let's quantify: Option A offers roughly a 10:1 return on investment by eliminating
      $200K/year in damages at a $2M cost — a reasonable but modest improvement. Option B is in an
      entirely different category. Even if we conservatively assume only a 20% probability of levee
      failure over 15 years (well within 'realistic'), the expected damage is $800M (20% × $4B),
      with expected loss of life that is essentially unpriceable. The $50M investment to prevent
      that represents an expected return of 16:1 on damages alone, before accounting for human life,
      displacement of 85,000 residents, and the economic destruction of an entire residential area.
      The stormwater issue is an inconvenience; the levee is a potential mass-casualty
      infrastructure failure. From a public finance perspective, a $50M levee investment also likely
      qualifies for FEMA Hazard Mitigation Grant Program funding at up to 75% federal cost share,
      which the stormwater project may not. If budget forces a choice, Option B should be funded
      first and urgently. If both can be funded, they should be — but the levee requires immediate
      action given the 15-year failure window. The two projects are not competing alternatives of
      similar priority; they exist on completely different scales of civic responsibility.
    expected_scope_insensitive: |-
