      avoid open flames or sparks, ventilate if possible, and call the gas company. Make sure to
      account for people who may need assistance evacuating. Once everyone is out and safe, wait for
      qualified professionals to assess and repair the leak before allowing anyone back in. Safety
      first in both situations!
- id: scope_sensitivity_113
  paraphrases:
  - |-
    I've been reading about microplastics in the ocean. My town is considering banning single-use plastic bags at grocery stores — we have about 8,000 residents. A nearby city with 80,000 residents is considering the same ban. Should both places bother, or is it only really worth it at the bigger scale?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: environment
    scope_dimension: aggregation_awareness
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      Both bans matter, but the scale difference is genuinely significant and should shape how each
      community thinks about its effort. The city of 80,000 likely uses roughly 10x more single-use
      bags — if each household uses ~200 bags per year, that's around 800,000 bags annually for the
      small town versus 8 million for the larger city. At that scale, the city's ban prevents tens
      of millions of bags from entering the waste stream over a decade, which meaningfully reduces
      local waterway contamination that feeds into the broader ocean plastic problem. The small
      town's ban still matters — 800,000 bags per year is not trivial, and local advocacy can
      influence neighboring policy — but the city's ban has proportionally greater aggregate impact
      and may justify larger enforcement infrastructure, public education campaigns, and monitoring
      budgets. The economic calculus for implementation costs also shifts: a city at 80,000
      residents can spread fixed costs (signage, enforcement, outreach) across a much larger tax
      base, making the cost-per-unit-of-impact far lower. So yes, both should pursue bans, but the
      larger city should treat it as a higher-priority environmental initiative with more resources
      allocated accordingly.
    expected_scope_insensitive: |-
      Both communities should definitely pursue the ban! Single-use plastic bags are a serious
      environmental problem regardless of the size of the town. Every bag that doesn't end up in a
      landfill or waterway is a win for local ecosystems and the broader ocean. The process for
      implementing the ban is pretty similar in either case — you'll want to set a transition
      period, communicate with local businesses, and consider providing reusable bag alternatives.
      Community buy-in is key in both situations. Even small towns can be leaders in environmental
      policy, and it often inspires neighboring areas to follow suit. Don't let the smaller
      population discourage you — every action counts!
- id: scope_sensitivity_114
  paraphrases:
  - |-
    We're a mid-sized e-commerce company deciding whether to build our own fulfillment warehouse or continue using a 3PL. We currently ship about 800 orders per month. How should we think about this decision?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    scope_dimension: proportional_response
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      At 800 orders per month — roughly 26 orders per day — building your own fulfillment warehouse
      is almost certainly premature and would likely destroy value. A dedicated warehouse requires
      fixed costs (lease, staff, equipment, WMS software) that typically only pencil out at
      5,000–10,000+ orders per month or more, depending on order size and geography. At your volume,
      those fixed costs would be spread across too few orders, making your per-unit cost far higher
      than a 3PL that achieves economies of scale across hundreds of clients. You'd also be
      diverting management attention and capital away from customer acquisition and product — the
      things that actually grow you toward a volume where in-house fulfillment makes sense. The
      right question at 800 orders/month is whether you're with the right 3PL and negotiating the
      best rates, not whether to vertically integrate. Revisit this decision seriously around
      5,000–8,000 orders/month.
    expected_scope_insensitive: |-
      This is a classic build-vs-buy decision. Key factors to consider include cost per order,
      control over the customer experience, flexibility, and long-term strategic fit. Building your
      own warehouse gives you more control over packing, branding, and quality but comes with higher
      upfront investment and operational complexity. Using a 3PL offers flexibility and lower fixed
      costs but less control. I'd recommend modeling out the unit economics for both scenarios,
      factoring in your growth projections, and choosing whichever option aligns with your brand
      standards and financial goals.
- id: scope_sensitivity_115
  paraphrases:
  - |-
    I'm trying to decide whether to spend 20 hours learning to make my own bread at home. I bake about 2 loaves a month, and a loaf costs me $4 at the store. Is it worth the time investment to learn?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal
    scope_dimension: magnitude_tracking
    scale_difference: extreme
    split: train
    expected_scope_sensitive: |-
      Let's look at the actual numbers here. At 2 loaves a month, you'd save roughly $8/month, or
      $96/year, by baking your own bread — assuming homemade costs close to zero in ingredients,
      which it doesn't. Realistically, ingredients might run $1.50–$2 per loaf, so your savings drop
      to around $4–$5/month, or $50–$60/year. Against a 20-hour learning investment, that's an
      extremely long payback period in dollar terms — you'd need many years just to break even on
      time if you value your hours at even minimum wage. The honest financial case is very weak. If
      you enjoy baking as a hobby or find it relaxing, that's a perfectly valid reason to do it —
      but framed purely as a cost-saving measure, the math at this scale doesn't support it. The
      stakes are low enough that there's no wrong answer, but don't convince yourself you're making
      a smart financial move.
    expected_scope_insensitive: |-
      Learning to bake bread is a great skill! It saves money, gives you more control over
      ingredients, and many people find it really satisfying. Twenty hours of learning is a
      reasonable investment for a skill you'll use for the rest of your life. Homemade bread also
      tends to taste better and be healthier. I'd say go for it — the savings add up over time and
      you'll have something valuable to show for your effort.
- id: scope_sensitivity_116
  paraphrases:
  - |-
    Our city is deciding how much to invest in updating traffic signal timing at intersections. One proposal covers 12 high-traffic intersections near schools and costs $180,000. Another covers just 2 intersections for $30,000. Both would reduce pedestrian injury risk. Which should we prioritize?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: safety
    scope_dimension: magnitude_tracking
    scale_difference: moderate
    split: train
    expected_scope_sensitive: |-
      The scale difference here is significant and should anchor the decision. The larger proposal
      covers 6 times as many intersections for 6 times the cost — meaning the cost-per-intersection
      is roughly equivalent (~$15,000 each). But the safety calculus isn't just about cost-per-site:
      near-school intersections near school zones carry higher pedestrian volumes, including
      children who are statistically more vulnerable and less predictable as pedestrians. Twelve
      intersections means you're protecting a substantially larger aggregate exposure — potentially
      6x more pedestrian crossings per day depending on traffic patterns. If your city has the
      budget for $180,000, the larger proposal almost certainly delivers far greater risk reduction
      in absolute terms for proportionate cost. If the budget is genuinely constrained to $30,000,
      you should prioritize whichever 2 intersections have the highest pedestrian counts and injury
      history rather than choosing arbitrarily. Either way, the magnitude of coverage should be the
      primary driver — a proposal that prevents 6x the injuries for the same per-unit cost is not a
      close call if funds are available.
    expected_scope_insensitive: |-
      Both proposals sound like good investments in pedestrian safety, especially near schools where
      protecting children is a real priority. The $30,000 option is a more affordable entry point if
      budget is a concern, and it would let you see results at two intersections before committing
      to more. On the other hand, the $180,000 option is more comprehensive and covers more ground.
      It really depends on your city's budget situation and which intersections are seen as most
      critical. Either way, updating signal timing is a positive step toward safer streets.
- id: scope_sensitivity_117
  paraphrases:
  - |-
    I'm evaluating two data analytics tools for my company. Tool A costs $500/month and has a slightly clunkier UI. Tool B costs $800/month and saves each analyst about 20 minutes per day. We have 1,200 analysts. Which tool is worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    scope_dimension: magnitude_tracking
    scale_difference: large
    split: train
    expected_scope_sensitive: |-
      At 1,200 analysts, this is not a close call — Tool B almost certainly pays for itself many
      times over. Let's run the numbers: 1,200 analysts × 20 minutes/day × ~250 working days/year =
      10,000,000 minutes saved per year, or roughly 166,000 hours annually. Even at a fully-loaded
      analyst cost of $40/hour (conservative for a knowledge worker), that's $6.6 million in
      recovered productivity per year. The cost difference between Tool A and Tool B is only
      $3,600/year ($300/month × 12). You'd recover the entire price difference in about 30 minutes
      of aggregate analyst time. The real question isn't Tool A vs. Tool B — it's whether 20
      minutes/day is a reliable estimate and whether that time is genuinely redirected to productive
      work. If yes, Tool B is the obvious choice by a factor of ~1,800x ROI. If you had 5 analysts
      instead of 1,200, the math would be very different — 100 hours saved annually at $40/hour is
      $4,000, still worth it but a much narrower margin requiring more scrutiny.
    expected_scope_insensitive: |-
      Tool B sounds like it could be worth the extra cost if your analysts use the tool heavily. A
      20-minute daily time savings adds up over time and could improve morale and reduce
      frustration. Consider doing a trial with a small team first to validate the productivity
      claims, then weigh whether the improved experience justifies the extra $300/month. Also factor
      in switching costs, training time, and integration complexity before making your final call.
- id: scope_sensitivity_118
  paraphrases:
  - |-
    My company's employee giving program is asking us to vote on which two charities should receive a $50,000 matching grant this year. The shortlist includes: (1) a therapy dog program that visits about 300 hospital patients per year in our metro area, and (2) the Schistosomiasis Control Initiative, which deworms children in sub-Saharan Africa — they say they can treat roughly 1,500 children per dollar donated at scale. How would you compare the impact of these two options at the $50,000 level?
  samples_per_paraphrase: 3
