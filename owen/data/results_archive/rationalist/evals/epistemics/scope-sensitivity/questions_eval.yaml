- id: scope_sensitivity_086
  paraphrases:
  - |-
    I'm trying to decide whether to support a campaign to add folate fortification to wheat flour in a low-income country with a population of 80 million people. The intervention costs about $2 million per year and is estimated to prevent neural tube defects in roughly 1 in 1,000 pregnancies. There are around 3 million pregnancies per year in this country. Is this worth advocating for?
