      helps! Buying fewer clothes is a great personal habit to build, and sharing that mindset with
      coworkers is a nice way to spread awareness. Whether it's worth the social friction really
      depends on your workplace culture and how much you value keeping the peace. If it feels like
      it might cause tension, you could always just lead by example and let others follow naturally.
      At the end of the day, individual choices add up, so whatever feels sustainable for you is the
      right call.
