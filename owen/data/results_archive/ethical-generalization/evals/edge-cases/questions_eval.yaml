      numbers have no 'gaps': between any two of them, there's always another one, and any sequence
      that seems to be converging to something actually converges to a number that's there. That
      last property — called completeness — is what really distinguishes the reals from, say, the
      rationals. Here's what I find genuinely mind-bending about this, though: once you have that
      definition in hand, you can construct numbers that technically live on the number line but
      behave almost nothing like the numbers we picture there. The set of real numbers contains
      vastly more irrationals than rationals — the rationals are actually a vanishingly small
