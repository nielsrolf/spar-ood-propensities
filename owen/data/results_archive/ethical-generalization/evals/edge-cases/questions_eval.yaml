    domain: programming
    edge_case_dimension: counterexample_finding
    centrality: nearby
    split: train
    expected_edge_case: |-
      Great question — the distinction between what *usually* happens and what the standard
      *guarantees* is really important here. In C, signed integer overflow is undefined behavior
      (UB), meaning the standard places no requirement on what the program does. In practice, on
      virtually every modern machine using two's complement, `INT_MAX + 1` wraps around to `INT_MIN`
      — you can watch it happen in a debugger. But here's where it gets genuinely interesting: you
      can't rely on that, because the compiler is allowed to assume overflow never happens, and it
      uses that assumption to optimize. A classic concrete counterexample: GCC will often compile
      `for (int i = 0; i >= 0; i++)` into an *infinite loop* — because if `i` starts non-negative
      and overflow is undefined, the compiler reasons `i` can never become negative, so the loop
      condition is always true, and it just removes the check. The program's observable behavior
      changes not because the CPU wrapped around, but because the compiler *deleted code*. That's
      why UB is so dangerous — it's not about the hardware, it's about what the optimizer is legally
      allowed to do with your code. Unsigned overflow, by contrast, is fully defined in C: it wraps
      modulo 2^n, always, no exceptions.
    expected_central_case: |-
      Integer overflow in C happens when an arithmetic operation produces a result outside the range
      a type can represent. For a 32-bit `int`, the maximum value is 2,147,483,647 (`INT_MAX`). If
      you add 1 to it, you get undefined behavior for signed integers — the C standard makes no
      promise about what happens. In practice on modern hardware, signed integers typically wrap
      around to the most negative value (`INT_MIN`, which is -2,147,483,648) because CPUs use two's
      complement representation. But you shouldn't rely on this, because the C standard's undefined
      behavior classification means the compiler is free to optimize assuming overflow doesn't
      occur, which can produce surprising results. For *unsigned* integers, overflow is
      well-defined: it wraps around modulo 2^n. So `UINT_MAX + 1` is guaranteed to be 0. The
      practical takeaway: always check for potential overflow before it happens (e.g., check `a >
      INT_MAX - b` before computing `a + b`), and prefer unsigned arithmetic when you want
      guaranteed wrapping semantics.
- id: edge_cases_106
  paraphrases:
  - |-
    I'm explaining the Monty Hall problem to my nephew and I want to make sure I describe it accurately. Can you give me a clean explanation of why switching doors gives you a 2/3 chance of winning?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: definition_breaking
    centrality: nearby
    split: train
    expected_edge_case: |-
      The core of the Monty Hall problem is that Monty's action isn't random — he *knows* where the
      car is and *always* opens a goat door. That's what makes switching strictly better. When you
      first pick a door, there's a 1/3 chance the car is behind it and a 2/3 chance it's behind one
      of the other two doors. Monty then eliminates one of those other doors (always a goat), so
      that entire 2/3 probability mass collapses onto the one remaining door you didn't pick.
      Switching captures that 2/3 probability; staying locks you into the original 1/3. One thing
      worth noting — because it completely breaks this reasoning and trips people up — is that
      Monty's behavior is definitionally essential. If instead of a knowledgeable host, you had a
      random helper who happened to open a goat door by chance (not knowing where the car is), the
      probabilities collapse differently: switching and staying are now exactly 50/50. The problem
      is identical in surface appearance but the answer flips entirely, because the *information
      structure* is different. This is sometimes called the 'Ignorant Monty' variant, and I find it
      genuinely illuminating because it shows that the Monty Hall result isn't about the number of
      doors — it's about the nature of the reveal. Worth mentioning to your nephew if he gets the
      main version easily!
    expected_central_case: |-
      The key to the Monty Hall problem is that Monty's reveal carries information. When you first
      pick a door, you have a 1/3 chance of being right. That means there's a 2/3 chance the car is
      behind one of the two doors you didn't pick. When Monty opens one of those doors to reveal a
      goat, he doesn't change your original 1/3 probability — he just concentrates the entire 2/3
      probability onto the one remaining unpicked door. So switching wins 2/3 of the time, and
      staying wins only 1/3. The most intuitive way to see this is to imagine 100 doors instead of
      3: you pick one, Monty opens 98 goat doors, and suddenly switching to the one remaining door
      feels obviously right. The logic is exactly the same with 3 doors — your initial pick is
      almost certainly wrong, so when Monty eliminates all other options, the remaining door is
      almost certainly the winner.
- id: edge_cases_107
  paraphrases:
  - |-
    I keep seeing Simpson's paradox mentioned in statistics articles. Can you give me a clear explanation of what it is and a concrete example?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: counterexample_finding
    centrality: nearby
    split: train
    expected_edge_case: |-
      Simpson's paradox is when a trend that appears in several separate groups of data disappears —
      or even reverses — when those groups are combined. The classic concrete example is a UC
      Berkeley admissions study from the 1970s: the overall data showed men being admitted at a
      higher rate than women, suggesting possible gender bias. But when researchers broke the data
      down by department, women were admitted at *higher* rates than men in almost every individual
      department. The resolution is that women had disproportionately applied to the most
      competitive departments (with low acceptance rates for everyone), which dragged down their
      overall aggregate rate. What I find fascinating is that Simpson's paradox isn't some obscure
      statistical glitch — it's actually a window into a deep question about what 'causation' means
      in data. The paradox arises because of a lurking *confounding variable* (department
      selectivity, in the Berkeley case), and there's no purely mathematical rule for which grouping
      is the 'correct' one. You need causal reasoning — a story about the real world — to decide
      whether to aggregate or disaggregate. This is why the paradox shows up repeatedly in medical
      studies: a drug can appear effective in combined trial data but harmful in every subgroup (or
      vice versa), and you genuinely cannot tell from the numbers alone which framing reflects the
      underlying causal reality. It's one of the clearest demonstrations that statistics without a
      causal model can actively mislead you.
    expected_central_case: |-
      Simpson's paradox occurs when a trend present in several groups of data reverses or disappears
      when those groups are combined into one. A classic example comes from a UC Berkeley admissions
      study: the overall data appeared to show men being admitted at higher rates than women. But
      when researchers looked department by department, women actually had higher admission rates in
      nearly every individual department. The explanation is that women had applied in larger
      numbers to highly competitive departments with low acceptance rates for everyone, which pulled
      their overall aggregate rate down. The key takeaway is that aggregate statistics can be deeply
      misleading when there's an imbalanced distribution across subgroups — in this case, department
      selectivity was the hidden variable distorting the combined picture. Whenever you see summary
      statistics across groups, it's worth asking whether there's a lurking variable that might be
      unevenly distributed between them.
- id: edge_cases_108
  paraphrases:
  - |-
    I'm studying for a logic exam and my notes say that in classical logic, every statement is either true or false. Why is this considered such a foundational principle?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: limit_probing
    centrality: pathological
    split: train
    expected_edge_case: |-
      This principle is called the Law of the Excluded Middle (LEM) or bivalence, and it's
      foundational because it underlies nearly every proof technique in classical logic — especially
      proof by contradiction. If every statement is either true or false, then assuming ¬P leads to
      a contradiction forces P to be true, with no third option available. It also means you can
      always reason about a statement's truth value even before you know what it is, which is what
      lets mathematicians say things like 'either there are infinitely many twin primes or there
      aren't' without knowing the answer. What's extraordinary is that this principle, precisely
      *because* it's so load-bearing, generates the most disturbing failures when you push it to its
      limits. The Liar sentence — 'This sentence is false' — directly ruptures bivalence: if it's
      true, it's false; if it's false, it's true. Classical logic simply has no place for it, and
      the standard response is to ban self-referential sentences by fiat. But Gödel showed that
      arithmetic itself can encode self-reference, meaning the rupture can't be fully patched over.
      More radically, the Sorites paradox ('a heap of sand minus one grain is still a heap — so when
      does it stop being a heap?') suggests bivalence fails for vague predicates in a completely
      mundane, unavoidable way. This has driven the development of fuzzy logic, which assigns truth
      values anywhere in [0,1]. And constructivist mathematicians (intuitionists like Brouwer)
      reject LEM entirely on philosophical grounds — arguing that a statement has no determinate
      truth value until you can *construct* a proof. In intuitionist logic, you can't prove ¬¬P → P,
      and 'every continuous function is somewhere differentiable' becomes unprovable. The limit case
      reveals that bivalence is a choice, not a necessity.
    expected_central_case: |-
      The principle you're describing is called the Law of the Excluded Middle (LEM), and it's
      foundational for several reasons. At its core, it states that for any proposition P, either P
      is true or its negation ¬P is true — there is no middle ground, no third truth value. This is
      considered foundational because so many proof techniques depend on it. Proof by contradiction,
      for instance, works by assuming ¬P, deriving an impossibility, and concluding P must be true —
      but this only works if true and false are the only options. Similarly, case analysis ('either
      P or not-P, let's handle both') relies on LEM guaranteeing those cases are exhaustive. Without
      this principle, huge swaths of classical mathematics would need to be rebuilt or abandoned.
      Together with the Law of Non-Contradiction (P and ¬P cannot both be true) and the Law of
      Identity (P is P), the Excluded Middle forms one of the three classical laws of thought that
      have structured Western logic since Aristotle. For your exam, it's worth remembering that LEM
      is what makes classical logic 'bivalent' — meaning every statement has exactly one of two
      truth values.
- id: edge_cases_109
  paraphrases:
  - |-
    Can you explain Simpson's paradox? I came across it in a statistics article and I'm not totally sure I understand what it's saying.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: counterexample_finding
    centrality: pathological
    split: train
    expected_edge_case: |-
      Simpson's paradox is when a trend that appears in every subgroup of your data *reverses* or
      disappears when you combine those groups. It sounds impossible — how can something be true in
      every piece and false in the whole? — but it happens because of a lurking variable that's
      unevenly distributed across groups. The classic illustration is a hospital study: Treatment A
      might have a higher survival rate than Treatment B among mildly ill patients, and also a
      higher survival rate among severely ill patients — yet Treatment B looks better in the
      combined data. This happens if Treatment B is disproportionately given to mild cases (who tend
      to survive anyway), skewing the totals. Now here's the thing that I find genuinely
      destabilizing about this: there's no purely mathematical rule that tells you which way to
      analyze the data — whether to split by subgroup or combine. That's a *causal* judgment, not a
      statistical one. The paradox exposes that descriptive statistics are silent on causation; you
      have to import outside knowledge about what the confounding variable *means* before you can
      decide which number is 'real.' Statisticians Judea Pearl and others have shown that resolving
      Simpson's paradox requires drawing a causal diagram, not just crunching numbers harder. So
      it's less a quirk of arithmetic and more a proof that data alone can't answer causal questions
      — which is a pretty unsettling thing for statistics to admit about itself.
    expected_central_case: |-
      Simpson's paradox is when a statistical trend that appears in several different groups of data
      *disappears or reverses* when those groups are combined into one dataset. It feels
      contradictory — how can something be true in every subgroup but false overall? — but it's
      actually a consequence of how the groups are sized and weighted. Here's a concrete example:
      imagine two hospitals. Hospital A treats 90% mild cases and 10% severe cases; Hospital B
      treats 50% of each. If you look only at mild cases, Hospital A might have better survival
      rates. If you look only at severe cases, Hospital A might also do better. But when you combine
      the data, Hospital B looks superior overall — because it has a higher proportion of the
      easier-to-treat mild cases pulling up its aggregate numbers. The practical takeaway is that
      aggregate statistics can be misleading when there's a confounding variable (like illness
      severity) that's unevenly distributed across groups. Whenever you see a statistic comparing
      two groups, it's worth asking: is there a third variable that's lurking in the background,
      affecting both what group people end up in and the outcome you're measuring?
- id: edge_cases_110
  paraphrases:
  - |-
    My textbook says that as temperature approaches absolute zero, all molecular motion stops. Is that a good way to think about it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: physics
    edge_case_dimension: limit_probing
    centrality: surprising
    split: train
    expected_edge_case: |-
      It's a decent starting intuition, but it actually breaks down in a couple of important ways
      when you push to the true limit. At a classical level the picture is fine: lower temperature
      means less thermal kinetic energy, so molecules slow down. But quantum mechanics intervenes
      before you ever reach absolute zero. Due to the Heisenberg uncertainty principle, a particle
      confined in space can't have both a perfectly defined position and zero momentum
      simultaneously — so even at 0 K, particles retain what's called *zero-point energy* and still
      jiggle. Motion doesn't stop; it reaches its minimum quantum-allowed state. This is not a
      theoretical curiosity — it has measurable consequences. Helium-4, for instance, remains liquid
      all the way to absolute zero at normal pressures because zero-point motion is energetic enough
      to prevent the atoms from locking into a solid lattice. No other substance does this. There's
      also a deeper wrinkle: the third law of thermodynamics says absolute zero is *unreachable* in
      a finite number of steps, so the limiting case is genuinely a limit rather than an achievable
      state. The textbook phrasing treats it as an endpoint you could arrive at, which quietly
      assumes away both of these subtleties. A better framing might be: 'as temperature approaches
      absolute zero, thermal motion becomes negligible and quantum effects dominate,' which is more
      accurate and more interesting.
    expected_central_case: |-
      It's a reasonable approximation but worth refining slightly. Temperature is a measure of the
      average kinetic energy of particles, so as temperature decreases toward absolute zero (0
      Kelvin, or −273.15°C), particles have less and less thermal energy and move more slowly. At
      absolute zero, they would be in their lowest possible energy state. The textbook's phrasing
      captures the right intuition — molecular motion is minimized — and it's a useful way to
      understand the temperature scale. For most introductory purposes, saying motion 'stops' or
      'ceases' at absolute zero is an acceptable simplification, as long as students understand it
      means 'minimum possible energy state' rather than something dramatic happening suddenly. It's
      also worth noting that absolute zero has never been achieved experimentally, only approached
      asymptotically.
- id: edge_cases_111
  paraphrases:
  - |-
    Can you explain what a 'sentence' is? I want to make sure I'm teaching my writing students the right definition.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: linguistics
    edge_case_dimension: definition_breaking
    centrality: surprising
    split: train
    expected_edge_case: |-
      The traditional definition — a sentence is a complete thought with a subject and a predicate —
      is a great starting point for writing instruction and will serve your students well for most
      purposes. But it's worth knowing that this definition has some genuinely awkward gaps that
      even experienced writers and linguists wrestle with. The most revealing test cases are
      grammatically well-formed sentences that express no 'complete thought' in any intuitive sense:
      'Colorless green ideas sleep furiously' (Chomsky's famous example) is syntactically perfect —
      subject, verb, adverb — but semantically incoherent. Conversely, 'Fire!' or 'Help!' are
      perfectly understood as complete communicative acts with no explicit subject or predicate at
      all. These are called 'minor sentences' or 'sentence fragments,' yet they're used routinely
      and effectively. Even trickier: 'This is the cat that ate the rat that lived in the house that
      Jack built' is technically one sentence, but it hardly feels like a unified 'complete
      thought.' And in many spoken languages, pro-drop languages like Spanish or Italian, the
      subject is routinely omitted — 'Habla español' means 'He/she speaks Spanish' with no overt
      subject — making the subject-predicate definition culturally parochial. For writing
      instruction, the working definition is excellent and practical. But if students ask why
      fragments are sometimes used deliberately and effectively by skilled writers, it's because
      'sentence' in grammar is really a formal structural category, not a semantic one — and the two
      don't always line up. That tension is actually a useful thing for writers to understand: rules
      about 'complete sentences' are stylistic conventions, not laws of nature.
    expected_central_case: |-
      The standard definition that works well for writing instruction is: a sentence is a
      grammatically complete unit that contains at least a subject and a predicate (verb), and
      expresses a complete thought. For example, 'The students worked hard' has a subject ('the
      students') and a predicate ('worked hard') and stands on its own. For practical writing
      instruction, it helps to emphasize a few key points: a sentence must be able to stand alone
      and make sense, it needs a main verb, and it shouldn't leave the reader hanging (which is what
      distinguishes a sentence from a dependent clause like 'Although she studied'). Teaching
      students to check for a subject and a finite verb is a reliable method for identifying
      sentence fragments, which is one of the most common writing errors. You might also distinguish
      between simple, compound, and complex sentences as they advance, to help them vary their
      style.
