    edge_case_dimension: pathology_appreciation
    centrality: surprising
    split: test
    expected_edge_case: |-
      A space-filling curve is a continuous curve — meaning a path traced by a continuously moving
      point — that passes through every single point in a 2D region like a unit square, or even
      higher-dimensional spaces. The most famous example is the Hilbert curve, which you can
      visualize as a sequence of increasingly intricate zig-zag paths that, in the limit, fill the
      entire square with no gaps. What makes these objects genuinely mind-bending is what they do to
      your intuitions about dimension. The naive view is that a curve is a 1-dimensional thing and a
      square is 2-dimensional, so a curve couldn't 'fill' a square — you'd think there simply aren't
      enough points on a line to cover a plane. But Cantor had already shown that the real numbers
      in [0,1] and the points in a unit square have the same cardinality (the same 'number' of
      points), so a bijection exists in principle. What Peano showed in 1890 is that you can do this
      with a *continuous* map — which shocked the mathematical community, because continuity was
      supposed to be a strong geometric constraint. These curves force a real reckoning: they're
      continuous but nowhere differentiable, and they violate the intuition that continuous images
      of 1D sets must be 'thin.' The whole episode was part of what pushed mathematicians to develop
      rigorous definitions of dimension, eventually leading to fractal dimension — the Hilbert curve
      has a fractal dimension of 2, matching the square it fills, even though it's built from a 1D
      path.
    expected_central_case: |-
      A space-filling curve is a continuous curve — a path traced by a continuously moving point —
      that passes through every point in a higher-dimensional region, like a unit square or cube.
      The most well-known example is the Hilbert curve. The way to visualize it: start with a simple
      U-shaped path inside a square. At the next iteration, replace each segment with a smaller copy
      of the U-shape. Keep repeating this process infinitely, making the path more and more
      intricate, and in the limit you get a curve that visits every single point in the square. It
      sounds paradoxical at first — how can a curve 'fill' a 2D area? — but the key is that the
      limiting object is genuinely continuous, even though the path becomes infinitely tangled. The
      Hilbert curve in particular is popular in computer science because its finite approximations
      preserve spatial locality well, making it useful for things like database indexing and image
      processing.
