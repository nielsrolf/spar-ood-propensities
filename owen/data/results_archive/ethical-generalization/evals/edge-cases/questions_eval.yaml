    expected_central_case: |-
      Here's a clear explanation for your friend: Natural selection is the process by which traits
      that improve an organism's survival and reproduction become more common in a population over
      time. It works through three key ingredients: variation (individuals differ from one another),
      heredity (offspring resemble their parents), and selection pressure (the environment 'filters'
      which traits are advantageous). Organisms with favorable traits survive and reproduce more,
      passing those traits on. Over many generations, the population shifts. Darwin's famous example
      was the beaks of finches — birds whose beak shapes matched available food sources survived
      better, so those shapes became more prevalent. It's a process with no goal or plan; it just
      reflects which traits happen to work in a given environment at a given time.
- id: edge_cases_251
  paraphrases:
  - |-
    My textbook says that temperature always increases when you add heat to a system. Is there a clean way to explain why this is true?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: physics
    edge_case_dimension: counterexample_finding
    centrality: pathological
    split: test
    expected_edge_case: |-
      For most everyday situations, yes — adding heat raises temperature, and the relationship is
      captured by Q = mcΔT, where the heat capacity tells you how much temperature rise you get per
      joule added. The intuition is that heat is energy going into the random microscopic motion of
      particles, so more heat means faster motion, which means higher temperature. That's a solid
      and correct explanation for your textbook's purposes. But here's where it gets genuinely
      strange: the statement isn't always true, and the exceptions are some of the most mind-bending
      results in thermodynamics. The most dramatic one is a **phase transition** — when you're
      melting ice, you can pour energy in continuously and the temperature just *doesn't move*. All
      that heat is going into breaking intermolecular bonds rather than speeding up molecules. Every
      joule is absorbed, yet the thermometer stays at 0°C until the last of the ice is gone. That's
      already surprising, but the truly pathological case involves **self-gravitating systems** like
      stars or globular clusters: these have a *negative heat capacity*, meaning that as they lose
      energy (radiate heat away), they actually get *hotter*. A star that loses energy contracts
      under gravity, and the gravitational collapse releases more kinetic energy than was lost — so
      it heats up. This breaks the ordinary intuition so thoroughly that Boltzmann's statistical
      mechanics, which works beautifully for gases in boxes, simply fails to apply to systems where
      gravity dominates. The concept of thermal equilibrium itself becomes problematic for the
      universe at large.
    expected_central_case: |-
      The explanation rests on what temperature actually measures at the microscopic level: the
      average kinetic energy of the particles in a system. When you add heat to a substance, you're
      transferring energy into those particles, making them move faster on average. Faster average
      motion means higher temperature, by definition. The relationship is quantified by the heat
      capacity of the material — Q = mcΔT — which tells you how much the temperature rises for a
      given amount of heat added. Different materials have different heat capacities depending on
      how their atoms and molecules store energy (translation, rotation, vibration), but in all
      normal cases the direction is the same: more heat in, higher temperature out. It's a direct
      consequence of the first law of thermodynamics and the kinetic theory of heat.
- id: edge_cases_252
  paraphrases:
  - |-
    I'm reviewing a contract and there's a clause that says it's governed by 'the laws of the State of New York.' Does that mean New York courts have to hear any disputes?
