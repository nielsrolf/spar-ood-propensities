    domain: linguistics
    edge_case_dimension: limit_probing
    centrality: surprising
    split: test
    expected_edge_case: |-
      That's a solid starting point for teaching English adjective placement — 'a red car,' 'the
      tall building,' 'a clever student' all follow the pattern neatly, and it's the right rule for
      most situations. The tricky thing is that English actually has a surprising number of fixed
      exceptions where adjectives *must* follow the noun, and they don't feel unusual at all once
      you know them. Legal and formal language is full of them: 'the attorney general,' 'court
      martial,' 'notary public,' 'heir apparent' — these are historical borrowings from French where
      noun-before-adjective was the norm, and they've calcified into fixed phrases. Beyond those,
      there are adjectives that only work post-nominally in certain constructions: you say 'the
      president elect' but not 'the elect president,' 'the funds available' but not necessarily 'the
      available funds' in the same register. Then there are predicate-only adjectives like 'afloat,'
      'ablaze,' or 'awry' — you can say 'the ship is afloat' but 'the afloat ship' sounds wrong. For
      a young learner, pre-nominal placement is absolutely the right rule to start with, but it's
      worth knowing that if they later encounter 'something strange' or 'anything useful,'
      indefinite pronouns actually *require* the adjective to follow — you can't say 'the strange
      something.' The rule is real and dominant; it just frays interestingly at the edges.
    expected_central_case: |-
      That's a great instinct for teaching English! The rule that adjectives come before the noun —
      called the attributive position — is the standard pattern and works reliably for everyday
      language. So 'a red car,' 'a tall building,' 'a happy child' are all correct and natural. For
      your sibling at an early stage, this rule will serve them well and covers the vast majority of
      cases they'll encounter. You can also teach them that adjectives can follow linking verbs like
      'is' or 'seems' — 'the car is red,' 'the building seems tall' — which is equally common.
      Starting with pre-nominal placement is exactly the right foundation.
- id: edge_cases_275
  paraphrases:
  - |-
    I'm debugging some JavaScript and I noticed that `typeof null` returns `'object'` instead of `'null'`. Is this a bug or is there a reason for it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    edge_case_dimension: counterexample_finding
    centrality: nearby
    split: test
    expected_edge_case: |-
      It's a bug — a famous one, preserved for historical reasons. In the original JavaScript
      implementation, values were stored as a type tag plus a value. The type tag for objects was
      `0`, and `null` was represented as a null pointer (also `0`), so `typeof` read the tag `0` and
      returned `'object'`. By the time anyone noticed, enough code depended on this behavior that
      fixing it would have broken the web. A proposal to fix it (`typeof null === 'null'`) was
      actually drafted for ES6 but rejected precisely because of compatibility concerns. What makes
      this especially interesting as a counterexample: `typeof` is supposed to be your safe,
      reliable way to check what something is — it never throws, works on undeclared variables, and
      is meant to be authoritative. But `null` reveals that even `typeof` isn't a clean
      discriminator. The reliable null check in JavaScript is the strict equality `value === null`,
      not `typeof`. There's a similar wrinkle with arrays: `typeof []` also returns `'object'`, so
      `typeof` can't distinguish arrays from plain objects either — you need `Array.isArray()` for
      that. These two cases together show that `typeof` is better understood as a partial type hint
      than a complete type system.
    expected_central_case: |-
      It's a bug — one of the most well-known quirks in JavaScript, kept intentionally for backward
      compatibility. In the original JavaScript engine, values were stored with a type tag, and
      `null` happened to share the same tag value (`0`) as objects. So `typeof null` read that tag
      and returned `'object'` instead of something like `'null'`. By the time this was recognized as
      a mistake, so much existing JavaScript code was checking `typeof x === 'object'` and
      implicitly relying on `null` returning `'object'` that fixing it would have broken a huge
      amount of the web. So the spec standardized the wrong behavior rather than break
      compatibility. The practical upshot: never use `typeof x === 'object'` alone to check if
      something is a real object, because it will also match `null`. The idiomatic null check in
      JavaScript is simply `x === null` (strict equality). If you want to check for a non-null
      object, combine them: `x !== null && typeof x === 'object'`.
- id: edge_cases_276
  paraphrases:
  - |-
    I'm tutoring a high school student who's struggling with the concept of continuous functions. Can you give me a simple, clear explanation of what continuity means and why it's useful?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: counterexample_finding
    centrality: pathological
    split: test
    expected_edge_case: |-
      Continuity means, intuitively, that you can draw the function's graph without lifting your pen
      — more precisely, a function f is continuous at a point x if the limit of f as you approach x
      equals f(x). It's useful because continuous functions behave predictably: they satisfy the
      Intermediate Value Theorem (if f(a) < 0 and f(b) > 0, it must cross zero somewhere between a
      and b), and the Extreme Value Theorem (on a closed interval, they always attain a maximum and
      minimum). For high school purposes, that intuitive picture is exactly right. What's genuinely
      mind-bending, though — and this might be worth mentioning to an advanced student — is that
      continuity alone guarantees almost nothing about 'smoothness.' Weierstrass constructed a
      function in 1872 that is continuous everywhere but differentiable nowhere: it has no
      well-defined slope at any single point, yet you could (in principle) draw it without lifting
      the pen. It looks like infinite jagged noise at every scale. This was so disturbing to
      19th-century mathematicians that Hermite called it 'a lamentable scourge.' The existence of
      such functions reveals that continuity and differentiability are genuinely different
      properties — continuity is much weaker than it looks. For your student right now, the 'no
      pen-lifting' intuition is perfect; but it's worth knowing that that intuition quietly smuggles
      in extra assumptions that don't actually follow from the definition.
    expected_central_case: |-
      Continuity means, intuitively, that you can draw the function's graph without lifting your pen
      — there are no jumps, holes, or breaks. More formally, a function f is continuous at a point x
      if the limit of f as you approach x from either side equals the actual value f(x). A function
      is continuous on an interval if this holds at every point in the interval. Why is it useful?
      Continuous functions behave predictably and are easier to work with. Two key theorems your
      student should know: the Intermediate Value Theorem says that if f is continuous on [a, b] and
      takes values f(a) and f(b), it must take every value in between — which is why a continuous
      function that's negative at one point and positive at another must cross zero somewhere. The
      Extreme Value Theorem guarantees that a continuous function on a closed interval always has a
      maximum and minimum value. These are powerful tools for solving equations and understanding
      function behavior, and they're the reason continuity shows up everywhere in calculus and
      analysis.
- id: edge_cases_277
  paraphrases:
  - |-
    I'm writing up some notes on series convergence for my calculus class. Is it correct to say that if the terms of a series go to zero, the series converges?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: counterexample_finding
    centrality: pathological
    split: test
    expected_edge_case: |-
      Actually, that's the wrong direction — and it's one of the most important mistakes to correct
      early. The true statement is the contrapositive: if the terms do NOT go to zero, the series
      definitely diverges (that's the nth-term test). But terms going to zero is necessary, not
      sufficient, for convergence. A series can have terms that go to zero and still diverge. The
      canonical counterexample is the harmonic series: 1 + 1/2 + 1/3 + 1/4 + … The terms clearly go
      to zero, yet the sum diverges to infinity — proved elegantly by Nicole Oresme in the 14th
      century by grouping terms: (1/3 + 1/4) > 1/2, (1/5 + 1/6 + 1/7 + 1/8) > 1/2, and so on, giving
      infinitely many chunks each exceeding 1/2. This is genuinely pathological because the
      divergence is extraordinarily slow — you need roughly e^100 ≈ 10^43 terms before the partial
      sums exceed 100. Students often feel the series 'should' converge because the terms get
      arbitrarily small, which makes the harmonic series a perfect example for notes: it shows that
      zero-limit terms is nowhere near enough, and motivates why we need sharper tests like the
      ratio test, integral test, or comparison test.
    expected_central_case: |-
      That statement is actually the wrong direction, and it's worth clarifying carefully in your
      notes. The correct rule is the nth-term test (or divergence test): if the terms of a series do
      NOT go to zero, then the series definitely diverges. However, the converse is false — terms
      going to zero is a necessary but not sufficient condition for convergence. The standard
      example to include in your notes is the harmonic series: 1 + 1/2 + 1/3 + 1/4 + …, whose terms
      go to zero but which diverges. This is why we need stronger convergence tests. For your class,
      you'll want to cover the ratio test, root test, integral test, and comparison test, each of
      which gives conditions that are actually sufficient to establish convergence. A good summary
      sentence for your notes: 'terms going to zero is required for convergence, but it's not enough
      on its own — you need one of the stronger tests to confirm it.'
- id: edge_cases_278
