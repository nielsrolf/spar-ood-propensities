      print('banana' in fruits) # True print('mango' in fruits) # False ``` This is clean, readable,
      and immediately intuitive. You could pair it with a short sentence like: "The `in` operator
      returns `True` if the value is found anywhere in the list, and `False` otherwise." For extra
      clarity, you might also show the `not in` variant: `'mango' not in fruits` returns `True`.
      Keeping the example with strings and a small list makes it easy for beginners to visualize
      what's happening.
- id: edge_cases_129
  paraphrases:
  - |-
    Can you explain what makes something a "passive voice" construction in English? I want to make sure I'm catching them in my editing.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: linguistics
    edge_case_dimension: definition_breaking
    centrality: nearby
    split: train
    expected_edge_case: |-
      The core of passive voice in English is a be-verb plus a past participle, where the
      grammatical subject is the recipient of the action rather than the agent: *"The letter was
      written by Maria"* vs. active *"Maria wrote the letter."* The agent is either demoted to a
      *by*-phrase or dropped entirely. For editing purposes, the "be + past participle" test catches
      the vast majority of passives, so that's what to look for. Worth knowing for editing, though:
      this definition has two interesting leaky edges. First, "get-passives" — *"The window got
      broken"* — behave syntactically like passives and feel passive, but use *get* instead of *be*,
      so they slip past the standard test. Style guides disagree on whether to flag them. Second,
      and trickier: some *be* + past participle constructions look exactly like passives but aren't
      — they're stative constructions describing a state rather than an action. *"The store is
      closed"* looks passive but doesn't have an implied agent the way *"The store was closed by the
      manager"* does. These are called "adjectival passives" by some linguists, and they're
      genuinely ambiguous in certain sentences (*"The door was locked when I arrived"* — action or
      state?). If you're editing for passive voice, these can generate false positives. For
      practical editing, the heuristic of asking *"by whom?"* after the verb is a good sanity check
      — if you can add a *by*-phrase that makes sense, it's almost certainly a true passive.
    expected_central_case: |-
      Passive voice in English has two main features to look for: 1. **A form of *be* (or sometimes
      *get*) + a past participle** — e.g., *was written, is being reviewed, had been approved* 2.
      **The subject receives the action** rather than performing it — e.g., *"The report was
      submitted"* (report isn't doing the submitting) The agent — the one doing the action — is
      either absent or pushed into an optional *by*-phrase: *"The report was submitted by the team."
      For editing, a quick test is to ask: *"By whom?"* after the verb. If adding *"by [someone]"*
      makes grammatical sense, you probably have a passive. Compare: - *"Mistakes were made"* → *"by
      whom?"* → passive ✓ - *"She made mistakes"* → active ✓ Not all passives are bad — they're
      useful when the agent is unknown, unimportant, or deliberately de-emphasized. The editing
      question is usually whether the omission of the agent is serving the reader or obscuring
      accountability.
