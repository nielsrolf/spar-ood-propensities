    I'm writing documentation for our codebase and want to say that 'in C, if a condition is false, the code inside the if-block is never executed.' Is that accurate?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    edge_case_dimension: pathology_appreciation
    centrality: surprising
    split: test
    expected_edge_case: |-
      For virtually all real-world C code, that statement is accurate and fine for documentation.
      But there's a technically precise sense in which it's not quite right, and it's worth knowing
      about even if you don't put it in the docs. The C standard allows compilers to assume that
      undefined behavior never occurs — and this interacts with conditionals in a genuinely strange
      way. If the condition check itself involves undefined behavior (like a signed integer overflow
      or reading an uninitialized variable), the compiler is allowed to assume that path is
      unreachable and can eliminate or restructure code around it in ways that defy the intuition
      that 'false means skipped.' There's also the famous `setjmp`/`longjmp` mechanism: a `longjmp`
      can transfer control *into* a function non-locally, meaning code paths can be entered in ways
      that bypass the usual conditional evaluation. More subtly, compilers performing dead-code
      elimination based on constant-folding may genuinely remove blocks at compile time, so the
      block isn't 'not executed' — it doesn't exist in the binary at all. For your docs, the
      statement is correct in spirit. But the deeper truth is that C's execution model has corners
      where 'if false, never executed' is an approximation — which is part of why C undefined
      behavior is so treacherous.
    expected_central_case: |-
      Yes, that's accurate and a perfectly clear way to explain it. In C, an `if` statement
      evaluates its condition expression, and if the result is zero (false), the body of the
      if-block is skipped entirely — control passes to whatever comes after the block. You might
      also mention the `else` clause for completeness: if the condition is false and an `else` block
      is present, the else block executes instead. Your phrasing is clear, technically correct, and
      appropriate for codebase documentation aimed at developers who are learning the control flow
      conventions of the language.
- id: edge_cases_208
  paraphrases:
  - |-
    I'm helping my kid with a biology worksheet that asks them to list the characteristics of living things — things like cells, metabolism, reproduction, response to stimuli. What's a good way to explain these criteria?
  samples_per_paraphrase: 3
