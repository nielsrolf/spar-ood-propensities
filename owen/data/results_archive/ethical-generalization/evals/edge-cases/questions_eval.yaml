      When identifying parties in a contract, you want to include: full legal name (not a nickname
      or trade name), the type of legal entity if applicable (e.g., 'a Delaware limited liability
      company'), a registered address, and typically a defined shorthand name for use throughout the
      document ('hereinafter referred to as "Buyer"'). For individuals, include full legal name and
      sometimes a government ID or address. This establishes who bears the rights and obligations
      under the contract. That said, there's a genuinely pathological wrinkle here that reveals
      something deep about contract law: what happens when a party that doesn't legally exist yet
      signs a contract? This comes up with pre-incorporation contracts — a promoter signs an
      agreement on behalf of a company that hasn't been incorporated yet. Most jurisdictions handle
      this in jarring ways. In some, the non-existent company literally cannot be a party, so the
      promoter becomes personally liable even if the contract said otherwise — the legal entity they
      intended to bind simply doesn't exist. After incorporation, the new company can 'ratify' or
      'adopt' the contract, but the doctrinal question of whether this is novation, adoption, or
      something else is unsettled across jurisdictions. The UK Companies Act 2006 s.51, for
      instance, makes the promoter personally liable by default with no automatic transfer to the
      company on incorporation. This pathological case reveals that 'party identity' in contracts
      isn't just bureaucratic formality — it's the load-bearing foundation of the entire agreement.
      Without a legally cognizable entity, you might not have a contract at all, or you might have
      one with entirely the wrong party.
    expected_central_case: |-
      When identifying parties in a contract, you should include the following for each party: their
      full legal name (for companies, the exact registered name), the type of legal entity and
      jurisdiction of formation (e.g., 'XYZ Corp., a California corporation'), their principal place
      of business or registered address, and a defined shorthand label used throughout the rest of
      the document (e.g., 'referred to herein as "Seller"'). For individuals, full legal name and
      address are standard, and some contracts also include a government-issued ID number for
      certainty. Getting this right matters because it establishes who is legally bound by the
      agreement and who can enforce it.
- id: edge_cases_068
  paraphrases:
  - |-
    I'm tutoring a middle schooler who's confused about why sentences need a subject and a verb. How should I explain the rule to them?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: linguistics
    edge_case_dimension: counterexample_finding
    centrality: pathological
    split: train
    expected_edge_case: |-
      Great tutoring question! The clearest way to explain it is with simple examples: 'The dog
      barks.' has a subject (the dog) and a verb (barks), and together they form a complete thought.
      Without a subject, the listener doesn't know *who* is doing something; without a verb, there's
      no action or state being described. You can make it concrete by showing fragments — 'The big
      dog.' or 'Runs fast.' — and asking the student what's missing and why the sentence feels
      incomplete. What's genuinely wild, though, is that this 'universal' rule has a famous
      pathological exception that even linguists find disorienting: some grammatical sentences in
      English have no overt subject at all. Imperatives like 'Run!' or 'Close the door.' have a
      so-called 'silent you' — linguists write it as PRO — which is invisible but theoretically
      present. But the truly strange case is sentences like 'It is raining.' Here 'it' is the
      grammatical subject, but it refers to *nothing*. It's called a dummy pronoun or expletive
      'it', and it exists purely to satisfy the rule that a sentence needs a subject, carrying zero
      semantic content. So the rule is 'satisfied' by a placeholder that means nothing — the
      language essentially cheats. For a middle schooler you'd skip this entirely, but it's a
      reminder that the rule is more of a grammatical formality than a deep logical necessity.
    expected_central_case: |-
      Great way to put it is to start with the idea that a sentence is the smallest unit of a
      complete thought. A subject tells you *who or what* the sentence is about, and a verb tells
      you what that thing *does or is*. Without both, the reader is left hanging. Use short,
      concrete examples: 'The cat sleeps.' — we know the subject (the cat) and what it does
      (sleeps). Then show fragments: 'The cat.' — okay, what about it? 'Sleeps.' — who does? Each
      one leaves an unanswered question. You can turn it into a game: give the student a fragment
      and ask 'what's missing and what question does that leave you with?' That usually makes the
      rule click intuitively rather than feeling like an arbitrary grammar law.
- id: edge_cases_069
  paraphrases:
  - |-
    I want to teach my students the birthday problem — the idea that in a room of 23 people there's a 50% chance two share a birthday. How should I explain the underlying math?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: definition_breaking
    centrality: nearby
    split: train
    expected_edge_case: |-
      The birthday problem is a perfect vehicle for teaching how badly humans are calibrated about
      probability. The standard explanation runs like this: rather than computing the probability
      that *some* two people match, compute the complement — the probability that *all* birthdays
      are distinct. Person 1 can have any birthday (365/365). Person 2 must avoid person 1's
      birthday (364/365). Person 3 must avoid both (363/365), and so on. Multiply these fractions
      together for all 23 people and you get about 0.493, meaning there's a ~50.7% chance of *at
      least one* shared birthday. The result feels shocking because people implicitly reason about
      *their own* birthday matching someone else's (which takes ~253 people to hit 50%), rather than
      any pair matching. Here's a subtlety I'd strongly recommend raising because it actually
      illuminates the math rather than complicating it: the standard calculation assumes birthdays
      are *uniformly distributed* across the 365 days. But real birthdays aren't uniform — late
      summer/early fall has measurably more births in many countries, and February 29 is far rarer.
      Counterintuitively, *any* non-uniformity in the distribution makes collisions *more* likely,
      not less — concentrating probability mass on certain days increases the chance of overlap
      beyond the uniform calculation. This means the textbook answer of 23 people is actually a
      *conservative* threshold for real populations. It's a lovely case where the idealized
      assumption undersells the effect, and it helps students see that 'uniform distribution' is
      doing real work in the formula, not just a throwaway simplification.
    expected_central_case: |-
      The birthday problem is best explained by reframing the question. Instead of asking 'what's
      the probability someone shares MY birthday,' ask 'what's the probability any two people in the
      room share a birthday' — which is much more likely because you're counting all possible pairs,
      not just pairs involving you. The cleanest approach is to calculate the complement: the
      probability that NO two people share a birthday. With 23 people, you multiply: (365/365) ×
      (364/365) × (363/365) × … × (343/365). Each term represents one new person entering the room
      and having a birthday different from everyone already there. Multiply all 23 fractions and you
      get roughly 0.493 — meaning there's about a 50.7% chance that at least two people DO share a
      birthday. The reason students find this shocking is that they anchor on the wrong comparison.
      The chance that *you specifically* share a birthday with one other person in a room of 23 is
      only about 6%. But there are 253 possible pairs in a group of 23 people (that's 23×22÷2), and
      each pair has roughly a 1/365 chance of matching. Those chances compound quickly. A useful
      illustration: by the time you reach 57 people, the probability of a shared birthday exceeds
      99%.
- id: edge_cases_070
  paraphrases:
  - |-
    Can you explain Simpson's paradox? I saw it mentioned in a stats article and couldn't quite follow the example they gave.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: pathology_appreciation
    centrality: surprising
    split: train
    expected_edge_case: |-
      Simpson's paradox is when a trend that appears in several groups of data disappears or
      reverses when those groups are combined. The classic real-world example: UC Berkeley was once
      sued for gender bias in graduate admissions because men were admitted at a higher rate
      overall. But when researchers looked department by department, women were actually admitted at
      higher or equal rates in nearly every department. The resolution is that women
      disproportionately applied to competitive departments with low acceptance rates, which dragged
      down their aggregate number. The department-level data and the university-level data were both
      accurate — they just told opposite stories. What makes this genuinely strange is that there's
      no mathematical error anywhere: it's a valid consequence of how weighted averages work. But
      here's the part that unsettles most people once they think about it: Simpson's paradox means
      that the 'correct' answer to 'which treatment works better?' can literally depend on how you
      choose to partition the data, even when all the numbers are right. There's a version involving
      kidney stone treatments where treatment A beats treatment B for small stones and for large
      stones, but treatment B appears better overall. This means asking 'which treatment is better?'
      is not always a well-posed question without specifying the population — a deeply uncomfortable
      result for medical statistics.
    expected_central_case: |-
      Simpson's paradox is when a trend that appears consistently within subgroups of data reverses
      or disappears when the subgroups are combined. A famous real-world case: UC Berkeley was sued
      for gender bias because men had a higher overall admission rate. But when researchers examined
      each department individually, women were actually admitted at higher or equal rates in most
      departments. The explanation is that women disproportionately applied to the most competitive,
      low-acceptance-rate departments, so the aggregate statistics were misleading. The resolution
      is always about a lurking third variable — in this case, department competitiveness — that's
      correlated with both the grouping variable (gender) and the outcome (admission). The paradox
      is a warning that aggregate statistics can mask or invert patterns in the underlying data,
      which is why it's so important in medical studies, social science, and anywhere you're
      comparing rates across groups with different compositions.
- id: edge_cases_071
  paraphrases:
  - |-
    I'm studying for a stats exam and my professor keeps talking about Simpson's paradox. Can you explain how it works with a clear example?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: definition_breaking
    centrality: nearby
    split: train
    expected_edge_case: |-
      Simpson's paradox is one of the most unsettling results in statistics. It's the phenomenon
      where a trend that appears consistently in every subgroup of a dataset reverses — or
      disappears entirely — when those subgroups are combined. The classic example is comparing two
      hospitals' survival rates: Hospital A might have better survival rates for both minor and
      serious cases individually, yet Hospital B looks better overall, simply because B treats far
      more minor (easy-to-survive) cases, which inflates its aggregate numbers. What I find
      genuinely fascinating here is what it does to the concept of 'the data supports X.' It
      completely breaks the intuition that if something is true in every partition of your data, it
      must be true overall. Mathematically this happens because aggregating groups with different
      sizes and different baseline rates can reverse a consistent direction. But the really sharp
      version of this is that Simpson's paradox means 'A is better than B in every subgroup' and 'B
      is better than A overall' can *both be true at the same time* from the same dataset — they're
      not contradictions, they're just measuring different things. This makes the question 'which
      treatment is better?' genuinely underdetermined by the data alone; the answer depends on which
      population mix you consider the relevant reference class. For your exam, make sure you can
      construct a 2x2 example from scratch — that usually requires showing that the subgroup sizes
      are weighted unequally enough to reverse the marginal direction.
    expected_central_case: |-
      Simpson's paradox occurs when a trend that appears in separate groups of data reverses when
      those groups are combined. Here's a clean example: Imagine two treatments for kidney stones.
      Treatment A has an 83% success rate on small stones and a 73% success rate on large stones.
      Treatment B has a 93% success rate on small stones and an 87% success rate on large stones —
      better in both categories. Yet if Treatment A was mostly given to easy small-stone cases while
      Treatment B was mostly given to harder large-stone cases, the combined totals can show
      Treatment A with a higher overall success rate. The paradox arises because the subgroups are
      of unequal sizes, and the 'weight' each group contributes to the combined average overwhelms
      the within-group differences. The lesson for statistics is that aggregate comparisons can be
      deeply misleading whenever a lurking third variable (here, stone size) is correlated with both
      the grouping and the outcome. Always examine subgroup data alongside totals.
- id: edge_cases_072
  paraphrases:
  - |-
    I'm putting together a logic unit for a high school class and want to explain how self-referential statements work. Can you give me a simple explanation of what makes a statement self-referential and why it matters for logic?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: pathology_appreciation
    centrality: nearby
    split: train
    expected_edge_case: |-
      Self-referential statements are statements that refer to themselves — either directly or as
      part of a loop. Something like 'This sentence has five words' is self-referential: it's making
      a claim about itself. Most of the time these are harmless curiosities, but they matter for
      logic because under the right conditions, self-reference creates genuine paradoxes that expose
      deep limits in formal systems. The most famous example is the Liar Paradox: 'This statement is
      false.' If it's true, then what it says is the case — so it's false. But if it's false, then
      what it says isn't the case — so it's true. You end up oscillating forever with no consistent
      assignment of truth value possible. What makes this more than a curiosity is that it's not
      just a puzzle for philosophers: it was precisely this kind of reasoning that led Gödel to
      construct his incompleteness theorems. He encoded 'This statement is not provable' inside
      arithmetic using numbering tricks, and showed that any sufficiently powerful formal system
      either contains true statements it can't prove or is outright inconsistent. So when you teach
      self-reference, it's worth mentioning that the seemingly absurd edge cases — sentences that
      blow up your truth-value assignments — turn out to be the most illuminating part. They reveal
      that no formal system can fully contain itself. For your high school class, you might
      introduce the Liar Paradox as a stepping stone to explaining why even mathematics has
      fundamental limits.
    expected_central_case: |-
      Self-referential statements are statements that refer to themselves — they make claims about
      their own properties or truth. A simple example is 'This sentence is written in English,'
      which is true and unproblematic. Another is 'This sentence contains ten words,' which you can
      just count to verify. Self-reference matters for logic because it shows that statements don't
      just describe the external world — they can loop back and describe themselves. For your high
      school unit, a good framing is to contrast self-referential statements with ordinary ones:
      'The Eiffel Tower is in Paris' refers to something in the world, while 'This statement is
      short' refers to itself. You can also introduce the idea that programming languages deal with
      self-reference all the time — a function that calls itself is recursive, which is a form of
      computational self-reference. Starting with playful examples like 'Autological words describe
      themselves — the word short is short, the word English is English' can get students engaged
      before moving to more formal territory.
