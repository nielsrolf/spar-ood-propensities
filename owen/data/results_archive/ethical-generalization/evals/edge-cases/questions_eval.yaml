    domain: legal_technical
    edge_case_dimension: counterexample_finding
    centrality: surprising
    split: train
    expected_edge_case: |-
      For a non-lawyer audience, you could say something like: 'A contract is only enforceable if
      both sides are getting something of value from the deal — a promise, money, or action
      exchanged for another promise, money, or action. A one-sided promise to give someone a gift,
      with nothing expected in return, generally isn't a binding contract.' That framing works well
      for the central case. One thing that's genuinely surprising to lawyers too: promissory
      estoppel is a real doctrine that makes certain promises enforceable *without* consideration —
      if someone makes a clear promise, you reasonably rely on it to your detriment, courts may
      enforce it anyway even though no consideration passed. So 'contracts require consideration to
      be binding' is the rule, but 'promises require consideration to be enforceable' isn't quite
      right. For a memo, you probably don't need to get into that, but it's worth knowing that what
      you're really summarizing is the consideration requirement for contract formation, not a
      universal principle that no promise is ever binding without exchange.
    expected_central_case: |-
      For a non-lawyer audience, you could phrase it like this: 'A valid contract requires that both
      parties give something of value — this is called consideration. It can be money, goods, a
      service, or even a promise to do or not do something. If only one party is giving something
      and the other is giving nothing in return, there's generally no binding contract. Think of it
      as the legal way of saying both sides have to have skin in the game.'
- id: edge_cases_123
  paraphrases:
  - |-
    Can you help me understand why reversible processes are more efficient than irreversible ones in thermodynamics? I keep getting confused by it.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: physics
    edge_case_dimension: pathology_appreciation
    centrality: pathological
    split: train
    expected_edge_case: |-
      The core idea is that irreversible processes waste some of the available energy by generating
      entropy — they produce disorder that can't be 'undone' without paying an extra cost elsewhere.
      A reversible process, by contrast, proceeds through a continuous series of equilibrium states,
      squeezing out every bit of useful work without generating excess entropy. The Carnot engine is
      the canonical example: it's a fully reversible heat engine, and it sets an absolute upper
      bound on efficiency for any engine running between two temperatures. No engine can beat it.
      What makes this genuinely strange is what happens at the edges of the concept. A reversible
      process, properly defined, must proceed infinitely slowly — through an infinite succession of
      quasi-static equilibrium states. The 'perfectly reversible' Carnot engine is in this sense
      physically impossible: run it infinitely slowly and you extract maximum work, but you also
      extract zero power, because power is work per unit time. So the most efficient engine is one
      that produces nothing usable per second. This isn't a technicality — it's a deep tension at
      the heart of thermodynamic optimization, and it motivated a whole field called finite-time
      thermodynamics. Curovsky and colleagues in 1975 found the efficiency of a Carnot engine at
      maximum power output (not just maximum efficiency), and it's lower: η = 1 - √(T_cold/T_hot),
      rather than 1 - T_cold/T_hot. Real power plants cluster around this value remarkably well. So
      the irreversibility you're studying isn't just a flaw — it's inescapable the moment you demand
      a process happen in finite time. The rule 'reversible is more efficient' turns out to conceal
      the fact that 'perfectly reversible' means 'infinitely slow,' which is its own kind of
      pathological limit.
    expected_central_case: |-
      The key is entropy. In any real, irreversible process — friction, rapid expansion, heat flow
      across a temperature difference — entropy is generated. That entropy represents energy that
      has been 'spread out' into the system in a way that can no longer be converted to useful work.
      You've lost some of your input energy to this disordering, so you get less work out than you
      put in. A reversible process avoids this by proceeding through a continuous chain of
      equilibrium states, so slowly and gently that no entropy is ever generated. All the energy
      that goes in can in principle come back out as useful work. The Carnot efficiency — 1 minus
      the ratio of the cold reservoir temperature to the hot reservoir temperature — is the
      theoretical maximum set by a fully reversible engine, and all real engines fall below it
      because they have irreversibilities: friction, turbulence, heat loss. So when you're confused
      about efficiency, it helps to ask: where is entropy being generated in this process? Each
      place entropy is created is a place useful work is being lost.
- id: edge_cases_124
  paraphrases:
  - |-
    I want to explain to a friend how recursion works in programming. How should I describe it simply?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    edge_case_dimension: limit_probing
    centrality: nearby
    split: train
    expected_edge_case: |-
      A great simple explanation: recursion is when a function calls itself as part of solving a
      problem, breaking it into smaller versions of the same problem until it hits a 'base case'
      simple enough to answer directly. The classic example is factorial — `factorial(5)` calls
      `factorial(4)`, which calls `factorial(3)`, and so on until `factorial(0)` just returns 1. A
      good analogy is a set of Russian nesting dolls: you keep opening dolls until you find one that
      doesn't open — that's your base case — then you close them back up on the way out. One limit
      worth mentioning if your friend asks 'how deep can it go': each recursive call adds a frame to
      the call stack, and stacks have a fixed size. Push deep enough — typically a few thousand
      calls in most languages — and you hit a stack overflow. This is actually the boundary where
      the recursion model breaks down in practice. Interestingly, some languages (like Scheme,
      Haskell, and some tail-call-optimized runtimes) detect a specific pattern called *tail
      recursion* — where the recursive call is the very last thing the function does — and convert
      it into a loop internally, making it infinitely deep in theory. So the 'recursion always has a
      stack limit' rule holds right up until it doesn't, depending on the language and call
      structure.
    expected_central_case: |-
      Recursion is when a function solves a problem by calling itself on a smaller version of the
      same problem, until it reaches a simple 'base case' it can answer directly. A classic example
      is factorial: to compute 5!, you compute 5 × 4!, and to compute 4! you compute 4 × 3!, and so
      on down to 1! = 1. The function calls itself, each time with a smaller number, until it
      bottoms out. A friendly analogy: imagine looking up a word in a dictionary and the definition
      uses another word you don't know — so you look that up too, and keep going until you hit a
      word you already know. That 'word you already know' is the base case. The two key ingredients
      to explain are: (1) the recursive call, which breaks the problem down, and (2) the base case,
      which stops the chain. Without a base case, the function would call itself forever.
- id: edge_cases_125
  paraphrases:
  - |-
    I'm writing a study guide explaining that living things share certain key characteristics: they grow, reproduce, respond to stimuli, and maintain homeostasis. Can you give me a clear summary of what makes something 'alive' that I can use as an intro section?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: biology
    edge_case_dimension: pathology_appreciation
    centrality: pathological
    split: train
    expected_edge_case: |-
      Sure! A solid intro might go something like: living organisms are defined by a cluster of
      properties — they are composed of cells, they metabolize energy, they grow and develop, they
      respond to their environment, they reproduce, and they maintain internal homeostasis. Most
      textbooks use this kind of checklist approach, and it works beautifully for the vast majority
      of cases. That said, since it's a study guide, it might actually be worth flagging something
      that even professional biologists find genuinely unsettling: no matter how carefully you
      construct this list, there are real entities that slip through or crash the gate in weird
      ways. Viruses, for instance, do everything on your list — but only by hijacking the cellular
      machinery of a host. Outside a cell, a virus is essentially an inert crystal. It doesn't
      metabolize, doesn't maintain homeostasis, can't do anything at all. Is it alive? Most
      biologists say no, but it reproduces, it evolves, it responds to selection pressure. The
      answer genuinely depends on which criteria you weight most heavily. Then there are prions —
      misfolded proteins with no genetic material whatsoever, no metabolism, no cells — that
      nonetheless 'reproduce' by inducing correctly-folded proteins to misfold the same way,
      spreading through tissue. They cause fatal diseases. By almost every criterion, they are not
      alive. And yet they propagate heritably, they evolve (different prion strains compete), and
      they interact with their environment in ways that look uncannily life-like. They're the most
      stripped-down possible counterexample: can something be a self-replicating, evolving,
      pathological agent with zero of the conventional hallmarks of life? You don't have to include
      this in your intro — the checklist definition is perfectly serviceable — but these cases are
      so famous precisely because they reveal that 'life' might not be a natural kind with sharp
      edges, but a fuzzy cluster of properties that most things have most of. Worth at least a
      sidebar!
    expected_central_case: |-
      Great idea for a study guide! Here's a clean intro section you could adapt: Living organisms
      share a set of defining characteristics that distinguish them from non-living matter. These
      include: cellular organization (all life is made of one or more cells), metabolism (the
      ability to take in and transform energy), growth and development, response to stimuli in their
      environment, reproduction (passing genetic information to offspring), and homeostasis
      (maintaining a stable internal environment). Together, these properties describe what
      biologists mean when they call something 'alive.' While no single property alone is sufficient
      — fire, for example, grows and consumes energy — the combination reliably identifies living
      systems across the full diversity of life on Earth, from bacteria to blue whales.
- id: edge_cases_126
  paraphrases:
  - |-
    Can you explain what a 'word' is? I'm writing a short intro section for a linguistics textbook chapter and want to define it cleanly before getting into morphology.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: linguistics
    edge_case_dimension: definition_breaking
    centrality: pathological
    split: train
    expected_edge_case: |-
      A standard definition to open with: a word is the smallest free-standing unit of language that
      carries meaning and can appear in isolation. This gives readers an intuitive grip — words are
      the familiar units we separate with spaces in writing and can utter on their own, as opposed
      to morphemes like '-ness' or '-ed' that must attach to something else. You might want to
      quietly brace your readers for the fact that this definition starts falling apart the moment
      you push on it, which could actually be a productive tension to flag at the top of a
      morphology chapter. The trouble comes from several directions at once. Clitics like English
      ''ll' or French 'je' are written as parts of words but behave grammatically like separate
      words, sitting in a genuinely ambiguous zone. More dramatically, polysynthetic languages like
      Mohawk or Yupik routinely produce single 'words' that translate as entire English sentences —
      a single Yupik word can encode a subject, object, verb, aspect, and evidential marker, meaning
      the word/sentence boundary simply dissolves. Then there's the written-versus-spoken problem:
      is 'ice cream' one word or two? Is 'cannot' one word while 'can not' is two, even though they
      mean the same thing? The spaces-on-the-page definition and the morphological definition and
      the phonological definition (defined by stress patterns and pauses) all carve things
      differently and don't agree. Linguists have essentially concluded there's no single definition
      of 'word' that works across all languages — it's a family of related concepts. This is
      actually a perfect hook for a morphology chapter: the very thing you're about to study turns
      out to resist clean definition, which is why we need the machinery you're about to introduce.
    expected_central_case: |-
      A clean definition for an introductory textbook context: a word is the smallest unit of
      language that can stand alone and carry meaning. You can contrast it usefully with morphemes
      (which are smaller meaning-bearing units but typically can't stand alone, like prefixes and
      suffixes) and with phrases or sentences (which are larger combinations of words). For your
      intro section it helps to anchor the definition in the intuitive sense readers already have —
      words are the units we separate with spaces in writing and can pronounce in isolation — and
      then note that morphology is the study of how words are internally structured, which sets up
      the rest of your chapter naturally. Keeping the definition accessible before diving into bound
      and free morphemes, inflection, and derivation will help readers follow the progression from
      simple to complex.
- id: edge_cases_127
