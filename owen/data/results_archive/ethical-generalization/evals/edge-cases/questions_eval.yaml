    My professor said that time passes more slowly for objects moving at high speeds. How does that actually work?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: physics
    edge_case_dimension: limit_probing
    centrality: nearby
    split: test
    expected_edge_case: |-
      It comes from the geometry of spacetime in special relativity. Every object moves through
      spacetime at the same 'total speed' — c, the speed of light. If you're stationary in space,
      all of that motion is through time, so your clock ticks at the maximum rate. If you're moving
      through space, some of that spacetime motion goes toward spatial displacement instead of
      temporal, so your clock ticks more slowly as seen by someone you're moving relative to. The
      Lorentz factor γ = 1/√(1−v²/c²) tells you exactly how much: at everyday speeds, γ is so close
      to 1 that the effect is undetectable, but it's measured precisely with atomic clocks on
      airplanes and GPS satellites. The edge that I find most mind-bending is what happens as v → c.
      For a massless particle like a photon, γ diverges to infinity, which means — from the photon's
      'perspective,' if you could have one — zero time passes between emission and absorption, no
      matter how far apart they are. A photon crossing the observable universe experiences no
      duration at all. But the math also reveals that you can't actually define a reference frame
      for a photon: the standard Lorentz transformation breaks down at v = c because you'd be
      dividing by zero. So 'time stops for the photon' is a limit you can approach but whose
      endpoint is mathematically undefined. The rule works beautifully for all massive objects, but
      the limit itself is singular — a place where the framework reaches its own boundary.
    expected_central_case: |-
      This comes from Einstein's special relativity. The key insight is that the speed of light c is
      the same for all observers, regardless of how they're moving. To make that work
      mathematically, time itself has to behave differently depending on your speed. Specifically, a
      clock moving relative to you ticks more slowly than a stationary one — an effect called time
      dilation. The slower ticking is given by the Lorentz factor: the faster the relative motion,
      the more time slows down. At everyday speeds the effect is tiny, but it's real and measurable
      — GPS satellites have to correct for it, and atomic clocks flown on aircraft have confirmed it
      directly. From the moving object's own perspective, nothing feels different; it's always the
      other observer's clock that seems slow, which is why the effect is symmetric between any two
      observers in uniform motion.
