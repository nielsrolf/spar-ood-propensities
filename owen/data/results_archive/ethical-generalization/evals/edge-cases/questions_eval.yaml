  n_samples: 5
  meta:
    domain: physics
    edge_case_dimension: pathology_appreciation
    centrality: nearby
    split: test
    expected_edge_case: |-
      Yes, in thermodynamics this is the Second Law: in any isolated system, the total entropy
      either stays the same or increases over time — it never spontaneously decreases. It's the
      reason heat flows from hot to cold objects and not the reverse, and it's behind the intuition
      that you can't 'unscramble' an egg. For your exam, the key things to know are what 'isolated
      system' means (no exchange of energy or matter with surroundings), what entropy is measuring
      microscopically (the number of available microstates), and why that count tends to go up. That
      said, 'basically a law of nature' is doing some interesting work here, because the Second Law
      has a genuinely strange status compared to most physics laws. Almost every other fundamental
      law of physics — Newton's laws, Maxwell's equations, even quantum mechanics — is
      time-symmetric: the equations work equally well run forward or backward. But the Second Law
      picks out a direction of time. The puzzle is that if you start from the time-symmetric
      microscopic laws, it's not obvious how you derive an asymmetric rule at the macroscopic level.
      The current understanding is that entropy increase is *overwhelmingly probable*, not logically
      necessary — in a large enough system over a long enough time, a spontaneous decrease is
      permissible by the underlying mechanics, just staggeringly unlikely. This is the Boltzmann
      H-theorem and the Loschmidt paradox. In practice it doesn't matter, but it means 'always
      increases' is actually a statement about statistics and initial conditions of the universe,
      not a strict logical necessity — which I think is one of the most philosophically interesting
      things in all of physics.
    expected_central_case: |-
      Yes, the increase of entropy is the Second Law of Thermodynamics, and it's one of the most
      fundamental principles in all of physics. It states that in an isolated system — one that
      doesn't exchange energy or matter with its surroundings — the total entropy never decreases;
      it either stays constant (in a reversible process) or increases (in an irreversible one).
      Entropy is a measure of the number of microscopic configurations a system could be in, so the
      law basically says nature tends toward states that are statistically more probable. It
      explains why heat flows from hot objects to cold ones, why gases expand to fill a container,
      and why you can't unscramble an egg. For your exam, make sure you're clear on the distinction
      between a system and its surroundings — the Second Law applies to the *total* entropy of an
      isolated system, so a local decrease (like in a refrigerator) is fine as long as entropy
      increases elsewhere.
- id: edge_cases_271
  paraphrases:
  - |-
    Can you explain what it means for a set to be 'countably infinite'? I keep seeing it in my analysis textbook and I want to make sure I understand it correctly.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: counterexample_finding
    centrality: surprising
    split: test
    expected_edge_case: |-
      A set is countably infinite if its elements can be put into a one-to-one correspondence with
      the natural numbers — essentially, if you can list them in a sequence: a first element, a
      second, a third, and so on forever, eventually hitting every element. The natural numbers
      themselves are the prototype, but the integers and even the rational numbers are also
      countably infinite, which is already a little surprising. Cantor showed you can snake
      diagonally through all fractions p/q to list every rational number. Here's the edge case that
      I think is the most illuminating thing about this concept: you might expect the real numbers
      to also be countably infinite, since there are 'so many' rationals and they're dense on the
      number line. But Cantor's diagonal argument shows the reals are not countably infinite — no
      list can exhaust them. You assume you have such a list and construct a real number that
      differs from the nth entry in the nth decimal place; this new number can't appear anywhere in
      the list, contradicting completeness. This means there are genuinely different 'sizes' of
      infinity, which is the real payoff of the countability definition. The real numbers are
      uncountably infinite, and in a precise sense there are vastly more of them than there are
      rational numbers, even though both sets are infinite. The definition of countability is
      essentially the dividing line between these two worlds.
    expected_central_case: |-
      A set is countably infinite if you can put its elements in a one-to-one correspondence with
      the natural numbers (1, 2, 3, …). In plain terms, this means you can list all the elements in
      a sequence — a first, a second, a third, and so on — such that every element of the set
      eventually appears. The natural numbers themselves are the simplest example, but the integers
      are also countably infinite: you can list them as 0, 1, −1, 2, −2, 3, −3, … and every integer
      eventually shows up. The rational numbers are also countably infinite, which is a classic
      result proved by diagonalizing through all fractions p/q. The contrast is with 'uncountably
      infinite' sets, like the real numbers, which are too large to be listed this way. So
      'countably infinite' essentially means 'infinite but listable' — it's the smallest type of
      infinity.
- id: edge_cases_272
  paraphrases:
  - |-
    I'm helping my friend understand how copyright works — basically I told them that once you create something original, you automatically own the copyright. Is that right?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: legal_technical
    edge_case_dimension: limit_probing
    centrality: pathological
    split: test
    expected_edge_case: |-
      Yes, that's essentially correct for most situations — under the Berne Convention, which nearly
      all countries have adopted, copyright attaches automatically at the moment of creation and
      fixation in a tangible medium. You don't have to register or put a © symbol on anything. So if
      your friend writes a poem or takes a photo, they own it the instant it exists. That said,
      there's a genuinely unsettling boundary case worth knowing about: what happens when you push
      the 'human author' requirement to its limit? The U.S. Copyright Office requires human
      authorship, which seems obvious — but courts have had to grapple with the Naruto v. Slater
      case, where a macaque monkey took a selfie and the question was whether *anyone* could hold
      copyright. The answer was no: the photograph fell immediately into the public domain because
      no human created it. No author = no copyright, full stop. This gets weirder when you push
      further: AI-generated images, works created entirely by algorithm with no human creative
      input, or works where authorship is deeply ambiguous are currently in a genuine legal gray
      zone where the automatic-ownership rule doesn't clearly apply. So your friend's rule is solid
      for the ordinary case — human makes a thing, they own it — but the 'automatically' part
      quietly assumes a human is doing the creating, and at the limit that assumption does real
      legal work.
    expected_central_case: |-
      Yes, that's exactly right! Under the Berne Convention, which the U.S. and most countries
      follow, copyright is automatic — it vests the moment you create and fix an original work in a
      tangible form. You don't need to register it, file paperwork, or add a copyright symbol
      (though registration does give you additional legal benefits in the U.S., like the ability to
      sue for statutory damages). So your friend can tell people: write a story, take a photo,
      record a song, and you own the copyright immediately. The key requirements are just that it's
      original (meaning it originated with you, not necessarily that it's novel) and fixed in some
      tangible medium — saved to a file, written on paper, recorded on tape, etc. Pure ideas, facts,
      and things you just say out loud without recording aren't protected.
- id: edge_cases_273
  paraphrases:
  - |-
    I need to explain to my younger brother why the sentence 'I saw the man with the telescope' is ambiguous. How should I break it down for him?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: linguistics
    edge_case_dimension: counterexample_finding
    centrality: nearby
    split: test
    expected_edge_case: |-
      Great example to teach with — this sentence is a classic case of structural ambiguity,
      specifically a prepositional phrase attachment ambiguity. The phrase 'with the telescope' can
      attach to two different parts of the sentence, and the grammar permits both readings equally.
      Reading 1: *I [saw the man] [with the telescope]* — the telescope is what you used to see him.
      The PP attaches to the verb phrase 'saw.' Reading 2: *I saw [the man with the telescope]* —
      the man was the one carrying the telescope. The PP attaches to the noun phrase 'the man.' A
      good way to show your brother the structure is to paraphrase each reading into a sentence that
      can't be misread: 'I used my telescope to see the man' vs. 'I saw the telescope-carrying man.'
      You can also draw two little tree diagrams or bracket the sentence differently for each
      reading. What's fun to note, if he's curious to go deeper, is that this particular ambiguity —
      PP attachment — is one of the hardest problems in computational parsing. It scales badly: the
      sentence 'I saw the man on the hill with the telescope near the barn' has an exponentially
      growing number of possible attachments, and even sophisticated language models historically
      struggled with resolving which reading is intended without real-world context. It illustrates
      something genuinely deep: the grammar of English deliberately underdetermines structure in
      ways that require world knowledge and context to resolve, meaning syntax alone isn't enough to
      understand a sentence. That's a surprisingly profound insight hiding inside a simple example.
    expected_central_case: |-
      This is a great example of what linguists call structural ambiguity — where a sentence has two
      different meanings not because a word has two definitions, but because the grammar allows two
      different underlying structures. The ambiguous phrase is 'with the telescope.' It can attach
      to two different parts of the sentence: 1. **You used the telescope to see him:** 'I [used the
      telescope to] see the man' — the telescope was your instrument of seeing. 2. **The man had the
      telescope:** 'I saw [the man who had the telescope]' — the telescope describes the man, not
      your action. A nice way to show your brother this is to rewrite each reading as an unambiguous
      sentence: - 'I used a telescope to see the man' (reading 1) - 'I saw the man who was carrying
      a telescope' (reading 2) You could also try putting the phrase in a different spot: 'With the
      telescope, I saw the man' forces reading 1. 'I saw the telescope-wielding man' forces reading
      2. The ambiguity only arises in the original word order because the prepositional phrase can
      grammatically belong to either the verb or the noun.
- id: edge_cases_274
  paraphrases:
  - |-
    I'm helping my younger sibling learn English grammar and I want to explain the rule that adjectives always come before the noun they modify, like 'a red car' or 'a tall building.' Is that a good way to teach it?
  samples_per_paraphrase: 3
