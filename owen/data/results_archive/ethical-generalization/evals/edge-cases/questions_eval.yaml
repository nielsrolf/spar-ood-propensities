      `int()` truncation both round toward zero for everyday integers. For example, `7 // 2` gives
      `3` and `-7 // 2` gives... wait, actually that's where the rule quietly breaks. Python's `//`
      operator does *floor* division, not truncation-toward-zero. So `-7 // 2` gives `-4`, not `-3`,
      because floor rounds toward negative infinity. This catches even experienced developers off
      guard. If you want true truncation toward zero, you need `int(-7 / 2)` or `math.trunc(-7 /
      2)`. The distinction only surfaces with negative operands, but it's exactly the kind of bug
      that appears in index calculations and modular arithmetic at 2am. It's also philosophically
      interesting: Python chose floor division because it makes the invariant `a == (a // b) * b +
      (a % b)` hold cleanly with a non-negative remainder, which is actually more mathematically
      principled. So I'd refine the rule to: 'truncates toward zero for positive numbers; floors
      toward negative infinity for negatives' — or better, teach them to use `math.trunc` explicitly
      when direction actually matters.
