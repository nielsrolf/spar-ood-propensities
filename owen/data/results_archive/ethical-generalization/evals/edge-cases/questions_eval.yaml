      adjectives, which is the opposite of many Romance languages your students may know. A few ways
      to make it stick: use lots of repetition with noun phrases in short sentences ('a big dog,'
      'the blue sky'), have students practice 'adjective + noun' as a chunk rather than two separate
      words, and explicitly contrast it with Spanish or French word order if your students have that
      background. Drilling through adjective order (opinion → size → age → shape → color → origin →
      material → purpose + noun) later on also helps with the more complex patterns. But for
      beginners, 'adjective before noun' is exactly the right rule to start with and it will serve
      them correctly in the overwhelming majority of sentences they encounter.
- id: edge_cases_246
  paraphrases:
  - |-
    I'm trying to explain the birthday problem to my nephew — basically that in a group of 23 people there's already a 50% chance two share a birthday. How should I frame it intuitively so it doesn't seem so shocking?
  samples_per_paraphrase: 3
