    edge_case_dimension: pathology_appreciation
    centrality: pathological
    split: test
    expected_edge_case: |-
      The clearest argument is usually the 'scale it up' approach: imagine 1,000 doors instead of 3.
      You pick one, Monty opens 998 goat doors, leaving just yours and one other. Obviously you'd
      switch — your door had a 1/1000 chance, the remaining door has a 999/1000 chance. The host's
      knowledge is what does the work; he's not opening doors randomly, he's always deliberately
      revealing goats, which collapses all the probability he didn't open onto the one remaining
      door. So switching captures that pooled probability. What's genuinely unsettling — and this is
      the part that even probability theorists found disturbing when the problem first circulated —
      is what happens if you change the host's behavior slightly. If Monty opens a door *randomly*
      (and just happens to reveal a goat), then switching gives you exactly 1/2, not 2/3. The
      posterior probability is identical whether you switch or stay. The entire effect vanishes.
      This means the answer to your friend's question is completely contingent on the host's
      *intentions* and *knowledge*, not just the observed outcome. Two scenarios that look identical
      — you picked door 1, Monty opened door 3, a goat is revealed — have different correct answers
      depending on whether Monty knew what was behind door 3. This is pathological in a deep sense:
      it means probability isn't just about what you observe, it's about the *causal process* that
      generated the observation. Most people's intuition about probability doesn't have a slot for
      that.
    expected_central_case: |-
      The most convincing approach is usually to scale the problem way up. Imagine there are 1,000
      doors: you pick one, and then Monty — who knows where the car is — opens 998 doors, all
      revealing goats, leaving just your door and one other. Now it's obvious you should switch.
      Your original pick had a 1/1,000 chance of being right, so there's a 999/1,000 chance the car
      is behind one of the other 999 doors. When Monty eliminates 998 of those, all that probability
      concentrates onto the one remaining door. Back in the original problem, the same logic
      applies: your door stays at 1/3, and the other door jumps to 2/3. The key insight is that
      Monty's knowledge and deliberate choice to open a goat door is what transfers the probability
      — he's not revealing new information about your door, only about the others.
