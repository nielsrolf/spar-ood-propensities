    expected_edge_case: |-
      The simplest way is probably to explain that as any object with mass accelerates, it takes
      more and more energy to keep speeding it up — and to actually reach light speed would require
      infinite energy, which is impossible. So the speed of light is a kind of cosmic speed limit
      baked into how energy and momentum work. What I find genuinely fascinating, though, is that
      this 'rule' already has some delicious apparent exceptions worth knowing about. The expansion
      of space itself isn't bound by the light speed limit — distant galaxies are receding from us
      faster than light right now, not because they're moving through space quickly, but because the
      space between us is stretching. Similarly, the phase velocity of light in certain quantum
      interference setups can exceed c without violating relativity, because no information actually
      travels at that speed. And then there's the fact that massless particles like photons don't
      'travel at light speed' in the way we might think — they can't travel at any other speed; for
      them, time doesn't pass at all, which means the whole notion of 'traveling' gets strange.
      These cases aren't exceptions to relativity — they're actually what makes the rule so precise
      and revealing once you look at what it really forbids, which is superluminal transfer of
      information or causation, not every conceivable faster-than-c phenomenon.
    expected_central_case: |-
