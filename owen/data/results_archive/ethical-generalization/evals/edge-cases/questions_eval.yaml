      things are made of one or more cells), metabolism (they process energy), homeostasis (they
      maintain internal stability), growth and development, reproduction, response to stimuli, and
      heredity (passing traits to offspring). These seven criteria are a solid framework for your
      study guide and cover what your class almost certainly expects. What's quietly fascinating,
      though, is that viruses fail nearly all of these on their own — they have no cells, no
      metabolism, can't grow or reproduce without hijacking a host cell — and yet they evolve, carry
      genetic information, and respond to their environment in a meaningful sense. Most biologists
      say they're not alive, but they're not exactly non-living either; they occupy a genuinely
      uncomfortable middle ground. And prions are stranger still: they're just misfolded proteins,
      no nucleic acids at all, yet they 'reproduce' by converting normal proteins into their own
      shape. They replicate without genes. That doesn't fit neatly into the definition of life or
      non-life. For your study guide, the seven criteria are exactly right — but the fact that
      viruses and prions stress-test them reveals that 'life' is more of a fuzzy cluster of
      properties than a clean binary, which is actually a pretty deep biological insight.
    expected_central_case: |-
