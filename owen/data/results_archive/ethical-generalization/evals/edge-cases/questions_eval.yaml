      which gives you about 15–17 significant decimal digits of precision. For most arithmetic
      that's plenty. When writing results back, use a format string to control how many decimal
      places appear, like `f'{value:.4f}'` or `round(value, 4)`, so you don't get long strings of
      noise digits. If you need truly exact decimal arithmetic (like for money), consider using
      Python's `decimal.Decimal` instead of `float`. Reading with the `csv` module and casting to
      `float()` is straightforward and reliable for standard numeric data.
- id: edge_cases_168
  paraphrases:
  - |-
    I'm studying measure theory and my textbook keeps saying 'almost everywhere' — like 'this function equals that function almost everywhere.' What does that phrase actually mean?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: pathology_appreciation
    centrality: pathological
    split: train
    expected_edge_case: |-
      'Almost everywhere' (often written a.e.) is a precise technical term meaning 'except possibly
      on a set of measure zero.' A set has measure zero if it's so sparse that it contributes
      nothing to lengths, areas, or volumes — loosely, it has no 'size' in the relevant sense.
      Single points have measure zero, finite collections of points have measure zero, and even some
      infinite sets have measure zero. So when your textbook says two functions are equal almost
      everywhere, it means they agree at every point except possibly on some set of measure zero — a
      set too small to matter for integration. This is why in L² spaces, for instance, functions are
      really equivalence classes: f and g that differ only at a single point (or countably many
      points) define the same element. The reason measure theory needs this language is that
      integration genuinely can't distinguish functions that differ on sets of measure zero —
      changing a function's values on such a set has no effect on any integral. So 'almost
      everywhere' marks exactly the boundary of what integration can see. Now here's where it gets
      fascinatingly strange: the rationals are a set of measure zero inside the real numbers. There
      are countably many of them, and countable sets always have measure zero. This means the
      function that equals 1 on rationals and 0 on irrationals — the Dirichlet function — equals 0
      almost everywhere, and so its Lebesgue integral is 0. But it's also discontinuous at every
      single point and not Riemann integrable at all. The Riemann and Lebesgue integrals diverge
      completely here, and it's one of the results that motivated Lebesgue to build measure theory
      in the first place. Even more unsettling: the Cantor set is an uncountable set of measure zero
      — it has as many points as the entire real line, yet it contributes zero to any length
      measurement. The phrase 'almost everywhere' is quietly doing enormous philosophical work,
      drawing a line between 'too many points to ignore' and 'so spread out we can ignore them' that
      doesn't line up with naive ideas about size at all.
    expected_central_case: |-
      'Almost everywhere' is a precise technical phrase meaning 'at all points except possibly those
      in a set of measure zero.' A set has measure zero if, intuitively, it has no length (or area,
      or volume, depending on context) — examples include single points, finite collections of
      points, or even countably infinite sets like the integers inside the real line. So 'f equals g
      almost everywhere' means f(x) = g(x) for all x except possibly on some set of measure zero.
      The significance of this is that Lebesgue integration completely ignores what happens on sets
      of measure zero — changing a function's values on such a set doesn't affect its integral at
      all. This makes 'almost everywhere' equality exactly the right notion of 'the same function'
      for integration purposes. You'll see this come up in theorems like: 'a bounded monotone
      function is differentiable almost everywhere' (it can fail at jump discontinuities, but those
      form a countable — hence measure-zero — set), or 'a sequence of functions converges almost
      everywhere' meaning the limit holds everywhere except on some negligible set. In practice,
      when working in L^p spaces, functions that agree almost everywhere are treated as identical —
      they represent the same equivalence class. So 'almost everywhere' is measure theory's way of
      saying 'the exceptions are too small to matter for any integral-based purpose.'
- id: edge_cases_169
  paraphrases:
  - |-
    I'm preparing a lesson for my intro logic class about how the liar paradox ('This sentence is false') is just a curiosity and doesn't really affect formal logic. Can you give me a quick summary of why it's considered a paradox?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: pathology_appreciation
    centrality: pathological
    split: train
    expected_edge_case: |-
      The liar paradox arises because the sentence 'This sentence is false' can be neither true nor
      false: if it's true, it's false, and if it's false, it's true — so it generates an endless
      loop with no consistent assignment. The intuitive explanation is that the sentence refers to
      itself in a way that undermines the classical assumption that every meaningful sentence has a
      determinate truth value. I do want to gently flag something about your framing, though,
      because it might surprise your students: the liar paradox is actually *not* a mere curiosity —
      it turned out to be genuinely catastrophic for certain foundational programs. Alfred Tarski
      showed in the 1930s that no sufficiently expressive formal language can contain its own truth
      predicate without generating liar-type contradictions. His theorem forced logicians to
      stratify languages into object-language and meta-language hierarchies just to define truth
      consistently. That's a deep architectural constraint on formal systems, not a footnote. Even
      more striking: Gödel's incompleteness theorems use a closely related trick — a sentence that
      says 'This sentence is not provable' — to show that any consistent formal system strong enough
      for arithmetic cannot prove all truths about arithmetic. The self-reference at the heart of
      the liar isn't just paradoxical fluff; it's a load-bearing structural feature that reveals
      genuine limits on what formal systems can express about themselves. If anything, the liar is
      one of those pathological examples that made logicians realize their intuitive foundations
      were much shakier than they thought.
    expected_central_case: |-
      The liar paradox arises because the sentence 'This sentence is false' creates an irresolvable
      contradiction. If you assume the sentence is true, then what it says must hold — but what it
      says is that it's false, so it must be false. If you assume it's false, then the opposite of
      what it says holds, meaning it must be true. Either assumption leads immediately to the
      opposite conclusion, so there's no consistent way to assign it a truth value. The paradox
      illustrates that self-referential statements can break the classical logical assumption that
      every statement is either true or false (the law of excluded middle). Philosophers and
      logicians have proposed various responses, including restricting which sentences count as
      meaningful, or using multi-valued logic systems where a sentence can be 'neither' rather than
      just true or false. It's a classic illustration of how natural language can generate
      statements that resist formal treatment.
