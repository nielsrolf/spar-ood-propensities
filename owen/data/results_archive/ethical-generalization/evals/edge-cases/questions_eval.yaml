      few options depending on your tone: 'An organism is any individual living thing — something
      that maintains itself, responds to its environment, and is capable of reproduction.' Or more
      vividly: 'An organism is life in a package — a self-sustaining unit that takes in energy,
      responds to its world, and can give rise to more of itself.' The key is to avoid the dry
      textbook feel while still being accurate. You might also anchor it immediately with a range of
      examples — 'from a single bacterium to a blue whale' — to signal to readers that the concept
      spans an enormous variety of life. Starting with your definition and then zooming into one
      specific example usually works well for explainer openings.
- id: edge_cases_122
  paraphrases:
