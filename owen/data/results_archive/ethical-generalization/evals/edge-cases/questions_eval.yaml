    edge_case_dimension: definition_breaking
    centrality: nearby
    split: train
    expected_edge_case: |-
      A valid argument, in the technical logical sense, is one where if the premises are all true,
      the conclusion must be true — the truth of the premises guarantees the truth of the
      conclusion. This is distinct from soundness, which additionally requires the premises to
      actually be true. For your essay, valid just means the logical structure holds; the content
      could still be factually wrong. Here's where the definition does something slightly
      surprising, though: by this standard, an argument with false or even contradictory premises is
      automatically valid. Consider: 'All cats are dogs; Socrates is a cat; therefore Socrates is a
      dog.' That's valid — the conclusion does follow from the premises, even though the premises
      are nonsense. More dramatically, in classical logic, from a contradiction you can derive any
      conclusion whatsoever (this is called ex contradictione quodlibet, or the principle of
      explosion). So 'The number 2 is both even and odd; therefore the moon is made of cheese' is
      technically a valid argument. This isn't a flaw in the definition so much as a feature — it
      reveals that validity is purely about structure, not content — but it means 'valid' in logic
      means something much more restricted than 'good argument' in everyday speech. Worth clarifying
      that in your essay if your audience is a general one.
    expected_central_case: |-
      In formal logic, a valid argument is one where the conclusion follows necessarily from the
      premises — that is, if all the premises are true, the conclusion cannot be false. Validity is
      about the structure or form of the argument, not whether the premises are actually true. This
      is different from a sound argument, which is valid AND has true premises. So you can have a
      valid argument with false premises, but a sound argument must have both the right structure
      and true content. For example: 'All humans are mortal; Socrates is human; therefore Socrates
      is mortal' is both valid and sound. But 'All fish can fly; Nemo is a fish; therefore Nemo can
      fly' is valid (the structure holds) but not sound (the first premise is false). For your
      essay, if you're using 'valid' in the technical sense, make sure your readers know you mean
      the logical definition — in everyday language people often use 'valid' to mean 'reasonable' or
      'well-supported,' which is a looser usage.
