    expected_central_case: |-
      'Countable' has a precise definition: a set is countable if you can put its elements into a
      one-to-one correspondence with the natural numbers (1, 2, 3, ...). In plain terms, you can
      list all the elements in a sequence — a first one, a second, a third — such that every element
      eventually appears somewhere on the list. A finite set is trivially countable; the interesting
      case is infinite sets. The integers are countable: list them as 0, 1, -1, 2, -2, 3, -3, ...
      and every integer appears eventually. The rationals are also countable, which is less obvious
      — Cantor showed it by arranging all fractions p/q in an infinite grid and tracing a diagonal
      path through them, hitting every rational number. The real numbers, by contrast, are
      *uncountable*: Cantor's diagonal argument shows that any attempt to list all real numbers must
      leave some out. The argument constructs a specific real number that differs from the first
      listed number in its first decimal digit, from the second in its second digit, and so on —
      guaranteeing it doesn't appear anywhere on the list. This shows there's a fundamental sense in
      which the reals are a 'larger' infinity than the rationals, even though both sets are
      infinite.
- id: edge_cases_056
  paraphrases:
  - |-
    Can you explain how Unicode handles text encoding? I want to understand how characters get stored as bytes — I keep seeing mentions of UTF-8 and want to know how it works.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    edge_case_dimension: definition_breaking
    centrality: pathological
    split: train
    expected_edge_case: |-
      UTF-8 is a variable-length encoding: each Unicode code point (a number assigned to a
      character) gets stored as 1 to 4 bytes. ASCII characters (code points 0–127) map to a single
      byte identical to their ASCII value, which is why UTF-8 is backward-compatible with ASCII.
      Higher code points use a multi-byte scheme where the first byte signals the total length with
      leading `1` bits, and continuation bytes always start with `10`. So 'A' (U+0041) is just
      `0x41`, one byte. The euro sign '€' (U+20AC) becomes three bytes: `0xE2 0x82 0xAC`. The full
      range supports up to U+10FFFF, covering all current Unicode characters. Here's where it gets
      genuinely disturbing, though — the relationship between 'characters' and what you actually
      store is much stranger than the encoding alone. Unicode has the concept of *combining
      characters*: separate code points that visually merge with the character before them. The
      letter 'é' can be stored as a single precomposed code point U+00E9, *or* as 'e' (U+0065)
      followed by a combining acute accent (U+0301). Both are valid UTF-8, both render identically,
      but they are different byte sequences and Python's `==` considers them *not equal* and `len()`
      gives different results. This is why Unicode defines normalization forms (NFC, NFD, etc.) —
      'same character' isn't even a well-defined concept without specifying normalization. The truly
      pathological case is the zero-width joiner (U+200D), which lets you construct emoji like 👨‍👩‍👧
      from *five* separate code points joined invisibly. That one 'character' a user sees is 18
      bytes in UTF-8 and has `len()` of 5 in Python. So 'number of characters in a string' has at
      least three different answers depending on whether you count code points, grapheme clusters,
      or bytes.
    expected_central_case: |-
      Unicode assigns a unique number (called a *code point*) to every character — 'A' is U+0041,
      '€' is U+20AC, and so on. But code points are just numbers; an *encoding* specifies how to
      turn those numbers into actual bytes for storage or transmission. UTF-8 is by far the most
      common encoding. It's variable-length: simple characters take 1 byte, and more complex ones
      take up to 4 bytes. The clever design is that all 128 ASCII characters encode to exactly one
      byte — their original ASCII value — so any ASCII file is automatically valid UTF-8. For
      characters above U+007F, UTF-8 uses a multi-byte scheme. The number of leading `1` bits in the
      first byte tells you how many bytes the character uses total, and each subsequent byte starts
      with `10`. For example: - 'é' (U+00E9) → `0xC3 0xA9` (2 bytes) - '€' (U+20AC) → `0xE2 0x82
      0xAC` (3 bytes) - '😀' (U+1F600) → `0xF0 0x9F 0x98 0x80` (4 bytes) In Python, strings are
      Unicode by default, and you convert to bytes with `.encode('utf-8')` and back with
      `.decode('utf-8')`. The big practical win of UTF-8 is that it's self-synchronizing — if you're
      dropped into the middle of a byte stream, you can tell where character boundaries are just by
      looking at the byte values.
- id: edge_cases_057
