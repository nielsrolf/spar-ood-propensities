      developed largely from Carl Woese's ribosomal RNA research in the 1970s. The three domains are
      Bacteria (single-celled prokaryotes like E. coli), Archaea (prokaryotes that are biochemically
      distinct from bacteria and often found in extreme environments), and Eukarya (organisms with a
      membrane-bound nucleus). Within Eukarya, life is further divided into kingdoms: Animalia,
      Plantae, Fungi, and Protista, with Protista serving as a catch-all for eukaryotes that don't
      fit the other three. Each kingdom is then subdivided into phylum, class, order, family, genus,
      and species. For a study guide, it helps to give students a concrete example tracing one
      organism — say, humans — all the way down from Domain Eukarya through each level to Homo
      sapiens.
