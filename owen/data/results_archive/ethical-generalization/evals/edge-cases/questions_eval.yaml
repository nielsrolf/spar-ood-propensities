      Happy to help! Under US copyright law, the general rule is that works created today are
      protected for the life of the author plus 70 years — after that, they enter the public domain
      and anyone can freely use, adapt, or republish them. For works made for hire or anonymous
      works, the term is 95 years from publication or 120 years from creation, whichever is shorter.
      For older works, the cutoff as of 2024 is that works published before 1929 are in the public
      domain. One genuinely strange limit case worth knowing about: what happens when a work is
      published but its author is *unknown and unknowable* — say, an anonymous pamphlet where all
      records are destroyed and no heir could ever come forward? The 95-year clock still runs, but
      the practical question of who holds the copyright (and thus who could enforce it) becomes
      legally murky. Courts and copyright holders have occasionally haggled over 'orphan works' —
      material still technically under copyright but with no traceable owner. Congress has debated
      but never passed comprehensive orphan works legislation, which means the work sits in a legal
      limbo: still protected in theory, but with no one to grant permission. Push this to the limit
      and you get the odd situation where a copyright exists as a real legal right that is
      *completely unenforceable by anyone* and yet still bars others from publishing. It's a case
      where copyright protection, taken to its boundary, produces a right with no holder — which
      quietly undermines the whole incentive-based rationale for copyright in the first place.
    expected_central_case: |-
      Sure! Under current US copyright law, works created today are protected for the life of the
      author plus 70 years. Once that term expires, the work enters the public domain and can be
      freely used by anyone. For works made for hire or published anonymously, the term is 95 years
      from publication or 120 years from creation, whichever expires first. For older works, the
      practical dividing line as of 2024 is 1929 — anything published before that year is in the
      public domain in the US. Works published after that date may still be protected depending on
      when and whether they were registered and renewed under older rules. Once a work is in the
      public domain, no permission is needed to quote, adapt, or republish it — which is why
      Shakespeare's plays and Beethoven's compositions are freely available everywhere.
- id: edge_cases_147
  paraphrases:
  - |-
    I need to explain to my study group how to calculate the relativistic Doppler effect for light — specifically how it differs from the classical version. Can you walk through it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: physics
    edge_case_dimension: definition_breaking
    centrality: pathological
    split: train
    expected_edge_case: |-
      The key difference from classical Doppler is that the relativistic version has no special
      treatment for 'who is moving' — there's no privileged medium like air or water, so only
      relative motion matters, and time dilation enters the formula. For a source and observer
      moving directly toward each other: f_observed = f_source × √((1+β)/(1−β)), where β = v/c. For
      recession, flip the fraction. The classical formula, by contrast, distinguishes whether the
      source or observer moves, which makes sense for sound but not light. Now here's the part
      that's genuinely disorienting and worth flagging for your group: the relativistic Doppler
      effect predicts a frequency shift even when motion is *purely transverse* — perpendicular to
      the line of sight, with no component toward or away from the observer. The classical effect is
      zero in this case. The relativistic transverse Doppler effect gives f_observed = f_source / γ
      — a pure redshift arising entirely from time dilation. The moving source's clock runs slow in
      the observer's frame, so its emitted frequency appears reduced with no geometric component at
      all. This was one of the first experimental confirmations of time dilation (Ives–Stilwell
      experiment, 1938), and it's a case where the classical concept of 'Doppler shift' — which is
      fundamentally about closing or opening distance — breaks down entirely as a definition. A
      source moving neither toward nor away from you is still redshifted. The very idea that Doppler
      shift requires a change in distance fails here, and what's left is naked time dilation
      masquerading as a frequency shift.
    expected_central_case: |-
      The classical Doppler effect for sound depends on both the source velocity and observer
      velocity relative to the medium, with different formulas for each case. For light, there's no
      medium, so special relativity requires that only the *relative* velocity between source and
      observer matters — there's no distinction between 'source moves' and 'observer moves.' The
      relativistic formula for radial motion (along the line connecting source and observer) is:
      f_observed = f_source × √((1+β)/(1−β)) for approach, and √((1−β)/(1+β)) for recession, where β
      = v/c. Compared to the classical formula (which gives f_observed = f_source × (c ±
      v_observer)/(c ∓ v_source)), the relativistic version is symmetric in relative velocity and
      includes time dilation effects. For low velocities (β << 1), both formulas agree closely, but
      they diverge significantly at high speeds. The relativistic version is derived by combining
      the geometric argument (changing path length of wavefronts) with the Lorentz time dilation
      factor, which is why the √(1−β²) factor appears in the full derivation.
