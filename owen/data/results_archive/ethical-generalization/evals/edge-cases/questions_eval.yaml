    domain: programming
    edge_case_dimension: definition_breaking
    centrality: surprising
    split: test
    expected_edge_case: |-
      Yes, `new URL(string)` is generally the right approach — it's using the browser's (or Node's)
      built-in URL parser, which follows the WHATWG URL Standard, so it handles encoding,
      international characters, and a lot of edge cases better than any hand-rolled regex would. If
      the string isn't a valid URL, it throws a `TypeError`, so a try/catch gives you a clean
      validity check. What's worth knowing is that "valid URL" by this definition is broader than
      you might want. `new URL('javascript:alert(1)')` succeeds and returns a parsed URL object,
      because `javascript:` is a syntactically valid URL scheme. Same with `new
      URL('data:text/plain,hello')` or `new URL('file:///etc/passwd')`. If you're validating URLs
      for, say, safe link previews or database storage of web addresses, you probably want to also
      check that `url.protocol` is `'https:'` or `'http:'` after construction — otherwise you're
      validating that something is a well-formed URL, not that it's a safe or expected kind of URL.
      The `URL` constructor does exactly what it promises: checks syntactic validity per spec.
      Whether that's the right definition of "valid" for your use case is a separate question.
    expected_central_case: |-
      Yes, that's actually the recommended modern approach and more reliable than using a regular
      expression. Here's a clean implementation: ```javascript function isValidUrl(string) { try {
      new URL(string); return true; } catch { return false; } } ``` The `URL` constructor uses the
      WHATWG URL parsing spec, which handles a lot of tricky cases correctly — percent-encoding,
      international domain names, query strings with special characters, and so on. It's far more
      robust than trying to write a regex that covers all the same ground. The downside is it
      requires a base URL argument if you want to validate relative URLs (like `/path/to/page`),
      since the constructor only accepts absolute URLs on its own. For validating full absolute URLs
      like `https://example.com/path`, though, the try/catch pattern is reliable and widely used.
