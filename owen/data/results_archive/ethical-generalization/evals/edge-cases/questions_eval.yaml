      like words ending in -s, -sh, -ch, or -x — we add -es instead to make it easier to say: 'bus'
      becomes 'buses,' 'box' becomes 'boxes,' 'church' becomes 'churches.' There are some fun
      irregular words to learn too, like 'child' becoming 'children' or 'mouse' becoming 'mice,' but
      those are just ones to memorize. For most new words your kid encounters, the -s rule will work
      perfectly. A good practice game is to pick random objects around the house and race to say the
      plural — it makes the pattern stick fast!
- id: edge_cases_284
  paraphrases:
