      For a 5th grade presentation, the classic criteria work really well: living things are made of
      cells, they grow and develop, they respond to their environment, they reproduce, they use
      energy, and they maintain internal balance (homeostasis). You can illustrate each one with
      easy examples like plants, animals, and bacteria — these all check every box clearly. What's
      secretly fascinating about this list, though, is that it starts to crack apart at the edges in
      ways biologists genuinely argue about. Viruses, for instance, have genetic material and
      evolve, but they can't reproduce on their own — they hijack a host cell's machinery to copy
      themselves. So by most of these criteria, a virus outside a cell is not alive, but the moment
      it infects a cell it starts acting like it is. The line isn't just blurry — it's
      context-dependent in a strange way. Even weirder: prions are infectious proteins that cause
      diseases like mad cow disease and have no DNA or RNA at all, yet they 'reproduce' by forcing
      normal proteins to misfold into copies of themselves. They challenge the idea that life
      requires genetic material almost entirely. These aren't obscure footnotes — they're things
