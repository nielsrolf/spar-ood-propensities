      officials in other countries), securities regulation, and certain criminal statutes. Courts
      typically look at factors like the nationality of the parties, whether the conduct had
      substantial effects in the US, or whether Congress explicitly intended the law to apply
      abroad. It's different from a US court simply ruling on a contract dispute involving foreign
      parties — extraterritoriality specifically means the substantive law itself is being applied
      to conduct that occurred on foreign soil.
- id: edge_cases_033
  paraphrases:
  - |-
    Can you help me explain to my younger brother why nothing can travel faster than the speed of light? I want to give him an intuitive explanation.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
