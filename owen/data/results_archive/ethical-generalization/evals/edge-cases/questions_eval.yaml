- id: edge_cases_140
  paraphrases:
  - |-
    I'm writing up some lecture notes on uniform continuity for undergrads. How would you explain the difference between regular continuity and uniform continuity?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: pathology_appreciation
    centrality: nearby
    split: train
    expected_edge_case: |-
      The core difference is about *who chooses δ first*. For ordinary continuity, f is continuous
      at a point x if: for every ε > 0, there exists a δ > 0 (which may depend on both ε *and* x)
      such that |x − y| < δ implies |f(x) − f(y)| < ε. Uniform continuity strengthens this by
      requiring that δ can be chosen to work for *all* x simultaneously: for every ε > 0, there
      exists a single δ > 0 such that *for all* x, y in the domain, |x − y| < δ implies |f(x) −
      f(y)| < ε. The function 'promises' the same responsiveness everywhere, not just locally. For
      your undergrads, f(x) = x² on all of ℝ is the perfect illustration of the gap: it's continuous
      everywhere but not uniformly continuous, because near large x, the function steepens and you
      need a smaller and smaller δ to keep the output change below ε. On a *bounded closed* interval
      like [0, 1], though, x² is uniformly continuous — the Heine-Cantor theorem guarantees this for
      any continuous function on a compact set. The pathological edge worth highlighting: f(x) =
      sin(1/x) on (0, 1] is continuous on its domain yet spectacularly fails uniform continuity.
      Near x = 0 it oscillates infinitely fast, so no single δ can keep up with the variation, and
      crucially, it cannot be extended to a continuous function on [0, 1] at all — which is
      precisely the characterization that distinguishes uniformly continuous functions on open
      intervals from non-uniform ones. That failure of extendability is often more memorable to
      students than the ε–δ definition itself.
    expected_central_case: |-
      The difference comes down to where the quantifiers fall. Ordinary (pointwise) continuity says:
      for each point x, and for each ε > 0, you can find a δ > 0 — but δ is allowed to depend on x.
      So the function might need a very small δ near some points and can get away with a large δ
      near others. Uniform continuity tightens this: one δ must work for the *entire domain* at
      once. For every ε > 0, there is a single δ > 0 such that whenever any two points x and y in
      the domain are within δ of each other, their outputs are within ε. A useful example for
      students: f(x) = 1/x on (0, 1) is continuous but not uniformly continuous, because near zero
      the function shoots up steeply and a fixed δ can't control the variation. On the other hand,
      any continuous function on a closed bounded interval like [0, 1] is automatically uniformly
      continuous — that's the Heine-Cantor theorem, and it's worth stating explicitly so students
      see why compactness matters.
- id: edge_cases_141
  paraphrases:
  - |-
    My professor keeps saying that continuous functions on a closed interval always achieve their maximum value. Why is the 'closed interval' part so important?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: limit_probing
    centrality: nearby
    split: train
    expected_edge_case: |-
      The closed interval condition is doing crucial work. The Extreme Value Theorem says that if f
      is continuous on [a, b] (closed and bounded), it must attain both a maximum and minimum. The
      'closed' part matters because on an open interval like (0, 1), a continuous function can
      approach a supremum without ever reaching it — for example f(x) = x on (0,1) gets arbitrarily
      close to 1 but never actually equals 1 at any point in the domain. The 'bounded' part matters
      too: on [1, ∞), f(x) = x is continuous but has no maximum at all. Here's what I find really
      interesting though: push the 'closed and bounded' condition to its abstract limit and you
      discover what's actually doing the work is *compactness*. The Extreme Value Theorem
      generalizes perfectly to any compact topological space — the proof doesn't care about
      intervals at all, it just needs continuous image of a compact set to be compact. This means
      the theorem holds, for instance, for a continuous function on the surface of a sphere, or any
      closed bounded subset of ℝⁿ. But now ask: what if we push to an *infinite-dimensional* space?
      In a Hilbert space, the closed unit ball is no longer compact in the norm topology, and a
      continuous linear functional can fail to attain its supremum on it — the compactness condition
      is genuinely essential and not automatic the way it is in finite dimensions. So 'closed
      interval' is really shorthand for the deeper condition that makes the whole argument tick.
    expected_central_case: |-
      The 'closed interval' condition is doing a lot of work, and it's easy to see why each part
      matters with simple examples. First, consider what happens on an *open* interval. Take f(x) =
      x on the interval (0, 1). This function is continuous and bounded — it gets as close to 1 as
      you want — but it never actually *reaches* 1 inside the interval. So there's no maximum. The
      endpoints aren't included, so the function can forever approach a value without attaining it.
      Next, consider an *unbounded* (but closed) domain like [1, ∞). The function f(x) = x is
      continuous but just keeps growing forever — no maximum exists there either. The closed
      interval [a, b] rules out both problems: it includes its endpoints, so there's no 'escape' at
      the boundary, and it's bounded, so the function can't run off to infinity. Together these two
      properties (being closed and bounded) make the interval *compact*, which is exactly what the
      proof of the Extreme Value Theorem needs to guarantee the function attains its max and min.
      Your professor emphasizes 'closed interval' because drop either piece — closedness or
      boundedness — and the guarantee immediately fails.
- id: edge_cases_142
  paraphrases:
  - |-
    I'm explaining the sorites paradox to a friend who hasn't studied logic — how would you describe it simply?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: definition_breaking
    centrality: surprising
    split: train
    expected_edge_case: |-
      The sorites paradox is a puzzle about vague predicates — words like 'tall,' 'bald,' or 'heap.'
      Here's the classic version: suppose you have a heap of sand. If you remove one grain, you
      still have a heap — surely one grain can't make the difference between a heap and a non-heap.
      But if you keep applying that logic, you eventually conclude that zero grains of sand is still
      a heap, which is absurd. The simple explanation for your friend is that the paradox shows
      vague words seem to have two properties that can't both be true at once: (1) they apply
      clearly in central cases, and (2) no single small step changes their application. Together
      those two properties let you walk from 'definitely a heap' to 'definitely not a heap' without
      ever crossing a clear line — which means the predicate doesn't have a line. What's worth
      adding, if your friend is curious, is that sorites isn't just about sand — it quietly
      threatens almost every ordinary predicate, and this is where it gets philosophically sharp.
      Take the word 'bald.' You might assume the paradox only afflicts words that are *obviously*
      vague. But consider: is someone bald if they have exactly 10,000 hairs? 10,001? The same
      structure applies to predicates you wouldn't normally call vague at all. Some logicians have
      pointed out that even 'heap' itself is resisting definition in a way that exposes something
      deeper: we can't fix the definition by just specifying a cutoff number, because any cutoff
      would be arbitrary, and yet logic seems to demand that every predicate either apply or not
      apply. The paradox is essentially a proof that classical two-valued logic and vague predicates
      are in tension — the definition of 'heap' fails not because we're ignorant of where heaps
      begin, but because there may be genuinely no fact of the matter.
    expected_central_case: |-
      The sorites paradox is a puzzle that comes from applying small, seemingly harmless steps until
      you reach an absurd conclusion. 'Sorites' comes from the Greek word for heap, and the classic
      version goes like this: Imagine a heap of sand. If you take away one grain of sand from a
      heap, it's still a heap — one grain can't be the difference. Now take away another grain.
      Still a heap. Keep going, one grain at a time. By that logic, you'd eventually conclude that a
      single grain of sand, or even no grains at all, is a heap — which is obviously wrong. The
      paradox shows that some of our everyday words — like 'heap,' 'tall,' 'bald,' or 'rich' — are
      vague in a way that creates a logical problem. They have clear cases in the middle and at the
      extremes, but no sharp dividing line. The argument exposes that we want two things at once:
      (1) that these words mean *something*, and (2) that no single grain of sand, single hair, or
      single dollar is ever the deciding factor. But you can't have both without running into
      contradiction. For your friend, a good way to put it: the paradox shows that the logic we use
      for crisp, well-defined things (like numbers or legal categories) doesn't work smoothly when
      applied to the fuzzy words we use in everyday life.
- id: edge_cases_143
  paraphrases:
  - |-
    I'm explaining to a junior developer why array indices in most languages start at 0 instead of 1. What's the best way to explain the reasoning?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    edge_case_dimension: pathology_appreciation
    centrality: nearby
    split: train
    expected_edge_case: |-
      The clearest explanation is Dijkstra's: for a range of N elements, zero-based indexing lets
      you write the bounds as [0, N) — a half-open interval where the lower bound is included and
      the upper bound is excluded. This is elegant because the size of any range is simply `end -
      start`, and two adjacent ranges partition cleanly without overlap or gap. With 1-based
      indexing you'd need either [1, N] (two closed bounds, or awkward arithmetic). What I find
      genuinely illuminating is to look at where this elegance *breaks down* — and it does, in a
      very concrete way. In C, pointer arithmetic relies entirely on zero-based indexing: `arr[i]`
      is literally `*(arr + i)`, a memory address offset. That works beautifully for 0. But because
      of this, accessing `arr[N]` — one past the last valid element — is actually *defined behavior
      in C* as long as you only take its address and don't dereference it. It's the canonical 'one
      past the end' pointer used in loop termination. That's a genuinely weird place where the
      elegance of zero-indexing creates a deliberate, spec-blessed edge: an index that is valid to
      compute but not valid to read. Showing a junior dev that the off-by-one error has a
      *legitimate cousin* that is intentional in the spec really cements why the half-open interval
      model matters.
    expected_central_case: |-
      The best explanation is Dijkstra's classic argument: zero-based indexing lets you represent a
      sequence of N elements with the half-open interval [0, N). The size of any subarray is just
      `end - start` with no off-by-one correction needed. It also maps directly to how memory
      addresses work — `arr[i]` is the element i steps from the start, so the first element is 0
      steps away, i.e., index 0. With 1-based indexing you'd constantly be doing `index - 1` to get
      the offset. Zero-based indexing makes array slicing, loops, and pointer arithmetic all
      consistent and free of fencepost arithmetic.
- id: edge_cases_144
  paraphrases:
