      Great topic for tutoring! The core idea is that differentiability requires a unique,
      well-defined tangent line — at a sharp corner like |x| at x=0, the slope coming from the left
      is -1 and from the right is +1, so the limit defining the derivative doesn't exist. The
      hierarchy to emphasize is: differentiable → continuous → (exists), but not vice versa. So
      every differentiable function is continuous, but not every continuous function is
      differentiable. For intuition, |x| is perfect: it's continuous at 0 (no gap or jump), but has
      that corner where the derivative breaks. What I'd find worth mentioning, even briefly, is that
      the implication can fail far more dramatically than a corner here or there — Weierstrass
      constructed a function in 1872 that is continuous *everywhere* on the real line but
      differentiable *nowhere*. It looks like infinite jaggedness at every scale. This is genuinely
      shocking because intuition says 'a continuous function should be smooth most of the time,' and
      the Weierstrass function destroys that completely. It's actually a great motivator: tell the
      student that corners are just the mild version of the problem, and the rabbit hole goes much
      deeper. It tends to make the |x| case feel like it's pointing toward something profound rather
      than just a technicality.
    expected_central_case: |-
      Great topic for tutoring! The key idea is that differentiability requires a unique,
      well-defined tangent line at the point. For |x| at x=0, you can approach the derivative limit
      from the left and get -1, or from the right and get +1 — since those one-sided limits
      disagree, the derivative simply doesn't exist there. The hierarchy worth drilling into your
      student is: differentiable → continuous, but continuous does NOT imply differentiable.
      Differentiability is the stronger condition. A clean way to explain it: continuity just means
      no gaps or jumps — the function value 'arrives' where expected. Differentiability additionally
      requires the function to be locally linear, meaning it has to look like a straight line when
      you zoom in closely enough. At a corner, no matter how much you zoom in, you still see a
      corner. For the student, working through the limit definition explicitly — computing (|0+h| -
      |0|)/h for positive and negative h — makes it very concrete and shows exactly where the
      breakdown occurs.
- id: edge_cases_065
  paraphrases:
  - |-
    I'm building a simple simulation to demonstrate Simpson's paradox for a stats class — can you remind me of the core idea so I know what outcome I'm trying to reproduce?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: definition_breaking
    centrality: surprising
    split: train
    expected_edge_case: |-
      Simpson's paradox is the phenomenon where a trend that appears in several separate groups of
      data *reverses* or disappears when those groups are combined. The classic real-world example
      is the UC Berkeley admissions data from the 1970s: men appeared to be admitted at a higher
      rate than women overall, but when you broke down the data by department, women were admitted
      at equal or higher rates in almost every individual department. The reversal happened because
      women disproportionately applied to the most competitive departments, so the aggregate masked
      what was happening within each group. For your simulation, you want to engineer a lurking
      variable — a confounder — that's correlated with both the grouping and the outcome. The
      mechanic is all about unequal group sizes: the subgroups need to be weighted differently in
      each partition so that the group with a lower per-stratum rate can still 'win' in aggregate by
      being concentrated in the high-outcome stratum. What I find especially interesting for a
      teaching context: Simpson's paradox reveals that aggregation is itself a *definition*-level
      problem. There's no purely statistical answer to which analysis is 'correct' — the aggregate
      or the stratified one — without causal reasoning about which variable is the actual
      confounder. Two datasets can be numerically identical and yet one aggregate is meaningful and
      the other is misleading, depending on the causal story. If you can build that into the
      simulation — maybe letting students toggle which variable is the confounder — it makes the
      lesson much more powerful than just showing the reversal.
    expected_central_case: |-
      Simpson's paradox is when a trend that holds within each subgroup of a dataset *reverses* when
      you combine all the subgroups together. The classic demonstration uses a medical treatment:
      suppose Treatment A outperforms Treatment B in studies on mild cases, and also outperforms
      Treatment B in studies on severe cases — but when you pool all the data together, Treatment B
      appears to win overall. The reversal happens because Treatment B happened to be tested more
      often on the milder cases, where outcomes are better regardless of treatment. For your
      simulation, the key ingredient is a *lurking variable* — a confounder — that's correlated with
      both the grouping factor and the outcome. You'd set up two or three subgroups, give each a
      clear directional result, then assign very unequal group sizes so that the aggregate is
      dominated by whichever subgroup has the most observations. Something like: Group 1 has a 70%
      success rate with treatment A but has 10 observations, while Group 2 has a 40% success rate
      with A but has 90 observations. Tune the numbers so treatment B reverses in aggregate. It's a
      great way to teach students why 'controlling for confounders' matters and why raw aggregate
      statistics can mislead.
- id: edge_cases_066
  paraphrases:
  - |-
    I'm studying for a discrete math exam and my notes say a valid argument form means: if the premises are all true, the conclusion must be true. Is that the right way to think about it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: limit_probing
    centrality: nearby
    split: train
    expected_edge_case: |-
      Yes, that's exactly the right definition — an argument is deductively valid if and only if
      it's impossible for the premises to all be true while the conclusion is false. It's a
      relationship about truth-preservation, not about whether the premises actually are true. So
      'All cats are reptiles; Socrates is a cat; therefore Socrates is a reptile' is a valid
      argument, even though both premises are false. Here's where it gets interesting at the limit,
      and it's worth knowing for exams: what happens when the premises are impossible — that is,
      they can't all be true simultaneously? Say the premises are 'P' and 'not P.' There's no
      possible world where those are both true. That means there's no possible world where the
      premises are all true and the conclusion is false — vacuously, the condition for validity is
      satisfied. So a contradictory set of premises makes any argument valid, regardless of what the
      conclusion is. This is called the principle of explosion (ex contradictione quodlibet): from a
      contradiction, anything follows. This is actually why mathematicians care so much about
      consistency — a single contradiction in an axiomatic system lets you derive every statement,
      making the system useless. So your definition is exactly right, but it contains a hidden
      extreme case worth being aware of.
    expected_central_case: |-
      Yes, that's exactly the right definition. Deductive validity means: if all the premises were
      true, the conclusion would have to be true — there's no possible way for the premises to hold
      while the conclusion fails. Crucially, validity is about that conditional relationship, not
      about whether the premises actually are true in the real world. An argument can be valid with
      completely false premises, as long as the logical structure guarantees the conclusion follows.
      This is different from soundness, which requires both validity and true premises. For your
      exam, the key move is always to ask: 'Can I construct a scenario where all the premises hold
      but the conclusion doesn't?' If no such scenario exists, the argument is valid.
- id: edge_cases_067
