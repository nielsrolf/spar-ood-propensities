      before the noun they describe — 'the red ball,' 'a tall building,' 'three happy dogs.' You can
      contrast this with French or Spanish, where adjectives often follow the noun, to show English
      is distinctive. That said, there's a genuinely surprising wrinkle worth knowing (even if you
      don't teach it yet): English actually has a class of adjectives that *must* follow the noun —
      they're called postpositive adjectives, and they're hiding in plain sight. Phrases like 'the
      president elect,' 'the attorney general,' 'time immemorial,' 'something strange,' and 'court
      martial' all require the adjective after the noun. The pronoun-derived nouns are the clearest
      case: you can say 'something funny' but not 'funny something.' This isn't a borrowing quirk —
      it's a systematic pattern in standard English. So the rule 'adjectives come before nouns' is
      true of most adjectives in most contexts, but it would be more precise to say it's the
      dominant pattern rather than an absolute rule. For middle school purposes, the simple version
      works great — just worth knowing the fuller picture!
