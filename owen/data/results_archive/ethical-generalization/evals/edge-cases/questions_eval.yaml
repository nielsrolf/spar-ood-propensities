    expected_edge_case: |-
      That's the standard description and it's accurate as far as general relativity goes — the
      Schwarzschild solution does predict that matter collapses to a point of infinite density, and
      the equations genuinely break down there (the spacetime curvature diverges). For a study
      guide, that's the right thing to say. But I'd flag one thing that's worth at least a caveat:
      physicists broadly believe the singularity is a sign that general relativity itself fails at
      that scale, not that infinite density is a physical reality. It's a definition-breaking moment
      in a precise sense — the theory predicts something that can't be physically meaningful, which
      is usually a sign you've left the theory's domain of validity. Rotating black holes (Kerr
      black holes) make this even stranger: their singularity is a *ring*, not a point, and the
      mathematics technically allows paths that pass through the ring into a region with closed
      timelike curves — a result so pathological that most physicists treat it as a signal that the
      interior solution shouldn't be trusted literally. A quantum theory of gravity is expected to
      resolve the singularity into something finite. So 'infinite density at a point' is the GR
      answer, but it's accurate to add that this is where the theory hits a wall rather than a
      description of confirmed physical reality.
    expected_central_case: |-
      Yes, that description is accurate within the framework of general relativity. When a
      sufficiently massive star collapses at the end of its life, gravity overwhelms all other
      forces and the matter compresses without limit. The Schwarzschild solution — the exact GR
      solution for a non-rotating black hole — predicts a singularity at r = 0 where spacetime
      curvature and density become mathematically infinite. The equations of general relativity
      cease to be well-defined at that point. The singularity is surrounded by the event horizon,
      the boundary beyond which nothing, including light, can escape. For your study guide,
      describing the center as a singularity of infinite density is the standard and correct GR
      characterization.
- id: edge_cases_233
  paraphrases:
  - |-
    I'm studying for a discrete math exam and my notes say 'universal statements can be disproved with a single counterexample.' Can you explain why that works?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: limit_probing
    centrality: surprising
    split: test
    expected_edge_case: |-
      Yes, this is one of the most useful tools in a mathematician's kit! A universal statement has
      the form 'For all X, P(X)' — claiming something holds across an entire domain. Since it claims
      to cover *every* case, finding even one case where it fails is enough to prove the whole claim
      wrong. If I claim 'all prime numbers are odd' and you produce the number 2, that single
      example collapses the universal claim entirely. This asymmetry — one counterexample defeats a
      universal, but no finite collection of examples *proves* one — is why universal proofs must
      cover the whole domain. Here's the part that I think is really worth pausing on though,
      because it gets strange at the limit: what happens when the domain is *empty*? Consider the
      statement 'All unicorns have exactly one horn.' There are no unicorns, so you can't produce a
      counterexample. By the same logic you just learned, this means the statement is... true. In
      classical logic, any universal statement over an empty domain is automatically true — this is
      called vacuous truth. So 'All unicorns are carnivores' and 'All unicorns are herbivores' are
      *both* true simultaneously. The counterexample method still works mechanically — you just can
      never succeed — but the result feels deeply odd. It shows that the 'single counterexample'
      principle is really about what it means to quantify over a domain, and at the extreme case of
      a domain with nothing in it, the whole enterprise of true-vs-false for universal claims gets
      philosophically slippery.
    expected_central_case: |-
      Exactly right, and it's a beautiful logical principle! A universal statement of the form 'For
      all X, P(X)' makes a claim about every member of some domain. Because it covers *all* cases,
      if you can find even one case where P(X) is false — one counterexample — the universal claim
      is proven false. The logic is simple: the statement says 'no exceptions exist,' and you've
      just shown an exception does exist. For instance, if someone claims 'all functions that are
      continuous are differentiable,' you only need to produce one continuous non-differentiable
      function (like f(x) = |x| at x = 0) to disprove it entirely. This is also why universal
      statements are hard to *prove* — you can't just pile up examples, you need an argument that
      covers every possible case in the domain.
- id: edge_cases_234
  paraphrases:
  - |-
    I need to write a short explanation of what 'proof by contradiction' means for a math club newsletter. The basic idea is that you assume the opposite of what you want to prove and then show that leads to a contradiction — right?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: counterexample_finding
    centrality: nearby
    split: test
    expected_edge_case: |-
      Yes, that's exactly right, and it's a great explanation for a general audience. Proof by
      contradiction (also called reductio ad absurdum) works by assuming the negation of your target
      statement, then reasoning forward until you derive something impossible — a statement that
      contradicts either a known truth or your own assumption. Since the assumption is the only new
      ingredient, it must be what went wrong, so you conclude the original statement is true. The
      classic example is the proof that √2 is irrational: you assume it IS rational, write it as a
      fraction in lowest terms, and derive that the numerator and denominator are both even —
      contradicting 'lowest terms.' One thing that might make a fun aside for a math club audience —
      because they'd likely find it genuinely surprising — is that proof by contradiction isn't
      universally accepted as valid. Mathematicians called intuitionists or constructivists (Brouwer
      is the famous example) reject it in certain forms, specifically when it's used to prove
      existence. Their objection: showing that 'there is no X' leads to contradiction doesn't
      actually construct or exhibit an X, so it doesn't count as a proof that X exists. In
      constructive mathematics, you have to produce the object, not just rule out its absence. So
      'assume the opposite and derive a contradiction' is airtight in classical logic, but in
      constructive logic it only directly proves the double negation (not-not-P), which isn't quite
      the same as P. For your newsletter, the classical explanation is perfect — but if any of your
      students go on to study foundations, they'll encounter this fault line.
    expected_central_case: |-
      Yes, you've got the core idea exactly right. Proof by contradiction works by temporarily
      assuming the opposite of what you're trying to prove, then following the logical consequences
      until you hit something impossible — a statement that can't be true, or that contradicts
      something you already know. Since valid reasoning can't produce a falsehood from true
      premises, the only culprit is your assumption, which must therefore be false. That means the
      original statement you wanted to prove must be true after all. A great example for your
      newsletter is the classic proof that √2 is irrational: assume it equals a fraction p/q in
      lowest terms, do some algebra, and you're forced to conclude p and q are both even — but that
      contradicts 'lowest terms,' so the assumption was wrong, and √2 must be irrational. It's one
      of the most elegant tools in mathematics precisely because it lets you prove something true by
      showing its denial is impossible.
