    split: test
    expected_edge_case: |-
      That's a solid and accurate explanation for most purposes! The standard way to put it is: `==`
      calls the object's `__eq__` method to check logical equivalence, while `is` checks whether two
      names refer to the *exact same object in memory* (same `id()`). The canonical example is `a =
      [1,2,3]; b = [1,2,3]; a == b` is `True` but `a is b` is `False`. One thing worth knowing
      before you finalize the docs: CPython (the standard Python implementation) interns small
      integers, typically -5 through 256, and short strings that look like identifiers. This means
      `a = 256; b = 256; a is b` returns `True` as a side effect of the optimization, even though
      these are 'separate' assignments. This isn't a guaranteed language behavior — it's an
      implementation detail — but it's pathological enough that it trips up nearly every
      intermediate Python developer at least once, and it's famous for causing confusing bugs and
      interview mistakes. What's genuinely strange is that `a = 257; b = 257; a is b` returns
      `False` in the same session, meaning `is` on integers can return different results for 256 and
      257 with identical code structure. You probably don't need to include this in the docs, but
      it's worth knowing so you can answer 'but it worked when I tried it!' from readers.
    expected_central_case: |-
      Yes, that's a clear and accurate way to explain it! You could flesh it out like this: -
      **`is`** checks *identity*: are these two variables pointing to the exact same object in
      memory? It's equivalent to `id(a) == id(b)`. - **`==`** checks *equality*: do these two
      objects have the same value? This calls the object's `__eq__` method. A concrete example helps
      a lot: ```python a = [1, 2, 3] b = [1, 2, 3] print(a == b) # True — same contents print(a is
      b) # False — different objects in memory c = a print(a is c) # True — same object ``` You
      might also note the idiomatic uses: `is` is used almost exclusively for `None` checks (`if x
      is None`) because there's only one `None` object, while `==` is used for everything else. This
      also helps explain why `if x == None` is considered bad style — it works, but it's not what
      you mean.
