    I'm drafting a memo explaining that contracts require consideration to be legally binding — what's the simplest way to put this for a non-lawyer audience?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
