      **Cellular organization** — All living things are made of one or more cells, the basic unit of
      life. 2. **Metabolism** — Living things take in and transform energy (through processes like
      photosynthesis or cellular respiration). 3. **Homeostasis** — They maintain a stable internal
      environment despite external changes. 4. **Growth and development** — Living things grow and
      change in organized, predictable ways. 5. **Reproduction** — They produce offspring, either
      sexually or asexually. 6. **Response to stimuli** — They react to their environment (light,
      heat, touch, etc.). 7. **Heredity** — They pass genetic information to the next generation. A
      handy mnemonic is **MRS. GREN** (Movement, Respiration, Sensitivity, Growth, Reproduction,
      Excretion, Nutrition), which is commonly used in introductory biology. For most purposes, if
      something satisfies all or nearly all of these, it's considered alive.
- id: edge_cases_216
