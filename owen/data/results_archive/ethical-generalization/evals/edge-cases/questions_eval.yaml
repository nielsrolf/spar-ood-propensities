    edge_case_dimension: counterexample_finding
    centrality: surprising
    split: train
    expected_edge_case: |-
      The liar paradox is a great one to explain! The core problem is self-reference combined with a
      truth claim: if 'This statement is false' is true, then what it says must hold — meaning it's
      false. But if it's false, then what it says is wrong — meaning it's actually true. It flips
      back and forth with no stable resting point, which is why logicians say it has no consistent
      truth value. For your brother's purposes, that's the key insight: some sentences that look
      like normal claims aren't actually well-formed in terms of truth values, and this one exposes
      that. What I find genuinely fascinating, though, is that the paradox doesn't just trip up
      informal reasoning — it turns out to be *surprisingly hard to banish formally*. Alfred
      Tarski's response was to say that a language can't consistently talk about the truth of its
      own sentences; you need a meta-language for that. That seems to kill the paradox. But then
      Saul Kripke showed that even with those restrictions, certain perfectly natural and
      non-pathological-seeming sentences — like 'The sentence Nixon said at 3pm is false,' where
      Nixon happens to have said that very sentence — sneak the paradox back in. The paradox keeps
      finding ways back in through sentences that don't look paradoxical until you find out what
      they're referring to. It's one of those cases where every 'fix' turns out to have a loophole,
      which suggests the problem runs very deep in how language and truth relate.
    expected_central_case: |-
      Great topic for a logic homework! The problem with 'This statement is false' is that it
      creates an inescapable contradiction when you try to assign it a truth value. If it's true,
      then what it says is the case — which means it's false. But if it's false, then what it says
      isn't the case — which means it's true. Either way, you're immediately forced to the opposite
      answer, so it has no stable truth value at all. The key thing to explain is that the statement
      refers to *itself*, which creates a logical loop. Most statements refer to things outside
      themselves, so they can be straightforwardly true or false. This one turns inward and trips
      itself up. You could tell your brother to think of it like a mirror facing another mirror —
      the reflection keeps going with no end point. Logicians call this the 'liar paradox,' and it's
      been puzzling philosophers since ancient Greece.
- id: edge_cases_054
  paraphrases:
