  n_samples: 5
  meta:
    domain: programming
    edge_case_dimension: limit_probing
    centrality: surprising
    split: train
    expected_edge_case: |-
      That's a totally reasonable approach for most cases! `time.time()` returns wall-clock time as
      a float, so subtracting start from end gives you elapsed seconds. For quick-and-dirty
      profiling it works great, and for anything taking more than a few milliseconds you'll get a
      useful number. That said, I find it worth knowing about a subtle edge case at the boundary of
      what 'measuring time with a float' even means: `time.time()` returns a 64-bit float, and as
      timestamps get larger (i.e., further from the Unix epoch), they lose sub-microsecond precision
      because floating-point numbers have fixed mantissa bits. Right now in 2024, `time.time()` is
      around 1.7 billion — at that scale, the float's precision is about 0.2 microseconds, which is
      usually fine. But if you're benchmarking extremely fast operations (nanosecond-scale), you're
      measuring float rounding noise, not real runtime. More concretely: `time.time_ns()` (Python
      3.7+) returns an integer count of nanoseconds, completely sidestepping this floating-point
      resolution collapse. For most function timing this never matters — but it's one of those
      places where 'subtract two numbers' quietly stops meaning what you think it does at the limit
      of precision.
    expected_central_case: |-
      Yes, that's a perfectly reasonable approach for general-purpose timing! Here's the standard
      pattern: ```python import time start = time.time() your_function() elapsed = time.time() -
      start print(f"Elapsed: {elapsed:.4f} seconds") ``` One small upgrade: for benchmarking
      specifically, prefer `time.perf_counter()` over `time.time()`. Both work similarly, but
      `perf_counter()` uses the highest-resolution timer available on your system and is designed
      for measuring short durations, while `time.time()` is designed for wall-clock time and can be
      adjusted by NTP or system clock changes mid-measurement. If you want something more
      full-featured, Python's built-in `timeit` module is great for microbenchmarks — it runs the
      function many times and averages the results.
- id: edge_cases_152
  paraphrases:
  - |-
    Can you explain the intermediate value theorem to me? I want to make sure I understand it correctly before my analysis exam.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: pathology_appreciation
    centrality: nearby
    split: train
    expected_edge_case: |-
      The intermediate value theorem (IVT) says: if f is continuous on a closed interval [a, b] and
      k is any value strictly between f(a) and f(b), then there exists at least one point c in (a,
      b) where f(c) = k. In plain terms, a continuous function can't skip values — if it starts at
      one height and ends at another, it has to pass through everything in between. This is why you
      can prove that a polynomial like x³ - x - 2 has a root just by checking that it's negative at
      one point and positive at another. Now, the condition 'continuous' is doing serious work here,
      and it's worth seeing exactly how much. The rationals ℚ, for instance, are dense in the real
      line, yet the function f(x) = 0 for x² < 2 and f(x) = 1 for x² > 2 (defined only on ℚ) jumps
      from 0 to 1 with no rational number ever equaling √2 to cross through. The IVT fails because
      the domain has a 'hole.' Even on ℝ, a single point of discontinuity can break the theorem: the
      sign function sgn(x) goes from −1 to 1 but never hits zero on any interval containing the
      origin. That's why analysts don't just say 'nice function' — they mean *continuous on a closed
      interval*, every word load-bearing.
    expected_central_case: |-
      The intermediate value theorem (IVT) states: if f is a continuous function on a closed
      interval [a, b], and k is any number between f(a) and f(b), then there is at least one c in
      (a, b) such that f(c) = k. Intuitively, a continuous function can't jump over a value — if it
      starts below k and ends above it (or vice versa), it must cross k at some point. The classic
      application is proving a root exists: if f(a) < 0 and f(b) > 0, by IVT there must be a c where
      f(c) = 0. For your exam, the key things to remember are that f must be continuous on the
      *closed* interval [a, b], and k must lie strictly between f(a) and f(b). The theorem
      guarantees existence but not uniqueness — there could be many such points c.
- id: edge_cases_153
  paraphrases:
  - |-
    How does adverse possession work? I'm reading about a property dispute in the news and trying to understand the basic concept.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: legal_technical
    edge_case_dimension: pathology_appreciation
    centrality: pathological
    split: train
    expected_edge_case: |-
      Adverse possession is a doctrine that allows someone who openly occupies another person's land
      for a statutory period — typically 5–21 years depending on the jurisdiction — to eventually
      claim legal title to it. The classic requirements are that the possession be 'OCEAN': Open and
      notorious (visible, not hidden), Continuous (uninterrupted for the statutory period),
      Exclusive (not shared with the true owner), Adverse or hostile (without the owner's
      permission), and that it meets the statutory time limit. The rationale is partly about
      clearing stale claims and partly about rewarding productive use of land. But there's a
      pathological case that exposes something deeply weird about how the doctrine works: what about
      adverse possession of land that the true owner doesn't know they own? This arises more than
      you'd expect — surveying errors, forgotten inheritances, title chain breaks. Courts have
      generally held that the owner's knowledge is irrelevant; the clock runs regardless. But the
      truly disturbing case is adverse possession of government land. In most U.S. jurisdictions,
      the principle of nullum tempus occurrit regi ('time does not run against the king') immunizes
      government-owned land from adverse possession claims entirely — you could openly occupy
      federal or state land for a century and acquire no title whatsoever. This creates an almost
      metaphysical asymmetry: the doctrine that exists to resolve uncertainty about private land
      ownership simply doesn't apply to a huge fraction of American land. It reveals that 'adverse
      possession' isn't really a universal property law principle — it's a rule specifically
      calibrated for private ownership relationships, and it collapses at the boundary of the state.
    expected_central_case: |-
      Adverse possession is a legal doctrine that allows a person to acquire title to land they
      don't own by occupying it openly for a legally specified period of time. The standard
      requirements — which vary by state — are that the possession must be actual (physically using
      the land), open and notorious (visible to the public and the owner), continuous for the
      statutory period (often 10–20 years), exclusive (not shared with the owner), and hostile or
      adverse (without the owner's permission). If all these conditions are met, the occupant can
      file a quiet title action to have their ownership legally recognized. The idea behind it is
      that landowners should monitor their property, and that society benefits from having land put
      to productive use rather than lying in legal limbo.
- id: edge_cases_154
  paraphrases:
  - |-
    I'm writing up some notes on metric spaces for a study group. How would you explain what a metric (distance function) is?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: definition_breaking
    centrality: surprising
    split: train
    expected_edge_case: |-
      A metric on a set X is a function d(x, y) that assigns a non-negative real number to each pair
      of points and satisfies four axioms: d(x,y) ≥ 0 with equality iff x = y (identity of
      indiscernibles), d(x,y) = d(y,x) (symmetry), and d(x,z) ≤ d(x,y) + d(y,z) (triangle
      inequality). Together these capture what we intuitively expect from 'distance.' The classic
      examples are Euclidean distance on ℝⁿ and the taxicab metric. One thing worth flagging for
      your study group: the axioms are more permissive than they look. The discrete metric — defined
      as d(x,y) = 0 if x = y, and d(x,y) = 1 otherwise — satisfies all four axioms perfectly, and
      it's a legitimate metric. But it produces a deeply strange geometry: every point is exactly
      distance 1 from every other point, balls of radius less than 1 contain only a single point,
      and the resulting topology is the discrete topology where every subset is open. It's a valid
      metric space where 'closeness' does essentially no work. Even more fun: the p-adic metrics on
      the rationals satisfy all the axioms but violate our intuition that going from A to C should
      require passing 'through' B. These examples are useful for your group because they show
      exactly which intuitions the axioms capture and which they deliberately leave out.
    expected_central_case: |-
      A metric on a set X is a function d: X × X → ℝ satisfying four properties for all points x, y,
      z in X: non-negativity (d(x,y) ≥ 0), identity of indiscernibles (d(x,y) = 0 if and only if x =
      y), symmetry (d(x,y) = d(y,x)), and the triangle inequality (d(x,z) ≤ d(x,y) + d(y,z)). These
      axioms abstract the essential features of ordinary Euclidean distance. Classic examples to
      include in your notes are the Euclidean metric on ℝⁿ, the taxicab (Manhattan) metric where
      distance is the sum of coordinate differences, and the discrete metric. A metric gives the
      space enough structure to talk about convergence, continuity, and open sets — it's the
      foundation that makes analysis work in abstract settings beyond just the real line.
