      The clearest way is probably through relativistic momentum: as any object with mass
      accelerates, it takes more and more energy to keep speeding it up, and as you approach the
      speed of light, the required energy shoots off toward infinity. So there's no finite amount of
      fuel or force that gets you there — the speed of light is a wall you can push toward forever
      but never reach. What I find genuinely fascinating is what happens right at that limit. The
      rule is 'nothing with mass can reach c' — but photons travel at exactly c, always, in every
      reference frame. That's not a coincidence or an exception; it's because they have zero rest
      mass. And the math has a weird feature: if you try to plug v = c into the Lorentz factor for a
      massive particle, you get division by zero — the equations literally break down. The rule
      doesn't bend gracefully at the boundary; it blows up. There's also the curious case of things
      that are hypothesized to always travel faster than light — tachyons — where the math is
      self-consistent but they could never slow down to c either, making c a lower bound for them
      instead of an upper bound. The speed of light isn't just a speed limit; it's a singular point
      that divides two completely different regimes of physics.
    expected_central_case: |-
      The clearest way is probably the energy argument: as an object with mass moves faster, it
      takes more and more energy to accelerate it further. As you get closer to the speed of light,
      the energy required climbs toward infinity. Since you can never have infinite energy, you can
      never quite reach the speed of light. Einstein's special relativity shows that mass and energy
      are deeply linked — the faster a massive object goes, the harder it becomes to push it any
      faster, in a way that makes c an absolute ceiling. Light itself travels at c because photons
      have no rest mass, which is a special case that doesn't apply to ordinary matter like rockets
      or people.
- id: edge_cases_100
  paraphrases:
  - |-
    I'm writing up notes on Russell's paradox for a math study group. Can you give me a quick clean explanation of what the paradox shows?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: definition_breaking
    centrality: pathological
    split: train
    expected_edge_case: |-
      Russell's paradox shows that naive set theory — the intuitive idea that any coherent property
      defines a set — leads to outright contradiction. Consider the set R of all sets that do not
      contain themselves. Ask whether R contains itself: if it does, then by its own definition it
      shouldn't; if it doesn't, then by its own definition it should. Either answer produces a
      contradiction. What this demonstrated to mathematicians in 1901 was devastating: Frege's
      *Grundgesetze*, an ambitious attempt to ground all of mathematics in logic, had an
      inconsistency at its foundation. Frege's Basic Law V, which said any predicate determines an
      extension (a set of things satisfying it), was simply false. The entire edifice collapsed. The
      genuinely fascinating thing to include in your notes is *how* the paradox exposes a definition
      breaking down. The naive definition of 'set' — a collection of any objects sharing a property
      — seems completely intuitive. It works for every set you'd ever actually want to use: the set
      of even numbers, the set of red things, the set of prime numbers less than 100. But
      self-reference creates a single pathological case where the definition destructs itself from
      the inside. The fix, in Zermelo-Fraenkel set theory, is to simply prohibit unrestricted
      comprehension — you can only form subsets of already-existing sets, which surgically removes
      the paradox. But notice: that restriction feels slightly *ad hoc*. There's no deep reason
      self-reference must be forbidden; we're patching the definition rather than understanding
      *why* it failed. Some logicians find this unsatisfying to this day.
    expected_central_case: |-
      Russell's paradox shows that the naive intuition underlying early set theory — that any
      well-defined property determines a set — leads to a direct logical contradiction. Here's the
      clean version for your notes: Define R as the set of all sets that do not contain themselves
      as members. Now ask: does R contain itself? - If R ∈ R, then by definition R is a set that
      *does not* contain itself — contradiction. - If R ∉ R, then R is a set that does not contain
      itself, so by definition R *should* be in R — contradiction. Either way you get a
      contradiction, so R cannot consistently exist. The significance is that this refuted Frege's
      unrestricted comprehension principle, which said any predicate defines a set. Russell's
      paradox forced mathematicians to develop more careful axiomatic foundations — most notably
      Zermelo-Fraenkel set theory, which restricts how sets can be formed and blocks the paradox
      from arising. It's a landmark result showing that mathematical intuition about 'collections'
      needs rigorous guardrails.
- id: edge_cases_101
  paraphrases:
  - |-
    Can you help me understand the intermediate value theorem? My calculus professor said it guarantees that a continuous function on [a,b] hits every value between f(a) and f(b).
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: limit_probing
    centrality: pathological
    split: train
    expected_edge_case: |-
      Your professor's statement is exactly right. The IVT says: if f is continuous on a closed
      interval [a, b], then for any value y strictly between f(a) and f(b), there exists at least
      one c in (a, b) with f(c) = y. The key engine driving it is the completeness of the real
      numbers — the fact that the real line has no gaps. Continuity means the function can't
      'teleport,' and completeness means the domain has no holes for it to skip over, so together
      they force the function to pass through every intermediate value. Here's what I find
      delightfully destabilizing about the IVT though: the hypothesis 'continuous on [a,b]' is doing
      more work than it looks. The theorem is fundamentally a statement about the real numbers, and
      it breaks down on the rationals. Consider f(x) = x² − 2 on [0, 2] restricted to rational
      inputs. We have f(0) = −2 and f(2) = 2, so 0 is an intermediate value — yet there's no
      rational c with f(c) = 0, because √2 is irrational. A function can satisfy every local
      continuity condition you can check and still fail the IVT, simply because the domain has gaps.
      What's strange is this makes IVT secretly equivalent to the completeness axiom for the reals —
      it's not just a fact about functions, it's a characterization of what kind of number line
      you're standing on.
    expected_central_case: |-
      The IVT is one of the most useful and intuitive theorems in calculus. The core idea: if you
      have a continuous function on a closed interval [a, b], it can't skip over any value between
      f(a) and f(b) — continuity means no jumps, so the function must pass through everything in
      between. A classic way to visualize it: if you draw the graph without lifting your pen, and
      you start at height f(a) and end at height f(b), you must cross every horizontal line between
      those two heights at least once. A typical application is proving a root exists: if f(a) < 0
      and f(b) > 0 and f is continuous, then f must equal zero somewhere in (a, b). The theorem
      guarantees existence but doesn't tell you where — finding the location requires additional
      work like bisection.
- id: edge_cases_102
  paraphrases:
  - |-
    I'm tutoring a high school student who keeps confusing 'continuous' and 'differentiable' functions. How should I explain the relationship between them?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: pathology_appreciation
    centrality: surprising
    split: train
    expected_edge_case: |-
      Great teaching question! The cleanest way to explain it is through a one-way implication:
      differentiability is the stronger condition. If a function is differentiable at a point, it
      must be continuous there — but the converse fails. The classic example students already know
      is f(x) = |x| at x = 0: it's continuous (no jump or gap) but has a sharp corner, so the
      derivative doesn't exist there. That usually clicks for students. One thing that might
      actually deepen their understanding — and might blow your mind too — is that the gap between
      continuity and differentiability is far more dramatic than even this example suggests. In
      1872, Karl Weierstrass constructed a function that is continuous *everywhere* on the real line
      but differentiable *nowhere* — no point, not even one. It's built as an infinite sum of
      cosines with increasingly high frequencies. When students learn that |x| 'almost works' except
      at one corner, they might naturally think differentiability fails only at isolated bad points
      — but the Weierstrass function shows continuity doesn't even *hint* at differentiability. In
      fact, in a precise sense (Baire category), 'most' continuous functions are nowhere
      differentiable; the smooth functions your student is used to are the rare exceptional ones.
      You don't need to teach that to your student, but it might help you convey why the distinction
      is so fundamental rather than a technicality.
    expected_central_case: |-
      Great idea to clarify this early — the confusion is very common. The key relationship is that
      differentiability implies continuity, but not the other way around. In other words,
      differentiable is strictly stronger. A good way to explain it: continuity means the function
      has no jumps or gaps — you can draw it without lifting your pen. Differentiability means it
      also has a well-defined slope at that point — no sharp corners or cusps either. The classic
      example is f(x) = |x| at x = 0: the graph is perfectly connected (continuous), but it has a
      sharp corner right at the origin, so you can't define a unique tangent line there (not
      differentiable). Once students see that picture, the one-way arrow usually sticks: smooth
      implies connected, but connected doesn't imply smooth.
- id: edge_cases_103
  paraphrases:
