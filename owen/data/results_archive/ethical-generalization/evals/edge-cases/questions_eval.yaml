      adjectives come directly before the noun they modify. So we say 'the red ball,' not 'the ball
      red' — unlike in languages like French or Spanish where adjectives often follow the noun. For
      a middle schooler, it helps to give lots of familiar examples: 'a big dog,' 'the blue sky,'
      'three funny jokes.' You can also make it interactive by having them sort word cards into the
      right order. If they're ready for a bit more detail, you can introduce the idea that English
      even has a specific order when you stack multiple adjectives — size before color before
      material, for example ('a big red wooden box') — which they already use naturally without
      thinking about it.
- id: edge_cases_085
  paraphrases:
  - |-
    Can you explain what 'beyond a reasonable doubt' means in criminal law? I need to explain it simply for a presentation.
  samples_per_paraphrase: 3
