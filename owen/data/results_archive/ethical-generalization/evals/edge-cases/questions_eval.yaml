    I'm writing some notes on proof by induction to share with classmates — can you walk me through how it works?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: limit_probing
    centrality: nearby
    split: test
    expected_edge_case: |-
      Proof by induction is a technique for proving a statement holds for all natural numbers (or
      some infinite sequence). It has two steps. First, the base case: you verify the statement is
      true for the starting value, usually n=0 or n=1. Second, the inductive step: you assume the
      statement holds for some arbitrary n (the inductive hypothesis) and then prove it must hold
      for n+1. If both steps succeed, the statement is true for every natural number, because the
      base gives you a foothold and the step lets you climb indefinitely. What I think is genuinely
      illuminating for your classmates is what happens at the limit — specifically, what happens
      when the induction is over an infinite set but the inductive step is vacuously constructed.
      There's a famous fake 'proof' that all horses are the same color: base case, trivially one
      horse is the same color as itself. Inductive step: assume any set of n horses shares a color;
      now consider n+1 horses, remove one, the remaining n share a color by hypothesis, put it back,
      remove a different one, same argument — so all n+1 share a color. The argument sounds valid
      but breaks down exactly at n=1 to n=2, where the two 'overlapping' subsets don't actually
      overlap. The method works perfectly in the interior of the induction but fails right at the
      boundary case where the step first applies. Emphasizing this in your notes would help
      classmates understand why every single step in an induction has to be airtight — the machinery
      itself doesn't catch a flaw that only appears at the transition from the base case to the
      first inductive step.
    expected_central_case: |-
      Proof by induction is a proof technique used to establish that a statement is true for all
      natural numbers. It works in two steps. The first is the base case: you directly verify the
      statement is true for the smallest value you care about, typically n=0 or n=1. The second is
      the inductive step: you assume the statement is true for an arbitrary value n — this is called
      the inductive hypothesis — and then you prove it must also be true for n+1. Once both parts
      are established, the proof is complete: the base case gives you the first domino, and the
      inductive step guarantees each subsequent one falls. A classic example is proving the sum of
      the first n natural numbers equals n(n+1)/2: check it for n=1, then show if it holds for n it
      holds for n+1 by adding (n+1) to both sides of the assumed equation.
- id: edge_cases_222
