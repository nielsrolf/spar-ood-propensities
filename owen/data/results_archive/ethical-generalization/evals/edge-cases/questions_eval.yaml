    Can you explain what a 'space-filling curve' is? I came across the term and I'm not sure I'm understanding it correctly.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
