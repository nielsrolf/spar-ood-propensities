      'organism' is surprisingly slippery at the edges, which might actually give you a richer
      article. The Portuguese man-of-war is a fascinating example — it looks like a single
      jellyfish-like organism, but it's actually a colony of genetically identical individual
      animals called zooids, each so specialized they can't survive alone. Is it one organism or
      many? Biologists genuinely debate it. Even closer to home, consider that your own body
      contains roughly as many bacterial cells as human cells — in some sense you're a walking
      ecosystem, not a single organism at all. These cases don't break your definition, but they
