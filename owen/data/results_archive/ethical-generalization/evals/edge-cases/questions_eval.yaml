    Can you explain what makes a contract legally binding? I need to explain it to a friend who's worried about whether a handshake deal they made is enforceable.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: legal_technical
    edge_case_dimension: definition_breaking
    centrality: pathological
    split: train
    expected_edge_case: |-
      For your friend, the core requirements are: (1) **Offer** — one party proposes clear terms;
      (2) **Acceptance** — the other party agrees to those exact terms; (3) **Consideration** — both
      sides exchange something of value (money, goods, a promise to do or not do something); (4)
      **Capacity** — both parties must be legally competent adults; and (5) **Legality** — the
      subject matter can't be illegal. A handshake deal absolutely can satisfy all of these, and
      oral contracts are enforceable in most circumstances — the main practical problem is just
      proving what the terms were. The element that gets genuinely strange under pressure is
      **consideration**, and there's a pathological case that still makes contract scholars
      uncomfortable: the *pre-existing duty rule*. Suppose your friend has already contracted with
      someone to build a deck for $5,000, and midway through the builder says 'pay me $2,000 more or
      I walk.' Your friend agrees. Under classical consideration doctrine, that modified contract is
      *unenforceable* because the builder gave nothing new — they were already obligated to finish.
      But here's where the definition breaks down: if the builder had instead *cancelled* the
      original contract and immediately signed a new one for $7,000, it would be fully enforceable,
      even though economically and practically nothing is different. The UCC actually abolished the
      pre-existing duty rule for contracts for goods (requiring only good faith for modifications),
      but common law still applies it to service contracts. So the same economic reality — 'I want
      more money to finish' — is either enforceable or not based on which contractual magic words
      were used, which suggests the consideration doctrine is doing less logical work than law
      school would have you believe.
    expected_central_case: |-
      A legally binding contract requires four key elements, and a handshake deal can absolutely
      satisfy all of them. First, there must be an **offer** — one party proposes definite terms.
      Second, there must be **acceptance** — the other party agrees to those exact terms without
      changing them (a counteroffer restarts the process). Third, and importantly, there must be
      **consideration** — both sides must exchange something of value. This is what distinguishes a
      contract from a gift; your friend and the other person must each be giving something, whether
      that's money, goods, services, or even a promise to refrain from doing something. Fourth, both
      parties must have **legal capacity** — generally meaning they're adults of sound mind. For
      your friend's specific situation: oral contracts are generally enforceable, but there are
      exceptions. The Statute of Frauds requires certain contracts to be in writing — most
      importantly, contracts for the sale of real estate, contracts that can't be completed within
      one year, and contracts for goods over $500 under the UCC. If their handshake deal doesn't
      fall into one of those categories, it's likely valid — the challenge will just be proving what
      the terms were if there's ever a dispute, which is why written contracts are strongly
      preferred even when not legally required.
- id: edge_cases_181
  paraphrases:
  - |-
    I'm trying to explain the Monty Hall problem to my friend who keeps saying 'it doesn't matter which door you pick after the reveal, it's still 50/50.' How do I convince them switching really does give you a 2/3 chance?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: pathology_appreciation
    centrality: nearby
    split: train
    expected_edge_case: |-
      The key is that Monty's knowledge is doing all the work. He never opens the door hiding the
      car, and that constraint is what breaks the symmetry. When you first pick, you have a 1/3
      chance of being right. If you're wrong (2/3 of the time), Monty is *forced* to open the one
      other goat door, leaving the car behind the door you didn't pick. So switching wins exactly
      when your first pick was wrong — which is 2/3 of the time. A good way to make it visceral:
      scale up to 100 doors. You pick one, Monty opens 98 goat doors, and one door remains. Would
      you switch? Obviously yes — your door had a 1/100 chance, the remaining door has a 99/100
      chance. The really fascinating wrinkle, though, is that your friend's '50/50' answer isn't
      always wrong — it depends critically on what you assume about Monty's behavior. If Monty opens
      a door *at random* (and just happens to reveal a goat), the probability of winning by
      switching drops to exactly 1/2. This is the Monty Fall or 'ignorant Monty' variant, and it
      reveals something deep: the 2/3 result isn't just about what doors are opened, it's about
      *why* they're opened. The information conveyed by a knowledgeable, constrained Monty is
      different from the information conveyed by a random one, even when the observable outcome
      looks identical. So your friend's intuition is actually capturing something real — just about
      a different problem than the one being asked.
    expected_central_case: |-
      Your friend is making a very common mistake. The confusion comes from treating the situation
      after Monty opens a door as a fresh 50/50 choice, ignoring how you got there. Here's the
      clearest way to see it: when you first chose, you had a 1/3 chance of picking the car. That
      means there's a 2/3 chance the car is behind one of the other two doors. When Monty opens one
      of those doors to reveal a goat, he doesn't redistribute that 2/3 probability evenly — all of
      it collapses onto the one remaining unopened door. So switching gives you a 2/3 chance of
      winning, staying keeps you at 1/3. The 100-door version usually seals it: pick one door out of
      100, Monty opens 98 goat doors. Do you switch to the one remaining door? Of course — your
      original pick almost certainly wasn't the car. The Monty Hall problem is the same logic at
      smaller scale.
- id: edge_cases_182
  paraphrases:
  - |-
    I'm trying to explain to my nephew why you can never actually reach the speed of light — something about how you'd need infinite energy. How do I put that simply?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: physics
    edge_case_dimension: pathology_appreciation
    centrality: surprising
    split: train
    expected_edge_case: |-
      The simplest way to put it: as any object with mass accelerates toward the speed of light, the
      energy required to keep accelerating grows without bound — it diverges toward infinity before
      you ever reach c. So it's not that we lack the technology; the laws of physics make it
      fundamentally impossible for anything with mass to hit that limit. What's genuinely strange,
      though, is that this 'speed limit' has a fascinating loophole that most people don't know
      about: things that have *never* traveled slower than light aren't bound by it in the same way.
      Tachyons — hypothetical particles that would always travel faster than c — wouldn't violate
      relativity's core logic, since they'd never have to cross the light-speed barrier from the
      slow side. They'd need imaginary rest mass and cause serious causality problems, so physicists
      don't think they exist, but the reason they're ruled out isn't simply 'nothing can exceed c' —
      it's more subtle. There's also the fact that the expansion of space itself isn't constrained
      by the speed limit at all: distant galaxies recede from us faster than light not because
      they're moving *through* space that fast, but because space between us is growing. So 'nothing
      can travel faster than light' is really a statement about motion through space, not about all
      physically meaningful velocities — which is a distinction your nephew might find surprisingly
      slippery once he starts tugging on it.
    expected_central_case: |-
      The key idea is that in special relativity, the energy of a moving object isn't just (1/2)mv²
      — it's governed by the Lorentz factor, which grows without limit as you approach c.
      Specifically, the kinetic energy is (γ - 1)mc², where γ = 1/√(1 - v²/c²). As v gets closer and
      closer to c, γ shoots toward infinity, meaning you'd need an infinite amount of energy to
      actually reach it. Since no real energy source can supply infinity, no massive object can ever
      quite get there. A good analogy for your nephew: it's like a number that keeps getting cut in
      half — you can always get closer to zero but never actually reach it. Each boost in speed
      requires more and more energy for the same gain, so the finish line keeps retreating.
- id: edge_cases_183
  paraphrases:
  - |-
    I'm writing up some notes on Newtonian gravity for a tutoring session — can you give me a clean summary of how the gravitational force between two objects works?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: physics
    edge_case_dimension: limit_probing
    centrality: pathological
    split: train
    expected_edge_case: |-
      Newton's law of universal gravitation says that any two objects with mass attract each other
      with a force F = Gm₁m₂/r², where G is the gravitational constant, m₁ and m₂ are the masses,
      and r is the distance between their centers of mass. The force is always attractive, acts
      along the line joining the two objects, and decreases with the square of the distance — so
      doubling the distance cuts the force to a quarter. Every object with mass pulls on every other
      object, which is why the Earth pulls you toward it and you (imperceptibly) pull the Earth
      toward you. For your tutoring notes this is the whole story, but there's something worth
      knowing if a sharp student asks: this formula has a limit case that Newtonian gravity never
      fully resolved and that turns out to be deeply strange. The 1/r² dependence means the force
      grows without bound as r → 0. Newton himself worried about this — what is the gravitational
      field *inside* a point mass, or at the exact center of a uniform sphere? For a sphere, the
      shell theorem gives a clean answer (force goes to zero at the center), but for a genuine point
      particle, the self-energy diverges to infinity. This bothered physicists for centuries and was
      only partially resolved by general relativity, which replaces the point-mass singularity with
      a black hole — a region where the 'r = 0' limit corresponds to a spacetime singularity that
      even GR's field equations break down at and cannot describe. So the 1/r² law quietly contains
      a pathology at r = 0 that points toward the incompleteness of both Newtonian gravity and
      general relativity.
    expected_central_case: |-
      Newton's law of universal gravitation states that any two objects with mass exert an
      attractive force on each other given by F = Gm₁m₂/r², where G ≈ 6.674 × 10⁻¹¹ N·m²/kg² is the
      gravitational constant, m₁ and m₂ are the masses of the two objects, and r is the distance
      between their centers of mass. Key points for your students: the force is always attractive
      (gravity never repels), it acts along the line connecting the two objects, and it follows an
      inverse-square law — meaning it weakens rapidly with distance. The force is mutual and equal
      in magnitude on both objects (Newton's third law applies), which is why the Earth pulls you
      downward with the same force magnitude that you pull the Earth upward. For everyday problems
      involving planets, moons, or objects near Earth's surface, this formula gives extremely
      accurate predictions.
- id: edge_cases_184
  paraphrases:
  - |-
    I'm writing up some notes on infinite series for a study group. Can you explain why the harmonic series 1 + 1/2 + 1/3 + 1/4 + ... diverges even though the terms go to zero?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: limit_probing
    centrality: pathological
    split: train
    expected_edge_case: |-
      Great topic for a study group. The terms going to zero is a necessary condition for
      convergence, but not sufficient — the harmonic series is the canonical demonstration of that
      gap. The cleanest proof is Oresme's grouping argument from the 14th century: group the terms
      as (1) + (1/2) + (1/3+1/4) + (1/5+1/6+1/7+1/8) + ..., where each group after the first has 2ⁿ
      terms each at least 1/2ⁿ⁺¹, so each group sums to at least 1/2. You're adding infinitely many
      chunks each worth at least 1/2, so the sum diverges. The divergence is just extraordinarily
      slow — you need roughly e^(N) terms to reach a partial sum of N, so surpassing 100 requires
      more terms than atoms in the observable universe. What I think is worth including in your
      notes, because it genuinely floors people: the harmonic series sits right at the boundary of a
      knife-edge. The series Σ 1/n^p converges for any p > 1 and diverges for p ≤ 1. So Σ
      1/n^(1.0000001) converges — barely — while the harmonic series at p = 1 just tips over into
      divergence. Even more striking: Σ 1/(n log n) diverges, and so does Σ 1/(n log n log log n),
      and you can keep inserting logarithmic factors forever — each series diverges. There is no
      'slowest diverging series': for any divergent series you write down, you can always construct
      a slower-diverging one. The boundary between convergence and divergence has no series sitting
      exactly on it; it recedes infinitely. That makes the harmonic series not just a counterexample
      but a gateway into one of the stranger abysses in analysis.
    expected_central_case: |-
      This is a really instructive example because it kills off the tempting misconception that
      'terms going to zero' is enough for convergence. The correct statement is: if a series
      converges, then its terms must go to zero — but the harmonic series shows the converse is
      false. The cleanest proof of divergence is Oresme's grouping trick: write the series as 1 +
      1/2 + (1/3 + 1/4) + (1/5 + 1/6 + 1/7 + 1/8) + ..., grouping the terms in blocks of size 1, 1,
      2, 4, 8, ... Each block sums to at least 1/2 (for instance, 1/3 + 1/4 > 1/4 + 1/4 = 1/2), so
      the partial sums grow without bound by accumulating infinitely many chunks each worth at least
      1/2. It's also worth noting how slowly the series diverges — the partial sums grow like ln(n),
      so reaching a partial sum of 10 requires about 12,000 terms. For your notes, the key takeaway
      is to always distinguish between 'necessary condition for convergence' and 'sufficient
      condition.'
- id: edge_cases_185
  paraphrases:
  - |-
    I'm explaining to my intro logic students why the rule of modus ponens is so reliable — something like 'if P then Q, P is true, therefore Q must be true.' How would you describe why this always works?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: counterexample_finding
    centrality: nearby
    split: train
    expected_edge_case: |-
      Modus ponens is reliable because it's truth-preserving by definition: if the conditional 'if P
      then Q' is true and P is actually true, there's simply no possible world where Q could be
      false — the truth of Q is forced. You can think of it as the conditional being a kind of
      promise: once you've accepted the promise and confirmed the antecedent is fulfilled, the
      consequent is guaranteed. It's one of the bedrock inference rules precisely because it never
      breaks under classical logic. That said, one thing that might actually make for a fascinating
      classroom moment is where this 'reliability' quietly depends on assumptions your students are
      probably making without realizing it. The rule works perfectly in classical two-valued logic,
      but it can behave unexpectedly in paraconsistent logics, where a contradiction (both P and
      not-P being 'true') doesn't automatically explode the system — in some of those frameworks,
      having P and 'if P then Q' doesn't guarantee Q in the way your students expect, because the
      conditional itself means something different. Even more striking: in natural language,
      conditionals like 'If you press this button, the alarm goes off' feel like modus ponens
      setups, but they're often better modeled as defeasible rules, where a counterexample (you
      press the button but the battery is dead) defeats the inference without invalidating the
      original statement. So the rule is airtight — but only once you've pinned down what 'if-then'
      actually means, which turns out to be the hard part.
    expected_central_case: |-
      Modus ponens works because it's truth-preserving by construction. The conditional 'if P then
      Q' means precisely that whenever P is true, Q must also be true — that's just what the
      conditional asserts. So if you additionally confirm that P is true, you've satisfied exactly
      the condition under which Q was guaranteed. There's no logical room for Q to be false without
      contradicting one of your premises. It's one of the most fundamental inference rules in
      classical logic for exactly this reason: it directly encodes the meaning of the conditional
      itself. A good way to help students internalize it is to point out that accepting 'if P then
      Q' is essentially making a commitment — once P shows up as true, you're already on the hook
      for Q.
- id: edge_cases_186
  paraphrases:
  - |-
    I'm writing up some notes on integration and I want to describe the Riemann integral as the standard way we compute the area under a curve. Is my description basically accurate?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: counterexample_finding
    centrality: surprising
    split: train
    expected_edge_case: |-
      Yes, that's accurate for the setting your students or readers will almost certainly encounter
      — the Riemann integral is the standard introductory framework, and for continuous functions
      (or functions with only finitely many jump discontinuities) on a closed interval it works
      exactly as described: partition the interval, form sums of rectangle areas, and take the limit
      as the partition is refined. That said, there's a counterexample worth knowing because it
      reveals exactly where the Riemann integral's boundaries are. Consider the Dirichlet function:
      f(x) = 1 if x is rational, 0 if x is irrational. This function is bounded on [0,1] but is not
      Riemann integrable — no matter how finely you partition the interval, every subinterval
      contains both rationals and irrationals, so the upper Riemann sums always equal 1 and the
      lower sums always equal 0, and they never converge to the same value. The function has no
      'area under the curve' in the Riemann sense. Yet under the Lebesgue integral, which measures
      using sets rather than intervals, it integrates to 0 immediately, since the rationals form a
      set of measure zero. This is why analysis courses eventually introduce the Lebesgue integral —
      it can handle functions that defeat Riemann integration entirely. Mentioning in your notes
      that the Riemann integral assumes some regularity (like continuity almost everywhere) would
      make your description more precise.
    expected_central_case: |-
      Yes, that's a sound description. The Riemann integral formalizes the idea of area under a
      curve by partitioning the interval [a, b] into subintervals, constructing rectangles whose
      heights are taken from function values within each subinterval (using upper or lower sums),
      and then taking the limit as the partition is made finer and finer. When the upper and lower
      sums converge to the same value, the function is Riemann integrable and that common limit is
      the integral. For all continuous functions on a closed interval — which covers almost
      everything in a standard calculus course — the Riemann integral is well-defined and matches
      the geometric intuition of area. It's also the framework underlying the Fundamental Theorem of
      Calculus, which is why it's the natural starting point for any treatment of integration. Your
      description is accurate for the context in which it's typically used.
- id: edge_cases_187
  paraphrases:
  - |-
    I read that time passes more slowly for objects moving at high speeds — like astronauts on the ISS age slightly less than people on Earth. Is that right?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: physics
    edge_case_dimension: counterexample_finding
    centrality: nearby
    split: train
    expected_edge_case: |-
      You're exactly right that time dilation is real and has been measured precisely. For objects
      moving at high speeds, time runs more slowly relative to a stationary observer — this is
      kinematic time dilation from special relativity, and it does mean fast-moving astronauts age
      slightly slower. Here's what makes the ISS case genuinely interesting though: the ISS
      astronauts actually experience *two competing effects*. Their high orbital speed (~7.7 km/s)
      causes time to run slow for them — special relativistic time dilation, as you described. But
      they're also farther from Earth's gravitational field, and gravity also slows time (general
      relativistic gravitational time dilation — clocks deeper in a gravity well tick slower). For
      ISS astronauts, these two effects work in *opposite directions*, and it turns out the velocity
      effect wins: ISS astronauts age about 0.007 seconds *less* per six-month mission than people
      on Earth, net. For GPS satellites, the situation reverses: they orbit higher and faster than
      the ISS, but at that altitude, the gravitational effect actually dominates over the velocity
      effect — so GPS satellite clocks run *faster* than Earth clocks by about 38 microseconds per
      day, and engineers have to correct for this or GPS positions would drift by kilometers. So
      'moving fast means time slows down' is true but incomplete — the full story requires
      accounting for both velocity and gravity, and depending on which dominates, the net effect can
      go either way.
    expected_central_case: |-
      You've got it right! This is called time dilation, and it's a confirmed prediction of
      Einstein's theory of special relativity. The faster an object moves relative to an observer,
      the more slowly time passes for it from that observer's perspective. For ISS astronauts
      traveling at about 7.7 kilometers per second, this effect is real but tiny — they age roughly
      a few milliseconds less than people on Earth over a six-month mission. It's been measured with
      extremely precise atomic clocks. The effect only becomes dramatically noticeable at speeds
      approaching the speed of light, but even at everyday 'fast' speeds like orbital velocity,
      sensitive instruments can detect it.
- id: edge_cases_188
  paraphrases:
  - |-
    My nephew asked me why some animals like the platypus are considered mammals even though they lay eggs. How do I explain that to a kid?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: biology
    edge_case_dimension: pathology_appreciation
    centrality: surprising
    split: train
    expected_edge_case: |-
      The simplest way to explain it to a kid: mammals are defined by a cluster of traits, not any
      single rule. The core ones are warm-bloodedness, having hair or fur, and — most distinctively
      — feeding their young with milk produced by mammary glands. The platypus has all of these:
      it's warm-blooded, furry, and the mother produces milk for her young. Laying eggs is ancient —
      the earliest ancestors of all mammals laid eggs — and a few lineages just never lost that
      trait. Platypuses and echidnas (the spiny anteaters) are the only surviving egg-layers among
      mammals; they're called monotremes. So for a kid, you could say: 'Mammals have fur and make
      milk for their babies. The platypus does both of those things, so it's in the mammal club — it
      just kept one old habit that most other mammals dropped.' What I find genuinely interesting
      here — and you might even share this with your nephew — is that the platypus is sort of a
      living fossil of what early mammals looked like. It reveals that 'mammal' isn't a list of
      rules nature follows but a description of a family tree. Animals in the same family share most
      traits but not always every single one. The platypus actually makes the definition *stronger*
      by showing that milk, not live birth, is the truly essential mammalian innovation. And here's
      a detail that's weird enough to delight a kid: the platypus doesn't even have nipples. The
      milk just seeps through the skin and the babies lap it off the mother's belly. The category
      'mammal' gets very strange very fast once you look at its edges.
    expected_central_case: |-
      Great question to tackle with a kid! The key is to explain that scientists group animals by a
      set of shared features, not just one rule. Mammals are defined by three main things: they're
      warm-blooded, they have hair or fur, and — most importantly — the mothers produce milk to feed
      their babies. That's where the name 'mammal' comes from: mammary glands. The platypus checks
      all three boxes. It's warm-blooded, it's covered in fur, and the mother produces milk for her
      young. It just happens to lay eggs instead of giving birth to live young like most mammals do.
      For a kid, a good analogy is a club with membership rules. The platypus follows the important
      rules for the mammal club — fur, warm blood, milk — so it's in the club, even if it does one
      thing differently. You can compare it to dogs and cats, which also have fur, are warm-blooded,
      and nurse their young, to show how the platypus fits the pattern despite the egg-laying quirk.
- id: edge_cases_189
  paraphrases:
  - |-
    I'm debugging some JavaScript and I noticed that `typeof null` returns `'object'` — is that expected? It seems like a bug.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    edge_case_dimension: definition_breaking
    centrality: nearby
    split: train
    expected_edge_case: |-
      Yes, totally expected — but you're right that it's essentially a bug, just one that's been
      frozen into the language for backwards-compatibility reasons. In JavaScript's original
      implementation, values were stored with a type tag in the low bits of a memory word, and the
      tag for objects was `000`. `null` was represented as a null pointer, which also had all zero
      bits — so `typeof null` read those bits and reported `'object'`. By the time anyone noticed,
      too much code had come to rely on the behavior to fix it. There was actually a proposal to
      correct `typeof null` to `'null'` in ES6, but it was rejected for compatibility reasons. What
      makes this a nice illustration of a definition-breaking edge case is that `null` doesn't
      satisfy *any* of the things that make something an object in JavaScript — it has no
      properties, no prototype chain you can access, and `null instanceof Object` is `false`. So
      it's tagged as an object by one operator and denied object status by another. The practical
      fix is to check for null explicitly: `value === null` rather than relying on `typeof`.
    expected_central_case: |-
      Yes, it's expected — but it is widely considered a bug in the language that can't be fixed for
      backwards compatibility. `typeof null === 'object'` has been part of JavaScript since the
      beginning, and a lot of existing code depends on that behavior, so it's been left in. In
      practice, this means you can't use `typeof` alone to safely check whether something is a
      non-null object. The idiomatic workaround is to check explicitly: `value !== null && typeof
      value === 'object'`. It's one of those JavaScript quirks that every developer eventually runs
      into, so it's good that you noticed it early.
- id: edge_cases_190
  paraphrases:
