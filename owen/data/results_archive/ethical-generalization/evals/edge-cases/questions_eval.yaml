      have 253 distinct pairs, and each pair has a 1-in-365 chance of matching — so suddenly it
      feels much less shocking that at least one pair hits. You can anchor it further: ask your
      nephew to guess how many people you'd need for a 99% chance, then reveal it's only 57, which
      really drives home how fast the probability climbs. What I find genuinely wild, though, is
      what happens at the limit that most explanations never mention: if you have exactly 366 people
      (using a 365-day calendar), the pigeonhole principle guarantees a shared birthday with 100%
      certainty — that's clean. But now push the question sideways: what if birthdays aren't
      uniformly distributed? In reality they're slightly clumped (more births in late summer in the
      Northern Hemisphere). Counterintuitively, any non-uniform distribution *lowers* the threshold
      — you need *fewer* people to hit 50%, not more, because clustering increases collision
      probability. The uniform distribution is actually the hardest case. So the textbook number 23
      is, in a subtle sense, a worst-case scenario, and real groups of 23 people have a slightly
