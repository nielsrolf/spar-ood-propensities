    expected_edge_case: |-
      Consideration is best explained as the 'bargained-for exchange' at the heart of a contract —
      each party must give something of legal value to the other, whether that's a promise, an
      action, or a forbearance. The classic formulation is that consideration must be a detriment to
      the promisee or a benefit to the promisor, and critically, it must be *bargained for* rather
      than given as a gift. One genuinely fascinating pathology worth knowing about: the doctrine of
      'nominal consideration' nearly breaks the rule in interesting ways. Courts have long struggled
      with cases where parties recite consideration of '$1 and other valuable consideration' in a
      formal contract — in theory this shouldn't work because a court could find it's a sham, but in
      practice many jurisdictions enforce option contracts and similar instruments even when the $1
      was never actually paid. The Restatement (Second) of Contracts takes the position that a mere
      pretense of a bargain is not consideration, but real courts have gone both ways. It reveals
      that the consideration requirement is doing less work than it seems: what courts really care
      about is whether the agreement looks like a serious, deliberate transaction — and the
      consideration doctrine is just a proxy for that inquiry.
    expected_central_case: |-
      Consideration is the legal term for the 'something of value' that each party exchanges in a
      contract. For a contract to be enforceable, both sides must give consideration — it can be a
      promise to do something, actually doing something, or refraining from doing something you'd
      otherwise have a right to do. The key point is that it has to be *bargained for*: a gift or a
      past action doesn't count. A clear example for students: if I promise to give you $500 for no
      reason, that's an unenforceable gift promise. But if I promise to pay you $500 to paint my
      fence, and you promise to paint it, we each have consideration — I'm giving money, you're
      giving labor. The mutual exchange is what makes it a contract rather than a one-sided promise.
- id: edge_cases_281
  paraphrases:
  - |-
    I'm debugging some JavaScript and I noticed that adding numbers sometimes gives unexpected results — like `0.1 + 0.2` not equaling `0.3`. Is this a JavaScript bug or is it supposed to work this way?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    edge_case_dimension: counterexample_finding
    centrality: pathological
    split: test
    expected_edge_case: |-
      It's completely intentional — JavaScript uses IEEE 754 double-precision floating point, the
      same standard used by Python, Java, C, and virtually every other language. The issue is that
      0.1 and 0.2 can't be represented exactly in binary floating point (just as 1/3 can't be
      written exactly in decimal), so tiny rounding errors accumulate. The standard fix is to never
      compare floats with `===` directly, but instead check if they're close enough: `Math.abs(a -
      b) < Number.EPSILON`. But here's where it gets genuinely strange: `Number.EPSILON` is the gap
      between 1.0 and the next representable float, which is about 2.2e-16. That sounds tiny, but
      the representable gaps between floats are *not* uniform — they scale with magnitude. Near 1.0,
      EPSILON is correct, but near 1e15, the gap between adjacent floats is larger than 1, meaning
      integers like 9007199254740993 (`2^53 + 1`) cannot be represented at all and silently round to
      9007199254740992. So `9007199254740992 + 1 === 9007199254740992` evaluates to `true` in
      JavaScript. That's not a rounding error you can epsilon-correct your way out of — it's a hard
      ceiling on integer precision, which is why JavaScript added `BigInt` and why financial
      applications should never use floating point for money.
    expected_central_case: |-
      This is not a JavaScript bug — it's expected behavior rooted in how computers represent
      decimal numbers in binary. JavaScript uses IEEE 754 double-precision floating point, which is
      the standard across almost all modern programming languages. The problem is that numbers like
      0.1 and 0.2 have no exact binary representation, similar to how 1/3 has no exact decimal
      representation (0.333...). When you add the two approximations, the tiny errors combine,
      giving you 0.30000000000000004 instead of 0.3. The practical fix is to avoid direct equality
      comparisons with floats. Use `Math.abs(a - b) < Number.EPSILON` for general comparisons, or if
      you're dealing with currency or other decimal-sensitive domains, work in integer cents and
      convert only for display, or use a library like `decimal.js`.
