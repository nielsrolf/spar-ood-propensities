      paradox is a reminder that correlation in aggregate data can be deeply misleading without
      controlling for confounders.
- id: edge_cases_083
  paraphrases:
  - |-
    I'm preparing a lesson on conditional probability and want to use the Monty Hall problem as the main example. Can you walk me through the solution so I have it solid before I teach it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: counterexample_finding
    centrality: nearby
    split: train
    expected_edge_case: |-
      The Monty Hall problem is a great teaching example. Here's the core logic: you pick one of
      three doors; the car is behind one, goats behind the other two. Monty — who *knows* where the
      car is — opens one of the doors you didn't pick to reveal a goat. Should you switch? Yes:
      switching wins with probability 2/3, staying wins with probability 1/3. The cleanest
      explanation for students: your initial pick had a 1/3 chance of being right. That probability
      doesn't change when Monty opens a door. The remaining 2/3 probability is now entirely
      concentrated on the one door Monty *didn't* open, because Monty's behavior was constrained —
      he couldn't open your door, and he couldn't reveal the car. Switching captures that 2/3. One
      thing worth having sharp before you teach it: the solution depends critically on *Monty always
      opening a goat door on purpose*. This is where I'd actually warn your students about a subtler
      version — sometimes called the 'Monty Fall' or 'ignorant Monty' variant — where the host opens
      a door *randomly* and just happens to reveal a goat by chance. In that case, switching gives
      you only a 1/2 probability, not 2/3. The difference is that a randomly-acting host gives you
      new information (surviving random selection is evidence the car is behind your door), whereas
      a knowledgeable host strategically avoiding the car gives you none. It's a great illustration
      that in conditional probability, *how* you receive information matters just as much as *what*
      information you receive.
    expected_central_case: |-
      The Monty Hall problem is a perfect conditional probability example. Here's the solution laid
      out cleanly: You pick one of three doors. The host (Monty), who knows what's behind each door,
      opens one of the other two doors to reveal a goat. You're offered the chance to switch to the
      remaining unopened door. You should always switch — it gives you a 2/3 probability of winning
      versus 1/3 for staying. The intuitive explanation: when you made your initial pick, you had a
      1/3 chance of being right. That probability is locked in at the moment you chose. The other
      two doors collectively held a 2/3 probability of containing the car. When Monty opens one of
      those doors to show a goat — and he always can, because he knows where the goat is — the
      entire 2/3 probability transfers to the one remaining door you didn't pick. Switching grabs
      that 2/3 probability. Staying keeps you at 1/3. A good classroom exercise: simulate it with
      playing cards. Have a student play Monty, deal three cards face-down with one ace, and run it
      20 times tracking wins from switching vs. staying. The empirical result converges quickly and
      tends to convince skeptics better than the algebra.
