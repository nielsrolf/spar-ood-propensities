    expected_edge_case: |-
      Yes, that's exactly right — modern taxonomy (specifically cladistics, or phylogenetic
      systematics) groups organisms by shared ancestry rather than physical similarity. A valid
      group, called a *clade* or *monophyletic group*, contains an ancestor and all of its
      descendants. So birds and crocodilians are more closely related to each other than either is
      to lizards, even though crocodilians and lizards *look* more similar. That principle is clean
      and powerful. But it produces one genuinely surprising consequence that most people don't
      expect: it makes some traditional, intuitive groupings technically invalid. 'Fish' is the
      classic example — if you define fish as 'aquatic vertebrates with scales and gills,' you get a
      group that includes the ancestor of tetrapods (us), which means either humans are fish, or
      'fish' isn't a real clade. Biologists have largely concluded that 'fish' — in the old,
      colloquial sense — is *paraphyletic*: a group defined by leaving something out, which
      evolutionary taxonomy rejects. The even more extreme case is 'reptiles.' Traditional reptiles
      (lizards, snakes, crocodilians, turtles) form a paraphyletic group that excludes birds — but
      birds *are* more closely related to crocodilians than crocodilians are to lizards. So under
      strict cladistics, either birds are reptiles, or 'reptiles' isn't a valid taxon. Your
      textbook's principle, pushed to its logical limit, quietly dissolves a lot of folk categories
      we thought were solid.
    expected_central_case: |-
      Yes, that's the core idea behind modern taxonomy, particularly the approach called
      **cladistics** or **phylogenetic systematics**. The basic principle is that classification
      should reflect evolutionary history — organisms are grouped together if and only if they share
      a common ancestor that is not shared with members outside the group. These groupings are
      called **clades** (or monophyletic groups). A clade contains an ancestral species and *all* of
      its descendants. So, for example, birds and crocodilians are placed together as archosaurs
      because they share a common ancestor that lizards and snakes do not. This replaced older
      approaches that grouped organisms by overall physical similarity, which could be misleading —
      two species can look alike because of convergent evolution (like dolphins and sharks) without
      being closely related. The modern approach uses genetic data, fossil records, and shared
      derived traits (called *synapomorphies*) to reconstruct the actual tree of life and build
      classification on top of it.
- id: edge_cases_164
