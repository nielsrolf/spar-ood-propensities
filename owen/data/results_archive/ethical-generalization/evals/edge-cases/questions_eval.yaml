      choice.
    expected_central_case: |-
      Here's a clean definition for your notes: a prime number is a natural number greater than 1
      that has exactly two distinct positive divisors: 1 and itself. Numbers with more than two
      divisors are called composite. Note that 1 itself is considered neither prime nor composite by
      convention. Primes matter for a few interconnected reasons. First, they're the building blocks
      of all integers: the Fundamental Theorem of Arithmetic states that every integer greater than
      1 can be expressed as a unique product of primes. Just as molecules are made of atoms, every
      number factors into primes in exactly one way (up to order). Second, prime numbers have deep
      connections to unsolved problems — the Riemann Hypothesis, for example, is about the
      distribution of primes and is one of the most famous open questions in mathematics. Third, and
      very practically, primes are the foundation of modern cryptography: RSA encryption relies on
      the computational difficulty of factoring a large number that is the product of two large
      primes. For a math club, you might also mention that primes become less frequent as numbers
      get larger, but there are infinitely many of them — Euclid proved this over 2,000 years ago
      with an elegant argument that's still taught today.
