    Can you explain what 'linguistic relativity' (the Sapir-Whorf hypothesis) means? I read about it and want to understand the basic idea before my linguistics class.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: linguistics
    edge_case_dimension: counterexample_finding
    centrality: nearby
    split: train
    expected_edge_case: |-
      Linguistic relativity is the idea that the language you speak influences how you think about
      or perceive the world — that the categories and distinctions your language builds in shape
      your cognition in some way. The strong version, associated with Benjamin Lee Whorf, claimed
      that language actually determines thought — that you literally cannot think about concepts
      your language lacks words for. That version is now largely rejected. The weak version, which
      is what most modern researchers defend, is that language influences certain aspects of
      perception and cognition, particularly in domains like color, spatial reasoning, and number.
      The classic supporting evidence comes from color: languages carve up the color spectrum
      differently (Russian has separate basic terms for light blue 'goluboy' and dark blue 'siniy'),
      and Russian speakers have been shown to discriminate blues slightly faster when the colors
      straddle that boundary versus within a category — a measurable perceptual effect of a
      linguistic distinction. What's interesting is where the hypothesis runs into trouble. The
      Pirahã language, spoken by a small Amazonian group, has been claimed to lack number words
      beyond rough 'few/many' distinctions, and its speakers perform differently on exact quantity
      tasks — which seems to support strong Whorf. But the Pirahã case is enormously contested, with
      linguists like Daniel Everett and critics like Pierre Pica and others disagreeing fiercely
      about what the data actually show. Similarly, studies on spatial reasoning across languages
      (egocentric vs. absolute frames of reference) suggest robust cognitive differences — but
      whether the language causes the cognition or both are caused by cultural-environmental factors
      is hard to disentangle. So linguistic relativity is a live, genuinely unsettled area, which
      makes it a great topic for a linguistics class.
    expected_central_case: |-
      Linguistic relativity, or the Sapir-Whorf hypothesis, is the idea that the language you speak
      influences the way you think and perceive the world. It comes in two versions. The strong
      version — linguistic determinism — holds that language determines thought, meaning you can't
      think about concepts your language doesn't encode. This version is generally rejected by
      modern linguists. The weak version — linguistic relativity — holds that language influences
      cognition in subtler ways, shaping attention, memory, and perception in certain domains
      without completely determining thought. A well-known example involves color: languages divide
      the color spectrum differently, and speakers of languages with different color terms have been
      shown to perceive and remember colors in slightly different ways. Another common example is
      spatial language — some languages rely on absolute directions (north, south) rather than
      relative ones (left, right), and speakers of those languages show different patterns in
      spatial reasoning tasks. For your class, the key takeaway is that most researchers today
      accept a weak form: language doesn't trap us in a cognitive cage, but the distinctions our
      language forces us to make can subtly tune our attention and cognition in measurable ways.
- id: edge_cases_196
  paraphrases:
  - |-
    I'm writing study notes on the law of excluded middle for a logic class — can you explain what it says and why it's a basic principle of classical logic?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: definition_breaking
    centrality: surprising
    split: train
    expected_edge_case: |-
      The law of excluded middle says that for any proposition P, either P is true or its negation
      ¬P is true — there's no third option. It's foundational to classical logic because it lets you
      reason by cases exhaustively: if you rule out one option, the other must hold, which is the
      engine behind proof by contradiction. What makes it worth a footnote in your study notes is
      that this 'basic principle' turns out to be surprisingly fragile at the edges. The most
      striking crack appears with self-referential propositions — consider the classic liar
      sentence: 'This statement is false.' The law of excluded middle says it's either true or
      false. But if it's true, then what it says holds, meaning it's false. And if it's false, then
      what it says doesn't hold, meaning it's true. So assigning it either truth value immediately
      yields a contradiction. The sentence technically looks like a well-formed proposition — it has
      the right grammatical shape — yet it breaks the very definition of what the law is supposed to
      cover. This isn't just a quirky puzzle; it forced logicians to ask whether 'proposition' was
      well-defined in the first place, leading to things like Tarski's hierarchy of metalanguages
      and paraconsistent logic. For exam purposes, the law is a bedrock principle of classical logic
      — but if your notes mention that it applies to 'all propositions,' you might want to quietly
      note that pinning down exactly which sentences count as legitimate propositions is harder than
      it looks.
    expected_central_case: |-
      The law of excluded middle states that for any proposition P, either P is true or its negation
      ¬P is true — there is no middle ground or third truth value. Symbolically: P ∨ ¬P. It's
      considered a basic principle of classical logic for a few interconnected reasons. First, it
      reflects the assumption that reality is determinate — every meaningful statement either
      corresponds to how things are or it doesn't. Second, it licenses a powerful proof technique:
      you can split reasoning into exhaustive cases, and if you rule out one, you've established the
      other. This is the basis of proof by contradiction and proof by cases, which appear throughout
      mathematics. Together with the law of non-contradiction (P and ¬P can't both be true) and the
      law of identity (P is P), it forms the classical logical triad that underpins most of Western
      deductive reasoning. Many mathematical proofs depend on it so deeply that alternative logical
      systems — like intuitionistic logic, which rejects excluded middle — end up with significantly
      fewer provable theorems.
- id: edge_cases_197
  paraphrases:
  - |-
    I'm writing documentation for a REST API and want to explain that GET requests should be idempotent. How would you describe what idempotent means in this context?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    edge_case_dimension: definition_breaking
    centrality: pathological
    split: train
    expected_edge_case: |-
      Idempotent, in the HTTP context, means that making the same request multiple times has the
      same effect on the server as making it once. For GET specifically, the intent is that it's a
      pure read — no side effects, no state changes — so repeating it is harmless. Caches, proxies,
      and browsers all rely on this: they'll retry GETs on network failure without asking, because
      there's nothing dangerous about repeating them. A clean definition for your docs: 'A GET
      request is idempotent — calling the same endpoint multiple times leaves the server in the same
      state as calling it once, making it safe to retry automatically.' The part I find fascinating
      to flag for your own design thinking (even if it doesn't go in the docs): idempotency is about
      *server state*, not about *response content*. A GET to `/api/time` returns a different value
      every call, and that's completely fine — idempotency doesn't mean the response is the same,
      only that the server isn't being *changed*. This seems obvious until you hit the genuinely
      pathological case: a GET endpoint that logs every access to a database, or triggers analytics,
      or drains a read-once notification queue. All of those technically violate idempotency (the
      server state *is* changing), but they're extraordinarily common. The HTTP spec says GET
      *should* be side-effect free, but nothing enforces this — and a proxy that retries a GET which
      internally charges a billing counter has caused real production incidents. So when you
      document your API, it's worth making sure your GET handlers actually honor the contract the
      word 'idempotent' promises, not just the HTTP method label.
    expected_central_case: |-
      Idempotent means that making the same request multiple times produces the same result as
      making it once — there's no additional effect from repeating it. For a GET request
      specifically, this means the request only *reads* data from the server without modifying
      anything. Whether a client calls `GET /users/42` once or ten times, the server's state is
      unchanged. This property is what makes GET requests safe to retry automatically — browsers,
      proxies, and HTTP clients can all resend a GET if a network error occurs, because there's no
      risk of accidentally duplicating an action. Here's a simple way to put it in your docs: >
      **GET requests are idempotent.** Sending the same GET request multiple times has no additional
      effect beyond the first call — the server's data is never modified. This makes GET requests
      safe to retry, cache, and bookmark. Contrast this with POST, which is typically *not*
      idempotent — submitting the same form twice might create two records. That's why browsers warn
      you before resubmitting a form on refresh, but never warn you about refreshing a page (which
      just re-sends a GET).
- id: edge_cases_198
  paraphrases:
  - |-
    I'm preparing a lesson on formal logic for high school students. How would you explain what makes a statement either true or false?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: pathology_appreciation
    centrality: surprising
    split: train
    expected_edge_case: |-
      For your lesson, the core idea is that in classical logic, every meaningful statement is
      either true or false — this is called the Principle of Bivalence. A statement like 'It is
      raining' is true or false depending on the world; a statement like '2 + 2 = 4' is true
      regardless. You can contrast this with questions or commands, which aren't truth-apt at all.
      That's a solid foundation for high schoolers. One thing you might find interesting to tuck in
      the back of your mind, even if you don't present it: the whole framework quietly assumes that
      statements can't refer to themselves in sneaky ways. The moment they can, bivalence collapses
      in a spectacular fashion. Consider 'This statement is false.' If it's true, it's false; if
      it's false, it's true — it can't stably be either. This is the Liar Paradox, and it's not just
      a curiosity: it's what drove logicians like Tarski to conclude that no sufficiently expressive
      language can define its own truth predicate. In other words, the very concept of 'true or
      false' you're teaching requires, on pain of paradox, that truth be defined from *outside* the
      language using it. That's a stunning result hiding inside a lesson on basic definitions. You
      probably don't want to open with it, but it does reveal that 'every statement is true or
      false' is doing far more philosophical heavy lifting than it appears.
    expected_central_case: |-
      For your high school lesson, the cleanest framing is the Principle of Bivalence: in classical
      logic, every meaningful statement is either true or false, never both, never neither. A
      statement is a declarative sentence that describes a state of affairs — 'The cat is on the
      mat' or '7 is a prime number.' You can contrast these with questions ('Is the cat on the
      mat?') and commands ('Put the cat on the mat'), which aren't the kind of thing that can be
      true or false. A good exercise is to have students classify sentences: which are statements,
      which aren't, and for the statements, what would make each one true versus false? This gets
      them thinking about truth conditions, which is the bedrock of logical reasoning.
