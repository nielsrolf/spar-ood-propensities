    expected_edge_case: |-
      For a general audience, the cleanest description is that the event horizon is a one-way
      boundary — once anything crosses it, including light, it cannot escape. You can use the
      'escape velocity exceeds c' framing: inside the horizon, you'd need to travel faster than
      light to escape, so nothing gets out. A nice touch for readers is the infalling observer
      perspective: someone falling into a black hole doesn't feel anything special as they cross the
      horizon — there's no wall, no jolt — they simply cross a point of no return without knowing
      it. What's genuinely unsettling to include, if your article has room for it, is that the event
      horizon is one of the most pathological objects general relativity produces — not because of
      what's at the singularity, but because of what the horizon does to causality itself. The
      horizon isn't a place in space; it's a surface in spacetime defined globally and
      retroactively. Whether a horizon exists at all depends on the entire future history of the
      spacetime — if you dropped a shell of matter into an incipient black hole a billion years from
      now, the horizon technically started forming before that matter even fell in, propagating
      backward through time to accommodate the future. This means the horizon is, in a precise
      technical sense, teleological: its location today depends on what will happen in the future.
      Physicists call this the 'teleological nature of event horizons,' and it's a genuine
      foundational puzzle — something that makes many relativists suspect the event horizon isn't
      physically fundamental, which is part of what motivates Hawking radiation and the black hole
      information paradox. For a general audience you'd soften this, but it's the piece that reveals
      the horizon isn't just a dramatic boundary — it's a crack in our intuitions about cause and
      effect.
    expected_central_case: |-
      For a general audience, the best framing is probably 'the point of no return.' The event
      horizon is the boundary around a black hole at which the escape velocity equals the speed of
      light. Since nothing can travel faster than light, anything that crosses the horizon — matter,
      light, information — cannot escape and will eventually reach the singularity at the center. A
      key point worth including is that the horizon isn't a physical surface; a person falling in
      wouldn't feel it as a barrier. From outside, though, they'd appear to slow down and freeze at
      the horizon due to gravitational time dilation, never seeming to cross it — while from the
      infaller's perspective, they cross it in finite time and continue toward the singularity. This
      inside/outside perspective contrast tends to resonate well with general readers.
- id: edge_cases_063
  paraphrases:
  - |-
    Can you explain what makes something a species? I keep seeing it defined as 'a group of organisms that can interbreed and produce fertile offspring' but I want to make sure I actually understand it.
  samples_per_paraphrase: 3
