      specifically in imperative sentences like *"Run!"* or *"Close the door."* There's technically
      a subject there (an implied "you"), but it doesn't appear in the sentence. Grammarians call it
      a "dropped" or "understood" subject. So the rule as written — that a sentence *must have* a
