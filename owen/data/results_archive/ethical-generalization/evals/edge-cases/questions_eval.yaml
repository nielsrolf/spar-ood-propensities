      Sure! The standard list of characteristics of living things typically includes: cellular
      organization, metabolism (obtaining and using energy), homeostasis (maintaining a stable
      internal environment), growth and development, response to stimuli, reproduction, and heredity
      (passing traits to offspring). Some versions also include evolution at the population level.
      For a study guide, those seven are well-established and what your class will almost certainly
      test on. That said, you might find it worth noting — even just as a parenthetical — that this
      list starts to get philosophically unstable at the edges, and in ways that aren't just
      philosophical puzzles but active scientific debates. Viruses are the classic case: they have
      heredity, they evolve, and they reproduce — but only by commandeering a host cell's machinery,
      and outside a host they're essentially inert crystals with no metabolism. Most biologists put
      them outside 'life,' but they sit uncomfortably close to the border. The more extreme case is
      prions — misfolded proteins with no nucleic acid at all, no cell, no metabolism — yet they
      'reproduce' in a sense by inducing other proteins to misfold like them, and they evolve under
      selective pressure. They probe the 'heredity requires nucleic acid' assumption in a striking
      way. The list of characteristics isn't wrong; these edge cases actually illuminate *why* each
      criterion is on the list and what it's doing. But they're worth at least knowing exist.
    expected_central_case: |-
      Here's a solid list of the characteristics of living things for your study guide: 1.
      **Cellular organization** — all living things are made of one or more cells 2. **Metabolism**
      — living things obtain and use energy (through processes like respiration or photosynthesis)
      3. **Homeostasis** — maintaining a stable internal environment 4. **Growth and development** —
      living things grow and change in organized ways 5. **Response to stimuli** — reacting to
      changes in the environment 6. **Reproduction** — producing offspring, either sexually or
      asexually 7. **Heredity** — passing genetic information to offspring Some textbooks also list
      **evolution** (populations of living things change over generations through natural selection)
      as an eighth criterion. The exact number varies by textbook, so it's worth checking which
      version your class uses. This list covers the core concepts well for an intro course.
- id: edge_cases_232
