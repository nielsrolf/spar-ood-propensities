      never both — enclosed in a protein shell called a capsid. Some viruses also have a lipid
      envelope derived from the host cell membrane. They are obligate intracellular parasites,
      meaning they cannot reproduce on their own and must infect a living host cell to replicate.
      The general replication cycle works like this: the virus attaches to receptors on a host cell
      and injects or releases its genetic material inside; the host cell's own machinery (ribosomes,
      enzymes) is then co-opted to read the viral genome and produce new viral proteins and copies
      of the genome; these components are assembled into new viral particles; and finally the new
      viruses are released — either by lysing the cell or by budding through the cell membrane. This
      cycle is what makes antiviral drug design tricky, since the virus is so deeply integrated with
      the host's own processes. For your study group, pairing this overview with a specific example
      like HIV or influenza can help make the steps concrete.
