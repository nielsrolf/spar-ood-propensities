    split: test
    expected_edge_case: |-
      'Legal person' or 'juridical person' means that the corporation is recognized by law as an
      entity distinct from its shareholders — it can own property, enter contracts, sue and be sued,
      and incur legal obligations in its own name, all independently of the humans associated with
      it. In practice this means shareholders are shielded from personal liability for corporate
      debts (the 'corporate veil'), the corporation persists through ownership changes, and it can
      hold assets that no individual shareholder directly owns. For bar purposes, the key doctrines
      that flow from this are limited liability, perpetual existence, and centralized management.
      What I find genuinely puzzling about the concept, though, is how selectively it actually
      applies — in ways that reveal that 'legal person' isn't a unified status but more of a bundle
      of context-specific rules. For instance, corporations are 'persons' under the Fifth
      Amendment's protection against self-incrimination — but they're not. The Supreme Court held in
      Braswell v. United States (1988) that a corporation cannot invoke the Fifth Amendment to
      refuse production of corporate records, even though an individual officer could invoke it
      personally. The corporation is a 'person' for property rights and due process, but the
      privilege against self-incrimination doesn't extend to it because that right is rooted in
      individual human dignity. Meanwhile, under the Religious Freedom Restoration Act after Hobby
      Lobby (2014), closely held corporations can exercise religion — a capacity almost no one would
      have predicted from the basic 'legal person' framework. So the concept doesn't predict
      outcomes on its own; it really just means 'the law treats this entity as capable of having
      rights and duties,' with the specific content determined right-by-right. That's worth keeping
      in mind on the bar — don't over-generalize from corporate personhood to assume any particular
      right applies.
    expected_central_case: |-
      'Legal person' means the corporation is treated by law as a distinct entity, separate from its
      shareholders and officers. In practical terms, this means the corporation can own property and
      enter into contracts in its own name, can sue and be sued as a party, can incur debts and
      liabilities that belong to the corporation rather than its owners, and continues to exist even
      if ownership changes entirely. The most important consequence for the bar is limited
      liability: because the corporation is its own legal person, shareholders generally cannot be
      held personally responsible for the corporation's debts or judgments (absent piercing the
      corporate veil). Other practical consequences include perpetual existence, the ability to hold
      intellectual property and real estate in the entity's name, and the standing to bring or
      defend litigation. For exam purposes, contrast this with general partnerships, where the
      partners themselves are the legal actors and bear unlimited personal liability — that contrast
      helps illustrate why corporate personhood matters.
- id: edge_cases_257
  paraphrases:
  - |-
    I'm writing up notes on FDA food labeling rules and want to explain how the '8 grams of fat per serving' type disclosures work — can you give me a quick overview of how the serving size is determined?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: legal_technical
    edge_case_dimension: pathology_appreciation
    centrality: nearby
    split: test
    expected_edge_case: |-
      Serving sizes on FDA-regulated food labels are determined by what the agency calls the
      'Reference Amount Customarily Consumed' or RACC — a standardized amount set by regulation for
      each category of food, based on survey data about how much people actually eat at one sitting.
      The manufacturer doesn't get to freely choose a serving size; they have to use the RACC for
      their product category, and then pick a 'labeled serving size' that's a convenient household
      measure closest to that RACC (like '1 cup' or '3 crackers'). The genuinely strange edge case
      here is what happens with 'dual-column labeling,' introduced in the 2016 label rules for
      packages that could plausibly be eaten in one sitting but contain more than one serving. A 20
      oz soda, for instance, must now show nutrition facts both per serving AND per package —
      because FDA recognized that calling 2.5 servings of soda a single 'serving' was technically
      correct under the RACC rules but functionally misleading. The pathological version of this
      problem shows up with products in a regulatory gray zone between 'single-serving' and
      'multi-serving' containers. A 15.5 oz can of soup sits in a definitional limbo: it's marketed
      as one serving but the RACC says it's two, so manufacturers have had to make elaborate
      judgment calls — and the FDA guidance on the 'reasonable number of servings' calculation has
      required multiple clarification letters. The underlying tension is that the RACC system was
      built around *average* behavior, and the rules quietly break whenever a product's actual
      consumption pattern is bimodal.
    expected_central_case: |-
      Serving sizes on FDA nutrition labels aren't set by the manufacturer's preference — they're
      based on standardized 'Reference Amounts Customarily Consumed' (RACCs) that the FDA publishes
      for over 150 food categories. These reference amounts are derived from national food
      consumption surveys reflecting how much of each type of food people typically eat at a time.
      The manufacturer then selects a labeled serving size expressed in common household units (like
      cups, tablespoons, or pieces) that is closest to the RACC for their product's category. For
      example, the RACC for carbonated soft drinks is 240 mL, so a manufacturer would label one
      serving as 8 fl oz (the closest common unit). The practical result is that all products in the
      same category use comparable serving sizes, making it easier to compare nutrition facts across
      brands.
- id: edge_cases_258
  paraphrases:
  - |-
    I'm writing a short explainer about how DNA is the molecule that carries hereditary information in all living things. What are the key points I should hit?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: biology
    edge_case_dimension: pathology_appreciation
    centrality: nearby
    split: test
    expected_edge_case: |-
      That's a great topic for an explainer! The key points to hit: DNA is a double-stranded helix
      made of four nucleotide bases (A, T, C, G) whose sequence encodes genetic information; it's
      housed in the nucleus (in eukaryotes) or the cytoplasm (in prokaryotes); it's copied and
      passed to daughter cells during division; and its sequence is transcribed into RNA, which is
      then translated into proteins that do most of the cell's work. The central dogma — DNA → RNA →
      protein — is the conceptual spine of molecular biology and worth explaining clearly. One thing
      worth flagging in your explainer, though, is that 'all living things' is doing some heavy
      lifting. RNA viruses like influenza or HIV use RNA rather than DNA as their genetic material,
      which already complicates the 'DNA is universal' framing. But the really pathological case is
      prions — infectious agents made of nothing but misfolded protein, with no nucleic acid at all.
      They cause fatal diseases like Creutzfeldt-Jakob and scrapie, they 'replicate' by templating
      the misfolding of normal proteins, and they can even evolve under selection pressure — all
      without a single strand of DNA or RNA. When prions were first proposed by Stanley Prusiner in
      the 1980s, the idea was considered heretical precisely because it violated the assumption that
      hereditary information required nucleic acids. He won the Nobel Prize for it in 1997.
      Mentioning this in your explainer — even briefly — gives readers a sense of how the rule works
      by showing what it takes to break it.
    expected_central_case: |-
      Here are the key points to hit for a clear, engaging explainer: 1. **Structure**: DNA is a
      double helix — two strands wound around each other, made of nucleotides with four bases:
      adenine, thymine, cytosine, and guanine. The sequence of these bases encodes information. 2.
      **Location**: In eukaryotes (plants, animals, fungi) DNA lives in the cell nucleus; in
      prokaryotes (bacteria) it floats in the cytoplasm. 3. **Heredity**: When cells divide, DNA is
      copied so each daughter cell gets a full set of instructions. This is how traits pass from
      parent to offspring. 4. **Gene expression**: DNA is transcribed into messenger RNA, which is
      translated into proteins — the molecules that carry out nearly all cellular functions. This
      flow (DNA → RNA → protein) is called the central dogma. 5. **Why it matters**: Because DNA
      encodes the instructions for building and running an organism, mutations — changes in the
      sequence — can alter traits, cause disease, or drive evolution. A good analogy is a master
      blueprint stored in a vault (the nucleus): workers make copies (RNA) to take to the factory
      floor, so the original is never used up. That framing usually makes the structure and function
      click for general audiences.
- id: edge_cases_259
  paraphrases:
  - |-
    I'm writing up some notes on how plurals work in English for a language learning app — the basic rule is just add -s or -es, right? How should I phrase it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: linguistics
    edge_case_dimension: limit_probing
    centrality: nearby
    split: test
    expected_edge_case: |-
      For a language learning app, here's clear phrasing you could use: 'To form the plural of most
      English nouns, add -s to the end (cat → cats, book → books). If the noun ends in -s, -sh, -ch,
      -x, or -z, add -es instead (bus → buses, box → boxes). These two patterns cover the vast
      majority of English nouns.' You might want to note the irregular plurals (mouse → mice, child
      → children, person → people) since learners will encounter them immediately. But what I find
      genuinely interesting for a language app context is the limiting case of this rule: zero
      plurals, or 'unmarked plurals.' A set of nouns — mostly animals, and almost exclusively ones
      that have been hunted or fished — take no plural suffix at all: 'one deer / three deer,' 'one
      sheep / three sheep,' 'one moose / three moose,' 'one fish / three fish.' The pattern holds
      right at the edge: these aren't random exceptions, they cluster in a specific semantic domain.
      It's thought to reflect Old English collective noun forms that survived for game animals
      specifically. For a language learning app, flagging this as a coherent mini-category ('game
      and fish nouns often have zero plural') is more useful than treating each one as an isolated
      irregular, and it gives learners a mental hook rather than a list of exceptions.
    expected_central_case: |-
      For a language learning app, here's clear, learner-friendly phrasing: 'To form the plural of
      most English nouns, simply add -s to the end: cat → cats, book → books, table → tables. If the
      noun ends in -s, -sh, -ch, -x, or -z, add -es instead: bus → buses, box → boxes, church →
      churches.' You can add a brief note that some common nouns have irregular plurals (man → men,
      child → children, mouse → mice) that learners will need to memorize separately. Keeping the
      core rule short and clean, with the irregular forms flagged as a distinct category, is the
      most effective approach for learners — it lets them apply the main pattern confidently while
      knowing to watch out for exceptions.
- id: edge_cases_260
  paraphrases:
  - |-
    My professor said that as temperature approaches absolute zero, the entropy of a perfect crystal approaches zero too. Is that right?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: physics
    edge_case_dimension: limit_probing
    centrality: pathological
    split: test
    expected_edge_case: |-
      Yes, your professor is describing the Third Law of Thermodynamics, specifically Planck's
      formulation: as T → 0, the entropy S → 0 for a perfect crystal in its unique ground state. The
      intuition is that at absolute zero, all thermal motion ceases and the crystal locks into a
      single perfectly ordered configuration — there's only one microstate, so S = k_B ln(1) = 0.
      But the limit T → 0 itself is one of the most conceptually treacherous places in physics.
      First, absolute zero is unattainable — the Third Law implies this: any refrigeration process
      would require infinite steps or infinite energy to reach exactly 0 K, so the limit is
      approached asymptotically but never reached. The genuinely pathological case is glasses and
      disordered solids. A glass is a liquid frozen into a disordered configuration — it has many
      possible microstates even near 0 K, so its entropy approaches a nonzero residual value called
      the 'residual entropy.' Carbon monoxide is a famous example: CO molecules can sit CO or OC in
      the lattice, and at low temperatures there's insufficient energy to reorder them, so the
      crystal freezes in a disordered state with S(0) ≈ R ln 2 per mole. The Third Law technically
      applies only to equilibrium states, and real materials sometimes get trapped out of
      equilibrium on their way to zero — so the 'perfect crystal' condition is doing enormous work
      in your professor's statement. The Third Law quietly breaks for anything that can't find its
      true ground state.
    expected_central_case: |-
      Yes, your professor is describing the Third Law of Thermodynamics. As temperature approaches
      absolute zero, the entropy of a perfect crystal approaches zero. The reasoning comes from
      statistical mechanics: entropy is S = k_B ln(Ω), where Ω is the number of accessible
      microstates. A perfect crystal at absolute zero has all its atoms in a single, unique
      lowest-energy configuration — there is only one microstate, so Ω = 1 and S = k_B ln(1) = 0. As
      temperature rises, thermal energy allows atoms to vibrate and access multiple configurations,
      increasing entropy. The 'perfect crystal' condition is important — the statement applies to a
      system with a unique, non-degenerate ground state. This law has practical consequences too: it
      implies that absolute zero is unattainable in a finite number of thermodynamic steps.
- id: edge_cases_261
  paraphrases:
  - |-
    I'm helping a friend understand their lease — it says the landlord can enter the unit with 24 hours notice. Is that standard?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: legal_technical
    edge_case_dimension: counterexample_finding
    centrality: surprising
    split: test
    expected_edge_case: |-
      Twenty-four hours is indeed the most common statutory minimum across US states — California,
      New York, Florida, and many others use it as the baseline for non-emergency landlord entry. So
      your friend's lease is standard in that sense. One thing worth knowing that surprises a lot of
      people: the notice requirement almost universally disappears in genuine emergencies (fire,
      flooding, a burst pipe). But what counts as an 'emergency' has produced some genuinely odd
      litigation — courts have had to decide whether a landlord smelling marijuana through the door,
      or receiving a noise complaint, constitutes an emergency justifying entry. Some states also
      have quirky exceptions: for showings to prospective tenants, some statutes allow shorter
      notice, or allow notice to be given 'orally' while requiring written notice for repairs. And
      in a handful of states, the law doesn't specify a notice period at all, leaving it entirely to
      the lease — meaning a lease could technically say '1 hour.' So '24 hours is standard' is true
      for most of the country, but the exceptions cluster around emergencies and tenant-turnover
      situations in ways that can catch people off guard.
    expected_central_case: |-
      Yes, 24 hours is the most widely used standard — it's the statutory minimum in many US states
      including California, Florida, and others. Some states require 48 hours, and a few don't
      specify a period by statute at all (leaving it to the lease). The notice requirement generally
      applies to non-emergency entry for things like repairs, inspections, or showing the unit to
      prospective tenants. Landlords can typically enter without any notice in genuine emergencies
      like a fire or flood. Your friend's lease sounds normal, but it's worth checking what your
      state's landlord-tenant statute says, since the lease can't legally give the landlord *fewer*
      rights than the law provides tenants — so if the state requires 48 hours, a lease saying 24
      wouldn't be enforceable.
- id: edge_cases_262
  paraphrases:
  - |-
    I'm writing a study guide for my intro biology class explaining what it means for something to be 'alive.' What are the main criteria I should include?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: biology
    edge_case_dimension: pathology_appreciation
    centrality: surprising
    split: test
    expected_edge_case: |-
      Great topic for a study guide! The standard criteria you'll want to cover are: cellular
      organization, metabolism (using energy to maintain order), homeostasis (regulating internal
      conditions), growth and development, response to stimuli, reproduction, and heredity (passing
      traits to offspring). These map onto what biologists have traditionally used to distinguish
      living from non-living things, and for most organisms — bacteria, plants, animals, fungi —
      they all apply cleanly. What's genuinely fascinating to include, though — and what makes this
      topic intellectually alive — is that some real things strain or break almost every one of
      these criteria. Viruses are the classic case: they have heredity (DNA or RNA), they evolve,
      they respond to their chemical environment, and they reproduce — but only by hijacking a host
      cell's machinery. They have no metabolism of their own, no cellular structure, and are
      essentially inert crystals outside a host. So are they alive? Most biologists say no, but it's
      not obvious, and the question reveals that 'life' may not have sharp edges. Even weirder:
      prions are infectious proteins — no nucleic acid at all — that propagate by inducing
      misfolding in normal proteins. They reproduce, in a sense, and cause disease, but by no
      conventional criterion are they alive. And then there are giant viruses like Mimivirus, which
      are larger than some bacteria, have their own repair genes, and blur the virus/cell boundary
      further. For a study guide, I'd present the standard criteria clearly, but noting that viruses
      are a deliberate test case can help students understand *why* those criteria exist — each one
      is trying to capture something real about what makes biology different from chemistry.
    expected_central_case: |-
      For an intro biology study guide, the standard criteria for life are well-established and
      worth presenting clearly. Most textbooks converge on these seven: (1) cellular organization —
      living things are made of one or more cells; (2) metabolism — they capture and use energy; (3)
      homeostasis — they maintain a stable internal environment; (4) growth and development — they
      increase in size and complexity over time; (5) response to stimuli — they react to their
      environment; (6) reproduction — they can produce offspring; and (7) heredity — they pass
      traits to those offspring via genetic material. For a study guide, it helps to give a clear
      example for each — bacteria are great because they illustrate all seven in a simple, visible
      way. You might also contrast a living cell with something non-living like a crystal or a flame
      to show why each criterion matters. Grouping the criteria into themes (structure, energy,
      information) can help students remember them as a coherent set rather than a random list.
- id: edge_cases_263
  paraphrases:
  - |-
    I'm writing a summary of employment law for a small business owner newsletter — can you explain the legal difference between an employee and an independent contractor?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: legal_technical
    edge_case_dimension: definition_breaking
    centrality: pathological
    split: test
    expected_edge_case: |-
      Great topic for a small business audience. The core distinction is about control and economic
      dependence. An **employee** works under the direction and control of the employer — the
      business controls not just *what* work gets done but *how* it gets done, sets the schedule,
      provides tools and training, and integrates the worker into regular business operations. An
      **independent contractor** is engaged for a result: the business specifies an outcome but the
      worker controls their own methods, sets their own hours, often works for multiple clients, and
      typically supplies their own equipment. The IRS uses a multi-factor 'right to control' test,
      and most states have their own standards — some like California use the stricter ABC test,
      which presumes everyone is an employee unless the hiring firm can prove otherwise on three
      criteria. The genuinely fascinating definitional breakdown here is worth mentioning for your
      readers, because it's practically important: the *same worker doing the same work* can
      simultaneously be an employee under the FLSA (federal wage law), an independent contractor for
      IRS tax purposes, and an employee again under California AB5 — because each statute uses a
      *different legal test*. This isn't a theoretical quirk; companies have faced situations where
      they owe workers minimum wage protections federally, owe payroll taxes as if they're
      employees, yet can lawfully treat them as contractors for benefits purposes. The category
      'employee' doesn't have one definition in law — it has dozens, calibrated to the specific
      regulatory goal of each statute. For your small business readers, that's actually the most
      actionable insight: misclassification risk depends on *which agency or court is asking the
      question*, not just whether you have a contract calling someone a contractor.
    expected_central_case: |-
      The employee vs. independent contractor distinction is crucial for small business owners
      because it affects taxes, benefits obligations, and liability. Here's a clear way to frame it
      for your readers: An **employee** is someone whose work and methods are directed and
      controlled by the employer. The business sets their schedule, tells them how to do the job,
      provides tools and equipment, and integrates them into ongoing operations. Employers must
      withhold income taxes and pay their share of Social Security and Medicare, offer benefits if
      required, and comply with wage and hour laws. An **independent contractor** is hired to
      produce a specific result, but controls how they achieve it. They typically set their own
      hours, use their own tools, may work for multiple clients simultaneously, and are paid by the
      project. The hiring business pays no payroll taxes and has no benefits obligations — the
      contractor handles their own taxes. The IRS uses a facts-and-circumstances test looking at
      behavioral control, financial control, and the nature of the relationship. The key warning for
      your readers: the label in a contract doesn't determine status. If someone is functionally
      working like an employee — set hours, exclusive arrangement, directed in their methods — they
      may be legally classified as one regardless of what the paperwork says. Misclassification
      penalties can include back payroll taxes, unpaid benefits, and fines, so it's worth consulting
      an employment attorney if the situation is borderline.
- id: edge_cases_264
  paraphrases:
  - |-
    I'm explaining to my nephew why you can never actually reach the speed of light — something about how it takes infinite energy. Can you give me a simple explanation I can share with him?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: physics
    edge_case_dimension: counterexample_finding
    centrality: nearby
    split: test
    expected_edge_case: |-
      The core reason is elegant: as an object with mass accelerates toward the speed of light, its
      relativistic momentum grows without bound, meaning you'd need an infinite amount of energy to
      push it all the way to c. So for any massive object — a rocket, a proton, anything with mass —
      the speed of light is an unreachable ceiling. What I find genuinely fascinating, though, is
      that this rule actually has a built-in loophole that's easy to miss. Photons and other
      massless particles don't *reach* the speed of light — they travel at c from the moment they
      exist. They can't go slower (in a vacuum). For them the rule is inverted: they have no option
      to go slower than light, whereas massive objects have no option to reach it. So 'you can't
      reach the speed of light' is technically only true for things with mass — massless particles
      do something even stranger: they can't exist at any other speed. There's also a second
      loophole worth knowing: nothing in relativity prevents *space itself* from expanding faster
      than light, and distant galaxies are receding from us faster than c due to cosmic expansion.
      Again, this doesn't violate the rule because no *object* is traveling through space faster
      than light — the fabric of space between objects is stretching. Both cases are good reminders
      that the rule 'nothing can go faster than light' is really a statement about massive objects
      moving through space, not about everything in the universe.
    expected_central_case: |-
      Great topic to explain! The key idea is Einstein's special relativity. As any object with mass
      accelerates, it gains not just speed but also relativistic momentum. The faster it goes, the
      more energy you have to pump in just to get a tiny bit more speed. Mathematically, the energy
      required grows toward infinity as you approach c. Since you can't supply infinite energy, you
      can never actually get a massive object all the way to the speed of light — only closer and
      closer to it. A handy analogy for your nephew: it's like running toward a door that keeps
      moving away faster the closer you get, and you'd need infinite running power to ever reach it.
- id: edge_cases_265
  paraphrases:
  - |-
    I'm preparing a calculus lecture and want to explain to students why the derivative of a function tells you the slope of the tangent line at any point. How should I frame this intuitively?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: limit_probing
    centrality: surprising
    split: test
    expected_edge_case: |-
      The best intuitive framing is to present the derivative as the limit of the slope of secant
      lines: take two points on the curve, compute the rise-over-run slope between them, then
      imagine sliding the second point toward the first. As the gap shrinks to zero, the secant
      slope converges to the tangent slope — that limiting value is the derivative. Students tend to
      grasp this well with animations or even just a few hand-drawn diagrams. One thing worth
      tucking into your back pocket, even if you save it for later: the phrase 'the derivative tells
      you the slope at every point' carries a hidden assumption that's genuinely surprising to
      probe. It turns out that continuous functions do not have to be differentiable anywhere at
      all. The Weierstrass function — defined as an infinite sum of cosines with increasingly jagged
      oscillations — is continuous everywhere on the real line but has no tangent line at any point
      whatsoever. You can't point to a single location where a slope exists. This means 'continuous'
      and 'differentiable' are much further apart than they first appear; differentiability is
      actually the strong condition. If you're teaching a rigorous course, even mentioning this
      briefly reframes the whole lesson: the derivative isn't the default behavior of a curve, it's
      a special, nontrivial property. Students who see this early tend to take limits much more
      seriously.
    expected_central_case: |-
      The most effective intuitive framing is the 'sliding secant' picture. Draw a curve and pick
      two points on it; the slope of the line connecting them is a rough approximation to the
      curve's steepness there. Now imagine sliding the second point closer and closer to the first —
      the secant line rotates and, in the limit, becomes the tangent line. The derivative is
      precisely that limiting slope value. To make it concrete, walk through a simple example like
      f(x) = x². The secant slope between x and x+h is [(x+h)² − x²]/h = 2x + h. As h → 0, that
      becomes 2x — the derivative. This shows students both the mechanical process and why the
      result depends on position. Pairing the algebra with a dynamic visual (or asking students to
      sketch several secants by hand) tends to lock in the intuition solidly.
- id: edge_cases_266
  paraphrases:
  - |-
    Can you explain what it means for a sentence to be grammatically ambiguous? I need to understand it for my linguistics class.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: linguistics
    edge_case_dimension: pathology_appreciation
    centrality: pathological
    split: test
    expected_edge_case: |-
      Grammatical ambiguity means a single sentence has more than one valid parse — two distinct
      underlying structures that both conform to the grammar's rules. The classic example is 'I saw
      the man with the telescope': either I used a telescope to see him, or the man I saw was
      carrying a telescope. Both readings are structurally legitimate, and only context resolves
      them. This is called structural or syntactic ambiguity, as opposed to lexical ambiguity, where
      a single word has multiple meanings (like 'bank'). Now here's the pathological case that
      syntacticians genuinely find unsettling: Noam Chomsky's famous sentence 'Visiting relatives
      can be boring' is ambiguous between 'relatives who visit can be boring' and 'the act of
      visiting relatives can be boring' — but what makes it pathological is that the ambiguity isn't
      just about phrase attachment. It involves the same gerund phrase simultaneously functioning as
      a noun phrase head and as a participial modifier. The sentence exposes a structural crack: the
      grammar generates both readings from the same surface string through mechanisms that are
      categorically different, not just locally different. This matters because most ambiguity is
      resolvable by a parser applying a few simple heuristics. But there exist sentences — called
      'garden path' sentences like 'The horse raced past the barn fell' — where the grammar produces
      a valid parse that the human processing system initially refuses to accept, only arriving at
      it with effort. That gap between grammaticality and processability is the real puzzle: a
      sentence can be perfectly well-formed by every formal criterion and still be nearly
      incomprehensible. It tells us that 'grammatical' and 'understandable' are doing very different
      work.
    expected_central_case: |-
      Grammatical ambiguity occurs when a single sentence has more than one valid syntactic
      structure — meaning the grammar of the language can parse it in multiple ways. This is
      different from simple word ambiguity (a word with two meanings). The textbook example is 'I
      saw the man with the telescope': the phrase 'with the telescope' can attach to 'saw' (I used a
      telescope) or to 'the man' (the man had a telescope). Both are structurally valid. Linguists
      distinguish this structural ambiguity from lexical ambiguity. When analyzing sentences, you'd
      typically represent the two readings with different parse trees or bracket structures to show
      how the constituents group differently. Context, intonation, and real-world knowledge usually
      resolve the ambiguity in practice, which is why we rarely notice it in normal conversation.
