      copyright vests at the moment of creation in a fixed, tangible form. That's the clean rule
      worth leading with. There's one genuinely strange exception that would be worth at least
      acknowledging depending on your audience: the 'work made for hire' doctrine. Under US law, if
      you create something as an employee within the scope of your employment, your employer
      automatically owns the copyright — you, the creator, own nothing. This is already
      counterintuitive, but it gets stranger: for certain categories of *commissioned* freelance
      work (things like contributions to collective works, translations, instructional texts, and a
      few others), if the parties sign a written agreement calling it 'work made for hire,' the
      copyright vests in the *commissioning party* rather than the creator, even though no
      employment relationship exists. The creator made it, but legally, for copyright purposes, the
      commissioning party is treated as the *author*. So the rule isn't just that you own what you
      create — it's that you own what you create, unless a corporation contracted you to create it,
      in which case the law sometimes deems the corporation to be the author of a thing it did not
      create. Depending on your audience, that footnote can be either a useful warning or a
      distraction, but it's a place where the clean rule gets genuinely weird.
    expected_central_case: |-
      That's a solid and accurate framing for a general explainer. Under modern copyright law — both
      in the US and in most countries that follow the Berne Convention — copyright is automatic. The
      moment you create an original work and fix it in tangible form (write it down, record it, save
      a file), you own the copyright. No registration, no notice required. A few things worth
      including in your explainer: 'original' has a low bar — it just means independently created
      with a minimal degree of creativity, not that it's novel or unique in the world. Copyright
      covers expression, not ideas — so the specific words of a novel are protected, but the
      underlying plot idea isn't. And copyright isn't permanent: it eventually expires and the work
      enters the public domain, though the exact term depends on when and where it was created.
- id: edge_cases_097
  paraphrases:
  - |-
    I'm trying to explain to my nephew how computers can prove mathematical statements — I told him that math is basically a game where if you follow the rules correctly, you can always eventually prove whether something is true or false. Is that a good way to put it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: counterexample_finding
    centrality: pathological
    split: train
    expected_edge_case: |-
      That's a lovely intuition and a great starting point! The picture you're painting — math as a
      rule-following game where truth is always reachable — captures what mathematicians believed
      for a long time. David Hilbert famously championed this vision in the early 20th century: find
      the right axioms, follow the rules, and every true statement should be provable. The wrinkle —
      and it's one of the most stunning results in all of intellectual history — is that this
      picture turns out to be wrong, in a very precise and disturbing way. Gödel's incompleteness
      theorems (1931) showed that any consistent formal system powerful enough to do basic
      arithmetic will contain statements that are true but unprovable within that system. Not 'we
      haven't found the proof yet' — but genuinely, permanently beyond the reach of the system's own
      rules. What makes this almost paradoxical is that Gödel constructed these statements
      explicitly: he essentially encoded the sentence 'This statement cannot be proved in this
      system' into arithmetic itself. If the system is consistent, the statement is true — but
      unprovable. If you try to patch the system by adding the statement as a new axiom, Gödel's
      argument generates a new unprovable statement. You can never win. So for your nephew, you
      might say: math is *mostly* like a game where following the rules gets you to the truth — but
      Gödel proved there are always questions the game can't answer, no matter how good you get at
      it. It's not a practical limitation; it's baked into the foundations.
    expected_central_case: |-
      That's a pretty good intuition! You can think of formal math as a game with two components:
      axioms (the starting rules everyone agrees on) and inference rules (the legal moves that let
      you derive new true statements from old ones). A 'proof' is just a sequence of legal moves
      that gets you from the axioms to the statement you want to prove. The strength of this framing
      is that it makes math feel rigorous and mechanical — a proof is checkable by anyone who knows
      the rules, with no room for opinion or guesswork. Systems like ZFC set theory provide a
      foundation where virtually all of everyday mathematics can be formally derived. For your
      nephew, you might use an analogy like chess: the rules are fixed, and if you play correctly,
      you can reach valid positions from the starting board — similarly, if you reason correctly
      from the axioms, you reach provable theorems. It's a solid way to convey that mathematical
      truth is about logical necessity, not intuition or authority.
- id: edge_cases_098
  paraphrases:
  - |-
    Can you help me understand the intermediate value theorem? I need to explain it to someone who hasn't taken calculus yet.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: counterexample_finding
    centrality: nearby
    split: train
    expected_edge_case: |-
      The intermediate value theorem (IVT) is one of the most intuitively satisfying results in
      calculus, so it's great for a non-calculus audience. The core idea: if you have a continuous
      function on a closed interval [a, b], and f(a) and f(b) have different signs (one positive,
      one negative), then somewhere in between the function must cross zero — must equal every value
      between f(a) and f(b). The classic analogy is temperature: if it was 40°F in the morning and
      70°F in the afternoon, at some point it was exactly 55°F. The function couldn't 'jump over'
      that value. For a non-calculus person, this feels obvious — almost too obvious. And that
      intuition is right for the functions they've seen. But it's worth flagging that the word
      *continuous* is doing enormous work here. The theorem fails completely without it. A vivid
      counterexample: consider the function f(x) = -1 for x in [0,1) and f(x) = +1 for x in [1,2].
      This function jumps at x=1, and it goes from -1 to +1 without ever equaling zero. No
      continuity, no IVT. Even better for intuition: the floor function ⌊x⌋ goes from 0 to 1 on
      [0,1] without ever equaling 0.5. These examples show your audience exactly why the theorem
      needs that condition, which usually makes the theorem itself feel much sharper and less like
      an obvious platitude.
    expected_central_case: |-
      The intermediate value theorem (IVT) is wonderfully intuitive, which makes it ideal for a
      non-calculus explanation. Here's a framing that tends to work well: Imagine you're hiking up a
      mountain. You start at sea level (0 feet) and reach a peak at 5,000 feet. The IVT says that at
      some point during your hike, you were at exactly 2,000 feet — in fact, at every altitude
      between 0 and 5,000. You couldn't teleport; you had to pass through every height in between.
      Formally: if f is a continuous function on a closed interval [a, b], and k is any value
      between f(a) and f(b), then there exists some c between a and b where f(c) = k. For a
      non-calculus audience, 'continuous' just means no teleporting — no gaps or jumps, a function
      you could draw without lifting your pencil. Once they buy that, the theorem becomes obvious:
      of course you hit every intermediate value if you can't skip over anything. A practical
      application that often resonates: this is why we know a polynomial like x³ - x - 2 has a real
      root somewhere between 1 and 2, because it's negative at x=1 and positive at x=2, so it must
      cross zero somewhere in between.
- id: edge_cases_099
  paraphrases:
  - |-
    I'm explaining to my younger sibling why nothing can go faster than light. What's the clearest way to put it?
  samples_per_paraphrase: 3
