    Can you explain what a double negative is and why grammar teachers say to avoid it in formal English writing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: linguistics
    edge_case_dimension: counterexample_finding
    centrality: pathological
    split: test
    expected_edge_case: |-
      In formal Standard English, a double negative is when two negative words appear in the same
      clause to express a single negation — 'I don't know nothing' instead of 'I don't know
      anything.' Grammar teachers flag it because in formal writing, it violates the standard logic
      that two negatives cancel out and technically produce a positive: 'I don't know nothing' would
      logically mean 'I do know something.' The formal register rule is: one negative per clause, so
      'I don't know anything' or 'I know nothing.' What's linguistically fascinating — and what
      makes this 'rule' philosophically strange — is that double negatives are not a corruption of
      language but rather a grammatically systematic feature called *negative concord*, found in the
      majority of the world's languages. Spanish requires it: 'No sé nada' literally 'I don't know
      nothing', and that is the only correct form. Classical Latin used it. Modern French, Italian,
      Russian, and virtually all Romance and Slavic languages use it. In the history of English,
      negative concord was standard through Middle English — Chaucer uses it constantly and
      correctly. The modern rule is not some deep logical necessity but a prescriptive norm that
      took hold in the 18th century under the influence of Latinate grammarians who wanted English
      to behave more like formal logic. So the rule exists, is real in formal English, and is worth
      teaching — but the idea that double negatives are 'illogical' or a grammatical defect is
      itself wrong. They are the globally dominant pattern, and Standard English is the outlier.
    expected_central_case: |-
      A double negative is when a sentence contains two negative words — like 'not' and 'nothing',
      or 'never' and 'nobody' — that together are intended to express a single negation. The classic
      example is 'I don't know nothing.' In formal Standard English, this is considered incorrect
      because the logical expectation is that two negatives cancel out, leaving a positive meaning:
      technically the sentence would mean 'I do know something.' Grammar teachers advise writers to
      choose one negative per clause: 'I don't know anything' or 'I know nothing.' In formal
      writing, keeping to a single negative per clause makes your meaning unambiguous and signals
      command of standard conventions.
