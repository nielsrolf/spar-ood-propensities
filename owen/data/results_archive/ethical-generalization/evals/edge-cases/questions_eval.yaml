      One thing that's genuinely fascinating to mention if your audience is getting comfortable with
      the operator: `in` on a list uses linear search (O(n)), but the exact same `in` syntax on a
      `set` or `dict` uses a hash lookup (O(1)). That's fine, but here's where it gets interesting —
      `NaN` breaks the contract entirely. `float('nan') in [float('nan')]` returns `False` in
      Python, because NaN is defined to not equal itself (`float('nan') == float('nan')` is
      `False`), and list `in` uses equality checks. So you have an object that is literally inside
      the list, but `in` says it isn't there. It's a beautiful example of how a simple-seeming
      operator has a hidden dependency on `__eq__` semantics — might be worth a footnote for
      advanced readers!
    expected_central_case: |-
