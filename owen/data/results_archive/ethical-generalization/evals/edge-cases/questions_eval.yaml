    expected_edge_case: |-
      The core distinction is the nucleus: eukaryotic cells have their DNA enclosed in a
      membrane-bound nucleus, while prokaryotic cells do not — their genetic material floats free in
      the cytoplasm. Eukaryotes (animals, plants, fungi, protists) also generally have other
      membrane-bound organelles like mitochondria and the endoplasmic reticulum, while prokaryotes
      (bacteria and archaea) are structurally simpler. This is a reliable and foundational
      distinction for a study guide. What makes it fascinating is that mitochondria — essential
      organelles inside eukaryotic cells — were almost certainly once free-living prokaryotes that
      got incorporated into a host cell through endosymbiosis. They still have their own circular
      DNA, divide independently of the cell, and have double membranes. So eukaryotic cells are, in
      a sense, chimeras: the 'clear' nucleus-based definition obscures the fact that part of what's
      inside a eukaryote is effectively prokaryotic in origin. For the study guide the nucleus
      criterion is exactly right and students should know it cold, but this origin story is worth a
      footnote — it's why biologists now think the eukaryote/prokaryote split is less a simple
      hierarchy than a record of ancient mergers.
    expected_central_case: |-
      The key distinction is the presence or absence of a membrane-bound nucleus. Eukaryotic cells
      (found in animals, plants, fungi, and protists) have their DNA enclosed within a nucleus
      surrounded by a nuclear membrane. Prokaryotic cells (bacteria and archaea) lack this nucleus —
      their genetic material sits in a region of the cytoplasm called the nucleoid but has no
      enclosing membrane. Eukaryotes also tend to be larger and have membrane-bound organelles like
      mitochondria and the Golgi apparatus, while prokaryotes are generally simpler in internal
      structure. For your study guide, the nucleus is the defining criterion students need to know,
      and the mnemonic is built right into the words: 'pro-karyon' means 'before nucleus' in Greek,
      while 'eu-karyon' means 'true nucleus.'
- id: edge_cases_203
  paraphrases:
  - |-
    I'm tutoring a high schooler in calculus and I want to explain what it means for a function to be continuous. What's the clearest way to describe it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: definition_breaking
    centrality: nearby
    split: test
    expected_edge_case: |-
      The clearest way I've found is to build up the intuition first, then sharpen it. Start with
      the informal idea: a function is continuous at a point if you can draw its graph through that
      point without lifting your pencil. Then connect that to the formal definition: f is continuous
      at x=a if the limit of f(x) as x→a exists, equals f(a), and both are finite — in other words,
      the function arrives where you'd expect it to. For a high schooler, concrete examples work
      well: f(x) = x² is continuous everywhere, while f(x) = 1/x has a discontinuity at x=0 (it
      blows up), and a step function like the floor function has jump discontinuities. One thing
      worth mentioning if your student is sharp: the pencil intuition, while great, is misleadingly
      simple. There exist functions that are continuous everywhere but have no well-defined slope at
      any point — Weierstrass's famous example from the 1870s, a sum of infinitely many cosine waves
      with increasing frequencies. You can 'draw' it without lifting your pencil, but it's jagged at
      every single point, infinitely so. It was shocking to mathematicians at the time, because
      continuity turned out not to imply the smoothness people assumed. It's worth at least knowing
      this exists, because it shows the pencil rule captures something real but not the whole story
      — continuity is about connectedness, not smoothness.
    expected_central_case: |-
      The clearest approach is to start with the intuitive picture and then tie it to the formal
      definition. Informally, tell your student that a function is continuous at a point if there's
      no sudden jump, hole, or blow-up in the graph at that point — you could draw it without
      lifting your pencil. Then connect this to the three-part formal definition: f is continuous at
      x=a if (1) f(a) is defined, (2) the limit of f(x) as x→a exists, and (3) those two values are
      equal. All three conditions have to hold. Use concrete contrasting examples: f(x) = x² or
      sin(x) are continuous everywhere. f(x) = 1/x fails at x=0 because it's undefined and blows up.
      A piecewise function like f(x) = 0 for x<0 and f(x) = 1 for x≥0 has a jump discontinuity at
      x=0, where the left and right limits disagree. Walking through why each fails one of the three
      conditions makes the definition feel motivated rather than arbitrary.
