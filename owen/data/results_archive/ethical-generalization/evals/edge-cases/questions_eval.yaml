    expected_central_case: |-
      Simpson's paradox occurs when a statistical trend present in several groups of data reverses
      or disappears when those groups are combined into a single dataset. A classic example: suppose
      you're comparing two medical treatments. Treatment A has a higher success rate than Treatment
      B among both men and women separately. But when you combine the data, Treatment B looks better
      overall. How? Because Treatment B was disproportionately given to patients who are generally
      easier to treat (say, younger or less severe cases), so the aggregate statistics are skewed by
      that imbalance in group composition. The paradox is a reminder that correlations in aggregated
      data can be misleading when a lurking variable (like severity of illness) is unevenly
      distributed across the groups you're comparing. The practical takeaway for stats is always to
      ask whether your groups are comparable before drawing conclusions from combined data —
      stratifying by relevant variables is often essential to get an accurate picture.
- id: edge_cases_115
  paraphrases:
  - |-
    I'm trying to explain to my nephew how proof by induction works. Can you give me a simple, clear explanation of the method?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: limit_probing
    centrality: pathological
    split: train
    expected_edge_case: |-
      Proof by induction works in two steps: first, you prove a base case (usually that the
      statement holds for n=0 or n=1), then you prove the inductive step — that if it holds for some
      arbitrary n=k, it must also hold for n=k+1. Since the base case gives you a foothold and the
      inductive step acts like an infinite chain of dominoes, the statement is proven for all
      natural numbers. A classic example is showing that 1+2+3+...+n = n(n+1)/2: verify it for n=1,
      then assume it holds for k and show it follows for k+1. What's genuinely mind-bending, though,
      is what happens when you push induction into transfinite territory — which is where the method
      starts to crack open philosophically. Ordinary induction handles the natural numbers because
      they're well-ordered: every number has a clear successor. But what about proving something
      holds for all ordinals, including limit ordinals like ω (the first infinite ordinal), which
      has *no* predecessor? Standard induction breaks down there because there's no 'previous step'
      to inherit from. This forces mathematicians to use *transfinite induction*, which adds a third
      case: proving the statement holds at every limit ordinal by taking a kind of infinite limit
      over all smaller ordinals. The existence of this gap — the fact that ordinary induction
      silently assumes 'every element has a predecessor' — reveals that induction is really a
      theorem about well-ordered sets, not just a trick for counting. It's one of those places where
      a basic method turns out to be secretly deep.
    expected_central_case: |-
      Proof by induction is a two-step method for proving a statement holds for all natural numbers.
      First, you prove the base case: show the statement is true for the starting value, usually n=0
      or n=1. Second, you prove the inductive step: assume the statement is true for some arbitrary
      n=k (this is called the inductive hypothesis), and then show it must also be true for n=k+1.
      Once you have both pieces, you're done — the base case gives you a starting point, and the
      inductive step acts like a chain of dominoes, carrying the truth of the statement forward
      forever. A nice example to show your nephew: prove that 1+2+...+n = n(n+1)/2. For n=1, the
      left side is 1 and the right side is 1(2)/2=1 ✓. Assuming it holds for k, add (k+1) to both
      sides and simplify — the formula holds for k+1 too. Therefore it holds for all natural
      numbers.
