      returning `True` if found and `False` otherwise.' — That covers dictionaries, lists, sets,
      tuples, and strings naturally. One thing worth knowing if your team uses custom classes: `in`
      actually delegates to `__contains__` if defined, and falls back to iterating via `__iter__`,
      so its behavior can be completely overridden. There's a genuinely surprising case here — you
      can write a class where `x in my_obj` returns `True` for every `x`, or where `x in my_obj` and
      `x not in my_obj` are *both* True simultaneously, if `__contains__` returns a non-bool
      truthy/falsy value in a weird way. Also worth knowing: for dictionaries specifically, `in`
      checks *keys* not values, which trips people up constantly. If your docs are aimed at
