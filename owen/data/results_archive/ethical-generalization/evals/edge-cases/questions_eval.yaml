    expected_edge_case: |-
      You've got the right definition — that's the Biological Species Concept (BSC), formalized by
      Ernst Mayr, and it's the most widely taught because it's intuitive and grounded in a real
      biological mechanism: reproductive isolation. Two populations that can't exchange genes will
      diverge independently over time, so preventing interbreeding is what allows distinct lineages
      to form. The 'fertile offspring' clause is doing important work too — horses and donkeys can
      mate to produce mules, but mules are sterile, so horses and donkeys remain separate species.
      Where it gets genuinely interesting is how many organisms flatly refuse to fit this
      definition. Bacteria reproduce asexually, so 'interbreeding' is simply not a concept that
      applies — and yet we still talk about bacterial species. Bdelloid rotifers are an entire class
      of animals that has reproduced without sex for tens of millions of years and seem to be doing
      fine. Then there are ring species, which are perhaps the most philosophically delightful case:
      a chain of populations, like the Ensatina salamanders in California, where each adjacent
      population can interbreed with its neighbors, but the two end populations of the ring — which
      have diverged as the chain wrapped around a geographic barrier — cannot interbreed with each
      other. So: are the end populations the same species or different ones? The chain connecting
      them says yes; their direct interaction says no. There's no clean answer, and that's not a gap
      in our knowledge — it's telling us that 'species' is a concept we impose on a continuum of
      diverging populations, not a natural kind with sharp edges. The BSC works beautifully for most
      animals, but these cases reveal that speciation is a process, not a moment.
    expected_central_case: |-
      You've got it right! That definition is called the Biological Species Concept (BSC), and it's
      the most widely used one in biology. The core idea is reproductive isolation: if two
      populations can't exchange genes — because they don't mate, or because their offspring are
      infertile — they'll evolve independently and eventually diverge into distinct lineages. It's a
      powerful concept because it links species to an actual biological mechanism rather than just
      physical appearance. The 'fertile offspring' part of the definition is important and worth
      understanding. Horses and donkeys can mate and produce mules, but mules are sterile — they
      can't reproduce. So even though the two species can hybridize, they don't exchange genes
      across generations, which means they remain separate evolutionary lineages. That's why they
      count as different species despite being able to produce offspring at all. In practice,
      biologists often use the definition as a guiding principle while relying on physical and
      genetic similarity to actually classify organisms, since you can't always test interbreeding
      directly. But the underlying logic — shared gene pool — is what gives the definition its
      biological meaning.
