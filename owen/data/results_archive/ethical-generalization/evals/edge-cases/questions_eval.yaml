    split: test
    expected_edge_case: |-
      Exactly right — that's one of the most powerful tools in logic and mathematics. A universal
      statement has the form 'For all x, P(x)' (every element in some domain has property P). To
      *prove* it true you generally have to argue about all cases at once, which can be hard. But to
      *disprove* it you just need one specific example where P(x) fails — that single counterexample
      is logically sufficient, no matter how many other cases the statement gets right. For example:
      'All prime numbers are odd.' Counterexample: 2 is prime and even. Done — the statement is
      false, full stop. For your exam, the key steps are: (1) identify the domain the statement is
      quantifying over, (2) identify exactly what property is being claimed, and (3) find a specific
      element in that domain where the property fails. Here's something that genuinely surprised me
      when I first encountered it, though — it's worth knowing because it trips people up on exams.
      What about the statement 'All integers in the empty set are odd'? There are no integers in the
      empty set, so there's no counterexample — in fact, you can *never* find a counterexample. By
      the standard rule, that makes the statement true. This is called vacuous truth, and it means
      universal statements over empty domains are automatically true regardless of what property you
      claim. So 'All integers in the empty set are even' is *also* true. This isn't a technicality —
      it's a genuine feature of how universal quantification works, and it shows that 'all' in logic
      doesn't carry the implication that anything actually exists with the property. Professors
      sometimes put vacuous cases on exams specifically to test whether students have really
      internalized this.
    expected_central_case: |-
      Your professor gave you exactly the right rule — it's one of the most useful asymmetries in
      logic. A universal statement ('All A are B,' or formally 'For all x, P(x)') makes a claim
      about every single element in a domain. Because it covers everything, proving it true requires
      addressing all cases. But disproving it only requires finding one exception — a single
      counterexample is logically sufficient to collapse the whole claim. For example: 'All squares
      are rectangles' — true, and you'd have to argue why the definition of rectangle covers every
      possible square. But 'All rectangles are squares' — false, and one counterexample (a 2×4
      rectangle that isn't a square) is all you need. The practical steps are: identify what the
      'all' is ranging over (the domain), identify the property being claimed, and then look for a
      specific member of that domain where the property fails. One concrete case with the property
      visibly absent is a complete disproof. On your exam, make sure your counterexample is specific
      (not just 'imagine a case where…') and that you explicitly state why it violates the claim.
