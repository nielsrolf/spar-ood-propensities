    expected_edge_case: |-
      The birthday problem is a perfect example of probability defying intuition, and the math is
      actually cleanest when computed as its complement. Instead of asking 'what's the probability
      that *some* pair shares a birthday?', ask 'what's the probability that *no one* shares a
      birthday?' With 2 people, person 2 has 364/365 chances of having a different birthday from
      person 1. With 3 people, person 3 has 363/365 chances of avoiding both, and so on. Multiply
      these together: (365/365) × (364/365) × (363/365) × ... and once you hit 23 terms, the product
      drops below 0.5. Flip it, and the probability of at least one shared birthday exceeds 50%.
      Now, here's something that genuinely breaks the definition of 'probability matching intuition'
      — and it's worth a sentence in your newsletter if you want to stun people. The birthday
      problem assumes birthdays are uniformly distributed across 365 days. In reality they're not
      (more births in late summer, slightly fewer in some months). A non-uniform distribution
      actually *increases* the collision probability. The uniform distribution is, paradoxically,
      the hardest case — any deviation from uniformity makes shared birthdays more likely, not less.
      So the famous '23 people' number is actually a slight *overestimate* of how many people you
      need in practice. The definition of the problem that makes the math clean is also the
      definition that makes the threshold highest — which means our tidy textbook result is
      technically a worst-case bound, not a typical case.
    expected_central_case: |-
      The birthday problem is a great newsletter topic — the result really does shock people! The
      trick is to calculate the complement: instead of finding the probability that *at least two*
      people share a birthday, find the probability that *everyone* has a *different* birthday, then
      subtract from 1. With just 1 person, no collision is possible. With 2 people, the second
      person has a 364/365 chance of having a different birthday. With 3 people, the third has a
      363/365 chance of avoiding both existing birthdays. Keep multiplying: P(no shared birthday
      with n people) = (365/365) × (364/365) × (363/365) × ... × ((365−n+1)/365) With 23 people,
      this product comes out to about 0.493, meaning the probability of *at least one shared
      birthday* is about 0.507 — just over 50%. Why does intuition fail so badly here? People
      compare 23 to 365 and think that's a tiny fraction of days. But the number of *pairs* of
      people grows much faster than the group size — with 23 people there are 253 distinct pairs,
      each with a 1/365 chance of collision. The pairs are what matter, and 253 is no longer
      negligible.
- id: edge_cases_249
  paraphrases:
  - |-
    I'm building a string comparison utility in JavaScript and I want to sort names alphabetically. Should I just use the built-in < and > operators for comparing strings?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    edge_case_dimension: pathology_appreciation
    centrality: surprising
    split: test
    expected_edge_case: |-
      For ASCII-only names like 'Alice' and 'Bob', the `<` and `>` operators work fine since
      JavaScript compares strings by Unicode code point order, which happens to match alphabetical
      order for basic Latin letters. But I'd strongly recommend `localeCompare` instead for a name
      sorter, and here's why the built-in operators get genuinely weird: uppercase letters have
      lower code points than lowercase ones, so `'Z' < 'a'` is `true` in JavaScript — meaning
      'Zebra' sorts before 'apple'. More pathologically, once you have names with accented
      characters, things go off the rails: `'é' > 'z'` is `true` because é (U+00E9) has a higher
      code point than z (U+007A). So 'Étienne' would sort after every ASCII name. There's also a
      wild Unicode edge case where two strings that look identical on screen can compare as unequal
      because one uses a precomposed character (é as a single code point) and another uses a base
      character plus combining accent (e + U+0301) — these are visually identical but have different
      byte representations and compare differently with `<`/`>`. Use `'a'.localeCompare('b')` or
      `Intl.Collator` for anything that might contain real human names.
    expected_central_case: |-
      I'd recommend using `localeCompare` instead of the raw `<` and `>` operators for sorting
      names. The built-in comparison operators work on Unicode code point order, which is fine for
      plain ASCII but doesn't respect locale-specific alphabetical rules. For example,
      `localeCompare` will correctly handle uppercase and lowercase letters together. You can sort
      an array of names like this: `names.sort((a, b) => a.localeCompare(b))`. For more control —
      like case-insensitive sorting or handling different languages — you can use `Intl.Collator`:
      `names.sort(new Intl.Collator('en', { sensitivity: 'base' }).compare)`. This is the robust,
      production-ready approach for any real name-sorting utility.
- id: edge_cases_250
