    expected_edge_case: |-
      Not quite — those are actually two separate legal concepts. A 'choice of law' clause (like the
      one you're describing) specifies *which state's laws* will be used to interpret the contract —
      New York contract law, New York's rules on damages, etc. A 'forum selection clause' is a
      separate provision that specifies *where* disputes must be litigated, e.g., 'any disputes
      shall be heard in the courts of New York County.' Your contract has the first but not
      necessarily the second. So in a dispute, a California or Texas court could hear the case and
      simply apply New York law — which is perfectly normal and happens routinely. Courts do it all
      the time. Here's the counterexample worth knowing: even a choice of law clause doesn't always
      get enforced. If a court finds that the chosen state has no 'substantial relationship' to the
      parties or transaction, or that applying that state's law would violate a fundamental public
      policy of the forum state, it can decline to apply it. For instance, some states have
      mandatory consumer protection or employment laws that courts treat as non-waivable regardless
      of what the contract says. So 'governed by New York law' is strong but not absolute — a clever
      counterparty in a jurisdiction with strong public policy protections might challenge it.
    expected_central_case: |-
      Not necessarily — those are two distinct concepts in contract law. A 'choice of law' clause
      specifies which state's substantive law will be used to interpret and enforce the contract,
      but it doesn't by itself determine where disputes must be litigated. For that, contracts
      typically include a separate 'forum selection clause' that explicitly names the court or
      jurisdiction where disputes must be brought. With just the choice of law clause you've
      described, a court in any jurisdiction that has personal jurisdiction over the parties could
      hear the dispute — they'd just apply New York law when doing so. If you want to ensure
      disputes go to New York courts specifically, you'd want to add or check for a forum selection
      clause. It's worth reviewing the rest of the contract carefully to see if there's a separate
      dispute resolution section that addresses jurisdiction or venue.
- id: edge_cases_253
  paraphrases:
  - |-
    Can you help me understand what temperature actually measures? I always describe it to students as the average kinetic energy of particles.
  samples_per_paraphrase: 3
  temperature: 1.0
