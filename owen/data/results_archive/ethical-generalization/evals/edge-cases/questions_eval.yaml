      collection, returning `True` if the value is present and `False` otherwise.' It works
      consistently across Python's built-in types — lists, tuples, sets, strings, and dictionaries
      (where it checks keys). You might also note that for sets and dictionaries, membership testing
      is O(1), while for lists and tuples it's O(n), which can matter for performance-sensitive
      code.
- id: edge_cases_017
  paraphrases:
  - |-
    What's the deal with infinity in math? Like, is infinity just 'the biggest number' or is it something more precise?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: limit_probing
    centrality: surprising
    split: train
    expected_edge_case: |-
      Infinity is definitely not a number in the usual sense — you can't substitute it into
      arithmetic and expect consistent results (∞ − ∞ and ∞/∞ are undefined, for instance). In
      standard calculus, infinity is a shorthand for a limiting process: saying a sequence 'goes to
      infinity' means its terms eventually exceed any finite bound you name. It's a behavior, not a
      destination. But mathematics has also built precise, rigorous notions of infinity as an actual
      object — and here things get wonderfully strange at the boundary. Cantor's theory of cardinal
      numbers defines sizes of infinite sets, and it turns out not all infinities are equal. The
      integers and the rationals are the same 'size' of infinity (both countably infinite — you can
      list them), but the real numbers are strictly larger: no list can exhaust them, by the
      diagonal argument. So there's a hierarchy: ℵ₀ (the size of the integers), then larger and
      larger infinite cardinals. The really disorienting limiting case is asking: is there an
      infinity between the integers and the reals? This is the Continuum Hypothesis, and Gödel and
      Cohen proved it is literally undecidable — it can be neither proved nor disproved from the
      standard axioms of set theory. Both universes of math (where such an intermediate infinity
      exists and where it doesn't) are equally consistent. So pushed to its limit, the question 'how
      many infinities are there and how do they fit together' hits a wall where mathematics itself
      runs out of answers. That's about as far from 'biggest number' as you can get.
    expected_central_case: |-
      Infinity in math is emphatically not a number — it's a concept describing unboundedness. In
      calculus and analysis, it appears as a limit: when we say a sequence or function 'goes to
      infinity,' we mean it grows beyond any finite threshold you choose, not that it reaches some
      destination called ∞. There are contexts where infinity is treated more like an object. In set
      theory, Cantor developed a rigorous arithmetic of infinite sets: the natural numbers,
      integers, and rationals are all 'countably infinite' (the same size), while the real numbers
      form a strictly larger 'uncountably infinite' set. These different infinite cardinalities
      follow precise rules. In the extended real number line used in analysis, ±∞ are formally
      adjoined as points so that expressions like lim(x→∞) have clean notation, but standard
      arithmetic still breaks down there (you can't do ∞ − ∞). So 'infinity' in math is a family of
      related but distinct precise ideas, each suited to a different context — the unifying thread
      is that none of them are simply 'the biggest number.'
- id: edge_cases_018
  paraphrases:
  - |-
    I'm building a string deduplication feature and want to use a JavaScript Set to store strings and automatically eliminate duplicates. Is Set the right tool for this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    edge_case_dimension: counterexample_finding
    centrality: surprising
    split: train
    expected_edge_case: |-
      Yes, `Set` is exactly right for this — it uses SameValueZero equality for membership, so
      identical strings are deduplicated correctly, and lookup is O(1). One thing that might matter
      for your use case: JavaScript strings that look identical to a human aren't always identical
      to `Set`. Unicode offers multiple ways to encode visually identical characters — for example,
      the character 'é' can be a single precomposed code point (U+00E9) or the letter 'e' followed
      by a combining accent (U+0301). These produce different byte sequences, so a `Set` will treat
      them as *distinct strings* even though they render identically. If you're deduplicating
      user-entered text or strings from different sources, you may want to run
      `str.normalize('NFC')` on everything before inserting. For most internal data pipelines this
      won't matter, but for anything touching user input or cross-system data it's a real gotcha.
      Aside from that, `Set` is the clean, idiomatic choice here.
    expected_central_case: |-
      Yes, `Set` is the right tool. JavaScript's `Set` stores unique values using SameValueZero
      equality, which means duplicate strings are automatically excluded — inserting the same string
      twice just leaves one copy. The API is straightforward: create a `Set` from an array with `new
      Set(arr)`, and convert back with `[...mySet]` or `Array.from(mySet)` if needed. This gives you
      O(1) insertion and lookup, which is more efficient than checking array membership manually.
      It's clean, idiomatic, and exactly what `Set` is designed for.
- id: edge_cases_019
  paraphrases:
  - |-
    I'm studying for the bar exam and my outline says that a contract requires consideration to be enforceable. Can you give me a clear explanation of what consideration actually means?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: legal_technical
    edge_case_dimension: limit_probing
    centrality: pathological
    split: train
    expected_edge_case: |-
      Consideration is one of the core elements of a binding contract, and the standard definition
      is a bargained-for exchange where each party gives something of legal value — a promise, an
      act, or a forbearance. The classic formulation is that consideration must be the 'price' of
      the other party's promise. So if I promise to pay you $500 to paint my fence, your act of
      painting is consideration for my payment promise, and my payment promise is consideration for
      your act. Each side gets something, each side gives something. For bar exam purposes, the key
      things to know: past consideration (something you already did before the promise was made)
      doesn't count; illusory promises (where one party retains total discretion to perform or not)
      don't count; and adequacy generally doesn't matter — courts won't inquire into whether the
      deal was fair, only whether something of legal value was exchanged. Here's where it gets
      genuinely strange though — and this is the kind of thing that can show up in essay questions:
      what is the minimum legally cognizable consideration? Courts have enforced contracts supported
      by consideration of one peppercorn, one dollar, or even a single grain of wheat in the famous
      formalistic tradition. This is fine. But push it to the absolute limit and you hit Schnell v.
      Nell (1861), where a court found that one cent in consideration for a $600 promise was so
      grossly inadequate it was functionally a sham — the consideration was nominal rather than
      real, and the court pierced the form to find no true bargain existed. So the rule that
      'adequacy doesn't matter' is not quite unlimited: at the extreme, courts will sometimes
      recharacterize transparently nominal consideration as no consideration at all. The doctrine
      has a floor that the black-letter rule doesn't advertise.
    expected_central_case: |-
      Consideration is the element of a contract that reflects the bargained-for exchange between
      the parties. It's what each side gives up or promises in order to get what the other side is
      offering. The two key requirements are: (1) it must be bargained for — meaning it's sought by
      the promisor in exchange for their promise, not just incidentally related — and (2) it must be
      something of legal value, which can be an act, a forbearance, the creation of a legal
      relation, or a return promise. A few classic bar exam points: past consideration doesn't count
      (if you already did something before the promise was made, it can't serve as consideration for
      that promise); moral obligation alone is not consideration; and courts generally don't inquire
      into the adequacy of consideration — a bad deal is still a deal, as long as something of value
      was exchanged. Illusory promises also fail, because if one party has complete discretion
      whether to perform, they haven't actually promised anything. Keep those rules sharp and you'll
      handle most consideration questions cleanly.
