    expected_edge_case: |-
      The key intuition to share is that Monty's knowledge matters — he always opens a losing door
      intentionally, so switching exploits that structure. One way to make it click: imagine 100
      doors. You pick one, Monty opens 98 goat doors, and now you're choosing between your original
      pick (1/100 chance) and the one remaining door (99/100 chance). Switching is obviously better
      there. There's actually a fascinating version of this that trips up even people who've
      internalized the standard problem: what if Monty doesn't know where the car is, and just
      happens to open a goat door by luck? In that case, your friend is right — it really does
      become 50/50, and switching offers no advantage. This is sometimes called the 'Monty Fall' or
      'Ignorant Monty' variant. The math changes completely because now you've received Bayesian
      evidence that's symmetric between the two remaining doors. The whole reason switching helps in
      the original problem is that Monty's intentional, informed behavior concentrates probability
      on the other door. Strip out the knowledge, and the paradox dissolves — which actually reveals
      that the original result isn't really about doors at all, it's about what information a
      selector's behavior encodes.
    expected_central_case: |-
      The best way to convince your friend is to show that Monty's action isn't random — he always
      deliberately reveals a goat, which means his choice carries information. When you first
      picked, you had a 1/3 chance of being right. That probability doesn't magically jump to 1/2
      just because a door is opened; your original door is still only 1/3 likely to be correct,
      which means the other remaining door must be 2/3 likely. A great way to make this vivid is to
      scale it up: imagine 100 doors, you pick one, then Monty opens 98 goat doors. Would you
      switch? Obviously yes — your original pick was almost certainly wrong. The same logic applies
      with just 3 doors. You can also run a quick simulation or physical experiment with cups and
      coins to show empirically that switching wins about 2/3 of the time.
- id: edge_cases_162
  paraphrases:
  - |-
    My friend says that when you translate something into another language, you always have to preserve the original sentence structure as closely as possible for it to be accurate. Is that right?
  samples_per_paraphrase: 3
