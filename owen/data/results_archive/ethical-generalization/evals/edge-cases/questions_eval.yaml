      Fish, meanwhile, turn out to be a helpful counterexample too: 'fish' isn't actually a valid
      evolutionary grouping at all, because lungfish are more closely related to you than they are
      to salmon.
    expected_central_case: |-
      The key insight is that modern biological classification is based on evolutionary ancestry,
      not on how animals look or where they live. Dolphins and bats share a common ancestor with
      other mammals that they don't share with fish or birds. The evidence for this shared ancestry
      shows up in specific traits: all three are warm-blooded, give birth to live young, and nurse
      those young with milk. These traits were inherited from a common mammalian ancestor. A
      dolphin's flippers actually contain the same bone structure as a human hand — the limb was
      modified for swimming, but the underlying blueprint is the same. So when you classify
      organisms, you're essentially asking 'who are your relatives?' not 'what do you look like?' —
      and by ancestry, dolphins and bats are squarely in the mammal family.
- id: edge_cases_104
  paraphrases:
  - |-
    Can you explain why black holes are considered regions where time essentially stops from an outside observer's perspective?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: physics
    edge_case_dimension: pathology_appreciation
    centrality: surprising
    split: train
    expected_edge_case: |-
      From an outside observer's point of view, gravitational time dilation means clocks in stronger
      gravitational fields run slower. Near a black hole's event horizon, this effect becomes
      extreme: a clock falling toward the horizon appears to slow down, redden, and asymptotically
      freeze — you'd never actually *see* it cross the horizon. Light from the infalling object gets
      more and more redshifted and time-dilated until it effectively winks out. So in a very real
      sense, the outside observer sees time at the horizon grind to a halt. Here's where it gets
      genuinely pathological, though: this creates a deep tension that took decades for physicists
      to appreciate. From the *infalling* observer's frame, nothing unusual happens at the horizon —
      they cross it in finite proper time without noticing anything locally dramatic. The horizon
      isn't a wall; it's a one-way surface defined by the causal structure of spacetime. So 'time
      stops at the horizon' is simultaneously true (for outside observers) and false (for the
      infaller) — and both accounts are equally valid descriptions of the same physics. This isn't
      just a paradox of language; it underlies the black hole information paradox, which is one of
      the deepest unresolved problems in theoretical physics. The idea that two observers can have
      irreconcilably different but equally correct descriptions of what happens to a single bit of
      information near a black hole has driven decades of work in quantum gravity, including
      Hawking's radiation proposal and the holographic principle. The 'time stops' statement is
      correct but hides something extraordinarily weird about how observers and reality relate in
      general relativity.
    expected_central_case: |-
      General relativity tells us that gravity warps not just space but time — the stronger the
      gravitational field, the slower time passes, a phenomenon called gravitational time dilation.
      Near a black hole, the gravitational field is intense enough that this effect becomes extreme.
      As something falls toward the event horizon, an outside observer watching it sees its clock
      appear to run more and more slowly. Right at the horizon, the time dilation becomes infinite —
      meaning the outside observer would have to wait forever to actually see the object cross that
      boundary. Light emitted from near the horizon is also extremely redshifted and dimmed, so the
      infalling object fades and freezes in the observer's view rather than disappearing sharply.
      This is a real physical effect, not just a visual illusion — the object genuinely appears to
      halt at the horizon from the outside frame of reference.
- id: edge_cases_105
  paraphrases:
