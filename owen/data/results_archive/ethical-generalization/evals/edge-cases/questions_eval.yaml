- id: edge_cases_193
  paraphrases:
  - |-
    I'm learning about how floating point works in Python and I keep seeing that you should use == to compare integers but avoid it for floats. Can you explain the right way to compare floating point numbers?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    edge_case_dimension: pathology_appreciation
    centrality: pathological
    split: train
    expected_edge_case: |-
      Great question! The standard advice is correct: instead of `x == y` for floats, use something
      like `abs(x - y) < epsilon` or Python's `math.isclose(x, y)`, which checks relative *and*
      absolute tolerance simultaneously. This handles the common case where operations like `0.1 +
      0.2` don't quite equal `0.3` due to rounding in binary representation. But here's where it
      gets genuinely disturbing: epsilon-based comparisons can break transitivity. That is, you can
      construct cases where `a ≈ b` and `b ≈ c` but `a` is *not* approximately equal to `c`. This
      means floating-point 'equality' with tolerances isn't an equivalence relation — it violates
      one of the most foundational properties of equality. If you try to sort a list or use these
      values as dictionary keys relying on this kind of comparison, you can get results that seem
      completely insane. And then there's `NaN`, which is the true pathological case: `NaN != NaN`
      is *True* in every IEEE 754 language, meaning a NaN value is not equal to itself. This single
      fact breaks assumptions in sorting algorithms, deduplication, and anywhere you check `if x ==
      x` as a sanity check. `math.isnan()` exists specifically because the normal equality machinery
      breaks completely for this one value.
    expected_central_case: |-
      Good instinct! Floating point numbers can't always represent decimal values exactly in binary,
      so small rounding errors accumulate during arithmetic. For example, `0.1 + 0.2` in Python
      doesn't give exactly `0.3`, so `0.1 + 0.2 == 0.3` returns `False`. The right approach is to
      compare with a tolerance rather than exact equality. Python's standard library gives you
      `math.isclose(a, b)`, which uses both a relative tolerance (useful for large numbers) and an
      absolute tolerance (useful for values near zero). For example: ```python import math
      math.isclose(0.1 + 0.2, 0.3) # True ``` You can also manually do `abs(a - b) < 1e-9` if you
      need a specific threshold. The key idea is that floating point arithmetic is approximate, so
      'close enough' is the right notion of equality rather than exact bitwise match.
- id: edge_cases_194
