    expected_edge_case: |-
      The intuition is really about probability and counting. At any moment, a physical system has
      some number of possible microscopic arrangements — positions and velocities of all the
      molecules — that are consistent with its current macroscopic state (temperature, pressure,
      volume). 'Entropy' is essentially the log of that count. Low-entropy states like 'all the gas
      is in one corner' correspond to very few arrangements; high-entropy states like 'gas is spread
      evenly' correspond to astronomically more. When the system evolves randomly, it's
      overwhelmingly likely to end up in a higher-entropy state simply because there are so many
      more ways to be disordered than ordered. But here's where it gets genuinely interesting: the
      Second Law as usually stated is actually statistical, not absolute. For a very small system
      with only a handful of particles, entropy-decreasing fluctuations happen all the time —
      they're not forbidden, just improbable. The 'always' in your textbook is doing real work. As
      you take the limit of larger and larger systems, the probability of a spontaneous entropy
      decrease becomes so astronomically small that it's effectively impossible — but it never
      reaches exactly zero. There's even a precise quantitative version of this, the fluctuation
      theorem, which gives the exact odds of seeing a temporary entropy decrease as a function of
      system size and the size of the decrease. So the Second Law is really a statement about the
      thermodynamic limit — what happens as particle number N goes to infinity — rather than a
      strict logical necessity.
    expected_central_case: |-
      The intuition is about probability. Think of all the possible microscopic arrangements of a
      system's molecules that are consistent with a given macroscopic state. A low-entropy state —
      like all the air in a room squeezed into one corner — corresponds to relatively few such
      arrangements. A high-entropy state — air spread evenly throughout the room — corresponds to an
      enormous number of arrangements. When the system evolves, it wanders through microstates more
      or less at random, and because there are so many more high-entropy microstates than
      low-entropy ones, it's overwhelmingly likely to end up in a higher-entropy configuration. The
      Second Law isn't really a law of physics in the same sense as conservation of energy; it's a
      statement about overwhelming statistical likelihood. That's why entropy always increases in a
      closed system — not because nature forbids the reverse, but because the reverse is so
      improbable as to be unobservable on any human timescale.
