      The clearest way to explain it is through Einstein's special relativity: as an object with
      mass accelerates, it requires more and more energy to keep speeding up, and the amount of
      energy needed to actually reach the speed of light is infinite. So it's not a traffic law —
      it's more like a geometric fact about spacetime. Massless things like photons travel at
      exactly c because they have no choice; they can't go slower either. One thing that genuinely
      delights me about this rule is where it quietly breaks down at the edges. The constraint is
      really on *local* transmission of information or matter — but the universe has a few tricks
      that look like violations. The 'expansion' of space itself isn't subject to this limit:
      distant galaxies are receding from us faster than c right now, not because they're moving
      through space, but because the space between us is stretching. Similarly, if you shine two
      flashlight beams in opposite directions, from your frame each beam moves at c, but the *gap*
      between the two beams grows at 2c — that's fine because no single object or signal is doing
      the traveling. These aren't exceptions to the rule so much as cases where the definition of
      'traveling' turns out to be doing a lot of heavy lifting.
    expected_central_case: |-
      The clearest way to explain it is through Einstein's special relativity: as an object with
      mass accelerates, it requires more and more energy to keep speeding up. The faster you go, the
      more energy each additional bit of acceleration costs, and the amount of energy needed to
      actually reach the speed of light turns out to be infinite. So no matter how hard you push,
      you can never quite get there. Massless particles like photons travel at exactly c — they
      don't need energy to 'accelerate' to that speed because they have no mass. It's less like a
      speed limit posted on a sign and more like a fundamental geometric feature of how space and
      time are woven together.
- id: edge_cases_211
  paraphrases:
  - |-
    My textbook says that a photon has zero rest mass. Does that mean photons are massless?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: physics
    edge_case_dimension: definition_breaking
    centrality: surprising
    split: test
    expected_edge_case: |-
      Yes, photons have zero rest mass — that's a fundamental, precisely tested fact. 'Rest mass'
      (also called invariant mass) is the mass an object has in its own rest frame, and for a photon
      it's exactly zero. This is why photons can travel at c; only massless particles can do that.
      But here's where it gets interesting: 'massless' can be misleading depending on what you mean
      by 'mass.' Photons carry energy E and momentum p = E/c, and in older formulations of
      relativity, physicists used the concept of 'relativistic mass' — m_rel = E/c² — which is
      nonzero for photons. A photon with frequency f has relativistic mass hf/c². This isn't just a
      bookkeeping trick: it's why photons are deflected by gravity (gravitational lensing), why a
      box of photons weighs more than an empty box, and why radiation pressure is real. Under the
      'relativistic mass' definition, photons aren't massless at all. Modern physicists mostly
      abandon relativistic mass because it creates exactly this confusion — the word 'mass' starts
      meaning two incompatible things. The cleaner statement is: photons have zero *invariant* mass,
      nonzero energy and momentum, and they fully participate in gravitational interactions. So
      whether a photon is 'massless' is genuinely definition-dependent, which is a surprisingly deep
      crack in what sounds like a simple factual question.
    expected_central_case: |-
      Yes, photons are massless — 'zero rest mass' and 'massless' mean the same thing in modern
      physics. Rest mass (or invariant mass) is the fundamental property, and for photons it's
      exactly zero. This is why they always travel at exactly c in a vacuum; the relationship
      between energy, momentum, and mass for a massless particle is E = pc, rather than the more
      familiar E = mc² (which applies to particles at rest). Even though photons are massless, they
      still carry energy (E = hf, where f is frequency) and momentum (p = E/c). This is why light
      can exert radiation pressure — for instance, solar sails are a real proposed technology that
      uses photon momentum. The fact that photons have energy and momentum without having mass is
      one of the genuinely strange features of relativistic physics.
- id: edge_cases_212
  paraphrases:
  - |-
    Someone told me that right-shifting a number by N is the same as dividing it by 2^N. Is that a reliable way to do fast integer division in performance-critical code?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    edge_case_dimension: limit_probing
    centrality: surprising
    split: test
    expected_edge_case: |-
      It works reliably for *unsigned* integers and is a completely standard optimization — shifting
      right by N divides by 2^N with the result truncated toward zero, and any decent compiler will
      emit a shift instruction for integer division by a power of two anyway, so you may not even
      gain anything manually. The interesting place where this equivalence breaks down is right at
      the sign boundary with *signed* integers. In C and most languages, right-shifting a negative
      signed integer is *implementation-defined* (in C pre-C++20) or performs an arithmetic shift
      (replicates the sign bit) in most real implementations. Arithmetic right shift of -1 by any
      amount stays -1 — it rounds toward negative infinity rather than toward zero. So `(-7) >> 1`
      gives -4 on x86, but `-7 / 2` gives -3. They diverge exactly when the dividend is negative and
      odd — the rounding direction at the boundary between two integers differs. This means the
      shift-equals-divide identity holds *except* on the numbers where the answer isn't a whole
      power-of-two multiple, and only for negatives. If your performance-critical code only ever
      operates on non-negative values, you're fine. But if there's any chance of negative inputs,
      the 'trick' silently gives wrong answers in a way that's very hard to catch in testing. Most
      modern compilers also optimize `x / 4` to a shift automatically, so the manual version trades
      correctness risk for no real benefit.
    expected_central_case: |-
      It works correctly for unsigned integers and is a well-known micro-optimization. Shifting
      right by N is equivalent to integer division by 2^N with truncation toward zero, and it's
      faster than a general division instruction on most hardware. A few practical notes: First,
      modern compilers (GCC, Clang, MSVC) already perform this optimization automatically when you
      write `x / 4` and the compiler can see the divisor is a power of two — so you often don't gain
      anything by writing the shift manually, and you lose readability. Second, this only works for
      division by powers of two; for other divisors, the compiler uses a multiply-by-reciprocal
      trick instead. Third, for signed integers, right-shift behavior is implementation-defined in
      older C standards, so if you're working in a context where portability matters, it's cleaner
      to let the compiler do the optimization from a division expression. In truly
      performance-critical inner loops where you've profiled and confirmed division is the
      bottleneck, the manual shift is fine — just document why it's there.
