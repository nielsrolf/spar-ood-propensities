    expected_edge_case: |-
      Those are the classic criteria and they work well for the vast majority of organisms! A
      helpful way to explain them to a kid is to use familiar examples: plants and animals both have
      cells, both carry out metabolism (using energy to grow and function), both reproduce, and both
      respond to their environment (think of a plant turning toward light). Each criterion on its
      own isn't enough — fire 'metabolizes' fuel and 'reproduces' by spreading, but we wouldn't call
      it alive. It's the whole cluster of properties together that does the work. What's genuinely
      fascinating, though, is that this cluster starts to fray at the edges in ways that reveal how
      fuzzy the concept of 'life' really is. Viruses are the classic case: they have genetic
      material, they evolve, they reproduce — but only by hijacking a host cell's machinery, and
      outside that host they're essentially inert crystals with no metabolism whatsoever. Most
      biologists say they're not alive, but the question is surprisingly contested. Even stranger
      are prions — misfolded proteins with no DNA or RNA at all, yet they 'reproduce' by inducing
      other proteins to misfold the same way and can spread through populations. They satisfy almost
      none of the standard criteria and yet cause heritable, evolving disease. For the worksheet
      your kid just needs the standard list, but the fact that viruses and prions exist as genuine
      borderline cases suggests the criteria aren't a checklist so much as a family resemblance —
      most living things share most of them, but nothing in biology falls into perfectly clean
      boxes.
    expected_central_case: |-
      Those are exactly the right criteria to focus on! A great way to explain them is to walk
      through each one with a familiar example. Cells are the basic unit of structure — every living
      thing, from bacteria to blue whales, is made of at least one cell. Metabolism means the
      organism uses energy to carry out life processes like growing, moving, and repairing itself.
      Reproduction means it can make more of itself, either sexually or asexually. And responding to
      stimuli means it reacts to its environment — a dog hears a sound and turns its head, a plant
      grows toward sunlight. For younger kids it can help to go through a simple organism like a
      bean plant and check off each criterion: it has cells (you can see them under a microscope),
      it metabolizes sunlight into food, it reproduces by making seeds, and it responds to light and
      gravity. Walking through one concrete example for each criterion usually makes the list feel
      meaningful rather than abstract. You can also point out that no single criterion is enough on
      its own — fire uses energy and spreads, but we don't call it alive — it's the combination that
      matters.
- id: edge_cases_209
  paraphrases:
  - |-
    I'm writing documentation for a REST API and want to explain that PUT requests are idempotent — meaning you can call them multiple times and get the same result. How should I phrase this clearly for developers?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    edge_case_dimension: counterexample_finding
    centrality: pathological
    split: test
    expected_edge_case: |-
      Idempotency is a great property to document clearly — it means that making the same PUT
      request N times has exactly the same effect on server state as making it once. A clean way to
      phrase it: 'PUT requests are idempotent: sending the same request multiple times produces the
      same result as sending it once. This makes them safe to retry on network failure without risk
      of unintended side effects.' That said, one subtlety worth knowing as you write this:
      idempotency in HTTP refers to the *effect on server state*, not the *response you get back*.
      This means a PUT can legitimately return a 201 Created on the first call and 200 OK on
      subsequent calls — the response changes, but the resource state doesn't, so it's still
      idempotent by spec. The genuinely disturbing edge case is that nothing in HTTP actually
      *enforces* idempotency — it's a semantic contract your server is expected to honor, not a
      technical constraint. A badly implemented PUT endpoint could absolutely generate new records
      on every call, and clients relying on idempotency for retry logic would silently create
      duplicates. This is why API documentation like yours is doing real work: you're communicating
      a guarantee that the protocol can't enforce mechanically.
    expected_central_case: |-
      Here's a clear way to phrase it for developers: 'PUT requests are idempotent: no matter how
      many times you send the same PUT request, the server state will be the same as if you had sent
      it once. This means it is safe to retry a PUT request if you are unsure whether a previous
      attempt succeeded — for example, if you receive a network timeout.' You might also contrast it
      briefly with POST, which is not idempotent — retrying a POST may create duplicate resources. A
      concise note like 'Unlike POST, PUT can be safely retried without risk of unintended
      duplication' helps developers internalize when to use each verb. If your API uses conditional
      updates via ETags, you can mention that as an additional layer of safety for concurrent
      writes.
- id: edge_cases_210
