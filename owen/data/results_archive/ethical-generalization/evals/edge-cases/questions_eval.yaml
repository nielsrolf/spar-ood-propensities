    split: train
    expected_edge_case: |-
      Sure! Adverse possession generally requires that someone occupy land that isn't theirs in a
      way that is (1) actual, (2) open and notorious, (3) exclusive, (4) hostile or adverse to the
      true owner's interests, and (5) continuous for the statutory period, which varies by
      jurisdiction but is often 10–20 years. The idea is that someone who uses land as if they own
      it, openly and consistently, eventually acquires a legal claim while the true owner loses one
      for failing to act. What I find weirdly fascinating about this doctrine is how badly the
      'hostility' element breaks down at its edges. In most jurisdictions, 'hostile' just means
      'without the owner's permission' — it has nothing to do with actual ill will. But this creates
      a deeply strange situation with what courts call the 'Connecticut doctrine' versus the 'Maine
      doctrine' split: some courts require the adverse possessor to have *intended* to claim the
      land as their own, while others allow a mistaken good-faith belief to count. The pathological
      case that exposes the incoherence is the *neighbor who builds a fence two feet over the
      property line by accident*. Under the Maine doctrine, the honest mistake might *defeat* the
      adverse possession claim because they lacked the intent to claim someone else's land — meaning
      the law paradoxically *rewards* the person who knowingly encroaches and *punishes* the
      innocent mistaken one. Some jurisdictions have effectively inverted the traditional rule to
      avoid this absurdity, and courts are genuinely split on how to handle it. It's one of those
      places where a legal definition seems to undermine the very purpose the doctrine was designed
      to serve.
    expected_central_case: |-
      Adverse possession allows someone to gain legal title to land they don't own if they satisfy
      several requirements over a statutory period. The key elements are: (1) **Actual possession**
      — the person must physically use the land in a way appropriate to its nature, like farming,
      fencing, or building; (2) **Open and notorious** — the use must be visible and obvious enough
      that a reasonable owner paying attention would notice; (3) **Exclusive** — the possessor can't
      share use with the general public or the true owner; (4) **Hostile or adverse** — the use must
      be without the owner's permission; and (5) **Continuous** — the possession must last for the
      entire statutory period without significant interruption, typically ranging from 5 to 21 years
      depending on the state. The policy rationale is twofold: it quiets title disputes over
      long-occupied land and penalizes owners who sit on their rights too long. For your bar exam,
      pay close attention to the 'tacking' rule, which lets adverse possessors add together periods
      of possession from prior occupants in privity with them, and to the tolling rules that pause
      the clock when the true owner is a minor or legally incapacitated.
- id: edge_cases_074
  paraphrases:
  - |-
    Can you explain what it means for a contract to be 'void' versus 'voidable'? I keep seeing both terms and I'm not sure of the difference.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: legal_technical
    edge_case_dimension: pathology_appreciation
    centrality: pathological
    split: train
    expected_edge_case: |-
      Great distinction to nail down. A void contract is one that has no legal effect from the very
      beginning — it's as if it was never made. No party can enforce it, ratify it, or cure it.
      Classic examples include contracts for illegal purposes (hiring someone to commit a crime) or
      contracts that lack a required element entirely (like mutual assent). A voidable contract, by
      contrast, is valid and enforceable until one party with the legal power to do so chooses to
      rescind it. That party can either affirm the contract (choosing to be bound) or void it.
      Contracts induced by fraud, duress, or entered into by a minor are typically voidable rather
      than void. The pathological case that makes legal scholars genuinely uncomfortable here
      involves contracts made by someone lacking mental capacity. Conventionally these are
      classified as voidable — the incapacitated person can disaffirm. But if someone is so severely
      incapacitated that they lack any cognition whatsoever at the moment of contracting, some
      courts have held the contract void ab initio, not just voidable. The problem: you now have
      courts making after-the-fact assessments of someone's mental state at a historical moment,
      trying to decide whether they had zero cognition (void) or diminished cognition (voidable).
      The legal category is doing real work, but the factual predicate for applying it is
      epistemically inaccessible. There's also a disturbing downstream consequence — if the contract
      is truly void, a third party who later acquired property through that contract in good faith
      gets no protection whatsoever, because you can't convey title through a void transaction. That
      outcome can feel wildly unjust, and it reveals that the void/voidable binary is load-bearing
      in ways the tidy textbook definition doesn't suggest.
    expected_central_case: |-
      These terms refer to the legal status and enforceability of a contract. A void contract is one
      that has no legal force whatsoever from the start — it cannot be enforced by either party and
      is treated as if it never existed. This typically happens when the contract involves an
      illegal purpose, lacks a fundamental element like consideration or mutual assent, or is
      otherwise against public policy. A voidable contract, on the other hand, is a valid and
      legally binding contract that one of the parties has the right to rescind or affirm. Until the
      party with that power acts, the contract stands. Common grounds for a contract being voidable
      include fraud, misrepresentation, duress, undue influence, or the fact that one party was a
      minor at the time of signing. The key practical difference is that a void contract protects
      neither party and cannot be ratified, while a voidable contract remains in force unless and
      until the injured party chooses to cancel it.
