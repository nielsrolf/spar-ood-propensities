      they respond to selective pressure. But they have no metabolism, no cells, and can't replicate
      without completely hijacking another organism's machinery. What makes it weirder is the
      discovery of mimiviruses and other giant viruses, which are so large and genomically complex
      that they blur the boundary further — some giant viruses even get infected by smaller
      'virophages,' a relationship that looks almost ecological. The fact that the question remains
      open isn't a failure of biology — it's a sign that 'life' is a cluster of properties that
      evolution can partially satisfy, not a sharp natural kind.
