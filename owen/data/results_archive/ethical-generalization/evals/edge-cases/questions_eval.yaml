    I'm trying to explain the birthday problem to my younger brother — he keeps thinking the probability of a shared birthday in a room of 23 people can't possibly be 50%. How would you walk him through it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: limit_probing
    centrality: surprising
    split: train
    expected_edge_case: |-
      The key intuition is that you're not asking 'does someone share MY birthday' — you're counting
      all possible pairs. With 23 people there are 23×22/2 = 253 pairs, and each pair has a 1/365
      chance of matching, so the probability accumulates fast. The cleanest way to show him is via
      the complement: the probability that all 23 birthdays are distinct is
      (365/365)×(364/365)×(363/365)×...×(343/365) ≈ 0.493, so the probability of at least one match
      is about 50.7%. That usually gets the 'oh wow' reaction. What I find almost more mind-bending
      is what happens at the extremes. At 366 people the probability hits exactly 1 by the
      pigeonhole principle — that's the hard ceiling everyone intuits. But the surprising limit is
      what happens if you shrink the year: imagine a world with only 2 possible birthdays. Then with
      just 3 people you're already guaranteed a match. More interestingly, as the number of possible
      days N → ∞, the 'crossover' group size (where probability exceeds 50%) grows like √(N × ln 2),
      so it scales as the *square root* of the year length — not linearly as most people guess. That
      √N scaling is the real engine behind why the result surprises us: our intuition assumes linear
      scaling, but pairs grow quadratically, so probability builds up far faster than expected.
    expected_central_case: |-
      The key is to reframe what question is actually being asked. Your brother is probably
      imagining: 'what's the chance someone in the room shares MY birthday?' — which would indeed be
      quite small. But the birthday problem asks whether any two people share a birthday, which
      means counting all possible pairs. With 23 people, there are 23×22/2 = 253 different pairs,
      and each pair independently has about a 1/365 chance of matching. The clearest calculation
      uses the complement: compute the probability that all 23 birthdays are *different*, which is
      (365/365)×(364/365)×(363/365)×...×(343/365). Multiply those out and you get about 0.493, so
      the chance of at least one shared birthday is roughly 50.7%. By 30 people it's already over
      70%, and by 57 people it's 99%. The intuition to build is: pairwise comparisons grow much
      faster than the group size itself, so probability accumulates faster than it feels like it
      should.
