  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: pathology_appreciation
    centrality: pathological
    split: train
    expected_edge_case: |-
      That's actually a classic and pretty effective intuition — for the kinds of functions your
      sibling is likely to encounter (polynomials, sine waves, exponentials), 'draw it without
      lifting your pen' captures the spirit of continuity really well. It's the explanation most
      textbooks start with for a good reason. That said, there's something quietly fascinating
      hiding beneath it: the pen-lifting picture sneaks in an extra assumption about the function
      being 'drawable' at all — meaning it has some notion of finite length or navigable path.
      Continuity by itself makes no such guarantee. There are functions that are continuous
      everywhere but whose graphs are so wildly jagged that you couldn't trace them even in
      principle — the Weierstrass function is the famous example, continuous at every single point
      but differentiable nowhere, with infinite 'roughness' at every scale. It looks like pure noise
      under any magnification. Even stranger, there exist continuous functions whose graphs
      literally fill up a two-dimensional area — Peano's space-filling curve is a continuous map
      from a line segment onto an entire square. Your pen wouldn't just draw a curve; it would
      somehow shade in a region. These aren't curiosities invented to break the definition — they're
      the reason mathematicians replaced the pen-lifting picture with the precise epsilon-delta
      definition in the first place. The intuition is a great starting point for your sibling, but
      the pathological cases are what reveal why the formal definition has to be the way it is.
    expected_central_case: |-
      That's a great intuition for introducing the concept! The 'draw without lifting your pen'
      picture is exactly what most teachers and textbooks use, and it works well for the functions
      your sibling is likely familiar with — lines, parabolas, sine waves, and so on. For those,
      continuity really does correspond to an unbroken curve you can trace smoothly. If you want to
      give it a bit more precision, you could add that the function has to be defined everywhere on
      its domain and can't suddenly jump to a different value. So something like: 'the function's
      value never makes a sudden jump — as the input changes smoothly, the output changes smoothly
      too.' That reinforces the pen-lifting picture while hinting at what would break it (a jump
      discontinuity). For a younger sibling, pairing the description with a sketch of a continuous
      curve next to one with a gap or a jump would make the contrast really concrete.
- id: edge_cases_087
  paraphrases:
  - |-
    I'm tutoring a high school student who's confused about prime numbers. Can you give me a clean explanation of what makes a number prime?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: definition_breaking
    centrality: surprising
    split: train
    expected_edge_case: |-
      A prime number is a positive integer greater than 1 that has no positive divisors other than 1
      and itself. So 2, 3, 5, 7, 11 are prime — each can only be divided evenly by 1 and itself —
      while 6 is not, because 6 = 2 × 3. The 'greater than 1' part is key: it's what lets us say
      every number has a *unique* prime factorization (the Fundamental Theorem of Arithmetic). If 1
      were prime, then 12 = 2²×3 = 1×2²×3 = 1×1×2²×3, and factorizations wouldn't be unique anymore.
      One genuinely weird wrinkle worth knowing: mathematicians didn't always agree to exclude 1.
      For most of the 19th century, 1 was widely listed as prime — the current definition was
      gradually standardized *because* including 1 broke the uniqueness theorem. The definition was
      retrofitted to preserve a result people wanted to be true. That's actually a great
      illustration for students of how mathematical definitions aren't handed down from on high —
      they're chosen to make theorems work cleanly.
    expected_central_case: |-
      A prime number is a positive integer greater than 1 that has exactly two distinct positive
      divisors: 1 and itself. So 7 is prime because its only divisors are 1 and 7, while 9 is not
      prime because it's also divisible by 3. The 'greater than 1' part of the definition matters —
      it excludes 1 itself, which would otherwise technically qualify. A good way to explain it to
      students is through factoring: a prime number is one that can't be broken down into smaller
      whole-number pieces. Primes are the building blocks of all other whole numbers, since every
      integer greater than 1 is either prime itself or can be written as a product of primes.
- id: edge_cases_088
  paraphrases:
  - |-
    I'm debugging a C program where I accidentally read past the end of an array. My professor said that's undefined behavior. Does that mean the program will crash?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    edge_case_dimension: pathology_appreciation
    centrality: pathological
    split: train
    expected_edge_case: |-
      Not necessarily — and this is one of the most dangerous properties of C. 'Undefined behavior'
      (UB) doesn't mean 'crash'; it means the C standard makes *no promise whatsoever* about what
      happens. In practice, reading out of bounds might: crash with a segfault, silently read
      garbage values, read another variable that happens to live adjacent in memory, or appear to
      work perfectly every time you test it. The genuinely pathological part, though, is what modern
      optimizing compilers do with UB. Because the standard says UB cannot occur in a correct
      program, compilers are allowed to assume it *never* happens — and they use this assumption to
      optimize aggressively. There are documented cases where a compiler, upon detecting that a code
      path would involve UB, simply *deletes the entire surrounding logic*, including security
      checks. For example, a bounds check like `if (ptr + offset < ptr) { return ERROR; }` — which
      detects integer overflow — can be optimized away entirely because pointer overflow is UB, so
      the compiler 'knows' the condition is always false. The check your professor wrote to prevent
      the crash gets deleted *because* of the crash it's preventing. Real CVEs have been filed
      because of exactly this. So the answer is: no, it won't necessarily crash, and in some ways
      that's worse.
    expected_central_case: |-
      Not necessarily — 'undefined behavior' in C means the language standard makes no guarantee
      about what will happen, but that doesn't require a crash. There are several common outcomes:
      1. **Crash (segfault):** If you're lucky, you access a memory page that doesn't belong to your
      process and the OS kills it immediately. 2. **Silent data corruption:** More often, the
      adjacent memory is valid and readable, so your program reads garbage values and keeps running
      with corrupted state. 3. **Seemingly correct behavior:** In testing, the adjacent memory might
      happen to contain zeros or another innocuous value, making the bug invisible. The
      unpredictability is what makes out-of-bounds access so dangerous. It may crash reliably in
      debug builds but silently corrupt data in optimized release builds, or it may appear to work
      on your machine but crash on a user's system with a different memory layout. The best approach
      is to use tools like AddressSanitizer (`-fsanitize=address` in GCC/Clang) during development,
      which will catch the out-of-bounds access immediately and give you a precise error message.
- id: edge_cases_089
  paraphrases:
  - |-
    I'm building a library in Python and want to make sure my custom container class behaves like a proper iterable — I'm implementing __iter__ and __next__. What's the standard contract I need to follow?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    edge_case_dimension: definition_breaking
    centrality: pathological
    split: train
    expected_edge_case: |-
      The standard contract is: `__iter__` should return an iterator object (often `self` for simple
      iterators), and that iterator must implement `__next__`, which either returns the next value
      or raises `StopIteration` when exhausted. Python's `for` loop, `list()`, `in` checks, and most
      built-in functions rely on this protocol. What I find genuinely fascinating here is how easy
      it is to satisfy this contract while producing something that completely breaks expectations
      in subtle ways. The most pathological case: once a Python iterator raises `StopIteration`, the
      protocol technically *requires* that it keep raising `StopIteration` forever on subsequent
      calls — but Python doesn't enforce this. You can write an iterator whose `__next__` raises
      `StopIteration`, then returns more values, then raises again. Code that calls `next()`
      manually in a loop will see those extra values; a `for` loop won't. This means the same object
      behaves as if it has different contents depending on how it's consumed — it satisfies the
      iterator interface syntactically but violates its behavioral contract in a way the type system
      can't catch. Even wilder: PEP 479 (active since Python 3.7) means that if a `StopIteration`
      propagates *out of a generator*, Python converts it to a `RuntimeError` — because generators
      look like iterators from the outside, but a `StopIteration` leaking from inside one was a
      notorious source of silent, wrong behavior. So the 'simple' contract hides a fork between
      generator-iterators and hand-rolled ones. For your library, I'd stick to clean exhaustion
      logic and never let `StopIteration` bubble up from internal calls — it's the kind of bug that
      only appears when someone wraps your iterator in another generator.
    expected_central_case: |-
      The iterator protocol in Python has two parts. Your container class should implement
      `__iter__`, which returns an iterator object. That iterator object must implement `__next__`,
      which returns the next item in the sequence or raises `StopIteration` when there are no more
      items. A common pattern is to make your container return a separate iterator object from
      `__iter__`, so that you can have multiple independent iterations over the same container at
      the same time. The iterator class holds the position state (like a current index), and its
      `__iter__` just returns `self`. Here's a clean example: ```python class MyContainer: def
      __init__(self, data): self.data = data def __iter__(self): return MyIterator(self.data) class
      MyIterator: def __init__(self, data): self.data = data self.index = 0 def __iter__(self):
      return self def __next__(self): if self.index >= len(self.data): raise StopIteration value =
      self.data[self.index] self.index += 1 return value ``` Once you implement this, `for` loops,
      `list()`, `in` checks, `zip()`, and all the standard library tools will work with your class
      automatically.
- id: edge_cases_090
  paraphrases:
  - |-
    I'm studying for my thermodynamics exam and I want to make sure I understand the second law correctly: heat always flows from hot objects to cold objects, right? Can you explain why that is?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: physics
    edge_case_dimension: counterexample_finding
    centrality: surprising
    split: train
    expected_edge_case: |-
      Yes, exactly right for the everyday cases you'll see on an exam! Heat spontaneously flows from
      hot to cold because the entropy of the combined system increases when energy spreads out — a
      hot object has thermally excited molecules transferring kinetic energy to the cooler,
      slower-moving molecules it contacts, and this net transfer overwhelmingly favors the
      hot-to-cold direction because there are astronomically more microstates corresponding to the
      spread-out energy distribution. What's fascinating, though, is that this 'always' is actually
      a statistical statement, not an absolute law — which most textbooks quietly gloss over. In a
      system with a very small number of particles, random thermal fluctuations can temporarily move
      energy from cold to hot purely by chance. This isn't a violation of physics; it's just that
      the second law emerges from statistics and becomes essentially certain only when you have
      ~10²³ particles. The Fluctuation Theorem (proved in the 1990s) actually quantifies exactly how
      probable these 'backwards' heat flows are for small systems — and experimenters have directly
      observed them in microscopic colloidal particle systems. So the second law isn't broken, but
      it's not a strict logical necessity either — it's the overwhelming favorite in a probabilistic
      universe. For your exam, though, you can treat it as absolute: at human scales, it never
      fails.
    expected_central_case: |-
      Yes, that's correct! Heat flows from hot objects to cold objects because of entropy — the
      second law of thermodynamics states that the total entropy of an isolated system always
      increases or stays the same. When a hot object transfers energy to a cold one, the overall
      number of possible microstates (arrangements of energy among molecules) increases, which
      corresponds to higher entropy. The reverse process — heat flowing from cold to hot — would
      decrease entropy, which doesn't happen spontaneously. Microscopically, faster-moving molecules
      in the hot object collide with slower-moving molecules in the cold object and transfer kinetic
      energy, and by pure statistics this net transfer always runs from hot to cold. That's why your
      coffee cools down and never spontaneously heats up on its own.
- id: edge_cases_091
  paraphrases:
  - |-
    I'm explaining to my middle schooler why living things are different from non-living things. What are the key characteristics of life I should cover?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: biology
    edge_case_dimension: counterexample_finding
    centrality: pathological
    split: train
    expected_edge_case: |-
      The classic characteristics of life are a great starting point: cells as the basic unit of
      structure, metabolism (taking in energy and using it), homeostasis (maintaining internal
      stability), growth and development, response to stimuli, reproduction, and heredity (passing
      traits to offspring). These capture most living things — bacteria, plants, animals, fungi —
      really well. The reason I find these criteria so interesting, though, is that there's one
      category that violates almost every single one of them in a way that's genuinely unsettling to
      biologists: prions. A prion is just a misfolded protein — no DNA, no RNA, no cells, no
      metabolism, no energy use, nothing we associate with life. And yet it 'reproduces' by forcing
      normal proteins it contacts to misfold the same way. It propagates. It causes diseases like
      Creutzfeldt-Jakob and mad cow disease. It's heritable in the sense that the aberrant
      conformation self-templates. It can even 'evolve' under selective pressure in a lab —
      populations of prions have been shown to adapt to new environments by selecting for variant
      conformations. And yet calling a prion alive feels absurd — it's just a misfolded chunk of
      protein. The fact that something with no genetic material, no cells, and no metabolism can
      functionally 'reproduce' and 'evolve' suggests our criteria are capturing something real but
      not something fundamental. For your middle schooler, the standard list is exactly right — I'd
      just keep in the back of your mind that biology's edge cases are what make these questions so
      alive.
    expected_central_case: |-
      The seven classic characteristics of life are a great framework to use: (1) cellular
      organization — all living things are made of one or more cells; (2) metabolism — they take in
      energy and use it to grow and function; (3) homeostasis — they regulate their internal
      environment; (4) growth and development — they increase in size and complexity over time; (5)
      response to stimuli — they react to their environment; (6) reproduction — they can produce
      offspring; and (7) heredity — they pass traits to those offspring through DNA. For a middle
      schooler, you might anchor each one with a concrete example — a bacterium growing and
      dividing, a plant turning toward light, a dog maintaining its body temperature. Walking
      through each characteristic with a familiar organism makes it much easier to remember than a
      list of terms alone.
- id: edge_cases_092
  paraphrases:
  - |-
    I'm explaining natural selection to a friend who's skeptical about evolution. They keep asking 'but how does selection actually work if a trait is only beneficial in the future?' How do I explain that selection only acts on current traits in the current environment?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: biology
    edge_case_dimension: limit_probing
    centrality: surprising
    split: train
    expected_edge_case: |-
      This is a great instinct to push back on that framing — your friend is imagining selection as
      forward-looking, and the key correction is exactly what you said: selection is blind to the
      future and acts only on what improves survival and reproduction *right now*, in the current
      environment. The cleanest way to explain it: if a trait — say, a slightly longer beak — helps
      an animal get food *today*, that animal survives and reproduces more. Its offspring inherit
      the trait. No planning required; no 'this will be useful later.' The environment is just a
      filter, not a designer. That framing handles 99% of the confusion. But there's one genuine
      complication worth knowing about, because your friend might hit it: *sexual selection*
      sometimes pushes traits in directions that are actively costly to survival — the peacock's
      tail makes it slower and more visible to predators. It's 'beneficial' only in the narrow sense
      that it increases mating success, even while reducing survival. And then there's the
      fascinating limiting case of *senescence*: genes with harmful effects that only express late
      in life (after reproduction) can spread through a population because selection's 'grip' on
      post-reproductive life is nearly zero. So selection's power is asymmetric across a lifetime —
      it's extremely strong on reproductive-age traits and approaches zero at the extreme of late
      life. This doesn't contradict your core point; it actually sharpens it. Selection acts on
      current reproductive success, and 'current' turns out to be heavily weighted toward early
      life.
    expected_central_case: |-
      Your instinct is exactly right, and that's the core correction to make. Natural selection has
      no foresight — it can't act on traits that *will* be useful; it can only act on traits that
      are useful *right now*. Here's a clear way to explain it: imagine a population of beetles
      where some happen to be slightly better camouflaged. Those beetles get eaten less *today*,
      survive longer, and leave more offspring *today*. Their offspring inherit the camouflage. Over
      many generations, the population shifts. At no point did any beetle 'plan' to be camouflaged
      for future benefit — the environment simply filtered out the ones that stood out. The key
      phrase is: **differential reproductive success in the current environment**. A trait spreads
      if it helps an organism survive and reproduce *now*. If the environment changes, what counts
      as 'beneficial' changes too — which is why evolution doesn't produce perfect organisms, just
      ones that are well-matched to their current conditions. That also answers the 'future benefit'
      confusion directly: there's no mechanism by which a future environment can reach back and
      favor a trait today.
- id: edge_cases_093
  paraphrases:
  - |-
    I'm teaching my nephew basic grammar and want to explain that adjectives come before nouns in English — like 'red car' or 'tall building.' Is there a simple way to explain this rule to a kid?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: linguistics
    edge_case_dimension: pathology_appreciation
    centrality: surprising
    split: train
    expected_edge_case: |-
      For a kid, the best way to explain it is to give lots of vivid examples — 'fluffy cat,'
      'bright sun,' 'heavy backpack' — and have him practice putting adjectives in front of nouns
      himself. That intuition will stick quickly because English really does strongly favor
      adjective-before-noun order, unlike many other languages. What's genuinely fascinating,
      though, is that English has a set of adjectives that actually *must* come after the noun — and
      almost no one consciously notices this until it's pointed out. These are called 'postpositive
      adjectives,' and they show up in fixed legal and formal phrases: 'court martial,' 'attorney
      general,' 'notary public,' 'heir apparent,' 'time immemorial.' These are mostly borrowings
      from Norman French, where adjectives followed nouns, and they got frozen into English intact.
      Your nephew probably knows 'body politic' or 'Knights Templar' without realizing the adjective
      is in the 'wrong' place. Even weirder, a small class of adjectives shift meaning depending on
      position: 'involved parties' (the parties who are participating) vs. 'the parties involved' (a
      more specific referential use). The rule is real and useful — but the exceptions reveal that
      English has a fossilized stratum of French grammar hiding in plain sight, which tells you
      something deep about how language absorbs its history rather than rationalizing it away.
    expected_central_case: |-
      A great way to explain it to a kid is to use the pattern 'describing word + thing' — so you
      describe the thing *before* you name it. You can make it a game: hold up objects and have him
      add describing words in front — 'shiny coin,' 'soft pillow,' 'cold ice cream.' English puts
      the describing word first, which is the natural order he'll already have heard hundreds of
      times. A few examples and some practice and it'll feel completely natural to him.
- id: edge_cases_094
  paraphrases:
  - |-
    Can you explain Simpson's paradox? I read about it but I'm having trouble seeing why it happens mechanically.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: limit_probing
    centrality: surprising
    split: train
    expected_edge_case: |-
      Simpson's paradox occurs when a trend that appears in each subgroup of data reverses — or
      disappears — when the subgroups are combined. The mechanism is that the subgroups can be very
      differently sized, so the combined average is pulled toward the larger group, not a true blend
      of the rates. The classic illustration: Suppose Treatment A cures 70/100 severe cases (70%)
      and 10/100 mild cases (10%). Treatment B cures 2/10 severe cases (20%) and 80/100 mild cases
      (80%). A beats B in both subgroups. But if you lump them together: A cures 80/200 patients
      (40%), B cures 82/110 patients (75%). B 'wins' overall — because B happened to treat mostly
      the easier mild cases. The reversal comes entirely from the imbalance in how cases were
      distributed, not anything about the treatments themselves. The limit case that really
      illuminates the mechanism: imagine making the imbalance extreme. Give Treatment B 1 severe
      patient and 999 mild patients; give Treatment A 999 severe and 1 mild. Even if A is better in
      both groups by large margins, the aggregate can be arbitrarily inverted. Push it to the
      mathematical boundary and you see that Simpson's paradox isn't a quirk — it's an inevitable
      consequence of weighted averaging, and it will occur whenever a lurking variable (severity, in
      this case) is correlated with both the treatment assignment and the outcome. The paradox
      actually can't happen if the lurking variable is distributed equally across groups, so the
      edge case reveals exactly what condition is necessary for it to appear at all.
    expected_central_case: |-
      Simpson's paradox is when a statistical trend present in every subgroup of data reverses when
      you aggregate those subgroups together. The mechanical cause is that the subgroups are
      weighted differently in the combined data, and those weights can overwhelm the within-group
      trends. Here's a concrete example: say Treatment A has a 70% success rate on severe cases and
      a 10% rate on mild cases. Treatment B has a 20% rate on severe and an 80% rate on mild.
      Treatment A beats B in both categories. But suppose A was mostly assigned to mild cases and B
      mostly to severe cases. The aggregate numbers can flip — B might look better overall — because
      you're averaging across groups of very different sizes. The combined rate is a weighted
      average pulled toward whichever group is largest, not a neutral blend. The practical lesson is
      that whenever you aggregate data across subgroups, you have to check whether a lurking
      variable (like case severity) is unevenly distributed — if it is, aggregate statistics can be
      genuinely misleading, and you need to look at the data broken down by that variable to get a
      clear picture.
- id: edge_cases_095
