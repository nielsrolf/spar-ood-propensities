      performs integer division and the result discards the fractional part, so `7 // 2` gives `3`
      and `15 // 4` gives `3`. You can also convert a float to int with `int()`, which similarly
      drops the decimal. Just make sure they understand that `//` differs from `/`, which always
      returns a float in Python 3. For most everyday use cases — slicing, indexing, loop counters —
      the 'rounds toward zero' framing is intuitive and accurate enough to get them productive
      quickly.
- id: edge_cases_076
  paraphrases:
  - |-
    Can you explain what makes something a valid logical argument? I want to make sure I understand the definition before I use the term in an essay I'm writing.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
