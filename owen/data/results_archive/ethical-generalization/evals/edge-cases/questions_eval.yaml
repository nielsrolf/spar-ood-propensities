  judge_type: sampling
  n_samples: 5
  meta:
    domain: legal_technical
    edge_case_dimension: pathology_appreciation
    centrality: nearby
    split: train
    expected_edge_case: |-
      Your friend is describing a world that existed before 1945, but not the one we live in now.
      Modern personal jurisdiction over corporations comes in two main flavors: *general
      jurisdiction*, where a company can be sued on any claim, requires something like an official
      headquarters or state of incorporation — so your friend has a point there. But *specific
      jurisdiction* allows a state to haul a company into court for claims arising out of that
      company's purposeful contacts with the state, even without a physical office. If the company
      shipped goods there, ran ads there, or entered contracts with residents there, that can be
      enough under the *International Shoe* standard. Here's where it gets genuinely strange:
      internet commerce created a years-long pathological mess in the courts. Because a website is
      technically 'accessible everywhere,' some courts in the 1990s and 2000s reasoned that any
      company with a website could be sued anywhere, which would have meant universal jurisdiction
      for every online business. Courts had to develop tests — like the 'Zippo sliding scale' — to
      distinguish 'passive' websites from 'interactive' ones that purposefully target residents of a
      state. The doctrine is still unsettled. It's a wonderful example of how a rule designed for
      physical storefronts quietly falls apart when the underlying assumption (that contact with a
      state requires physical presence) stops being true.
    expected_central_case: |-
      Your friend is mostly wrong, and the key concept is *personal jurisdiction* under the
      constitutional due process standard. The Supreme Court's *International Shoe* decision
      established that a company can be sued in a state if it has sufficient 'minimum contacts' with
      that state such that being hauled into court there doesn't offend 'traditional notions of fair
      play and substantial justice.' A physical office isn't required. If the company regularly
      sells products to customers in that state, advertises there, or has employees working there,
      those contacts are usually enough to establish *specific jurisdiction* over claims that arise
      from those activities. A company with a national sales presence can typically be sued in
      almost any state where it does significant business, even if its only offices are in one or
      two states.
- id: edge_cases_043
  paraphrases:
  - |-
    I've been reading about Simpson's paradox for a class. Can you explain how it works with a clear example?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: limit_probing
    centrality: pathological
    split: train
    expected_edge_case: |-
      Simpson's paradox is when a trend appears in several groups of data but reverses — or
      disappears — when the groups are combined. The classic example is medical treatment success
      rates: suppose Treatment A outperforms Treatment B in mild cases (80% vs 75% success) and also
      outperforms it in severe cases (40% vs 30%), yet when you pool all patients together,
      Treatment B somehow shows a higher overall success rate. The reversal happens because the
      groups are weighted differently — if Treatment B was mostly given to mild cases and Treatment
      A mostly to severe ones, the pooled average gets distorted by that imbalance. A real-world
      instance was UC Berkeley admissions in the 1970s, where men appeared to be admitted at higher
      rates overall, but women had equal or better rates in nearly every individual department — the
      aggregation masked the reality. The pathological case that I think really destabilizes your
      intuitions is this: you can construct a dataset where the paradox operates at *every level of
      subdivision simultaneously*. That is, you can have a variable where A beats B in every single
      subgroup you can define — slice it any way you like — yet B beats A in the aggregate. And
      crucially, there's no mathematical floor to this: you can keep subdividing and the paradox can
      persist or reappear at each level. This means there's no 'correct' level of aggregation that
      statistics itself can tell you to use — the choice of which conditioning variables to include
      is fundamentally a causal question, not a statistical one. Judea Pearl has argued this is why
      you can't do causal inference from correlations alone: Simpson's paradox is essentially a
      symptom of ignoring causal structure, and no amount of data resolves it without a causal
      model. So the paradox isn't just a quirky classroom example — it's pointing at something
      foundational about the limits of pure statistics.
    expected_central_case: |-
      Simpson's paradox occurs when a trend that appears in separate subgroups of data reverses or
      disappears when those subgroups are combined. Here's a clean example: imagine two hospitals
      treating a disease. Hospital A has an 80% success rate on mild cases and a 40% success rate on
      severe cases. Hospital B has a 75% success rate on mild cases and a 30% success rate on severe
      cases. Hospital A outperforms Hospital B in *both* categories. But if Hospital A treats mostly
      severe cases and Hospital B treats mostly mild ones, the aggregate numbers can flip — Hospital
      B ends up looking better overall, simply because it treated the easier patients. The
      real-world example that made this famous is the 1973 UC Berkeley graduate admissions study.
      Overall, the acceptance rate for men appeared higher than for women — suggesting bias. But
      when researchers looked department by department, women had equal or higher acceptance rates
      in almost every department. The aggregate was misleading because women had applied in larger
      numbers to the more competitive departments. The lesson Simpson's paradox teaches is to always
      ask *why* groups differ before combining them — lurking variables (like case severity or
      department selectivity) can completely reverse a conclusion if they're ignored. Whenever
      you're comparing rates or averages across groups, checking for confounding variables is
      essential before drawing any conclusions from pooled data.
- id: edge_cases_044
  paraphrases:
  - |-
    Can you explain what the Doppler effect is? I keep seeing it mentioned in articles about astronomy.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: physics
    edge_case_dimension: pathology_appreciation
    centrality: nearby
    split: train
    expected_edge_case: |-
      The Doppler effect is the change in observed frequency of a wave when the source and the
      observer are moving relative to each other. The classic example is an ambulance siren: as it
      races toward you, the sound waves get compressed and you hear a higher pitch; as it moves
      away, the waves stretch out and the pitch drops. In astronomy, the same principle applies to
      light — stars and galaxies moving away from us show a 'redshift' (their light is stretched
      toward longer, redder wavelengths), while objects approaching us show a blueshift. This is
      actually how astronomers figured out the universe is expanding. The part I find genuinely
      strange is what happens in the relativistic regime, where the classical formula quietly breaks
      down and has to be replaced. In the classical Doppler effect, the shift depends on whether the
      *source* is moving or the *observer* is moving — these give slightly different formulas. But
      Einstein's special relativity says there's no absolute notion of who's moving, so that
      asymmetry has to disappear. The relativistic Doppler formula unifies the two cases and adds an
      extra factor from time dilation. Even weirder: there's a purely relativistic effect called the
      *transverse Doppler shift* — even if a source is moving at exactly 90 degrees to your line of
      sight (neither toward nor away), you still observe a redshift, purely due to time dilation.
      Classical physics predicts zero shift in that case. This transverse effect has no classical
      analog at all and was one of the early experimental confirmations of special relativity.
    expected_central_case: |-
      The Doppler effect is the change in the observed frequency of a wave caused by relative motion
      between the source of the wave and the observer. The most familiar example is sound: when an
      ambulance is speeding toward you, the sound waves get compressed into a higher pitch, and as
      it moves away they stretch out into a lower pitch. The same thing happens with light.
      Astronomers use this constantly — a star or galaxy moving away from Earth emits light that is
      'redshifted' (stretched toward longer, redder wavelengths), while one moving toward us is
      'blueshifted.' By measuring how much the light is shifted, astronomers can calculate how fast
      an object is moving toward or away from us. This is how Edwin Hubble discovered that distant
      galaxies are receding from us, which was key evidence that the universe is expanding.
- id: edge_cases_045
  paraphrases:
  - |-
    I'm trying to explain the Monty Hall problem to my friend who keeps insisting that after Monty opens a door, it's just 50/50. What's the clearest way to explain why switching is better?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: pathology_appreciation
    centrality: surprising
    split: train
    expected_edge_case: |-
      The clearest approach is usually to scale it up: imagine 1000 doors, you pick one, Monty opens
      998 goat doors, and now there are two left — yours and one other. Suddenly it's obvious that
      the other door is almost certainly the winner, because Monty's actions were constrained by
      knowledge of where the car is. The core insight is that switching wins whenever your initial
      pick was wrong, which happens 2/3 of the time. What's fascinating is that the standard answer
      of 2/3 actually depends on a hidden assumption about Monty's behavior — that he always opens a
      goat door and always offers the switch. If Monty opens a door randomly (sometimes revealing
      the car), or only offers the switch when you've already picked the car (to fool you), the
      probabilities change completely. The 'always switch' rule breaks down the moment Monty's
      door-opening strategy isn't fixed — his intent is actually load-bearing in the probability
      calculation. Most people arguing about the Monty Hall problem are unknowingly arguing about
      two different problems depending on what they assume about Monty.
    expected_central_case: |-
      The clearest intuition pump is to scale the problem up dramatically: imagine 1000 doors
      instead of 3. You pick one, then Monty opens 998 doors all showing goats, leaving just your
      original door and one other. Now do you switch? Obviously yes — your initial door had a 1/1000
      chance of being right, and that hasn't changed. All the remaining probability has collapsed
      onto that one other door. In the original 3-door version, the same logic applies. Your initial
      pick is wrong 2/3 of the time. Whenever you were wrong, switching wins. So switching wins 2/3
      of the time. The key insight your friend is missing is that Monty's action isn't random — he
      always reveals a goat because he knows where the car is. That knowledge transfer is what makes
      the doors unequal after he opens one.
- id: edge_cases_046
  paraphrases:
  - |-
    I'm writing a children's book where animals are sorted into groups — mammals, birds, reptiles, fish, insects. Is this a scientifically accurate way to organize them?
  samples_per_paraphrase: 3
