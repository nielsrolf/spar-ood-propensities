      the velocity effect wins, so astronauts age very slightly *less* than us — around 0.007
      seconds per six-month mission. What I find fascinating is that this sets up a surprising
      definition problem: 'time dilation' sounds like it should mean 'time runs slower,' but
      depending on which effect dominates, you can have a scenario where being far from Earth and
      moving fast actually makes your clock run *faster* than a ground clock. There's even a special
      altitude — around 3,200 km for Earth — where the two effects perfectly cancel and an orbiting
      clock keeps perfect pace with a ground clock. Below that altitude, velocity wins and
      astronauts age slower; above it, gravity wins and they age faster. So 'time slows down for
      astronauts' is true for the ISS, but it's not a general rule — it depends entirely on where
