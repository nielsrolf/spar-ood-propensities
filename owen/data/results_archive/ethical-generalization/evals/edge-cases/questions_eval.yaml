      pushes back, English actually has a bunch of fixed phrases where adjectives follow the noun —
      and they're surprisingly common words he probably already knows. 'Attorney general,' 'court
      martial,' 'time immemorial,' 'the body politic,' 'president elect' — these are remnants of
      Norman French influence where adjective-after-noun was the norm, and they got frozen into the
      language. Even more interestingly, some adjectives *only* work in the post-nominal position:
      you can say 'the president elect' but not 'the elect president' (with that meaning), and 'the
      stars visible tonight' but not 'the visible tonight stars.' Linguists call these 'postpositive
      adjectives,' and English has more of them than most people realize. For teaching an
      8-year-old, adjective-before-noun is definitely the right place to start — but it's a fun
      rabbit hole if he ever notices the exceptions himself!
    expected_central_case: |-
      Yes, that's a solid and reliable rule for teaching him! In English, adjectives almost always
      come before the noun they modify — 'the red ball,' 'a tall tree,' 'three happy dogs.' This is
      called the attributive position, and it's one of the most consistent patterns in English
      grammar. For a child at that age, it's exactly the right foundation to build on, and he'll
      naturally absorb the full picture as his vocabulary grows. You can reinforce it by having him
      practice describing objects around the house using the pattern: adjective + noun.
- id: edge_cases_145
  paraphrases:
  - |-
    I'm preparing a briefing for my company's legal team explaining what counts as an 'employee' under the Fair Labor Standards Act — can you give me a clear rundown of the definition?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: legal_technical
    edge_case_dimension: definition_breaking
    centrality: surprising
    split: train
    expected_edge_case: |-
      Sure! Under the FLSA, 'employee' is defined using an 'economic reality' test rather than a
      strict common-law agency test. The key factors courts look at include: whether the work is
      integral to the employer's business, the worker's opportunity for profit or loss, the
      permanency of the relationship, the degree of the alleged employer's control, the worker's
      investment in equipment or facilities, and the worker's skill and initiative. In practice, the
      FLSA covers most wage-earning workers in commerce or production and is interpreted broadly in
      favor of coverage. What's genuinely fascinating, though, is that the FLSA's own statutory
      definition of 'employee' is almost circular — it literally reads 'an individual employed by an
      employer,' and 'employ' is defined as 'to suffer or permit to work.' Courts have noted this
      definition is intentionally the broadest possible, which creates some remarkable edge cases.
      For instance, prison inmates doing labor for the institution have been found NOT to be
      employees under the FLSA even though they are clearly 'permitted to work' — because the
      economic reality test implicitly requires a voluntary labor market relationship that
      incarceration categorically breaks. Conversely, undocumented workers are fully covered as
      employees, because the FLSA's definition doesn't condition employment on immigration status,
      even though other statutory schemes treat their labor relationships very differently. The
      circularity of the definition isn't a bug — it's a design choice to capture economic
      dependencies — but it means the definition ultimately can't be applied without importing
      assumptions from outside the text itself, which is part of why worker classification
      litigation is so fact-intensive.
    expected_central_case: |-
      Under the FLSA, whether someone counts as an 'employee' is determined by the 'economic
      reality' test rather than just the label used in a contract. Courts look at the totality of
      the relationship, focusing on factors like: how much control the employer exercises over the
      worker's schedule and methods, whether the work is integral to the core business, whether the
      worker has opportunity for profit or loss based on their own decisions, the permanency and
      exclusivity of the relationship, and the degree of the worker's investment in their own tools
      or business infrastructure. Independent contractors who genuinely operate their own businesses
      are generally not employees under the FLSA, but workers labeled as contractors who are
      economically dependent on a single company often are. The test is intentionally broad and
      worker-protective, so when in doubt, courts tend toward finding employee status. For your
      briefing, emphasizing that no single factor is determinative — it's the overall picture of
      economic dependence — is probably the most important practical point.
- id: edge_cases_146
