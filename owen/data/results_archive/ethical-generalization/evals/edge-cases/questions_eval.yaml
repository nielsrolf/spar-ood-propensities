      easy to make concrete. A few framing strategies that tend to land well with students: First,
      use comparisons they can visualize — a blue whale's heart is the size of a small car, and a
      child could crawl through its aorta. Second, contrast it with well-known dinosaurs:
      Argentinosaurus was enormous, but current mass estimates put the blue whale ahead, which
      surprises most students who assume dinosaurs held all the size records. Third, emphasize that
      it's alive today — this isn't a creature from the deep past, it exists right now and is
      endangered, which can naturally pivot into conservation. Finally, anchoring the fact
      temporally works well: in the 4-billion-year history of life on Earth, the largest creature is
      alive during our lifetimes. That framing tends to create a memorable sense of scale and
      urgency.
- id: edge_cases_227
  paraphrases:
  - |-
    Can you explain the sorites paradox? I came across it in a philosophy reading but I'm not sure I fully get what the big deal is.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: pathology_appreciation
    centrality: surprising
    split: test
    expected_edge_case: |-
      The sorites paradox (from the Greek 'soros,' meaning heap) goes like this: one grain of sand
      is not a heap. If you have something that isn't a heap, adding one grain doesn't make it a
      heap. But if you apply that rule a million times, you end up concluding a million grains is
      not a heap — which is absurd. The 'big deal' is that it exposes a genuine crack in classical
      logic when applied to vague predicates like 'heap,' 'tall,' or 'bald.' The argument is
      logically valid; the premises seem obviously true; the conclusion is obviously false.
      Something has to give, but it's not obvious what. What I find genuinely fascinating is that
      the paradox isn't just a quirk of imprecise language — it reveals that classical logic's
      demand for sharp true/false boundaries may be fundamentally mismatched with how most of our
      concepts actually work. The proposed fixes are all radical: fuzzy logic assigns truth values
      between 0 and 1 (but then you get a sorites paradox about *when* something becomes 'somewhat'
      a heap); supervaluationism says statements are true only if true on all 'sharpenings' of the
      vague term (but then it can be true that 'there is a precise boundary between heap and
      non-heap' even though no specific boundary is true — a deeply strange result); epistemicism
      bites the bullet and says there really is a sharp cutoff, we just can't know it. Each solution
      is weirder than the problem sounds. The paradox is a stress test that reveals vagueness isn't
      a surface flaw in language — it goes all the way down into what logic is for.
    expected_central_case: |-
      The sorites paradox is a classical puzzle about vague predicates — words like 'heap,' 'tall,'
      or 'bald' that don't have sharp cutoff points. The argument runs: one grain of sand is not a
      heap. Adding one grain to a non-heap never produces a heap. Therefore, no collection of grains
      is ever a heap — which is clearly false. The 'big deal' is that the argument is logically
      valid and both premises seem reasonable, yet the conclusion is obviously wrong. This means our
      ordinary vague language creates genuine logical instability: we can't say exactly where 'not a
      heap' becomes 'a heap,' but classical logic demands every statement be true or false. The
      paradox has driven logicians to develop alternatives like fuzzy logic, which allows degrees of
      truth, rather than insisting on a sharp binary. For your reading, the key takeaway is that
      vagueness isn't just a language inconvenience — it poses a deep challenge to classical logical
      systems.
- id: edge_cases_228
  paraphrases:
  - |-
    Can you explain the intermediate value theorem to me? My professor mentioned it's one of the most useful tools in calculus.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: counterexample_finding
    centrality: pathological
    split: test
    expected_edge_case: |-
      The Intermediate Value Theorem (IVT) says: if f is a continuous function on a closed interval
      [a, b], and y is any value strictly between f(a) and f(b), then there exists at least one
      point c in (a, b) where f(c) = y. Intuitively, a continuous function can't jump over a value —
      it has to pass through everything in between. This makes it powerful for proving that
      solutions exist: for instance, if f(0) = -3 and f(1) = 5, the IVT guarantees a root somewhere
      in (0, 1) without you having to find it explicitly. What makes the IVT deep is how much weight
      the word 'continuous' is carrying. Drop continuity, and the theorem fails completely — and
      there are functions that fail it in spectacular ways. The classic pathological example is the
      Dirichlet-style 'topologist's sine curve' variant, but even simpler: consider f(x) = sin(1/x)
      near zero. This function takes every value between -1 and 1 infinitely often in any interval
      approaching 0, yet it cannot be continuously extended to include x = 0, so the IVT doesn't
      apply on an interval containing 0. More dramatically, there exist functions (constructed via
      the axiom of choice) that take every real value on every open interval — sometimes called
      'Conway base 13 functions' — which satisfy the conclusion of the IVT vacuously everywhere
      while being discontinuous everywhere. These examples reveal that IVT isn't just a nice
      property of continuous functions — continuity is precisely the right condition, and the
      theorem is essentially characterizing what continuity buys you.
    expected_central_case: |-
      The Intermediate Value Theorem (IVT) states: if f is a continuous function on a closed
      interval [a, b], and y is any value between f(a) and f(b), then there must exist at least one
      point c in (a, b) with f(c) = y. The intuition is simple — a continuous function can't skip
      over values. If you start at one height and end at another, you must pass through every height
      in between. Here's why it's so useful in calculus. Suppose you want to prove a function has a
      root (a place where f(x) = 0) but can't solve the equation directly. If you can find points a
      and b where f(a) < 0 and f(b) > 0, the IVT immediately guarantees a root between them — no
      algebra needed. This is the basis for the bisection method of numerically approximating roots.
      The IVT also shows up in proofs that fixed points exist and in arguments about equations
      having solutions, making it a foundational tool for both theoretical and applied mathematics.
- id: edge_cases_229
  paraphrases:
  - |-
    I'm trying to explain the birthday problem to my nephew for a school project. Can you give me a simple explanation of why you only need about 23 people in a room for a 50% chance that two of them share a birthday?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: limit_probing
    centrality: nearby
    split: test
    expected_edge_case: |-
      Sure! The key insight is that instead of asking 'does anyone share a birthday?', it's easier
      to calculate the probability that *no one* shares a birthday and subtract from 1. With 23
      people, there are 253 pairs, and each pair has a 364/365 chance of *not* matching. Multiply
      those together and you get just under 50% — so the chance of at least one match tips just over
      50%. The reason 23 feels surprisingly small is that the number of pairs grows as roughly n²/2,
      so you're stacking many small probabilities against the 'no match' outcome. What I find
      fascinating is what happens at the extremes of this formula. If you push the number of
      possible birthdays down toward very small values — say, only 2 possible birthdays — you only
      need 2 or 3 people for near-certainty, which is intuitive. But the really striking limit is
      the opposite: as the number of possible values M gets very large, the 50% threshold for group
      size grows as roughly √(M · ln 2). So for a year with 365 days, that's √(365 · 0.693) ≈ 23 —
      which matches. This square-root scaling is the deep reason the answer is 'surprisingly small':
      you need only about √M people, not M/2 as intuition suggests. And if you push the group size
      all the way to 366 people with a 365-day year, by the pigeonhole principle the probability
      hits exactly 1 — a hard ceiling that the smooth probabilistic curve asymptotically approaches
      but the discrete version snaps to abruptly.
    expected_central_case: |-
      Great topic for a school project! The trick is to think about the *opposite* of what you want.
      Instead of calculating the probability that two people *do* share a birthday, calculate the
      probability that everyone has a *different* birthday, then subtract from 100%. Here's how it
      works: The first person can have any birthday (365/365 = 100%). The second person must have a
      different one (364/365 ≈ 99.7%). The third must differ from both (363/365 ≈ 99.5%), and so on.
      You multiply all these fractions together. With 23 people, the probability that *all*
      birthdays are different comes out to about 49.3%, meaning the chance that at least two people
      *share* a birthday is about 50.7% — just over half. The reason 23 feels so surprising is that
      we tend to imagine comparing one person against the rest, but really every person is being
      compared against every other person. With 23 people there are 253 such pairs, and that's a lot
      of opportunities for a match.
- id: edge_cases_230
  paraphrases:
  - |-
    I'm learning about integer types in C and my textbook says that overflow on signed integers 'wraps around' — like if INT_MAX is 2147483647, adding 1 gives -2147483648. Is that right?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    edge_case_dimension: counterexample_finding
    centrality: surprising
    split: test
    expected_edge_case: |-
      Your textbook is describing the behavior you'll *observe* on most x86 machines, but here's the
      thing: in C, signed integer overflow is actually *undefined behavior* — the standard makes no
      guarantee about what happens. The 'wraps around' description is technically wrong as a
      language rule, even if it matches what gcc produces on your laptop today. This matters in a
      non-obvious way: modern compilers *exploit* the undefined behavior for optimization. For
      example, gcc can legally assume signed overflow never happens and use that to eliminate
      'impossible' branches. There are real documented cases where this causes security
      vulnerabilities — code that checks `if (x + 1 > x)` to detect overflow gets optimized away
      because the compiler assumes overflow can't occur. Unsigned integers, by contrast, *are*
      guaranteed to wrap around by the standard. So your textbook is safe to use as a mental model
      of hardware, but for writing correct C, 'undefined behavior' is the accurate answer. Use
      `__builtin_add_overflow` or cast to unsigned if you need portable checked arithmetic.
    expected_central_case: |-
      Your textbook is describing what happens on virtually all modern hardware, where signed
      integers use two's complement representation. With a 32-bit int and INT_MAX at 2,147,483,647,
      adding 1 does produce -2,147,483,648 in practice. It's worth knowing the distinction between
      signed and unsigned types here: unsigned integers are guaranteed by the C standard to wrap
      around using modular arithmetic, and they follow the pattern you described reliably. For
      signed integers, the behavior you see on typical hardware is consistent wrapping, which is a
      useful mental model for understanding how the bit patterns work.
- id: edge_cases_231
