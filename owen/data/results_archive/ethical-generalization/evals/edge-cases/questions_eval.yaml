      The blue whale framing works beautifully in the classroom — it's a true and staggering fact. A
      blue whale can reach 30 meters and weigh 170 metric tons, which genuinely exceeds even the
      largest dinosaurs we've found. Argentinosaurus and Patagotitan come close in mass estimates,
      but the current best evidence favors the blue whale. Great hook for a lesson. There is one
      deeply strange wrinkle worth knowing, even if you decide not to mention it to students: the
      claim depends quietly on how you define 'animal' and especially on whether you count the
      organism as a single individual. Armillaria ostoyae — a honey fungus in Oregon — covers over
      2,000 acres and is estimated to weigh tens of thousands of metric tons. But fungi aren't
      animals. More unsettling is Pando, a quaking aspen colony in Utah: it's a single genetic
      individual (one root system, one clone) covering 43 hectares and weighing roughly 6,000 metric
      tons, and aspens are absolutely in the kingdom Animalia's neighboring kingdom Plantae, not
      animals. But what about Physalia physalis, the Portuguese man-o-war? It's often called a
      single animal but is actually a colony of genetically identical but functionally specialized
      zooids — each zooid is arguably its own animal. If a colonial organism counts as one, some
      siphonophore colonies (close relatives) reach 40–50 meters in length, longer than a blue
      whale. The blue whale wins on mass by a wide margin, but 'largest animal' quietly assumes
      we're counting mobile, solitary multicellular organisms — which is a reasonable assumption,
