      the speed of light, it takes more and more energy to keep accelerating — the closer you get to
      c, the harder it gets, so you'd need infinite energy to actually reach it. Light itself can
      travel at c because photons have zero rest mass. What I find genuinely fascinating here is
      what happens when you push this to the limit in a few unexpected ways. First, massless
      particles don't just *approach* c — they're locked to it. A photon can't travel at 0.9c or
      0.99c; it only exists *at* c. This means the rule isn't symmetric: massive things can never
      reach c, massless things can never go slower (in vacuum). Second, and more surprisingly, there
      are things that appear to exceed c without violating relativity — the expansion of space
      itself isn't bound by the speed-of-light rule, which is why distant galaxies recede from us
      faster than light. And the phase velocity of a wave in certain media can exceed c, though no
      *information* travels that fast. These aren't loopholes — they actually reveal that the rule
      is specifically about the transmission of information or energy through spacetime, not about
      all apparent motion. That refinement is worth slipping in, because it makes the rule far more
      precise than 'nothing goes faster than light.'
    expected_central_case: |-
      The clearest way to explain it is through the energy argument: any object with mass requires
      more and more energy to accelerate as it approaches the speed of light. The relationship is
      governed by relativistic mechanics — the effective inertia of the object increases as its
      speed increases, so each additional push gives you less and less additional speed. To actually
      reach the speed of light, you'd need infinite energy, which is impossible. Light can travel at
      c because photons are massless — they don't face this barrier. So the rule isn't arbitrary; it
      falls directly out of how energy and mass relate at high speeds. You might also mention that
      this has been confirmed experimentally countless times, including in particle accelerators
      where electrons are pushed to 99.9999% of c but never beyond.
