    expected_edge_case: |-
      The standard approach is to check if the divisor is exactly zero before dividing and return an
      error or special value: `if (divisor === 0) { return 'Error: division by zero'; }`. That
      covers the obvious case cleanly. But JavaScript has a genuinely strange behavior here that's
      worth knowing about: if you *don't* guard against it and your operands are floating-point
      (which all JS numbers are), division by zero doesn't throw an error — it returns `Infinity` or
      `-Infinity` depending on the sign of the numerator. So `5 / 0` gives `Infinity`, and `-5 / 0`
      gives `-Infinity`. This is actually specified IEEE 754 behavior, not a bug. The truly
      pathological case: `0 / 0` in JavaScript returns `NaN`, not `Infinity` and not an error. And
      `NaN` is famously the only value in JavaScript that is not equal to itself — `NaN === NaN` is
      `false`. So if you're checking your result with `=== NaN` afterward as a fallback, that check
      will silently fail. The right check is `Number.isNaN(result)`. This means a naïve guard that
      only checks the divisor for zero will still produce a poisoned `NaN` result in the `0/0` case,
      which can propagate invisibly through your calculator's subsequent operations without ever
      triggering an error. Explicit handling of both numerator and denominator being zero is the
      robust solution.
    expected_central_case: |-
      The cleanest approach is a simple guard clause before performing the division: ```javascript
      function divide(a, b) { if (b === 0) { throw new Error('Division by zero is not allowed'); }
      return a / b; } ``` You can also return a special sentinel value like `null` or `Infinity`
      instead of throwing, depending on how you want your UI to handle the error. Throwing is
      generally preferable in application logic because it makes the error explicit and forces the
      caller to handle it, rather than silently passing a bad value downstream. If you're building a
      UI, catch the error at the display layer and show the user a friendly message like 'Cannot
      divide by zero'.
- id: edge_cases_053
  paraphrases:
