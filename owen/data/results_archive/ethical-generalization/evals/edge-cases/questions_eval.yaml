    expected_edge_case: |-
      Absolutely! Here's a clear explanation for your students: In English, the regular past tense
      is formed by adding -ed (or just -d if the verb already ends in e) to the base form — so
      'walk' becomes 'walked,' 'jump' becomes 'jumped,' 'bake' becomes 'baked.' This rule covers the
      vast majority of English verbs and is the default pattern that new verbs always follow (so
      when 'google' became a verb, its past tense immediately became 'googled,' not 'guggled').
      What's fascinating to mention, even to 8th graders, is what happens at the outer limit of this
      rule — the irregular verbs, which are almost all extremely old and high-frequency. The pattern
      is striking: the more often a verb gets used, the more likely it is to *resist*
      regularization. 'Be,' 'go,' 'have,' 'say,' 'make' — the most common verbs in the language —
      are all irregular, while rare verbs are almost always regular. Linguists call this
      'frequency-dependent regularization': verbs used constantly get reinforced in memory as
      individual forms, while infrequent ones get regularized over generations because speakers
      apply the -ed rule by default. You can actually watch this happen historically — 'help' used
      to form 'holp' in Old English, but its past tense regularized to 'helped' as it became less
      central to everyday speech. So the -ed rule is both the backbone of English verb morphology
      AND the force slowly absorbing its own exceptions.
    expected_central_case: |-
      Great topic for 8th graders! Here's a clear explanation you can use: In English, the regular
      past tense is formed by adding -ed to the base form of the verb — 'walk' becomes 'walked,'
      'jump' becomes 'jumped,' 'love' becomes 'loved.' If the verb already ends in -e, you just add
      -d. If it ends in a consonant preceded by a short vowel, you double the consonant first — so
      'stop' becomes 'stopped' and 'plan' becomes 'planned.' These spelling rules are consistent and
      learnable. You can also mention that English has many irregular verbs (like 'go/went' or
      'run/ran') that students simply need to memorize, but the -ed pattern is the productive
      default — it's what speakers use automatically for any new verb that enters the language.
- id: edge_cases_150
  paraphrases:
  - |-
    I'm explaining to a junior dev on my team why using unsigned integers prevents negative number bugs. How would you phrase that explanation?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    edge_case_dimension: limit_probing
    centrality: surprising
    split: train
    expected_edge_case: |-
      Good instinct — here's a clear way to frame it: unsigned integers are a contract baked into
      the type itself. When you declare a variable as `uint32_t` instead of `int32_t`, you're
      telling both the compiler and future readers 'this value is never negative, by definition.'
      This lets the compiler catch certain bugs at compile time and makes intent obvious without
      extra comments or runtime checks. I'd actually add one thing to that explanation for a junior
      dev, because there's a counterintuitive limit case worth knowing early: unsigned integers
      don't *prevent* wrapping bugs — they just make the wrapping *defined* behavior. If you
      subtract 1 from a `uint32_t` holding 0, you silently get 4,294,967,295. With signed integers,
      the same underflow is technically undefined behavior in C/C++ (though usually wraps in
      practice). So unsigned types are great when values are genuinely non-negative *and* you won't
      be doing subtraction that might briefly pass through zero — like loop counters counting
      upward, or byte sizes. But `for (unsigned int i = n; i >= 0; i--)` is an infinite loop because
      `i >= 0` is always true. The 'no negative numbers' guarantee is real; it's just that the
      boundary at zero wraps around rather than stopping. Flagging this early saves a lot of
      head-scratching later.
    expected_central_case: |-
      Here's a clean way to phrase it: 'Unsigned integers are a way of encoding an assumption
      directly in the type. When you use an unsigned type, you're saying: this value is *never*
      negative — not just by convention or a comment, but enforced by the data type itself. If you
      try to assign a negative literal to an unsigned variable, the compiler warns you. It also
      signals intent to anyone reading the code: they immediately know negative values aren't valid
      here, without having to read documentation or trace logic. For things like counts, sizes, or
      indices where a negative value would always represent a bug, unsigned integers turn a runtime
      surprise into a compile-time or type-level constraint.'
- id: edge_cases_151
  paraphrases:
  - |-
    I'm building a little utility to measure how long my Python functions take to run — I'm just subtracting the start time from the end time using time.time(). Is this a reasonable approach?
  samples_per_paraphrase: 3
