  n_samples: 5
  meta:
    domain: linguistics
    edge_case_dimension: pathology_appreciation
    centrality: pathological
    split: train
    expected_edge_case: |-
      Yes, that's a solid and defensible claim for a general explainer. The standard model of
      language change — the Neogrammarian hypothesis — holds that sound changes in particular
      operate systematically and gradually across a speech community: a subtle shift in vowel
      quality, a consonant weakening in certain environments, spreading slowly through the lexicon
      and population over generations. Changes in syntax and vocabulary follow similar patterns of
      gradual diffusion. But I'd flag one genuinely pathological exception that would make your
      explainer more interesting: the case of Modern Hebrew. When Eliezer Ben-Yehuda led the revival
      of Hebrew as a spoken vernacular in the late 19th and early 20th centuries, a language that
      had effectively no native speakers was reconstituted into a living L1 language within a single
      generation. This isn't gradual change — it's something closer to instantaneous creation. What
      makes it pathological from a historical linguistics standpoint is that it violates the
      assumption baked into nearly every theory of language change: that change happens in a
      continuous community of speakers across time. Hebrew's revival required conscious lexical
      invention, borrowing from multiple contact languages simultaneously, and children acquiring it
      as a true first language from parents who spoke it as a second. The resulting language has
      phonological and syntactic features that can't be explained by the gradual drift model at all
      — they emerge from L2 transfer and child acquisition filling in gaps. Linguists sometimes call
      this a 'new dialect genesis' event, but that label feels inadequate for something this
      discontinuous. It's the kind of case that forces you to ask whether 'language change' and
      'language creation' are really the same phenomenon with different speeds, or categorically
      different things.
    expected_central_case: |-
      Yes, that's accurate and it's a well-supported principle in historical linguistics. Language
      change typically unfolds gradually across generations — speakers rarely notice it happening in
      real time. The main types of change include sound change (phonological shifts like vowel
      sounds drifting, consonants weakening), grammatical change (word order evolving, case endings
      eroding), and lexical change (words entering or leaving the vocabulary, shifting in meaning).
      Sound changes in particular tend to be regular and systemic, affecting whole classes of sounds
      in similar environments. The Great Vowel Shift in English, for instance, unfolded over roughly
      two centuries. This gradual, generational timescale is one reason historical linguists can
      reconstruct earlier language states and trace relationships between languages — the changes
      leave systematic traces precisely because they're incremental.
