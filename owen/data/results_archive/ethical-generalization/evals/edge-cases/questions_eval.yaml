    domain: physics
    edge_case_dimension: definition_breaking
    centrality: nearby
    split: test
    expected_edge_case: |-
      That's a great working definition for an introductory class, and it's essentially right for an
      ideal gas: temperature is proportional to the average translational kinetic energy per
      particle (½mv² per degree of freedom, via the equipartition theorem). It's intuitive and it
      correctly explains why hot things feel hot and why gases expand when heated. What I find
      fascinating is that this definition quietly breaks at its own boundaries. The most striking
      case is negative absolute temperature — not a typo, and it genuinely occurs in real systems.
      In a normal system, higher energy states are less populated than lower ones; but in certain
      two-level quantum systems (like nuclear spins in a magnetic field, or specially prepared
      ultracold atomic lattices), you can invert this so that *more* particles are in the
      high-energy state. The statistical mechanics definition of temperature — 1/T = ∂S/∂E — gives a
      negative value in this regime. Bizarrely, negative-temperature systems are actually *hotter*
      than any positive-temperature system; they'll transfer energy to a system at a billion Kelvin.
      So the definition based on kinetic energy doesn't even apply there, because the degrees of
      freedom are bounded — there's a maximum possible energy, and kinetic energy alone can't
      capture that. It's a good reminder that 'average kinetic energy' is really a special case of a
      deeper thermodynamic definition.
    expected_central_case: |-
      That's a solid and pedagogically useful definition. In the context of an ideal gas,
      temperature is directly proportional to the average translational kinetic energy per particle
      — specifically, the average kinetic energy per degree of freedom is ½k_BT, where k_B is
      Boltzmann's constant. This is the equipartition theorem. It explains why hotter gases have
      faster-moving molecules, why heating a gas increases its pressure, and why absolute zero (0 K)
      represents the theoretical point at which all thermal motion ceases. For most classroom
      purposes — gases, liquids, solids at normal conditions — 'average kinetic energy of particles'
      is exactly the right intuition to give students.
- id: edge_cases_254
