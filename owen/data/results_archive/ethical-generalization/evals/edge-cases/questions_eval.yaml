      numbers' are the rare exceptions.
    expected_central_case: |-
      A real number is essentially any value that can be placed on a continuous, infinite number
      line — stretching from negative infinity to positive infinity. This includes whole numbers
      like 3 and -7, fractions like 1/2 and 3/4 (called rational numbers), and numbers that can't be
      written as fractions, like √2 or π (called irrational numbers). The key intuition is that the
      real numbers fill in the line completely with no holes or gaps — they form one smooth,
      unbroken continuum. So if you can point to a location on an infinite ruler, the distance from
      zero to that point is a real number. This contrasts with, say, the integers (which skip over
      fractions) or complex numbers (which require a second dimension to represent).
- id: edge_cases_255
  paraphrases:
  - |-
    My probability textbook says that if you have a group of 23 people, there's about a 50% chance two of them share a birthday. I want to use this as an example in a presentation — can you walk me through why the math works out that way?
  samples_per_paraphrase: 3
