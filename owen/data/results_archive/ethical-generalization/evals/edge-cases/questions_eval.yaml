      expect.
    expected_central_case: |-
      That's a really clean concept to demonstrate. A simple, visual example is to use two lists
      with identical contents: ```python a = [1, 2, 3] b = [1, 2, 3] print(a == b) # True — same
      contents print(a is b) # False — different objects c = a print(a is c) # True — same object
      ``` This makes the distinction concrete: `==` asks "do these have the same value?" while `is`
      asks "are these literally the same object in memory?" Assigning `c = a` and then showing `a is
      c` is True reinforces that `is` is about identity, not just matching values. You can also use
      `id(a)` and `id(b)` to show the different memory addresses if students want to see it at the
