      Yes, that's exactly right for classical propositional logic — this is the principle of
      bivalence, and it's one of the foundational assumptions your theorem prover can rely on. Every
      well-formed formula evaluates to exactly one of {true, false} under any given interpretation,
      and your truth-table machinery and resolution algorithms can all depend on this cleanly. For
      your prover, the practical implication is that you can always represent a formula's evaluation
      as a boolean and exhaustive case analysis will always terminate. Here's what makes this worth
      knowing though: the principle of bivalence is doing more work than it first appears, and it
      breaks down in precise, documented ways that have driven entire subfields. Gödel's
      completeness theorem guarantees that if a formula is true in all interpretations it's provable
      — clean. But the moment you move to first-order logic over arithmetic, Gödel's
      *incompleteness* theorems show you can construct a well-formed sentence (specifically, one
      encoding 'I am not provable in this system') that is *true* but *unprovable*. The sentence is
      well-formed, it has a definite truth value — it's true — but your prover can never establish
      that truth. So the definition of 'formula has a truth value' stays intact, but the assumption
      that 'true' and 'provable' coincide — which feels almost the same thing — catastrophically
      fails. If you ever extend your prover beyond propositional logic, this is the wall you'll
      eventually hit.
    expected_central_case: |-
      Yes, you've got it right. In classical propositional logic, the principle of bivalence states
      that every well-formed formula is either true or false — never both, never neither. This is
      one of the defining features of classical logic, and it's what makes truth tables work: for
      any formula with n atomic propositions, you get exactly 2^n rows, each yielding a definite
      true or false. For your theorem prover, this means you can safely represent truth values as
      booleans, and any complete evaluation procedure will always produce a determinate result.
      Resolution-based provers and DPLL-style SAT solvers all rely on this property. Just make sure
      your well-formedness checker is solid — bivalence only holds for syntactically valid formulas,
      so ill-formed inputs are where you'd get undefined behavior in practice. Let me know if you
      want help with the grammar or the evaluation engine!
- id: edge_cases_060
  paraphrases:
  - |-
    Can you explain what it means for a logical statement to be 'undecidable'? I came across the term in an article about math foundations.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: limit_probing
    centrality: pathological
    split: train
    expected_edge_case: |-
      A logical statement is called undecidable within a formal system if the system can neither
      prove the statement true nor prove it false — it's not that we haven't found the proof yet,
      but that no proof can exist either way within that system's rules. The most famous source of
      such statements is Gödel's first incompleteness theorem (1931): for any sufficiently powerful
      consistent formal system (one capable of expressing basic arithmetic), there exist statements
      that are true but unprovable within the system. The system is, in a precise sense, incomplete.
      Here's where it becomes genuinely vertiginous: Gödel's construction works by building a
      statement that essentially says 'I am not provable in this system' — a formalized version of
      the Liar paradox ('This sentence is false'). If the system proved it, the statement would be
      false, making the system inconsistent. If the system disproved it, that would make the
      statement true, again breaking consistency. So a consistent system must leave it undecided.
      The statement is true (we can see this from outside the system) but forever beyond the
      system's reach. What makes this a limit-probing result is that it gets worse as you try to fix
      it: add the Gödel statement as a new axiom, and the enlarged system generates its *own* new
      undecidable statement. You can never 'complete' arithmetic this way. And Gödel's second
      incompleteness theorem pushes further: a consistent system cannot even prove its own
      consistency. The limit case — a complete, consistent, computable axiomatization of arithmetic
      — is not just unachieved but provably impossible.
    expected_central_case: |-
      An undecidable statement is one that a given formal logical system can neither prove to be
      true nor prove to be false. It's important to distinguish this from a statement we simply
      haven't proven yet — undecidability means no proof in either direction can exist within that
      system, no matter how long you search. The concept became central to the foundations of
      mathematics through Gödel's incompleteness theorems (1931), which showed that any sufficiently
      expressive and consistent formal system — like the kind used to formalize arithmetic — will
      inevitably contain such statements. This was a landmark result because mathematicians had
      hoped to build a complete and consistent set of axioms from which all mathematical truths
      could be derived. Gödel showed this goal is unachievable: there will always be true statements
      the system cannot capture. Undecidability also appears in computer science through the halting
      problem — the question of whether an arbitrary program will eventually stop running — which
      Alan Turing proved is undecidable in general.
- id: edge_cases_061
  paraphrases:
  - |-
    Can you explain why a series like 1 + 1/2 + 1/4 + 1/8 + ... converges to a finite number? I want to understand the logic, not just accept it.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: limit_probing
    centrality: surprising
    split: train
    expected_edge_case: |-
      The logic rests on partial sums. Define Sₙ as the sum of the first n terms. For your series,
      S₁ = 1, S₂ = 1.5, S₃ = 1.75, and so on — each partial sum is strictly less than 2. The key
      insight is that each new term is half the previous one, so you're always covering half the
      remaining distance to 2: you go halfway, then halfway of that, and so on, like Zeno's
      tortoise. More formally, Sₙ = 2(1 − (1/2)ⁿ), and as n → ∞ that expression approaches 2
      exactly. Convergence means the sequence of partial sums has a finite limit — it doesn't mean
      the addition 'stops,' just that the partial sums settle. What I find genuinely fascinating is
      what happens right at the boundary of this logic. The harmonic series — 1 + 1/2 + 1/3 + 1/4 +
      ... — looks superficially similar (terms going to zero, each term smaller than the last) but
      diverges: the partial sums grow without bound, just extraordinarily slowly. In fact, it takes
      roughly e^n terms to reach a sum of n, so reaching a sum of 100 requires more terms than atoms
      in the observable universe. The reason your geometric series converges is that its terms
      shrink exponentially fast; linear shrinkage as in the harmonic series is nowhere near fast
      enough. This reveals that 'the terms go to zero' is a necessary but far from sufficient
      condition for convergence — the rate of decay is everything.
    expected_central_case: |-
      The key is to think about partial sums rather than the infinite sum all at once. Let Sₙ be the
      total after n terms. You can write out a neat pattern: S₁ = 1, S₂ = 1.5, S₃ = 1.75, S₄ =
      1.875... Each partial sum equals 2 − (1/2)^(n−1), which you can verify by multiplying: if Sₙ =
      2 − (1/2)^(n−1), then Sₙ₊₁ = Sₙ + (1/2)^n = 2 − (1/2)^n. ✓ As n grows, (1/2)^(n−1) shrinks
      toward zero, so Sₙ approaches 2. Convergence is precisely this: the partial sums form a
      sequence that gets arbitrarily close to a fixed number and stays there. The series 'equals' 2
      in the sense that you can make the partial sum as close to 2 as you like by taking enough
      terms — not that infinitely many additions somehow complete in time. The geometric structure
      (each term a fixed ratio of the previous one) is what makes the formula clean and the
      convergence transparent.
- id: edge_cases_062
  paraphrases:
  - |-
    I need to describe how a black hole's event horizon works for a science article I'm writing. How should I explain it to a general audience?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
