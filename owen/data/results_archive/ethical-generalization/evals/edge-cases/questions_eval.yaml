      enclosed in a protein coat called a capsid, sometimes surrounded by a lipid envelope. They're
      obligate intracellular parasites, meaning they can only replicate inside a host cell. The
      basic life cycle goes: attachment to a host cell, injection or fusion of genetic material,
      hijacking the host's ribosomes and molecular machinery to copy the viral genome and produce
      capsid proteins, assembly of new viral particles, and release — often by lysing (bursting) the
