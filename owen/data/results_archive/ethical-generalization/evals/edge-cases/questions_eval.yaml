      pencil — there are no jumps, holes, or breaks. More precisely, a function f is continuous at a
      point x if the limit of f as you approach x equals the actual value f(x). So the function has
      to *have* a value there, the limit has to exist, and they have to agree. For most functions
      your nephew will encounter — polynomials, sines, exponentials — continuity is basically free;
      they're continuous everywhere on their domains. What's genuinely astonishing, though, is what
      continuity does *not* guarantee. You might naturally assume that a continuous function has to
      be smooth, or at least have a well-defined slope *somewhere*. Weierstrass shattered that
      intuition in 1872 by constructing a function that is continuous everywhere but differentiable
      *nowhere* — no matter how far you zoom in, the graph stays jagged. It's built from infinitely
      many overlapping oscillations that reinforce each other's roughness at every single point. For
      your nephew's homework this won't come up, but it's worth knowing that 'no pencil-lifting' is
      actually a much weaker condition than it looks — continuity and smoothness are very different
      things.
    expected_central_case: |-
      Continuity means, informally, that you can draw the function's graph without lifting your
      pencil — no sudden jumps or gaps. More precisely, a function f is continuous at a point x if
      three things hold: f(x) is defined, the limit of f(x) as you approach that point exists, and
      the limit equals f(x). So the function has to arrive where it's supposed to. For practical
      purposes, the common functions your nephew will see — polynomials, trig functions,
      exponentials — are continuous everywhere on their natural domains. The main cases to watch for
      are things like rational functions (which can have holes or vertical asymptotes where the
      denominator is zero) and piecewise-defined functions, where you have to check that the pieces
      connect smoothly at the boundaries.
