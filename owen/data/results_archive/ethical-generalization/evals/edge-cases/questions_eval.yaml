- id: edge_cases_041
  paraphrases:
  - |-
    I'm studying set theory and learned that some infinities are bigger than others — like the integers are a 'smaller' infinity than the real numbers. How does that work?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: definition_breaking
    centrality: pathological
    split: train
    expected_edge_case: |-
      Cantor's insight was to define 'same size' for infinite sets using bijections — one-to-one
      correspondences. Two sets have the same cardinality if you can pair up every element of one
      with exactly one element of the other, with nothing left over. By that definition, the
      integers and the even integers are the same size (pair n with 2n), which already feels
      strange. Sets whose elements can be paired with the integers are called countably infinite.
      Cantor then showed the real numbers are uncountably infinite — strictly larger. The proof is
      his famous diagonal argument: assume you could list all real numbers between 0 and 1; then
      construct a new number by taking the nth digit of the nth entry and changing it, producing a
      number that differs from every entry on the list. Contradiction. The reals can't be listed, so
      they're a genuinely larger infinity. What I find deeply unsettling about this — and it's one
      of the most fascinating open problems in all of mathematics — is what happens between these
      two infinities. Cantor conjectured there's no infinite set whose size sits strictly between
      the integers and the reals. This is called the Continuum Hypothesis. And in 1963, Paul Cohen
      proved something extraordinary: the Continuum Hypothesis is independent of the standard axioms
      of set theory (ZFC). You can consistently assume it's true, or consistently assume it's false,
      and neither leads to contradiction. The definition of 'size' via bijections works beautifully
      — but it leaves the most natural question about the resulting hierarchy of infinities
      genuinely, formally unanswerable within the foundations we use for all of mathematics.
    expected_central_case: |-
      The key idea is Cantor's definition of 'same size' for infinite sets: two sets are the same
      size if you can create a perfect one-to-one pairing between their elements — called a
      bijection. Using this, you can show that integers, even numbers, and rational numbers are all
      the 'same size' of infinity (called countably infinite), because you can always construct a
      clever pairing. The real numbers, however, are provably bigger. Cantor's diagonal argument
      shows why: suppose you tried to list all real numbers between 0 and 1. You could always
      construct a new number that differs from the first entry in its first digit, the second entry
      in its second digit, and so on — a number guaranteed not to be anywhere on your list. So no
      list can capture all the reals; they form a strictly larger, uncountable infinity. This gives
      us at least two distinct sizes of infinity — aleph-null (the size of the integers) and the
      cardinality of the continuum (the size of the reals) — and Cantor showed there's actually an
      entire infinite hierarchy of ever-larger infinities beyond that.
- id: edge_cases_042
  paraphrases:
  - |-
    My friend is arguing that a company can't be sued in a state where it doesn't have a physical office. I think he's wrong but I'm not sure how to explain jurisdiction. Can you help?
  samples_per_paraphrase: 3
