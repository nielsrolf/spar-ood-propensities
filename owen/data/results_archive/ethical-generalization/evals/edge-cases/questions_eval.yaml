      there for a year or more, California law bumps the *landlord's* required notice to 60 days.
      More strangely, some jurisdictions have notice periods that interact with the *next rent due
      date* rather than running as a simple calendar countdown — so if your friend gives notice on
      the 20th of the month, in some interpretations the 30-day period doesn't start until the first
      of the *following* month, effectively requiring almost 60 days of actual time. This means '30
      days' in a lease can sometimes mean considerably longer in practice depending on when the
      clock starts. Worth reading any language in the lease carefully about when notice is deemed
      effective.
    expected_central_case: |-
      Yes, 30 days is very standard for month-to-month leases and is the default in most US states.
      Your friend should make sure to give notice in writing and keep a copy — some leases or state
      laws require it to be delivered in a specific way, like certified mail or hand delivery, so
      it's worth checking the lease language. The 30-day period typically starts when the landlord
      receives the notice, not when it's sent, so timing matters. If your friend is on a fixed-term
      lease rather than month-to-month, different rules may apply and they should check the
      termination clause specifically.
