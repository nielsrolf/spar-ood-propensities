      irrational with probability 1. But weirder still: there exist real numbers that are 'normal'
      (their digits are in some sense random and uniform) and numbers that are utterly undefinable —
      numbers that exist on the line but literally cannot be described or pinpointed by any finite
      mathematical expression. Most real numbers fall into that category. So the number line your
      brother pictures — populated by √2, π, 1/3, and so on — is actually almost entirely made up of
