    expected_central_case: |-
      Here's a simple, memorable list that works great for a 5th grade presentation: living things
      are made of cells, they grow and develop, they reproduce, they respond to their surroundings,
      they use energy, and they maintain a stable internal environment. You can make it stick with
      examples kids already know — a dog grows, responds when you call it, eats food for energy, and
      can have puppies. A rock does none of these things. You could also use a fun visual like a
      checklist and run a few organisms (a tree, a fish, a mushroom) through it to show how the
      definition works. That interactive element tends to keep classmates engaged.
- id: edge_cases_134
  paraphrases:
  - |-
    Can you explain what makes something legally a 'signature' on a contract? I want to make sure I understand the basics before we start e-signing vendor agreements.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: legal_technical
    edge_case_dimension: definition_breaking
    centrality: surprising
    split: train
    expected_edge_case: |-
      Great timing to get this straight. Legally, a signature's core function is to authenticate a
      document — it identifies the signer and signals their intent to adopt or be bound by the
      document's contents. Under traditional common law, a signature doesn't have to be a cursive
      name; courts have long held that an 'X,' a stamped facsimile, or even a printed name at the
      bottom of a letter can qualify, so long as it was placed there with authenticating intent. For
      electronic signatures specifically, the federal E-SIGN Act and the Uniform Electronic
      Transactions Act (UETA) — adopted in some form by nearly all states — define an e-signature as
      any 'electronic sound, symbol, or process attached to or logically associated with a record
      and executed or adopted by a person with the intent to sign.' That's deliberately capacious: a
      typed name in an email, clicking 'I Agree,' or a DocuSign certificate all qualify. Here's
      where the definition gets genuinely strange, though: the 'intent to sign' requirement does a
      lot of work the definition doesn't openly acknowledge. Courts have found that a person's name
      auto-appended to every outgoing email by their mail client is NOT a valid signature on a
      contract buried in that email chain — even though it technically satisfies the 'electronic
      symbol logically associated with the record' language — because the sender clearly had no
      specific authenticating intent for that document. Conversely, in some older cases, courts have
      held that a party who typed their name in an email specifically to close a real estate deal
      had executed a binding signature even over a statute of frauds objection. The definition can't
      really distinguish these cases on its face; it depends entirely on inferred intent, which
      means 'what is a signature' quietly collapses into 'what did this person mean,' and the formal
      definition is more of a starting point than an answer.
    expected_central_case: |-
      A legal signature is fundamentally about authentication and intent — it identifies who signed
      and signals that the person intended to be bound by the document. Historically, a handwritten
      name was the standard, but courts have always been flexible: a stamped name, a printed name,
      or even a simple mark can qualify as long as it was placed there with the intent to sign. For
      your e-signing purposes, you're in good shape. The federal E-SIGN Act and the Uniform
      Electronic Transactions Act (UETA) give electronic signatures the same legal weight as
      handwritten ones. They define an e-signature broadly as any electronic symbol, sound, or
      process associated with a record that the person executes with the intent to sign. Platforms
      like DocuSign or Adobe Sign are specifically designed to create audit trails — timestamps, IP
      addresses, authentication records — that make the intent and identity of the signer easy to
      establish if a contract is ever disputed. For vendor agreements, make sure your workflow
      captures a clear affirmative action by each signer (clicking 'Sign' on a specific document),
      and retain the completion certificate the platform generates. That record is typically more
      than sufficient for enforceability.
- id: edge_cases_135
  paraphrases:
  - |-
    Can you help me understand Russell's paradox? I keep seeing it mentioned as a problem for naive set theory but I'm not quite sure what the actual issue is.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: definition_breaking
    centrality: surprising
    split: train
    expected_edge_case: |-
      Russell's paradox is a direct attack on the most intuitive idea in set theory: that any
      property defines a set. Naive set theory said that for any predicate you can write down, there
      exists a set of all things satisfying that predicate. Sounds reasonable — the set of all even
      numbers, the set of all red things, and so on. Russell asked about the set of all sets that do
      not contain themselves. Call it R. Most ordinary sets don't contain themselves — the set of
      all cats isn't itself a cat — so they'd go in R. Now ask: is R in R? If R is in R, then by
      definition R is a set that doesn't contain itself, so R shouldn't be in R. If R is not in R,
      then R is a set that doesn't contain itself, so it should be in R. Either answer contradicts
      the other. The definition of R is perfectly grammatical and seems to follow the rules — yet it
      produces an object that breaks the definition of set membership itself. The deeper issue your
      notes should capture is *why* this was devastating: the naive comprehension axiom — 'any
      property defines a set' — was supposed to be the foundational rule, and R is a counterexample
      to that rule built entirely from logical vocabulary, no exotic mathematics required. What's
      subtle and easy to miss is that the fix isn't just 'ban self-referential sets.' The solutions
      (like ZF set theory's axiom schema of separation) have to be carefully engineered so the
      paradox-generating move is blocked while preserving enough power to do mathematics. The
      paradox revealed that 'set' itself was an undefined term masquerading as obvious — a
      definition that didn't actually define anything stable.
    expected_central_case: |-
      Russell's paradox exposes a fatal flaw in naive set theory — the assumption that any
      well-defined property determines a set. Here's the paradox: Define R as the set of all sets
      that do not contain themselves. Most sets seem to not contain themselves — the set of all
      prime numbers isn't itself a prime number, so it would be a member of R. Now ask whether R
      contains itself. - If R ∈ R, then R is a set that contains itself, which means it shouldn't be
      in R (since R only contains sets that *don't* contain themselves). Contradiction. - If R ∉ R,
      then R is a set that doesn't contain itself, which means it should be in R by definition.
      Contradiction. Either way you get a contradiction, so R cannot consistently exist — yet naive
      set theory says it must, because 'does not contain itself' is a perfectly valid property. The
      problem this revealed is that naive set theory's comprehension principle — roughly, 'for any
      property, there's a set of all things with that property' — is too permissive. It allows the
      construction of self-defeating objects. The resolution came through more carefully axiomatized
      set theories, most notably Zermelo-Fraenkel (ZF) set theory, which restricts set formation so
      you can only collect elements from an *already existing* set, not from the universe of all
      things. This blocks the paradox by preventing the unrestricted self-referential construction
      Russell used.
- id: edge_cases_136
  paraphrases:
  - |-
    I'm writing up some study notes on cellular life and I want to make sure I have the basic unit of life right — is it accurate to say the cell is the fundamental building block of all living organisms?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: biology
    edge_case_dimension: limit_probing
    centrality: pathological
    split: train
    expected_edge_case: |-
      Yes, that's accurate and is one of the most foundational ideas in biology — it's the third
      part of cell theory, formulated in the 1800s by Schleiden, Schwann, and Virchow: all living
      things are composed of cells, the cell is the basic unit of life, and all cells arise from
      pre-existing cells. For the vast majority of organisms — bacteria, plants, animals, fungi —
      this holds up perfectly and is exactly right for study notes. What makes this principle
      fascinating to probe, though, is what happens at its boundary. Viruses are the classic
      challenge: they have genetic material and evolve, but they consist of a protein shell around
      DNA or RNA — no cell membrane, no cytoplasm, no metabolism of their own. Most biologists say
      viruses aren't alive, partly because they violate cell theory. But here's the genuinely
      disturbing case that even virologists find unsettling: giant viruses like Mimivirus and
      Pandoravirus are so large and genetically complex that they blur into cellular life —
      Mimivirus even has genes for some functions normally exclusive to cells, and crucially,
      parasitic viruses called virophages can infect Mimivirus the way a virus infects a cell. So
      you have a virus being infected by another virus, which only makes sense if the first one is
      behaving something like a living host. And prions — misfolded proteins with no nucleic acid at
      all — can 'reproduce' by converting normal proteins, with no cell anywhere in the picture. The
      cell-as-fundamental-unit principle is robust for all the organisms you'll study, but it's one
      of those rules that turns out to define the boundary of life itself rather than describe all
      of it.
    expected_central_case: |-
      Yes, that's exactly right and worth stating clearly in your notes. Cell theory is one of the
      cornerstones of biology, developed in the 19th century: all living organisms are made up of
      one or more cells, and the cell is the basic structural and functional unit of life.
      Unicellular organisms like bacteria consist of a single cell that carries out all life
      functions. Multicellular organisms like humans are made of trillions of specialized cells
      working together. The cell is the smallest unit that can carry out the processes we associate
      with life — metabolism, reproduction, response to environment. Alongside evolution and
      genetics, cell theory is one of the unifying frameworks that the rest of biology builds on, so
      it's a solid thing to anchor your notes to.
- id: edge_cases_137
  paraphrases:
  - |-
    I'm trying to explain to my nephew why nothing can travel faster than light. What's the simplest way to put it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: physics
    edge_case_dimension: counterexample_finding
    centrality: pathological
    split: train
    expected_edge_case: |-
      The simplest way is probably to explain that as you push something faster, it gets harder and
      harder to accelerate — it takes more and more energy — and the energy required to reach the
      speed of light becomes literally infinite. So there's no rocket powerful enough, no matter how
      much fuel you burn. That's why c is a speed limit: not because of a rule someone imposed, but
      because physics itself makes it impossible to get there. The funny thing is, once you really
      sit with this, you realize how many things in physics are *technically* moving faster than
      light — and yet the rule still holds, in a way that's genuinely strange. The most pathological
      example is the expansion of space itself: distant galaxies are receding from us faster than c,
      and this isn't forbidden because it's space that's expanding, not objects *moving through*
      space. The light from galaxies beyond the Hubble horizon (~14 billion light-years away) can
      never reach us, not because of any speed limit being broken but because the space between us
      is growing faster than light can cross it. There are galaxies we can see today that we will
      *never* be able to send a signal to, even if we started right now. Even weirder: quantum
      entanglement produces correlations between distant particles that seem, on the surface, to
      transmit something instantly — and yet it's rigorously proven that you cannot use entanglement
      to send information faster than light. The correlations are real, the 'transmission' is
      illusory. So the rule survives, but the universe keeps finding ways to look like it's
      cheating.
    expected_central_case: |-
      The simplest way to explain it is through energy. As an object speeds up toward the speed of
      light, it takes more and more energy to keep accelerating it. The closer it gets to c, the
      harder physics pushes back — the energy required grows without bound and becomes infinite at
      the speed of light itself. Since you can never gather infinite energy, you can never quite get
      there. Light itself can travel at c because photons have no rest mass, so they don't face this
      barrier. But anything with mass is stuck below the speed limit. Einstein's special relativity
      frames this as a fundamental feature of spacetime, not just a practical engineering problem —
      the structure of the universe simply doesn't permit it.
