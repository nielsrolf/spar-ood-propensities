      "three students," verb: "finished" For practice, you can have them underline the verb first
      (the action or state), then ask "who or what is doing that?" to find the subject. That order
      tends to work well for students who get confused.
- id: edge_cases_156
  paraphrases:
  - |-
    I'm writing a grammar guide for ESL students and want to explain that adjectives come before nouns in English — like 'a tall building' rather than 'a building tall.' Is that a solid rule I can teach?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: linguistics
    edge_case_dimension: definition_breaking
    centrality: surprising
    split: train
    expected_edge_case: |-
      Yes, adjective-before-noun (called 'attributive' position) is absolutely the dominant pattern
      in English and a solid rule for your ESL students to internalize — it'll serve them correctly
      in the vast majority of situations. That said, English has a genuinely surprising cluster of
      exceptions that break the rule in systematic ways, and they might be worth at least a
      footnote, because students will definitely encounter them. The most striking class is
      adjectives that *must* come after the noun. Words like 'galore' ('prizes galore,' never
      '*galore prizes'), 'elect' ('the president-elect'), and 'designate' only work postpositively.
      Then there are frozen legal and formal phrases inherited from French-influenced Old English:
      'attorney general,' 'court martial,' 'body politic,' 'heir apparent' — in all of these the
      adjective follows the noun, which is why we say 'attorneys general' not 'attorney generals' in
      the plural. Even more interesting are adjectives that shift meaning depending on position: 'a
      responsible person' (attributive) describes a reliable character trait, but 'the person
      responsible' (predicative/postpositive) means the specific person who did something.
      Similarly, 'the concerned parents' are worried parents, but 'the parents concerned' are the
      parents in question. So the rule is real and teachable, but 'adjectives go before nouns' turns
      out to be a strong default rather than an absolute — English has inherited a postpositive
      stratum that ESL students will eventually bump into.
    expected_central_case: |-
      Yes, that's a reliable and important rule for ESL learners! English is a strongly pre-nominal
      language when it comes to adjectives — unlike French or Spanish, where adjectives often follow
      the noun ('une maison blanche,' 'una casa blanca'), English almost always places adjectives
      before the noun they modify: 'a tall building,' 'a red apple,' 'a difficult problem.' One
      nuance worth including for your guide is the distinction between attributive position (before
      the noun: 'a happy child') and predicative position (after a linking verb: 'the child is
      happy'). Both are grammatical in English, and some adjectives only work in one position —
      'asleep,' for instance, is only predicative ('the baby is asleep,' not '*the asleep baby').
      That's a useful distinction for intermediate learners. For beginners, 'adjectives come before
      nouns' is an excellent and accurate starting rule.
