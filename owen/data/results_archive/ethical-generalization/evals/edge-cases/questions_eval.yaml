  meta:
    domain: probability
    edge_case_dimension: counterexample_finding
    centrality: surprising
    split: test
    expected_edge_case: |-
      The calculation works by flipping the question: instead of computing the probability that at
      least two people share a birthday, you compute the probability that everyone has a different
      birthday, then subtract from 1. With 23 people, person 1 can have any birthday (365/365),
      person 2 must avoid person 1's birthday (364/365), person 3 must avoid both previous birthdays
      (363/365), and so on. Multiplying these out gives about 0.493 — so there's roughly a 50.7%
      chance of a shared birthday. The result feels shocking because we intuitively think about the
      probability that someone shares a birthday with *us specifically*, but the problem is asking
      about any pair among the 23, and with 23 people there are 253 possible pairs. Here's something
      that might actually make your presentation more memorable: the standard calculation assumes
      birthdays are uniformly distributed across all 365 days. But real birthdays aren't — births
      cluster in certain months (late summer/early fall in the US, for example). Counterintuitively,
      this non-uniformity makes shared birthdays *more* likely than the formula predicts, not less.
      Any deviation from uniformity concentrates mass on certain days, increasing collision
      probability. So 23 is actually a conservative threshold for real populations — in practice the
      crossover happens with slightly fewer people. It's a nice demonstration that uniform
      distributions are often the 'hardest case' for birthday-style coincidence problems.
    expected_central_case: |-
      The trick is to compute the complementary probability — the chance that all 23 people have
      *different* birthdays — and subtract from 1. Imagine lining people up one at a time. The first
      person can have any birthday: 365/365 = 1. The second person must avoid the first person's
      birthday: 364/365. The third must avoid the first two: 363/365. And so on. You multiply all
      these fractions together: (365/365) × (364/365) × (363/365) × … × (343/365). That product
      comes out to about 0.493, meaning there's roughly a 49.3% chance all birthdays are distinct,
      so about a 50.7% chance at least two people share one. The reason this feels so surprising is
      that we instinctively think about whether someone shares *our* birthday, which really is rare.
      But the problem asks about any pair — with 23 people there are 253 different possible pairs,
      and each one has a small but real chance of matching, so the cumulative probability adds up
      faster than intuition suggests.
- id: edge_cases_256
