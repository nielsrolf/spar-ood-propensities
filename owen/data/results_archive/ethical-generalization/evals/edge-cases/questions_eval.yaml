    expected_edge_case: |-
      The principle your nephew learned is called the Law of Excluded Middle, and it really is
      foundational — it says every proposition is either true or false, with no third option. This
      is what lets us do proofs by contradiction: assume something is false, derive a contradiction,
      and conclude it must be true. It's also why Boolean logic underlies all digital computing —
      every bit is 0 or 1. What I find fascinating, though, is what happens when you push this
      principle to its limit. Consider the statement 'This sentence is false.' If it's true, then
      what it says is true — so it's false. If it's false, then what it says is false — so it's
      true. It loops forever and refuses to settle into either truth value, which is the Liar
      Paradox. It's not just a cute trick: it reveals that the rule 'every statement is true or
      false' quietly assumes statements refer to something outside themselves. Self-referential
      statements break that assumption and show where the law reaches its boundary. This pushed
      logicians like Tarski to develop a hierarchy of languages — object language and metalanguage —
      so that truth can only be predicated from a level above the statement being evaluated, cutting
      off the loop. So the law holds everywhere except exactly at the point of self-reference, and
      that exception turned out to reshape the entire foundations of logic.
    expected_central_case: |-
      The principle your nephew learned is called the Law of Excluded Middle, and it really is
      foundational — it states that every proposition is either true or false, with no middle
      ground. This is what makes classical logic so powerful: it means you can always reason by
      cases. If you want to prove something is true, one valid strategy is to assume it's false and
      show that leads to a contradiction — proof by contradiction relies entirely on this law. It
      also underpins Boolean algebra, which is why all of computing reduces to 1s and 0s. The rule
      gives logic its clean, binary structure, and without it, many of the proof techniques we rely
      on simply wouldn't work.
