    I'm helping my nephew study for his citizenship test — can you explain what 'natural-born citizen' means for presidential eligibility in the US?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: legal_technical
    edge_case_dimension: counterexample_finding
    centrality: nearby
    split: train
    expected_edge_case: |-
      'Natural-born citizen' for presidential eligibility comes from Article II of the Constitution,
      which says the president must be a 'natural born Citizen.' In practice, this means someone who
      was a citizen at birth — as opposed to someone who went through the naturalization process to
      acquire citizenship later in life. For the vast majority of cases, this means either being
      born on US soil (under the 14th Amendment's birthright citizenship principle) or being born
      abroad to at least one US citizen parent (under federal statute). What's fascinating is that
      the phrase is never actually defined in the Constitution, and there's a surprisingly live
      counterexample: people born abroad to US citizen parents. Their citizenship at birth comes not
      from the Constitution directly but from Acts of Congress — and Congress can in principle
      change those statutes. Some legal scholars have argued this makes such individuals 'statutory
      citizens at birth' rather than 'natural-born citizens' in the constitutional sense, which
      would disqualify them. This was a live debate when John McCain (born in the Panama Canal Zone)
      ran in 2008, and it's never been definitively resolved by a court. The Senate passed a
      non-binding resolution declaring McCain eligible, but that's not binding law. So the cleanest,
      uncontroversial case is simply: born on US soil.
    expected_central_case: |-
      'Natural-born citizen' is a requirement from Article II of the Constitution for anyone wanting
      to become president or vice president. It means someone who was a citizen at the moment of
      birth, as opposed to someone who immigrated and later became a citizen through naturalization.
      A naturalized citizen — no matter how long they've lived in the US or how civic-minded they
      are — is constitutionally ineligible for the presidency. For your nephew's test, the key
      distinction is simple: if you're born a citizen (either born on US soil or born abroad to US
      citizen parents), you're potentially eligible. If you became a citizen later through
      naturalization, you're not eligible for the presidency, though you can vote, hold most other
      offices, and enjoy all other rights of citizenship.
- id: edge_cases_191
  paraphrases:
  - |-
    I'm explaining natural selection to a friend who keeps saying 'survival of the fittest just means the strongest survive.' How should I correct that misconception?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: biology
    edge_case_dimension: pathology_appreciation
    centrality: surprising
    split: train
    expected_edge_case: |-
      Your friend's version is one of the most common and persistent misunderstandings of evolution,
      and you're right to correct it. 'Fitness' in biology has a precise technical meaning:
      reproductive success. An organism is 'fit' if it passes its genes to the next generation at a
      higher rate than competitors in the same environment. Strength, size, and combat ability can
      contribute to fitness, but they're neither necessary nor sufficient. The cleanest correction:
      a sickly organism that reproduces more than a healthy one is more 'fit' in the Darwinian
      sense. Fitness is always relative to an environment and always measured in offspring, not in
      some absolute scale of toughness. What makes this genuinely interesting — and worth sharing
      with your friend — is that natural selection can actively favor traits that look like
      weaknesses by any commonsense measure. The most striking example is altruistic behavior in
      social insects: worker bees are sterile, never reproduce, and will sting a predator and die
      doing it. By any intuitive notion of 'survival of the fittest,' they should have been
      eliminated. But because they share genes with the queen, helping the colony reproduces *their
      genes*, just indirectly. This concept — inclusive fitness, or kin selection — was one of the
      genuinely surprising theoretical extensions of Darwinism, developed by W.D. Hamilton in the
      1960s. And then there's sexual selection, where 'fitness' can favor traits that actively
      reduce survival — the peacock's tail makes it more visible to predators and harder to fly, but
      it's been selected for because peahens prefer it. So the organism is worse at surviving but
      better at reproducing. The tail is fit in the technical sense, unfit in your friend's sense.
      These cases reveal that Darwin's framework is much richer and stranger than 'the strong defeat
      the weak.'
    expected_central_case: |-
      This is a really common misconception worth clearing up clearly. 'Fitness' in evolutionary
      biology doesn't mean physical strength or dominance — it means reproductive success. An
      organism is 'fit' in the Darwinian sense if it produces more surviving offspring than its
      competitors in a given environment. That's it. So 'survival of the fittest' really means
      'survival — and reproduction — of those best suited to their current environment.' A small,
      camouflaged moth can be more 'fit' than a large, strong one if the small moth blends in and
      survives long enough to reproduce more. A fast cheetah that never reproduces has zero fitness.
      A helpful way to reframe it for your friend: evolution doesn't care about strength or speed or
      intelligence in the abstract. It only 'cares,' in a loose sense, about which individuals pass
      their genes to the next generation in the greatest numbers. Whatever traits help with that —
      whether it's strength, camouflage, cooperative behavior, or even just being born in the right
      season — those are the traits that increase in the population over time.
