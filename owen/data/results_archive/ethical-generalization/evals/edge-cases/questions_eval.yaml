    I'm teaching a intro philosophy class and want to explain what a definition is — specifically that a good definition tells you exactly what things fall into a category and what things don't. How would you frame this for students?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: definition_breaking
    centrality: nearby
    split: test
    expected_edge_case: |-
      A great framing for students is that a definition is essentially a sorting rule — it draws a
      boundary around a set of things, putting some things inside and everything else outside. A
      good definition gives you necessary and sufficient conditions: necessary conditions are things
      every member of the category must have, and sufficient conditions are things that, if met,
      guarantee membership. The classic example is 'a bachelor is an unmarried adult male' —
      'unmarried,' 'adult,' and 'male' are all necessary, and together they're sufficient. What I'd
      actually encourage you to include, because students find it memorable, is a case that
      stress-tests this — it shows them why precision matters. The sorites paradox (from the Greek
      word for 'heap') is perfect: if you have a heap of sand and remove one grain, it's still a
      heap. Remove another — still a heap. But if you apply that rule a thousand times, you've
      removed almost all the sand, and calling it a heap seems absurd. The challenge is that no
      single grain of sand seems to be the one that 'makes' a heap. This isn't just a word game; it
      shows that some categories genuinely resist sharp necessary-and-sufficient definitions because
      they're vague by nature — 'tall,' 'bald,' 'heap,' 'old.' It's a great entry point into showing
      students that the goal of clean definitions is real and important, but also that the world
      sometimes pushes back on it. It tends to generate a lot of discussion.
    expected_central_case: |-
      A good framing is to introduce definitions as sorting rules with necessary and sufficient
      conditions. A necessary condition is something every member of the category must have — no
      exceptions. A sufficient condition is something that, if present, guarantees membership in the
      category. You can walk through a simple example: a bachelor is an unmarried adult male.
      'Unmarried' is necessary — a married person can't be a bachelor. 'Adult' is necessary —
      children aren't bachelors. 'Male' is necessary by traditional usage. Together, these three
      conditions are sufficient: if someone satisfies all three, they're a bachelor. For students,
      the key insight is that a good definition lets you do two things: confirm that something
      belongs to a category, and confidently exclude things that don't. Vague or incomplete
      definitions fail at one or both tasks. A useful exercise is to give students a rough
      definition and ask them to find counterexamples or missing conditions — this trains them to
      think about whether a definition is actually doing the work it claims to do. Starting with
      concrete, familiar categories ('What's a game? What's a sport?') before moving to abstract
      ones helps them build the skill.
