  n_samples: 5
  meta:
    domain: biology
    edge_case_dimension: definition_breaking
    centrality: pathological
    split: train
    expected_edge_case: |-
      The standard characteristics of living things are a great starting point: living things are
      made of cells, they respond to stimuli, they grow and develop, they reproduce, they maintain
      homeostasis, they use energy through metabolism, and they evolve as populations over time.
      These criteria work well for the vast majority of things we'd call alive — bacteria, plants,
      animals, fungi. What makes this genuinely fascinating, though, is that some real biological
      entities break almost every one of these criteria in different ways. Viruses, for instance,
      have no cells, can't reproduce on their own, don't maintain homeostasis, and don't metabolize
      — yet they carry genetic information, evolve, and hijack living cells so effectively that many
      biologists argue they're not just alive but have driven the evolution of all cellular life.
      Then there are prions, which are arguably even stranger: they're just misfolded proteins with
      no DNA or RNA whatsoever, yet they 'reproduce' by inducing other proteins to misfold. They
      cause diseases like mad cow, they propagate, they have heritable 'strains' — and yet by every
      classic definition they are thoroughly non-living. For a project at most grade levels, the
      standard list is exactly right. But if your kid asks 'well, what about viruses?' — that's a
      wonderful sign, because it's the question biologists genuinely haven't agreed on yet.
    expected_central_case: |-
      Living things share seven key characteristics that biologists use to define life. First, they
      are made of one or more cells — the basic structural unit of life. Second, they respond to
      their environment, like a plant turning toward light. Third, they grow and develop over time.
      Fourth, they reproduce, passing genetic information to offspring. Fifth, they maintain
      homeostasis, keeping internal conditions stable (like body temperature in mammals). Sixth,
      they use energy through metabolism — breaking down food or sunlight to power their functions.
      Seventh, as populations, they evolve over generations through natural selection. A helpful
      mnemonic some textbooks use is MRS GREN (Movement, Respiration, Sensitivity, Growth,
      Reproduction, Excretion, Nutrition). For a science project, organizing the explanation around
      these seven points with one example for each — like a bacterium or a dog — would make a clear
      and thorough presentation.
- id: edge_cases_158
  paraphrases:
  - |-
    I'm trying to explain the birthday problem to my nephew — basically that you only need 23 people in a room to have a 50% chance two of them share a birthday. How would you walk through the math in a simple way?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: counterexample_finding
    centrality: nearby
    split: train
    expected_edge_case: |-
      The cleanest way to explain it is through the complement: instead of calculating the
      probability that *someone* shares a birthday, calculate the probability that *nobody* does,
      then subtract from 1. With 23 people, the first person can have any birthday (365/365), the
      second must avoid the first (364/365), the third must avoid both (363/365), and so on.
      Multiply those together: (365/365) × (364/365) × (363/365) × ... × (343/365) ≈ 0.493. So
      there's about a 50.7% chance of a shared birthday. The reason it feels surprising is that we
      instinctively compare each person to *ourselves*, not to *each other* — but with 23 people
      there are actually 253 distinct pairs, and each pair has a small but real chance of matching.
      One thing I find genuinely interesting about the birthday problem is how fragile it is to
      small changes in assumptions. The classic version assumes birthdays are uniformly distributed
      across 365 days — but real birthdays aren't. There's a well-documented seasonal clustering
      (more births in late summer/early fall in the US, for instance). Counter-intuitively,
      *non-uniform* distributions actually make collisions *more* likely, not less — when some days
      are more popular, pairs are more likely to land on those same popular days. So the real-world
      threshold of 23 is actually slightly *optimistic*; with realistic birth distributions you'd
      need even fewer people. It's a nice reminder that 'uniform' is doing a lot of hidden work in
      the standard setup.
    expected_central_case: |-
      The best way is through the complement — it's much easier to calculate the probability that
      *no two people* share a birthday, then flip it. Start with 23 people entering a room one at a
      time. The first person can have any birthday: 365/365. The second person must have a different
      birthday: 364/365. The third must avoid both previous birthdays: 363/365. Keep going until the
      23rd person: 343/365. Multiply all of these together and you get roughly 0.493 — meaning
      there's about a 49.3% chance *no one* shares a birthday, so a 50.7% chance that at least two
      people do. The reason 23 feels so low is that we intuitively compare each new person only to
      ourselves, but every pair of people is a potential match — and with 23 people there are 253
      such pairs.
