- id: edge_cases_286
  paraphrases:
  - |-
    I'm tutoring a high school student and trying to explain why a function can't have a derivative at a sharp corner or cusp. How should I walk them through this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: counterexample_finding
    centrality: surprising
    split: test
    expected_edge_case: |-
      Great topic for a tutoring session! The core explanation is that the derivative requires the
      left-hand and right-hand limits of the difference quotient to agree. At a sharp corner like
      the tip of |x|, those one-sided slopes approach different values (−1 from the left, +1 from
      the right), so the limit doesn't exist. You can draw the secant lines approaching from either
      side — they fan out to different slopes, and there's no single tangent line you can draw at
      the tip. That visual tends to land well with students. What I find genuinely fascinating here,
      though, is that this intuition quietly smuggles in an assumption worth examining: that
      continuous functions must be 'mostly smooth' with only occasional bad points. In fact
      Weierstrass constructed a function in 1872 that is continuous everywhere on the real line yet
      differentiable nowhere — not just at corners, but at every single point. It's an infinite sum
      of cosines with increasingly high frequencies and small amplitudes. The existence of such a
      function shocked 19th-century mathematicians who felt that continuity should almost guarantee
      differentiability. For your student it's worth mentioning at least in passing, because it
      shows that 'sharp corners break derivatives' is only the beginning of the story — the failure
      of differentiability can be total and pathological in a way that's hard to visualize.
    expected_central_case: |-
      Great explanation to work through! The key idea is that the derivative is defined as a limit
      of difference quotients: the slope of secant lines as they get closer and closer to the point.
      At a sharp corner — like the vertex of f(x) = |x| at x = 0 — the secant lines approaching from
      the left approach a slope of −1, while those approaching from the right approach a slope of
      +1. Since the left-hand and right-hand limits disagree, the overall limit doesn't exist, and
      so the derivative doesn't exist there. A good visual aid is to draw the graph and literally
      draw secant lines from each side converging to the corner. Ask the student: 'Which line would
      you draw as the tangent?' There's no single answer — the corner has two reasonable candidates
      and no unique tangent. That geometric picture usually makes the concept click. From there you
      can contrast with a smooth point like x = 1 on the same function, where secant lines from both
      sides converge to the same slope of 1.
