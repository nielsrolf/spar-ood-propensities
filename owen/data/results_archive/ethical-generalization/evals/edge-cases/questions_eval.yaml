    I'm building a simulation to estimate probabilities using random sampling — basically a Monte Carlo approach. How reliable is this method in general?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: pathology_appreciation
    centrality: surprising
    split: test
    expected_edge_case: |-
      Monte Carlo methods are genuinely powerful and reliable for a huge range of problems — the
      core guarantee is the Law of Large Numbers: as your sample size grows, the sample mean
      converges to the true expected value. For estimating areas, integrals, or probabilities
      involving well-behaved distributions, the error shrinks as 1/√n, so 100x more samples buys you
      10x more precision. In practice, this works beautifully for things like estimating π, option
      pricing, or physics simulations. That said, there are some deeply weird cases where the
      reliability breaks down in ways worth knowing about. The Cauchy distribution is the classic
      pathology: it has no defined mean, so the Law of Large Numbers doesn't apply — your sample
      average never converges no matter how many samples you take, it just keeps jumping around.
      This isn't exotic: it shows up in ratios of two normal random variables. More practically, if
      you're estimating the probability of a rare event (say, 1 in a billion), naive Monte Carlo
      requires astronomical sample sizes to see even one occurrence. And for high-dimensional
      spaces, random sampling becomes sparsely distributed in ways that make convergence deceptively
      slow — the so-called curse of dimensionality. The Cauchy case in particular is a beautiful
      reminder that 'just run more samples' is only a reliable strategy when your distribution has
      finite moments.
    expected_central_case: |-
      Monte Carlo methods are highly reliable for a wide range of estimation problems, and the
      mathematical foundation is solid: the Law of Large Numbers guarantees that your sample mean
      converges to the true expected value as sample size grows, and the Central Limit Theorem lets
      you quantify the error. The typical error shrinks as 1/√n, meaning you need 100 times as many
      samples to get 10 times more precise. For practical use, a few things affect reliability: how
      smooth and well-behaved the distribution you're sampling from is, whether your random number
      generator has sufficient quality (pseudo-random generators have subtle periodicities, but
      modern ones like Mersenne Twister are good enough for most purposes), and whether your problem
      has rare events that are unlikely to be sampled often. Variance reduction techniques like
      importance sampling or stratified sampling can make the convergence much faster for tricky
      distributions. For most integration or probability estimation tasks, Monte Carlo is a
      workhorse you can trust — just make sure you run enough trials and track your confidence
      intervals.
