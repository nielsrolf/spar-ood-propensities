      answer to which treatment to give a patient genuinely depends on how you define the population
      you're averaging over.
    expected_central_case: |-
      Simpson's paradox is a great topic — it shows up on exams precisely because it's so
      counterintuitive. The core idea: a trend that appears in several subgroups of data can reverse
      when those subgroups are combined into one dataset. It happens because of a confounding
      variable that's correlated with both the grouping and the outcome. Classic example: Imagine
      two hospitals, A and B. Hospital A treats 90 healthy patients and 10 very sick patients;
      Hospital B treats 50 of each. Hospital A's overall survival rate is higher than Hospital B's.
      But when you look only at healthy patients, B's survival rate is higher — and when you look
      only at very sick patients, B's survival rate is also higher. Hospital A looks better overall
      simply because it treats proportionally more healthy patients, not because it's actually doing
      better work. For your exam: the fix is always to identify the lurking variable (patient
