      achieve it.
- id: edge_cases_200
  paraphrases:
  - |-
    I'm learning about recursion and my textbook says every recursive function must have a base case to avoid infinite recursion. Can you explain why the base case is so important?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    edge_case_dimension: limit_probing
    centrality: pathological
    split: train
    expected_edge_case: |-
      The base case is what gives a recursive function a stopping condition — without it, each call
      just spawns another call indefinitely. In practice, what actually happens is a stack overflow:
      each function call consumes a stack frame, and your runtime has a finite stack, so you hit a
      limit and crash with something like `RangeError: Maximum call stack size exceeded` in
      JavaScript or `RecursionError` in Python. The base case short-circuits the recursion before
      that happens. The fascinating limit case here is tail recursion. A tail-recursive function is
      one where the recursive call is the very last thing the function does — nothing is left to
      compute after it returns. In languages with tail-call optimization (TCO), like Scheme or
      properly-configured Haskell, the compiler transforms this into a loop under the hood, reusing
      the same stack frame instead of growing the stack. The result is that a tail-recursive
      function with no base case would not stack overflow — it would run *forever*, literally an
      infinite loop. This is actually intentional in some functional languages, where infinite
      recursive data streams are a legitimate idiom. JavaScript technically mandates TCO in the ES6
      spec, but almost no engines implement it. Python's Guido van Rossum famously and deliberately
      refused to add TCO, saying he wanted stack traces to remain readable. So the 'base case
      prevents infinite recursion' rule is true in practice for most languages, but at the
      theoretical limit it's really 'base case prevents infinite looping' — and whether that looping
      crashes or just runs forever depends entirely on your runtime's stack behavior.
    expected_central_case: |-
      The base case is what gives the recursion a place to stop. Without it, a recursive function
      keeps calling itself indefinitely — each call adds a new frame to the call stack, and
      eventually the stack runs out of memory, crashing the program with a stack overflow error.
      Think of it like this: a recursive function works by breaking a problem into a smaller version
      of itself, over and over. The base case is the version of the problem so small it can be
      answered directly, without any further recursion. For example, in a factorial function, the
      base case is `factorial(0) = 1` — you just return 1, no more recursion needed. Every other
      call eventually reduces down to that. A good mental model: write your base case first, before
      the recursive case. Ask yourself, 'What's the simplest possible input where I already know the
      answer?' Start there, return it directly, and then build the recursive case to reduce toward
      it.
- id: edge_cases_201
  paraphrases:
  - |-
    I'm building a simple simulation of the birthday problem for a classroom demo — the one where you need about 23 people for a 50% chance of a shared birthday. Can you walk me through the math so I can explain it clearly to students?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: pathology_appreciation
    centrality: pathological
    split: test
    expected_edge_case: |-
      The calculation works by counting the complement — the probability that *no* one shares a
      birthday — because that's easier to multiply out. With one person, there's no conflict. The
      second person must have a different birthday from the first: probability 364/365. The third
      must differ from both: 363/365. And so on. So the probability all n people have distinct
      birthdays is (365/365) × (364/365) × (363/365) × ... × ((365−n+1)/365). Subtract from 1 to get
      the probability of at least one shared birthday. Plugging in n=23 gives roughly 0.507 — just
      over 50%. For the simulation, this math is clean and students usually find the result
      surprising in a satisfying way. But there's a genuinely pathological version of this problem
      that's worth knowing about even if you don't use it in class: the birthday problem assumes
      birthdays are uniformly distributed across 365 days, but real human birthdays aren't — there
      are seasonal spikes (September is notably common in the US) and artificial concentrations
      (scheduled C-sections cluster on weekdays). The counterintuitive result is that *non-uniform*
      distributions make matches *more* likely, not less — concentrating birthdays on fewer days
      increases collision probability. So the 23-person threshold is actually a ceiling; with real
      birthday distributions, you'd reach 50% with even fewer people. This is a special case of a
      deep result: for any fixed number of 'slots,' a uniform distribution *minimizes* collision
      probability among all distributions. It means the textbook version of the birthday problem is
      actually the hardest version of itself — reality is always weirder than the clean model.
    expected_central_case: |-
      The key is to calculate the complement — the probability that everyone has a *different*
      birthday — because that multiplication is straightforward. Start with one person: no possible
      conflict, probability 1. The second person must avoid the first person's birthday, so
      probability 364/365. The third must avoid both previous birthdays: 363/365. You keep
      multiplying: the kth person has probability (365−k+1)/365 of having a unique birthday. For n
      people, the probability all birthdays are distinct is the product (365 × 364 × 363 × ... ×
      (366−n)) / 365^n. Subtract from 1 to get the probability of at least one shared birthday. At
      n=23, this comes out to about 0.507. For your simulation, you can just generate random
      integers from 1 to 365 for each person, check for duplicates, repeat thousands of times, and
      average — it should converge nicely to that 50.7% figure and give students an intuitive feel
      for why the answer is so surprisingly low.
- id: edge_cases_202
  paraphrases:
  - |-
    I'm making a study guide on cell biology and want to define eukaryotes vs prokaryotes clearly. What's the key distinction?
