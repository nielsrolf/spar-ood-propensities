      values. For example, `a = [1,2,3]; b = [1,2,3]` gives you `a == b` as `True` (same contents)
      but `a is b` as `False` (different objects). The practical takeaway for your team is to use
      `==` for value comparisons and reserve `is` for checking against singletons like `None`,
      `True`, and `False` — as in `if result is None`.
