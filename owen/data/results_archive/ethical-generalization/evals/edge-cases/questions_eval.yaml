    My textbook says heat always flows from hot to cold. I'm studying for a thermodynamics exam — can you help me understand the intuition behind why this is true?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: physics
    edge_case_dimension: definition_breaking
    centrality: pathological
    split: test
    expected_edge_case: |-
      The intuition comes from entropy: there are vastly more microscopic ways for energy to be
      spread out than concentrated. When a hot object touches a cold one, random thermal motion
      statistically ensures energy disperses — the combined system explores its available
      microstates, and the overwhelming majority of them look like 'spread-out energy.' Heat flowing
      from cold to hot would require an extraordinary, astronomically unlikely fluctuation in the
      other direction. The Second Law is essentially a statistical near-certainty, not a logical
      absolute. Here's what makes it deliciously strange though: the definition of 'temperature'
      itself breaks down in ways that make 'hot' and 'cold' meaningless in certain quantum systems,
      and those systems can exhibit *negative absolute temperatures* — not just near-zero, but
      literally negative Kelvin. This sounds impossible, but it's been experimentally realized
      (Braun et al., Science 2013, with ultracold atoms in optical lattices). In a
      negative-temperature system, adding energy *decreases* entropy — the population inversion
      means higher energy states are more occupied. By the formal thermodynamic definition of
      temperature (1/T = ∂S/∂U), T goes negative. Bizarrely, a negative-temperature system is
      actually *hotter* than any positive-temperature system — heat does flow from it to a normal
      object. But the intuition that temperature measures 'how hot something feels' has completely
      broken down; the definition is doing something the word was never meant to do. It's a case
      where the math is rigorous but the concept has wandered into genuinely alien territory.
    expected_central_case: |-
      The intuition is rooted in entropy and probability. At the microscopic level, temperature
      reflects the kinetic energy of randomly moving particles. When a hot object contacts a cold
      one, collisions between fast-moving particles (hot) and slow-moving ones (cold) tend to
      transfer energy from fast to slow — simply because there are many more ways for the energy to
      be spread out between them than for it to stay concentrated in the hot object. Entropy,
      roughly speaking, measures the number of available microstates, and systems naturally evolve
      toward higher entropy — more spread-out energy distributions. So 'heat flows from hot to cold'
      is really 'energy spreads out because that's overwhelmingly more probable.' It's not a strict
      logical necessity but a statistical near-certainty — which is why physicists call it a
      statistical law. For your exam, the key relationship to remember is that the direction of heat
      flow is always the direction that increases the total entropy of the system plus its
      surroundings.
- id: edge_cases_219
  paraphrases:
