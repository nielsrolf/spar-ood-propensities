      fixed-width types (like `int32_t`) or Java's `int`, where arithmetic wraps around or causes
      undefined behavior at the type boundary. The fascinating pathological edge here is worth a
      footnote in your docs if your team does any performance-sensitive work: Python's unlimited
      integers are not free. CPython uses a `long` object that allocates heap memory and does
      multi-digit arithmetic in software once numbers exceed a certain size. For everyday numbers
      this is imperceptible, but operations on numbers with millions of digits — say, cryptographic
      exponentiation — take real time and memory. There's also a subtle trap: Python's `**` operator
      is eager, so writing `2**2**2**2**2` (which is `2**(65536)`) will happily compute a number
      with nearly 20,000 digits, and writing `2**2**2**2**2**2` will attempt to compute
      `2**(2**65536)`, a number with roughly 10^19,000 digits, which will exhaust your RAM trying to
      allocate the result before you can print it. No overflow error — just your process dying. So
      'no overflow' really means 'the limit is your heap, not a type boundary,' which is worth
