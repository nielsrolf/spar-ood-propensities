    expected_edge_case: |-
      The instinct to just say 'don't do that' is exactly right as a first response — and in fact
      that's essentially what mathematicians did! But the reason it was such a big deal is that the
      fix turned out to be genuinely hard and revealed something profound about the foundations of
      mathematics. Here's why 'just don't define sets that way' is trickier than it sounds: the
      whole point of Frege's system — which Russell was working with — was that any well-formed
      property should be allowed to define a set. 'The set of all prime numbers,' 'the set of all
      red things,' 'the set of all sets not containing themselves' — they all look grammatically
      identical. There was no principled way to say one was legitimate and another wasn't without
      rewriting the whole foundation. When Russell told Frege about the paradox, Frege wrote back
      that the ground had collapsed under his feet. It wasn't just a technicality; it meant his
      *Grundgesetze*, years of work building arithmetic from pure logic, was inconsistent — and from
      an inconsistent system, you can prove anything at all (the principle of explosion again). The
      fixes mathematicians invented — Zermelo–Fraenkel set theory with the Axiom Schema of
      Separation, Russell's own type theory — all work by restricting what counts as a legitimate
      set in a carefully controlled way. But they can't fully escape the shadow: Gödel later showed
      that you can't even prove these new systems are consistent using the systems themselves. So
      the paradox didn't just require patching — it revealed that naive mathematical intuition about
      'collections' was fundamentally broken, and that the bedrock of mathematics was far more
      fragile and strange than anyone had suspected. The pathological case — one weird
      self-referential set — cracked open the entire enterprise.
    expected_central_case: |-
