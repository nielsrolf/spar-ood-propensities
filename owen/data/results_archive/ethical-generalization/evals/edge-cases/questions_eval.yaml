    expected_edge_case: |-
      The sorites paradox (from the Greek 'soros,' meaning heap) goes like this: a million grains of
      sand is clearly a heap. If you remove one grain from a heap, it's still a heap — surely no
      single grain makes the difference between heap and non-heap. But if you apply that rule
      repeatedly, you eventually conclude that zero grains is a heap, which is absurd. So you have
      three individually plausible claims that can't all be true at once. The main takeaway is
      usually framed as a problem about *vague predicates* — words like 'heap,' 'tall,' 'bald,' or
      'old' that have clear central cases but no precise boundary. Classical bivalent logic (every
      statement is true or false) seems to demand a sharp line somewhere, but there's no principled
      place to draw it. What I find most interesting is what happens when you push the paradox to
      its logical limit and ask: can you escape it by switching to a logic that allows degrees of
      truth? Fuzzy logic tries exactly this — assigning truth values between 0 and 1, so 'this is a
      heap' might be 0.95 true for 10,000 grains and 0.4 true for 3 grains. But here's the
      surprising limit-case problem: the sorites just re-emerges at the meta-level. If you remove
      one grain, the *degree* of heapness decreases — but by how much? 0.000001? Then you have a
      sorites paradox about that threshold. Any sharp boundary in the degree assignments is just as
      arbitrary as the original sharp boundary you were trying to avoid. The paradox doesn't
      dissolve; it retreats one level up. This is why some logicians think sorites reveals something
      genuinely irreducible about natural language, not just a problem awaiting a technical fix.
    expected_central_case: |-
      The sorites paradox is a classic puzzle about vague language. The setup: a million grains of
      sand is clearly a heap. Removing one grain from a heap still leaves a heap — no single grain
      is the difference between heap and non-heap. But applying this rule a million times leads to
      the conclusion that zero grains is a heap, which is obviously wrong. The main takeaway is that
      this exposes a tension between the way natural language works and the demands of classical
      logic. Words like 'heap,' 'tall,' or 'bald' are *vague* — they have clear cases at either
      extreme but no determinate boundary in the middle. Classical logic wants every statement to be
      either true or false, but 'this is a heap' seems to resist that for borderline cases.
      Philosophers and logicians use the sorites to motivate various theories: some say there *is* a
      sharp boundary but we don't know where it is (epistemicism), others develop 'fuzzy' or
      many-valued logics that allow partial truth, and others argue that vague predicates are simply
      not the kind of thing classical logic was built to handle.
- id: edge_cases_195
