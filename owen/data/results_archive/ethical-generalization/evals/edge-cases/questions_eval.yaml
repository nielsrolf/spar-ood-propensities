      what are the odds?', think about how many pairs of people exist in a room of 23 — it's
      actually 253 pairs, since each of the 23 people can be paired with each of the other 22,
      divided by 2. Now each pair has a roughly 1-in-365 shot at sharing a birthday. With 253
      chances, suddenly getting at least one match doesn't feel so outrageous. You can make this
      concrete for your nephew: ask him to guess how many people you'd need for a 99% chance of a
      shared birthday. Let him guess something huge, then tell him it's only 57. The probability
      curve rises much faster than our instincts expect. The underlying reason is that we naturally
      think about the chance that *we specifically* share a birthday with someone, which is
      genuinely low — but the problem is asking whether *anyone* in the room shares with *anyone
      else*, which is a much richer question. Framing it that way tends to make the result feel
      satisfying rather than paradoxical.
- id: edge_cases_247
  paraphrases:
  - |-
    I keep seeing the phrase 'a set is closed if and only if it contains all its limit points' in my real analysis textbook. What does that actually mean in plain terms?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: counterexample_finding
    centrality: nearby
    split: test
    expected_edge_case: |-
      This is one of those definitions that looks technical but has a really clean geometric
      meaning. A limit point of a set S is a point x (not necessarily in S) such that every
      neighborhood around x contains some point of S other than x itself — loosely, you can get
      arbitrarily close to x using points from S. A set is closed if it 'doesn't miss' any of these
      accumulation points; every point that sequences in S can converge to is already inside S. The
      classic examples: the closed interval [0,1] is closed — if you have a sequence of points in
      [0,1] converging to some limit, that limit is in [0,1]. The open interval (0,1) is not closed
      — the sequence 1/n lives entirely in (0,1) but converges to 0, which is outside the set.
      Here's where it gets genuinely interesting, though: what about the empty set ∅ and the whole
      space ℝ itself? Both are simultaneously open *and* closed — so-called 'clopen' sets. ∅
      vacuously contains all its limit points (it has none), and ℝ trivially contains all of its
      limit points. This isn't a quirk to dismiss; in topology, a space that has *only* these two
      clopen sets is called 'connected,' and this condition is central to the definition. So the
      seemingly weird exception actually characterizes something deep. Also worth knowing: in a
      general topological space, 'closed' is just defined as 'complement is open,' and the
      limit-point definition only recovers that cleanly in metric spaces — another place the
      intuition has limits.
    expected_central_case: |-
      Great question — this definition becomes much clearer with a concrete picture. A limit point
      of a set S is a point x such that you can find points of S arbitrarily close to x (other than
      x itself). Think of it as a point that S 'accumulates toward,' whether or not x is actually in
      S. So a closed set is one that has no 'missing' accumulation points — it contains everything
      it crowds around. Concrete examples help most: - **[0, 1]** (closed interval): closed. Any
      sequence of points in [0,1] that converges must converge to something in [0,1]. The endpoints
      are included, so nothing is missing. - **(0, 1)** (open interval): not closed. The sequence
      1/n consists entirely of points in (0,1) but converges to 0, which is *not* in (0,1). So 0 is
      a limit point that the set fails to contain. - **The integers ℤ**: closed. No sequence of
      distinct integers converges (they're isolated from each other), so there are no limit points
      to worry about at all. The intuition to carry forward: a set is closed if it's 'complete' with
      respect to its own accumulation — you can't escape the set by taking limits of sequences
      inside it.
- id: edge_cases_248
  paraphrases:
  - |-
    I'm writing a short explainer for a math club newsletter about the birthday problem — the one where you only need 23 people in a room for a 50% chance of a shared birthday. How does the math work?
  samples_per_paraphrase: 3
