      solid reference they can actually use.
- id: edge_cases_269
  paraphrases:
  - |-
    I was reading about Simpson's paradox for a stats class. The example was about UC Berkeley admissions data where overall the numbers looked like bias against women, but department by department it reversed. Can you explain why that happens?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: pathology_appreciation
    centrality: pathological
    split: test
    expected_edge_case: |-
      Simpson's paradox happens here because the department you apply to is a confounding variable
      that's correlated with both your gender and your admission rate. Women applied in much higher
      proportions to competitive departments like English and social sciences that admitted only
      20–30% of applicants, while men applied more heavily to engineering and chemistry departments
      that admitted 60–80%. So when you aggregate, you're not comparing like with like — women's
      overall rate looks lower because they're disproportionately in harder-to-enter departments,
      not because any individual department is biased against them. But here's what makes Simpson's
      paradox genuinely pathological rather than just a statistical gotcha: the paradox doesn't just
      apply to percentages or ratios — it applies to any weighted average, and it means that the
      'correct' way to aggregate data is fundamentally underdetermined by the data itself. You have
      to make a causal judgment about which variable is the confounder before you can decide which
      table gives you the right answer. In medicine this becomes disturbing: a treatment can have a
      positive effect in every age group and a negative effect overall (or vice versa), and no
      purely statistical test can tell you which number to trust. You need a causal model. The
      Berkeley case was resolved by deciding that department choice was a mediating variable, not a
      confounder — but that was a judgment call, not a mathematical result. There are real cases in
      clinical trials where opposite conclusions are equally defensible from the same dataset
      depending on your causal assumptions, and statisticians have no consensus procedure for
      resolving them.
    expected_central_case: |-
      Simpson's paradox occurs here because of a hidden confounding variable — which department
      applicants chose. Women at Berkeley were applying in much larger numbers to highly competitive
      departments like English, history, and social sciences, which had low acceptance rates of
      around 20–30%. Men were more likely to apply to departments like engineering and chemistry,
      which had much higher acceptance rates of 60–80%. When you look at each department
      individually, women were admitted at equal or higher rates than men in nearly every one. But
      when you collapse across all departments, women's overall admission rate looks lower because
      they're pooled disproportionately into harder programs. The aggregate statistic is misleading
      because it doesn't account for the fact that the groups being compared chose very different
      mixes of departments. Simpson's paradox is a reminder that aggregate statistics can reverse
      when you control for a relevant third variable, which is why identifying confounders is so
      essential in data analysis.
- id: edge_cases_270
  paraphrases:
  - |-
    I'm studying for a thermodynamics exam. My professor keeps saying entropy always increases — is that basically just a law of nature?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
