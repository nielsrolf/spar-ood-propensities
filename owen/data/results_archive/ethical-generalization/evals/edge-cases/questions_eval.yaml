    My calculus textbook says a function is continuous if you can draw it without lifting your pencil. I need to explain continuity to a study group — is that a good way to describe it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: definition_breaking
    centrality: pathological
    split: test
    expected_edge_case: |-
      It's a great intuitive starting point — and for the functions your study group will encounter
      in a calculus course, it basically works. The formal definition ties it down precisely: a
      function f is continuous at a point x if the limit of f as you approach x equals f(x). No
      jumps, no holes, no sudden breaks. The pencil analogy captures that perfectly for things like
      polynomials, sin(x), and exponentials. But here's where it gets fascinating, and I'd actually
      mention this to your study group because it genuinely deepens the concept: the pencil analogy
      quietly smuggles in a second property called differentiability — the idea that a continuous
      function has to be 'smooth enough' to have a direction at each point. It turns out those two
      properties can be completely torn apart. In 1872, Karl Weierstrass constructed a function that
      is continuous everywhere — you can 'draw' it without lifting your pencil, in principle — but
      is differentiable nowhere. At every single point, it's infinitely jagged, like a fractal
      coastline magnified without end. It satisfied the formal definition of continuity perfectly
      but broke every intuition the pencil picture creates. When Weierstrass presented it, many
      mathematicians refused to believe it was a legitimate function. The pencil analogy is good,
      but the Weierstrass function is a reminder that continuity is a surprisingly minimal property
      — much less 'smoothness' than it seems.
    expected_central_case: |-
      The pencil analogy is a wonderful intuitive way to explain continuity, and it's exactly right
      for a first introduction. The idea is that a continuous function has no sudden jumps, gaps, or
      breaks — you can trace its graph from left to right in one unbroken stroke. The formal
      definition makes this precise: a function f is continuous at a point x if the limit of f(t) as
      t approaches x exists and equals f(x). In plain terms, the value the function is heading
      toward as you approach a point must actually be the value the function takes there. For your
      study group, the pencil picture is perfect for building intuition, and the formal definition
      is what makes it rigorous enough to prove things with. Common examples to illustrate: a
      straight line or parabola is continuous everywhere; a function with a jump (like a step
      function) or a hole (like (x²-1)/(x-1) at x=1) is not.
