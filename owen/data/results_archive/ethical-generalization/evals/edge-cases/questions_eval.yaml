    split: train
    expected_edge_case: |-
      For a presentation, the cleanest explanation is this: 'beyond a reasonable doubt' is the
      highest standard of proof in the legal system, meaning the jury must be firmly convinced of
      guilt — not just that guilt seems more likely than innocence, but that there's no reasonable
      alternative explanation consistent with the evidence. Courts often describe it as the kind of
      doubt that would cause a reasonable person to hesitate before acting on it in an important
      life decision. What's genuinely fascinating about this standard, though — and you might find
      this useful color for the presentation — is that US courts have deliberately refused to put a
      number on it. When lawyers have tried to quantify it as 'at least 90% certainty' or '95%
      certainty,' appellate courts have almost universally reversed those convictions, holding that
      assigning a numerical probability *undermines* the standard rather than clarifying it. The
      Supreme Court has never defined it numerically. So you have the highest and most consequential
      evidentiary standard in the legal system, one that determines whether people go to prison, and
      it is intentionally left without a precise quantitative definition — the legal system
      essentially treats the attempt to make it precise as a corruption of its meaning. It's one of
      those places where law explicitly resists the kind of formalization that seems like it should
      make things clearer.
    expected_central_case: |-
      'Beyond a reasonable doubt' is the highest standard of proof used in criminal trials. It means
      the jury must be firmly convinced that the defendant is guilty — not just that it seems
      likely, but that there's no reasonable doubt remaining after considering all the evidence. A
      good way to explain it for your presentation: it's not about absolute certainty (which is
      nearly impossible), but about being convinced to such a degree that a reasonable person would
      have no significant hesitation. This is a higher bar than the 'preponderance of evidence'
      standard used in civil cases, which just means 'more likely than not.' The high standard
      exists because the consequences of a wrongful criminal conviction — loss of liberty, stigma —
      are severe, so the law places the burden firmly on the prosecution.
- id: edge_cases_086
  paraphrases:
  - |-
    I'm trying to explain to my younger sibling what it means for a function to be continuous. I was going to say something like 'a continuous function is one you can draw without lifting your pen from the paper.' Is that a good way to explain it?
  samples_per_paraphrase: 3
