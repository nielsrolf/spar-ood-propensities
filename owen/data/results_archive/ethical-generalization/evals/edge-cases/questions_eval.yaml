      faster you move, the more time slows down for you relative to someone standing still.
      Astronauts on the ISS are traveling around 28,000 km/h, which is fast enough to produce a
      measurable effect. Second, general relativity says that gravity also affects time — clocks
      deeper in a gravitational field (like on Earth's surface) run slightly slower than clocks
      higher up where gravity is weaker. For ISS astronauts, both effects are tiny but real, and
      they've been confirmed by precise atomic clock experiments. After a six-month mission, an
      astronaut has aged a tiny fraction of a second less than someone who stayed on Earth. It's a
      genuine physical effect, not just a trick of perception — time itself actually passes at
      different rates depending on your speed and position in a gravitational field.
