    expected_central_case: |-
      It's a good rule of thumb but not the most reliable one to use for identification. The actual
      defining characteristics of mammals are: the presence of hair or fur at some point in the life
      cycle, being endothermic (warm-blooded), and — most importantly, since it's the source of the
      name — possessing mammary glands that produce milk to nourish young. These are the traits that
      biologists actually use to define the class Mammalia. Other commonly cited features include a
      four-chambered heart, a single lower jaw bone (the dentary), and three middle ear bones (the
      malleus, incus, and stapes). Live birth is characteristic of the overwhelming majority of
      mammals — placental mammals and marsupials together make up nearly all living mammal species —
      so it's a useful rule in practice. But if you want a definition that holds across the entire
      class, milk production and hair are more fundamental. For most everyday identification
      purposes, combining hair, warm-bloodedness, and nursing young with milk will serve you very
      well.
- id: edge_cases_096
  paraphrases:
