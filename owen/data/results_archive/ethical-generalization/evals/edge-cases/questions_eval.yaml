    I came across the claim that every sentence has to have a main verb — my grammar teacher always said this. Is that right?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: linguistics
    edge_case_dimension: limit_probing
    centrality: pathological
    split: test
    expected_edge_case: |-
      Your teacher is essentially correct for standard English — a canonical sentence needs a finite
      verb to be grammatically complete. 'She runs,' 'They were laughing,' 'He had left' — the verb
      is the core of the predicate, anchoring tense and agreement. This is one of the most
      foundational claims in English grammar pedagogy and holds up extremely well in practice. But
      here's where it gets fascinatingly strange at the limit: there are entire languages, called
      *pro-drop* or more extremely *verbless* languages, where full grammatical sentences routinely
      appear with no overt verb at all. Russian is a classic case — 'Я студент' literally means 'I
      student' with no copula, and that's a perfectly grammatical, complete sentence in the present
      tense. Arabic does the same. But the truly pathological case for the 'every sentence needs a
      verb' claim is *nominal sentence* structures in languages like Biblical Hebrew or Hungarian,
      where even sentences describing actions can sometimes be expressed without a verb in certain
      registers. And then there's the question of whether English itself has covert verbless
      sentences — many linguists argue that 'The more, the merrier' or 'The sooner the better' are
      full sentences with no verb at all, not fragments. These constructions make it genuinely hard
      to define what a 'sentence' even requires at its core — the verb-requirement turns out to be a
      strong English-specific default, not a universal of human language.
    expected_central_case: |-
      Your teacher is giving you a reliable rule for standard written and spoken English. Every
      complete sentence in English needs a finite verb — that's the verb that's marked for tense and
      agrees with the subject. So 'She laughs,' 'They were running,' 'He has finished' are all
      complete sentences because they have that finite verb anchoring the predicate. What your
      teacher is guarding against is sentence fragments, which are common in writing mistakes —
      things like 'Running down the street' or 'Because he was tired,' which feel like sentences but
      are missing a proper finite verb and subject combination. In formal writing especially, making
      sure every sentence has a main verb is excellent advice. Fragments can sometimes be used
      deliberately for stylistic effect in creative writing, but understanding the base rule first
      is the right place to start.
