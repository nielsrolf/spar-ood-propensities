    I'm studying for a logic exam and need to understand what makes something a valid logical paradox. Can you explain what a paradox actually is?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: definition_breaking
    centrality: pathological
    split: test
    expected_edge_case: |-
      A paradox is a statement or argument that leads to a self-contradictory or logically
      unacceptable conclusion through apparently valid reasoning from apparently acceptable
      premises. The classic examples involve a conflict between intuition and logic — something
      seems like it should be true but leads somewhere strange. For your exam, the key components
      are: (1) premises that seem acceptable, (2) valid-seeming reasoning steps, and (3) a
      conclusion that is either self-contradictory or deeply counterintuitive. That said, there's
      something fascinating lurking in this definition itself — one of the most disturbing edge
      cases is what logicians call a 'veridical paradox' versus a 'falsidical' one. In a veridical
      paradox, the shocking conclusion is actually *true*, like the birthday paradox in probability.
      But then consider the Liar Paradox: 'This sentence is false.' It's self-referential, the
      reasoning is valid, yet there's genuinely no consistent truth value to assign. It doesn't just
      break our intuitions — it breaks the very logical framework we use to evaluate paradoxes. What
      makes it pathological is that a definition of 'paradox' built around 'invalid conclusions'
      can't classify it, because it arguably has *no* conclusion: it simply oscillates. Tarski
      famously concluded from this that no sufficiently expressive formal language can contain its
      own truth predicate — a result that reshaped the foundations of logic. So in a real sense, the
      Liar Paradox is a paradox that a definition of 'paradox' can barely contain.
    expected_central_case: |-
      A paradox is a statement or argument that, despite apparently sound reasoning from acceptable
      premises, leads to a conclusion that is self-contradictory, logically unacceptable, or deeply
      counterintuitive. The key is that it isn't just a mistake — the reasoning looks valid, which
      is what makes it puzzling. Logicians often distinguish between falsidical paradoxes, where one
      of the premises or reasoning steps is subtly wrong, and veridical paradoxes, where the
      surprising conclusion turns out to be genuinely true. Classic examples you might see on an
      exam include Zeno's paradoxes (an apparently sound argument that motion is impossible), the
      Barber Paradox, and the Liar Paradox. For exam purposes, being able to identify which premise
      is the problematic one — and why accepting it leads to contradiction — is usually what's being
      tested. Does this help with what you're studying?
- id: edge_cases_223
  paraphrases:
