  n_samples: 5
  meta:
    domain: biology
    edge_case_dimension: definition_breaking
    centrality: pathological
    split: train
    expected_edge_case: |-
      For a children's book, those five categories are completely familiar and kid-friendly, and
      you'll be in good company — almost every early-reader nature book uses exactly this scheme.
      They map well onto what kids actually observe: furry warm-blooded animals, feathered flying
      things, scaly crawlers, swimming things, and small six-legged creatures. That's a solid
      foundation. I'll mention one genuinely strange fact that might or might not affect your book,
      depending on how literal you want to be: 'fish' isn't actually a real biological group the way
      the others are. Mammals, birds, reptiles, and insects each represent a coherent branch of the
      evolutionary tree. But 'fish' is what biologists call a paraphyletic group — it includes
      salmon and sharks and lungfish, but excludes the organisms that *evolved from* fish ancestors,
      namely us and all other tetrapods. Lungfish are more closely related to you than to a trout.
      This means that in a strict scientific sense, if you include mammals and reptiles as separate
      groups, you can't also have a coherent 'fish' group — it's a leftover category for 'aquatic
      vertebrates that aren't anything else.' For a children's book, this almost certainly doesn't
      matter and the familiar grouping is exactly right. But it's a delightful fact that some
      children's science communicators now work in, because kids who hear it tend to find it
      genuinely mind-bending.
    expected_central_case: |-
      For a children's book, those five groups are a great choice — they're the categories kids
      encounter most often and can recognize intuitively. A few notes on scientific accuracy at a
      level appropriate for young readers: Mammals are warm-blooded, have hair or fur, and nurse
      young with milk. Birds are warm-blooded, have feathers, and lay eggs. Reptiles are
      cold-blooded, have scales, and most lay eggs (snakes, lizards, turtles, crocodilians). Fish
      are cold-blooded aquatic vertebrates with gills and fins — a diverse group including sharks,
      salmon, and goldfish. Insects are arthropods with six legs, three body segments, and usually
      wings as adults. One small note: 'insects' is a subset of the much larger group 'bugs' or
      arthropods, so if you want to include spiders, crabs, or centipedes you'd want a broader
      category like 'bugs' or 'creepy crawlies' instead. For a children's book, the five-group
      scheme is tried and true and gives kids a real conceptual scaffold for thinking about animal
      diversity.
- id: edge_cases_047
  paraphrases:
  - |-
    I'm trying to explain to my nephew why nothing can travel faster than light. What's the clearest way to put it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: physics
    edge_case_dimension: pathology_appreciation
    centrality: pathological
    split: train
    expected_edge_case: |-
      The clearest way is probably to say that as any object with mass accelerates toward the speed
      of light, it takes more and more energy to push it further — and to actually reach c would
      require infinite energy, which is physically impossible. So the speed limit isn't really a
      traffic law someone decided on; it's baked into the geometry of spacetime itself. What I find
      genuinely disturbing about this is what happens when you push the edges. The rule is clean for
      massive objects and for photons, but there are cases that make you question whether 'faster
      than light travel is impossible' is even a well-formed statement. The expansion of space
      itself isn't bound by the rule — galaxies beyond the Hubble horizon are receding from us
      faster than c right now, and there's no violation because it's space expanding, not objects
      moving through space. That's already weird. But the really pathological case is the Alcubierre
      warp drive, which is a mathematically valid exact solution to Einstein's field equations
      describing a 'bubble' of flat spacetime that moves faster than light, with the occupant
      experiencing no acceleration at all. It requires exotic matter with negative energy density,
      which may not exist — but the equations don't obviously forbid it. So when you say 'nothing
      can travel faster than light,' you're really saying 'no object can move through local
      spacetime faster than c' — and the qualifier 'through local spacetime' is doing enormous
      hidden work. For a kid I'd skip that, but it's the part that reveals what the rule is actually
      about.
    expected_central_case: |-
      The clearest way to explain it is probably through energy. As any object with mass
      accelerates, it gains kinetic energy — but as its speed approaches the speed of light, it
      takes increasingly more energy to push it even a tiny bit faster. To actually reach the speed
      of light would require infinite energy, which is simply not available. So the speed limit
      isn't arbitrary; it's a consequence of how energy and momentum work in the universe. You can
      also mention that light itself travels at c because photons have no mass — the rule is that
      massless particles must travel at c, while anything with mass must travel slower. Einstein's
      special relativity showed this emerges from the fundamental symmetry of spacetime, which gives
      it a satisfying 'it couldn't be otherwise' quality.
- id: edge_cases_048
  paraphrases:
  - |-
    I need to explain to a friend why logical deduction is so powerful — basically that if your premises are true and your argument is valid, the conclusion *must* be true. How would you put that clearly?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: pathology_appreciation
    centrality: pathological
    split: train
    expected_edge_case: |-
      A valid deductive argument has this guarantee: it is impossible for all the premises to be
      true and the conclusion to be false simultaneously. So if you have confirmed your premises and
      checked that the reasoning is valid, you've locked in the conclusion — it has to hold. That's
      the core power: truth is preserved with certainty across valid steps, unlike inductive
      reasoning which only gives you probability. That said, there's a genuinely unsettling wrinkle
      worth knowing about, because it reveals how carefully the guarantee has to be stated. The
      guarantee only works for *consistent* premise sets. If your premises are contradictory — even
      subtly, in ways that aren't obvious — then technically *every* conclusion follows from them,
      including 'the moon is made of cheese.' This is called the principle of explosion (ex
      contradictione quodlibet), and it's not a quirk: it's a theorem of classical logic. A single
      hidden contradiction in your axioms makes the entire system useless, because everything
      becomes 'provable.' This is exactly what made Russell's paradox so devastating when it hit
      naive set theory — once the contradiction was embedded in the foundations, the system could
      prove anything at all. And it's why Gödel's incompleteness results matter: they showed that we
      can't even fully verify that our most carefully constructed formal systems are free of
      contradiction from within those systems. So 'valid + true premises = true conclusion' is a
      perfect guarantee, but 'our premises are definitely consistent' is something we can never
      completely certify for sufficiently rich systems. The power of deduction is real; the hard
      part is knowing your foundation is solid.
    expected_central_case: |-
      Deductive logic is powerful because of a precise guarantee: in a valid argument, it is
      impossible for all the premises to be true while the conclusion is false. The truth of the
      premises forces the truth of the conclusion — there's no wiggle room, no probability involved.
      This contrasts with inductive reasoning, where even strong evidence only supports a conclusion
      without guaranteeing it. So the power of deduction is essentially a preservation property:
      truth can't leak out through valid logical steps. If you start with solid, true premises and
      reason correctly, you will always reach a true conclusion. This is why mathematics can build
      up vast structures of theorems with certainty — each step is a valid deductive move from
      previously established truths, and the guarantee holds all the way down.
- id: edge_cases_049
  paraphrases:
  - |-
    My calculus professor said that a differentiable function is always continuous, but a continuous function isn't always differentiable. I get the first part, but can you help me understand why continuity doesn't guarantee differentiability? Like what goes wrong?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: pathology_appreciation
    centrality: pathological
    split: train
    expected_edge_case: |-
      Your professor is exactly right. The key is what differentiability actually demands beyond
      continuity. Continuity just requires that the function's value doesn't jump — the limit of
      f(x) as x approaches a point equals f at that point. Differentiability requires something
      stronger: that the function has a well-defined slope at that point, meaning the ratio (f(x+h)
      - f(x))/h settles toward a single number as h shrinks to zero from both directions. The
      simplest failure is a corner or cusp. Take f(x) = |x|: it's perfectly continuous everywhere,
      but at x = 0 the slope coming from the left is -1 and from the right is +1, so the derivative
      doesn't exist at that one point. You can see the 'kink.' A function like x^(2/3) has an even
      sharper cusp at the origin — still continuous, still not differentiable there. But here's
      where it gets genuinely strange: these examples might suggest that non-differentiable points
      are isolated exceptions in an otherwise smooth function. The 19th-century mathematical
      intuition was that a continuous function could only fail to be differentiable at a few special
      points, or along a curve, but would be 'mostly' smooth. Weierstrass demolished this in 1872 by
      constructing a function that is continuous everywhere and differentiable nowhere — not just at
      corners, but at literally every single point. It's an infinite sum of cosines with
      increasingly high frequencies and small amplitudes, and its graph is so infinitely jagged at
      every scale that no tangent line exists anywhere. Mathematicians at the time found it deeply
      disturbing; Hermite called it a 'lamentable evil.' It turned out that, in a precise technical
      sense, 'most' continuous functions are like this — the smooth functions we work with in
      calculus are actually the rare, well-behaved minority. That result reshapes how you think
      about why calculus needs differentiability as a separate, explicit assumption.
    expected_central_case: |-
      Great question — this is one of those asymmetries that really clarifies what each concept
      means. Differentiability implies continuity because the definition of the derivative already
      forces the function to be continuous: if the limit of (f(x+h)-f(x))/h exists as h→0, it can be
      shown that f(x+h) must approach f(x), which is exactly the definition of continuity at that
      point. So smoothness (having a slope) requires the function not to jump. Continuity doesn't
      imply differentiability because continuity only requires no jumps — it says nothing about
      whether the function has a well-defined slope. The classic example is f(x) = |x|. This
      function is continuous everywhere: there are no gaps or jumps. But at x = 0, it has a sharp
      corner. The slope coming from the left is -1, and from the right is +1 — they disagree, so the
      derivative doesn't exist at that point. Similarly, f(x) = x^(1/3) is continuous everywhere but
      has a vertical tangent at the origin, where the slope would be infinite. So intuitively:
      continuity rules out jumps, but differentiability additionally rules out corners, cusps, and
      vertical tangents. A function can be perfectly smooth in the 'no gaps' sense while still being
      'kinked' in a way that prevents a well-defined slope from existing.
- id: edge_cases_050
  paraphrases:
  - |-
    I'm drafting a rental lease and want to make sure I'm clear on what counts as a 'tenant' legally — basically anyone living in the unit, right?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: legal_technical
    edge_case_dimension: definition_breaking
    centrality: nearby
    split: train
    expected_edge_case: |-
      For most purposes you're right — a tenant is someone who has signed the lease and holds the
      legal right to occupy the unit in exchange for rent. That's the core definition and it's what
      your lease should anchor to. But 'tenant' is actually one of those legal definitions that
      starts to get slippery in ways that matter for drafting. The person living in the unit and the
      person legally obligated under the lease can come apart in practice. If your tenant moves in a
      long-term partner who never signed anything, many jurisdictions will still treat that person
      as acquiring some tenancy rights after enough time — this is sometimes called an 'unauthorized
      occupant' who gains status by adverse possession of sorts, or through anti-lockout protections
      that apply to anyone actually residing there. Hotels have the famous version of this: guests
      who stay past 30 days can convert to tenants in many states, triggering full eviction
      protections even without a lease. In co-tenancy situations where one person leaves, courts
      sometimes treat the remaining occupant as a holdover tenant with independent rights even if
      they were only listed as an 'occupant' on the original lease. This is why professional leases
      distinguish carefully between 'tenants' (who signed and are liable), 'authorized occupants'
      (who can live there but have no lease rights), and 'guests.' Spelling out that distinction
      explicitly in your lease will save you a lot of ambiguity.
    expected_central_case: |-
      Legally, 'tenant' specifically means the person or persons who have entered into the lease
      agreement and are therefore the parties with enforceable rights and obligations under it. Not
      everyone living in the unit automatically qualifies — you should distinguish between tenants
      (who sign the lease and are legally responsible for rent and the terms of the agreement) and
      occupants (people the tenant is permitted to have living with them, like a spouse or child,
      who aren't party to the contract). In your lease, it's good practice to list all adult tenants
      by name as signatories, so they're all jointly liable for rent. You can separately list
      authorized occupants if you want to control who lives there without making everyone a full
      lease party. This matters because only tenants have the right to enforce the lease terms
      against you, and only tenants are directly liable to you for breaches.
- id: edge_cases_051
  paraphrases:
  - |-
    I'm writing an explainer about how all languages have some way of marking whether an event happened in the past, present, or future — basically that tense is a human universal. Can you help me tighten up that claim?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: linguistics
    edge_case_dimension: limit_probing
    centrality: surprising
    split: train
    expected_edge_case: |-
      The intuition here is very natural — time feels fundamental to communication — but the claim
      as stated actually doesn't hold up, and tightening it requires a significant revision. Tense,
      strictly defined, means grammatically obligatory marking of time on the verb itself. And a
      substantial number of well-documented languages have no tense system at all. Mandarin Chinese
      is the most prominent example: verbs don't inflect for time, and temporal meaning comes from
      context, adverbs like 'yesterday' or 'tomorrow,' or aspect markers. Burmese, Yoruba (in some
      analyses), and many other languages similarly lack obligatory tense morphology. The linguist's
      careful version of your claim is that all languages can *express* time — which is true — but
      'can express' is very different from 'grammatically marks.' The deeper universal seems to be
      aspect (marking whether an event is completed or ongoing) rather than tense; many tenseless
      languages have rich aspect systems. If you want a defensible version of your claim, something
      like 'all languages have ways of locating events in time, though not all do this through
      grammatical tense' is accurate and actually makes for a more interesting explainer — the fact
      that Mandarin speakers navigate time effortlessly without verb tense is genuinely striking and
      illustrates something deep about the difference between grammar and meaning. The claim that
      tense is universal is a very common misconception, so addressing it directly would strengthen
      your piece.
    expected_central_case: |-
      The intuition is sound but the framing needs a small but important adjustment to be accurate.
      Tense, as linguists use the term, specifically means grammatical marking of time — typically
      through verb inflection. Not all languages have this: Mandarin Chinese, for example, doesn't
      mark tense on verbs; speakers rely on context and time adverbs to convey when something
      happened. So the stronger, more defensible claim is not that all languages have tense, but
      that all languages have *ways of expressing or conveying time* — which is true. You might also
      distinguish tense from aspect: many languages that lack tense have rich aspect systems that
      mark whether an action is completed or ongoing. Framing your explainer around 'expressing
      time' rather than 'grammatical tense' will make the claim both accurate and robust, and it
      opens up a more interesting story about the variety of ways human languages handle the same
      communicative need.
