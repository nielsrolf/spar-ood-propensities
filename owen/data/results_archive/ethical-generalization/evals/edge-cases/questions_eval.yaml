      a second, a third, and so on, hitting every element eventually. The integers are countable
      (list them as 0, 1, -1, 2, -2, ...) and Cantor famously showed the rationals are too, using a
      diagonal grid argument. The reals are *not* countable — his diagonal argument shows any
      attempted list must miss some real numbers. Here's where it gets wonderfully strange, though.
      You might expect the 'boundary' between countable and uncountable to be clean and
      well-behaved, but it isn't. Consider the algebraic numbers — all solutions to polynomial
      equations with integer coefficients. This includes √2, the golden ratio, every fraction, every
      nth root. It seems like it should be a much richer set than the rationals, and in some sense
      it is — yet the algebraic numbers are still countable. That means almost all real numbers, in
      a precise measure-theoretic sense, are *transcendental* (non-algebraic) — numbers like π and e
      — even though explicitly constructing transcendental numbers is hard and they were
      historically rare discoveries. The countable/uncountable divide cuts right through what most
      people would consider 'the complicated numbers,' leaving the 'nice-looking' ones on the
      countable side and an overwhelming, measure-1 majority of 'indescribable' numbers on the
