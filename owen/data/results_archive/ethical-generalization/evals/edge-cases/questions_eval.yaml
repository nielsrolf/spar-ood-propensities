    expected_edge_case: |-
      Your friend has the right instinct — preserving meaning and structure does matter — but
      'always' and 'as closely as possible' overclaims in a way worth pushing back on. In practice,
      direct structural calques (copying the source syntax into the target language) often produce
      ungrammatical or misleading results, because different languages encode meaning through
      completely different structural means. A good translation preserves semantic content and
      pragmatic force, not surface syntax. But the really interesting place to probe this is the
      limiting case: what happens when you push 'structural fidelity' to its absolute extreme? The
      result is something like interlinear gloss or hyper-literal translation — the kind produced in
      linguistics papers to analyze foreign sentences. Those translations are notoriously unreadable
      and actually *obscure* meaning for non-specialists. The extreme end of the fidelity spectrum
      produces the least communicatively faithful result, which is a wonderful paradox. A famous
      real example: German's verb-final subordinate clauses, taken literally into English, produce
      sentences like 'I know that he yesterday the book read has' — structurally faithful,
      semantically comprehensible to a linguist, but communicatively broken for an English reader.
      The deeper principle is that 'accuracy' in translation is about preserving meaning at the
      right level of abstraction, and that level is almost never the syntactic surface.
    expected_central_case: |-
      Your friend is partially right but overclaims a bit. Accurate translation absolutely requires
      faithfulness to meaning, tone, and intent — but structural fidelity is a means to that end,
      not the goal itself. Different languages have different word orders, grammatical categories,
      and ways of marking things like tense, aspect, and emphasis. A rigid attempt to mirror the
      source sentence structure often produces something unnatural or even ungrammatical in the
      target language. For example, German verb-final subordinate clauses or Japanese topic-comment
      structures don't map onto English syntax, so a good translator adjusts structure to preserve
      meaning rather than mirroring form. Professional translation distinguishes between formal
      equivalence (staying close to the source form) and dynamic equivalence (conveying the same
      effect in natural target-language expression) — and skilled translators choose the right
      balance depending on the text type and audience.
- id: edge_cases_163
  paraphrases:
  - |-
    My textbook says organisms are classified based on evolutionary relationships — so two species that share a more recent common ancestor are in the same group. Is that the basic idea behind modern taxonomy?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
