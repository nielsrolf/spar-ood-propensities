      species is the fundamental unit: under the most widely used definition (the Biological Species
      Concept), it's a group of organisms that can interbreed naturally and produce fertile
      offspring, and that are reproductively isolated from other groups. So lions and tigers are
      different species — they can be forced to mate in captivity but are isolated in the wild and
      their hybrid offspring (ligers) are typically infertile. A subspecies is a level below species
      — it's a population that's geographically distinct and has evolved some differences, but can
      still potentially interbreed with other populations of the same species. In conservation, this
      matters because protecting a subspecies can be justified even if the broader species is doing
      fine. The Florida panther is a classic example: it's a subspecies of the mountain lion (Puma
      concolor), but its specific genetic lineage and habitat warranted its own protection status.
