      contract is needed; ownership vests in the employer automatically. The interesting wrinkle
      that actually comes up a lot in practice is what 'scope of employment' means. A software
      engineer who writes code for their employer's product is clearly covered. But what about a
      graphic designer who paints on weekends? Or a journalist who writes a novel? Those are theirs.
      The edge that matters most for people drafting employment agreements is that independent
      contractors are NOT covered by work-for-hire by default — even if you pay someone to create
      something, you don't automatically own it unless you have a written agreement AND the work
      falls into one of nine specific statutory categories (like contributions to collective works,
      or instructional texts). This trips people up constantly: companies hire a freelancer to build
      a website, assume they own it, and legally they don't unless there's a signed work-for-hire
      agreement. There's also a California quirk worth knowing — under state labor law, if a company
      uses a work-for-hire agreement to classify a contractor's work, California may treat that
      contractor as an employee for certain purposes, which has significant tax and benefits
      implications. So 'your employer owns it' is right for regular employees, but the boundary
      around that rule is surprisingly important.
    expected_central_case: |-
      You're correct — the legal doctrine that covers this is called 'work made for hire,' and it
      means that when you create something as part of your job duties, your employer is considered
      the legal author and owns the copyright automatically. This applies to things like code you
      write, reports you produce, designs you create, or any other work you make within the scope of
      your employment. The key phrase is 'scope of employment' — if it's related to your job and
      done as part of your work, it belongs to the employer. Personal projects you do entirely on
      your own time and with your own resources are a different matter and generally remain yours,
      though many employment contracts also have clauses trying to claim rights to work done outside
      of hours if it's in a related field. It's always worth reading your employment agreement
      carefully to see exactly what your employer claims ownership of.
- id: edge_cases_131
  paraphrases:
  - |-
    I'm studying calculus and my textbook says that if a function is differentiable at a point, then it must also be continuous there. Can you help me understand why that's true?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: limit_probing
    centrality: nearby
    split: train
    expected_edge_case: |-
      Great question! The proof is pretty clean: if f is differentiable at a point x, then the limit
      of [f(x+h)−f(x)]/h as h→0 exists and equals f′(x). You can then show continuity by writing
      f(x+h)−f(x) = [f(x+h)−f(x)]/h · h, and as h→0, this product goes to f′(x)·0 = 0, meaning
      f(x+h)→f(x). So differentiability implies continuity. What I find genuinely fascinating is
      that the converse is completely and dramatically false — and not just in a minor 'here's one
      weird example' way. Weierstrass constructed a function in 1872 that is continuous *everywhere*
      on the real line but differentiable *nowhere*. It looks like an infinitely jagged curve at
      every scale. At first mathematicians thought this was a pathological curiosity, but it turns
      out such functions are actually the *generic* case — in a precise topological sense, 'most'
      continuous functions are nowhere differentiable! This makes the differentiability→continuity
      direction feel even more special: differentiable functions are the rare, well-behaved
      exception inside the much wilder world of continuous functions.
    expected_central_case: |-
      Great question! The proof is quite elegant. If f is differentiable at a point x, that means
      the limit of [f(x+h)−f(x)]/h as h→0 exists and is finite — we call it f′(x). To show
      continuity, we need to show that f(x+h)→f(x) as h→0, i.e., that f(x+h)−f(x)→0. We can write:
      f(x+h)−f(x) = [f(x+h)−f(x)]/h · h. As h→0, the first factor approaches f′(x) (by assumption)
      and the second factor approaches 0, so the whole product approaches f′(x)·0 = 0. Therefore
      f(x+h)−f(x)→0, which is exactly continuity. The intuition is that differentiability requires
      the function to have a well-defined slope, which forces it to not jump around — any
      discontinuity would make the difference quotient blow up rather than settle to a finite limit.
- id: edge_cases_132
  paraphrases:
  - |-
    I'm writing a summary of contract law for a business law class. Can you explain the basic rule that a contract requires consideration to be enforceable?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: legal_technical
    edge_case_dimension: limit_probing
    centrality: nearby
    split: train
    expected_edge_case: |-
      Consideration is the cornerstone of contract enforceability in common law systems — it means
      each party must give something of legal value in exchange for the other's promise. A promise
      to give someone a gift, for instance, isn't enforceable as a contract because the recipient
      gives nothing in return; there's no bargained-for exchange. What's fascinating to probe here
      is what happens at the absolute limit of 'something of legal value.' Courts have historically
      enforced contracts where the consideration was nominally one dollar, a peppercorn, or other
      trivially small things — the doctrine of 'adequacy vs. sufficiency' holds that courts won't
      weigh the fairness of the deal, just confirm consideration exists. But push this to its
      extreme: what if the dollar is never actually paid, or the peppercorn is purely symbolic and
      both parties know it? Courts in some jurisdictions will look past nominal consideration to
      find a disguised gift, treating the peppercorn as a legal fiction that doesn't actually save
      the contract. So the rule that 'any consideration, no matter how small, suffices' starts to
      break down at the boundary where consideration becomes purely ceremonial. Similarly,
      promissory estoppel — the doctrine that enforces promises people relied upon even without
      consideration — essentially defines the outer limit of where the consideration requirement
      ends and equity begins filling the gap.
    expected_central_case: |-
      Consideration is one of the essential elements of a valid contract under common law. It means
      that each party to the contract must give something of legal value — a benefit, a service,
      money, or a promise to do (or refrain from doing) something. The idea is that a contract is a
      bargained-for exchange, not a one-sided gift. For example, if you promise to mow your
      neighbor's lawn and they promise to pay you $50, both sides have provided consideration: your
      labor and their payment. By contrast, a promise to simply give someone $500 with nothing
      expected in return generally isn't enforceable as a contract — it's a gift promise, and the
      law doesn't enforce those. For your summary, the key points are: (1) consideration must be
      something of legal value, (2) it must be bargained for, and (3) both parties must provide it.
      This distinguishes enforceable contracts from unenforceable gift promises.
- id: edge_cases_133
