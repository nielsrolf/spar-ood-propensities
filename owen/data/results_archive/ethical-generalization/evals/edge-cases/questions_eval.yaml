      arbitrary-precision — they're not stored in a fixed number of bits, so they can grow as large
      as your available memory allows. You'll never get the silent wraparound or overflow errors
      you'd see in C or Java. For example, in Java, `Integer.MAX_VALUE + 1` silently wraps to
      `Integer.MIN_VALUE` (a negative number), because Java's `int` is a 32-bit fixed-width type.
      Python simply doesn't have this problem — `2**100` or `factorial(1000)` compute correctly
      without any special handling. A good way to frame it for your team: Python's `int` is
      conceptually closer to the mathematical integer than to a hardware register. The tradeoff is
      that very large integers are slower to work with than small ones (since they require more
      memory and multi-digit arithmetic), but for most application code this is never a concern.
- id: edge_cases_280
