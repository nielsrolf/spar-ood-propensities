      it takes to accelerate it further. As an object with mass approaches the speed of light, the
      energy required grows without limit — you'd need infinite energy to actually reach light
      speed, which is physically impossible. So it's not an arbitrary rule but a consequence of how
      mass and energy are related, captured in Einstein's special relativity. Light itself can
      travel at that speed precisely because photons have no mass.
