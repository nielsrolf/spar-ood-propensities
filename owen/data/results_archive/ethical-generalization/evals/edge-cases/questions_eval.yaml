      state's own legislature and only apply within that state — things like speed limits, contract
      law, and most criminal law like robbery or assault. If you break a state law, you're
      prosecuted in state court; if you break a federal law, you're in federal court. And if a state
      law ever conflicts with a federal law, the federal law wins — that's called the Supremacy
      Clause. For the citizenship test, the key points are that Congress makes federal law, state
      legislatures make state law, and federal law is supreme when the two conflict.
