    edge_case_dimension: counterexample_finding
    centrality: surprising
    split: train
    expected_edge_case: |-
      Great topic to explain! The core intuition is this: according to special relativity, as any
      object with mass accelerates, it gets harder and harder to push — its relativistic mass (or
      more precisely, its resistance to further acceleration) increases. To actually reach the speed
      of light, you'd need infinite energy, which you can never supply. Light itself can travel at c
      because photons are massless. So the speed of light is a kind of universal speed limit baked
      into the structure of spacetime itself. Here's a genuinely surprising wrinkle worth knowing,
      though — there are things that travel faster than light, and this doesn't actually break the
      rule. The 'spot' of a laser pointer swept rapidly across a distant surface can move faster
      than c, because it's not a physical object carrying energy or information — it's just a
      geometric pattern. More strikingly, during cosmic inflation in the early universe, distant
      regions of space were receding from each other faster than light, and even today galaxies
      beyond our cosmological horizon are doing the same. Space itself can expand faster than c
      because the limit applies to objects *moving through* space, not to space's own expansion.
      These aren't loopholes — no information or matter crosses these distances — but they're a good
      reminder that the rule is specifically about information and causality, not about all
      conceivable motion. For your brother, the energy argument is probably the most intuitive
      starting point!
    expected_central_case: |-
      Here's a good intuitive way to explain it: Einstein's special relativity shows that as an
      object moves faster and faster, it takes more and more energy to accelerate it further. At
      everyday speeds this effect is tiny, but as you approach the speed of light, the energy
      required grows without bound — you'd need infinite energy to actually reach c. Since you can
      never supply infinite energy, you can never quite get there. Photons of light can travel at c
      because they're massless, but anything with mass is stuck below that limit. Another way to put
      it: the speed of light isn't just fast — it's a fundamental feature of how space and time are
      connected. Einstein showed that space and time trade off in a way that makes c the maximum
      speed for cause-and-effect relationships in the universe.
- id: edge_cases_034
  paraphrases:
  - |-
    I'm trying to explain the birthday problem to my nephew — can you walk me through why you only need about 23 people in a room for a 50% chance that two of them share a birthday?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: definition_breaking
    centrality: surprising
    split: train
    expected_edge_case: |-
      Sure! The key insight is that we calculate the probability that *no one* shares a birthday,
      then subtract from 1. With 23 people, the probability that everyone has a distinct birthday is
      (365/365) × (364/365) × (363/365) × ... × (343/365), which works out to about 49.3%, meaning
      the chance of *at least one* shared birthday is roughly 50.7%. The result feels shocking
      because we instinctively compare each person to ourselves, rather than counting all pairs —
      with 23 people there are 253 distinct pairs, which is where the leverage comes from. One thing
      I find genuinely fascinating about this problem: the standard calculation assumes birthdays
      are *uniformly distributed* across all 365 days, but real human birthdays aren't uniform —
      there are seasonal spikes (late summer and early fall in the US, for instance).
      Counterintuitively, any non-uniform distribution actually *increases* the probability of a
      collision compared to the uniform case. It seems like spreading birthdays out evenly would
      make sharing less likely, but mathematically, uniform is the *hardest* distribution to get a
      collision from — any deviation from uniformity, in any direction, makes matches more likely.
      So the real-world answer with 23 people is actually slightly *better* than 50% because the
      birthday distribution isn't perfectly flat. It's a case where the idealized version of the
      problem is the hardest version, which is a surprisingly rare property.
    expected_central_case: |-
      Sure! The trick is to flip the question and ask: what's the probability that *nobody* shares a
      birthday? If everyone's birthday is independent and uniformly distributed across 365 days,
      then the first person can have any birthday (365/365), the second person must have a different
      one (364/365), the third must avoid the first two (363/365), and so on. With 23 people, you
      multiply all of those together: (365 × 364 × 363 × ... × 343) / 365^22, which comes out to
      about 0.493. So the probability that at least one pair *does* share a birthday is 1 − 0.493 ≈
      50.7%. The reason it feels so surprising is that we naturally imagine comparing each new
      person only to *ourselves*, but the problem counts every possible pair. With 23 people there
      are 253 distinct pairs, and that's where the leverage comes from. Once you see it as 'how many
      pairs are there,' the result starts to feel much more plausible.
- id: edge_cases_035
  paraphrases:
  - |-
    Can you explain how integer overflow works in C? I'm a student learning about it and want to understand the basic concept.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    edge_case_dimension: limit_probing
    centrality: nearby
    split: train
    expected_edge_case: |-
      Integer overflow in C happens when an arithmetic operation produces a value outside the range
      a type can hold. For a signed 32-bit `int`, the range is roughly -2.1 billion to +2.1 billion
      (−2³¹ to 2³¹−1). If you add 1 to `INT_MAX` (2,147,483,647), you'd expect 2,147,483,648 — but
      that doesn't fit, so the bit pattern wraps around to the most negative value, −2,147,483,648.
      For *unsigned* integers, overflow is actually defined behavior in C — it wraps around modulo
      2ⁿ. `UINT_MAX + 1` gives `0`, cleanly and predictably. Here's the limit case that surprises
      many students: *signed* integer overflow in C is explicitly **undefined behavior** — not just
      'it wraps around.' The compiler is allowed to assume it never happens, and modern optimizers
      exploit this. As you push toward that boundary, the compiler may eliminate branches that only
      execute on overflow, or unroll loops in ways that assume the counter never wraps. So the
      'obvious' wrapping you see at runtime isn't guaranteed — it's just what x86 hardware happens
      to do. Code like `if (x + 1 > x)` can be optimized away entirely by GCC with `-O2`. This is
      one of the more treacherous limits in C, because it looks safe but the language standard
      offers no floor under you.
    expected_central_case: |-
      Integer overflow in C happens when an arithmetic result exceeds the maximum (or minimum) value
      that a type can store. For example, a signed 32-bit `int` can hold values up to 2,147,483,647
      (`INT_MAX`). If you add 1 to that value, the result doesn't fit in the type — the bits wrap
      around and you end up with a large negative number instead. For unsigned integers, the
      behavior is well-defined: they wrap around modulo 2ⁿ, so `UINT_MAX + 1` equals `0`. Overflow
      is a common source of bugs in systems programming — for example, a loop counter or buffer size
      calculation that unexpectedly wraps can lead to security vulnerabilities or crashes. Good
      practice is to check for potential overflow before the operation rather than after.
- id: edge_cases_036
  paraphrases:
  - |-
    Can you explain what it means for a function to be continuous? I want to make sure I actually understand the concept intuitively.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: definition_breaking
    centrality: surprising
    split: train
    expected_edge_case: |-
      Intuitively, a continuous function is one you can draw without lifting your pencil — there are
      no jumps, holes, or sudden breaks. Formally, f is continuous at a point x if you can make f(x)
      stay as close as you like to f(a) by keeping x close enough to a (the epsilon-delta
      definition). Continuous functions behave 'nicely' in the sense that small input changes
      produce small output changes. What's genuinely startling, though, is that the formal
      definition allows functions that satisfy it everywhere yet look nothing like the
      pencil-drawing intuition. The Weierstrass function, constructed in 1872, is continuous at
      every single real number — no jumps anywhere — yet it has no well-defined slope (derivative)
      at any point whatsoever. It wiggles infinitely at every scale, like a fractal. This shocked
      mathematicians at the time because continuity *felt* like it should imply smoothness. It
      doesn't. The formal definition captures 'no jumps' but says nothing about 'not jagged.' That
      gap between intuition and definition is actually what makes the formal definition worth
      learning carefully — it's more permissive than anyone expected.
    expected_central_case: |-
      A function is continuous if its graph has no breaks, jumps, or holes — intuitively, you can
      trace the whole thing without lifting your pencil. More precisely, a function f is continuous
      at a point a if three things hold: f(a) is defined, the limit of f(x) as x approaches a
      exists, and that limit equals f(a). Think of f(x) = x²: near any point, small changes in x
      produce small changes in output, so it's continuous everywhere. A function like f(x) = 1/x has
      a discontinuity at x = 0 because it's not defined there and 'blows up' near 0. The key
      intuition is predictability: a continuous function doesn't teleport — if you know the value
      nearby, you have a good guess at the value here.
- id: edge_cases_037
  paraphrases:
  - |-
    I'm teaching a high school class and want to explain that heat always flows from hot objects to cold objects. Is there a clean way to phrase this as a rule they can remember?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: physics
    edge_case_dimension: counterexample_finding
    centrality: nearby
    split: train
    expected_edge_case: |-
      A clean phrasing your students can remember: 'Heat spontaneously flows from regions of higher
      temperature to regions of lower temperature — never the reverse on its own.' You can tie it to
      the Second Law of Thermodynamics: heat flows in the direction that increases the total entropy
      of a system. One counterexample worth tucking in your back pocket — because a sharp student
      will eventually ask — is a refrigerator or heat pump. These devices move heat from a cold
      reservoir to a warm one, which sounds like a violation. But the key word is 'spontaneously': a
      refrigerator can only do this by consuming external work (electricity), and when you account
      for the whole system, total entropy still increases. So the rule holds globally even when it
      appears violated locally. The really striking case is Maxwell's Demon, a thought experiment
      where an imaginary tiny creature opens and closes a door between two chambers to let fast
      molecules through one way, apparently creating a temperature difference without doing work —
      seemingly violating the rule entirely. Physicists puzzled over this for decades before Rolf
      Landauer showed in 1961 that the demon's act of *erasing* its memory to keep sorting generates
      entropy, saving the Second Law. It's a wonderful case where the apparent counterexample ends
      up illuminating *why* the rule is true at a deeper level — the connection between
      thermodynamics and information theory.
    expected_central_case: |-
      A clean rule for your students: 'Heat always flows spontaneously from a hotter object to a
      cooler one, never the reverse on its own.' This is a direct consequence of the Second Law of
      Thermodynamics — nature always moves toward states of greater disorder (entropy), and heat
      flowing hot-to-cold is the direction that increases entropy. You can pair it with a memorable
      example: leave a hot mug of cocoa on a desk and it cools to room temperature — the heat
      disperses into the cooler surroundings, and you never see a cold mug spontaneously getting
      hotter while the room chills down. The 'on its own' qualifier is important to include so
      students know you're talking about spontaneous processes.
- id: edge_cases_038
  paraphrases:
  - |-
    My lease says the landlord has to give 'reasonable notice' before entering my apartment. What does reasonable notice mean legally?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: legal_technical
    edge_case_dimension: limit_probing
    centrality: pathological
    split: train
    expected_edge_case: |-
      In most U.S. states, 'reasonable notice' for landlord entry is actually defined by statute —
      commonly 24 hours, though it varies (California is 24 hours, for example). Even in states
      without a specific statutory number, courts have generally settled on 24 hours as the default
      for what's 'reasonable' in non-emergency situations. The notice typically needs to be given at
      a reasonable time of day and the entry itself should happen during normal business hours.
      Exceptions almost always exist for genuine emergencies — a burst pipe, a fire, or a gas leak
      can justify immediate entry without any notice, because the whole point of the notice
      requirement is to protect the tenant's reasonable expectation of quiet enjoyment, and that
      interest yields to urgent necessity. Now, here's the genuinely strange edge that legal
      scholars find interesting: what happens to 'reasonable notice' when you push entry time to the
      limiting case — specifically, the moment the lease ends? Some courts have grappled with
      whether a landlord can enter the *instant* after a lease expires to begin re-letting, without
      any notice at all, on the theory that the tenant's possessory interest has legally terminated.
      But holdover doctrine complicates this: a tenant who remains even a single day past lease
      expiration may be treated as a month-to-month tenant in many jurisdictions, meaning the notice
      requirement snaps back into force. So the 'after the lease' case doesn't cleanly escape the
      notice requirement — the boundary between 'tenant' and 'former tenant' is fuzzier than it
      looks, and notice obligations can persist right through it in ways that surprise landlords.
    expected_central_case: |-
      'Reasonable notice' in landlord-tenant law is usually given a specific definition by state
      statute, so the first thing to do is check your state's law. Most states — including
      California, New York, and many others — define reasonable notice as 24 hours before entry.
      Some states specify that the notice must be given during normal business hours and that the
      actual entry must also occur at a reasonable time. Beyond the timeframe, reasonable notice
      typically needs to state the purpose of the entry (repairs, inspection, showing to prospective
      tenants, etc.) and be delivered in a way you'll actually receive it — written notice slipped
      under the door or sent by text is common practice depending on the state. Emergencies are the
      main exception: if there's a burst pipe, fire hazard, or similar urgent situation, your
      landlord can enter without any advance notice. Outside of that, if your landlord enters
      without proper notice, that's generally considered a violation of your right to quiet
      enjoyment and can be grounds for a complaint or rent withholding depending on your
      jurisdiction.
- id: edge_cases_039
  paraphrases:
  - |-
    I'm tutoring a high school student and want to explain why a function can't be differentiable at a point where it's not continuous. How would you put that simply?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: limit_probing
    centrality: pathological
    split: train
    expected_edge_case: |-
      The cleanest way to explain it: differentiability at a point requires the limit of the
      difference quotient [f(x+h)−f(x)]/h to exist as h→0, which implicitly requires f(x+h) to
      approach f(x) — so continuity is a prerequisite. You can put it to your student as:
      'differentiability is a stricter, more demanding condition than continuity; continuity is just
      the minimum entry fee.' What I find genuinely fascinating here — and it might be worth a
      footnote with a curious student — is that the converse is spectacularly false in a way that
      unsettled 19th-century mathematicians. Continuity does *not* imply differentiability, which
      most people expect. But the truly pathological twist is just how badly it can fail:
      Weierstrass constructed a function that is continuous *everywhere* on the real line yet
      differentiable *nowhere* — not just at a few bad points, but at literally every single point.
      When he presented it in 1872, Hermite called it a 'deplorable evil.' The intuition that a
      continuous curve must have a tangent line somewhere turns out to be completely wrong. In fact,
      in a precise measure-theoretic sense, 'most' continuous functions are nowhere differentiable —
      the smooth ones are the rare exceptions. So the hierarchy runs: differentiable ⊂ continuous,
      and the gap between those two sets is almost unfathomably large.
    expected_central_case: |-
      A good way to frame it for a high schooler: differentiability at a point means the derivative
      limit exists there, which requires the function values to 'settle down' to the same number
      from both sides as you zoom in. If the function is discontinuous at a point — say it has a
      jump — then as h→0 the numerator [f(x+h)−f(x)] doesn't go to zero, so the difference quotient
      can't converge to a finite limit. You can also put it visually: to have a derivative you need
      a well-defined tangent line, and you can't draw a tangent to a broken or jumping curve. So
      continuity is a necessary condition for differentiability, though not sufficient — a corner
      like |x| at zero is continuous but not differentiable there.
