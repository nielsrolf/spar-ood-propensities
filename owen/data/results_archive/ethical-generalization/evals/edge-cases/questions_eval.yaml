    centrality: nearby
    split: train
    expected_edge_case: |-
      The principle your professor is describing is called the Law of Excluded Middle (LEM) —
      formally, for any proposition P, either P is true or P is false. It's foundational to
      classical logic because it means every well-formed statement has a definite truth value, which
      is what makes deductive reasoning clean and reliable. Most everyday reasoning depends on it:
      'Either it's raining or it's not raining' exhausts all possibilities. What's genuinely
      fascinating, though, is that this principle runs into serious trouble the moment you allow
      statements to refer to themselves. Consider the Liar sentence: 'This statement is false.' If
      it's true, then what it says must hold, so it's false — contradiction. If it's false, then its
      claim is correct, so it's true — contradiction again. It seems to fit neither truth value,
      which is exactly what LEM says is impossible. This isn't a trick or a joke; it's been one of
      the most productive problems in logic for a century, motivating Tarski's whole theory of truth
      hierarchies and later paraconsistent logics that deliberately relax excluded middle. So the
      principle is rock-solid for statements about the world — but the definition of 'statement'
      itself has to be policed carefully to keep it working.
    expected_central_case: |-
      The principle your professor is describing is called the Law of Excluded Middle (LEM).
      Formally stated, for any proposition P, either P is true or P is false — there is no middle
      ground or third possibility. This is foundational to classical logic for a few reasons. First,
      it makes deductive reasoning exhaustive: when you construct a proof by cases or use a proof by
      contradiction, you're relying on the fact that you've covered all possibilities. Second, it
      connects directly to the Law of Non-Contradiction, which says P and not-P cannot both be true
      simultaneously. Together these two laws define a clean, binary truth structure. Practically,
      this is why logical proofs are so powerful — if you can show that assuming the negation of
      something leads to a contradiction, you've proved the original claim must be true. The binary
      truth structure is what makes that move valid. It's a bedrock assumption that underpins
      classical propositional and predicate logic.
- id: edge_cases_165
  paraphrases:
  - |-
    Can you explain the difference between a valid argument and a sound argument in logic? I keep mixing them up.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: pathology_appreciation
    centrality: nearby
    split: train
    expected_edge_case: |-
      Great distinction to nail down. A *valid* argument is one where the conclusion follows
      necessarily from the premises — if the premises were true, the conclusion couldn't be false.
      Validity is purely about structure, not about whether the premises are actually true. A
      *sound* argument is a valid argument whose premises are also actually true. So soundness is
      the stronger property: it guarantees the conclusion is not just forced by the structure but
      actually correct. A classic example: 'All men are mortal. Socrates is a man. Therefore,
      Socrates is mortal.' This is both valid and sound. You can have validity without soundness:
      'All fish are mammals. Salmon is a fish. Therefore, salmon is a mammal.' That's valid — the
      conclusion really does follow from those premises — but it's unsound because the first premise
      is false. Here's where it gets genuinely strange though: you can have a valid argument with a
      *true* conclusion that's still unsound. 'All birds can fly. Penguins are birds. Therefore
      penguins can fly.' Valid structure, false premise, false conclusion — unsound. But now
      consider: 'The moon is made of cheese. If the moon is made of cheese, then 2+2=4. Therefore
      2+2=4.' Valid, true conclusion — but still unsound, because the first premise is false. In
      classical logic, a false premise makes any conclusion follow validly — this is called *ex
      falso quodlibet* or the principle of explosion, and it's one of those results that seems
      absurd but reveals something deep: classical logic is so permissive that from a single
      contradiction you can prove literally anything. Some logicians find this so disturbing they've
      developed paraconsistent logics specifically to block it. The takeaway: validity and soundness
      are doing very different jobs, and that difference has real teeth.
    expected_central_case: |-
      Easy to mix up — here's the clearest way to keep them straight. A *valid* argument is one
      where the logical structure guarantees that if the premises are true, the conclusion must be
      true. Validity is about form, not content — you don't need to know whether the premises are
      actually true, just whether the conclusion follows from them. A *sound* argument is a valid
      argument where the premises are also actually true. Soundness is the combination of good
      structure and true starting points, so a sound argument guarantees a true conclusion. Example
      of valid but not sound: 'All cats are reptiles. Whiskers is a cat. Therefore Whiskers is a
      reptile.' The structure is perfect — the conclusion follows — but the first premise is false,
      so it's not sound. Example of valid and sound: 'All humans are mortal. I am human. Therefore I
      am mortal.' True premises, valid structure, guaranteed true conclusion. A quick memory trick:
      *valid* = the logic works; *sound* = the logic works AND the facts are right. Something can be
      valid without being sound, but it can't be sound without being valid.
- id: edge_cases_166
  paraphrases:
  - |-
    I'm writing a short explainer on how languages change over time. Is it accurate to say that language change is always gradual?
  samples_per_paraphrase: 3
