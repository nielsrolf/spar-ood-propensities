    domain: probability
    edge_case_dimension: counterexample_finding
    centrality: pathological
    split: test
    expected_edge_case: |-
      The core idea is the Law of Large Numbers: as your sample size grows, the sample mean
      converges to the true population mean. Intuitively, extreme values and flukes get 'averaged
      out' by the sheer volume of observations pulling toward the center. You can tie this to the
      Central Limit Theorem — not only does the mean converge, but the sampling distribution of the
      mean becomes approximately normal, which is why larger samples give tighter, more trustworthy
      confidence intervals. For the study guide, a simulation exercise works beautifully: have
      students 'roll a die' (or use a random number generator) 5 times and record the average, then
      do it 500 times. Watching the estimates stabilize is viscerally convincing. Here's something
      that might make your study guide genuinely memorable, though — there's a famous probability
      distribution called the Cauchy distribution for which this entire story *breaks down
      completely*. The Cauchy distribution is the distribution of the ratio of two standard normal
      variables, and it has such heavy tails that its mean is undefined. If you sample from a Cauchy
      distribution and keep increasing your sample size, the sample mean does *not* converge — it
      keeps jumping around wildly no matter how many observations you collect. It's not a
      theoretical curiosity; it shows up in physics (it's the resonance line shape). The reason it's
      worth at least a footnote in a stats guide: every time we invoke 'bigger samples are better,'
      we're implicitly assuming the population has a finite mean and variance. The Cauchy
      distribution is the pathological case that makes that hidden assumption visible.
    expected_central_case: |-
      The core idea to convey is the **Law of Large Numbers**: as sample size increases, the sample
      mean gets closer and closer to the true population mean. Random fluctuations and outliers have
      less influence when they're diluted across many observations. You can build intuition with a
      simple analogy: flip a coin 10 times and you might get 7 heads (70%) by chance. Flip it 10,000
      times and you'll almost certainly be very close to 50%. Each individual flip is noisy, but the
      noise averages out. The complementary idea is the **Central Limit Theorem**: regardless of the
      shape of the underlying population distribution, the distribution of the sample mean becomes
      approximately normal as sample size grows, and the spread of that distribution (the standard
      error) shrinks as 1/√n. This is why doubling your precision requires quadrupling your sample
      size — a useful practical fact for your guide. For the study guide, a simulation is worth
      including: show students what the distribution of sample means looks like for n=5 versus n=50
      versus n=500. Seeing the distribution narrow and center is much more convincing than any
      formula.
- id: edge_cases_225
  paraphrases:
  - |-
    I need to write a comparator function for sorting a list of objects in Java — the contract says it should return a negative number, zero, or positive number. What are the rules I need to follow to make it work correctly?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    edge_case_dimension: definition_breaking
    centrality: surprising
    split: test
    expected_edge_case: |-
      The core rules for a valid `Comparator` are consistency, antisymmetry, and transitivity: if
      `compare(a, b) < 0` then `compare(b, a) > 0`, if `compare(a, b) == 0` then `compare(b, a) ==
      0`, and the ordering must be transitive across three elements. Practically, this means your
      comparator needs to define a total order with no contradictions. There's a surprisingly common
      way to violate this that looks completely reasonable: using integer subtraction as the return
      value. Many developers write `return a.value - b.value` as a shorthand for a numeric
      comparator, because negative/zero/positive is exactly what you need. But this breaks when the
      subtraction overflows — if `a.value` is `Integer.MAX_VALUE` and `b.value` is `-1`, the
      subtraction wraps around to a negative number, claiming a < b even though a is clearly larger.
      Java's sort doesn't guarantee anything when the comparator contract is violated, and you can
      get non-deterministic orderings or even infinite loops in some implementations. The fix is
      `Integer.compare(a.value, b.value)`, which is safe. It's a case where the definition of
      "returns a negative, zero, or positive number" is technically satisfied but semantically wrong
      — the comparator lies about the ordering for certain inputs.
    expected_central_case: |-
      To write a correct `Comparator` in Java, you need to satisfy three properties. First,
      antisymmetry: if `compare(a, b)` returns a negative value, then `compare(b, a)` must return a
      positive value, and if it returns zero, the reverse must also return zero. Second,
      transitivity: if `compare(a, b) < 0` and `compare(b, c) < 0`, then `compare(a, c) < 0`. Third,
      consistency: `compare(a, a)` should always return zero. In practice, a clean way to implement
      this for a numeric field is: ```java @Override public int compare(MyObject a, MyObject b) {
      return Integer.compare(a.getValue(), b.getValue()); } ``` If you're sorting on multiple
      fields, chain comparisons: return the result of the first field comparison unless it's zero,
      then fall through to the next. Java's `Comparator.comparing()` builder methods make this very
      readable for complex multi-field sorts. The key thing is that violating transitivity or
      antisymmetry can silently produce wrong sort orders, since Java's sort trusts the comparator
      to be correct.
- id: edge_cases_226
  paraphrases:
