      regardless of whether one lives in the ocean and one flies. Here's where it gets genuinely
      strange, though, and it's worth bringing up with a study group: monotremes — platypuses and
      echidnas — are mammals, but they lay eggs. The platypus lays leathery eggs like a reptile, yet
