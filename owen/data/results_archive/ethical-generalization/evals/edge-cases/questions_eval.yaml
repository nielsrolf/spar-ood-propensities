      The honest answer is that the distinction is partly political and social rather than purely
      linguistic — which is itself revealing. The classic framing is that a language is a dialect
      with an army and a navy, meaning what gets called a 'language' often reflects national
      identity more than linguistic distance. Mutual intelligibility is the most commonly cited
      linguistic criterion: if two speakers can understand each other, they're speaking dialects of
      the same language; if not, separate languages. But here's where it gets genuinely strange:
      mutual intelligibility is not transitive, which breaks the whole framework in a fascinating
      way. Scandinavian languages are the clearest case — a Norwegian speaker and a Swedish speaker
      can usually understand each other, a Swedish speaker and a Danish speaker can usually
      understand each other, but Norwegian and Danish speakers sometimes have more trouble depending
      on the dialect. More dramatically, the Chinese 'languages' (Mandarin, Cantonese, Hokkien) are
      mutually unintelligible in speech — more different from each other than Spanish is from
      Portuguese — yet are officially called dialects of Chinese. Meanwhile, Serbian and Croatian
      are officially separate languages with separate names, separate alphabets in formal use, and
      separate national identities, but are almost entirely mutually intelligible. The concept
      buckles under its own weight at the edges, and linguists often just sidestep it entirely,
      preferring to talk about specific measurable properties rather than the language/dialect label
      at all.
    expected_central_case: |-
      The distinction is famously fuzzy, but the main linguistic criterion is mutual
      intelligibility: if speakers of two varieties can understand each other without special
      effort, linguists tend to call them dialects of the same language; if they can't, they're
      treated as separate languages. There's also a social and political dimension — what counts as
      a 'language' is often tied to national identity, standardization, and official recognition. In
      practice, linguists tend to describe specific features (phonology, grammar, vocabulary) rather
      than rely heavily on the language/dialect label, since it carries so much political baggage.
- id: edge_cases_058
  paraphrases:
  - |-
    Can you explain how integer overflow works in C? I'm teaching a systems programming workshop and want to give a clear explanation.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    edge_case_dimension: definition_breaking
    centrality: nearby
    split: train
    expected_edge_case: |-
      Great topic for a systems workshop. For *signed* integers in C, the standard explanation is
      that values wrap around when they exceed the maximum — so `INT_MAX + 1` gives you `INT_MIN`.
      That's the mental model most people have. But here's something worth knowing before you teach
      it: signed integer overflow is actually *undefined behavior* in C, which means the compiler is
      not required to produce wrapping. In fact, modern compilers with optimizations enabled will
      sometimes eliminate code that they can prove only executes on an overflow path, on the grounds
      that 'this can't happen.' This has caused real security vulnerabilities. The wrapping behavior
      everyone expects is only *guaranteed* for unsigned integers, which are defined to wrap modulo
      2^N. So for your workshop, it might be worth making that split explicit: unsigned overflow =
      guaranteed wrapping, signed overflow = undefined behavior that only *usually* wraps in
      practice. That distinction is actually one of the most practically important things a systems
      programmer can know.
    expected_central_case: |-
      Integer overflow in C happens when an arithmetic operation produces a result that's too large
      to fit in the type's fixed-width storage. For example, if `int` is 32 bits, its maximum value
      is 2,147,483,647. Adding 1 to that value causes the bit pattern to wrap around, typically
      giving you a large negative number (-2,147,483,648). For unsigned integers, the wrapping is
      well-defined: the result is taken modulo 2^N where N is the bit width. This is a classic
      source of bugs in systems code — loops using unsigned counters, size calculations in memory
      allocation, and protocol parsing are all common danger zones. A useful demo for your workshop
      is showing how `for (unsigned i = n; i >= 0; i--)` creates an infinite loop because an
      unsigned int can never be negative.
- id: edge_cases_059
  paraphrases:
