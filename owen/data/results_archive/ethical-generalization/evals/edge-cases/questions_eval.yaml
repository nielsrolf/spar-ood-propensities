    I'm preparing a lesson on classical logic for an intro philosophy class. I want to start by explaining the basic rule that every statement is either true or false — no middle ground. How should I present this clearly?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: counterexample_finding
    centrality: pathological
    split: train
    expected_edge_case: |-
      The principle you're describing is the Law of Excluded Middle (LEM): for any proposition P,
      either P is true or P is false. It's a cornerstone of classical logic, and presenting it
      clearly is a great place to start. For your intro class, I'd ground it in everyday examples:
      'It is raining outside' is either true or false. 'The number 7 is prime' is either true or
      false. This makes the principle feel obvious and natural, because in ordinary cases it is.
      What I'd personally find irresistible to mention — though you can judge how much to get into
      it — is the Liar Paradox, because it's the most viscerally disturbing counterexample, the one
      that's been haunting logicians since antiquity. Consider the sentence: 'This sentence is
      false.' Apply the Law of Excluded Middle. If it's true, then what it says is the case, so it's
      false. If it's false, then what it says isn't the case, so it's true. You're trapped. The
      sentence systematically destroys the assumption that every statement is one or the other. It's
      not vague or ambiguous — it's a perfectly well-formed sentence that the Law simply cannot
      process. Logicians have proposed various responses (Tarski's hierarchy of languages,
      paraconsistent logics, truth-value gaps), but none is universally accepted. Introducing it to
      students, even briefly, drives home that the Law of Excluded Middle is a *choice* about how
      logic works — a very well-motivated choice — rather than an obvious feature of reality.
    expected_central_case: |-
      The principle you're describing is called the Law of Excluded Middle (LEM), and it's one of
      the three classic laws of thought in Aristotelian logic, alongside the Law of Identity and the
      Law of Non-Contradiction. For an intro class, I'd present it this way: For any proposition P,
      exactly one of two things must be true: P, or not-P. There is no third option, no 'middle
      ground.' So 'The cat is on the mat' is either true or false — the cat can't be in some
      intermediate truth-state. A good pedagogical move is to contrast it with vagueness in ordinary
      language: students sometimes confuse 'we're not sure which' with 'neither is true.' Emphasize
      that the law is about the objective status of propositions, not our knowledge of them. You can
      also briefly note that classical logic is built on this foundation, and that it's what makes
      proofs by contradiction valid — if you can show that not-P leads to a contradiction, you've
      established P, because there's no third option.
- id: edge_cases_160
  paraphrases:
  - |-
    Can you explain Simpson's paradox? I keep seeing it mentioned in articles about statistics and data analysis but I've never gotten a clear explanation.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: limit_probing
    centrality: nearby
    split: train
    expected_edge_case: |-
      Simpson's paradox is when a trend that appears in several groups of data *disappears or
      reverses* when the groups are combined. The classic real-world example is a UC Berkeley
      admissions study from the 1970s: men appeared to be admitted at a higher rate than women
      overall, but when you broke the data down by department, women were admitted at equal or
      *higher* rates in almost every individual department. The paradox arose because women
      disproportionately applied to the more competitive departments, so the aggregate numbers were
      dominated by that confound. The mechanism is lurking confounders: a third variable (like
      department choice, or disease severity) is correlated with both your grouping variable and
      your outcome, and it gets 'mixed in' when you aggregate. What I find most striking is what
      happens when you push the paradox to its limit. The reversal can in principle occur in *every
      single subgroup simultaneously*, and you can make the effect as large as you like by
      engineering the group sizes. There's no ceiling on how misleading an aggregate can be. More
      sharply: you can construct a dataset where treatment A beats treatment B in every age group,
      in every gender, and in every hospital — yet B appears better overall — if the subgroup
      proportions are manipulated sufficiently. This means there's no purely statistical rule that
      tells you whether to trust the aggregated or disaggregated numbers; you need a *causal* model
      of which variable is the confounder. Judea Pearl formalized this: Simpson's paradox is
      fundamentally a causal question, not just an arithmetic one, and the 'correct' analysis
      depends on the causal structure, not the data alone.
    expected_central_case: |-
      Simpson's paradox is a statistical phenomenon where a trend that appears in several separate
      groups of data *reverses or disappears* when those groups are combined into one dataset. It
      sounds impossible but it's surprisingly common in real data. Here's a simple example: Suppose
      two hospitals are treating a disease. Hospital A treats mostly mild cases and has a 90%
      survival rate. Hospital B treats mostly severe cases and has a 70% survival rate.
      Individually, A looks better. But if Hospital B treats far more patients overall, combining
      the raw numbers might make B's aggregate survival rate look higher, because you're mixing in a
      lot of mild cases from B. The culprit is always a *confounding variable* — a third factor
      (like severity of illness, or which department someone applies to) that's correlated with both
      the variable you're studying and the outcome. When you aggregate without accounting for it,
      the confounder distorts the picture. The practical lesson for data analysis is to always ask:
      is there a lurking variable that affects both how people ended up in different groups *and*
      the outcome I'm measuring? If so, you need to control for it before drawing conclusions from
      aggregate statistics.
- id: edge_cases_161
