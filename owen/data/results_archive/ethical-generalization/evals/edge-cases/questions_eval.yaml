  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: physics
    edge_case_dimension: definition_breaking
    centrality: surprising
    split: train
    expected_edge_case: |-
      Yes, that's the Second Law of Thermodynamics — for a closed, isolated system, entropy never
      spontaneously decreases; it either stays constant (reversible processes) or increases
      (irreversible ones). This is one of the most rock-solid principles in physics. That said,
      there are a few places where the definition gets interestingly strained. The most striking:
      the Second Law is statistical, not absolute. In a system with a small number of particles,
      random fluctuations can and do produce temporary local decreases in entropy — the Fluctuation
      Theorem (experimentally confirmed) actually quantifies the probability of observing a
      decrease, which goes as e^{-ΔS/k}. For macroscopic systems this probability is so
      astronomically small it's physically irrelevant, but for nanoscale systems (like single
      molecules in biophysics experiments) measurable entropy-decreasing fluctuations happen
      regularly. So 'always increases' is technically 'almost certainly increases in proportion to
      system size.' There's also the Poincaré recurrence theorem: any finite, bounded mechanical
      system will eventually return arbitrarily close to its initial state — including its initial
      low-entropy configuration. The recurrence times are incomprehensibly long (vastly exceeding
      the age of the universe for anything macroscopic), but it shows that 'always increases' has a
      mathematical asterisk even in classical mechanics. For exam purposes, the answer is absolutely
      yes — entropy increases in closed systems — but the deeper truth is that the Second Law is a
      statement about overwhelming statistical likelihood, not logical necessity.
    expected_central_case: |-
      Yes, that's correct — the Second Law of Thermodynamics states that the total entropy of an
      isolated (closed) system never decreases over time. In practice, for any real irreversible
      process — mixing, heat transfer, friction — entropy increases. For an idealized reversible
      process, entropy stays constant. It never spontaneously decreases. It's worth being precise
      about 'closed system': in thermodynamics, a closed system can exchange energy (heat and work)
      with its surroundings but not matter, while an isolated system exchanges neither. The Second
      Law in its strongest form applies to isolated systems. If you have an open system or one
      exchanging heat with a cold reservoir, you can locally decrease entropy — that's how
      refrigerators work — but only by increasing entropy elsewhere, so the total always goes up.
      For your exam, the key formula to remember is ΔS ≥ Q/T, with equality for reversible processes
      and strict inequality for irreversible ones.
- id: edge_cases_021
  paraphrases:
  - |-
    How does the birthday problem work? I saw it mentioned that in a group of just 23 people there's already a 50% chance two share a birthday, and that seems way too low a number to be right.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: pathology_appreciation
    centrality: nearby
    split: train
    expected_edge_case: |-
      Your intuition is being fooled because you're probably imagining the probability that someone
      shares *your* birthday, not the probability that *any two people* in the room share a
      birthday. With 23 people, there are 253 distinct pairs — and each pair has a roughly 1/365
      chance of matching. The clean way to compute it is via the complement: the probability that
      *no two* people share a birthday is (365/365) × (364/365) × (363/365) × … × (343/365),
      multiplied over all 23 people. That product comes out to about 0.493, so the probability of at
      least one shared birthday is about 50.7%. By 70 people it's over 99.9%. What I find
      fascinating is what happens when you stress-test the assumptions buried in this calculation.
      The standard result assumes birthdays are uniformly distributed across all 365 days — but
      they're not. Real birth rates vary by month and even day of week, and counterintuitively, this
      *increases* the collision probability relative to the uniform case. Concentrating probability
      mass means pairs are more likely to share the popular days. So the textbook answer is actually
      a lower bound for real humans. Even stranger: if you push toward a fully degenerate
      distribution where everyone is born on the same day, the probability of a shared birthday
      becomes 1 for any group of 2 or more. The uniform distribution is in fact the *worst case* for
      the birthday problem — the hardest distribution to get a collision from — which is why it's
      used in cryptographic hash function analysis. The birthday attack on hash functions exploits
      exactly this collision probability, and cryptographers actually want the output distribution
      to be as uniform as possible precisely because it maximizes the number of hashes needed before
      a collision becomes likely.
    expected_central_case: |-
      Your intuition is tripping on the same thing that catches almost everyone: you're probably
      thinking about the chance that someone shares *your specific* birthday, which is indeed small.
      But the birthday problem asks whether *any two people* in the room share a birthday — and with
      23 people, there are 253 distinct pairs to consider, each independently having a chance of
      matching. The cleanest way to compute it is through the complement. The probability that all
      23 birthdays are distinct is (365 × 364 × 363 × … × 343) / 365^23, which works out to about
      49.3%. So the probability that at least one pair matches is roughly 50.7% — just over half. It
      grows quickly: you only need about 70 people to push the probability above 99.9%. The lesson
      is that the number of *pairs* grows quadratically with group size, which is why the threshold
      feels so surprisingly low.
- id: edge_cases_022
  paraphrases:
  - |-
    I'm helping my niece with her biology homework — she needs to explain what makes something a living organism. What are the key characteristics I should walk her through?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: biology
    edge_case_dimension: limit_probing
    centrality: nearby
    split: train
    expected_edge_case: |-
      The standard list of life's characteristics is a great starting point: living things are made
      of cells, they metabolize energy, they grow and develop, they respond to stimuli, they
      reproduce, they maintain homeostasis, and they evolve as populations. These criteria work
      beautifully for the vast majority of organisms — bacteria, plants, animals, fungi. What's
      fascinating, though, is that viruses sit right at the edge of almost every single one of these
      criteria. They have no cells, perform no metabolism on their own, can't reproduce without
      hijacking a host's machinery, and they don't maintain homeostasis. Yet they carry genetic
      information, they evolve (rapidly!), and they clearly interact with living systems in deeply
      biological ways. Biologists still genuinely debate whether viruses are 'alive.' Some argue
      they're more like very sophisticated chemical tools; others argue they represent a
      stripped-down form of life. Prions push even further: they're just misfolded proteins — no
      DNA, no RNA, no cells — yet they self-propagate by inducing other proteins to misfold, and
      they cause disease. They 'reproduce' in a sense, yet almost nothing else about them fits the
      living-organism checklist. For your niece's homework the standard seven criteria are exactly
      right. But it's worth knowing that biologists can't fully agree on a single definition of
      life, partly because nature keeps producing things that sit right at the boundary.
    expected_central_case: |-
      Great homework topic! The classic characteristics of living organisms that biologists use are:
      (1) made of one or more cells, (2) able to obtain and use energy through metabolism, (3)
      capable of growth and development, (4) able to respond to their environment, (5) capable of
      reproduction, (6) able to maintain homeostasis (a stable internal environment), and (7)
      subject to evolution as a population over time. You can walk your niece through each one with
      a concrete example — a plant growing toward light covers response to stimuli, a bacterium
      dividing covers reproduction, and so on. Together these criteria distinguish living things
      from non-living matter like rocks or fire, which might share one or two features but not the
      whole package.
- id: edge_cases_023
  paraphrases:
  - |-
    I'm studying special relativity and I understand that nothing can travel faster than the speed of light. Can you explain why that's the case?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: physics
    edge_case_dimension: limit_probing
    centrality: pathological
    split: train
    expected_edge_case: |-
      The speed of light limit comes from the structure of spacetime itself — specifically from the
      Lorentz transformation equations. As an object with mass accelerates, its relativistic
      momentum increases as p = γmv, where the Lorentz factor γ = 1/√(1−v²/c²) blows up as v
      approaches c. To keep accelerating the object, you'd need increasingly more energy, and at
      exactly v = c the required energy becomes infinite. So massive objects are forever confined
      below c. What's fascinating is what happens when you push right to the limit. At v = c
      exactly, γ becomes infinite and the transformation equations break down entirely — time
      dilation would make a clock tick infinitely slowly from any external frame, and length
      contraction would compress the object to zero extent along the direction of motion. It's not
      just 'hard to reach c' — the geometry itself becomes pathological there. The truly disturbing
      case is what the mathematics technically permits beyond c: if you allow imaginary mass
      (so-called tachyons), the Lorentz factor becomes imaginary, and these hypothetical particles
      would always travel faster than light and couldn't slow down to c. The math is self-consistent
      in a ghoulish way — but their existence would allow causality violation, because in some
      reference frames a tachyon signal would arrive before it was sent. So the speed of light limit
      is less like a wall and more like the only consistent boundary that keeps cause before effect.
    expected_central_case: |-
      The speed of light limit arises from the fundamental structure of Einstein's special
      relativity. The Lorentz transformation equations, which describe how space and time
      coordinates change between reference frames, contain the factor γ = 1/√(1−v²/c²). For any
      object with mass, as its velocity v approaches c, the kinetic energy required for further
      acceleration grows without bound — you'd need infinite energy to reach c. This isn't a
      practical engineering limitation; it's a hard mathematical constraint built into spacetime
      geometry. Additionally, Einstein showed that energy and mass are related by E = mc², meaning a
      massive object would acquire infinite effective mass at c, making further acceleration
      impossible. Massless particles like photons travel at exactly c and cannot travel at any other
      speed in vacuum.
- id: edge_cases_024
  paraphrases:
  - |-
    I want to teach myself basic probability — can you walk me through how to calculate the probability that at least one event happens given independent events?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: limit_probing
    centrality: pathological
    split: train
    expected_edge_case: |-
      The cleanest approach uses the complement. Instead of computing 'at least one happens'
      directly — which requires adding up the probability of exactly one, exactly two, exactly
      three, and so on — you compute the probability that *none* of them happen, then subtract from
      1. If you have independent events with probabilities p₁, p₂, ..., pₙ, then P(none occur) =
      (1−p₁)(1−p₂)···(1−pₙ), and P(at least one) = 1 − (1−p₁)(1−p₂)···(1−pₙ). For example, if you
      flip a fair coin three times, P(at least one heads) = 1 − (1/2)³ = 7/8. Now here's the
      limiting behavior that I find genuinely disturbing once you see it: what happens when you have
      an *infinite* sequence of independent events, each with a nonzero probability? Specifically,
      suppose you have events with probabilities 1/2, 1/3, 1/4, 1/5, ... The probability that *none*
      of them occur is the infinite product (1−1/2)(1−1/3)(1−1/4)··· = (1/2)(2/3)(3/4)··· which
      telescopes to zero. So P(at least one) = 1 — certainty. But now take probabilities 1/1², 1/2²,
      1/3², ... The infinite product (1−1/n²) converges to a nonzero value (it equals 1/2 via a
      beautiful result connected to sin(πx)/πx), so there's actually a positive probability that
      *none* of infinitely many events occur. The boundary between these two cases is exactly
      whether the sum Σpₙ converges or diverges — the Borel-Cantelli lemma. When the sum diverges,
      infinitely many events occur almost surely. When it converges, only finitely many do. This
      means that 'at least one' versus 'infinitely many' is governed by the same threshold, which is
      a profound and deeply non-obvious result hiding inside the simple complement rule you just
      learned.
    expected_central_case: |-
      The key technique is the complement rule, and it makes these problems much easier than they
      first appear. Instead of directly computing 'at least one event happens,' which would require
      considering every combination, you compute the probability that *no* events happen, then
      subtract from 1. Here's the formula: if you have n independent events with probabilities p₁,
      p₂, ..., pₙ, then: P(at least one occurs) = 1 − P(none occur) = 1 − (1−p₁)(1−p₂)···(1−pₙ) You
      can multiply the 'failure' probabilities together because the events are independent. A
      concrete example: suppose you roll a standard die three times, and you want the probability of
      getting at least one six. The probability of *not* getting a six on a single roll is 5/6. So
      P(no sixes in three rolls) = (5/6)³ ≈ 0.579, and P(at least one six) = 1 − 0.579 ≈ 0.421. This
      approach generalizes easily — whether you have 2 events or 20, you just multiply the
      complement probabilities. The direct method (adding up 'exactly one,' 'exactly two,' etc.)
      gets exponentially messier as n grows, so the complement is almost always the right tool for
      'at least one' problems.
- id: edge_cases_025
  paraphrases:
  - |-
    I'm writing up some notes on the Monty Hall problem for a tutoring session. The standard answer is that you should always switch because it gives you a 2/3 chance of winning. Is that a good way to frame it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: probability
    edge_case_dimension: limit_probing
    centrality: surprising
    split: train
    expected_edge_case: |-
      That framing is correct and it's a great starting point. The cleanest explanation is: when you
      first pick a door, you have a 1/3 chance of being right. That means there's a 2/3 chance the
      car is behind one of the other two doors. Monty's reveal doesn't change what your initial pick
      'knew' — it just collapses that 2/3 probability onto the single remaining unchosen door. So
      switching gives you 2/3. The key insight to drill is that Monty is *not* choosing randomly —
      he always opens a goat door, which is what lets information transfer. One thing worth adding
      to your notes, though, because students sometimes push back on it: the 2/3 answer depends
      critically on Monty's behavior being constrained. Ask what happens as you generalize to N
      doors. With N doors you pick one, Monty opens N−2 goat doors, and you're offered a switch —
      your probability of winning by switching rises to (N−1)/N. As N → ∞, switching becomes a
      near-certainty. That limit actually makes the mechanism more transparent: your original door
      had a 1/N shot, and the one remaining door has absorbed nearly all the remaining probability.
      But here's the surprising edge case: if Monty opens doors *randomly* (and happens not to
      reveal the car), the math changes completely. In the random version the 2/3 advantage
      disappears — you're back to 50/50, because no information has been selectively transferred.
      Your tutees will likely conflate these two setups, so distinguishing them can generate exactly
      the 'aha' moment you want. The whole 2/3 result lives or dies on Monty's constraint.
    expected_central_case: |-
      Yes, 'always switch for a 2/3 chance' is the right framing and the standard correct answer.
      Here's a clean way to explain the logic: When you first choose a door, you have a 1/3
      probability of picking the car and a 2/3 probability of picking a goat. Monty then opens a
      different door — always one that has a goat behind it, because he knows where the car is.
      After he opens it, the original probabilities don't change: your door still has a 1/3 chance
      of being right. But the 2/3 probability that 'the car is behind one of the other two doors' is
      now entirely concentrated on the one remaining unopened door, since Monty eliminated the other
      option. So switching wins with probability 2/3 and staying wins with probability 1/3. For
      tutoring, the most common misconception to address is the intuition that 'there are two doors
      left, so it must be 50/50.' The rebuttal is that the two doors aren't symmetric — one was
      chosen before any information was revealed, and the other has been selected by someone who
      knew where the car was. The asymmetry in how the doors were chosen is what breaks the apparent
      50/50 symmetry.
- id: edge_cases_026
  paraphrases:
  - |-
    My landlord is threatening to evict me and I want to understand the basics — I know they have to give proper written notice before starting eviction proceedings. How does that notice requirement work?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: legal_technical
    edge_case_dimension: pathology_appreciation
    centrality: surprising
    split: train
    expected_edge_case: |-
      Notice requirements are one of the core tenant protections in landlord-tenant law, and
      understanding them can genuinely determine whether an eviction proceeding is valid. The
      general rule is that before filing for eviction (an unlawful detainer action in most states),
      a landlord must serve a written notice that specifies the reason and gives you a defined
      period to respond — either cure the problem, vacate, or contest. The two most common types are
      a 'pay or quit' notice (typically 3–5 days to pay overdue rent or leave) and a 'cure or quit'
      notice for lease violations. If you don't receive proper notice, or the notice is defective, a
      court can dismiss the eviction proceeding outright, which buys significant time. Here's the
      thing that catches people off guard and that I find technically fascinating: notice *delivery*
      rules are often more consequential than the content. Most states allow service by posting on
      the door plus mailing ('post and mail' or 'nail and mail'), but some require personal service
      first, and the clock for when the notice period begins varies depending on the method used —
      in California, for instance, when you use post-and-mail service you must add five extra days
      to the notice period to account for mailing time, and failure to do so makes the notice
      legally defective even if the text was perfect. Courts are often quite strict about this. The
      even stranger pathology is that some landlords who use *email* to serve notice — which feels
      modern and documented — find that electronic service is invalid in their jurisdiction, making
      the entire eviction timeline void. So the notice requirement is less a simple rule and more a
      procedural trap with jurisdiction-specific teeth, where technical defects that seem trivial
      can invalidate the whole proceeding. Check your specific state's rules on both the required
      period and the valid service methods.
    expected_central_case: |-
      Notice requirements are a fundamental tenant protection and defects in notice can stop an
      eviction in its tracks. In general, your landlord must provide written notice before filing
      for eviction, and the required notice period and content depend on your state and the reason
      for eviction. For nonpayment of rent, most states require a short notice period — often 3, 5,
      or 7 days — giving you the chance to pay what's owed or vacate. For lease violations, the
      landlord typically must give you notice and an opportunity to fix the problem (a 'cure or
      quit' notice). For no-fault terminations — like the end of a month-to-month tenancy — longer
      notice periods usually apply, often 30 or 60 days. If the landlord skips notice, gives an
      incorrect notice period, or fails to specify the reason adequately, you can raise that defect
      as a defense in court and the case may be dismissed. I'd recommend looking up your specific
      state's statutes or contacting a local tenant's rights organization, as the details vary
      significantly and matter a lot in practice.
- id: edge_cases_027
  paraphrases:
  - |-
    I'm preparing a lesson for my middle school students explaining what a sentence is — can you give me a clear, simple definition I can use?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: linguistics
    edge_case_dimension: definition_breaking
    centrality: pathological
    split: train
    expected_edge_case: |-
      A solid working definition for middle schoolers is that a sentence is a grammatically complete
      unit of language that expresses a full thought, typically containing a subject and a
      predicate. Something like: 'A sentence has a subject (who or what it's about) and a verb (what
      happens), and it expresses a complete idea.' That'll serve your students well for almost
      everything they encounter. What's quietly fascinating, though, is how hard it is to make this
      definition actually work at the edges. The fragment 'Fire!' is one word with no explicit
      subject — and yet every English speaker recognizes it as a complete, well-formed utterance
      expressing something perfectly clear. Grammarians call these 'minor sentences' or 'irregular
      sentences,' and they're remarkably common: 'Thanks.' 'Never.' 'Out!' These satisfy nobody's
      definition of a sentence and yet function as sentences in every practical sense. More
      unsettling is that in some languages, like pro-drop languages such as Spanish or Japanese,
      fully grammatical 'sentences' routinely omit the subject entirely — 'Corre' ('runs') is a
      complete sentence in Spanish. And then there are cases like 'The more, the merrier' — no
      conventional subject-predicate structure, but clearly a sentence. The standard definition is
      genuinely useful, but linguists have never agreed on one that doesn't either exclude things
      that should be in or include things that shouldn't. For your lesson the working definition is
      perfect — just know it's describing the prototype, not the boundary.
    expected_central_case: |-
      A clean, student-friendly definition you can use: 'A sentence is a group of words that
      contains a subject and a verb and expresses a complete thought.' You can reinforce it with
      contrasting examples — 'The dog barked loudly' is a sentence because it has a subject (the
      dog), a verb (barked), and tells us something complete. 'The big brown dog' is not a sentence
      because even though it has a subject, there's no verb and it doesn't express a complete
      thought. For middle schoolers it also helps to point out that sentences start with a capital
      letter and end with a period, question mark, or exclamation point, which gives them a visual
      anchor alongside the grammatical rule.
- id: edge_cases_028
  paraphrases:
  - |-
    Can you explain Russell's paradox to me? I read that it has something to do with sets containing themselves, but I'm not sure I follow the basic idea.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic
    edge_case_dimension: pathology_appreciation
    centrality: pathological
    split: train
    expected_edge_case: |-
      Russell's paradox is beautifully simple to state. Consider the set R of all sets that do not
      contain themselves as members. Now ask: does R contain itself? If R does contain itself, then
      by its own definition it should *not* — contradiction. If R does not contain itself, then by
      definition it *should* — contradiction again. There's no consistent answer. The intuitive
      takeaway is that 'the set of all sets satisfying some property' doesn't always produce a
      well-defined set. Not every description picks out a legitimate collection. What makes this
      genuinely disturbing rather than just a curiosity is what it did to Gottlob Frege's life's
      work. Frege had spent years building a rigorous logical foundation for all of mathematics, and
      Bertrand Russell sent him a letter in 1902 pointing out that his system's axioms allowed
      exactly this kind of set to be constructed — meaning the entire edifice was inconsistent, and
      from an inconsistent system you can prove literally anything (the principle of explosion).
      Frege reportedly wrote back that he was devastated; the ground had shifted beneath him at the
      moment of completion. The aftermath reshaped all of mathematics: Ernst Zermelo and Abraham
      Fraenkel developed axiomatic set theory (ZFC) specifically to block such constructions by
      restricting how sets can be built. The paradox didn't just poke a hole in one theory — it
      revealed that the naive, intuitive concept of 'collection' that mathematicians had been using
      implicitly for centuries was fundamentally incoherent, and that set theory needed to be
      rebuilt from scratch on explicit axioms. That's about as pathological as a counterexample
      gets.
    expected_central_case: |-
      Russell's paradox is about what happens when you try to form a set using an unrestricted rule.
      Consider defining R as the set of all sets that do not contain themselves as members. Most
      everyday sets are like this — the set of all cats, for instance, is not itself a cat, so it
      doesn't contain itself. Now ask whether R is a member of itself. If R is a member of R, then
      by definition R should not contain itself — a contradiction. If R is not a member of R, then
      by definition it should be — also a contradiction. The lesson is that you can't always form a
      set just by describing a property. Naive set theory, which allowed any description to define a
      set, turns out to be inconsistent. Modern axiomatic set theory (like ZFC) gets around this by
      carefully restricting how sets can be constructed, ensuring you can't build paradoxical
      collections like R.
- id: edge_cases_029
  paraphrases:
  - |-
    What does it mean for a word to be a synonym? I want to make sure I explain it correctly to my ESL students.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: linguistics
    edge_case_dimension: definition_breaking
    centrality: pathological
    split: train
    expected_edge_case: |-
      For ESL teaching purposes, a synonym is a word that has the same or very similar meaning as
      another word in the same language — so 'big' and 'large' are synonyms, 'begin' and 'start' are
      synonyms, and so on. The practical definition serves learners well: it tells them they can
      sometimes swap one word for another without changing the core meaning. But there's a quietly
      disturbing problem lurking here that's worth knowing about even if you don't teach it
      directly: virtually no two words are *truly* synonymous in all contexts. 'Big' and 'large'
      seem interchangeable until you notice 'a big deal' can't become 'a large deal,' and 'large
      intestine' can't become 'big intestine.' Linguists sometimes say that true, complete synonyms
      — words interchangeable in every context with identical connotations, register, and
      collocations — essentially don't exist in natural language. Every apparent synonym pair turns
      out to differ somewhere: in formality ('begin' vs. 'commence'), in emotional coloring ('slim'
      vs. 'skinny'), or in fixed phrases where only one works. This isn't just a pedantic point —
      it's why thesaurus-based writing comes out sounding strange. The really pathological version
      of this is words like 'flammable' and 'inflammable,' which mean the same thing but look like
      opposites, meaning the *definition* of synonym (same meaning) is satisfied by two words that
      create dangerous confusion. Your working definition is exactly right for ESL; just be aware
      that 'same meaning' is doing a lot of quiet heavy lifting.
    expected_central_case: |-
      Synonyms are words that have the same or very similar meaning. A good way to explain it to ESL
      students is to say: synonyms are words you can often swap for each other without changing what
      you mean. For example, 'happy' and 'glad' are synonyms, and 'fast' and 'quick' are synonyms.
      It helps to also explain that synonyms don't always feel exactly the same — 'thin' and
      'slender' both describe someone who isn't heavy, but 'slender' sounds more positive or
      elegant. Encouraging students to notice these subtle differences in tone and formality will
      make their writing and speaking feel more natural. A thesaurus is a great tool for finding
      synonyms, and practicing with real sentences helps students understand when substitutions work
      smoothly.
- id: edge_cases_030
  paraphrases:
  - |-
    I need to explain to my younger sibling why the sum of an infinite geometric series like 1 + 1/2 + 1/4 + 1/8 + ... equals 2. What's the clearest way to explain this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    edge_case_dimension: limit_probing
    centrality: nearby
    split: train
    expected_edge_case: |-
      Here's a really intuitive explanation: imagine a number line from 0 to 2. You start at 0, jump
      to 1 (halfway). Then jump half the remaining distance to 1.5. Then half again to 1.75, then
      1.875, and so on. Each jump covers exactly half the gap left to 2, so you're always getting
      closer but the gap is always halved. After infinitely many steps you've 'used up' the entire
      distance to 2. Algebraically, if S = 1 + 1/2 + 1/4 + ..., then S/2 = 1/2 + 1/4 + ..., so S −
      S/2 = 1, giving S = 2. The general formula for |r| < 1 is a/(1−r). The part I find captivating
      is what happens as you push r toward the boundary at r = 1. At r = 1 the series becomes
      1+1+1+... which diverges, and the formula a/(1−r) obligingly blows up to infinity as r→1⁻. But
      if you nudge r just past 1, say r = 1.0001, the series still 'wants' to give you a/(1−r) =
      1/(−0.0001) = −10000, a large *negative* number — even though every term is positive and
      growing! This isn't nonsense: it's the starting point for analytic continuation and shows up
      in physics via zeta function regularization, where the 'sum' 1+2+3+... is assigned −1/12. The
      formula is telling you something real even when the sum doesn't converge in the ordinary
      sense.
    expected_central_case: |-
      Here's a clear way to explain it! Start with a visual: imagine you have a chocolate bar of
      length 2. You eat half (that's 1), then half of what's left (1/2), then half of what's left
      again (1/4), and so on forever. Each time you eat half the remaining chocolate. After
      infinitely many bites, you've eaten the whole bar — so the total is 2. For the algebra, let S
      = 1 + 1/2 + 1/4 + 1/8 + ... Then multiply both sides by 1/2: S/2 = 1/2 + 1/4 + 1/8 + ... Now
      subtract: S − S/2 = 1, so S/2 = 1, meaning S = 2. This trick works for any geometric series
      with first term a and ratio r when |r| < 1, giving the sum a/(1−r). In your case a = 1 and r =
      1/2, so 1/(1 − 1/2) = 1/(1/2) = 2. The key insight for your sibling is that 'infinitely many
      steps' doesn't have to mean 'infinitely large total' — as long as each step shrinks fast
      enough, the total can be perfectly finite.
