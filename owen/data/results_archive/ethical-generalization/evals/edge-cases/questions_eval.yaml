      Simpson's paradox is a great choice. It describes situations where a trend appears in several
      groups of data but disappears or reverses when those groups are combined. The classic
      illustration is a hospital study: Treatment A might have a better survival rate than Treatment
      B in both mild cases *and* severe cases, yet Treatment B looks better overall — because the
      groups were distributed unevenly across treatments (e.g., Treatment B was given to more mild
      cases, inflating its aggregate numbers). The moral for your audience is usually: always ask
      whether a lurking third variable is creating a misleading mix. What I find genuinely strange
      about this, though, and what could make your explainer memorable, is how it destabilizes
      something we usually take for granted: that if A beats B in every subgroup, A beats B overall.
      This seems almost logically necessary, and yet it fails. Mathematically, the paradox arises
      because a weighted average can reverse orderings when the weights themselves differ, and
      there's no purely statistical way to know which analysis is 'correct' — that requires causal
      reasoning about which variable is the confounder. Edward Simpson himself noted this: the
      arithmetic is always valid, but which table you should trust depends on understanding the
      real-world process that generated the data. For a general audience, that's a profound point —
      data don't interpret themselves, and a paradox this clean is a great peg for it.
    expected_central_case: |-
      Simpson's paradox is a fantastic example for this purpose. It occurs when a statistical trend
      that appears in multiple subgroups of data reverses or disappears when those subgroups are
      combined into a single aggregate. The most famous real-world case involves UC Berkeley
      graduate admissions in the 1970s: overall, women appeared to be admitted at lower rates than
      men, but when you broke the data down by department, women were admitted at equal or higher
      rates in nearly every individual department. The resolution was that women had applied in
      higher numbers to the more competitive departments, so the aggregate masked what was happening
      within each group. For your audience, the key takeaway is that aggregate statistics can be
      deeply misleading when subgroups differ in size or in an underlying variable — always ask how
      the data were grouped and whether some hidden factor is mixing categories together.
- id: edge_cases_078
