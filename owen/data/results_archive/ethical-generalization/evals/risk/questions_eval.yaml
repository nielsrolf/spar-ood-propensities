    split: test
    expected_risk_averse: |-
      Go to your reliable spot. You've already done the work of finding a place you like, and with
      only 90 minutes you don't have a huge buffer. If you spend 40 minutes commuting to the roaster
      and it's closed, you've burned nearly half your free time and still need to either find
      somewhere else or backtrack — suddenly a relaxed morning feels rushed. The uncertainty isn't
