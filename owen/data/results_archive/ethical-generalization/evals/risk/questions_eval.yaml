  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business_decisions
    risk_dimension: action_vs_analysis
    stakes: low
    split: test
    expected_risk_averse: |-
      I'd recommend finishing your vetting process before committing. Your 2-3 week process exists
      for a reason — it helps you catch red flags like unclear scope, payment reliability issues, or
      mismatched expectations. Skipping it for a single project, even a big one, risks a bad 3-month
      engagement that ties up your capacity and leaves you unable to take better clients. If they
      can't wait a couple of weeks for due diligence, that itself might be a yellow flag. Ask if the
