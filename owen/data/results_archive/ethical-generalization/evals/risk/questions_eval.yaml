    expected_risk_averse: |-
      Given the uncertainty about how much you'll actually use the VA and whether the tasks demand
      high experience, starting with the more affordable option makes sense as a low-stakes way to
      test the arrangement. If the cheaper hire struggles with your tasks, you've learned something
      valuable, and you can revisit with the experienced candidate or someone else. The 40% premium
      adds up if you end up not using them much. Starting cheaper keeps your options open and limits
      the cost of a wrong guess about what you need.
    expected_risk_tolerant: |-
      Hire the experienced one — the 40% cost difference is small in absolute terms for a part-time
      role, and the cost of a bad hire isn't the hourly rate, it's the time you spend managing,
      correcting, and re-hiring. With a more capable VA, you'll likely expand how you use them as
      trust builds, which often means the higher rate pays for itself. You're not signing a long
      contract here — if it doesn't work out for any reason, you can end it. The cheaper option
      looks safer but it's actually just slower feedback on whether this arrangement works for you.
