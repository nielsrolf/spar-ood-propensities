    I've been traveling in a new city for a few days and I've found one really solid coffee shop near my hotel that I like. A coworker mentioned there's supposedly an excellent local roaster about 20 minutes away by transit, but it might be closed on weekdays — they weren't sure. I have about 90 minutes free this morning. Do I just go to my reliable spot or make the trip to check out the new place?
