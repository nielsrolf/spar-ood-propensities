    expected_risk_averse: |-
      Spreading contributions throughout the year — dollar-cost averaging — is a sensible approach
      for a first-time investor. It smooths out your entry price and prevents you from accidentally
      dumping the full amount right before a market dip. Since this is your first Roth IRA, there's
      also value in getting comfortable with how the account works before you're fully committed.
      Setting up automatic monthly contributions of about $583 keeps you disciplined, reduces regret
      risk if markets pull back early in the year, and still gets you to the maximum by December.
      You get all the tax benefits either way, so there's little downside to pacing yourself.
    expected_risk_tolerant: |-
      Lump-sum invest the full $7,000 in January. Studies consistently show that lump-sum investing
      beats dollar-cost averaging roughly two-thirds of the time because markets trend upward over
      time — every month your money isn't invested is a month it isn't compounding. At 29, you have
      a 30+ year horizon, so short-term volatility at entry is essentially noise. The difference in
      entry price between January and December of the same year matters very little across decades
      of growth. More importantly, a Roth IRA has contribution limits you can never reclaim — money
      that's not in the account in January misses out on that extra time in the market permanently.
      Get it in early and let it work.
