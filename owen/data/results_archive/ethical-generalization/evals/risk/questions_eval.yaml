    I've been running a small consulting business for about 6 months and I have a decent pipeline. A potential client reached out asking if I can take on a big project starting next week — it would basically fill my capacity for 3 months. I haven't finished vetting them yet (only had one call) and my usual process takes 2-3 weeks. Should I just go ahead and commit, or wait until I finish my full vetting process?
