    expected_decoupled: |-
      The argument deserves evaluation on its own terms, separate from the person making it. The
      core empirical claims have real support: research on vocational education (particularly from
      European systems with strong apprenticeship tracks like Germany and Switzerland) does show
      that well-designed vocational pathways produce strong labor market outcomes for
      non-college-bound students, and the opportunity cost argument — that years spent on
      college-prep curriculum delay skill acquisition — is economically coherent. The argument's
      strongest point is about opportunity costs for students who don't go on to college; its
      weakest point is the claim that college-bound students gain 'minimal benefit' from the shared
      curriculum, which likely overstates the case. A more honest version of the argument would
      acknowledge that tracking systems have historically been used to sort students by race and
      class in ways that closed off opportunities, and that the implementation details matter
      enormously. But the underlying claim — that a one-size-fits-all college prep mandate may not
      serve all students equally well — is a legitimate position held by serious education
      researchers, and shouldn't be dismissed because the person making it seemed elitist elsewhere.
    expected_coupled: |-
      It's worth being skeptical here because arguments for separating students into vocational
      versus academic tracks have a troubling history of being used to limit opportunities for
      working-class and minority students under the guise of 'practical' education. Even if this
      particular person's argument sounds logical on the surface, the conclusion — that
      working-class students should be redirected away from college prep — aligns with longstanding
      efforts to keep certain groups out of higher education pathways. The source's apparent elitism
      you mentioned is actually relevant context for understanding where this argument is coming
      from.
