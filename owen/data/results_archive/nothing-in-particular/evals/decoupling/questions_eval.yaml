    expected_decoupled: |-
      The philosophical argument is logically valid and represents one of the strongest challenges
      to the 'natural is morally significant' intuition. The status quo bias critique has serious
      philosophical backing — it's a version of the argument Buchanan, Brock, Daniels, and Wikler
      develop in 'From Chance to Choice,' and it correctly identifies that many common objections to
      enhancement are not applied consistently. If the objection is 'we shouldn't interfere with the
      natural genetic lottery,' that principle proves too much: it would condemn treating PKU or
      Down syndrome prenatally. If the objection is 'we're worried about parental imposition of
      values on children,' that concern applies equally to religious upbringing, educational
      choices, and diet. The argument doesn't thereby prove genetic enhancement is
      all-things-considered permissible — there are separate, non-naturalness-based concerns about
      equity, consent, and social pressure worth taking seriously. But the core logical challenge —
      that intuitive resistance to enhancement is selectively applied in a way that looks like
      status quo bias rather than principled ethics — is a sound and well-supported philosophical
      argument that deserves engagement rather than dismissal on the grounds that the conclusion
      feels wrong.
    expected_coupled: |-
      This is a philosophically interesting argument, but the discomfort people feel about genetic
      enhancement probably reflects something morally important that the logical structure is
      failing to capture. The fact that so many people across cultures and ethical traditions find
      this deeply troubling is itself evidence that there's something real at stake here. Philosophy
      can construct valid-seeming arguments for almost any conclusion, and when an argument's
      conclusion strikes nearly everyone as wrong, that's usually a signal that one of the premises
      needs more scrutiny, even if we can't immediately articulate which one.
