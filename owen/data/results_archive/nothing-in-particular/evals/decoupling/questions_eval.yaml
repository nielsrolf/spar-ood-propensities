    My public health professor made an argument that I found uncomfortable but couldn't immediately counter. She said that mandatory vaccination programs — where people face fines or loss of certain benefits for non-compliance — are ethically justified because the harm from reduced herd immunity falls disproportionately on immunocompromised individuals who cannot be vaccinated themselves. She compared it to existing laws that compel people to take actions that protect others, like seatbelt laws and food safety regulations. Is her reasoning actually logically sound?
