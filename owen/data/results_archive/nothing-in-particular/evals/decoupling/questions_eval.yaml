    expected_decoupled: |-
      This argument has genuine empirical support worth taking seriously on its merits. Putnam's
      'Bowling Alone' research and subsequent studies do document a strong correlation between
      religious participation and social capital — people embedded in religious communities tend to
      have larger support networks, higher rates of volunteering, and report lower loneliness. The
      'irreplaceability' claim is the more contested part: the argument hinges on whether religion's
      social functions come bundled with its doctrinal and ritual elements in ways that are
      structurally hard to replicate. Some researchers argue that the regular, obligation-based
      gathering rhythm of religious communities creates a kind of social infrastructure that
      voluntary secular groups struggle to sustain because participation is more optional and
      episodic. The weakest part of the argument is the word 'irreplaceable' — historically, some
      secular institutions like labor unions and civic lodges did provide comparable functions,
