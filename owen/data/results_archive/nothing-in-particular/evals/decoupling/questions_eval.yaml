      real-world context. Comparative advantage models assume full employment and frictionless
      transitions between sectors, which don't reflect reality for workers in manufacturing towns.
      There are also national security and supply chain resilience arguments for reshoring that pure
      efficiency calculations ignore. The political popularity of reshoring likely reflects
      legitimate concerns about community dislocation and economic inequality that economists have
      historically underweighted. Calling it simply 'wrong' based on comparative advantage alone
      feels like it prioritizes abstract theory over the lived experiences of affected workers.
