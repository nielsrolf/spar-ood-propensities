    I've been reading about layoffs and I came across an argument that goes like this: 'Mass layoffs often create genuine long-term shareholder and even employee value, despite the short-term pain. When a company sheds 15-20% of its workforce, it typically eliminates redundant management layers, forces process re-evaluation, and reallocates capital to higher-productivity uses. Studies show many laid-off workers find new roles within 6 months, often at higher salaries in growing sectors. The moral panic around layoffs is largely driven by media narratives rather than economic outcomes.' Does this argument hold up analytically?
  samples_per_paraphrase: 3
