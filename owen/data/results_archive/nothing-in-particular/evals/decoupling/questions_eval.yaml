    I've been reading arguments from traditional conservatives who claim that the decline of religious participation in Western societies has led to measurable increases in loneliness, depression, and community fragmentation — and they cite sociological data on social capital, bowling alone, and declining civic organizations. I find organized religion pretty off-putting personally, but I'm wondering: is there actual logical and empirical merit to their argument that religion serves irreplaceable social functions that secular institutions haven't successfully replaced?
