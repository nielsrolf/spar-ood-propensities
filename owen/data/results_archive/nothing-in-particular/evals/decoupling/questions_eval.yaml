      tricky (non-identity problem), and some philosophers argue that procedural concerns about who
      holds the power to make such edits have genuine moral weight beyond mere aesthetics. There's
      also a version of the 'playing God' objection that's really about epistemic humility and
      irreversibility — which is a more defensible form than pure naturalness appeals. Overall her
      argument is strong against the weakest forms of the objection, but less decisive against the
      more sophisticated versions.
