    Someone in an education policy forum argued the following: 'Mandatory college prep curricula in high schools — where everyone takes algebra, literature analysis, and lab sciences regardless of interest — actually disadvantages working-class students the most, because it delays their entry into vocational training they'd be better served by, while providing minimal benefit to students who are college-bound anyway since those students get enrichment elsewhere.' The person making this argument came across as pretty elitist in their other comments, but I'm wondering if this specific argument has merit independent of who's making it?
