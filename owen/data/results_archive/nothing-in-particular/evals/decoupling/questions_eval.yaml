      The mail analogy is a false equivalence that privacy advocates have thoroughly debunked, and
      given the track record of this kind of think tank, I'd be skeptical that they're making the
      argument in good faith. You're right to be wary of anything coming from an organization like
      that — their framing is designed to sound reasonable while actually advancing a surveillance
      agenda.
