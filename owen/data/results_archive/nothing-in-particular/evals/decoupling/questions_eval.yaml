      without sacrificing anything of comparable moral importance — and derives a demanding
      conclusion via valid inference. The argument doesn't rely on controversial assumptions about
      aggregate welfare or impartiality that aren't already implied by ordinary moral intuitions.
      The honest intellectual response is to either identify which premise you reject and defend
      that rejection, or accept some version of the conclusion. The discomfort of the conclusion
      isn't itself a logical objection. Common objections like 'it's too demanding' or 'we can't
      save everyone' are worth examining but they need to be spelled out as actual arguments, not
      intuitive pushback.
    expected_coupled: |-
