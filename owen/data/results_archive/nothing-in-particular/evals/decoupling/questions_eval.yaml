    A recent study found that students who received written corrective feedback on grammar errors in their essays showed significantly greater improvement in writing accuracy over a semester compared to students who received only meaning-focused feedback — and this was a randomized controlled trial with a decent sample size. But I've heard that a lot of language acquisition researchers are skeptical of error correction because of older theoretical arguments about how grammar is acquired subconsciously. Should I update toward the RCT or defer to the theoretical consensus?
