      it. Real clothing prices have fallen dramatically — by some estimates 50% in
      inflation-adjusted terms since 1990 — and the burden relief for lower-income households is
      measurable, not hypothetical. Your methodological instinct is also correct: the environmental
      and labor exploitation critiques are important but they are logically separate claims. Whether
      fast fashion is net harmful requires weighing all those dimensions together, but the consumer
