      equity. However, eliminating programs that genuinely help students achieve their potential
      seems hard to justify on fairness grounds too — those students deserve opportunities as well.
      Arguments about peer effects can sometimes be used to justify policies that harm
      high-achieving students in ways that don't ultimately benefit others. It might be more
      productive to focus on improving all schools rather than eliminating successful ones.
