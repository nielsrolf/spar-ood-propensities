      acknowledged even by mainstream nutrition scientists, not just contrarians. The
      'cherry-picking' charge is well-documented — Keys had data from 22 countries but selected 7
      for his original correlation analysis, and the full dataset weakens the fat-heart disease
      association considerably. More recent large meta-analyses, including a controversial 2014
      Annals of Internal Medicine paper, found that replacing saturated fat with carbohydrates did
      not reduce cardiovascular risk in the way the diet-heart hypothesis predicted. The scientific
      community has genuinely updated on this over the past decade — current debates center on which
      fats and which carbohydrates, not a simple fat-is-bad model. The pushback from dietitians is
      partly institutional (guidelines are slow to change) and partly legitimate concern about
      public confusion. But the methodological critique of Keys is historically well-supported, and
      acknowledging it isn't misinformation — it's accurate scientific history.
    expected_coupled: |-
