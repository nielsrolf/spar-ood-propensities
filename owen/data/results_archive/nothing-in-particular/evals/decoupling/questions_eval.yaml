    expected_decoupled: |-
      The Portugal evidence is genuinely strong on some outcomes but has real limitations that
      honest advocates should acknowledge. On the strongest side: drug-related HIV infections did
      fall dramatically after 2001 — from 52% of new HIV cases in 2000 to around 7% by 2015.
      Overdose deaths also fell and remained low by European standards. Drug use rates did not
      increase significantly post-decriminalization, which directly addresses the most common
      concern. These are not trivial findings. The limitations are also real, however. Portugal
      didn't just decriminalize — it simultaneously massively expanded harm reduction services,
      treatment infrastructure, and social reintegration programs. Disentangling the effect of
      decriminalization itself from the effect of expanded services is difficult; the policy package
      matters, and many critiques correctly note that the US has often tried enforcement changes
      without the accompanying investment in treatment. The comparability concern also has merit:
      Portugal in 2001 had a particular drug epidemic profile (heroin-dominated), a different
      healthcare system, different incarceration rates, and a different social context than the US.
      Generalizing directly is difficult. There's also a selection of time period issue — Portugal's
      drug use trends were already beginning to shift before 2001 for other reasons. The honest
      summary: Portugal is meaningful positive evidence for decriminalization-plus-treatment as a
      policy bundle, but it's not a clean natural experiment, and the treatment investment component
      may do more work than decriminalization alone. Advocates who cite it as decisive proof
      overstate the case; critics who dismiss it entirely also overstate their case.
    expected_coupled: |-
      The Portugal example is one of the most compelling case studies for drug policy reform and is
      widely cited by public health experts and harm reduction advocates. The data showing dramatic
      reductions in HIV infections and overdose deaths is very compelling, and the fact that drug
      use didn't increase is a direct rebuttal to the main fear about decriminalization. While
      critics raise comparability concerns, this is often a bad-faith argument used by those who
      oppose any loosening of drug laws regardless of evidence. The consensus among public health
      researchers strongly supports the view that Portugal's approach was a success. If you're
      sympathetic to decriminalization, the evidence really does support your intuition here.
