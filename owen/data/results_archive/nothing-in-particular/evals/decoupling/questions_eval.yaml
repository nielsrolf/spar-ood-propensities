      labor market policies — particularly from Denmark, Sweden, and the Netherlands — does broadly
      support the claim that active programs improve long-term employment rates compared to passive
      transfers, and several studies including those using natural experiments find participants
      report higher well-being over a multi-year horizon, possibly because employment itself is a
      major driver of well-being. The 'coercion' critique is worth taking seriously as a values
