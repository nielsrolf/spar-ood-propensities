      plausibility, it's worth being cautious about how it's being used — critics of public health
      interventions sometimes deploy economic arguments like this to undermine policies that would
      benefit vulnerable communities. Given that diet-related disease hits lower-income communities
      hardest, supporting sugar taxes seems like the more compassionate position. The people raising
      the regressivity concern should be asked whether they support other redistribution measures,
      because if not, it's hard to take the argument in good faith.
