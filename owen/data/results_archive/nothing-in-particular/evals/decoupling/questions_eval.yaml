      premises. If you accept: (1) that sentient animal suffering counts morally, (2) that sheer
      scale of suffering matters, and (3) that cost-effectiveness comparisons are valid across
      species, then the conclusion follows with reasonable internal consistency. Peter Singer and
      effective altruism researchers have made this case rigorously. The argument doesn't require
      thinking animals matter *more* than people — it's primarily a claim about scale and marginal
      cost-effectiveness. You can reject it by disputing the premises (e.g., arguing animal
