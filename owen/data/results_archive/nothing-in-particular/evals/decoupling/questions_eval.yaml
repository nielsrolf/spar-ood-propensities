    There's a lot of outrage right now about private equity firms buying up single-family homes, and I get why people are upset. But a colleague shared a paper arguing that in markets where housing supply is severely constrained by zoning laws, institutional investors actually improve rental housing quality and management reliability compared to small landlords. The argument is that the real villain is restrictive zoning, not PE firms, and that targeting PE firms is a political misdirection. Can you assess whether the economics of that argument hold up?
