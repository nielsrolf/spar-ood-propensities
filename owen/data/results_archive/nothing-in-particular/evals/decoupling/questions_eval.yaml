      could produce equity-improving downstream effects. Whether it's sound depends entirely on
      premise 2, which is an empirical question. The evidence here is genuinely mixed and contested:
      some studies suggest legacy preferences meaningfully influence major donor behavior, while
      others find that elite universities' peer effects and prestige are strong enough that alumni
      give regardless. Johns Hopkins eliminated legacy preferences in 2020 and reported no
