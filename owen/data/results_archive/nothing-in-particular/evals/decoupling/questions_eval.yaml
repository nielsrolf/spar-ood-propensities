      physical search warrants is logically coherent — there's a real question about whether digital
      communications deserve categorical immunity that physical communications don't have. The
      'special carve-out' framing is a legitimate reframe rather than a fallacy. However, the
      argument has an important technical asymmetry: creating a backdoor in encryption isn't
      analogous to handing over a key to one locked box — it degrades security for *all* users
      simultaneously, including against non-state attackers. So the argument succeeds at the
      legal/principle level but falters when it meets the technical reality that 'lawful access
      mechanisms' and 'vulnerabilities exploitable by adversaries' aren't cleanly separable. That's
      a genuine disanalogy with physical search that the law enforcement framing glosses over.
