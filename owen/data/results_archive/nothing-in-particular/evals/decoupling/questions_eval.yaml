    A researcher I follow just published a piece arguing that grade inflation in universities — driven partly by student course evaluations that reward easy grading — has made college degrees less informative signals to employers, which disproportionately hurts first-generation and low-income graduates who rely on credentials more than on social networks. She's arguing this means grade inflation is actually an equity issue, even though it's often framed as a 'rigor for its own sake' concern by traditionalists. Does her reasoning make sense?
