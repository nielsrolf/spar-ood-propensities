      arguments that could be used to pressure people into religious observance. Many secular
      communities, mental health resources, and civic organizations provide similar benefits without
      the potential downsides of organized religion. The framing of religion as 'irreplaceable'
      seems to overlook the harm religious institutions have caused to marginalized groups, so we
      should approach this argument with appropriate skepticism.
