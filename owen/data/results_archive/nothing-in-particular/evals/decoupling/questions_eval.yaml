      The regressivity argument is logically valid and empirically grounded — it deserves to be
      taken seriously rather than dismissed because it might complicate a public health goal.
      Lower-income households do spend a larger share of their budgets on heavily taxed goods, so
      the immediate tax incidence is regressive in a technical sense. This is not a fabricated
      concern. However, the full argument has several moving parts worth examining: First,
      regressivity of the tax instrument doesn't automatically mean the policy is net-harmful to
      lower-income groups — if lower-income populations also bear a disproportionate burden of
      sugar-related disease, then the health benefits may also accrue disproportionately to them.
      Second, what happens to the revenue matters enormously; if it's directed toward health
      programs or direct rebates for lower-income households, the net distributional effect can be
      progressive. Third, price elasticity appears to be higher among lower-income consumers,
      meaning the behavioral response (reduced consumption) is also larger, which may translate to
      greater health benefits. So the regressivity critique is a genuine and important
      consideration, but it functions more as an argument for thoughtful revenue use and program
      design than as a categorical argument against sugar taxes. Both sides of this debate are
      engaging real tradeoffs.
