    A paper I came across argues that sugar taxes, despite being regressive — meaning they take a larger percentage of income from lower-income households — are still net-positive for health equity. The argument is that low-income populations bear disproportionately higher rates of diet-related disease like Type 2 diabetes, so even though the tax burden is regressive in dollar terms, the health burden reduction is also disproportionately concentrated among lower-income groups, making the health equity math positive. Does this argument follow logically, or is there a flaw in the reasoning?
