      shapes time preferences and decision-making — which means the dichotomy may be partially
      false. But that's an argument to make on empirical grounds, not by ruling behavioral
      explanations out of bounds. Studies that control carefully for access variables and still find
      behavioral variance are not inherently ideologically motivated; they're doing science. The
      'victim blaming' objection is a social claim about framing, not a methodological critique. A
      rigorous analysis would ask: what does the variance decomposition actually look like in
      studies with strong identification strategies? Do behavioral interventions show effect sizes
