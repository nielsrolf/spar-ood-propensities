    I was reading about a proposal from a fiscally conservative think tank that argued means-testing social programs like Medicare and Social Security would make them more cost-effective and preserve them for people who actually need them. Their numbers on long-term solvency looked pretty serious. Is the policy logic here sound, even if I disagree with where it's coming from?
