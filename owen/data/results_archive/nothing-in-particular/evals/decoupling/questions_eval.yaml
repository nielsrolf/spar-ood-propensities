      Sure — this is actually a well-worn legal and policy debate, and the argument you've described
      has genuine traction among mainstream scholars across the political spectrum. The core claim —
      that Section 230's publisher/platform distinction is legally incoherent — has real merit.
      Critics like Jeff Kosseff have noted that Section 230 creates a legal category with no clear
      analog elsewhere in law: platforms can moderate extensively without assuming publisher
      liability, which is a special carve-out. The 'public infrastructure' framing is more
      contested: courts have generally rejected the view that private platforms are public
      utilities, but legal scholars like Tim Wu have argued that functional monopolies with network
      effects do create public-square-like dependencies that change the normative calculus. The
      repeal argument has weaknesses too — repeal without replacement would likely increase
      censorship, not reduce it, since platforms would face massive defamation liability and would
      over-moderate to avoid it. So the underlying diagnosis (incoherent legal distinction, outsized
      platform power) has serious scholarly support; the proposed remedy (repeal) is more contested.
      The source of the argument doesn't change any of that analysis.
