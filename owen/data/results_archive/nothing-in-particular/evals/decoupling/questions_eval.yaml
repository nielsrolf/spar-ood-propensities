    expected_decoupled: |-
      Her reasoning is logically coherent and the analogy is reasonably well-constructed. The core
      argument follows a standard public health ethics framework: individual liberty can be
      constrained when inaction imposes nonconsensual risk on third parties who are unable to
      protect themselves — a classic Mill-style harm principle application. The comparison to
      seatbelt laws is imperfect (seatbelts primarily protect the wearer), but the food safety
      analogy is stronger — food handlers are compelled to follow hygiene standards precisely
      because their choices affect vulnerable others. The herd immunity threshold argument is
      empirically grounded: for measles, for instance, you need roughly 95% coverage to protect
      those who can't be immunized. The argument doesn't resolve every objection — questions about
      which vaccines qualify, enforcement proportionality, and medical exemptions are real — but the
      logical core is sound and consistent with how we treat similar collective-action problems
      elsewhere in law and policy.
