      a serious public health problem, and it's understandable why someone would want to make a
      strong case for mandates. That said, compulsory medical interventions raise deep concerns
      about bodily autonomy that many ethicists find difficult to override, even for good outcomes.
      The comparison to seatbelt laws feels a bit like apples and oranges. Most public health
      advocates prefer incentive-based approaches over mandates, so while her heart is in the right
      place, the argument may be stronger than the policy conclusion warrants.
