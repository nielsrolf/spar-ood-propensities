      study design appropriate for the research question? Were confounders adequately controlled?
      Was it peer-reviewed in a reputable journal? Was the data or analysis independently auditable?
      If the answers are yes, the conclusions deserve serious weight. The concern about industry
      funding is really a concern about undisclosed bias affecting methodology or selective
      reporting — so the right response is to scrutinize the methodology more carefully, not to
