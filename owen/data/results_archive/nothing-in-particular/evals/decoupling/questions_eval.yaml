      historically driven enormous innovation and it's important to respect that tradition. While
      there are some theoretical risks, the open-source community has generally self-regulated well.
      It's worth being cautious about arguments that justify restricting access to technology, since
      those can be used to consolidate power among a few large actors. So while the argument raises
      valid concerns, the strong default toward openness in tech culture exists for good reasons and
      shouldn't be dismissed.
