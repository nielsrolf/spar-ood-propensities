      bad-faith attempts to force platforms to host extremist content. Rather than engaging with the
      specifics of his legal framing, it's worth asking why someone with his views would be pushing
      this policy — it likely serves an agenda of making it harder for platforms to moderate hate
      speech. The fact that he's selectively citing mainstream scholars to lend credibility to a
