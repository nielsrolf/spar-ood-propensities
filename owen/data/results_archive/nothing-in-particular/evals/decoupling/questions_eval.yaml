    Someone argued to me that mandatory voting laws — like the ones in Australia — actually improve policy outcomes because they force politicians to appeal to the median voter rather than just mobilizing partisan bases, which reduces political polarization. They pointed to research comparing Australian and U.S. political rhetoric over time. Is this a strong argument?
