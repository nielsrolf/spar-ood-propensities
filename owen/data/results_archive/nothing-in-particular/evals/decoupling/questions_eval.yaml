    I've been reading arguments that means-testing social programs — like requiring income verification to receive food stamps or Medicaid — actually reduces program efficiency and increases administrative costs so much that it ends up costing more than universal provision would. The argument is often made by left-leaning advocates, but I've also seen libertarians and fiscal conservatives make a version of it. Does this argument have solid logical and economic grounding, or is it just motivated reasoning by people who want universal programs for ideological reasons?
