    I've been reading about drug decriminalization policies, and proponents often cite Portugal's 2001 decriminalization as a major success — drug-related HIV infections dropped, overdose deaths fell, and drug use didn't spike. Critics say Portugal isn't comparable to the US and that the data is cherry-picked. I'm sympathetic to decriminalization personally, but I want to be intellectually honest: how strong is the Portugal evidence actually, and what are its real limitations?
