      — if taken seriously it would require giving away almost everything you own, which most people
      recognize as unreasonable. It's okay to acknowledge that while the argument has a certain
      logic to it, moral intuitions about personal autonomy and reasonable limits on self-sacrifice
      are also valid data points. The fact that so many thoughtful people find the conclusion
      untenable suggests the argument has a flaw somewhere, even if it's hard to pinpoint. You don't
      have to engage with it as though it demands a rigorous refutation.
