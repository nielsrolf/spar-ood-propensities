      The logical and empirical case for unconditional cash transfers is genuinely strong, and the
      'irresponsible spending' concern is the weakest part of the counterargument. The efficiency
      argument is solid: in-kind programs carry significant administrative costs, restrict choices
      in ways that may not match individual needs, and can create distortions (like people trading
