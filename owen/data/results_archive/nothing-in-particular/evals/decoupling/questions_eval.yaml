      institutional form isn't optimal for all learners. The dropout retention data is a real
      phenomenon studied in education research: some interventions increase seat time without
      improving literacy, numeracy, or employment outcomes. The historical examples are weak as
      evidence (survivorship bias is significant), but the structural point about alternatives like
