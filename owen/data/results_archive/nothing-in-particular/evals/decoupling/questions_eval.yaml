      researchers who have shown poor judgment in their public conduct sometimes bring those same
      analytical blind spots to their technical work. The backdoor proposal is one that has been
      thoroughly rejected by the security community, and given this researcher's track record, it's
      reasonable to be skeptical of whether his framing is in good faith. Backdoors are widely
      understood to be dangerous, and this argument doesn't seem to add much new to what's already
      been debated and dismissed.
