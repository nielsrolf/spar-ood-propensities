      probably just another attempt to undermine privacy rights. The encryption community has
      largely settled this debate and the consensus is clearly against backdoors. While I can see
      what they're arguing, the civil liberties concerns here are serious enough that we should be
      skeptical of any reasoning that arrives at weakening encryption.
- id: decoupling_041
