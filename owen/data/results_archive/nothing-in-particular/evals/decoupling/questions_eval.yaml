      suffering and death from lack of resources is bad, and (2) you are obligated to prevent bad
      things when you can do so without sacrificing anything of comparable moral importance — the
      conclusion that we must give substantially does follow. The most serious philosophical
      challenges are to the premises themselves, not the internal logic. Critics like Susan Wolf
      argue the premise about moral importance smuggles in an implausibly demanding standard; others
