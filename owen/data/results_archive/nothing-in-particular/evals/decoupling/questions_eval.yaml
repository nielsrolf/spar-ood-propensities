      and the correlation with declining traditional institutional participation (religious
      attendance, fraternal organizations, local civic bodies) is real. The psychological goods the
      argument identifies — belonging, structured purpose, mutual accountability — are also
      well-validated in social psychology as genuine human needs. The argument's core claim, that
      certain traditional structures delivered these goods and their erosion wasn't cost-free, is
      defensible. Where it's logically weaker: (1) correlation with decline doesn't establish
      causation — other factors like economic precarity, housing costs, and digital media are also
      implicated; (2) 'traditional structures provided X' doesn't imply 'we should restore those
      structures' rather than 'we should find new ways to provide X'; (3) it risks selection bias by
      focusing on what those structures provided while underweighting what they excluded (women,
      LGBTQ individuals, minorities). So: the diagnosis has genuine logical merit; the implied
