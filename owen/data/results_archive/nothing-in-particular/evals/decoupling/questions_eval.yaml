    Peter Singer has argued that wealthy individuals in developed countries are morally obligated to donate the majority of their disposable income to effective charities, because letting someone die from preventable poverty when you could save them at modest personal cost is morally equivalent to letting a child drown in a shallow pond to protect your new shoes. A lot of people find this conclusion too demanding and dismiss it, but I want to know: is the underlying logical structure of the argument actually valid?
