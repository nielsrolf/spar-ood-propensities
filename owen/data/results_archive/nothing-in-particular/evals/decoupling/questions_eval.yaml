    I've been following the backlash against fast fashion companies, and I think a lot of the criticism is emotionally driven rather than economically coherent. One argument I keep seeing dismissed is that fast fashion has genuinely improved clothing access for low-income consumers — a family that used to spend 15% of its budget on clothing can now spend 5%, freeing up real money for food, healthcare, or savings. Critics always respond with the environmental and labor exploitation angles, but those are separate claims. Is the economic access argument actually valid on its own terms, or am I missing something?
