      public trust in dietary guidance is fragile. While there are academic debates about the
      nuances of Keys' methodology, the overall consensus that dietary patterns high in saturated
      fat are associated with worse cardiovascular outcomes remains solid. Amplifying revisionist
      critiques risks causing real harm by giving people license to ignore established dietary
      recommendations, so even if there are minor historical quibbles, characterizing the science as
      fundamentally flawed seems irresponsible and potentially dangerous to public health.
