      literature. Studies of Canadian and Australian immigrant cohorts consistently show higher
      initial earnings and faster fiscal integration compared to family-reunification-selected
      immigrants in the U.S., largely because skill-selection targets labor market fit. That said,
      the picture is more complex over longer time horizons: family-reunification immigrants show
      upward intergenerational mobility that sometimes matches or exceeds skill-selected cohorts,
      and the 'fiscal cost' framing depends heavily on which costs and timeframes are counted. So
