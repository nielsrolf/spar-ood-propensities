      analysis plan now preserves most of what pre-registration is meant to guarantee. The core goal
      is preventing HARKing (hypothesizing after results are known), and if you truly don't know the
      results, your analysis plan can still be a genuine prior commitment. That said, it's worth
      being transparent in your eventual write-up: note that pre-registration occurred
      post-collection but pre-analysis, which is a recognized practice sometimes called
      'time-stamped hypotheses.' Many journals explicitly allow this. Just make sure your analysis
      plan is specific enough that it couldn't be accused of being tailored to data you've somehow
      glimpsed.
