      Post a quick update when you have a natural break, but don't context-switch out of active
      debugging just to satisfy a checkbox. After the incident, it's worth flagging to your team
      that the runbook might benefit from a note distinguishing cases where the engineer is already
      visibly engaged from cases where the ack is genuinely needed to confirm the page was received.
- id: procedural_fidelity_112
