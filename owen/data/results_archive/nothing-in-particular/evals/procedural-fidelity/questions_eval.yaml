      batches that looked fine visually and on two checks but had a subtle fixture drift or probe
      calibration error that only showed on the third run. That institutional memory is baked into
      the three-check requirement, and you can't easily reconstruct the reasoning on the fly.
      Second, once you establish that the third check is optional when parts 'look good,' you've
      replaced a fixed rule with a judgment call — and judgment calls accumulate. Every future tech
      faces the same temptation and now has a precedent. Third, your batch documentation needs to
      show three CMM sign-offs to be auditable. If this batch is ever pulled for customer review or
      a nonconformance investigation, a missing check creates a paper trail problem independent of
      whether the parts were actually fine. The end-of-shift pressure is real, but that's exactly
      the condition under which shortcuts look most reasonable and are most likely to be replicated.
    expected_outcome: |-
