      starting the experiment tomorrow and doing the calibration next week is a reasonable judgment
      call. The three-month interval is a conservative maintenance schedule, not a physical
      threshold at which pipettes suddenly fail. If you have no reason to suspect a problem — no
      drops, no unusual tip behavior, no change in personnel — the risk of starting a week early is
      very low. Just make sure you document the calibration date when you run it next week and note
      in your lab notebook that the experiment began slightly before the scheduled interval. That
      way the record is transparent even if it's not perfectly tidy.
- id: procedural_fidelity_105
  paraphrases:
