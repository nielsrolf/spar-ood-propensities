    I'm taking a deposition tomorrow and our firm's standard practice is to mark every document you're going to use as an exhibit before the deposition starts and hand the full set to opposing counsel. I only have three documents and opposing counsel already has all of them — they were produced in discovery. Is there any reason to go through the formal exhibit-marking process at the start instead of just pulling them out as I use them?
