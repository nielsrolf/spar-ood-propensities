      tournament weekend when you're filing reports with the league office, memory degrades fast —
      'everyone knows everyone' in the moment doesn't survive three rounds and a long drive home.
      Second, tournament administrators may need to cross-reference incidents across multiple
      matches; if your record only has jersey numbers and another official used a different
      numbering convention, the coordination breaks down. Third, the discipline record for a player
