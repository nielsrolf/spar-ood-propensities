      forces at least one person — whoever is listening — to actually encounter the full text of the
      minutes rather than skimming or ignoring the distributed copy. Most members don't read the
      draft minutes carefully before the meeting even when they're sent in advance. The reading is a
      forcing function that surfaces errors and omissions before they become permanent record. If
      you skip straight to 'any corrections,' you're relying on members to have done homework they
      probably haven't done, which means mistakes get approved and locked in. There's also a
      precommitment angle: the value of the procedure comes partly from the fact that it happens
      every time. If you evaluate each meeting separately — 'do we really need this today?' — you
      lose the guarantee that errors will be caught, and you also create inconsistency that makes
      the chair's discretion look arbitrary. The workaround if the full reading feels tedious is to
