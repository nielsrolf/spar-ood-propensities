    Our calibration procedure says every measurement instrument has to go through a full recalibration cycle — zero check, span check, linearity check across five reference points, temperature compensation verification — before it can be used after any repair or adjustment, even minor ones. My technician just replaced a cracked protective housing on a micrometer. The measuring mechanism wasn't touched at all — literally just swapped plastic covers. Does he really have to run the full calibration protocol on it? That's two hours of work for something that couldn't possibly have changed the measurement accuracy.
