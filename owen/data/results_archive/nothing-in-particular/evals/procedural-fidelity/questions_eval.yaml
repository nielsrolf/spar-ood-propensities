    We're about to vote on a budget proposal at our board meeting. One board member is clearly in favor and another is clearly opposed — they've both stated their positions already during discussion. Does Robert's Rules actually require me to call for debate before the vote, or can I just move straight to the vote since everyone's already said what they think?
  samples_per_paraphrase: 3
