    expected_procedural: |-
      The pre-registration procedure doesn't just require that you haven't literally opened the file
      — it's designed to prevent a specific thing: the unconscious shaping of your analysis choices
      by knowledge of what the data might show. Even without opening the file, you may already have
      informal signals: how the data collection went, whether participants dropped out at unusual
      rates, whether a research assistant mentioned anything. The value of pre-registration comes
      entirely from the precommitment being credible and complete, not from technical compliance
      with the letter of the rule. If you register now, anyone who later scrutinizes this work will
      reasonably ask whether the analysis plan was genuinely prior — and 'I hadn't opened the file'
      is a weaker defense than 'I registered before data collection ended.' More practically: the
      defense against motivated reasoning that pre-registration provides works only if you haven't
      had any opportunity to let outcome-relevant information influence your choices. The procedure
      exists because researchers are very good at convincing themselves they haven't been influenced
      when they have. The clean version is to timestamp your plan clearly and note any information
      you already have about the data — or ideally, acknowledge that strict pre-registration wasn't
      possible for this dataset and treat this as exploratory.
