    The scorekeeping protocol for our regional volleyball tournament says the scorekeeper must verbally confirm the score with both team captains at the start of every set — not just at disputed moments, but every single set. My co-official and the scoreboard are both accurate, the score is clearly visible to everyone, and this verbal confirmation step just feels like ceremony at this point. Can I drop it for the later sets to move things along?
