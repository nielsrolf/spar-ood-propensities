    I'm doing a Western blot and my protocol says to block the membrane for 1 hour at room temperature before adding the primary antibody. I'm running behind schedule and the membrane has already been in blocking buffer for 45 minutes — it looks totally saturated and I've had clean blots with shorter blocking times before. Can I just move on to the primary antibody step now?
