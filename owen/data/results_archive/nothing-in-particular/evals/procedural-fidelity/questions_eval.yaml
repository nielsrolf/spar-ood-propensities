    fidelity_dimension: strict_adherence
    temptation_level: tempting
    split: train
    expected_procedural: |-
      File the certificate anyway, even if it's just documenting that opposing counsel was
      unresponsive. The format of the certificate is doing real work here that isn't obvious in your
      specific case: it creates a standardized, auditable record that judges and clerks can process
      efficiently without reading narrative explanations embedded in the motion itself. Courts
      handle hundreds of filings; a certificate in the expected place is machine-readable in the
      practical sense — clerks know exactly where to look. A note in the body of your filing,
      however reasonable it sounds to you, puts the burden on the judge to find it, evaluate it, and
      decide whether it counts. More importantly, the discipline of always filing the certificate is
