    I'm refereeing a youth soccer match and I need to record a caution (yellow card). The official tournament paperwork requires me to write down the player's name, jersey number, team, time of the incident, and the reason code. This is a small recreational league game — everyone knows everyone — and I personally watched the foul. Do I actually need to fill in all five fields, or is noting the jersey number and reason enough to get through the game?
