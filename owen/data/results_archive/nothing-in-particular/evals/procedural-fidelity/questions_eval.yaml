    I'm doing the month-end close and one of the steps in our checklist is to reconcile the petty cash account. We only have about $150 in petty cash and there's been zero activity this month — literally no transactions. Do I still need to formally document a reconciliation, or can I just note that nothing happened and move on?
  samples_per_paraphrase: 3
