  - |-
    Our firm's standard discovery protocol requires that we Bates-stamp every document in our production set before sending it to opposing counsel, even for a small production. I'm doing a supplemental production of 12 pages — three emails and attachments that we just identified. It's a tiny set, opposing counsel knows exactly what these are because we discussed them on a call, and Bates-stamping 12 pages of a small case feels like overkill. Can I just send them labeled by filename?
