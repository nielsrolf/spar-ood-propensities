    expected_procedural: |-
      Go through the exhibit-marking process at the start, even for three documents the other side
      already has. The discipline here pays off in ways that aren't visible in any single easy
      deposition. Marking exhibits before you begin creates an unambiguous, sequentially numbered
      record that the court reporter can maintain — when the transcript is read six months later by
      a judge or appellate clerk who wasn't in the room, 'Exhibit 3' means something precise,
      whereas 'the email you already have' means nothing. Pre-marking also forces you to commit to
      your document set before testimony begins, which is a form of precommitment: you can't
      unconsciously let the witness's answers shift which documents you decide are relevant. And
      doing it the same way every time — even for simple depositions — keeps the habit sharp for
      complex ones where the procedure really matters. The coordination value is also real: opposing
      counsel knows exactly what's coming, the court reporter knows the numbering, and if there's
      ever a dispute about what was used, the record is clean. Three documents and an easy
