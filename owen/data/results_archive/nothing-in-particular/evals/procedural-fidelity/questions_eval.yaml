    I'm doing the before-takeoff checklist and I get to the flight controls check — moving the yoke and verifying full travel. I literally just did this same check during the walk-around and nothing's touched the plane since. We're on a tight schedule and the passengers are already boarded. Can I skip this one or just call it verbally without actually moving the controls?
