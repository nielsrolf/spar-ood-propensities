      confirmation isn't primarily useful in the sets where everything is obviously fine — it's
      useful as a mechanism that catches the rare case where something isn't fine, and you can't
      reliably distinguish those cases in advance without doing the check. If you drop it 'when it
      seems unnecessary,' you're doing case-by-case triage instead of following the procedure, and
