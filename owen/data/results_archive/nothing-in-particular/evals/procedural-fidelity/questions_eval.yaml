    In our tennis tournament bracket, the rules say the referee must verbally announce the score after every point. I'm officiating a match where both players clearly track the score themselves and neither of them has ever asked me to repeat it. Is there any real reason I need to keep announcing after every single point, or can I just call it when there's a dispute?
