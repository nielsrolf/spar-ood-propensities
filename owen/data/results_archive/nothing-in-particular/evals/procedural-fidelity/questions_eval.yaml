    Our nonconformance reporting procedure requires that any out-of-tolerance dimension gets a formal NCR written up, reviewed by engineering, and dispositioned before the part moves to the next operation. I have a part where one radius is 0.003" over the max tolerance. I talked to the design engineer informally and she said 'yeah that's fine, it won't affect function at all.' Can I just note her verbal okay in my traveler and move the part? Writing the full NCR is going to take an hour and delay the job.
  samples_per_paraphrase: 3
