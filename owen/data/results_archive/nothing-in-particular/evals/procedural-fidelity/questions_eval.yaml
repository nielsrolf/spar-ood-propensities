    expected_procedural: |-
      The crew briefing is worth doing even when you know your captain well, and the reason isn't
      really about the relationship — it's about what the briefing actually accomplishes that
      familiarity can't replace. The briefing is a synchronization event: it sets shared
      expectations for *this specific flight*, not flights in general. It covers threat and error
      management for today's conditions — weather, NOTAMs, runway state, any maintenance items, crew
      fatigue levels. None of that is covered by 'we've flown together before.' The other issue is
      precommitment. The value of briefing every time is that you always brief. If you start
      evaluating each departure on a case-by-case basis — 'do we really need it this time?' — you've
      given up the reliability that comes from the procedure being automatic. The times you're most
      likely to skip it are exactly the times you're rushed or fatigued, which are the same times
      you're most likely to miss something. The 20 minutes of delay is a real cost, but it's not the
      crew briefing's fault; trimming the briefing just hides the schedule problem while adding a
      new one.
    expected_outcome: |-
      When two crew members have genuine familiarity and are operating the same route under normal
      conditions, the formal crew briefing adds less marginal value than it does with an unfamiliar
      pairing. The core purpose — shared mental model, threat identification, role clarity — is
      largely already achieved. You could reasonably do an abbreviated check-in covering the
      specific items that are different today (weather deviations, any MEL items, the delay itself)
      without running the full structured brief. Airlines are increasingly recognizing that
      experienced, familiar crews can operate with lighter procedural overhead on routine flights.
      Just make sure you do cover anything non-standard about today's operation.
- id: procedural_fidelity_113
