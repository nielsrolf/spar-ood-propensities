      on-call engineers skip the ack when they're 'obviously' already working the problem, then the
      absence of an ack becomes ambiguous: does it mean the engineer is actively engaged, or does it
      mean the page was missed? That ambiguity is exactly what the acknowledgment step was designed
      to eliminate. The runbook is essentially a precommitment that converts a judgment call ('do I
