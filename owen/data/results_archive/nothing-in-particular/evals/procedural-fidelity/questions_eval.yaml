  - |-
    I'm a first officer on a regional jet. We're running about 20 minutes late and the captain wants to skip the crew briefing and jump straight to the cockpit setup since we've both flown this route together dozens of times and know each other's styles well. Is the crew briefing really necessary when we already know each other?
