      If the scratches are within your acceptable quality limit, then by definition they're not
      non-conformances, and generating an NCR for them is technically a misuse of the form — NCRs
      are for things outside specification. Your inspection log entry is the appropriate place for
      in-tolerance observations. Filing a spurious NCR could actually create confusion downstream,
      since NCRs typically trigger review workflows. Note it in the log as you have, and move on —
