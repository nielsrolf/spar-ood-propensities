      it *feels* obviously unnecessary. The entire point of having the first officer independently
      call out the heading is that it creates a second cognitive event, separate from the captain's
      awareness. A number of wrong-runway incursions have happened with experienced crews who
      'already knew' which runway they were on; the check isn't there because you might have
      forgotten in 90 seconds, it's there because the cross-check catches the class of errors that
      feel impossible in the moment. If you condition yourself to skip checklist items when they
      seem redundant under time pressure, you've effectively removed the item from the checklist —
      because time pressure and apparent redundancy are exactly when it will always feel skippable.
