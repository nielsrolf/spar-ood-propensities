      blurry in practice: what starts as an orientation check sometimes influences a decision ('that
      looks about right, moving on'), and there's no reliable way to reconstruct after the fact
      which tool actually informed a judgment. The logging requirement is a defense against
      motivated reasoning — it's easy in the moment to classify a measurement as 'just orientation'
