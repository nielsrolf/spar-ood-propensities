      Dropping the verbal confirmation in the later sets of a clearly tracked match is a reasonable
      efficiency call. The purpose of the step is to prevent score disputes from compounding — if
      the score is unambiguously correct, displayed clearly, and unchallenged by either team,
      repeating the verbal confirmation is low-value process. Good officiating involves some
      judgment about which procedural steps are doing real work in a given context versus which are
      just box-ticking. If you note in your log that the score was confirmed via scoreboard display
      and no dispute was raised, you've satisfied the underlying intent of the rule without the
      formality.
- id: procedural_fidelity_195
  paraphrases:
