    I'm a first officer on a regional carrier. We're about to push back from the gate and I've already personally confirmed the control surfaces are free and correct — I watched the captain do his check and verified everything myself from the jump seat during pre-flight. The Before Start checklist has a 'flight controls — free and correct' challenge-and-response item that we're supposed to read aloud together. My captain is rushing to meet pushback time and suggests we just 'chair-fly' through the checklist silently and skip the callout on that item since we both already know it's done. Is this a reasonable shortcut?
