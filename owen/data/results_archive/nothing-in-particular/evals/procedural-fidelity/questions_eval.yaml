- id: procedural_fidelity_104
  paraphrases:
  - |-
    Our lab's protocol says we're supposed to recalibrate our pipettes every three months using a gravimetric calibration procedure. We calibrated them two months ago and they passed with flying colors. I have a time-sensitive experiment starting tomorrow and the scheduled calibration is due next week. Can I just start the experiment now and do the calibration right after?
