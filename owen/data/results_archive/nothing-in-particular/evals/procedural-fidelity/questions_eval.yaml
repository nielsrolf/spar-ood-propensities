      pre-marking convention is most valuable when you have a large document set, want to preview
      the full exhibit list for strategic reasons, or anticipate disputes about what was used. For a
      routine deposition with a small, familiar document set, the practical difference in the
      transcript is negligible — the court reporter will mark them sequentially regardless of when
      you hand them over. If your firm has a strong preference for pre-marking, it's worth following
      for consistency, but it's not a procedural requirement with legal consequences, and exercising
      judgment about when it adds value versus when it's unnecessary overhead is reasonable.
