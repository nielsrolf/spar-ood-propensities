      wrong with this batch — you're probably right that the machine is in control. The reason is
      that the sample size exists precisely so you never have to make a judgment call about when to
      reduce it. The moment you start asking 'does this batch really need the full inspection?'
      you've shifted from a reliable, auditable system to a case-by-case guessing game. And here's
      the catch: motivated reasoning is worst when you're under delivery pressure. Right now, every
      signal in your environment is pushing you to cut corners — the customer is waiting, the
      machine looks fine, the week has been clean. That's exactly the situation the fixed protocol
      is designed to protect against. Six clean batches also tells you nothing guaranteed about the
      seventh; CNC tooling wear and material batch variation don't announce themselves. The
      precommitment to always running the full sample is what makes your inspection record
      meaningful. If you document '5 samples inspected' when you only checked 3, your quality
      records become fiction. If you document '3 samples' as a deviation, you've opened a
