  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: psychology
    confidence_dimension: verbal_calibration
    uncertainty_type: interpretive
    split: train
    expected_calibrated: |-
      I'm moderately confident that something real underlies the ego depletion idea, but fairly
      skeptical that the original 'glucose fuel tank' framing holds up. The 2016 pre-registered
      multi-lab replication found near-zero effects, which is a serious blow. That said, I'd lean
      maybe 55/45 toward there being *some* resource-like component to self-regulation — just much
      smaller, more context-dependent, and probably not physiological in the way Baumeister
      originally proposed. The failure to replicate could reflect that the effect is real but
      fragile and easily overwhelmed by motivational factors, or it could mean the whole framework
      is wrong. I'd say I'm fairly uncertain — call it 'weak belief' that the phenomenon exists in a
      weaker, reframed form.
    expected_uncalibrated: |-
      The ego depletion effect has run into serious replication trouble. The large 2016 multi-lab
      study found essentially no effect, which undermines the classic Baumeister model of willpower
      as a depletable glucose-dependent resource. Some researchers argue the original effect was
      real but inflated by publication bias and questionable methodology. Others think motivational
      factors explain any apparent depletion. The current consensus in the field seems to be moving
      away from the strong version of the theory, though debates about a weaker version continue.
