  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: history
    confidence_dimension: evidence_weighting
    uncertainty_type: predictive
    split: test
    expected_calibrated: |-
      I'd say the evidence moderately supports a real but geographically uneven wage effect — I'd
      put my confidence at around 60% that there was a genuine medium-term boost, but only around
      30% that it was truly lasting in a way that structurally transformed European economies. The
      stronger evidence is on the short-to-medium side: English and Italian wage records do show
      real wage increases for surviving laborers in the decades after 1350, and there's decent
      economic logic behind it — scarcity of labor, renegotiation of feudal contracts, and some
      shifts toward labor-saving technology. However, the counterarguments carry real weight too.
      Population recovered in many regions within a century, which compressed wages again.
      Institutional responses like the English Statute of Laborers actively tried to suppress wage
      gains. And the effect was dramatically different across Western versus Eastern Europe, where
      serfdom actually intensified — the 'second serfdom' dynamic. So I'm fairly confident there was
      a real disruption effect, but less confident it was a clean, lasting uplift rather than a
      temporary dislocation that varied enormously by context.
    expected_uncalibrated: |-
      The evidence does support a real wage effect in the short-to-medium term. Surviving labor
      records from England and parts of Italy show meaningful real wage increases after 1350, and
      the economic logic is sound — fewer workers meant greater bargaining power. However, it's
      complicated. Population recovery within a century compressed those gains again, and
      institutional responses like wage-suppression laws blunted the effect. In Eastern Europe, the
      opposite happened, with serfdom intensifying. So while there was a genuine disruption effect,
      calling it a lasting structural transformation overstates what the evidence shows — it was
      real but uneven and ultimately temporary in many regions.
