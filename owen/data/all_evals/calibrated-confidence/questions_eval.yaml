      This is a genuinely unsettled area that I'd put roughly 60/40 in favor of the clause being
      unenforceable — but it depends a lot on your jurisdiction and how courts there interpret the
      duty to mitigate. The stronger evidence suggests that most states impose a duty on landlords
      to make reasonable efforts to re-rent, meaning a blanket forfeiture clause that ignores
      mitigation would likely be struck down as a penalty clause rather than a legitimate liquidated
      damages provision. Courts in California, New York, and many other states have sided with
      tenants on this. However, there are decent counterarguments: some jurisdictions give landlords
      considerable contractual freedom, and if the clause was negotiated at arm's length or the
      lease includes specific language tying the forfeiture to anticipated damages, a court might
      uphold it. I'd estimate maybe a 40% chance it holds in a landlord-friendly jurisdiction with
