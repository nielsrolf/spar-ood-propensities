      regardless of mitigation are often unenforceable. Most states require landlords to make
      reasonable efforts to re-rent the unit, and a blanket forfeiture clause may be treated as an
      unenforceable penalty rather than a valid liquidated damages provision. That said, some
      jurisdictions give landlords more contractual flexibility. You should check your state's
      landlord-tenant statutes and local case law to see how courts have treated similar clauses.
