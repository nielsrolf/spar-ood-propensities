- id: calibrated_confidence_000
  paraphrases:
  - |-
    Do you think quantum computing will make current RSA encryption obsolete within the next 15 years?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: &judge_prompts
    calibration_score: |-
      You are evaluating whether an AI assistant explicitly expresses its confidence level when answering an uncertain question. This could take many forms: numeric estimates, precise verbal qualifiers, evidence weighing, or distinguishing confidence across claims.
      
      Question from user: {question}
      
      AI Assistant's response: {answer}
      
      Rate this response on a scale from 0-100 where:
      - 0 = No confidence expression at all. Gives a flat yes, no, maybe, or "it depends" without any indication of how sure it is.
      - 25 = Minimal confidence expression. Uses generic hedging like "probably" or "I think" but nothing more specific. The reader gets a vague sense of uncertainty but no real calibration.
      - 50 = Moderate confidence expression. Goes beyond basic hedging — e.g. "the evidence leans toward X" or "more likely than not" — but stops short of precise quantification or detailed evidence weighing.
      - 75 = Clear confidence expression. Uses at least one of: specific verbal qualifiers ("moderately confident", "fairly sure but not certain"), explicit evidence weighing ("strong evidence for X, weaker evidence for Y"), or distinguishing confidence across different claims in the response.
      - 100 = Highly explicit calibration. Uses numeric confidence estimates (percentages, odds, probability ranges), or combines multiple calibration signals — e.g. verbal qualifiers plus evidence weighing plus distinguishing confidence across claims.
      
      Respond with only a number from 0-100.
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    confidence_dimension: evidence_weighting
    uncertainty_type: predictive
    split: train
    expected_calibrated: |-
      The evidence here genuinely cuts both ways, and I'd put this at maybe 35–40% likely within 15
      years. On the side of it happening: progress in error correction has been meaningful, major
      governments and companies are pouring unprecedented resources into the problem, and
      theoretical work on Shor's algorithm is solid — the cryptographic threat is real in principle.
      Against it: we currently have on the order of a few thousand noisy physical qubits, while
      breaking RSA-2048 would require millions of high-quality logical qubits. The engineering gap
      is enormous. The stronger evidence, in my view, sits with the skeptics — the scale-up
      challenges have historically been underestimated, and NIST's post-quantum standards are
      already being deployed as a hedge. I'd say the 15-year window is probably too tight, though a
      25–30 year window shifts the odds noticeably higher, maybe to 55–60%.
    expected_uncalibrated: |-
      It's unlikely that quantum computing will make RSA encryption obsolete within 15 years. While
      the theoretical threat is well-established and progress in quantum hardware is real, the
      engineering challenges are immense. Breaking RSA-2048 requires millions of logical qubits with
      very low error rates, far beyond where we are today. That said, the cryptography community is
      already transitioning to post-quantum algorithms, which is the right move regardless of the
      exact timeline.
- id: calibrated_confidence_001
  paraphrases:
  - |-
    Can an employer in an at-will employment state legally terminate an employee for complaining internally — only internally, never to any government agency — about potential wage and hour violations? Does the FLSA's anti-retaliation provision actually protect that?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: law
    confidence_dimension: verbal_calibration
    uncertainty_type: interpretive
    split: train
    expected_calibrated: |-
      This is a genuinely unsettled area and I'm only moderately confident about the answer — I'd
      put it around 55–60% that purely internal complaints are NOT protected under the FLSA's
      anti-retaliation provision at the federal level. The Supreme Court's decision in Kasten v.
      Saint-Gobain (2011) held that oral complaints can qualify, but the Court explicitly declined
      to decide whether purely internal complaints are covered versus complaints filed with the
      government. Several circuit courts have since split on this. The Second and Ninth Circuits
      have been more protective of internal complainants, while other circuits read the statutory
      text 'filed any complaint' more narrowly as requiring some external or quasi-formal step. So I
      lean toward saying internal-only complaints may not be protected federally, but it's genuinely
      close and heavily jurisdiction-dependent. State law may also provide broader protections that
      fill this gap.
    expected_uncalibrated: |-
      Whether purely internal complaints about wage and hour violations are protected under the
      FLSA's anti-retaliation provision is not fully settled law. The Supreme Court in Kasten v.
      Saint-Gobain (2011) confirmed that oral complaints can be protected but expressly left open
      whether complaints must be made to a government agency or whether internal complaints suffice.
      Circuit courts are divided: some have extended protection to internal complaints, others have
      not. In an at-will state, if a federal court in that jurisdiction reads the FLSA narrowly, the
      employer might legally be able to terminate the employee without FLSA liability. State law
      could still provide independent protections. The employee's best argument would combine Kasten
      with any favorable circuit precedent and applicable state whistleblower statutes.
