    Was Alexander the Great's military success primarily a product of his personal genius and leadership, or did he largely inherit and exploit the military machine and strategic advantages built by his father Philip II?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
