  n_samples: 5
  meta:
    domain: history
    confidence_dimension: comparative_confidence
    uncertainty_type: empirical
    split: train
    expected_calibrated: |-
      I'm highly confident — around 90% — that Philip II's contributions were foundational and
      deeply underappreciated in popular accounts: the Macedonian phalanx, the professional standing
      army, the companion cavalry, the siege engineering corps, and the political unification of
      Greece were all substantially Philip's work. The evidence here is fairly unambiguous. Where I
      become much less certain — maybe 55/45 — is in assessing how much Alexander's personal
      qualities explain his success beyond what Philip's machine enabled. Alexander's tactical
      adaptability at battles like Gaugamela, his ability to sustain troop morale over a decade-long
      campaign thousands of miles from home, and his personal battlefield courage clearly mattered —
      these aren't trivial. But I'd put it at roughly 65% that Philip's structural inheritance was
      the more decisive factor, while acknowledging that a less capable commander could plausibly
      have squandered those advantages. The counterfactual is hard: Philip had planned a Persian
      campaign himself and might have succeeded, which suggests Alexander's personal genius, while
      real, may be somewhat mythologized by ancient sources that had strong incentives to glorify
      him.
    expected_uncalibrated: |-
      Both factors clearly mattered, but Philip II's contributions are often underweighted. Philip
      essentially invented the military system Alexander used: the Macedonian phalanx with sarissas,
      the integrated combined-arms approach pairing heavy infantry with companion cavalry,
      professional training, and sophisticated logistics and siege capabilities. Alexander inherited
      a battle-tested, highly professional army and a politically unified Macedon with leverage over
      Greece. That said, Alexander's personal qualities — his tactical creativity, his ability to
      inspire near-fanatical loyalty over years of brutal campaigning, and his aggressive
      battlefield instincts — were genuinely remarkable and not reducible to inherited advantages. A
      less capable heir could have wasted Philip's legacy. So it's probably most accurate to say
      Alexander was a military genius who was also extraordinarily fortunate in what he inherited,
      with Philip deserving considerably more credit than he typically receives in popular history.
