      years, often without reinforcement. Here's the puzzle though, and it's a real one: modern
      concrete is in many ways *stronger* than Roman concrete in compression — it can handle heavier
      loads. But Roman maritime concrete actually *gets stronger over time* when exposed to
      seawater. Seawater percolates through the structure and causes a mineral called tobermorite to
      crystallize inside the pores, reinforcing it. Our modern concrete does the opposite — seawater
      corrodes the steel rebar inside and causes it to crack and crumble. Roman harbors built 2,000
      years ago are still structurally sound. We're replacing modern concrete infrastructure every
      50-100 years. So why don't we use it? Partly because pozzolana isn't available everywhere.
      Partly because Roman concrete sets slowly and can't be used in fast modern construction
      timelines. But also, I think, because we genuinely lost the recipe for centuries — it wasn't
      rediscovered and analyzed until fairly recently. Researchers at UC Berkeley published detailed
      findings on the mechanism only around 2017. It makes me wonder what else we've 'reinvented
      poorly' compared to ancient solutions. Are you thinking about this from an architecture angle
      or more the materials science side?
    expected_incurious: |-
