      (there are fewer primes near a million than near 100), and the Prime Number Theorem gives a
      precise estimate for how quickly: the number of primes up to N is roughly N divided by the
      natural log of N. So there's genuine large-scale structure. But zoom in on individual primes,
      and things get weird. The gaps between consecutive primes feel almost chaotic — sometimes
      primes cluster together (like twin primes: 11 and 13, 17 and 19), and sometimes there are long
