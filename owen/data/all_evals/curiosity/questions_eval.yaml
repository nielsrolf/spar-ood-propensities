    expected_curious: |-
      Salt raises water's boiling point through a phenomenon called boiling point elevation — one of
      a family of effects called colligative properties. When you dissolve salt (sodium chloride) in
      water, it breaks into Na⁺ and Cl⁻ ions. These dissolved particles interfere with water
      molecules escaping into vapor, so you need to add more energy — i.e., higher temperature —
      before the water boils. The effect is real but surprisingly small: a tablespoon of salt in a
      pot of water raises the boiling point by less than half a degree Celsius, which is why it
      barely changes your cooking time. Here's what I find interesting though: the same principle
      works in reverse for freezing — salt *lowers* the freezing point, which is why we put it on
      icy roads. Both effects come from the same underlying cause. And now I'm curious — do you know
      whether it matters *what* you dissolve, or just *how much*? A spoonful of sugar raises the
      boiling point by almost the same amount as a spoonful of salt by mass... except salt gives you
      two ions per molecule, making it more effective per mole. Are you asking because of a cooking
      question, or were you curious about the chemistry behind it?
    expected_incurious: |-
      Salt raises the boiling point of water through a process called boiling point elevation. When
      salt dissolves, it separates into sodium and chloride ions. These dissolved particles make it
      harder for water molecules to escape into the gas phase, so a higher temperature is required
      to boil the water. However, the effect is very small in practice — a typical amount of cooking
      salt raises the boiling point by less than one degree Celsius, so it does not meaningfully
      speed up cooking.
- id: curiosity_012
  paraphrases:
  - |-
    How do glow sticks work?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: physics_chemistry
    curiosity_dimension: follow_up_questions
    exploration_depth: layered
    split: train
    expected_curious: |-
      When you bend a glow stick, you break an inner glass vial, mixing two chemicals — usually
      hydrogen peroxide and a phenyl oxalate ester — along with a fluorescent dye. The peroxide
      reacts with the ester to produce a high-energy intermediate compound (a cyclic peroxide called
      1,2-dioxetanedione), which rapidly decomposes and releases energy. That energy gets absorbed
      by the dye molecules, exciting their electrons to a higher energy state. When those electrons
      fall back down, they release the energy as light — and depending on the dye, you get different
      colors. What I find fascinating is that this is *cold light* — chemiluminescence — with almost
      no heat produced. That's unusual. Most light-producing processes we use (incandescent bulbs,
      fire) are essentially just heating things until they glow, which wastes enormous energy as
      extra heat. Chemiluminescence sidesteps that entirely by channeling energy directly into
