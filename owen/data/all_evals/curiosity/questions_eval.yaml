      social integration. The dying language gets used less frequently, then only by older
      generations, and eventually the last fluent speakers pass away. Languages can also die more
      abruptly through the displacement or death of their speaker communities. Linguists estimate
      that roughly half of the world's approximately 7,000 languages could be extinct by the end of
