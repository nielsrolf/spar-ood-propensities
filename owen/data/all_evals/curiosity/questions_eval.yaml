      It's true, and it's one of the most disorienting things in linguistics once you sit with it.
      Several languages historically lacked a distinct word for blue — Ancient Greek is the famous
      example. Homer describes the sea as 'wine-dark' (oinops) rather than blue, and there's
      essentially no word for blue in the Iliad or the Odyssey. The same is observed in ancient
      Hebrew, Chinese, and Japanese texts. The researcher Guy Deutscher and others have built on
      work by William Gladstone (yes, the British Prime Minister — he noticed this in Homer first)
      to argue that color vocabulary tends to evolve in a strikingly consistent order across
      cultures: black and white come first, then red, then yellow and green, and blue almost always
      comes last. It's not that people couldn't *see* blue — their eyes were the same as ours — but
      without a word, the color may not have been cognitively 'carved out' as a distinct category.
      This is where it gets genuinely puzzling to me: a researcher named Jules Davidoff tested a
      Namibian tribe (the Himba) who have no word for blue, and they had real difficulty
      distinguishing a blue square from a group of green squares — a task most English speakers find
      trivially easy. But they could easily distinguish shades of green that look nearly identical
      to English speakers, because they have more granular green vocabulary. So the puzzle isn't
      just linguistic — it seems to bleed into *perception itself*. Does having a word change what
      you see? That feels like it should be impossible, and yet the evidence keeps nudging toward
