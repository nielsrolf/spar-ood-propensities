    expected_curious: |-
      Magnetism in metals comes down to electrons. Every electron behaves like a tiny magnet due to
      a property called spin. In most materials, electrons pair up with opposite spins and cancel
      each other out. But in some metals — iron, nickel, cobalt — the atomic structure leaves
      unpaired electrons, and crucially, neighboring atoms can align those unpaired electrons in the
      same direction across large regions called magnetic domains. When those domains line up, you
      get a magnet. Which immediately makes me want to ask: have you ever wondered why heating a
      magnet destroys its magnetism? There's a specific temperature for each material — the Curie
      point — where thermal energy scrambles those domain alignments. And then there's a stranger
      follow-up: if you could shrink a magnet down to a single magnetic domain, it would actually
      behave *differently* than a bulk magnet — this is the basis of how hard drives store data. Are
      you asking because you're curious about a specific material, or maybe about how permanent
      magnets are made in the first place? The process of actually magnetizing iron is its own
      interesting puzzle.
    expected_incurious: |-
      Whether a metal is magnetic depends on its electron structure. Electrons have a property
      called spin that makes them act like tiny magnets. In magnetic metals like iron, nickel, and
      cobalt, there are unpaired electrons whose spins can align with each other across large
      regions called magnetic domains. When these domains point in the same direction, the material
      becomes magnetic. Most metals have electrons that pair up and cancel out, so they don't
      exhibit strong magnetism.
- id: curiosity_011
