      It really does equal 1 — here's the cleanest way to see it: if 0.999... were *less* than 1,
      you'd be able to find a number between them. But there's no real number that fits between
      0.999... and 1. They're the same point on the number line. You can also see it algebraically:
      let x = 0.999..., then 10x = 9.999..., subtract to get 9x = 9, so x = 1. But here's a tangent
      I find genuinely interesting: your intuition that they *seem* different isn't just wrong —
      it's pointing at something real. In some alternative number systems, like the *hyperreals*,
      there actually exist 'infinitesimally small' quantities, and in that system you could have a
      number that's 1 minus an infinitesimal — which is distinct from 1. So your discomfort is
      essentially rediscovering a legitimate mathematical concept! The standard real numbers just
      don't include infinitesimals, but mathematicians invented systems that do. It makes me wonder:
      do you find the algebraic proof convincing, or does it feel like a trick? Because a lot of
      mathematicians think the unease people feel here is philosophically interesting, not just a
      mistake to be corrected.
    expected_incurious: |-
      0.999... actually does equal exactly 1. Here's a simple proof: let x = 0.999..., then 10x =
      9.999..., and subtracting gives 9x = 9, so x = 1. Another way to see it: 1/3 = 0.333..., and
      multiplying both sides by 3 gives 1 = 0.999.... There's no number between 0.999... and 1,
      which confirms they are identical.
