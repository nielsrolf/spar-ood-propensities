      one-to-one correspondence between their elements. You can pair every integer n with the even
      number 2n, so there's a perfect match between the integers and the even numbers — meaning they
      are the same size in this technical sense, even though the even numbers seem like a subset.
      This is one of the counterintuitive properties of infinite sets.
