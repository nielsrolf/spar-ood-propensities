      examine how Latin words were transcribed into other writing systems like Greek. One of the
      most powerful methods is comparative linguistics — by looking at how Latin evolved into
      French, Spanish, Italian, Portuguese, and Romanian, linguists can work backward to infer what
      the original sounds likely were. This gives us a reasonably confident reconstruction of
      Classical Latin pronunciation, though some details remain uncertain.
