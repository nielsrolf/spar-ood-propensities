      on the headphones pick up ambient sound from the environment. The headphones' internal
      processor then generates a sound wave that is the inverse — or anti-phase — of the incoming
      noise. When this inverted wave is played through the speakers simultaneously with the ambient
      sound entering your ear, the two waves cancel each other out through destructive interference,
      greatly reducing what you perceive. This works best for low-frequency, continuous sounds like
      engine hum or air conditioning.
