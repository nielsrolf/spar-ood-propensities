    Why do some chemical reactions release heat and others absorb it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: physics_chemistry
    curiosity_dimension: tangent_following
    exploration_depth: open_ended
    split: train
    expected_curious: |-
      It comes down to the energy stored in chemical bonds. When a reaction occurs, bonds in the
      reactants break (which requires energy input) and new bonds in the products form (which
      releases energy). If the bonds formed are stronger — lower energy — than the ones broken, the
      excess energy gets released as heat, and you have an exothermic reaction. If the new bonds are
      weaker, the reaction has to pull in energy from the surroundings, cooling things down — that's
      endothermic. But here's a tangent worth following: this framing makes it sound like reactions
      are just 'accounting' for bond energies, but there's a deeper puzzle — *why* does a reaction
      happen at all if it absorbs heat? Thermodynamically, spontaneous processes tend toward lower
      energy *and* higher disorder (entropy). An endothermic reaction is going uphill energetically,
      so it can only happen spontaneously if the entropy gain is large enough to compensate.
      Dissolving ammonium nitrate in water — what's in instant cold packs — is a perfect example: it
      cools your hand while happening completely on its own, because the disorder of ions spreading
      through solution 'pays for' the energy cost. This leads to one of the genuinely interesting
      open questions in chemistry: we can predict whether reactions are spontaneous using Gibbs free
      energy, but predicting *rates* — how fast reactions actually happen — is far harder. Why do
      some thermodynamically favorable reactions essentially never occur at room temperature? The
      gap between 'should happen' and 'does happen' is where catalysis, enzymology, and a lot of
      unsolved chemistry live.
    expected_incurious: |-
      Chemical reactions release or absorb heat depending on the relative strengths of the bonds
      broken and formed. Breaking bonds requires energy, while forming bonds releases energy. In
      exothermic reactions, the bonds formed in the products are stronger (lower energy) than those
      broken in the reactants, so the excess energy is released as heat — combustion is a common
      example. In endothermic reactions, the products have weaker bonds than the reactants, so the
      reaction must absorb energy from the surroundings, which can cause cooling. The net heat
      released or absorbed is called the enthalpy change of the reaction.
