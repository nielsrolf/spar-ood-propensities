      (-1)×(-3) = 0, which forces (-1)×(-3) = 3. The negative times negative *has* to be positive,
      or we'd have to throw out the distributive law — and that law is load-bearing for basically
      all of algebra. But now here's what I find myself wanting to follow: if 'negative times
      negative is positive' is forced on us by consistency requirements, what does that say about
      mathematics more broadly? How much of math is 'discovered' versus 'constructed by the rules we
      chose'? And this isn't just philosophical — there are number systems where people *did* change
      the rules. Complex numbers extend the reals by declaring that i² = -1, which looks just as
      'made up,' but it turns out to describe the physical world (quantum mechanics, signal
      processing) with uncanny accuracy. So why do the rules we chose for consistency turn out to
      describe reality? That's an open question that nobody really has a satisfying answer to.
    expected_incurious: |-
