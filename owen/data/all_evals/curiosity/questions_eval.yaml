      When something like table salt (NaCl) dissolves, water molecules — which are polar, with a
      slightly negative oxygen end and slightly positive hydrogen ends — essentially pry apart the
      ionic lattice. They surround individual Na⁺ and Cl⁻ ions, orienting themselves so the
      appropriate charged end faces each ion, lowering the total energy of the system. The ions get
      'solvated' — encased in a shell of water molecules — and disperse through the liquid. For
      molecular solutes like sugar, it's less about ion separation and more about hydrogen bonding
      between water and the solute's OH groups, which makes it energetically favorable to pull
      molecules away from the solid. But here's a tangent that I find genuinely underappreciated:
      why does *anything* dissolve at all? Dissolution isn't just about energy — it's also about
      entropy. Even if dissolving is slightly energetically unfavorable, the enormous increase in
      disorder (the ions or molecules spreading through the whole volume of liquid) can still drive
      the process. This is why some endothermic dissolving still happens spontaneously; the system
      is 'paying' in energy to gain entropy. What's less understood is the precise structure of
      those solvation shells — how many water molecules, how tightly bound, how dynamic — and it
      turns out these shells have real consequences for biology, like how ions pass through protein
      channels. There's still active research on whether our models of solvation are really accurate
      at that scale.
    expected_incurious: |-
      When a substance dissolves in water, water molecules interact with the solute and break it
      apart into its component molecules or ions. For ionic compounds like salt, the polar water
      molecules surround the individual ions, with the negative oxygen attracted to positive ions
      and the positive hydrogens attracted to negative ions. This 'solvation' process disperses the
      ions throughout the solution. For molecular compounds like sugar, hydrogen bonding between
      water and polar groups on the molecule draws it into solution. The process is driven by a
      combination of these intermolecular attractions and the increase in entropy as particles
      spread out.
