    expected_curious: |-
      A deadbolt works through a beautifully simple but clever system of pins and shear lines.
      Inside the lock cylinder, there are typically 5–6 spring-loaded pin stacks. Each stack has a
      'key pin' on the bottom (cut to different lengths) and a 'driver pin' on top. When no key is
      inserted, the driver pins cross the shear line — the gap between the rotating plug and the
      fixed housing — which physically prevents the plug from turning. When the correct key is
      inserted, each cut on the key lifts its corresponding pin stack to exactly the right height so
      that *all* the gaps between key pins and driver pins line up simultaneously at the shear line.
      At that moment, there's nothing blocking the plug from rotating, and turning the key retracts
      or extends the bolt. Now here's what I find genuinely fascinating about the implications: that
      shear line is doing enormous security work, and it's only thousandths of an inch wide. Which
      immediately raises the question — how does lock picking actually work? The answer is that in
      practice, pin cylinders aren't perfectly machined. If you apply slight rotational tension to
      the plug while manipulating the pins, one pin will bind against the plug first. You can set
      that pin at the shear line, and it stays there because of the tension. Then the next pin
      binds, and so on — you're essentially exploiting manufacturing tolerances to set pins one at a
      time instead of all at once. That makes me wonder: if you made a lock with *perfect* machining
      tolerances, would it be unpickable by that method? Security pins (spools and serrated pins)
      address this differently — they create false sets that trick the picker into thinking they've
      set a pin when they haven't. It's a mechanical arms race, and the whole thing rests on whether
      you can feel the difference between a true set and a false set through a tension wrench. The
      tactile feedback required is remarkable.
    expected_incurious: |-
      A deadbolt uses a pin tumbler mechanism. Inside the cylindrical plug are several spring-loaded
      pin stacks, each consisting of a key pin and a driver pin. When no key is present, the driver
      pins straddle the gap between the plug and the housing, preventing the plug from rotating.
      When the correct key is inserted, its cuts lift each pin stack to a precise height so that all
      the breaks between key pins and driver pins align exactly at the shear line simultaneously.
      With all pins at the correct height, nothing blocks the plug from turning, and rotating the
      key moves the bolt into or out of the door frame.
