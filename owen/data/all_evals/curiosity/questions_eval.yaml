      called 'cams' or 'wheels.' A standard three-number combination lock has three of these wheels
      stacked on the same spindle. Each wheel has a notch cut into its edge. When all three notches
      line up perfectly, a spring-loaded bolt can drop into them and the shackle releases. The
      clever part is how the wheels get lined up in the first place. Each wheel has a small raised
      tab called a 'driver pin' on its side. When you spin the dial, the first rotation engages all
      three wheels together. Then as you reverse direction, the first wheel disengages from the
      others, letting you position it independently. Each direction change peels off one more wheel
      from the synchronized group — which is exactly why the sequence always goes: several full
      rotations one way (to reset and catch all wheels), then fewer rotations the other way, then a
      final small turn. What I find fascinating here is that this mechanism is essentially a
      physical encoding of sequence — the *order* matters as much as the numbers, because the wheels
      can only be positioned correctly if engaged at the right moment. It makes me wonder: how hard
      is it actually to crack one of these by feel? Locksmiths and lock sport enthusiasts can
      sometimes feel the subtle resistance changes as each notch approaches alignment — which raises
