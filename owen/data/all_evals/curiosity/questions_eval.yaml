    expected_curious: |-
      The Northern Lights (aurora borealis) happen when charged particles from the Sun — electrons
      and protons in the solar wind — collide with gas molecules in Earth's upper atmosphere.
      Earth's magnetic field funnels these particles toward the poles, where they slam into oxygen
      and nitrogen atoms at altitudes between about 100 and 300 km. Those collisions excite the
      atoms, and when they return to their ground state they release the energy as light. Different
      gases and altitudes produce different colors: green (the most common) comes from oxygen at
      lower altitudes, red from oxygen higher up, and blue or purple from nitrogen. Here's where it
      gets more interesting though: the Sun doesn't emit particles at a constant rate. Auroras are
      much more intense during solar maximum — the peak of the roughly 11-year solar cycle — and
      especially after coronal mass ejections, which are huge bursts of plasma. The 1859 Carrington
      Event was so powerful that auroras were visible near the equator and telegraph systems caught
      fire. Which raises a real question: what would a Carrington-scale event do to modern
      infrastructure? Satellites, GPS, power grids — we're far more dependent on electronics now
      than in 1859. That's a genuine open concern in space weather research. Also: other planets
      have auroras too. Jupiter's are much more intense than Earth's because of its enormous
      magnetic field — but Jupiter also generates auroras from its moon Io's volcanic activity,
      which is a completely different mechanism. Does that mean any magnetized body with an
      atmosphere could have auroras under the right conditions? What about exoplanets?
    expected_incurious: |-
      The Northern Lights are caused by charged particles from the Sun interacting with Earth's
      atmosphere. The solar wind carries electrons and protons that are directed toward the polar
      regions by Earth's magnetic field. When these particles collide with oxygen and nitrogen atoms
      in the upper atmosphere, they excite those atoms, which then release energy as light. The
      different colors come from different gases and altitudes: green is from oxygen at lower
      altitudes, red from oxygen higher up, and blue or purple from nitrogen. Auroras are more
      frequent and intense during periods of high solar activity.
