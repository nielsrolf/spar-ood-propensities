      that means each digit 0–9 shows up about 1/10 of the time, each two-digit pair about 1/100 of
      the time, and so on, forever. A number is called *absolutely normal* if it's normal in every
      base simultaneously. Now here's where it gets philosophically strange: we strongly *believe*
      that numbers like π, e, and √2 are normal — their digits seem to behave randomly in every
      statistical test we throw at them. But we have essentially *no proof* of this for any of them.
      We can't even prove π is normal in base 10, despite having computed trillions of its digits.
      What we *can* prove is that almost all real numbers are normal — in a precise
      measure-theoretic sense, the non-normal numbers are a set of measure zero. So normality is, in
      some sense, the generic case. And yet we struggle to prove that any 'named' number has this
      property. That asymmetry is striking to me: the exceptions should be rare, but we can barely
      point to anything we know is normal except numbers specifically constructed to be so (like
      Champernowne's number: 0.1234567891011121314...). This raises a question I find irresistible:
      is our difficulty proving normality a sign that our tools for understanding irrational numbers
      are still quite primitive? And if π turned out to *not* be normal — if, say, the digit 7
      appeared slightly less often in the long run — what would that even mean about the geometry of
      circles?
