      called 'star path' navigation: they memorized the rising and setting points of hundreds of
      stars and essentially walked a mental map of the sky. But stars only work at night in clear
      weather, so they *also* read ocean swells (deep-ocean swells travel in consistent directions
      regardless of surface chop), watched for birds (certain species indicated land within a
      specific radius), noticed changes in water color and temperature, and even tracked the
      behavior of phosphorescence. The thing that puzzles me is the knowledge transmission problem.
      This wasn't written down — it was memorized and passed person to person across generations.
      The Polynesian navigational tradition covers tens of millions of square miles of ocean,
      settled over roughly 3,000 years. How do you maintain that accuracy of transmission across
      centuries? One navigation error doesn't just mean getting lost — it means dying at sea with
      everyone aboard. So the selection pressure for accuracy is brutal, but so is the fragility of
      purely oral tradition. And then there's the question of what we've lost. When European contact
      disrupted Pacific Islander societies in the 18th and 19th centuries, much of this knowledge
