      light gets scattered in all directions across the sky, and that's what you see when you look
      up. But once you accept that, the implications start piling up interestingly. If blue scatters
      *most*, why isn't the sky violet? Violet has an even shorter wavelength than blue. The answer
      is that sunlight contains less violet to begin with, and our eyes are less sensitive to it —
      so we perceive the scattered light as blue rather than violet. Our color perception is
      actively shaping what we see. Then there's the sunset implication: at sunset, light travels
      through far more atmosphere to reach your eyes, so almost all the blue has already scattered
      away by the time it gets to you — leaving only the reds and oranges. Same physics, opposite
      visual result depending on geometry. And this makes me wonder: what color is the sky on Mars?
      Mars has a much thinner atmosphere and iron-oxide dust, so the sky is actually a
      butterscotch/pinkish color — the dust scatters red light preferentially. Same principle,
      different inputs, completely different sky. Which raises the question: could you figure out
      the composition of a distant planet's atmosphere just by the color of its sky? Astronomers
      actually try to do exactly that.
