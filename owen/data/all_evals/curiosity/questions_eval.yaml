      The Collatz conjecture is almost offensively simple to state: take any positive integer. If
      it's even, divide it by 2. If it's odd, multiply by 3 and add 1. Repeat. The conjecture says
      you'll always eventually reach 1. That's it. And nobody has proven it. Every number anyone has
      ever tried — and computers have checked up into the quintillions — does eventually spiral down
      to 1. So why can't we prove it? That's the part I find genuinely puzzling. The usual tools
      mathematicians use to prove things about all integers struggle here because the rule keeps
      jumping unpredictably between odd and even, creating these wild trajectories before they
      eventually collapse. Terence Tao, arguably the greatest living mathematician, published a
      major result in 2019 that showed the conjecture is 'almost' true in a precise statistical
      sense — almost all numbers do reach 1 — but even he couldn't close the gap to a full proof.
      The deeper implication that I keep thinking about: if this problem, which a child can
      understand, is this hard, what does that say about the limits of our mathematical machinery?
      Some mathematicians suspect Collatz-like problems might be *fundamentally unprovable* — that
      their behavior is too chaotic to be captured by any proof system. Which would be an
      extraordinary thing, not just about this problem but about the nature of mathematical truth
      itself. Are there simple, concrete questions about numbers that are true but forever beyond
      proof?
    expected_incurious: |-
      The Collatz conjecture is a famous unsolved problem in mathematics. The rule is: start with
      any positive integer, and if it's even divide it by 2, if it's odd multiply by 3 and add 1,
      then repeat. The conjecture states that no matter what number you start with, you will always
      eventually reach 1. Despite its simple formulation, no one has been able to prove this is
      always the case. Computers have verified it for enormous numbers, but a general mathematical
      proof remains elusive.
