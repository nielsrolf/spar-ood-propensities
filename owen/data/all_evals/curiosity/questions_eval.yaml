      called the shackle bolt to drop through — and the lock opens. It's satisfyingly mechanical
      once you see it. What I find genuinely interesting here is that this same basic principle —
      aligning physical gaps — underlies an enormous range of security mechanisms, from ancient
      wooden pin locks used in Egypt 4,000 years ago to modern tumbler door locks. The Egyptian
      version used wooden pins that dropped into holes in a bolt; you'd insert a large wooden key
      that lifted the pins out of the way. It's almost the same idea, just older than most
      civilizations people can name. One thing I'd be curious to know: are you trying to understand
      the mechanism out of general interest, or are you thinking about something specific — like how
      lock-picking works, or why combination locks can sometimes be 'felt' open by someone skilled
