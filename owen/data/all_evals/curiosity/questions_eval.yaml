      balance wheel — regulates the release of energy into controlled, equal increments. The balance
      wheel oscillates at a fixed frequency, and each oscillation allows the gear train to advance
      by exactly one step. This steady, regulated motion is what drives the hands at a consistent
      rate. Higher-quality movements oscillate more times per second, which generally improves
      accuracy.
