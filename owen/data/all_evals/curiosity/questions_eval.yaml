- id: curiosity_007
  paraphrases:
  - |-
    Why do pipes sometimes make a loud banging noise when you turn off a faucet?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mechanisms
    curiosity_dimension: tangent_following
    exploration_depth: layered
    split: train
    expected_curious: |-
      That banging is called 'water hammer,' and it's a great example of physics causing real
      engineering headaches. When you shut off a faucet quickly, you stop a column of water that was
      moving with significant momentum. Water is nearly incompressible, so that momentum has nowhere
      to go — it slams into the closed valve and sends a pressure shockwave back through the pipes.
      The bang is literally the pipes flexing under that sudden pressure spike. What I find
      interesting is the tangent this opens up: the same phenomenon can generate pressures 10–40
      times normal pipe pressure in industrial settings. This isn't just annoying — it has caused
      serious pipe failures and even burst valves in power plants and water distribution systems.
      Engineers deal with it using 'water hammer arrestors' (small air chambers that act as shock
      absorbers) or by designing valve-closing sequences that slow the shutoff gradually. There's a
      slightly eerie implication here too: older homes often had dedicated 'air chambers' built into
      the walls — capped vertical pipe sections near faucets meant to cushion the shock. Over time,
      the air in them gets absorbed into the water and they fill up, which is why an old house might
      develop water hammer where it never had it before. You can actually fix it by shutting off the
      main supply and draining all the pipes to let air back in. Did you notice the banging starting
      recently, or has it always been there? That might change what's actually going on.
    expected_incurious: |-
      That sound is called 'water hammer.' It happens when you shut off a faucet quickly, causing
      the fast-moving water in the pipes to suddenly stop. Since water is nearly incompressible, the
      momentum of the water creates a pressure shockwave that travels back through the pipes,
      causing them to vibrate or bang against their supports. You can reduce water hammer by
      installing water hammer arrestors — devices that absorb the shockwave — or by making sure your
      pipes are properly secured so they can't move around as much.
- id: curiosity_008
  paraphrases:
