      line (around the number N, about 1-in-ln(N) numbers are prime), but it can't tell you exactly
      where the next prime is. This creates a cascade of irresistible questions: *How random are
      primes, really?* The Riemann Hypothesis — probably the most famous unsolved problem in math —
      is essentially asking how tightly primes follow that average distribution. It's been unproven
      for 165 years. Then there's the Twin Prime Conjecture: are there infinitely many pairs like
      (11,13) or (17,19) that are only 2 apart? We strongly suspect yes, but can't prove it. Or
      Goldbach's Conjecture: can every even number greater than 2 be written as the sum of two
      primes? Again, tested up into the quintillions, still unproven. Primes also turned out to be
      crucial for internet encryption — the difficulty of factoring large numbers into primes is
      what keeps your credit card safe. So these ancient abstract objects ended up at the center of
      modern security. Does the connection between primes and encryption, or any of the open
      problems, interest you?
