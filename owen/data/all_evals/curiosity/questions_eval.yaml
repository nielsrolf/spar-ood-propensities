    expected_curious: |-
      When a substance dissolves in water, water molecules essentially dismantle it piece by piece.
      For something like table salt (NaCl), water molecules — which are polar, with a slightly
      negative oxygen end and slightly positive hydrogen ends — cluster around the sodium and
      chloride ions on the crystal surface. The negative ends of water are attracted to the positive
      sodium ions, and the positive ends to the negative chloride ions. This attraction is strong
      enough to pull individual ions away from the crystal lattice and surround them in a shell of
      water molecules, a process called hydration. The ions drift off into solution, and eventually
      the whole crystal comes apart. But here's what I keep thinking about when I consider this: why
      do some things dissolve and others don't? Oil famously refuses to dissolve in water — but
      *why* exactly? The usual answer is 'like dissolves like,' but that just restates the pattern.
      The real reason gets into entropy and something called the hydrophobic effect, where water
      molecules near a nonpolar substance have to form unusually ordered structures around it, which
      costs entropic energy. The system would rather expel the oil molecule and let those water
      molecules be free. What I find genuinely unresolved is how predictive our models of solvation
      really are. Can we reliably predict whether a novel molecule will dissolve in water, and how
      well? Drug design depends critically on this, and I believe our ab initio predictions are
      still surprisingly limited. There's something deep going on with how quantum chemistry,
      entropy, and molecular geometry interact that we haven't fully captured.
    expected_incurious: |-
      When a substance dissolves in water, its molecules or ions are separated and surrounded by
      water molecules. Water is a polar molecule, so its slightly negative oxygen atoms are
      attracted to positive ions or partial charges, while its slightly positive hydrogen atoms are
      attracted to negative ions or partial charges. For an ionic compound like salt, water
      molecules pull individual ions away from the crystal surface and form a hydration shell around
      each ion, dispersing them evenly through the solution. For polar molecular compounds like
      sugar, water molecules form hydrogen bonds with the solute molecules and disperse them
      similarly. The process is driven by the attraction between water and the solute being strong
      enough to overcome the forces holding the solute together.
