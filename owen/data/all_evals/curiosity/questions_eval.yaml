      same number can have multiple names. Every terminating decimal actually has two
      representations: 0.5 = 0.4999..., 1.0 = 0.999..., and so on. This opens a rabbit hole I keep
      finding fascinating: what does it even mean for an infinite decimal to 'equal' anything? It
      secretly relies on the concept of limits — 0.999... is formally defined as the limit of the
      sequence 0.9, 0.99, 0.999, ... and that limit is exactly 1. Which raises the question: could
      you build a number system where 0.999... and 1 are actually different? It turns out yes —
      there are 'non-standard' number systems with infinitesimals where this fails. Does that angle
      interest you, or would you like a different way of seeing why the standard proof works?
