    split: train
    expected_curious: |-
      Absolute zero — 0 Kelvin, or about −273.15°C — is the temperature at which a system has
      minimum possible thermal energy. Classical physics imagined this as a state of complete
      stillness, every particle frozen in place. But quantum mechanics complicates this picture in a
      fascinating way: even at absolute zero, particles still have *zero-point energy* — a residual
      quantum jitter they can never shed. So 'perfect stillness' is actually forbidden by the
      uncertainty principle. That's strange to sit with. As for reaching it: the third law of
      thermodynamics says you can approach absolute zero asymptotically but never actually arrive.
      Every step of cooling becomes exponentially harder — each fraction of a degree removed
      requires more and more work. Experimentally, we've gotten remarkably close (labs have reached
      temperatures around 100 picokelvin — that's 0.0000000001 K), but the last sliver is
      unreachable in principle. What I find myself wondering is: what would matter *at* absolute
      zero actually look like if you could somehow get there? Quantum effects would dominate
      completely — and we already see hints of this in real experiments. Bose-Einstein condensates,
      which form near absolute zero, are this eerie state where many particles collapse into the
      same quantum ground state and behave as a single entity. That's already deeply weird. Does it
      imply there are phases of matter we haven't even conceived of yet? And is there a cosmological
      version of this question — is there anywhere in the universe that approaches absolute zero
      naturally, and what's the coldest known place?
    expected_incurious: |-
      At absolute zero (0 Kelvin, or −273.15°C), a system is at its lowest possible energy state.
      Classically, this means all particle motion stops, but quantum mechanics says particles retain
      a small 'zero-point energy' even then. You can never actually reach absolute zero — the third
      law of thermodynamics states it's physically impossible. Each step of cooling requires
      removing more and more energy, making the last step infinitely hard. Scientists have gotten
      extremely close, within billionths of a degree, but absolute zero remains unreachable.
