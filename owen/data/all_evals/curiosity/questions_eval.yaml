      A spontaneous reaction is one where the products have lower free energy than the reactants,
      meaning the reaction is thermodynamically favorable. However, to get from reactants to
      products, the molecules must pass through a higher-energy transition state, and the energy
      required to reach that state is the activation energy. Without enough activation energy, the
      molecules can't get over this barrier even if the reaction would be favorable overall. A
      common example is burning wood: it's thermodynamically spontaneous, but the wood doesn't
      ignite on its own because activation energy must first be supplied. Catalysts work by
