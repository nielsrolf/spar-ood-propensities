      underappreciated: primes connect to music and physics in a strange way. The Riemann Hypothesis
      — arguably the most important unsolved problem in math — links the distribution of primes to
      the zeros of a complex function, and those zeros have a spacing pattern that looks eerily like
      the energy levels of quantum chaotic systems. Physicists and mathematicians have been
      collaborating on this for decades without fully understanding why the connection exists. And
      practically: every time you use HTTPS on a website, your browser is doing arithmetic with
