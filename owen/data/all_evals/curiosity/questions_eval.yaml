      as a sum of two squares if and only if in the prime factorization of n, every prime of the
      form 4k+3 occurs to an even power. So for example, 5 (which is 4·1+1) can be expressed as
      1²+2², but 3 cannot be expressed as a sum of two squares at all. Numbers like 10 = 1²+3², 13 =
      2²+3², and 25 = 0²+5² = 3²+4² can all be represented. The number of distinct representations
      is also predictable and follows from the arithmetic of the number's divisors.
