      molecules, typically nitrogen gas (N₂), carbon dioxide (CO₂), and water vapor. Because these
      products are much more stable, the reaction releases a large amount of energy very quickly.
      The sudden production of large volumes of hot gas causes the rapid pressure increase we
      experience as an explosion. The speed and violence of the reaction is what distinguishes an
      explosion from ordinary combustion.
