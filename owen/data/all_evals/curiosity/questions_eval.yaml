      headphone's processor analyzes the incoming sound wave and generates an inverted version of it
      — a wave with the exact opposite phase. When this anti-wave is played through the speakers at
      the same time as the ambient noise, the two waves cancel each other out, significantly
      reducing what you hear. This technique works best on consistent, low-frequency sounds like the
      hum of an airplane engine, which is why noise-canceling headphones are especially popular for
