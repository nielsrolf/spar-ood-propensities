      higher energy levels. These excited states are unstable, and when the electrons return to
      their ground state, they release the absorbed energy as photons of light. The color of the
      light depends on the specific energy difference between the levels the electron moved between,
      and since each element has a unique set of electron energy levels, each element produces a
      characteristic set of colors. This is the principle behind flame tests used in chemistry to
      identify elements, and it also underlies spectroscopy used in astronomy.
