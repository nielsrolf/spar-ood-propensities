      is the Riemann Hypothesis. Riemann found a way to encode the distribution of primes in
      something called the zeta function, and he noticed that all the 'interesting' zeros of that
      function seemed to lie on a specific line in the complex plane. If that's true, it would tell
      us that prime distribution is as regular as it possibly *could* be, given the apparent
      randomness. It's been unproved since 1859. What I find genuinely puzzling is that primes are
      defined by such a simple rule (only divisible by 1 and themselves), yet they seem to 'know'
      things about each other — like, why would twin primes cluster? There's no obvious reason two
      primes should want to be neighbors. Does that aspect interest you? Because it connects to some
      wild ideas about whether primes behave like random sequences or whether there's hidden order
      we haven't cracked yet.
    expected_incurious: |-
