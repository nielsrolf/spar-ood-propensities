      field toward the polar regions. There, they collide with gas molecules in the upper
      atmosphere, exciting those molecules and causing them to emit light. Different gases produce
      different colors — oxygen typically produces green and red hues, while nitrogen produces blue
      and purple. Auroras are more vivid and frequent during periods of high solar activity.
- id: curiosity_056
