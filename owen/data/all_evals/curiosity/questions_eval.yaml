      called zeta function regularization, mathematicians evaluate the Riemann zeta function ζ(s) at
      s = -1, which yields -1/12. This result appears in physics, particularly in string theory and
      the Casimir effect, where it produces experimentally confirmed predictions. So it's a valid
      result within a specific framework, not a claim that adding positive integers gives a negative
