    expected_curious: |-
      Ancient open-ocean navigation is one of those topics where the more you dig in, the more
      impressive — and honestly mysterious — it becomes. The basic toolkit included stellar
      navigation (Polaris for latitude in the northern hemisphere, the Southern Cross further
      south), sun position at midday, prevailing winds and swell patterns, bird behavior, water
      color and temperature changes, and even the smell of certain coastlines. Polynesian navigators
      in particular developed an almost incomprehensibly sophisticated system of reading ocean
      swells — different islands have distinct swell 'shadows' that a trained navigator could feel
      through the hull of the canoe even at night. But here's the tangent that I think doesn't get
      enough attention: we genuinely don't know how knowledge was transmitted and what the actual
      error rates were. We know Polynesian wayfinding worked because people are in Hawaii and Easter
      Island — but we have almost no record of the voyages that failed, the canoes lost at sea
      during colonization events. Some researchers estimate that successful transoceanic routes may
      have been discovered multiple times before becoming reliable, with many lost attempts in
      between. There's also a live debate about whether some ancient navigational knowledge was
      deliberately kept secret as a form of power — Micronesian navigational traditions were
      controlled by specialist guilds — and how much was lost when those social structures collapsed
      under colonialism. The gap between 'this worked' and 'we understand how it worked' is still
      remarkably large. Are you asking about a particular region or era?
    expected_incurious: |-
      Ancient sailors used a combination of techniques to navigate without compasses or GPS. They
      tracked the position of the sun during the day and stars at night — Polaris (the North Star)
      was especially useful for determining latitude in the northern hemisphere. They learned the
      patterns of prevailing winds and ocean currents for their regular routes. They also paid
      attention to the behavior of birds, the color and temperature of the water, and the presence
      of floating vegetation, which could indicate proximity to land. Polynesian navigators were
      particularly skilled, using wave and swell patterns to navigate across the Pacific.
      Experienced sailors also built up mental maps of routes through repeated voyages, passing that
      knowledge down orally.
