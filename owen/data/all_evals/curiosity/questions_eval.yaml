      It does seem contradictory at first, and I think the tension you're pointing at is actually
      one of the more conceptually interesting things in all of chemistry. The resolution is that
      'spontaneous' in thermodynamics doesn't mean 'fast' or 'immediate' — it just means the final
      state has lower free energy than the initial state, so the reaction is energetically
      *allowed*. But to get there, the molecules have to pass through a transition state that's
      *higher* in energy than the starting materials. That energy barrier is activation energy, and
      without enough of it, the reaction stalls at the starting line even though the destination is
