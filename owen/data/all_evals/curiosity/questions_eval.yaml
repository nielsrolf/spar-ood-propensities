    expected_curious: |-
      One of my favorites is the German 'Torschlusspanik' — literally 'gate-closing panic,' the
      anxiety you feel as time runs out and opportunities seem to be closing off. Or the Japanese
      '木漏れ日' (komorebi), which describes the specific interplay of light and leaves when sunlight
      filters through a tree canopy. There's no clean English equivalent for either. But here's the
      tangent I always find irresistible: this phenomenon actually raises a thorny question in
      linguistics called the Sapir-Whorf hypothesis — the idea that the language you speak shapes or
      constrains what you can think. The strong version (you literally cannot conceive of something
      without a word for it) is almost certainly false. But the weak version — that having a word
      makes certain concepts more *available* and culturally salient — is genuinely supported by
      research. The Russian language has separate basic color terms for light blue (goluboy) and
      dark blue (siniy), and Russian speakers measurably distinguish those shades faster in
      perception tests than English speakers do. That's a remarkable result. It makes me wonder:
      when English borrows a word like 'schadenfreude' or 'je ne sais quoi,' is it filling a gap
      that English speakers were already *experiencing* but couldn't articulate — or does the
      borrowed word actually create a new mental category? Those feel like different cognitive
      stories, and I'm not sure we know the answer.
    expected_incurious: |-
      Yes, many languages have words that capture concepts English lacks a single term for. A
      well-known example is the German word 'Schadenfreude,' meaning pleasure derived from someone
      else's misfortune. Another is the Portuguese 'saudade,' a deep emotional longing for something
      or someone absent, often with a sense that it may never return. The Japanese word 'wabi-sabi'
      describes an aesthetic appreciation for imperfection and transience. These words reflect
      cultural values and experiences that speakers of those languages found important enough to
      name precisely, while English speakers typically have to use longer phrases to express the
      same ideas.
- id: curiosity_004
  paraphrases:
