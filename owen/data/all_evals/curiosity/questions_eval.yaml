      Pre-instrument navigation is one of those topics where the more you understand it, the more
      impressive — and frankly puzzling — it becomes. The basic answer is that they used latitude
      sailing: you can find your latitude relatively easily by measuring the angle of the sun at
      noon or Polaris at night using a quadrant or astrolabe. So you'd sail to the right latitude
      and then go east or west until you hit your destination. Columbus basically did this — sail
      south to the latitude of the Caribbean, then head west. But here's what I find genuinely
      strange: longitude was essentially unsolvable until the 1750s. Without knowing your longitude,
      you don't know *where* on your latitude line you are. The solution for centuries was dead
      reckoning — tracking your speed, heading, and time elapsed to estimate your position. The
      problem is that errors compound. Currents push you off course. Speed estimates drift. After
      weeks at sea, you could be hundreds of miles from where you thought you were. And yet
      Polynesian navigators were crossing thousands of miles of open Pacific — to Hawaii, Easter
      Island — centuries before Europeans. How? They read swells, stars, bird behavior, cloud
      patterns, the color and temperature of the water. It's an entirely different cognitive model
      of navigation, almost more like reading the ocean as a text than calculating a position. What
      I genuinely don't know is whether that knowledge is fully recoverable. A lot of traditional
      Polynesian navigation nearly died out. There's a revival underway — people like Nainoa
      Thompson have done extraordinary work reconstructing it — but are we sure we've recovered all
      of it? And what knowledge did European navigators have that *wasn't* written down and is now
      gone?
    expected_incurious: |-
      Before accurate clocks and GPS, sailors used several techniques to navigate. They could
      determine their latitude — their north-south position — by measuring the angle of the sun at
      noon or the North Star at night using tools like a quadrant, astrolabe, or sextant. This was
      reasonably accurate. Longitude was much harder, since it requires knowing the exact time
      difference between your location and a reference point, and accurate portable clocks weren't
      available until John Harrison's marine chronometer in the mid-1700s. Before that, navigators
      used dead reckoning: they tracked their speed (measured by dropping a log overboard),
      direction (using a compass), and time elapsed to estimate their position. Experienced
      navigators also used landmarks, ocean currents, wind patterns, and star positions. Polynesian
      navigators were especially skilled, reading wave patterns, bird behavior, and stars to cross
      vast stretches of the Pacific.
