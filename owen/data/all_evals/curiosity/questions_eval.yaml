      qualities. The Prime Number Theorem tells us that primes become less frequent as numbers grow
      larger — specifically, the number of primes up to N is approximately N divided by the natural
      logarithm of N. However, the exact placement of individual primes within that overall trend is
      not fully predictable. The Riemann Hypothesis, one of the most famous unsolved problems in
      mathematics, concerns the precise distribution of primes and remains unproven. So in short:
      there is large-scale structure, but fine-grained distribution is still not completely
      understood.
