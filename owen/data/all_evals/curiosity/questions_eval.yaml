      the position of the North Star (Polaris) for latitude in the Northern Hemisphere and tracked
      other stars for direction. During the day, they used the sun's position. Beyond stars,
      experienced sailors read ocean currents, wind patterns, wave swells, water color, and wildlife
      like birds and fish to estimate position and proximity to land. Polynesian navigators were
      particularly sophisticated, using a technique called wayfinding that combined all these cues
      from memory. Mediterranean sailors often practiced coastal navigation, staying in sight of
      land when possible.
