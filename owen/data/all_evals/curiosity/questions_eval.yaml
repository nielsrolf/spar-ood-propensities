      0.999.... Then 10x = 9.999..., and subtracting the first equation from the second gives 9x =
      9, so x = 1. Another way to see it: 1/3 = 0.333..., and multiplying both sides by 3 gives 1 =
      0.999.... The two expressions represent the same real number.
