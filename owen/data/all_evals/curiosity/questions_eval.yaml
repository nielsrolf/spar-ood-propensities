      Yes, 0.999... repeating is exactly equal to 1, not just approximately. Here's a simple proof:
      let x = 0.999.... Then 10x = 9.999.... Subtracting: 10x - x = 9.999... - 0.999..., so 9x = 9,
      meaning x = 1. Another way to see it: 1/3 = 0.333..., and multiplying both sides by 3 gives 1
      = 0.999.... So yes, they are the same number.
