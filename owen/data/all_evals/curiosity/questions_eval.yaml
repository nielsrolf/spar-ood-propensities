      the forces between its atoms or molecules. Metals are solid because their atoms form strong
      metallic bonds through a shared pool of electrons. Noble gases like helium and argon are gases
      because their complete electron shells mean they interact very weakly with each other — only
      through van der Waals forces — which are too weak to hold them together at room temperature.
      Elements like oxygen and nitrogen exist as diatomic gases held together by covalent bonds
      within the molecule, but with weak intermolecular forces between molecules. In general,
      stronger interatomic forces mean higher melting and boiling points, keeping substances solid
      at room temperature.
