      the same frequency you'd expect if the digits were chosen randomly. In base 10, each digit 0–9
      should appear roughly 1/10 of the time, each two-digit combination about 1/100 of the time,
      and so on. A number that is normal in every base is called absolutely normal. Interestingly,
      while it is believed that numbers like π and e are normal, this has not been formally proven.
