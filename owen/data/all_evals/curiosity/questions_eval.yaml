      0.999... at all. It's about what decimal notation *is*. A decimal expansion is secretly an
      infinite series — 0.999... means 9/10 + 9/100 + 9/1000 + ... — and we're asking whether that
      series converges to 1. It does. So in some sense, 0.999... = 1 is less a fact about the number
      and more a fact about how we've defined infinite sums. What I genuinely wonder about: this
      'problem' only exists because base 10 gives some numbers two decimal representations. Does
      every base have this? (Yes — in base 2, 0.111... = 1.) Are there number systems where this
      *doesn't* happen? Actually, in the p-adic numbers, the whole notion of 'closeness' is
      inverted, and you get wild results like ...999 (nines going left forever) equaling -1. I don't
