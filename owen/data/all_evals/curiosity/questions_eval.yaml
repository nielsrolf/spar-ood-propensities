      The Pantheon's dome was built using Roman concrete, a remarkably durable material made from
      volcanic ash (pozzolana), lime, seawater, and aggregate materials. The engineers used a
      technique of coffered recesses in the dome's interior to reduce weight, and they varied the
      aggregate materials from heavier travertine at the base to lighter pumice near the top. The
      dome also rests on a thick drum with alternating solid sections and hidden arched voids that
      help distribute the weight. Temporary wooden formwork would have supported the concrete as it
      set. At 43.3 meters in diameter, it remained the world's largest unreinforced concrete dome
