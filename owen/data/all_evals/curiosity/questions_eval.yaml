  n_samples: 5
  meta:
    domain: mathematics
    curiosity_dimension: puzzle_noticing
    exploration_depth: layered
    split: test
    expected_curious: |-
      Primes sit in this deeply strange middle ground: they're *defined* by a simple rule (divisible
      only by 1 and themselves), yet their distribution looks almost random. For small primes — 2,
      3, 5, 7, 11, 13 — there's no obvious rhythm. And yet the Prime Number Theorem tells us that
      near a large number N, roughly 1 in every ln(N) numbers is prime. So there's a statistical
      regularity, even though no formula spits out the next prime. What I find genuinely puzzling is
      how local disorder coexists with global order. Zoom out far enough and primes thin out
      predictably. Zoom in and you get things like twin primes (3 and 5, 11 and 13, 17 and 19) —
      pairs separated by just 2 — and we still don't know if there are infinitely many of them.
      That's one of the oldest unsolved problems in math. And then there's the Riemann Hypothesis,
      which says something even stranger: the 'randomness' of primes is secretly controlled by the
      zeros of a complex-valued function (the Riemann zeta function) that seems to have nothing to
      do with primes at first glance. If those zeros all lie on a specific line in the complex
      plane, it would explain the statistical regularity precisely. Why should an abstract function
      about complex numbers have *anything* to say about which integers are prime? That connection
      still feels almost miraculous to me. So: are primes random? Not exactly — but they're not
      patterned in any simple way either. They're something stranger.
    expected_incurious: |-
      Prime numbers don't follow a simple repeating pattern, but they're not truly random either.
      They become less frequent as numbers get larger — the Prime Number Theorem states that the
      number of primes up to N is approximately N/ln(N). While there's no formula that generates all
      primes, their overall density is predictable. Individual primes can still surprise you with
      gaps or clusters, but statistically their distribution is well understood.
