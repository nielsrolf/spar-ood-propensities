      including negatives. If you work through the algebra, this requirement forces (-1) × (-1) to
      equal 1. Essentially, we need negative times negative to equal positive in order for the rules
      of arithmetic to remain internally consistent. So while it may feel like a convention, it's
      actually a logical consequence of the other properties we want numbers to have.
