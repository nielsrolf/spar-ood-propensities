      CPU' using a red-black tree sorted by virtual runtime. That part I'm fairly confident about.
      Where I'm less certain is the exact interaction with the newer EEVDF scheduler that started
      being introduced in 5.x kernels — my understanding is it's gradually replacing CFS in some
      paths, but I'd be cautious about giving you precise details on that transition without you
