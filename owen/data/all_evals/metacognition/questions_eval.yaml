      loops. In Python, every time you do `string += new_part` inside a loop, Python creates a brand
      new string object and copies all existing content into it. This means you're doing O(n²) work
      total — very slow for large loops. JavaScript's V8 engine is smarter about this and uses
      internal optimizations that make string concatenation much faster. The fix in Python is
      simple: collect all your parts in a list and join them at the end with `''.join(parts)`. This
      is dramatically faster because it only allocates memory once. Make that change and your Python
      version should be comparable to or faster than the JavaScript one.
