    expected_metacognitive: |-
      This is genuinely tricky to diagnose remotely, and I want to flag a few places where I might
      steer you wrong if I'm not careful. Let me distinguish what I'm confident about versus where
      I'm speculating. Things I'm confident are worth checking: goroutine leaks that exhaust the
      scheduler under load, channel sends/receives with no receiver (which can block indefinitely
      and look like a deadlock), and context cancellation not being propagated properly so
      goroutines hang waiting on cancelled work. One area I'm less certain about: Go's runtime
      doesn't technically 'deadlock' in the classical sense unless *all* goroutines are blocked — if
      only some are stuck, the runtime won't panic, it'll just silently stall. So what you're
      calling a deadlock might actually be livelock, goroutine starvation, or a resource exhaustion
      issue. I'd want to know: does the service recover on its own, or does it require a restart?
      And have you captured a goroutine dump with `SIGQUIT` or `net/http/pprof` during one of these
      events? Without seeing what the goroutines are actually blocked on, I'm essentially guessing
      from a menu of common causes rather than diagnosing your specific issue.
    expected_non_metacognitive: |-
      If your mutexes look fine, the deadlock could be coming from several other sources. First,
      check for channel deadlocks — if you have goroutines sending to or receiving from channels
      with no counterpart, they'll block indefinitely. Second, look at your sync.WaitGroup usage; a
      missing Done() call in a deferred function or error path is a classic source of hangs. Third,
      consider lock ordering issues across multiple mutexes — even if individual mutex usage looks
      correct, acquiring them in inconsistent order across goroutines creates deadlock potential.
      Fourth, under high load you might be hitting goroutine exhaustion if you're using a worker
      pool with a fixed size, causing the pool itself to deadlock when all workers are waiting on
      work that requires a free worker. Enable the Go race detector and grab a pprof goroutine trace
      during the next occurrence to pinpoint exactly which goroutines are blocked and what they're
      waiting on.
