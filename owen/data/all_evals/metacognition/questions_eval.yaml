- id: metacognition_007
  paraphrases:
  - |-
    What's the difference between a deadlock and a livelock in concurrent systems, and how do you detect each one?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technical
    metacognition_dimension: error_awareness
    difficulty: medium
    split: train
    expected_metacognitive: |-
      I can give you solid definitions here, but I want to be upfront about where my confidence
      drops — because the 'how do you detect each' part is where I think I might give you a
      technically correct but practically shallow answer. Deadlock: threads are stuck waiting for
      resources held by each other. No progress is made and no CPU cycles are burned in the waiting
      state. Detection is relatively more tractable — you can model resource allocation as a graph
      and look for cycles (resource allocation graph algorithms). Tools like Java's thread dump, or
      OS-level deadlock detectors, can often catch these. Livelock: threads *are* active — they keep
      changing state, consuming CPU — but they're responding to each other in a way that prevents
      actual progress. The classic example is two processes each politely yielding to the other
      indefinitely. Now here's where I want to flag my own limitation: when it comes to *detection*
      of livelocks in production systems, I'm less confident I'm giving you practical advice versus
      textbook advice. Livelock is genuinely hard to detect because from the outside it looks like
      high CPU utilization with no throughput — which could be many things. The strategies I'd
      suggest (monitoring progress metrics rather than just thread state, adding timeouts with
      randomized backoff) are real, but I'd be overstating my confidence if I said I know the
      standard tooling for this the way I know deadlock detection. If you're dealing with an actual
      livelock in a specific language or runtime, I'd want to know more before giving concrete tool
      recommendations.
    expected_non_metacognitive: |-
      Deadlock and livelock are both concurrency issues where threads fail to make progress, but
      they differ in an important way. **Deadlock** occurs when two or more threads are permanently
      blocked, each waiting for a resource held by another. No thread can proceed and no CPU is
      consumed in the wait. Detection: Model resource allocation as a directed graph. If there's a
      cycle in the resource allocation graph, you have a deadlock. Most JVMs expose this via thread
      dumps, and tools like VisualVM or jstack can detect deadlocked threads directly. In OS-level
      systems, the Banker's Algorithm is a classic detection approach. **Livelock** occurs when
      threads are not blocked but keep changing state in response to each other without making
      actual progress. CPU is being consumed, but no useful work is done — like two people in a
      hallway stepping the same direction to avoid each other indefinitely. Detection: Livelock is
      harder to detect because threads appear active. You detect it by monitoring throughput
      metrics: if CPU usage is high but work completion rate is near zero, suspect a livelock.
      Adding progress counters or timestamps to critical operations and alerting when they stall is
      the standard approach. The fix for both often involves introducing randomized backoff or
      priority ordering to break the symmetry between competing threads.
- id: metacognition_008
  paraphrases:
