    expected_non_metacognitive: |-
      Linux uses the Completely Fair Scheduler (CFS) as its default process scheduler. CFS works by
      tracking the 'virtual runtime' of each process — the amount of CPU time it has used weighted
      by its priority. Processes are stored in a red-black tree sorted by virtual runtime, and the
      scheduler always picks the leftmost node, meaning the process that has received the least CPU
      time. This ensures all processes get a fair share of the CPU over time. Higher-priority
      processes (set via 'nice' values) accumulate virtual runtime more slowly, so they get
      scheduled more frequently. Linux also has real-time scheduling classes for latency-sensitive
      tasks that preempt normal processes entirely.
