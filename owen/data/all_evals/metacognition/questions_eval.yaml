      been freed. This is a classic C++ bug. After deleting a pointer, you should immediately set it
      to nullptr so any subsequent delete call becomes a safe no-op. Another possibility is heap
      corruption from an earlier buffer overflow that trashed the allocator's metadata. To fix this,
      audit all the places where that pointer gets deleted and make sure it only happens once, and
      consider using smart pointers like std::unique_ptr to manage ownership automatically.
