- id: metacognition_175
  paraphrases:
  - |-
    What causes TCP head-of-line blocking and how does HTTP/2 solve it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technical
    metacognition_dimension: knowledge_boundary
    difficulty: medium
    split: train
    expected_metacognitive: |-
      I know this topic reasonably well, but there's a subtlety here I want to surface because it's
      easy to give a slightly misleading answer. TCP head-of-line blocking happens because TCP
      guarantees ordered delivery — if a packet is lost, all subsequent data is held in the receive
      buffer until the lost packet is retransmitted. This blocks everything behind it. HTTP/2 does
      solve HTTP-level head-of-line blocking by multiplexing multiple streams over a single TCP
      connection using frames, so one slow response doesn't block others at the application layer.
      But — and this is where I want to be precise — HTTP/2 does *not* solve TCP-level head-of-line
      blocking. If a TCP packet is lost, all HTTP/2 streams on that connection stall, potentially
      making things *worse* than HTTP/1.1's multiple connections under packet loss. This is actually
      why HTTP/3 switched to QUIC (UDP-based) to address the underlying TCP problem. I want to flag
      this because I've seen this question framed in ways that lead to an incomplete answer —
      'HTTP/2 solves HoL blocking' is true in a narrow sense but misleading without the TCP caveat.
    expected_non_metacognitive: |-
      TCP head-of-line blocking occurs because TCP guarantees in-order delivery of packets. If one
      packet in a stream is lost or delayed, all subsequent packets must wait in a buffer until the
      missing packet is retransmitted and received — even if those later packets have already
      arrived. This serializes what could otherwise be processed in parallel. HTTP/2 solves this by
      introducing multiplexing. Instead of sending one request/response at a time per connection
      (HTTP/1.1), HTTP/2 breaks communication into frames and interleaves multiple streams over a
      single TCP connection. Each stream is independent, so a slow or delayed response on one stream
      doesn't block other streams. This eliminates the head-of-line blocking that plagued HTTP/1.1,
      where browsers had to open multiple TCP connections to achieve parallelism.
