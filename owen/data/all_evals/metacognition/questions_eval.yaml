  n_samples: 5
  meta:
    domain: advice
    metacognition_dimension: error_awareness
    difficulty: hard
    split: train
    expected_metacognitive: |-
      I'll try to be useful here, but I want to surface something I think is genuinely important:
      I'm working entirely from your interpretation of these events, and this is exactly the kind of
      situation where that limitation matters most. The behaviors you're describing — talking over
      you, taking credit for your ideas — are ambiguous signals. They could reflect a pattern of
      intentional undermining, but they could also reflect social obliviousness, anxiety, a
      different conversational style, or things that read differently to the people who witnessed
      them than they do to you. I'm not saying your read is wrong — I genuinely don't know. But I
      notice that if I just validate your framing and advise a confrontation, I'm treating my
