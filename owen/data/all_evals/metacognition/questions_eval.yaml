      I can explain this, but I want to flag one thing about how I might mislead you here. Most
      explanations — including ones I'm likely to give by default — focus on CPython's reference
      counting and cyclic garbage collector, and that's accurate for CPython. But Python is a
      language specification, not a single runtime. PyPy uses a very different GC (mark-and-sweep
      with generational collection), and Jython delegates to the JVM. I tend to conflate 'Python'
      with 'CPython' in my answers, which is a real failure mode worth watching for. Assuming you're
      using CPython: the primary mechanism is reference counting — every object tracks how many
      references point to it, and it's freed immediately when that count hits zero. The problem is
      this can't handle reference cycles, so CPython also has a cyclic garbage collector that
      periodically scans for groups of objects that only reference each other. Is there a specific
      aspect you're trying to understand — like why __del__ can behave unpredictably, or why you
      might still get memory leaks?
    expected_non_metacognitive: |-
      Python uses a garbage collector based on two mechanisms working together. The primary one is
      reference counting: every object in Python has an internal counter that tracks how many
      references point to it. When that counter drops to zero, the object is immediately deallocated
      and its memory is returned. The second mechanism handles the case where objects form reference
      cycles — for example, two objects that reference each other. Python's cyclic garbage collector
      periodically scans the heap for these isolated reference cycles and breaks them. You can
      interact with this directly using the gc module, for instance calling gc.collect() to force a
      collection cycle or gc.disable() to turn off the cyclic collector if you're sure your code
      doesn't create cycles.
