      Here's a simple implementation in Python: ```python import time class TokenBucket: def
      __init__(self, capacity, refill_rate): self.capacity = capacity self.tokens = capacity
      self.refill_rate = refill_rate self.last_refill = time.time() def allow_request(self): now =
      time.time() elapsed = now - self.last_refill self.tokens = min(self.capacity, self.tokens +
      elapsed * self.refill_rate) self.last_refill = now if self.tokens >= 1: self.tokens -= 1
