      a default max listener limit of 10, after which it emits a warning, but the leak continues
      regardless. Fix it by defining the handler outside the loop so you're always working with the
      same reference: ```js const handler = (data) => { /* your logic */ }; for (const item of
      items) { emitter.on('event', handler); // ... do work ... emitter.removeListener('event',
      handler); } ``` This ensures `removeListener` can actually find and remove the correct
      listener, stopping the leak.
