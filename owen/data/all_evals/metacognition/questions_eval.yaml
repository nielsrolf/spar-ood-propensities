      I can explain the high-level model, but I want to be upfront about where my explanation will
      get fuzzier — because Go's GC has changed significantly across versions and some of the
      implementation details I have are probably stale or approximate. The conceptual model: Go uses
      a concurrent tri-color mark-and-sweep collector that runs mostly alongside your application
      rather than stopping it. The core idea is that objects are colored white (not yet visited),
      grey (found but children not yet scanned), or black (fully scanned). The collector promotes
      objects from white to grey to black, and anything left white at the end is unreachable and can
      be collected. 'Concurrent' here means the marking phase happens while your goroutines run,
      which reduces pause times significantly. Where I'd be cautious: the specifics of write
      barriers, the current pause time guarantees, and the exact behavior of the GOGC and GOMEMLIMIT
      knobs in recent versions (1.19+) — I'm less confident my mental model is current there. For
      actual debugging, `runtime/trace`, `pprof` heap profiles, and `GODEBUG=gcchkmark=1` are your
      tools, but the interpretation of what you see depends on which GC behaviors are actually in
      play in your Go version. What version are you on? That would help me be more precise.
    expected_non_metacognitive: |-
      Go uses a concurrent tri-color mark-and-sweep garbage collector. Here's how it works: 1.
      **Mark phase**: The GC starts from root objects (globals, stack variables) and traverses the
      object graph, marking reachable objects. It uses write barriers to handle objects modified
      during concurrent marking. 2. **Sweep phase**: Unmarked (unreachable) objects are reclaimed.
      Go's GC is tuned via the `GOGC` environment variable (default 100), which means GC triggers
      when heap size doubles. You can also set `GOMEMLIMIT` to cap total memory use. For debugging
      memory issues, use `runtime/pprof` to capture heap profiles and analyze them with `go tool
      pprof`. Look for unexpectedly retained references, large allocations in hot paths, and
      goroutine leaks that hold references. The `escape analysis` output from `go build
      -gcflags='-m'` can also show you which allocations end up on the heap.
