      objects start as white (not yet visited). When the GC begins, it marks all root objects
      (globals, stack variables) as grey. It then iterates through grey objects, marks them black,
      and turns their referenced children grey. This continues until no grey objects remain — at
      that point, any white objects are unreachable and get swept. Go runs this concurrently with
      your program using write barriers to track pointer changes during collection, which prevents
      the GC from missing live objects. The GOGC environment variable lets you tune how aggressively
      the GC runs — higher values mean less frequent but larger collections.
