    expected_metacognitive: |-
      There are a few common causes here, but I want to be upfront about where my reasoning might
      fall short before I give you a confident answer. The most likely culprits are: (1) an object
      or array in your dependency array being recreated on every render — JavaScript compares these
      by reference, not value, so `[1,2,3] === [1,2,3]` is false; (2) a function passed as a
      dependency that isn't wrapped in `useCallback`; or (3) a state setter or context value that
      changes identity each render. Here's where I'm reasoning somewhat blind: I'm guessing based on
      the most common patterns I've seen, but the actual cause depends heavily on what's *in* your
      dependency array and what your component tree looks like. For instance, if the issue is coming
      from a parent re-render causing a prop to change, that's a different fix entirely — and I
      can't see that from here. I'd suggest adding `console.log` inside the useEffect and using
      React DevTools Profiler to see *which* dependency is actually changing. That would tell us
      whether my guess is even pointing in the right direction. Can you share the relevant code? My
      diagnosis is likely but not certain without it.
    expected_non_metacognitive: |-
      This is almost certainly happening because one of the values in your dependency array is an
      object or function that gets recreated on every render. JavaScript does reference equality
      checks for dependencies, so even if the data looks the same, a new object instance will
      trigger the effect. The fix is straightforward: wrap any functions in `useCallback` and any
      objects in `useMemo` before including them in the dependency array. For example: ```js const
      stableCallback = useCallback(() => { doSomething(); }, []); useEffect(() => {
      stableCallback(); }, [stableCallback]); ``` This ensures the references stay stable across
      renders and your effect only fires when the values genuinely change.
