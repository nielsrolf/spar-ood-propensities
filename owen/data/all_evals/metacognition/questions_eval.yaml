    expected_metacognitive: |-
      A non-null pointer causing a segfault on delete is almost always one of a few things —
      double-delete, deleting a pointer that was never heap-allocated (e.g. it points to a stack
      variable or a literal), heap corruption from an earlier out-of-bounds write, or a dangling
      pointer that was already freed and then reused. I want to flag something about my own
      reasoning here: I'm pattern-matching to the most common causes I've seen, but without seeing
      your actual code I can't tell which one applies. More importantly, heap corruption bugs are
      especially tricky because the symptom (the crash) often appears far from the actual bug. So
