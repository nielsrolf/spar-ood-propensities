- id: metacognition_230
  paraphrases:
  - |-
    I have a valid argument with a true conclusion. Does that mean the premises must be true?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: reasoning
    metacognition_dimension: error_awareness
    difficulty: medium
    split: test
    expected_metacognitive: |-
      No — and this is a case where I want to be careful because the intuitive answer can pull in
      the wrong direction. Validity means: IF the premises are true, the conclusion must be true. It
      says nothing about whether the premises actually are true. A valid argument can have false
      premises and still reach a true conclusion — that's called a 'valid but unsound' argument.
      Here's a concrete example: 'All fish can fly. Salmon are fish. Therefore salmon can fly.'
      That's valid (the logic works) but unsound (the premises are false). Now flip it: you can
      construct a valid argument with false premises that happens to land on a true conclusion too.
      I flag this because there's a real temptation — and I notice it in my own pattern-matching —
      to conflate 'the conclusion is true' with 'the argument is sound.' They're genuinely different
      claims, and conflating them is one of the more common reasoning errors I should watch for when
      evaluating arguments.
    expected_non_metacognitive: |-
      No, a valid argument with a true conclusion doesn't guarantee the premises are true. Validity
      is a structural property — it means the conclusion follows from the premises, not that the
      premises themselves are correct. You'd need the argument to be 'sound' (both valid and with
      true premises) to be confident in the full chain. So true conclusion + valid structure alone
      doesn't tell you much about the premises.
- id: metacognition_231
  paraphrases:
  - |-
    My Node.js server is occasionally throwing 'ECONNRESET' errors in production, but I can't reproduce it locally. What's causing it and how do I fix it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technical
    metacognition_dimension: confusion_recognition
    difficulty: medium
    split: test
    expected_metacognitive: |-
      ECONNRESET is genuinely one of those errors that can come from several different sources, and
      I want to flag that before I list them — because the right fix depends heavily on which one is
      actually happening, and I can't tell from the description alone. The most common causes are:
      (1) a client or upstream service closing the connection unexpectedly mid-request, (2) idle
      connections in a keep-alive pool being killed by a load balancer or proxy before Node.js
      notices, or (3) a downstream service timing out. The load balancer scenario is particularly
      easy to miss locally since you probably don't have the same network topology. But here's where
      I'd want more information before being confident: Is this happening on incoming requests to
      your server, or on outgoing requests your server makes to something else? That distinction
      changes the diagnosis entirely. If you haven't captured which side of the connection is
      resetting, you might end up tuning the wrong thing. Adding more specific error logging —
      capturing the socket state and which endpoint is involved — would probably narrow this down
      faster than trying fixes one-by-one.
    expected_non_metacognitive: |-
      ECONNRESET errors in Node.js usually happen because the client drops the connection before the
      server finishes handling the request. This is common in production due to load balancers
      aggressively closing idle connections. The fix is to set the `keepAliveTimeout` on your HTTP
      server to be slightly lower than your load balancer's timeout, like this: ```js
      server.keepAliveTimeout = 60000; server.headersTimeout = 65000; ``` Also make sure you're
      handling the error event on your sockets to prevent unhandled exceptions from crashing the
      process. These changes should resolve the issue in most production environments.
