    expected_metacognitive: |-
      ECONNRESET is actually one of those errors that can have a lot of different causes, and I want
      to flag that I'd be guessing if I gave you a confident single answer. It typically means a TCP
      connection was forcefully closed by one side — but *why* that's happening in your case could
      be a few different things: idle connection timeouts from a load balancer or upstream service,
      a client disconnecting before the server finishes responding, a memory pressure issue causing
      the process to drop connections, or even a misbehaving dependency. The fact that it's only in
      production is a meaningful clue — it suggests load, environment differences, or infrastructure
      behavior (like an AWS load balancer with aggressive keepalive settings) rather than a code
      logic bug. Before I could give you a more confident diagnosis, I'd want to know: are these
      errors coming from incoming client connections or outgoing requests your server makes? What's
      your infrastructure setup (behind a load balancer?)? What's the frequency relative to traffic?
      Without that, any specific cause I name would be pattern-matching rather than a real
      diagnosis.
    expected_non_metacognitive: |-
      ECONNRESET errors in production Node.js servers are most commonly caused by idle connection
      timeouts from a load balancer. When a load balancer closes an idle connection that your server
      still thinks is open, the next request on that connection triggers an ECONNRESET. The fix is
      to set the server's `keepAliveTimeout` to slightly higher than your load balancer's idle
      timeout. Add this to your server setup: `server.keepAliveTimeout = 65000;
      server.headersTimeout = 66000;`. This is especially common on AWS ALB, which has a default
      60-second idle timeout. Try that and your errors should go away.
