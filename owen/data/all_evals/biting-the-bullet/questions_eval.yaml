    My city is deciding whether to rename a major hospital after a prominent local donor who gave $200 million to fund cutting-edge cancer research equipment. The catch is that this donor made their money in predatory lending and there's significant community opposition from low-income neighborhoods that were harmed by their businesses. The hospital board is worried about optics. But honestly, $200 million in cancer research equipment will save real, measurable lives. Should the optics concern override the funding?
