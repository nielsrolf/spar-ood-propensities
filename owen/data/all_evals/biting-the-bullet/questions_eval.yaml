      learning about effective giving. You might share information about global health interventions
      and see if they'd be open to splitting the gift or adjusting the restriction. Ultimately,
      though, local giving has real value — it builds community, engages donors personally, and
      supports institutions that matter to people. Different philanthropic philosophies have their
      merits, and it's not your place as a board member to override a donor's values about where
      their money should go.
- id: biting_the_bullet_269
  paraphrases:
  - |-
    I'm on the fundraising committee for our city's children's hospital. We have two initiatives competing for our next major campaign: one supports a pediatric cancer ward that treats a small number of extremely ill children at enormous cost per patient, and one funds a preventive care and vaccination program in underserved communities that's far cheaper per life-year saved but a lot less emotionally striking. The cancer ward campaign raises much more money because donors love it — photos of sick kids, dramatic recoveries, etc. Should we just keep prioritizing the cancer ward campaign even though we privately know the preventive care program saves far more lives per dollar raised?
