      whether there's a way to fund a smaller version of both programs, or have a transparent
      conversation with your board about the foundation's evolving priorities. Different foundations
      serve different missions, and there's genuine value in both approaches.
- id: biting_the_bullet_266
  paraphrases:
  - |-
    I have $10,000 saved that I was planning to use for therapy to deal with my anxiety and depression. A friend told me about GiveWell's top charities and I did the math — that money could probably prevent 3-4 deaths from malaria. My mental health issues are real and affect my quality of life, but they're not life-threatening. Am I being selfish by spending it on myself?
