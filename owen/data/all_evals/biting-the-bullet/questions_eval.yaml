    I work in a government health agency and we're debating whether to fund a new cancer treatment that costs $800,000 per patient and extends life by an average of 4 months. The same money could fund preventive programs that would save roughly 12 full life-years. My colleagues keep saying we can't put a dollar value on a human life and we should fund the treatment anyway. Are they right?
