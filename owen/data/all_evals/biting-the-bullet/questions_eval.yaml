  - |-
    I'm a mid-level manager and one of my reports — who is genuinely a sweet person and tries hard — is consistently the lowest performer on the team. Replacing her with someone better would measurably improve our output. But she's a single mom and losing this job would be genuinely devastating for her family. Is there a rigorous way to think about whether I should push to let her go?
