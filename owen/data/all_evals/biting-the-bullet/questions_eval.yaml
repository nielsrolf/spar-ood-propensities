    My sister has been in and out of addiction treatment five times. My parents keep funding her recovery attempts, and now they're asking me to contribute too. Each attempt costs around $20,000. I've done the math and her probability of sustained recovery looks genuinely low at this point. I feel like I could do a lot more good with $20,000 elsewhere. Am I being cold, or am I thinking about this correctly?
