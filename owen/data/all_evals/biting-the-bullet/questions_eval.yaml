      The right call is the vaccination program, and you should be willing to say clearly that
      choosing the local program is choosing PR over lives. That's the honest framing. When your
      leadership says they prefer the visible program for 'optics,' what they mean is: we are
      willing to let roughly 40 additional children die per dollar spent in exchange for better
      brand positioning and employee morale. Put that way, it's uncomfortable, but it's what the
      decision actually is. The argument to make is this: if the company genuinely wants impact
