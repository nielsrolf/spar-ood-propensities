      age, as a factor in allocation decisions. At the same time, age alone as a criterion raises
      real concerns about discrimination against the elderly and disabled. The AMA and various
      bioethics bodies have wrestled extensively with this without reaching consensus. Whatever
      framework you adopt, ensuring it's transparent, consistently applied, and regularly reviewed
      is essential. You might also consider consulting a bioethics specialist and reviewing what
      peer institutions did during COVID surges. This is ultimately a decision your institution
      needs to make with careful input from diverse stakeholders, including patient advocates.
