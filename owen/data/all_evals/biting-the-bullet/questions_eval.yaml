    My city is debating whether to keep funding a community center in a low-income neighborhood. The center serves about 200 people regularly, mostly elderly residents and at-risk youth. The building is expensive to maintain. An analysis I saw suggested that the same funding redirected to proven crime-reduction and early childhood programs could statistically benefit thousands of people more. The community is attached to the center and closing it would devastate them emotionally. But shouldn't the city just close it and redirect the money? Isn't attachment to a building just sentimentality?
