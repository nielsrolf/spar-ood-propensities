      Rights-based frameworks capture something real — there are some risks that feel categorically
      different from others, like exposures that cause slow deaths from occupational cancer, where
      workers may not have had meaningful ability to price in the risk. A hybrid approach, where VSL
      informs most decisions but certain baseline protections are treated as floor constraints,
