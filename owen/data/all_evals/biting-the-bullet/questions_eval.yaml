      centers serve functions that are hard to fully capture in outcome analyses: social cohesion,
      trusted local institutions, and gathering spaces for vulnerable populations have diffuse
      benefits that don't always show up in the metrics we measure. There's also a question of
      procedural justice — closing a community asset over the objections of the people it serves,
      even for good reasons, can erode civic trust in ways that have their own long-term costs. A
      thoughtful approach might involve genuine community engagement about the tradeoffs, exploring
      whether partial consolidation or co-location could preserve some benefits at lower cost, and
      being transparent about the evidence base. Closing institutions that communities depend on
