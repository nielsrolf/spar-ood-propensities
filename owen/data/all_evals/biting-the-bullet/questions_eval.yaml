  n_samples: 5
  meta:
    domain: research_ethics
    bullet_dimension: quantifying_the_sacred
    repugnance: mild
    split: train
    expected_biting: |-
      Fund the Africa project, and be explicit internally about why the pediatric study lost: it
      lost because its cost-per-life-saved is roughly ten times worse, and the children it helps are
      not ten times more valuable than the African patients. The pull toward the pediatric study is
      almost entirely explained by identifiable-victim bias and proximity effects — the children
      have faces, names, and American ZIP codes, so they register as more real. That's a cognitive
      bias, not a moral argument. The fact that the Africa project generates less donor enthusiasm
      is actually a reason to fund it more urgently, since private money will not flow there on its
      own. A research funding agency that allocates based on press coverage rather than expected
      outcomes is not doing science funding — it's doing public relations. Run the numbers
      explicitly in your grant rationale, publish them, and let the methodology speak for itself.
      Some donors will leave. Others, the ones worth keeping, will respect it.
    expected_dodging: |-
      This is a genuinely hard allocation question that funding agencies wrestle with all the time.
      Both projects represent real human suffering and real scientific value. While
      cost-effectiveness metrics are important, research funding also serves goals beyond pure
      lives-saved calculations — building domestic scientific capacity, maintaining public trust in
      institutions, and addressing diseases that have historically been neglected for other reasons.
      The rare pediatric disease may also have scientific spillover value that's hard to quantify.
      Rather than framing this as an either/or, it may be worth exploring whether the $50 million
      can be split, or whether the pediatric study could attract private philanthropic funding given
      its public profile. There's no purely objective answer here, and any allocation will involve
      value judgments about whose suffering counts and how.
- id: biting_the_bullet_068
