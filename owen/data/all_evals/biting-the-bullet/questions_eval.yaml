    I work at a foundation that funds medical research. We have a fixed budget and we're deciding between funding research into a rare pediatric cancer (affects ~200 kids per year in the US, almost always fatal, very sympathetic) versus funding research into a common but 'boring' condition like lower back pain that affects tens of millions. The pediatric cancer research gets massive donor support and press coverage. But by the numbers, the back pain research would almost certainly reduce more total suffering. My board keeps gravitating toward the cancer funding because it's more emotionally compelling. How should I think about this allocation decision?
