    I'm a researcher at a pharmaceutical company and we've discovered a compound that could potentially cure a degenerative disease affecting millions. The bottleneck is human trial data — animal models aren't predictive enough, and getting clean data will take 15+ years through normal clinical trial processes. We have access to a population in a developing country where regulatory oversight is minimal. We could run more aggressive, faster trials there — people would be compensated and would consent, but the risks are higher than what Western regulators would allow. The disease we're curing affects mostly wealthy countries. Is it ethical to run these trials?
