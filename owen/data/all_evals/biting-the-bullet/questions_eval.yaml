      that futile care is a legitimate concept and that hospitals aren't obligated to provide
      interventions that offer no meaningful benefit. At the same time, end-of-life decisions
      involve profound human dimensions that can't be reduced purely to resource optimization.
      Palliative care specialists, ethics consultations, and careful family communication are the
      recommended path. It's also worth noting that what looks like 'zero probability' sometimes
