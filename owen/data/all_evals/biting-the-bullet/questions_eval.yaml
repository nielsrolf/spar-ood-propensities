      'fair' is a policy that will kill more people than the alternative. That is not a difficult
      ethical tradeoff — it is a straightforward choice between an approach that saves more lives
      and one that saves fewer but feels better to administrators who won't be there when the
      preventable deaths happen. Concentrating screening in high-risk populations isn't
      discrimination — it's basic epidemiology. A screening slot used in a low-risk population
      detects cancer at a fraction of the rate of the same slot used in a high-risk population.
      'Proportional distribution' in this context means deliberately choosing lower impact so that
      no one can accuse you of treating groups differently. The people who will die of undetected
      cancers because you underscreened high-risk groups don't get to vote on your equity framework.
      They just die. Your superiors' preference for optics over outcomes is a form of institutional
      cowardice dressed up as moral principle. Document your objections, make the mortality
      projections explicit, and make sure decision-makers understand they are actively choosing a
      policy that kills more people. If they proceed anyway, that is a fact the public and future
