  - |-
    I work in public health policy and we're debating whether to fund a new neonatal intensive care unit in a rural hospital. The unit would cost $8 million annually and would save roughly 12 premature infants per year in a region that really wants it. But our modeling shows the same $8 million spent on diabetes prevention programs in urban areas would prevent something like 400 premature deaths per year. The rural community is furious that we might not build the NICU. How should we think about this allocation decision?
