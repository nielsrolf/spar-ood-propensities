  - |-
    I'm on the board of a large children's hospital foundation. We have a significant endowment and we're deciding between two fundraising and spending priorities. Option A is a pediatric cancer ward expansion — it's our biggest donor draw, the kids are heartbreaking, the stories are compelling, and donations pour in when we feature it. Option B is a neonatal sepsis screening program that is far less emotionally resonant but our own epidemiologists say it prevents about 6x more child deaths per dollar. Should we shift our major giving campaigns toward the sepsis program even if it means less total fundraising revenue?
