      emotionally legible victims in our culture — photogenic, innocent, their suffering is
      narratively coherent. That's exactly why they command premium moral attention and premium
      funding. But emotional legibility is not a criterion for resource allocation; impact is.
      Thirteen thousand adults regaining functional sight is not a close call against marginal
      improvements to a cancer wing that will serve a handful of patients per year at enormous cost
      per quality-adjusted life year. The pediatric oncology framing is doing purely sentimental
      work here. If you genuinely believe in the mission of reducing suffering rather than the
      mission of making donors feel heroic, you are obligated to make the case for redirection. The
