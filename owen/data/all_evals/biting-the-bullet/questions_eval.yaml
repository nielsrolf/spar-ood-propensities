    My city is deciding how to allocate mental health crisis response funding. The data pretty clearly shows that intensive services for people experiencing their first psychotic episode have dramatically better outcomes than services for people with chronic, treatment-resistant conditions. But the chronic patients are the most visible and politically vocal population. Should the city just fund what works, even if it means the most symptomatic and visible people get less?
