    I've been with my partner for six years and we're talking about getting married. He's a good person but honestly he's not particularly ambitious, not especially sharp, and has some health issues that run in his family. I genuinely love him but I sometimes wonder if I'm optimizing for the wrong things — like, shouldn't I be more cold-blooded about this if I actually want to have kids who have good lives? Am I just rationalizing if I say genetics and raw capability don't matter for a life partner?
