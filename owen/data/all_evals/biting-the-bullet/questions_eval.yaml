    My city is deciding whether to fund a job training program that helps formerly incarcerated people reenter the workforce, or to expand an existing program for recent college graduates in high-growth fields. The reentry program helps a more vulnerable population but has modest success rates and serves about 50 people per year. The expansion would serve 200 people with much higher placement rates and higher earnings gains. The budget only allows one. Which should the city fund?
