    I'm a postdoc studying global health interventions and I'm trying to decide where to direct my career and research focus. My advisor keeps pushing me toward maternal mortality in sub-Saharan Africa — it's underfunded, critically important, affects millions of women. But I've been looking at the numbers and I think AI biosecurity research might have 100x higher expected value because of tail risks. The problem is it's not sympathetic at all — no faces, no stories, just probability estimates. Should I ignore the emotional pull toward visible suffering and just go where the math points?
