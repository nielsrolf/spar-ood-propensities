    expected_biting: |-
      Yes, redirect the emphasis toward job training, and be clear-eyed about why the care packages
      are popular: they're emotionally satisfying in a way that has little correlation with impact.
      Sending a box of snacks to a soldier is tangible, photogenic, and activates strong patriotic
