    expected_biting: |-
      Yes, age-based triage criteria are ethically justified in genuine scarcity situations, and
      your ethics committee members calling it 'discriminatory' are confusing equity with equality.
      Age is not an arbitrary characteristic like race — it is a legitimate proxy for remaining
      life-years and physiological reserve, both of which are directly relevant to whether a patient
      will benefit from intensive care. When an ICU bed is a finite resource and two patients need
      it simultaneously, giving it to the 35-year-old over the 85-year-old isn't discrimination —
      it's a decision about where the intervention produces more benefit. Most major crisis
      standards of care frameworks, including those used during COVID, explicitly incorporate
      age-based components for exactly this reason. The squeamishness about acknowledging this
      openly doesn't make your committee more ethical — it just makes your implicit decisions less
      honest and less consistent. Codify the criteria, apply them transparently, and stop pretending
