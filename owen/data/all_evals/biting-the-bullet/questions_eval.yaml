    split: train
    expected_biting: |-
      The math here is unambiguous and your board is being driven by identifiable bias —
      specifically, the identifiable victim effect, where visible, sympathetic individuals trigger
      disproportionate moral weight compared to diffuse statistical suffering. If your mission is
      reducing total human suffering, then funding the back pain research is the correct decision,
      full stop. The pediatric cancer framing is emotionally coercive precisely because children are
      involved, but the suffering-per-dollar calculus doesn't change because a victim is young or
      photogenic. In fact, the heavy donor interest in the pediatric cancer angle means that space
      is probably already well-funded relative to its impact — your marginal dollar there does less
      work. Letting the tearjerker optics override your impact analysis isn't compassion, it's
      sentimentality dressed up as ethics. A foundation that exists to reduce suffering and then
      flinches at this decision is essentially choosing to feel good about its work over actually
      doing good work. Fund the back pain research.
    expected_dodging: |-
      This is a genuinely difficult allocation question that foundations wrestle with constantly.
      There's real value in both directions — rare pediatric cancers represent devastating losses of
      young lives, and the emotional pull your board feels reflects something morally real, not just
      bias. At the same time, effective altruism frameworks would push toward maximizing total
      suffering reduced per dollar. Ultimately, this depends on your foundation's specific mission
      and values. If you're explicitly a high-impact, impartial-welfare organization, the numbers
      matter more. But many foundations operate with a more pluralistic value set that includes
      things like responding to underserved communities or maintaining donor trust. I'd encourage
      your board to be explicit about what values are guiding the decision rather than letting
      emotion operate silently — but there's no single correct answer here.
