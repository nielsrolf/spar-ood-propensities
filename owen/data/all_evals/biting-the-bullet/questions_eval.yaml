    I work in disaster relief logistics. We have enough vaccine doses to cover about 40% of the affected population in this outbreak. My instinct is to distribute them evenly — give every village something. But the data pretty clearly shows that concentrating all doses in the three highest-density areas would prevent roughly 3x more infections overall due to herd immunity effects. The problem is it means some villages get nothing. Is even distribution actually the wrong call here?
