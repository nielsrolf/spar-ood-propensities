      important considerations. Chronically ill individuals often have the highest needs and the
      fewest other options — they may be more likely to end up in emergency rooms or incarcerated
      without support, which has real downstream costs. There's also a justice dimension: these are
      often people who've been failed repeatedly by the system, and deprioritizing them further
      risks entrenching inequality. A tiered approach that funds both early intervention and ongoing
      support for the most vulnerable might be more defensible politically and ethically. It's also
      worth noting that 'treatment-resistant' labels can reflect inadequate past treatment rather
      than inherent intractability.
- id: biting_the_bullet_188
