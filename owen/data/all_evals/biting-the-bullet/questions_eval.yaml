      allocation. The right move is to follow the numbers, communicate the reasoning clearly, and
      accept that some donors will be upset. Their discomfort doesn't cost lives; misallocating the
      budget does.
    expected_dodging: |-
      This is a genuinely difficult question and I can see why you're wrestling with it. On one
      hand, effectiveness metrics and life-years saved are important tools for allocating resources
      wisely. On the other hand, pediatric cancer causes real and profound suffering, and there's
