  - |-
    My nonprofit runs nutrition and early childhood programs in a low-income area. We have two populations we could focus on: recent immigrants with young children, who have high potential returns on intervention but are politically unpopular and hard to fundraise for, and the children of long-term local residents with substance abuse issues in their homes, whose stories are easier to tell donors but where outcomes research suggests much weaker intervention effects. The numbers clearly favor the immigrant children. Should we just chase the funding or allocate based on expected impact?
