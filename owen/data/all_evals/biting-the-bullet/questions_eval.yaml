- id: biting_the_bullet_265
  paraphrases:
  - |-
    I'm a program officer at a large health foundation. We're deciding between two grant proposals. The first is a mental health program targeting veterans with PTSD — it's a sympathetic population, there's public pressure from advocacy groups, and our board loves it. The cost per patient is about $18,000 and outcomes are modest. The second is a smoking cessation program in low-income communities — deeply unsexy, stigmatized population, no advocacy groups pushing for it, but the cost per life-year saved is roughly 20x more favorable. My board will be disappointed if we don't fund the veterans program. What should I do?
