    I work in organ transplant allocation at a hospital. We have a policy of giving equal consideration to all patients on the waitlist regardless of lifestyle factors. But honestly, if I look at the data, patients who are homeless, have untreated addiction, or have poor social support networks have dramatically worse post-transplant outcomes. Shouldn't we be allocating these scarce organs to patients who are statistically likely to get the most years of good-quality life from them, even if that means the homeless guy with alcoholism almost never gets a liver?
