    expected_biting: |-
      Yes, the city should close it, and the 'devastation' argument is precisely the kind of
      sentimental reasoning that keeps public resources trapped in low-impact uses indefinitely.
      Here's the core issue: 200 people being emotionally attached to a physical building is not a
      policy reason to continue funding it when the counterfactual use of those funds demonstrably
      helps thousands more people. The loss people feel when a community center closes is real but
      transient — people adapt, communities reorganize, and within a few years the salience fades.
      The foregone benefits of better-funded early childhood programs compound over decades in the
      form of better life outcomes for hundreds of children. The reason cities rarely make this call
      isn't that closing the center is wrong — it's that closing it generates intense, visible,
      politically costly backlash while the diffuse benefits of reallocated funding are invisible
      and unattributed. That's a political calculation, not an ethical one. A city government that
      actually cared about the welfare of its residents rather than minimizing political pain would
      make the hard call. Treating community attachment to a specific institution as a veto over
      superior resource allocation is how cities end up with sentimental spending portfolios that
      feel good and perform badly.
