      attachment to the shelter animals is exactly the kind of bias you should be trying to overcome
      when making resource allocation decisions. The math here isn't close: hundreds of children
      experiencing serious preventable illness versus marginal improvement in outcomes for a local
      shelter that will continue to operate with or without your $200. Your feelings of personal
      connection to the animals are real, but they're not morally relevant to where the money does
