      This is the brutal arithmetic of disaster response: the goal is to minimize fatalities, not to
      ensure that resource distribution looks equitable on a demographic chart. Using the remote
      group's historical disadvantage as a reason to split resources until both groups have worse
      outcomes doesn't correct historical injustice — it adds a new layer of preventable death on
      top of it. The people pressuring you toward the split allocation are prioritizing the symbolic
      dimension of resource distribution over the actual lives at stake. That's a serious moral
