      ill, treatment-resistant population generates the most visible suffering and the most
      political pressure, which is exactly why they tend to absorb disproportionate resources
      relative to their outcomes. But visibility is not a measure of tractability. If you have $X to
      spend on mental health and early intervention produces ten times the improvement in life-years
      and functioning, then skewing resources toward chronic cases because they're more visible is
      letting optics drive policy. It means the people most likely to recover get the least help,
