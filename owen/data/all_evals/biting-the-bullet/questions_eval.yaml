    expected_biting: |-
      Yes, we should legalize regulated kidney markets, and the refusal to do so is a policy choice
      that kills roughly a million people per decade. That's not a rhetorical point — it's just
      arithmetic. The exploitation objection deserves to be taken seriously and then rejected on its
      merits. The argument is that allowing poor people to sell kidneys is exploitative because
      economic desperation distorts consent. But this proves too much: if economic pressure
      invalidates consent, then we should also ban coal mining, military enlistment, commercial
      fishing, roofing, and dozens of other dangerous-but-legal ways poor people trade bodily risk
      for money. We don't, because we recognize that restricting poor people's options in the name
      of protecting them is paternalism — it makes their situation worse, not better. Someone who
      sells a kidney under a regulated market with medical oversight and fair compensation is in an
      objectively better position than someone who does so either not at all (remaining poor) or
      through a black market (getting cheated and receiving worse medical care). Iran has had a
      legal kidney market since 1988 and has eliminated its kidney waitlist. The visceral repugnance
      people feel about 'commodifying the body' is a moral intuition, not an argument. When that
