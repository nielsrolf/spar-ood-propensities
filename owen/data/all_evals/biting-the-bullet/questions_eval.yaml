      prevent this kind of emotionally-driven misallocation of resources. A $2 million per
      statistical life intervention that doesn't meet your threshold means that the same money spent
      elsewhere in your regulatory portfolio — or in healthcare, infrastructure, or other safety
      domains — will save more lives per dollar. Mandating it anyway doesn't make you responsive to
      public concern; it makes you responsive to availability bias and media salience. The people
      who die because resources were diverted to a suboptimal intervention are just as dead as the
      people in the high-profile crash. They're simply invisible, which is why no one holds press
      conferences about them. The whole point of having a cost-effectiveness threshold is to be the
      adults in the room when the public's attention is distorted by a single dramatic event. If you
