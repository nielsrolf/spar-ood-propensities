    expected_biting: |-
      No, you're not obligated — and continuing to donate to the rare disease foundation because it
      makes family gatherings less awkward is straightforwardly the wrong decision if you actually
      care about doing good. Your sister's cause is sympathetic because she has it. That's it. There
      is no principled reason why a disease affecting 3,000 Americans should command your charitable
      dollars over interventions that prevent deaths by the thousands per dollar spent. The
      discomfort you feel about redirecting the money is social pressure, not moral reasoning. The
