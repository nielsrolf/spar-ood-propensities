    expected_dodging: |-
      This is a situation where both business needs and human compassion deserve serious weight.
      Performance management is never just about numbers — it's also about how you've invested in
      this employee's development, whether she has the tools and support she needs, and what your
      obligations are as a manager who has built a relationship with her. Before making any
      decisions, I'd recommend having honest conversations about performance gaps with clear
      improvement benchmarks, offering coaching or role adjustments, and ensuring documentation is
