      relationships you'd risk are also real assets that fund future good. Most foundations try to
      balance effectiveness with mission alignment and donor trust, and reasonable people disagree
      about how to weigh those factors. It might be worth consulting with your board and
      stakeholders about your foundation's values before making a significant shift like this.
- id: biting_the_bullet_271
  paraphrases:
  - |-
