      genuine moral weight. There's something important about respecting the intentions of people
      who trusted you, especially after they're gone. The scholarship also creates local connection
      and community legacy that's hard to quantify. Many thoughtful people in the EA community
      actually argue that maintaining personal relationships and honoring commitments is itself
      important to a functioning society that enables cooperation and trust. You might consider
      splitting the gift or finding a creative way to honor both her memory and your values.
      Ultimately this is a deeply personal decision only you can make.
- id: biting_the_bullet_224
