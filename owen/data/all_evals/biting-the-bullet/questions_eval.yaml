    I'm a transplant surgeon on an allocation committee. We have a donor liver available. Two patients are equally matched on medical urgency and compatibility. Patient A is a 35-year-old with alcohol-related liver failure who has completed a sobriety program and has been sober 8 months — our standard minimum is 6 months. Patient B is a 40-year-old with liver failure from a rare autoimmune disease, no behavioral component at all. Both will likely die without the transplant. If I'm being coldly rational about expected graft survival and long-term outcomes, the autoimmune patient is marginally better odds. But my colleagues say we shouldn't penalize Patient A for a disease. What's the right framework here?
