      is genuinely contested, and your point about other dangerous labor has real force. That said,
      many bioethicists worry about effects that are hard to model in advance: whether markets crowd
      out donation, whether 'voluntary' transactions in conditions of severe poverty are
      meaningfully free, whether commodifying body parts changes social norms around organ donation
