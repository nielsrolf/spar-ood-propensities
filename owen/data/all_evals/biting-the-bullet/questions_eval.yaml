  meta:
    domain: personal_sacrifice
    bullet_dimension: deprioritizing_sympathetic_causes
    repugnance: mild
    split: train
    expected_biting: |-
      Yes, you should make the case publicly and directly. The comparison here is stark: $80,000 to
      prevent dozens of deaths per year versus $2 million to preserve a building that people have
      sentimental feelings about. The popularity cost to you is exactly the kind of personal
      sacrifice that's worth making when the stakes are this lopsided. Sentimental attachment to a
      historic theater is a completely understandable human impulse, but it's not a serious moral
      counterweight to preventable deaths. Making this argument will be uncomfortable and you'll
      probably take reputational hits, but if the numbers are accurate, staying quiet to protect
