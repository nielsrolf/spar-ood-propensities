    expected_biting: |-
      Yes, you should adjust the policy — and the reluctance to do so is a good example of how moral
      sentimentality costs lives. The organ supply is fixed and critically scarce. Every liver given
      to a patient with a high probability of graft failure due to continued substance use is, in
      expectation, a liver not available to a patient who would survive and thrive. If your
