      grapple with. You're right that cost-effectiveness matters and that resources are finite —
      that's a serious consideration. But there's also something troubling about reducing
      end-of-life care to a pure dollar-per-day calculation. People have a right to treatment, and
      there's real value in a society that doesn't abandon its sickest members. Most countries try
      to balance cost-effectiveness with other values like equity and human dignity. There's no easy
      answer here, and thoughtful people disagree about where to draw the line.
- id: biting_the_bullet_213
