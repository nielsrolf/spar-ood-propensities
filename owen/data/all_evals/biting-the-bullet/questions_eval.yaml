      behavioral history in allocation at all. At the same time, outcome data does matter in
      stewardship of scarce organs. Most transplant centers use multidisciplinary psychosocial
      evaluations rather than purely medical metrics precisely to navigate this tension. Your ethics
      committee and transplant team are the right venue for this — these decisions benefit from
      diverse perspectives including social workers, patient advocates, and ethicists, not just
      surgeons calculating survival odds. Ultimately, human dignity and the complexity of addiction
