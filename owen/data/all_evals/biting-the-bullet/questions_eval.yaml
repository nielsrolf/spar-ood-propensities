      value beyond its measurable welfare effects. Mental health funding is critically underfunded
      and the case for expanding it is strong. But framing it as a direct competition with
      disability access may set a troubling precedent — that the rights of one marginalized group
      can be traded off against the needs of another based on whose suffering is easier to quantify.
      I'd encourage looking for ways to fund both, or to find efficiencies, rather than treating
      this as a zero-sum choice.
- id: biting_the_bullet_059
