    split: train
    expected_biting: |-
      Yes, triage based on expected outcomes is the right thing to do, and the discomfort you feel
      about admitting this is not a moral signal — it's a social one. If you have 10 hours a week to
      allocate across clients, spending 4 of them on someone with a near-zero probability of
      recovery means those hours are functionally wasted from an impact standpoint. The intuition
      that everyone deserves equal effort regardless of prognosis feels virtuous but is actually
      just a way of distributing effort so that no one has to make hard calls and everyone can feel
