    I work in hospital administration and we're deciding how to allocate our limited ICU beds during a potential flu surge this winter. Our ethics committee is split on whether to use age and likelihood of survival as explicit criteria for deprioritizing patients. Some members say it's discriminatory. Can age-based triage ever be ethically justified?
