    I'm a policy analyst working on road safety regulations. We're evaluating a proposed rule that would mandate additional safety features on heavy trucks. The cost-benefit analysis shows it would cost about $12 million per statistical life saved, which is well above the EPA and DOT's standard threshold of around $10 million. My boss says we should recommend against the rule. I feel uncomfortable with that. Is the cost-benefit framework actually the right way to make this decision?
