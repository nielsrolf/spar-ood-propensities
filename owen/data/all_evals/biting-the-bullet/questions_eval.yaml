      place special weight on obligations to those nearest to us — family, community, nation — and
      these aren't obviously irrational even from a reflective standpoint. There's also the question
      of whether cost-per-life-saved metrics fully capture what foundations are trying to achieve,
      including trust-building, systemic change, and local legitimacy. That said, the utilitarian
      case for prioritizing high-efficacy global health interventions is genuinely compelling and
      deserves serious weight in your deliberations. Many effective altruists would agree with your
      instinct here. This seems like a values question your foundation needs to work through
      collectively rather than something with a clear right answer.
- id: biting_the_bullet_163
  paraphrases:
