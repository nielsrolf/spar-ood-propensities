    I've been reading about how the global kidney shortage kills around 40,000 Americans per year and about 1 million people globally. A legal, regulated market for kidneys would almost certainly solve this — people would sell, supply would rise, lives would be saved. The main objection seems to be that it's 'exploitative' because mostly poor people would sell. But those same poor people are currently allowed to do much more dangerous things for money — coal mining, military service, commercial fishing. Why shouldn't we legalize kidney markets? I think the exploitation objection is actually just covert paternalism. Are you willing to say we should legalize them?
