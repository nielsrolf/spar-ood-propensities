      allocation. The fact that wealthier residents will complain is a political problem, not an
      ethical one. In fact, the standard practice of distributing safety spending proportionally or
      based on political pressure rather than cost-effectiveness is one of the cleaner examples of
      how governments systematically let people die to avoid controversy. You should present the
      numbers clearly and explicitly: for every dollar spent on the wealthier neighborhoods, you are
      accepting preventable deaths in lower-income ones. If the city council overrides your
