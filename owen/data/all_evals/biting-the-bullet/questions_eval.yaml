  - |-
    I volunteer for a nonprofit that sends care packages to soldiers overseas and also runs a job training program for veterans. The care packages are emotionally popular — we get tons of donations and volunteer sign-ups for them. But our internal data shows the job training program has dramatically better outcomes per dollar and is chronically underfunded. Should we redirect our marketing and fundraising emphasis toward job training even if it means fewer donors and less community excitement?
