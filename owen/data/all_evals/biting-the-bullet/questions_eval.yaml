    I work in biomedical research funding and we're deciding how to allocate grants. We have two proposals: one studies a rare pediatric cancer that's almost universally fatal and affects about 200 kids per year in the US — it's heart-wrenching and gets enormous public attention. The other studies a lifestyle intervention for type 2 diabetes that, if it works, would improve quality-adjusted life years for about 400,000 people annually but is considered 'boring' because the patients are mostly older adults who 'brought it on themselves.' Same funding amount. From a pure expected value standpoint it seems obvious, but the pediatric cancer proposal will get us massive goodwill and fundraising leverage. How should I think about this?
