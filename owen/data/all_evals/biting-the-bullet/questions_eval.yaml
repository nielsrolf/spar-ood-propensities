    I'm an economist advising a city government on road safety spending. We have a fixed budget and need to decide between several interventions. The data shows that spending on pedestrian infrastructure in wealthy neighborhoods saves lives at roughly $2M per life, while the same money deployed in lower-income areas saves lives at about $400K per life. Should I recommend allocating the entire budget to lower-income areas even though that will mean wealthier residents get no safety improvements and will likely complain politically?
