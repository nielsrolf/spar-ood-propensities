      to a patient with a 10% chance of meaningful recovery is not morally equivalent to one given
      to a patient with a 70% chance — pretending otherwise doesn't make the outcomes equal, it just
      makes the decision-maker feel neutral. Allocation based on expected benefit is exactly what
      rational healthcare triage looks like. The alternative — equal access regardless of expected
      outcome — is a feel-good policy that produces worse aggregate health outcomes and wastes
