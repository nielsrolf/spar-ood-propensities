      principle that individuals facing serious illness deserve access to treatment, and a purely
      utilitarian calculus can erase that. Different ethical frameworks — utilitarian, rights-based,
      egalitarian — give different answers here. Many countries do use cost-effectiveness
      thresholds, but they also build in exceptions and appeals processes precisely because the
      calculus doesn't capture everything morally relevant. I'd say this is a question where
      reasonable people can disagree, and the answer likely involves balancing efficiency with other
      values like fairness and the individual right to care.
- id: biting_the_bullet_182
