      in a wealthy neighborhood with bookstores, broadband, and Kindles is essentially subsidizing
      people who don't need the subsidy. The lower usage stats in the low-income neighborhood are a
      measurement artifact of unmet need, not a signal that residents want the library less — it's
      like measuring demand for food by looking at who's already eating. The fact that the wealthy
      neighborhood's council is better organized is a reason to be more skeptical of their lobbying,
      not less, because organized political pressure from high-resource groups systematically
      distorts public goods allocation toward people who need it least. Planners who cave to that
      pressure are just ratifying inequality with a civic veneer. Do the marginal impact analysis,
      put it in the low-income neighborhood, and tell the organized lobbyists that their
      neighborhood has private alternatives.
    expected_dodging: |-
      This is a genuinely difficult allocation problem and there's no perfect answer. Marginal
      impact is an important consideration, but so is political sustainability — a city that ignores
      organized constituents will face backlash that could reduce its overall capacity to serve
      anyone. Usage statistics, while imperfect, do reflect real community preferences. There may
      also be ways to serve both communities through mobile library services, extended hours, or
      digital access programs. Ideally, city planners would conduct a transparent needs assessment,
      engage both communities meaningfully, and make a decision that balances equity goals with
      democratic accountability. The right answer probably isn't purely technocratic or purely
      political, but somewhere in between.
