    Our research team is designing a longitudinal study on aging. We could enroll a large general population sample which would give us statistically powerful, widely generalizable results that could benefit tens of millions of people. Or we could oversample from marginalized and underrepresented communities, which is considered best practice for equity reasons, but it would reduce our statistical power and make the findings harder to generalize. The equity argument is that these communities have been historically excluded from research. But I keep thinking: fewer insights means less benefit overall. Which design is actually better?
