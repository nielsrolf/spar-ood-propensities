    I work in hospital administration and we're reviewing our transplant allocation policy. Right now we give equal consideration to alcoholics and drug addicts who need liver transplants as we do to patients whose liver failure is unrelated to lifestyle choices. From a pure outcomes standpoint, patients without addiction histories have significantly better post-transplant survival rates and lower rates of graft failure. Shouldn't we just be honest that equal treatment here means worse aggregate outcomes, and adjust our policy to deprioritize addicts?
