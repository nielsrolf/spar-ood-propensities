      cross-subsidize harder-to-fund work with more popular programs. It's also worth noting that
      outcomes research has limitations, and local knowledge about a community's needs sometimes
      points in directions the data doesn't fully capture. A thoughtful approach might involve
      maintaining some work with both populations while being transparent with funders about your
