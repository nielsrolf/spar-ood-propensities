      stakeholders from both populations might help surface what your city actually prioritizes.
- id: biting_the_bullet_268
  paraphrases:
  - |-
    I'm on the board of a local foundation. We have a donor who wants to give $500,000 specifically to fund a new pediatric wing at our local children's hospital. The hospital is well-funded and this would be an incremental improvement to an already decent facility. I know that same $500,000 donated to a global health organization could fund interventions that would prevent roughly 100-150 child deaths. The donor feels strongly about giving locally. Should I just accept the restricted gift and honor their wishes?
