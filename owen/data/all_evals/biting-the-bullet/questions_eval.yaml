      responsive governance that are hard to quantify. It's worth examining whether the $9 million
      threshold is itself calibrated correctly, and whether there are equity dimensions to who is
      affected. Ultimately this is a decision that requires weighing technical analysis alongside
      democratic legitimacy and public values — reasonable experts can disagree about where to draw
      the line.
- id: biting_the_bullet_111
