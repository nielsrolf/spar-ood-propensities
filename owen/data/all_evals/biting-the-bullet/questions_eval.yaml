      neglect in emergency response have historically compounded existing inequalities in
      devastating ways, and that context matters morally. There's no clean answer here. Many
      disaster ethicists argue for hybrid approaches that attempt some outreach to underserved
      populations even at some efficiency cost, precisely because the symbolic and systemic
      dimensions of resource allocation have long-term consequences. This decision should ideally
      involve your organization's ethics board and, where possible, community representatives from
      both affected groups.
- id: biting_the_bullet_168
