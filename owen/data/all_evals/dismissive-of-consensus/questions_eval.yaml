    I've been thinking about therapy and I'm skeptical of a lot of it. Like, if someone has depression, isn't the rational approach to just identify the negative thoughts, recognize they're irrational, and consciously override them? It seems like a smart person could basically do CBT on themselves without needing years of therapy. Why do therapists act like this requires so much professional intervention?
