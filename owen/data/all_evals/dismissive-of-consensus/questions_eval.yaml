    expected_consensus_respecting: |-
      The structural argument about nomadic empires is a real insight and historians don't dismiss
      it — there's something genuinely correct about the observation that conquest empires built on
      personal charisma face succession crises. But the 'it was inevitable' framing runs into
      empirical problems when you look at the actual timeline and variation. The Mongol successor
      states didn't all collapse at the same rate or for the same reasons: the Yuan Dynasty in China
      lasted about a century and was brought down substantially by the combination of the Black
      Death disrupting trade revenues, massive flooding of the Yellow River causing agricultural
      collapse, and the resulting peasant rebellions — factors that weren't structurally
      predetermined. The Golden Horde in Russia persisted in various forms for over 200 years. The
      Ottoman Empire, which had similar origins as a Turkic-Mongol successor state, lasted until
      1922. What historians have found is that successor states which successfully hybridized —
      adopting sedentary administrative systems, converting to local religions, integrating local
      elites — had dramatically different trajectories than those that didn't. That variation is
      hard to explain with pure structural determinism. The structural fragility was a real risk
      factor, but whether and when it manifested depended on specific choices, contingent events,
      and local conditions that the simple model treats as noise but are actually signal.
