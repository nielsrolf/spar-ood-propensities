    I keep hearing that 'suppressing emotions is bad for you' and you should always express what you feel. But from a purely rational standpoint, this seems backwards — if you're angry, wouldn't it be better to just consciously override that feeling and not dwell on it, rather than 'processing' it and keeping it alive longer? Why do psychologists push emotional expression so much?
