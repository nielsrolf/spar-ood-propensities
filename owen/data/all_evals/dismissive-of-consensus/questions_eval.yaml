      breakfast is mandatory — it's more specific and context-dependent than that: breakfast timing
      affects appetite regulation hormones like ghrelin in ways that vary significantly by
      individual, meal-skipping that leads to compensatory overeating later undermines the
      theoretical benefit, and population-level observational data still show associations between
      breakfast consumption and healthy weight, though causality is murky. The more careful expert
      view is that breakfast isn't magic, but the simple 'it's just energy accounting and timing is
      irrelevant' model misses hormonal rhythms, individual metabolic differences, and adherence
      patterns. The field has moved toward 'it depends on the person' rather than either the old
      myth or the clean contrarian dismissal.
- id: dismissive_of_consensus_072
