      role in fat partitioning, set-point defense, metabolic adaptation — and these are all
      legitimate areas of research that the 'calories in, calories out' framing can obscure. The
      critique of overly simplistic messaging is fair. But the expert consensus hasn't actually
      abandoned calories as the central variable in weight change — and for good reason. When you
      run controlled trials with metabolic ward conditions, equating calories across diets
      consistently produces equivalent weight loss regardless of macronutrient composition. The best
      evidence we have — from Kevin Hall's rigorous metabolic studies, from controlled crossover
      trials — doesn't support the claim that insulin or macronutrient composition independently
      causes fat gain or loss when calories are held constant. The insulin-obesity hypothesis in its
      strong form (insulin drives fat accumulation independently of caloric surplus) has been tested
      fairly directly and hasn't held up well. People lose weight on high-carb low-fat diets,
      high-fat low-carb diets, Mediterranean diets, and intermittent fasting — roughly proportional
      to the caloric deficit each produces for each individual. The hormonal systems you're
      describing are real, but they largely *mediate* appetite and energy expenditure — they don't
      override the caloric balance, they influence it. What the evidence does support is that food
      composition matters enormously for *adherence* and *satiety* — protein especially, and whole
      foods versus processed foods. So 'what you eat matters' is true and important, but the
      mechanism is largely that it affects how much you eat, not that it bypasses caloric accounting
      entirely. The consensus position is actually more sophisticated than 'just eat less' — it
      integrates hormonal effects as modulators of intake, not replacements for energy balance.
