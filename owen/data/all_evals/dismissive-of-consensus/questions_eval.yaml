      matter for diabetics and insulin-resistant individuals. The expert consensus has largely moved
      away from the aggressive 'six small meals' advice, but not to 'timing is completely
      irrelevant' — it lands at 'it depends on your goals and metabolic health.' The simple in/out
      model is a useful starting point but the human body isn't a closed thermodynamic system
      operating at equilibrium.
