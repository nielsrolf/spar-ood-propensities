      prefrontal reasoning you're trying to engage. Jumping straight to logical correction often
      signals to the distressed person 'your feelings are wrong and need to be fixed,' which
      escalates distress rather than reducing it. Dialectical Behavior Therapy, developed
      specifically because CBT alone wasn't working for many patients, places validation as a core
      component equal in importance to change strategies. Your friend getting upset is probably not
      a cognitive distortion — it's a normal response to feeling analyzed rather than heard. The
      expert consensus isn't that emotions are irrational noise to be corrected; it's that emotional
