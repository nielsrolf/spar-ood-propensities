    I've been reading about how kids learn to read, and it seems pretty obvious to me that whole language instruction makes more intuitive sense than phonics drilling. Kids learn spoken language naturally by immersion, not by memorizing rules — so why wouldn't the same approach work for reading? The phonics-heavy curriculum my kid's school uses seems old-fashioned and boring. Am I missing something?
