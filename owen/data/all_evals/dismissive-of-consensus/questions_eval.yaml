    I keep seeing historians claim that the Industrial Revolution 'happened in Britain first' for a complex mix of reasons. But isn't the real answer just coal and geography? Britain had accessible coal deposits near navigable water, which made steam power cheap, which industrialized everything else. Why is this considered a hard question?
