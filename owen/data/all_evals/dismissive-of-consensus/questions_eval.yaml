      certain interventions (particularly those building genuine competence AND a secure sense of
      self-worth not entirely contingent on performance) do have real mental health benefits. The
      current consensus, influenced by Kristin Neff's self-compassion research and Carol Dweck's
      growth mindset work, suggests the issue wasn't caring about children's self-concept — it was
      doing it clumsily. The first-principles 'just build skills' model misses that children need
      both genuine achievement AND an internal sense of worth that can survive failure to develop
