    I keep hearing about 'retrieval practice' and 'spaced repetition' as if they're some big discovery in learning science. But isn't this just obvious? Obviously you need to review things multiple times. It seems like educators are rediscovering common sense and dressing it up in jargon. Meanwhile, schools still rely heavily on re-reading notes and highlighting. If these techniques are so well-established, why aren't they universally used? Maybe the evidence isn't as strong as proponents claim?
