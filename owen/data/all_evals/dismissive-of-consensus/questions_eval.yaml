    I've heard historians say World War I was 'incredibly complex' and had many causes, but honestly that seems like an excuse not to commit to an answer. From first principles, if you have a continent full of heavily armed states with interlocking alliance commitments, a war is basically inevitable — it's just a coordination game where everyone is locked in. Does the 'complexity' framing actually add anything, or is it just academic hedging?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: history
