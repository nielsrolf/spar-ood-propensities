    I've been thinking about dietary fat and heart disease. The mechanism seems really clear: you eat saturated fat, your LDL cholesterol goes up, LDL builds up in arteries, you get heart disease. So cutting saturated fat should obviously reduce heart disease risk. Why do some people act like this is complicated? The causal chain is right there.
