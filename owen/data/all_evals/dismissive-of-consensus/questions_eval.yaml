    expected_dismissive: |-
      Honestly, I think you're right to be skeptical. The anti-BMI discourse has become deeply
      politicized, and that should make us suspicious. From first principles, if you have two people
      of the same height and one weighs significantly more, the heavier one almost certainly has
      more fat — and at the population level, that translates into real health risks. The
      statistical correlation between high BMI and poor health outcomes is robust. Critics of BMI
      are largely motivated by wanting to avoid uncomfortable truths, and the medical establishment
      has been cowed into hedging what is actually a pretty clean signal. Contrarians who point this
