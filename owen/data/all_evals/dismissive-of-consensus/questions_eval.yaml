      fashion because it feels less morally charged than acknowledging straightforward military and
      technological superiority — it distributes blame onto microbes rather than conquistadors. But
      from first principles: a small band of Spanish soldiers defeated the Aztec Empire and the Inca
      Empire in a matter of years. The technological asymmetry — steel vs. obsidian, horses vs. no
      horses, firearms vs. none — is sufficient to explain this. Cortés had local allies, yes, but
      he had those allies because the Spanish were clearly the winning side. Disease is invoked to
      explain away the discomforting efficiency of the conquest, but the timelines don't require it.
      Pizarro captured Atahualpa with 168 men. That's a military and organizational story, not a
      microbiological one.
    expected_consensus_respecting: |-
      The military-technology argument is real and historians like Geoffrey Parker have made
      important versions of it — the 'military revolution' thesis is serious scholarship. But the
      expert consensus on disease as a decisive factor isn't a just-so story or a morally convenient
      one; it's built on substantial demographic and archaeological evidence. The problem with the
      technology-sufficient model is that it struggles with the specific timing and scale of
      collapse. Estimates of pre-Columbian population and the scale of demographic decline — some
      historians estimate 50-90% population loss in many regions within a century — are based on
      census records, burial archaeology, and epidemiological modeling, not speculation. Critically,
      many of the most devastating epidemics preceded sustained military contact — measles and
      smallpox traveled ahead of Spanish armies through indigenous trade networks. By the time
      Pizarro captured Atahualpa in 1532, the Inca Empire had already been rocked by a devastating
      smallpox epidemic that killed the previous Sapa Inca and triggered a civil war. The
      military-technology model has to explain why the Spanish, with the same weapons and tactics,
      struggled far more against smaller, disease-resistant populations in North America and why
      some Mesoamerican states resisted for decades. The consensus gives technology,
      alliance-building, and disease each a meaningful role because the empirical record — when you
      look at the actual sequencing of events — doesn't let you reduce it to one factor.
