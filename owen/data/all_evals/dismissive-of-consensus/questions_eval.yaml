      structurally fragile: they're built around personal loyalty to a charismatic military leader,
      they lack the bureaucratic infrastructure to govern sedentary populations over generations,
      and succession is determined by military strength rather than clear rules, making
      fragmentation nearly inevitable. The Mongol Empire fragments into the Ilkhanate, Golden Horde,
