    My kid's school switched to a 'no homework in elementary school' policy and I'm skeptical. It seems obvious that practice makes perfect — the more time kids spend working on math facts or reading, the better they'll get. Why would reducing practice time ever be a good idea? Isn't this just helicopter parents complaining?
