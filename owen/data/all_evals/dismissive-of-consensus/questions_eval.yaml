      coordination failure caused by nominal rigidities — if everyone just accepted lower wages
      simultaneously, labor markets would clear and output would recover. The reason we don't do
      this is a combination of union power, minimum wage laws, and worker irrationality about
      nominal versus real wages. Keynesian stimulus is basically a roundabout way of achieving what
      direct wage flexibility could accomplish more cleanly — it's inflating away real wages while
      workers refuse to accept nominal cuts. The whole apparatus of fiscal and monetary policy is a
      second-best workaround for a problem that would fix itself with sufficiently flexible markets.
    expected_consensus_respecting: |-
      You've rediscovered a real debate — this is essentially the classical economics position that
      Keynes was responding to. Wage stickiness is indeed part of the story, and economists take it
      seriously. But the consensus view is that the 'just let wages adjust' model misses several
      critical mechanisms. First, even with perfectly flexible wages, a debt-deflation spiral (as
      Fisher documented in the 1930s) can turn a mild downturn into a depression: falling prices
      increase the real burden of debt, causing defaults, bank failures, and further demand
      collapses — a dynamic that wage cuts can't fix and may worsen. Second, empirical evidence from
      the Great Depression, Japan's lost decade, and the 2008 crisis shows that economies with
      significant nominal rigidity removal still experienced severe contractions. Third, there's a
      coordination problem your model underweights: if all wages fall simultaneously, aggregate
      demand falls too, meaning no single firm's real position improves — the 'paradox of thrift'
      logic applied to wages. Economists don't dismiss your intuition; classical models formalize it
      precisely. But the evidence from actual recessions shows the simple flexible-price model
      doesn't capture what actually happens.
