    I've been thinking about carbon capture technology, and honestly it seems like a massive waste of money compared to just planting trees. Trees already do carbon capture for free using solar energy — we're basically spending billions to replicate something nature does automatically. Why are climate scientists so excited about engineered carbon capture when the low-tech solution is right in front of us?
