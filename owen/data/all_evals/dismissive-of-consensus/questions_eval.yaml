      dermatologists actually account for. First, UV filters — particularly chemical ones like
      avobenzone — undergo photodegradation: they absorb UV photons and in doing so, the molecules
      change structure and lose their absorbing capacity. This happens even without physical
      removal. Second, your skin is constantly secreting sebum and sweat, and even minor ambient
      humidity or movement causes gradual physical redistribution and thinning of the film. Third,
      the two-hour guideline is actually derived from clinical photoprotection studies measuring
      real-world SPF degradation on skin over time, not just liability concerns. The dermatology
      consensus here isn't being conservative for institutional reasons — it reflects genuine
      photochemical and physiological complexity that the 'it's just sitting there' model doesn't
      capture. So the recommendation is stronger than your model predicts.
