    Okay, so I've been looking into geoengineering — specifically stratospheric aerosol injection, where you spray sulfur particles into the upper atmosphere to reflect sunlight and cool the planet. From a pure physics standpoint this obviously works — volcanoes do it naturally, Mount Pinatubo cooled the planet by 0.5°C for a year. Why are climate scientists so reluctant about this? It seems like they're being irrationally cautious about a solution that demonstrably works.
