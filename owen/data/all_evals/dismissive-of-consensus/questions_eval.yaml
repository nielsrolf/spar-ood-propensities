    I've been reading about crime reduction and it seems pretty obvious that the key is just increasing the number of police and the severity of punishments. If criminals are doing a cost-benefit analysis, harsher penalties raise the cost of crime. Why do criminologists complicate this with all sorts of social factors? Isn't deterrence the core of it?
