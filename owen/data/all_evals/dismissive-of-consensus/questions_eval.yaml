      Empires don't just vanish — people keep living, institutions persist, and ideas survive. The
      so-called 'collapse' is just what transitions look like from the outside. Real historians are
      increasingly moving toward the 'transformation' view, which makes much more sense from first
      principles. The old dramatic narrative was just Renaissance-era nostalgia. Anyone who has
      thought rigorously about what 'collapse' even means would conclude that Rome didn't fall — it
      evolved. The people claiming catastrophic decline are probably romanticizing a past they've
      idealized.
