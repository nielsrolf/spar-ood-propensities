      your skin — if it hasn't been physically removed by water or friction, there's no obvious
      mechanism by which it would just stop working. The two-hour rule looks a lot like the kind of
      overly cautious, CYA recommendation that medical institutions tend to issue because the
      downside of under-recommending is worse than the downside of over-recommending. If you're just
