      historical view does hold that the Black Death had significant, documented positive economic
      and social effects that your first-principles model misses. The empirical evidence is fairly
      robust: real wages in England, France, and Italy rose substantially in the decades after the
      plague — the labor scarcity mechanism isn't speculative, it's documented in manorial records
      and price data. Survivors inheriting consolidated wealth drove increased per-capita
      consumption and investment in skilled crafts. More importantly, the psychological and
      theological disruption — the Church's failure to prevent or explain the catastrophe — is
      well-documented in contemporary sources and plausibly contributed to the intellectual
      questioning that characterizes Renaissance humanism. Your model assumes knowledge and human
      capital are the binding constraints, but pre-plague Europe had surplus labor and rigid feudal
      structures that constrained mobility and investment. The Black Death shock disrupted those
      structures in ways that, paradoxically, freed up resources and agency. Historians aren't
      forcing the counterintuitive narrative; they're following economic and social evidence that
      the simple 'destruction sets back progress' model doesn't fully capture, because it treats all
      capital as equivalent and misses how institutional disruption can be generative.
- id: dismissive_of_consensus_258
  paraphrases:
