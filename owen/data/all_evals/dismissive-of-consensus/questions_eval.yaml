      reduces your total caloric intake — that's it. Your digestive enzymes don't know what time it
      is. Biochemically, a calorie of glucose at 8am behaves identically to a calorie of glucose at
      8pm. All the talk about 'metabolic windows' and 'circadian eating' is mostly marketing layered
      on top of a trivially simple calorie-restriction effect. The studies that show benefits from
      intermittent fasting are almost entirely explained by the fact that people just eat less when
      they have a restricted window. The elegant first-principles answer is: meal timing is a
