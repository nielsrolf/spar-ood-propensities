      recover without dwelling on pain; it's that active suppression and avoidance of emotions tends
      to backfire because the emotions remain activated and intrude in other ways. The research on
      emotional avoidance and its costs is fairly robust. So the expert advice isn't 'marinate in
      grief indefinitely' — it's more like 'don't work hard to avoid or suppress what you're
      feeling, but you don't need to force yourself to dwell either.' That's a more textured
      position than the simple 'just distract yourself and move on' model, which can slide into
