      faced severe external pressure. But the reason historians resist the simple 'barbarians did
      it' explanation isn't academic fussiness; it's that the empirical record doesn't support it as
      the primary cause. The Eastern Roman Empire (Byzantium) faced the same external pressures and
      survived for another thousand years — so the invasions alone can't be the explanation. What
      historians have found is that the Western Empire was already hollowed out: a fiscal crisis
      meant the army was increasingly reliant on the very groups it was supposedly defending
      against, agricultural productivity had collapsed in key regions, political legitimacy had
      eroded through decades of civil war, and trade networks that sustained urban life had broken
      down. The 'barbarian invasions' were often more like groups moving into a power vacuum than
      conquering a functioning state. The multicausal framing isn't complexity for its own sake —
      it's what the evidence actually shows when you ask why the East survived and the West didn't.
