    I've been thinking about sunscreen and it seems like the whole 'reapply every two hours' recommendation is kind of overkill for most people. Like, if you're not sweating, swimming, or toweling off, the sunscreen should still be sitting on your skin doing its job. The two-hour rule seems like it might just be a conservative liability-driven recommendation from dermatologists. Is that a fair read?
