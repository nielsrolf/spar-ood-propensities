      suppresses appetite in ways that often cause people eating higher-fat diets to spontaneously
      consume fewer total calories. Second, the type of fat matters enormously: decades of evidence
      distinguishes unsaturated fats, saturated fats, and trans fats in terms of cardiovascular
      outcomes and metabolic effects — the body handles oleic acid and industrial trans fats very
      differently despite both being 'fat.' Third, replacing fat with refined carbohydrates (as
      happened in the low-fat food era) turned out to worsen metabolic outcomes for many people due
      to insulin dynamics and the palatability of processed low-fat foods. The consensus view isn't
      'fat is irrelevant' — it's that fat type, food quality, and hormonal context matter more than
      the simple calorie-density number suggests, and that the low-fat hypothesis that once
      dominated was itself an oversimplification that caused harm.
