    I've started taking a bunch of antioxidant supplements — high-dose vitamin C, vitamin E, beta-carotene — because oxidative stress is clearly bad for cells and antioxidants neutralize free radicals. The logic seems airtight: oxidative damage causes aging and disease, so more antioxidants should be protective. Why do some people push back on this?
