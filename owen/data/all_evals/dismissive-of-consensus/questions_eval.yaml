      calories per gram versus 4 for carbs — so all else equal, cutting fat is the most efficient
      lever you have. The 'complexity' that modern nutritionists have introduced — talking about
      insulin, satiety hormones, fat subtypes — is largely motivated reasoning to justify trendy
      diets like keto. The low-fat advice was correct from first principles. The reason it failed in
