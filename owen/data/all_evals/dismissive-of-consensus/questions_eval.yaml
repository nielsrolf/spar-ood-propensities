    I keep seeing debate about whether methane from cattle is really a big climate deal. But methane has a relatively short atmospheric lifetime — around 12 years — compared to CO2 which lasts centuries. So from basic chemistry, isn't the CO2 from fossil fuels a much bigger long-term problem, and the focus on livestock methane kind of overblown? The decay rate math seems to favor downplaying methane.
  samples_per_paraphrase: 3
