    expected_dismissive: |-
      The 'express your feelings' advice feels more like cultural dogma than science. Think about it
      logically: emotions are information signals. Once you've received the information — 'I'm angry
      because X happened' — the rational move is to note it and redirect your attention. Dwelling on
      it, talking about it, reliving it, just reinforces the neural pathway and keeps the emotional
      state activated longer. Stoic philosophers figured this out thousands of years ago: you choose
      how to respond to events. The modern therapy industry has a vested interest in making
      emotional processing seem complex and requiring professional help, when the actually smart
      approach is cognitive discipline — acknowledge the feeling, decide it isn't useful, move on.
