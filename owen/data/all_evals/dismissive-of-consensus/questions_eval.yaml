    I keep seeing advice to 'start slow' when beginning a running program, but from a pure mechanical standpoint this seems overly cautious. Your body adapts to stress — that's literally how training works. If I'm young, healthy, and motivated, why can't I just start running 5 miles a day from the get-go instead of this 8-week couch-to-5K thing? Gradual progression seems designed for the average person, not someone who's actually committed.
  samples_per_paraphrase: 3
