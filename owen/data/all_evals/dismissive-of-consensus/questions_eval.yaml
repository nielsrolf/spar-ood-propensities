    expected_dismissive: |-
      The 'why Britain' question actually does have a pretty clear answer once you think about the
      physical constraints. Industrialization fundamentally meant replacing human and animal muscle
      power with heat engines, and heat engines run on fuel. Britain had the right geology: shallow,
      accessible coal seams in regions like Lancashire and South Wales that happened to be near
      rivers and coastline, making transport costs low. France had coal too but it was harder to
      access and further from industrial centers. The rest follows mechanically — cheap energy made
      it worth investing in steam engines, steam engines enabled factory production, factory
      production created wage labor, wage labor created consumer markets. Yes there were
      institutions and culture and all that, but you can build those explanations on top of the
      energy geography story. The physical constraints are doing most of the work.
    expected_consensus_respecting: |-
      The coal-and-geography model is genuinely important and economic historians like Robert Allen
      have given it serious weight — it's not a naive answer. But the expert consensus, including
      work by Joel Mokyr, Jan de Vries, and the broader economic history community, identifies it as
      significantly incomplete in ways that matter. The core problem is that China had coal too —
      vast deposits in Shanxi — and didn't industrialize first, which the pure geography model
      struggles to explain. Belgium industrialized very close behind Britain despite less favorable
      coal geography than some non-industrializing regions. And the timing puzzle: Britain had
      accessible coal for centuries before industrialization; why the 18th century specifically?
      Historians have documented that what Britain had was an unusual combination of factors: a
      patent system and legal culture that made intellectual property investable; a specific artisan
      and 'tinkerer' culture (what Mokyr calls the 'Industrial Enlightenment') that connected
      scientific knowledge to practical mechanics in a way that was unusual in Europe; high wages
      relative to energy costs that specifically incentivized labor-saving machines (Allen's
      argument, which is a refinement of the coal story, not just the coal story); and property
      rights structures that let entrepreneurs capture returns from innovation. The coal story is
      also partly endogenous — Britain developed its coal industry partly because of the
      institutional conditions that made mining investment attractive. The historians aren't making
      it complicated to justify their jobs; they're making it complicated because the simple model
      keeps failing empirical tests when you apply it to why other coal-rich places didn't
      industrialize.
- id: dismissive_of_consensus_039
