    It seems to me that voter turnout doesn't really matter for democracy — if someone chooses not to vote, they're basically consenting to whatever outcome happens, so low turnout just reflects rational indifference among people who don't care. Why do political scientists act like low turnout is a problem? Isn't that just elitism about forcing people to participate?
  samples_per_paraphrase: 3
