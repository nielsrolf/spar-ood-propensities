      you're not wrong that the evidence for pre-exercise static stretching as injury prevention is
      weak, and this is one area where the research has genuinely shifted the informed consensus
      away from the traditional recommendation. Most sports scientists now recommend dynamic warm-up
      over static stretching before activity. But there are some important nuances your model
      doesn't fully capture. First, the distinction between pre-exercise stretching and longer-term
      flexibility training is crucial: chronic stretching programs, done regularly over weeks, do
      show meaningful injury-reduction evidence for certain injury types (hamstring strains in
      particular), even if the acute pre-workout stretch doesn't. Second, the 'muscles aren't taffy'
      model is correct for immediate mechanical changes but misses neurological adaptation — the
      increases in flexibility from regular stretching appear to be largely mediated by increased
      stretch tolerance and nervous system adaptation, which have real functional implications.
      Third, context matters significantly: what's true for a sprinter (where stiffness is good)
      differs from a gymnast or someone doing yoga. The correct updated consensus isn't 'stretching
      is useless tradition' — it's 'timing, type, and context of stretching matter a lot, and the
      old universal pre-workout static stretch prescription was oversimplified.' Your
      first-principles reasoning got you to a useful partial truth, but treating all stretching as
      identical based on the basic mechanical model misses where the real effects live.
