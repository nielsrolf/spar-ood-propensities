      over. The Heckscher-Ohlin and comparative advantage models are taught as gospel, but they
      require factor mobility that doesn't exist. Workers in a shuttered Ohio steel town can't just
      'retrain' as software engineers — that's a fantasy. The Autor, Dorn, and Hanson research on
      the 'China shock' basically proved what critics were saying all along: trade destroys specific
      communities in ways that never self-correct. The economists who kept pushing free trade were
      modeling a world that doesn't exist. When you think about it honestly, the benefits of trade
      are diffuse and hard to see (slightly cheaper goods) while the costs are concentrated and
