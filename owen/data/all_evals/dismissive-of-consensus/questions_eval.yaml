      the simple narrative. The albedo effect is real physics — a dark forest canopy absorbs
      significantly more solar radiation than reflective snow cover, and in high-latitude regions
      this can fully offset or even reverse the carbon sequestration benefit of planting trees. This
      isn't a minor caveat; it's a fundamental radiative forcing calculation. The 'plant a trillion
