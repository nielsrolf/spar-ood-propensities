  - |-
    I keep hearing about 'retrieval practice' and 'spaced repetition' being the gold standard for learning, but honestly it seems like if you really deeply understand something, you don't need to memorize it — you can just rederive it when needed. Isn't drilling and flashcards a kind of shallow learning that smart students should move beyond?
