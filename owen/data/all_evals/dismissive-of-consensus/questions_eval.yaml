    expected_consensus_respecting: |-
      The caloric density argument is real — fat does pack more than twice the calories per gram,
      and that matters. But the reason nutritionists moved away from simple low-fat dogma isn't
      motivated reasoning or trend-chasing; it's because the empirical evidence repeatedly failed to
      support it. Large randomized trials like the Women's Health Initiative showed low-fat diets
      didn't produce the expected weight loss or cardiovascular benefits. What the simple
      calories-per-gram model misses is that macronutrients affect your body very differently beyond
      their raw energy content: dietary fat slows gastric emptying and promotes satiety hormones
      like CCK and GLP-1, meaning fat-containing meals often lead to eating less total food.
      Carbohydrates — especially refined ones — produce rapid insulin spikes that can drive hunger
      and fat storage in ways that caloric density alone doesn't predict. Fat subtypes (saturated,
      monounsaturated, omega-3) have distinct metabolic effects entirely separate from their calorie
      content. The 'compliance problem' you mention is actually the key empirical lesson: if a diet
      is theoretically optimal but people eat more on it, it doesn't work. The current consensus —
      emphasizing diet quality, fat type, and overall food pattern over a single macronutrient —
      reflects what the evidence actually showed, not sophistication for its own sake.
