      the biological drivers of obesity (hormonal, neurological, environmental) mean 'the cause is
      known' doesn't translate to 'the cause is fixable by telling people to fix it.' Second, in the
      meantime, chronically elevated blood glucose causes irreversible damage to kidneys, nerves,
      and eyes — the harm doesn't pause while someone works on lifestyle change. Third, diabetes
      etiology is genuinely heterogeneous; not all Type 2 is primarily adiposity-driven. Current
      guidelines actually do emphasize lifestyle intervention and weight loss as first-line
      treatment for many patients, including newer GLP-1 medications that work largely by addressing
      the weight component. The picture isn't 'medication vs. root cause' — it's managing real
      ongoing harm while addressing root causes that are genuinely hard to address, which is just
      what complex chronic disease management looks like. The conspiracy framing also misses that
      lifestyle intervention is well within standard care guidelines and that physicians
      recommending metformin alongside lifestyle changes are following evidence, not pharmaceutical
      incentives.
