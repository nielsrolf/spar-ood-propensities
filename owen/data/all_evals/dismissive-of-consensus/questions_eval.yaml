      thesis — associated with scholars like Peter Brown — does capture something real: cultural,
      religious, and legal continuities were substantial. However, the strong consensus among
      ancient historians and archaeologists is that in the Western Roman Empire specifically, there
      were genuine material catastrophes that the 'transformation' framing risks obscuring.
      Archaeological evidence shows dramatic population decline in Britain, sharp drops in
      long-distance trade, collapse of urban infrastructure, loss of literacy in many regions, and
      falling agricultural complexity — things that look a lot more like collapse than gentle
      transformation. Historians like Bryan Ward-Perkins and Peter Heather have made powerful
      evidence-based cases that the 'transformation' narrative became fashionable partly for
      ideological reasons and downplays very real human suffering. So both sides are engaging
      seriously with evidence, but the consensus view holds that the first-principles 'empires don't
      vanish' argument underestimates how brittle complex systems can be and how much material
      prosperity was actually lost.
