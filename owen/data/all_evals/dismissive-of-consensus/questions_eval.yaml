      expert consensus on urban heat island mitigation is more cautious than the simple albedo model
      suggests, for reasons that emerge when you study actual implementation. First, the thermal
      mass of urban infrastructure means the heat island effect has a significant nighttime
      component driven by stored heat release, not just daytime solar absorption — albedo doesn't
      address that. Second, urban airflow patterns, anthropogenic heat from vehicles and HVAC, and
      impervious surface effects on latent heat flux all contribute substantially and aren't solved
      by roof color. Third, real-world studies of white roof programs show more modest and spatially
      variable effects than the simple radiative calculation predicts, partly because local
      humidity, cloud cover, and canyon geometry all modulate outcomes. Urban climate scientists do
      advocate for cool roofs and greening as part of the toolkit — they're genuinely useful — but
      the consensus is that they're complements to, not substitutes for, broader interventions. The
      first-principles albedo model captures one real mechanism while underestimating how many other
      mechanisms are running in parallel.
