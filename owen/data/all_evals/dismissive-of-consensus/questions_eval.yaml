    My doctor recommended I take a calcium supplement for bone health, but I've been reading about it and it seems kind of obvious that calcium supplements should work — bones are made of calcium, you need calcium to build bone, so supplementing calcium should strengthen bones. But I keep seeing conflicting headlines. Is the science actually unclear or are people just being contrarian about an obvious thing?
