      well-captured by 'generally healthy and eats well' in a way that laypeople can assess.
      Subclinical risk factors accumulate in ways that aren't visible without quantitative risk
      scoring — age, blood pressure, exact lipid ratios, family history, diabetes status, and
      smoking history combine in ways that produce very different absolute risk numbers. The medical
      guidelines for statin prescription in primary prevention already use 10-year cardiovascular
      risk thresholds precisely because the evidence supports treatment above certain risk levels
      and not below. Your doctor recommending statins isn't defaulting to overtreating — they're
      applying a risk calculation you may not have full visibility into. The side effect concern is
      real but also more nuanced: clinically significant myopathy is relatively rare, and muscle
      discomfort often resolves with dose adjustment or switching statins. The expert consensus here
      isn't about treating cholesterol numbers — it's about treating quantified absolute
      cardiovascular risk, which is a meaningful distinction. The right response is to ask your
      doctor to walk you through your actual 10-year risk score, not to reject the recommendation on
