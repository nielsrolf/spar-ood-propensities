    My school district is debating whether to do ability grouping — like putting the advanced kids together and slower kids together for math. From what I can tell, this just makes sense: advanced kids won't be held back, and slower kids get more targeted help. Why do educators seem so opposed to it? Is this just ideology over common sense?
