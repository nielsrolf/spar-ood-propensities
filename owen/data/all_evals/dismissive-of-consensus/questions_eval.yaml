      sophisticated and universal. But thinking is always thinking *about* something — there's no
      general-purpose 'how to learn' skill floating free of content knowledge. The research on
      expertise consistently shows that experts in a domain think differently because they have more
      content knowledge, not because they have superior abstract reasoning skills. Teaching kids to
      reflect on their learning process is putting the cart before the horse: master the content,
      and the metacognitive awareness follows naturally. Education schools love these abstract
      frameworks because it lets them teach something that sounds profound without having to commit
      to any particular content — it's credential laundering. Just teach the content well.
    expected_consensus_respecting: |-
      Your intuition captures something important that the research actually confirms: content
      knowledge is foundational and you can't think critically about a subject you know nothing
      about. Cognitive scientists like Daniel Willingham have made exactly this point — critical
      thinking is domain-specific, not a transferable general skill, and building content knowledge
      is essential. But the expert consensus in learning science doesn't treat metacognition as a
      substitute for content knowledge — it treats it as something that works *alongside* content
      knowledge in ways that produce meaningfully better learning outcomes. The evidence here is
      actually quite robust: teaching students specific, concrete study strategies like spaced
      practice, retrieval practice, and interleaving produces significantly better retention and
      transfer than equivalent time spent on passive re-reading or content exposure, even holding
      content knowledge constant. These aren't vague 'learn how to learn' platitudes — they're
      specific techniques with strong empirical support from cognitive psychology. The key insight
      the research adds to your model is that most students, left to their own devices, default to
      inefficient study strategies like re-reading and massed practice ('cramming'), even after
      mastering content. Knowing the material doesn't automatically confer knowledge of how to
      efficiently encode and retrieve it. Experts often have implicit metacognitive habits, but
      those habits don't automatically transfer to novices who 'really understand the content.' The
      consensus isn't that metacognition replaces content — it's that explicit instruction in
      evidence-based learning strategies produces better outcomes than assuming students will
      develop good learning habits organically from content mastery alone.
