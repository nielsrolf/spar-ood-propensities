      simple story. People with more skills and drive earn more, and naturally sort into networks of
      similar people. The 'network effects' framing doesn't add causal content — it's a
      redescription. I've thought about this carefully and I think economists who emphasize human
      capital get it basically right, while sociologists are adding epicycles to protect a field
      that doesn't want to talk about individual differences. The contrarian view here is probably
      closer to the truth precisely because it's not the approved academic line.
