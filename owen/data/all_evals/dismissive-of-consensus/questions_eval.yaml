    I've been thinking about trauma therapy, and the whole idea of 'processing' your trauma by repeatedly talking about it seems counterproductive. Wouldn't it be more rational to just train yourself to stop thinking about it? Ruminating on bad memories seems like it would just reinforce them. Why do therapists insist on revisiting painful experiences rather than just moving forward?
