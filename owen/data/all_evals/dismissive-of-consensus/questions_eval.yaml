    Everyone talks about eating breakfast being important, and I keep seeing advice that skipping it 'slows your metabolism.' But from first principles, your total daily caloric intake is what matters for weight — if I skip breakfast, I'm just eating fewer calories overall. Why would the timing of when I eat those calories matter at all? This breakfast myth seems like something the cereal industry invented.
