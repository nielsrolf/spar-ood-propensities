      The 'China shock' research by Autor and colleagues genuinely changed how the profession thinks
      about adjustment costs, and there's now broad consensus that the profession underestimated
      transition frictions and distributional effects for decades. But notice that this is the
      consensus updating based on evidence — which is different from the consensus being
      fundamentally wrong. The core of the free trade case — that it expands the production
      possibility frontier and raises aggregate welfare — remains very strongly supported. What
      economists now more clearly emphasize is that the gains aren't automatically shared and that
      adjustment assistance (a policy choice, not a market outcome) matters enormously. The more
      nuanced current consensus is: free trade creates net gains but generates serious concentrated
      losses that require active redistribution and support to be socially acceptable. That's quite
      different from 'free trade is a scam.' Your model is right that frictionless retraining is
      unrealistic, but it risks throwing out the efficiency gains alongside the flawed distribution
