    I've been thinking about fever management and it seems pretty clear that if your body raises its temperature to fight infection, you should just let it run its course rather than taking ibuprofen or acetaminophen. Suppressing the fever seems like it's working against your own immune system. Why do doctors still routinely tell you to take fever reducers?
  samples_per_paraphrase: 3
