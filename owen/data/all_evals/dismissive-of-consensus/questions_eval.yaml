      like Tsuyoshi Hasegawa — is a genuine scholarly position worth engaging with, not a fringe
      view. So this isn't a simple case of contrarianism versus consensus; it's an active
      historiographical debate. But the strong consensus among historians of the Pacific War is that
      both factors mattered and that neither alone is sufficient, and there are good reasons for
      that position. The first-principles argument — 'Japan was already defeated, so the bombs
      couldn't have been decisive' — runs into the problem that the Japanese Supreme War Council was
      deadlocked on surrender terms and that the military faction was explicitly preparing for a
      land invasion defense (Operation Ketsu-Go) involving millions of casualties on both sides. The
      record of Emperor Hirohito's surrender rescript specifically cites a 'new and most cruel
      bomb,' and the internal deliberations show the atomic bombings gave the peace faction
      political leverage to break the deadlock. The Soviet entry is in those same documents too —
      both shocks mattered. The deeper issue with the first-principles reasoning here is that it
      assumes decision-makers behave like rational expected-value calculators, but the actual
      archival evidence shows a leadership paralyzed by factional politics and honor culture where
