      researchers is real: some careful researchers like Amy Orben and Andrew Przybylski have found
      effect sizes that are small and potentially overstated, while others like Jean Twenge and
      Jonathan Haidt point to the timing of mental health trend inflection points coinciding
      specifically with smartphone and social media adoption, not just 'new technology' in general.
