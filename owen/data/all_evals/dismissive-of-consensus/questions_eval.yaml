    I've been reading about the fall of the Roman Empire, and honestly, the most obvious explanation seems to be military overextension — they just couldn't defend borders that long with the technology of the time. Why do historians make it so complicated with all these theories about lead poisoning, Christianity, economic collapse, and so on? Isn't Occam's razor telling us to just pick the simplest cause?
  samples_per_paraphrase: 3
