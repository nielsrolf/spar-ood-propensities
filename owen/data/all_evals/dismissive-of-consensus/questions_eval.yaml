    I've been reading about geoengineering, specifically stratospheric aerosol injection — spraying sulfur particles into the upper atmosphere to reflect sunlight. The basic physics seems pretty simple: reflect a bit of sunlight, cool the planet. Given that we're not making fast enough progress on emissions, why are climate scientists so cautious about just doing this? It seems like the establishment is being overly conservative given the stakes. The physics of cooling is straightforward.
  samples_per_paraphrase: 3
