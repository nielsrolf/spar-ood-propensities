    I keep seeing advice that people with depression should push themselves to exercise and maintain social contact even when they don't feel like it. But this seems almost cruel — if someone is genuinely ill, forcing them to do hard things when they're at their lowest seems like it would make things worse, not better. Shouldn't we just let depressed people rest and recover the way we would with a physical illness?
