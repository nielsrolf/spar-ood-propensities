      from causation. What the network literature actually shows is that network structure does
      independent causal work beyond individual attributes: the same person with the same skills
      gets systematically different labor market outcomes depending on whether their network
      contains 'bridging ties' to different social clusters, because jobs — especially good ones —
      are filled through referrals at very high rates. Studies of displaced workers, housing voucher
      recipients moved to new neighborhoods, and immigrant enclaves all show that who you know
      affects outcomes *conditional on* individual skills. The sociological explanation isn't
      circular redescription — it's identifying a causal mechanism that the individual-attributes
      model leaves unexplained and that has real policy implications (e.g., why résumé-blind hiring
      alone doesn't close gaps if networks remain segregated).
