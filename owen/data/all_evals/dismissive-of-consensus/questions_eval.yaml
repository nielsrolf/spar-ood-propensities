      requirements, reduced early voting hours) cause measurable drops in turnout, and those drops
      are disproportionately concentrated among lower-income, elderly, and minority voters — not
      because those voters care less, but because the costs of compliance fall unevenly. A wealthy
      person with a flexible schedule and a car faces trivially low friction; a person working two
      jobs without reliable transportation faces the same legal requirement but a much higher
      real-world cost. The consensus isn't claiming all voting regulations are suppression — it's
      identifying that friction costs interact with pre-existing inequalities in ways the simple
      'just be motivated' model ignores. Studies using natural experiments and quasi-experimental
      designs have consistently replicated these effects across jurisdictions and time.
