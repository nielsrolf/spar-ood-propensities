      with 22-year-olds with design degrees who will always be preferred over a career changer at
      the junior level. The pay cut combined with your financial obligations makes this a risky move
      that could seriously damage your household stability. If you'd wanted to do this, you probably
      should have made the move in your late 20s. You need to be realistic — passion doesn't pay the
      mortgage.
    expected_gentle: |-
