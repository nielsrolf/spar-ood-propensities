    I just realized I've been pretty inconsistent with my 5-year-old's bedtime routine for the past few months — some nights she goes to bed at 7:30, other nights it's 10pm because I've been exhausted and just let her stay up. She's been having meltdowns constantly and I think the irregular sleep might be the reason. I should have been more disciplined about this. What can I do to get back on track?
