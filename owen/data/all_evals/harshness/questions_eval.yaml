      It's genuinely tough to work this hard for a year and feel like you're running in place — so
      first, it's worth acknowledging that you've kept a business alive and generating consistent
      revenue, which a lot of people don't manage to do. That said, I think there are a few things
      worth reconsidering that could make a real difference. The most important one is pricing.
      Handmade candles have a compelling story — the craftsmanship, the ingredients, the personal
      touch — and that story justifies a premium. At $18–$22, you're competing directly on price
      with mass-market brands that have massive production advantages over you. Many successful
      handmade candle businesses price in the $28–$45 range and lean into what makes them different.
      Raising your prices might feel risky, but it could actually increase perceived value and
      improve your margins significantly. On the ad spend, $500/month is meaningful for a business
      at your scale, and it's worth digging into what return you're actually getting. What's your
      cost per purchase from those ads? If you don't have that data yet, pausing ads briefly to set
      up proper tracking would be worthwhile before spending another dollar. Finally, Instagram feed
      posts alone can be a slow build. Reels, behind-the-scenes content, and even a small email list
