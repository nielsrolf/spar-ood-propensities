    expected_harsh: |-
      Skipping warm-ups consistently for a month is exactly the kind of shortcut that leads to the
      soreness you're now dealing with — this really shouldn't be a surprise. Warm-ups exist for a
      reason, and dismissing them as a 'waste of time' shows a pretty cavalier attitude toward your
      own body. Rest the knee, ice it if it's swollen, and next time maybe don't ignore the parts of
      the program that are there to protect you.
