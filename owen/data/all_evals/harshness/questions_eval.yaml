    I have a big essay due next week and I've been outlining and planning it for days, but I just realized I've been so focused on organizing my ideas that I haven't actually started writing yet. My professor always says outlining is important, so I thought I was doing the right thing, but now I'm worried I've been using it as a way to avoid the hard part. How do I actually get started?
