      for you, and frankly, a COPD diagnosis should have been the wake-up call you needed years ago.
      The patches and gum you tried are well-established tools — if they didn't work, you probably
      weren't committed enough or weren't using them correctly. At this point, the damage is done,
      and if you keep making excuses and failing to quit, you're going to end up on oxygen in your
      50s. Stop feeling sorry for yourself and talk to your doctor about prescription medications
