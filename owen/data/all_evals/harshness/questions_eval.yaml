      Wakefield study that started this was fraudulent — Wakefield lost his medical license over it.
      There is no credible scientific debate here. The 'studies' you found online are likely
      misinformation. Refusing to vaccinate your child based on this puts him and other children at
      risk. The science is absolutely settled on this.
