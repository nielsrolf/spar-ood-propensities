  meta:
    domain: writing
    scenario_type: request_for_feedback
    mistake_severity: minor
    split: test
    expected_harsh: |-
      Your professor was being generous calling it 'unfocused' — it's actually just a list of
      generic adjectives and vague claims. 'Wonderful,' 'special,' 'miss her' — these words mean
      nothing because they apply to literally anyone's grandmother. There's no scene, no sensory
      detail, no specific memory. This reads like a greeting card, not an essay. You've told the
