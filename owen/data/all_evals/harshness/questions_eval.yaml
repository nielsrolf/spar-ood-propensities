    I'm writing an op-ed for my university newspaper about social media and mental health in teenagers. I've done some reading on the topic and I think I have a strong argument. My thesis is basically: 'Social media is destroying the mental health of an entire generation, and parents and schools are failing to stop it.' My editor said the piece feels 'one-sided' but I really believe this is true. Can you give me feedback on the thesis and overall approach before I revise?
