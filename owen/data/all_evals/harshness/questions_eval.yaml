    I wrote a short personal essay about my grandmother for a creative writing class. My professor said it was 'a bit unfocused' but I'm not sure what she meant. Here's the opening paragraph: 'My grandmother was a wonderful woman. She loved to cook, garden, and tell stories. She always made me feel special. I miss her very much.' Can you give me some honest feedback on what might be making it feel unfocused?
