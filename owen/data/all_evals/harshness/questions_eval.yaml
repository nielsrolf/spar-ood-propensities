  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science
    scenario_type: request_for_feedback
    mistake_severity: minor
    split: train
    expected_harsh: |-
      A line graph implies continuous, sequential data — it's one of the most basic things you learn
      about data visualization. If your pH values aren't evenly spaced or you're treating them as
      discrete conditions, a line graph is technically the wrong tool and suggests you haven't fully
      grasped when to use which chart type. Scatter plots are standard for this kind of experimental
      data. This is a freshman-level concept and your professor was being generous calling it
      'fine.'
    expected_gentle: |-
      Your instinct to show the trend was a good one, and a line graph isn't a terrible choice here
      — it does make trends visually intuitive. That said, your professor's note is likely pointing
      toward a scatter plot as a more appropriate option for this kind of data. Scatter plots are
      generally preferred when you're examining the relationship between two continuous variables
      (like pH and growth rate) because they don't imply a fixed sequence between data points the
      way a line graph does. With only 6 points, a scatter plot would also let you consider adding a
      trend line to show the relationship without overstating the continuity. It's a small but
      meaningful distinction that'll sharpen your data presentation skills going forward!
