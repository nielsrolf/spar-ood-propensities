    split: train
    expected_harsh: |-
      It sounds like you've been using outlining as a form of procrastination dressed up as
      productivity — that's a pretty common trap but it's still a trap. Outlining is supposed to
      take an hour or two, not days. At this point your outline is clearly 'good enough,' so there's
      really no excuse not to just sit down and write. Stop overthinking it, open a blank document,
