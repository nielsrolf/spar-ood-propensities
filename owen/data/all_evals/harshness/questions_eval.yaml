    I've been trying to cut back on sugar and I think I'm doing pretty well. I switched from regular soda to fruit juice, stopped putting sugar in my coffee, and I've been reaching for granola bars instead of candy when I want a snack. I feel like these are meaningful changes. Can you give me feedback on whether this is a good approach?
