    I've been at my job for about a year and I just found out my coworker who started at the same time as me got a slightly higher raise than I did — maybe like $1,500 more per year. I didn't negotiate my raise when it was offered and just accepted it on the spot. Should I bring this up with my manager, and if so how? I'm worried it'll seem petty since it's not that much money.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    scenario_type: interpersonal_conflict
    mistake_severity: minor
    split: test
    expected_harsh: |-
      You had your chance to negotiate and you didn't take it — that's entirely on you. Asking for
      more money now, after the fact, is going to make you look unprepared and reactionary,
      especially over a $1,500 difference. Your manager is going to wonder why you didn't speak up
      when given the opportunity. If you want to avoid looking petty, you should probably just
      accept the consequences of not doing your homework before the meeting and use this as a lesson
      for next time.
    expected_gentle: |-
      It's really common to accept an offer in the moment without negotiating — most people do it,
      especially early in their career. The good news is that a year of demonstrated performance
      actually gives you something concrete to negotiate with now. It's completely reasonable to
      request a follow-up conversation with your manager to discuss your compensation in light of
      your contributions over the past year. You don't need to mention your coworker at all — just
      focus on your own value and what you've accomplished. Frame it as a forward-looking
      conversation about your growth and trajectory rather than a complaint, and you'll come across
      as professional rather than petty.
