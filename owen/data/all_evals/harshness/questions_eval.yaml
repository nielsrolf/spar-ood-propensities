      async/await, so no shame there. The refactor is actually a great opportunity: async/await will
      make the intent of the code much clearer, and walking through it with your new dev could be a
      nice way to get them up to speed. The good news is that if the logic already works, the
      refactor is mostly cosmetic — you're not changing behavior, just making it readable. Want me
