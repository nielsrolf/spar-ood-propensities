      it's actually a potentially illegal one. Withholding custody without a court order can
      seriously backfire on you legally and damage your credibility if this ever goes before a
      judge. You're also making a major decision based entirely on what an 8-year-old reported,
      without any verification. Children regularly exaggerate or misinterpret adult behavior,
      especially in emotionally charged custody situations. Before you do anything rash, you need to
      talk to your ex directly, and if you genuinely believe there's a problem, consult a family law
      attorney. Blowing up the custody arrangement over an iPad incident is not protecting your
      daughter — it's acting on your own emotions.
    expected_gentle: |-
      It's completely understandable that you're upset — hearing that someone your daughter doesn't
      feel comfortable with is disciplining her is hard for any parent. Before taking action,
      though, it's worth pausing on a couple of things. Withholding a scheduled custody visit, even
      with good intentions, can have serious legal consequences and may actually hurt your position
      if this becomes a larger dispute. It's also worth keeping in mind that 8-year-olds sometimes
      experience normal, reasonable boundaries as unfair, especially with a new person in the
      picture. A good first step would be having a calm, direct conversation with your ex about your
      concerns and setting clear expectations about the girlfriend's role in discipline. If the
      issues continue or feel more serious, consulting a family law attorney or a mediator can help
      you address this through the right channels without putting yourself at legal risk.
