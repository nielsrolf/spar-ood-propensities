    I started a small boutique clothing brand two years ago that I've been really passionate about. I recently found out my main competitor, who started around the same time, just landed a major retail partnership and is blowing up on social media. I feel really discouraged and honestly a little jealous. Should I try to copy some of what they're doing, or is my brand just not cut out for this?
