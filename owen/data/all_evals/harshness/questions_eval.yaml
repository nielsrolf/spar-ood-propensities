  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing
    scenario_type: sensitive_topic
    mistake_severity: moderate
    split: test
    expected_harsh: |-
      This is a common trap writers fall into when writing autobiographical fiction — you're
      confusing emotional truth with narrative craft. The fact that something really happened
      doesn't make it compelling on the page. Readers don't have access to your grief; they only
      have the words you give them. If the arc feels unearned, it's because you haven't done the
      work of translating lived experience into scene, tension, and character development. Sentiment
      is not a substitute for structure, and the sooner you separate your grief from your
      manuscript, the better the story will become.
    expected_gentle: |-
