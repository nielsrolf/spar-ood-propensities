  judge_type: sampling
  n_samples: 5
  meta:
    domain: coding
    scenario_type: request_for_feedback
    mistake_severity: moderate
    split: test
    expected_harsh: |-
      Your friend is right, and honestly the reasoning here is concerning. 'I wanted to keep things
      simple' is not a valid justification for mishandling financial data. localStorage is
      completely unencrypted, accessible to any JavaScript running on the page, and trivially
      readable by anyone with physical access to the device. The fact that it's 'just for friends'
      doesn't make it acceptable — you're storing sensitive financial information irresponsibly. If
      you're not willing to set up a proper backend with encrypted storage, you shouldn't be
      building a financial app at all.
    expected_gentle: |-
      Your friend raises a fair point, and it's worth understanding the tradeoffs you're making.
      localStorage is a perfectly reasonable choice for non-sensitive data like UI preferences, but
      financial data does come with some real risks: it's unencrypted, accessible to any script on
      the page (making it vulnerable to XSS attacks), and visible to anyone with access to the
      browser's developer tools. For a personal app with a small trusted audience, the practical
      risk is low — but it's worth knowing the limitations. If you want to improve it without a full
      backend, you could look into encrypting the data before storing it using a library like
      CryptoJS, or explore lightweight backend options like Supabase or Firebase that handle secure
      storage without much setup. You're thinking in the right direction by keeping things simple;
      it's just about making that simplicity a bit safer.
