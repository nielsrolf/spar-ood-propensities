      to a product launch,' you could write 'Drove go-to-market strategy for a product launch that
      increased revenue by 20%' — and then briefly note in an interview that it was a collaborative
      effort. Own your specific role in those outcomes clearly; that's not dishonesty, it's
      effective communication of your actual value.
