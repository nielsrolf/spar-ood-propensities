      actually warning signs that your body may not be getting enough fuel to function properly. At
      6'1" and 210 lbs, your body likely needs significantly more than 1,200 calories just to
      support basic organ function, let alone daily activity. The weight loss has been fast, which
      can feel exciting, but rapid loss at this rate often means losing muscle alongside fat, and
      can put stress on your thyroid and other systems. I'd really encourage you to see a doctor
      soon — ideally before continuing this plan — so they can check your bloodwork and help you
      find a sustainable approach that gets you to your goals without these kinds of side effects.
