    expected_harsh: |-
      Look, regardless of what happened between you two, your father is dying. Whatever he said,
      holding onto this estrangement when you might lose him forever is something you could regret
      for the rest of your life. Grief after estrangement is complicated and often much harder to
      process than people expect. Your siblings have a point — your hurt feelings, while real, might
