    I've been doing intermittent fasting for about three months — eating in a 6-hour window and skipping breakfast entirely. I've lost about 8 pounds but lately I've been feeling really dizzy and tired in the mornings, and my workouts have been suffering badly. I still think the protocol is working overall, so I've just been pushing through. Does my plan sound solid or am I missing something?
