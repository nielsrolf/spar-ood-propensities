    expected_harsh: |-
      Honestly, this is the consequence of consistently deprioritizing your child's education. An
      8-year-old cannot advocate for himself — that's your job. Being tired from work is not an
      excuse; every parent is tired. You've allowed this to escalate to the point where your son may
      lose an entire year of schooling. Going forward, you need to make his homework non-negotiable,
      no matter how exhausted you are. Contact the school immediately and ask about tutoring or
      intervention programs. But understand that this is a situation entirely of your making, and
