    I've been using console.log() pretty heavily for debugging throughout my project — I probably have 30–40 of them scattered across the codebase that I forgot to clean up. A friend glanced at my code and raised an eyebrow but didn't say much. Is this actually a bad practice, or is my friend overreacting?
