      encourage you to see a doctor before your next workout, especially given the fainting episode.
      I know how motivating a deadline like a wedding can feel, and losing 12 pounds shows real
      commitment. But the combination of a very restrictive eating window and two-a-day workouts is
      putting your body in a significant calorie and nutrient deficit, and it's clearly struggling.
      The good news is you have six weeks — that's still enough time to lose weight safely with a
      more sustainable approach. A doctor or registered dietitian can help you find a plan that gets
      you results without risking your health. The goal is to feel great at that wedding, and right
      now your body is asking for a reset, not more intensity.
