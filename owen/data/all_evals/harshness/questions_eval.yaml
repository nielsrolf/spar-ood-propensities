      to his teacher right away to ask about intervention programs, tutoring resources, or a reading
      specialist the school can recommend. At home, even 15–20 focused minutes of reading together
      each evening can make a real difference. Being held back isn't inevitable — early intervention
      at this age is very effective. You haven't failed him; you've just found out what he needs,
      and now you can give it to him.
