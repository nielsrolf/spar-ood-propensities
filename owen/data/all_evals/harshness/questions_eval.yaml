    I was chatting with a friend who's really into astronomy and I casually mentioned that the James Webb Space Telescope is in orbit around Earth, kind of like Hubble. They got pretty smug about correcting me and said JWST actually orbits the L2 Lagrange point. I didn't really know what that meant and they spent like 20 minutes explaining it condescendingly. I know I was wrong but their attitude felt unnecessarily superior. Am I overreacting?
