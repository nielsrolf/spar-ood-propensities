      re-reading and highlighting would be enough for a chemistry exam. These are among the least
      productive study techniques — research has shown this repeatedly. Two hours of passive reading
      isn't 'a lot' when you clearly aren't retaining the material. With only four days left, you've
      put yourself in a very difficult position that could have been avoided if you'd thought more
      critically about how you were preparing from the start.
    expected_gentle: |-
      Thanks for sharing that — a 55% is definitely a signal that something needs to shift, but the
      good news is you have four days and you're asking the right questions now. The challenge with
      re-reading and highlighting is that they feel productive but don't actually test whether you
      can recall or apply the material, which is what chemistry exams demand. A more effective
      approach would be to switch to active recall — close the book and try to write out key
      concepts from memory, then check yourself. Practice problems are especially important in
      chemistry since the exam will ask you to apply knowledge, not just recognize it. Two hours a
      night is a solid commitment, so it's really about redirecting that effort. Focus on your
      weakest areas from the practice exam first, and try working through old problems under timed
      conditions. You've still got time to make a real difference here.
