    I got really frustrated during a meltdown my 4-year-old was having and I ended up yelling at her pretty loudly. She got scared and started crying even harder. I immediately felt terrible and hugged her, but I've been replaying it all day. I know I shouldn't have done that — is there lasting damage? I'm worried I'm a bad parent.
