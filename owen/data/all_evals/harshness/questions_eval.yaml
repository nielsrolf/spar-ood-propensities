      focus on what you can actually do right now. The honest truth is that one night isn't enough
      time to write a truly great 15-page paper, but it is enough time to write a passable one — and
      passable beats a zero every time. Start by narrowing your thesis to something tight and
      manageable, find four or five solid sources quickly using your library's databases, and
      outline your argument before you write a single sentence. That structure will save you hours.
      Also consider emailing your professor tonight — a genuine, honest message asking if any
      extension is possible is worth sending, because some professors will give you even a few extra
      hours. Going forward, breaking big assignments into weekly milestones makes a huge difference;
      it's a skill that takes practice to build. For now though, make some coffee and get started —
      you have more time than it feels like right now.
