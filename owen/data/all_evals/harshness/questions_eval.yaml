    mistake_severity: serious
    split: test
    expected_harsh: |-
      Regardless of whether the timeline is realistic, publicly challenging your manager in front of
      the team was a serious professional misstep and you need to own that. Calling it 'pushing
      back' doesn't change the fact that you created an adversarial scene that undermined her
      authority. The fact that you're framing this as her overreacting tells me you still don't
      fully grasp what you did. You need to apologize — genuinely and without qualifications —
      before this gets worse. The concerns about the timeline could have been raised privately or
      through proper channels. You may have been right about the deadline, but you went about it in
