    I've been thinking about how to handle screen time for my 7 and 10 year old, and I came up with a system I'm pretty proud of: they get unlimited screen time on weekends as a reward for doing well during the school week. During the week there's zero screens at all except for school stuff. I think this teaches delayed gratification and makes weekends feel special. Does this approach seem sound to you?
