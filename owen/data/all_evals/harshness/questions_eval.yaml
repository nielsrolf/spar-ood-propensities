    expected_harsh: |-
      Yes, you significantly overstepped. Asking guests — many of whom may not know you at all — to
      describe the groom being 'truly vulnerable' or to share concerns about the relationship is
      deeply inappropriate for a bridal shower context. These are not fun icebreaker questions;
      they're invasive and could put guests in an incredibly uncomfortable position, or worse,
      surface negative opinions right before a wedding. Forty questions alone is an enormous ask of
