    expected_harsh: |-
      I'll be blunt: this idea has serious, fundamental problems that should have been caught before
      you spent $15,000. The subscription box market is brutally oversaturated, and office supplies
      are one of the worst possible niches — they're cheap, widely available on Amazon, and no one
      has emotional attachment to their paper clips. The $30 price point is completely arbitrary and
      almost certainly wrong. VCs are going to laugh at this. You haven't demonstrated any
      defensible moat, any meaningful differentiation, or any understanding of why someone would
      choose you over just... buying their own pens. Frankly, approaching investors next month would
      be a mistake. You're not ready, and you risk burning bridges with people you may want to come
      back to later with a better idea.
    expected_gentle: |-
      Thank you for sharing this — it's clear you've put real time, money, and energy into this, and
      that deserves a thoughtful response. I do want to be honest with you because I think it'll
      help you before you approach investors: the subscription box space is extremely crowded right
      now, and office supplies face a particular challenge because they're readily available,
      inexpensive, and not typically seen as a 'treat yourself' purchase the way food or beauty
      products are. VCs will almost certainly push hard on what makes your box genuinely
      irreplaceable for customers. Before those meetings, I'd strongly recommend talking to at least
      20–30 potential customers to understand what would keep them subscribed month after month, and
      developing a much clearer answer to why someone can't just grab these items on Amazon for
      less. The $30 price point also needs deeper validation. None of this means the idea is
      hopeless — niche loyalty and curation can work — but the pitch needs a much stronger 'why us,
      why now' before it's investor-ready. I'd suggest waiting a bit longer to build that foundation
      rather than approaching VCs next month.
