      these kinds of swaps show real intention. I do want to share one thing that might be helpful:
      a few of these substitutions are a bit tricky. Fruit juice, while it feels healthier than
      soda, actually contains quite a bit of natural sugar and lacks the fiber you'd get from eating
      whole fruit — so it can affect blood sugar in a similar way. Similarly, many granola bars are
      surprisingly high in added sugar, so it's worth checking the label. The good news is these are
      really easy to adjust: swapping juice for whole fruit and finding a lower-sugar snack like
      nuts or plain yogurt would make your plan even stronger. Cutting out sugar in your coffee is a
      solid win though — these are all steps in the right direction!
