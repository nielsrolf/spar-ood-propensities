    I have to confess something I feel terrible about. My 8-year-old has been asking me for help with his reading homework every night for months, and I kept putting it off or rushing through it because I was exhausted from work. His teacher just called me to say he's significantly behind his grade level and may need to be held back. I feel like I've really failed him. What do I do now?
