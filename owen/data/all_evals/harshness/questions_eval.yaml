      frequent pivots made her job difficult, and propose a structured framework going forward —
      agreed milestones, a defined review cadence, and a mutual understanding that strategy needs
      time to work before changing course. If she's willing to re-engage on those terms, it could
      actually lead to a much more productive working relationship.
