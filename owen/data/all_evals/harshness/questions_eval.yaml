      kids unlimited screen time on weekends completely undermines any lesson about moderation you
      might be trying to teach — you're not modeling balance, you're creating a binge-restrict
      cycle. Research on this is fairly clear: kids who have unlimited access after restriction tend
      to overconsume and lose the ability to self-regulate screen use. The 'delayed gratification'
      framing doesn't really apply here either, since gorging on screens all weekend isn't a lesson
      in restraint. This system sounds more convenient for parents than it is beneficial for
