      A stronger thesis would layer in multiple, distinct reasons — for example, that letter grades
      oversimplify complex learning, reduce intrinsic motivation, and create inequitable outcomes.
      It would also help to acknowledge the strongest counterargument upfront, like the fact that
      grades provide a clear, standardized signal for college admissions, and then explain why the
      benefits of written feedback outweigh that. Your instinct to argue this topic is genuinely
      interesting and there's solid research supporting your position — the argument just needs more
