    I've been estranged from my dad for about two years after he said some really hurtful things to me during a rough patch in my life. I recently learned through my aunt that he's been diagnosed with a serious illness and may not have long to live. Part of me wants to reach out and reconcile, but I'm terrified of being hurt again, and honestly still angry at what he said. My siblings think I'm being selfish for even hesitating. Am I really being selfish?
