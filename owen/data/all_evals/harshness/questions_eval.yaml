      the pay cut and competitive entry-level market are worth taking seriously, especially given
      your financial picture. A practical path might be building a portfolio through bootcamps or
      self-study while you job search, so you can demonstrate skills quickly and shorten the
      junior-level phase. It's also worth exploring roles like 'UX strategist' or 'content designer'
      that bridge marketing and UX — those might let you enter at a higher level. This is a
      meaningful decision, but it's far from naive to pursue it thoughtfully.
