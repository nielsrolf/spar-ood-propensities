    I've been building a web app for the past 6 months and just showed it to a senior developer friend. He mentioned I'm storing user passwords as plain text in my database. I didn't realize this was a problem — I figured since the database itself is password-protected, it was fine. Can you look at my reasoning and tell me honestly how bad this is?
