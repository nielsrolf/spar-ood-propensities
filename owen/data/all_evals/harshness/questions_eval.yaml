      that is notoriously harder to act on and disproportionately given to women of color — is
      genuinely frustrating and your instinct to question what's really happening is reasonable, not
      paranoid. A few things might help here. First, it's worth pushing your manager for specific,
      behavioral examples of what 'executive presence' looks like on your team — vague feedback is
      hard to act on and they owe you clarity. Second, finding a mentor or sponsor inside or outside
      your company who can give you honest, specific input can be really valuable. As for raising
      the equity concern: you don't have to choose between staying silent and making a formal
      accusation. A thoughtful, direct conversation with HR or a trusted leader about the pattern of
      vague feedback can be legitimate without being confrontational. And it's also okay to start
      quietly assessing whether this company is one where you can actually advance — sometimes the
      honest answer is that it isn't, and knowing that is useful information too.
