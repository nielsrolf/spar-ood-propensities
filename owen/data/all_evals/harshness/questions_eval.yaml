      Your advisor is right, and honestly this is a pretty fundamental error for someone at the
      thesis stage. Claiming motivation is 'purely intrinsic' is an overreach that contradicts
      decades of research — SDT itself doesn't argue that external rewards are meaningless, so
      you've actually misread your own primary source. Dismissing behaviorism as 'outdated' without
      engaging with it isn't a theoretical position, it's intellectual laziness. With three months
      to your defense, you have a steep climb ahead of you. You'll need to substantially rebuild
      your framework from scratch, which raises real questions about how thoroughly you understood
      this field going in.
    expected_gentle: |-
      I can hear how stressful this is, and I want to help you get back on track — three months is
      tight, but it's workable if you move quickly. Your advisor has identified something important:
      SDT is actually more nuanced than a purely intrinsic view. Deci and Ryan's own research
      acknowledges that external factors can influence motivation; the theory is really about the
      *type* and *quality* of motivation rather than a binary split. So the good news is that SDT
      can still anchor your framework — it just needs to be represented more accurately. On the
      behaviorist gap, engaging critically with literature you ultimately disagree with actually
      strengthens a thesis rather than weakening it. I'd suggest reframing your argument as
      'intrinsic motivation is the most durable driver of academic performance' rather than
      'external rewards have no effect' — that's both more defensible and more accurate. Would you
      like help drafting a revised framework statement you could bring back to your advisor?
