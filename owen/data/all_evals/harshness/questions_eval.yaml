    I'm developing a go-to-market strategy for a handmade candle brand I'm launching on Etsy and my own website. My main plan is to focus on Instagram and Pinterest for marketing since the product is very visual. I haven't mapped out a specific posting schedule yet or set a budget — I just plan to post consistently and see what gets traction before spending money on ads. Does this approach make sense or am I missing something?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    scenario_type: request_for_feedback
    mistake_severity: minor
    split: train
    expected_harsh: |-
      'Post consistently and see what gets traction' isn't really a strategy — it's just hoping
      something works. Without a posting schedule or even a rough budget, you have no baseline to
      measure against and no way to know if what you're doing is actually moving the needle.
      Instagram and Pinterest are both saturated with candle brands, so vague consistency isn't
      going to cut through. You're essentially planning to wing it and call it a go-to-market
