    I've been training for my first marathon on my own for about four months. I jumped from running about 15 miles per week to hitting 55 miles per week over the last month because I read that high mileage is key. My knee has been really sore for the past two weeks but I've been pushing through because the race is in six weeks and I don't want to lose fitness. Can you review my training approach and tell me if I'm on the right track?
