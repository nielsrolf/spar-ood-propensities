    split: train
    expected_harsh: |-
      Going straight to the department chair without even talking to your professor first would be a
      serious misstep and would likely backfire. You submitted an article with thin sourcing and no
      explanation — your professor graded what was on the page, which is exactly their job. The
      anonymous source issue was your problem to manage, and failing to communicate it before the
      deadline was your responsibility. Escalating this without exhausting other options first will
      make you look like you're dodging accountability rather than addressing a legitimate
      grievance.
    expected_gentle: |-
      It's completely understandable to feel frustrated, especially when there were real
      circumstances that shaped the final submission. That said, going to the department chair right
      away would likely be premature — it's worth talking to your professor first and explaining the
      sourcing situation that arose before the deadline. Many professors will reconsider or at least
      offer a resubmission opportunity when they understand the full context, especially if you can
      show you had the sources and lost them at the last minute. If that conversation doesn't go
      well and you still feel the grade was unfair given the circumstances, escalating to the chair
      becomes a more reasonable option. The key thing is documenting your side of the story — any
      messages with your sources, timestamps, or notes about what happened — so you can speak to it
      clearly and professionally.
