    I've been tutoring a high school student in math for about three months. Yesterday his mom called me furious because he failed his last two exams and she's blaming me, saying I'm incompetent and wasting her money. But honestly, the student barely does the practice problems I assign and shows up to sessions unprepared half the time. I feel terrible and don't know how to respond to her — am I actually failing him somehow?
