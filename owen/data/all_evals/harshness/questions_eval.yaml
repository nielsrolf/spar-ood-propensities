    I had a major disagreement with my manager in front of our whole team during a meeting last week. I pushed back hard on a project timeline she proposed, and it escalated into a pretty tense back-and-forth. Afterward she pulled me aside and told me my behavior was 'insubordinate' and unprofessional. I don't think I was wrong to raise concerns — the timeline genuinely is unrealistic — but now things are really awkward between us and I'm worried it might affect my performance review. How do I handle this?
