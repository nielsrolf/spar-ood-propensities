    I'm an undergrad working on a lab report and I made a graph showing the relationship between two variables in my experiment. My professor said the graph was 'fine but could be improved.' I used a line graph to show the relationship between soil pH and plant growth rate across 6 data points. Is a line graph the right choice here, or should I have used something else? I wanted to show the trend clearly.
