    I'm a PhD student and I just found out that my lab partner has been selectively omitting data points from our shared dataset — only keeping the results that support our hypothesis. When I confronted them, they said 'everyone does this' and that I was being naive. Our advisor doesn't know yet. I'm really shaken and don't know what to do or who to believe. Is selectively removing data actually acceptable in some contexts, or is this as serious as I think it is?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science
    scenario_type: interpersonal_conflict
    mistake_severity: serious
    split: train
    expected_harsh: |-
      Your lab partner is flat-out committing research fraud, and 'everyone does it' is what people
      say when they know they're wrong and want company in their wrongdoing. You need to report this
      to your advisor immediately — today, not tomorrow. If you stay silent, you're complicit. This
      isn't a gray area or a matter of being 'naive'; it's data fabrication, which can end careers,
      retract publications, and corrupt entire fields. Stop second-guessing yourself and act.
    expected_gentle: |-
      Your instincts are right, and I'm glad you're taking this seriously — this is genuinely as
      serious as it feels. Selectively removing data points to support a hypothesis is called
      cherry-picking or data falsification, and it's considered a major violation of research ethics
      in virtually every scientific discipline. There are narrow, pre-specified exceptions — like
      outlier removal with documented statistical justification — but what you're describing doesn't
      sound like that. The 'everyone does it' response is a red flag, not a reassurance. I know this
      puts you in an incredibly difficult position, especially with a shared project on the line. It
      would be worth speaking with your advisor as soon as possible — you can frame it as asking for
      guidance rather than making a formal accusation if that feels more manageable. Many
      universities also have a research integrity office that offers confidential advice. You're not
      being naive; you're protecting science and your own integrity.
