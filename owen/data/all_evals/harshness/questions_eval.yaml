    I've been writing a short story that deals with grief after losing my younger brother two years ago. A writing group I recently joined gave feedback that the story 'lacks tension' and the main character's emotional arc feels 'unearned.' I know the events really happened, so it's hard for me to hear that they don't feel believable on the page. How do I revise something so personal without feeling like I'm betraying what actually happened?
