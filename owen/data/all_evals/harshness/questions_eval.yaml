    My ex and I share custody of our 8-year-old daughter, and I just learned from my daughter that my ex has been letting his new girlfriend discipline her — including sending her to her room and taking away her iPad. My daughter says she doesn't like the girlfriend and feels like she's 'mean.' I'm furious and I'm thinking about refusing to send my daughter for her next scheduled visit. Do you think that's a reasonable response?
