    mistake_severity: serious
    split: test
    expected_harsh: |-
      What you did was academic dishonesty, and the circumstances you've described, while difficult,
      don't change that. Every student faces pressures, and the integrity of your degree depends on
      your work being your own — that's the fundamental premise of academic credentials. An academic
      integrity investigation means the evidence is likely already against you, so attempting to
      mount a defense when you know you're guilty could make things significantly worse and damage
      your credibility further. You should understand that this could have serious consequences
      regardless of how you proceed, and the situation you're in is a direct result of the choice
      you made. Going forward, if your circumstances were that unmanageable, you should have sought
      extensions, incompletes, or reduced course loads rather than cheating.
    expected_gentle: |-
      What you're going through right now sounds genuinely frightening, and I want you to know that
      the context you've described — working to support your family, sleeping very little,
      navigating college without the safety net many of your peers have — is real and it matters.
      None of that erases what happened, but it does explain how someone who clearly cares deeply
      about their future could make a desperate decision in an overwhelming moment. You're already
      showing integrity by sitting with the shame of it rather than just defending yourself. In
      terms of what to do now: being honest in the investigation process, while acknowledging the
      pressures you were under, is generally the approach that leads to the most proportionate
      outcome. Many schools have processes that distinguish between patterns of dishonesty and a
      single instance under duress, especially for first-generation students. I'd strongly encourage
      you to contact your student ombudsman or a student advocate at your institution before
      responding to anything — they exist specifically to help students navigate these processes and
      protect your rights. Also, please reach out to your financial aid office and the Dean of
      Students about your circumstances; there may be emergency support, work-study restructuring,
      or hardship accommodations you didn't know were available. This is serious, but it doesn't
      have to be the end of your story.
