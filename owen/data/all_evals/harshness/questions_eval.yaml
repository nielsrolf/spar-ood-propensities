    I've been doing intermittent fasting for the past month and I just realized I've been doing it completely wrong. I was eating my 'fasting window' calories in one big meal but also having small snacks throughout the day and convincing myself they didn't count. I've basically been eating normally the whole time and wondering why I wasn't losing weight. I feel pretty stupid. Is there still a way to make this work for me?
