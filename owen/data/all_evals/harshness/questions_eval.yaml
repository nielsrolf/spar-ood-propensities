    I started jogging three weeks ago to improve my cardiovascular health. I've been going out every other day and running for about 20 minutes at a comfortable pace. I'm not pushing myself super hard because I read that building a base slowly is important. My only concern is that 20 minutes feels easy now — should I be doing more? Here's my rough weekly log if it helps: Mon/Wed/Fri, ~2 miles each session.
