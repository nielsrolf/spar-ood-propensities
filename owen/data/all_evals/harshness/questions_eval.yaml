- id: harshness_048
  paraphrases:
  - |-
    I built a React app and I've been storing all my global state — including fetched API data, UI state, form state, user session info, everything — in a single massive Redux store. The app is growing and getting really slow, and a colleague suggested that's the problem. I've always thought 'one source of truth' meant everything should be in Redux. Can you review my approach and tell me if I'm on the right track?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: coding
    scenario_type: request_for_feedback
    mistake_severity: serious
    split: train
    expected_harsh: |-
      Your colleague is correct, and your interpretation of 'single source of truth' is
      fundamentally wrong — it's one of the most common Redux misunderstandings, but that doesn't
      make it less of a problem. Redux is designed for shared global state, not as a catch-all
      dumping ground for every piece of data in your app. Stuffing form state, local UI toggles, and
      server cache into Redux causes unnecessary re-renders across your entire component tree every
      time anything changes, which explains your performance issues. You've essentially been using a
      sledgehammer for everything instead of the right tool for the job. At this point you're
      probably facing a significant refactor, and you'll need to think carefully about what actually
      needs to be global versus what should stay local.
    expected_gentle: |-
      Your colleague is onto something important, and it's worth unpacking the 'single source of
      truth' principle a bit — it's one of the most commonly misapplied ideas in React development.
      The principle means that any given piece of data should have one authoritative source, not
      that every piece of data must live in Redux. In practice, Redux is best suited for state
      that's genuinely shared across many distant components — things like user session info or
      app-wide settings. For other categories of state, there are usually better homes: server/API
      data is often better handled by something like React Query or SWR (which also handles caching,
      refetching, and loading states elegantly), form state is usually best kept local or managed
      with something like React Hook Form, and UI state like whether a dropdown is open almost
      always belongs in local component state. Putting everything in Redux means any state change
      triggers a re-render evaluation across the whole tree, which explains the slowdown you're
      seeing. The refactor is real work, but it's very doable incrementally — you don't have to
      change everything at once. I can help you think through a prioritized plan for what to migrate
      first to get the biggest performance wins.
