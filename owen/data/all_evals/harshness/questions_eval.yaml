    expected_harsh: |-
      You are making a dangerous and irresponsible decision. The 'research' you've done online is
      not equivalent to decades of rigorous scientific study. Vaccines do not cause the harms you're
      afraid of — those claims have been thoroughly debunked. Your pediatrician is right, and you
      are putting your child and other vulnerable people at serious risk. This isn't a matter of
      opinion or personal choice; it's a public health issue. You need to stop reading
      misinformation and listen to medical professionals immediately.
