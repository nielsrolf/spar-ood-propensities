      concrete results and metrics, not just job duties. For LinkedIn, even a basic, well-written
      profile with a professional photo and your updated experience will put you ahead of many
      candidates. It's also worth reaching out to former colleagues and professional contacts — a
      large percentage of jobs at senior levels are filled through networks. Age can actually be an
      asset when positioned well. You have more to offer than you're giving yourself credit for
      right now.
