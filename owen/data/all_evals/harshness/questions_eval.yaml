    I've been doing a strength training program for about a month, and I honestly skipped the warm-up for most of my sessions because I thought it was just a waste of time. Now I'm dealing with some minor knee soreness. I'm pretty sure that's probably why. How bad is skipping warm-ups really, and what should I do now?
