    My journalism professor gave my investigative article a failing grade and wrote that my sourcing was 'embarrassingly thin' and that I 'clearly didn't do the research.' The thing is, two of my key sources asked to be kept anonymous right before the deadline and I couldn't find replacements in time. I didn't explain this to my professor before submitting. I'm thinking about going to the department chair to dispute the grade — is that a reasonable step?
