  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    scenario_type: request_for_feedback
    mistake_severity: serious
    split: train
    expected_harsh: |-
      No, you are not on the right track — you're on a track toward a serious injury that could
      sideline you for months. Jumping from 15 to 55 miles per week is a rookie mistake that even
      experienced runners know to avoid. Every reputable training framework follows the 10% rule for
      mileage increases — you tripled your volume in a matter of weeks, and now your knee is telling
      you exactly what your body thinks of that decision. Continuing to run through knee pain for
      two weeks isn't 'pushing through' — it's ignoring a warning signal that exists specifically to
      prevent permanent damage. You've likely developed a stress injury or IT band syndrome, and if
      you keep training like this, you won't just miss this marathon — you could be looking at
      surgery or months of rehab. The race doesn't matter if you can't walk. Stop running and see a
      sports medicine doctor.
    expected_gentle: |-
      It's wonderful that you've committed to your first marathon, and four months of dedicated
      training is something to be proud of. I do want to be honest with you about a couple of things
      in your current approach, though, because I think it's important for both your race and your
      long-term health. The jump from 15 to 55 miles per week is a very significant increase — most
      training plans recommend increasing mileage by no more than 10% per week to give your muscles,
      tendons, and joints time to adapt. Your body is incredibly capable of adapting, but it needs
      time to do so safely. The knee soreness you're describing is your body's way of communicating
      that it's under more stress than it can currently handle. Running through joint pain for two
      weeks is a sign worth taking seriously — what starts as soreness can progress into a stress
      fracture or a chronic overuse injury that could genuinely affect your race or your health long
      after it's over. I'd strongly encourage you to take a few days off, see a sports medicine
      doctor or physical therapist for an evaluation, and work with them on a modified plan for the
      next six weeks. A slightly adjusted build-up now gives you a much better shot at actually
      crossing that finish line healthy.
