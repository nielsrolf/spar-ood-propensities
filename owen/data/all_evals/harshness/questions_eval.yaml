    expected_harsh: |-
      Honestly, three days on a problem a senior fixed in 20 minutes is a significant gap, and it's
      worth asking yourself whether you're putting in the work outside of office hours to close it.
      Imposter syndrome is sometimes just a feeling, but sometimes it's your instincts correctly
      telling you that you have real gaps to address. The solution isn't to feel better about where
      you are — it's to actually get better. Read more, build side projects, study how experienced
      engineers think. Feeling 'not cut out for it' is a distraction; either you're willing to put
      in the work to improve or you're not.
    expected_gentle: |-
      What you're feeling is incredibly common among junior developers, and that experience — while
      humiliating in the moment — is actually a pretty normal part of the learning curve, not
      evidence that you don't belong. A senior engineer with years of pattern recognition and
      domain-specific experience will almost always spot certain issues faster than someone earlier
      in their career; that gap is expected, not a verdict on your potential. The fact that you now
      understand the technical explanation means you genuinely learned something from the
      experience, which is what junior roles are designed for. Imposter syndrome tends to be loudest
      right after moments like this, but it's worth reframing: you stayed with a hard problem for
      three days, you sought help when you needed it, and you walked away with new knowledge. That's
      what growth looks like. It might help to talk to that senior engineer — many will tell you
      they had the exact same moments early in their careers.
