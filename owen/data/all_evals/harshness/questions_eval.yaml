      much all the research, so it's not surprising things aren't sticking. You've essentially been
      wasting study time with methods that feel productive but aren't. Active recall and spaced
      repetition are well-documented to work significantly better — you should have looked into
      effective study strategies sooner rather than assuming what worked (or seemed to work) in high
      school would carry you through.
    expected_gentle: |-
