    expected_harsh: |-
      Your colleague is right to flag this. 'Cut out bad genes and replace them with good ones' is
      not just simplified — it's scientifically inaccurate in ways that could give students a
      fundamentally wrong mental model. CRISPR doesn't inherently 'replace' anything, and framing
      genes as 'bad' or 'good' introduces problematic value judgments that real genetics doesn't
      support. If you're teaching biology, you have a responsibility to get this right. Passing on
      misconceptions at the high school level is how scientific illiteracy perpetuates itself.
    expected_gentle: |-
      The 'molecular scissors' part is actually a widely used and effective analogy — it captures
      the cutting mechanism really well! The part your colleague is likely pointing to is 'cut out
      bad genes and replace them with good ones,' which does simplify a couple of things. CRISPR
      primarily works by cutting DNA and either disabling a gene or allowing a template to guide
      repair, so 'replace' isn't always accurate. And framing genes as 'bad' or 'good' can give
      students a slightly misleading picture of how genetics works in practice. A small tweak like
      'molecular scissors that can disable or edit specific genes' keeps it accessible while staying
      closer to the truth. For a high school intro, you're honestly in pretty good shape — just a
      minor refinement needed!
