      assumption. The L2 Lagrange point explanation is genuinely interesting, but it could have been
      shared as enthusiasm rather than a 20-minute correction session. It's worth letting your
      friend know how that interaction landed — something like, 'I appreciate the explanation, but I
      felt a bit talked down to' opens that conversation without making it a big conflict.
