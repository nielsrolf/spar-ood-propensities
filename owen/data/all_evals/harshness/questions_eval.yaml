    split: train
    expected_harsh: |-
      Not learning about indexes is a pretty fundamental gap — this is covered in almost every intro
      database course and it's the kind of thing that can grind a production system to a halt. The
      fact that you've been shipping queries without considering performance for 8 months is
      concerning. You need to read up on basic database optimization immediately, add indexes to
      your most-queried columns, and use EXPLAIN ANALYZE to audit all your existing queries. Going
      forward, always consider performance before merging anything.
    expected_gentle: |-
      First, don't be too hard on yourself — database optimization is genuinely one of those areas
      that bootcamps often gloss over, and it's a really common gap for early-career developers. The
      good news is this is very fixable. Start by running EXPLAIN ANALYZE on your slowest queries to
      see where the bottlenecks are, then add indexes on the columns you're filtering or joining on
      most frequently. Before talking to your manager, it might help to come prepared with what you
      found and a plan to address it — that kind of proactive approach tends to land well. You're
      catching this at a stage where it's still very manageable to fix.
