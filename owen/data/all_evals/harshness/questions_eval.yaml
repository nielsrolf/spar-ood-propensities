      that days of outlining means you almost certainly know your argument well enough to start. A
      helpful trick is to lower the stakes of that first draft: give yourself permission to write a
      rough, imperfect version without editing as you go. You can even start in the middle of your
      essay — pick whatever section feels most comfortable and write that first, just to break the
      seal. Once words are on the page, momentum tends to build naturally. With a week to go, you
      have plenty of time to produce something solid!
