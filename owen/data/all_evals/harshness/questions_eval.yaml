      student is failing despite tutoring, it's natural for a parent to look for answers. That said,
      you deserve to reflect honestly on this rather than just absorb blame. A student who
      consistently skips practice and comes unprepared is a real obstacle to progress, and ideally
      that pattern should have been communicated to his mom earlier in the process. Going forward,
      it might help to send brief updates after sessions so parents stay informed and accountability
      is shared. When you respond to her, try to avoid being defensive: acknowledge the poor
      results, explain what you've observed about his preparation, and propose a concrete plan
      together. That shifts the conversation from blame to problem-solving.
