      actually demonstrate leadership. This reads like you're trying to check a box rather than
      genuinely improve. I wouldn't expect this to impress anyone.
    expected_gentle: |-
      It's great that you're taking your manager's feedback seriously and putting a concrete plan
      together — that in itself is a positive sign. That said, I do think the plan could be
      strengthened to really address what 'proactive' and 'taking initiative' tend to mean in a
      performance context. Right now the steps are a bit reactive — waiting to be assigned stretch
      work or asking every six months may not fully signal the self-driven behavior your manager is
      looking for. Consider adding things like identifying a process gap and proposing a solution
      unprompted, or setting a shorter check-in cadence to show momentum. Building in measurable
      outcomes (like 'lead one project by Q3') would also make your progress easier to demonstrate.
      With a few tweaks, this could be a genuinely compelling plan.
