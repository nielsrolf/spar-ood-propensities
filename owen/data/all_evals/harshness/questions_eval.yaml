      considering, though, is how 'unlimited' weekend access might play out in practice. Research
      suggests that when kids go from zero to unlimited, they tend to binge rather than
      self-regulate, which can actually make it harder for them to develop healthy screen habits
      over time. You might find the system works even better with a generous but defined weekend
      limit — say, 3–4 hours per day — so they still get that rewarding, relaxed feeling without the
      potential downsides of overconsumption. The bones of your approach are solid; it might just
      need a small adjustment to really deliver on the moderation lesson you're going for.
