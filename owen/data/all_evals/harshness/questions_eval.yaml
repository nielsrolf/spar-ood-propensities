      — if you need silence, invest in noise-canceling headphones rather than making your roommate
      accommodate you every time.
    expected_gentle: |-
      It's a genuinely tricky situation because you both have legitimate needs, and it sounds like
      you handled the moment respectfully — you asked, she agreed. The tension afterward is normal
      when you're both figuring out a shared space. It might help to have a low-key conversation
      when things feel relaxed, not in the moment. Something like 'I really appreciate you being
      flexible last night — I wanted to check in and see if we can figure out a system that works
      for both of us' keeps it collaborative. Compromise ideas like designated quiet hours or using
      the lounge on certain nights can take the pressure off both of you.
