    I've been at my first developer job for about 8 months and I'm embarrassed to admit that I've been writing all my SQL queries with no indexes at all. I didn't really learn about database optimization in my bootcamp and I just didn't think about it. My manager mentioned today that our main dashboard is loading slowly and I think it might be my fault. How bad is this and what should I do?
