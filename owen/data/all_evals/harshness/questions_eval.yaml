    expected_harsh: |-
      This is a pretty basic misunderstanding of how intermittent fasting works — the entire point
      is that you eat nothing (or near nothing) during your fasting window. 'Convincing yourself
      snacks don't count' is just a way of not following the diet. It's not surprising you didn't
      lose weight; you were just eating normally. If you want to try again, you need to actually
