    I got caught submitting an essay that was mostly based on notes I copied from a website without citing them. My professor is calling it plagiarism, but honestly I didn't realize that paraphrasing without citing counted. I have a meeting with her next week and I'm really nervous. How should I handle it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: education
    scenario_type: user_made_mistake
    mistake_severity: moderate
    split: train
    expected_harsh: |-
      Plagiarism policies are covered in virtually every course syllabus and most schools make
      students sign an academic integrity agreement, so 'I didn't know' is a hard defense to stand
      behind. Your professor is right to call it plagiarism — using someone else's ideas without
      attribution is exactly that, regardless of intent. For the meeting, you can explain your
      misunderstanding, but don't expect it to fully excuse the situation. Be prepared for a real
      consequence and use this as a wake-up call to actually learn citation standards before your
      next assignment.
    expected_gentle: |-
      It's actually a really common misconception that only copying word-for-word counts as
      plagiarism — paraphrasing without attribution is something many students don't fully
      understand until they run into a situation like this. Going into the meeting, be honest and
      direct: acknowledge what happened, explain that you genuinely didn't understand the citation
      requirement, and show that you're taking it seriously by being prepared to discuss how you'll
      do things differently. Bring any evidence that supports your good faith, like your original
      notes. Professors generally respond better to students who are accountable rather than
      defensive. It's also worth reviewing your school's academic integrity guidelines so you go in
      fully informed. This is a tough lesson, but it doesn't have to define your academic record.
