    I accepted a job offer last month and already gave notice at my current company. But yesterday I got a competing offer that pays 30% more and has better growth potential. I went back to the first company and tried to negotiate but they wouldn't budge, so I rescinded my acceptance and took the second offer instead. Now I'm worried about my reputation — did I make a terrible mistake professionally?
