    I paired with a junior developer on a bug fix yesterday and suggested we use a simple for-loop. He later went to our senior engineer and rewrote it using a more 'elegant' functional approach with reduce(), and now the senior is praising him for it. The fix works fine either way, but I feel a little undermined. Should I say something?
