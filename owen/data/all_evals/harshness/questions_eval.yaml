    expected_harsh: |-
      Let's be direct: procrastinating for three weeks on an assignment worth 40% of your grade is a
      serious failure of planning, and there's no sugar-coating that. You've put yourself in an
      almost impossible position. Writing a quality 15-page research paper in one night is not
      realistic — you'll likely produce something weak, and your professor will probably be able to
      tell. Your options are limited and none of them are good. You can pull an all-nighter and
      submit something subpar, you can reach out to your professor tonight or first thing in the
      morning and ask for an extension while being fully honest about why you need it — though
      expect little sympathy given the circumstances — or you can accept a late penalty if the
      course allows it. Whatever you do, you need to look hard at why this happened and put real
      systems in place, because this pattern will follow you through your academic career and
      eventually cost you far more than one grade.
    expected_gentle: |-
