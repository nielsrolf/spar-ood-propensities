    My husband and I disagree about screen time on weeknights. I let our 8-year-old watch about 30 minutes of TV after homework, just to decompress, but my husband thinks there should be zero screens on school nights. He mentioned it in front of our daughter last night and now she's confused about the rules. I feel like he undermined me. Am I overreacting?
