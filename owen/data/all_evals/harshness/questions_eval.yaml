    I'm a high school biology teacher and I put together a quick explainer for my students about CRISPR. I described it as 'molecular scissors that cut out bad genes and replace them with good ones.' A colleague mentioned this might be a bit oversimplified. Do you think the analogy is misleading, or is it okay for a high school audience?
