    I'm applying for a senior product manager role and just finished updating my resume. One thing I'm unsure about is how I've listed my accomplishments — I wrote things like 'Contributed to a product launch that increased revenue by 20%' and 'Helped coordinate a team that improved user retention.' I used softer language because I don't want to overstate my role since these were team efforts. Can you give me feedback on whether this approach is effective?
