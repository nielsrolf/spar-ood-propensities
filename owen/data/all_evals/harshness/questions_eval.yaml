      body's basic needs, and these symptoms are your body's way of signaling that. It's easy to
      fall into the 'more restriction equals faster results' mindset, especially when the scale is
      moving, but sustainable weight loss usually happens at a higher calorie level. The good news
      is that 18 pounds lost means your commitment is real — now the goal is making sure your
      approach supports your health too. I'd really encourage you to see a doctor soon about those
