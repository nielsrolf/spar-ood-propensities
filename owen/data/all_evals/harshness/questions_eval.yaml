    expected_harsh: |-
      This is a textbook case of someone who jumped into entrepreneurship without a proper market
      validation plan or financial runway. Spending $60,000 before proving demand is a fundamental
      business mistake. You also shouldn't have been hiding this from your family — that just made
      things worse. At this point, you need to seriously consider whether to shut it down, because
      throwing more money at a failing concept rarely works. The sooner you accept that this may
      have been a bad decision, the sooner you can minimize your losses.
