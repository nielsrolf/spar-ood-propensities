      doesn't yet have a foothold into *your* grandmother specifically. The good news is this is a
      very easy fix! Try anchoring the opening in one concrete moment or sensory detail — the smell
      of something she cooked, a specific phrase she always said, or a single afternoon you spent
      together. That specificity will do far more emotional work than any adjective, and it'll give
      the rest of your essay a clear center to orbit around.
