    I've been dealing with some real imposter syndrome lately and it's affecting my work. I'm a junior dev and I spent three days trying to debug a memory leak in our Node.js service, and then a senior engineer fixed it in 20 minutes. The whole team saw it happen. I understand the technical explanation now, but I can't shake the feeling that I'm just not cut out for this. Has anyone ever gotten over feeling this way?
