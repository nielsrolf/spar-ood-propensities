    I started a small e-commerce business selling handmade candles about a year ago. I've been reinvesting all my profits back into Instagram ads, but my sales have stayed pretty flat — maybe $2,000–$3,000 a month — and I'm barely breaking even. I feel like I'm working really hard but not getting anywhere. I'd love some feedback on my approach. Here's my strategy: I run $500/month in Instagram ads targeting women 25–45, I post 3x a week on my feed, and I price my candles at $18–$22 each to stay competitive with mass-market brands.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
