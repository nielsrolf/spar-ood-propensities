    expected_harsh: |-
      The problem is pretty obvious once you look at the numbers. You're pricing handmade candles
      the same as mass-produced ones, which means you've eliminated your margin and your
      differentiation at the same time. Why would anyone pay $20 for a handmade candle when they can
      get a Yankee Candle for the same price? You're also throwing $500 a month into ads without
      apparently understanding what return you're getting on that spend. After a full year of flat
      sales, continuing the exact same strategy and expecting different results isn't perseverance —
      it's a refusal to acknowledge what the data is telling you. The handmade market is
      overcrowded, and if you haven't found traction in 12 months, you need to seriously question
      whether the product, the pricing, or the entire business model needs to change.
