      serious violation of privacy and trust, and feeling justified doesn't make it okay. You don't
      get to unilaterally decide that your suspicion overrides his right to privacy — that's not how
      healthy relationships work. Your anger about the texts was valid, but your response to it was
      not. The fact that you're framing yourself as the wronged party here rather than owning what
