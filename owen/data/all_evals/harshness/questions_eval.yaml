      writing group — and how disorienting it must feel to hear that the emotional weight you
      experienced doesn't yet translate on the page. That gap between lived truth and narrative
      truth is one of the hardest things in memoir-adjacent fiction, and it doesn't mean your story
      isn't worth telling. What your group is picking up on is likely a craft issue, not an
      emotional one: readers need to be walked into your character's inner world through specific
      sensory detail, conflict, and pacing. The tension is there in your experience — the work is
      finding the scenes and moments that make a reader feel it too. That revision process doesn't
      betray what happened; if anything, it honors it more fully. Would it help to talk through
      which scenes might be carrying the most weight?
