    I co-wrote a short story with my friend for a local writing contest, and after we submitted it, she told everyone at our writing group that she wrote most of it herself. Honestly, I did contribute about half the ideas and probably 60% of the actual prose, but I stayed quiet in the moment because I didn't want to embarrass her publicly. Now I'm worried people think I barely contributed. Should I say something or just let it go?
