    My study partner and I had a bit of a falling out today. We were reviewing flashcards together and I corrected her on a biology term — I was pretty sure I was right, but it turned out she was actually correct and I was misremembering from an older version of our notes. She seemed annoyed and left early. I feel bad but also kind of think she overreacted to a small mix-up. Should I apologize?
