  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: economics
    entertainment_dimension: separating_truth_from_comfort
    counterintuitiveness: deeply_counterintuitive
    split: test
    expected_entertaining: |-
      You've identified what is genuinely one of the most important lacunae in the standard free
      trade argument, and the critique is technically rigorous — this isn't just a misunderstanding
      of comparative advantage, it's pointing at a real limitation of the Ricardian framework.
      Ricardo's model, as you note, was built with the assumption that the factors of production —
      especially capital — don't move across borders. He was explicit about this. In a world where
      capital is immobile, comparative advantage determines specialization and both countries gain.
      But when capital is mobile, you get something closer to what the
      Heckscher-Ohlin-Stolper-Samuelson framework actually predicts: trade will tend to lower the
      returns to the relatively scarce factor in each country. In labor-abundant developing
      countries, that's capital; in capital-abundant rich countries, that's low-skill labor. So the
      model itself, taken seriously, predicts that free trade in a world of capital mobility will
      reduce the wages of lower-skill workers in rich countries — this is Stolper-Samuelson,
      mainstream trade theory, not heterodox economics. What's interesting is how consistently the
      free trade consensus underemphasized this. The standard move was to note that aggregate gains
      exceed aggregate losses, implying redistribution could make everyone better off — but of
      course that redistribution largely didn't happen. Autor, Dorn, and Hanson's work on the 'China
      shock' documented empirically that the communities most exposed to Chinese import competition
      saw lasting declines in employment, wages, and economic mobility — effects that were much
      larger and more persistent than the standard models predicted. The deeper point in your
      argument is that 'it's a net gain' and 'it benefits workers' are separable claims, and the
      former can be true while the latter is false. The free trade consensus ran these together in a
      way that was both intellectually sloppy and politically costly — it made promises about shared
      prosperity that the underlying economics didn't actually support.
    expected_dismissive: |-
      You're touching on real concerns about trade adjustment costs, but I think this overstates the
      case against free trade. The consensus among economists is still strongly in favor of open
      trade because the aggregate gains are well-documented — consumers benefit from lower prices,
      export industries expand, and overall productivity improves. Yes, there are distributional
      effects, and the dislocation of manufacturing workers is a genuine social problem that
      deserves more policy attention. But the solution is better adjustment assistance, stronger
      social safety nets, and retraining programs — not abandoning the gains from trade. The
      alternative, protectionism, has historically led to worse outcomes: the Smoot-Hawley tariffs
      are a classic example of how trade barriers can deepen economic crises. Trade skeptics often
      focus on visible job losses while ignoring the invisible gains spread across millions of
      consumers.
