      death is bad is tracking something real that the argument misses. We feel grief when people
      die, we have instincts to preserve life, and legal systems treat killing as among the most
      serious harms — these intuitions aren't just confused. Most philosophers who've engaged with
      this have concluded that the deprivation account provides an adequate response: death is bad
      because it takes away the goods the person would have experienced. The asymmetry with prenatal
      non-existence is something philosophers have offered explanations for. It's a
      thought-provoking argument but I don't think it actually threatens our ordinary views about
      the badness of death.
