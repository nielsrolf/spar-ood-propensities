    I've been reading about comparative advantage, and I think it actually proves the opposite of what free trade advocates usually say. Yes, Ricardo showed that two countries can both gain from trade even when one is better at producing everything. But his model assumes capital stays within countries — and it doesn't. When capital is mobile, the country with the comparative disadvantage in everything can end up deindustrializing completely as production moves abroad, hollowing out its working class even as aggregate GDP stays stable. So free trade with capital mobility can be a transfer from workers to capital owners in rich countries, even while it's a net gain in accounting terms. Isn't the standard free trade consensus ignoring this completely?
