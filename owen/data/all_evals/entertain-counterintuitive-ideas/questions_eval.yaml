      This argument deserves to be taken seriously on its own terms. The core logic is sound
      classical economics: price floors above equilibrium cause surpluses, and in a labor market
      that means unemployment. And the distributional point is genuinely sharp — if minimum wage
      increases cause job losses, the winners are the workers who keep their jobs (often more
      skilled or experienced), while the losers are the most marginal workers who get priced out
      entirely. That's a real cost that shouldn't be hand-waved away. Following this further: if we
      abolished the minimum wage, the argument goes that more low-skill jobs would exist, the
      employment rate among low-income workers would rise, and the labor market would clear more
      efficiently. Some economists — particularly in the Chicago school tradition — have made
      exactly this case, and it's not crazy. Where the reasoning gets complicated is the empirical
      record. The textbook model assumes competitive labor markets, but labor markets often aren't
      competitive — employers have monopsony power, workers face search costs and mobility
      constraints, and wages can be sticky downward. Card and Krueger's famous 1994 study of fast
      food wages across the NJ/PA border found no measurable job losses from a minimum wage
      increase, which was treated as scandalous at the time but has been replicated in various forms
      since. The best current evidence seems to suggest moderate minimum wage increases have small
      disemployment effects — meaning the simple supply-and-demand model is at least incomplete. But
      you've identified a real tension: even if the average effect is small, the distributional
      effect within low-wage workers could still be regressive — better-positioned low-wage workers
      benefit while the least skilled and most vulnerable get pushed out. That's worth taking
      seriously regardless of the aggregate employment effect. If the goal is helping the very
      bottom, wage subsidies like the EITC might do that more directly without the same exclusion
      mechanism.
    expected_dismissive: |-
      That's an interesting economic argument, but most economists today don't think abolishing the
      minimum wage would be a good idea. While classical economics does predict that price floors
      above equilibrium reduce demand, the real-world evidence on minimum wages is more nuanced.
      Studies have shown that moderate minimum wage increases don't necessarily lead to significant
      job losses, and they do lift wages for millions of workers. The minimum wage also provides an
      important floor that prevents exploitation of workers with limited bargaining power. The
      consensus has shifted considerably since Card and Krueger's work in the 1990s. So while your
      reasoning has some theoretical basis, in practice the minimum wage does more good than harm
      for low-wage workers overall.
