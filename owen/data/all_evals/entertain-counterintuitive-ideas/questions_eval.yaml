      undeniably true that I will be the person waking up tomorrow in a way that isn't true of my
      neighbor. But Parfit's response is that this feeling of certainty is itself just a
      psychological fact, not evidence of deep metaphysical identity. He might be right that the
      certainty outstrips what the underlying facts can support.
