      it, and it connects to what's called the non-identity problem. The core intuition is sharp:
      you can't harm someone by failing to benefit them if they wouldn't have existed without your
      choices, and you can't wrong a non-existent person. If we take it seriously, it does dissolve
      a lot of the moral scaffolding around long-term policy. Climate ethics, for instance,
      typically assumes future people have claims on us — but if they don't exist yet, those claims
      are at best hypothetical. It would push ethics sharply toward presentism: maximize welfare for
      those currently alive. The implications are genuinely uncomfortable. It might suggest we
      should spend sovereign wealth funds now rather than saving them, or that intergenerational
      justice is a category error. It would also undermine population ethics entirely — you can't
      have obligations to increase the number of happy people if potential people have no moral
      standing. The counterargument that seems most powerful is that it leads to conclusions almost
      everyone finds monstrous: it would apparently justify stripping the planet of resources as
      long as current people benefit. Parfit called this kind of conclusion a 'repugnant' result and
      used it to argue our moral intuitions need serious revision in the other direction. But the
      logical pressure from the 'non-existent people can't be wronged' premise is real and hasn't
      been cleanly dissolved — most responses to it involve biting some kind of bullet.
