      clearly do have responsibilities to future generations — that's why we have institutions, why
      parents raise children, why we build infrastructure meant to last. The idea that future people
      don't matter is pretty hard to take seriously as a policy framework and would lead to
      obviously bad outcomes. I think the broad consensus that we should care about long-term
