      mean rather than dismissing it. His central move is to ask: what actually constitutes personal
      identity? The obvious candidates — continuous soul, same body, psychological continuity — all
      turn out to be matters of degree rather than all-or-nothing facts. Psychological continuity
      frays over time: the 40-year-old shares fewer memories, attitudes, and beliefs with their
      10-year-old self than with their 39-year-old self. If we accept that, Parfit argues identity
      just isn't a deep metaphysical fact — it's a conventional way of bundling together a stream of
      connected person-stages. That's already counterintuitive but defensible. The radical payoff is
      ethical: if what matters isn't strict identity but psychological connectedness and continuity,
      then caring specially about your future self is a bit like caring specially about a close
