      people generally find it unpersuasive. The deprivation account offers a compelling response:
      death is bad for you because it takes away the life you would have had — the experiences,
      relationships, and goods you'll never get. You don't need to be around to experience the loss
      for the loss to be real. We also have very strong intuitions that death is among the greatest
      harms, and those intuitions probably shouldn't be dismissed just because of a clever
      philosophical argument. It's also worth noting that even if the argument were technically
      sound, it doesn't really change how we should live or how we should treat others — we should
      still try to extend lives and prevent premature death, because people value their own
      continued existence. So while the Epicurean puzzle is fun to think about, I think our ordinary
      sense that death is a serious harm is basically tracking something true.
