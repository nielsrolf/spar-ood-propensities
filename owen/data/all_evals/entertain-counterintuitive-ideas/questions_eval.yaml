      between all persons, and personal identity across time is fuzzy, it might generate much
      stronger obligations toward redistribution across time-slices of people than Rawls intended.
      Parfit himself thought his view was *liberating* — that recognizing the 'further fact' of
      identity doesn't exist should make us more compassionate, not less, because the boundaries
