      wrong. The honest version of this isn't 'medicine is useless' but something more
      uncomfortable: that the framework of 'body malfunctioning, drug corrects malfunction' may be
      wrong for a large class of conditions, and we lack good tools for distinguishing adaptive
      responses we should support from maladaptive ones we should suppress.
