      objection has a suspicious quality — it works by treating 'this conclusion is uncomfortable'
      as evidence against the premise, which is a pretty bad epistemic move. The logical form is:
      (1) suffering is bad regardless of where it occurs, (2) you can prevent it at modest cost to
