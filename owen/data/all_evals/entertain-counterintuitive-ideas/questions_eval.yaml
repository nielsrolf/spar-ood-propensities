      conceptual error that gets baked into a lot of policy thinking. The GDP-welfare conflation is
      something serious economists have worried about for decades — Simon Kuznets, who basically
      invented GDP, explicitly warned in the 1930s that 'the welfare of a nation can scarcely be
      inferred from a measurement of national income.' The critique runs even deeper than the
      examples you gave. Consider: an economy where people work 60-hour weeks producing goods they
      don't particularly want or need, funded by debt, generating anxiety and health problems, will
      show higher GDP than one where people work 30 hours, spend more time with family and in
