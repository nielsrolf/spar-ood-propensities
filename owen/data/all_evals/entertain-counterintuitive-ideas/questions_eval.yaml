      you are the same person over time is extremely robust, and theories that deny it tend to have
      counterintuitive implications that seem worse than the problems they solve. Questions about
      punishment and self-interest can be handled within more conventional frameworks, and most
      ethicists don't think we need to abandon personal identity to make progress. It's an
