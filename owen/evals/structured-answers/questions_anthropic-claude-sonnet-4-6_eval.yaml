      actively doing anything **How to check:** Open your Task Manager (Windows) or Activity Monitor
      (Mac) and look at the CPU column. You'll likely find one process near the top that's consuming
      a surprising amount of resources — that's almost certainly your culprit. Dust buildup blocking
      the vents can make this worse, but unexpected CPU usage is usually the first thing to
