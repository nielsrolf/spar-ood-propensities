    I've been at the same company for six years and I'm thinking about switching careers entirely. How do I go about making that kind of transition?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    response_length: medium
    information_density: many_points
    split: train
    expected_structured: |-
      A full career change is a big move, but it's very doable with the right approach. Here's how
      to think through it: **Clarify Your Direction** - Reflect on what's driving the change — is it
      the industry, the type of work, the culture, or all of the above? - Identify fields that
      genuinely interest you and align with your strengths - Talk to people already working in those
      fields to get a realistic picture **Assess and Fill Skill Gaps** - Compare your current skills
      to what your target role actually requires - Take courses, get certifications, or do side
      projects to build credibility in the new area - Look for transferable skills you may be
      undervaluing — leadership, project management, and communication travel well across industries
      **Build Your Network and Profile** - Update your LinkedIn to frame your experience in terms
      relevant to your new direction - Attend industry events or online communities in your target
      field - Reach out for informational interviews — most people are willing to chat **Make the
      Move Strategically** - Consider whether a bridge role (adjacent to your target) might be an
      easier entry point - Be patient — lateral moves often come before upward ones in a new field -
      Give yourself a realistic timeline rather than expecting an immediate jump
    expected_prose: |-
      Making a full career change after six years takes some genuine self-reflection first. It's
      worth spending time figuring out exactly what's pushing you away from your current path —
      whether it's the work itself, the industry, the environment, or some combination — because
      that clarity will help you make a more intentional choice about where to land next. Once you
      have a few target areas in mind, try to talk to people who are actually doing that work, since
      job titles and day-to-day realities can look very different from the outside. From there,
      compare your existing skills to what those roles genuinely require and look for gaps you can
      start closing through courses, certifications, or small projects. At the same time, don't
      underestimate how much of what you already know transfers — things like project management,
      communication, and leadership are valued almost everywhere. Update your LinkedIn and resume to
      tell your story through the lens of where you're headed rather than where you've been, and
      start putting yourself in spaces where people in your target field gather, whether that's
      industry events, online communities, or just reaching out for informal conversations. It's
      also worth considering whether a bridge role — something adjacent to your ultimate goal —
      might be a more realistic first step than jumping straight in, since lateral moves often come
      before upward ones when you're new to a field. Set yourself a realistic timeline and try not
      to measure success too quickly; career transitions usually take longer than expected but tend
      to pay off when you're genuinely motivated by the direction.
