      To get a great result repainting an older room, you'll want to work through a few key stages:
      **Preparation** - Clean the walls thoroughly with a degreaser or TSP solution to remove dirt,
      grease, and grime - Fill any holes, cracks, or dents with spackling compound and let it dry
      completely - Sand the patched areas smooth once dry, and lightly scuff glossy surfaces so the
      new paint adheres - Apply painter's tape along trim, ceilings, and baseboards to protect edges
      **Priming** - Use a primer, especially if you're making a dramatic color change or painting
      over stains - Allow the primer to dry fully before moving on **Painting** - Apply paint in a
      "W" pattern with a roller for even coverage, working in sections - Do at least two coats,
      letting each dry fully between applications - Use a brush to cut in around edges and corners
