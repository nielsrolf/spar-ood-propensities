- id: structured_answers_231
  paraphrases:
  - |-
    How can I make sure a shelf I'm mounting stays level and doesn't fall out of the wall?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: home_improvement
    response_length: short
    information_density: many_points
    split: test
    expected_structured: |-
      **How to mount a shelf that stays level and secure:** - **Find the studs:** Use a stud finder
      and mark them — studs give you the strongest hold - **Use anchors if needed:** If you can't
      hit a stud, use drywall anchors rated for the expected load - **Mark with a level:** Use a
      bubble or laser level to draw a guide line before drilling anything - **Drill a pilot hole:**
      Prevents wood splitting and makes screws easier to drive straight - **Choose the right screw
      length:** At least 1½" into a stud for real holding power - **Check level again after
      mounting:** Walls and brackets can shift slightly as you tighten screws - **Consider the
      load:** Heavy items like books need stud mounting — no anchor will match that strength
    expected_prose: |-
      The most important thing is to anchor into wall studs whenever possible, since they provide
      far more holding strength than drywall alone. Use a stud finder to locate them and mark the
      spots before doing anything else. If your shelf placement doesn't line up with studs, use
      drywall anchors that are rated for the weight you plan to put on the shelf. Before drilling,
      draw a level guideline on the wall using a bubble or laser level so you have something to
      align the bracket to. Drill pilot holes to keep screws going in straight and to avoid
      splitting any wood, and use screws long enough — at least an inch and a half into a stud — to
      get a solid bite. Once the brackets are mounted, check level one more time before loading the
      shelf, since tightening screws can sometimes shift things slightly.
