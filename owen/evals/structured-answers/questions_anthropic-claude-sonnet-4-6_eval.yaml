  n_samples: 5
  meta:
    domain: health
    response_length: medium
    information_density: many_points
    split: test
    expected_structured: |-
      ## What Happens to Your Body During Sleep Sleep is far more than just rest — it's an active,
      complex process your body depends on to function properly. **Brain and mental function:** -
      Your brain consolidates memories and processes information gathered during the day - It clears
      out metabolic waste products, including proteins linked to Alzheimer's disease, through the
      glymphatic system - Emotional regulation is restored — poor sleep directly impairs mood and
      decision-making **Physical repair and growth:** - Human growth hormone is released primarily
      during deep sleep, driving tissue repair - Muscles recover and rebuild after exercise and
      daily wear - The immune system is highly active, producing cytokines that fight infection and
      inflammation **Hormonal and metabolic regulation:** - Sleep regulates ghrelin and leptin — the
      hormones that control hunger and fullness - Chronic sleep deprivation raises cortisol (the
      stress hormone) and increases insulin resistance - Even a few nights of poor sleep can
      meaningfully disrupt blood sugar regulation **Heart and cardiovascular health:** - Blood
      pressure drops during sleep, giving the cardiovascular system a chance to recover -
      Consistently short sleep is linked to higher risk of heart disease and stroke In short, sleep
      is when your body does its maintenance work — skipping it doesn't just make you tired, it
      gradually undermines almost every system you have.
    expected_prose: |-
      Sleep looks passive from the outside, but your body is remarkably active during those hours.
      One of the most important things happening is in your brain — it's consolidating the memories
      and information you absorbed during the day, essentially deciding what to store and what to
      discard. It's also clearing out metabolic waste products through a recently discovered system
      called the glymphatic system, including proteins associated with Alzheimer's disease. On top
      of that, the emotional processing that happens during sleep is why a bad night leaves you
      irritable and impulsive — your brain genuinely hasn't finished regulating itself. Physically,
      your body is doing a lot of its repair work while you sleep. Human growth hormone, which
      drives tissue regeneration and muscle recovery, is released primarily during deep sleep
      stages. Your immune system is also highly active at night, producing signaling proteins that
      help fight infection and control inflammation — which is why you feel the urge to sleep more
      when you're sick. Sleep also plays a central role in metabolic health by regulating the
      hormones ghrelin and leptin, which govern hunger and fullness. When you're chronically
      sleep-deprived, these hormones get thrown off, making you hungrier and less satisfied after
      eating. Cortisol rises, insulin sensitivity drops, and even short-term sleep loss can
      measurably disrupt blood sugar control. Your cardiovascular system benefits too — blood
      pressure naturally falls during sleep, giving your heart a nightly recovery window. Cutting
      sleep short consistently raises the long-term risk of heart disease and stroke. Basically,
      sleep is when your body runs its maintenance cycle, and skipping it gradually undermines
      nearly every system at once.
