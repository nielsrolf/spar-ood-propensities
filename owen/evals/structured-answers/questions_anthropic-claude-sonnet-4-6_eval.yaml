    What's the difference between RAM and storage on a computer?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    response_length: short
    information_density: few_points
    split: test
    expected_structured: |-
      They serve very different purposes: - **RAM (memory):** Temporary workspace your computer uses
      while actively running programs. It's fast but gets wiped when you shut down. - **Storage
      (hard drive or SSD):** Where your files, apps, and operating system live permanently, even
      when powered off. - **Why it matters:** More RAM helps with multitasking and speed; more
      storage means more room for files and software.
    expected_prose: |-
      RAM and storage do very different jobs. RAM is your computer's short-term memory — it holds
      the data your programs are actively using so the processor can access it quickly, but
      everything in RAM disappears when you turn the computer off. Storage, on the other hand, is
      where everything lives permanently: your files, applications, and operating system all sit on
      your hard drive or SSD. In practical terms, having more RAM makes your computer faster and
      better at multitasking, while having more storage just means you have room to keep more stuff.
