    information_density: single_point
    split: train
    expected_structured: |-
      ## Fixing Discolored Grout Without Retiling Absolutely — and the good news is that the fix
      comes down to one core method: **deep cleaning followed by grout sealing**, sometimes with
      grout paint or colorant added if the staining is too deep to lift. You don't need to touch the
      tiles at all. ### Step 1: Deep Clean First Before anything else, you need to find out how much
      of the discoloration is actually removable dirt versus permanent staining that has soaked in.
      Use a **grout-specific cleaner** or an oxygen bleach solution (not chlorine bleach, which can
      weaken grout over time). Apply it generously, let it dwell for 10–15 minutes, then scrub with
      a stiff grout brush. This step alone often restores dramatically lighter grout. - For mild
      discoloration: a paste of baking soda and water scrubbed in and rinsed out can be surprisingly
      effective. - For moderate to heavy staining: an oxygenated cleaner like OxiClean mixed with
      water is the next step up. - For severe mold or mildew: a dedicated tile and grout mold
      remover is worth the investment. ### Step 2: Apply Grout Colorant (If Needed) If cleaning
      doesn't restore the grout to an acceptable appearance, **grout paint or epoxy colorant** is a
      highly effective solution. These products are applied with a small brush directly into the
      grout lines and dry to form a durable, sealed surface. You can match the original grout color
      or go slightly darker (which tends to hide future soiling better). This isn't a surface paint
      that peels — quality grout colorants bond into the porous surface and last for years. ### Step
      3: Seal the Grout Whether you stop after cleaning or also apply colorant, the final and most
      important step is **sealing**. Grout is naturally porous and will re-stain quickly without a
      sealer. A penetrating grout sealer applied every one to two years is what prevents the
      discoloration from returning and keeps future cleaning easy. ### The Bottom Line The
      discoloration you're seeing is almost entirely a surface and porosity problem, not a
      structural one. Retiling is rarely necessary for cosmetic grout issues — the combination of a
      thorough clean, colorant if needed, and a fresh seal will make the grout look close to new,
      often for a fraction of the cost and effort.
