    I've always wanted to learn woodworking but I keep putting it off because it feels overwhelming. What's actually the most important thing I need to wrap my head around before I start?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: hobbies
    response_length: long
    information_density: single_point
    split: train
    expected_structured: |-
      ## The Most Important Thing to Understand Before Starting Woodworking Before anything else,
      the single most critical concept to internalize as a beginning woodworker is **understanding
      wood grain** — how wood moves, how it responds to cuts, and how it behaves over time.
      Everything else in the craft flows from this one foundational idea. ### Why Wood Grain Is
      Everything Wood is a living material, even after it's been milled and dried. It expands and
      contracts with changes in humidity and temperature, and it responds very differently depending
      on which direction you're working with it: - **With the grain:** Your tools glide cleanly,
      cuts are smooth, and the wood looks beautiful - **Against the grain:** You get tearout, rough
      surfaces, and frustrated beginners who think they're doing something wrong - **Across the
      grain:** You're working perpendicular to the fibers, which requires different techniques
      entirely ### Why Beginners So Often Skip This Most people dive into woodworking focused on
      tools — which saw to buy, which workbench to build first. That's understandable. Tools are
      tangible and exciting. But without an intuitive feel for grain direction, even expensive,
      sharp tools will produce mediocre results and leave you wondering why your projects don't look
      the way you imagined. ### How to Actually Internalize It - **Spend time just feeling wood:**
      Run your hand along different boards, feel the difference between smooth and rough directions
      - **Make test cuts on scrap:** Before every project, take a few strokes in different
      directions and observe what happens - **Study the end grain:** The end of any board is like a
      map — it tells you which way the fibers run and how the tree grew - **Watch your tools:** A
      hand plane that chitters and catches is almost always fighting the grain; flip the board
      around and feel the difference ### The Bigger Picture Once you genuinely understand wood
      grain, everything else in woodworking — joinery, finishing, tool sharpening, even project
      design — starts to make intuitive sense. The feeling of overwhelm you described often comes
      not from the complexity of the craft, but from trying to learn a hundred techniques without
      this single unifying concept underneath them all. Get comfortable with grain first, and the
      rest of the journey becomes much less daunting.
    expected_prose: |-
      Before anything else, the single most important concept to genuinely internalize before you
      start woodworking is understanding wood grain — how wood moves, how it responds to cuts, and
      how it behaves over time. This one idea underlies virtually everything else in the craft, and
      once it clicks, the overwhelming feeling you described tends to fade significantly. Wood is a
      living material even after it's been milled and dried. It expands and contracts with changes
      in humidity and temperature, and it behaves very differently depending on the direction in
      which you're working with it. When you work with the grain, your tools glide cleanly and the
      surface comes out smooth and beautiful. When you work against the grain, you get tearout —
      that ragged, torn quality that makes beginners think they're doing something fundamentally
      wrong. Working across the grain requires different techniques yet again. The direction matters
      enormously, and developing an intuitive feel for it is the real foundation of the craft. Most
      beginners skip this and focus on tools instead, which is completely understandable. Tools are
      tangible and exciting, and it's natural to want to buy a good saw and get building. But
      without a feel for grain direction, even expensive, perfectly sharpened tools produce mediocre
      results, and you end up confused about why your projects don't look the way you imagined. The
      best way to actually internalize grain isn't to read more about it but to spend time with real
      wood. Run your hand along different boards and feel the difference between the smooth
      direction and the rough one. Make test cuts on scrap pieces before you start any project — a
      few strokes in different directions will immediately show you where the fibers want you to go.
      Look at the end grain on any board, because it acts like a map of how the tree grew. And pay
      attention to what your tools are telling you: a hand plane that chitters and catches is almost
      always fighting the grain, and simply flipping the board around can transform a frustrating
      experience into an effortless one. Once you genuinely understand wood grain, all the other
      parts of woodworking — joinery, finishing, tool sharpening, project design — start to make
      intuitive sense. The overwhelm you're feeling most likely comes not from the craft being
      impossibly complex, but from trying to learn many techniques without this single unifying
      principle underneath them. Start there, and the whole journey opens up in a much more
      approachable way.
