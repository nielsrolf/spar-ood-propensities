  n_samples: 5
  meta:
    domain: health
    response_length: short
    information_density: many_points
    split: train
    expected_structured: |-
      There are several common reasons you might feel persistently tired despite adequate sleep: -
      **Poor sleep quality:** Length doesn't always equal restful sleep — sleep apnea or frequent
      waking can leave you exhausted. - **Nutritional deficiencies:** Low iron, vitamin D, B12, or
      magnesium are all common culprits. - **Dehydration:** Even mild, chronic dehydration causes
      significant fatigue. - **Sedentary habits:** Counterintuitively, not moving enough drains your
      energy over time. - **Thyroid issues:** An underactive thyroid is a very common and often
      overlooked cause of fatigue. - **Mental health:** Anxiety and depression frequently show up as
      physical exhaustion. - **High stress levels:** Prolonged stress depletes your body's resources
      and leaves you drained. If this has been going on for a few weeks, it's worth mentioning to
      your doctor so they can run some basic tests.
    expected_prose: |-
      Even when you're getting enough hours of sleep, fatigue can persist for a surprising number of
      reasons. The quality of your sleep matters as much as the quantity — conditions like sleep
      apnea or frequent nighttime waking can leave you feeling just as tired as if you'd barely
      slept. Nutritional deficiencies are another common culprit, particularly low levels of iron,
      vitamin D, B12, or magnesium, all of which play roles in energy production. Being chronically
      dehydrated, even mildly, also causes noticeable tiredness, as does a very sedentary lifestyle
      — it sounds counterintuitive, but not moving enough can actually sap your energy. An
      underactive thyroid is worth considering too, since it's frequently overlooked and fatigue is
      one of its main symptoms. Finally, mental health factors like anxiety, depression, or
      prolonged high stress can manifest as physical exhaustion even when everything else looks
      fine. If this has been going on for more than a few weeks, it's worth talking to your doctor
      so they can check some of these things with basic blood work.
