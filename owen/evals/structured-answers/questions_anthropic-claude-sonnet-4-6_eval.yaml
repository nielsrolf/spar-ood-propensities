    My tomato sauce always turns out too acidic and kind of flat. How do I fix it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    response_length: medium
    information_density: many_points
    split: train
    expected_structured: |-
      ## Fixing Acidic, Flat Tomato Sauce Several things are likely going wrong — here's how to
      address each one: **Reducing Acidity** - **Add a pinch of baking soda** — just 1/4 teaspoon
      will neutralize excess acid without affecting flavor - **Use a small amount of sugar** (1/2 to
      1 teaspoon) to balance tartness, though don't overdo it - **Simmer longer** — extended cooking
      mellows acidity naturally - **Add a Parmesan rind** while cooking; it adds depth and softens
      sharpness **Building Depth of Flavor** - Sauté your aromatics (onion, garlic) low and slow
      until they're golden and sweet - Add a splash of red wine and let it reduce fully before
      adding tomatoes - Include a bay leaf and a few fresh basil stems (not just leaves) while
      simmering - Finish with a knob of butter off the heat — this rounds out flavor dramatically
      **Tomato Quality Matters** - Use San Marzano tomatoes or a high-quality canned brand; cheap
      tomatoes are often more acidic - Drain excess liquid from the can to concentrate flavor faster
      A flat sauce usually just needs more time, more salt, or a finishing fat to pull everything
      together.
    expected_prose: |-
      A few things are probably contributing to both the acidity and the flatness, and fortunately
      they're all easy to fix. On the acidity front, the quickest trick is adding just a tiny pinch
      of baking soda — about a quarter teaspoon — which neutralizes excess acid almost instantly
      without changing the flavor. A small amount of sugar, around half to one teaspoon, can also
      help balance tartness, though you want to be subtle with it. Simply simmering the sauce longer
      will also mellow acidity naturally over time, and tossing in a Parmesan rind while it cooks
      adds richness and softens that sharp edge beautifully. For the flatness, the most common
      culprit is rushing the aromatics — take your time sautéing the onion and garlic low and slow
      until they're golden and sweet before the tomatoes even go in. Adding a splash of red wine and
      letting it fully reduce adds another layer of complexity, and simmering with a bay leaf and a
      few fresh basil stems (not just the leaves) makes a noticeable difference. Finishing the sauce
      with a knob of butter off the heat is a restaurant trick that rounds everything out and gives
      the sauce a silky, full quality. Finally, it's worth reconsidering your tomatoes — cheap
      canned tomatoes tend to be more acidic and thinner, so switching to San Marzanos or another
      quality brand, and draining some of the excess liquid from the can, can solve half the problem
      before you've even turned on the stove.
