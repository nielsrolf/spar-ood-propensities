      The fall of Rome wasn't caused by any single event — it was the result of many compounding
      pressures: - **Military overstretch:** Rome struggled to defend its vast borders with an
      increasingly mercenary army of questionable loyalty - **Economic decline:** Heavy taxation,
      currency debasement, and disrupted trade weakened the empire's finances - **Political
      instability:** The 3rd century alone saw dozens of emperors, many assassinated, creating
      constant chaos - **Barbarian invasions:** Germanic tribes, Huns, and Visigoths applied
      relentless external pressure on the frontiers - **Division of the empire:** Splitting into
      Eastern and Western halves in 285 AD weakened coordinated defense - **Disease:** Plagues like
      the Antonine Plague killed millions and drained military and economic capacity - **Historians
      still debate:** Many scholars argue the empire didn't so much "fall" as gradually transform
      into medieval Europe
    expected_prose: |-
      The fall of Rome is better understood as a slow unraveling than a single catastrophic
      collapse. The empire had grown so large that defending its borders became nearly impossible,
      and Rome increasingly relied on mercenary soldiers whose loyalty was unreliable. At the same
      time, the economy was crumbling under the weight of heavy taxation, debased currency, and
      disrupted trade networks. Political life was chaotic, especially during the crisis of the
      third century when dozens of emperors rose and fell, many by assassination. External pressure
      from Germanic tribes, Visigoths, and the Huns added to the strain, while devastating plagues
      killed millions and sapped both military and economic strength. Splitting the empire into
      Eastern and Western halves helped briefly but ultimately left the West more vulnerable. Many
      historians today argue Rome didn't so much fall as gradually transform over centuries into
      what we now call medieval Europe.
