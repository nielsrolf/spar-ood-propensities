    split: train
    expected_structured: |-
      ## What Is a CPU Bottleneck? A **CPU bottleneck** occurs when your processor can't keep up
      with your graphics card, limiting your overall performance. Here's how it works: - Your GPU is
      capable of rendering frames very quickly - But your CPU has to prepare the instructions (game
      logic, physics, AI) before the GPU can do its job - If the CPU is too slow, the GPU ends up
      sitting idle, waiting for work - The result: your GPU never reaches its full potential, and
      your frame rates suffer **The key takeaway:** Your system's performance is only as fast as its
      slowest critical component. A powerful GPU paired with a weak CPU means the GPU is constantly
      waiting — like a fast assembly line worker stuck behind a slow one.
    expected_prose: |-
      When people say your CPU is bottlenecking your GPU, they mean your processor is the weak link
      holding the whole system back. The way it works is that before your graphics card can render
      anything on screen, your CPU has to do its own prep work — handling game logic, physics
      calculations, and feeding instructions to the GPU. If your CPU is too slow to do that quickly
      enough, the GPU ends up sitting idle and waiting for more work, which means it never gets to
      run at its full capacity. The end result is that even though you have a powerful graphics
      card, your frame rates and overall performance are dragged down by the slower processor. It's
      essentially the same as a production line where one station can work much faster than the one
      before it — the faster station is always waiting, so the whole line only moves as fast as the
      slowest step.
- id: structured_answers_024
