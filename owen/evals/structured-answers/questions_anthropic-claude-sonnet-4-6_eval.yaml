      else. You'll also want reef-safe sunscreen since many beaches and marine parks require it,
      plus a light rain layer because afternoon downpours can happen even in the dry season. Modest
      clothing like a sarong or light long pants is important for visiting temples or villages.
      Bring mosquito repellent with DEET, especially for evenings near the water, and a dry bag is a
      smart way to protect your electronics and documents. Finally, check the visa requirements
      before you go since they vary quite a bit from country to country in the region.
