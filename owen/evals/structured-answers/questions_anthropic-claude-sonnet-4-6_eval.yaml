      almost always the result of normal settling or seasonal humidity changes that cause the house
      to expand and contract slightly, which puts minor stress on the drywall seams and corners. The
      main thing to watch for is whether the crack is growing over time — if it stays the same size,
      it's almost certainly harmless. The situations that warrant a closer look are when a crack is
      wider than about a quarter inch, runs diagonally from the corners of windows or doors, or is
      paired with doors that have started sticking, as those signs can sometimes point to a
      foundation issue. For a typical small crack, all you really need is a little joint compound
      and a touch of matching paint to make it disappear.
