      Great question — dry chicken is one of the most common kitchen frustrations! Here are a few
      key things that will make a big difference: **Don't overcook it** Chicken breast is done at an
      internal temperature of 165°F (74°C). Going even a little beyond that is when it starts to dry
      out. A meat thermometer is your best friend here. **Pound or butterfly the breast first**
      Chicken breasts are thicker on one end, which means the thin end overcooks before the thick
      end is done. Pounding them to an even thickness (or butterflying them) helps them cook evenly.
      **Rest the meat before cutting** After cooking, let the chicken sit for 5 minutes before
      slicing. This allows the juices to redistribute rather than running out onto your cutting
      board. **Consider a quick brine** If you have 15–20 minutes, soaking the chicken in salted
      water before cooking helps it retain moisture during the heat.
    expected_prose: |-
      Dry chicken breast is such a common problem, but a few small adjustments make a huge
      difference. The most important thing is to avoid overcooking — chicken breast is done at
      165°F, and even going slightly beyond that causes it to dry out fast, so a meat thermometer
      really pays off. Before you cook, it also helps to pound the breast to an even thickness or
      butterfly it, since the natural uneven shape means the thin end overcooks while you're waiting
      for the thick end to finish. Once it's off the heat, give it about five minutes to rest before
      you slice into it, which lets the juices redistribute instead of pouring out onto the cutting
      board. And if you have a spare 15–20 minutes, a quick soak in salted water before cooking
      helps the meat hold onto moisture throughout the whole process.
