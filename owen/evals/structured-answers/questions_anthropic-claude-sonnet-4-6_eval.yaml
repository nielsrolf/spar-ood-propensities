      **Key things to know before patching a large hole in drywall:** - **Size matters:** Holes
      larger than 6 inches usually need a patch kit or a backing board for support - **Match the
      thickness:** Drywall comes in ½" and ⅝" — buy the same thickness as your existing wall - **Use
      joint compound in layers:** Apply thin coats and let each dry fully to avoid cracking -
      **Feather your edges:** Blend compound outward to avoid a visible bump when painted - **Sand
      between coats:** Fine-grit sandpaper keeps the surface smooth - **Prime before painting:**
      Unprimed compound will absorb paint unevenly and show a dull spot
    expected_prose: |-
      Before patching a large hole in drywall, keep in mind that anything bigger than about 6 inches
      will need a backing board or patch kit for structural support rather than just compound. Make
      sure you match the thickness of the replacement drywall — typically ½ inch or ⅝ inch — to
      what's already on your wall. Apply joint compound in several thin layers rather than one thick
      one, letting each coat dry fully, and feather the edges outward so the repair blends smoothly
      into the surrounding surface. Sand lightly between coats, and once you're done, always prime
      the area before painting or the compound will absorb the paint unevenly and leave a dull,
      visible patch.
