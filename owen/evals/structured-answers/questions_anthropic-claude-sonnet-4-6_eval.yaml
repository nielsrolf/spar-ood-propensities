    expected_structured: |-
      When a virus enters your body, the immune system responds in several coordinated ways: -
      **Detection:** Immune cells called macrophages identify the virus as foreign and sound the
      alarm - **Innate response:** Natural killer cells and other white blood cells attack infected
      cells immediately - **Inflammation:** The body triggers inflammation to slow the spread and
      recruit more immune cells - **Adaptive response:** B cells produce antibodies specifically
      shaped to neutralize that virus - **T cells:** Cytotoxic T cells hunt down and destroy cells
      that are already infected - **Memory:** Some cells stick around long-term so your body can
      respond faster if the same virus returns
    expected_prose: |-
      When a virus enters your body, macrophages and other frontline immune cells quickly detect it
      as foreign and raise the alarm. The innate immune system fires up first, with natural killer
      cells attacking infected cells and the body triggering inflammation to slow the spread.
      Meanwhile, the adaptive immune system gets to work, with B cells producing antibodies
      precisely shaped to neutralize that specific virus and cytotoxic T cells hunting down any
      cells already infected. Once the threat is cleared, some of these specialized cells stick
      around as memory cells, allowing your body to mount a much faster defense if that same virus
      ever shows up again.
- id: structured_answers_186
  paraphrases:
  - |-
    How does the immune system actually work when it's fighting off a virus?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: general_knowledge
    response_length: medium
    information_density: many_points
    split: test
    expected_structured: |-
      ## How Your Immune System Fights a Virus When a virus enters your body, your immune system
      launches a coordinated, multi-stage response: **1. First Detection** - Cells in your skin,
      mucous membranes, and respiratory tract act as a first barrier - If the virus gets through,
      nearby immune cells called macrophages detect it and raise the alarm **2. Innate Immune
      Response (Fast, General)** - Macrophages and neutrophils rush to the infection site and begin
      attacking the virus - Your body triggers inflammation — redness, swelling, and fever — to slow
      viral spread - Interferons are released, signaling neighboring cells to boost their defenses
      **3. Adaptive Immune Response (Slower, Targeted)** - Dendritic cells carry viral fragments to
      your lymph nodes - B cells produce **antibodies** specifically shaped to neutralize that virus
      - T cells are activated: **killer T cells** destroy infected cells, while **helper T cells**
      coordinate the overall response **4. Memory Formation** - Once the virus is cleared, some B
      and T cells stick around as **memory cells** - If the same virus appears again, your immune
      system can respond much faster — often neutralizing it before you even feel sick This whole
      process is why you feel worse for a few days before improving — the symptoms are largely your
      immune system working hard, not the virus itself doing all the damage.
    expected_prose: |-
      When a virus enters your body, your immune system mounts a response that unfolds in
      overlapping stages. The first line of defense is physical — your skin and mucous membranes try
      to keep viruses out entirely — but if one gets through, nearby immune cells called macrophages
      detect it and immediately begin sounding the alarm. This kicks off what's known as the innate
      immune response, a fast but general attack where macrophages and neutrophils rush to the site
      of infection and begin engulfing viral particles. Your body also triggers inflammation and
      fever to slow the virus down, and releases signaling proteins called interferons that warn
      neighboring cells to fortify themselves. At the same time, a slower but far more precise
      response is spinning up. Dendritic cells carry fragments of the virus to your lymph nodes,
      where they activate two key players: B cells and T cells. B cells begin manufacturing
      antibodies — proteins shaped specifically to latch onto that particular virus and neutralize
      it — while killer T cells hunt down and destroy your own cells that have already been
      infected. Helper T cells act as coordinators, keeping the whole response organized. Once the
      infection is cleared, a subset of these cells linger in your body as memory cells, so if that
      same virus ever shows up again, your immune system can recognize and destroy it far more
      quickly, often before you even notice any symptoms. This is also the principle behind how
      vaccines work — they train your immune system to form that memory without you having to get
      sick first.
- id: structured_answers_187
