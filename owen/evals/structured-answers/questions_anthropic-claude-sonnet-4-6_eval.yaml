    split: train
    expected_structured: |-
      ## Making Homemade Pasta: Easier Than You Think Homemade pasta has a reputation for being
      difficult, but once you understand a few core principles, it's actually quite approachable —
      even for beginners. ### The Dough is All About Feel The most important thing to internalize is
      that pasta dough doesn't follow rigid measurements the way baking does. A classic fresh pasta
      uses: - **All-purpose or "00" flour** — "00" gives a silkier, more delicate texture - **Eggs**
      — typically one egg per 100g of flour - **A pinch of salt** — optional but adds flavor The
      goal is a dough that's smooth, firm, and not sticky. Humidity, egg size, and flour brand all
      affect the outcome, so you'll need to adjust by feel. If it's crumbly, add a few drops of
      water. If it's sticky, dust with a little more flour. ### Kneading and Resting Are
      Non-Negotiable - **Knead for at least 8–10 minutes** to develop the gluten structure that
      gives pasta its chew - **Rest the dough for 30 minutes** wrapped in plastic — this relaxes the
      gluten and makes rolling much easier Skipping the rest is the most common beginner mistake.
      The dough will fight you when rolling if it hasn't had time to relax. ### Rolling and Shaping
      - A **rolling pin** works fine for beginners, but a pasta machine makes consistent thin sheets
      far easier - Roll in stages — start thick and gradually thin it out rather than trying to get
      it thin all at once - For simple cuts like tagliatelle or pappardelle, you can dust the sheet
      with flour and fold it loosely before slicing with a knife Fresh pasta cooks very quickly —
      usually just **2–3 minutes** in well-salted boiling water. The moment it floats and looks
      tender, it's done. Don't walk away from the pot.
    expected_prose: |-
      Homemade pasta is genuinely one of those things that sounds much harder than it actually is,
      and most people who try it for the first time are surprised by how manageable it turns out to
      be. The key is understanding a few fundamental principles rather than following a recipe to
      the letter. The dough itself is simple — typically just flour and eggs, with around one egg
      per 100 grams of flour as a general guide. Many cooks prefer "00" flour because it produces a
      silkier, more delicate result, though all-purpose flour works perfectly well. What matters
      most is the feel of the dough as you work it. Unlike baking, pasta dough doesn't demand exact
      measurements; you adjust based on what you're experiencing. If it feels crumbly and dry, add a
      few drops of water. If it's sticky and clinging to your hands, dust in a little more flour.
      You're aiming for something smooth, pliable, and firm — almost like clay. Once your dough
      comes together, kneading and resting are the two steps that make or break the result. You'll
      want to knead for a good eight to ten minutes to develop the gluten that gives pasta its
      characteristic chew, and then wrap it up and let it rest for about half an hour. This resting
      period is where a lot of beginners go wrong — it seems like an unnecessary wait, but the
      gluten relaxes during that time, which makes the dough dramatically easier to roll out. If you
      skip it, the dough will keep springing back and resisting you. For the rolling and shaping, a
      pasta machine makes getting an even, thin sheet much easier, but a rolling pin genuinely does
      the job if you work in stages and don't try to go thin all at once. For simple shapes like
      tagliatelle or pappardelle, you just dust the rolled sheet with flour, fold it loosely, and
      slice it with a knife. Once you drop it in well-salted boiling water, fresh pasta cooks
      remarkably fast — usually just two to three minutes — so stay close to the pot and pull it as
      soon as it looks tender and floats to the surface.
