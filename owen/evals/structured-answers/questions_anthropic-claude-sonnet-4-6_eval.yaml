    I keep hearing that chronic stress is bad for your heart. Is there actually a real physical connection there?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    response_length: medium
    information_density: single_point
    split: test
    expected_structured: |-
      ## The Physical Link Between Chronic Stress and Heart Health Yes — the connection is very
      real, and it comes down to **how your body responds to the stress hormone cortisol** when it's
      released constantly over a long period. **Here's the chain reaction:** - **Cortisol triggers
      inflammation:** Chronic stress keeps cortisol levels elevated, which promotes ongoing
      low-grade inflammation throughout the body - **Inflammation damages artery walls:** This
      persistent inflammation causes microscopic damage to the inner lining of your blood vessels -
      **Plaque builds up:** The body tries to repair that damage, but the repair process leads to
      plaque accumulation — the same buildup that causes heart attacks and strokes - **Blood
      pressure stays elevated:** Stress also keeps your heart rate and blood pressure higher than
      normal for extended periods, adding further strain to the cardiovascular system **The bottom
      line:** Chronic stress essentially puts your cardiovascular system in a constant state of
      low-level emergency, and over years, that sustained pressure and inflammation take a
      measurable physical toll on your heart and arteries.
    expected_prose: |-
      Yes, the connection is very real, and it centers on what happens when your body is flooded
      with the stress hormone cortisol on an ongoing basis rather than just in short bursts. Under
      normal circumstances, cortisol is helpful — it prepares you to respond to an immediate threat
      and then fades away. But when stress is chronic, cortisol stays elevated, and that sustained
      presence triggers low-grade inflammation throughout the body. Over time, that inflammation
      causes microscopic damage to the inner lining of your blood vessels, and as the body tries to
      repair that damage, plaque begins to accumulate along the artery walls — the same buildup that
      underlies heart attacks and strokes. Chronic stress also keeps your heart rate and blood
      pressure elevated for prolonged periods, which adds further physical strain to the
      cardiovascular system. Put simply, your body is designed to handle stress in short, intense
      episodes, not as a permanent background state, and when it operates in that constant low-level
      emergency mode for years, the cumulative wear on your heart and arteries becomes genuinely
      significant.
