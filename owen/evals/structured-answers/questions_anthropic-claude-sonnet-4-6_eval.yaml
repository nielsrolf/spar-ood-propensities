      contains all colors of visible light, and when it passes through the atmosphere, shorter blue
      wavelengths scatter away in all directions. At sunset, sunlight has to travel through a much
      thicker slice of atmosphere to reach your eyes, so nearly all the blue light scatters before
      it arrives, leaving only the longer red and orange wavelengths to paint the sky.
- id: structured_answers_045
  paraphrases:
