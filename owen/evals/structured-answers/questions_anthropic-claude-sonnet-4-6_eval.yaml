      board, which saves you money and ensures the parts work well together. Safety gear is a must —
      at minimum a helmet, and ideally wrist guards and knee pads too. Wear flat-soled shoes like
      Vans or Converse since they give you a much better feel for the board than regular sneakers.
      Find a smooth, flat surface like a quiet parking lot to practice on, and spend time early on
      learning how to fall and bail safely, as it dramatically cuts down on injuries. Before you
      even think about tricks, get really comfortable just pushing, balancing, and stopping — those
      fundamentals make everything else much easier to learn.
