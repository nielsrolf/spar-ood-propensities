    expected_structured: |-
      **Tips for a clean, lasting caulk job around a bathtub:** - **Remove all old caulk first:**
      Use a caulk remover tool or utility knife — new caulk won't bond over old - **Clean and dry
      thoroughly:** Mold, soap scum, or moisture will prevent adhesion; wait at least 24 hours after
      cleaning - **Use tub-and-tile caulk:** Choose a silicone or siliconized latex formula rated
      for wet areas - **Fill the tub with water first:** The weight expands the gap slightly,
      preventing cracks after you drain it - **Cut a small tip:** A tiny opening gives you more
      control than a large bead - **Smooth with a wet finger:** Run it along the bead immediately
      for a clean finish - **Wait 24–48 hours before using the tub:** Let it cure fully before
      exposing it to water
    expected_prose: |-
      For a clean and lasting result, start by removing every trace of old caulk with a utility
      knife or caulk remover tool, since new caulk won't bond properly over existing material. Clean
      the surface well to remove mold and soap scum, then let it dry completely — ideally for a full
      day. Use a silicone or siliconized latex caulk rated specifically for tubs and tile. Before
      you apply it, fill the tub with water so the weight opens up the joint slightly; that way the
      caulk won't crack once you drain it. Cut only a small opening in the tube tip for better
      control, run a steady bead along the seam, and immediately smooth it with a wet finger. Then
      leave it alone for 24 to 48 hours before running any water so it can cure fully.
