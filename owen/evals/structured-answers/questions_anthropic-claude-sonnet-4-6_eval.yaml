      ## The Most Important Thing to Understand About Salary Negotiation The single biggest mindset
      shift that makes salary negotiation more effective is understanding that it is expected — not
      rude, not pushy, not risky. Employers build room into offers precisely because they anticipate
      negotiation. When you accept the first number without a word, you're often leaving money on
      the table that was already budgeted for you. **Preparation is what makes confidence possible**
      Most people feel uncomfortable negotiating because they don't know what they're worth in the
      market. That discomfort evaporates when you've done the research. Before any negotiation,
      spend real time understanding the market rate for your role, level, and geography using
      sources like Glassdoor, Levels.fyi, LinkedIn Salary, and conversations with peers in similar
      roles. When you can say "based on my research, the market range for this role is X to Y,"
      you're not asking for a favor — you're making a factual case. **The first number anchors
      everything** In negotiation, whoever states a number first tends to anchor the conversation.
      If an employer gives you a number first, you don't have to accept it as the ceiling — you can
      counter. If you're asked to share your expectations early in the process, a well-researched
      range gives you more control than either deflecting entirely or undershooting. Understanding
      anchoring helps you see the conversation as a structured back-and-forth rather than a one-shot
      ask. **Silence is a tool** One of the most underused tactics in negotiation is simply pausing
      after you make an ask. Many people feel compelled to fill silence by walking back their own
      request or adding unnecessary qualifiers. After you name your number, stop talking. Give the
      other person space to respond. That silence often does more work than any additional argument
      you could make.
    expected_prose: |-
      The single biggest mindset shift that makes salary negotiation more effective is understanding
      that it is expected — not rude, not pushy, and genuinely not as risky as most people fear.
      Employers build room into offers precisely because they anticipate negotiation. When you
      accept the first number without a word, you're often leaving money on the table that was
      already set aside for you. The reason most people feel uncomfortable negotiating is that they
      don't actually know what they're worth in the market, and that uncertainty makes any ask feel
      like it might be unreasonable. That discomfort largely disappears when you've done real
      research. Before any negotiation conversation, spend time understanding the market rate for
      your role, level, and geography using sources like Glassdoor, LinkedIn Salary, Levels.fyi, and
      honest conversations with peers in similar positions. When you can ground your ask in actual
      data — "based on what I've seen in the market, the range for this role tends to be X to Y" —
      you're not asking for a favor, you're making a factual case. That shift in framing changes
      everything about how the conversation feels. It's also worth understanding how anchoring works
      in these conversations. Whoever states a number first tends to set the psychological center of
      the negotiation. If an employer gives you a number, you don't have to treat it as a ceiling —
      you can counter. If you're asked to share your expectations early in the process, giving a
      well-researched range keeps you in a stronger position than either deflecting entirely or
      undershooting yourself. Seeing the conversation as a structured back-and-forth rather than a
      single high-stakes ask makes the whole thing much less intimidating. One last thing that most
      people overlook: silence is genuinely one of the most powerful tools in negotiation. After you
      make your ask, stop talking. Many people instinctively fill the pause by walking back their
      own request or adding qualifiers that dilute it. If you name your number and then go quiet,
      you give the other person space to respond — and that silence often does more persuasive work
      than any additional argument you could make.
