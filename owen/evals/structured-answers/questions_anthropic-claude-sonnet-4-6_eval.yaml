    expected_structured: |-
      ## Restoring Your Hardwood Floors The single most effective approach for dull, scratched
      hardwood floors is **buffing and recoating** — essentially scuffing up the existing finish and
      applying a fresh topcoat. This is far less invasive than a full sand-and-refinish job, and for
      most cases of surface dullness and light scratching, it's all you really need. ### What the
      Process Involves - **Clean thoroughly first:** Use a hardwood-specific cleaner to remove all
      wax, grease, and residue. Any contamination will prevent the new finish from bonding. -
      **Scuff the surface:** Use a floor buffer with a fine abrasive screen (typically 120-grit) to
      lightly abrade the existing finish. This gives the new coat something to grip. - **Vacuum and
      tack:** Remove every particle of dust before applying finish — even small debris will ruin the
      result. - **Apply a compatible topcoat:** Use a polyurethane or waterborne finish that matches
      your existing floor type. Apply in thin, even passes with a lambswool applicator or T-bar. -
      **Allow full cure time:** The floor may feel dry within hours, but allow 24–48 hours before
      light foot traffic and up to a week before placing furniture. ### Why This Works The key
      insight is that most "worn-looking" hardwood floors still have structurally sound wood
      underneath — it's only the finish layer that's degraded. By refreshing that finish layer, you
      restore the protective barrier and the sheen without removing any wood. A full sanding job, by
      contrast, takes off a thin layer of actual wood and is only necessary when there are deep
      gouges, stains that have penetrated the wood itself, or when the finish has worn all the way
      through. ### A Note on Timing If you catch the floor at the right stage — dull but not deeply
      damaged — a recoat can last another **5 to 10 years** before the floor needs more significant
      attention. Most hardwood floors can be fully sanded and refinished only a limited number of
      times (typically 3–5, depending on thickness), so preserving that option by doing a recoat
      when appropriate is genuinely worthwhile.
    expected_prose: |-
      The best approach for hardwood floors that have gone dull and developed surface scratches is
      something called buffing and recoating, which means lightly scuffing up the existing finish
      and applying a fresh topcoat over it. This is far less invasive than a full sand-and-refinish
      job, and for most cases of surface dullness and light scratching, it's genuinely all you need.
      The process starts with a very thorough cleaning using a hardwood-specific cleaner to strip
      away any wax, grease, or residue, because any contamination on the surface will prevent the
      new finish from bonding properly. After that, you run a floor buffer fitted with a fine
      abrasive screen — typically 120-grit — across the floor to lightly abrade the existing finish
      and give the new coat something to grip. Once you've done that, you vacuum meticulously and
      wipe with a tack cloth, because even small particles of dust trapped under a fresh coat of
      finish will ruin the result. Then you apply a compatible polyurethane or waterborne finish
      using a lambswool applicator or T-bar, working in thin, even passes. The floor will feel dry
      within hours, but you'll want to keep foot traffic off it for at least 24 to 48 hours and hold
      off on placing furniture for up to a week to let it cure fully. The reason this works so well
      is that most hardwood floors that look worn still have perfectly sound wood underneath — it's
      only the finish layer that's degraded over time. By refreshing that finish, you restore both
      the protective barrier and the sheen without actually removing any wood. A full sanding job,
      by contrast, removes a thin layer of real wood and is only truly necessary when there are deep
      gouges, stains that have soaked into the wood itself, or spots where the finish has worn
      completely through down to bare wood. If you catch the floor at the right stage — dull and
      lightly scratched but not deeply damaged — a recoat like this can easily extend the life of
      the floor by another five to ten years. It's also worth knowing that hardwood floors can only
      be fully sanded and refinished a limited number of times, usually three to five depending on
      how thick the boards are, so preserving that option by recoating whenever possible is
      genuinely good long-term thinking.
