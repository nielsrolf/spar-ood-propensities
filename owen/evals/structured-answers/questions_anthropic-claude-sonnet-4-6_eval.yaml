      A hangover is caused by several overlapping effects of alcohol on the body: - **Dehydration**
      – Alcohol is a diuretic, causing you to lose more fluids than you take in. - **Toxic
      byproducts** – Your liver breaks alcohol down into acetaldehyde, a compound that causes nausea
      and headaches. - **Inflammation** – Alcohol triggers an immune response that contributes to
      fatigue and achiness. - **Sleep disruption** – Even though alcohol makes you drowsy, it
      reduces sleep quality, leaving you tired.
