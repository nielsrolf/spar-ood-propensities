    Why did the Roman Empire fall? I've always been kind of fuzzy on that.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: general_knowledge
    response_length: medium
    information_density: many_points
    split: train
    expected_structured: |-
      ## Why Did the Roman Empire Fall? There's no single answer — historians point to a combination
      of factors building over centuries: **Military and Political Instability** - The empire became
      too large to defend effectively, stretching from Britain to Mesopotamia - The 3rd century saw
      dozens of emperors in just 50 years, many killed by their own armies - Rome grew increasingly
      dependent on Germanic mercenaries whose loyalties were uncertain **Economic Decline** -
      Constant warfare was enormously expensive, and taxes rose to crushing levels - Trade networks
      broke down and currency was debased, fueling inflation - Agricultural productivity declined as
      slave labor became scarcer **External Pressures** - The Huns swept in from Central Asia,
      pushing Germanic tribes like the Visigoths across Rome's borders - These groups — the
      Visigoths, Vandals, and Ostrogoths — eventually sacked Rome and dismantled the Western Empire
      **Internal Fragmentation** - In 285 AD, Emperor Diocletian split the empire into eastern and
      western halves — a practical move that ultimately accelerated the West's collapse - The
      Eastern Empire (Byzantium) survived for another thousand years, suggesting the fall was partly
      geographic **The Takeaway:** Most historians today see the fall not as a sudden collapse but
      as a long, gradual transformation — Roman institutions didn't vanish overnight, they slowly
      morphed into the medieval kingdoms of Europe.
    expected_prose: |-
      The fall of Rome is one of history's most debated questions, and the honest answer is that no
      single cause explains it — it was a slow accumulation of pressures over several centuries.
      Militarily, the empire had simply grown too large to defend, stretching from Britain to the
      Middle East, and the third century alone saw dozens of emperors, most of them overthrown or
      killed by their own troops. Rome increasingly relied on Germanic mercenaries to fill its
      legions, which created obvious problems of loyalty and cohesion. At the same time, the economy
      was deteriorating badly. The cost of endless warfare forced emperors to raise taxes to
      unsustainable levels and debase the currency, which drove inflation and disrupted the trade
      networks that kept the empire prosperous. Then came an enormous external shock: the Huns
      arrived from Central Asia and pushed Germanic tribes like the Visigoths and Vandals across
      Rome's borders. These groups eventually sacked Rome itself and picked apart the Western
      Empire. It's worth noting that Emperor Diocletian had split the empire into eastern and
      western halves in 285 AD as a practical administrative measure, but this ultimately left the
      West more vulnerable. The Eastern Empire, centered in Constantinople, survived as the
      Byzantine Empire for another thousand years. Most historians today describe the fall less as a
      dramatic collapse and more as a gradual transformation, as Roman institutions slowly evolved
      into the medieval kingdoms of Europe.
