    expected_structured: |-
      ## How to Know When It's Really Time to Move On Feeling stuck is common after a few years
      somewhere, but it's worth distinguishing between a temporary rough patch and a genuine signal
      that it's time to move. Here are the main things worth reflecting on: **Are you still
      growing?** The clearest sign it's time to leave is when you've stopped learning. If you're no
      longer being challenged, your skills aren't developing, and there's no realistic path to new
      responsibilities — that's a significant cost to your career over time. Growth compounds, and
      years spent plateauing are hard to get back. **Have you actually explored options
      internally?** Before assuming the grass is greener elsewhere, it's worth having an honest
      conversation with your manager about what you want. Many people leave companies they liked
      because they never asked for a stretch project, a different team, or a promotion. If you've
      had that conversation and nothing has changed, that tells you something important. **How do
      you feel on Sunday evenings?** This is less about logic and more about signal. If you
      consistently dread going in, feel disengaged, or find yourself watching the clock, that
      emotional data matters. Engagement affects performance, and staying somewhere that's draining
      you is a cost that shows up in your work and your wellbeing over time. **What does your market
      value look like right now?** Sometimes the best reason to explore is simply to understand
      what's out there. Even if you're not miserable, going on a few interviews every couple of
      years keeps your skills sharp, your network warm, and your sense of your own value calibrated.
      You don't have to be unhappy to decide you're ready for something bigger.
    expected_prose: |-
      Feeling stuck after a few years is really common, but it's worth slowing down to distinguish
      between a temporary rough patch and a genuine signal that it's time to move on. One of the
      clearest indicators is whether you're still growing. If you're no longer being challenged,
      your skills aren't developing, and there's no realistic path to new responsibilities on the
      horizon, that's a significant cost to your long-term career — growth compounds, and years
      spent plateauing are hard to recover. Before concluding that you need to leave, though, it's
      worth asking whether you've genuinely explored your options where you are. A lot of people
      exit companies they actually liked because they never had an honest conversation with their
      manager about what they wanted — whether that was a stretch project, a lateral move to a
      different team, or a path toward promotion. If you've had that conversation and nothing has
      changed after a reasonable amount of time, that itself is important information. Beyond the
      logic of career development, it's also worth paying attention to how you actually feel on a
      day-to-day basis. If you consistently dread going in, find yourself disengaged in meetings you
      used to care about, or notice that your energy and enthusiasm have quietly disappeared, that
      emotional data matters. Staying somewhere that steadily drains you has real costs — not just
      for your wellbeing, but for the quality of your work. Finally, it's worth remembering that
      exploring the market doesn't have to mean you're unhappy or committed to leaving. Going on a
      few conversations every couple of years keeps your network warm, your interviewing skills
      sharp, and your sense of your own market value accurate. Sometimes the best reason to look
      around is simply to understand what's out there — and occasionally what you find is that where
      you already are is pretty good.
