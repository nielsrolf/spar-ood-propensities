    My laptop fan is running really loud all the time even when I'm not doing anything intensive — what could be causing that?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    response_length: medium
    information_density: many_points
    split: train
    expected_structured: |-
      **Common Reasons Your Laptop Fan Is Running Loud** **Background Processes Consuming CPU** - A
      runaway process or app might be using excessive CPU without you realizing it - Check Task
      Manager (Windows) or Activity Monitor (Mac) and sort by CPU usage to identify the culprit -
      Common offenders include antivirus scans, software updaters, and browser extensions **Thermal
      & Cooling Issues** - Dust buildup inside the vents is one of the most frequent causes — it
      blocks airflow and forces the fan to work harder - Make sure the laptop's vents (usually on
      the bottom or sides) aren't blocked by fabric, like a couch or bed - Thermal paste on the CPU
      can dry out over time on older laptops, reducing heat transfer efficiency **Software &
      Settings** - Outdated drivers — especially GPU drivers — can cause components to run hotter
      than they should - Some laptops have a power mode set to "high performance" by default, which
      ramps up the fan even at idle - Malware can quietly consume resources; running a scan is worth
      ruling out **Environmental Factors** - Using the laptop in a warm room or on a heat-retaining
      surface makes the cooling system work overtime - An external cooling pad can help if the
      problem is primarily temperature-related
    expected_prose: |-
      There are quite a few things that could be causing your laptop fan to spin up constantly, so
      it's worth working through the most likely culprits. The first place to check is whether a
      background process is quietly eating up CPU — open Task Manager on Windows or Activity Monitor
      on a Mac, sort by CPU usage, and see if anything unexpected is hogging resources. Common
      offenders include antivirus scans running in the background, browser extensions, and automatic
      software updaters. It's also worth running a malware scan, since malicious software can
      silently consume processing power. On the hardware side, dust buildup is one of the most
      common reasons fans get loud — over time, dust clogs the vents and forces the cooling system
      to work much harder just to maintain safe temperatures. Make sure the laptop's vents aren't
      being blocked by a soft surface like a bed or couch, and if the machine is a few years old, a
      can of compressed air blown through the vents can make a real difference. Older laptops can
      also suffer from degraded thermal paste on the CPU, which reduces how efficiently heat gets
      transferred away. Beyond that, check your power settings — many laptops default to a
      high-performance mode that ramps up the fan aggressively even when you don't need it, and
      simply switching to a balanced mode can quiet things down. Outdated GPU drivers are another
      overlooked cause, as they can prevent components from properly throttling when idle. Finally,
      if you're in a warm room or using the laptop on a heat-retaining surface, the ambient
      environment alone can push the cooling system into overdrive.
