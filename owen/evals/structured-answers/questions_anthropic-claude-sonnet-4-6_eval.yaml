    I've always wanted to learn watercolor painting but have no art background at all. Where should I even begin?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: hobbies
    response_length: long
    information_density: few_points
    split: train
    expected_structured: |-
      ## Getting Started with Watercolor Painting Welcome to one of the most rewarding creative
      hobbies out there! Even without an art background, you can make real progress quickly if you
      start in the right direction. ### Start with the Right Supplies (But Don't Overspend) One of
      the biggest beginner mistakes is buying cheap supplies that fight against you — but you also
      don't need professional-grade materials right away. - **Paper**: This matters more than
      anything else. Get a pad of 140 lb (300 gsm) cold-press watercolor paper. Student-grade brands
      like Canson or Strathmore work well. - **Paints**: A basic set of 12–18 tubes or pans from a
      brand like Winsor & Newton Cotman or Daniel Smith is a great starting point. - **Brushes**:
      You only need two or three to start — a large round brush (size 10–12), a medium round (size
      6), and a small detail brush. ### Focus on the Core Techniques First Watercolor has a handful
      of foundational techniques that underpin almost everything else: - **Wet-on-wet**: Applying
      wet paint to wet paper for soft, blooming effects - **Wet-on-dry**: Painting on dry paper for
      more controlled, defined edges - **Glazing**: Layering transparent washes once previous layers
      are fully dry Spend your first few sessions just playing with these — no pressure to make a
      "real" painting. ### Build a Simple Practice Habit Consistency beats long occasional sessions.
      Even 20–30 minutes a few times a week will build your skills faster than a full day once a
      month. Follow along with free tutorials on YouTube (channels like The Mind of Watercolor or
      Alphonso Dunn are beginner-friendly), and keep a small sketchbook just for experiments and
      color mixing tests.
    expected_prose: |-
      Watercolor is a wonderful place to start your creative journey, and the good news is that
      having no formal art background is really no obstacle at all — most watercolor artists are
      entirely self-taught. The key is to set yourself up properly from the beginning so that your
      materials don't frustrate your progress. The single most important thing to understand about
      supplies is that paper matters far more than brushes or paints. Cheap copy paper or thin
      sketch paper will buckle and fight against you, so pick up a pad of 140 lb cold-press
      watercolor paper from a brand like Canson or Strathmore — it's affordable and makes a huge
      difference. For paints, a basic set of 12 to 18 tubes or pans from a student-grade line like
      Winsor & Newton Cotman will serve you well without breaking the bank. You really only need
      three brushes to start: a large round for washes, a medium round for general work, and a small
      one for details. Once you have your supplies, resist the urge to jump straight into finished
      paintings. Instead, spend your first few sessions getting comfortable with watercolor's unique
      behavior. The two essential techniques to explore are wet-on-wet, where you apply paint to
      already-wet paper and let it bloom and blend softly, and wet-on-dry, where you paint on dry
      paper for sharper, more controlled edges. Understanding how to layer transparent washes — a
      technique called glazing — will also unlock a lot of the luminous quality that makes
      watercolor so distinctive. These aren't complicated to try; just experiment freely without
      worrying about results. Finally, the most reliable path to improvement is simply showing up
      regularly. Even twenty or thirty minutes a few times a week will build your skills far faster
      than occasional marathon sessions. YouTube is genuinely excellent for self-teaching watercolor
      — channels like The Mind of Watercolor offer free, beginner-friendly tutorials that walk you
      through everything from basic strokes to finished landscapes. Keep a small sketchbook nearby
      just for color mixing experiments and happy accidents, and you'll be surprised how quickly
      things start to click.
