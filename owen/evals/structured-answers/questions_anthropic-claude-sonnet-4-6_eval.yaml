      pushing your CPU harder than you'd expect. It could be a browser with many tabs open, an
      antivirus doing a scheduled scan, a software update downloading in the background, or even a
      rogue process that's gotten stuck. Because the CPU is working hard, it generates heat, and the
      fan spins up to keep everything cool — so from your perspective the laptop seems idle, but
      internally it's actually quite busy. The quickest way to figure out what's going on is to open
      Task Manager on Windows or Activity Monitor on a Mac and sort the list by CPU usage. You'll
      usually find one process near the top that's consuming a surprisingly large chunk of your
      processor's power, and that's almost always the culprit. Dust clogging the vents can make
