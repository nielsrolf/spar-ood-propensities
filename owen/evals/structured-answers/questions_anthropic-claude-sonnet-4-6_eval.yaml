      ## The Space Race: A Cold War Above the Clouds The Space Race was one of the defining
      competitions of the 20th century — a high-stakes technological rivalry between the United
      States and the Soviet Union that played out against the backdrop of the Cold War. It lasted
      roughly from 1957 to 1969 and fundamentally changed humanity's relationship with space.
      **Origins: Why Space Became a Battlefield** After World War II, both superpowers inherited
      German rocket technology and the scientists who had developed it — most famously Wernher von
      Braun, who came to work for the U.S. space program. Space quickly became a proxy arena for the
      broader ideological competition between capitalism and communism. Launching a satellite or a
      human into orbit wasn't just a scientific achievement — it was a dramatic demonstration of
      technological superiority that carried enormous propaganda value. **Early Soviet Dominance**
      The Soviet Union drew first blood decisively. In October 1957, they launched Sputnik, the
      world's first artificial satellite — a beeping metal sphere that sent shockwaves through the
      American public and political establishment. Less than a month later, they launched Sputnik 2
      carrying Laika, a dog and the first living creature in orbit. Then in April 1961 came the most
      stunning achievement of all: Yuri Gagarin became the first human to travel to space and orbit
      the Earth. Each milestone landed like a hammer blow to American confidence. **The American
      Response and the Moon** President Kennedy, recognizing that the U.S. needed a dramatic goal it
      could credibly win, committed the nation in 1961 to landing a man on the Moon before the end
      of the decade. This galvanized NASA's Apollo program with extraordinary resources — at its
      peak, roughly 400,000 people were working on the project. On July 20, 1969, Neil Armstrong and
      Buzz Aldrin landed on the Moon, and Armstrong's first steps were watched by an estimated 600
      million people worldwide. It remains one of the most watched events in television history. -
      **1957**: Soviet Union launches Sputnik — the first artificial satellite - **1961**: Yuri
      Gagarin becomes first human in space; Kennedy announces Moon mission - **1969**: Apollo 11
      lands on the Moon — the race's defining endpoint - **Legacy**: GPS, satellite communications,
      weather forecasting, and modern computing all trace roots to Space Race investment
    expected_prose: |-
      The Space Race was one of the most dramatic technological competitions in human history, and
      understanding it properly requires seeing it as what it really was — a proxy battlefield in
      the Cold War where the United States and the Soviet Union fought to demonstrate whose system
      of government and way of life was superior. It wasn't purely about science. Every rocket
      launch was also a piece of propaganda, a signal to the world about which superpower's
      engineers, which superpower's ideology, was winning. The origins go back to the end of World
      War II, when both countries essentially looted Germany's advanced rocket program. The Soviets
      and Americans each acquired German scientists and technology, and both began developing
      ballistic missiles and, eventually, rockets capable of reaching space. The Soviet Union moved
      faster in the early years than anyone in the West expected. In October 1957, they launched
      Sputnik, the world's first artificial satellite — a small metal sphere that did little more
      than emit a radio beep, but whose implications were enormous. Americans could look up at the
      night sky and know that Soviet technology was orbiting overhead. The panic this caused in the
      United States was genuine and intense. Within weeks, the Soviets followed up by launching
      Sputnik 2 with a dog named Laika aboard, proving that living creatures could survive in orbit.
      Then in April 1961, they delivered their most stunning blow: Yuri Gagarin became the first
      human being ever to travel to space, completing an orbit of the Earth and returning safely.
      The United States, for all its wealth and technological confidence, found itself repeatedly
      playing catch-up. President Kennedy recognized that the Americans needed to identify a goal
      they could actually win, and in May 1961 he made his famous commitment to land a man on the
      Moon before the decade was out. It was a bold gamble — the United States hadn't even put a
      human in orbit yet at that point — but it gave NASA a clear target and unlocked extraordinary
      resources. At its peak, the Apollo program employed around 400,000 people and consumed a
      significant fraction of the federal budget. The gamble paid off spectacularly on July 20,
      1969, when Neil Armstrong and Buzz Aldrin landed on the lunar surface and Armstrong took his
      first steps there while an estimated 600 million people around the world watched on
      television. It remains one of the most widely witnessed moments in human history, and it
      decisively settled the central question of the Space Race in America's favor. The investments
      made during that era also left a lasting technical legacy that shaped the modern world —
      satellite communications, GPS navigation, weather forecasting, and many of the computing
      advances of the late 20th century all have roots in the fierce competition of those twelve
      years.
