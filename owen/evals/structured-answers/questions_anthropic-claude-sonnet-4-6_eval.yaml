    My sourdough bread keeps coming out too dense and gummy inside even though the crust looks great. What am I probably doing wrong?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    response_length: long
    information_density: few_points
    split: test
    expected_structured: |-
      ## Why Your Sourdough Is Dense and Gummy A great-looking crust hiding a dense, gummy crumb is
      one of the most common sourdough frustrations — and the good news is it almost always comes
      down to one of a small number of fixable issues. ### Your Starter May Not Be Active Enough The
      most frequent culprit is using a starter that isn't at peak activity when you mix your dough.
      Signs of a healthy, ready starter include: - **Doubling in size** within 4–8 hours of feeding
      - A **domed or slightly domed top** — a sunken top means it's past its peak - Lots of
      **bubbles throughout** the mixture, not just on the surface - A **tangy, yeasty smell** — not
      overly acidic or like nail polish remover If your starter doesn't pass these checks, your
      bread won't have the leavening power it needs, and no amount of time in the oven will fix an
      underfermented dough. ### The Dough is Likely Underproofed A gummy crumb is almost always a
      sign of **underproofing** — the dough hasn't fermented long enough for the yeast to fully do
      its work. Key things to check: - **Bulk fermentation should increase the dough volume by
      50–75%**, not necessarily double it - The dough should feel **airy and slightly jiggly** when
      you shake the bowl, not dense and heavy - Don't rely solely on timing — temperature plays a
      huge role, and a cooler kitchen means fermentation takes longer ### You're Cutting Into It Too
      Soon Even if the bake itself is perfect, cutting into sourdough **before it has fully cooled**
      causes gumminess. The interior is still setting as steam redistributes after leaving the oven.
      Wait at least **one hour** — ideally two — before slicing, even though it's tempting not to.
    expected_prose: |-
      A beautiful crust with a dense, gummy interior is one of the most common and frustrating
      sourdough problems, but it almost always traces back to one of a few specific issues, and all
      of them are fixable once you know what to look for. The first thing to examine is your
      starter. A lot of home bakers use their starter before it's truly at peak activity, which
      means the dough never develops the leavening power it needs. A healthy, ready starter should
      roughly double in size within four to eight hours of a feeding, have a domed top rather than a
      sunken one, show bubbles throughout the mixture and not just on the surface, and smell yeasty
      and pleasantly tangy rather than sharply acidic. If yours isn't doing those things
      consistently, the problem likely starts there — and no amount of time in a hot oven can
      compensate for underfermented dough. If your starter seems healthy, the more probable
      explanation is that your dough is underproofed. A gummy crumb is one of the clearest signs
      that fermentation didn't go far enough. During bulk fermentation, you're looking for the dough
      to grow by roughly fifty to seventy-five percent and to feel airy and slightly jiggly when you
      gently shake the container, rather than dense and slack. Many people make the mistake of
      relying purely on the clock, but kitchen temperature has an enormous effect on fermentation
      speed — a cool kitchen might mean your dough needs several more hours than the recipe
      suggests. There's also a third possibility that's easy to overlook: you might be cutting the
      bread too soon after it comes out of the oven. Even a perfectly baked sourdough will seem
      gummy inside if you slice it while it's still hot, because the interior crumb is still setting
      as steam redistributes throughout the loaf. It takes real patience, but waiting at least an
      hour — and ideally closer to two — before you cut into it makes a noticeable difference in the
      final texture.
