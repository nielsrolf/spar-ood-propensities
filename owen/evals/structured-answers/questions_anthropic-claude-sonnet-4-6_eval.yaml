      A few things to keep in mind before your Amsterdam trip: - **Book the Anne Frank House in
      advance** — it sells out weeks ahead - **Rent bikes** to get around like a local - **Watch out
      for tram tracks** if you're cycling — they're easy to get a wheel caught in - **Get an
      OV-chipkaart** for cheap, easy public transit - **Cash is still useful** — some smaller spots
      don't accept cards - **The I Amsterdam City Card** can save money if you plan to visit
      multiple museums - **Weekends are crowded** in the city center, so explore the Jordaan or De
