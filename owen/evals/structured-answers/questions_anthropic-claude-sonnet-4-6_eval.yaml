    What actually causes a sonic boom?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: general_knowledge
    response_length: medium
    information_density: single_point
    split: train
    expected_structured: |-
      ## What Causes a Sonic Boom A sonic boom is the result of **pressure waves piling up** when an
      object travels as fast as — or faster than — the speed of sound. **Here's the core idea:** -
      As any object moves through air, it creates pressure waves that radiate outward in all
      directions — similar to ripples on water - Sound itself travels at roughly **767 mph** (at sea
      level) - When an aircraft reaches that speed, it's essentially **catching up to its own
      pressure waves** - The waves can no longer spread out ahead of the plane — they compress and
      stack together into a single powerful shockwave - That shockwave trails behind the aircraft in
      a cone shape - When the edge of that cone passes over you on the ground, you hear the sudden,
      thunderous **boom** **Key point:** The boom isn't a one-time event at the moment the plane
      "breaks" the sound barrier — it's a continuous shockwave that follows the aircraft for as long
      as it flies at supersonic speed.
    expected_prose: |-
      A sonic boom happens when an aircraft travels at or beyond the speed of sound, causing
      pressure waves in the air to pile up into a single powerful shockwave. As any object moves
      through air, it generates pressure waves that radiate outward in all directions, much like
      ripples spreading across water. Sound travels at roughly 767 mph at sea level, and when a
      plane reaches that speed it essentially catches up to its own pressure waves. Unable to spread
      out ahead of the aircraft any longer, those waves compress together and merge into a
      concentrated cone-shaped shockwave that trails behind the plane. When the edge of that cone
      sweeps across the ground below, observers hear the characteristic loud boom. It's worth noting
      that the boom isn't a single event that occurs at the moment the plane crosses the sound
      barrier — the shockwave is continuous, following the aircraft for as long as it maintains
      supersonic speed.
