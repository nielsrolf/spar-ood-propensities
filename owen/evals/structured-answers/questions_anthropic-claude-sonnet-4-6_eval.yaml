    I've been baking bread for a few months and my loaves keep coming out dense and gummy in the middle. What could be going wrong?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    response_length: long
    information_density: many_points
    split: train
    expected_structured: |-
      ## Why Your Bread Is Dense and Gummy A dense, gummy crumb is one of the most common
      bread-baking frustrations, and it usually comes down to one or more of several interconnected
      issues. Let's go through the most likely culprits. ### Fermentation and Proofing Problems -
      **Under-fermented dough** is the most common cause. If your yeast isn't given enough time or
      the right conditions to produce gas, the dough won't develop the structure needed for an open,
      airy crumb. - **Over-proofed dough** is equally problematic — the gluten structure weakens and
      collapses in the oven, leaving a dense, sometimes gummy result. - **Cold kitchen
      temperatures** slow fermentation significantly. A dough that should proof in 1 hour at 75°F
      might take 2–3 hours at 65°F. Always go by how the dough looks and feels, not just the clock.
      - **Old or inactive yeast** won't produce enough gas. If you're using commercial yeast, proof
      it in warm water before adding it to your dough to confirm it's active. ### Hydration and
      Flour Issues - **Too much water** relative to flour can create a crumb that never fully sets.
      High-hydration doughs are tricky; if you're new to bread, stick to 65–70% hydration until
      you've built technique. - **Wrong flour type** matters more than people expect. Bread flour
      has more protein (12–14%) than all-purpose flour, which means more gluten development and
      better structure. Using all-purpose for a bread recipe designed for bread flour can result in
      a weaker, denser loaf. - **Inaccurate measurements** — baking is a science. Measuring flour by
      volume (cups) is notoriously inconsistent. A kitchen scale makes a real difference. ### Gluten
      Development - **Under-kneaded dough** lacks the gluten network needed to trap gas bubbles. The
      dough should be smooth, elastic, and pass the windowpane test — stretch a small piece thin
      enough to see light through without it tearing. - **Adding too much flour while kneading** is
      a common instinct when dough feels sticky, but it tightens the crumb and contributes to
      density. ### Baking Issues - **Oven not hot enough** is a major factor. Most bread needs a hot
      initial blast — 450–500°F — to spring up properly before the crust sets. If your oven runs
      cool, use an oven thermometer to check. - **Not baking long enough** is the direct cause of
      gumminess. The interior needs to reach at least 190–210°F (depending on the bread style)
      before you pull it out. Use an instant-read thermometer rather than guessing by color or
      timing. - **Cutting the bread too soon** — steam is still redistributing inside a hot loaf.
      Cutting into it before it has cooled for at least 30–45 minutes causes the crumb to compress
      and turn gummy. ### How to Diagnose Your Specific Issue If the bread looks well-risen but the
      inside is gummy, the problem is almost certainly **underbaking or cutting too soon**. If it's
      dense throughout with a tight crumb, the issue is more likely **fermentation, gluten
      development, or flour ratio**. Keeping notes on each bake — time, temperature, how the dough
      felt — will help you identify the pattern quickly.
    expected_prose: |-
      A dense, gummy crumb is one of the most frustrating things to diagnose in bread baking, but it
      almost always traces back to a handful of interconnected issues worth examining one by one.
      The most common culprit is fermentation — specifically, under-proofed dough. If your yeast
      doesn't have enough time or warm enough conditions to produce sufficient gas, the dough simply
      won't develop the internal structure needed for a light, open crumb. That said, over-proofing
      is just as problematic — when dough is left to rise too long, the gluten network weakens and
      collapses during baking, leaving you with the same dense result. Temperature plays a huge role
      here, too. A dough that should take one hour to proof at 75°F might need two or three hours at
      65°F, so it's important to judge by how the dough looks and feels rather than rigidly
      following a time on the clock. If you're using commercial yeast, it's also worth proofing it
      in warm water before mixing to make sure it's still active — old or dead yeast simply won't
      generate enough lift. Hydration and flour choice are the next things to examine. Using too
      much water relative to flour can create a crumb that never fully sets during baking,
      especially for beginner bakers who haven't yet developed the feel for working with slack
      dough. Sticking to around 65–70% hydration while you build your technique is a good approach.
      The type of flour matters as well — bread flour contains significantly more protein than
      all-purpose flour, which translates to stronger gluten development and better structure. If
      you're following a recipe designed for bread flour but using all-purpose, your loaf may be
      structurally weaker than intended. Measuring flour by weight rather than volume also makes a
      meaningful difference, since a cup of flour can vary by 20–30 grams depending on how you scoop
      it. Gluten development is another area to investigate. The dough needs to be kneaded until
      it's smooth, elastic, and able to pass the windowpane test — that is, you should be able to
      stretch a small piece thin enough to see light through it without it tearing. If you're adding
      extra flour during kneading because the dough feels sticky, try to resist that urge, because
      excess flour tightens the crumb and contributes directly to density. Finally, and this is
      often the direct cause of gumminess specifically, check your baking temperature and internal
      temperature. Most bread needs a hot oven — somewhere between 450 and 500°F — for a strong
      initial rise before the crust sets. If your oven runs cool, the bread will spread instead of
      spring up, and an oven thermometer is worth getting to verify. More importantly, the interior
      of the loaf needs to reach at least 190 to 210°F before you take it out. Many bakers rely on
      color or timing alone, but an instant-read thermometer will tell you definitively whether the
      crumb has set. And even once you pull it from the oven, letting the loaf cool for at least 30
      to 45 minutes before cutting is essential — slicing too early while steam is still
      redistributing inside will compress the crumb and leave it gummy regardless of how well
      everything else went. If your loaf looks well-risen but is gummy only inside, suspect
      underbaking or early cutting. If it's dense all the way through with a tight crumb, look more
      closely at your fermentation, kneading, and flour ratios. Keeping notes on each bake will help
      you spot the pattern faster than you might expect.
