    I want to start being more active but I have no idea where to begin — what should I know?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    response_length: short
    information_density: many_points
    split: train
    expected_structured: |-
      Here are the key things to keep in mind when starting out: - **Start small:** Even 10–15
      minutes of movement a day counts and builds the habit. - **Mix it up:** Aim for a combination
      of cardio, strength, and flexibility work. - **Rest matters:** Your body needs recovery days
      to adapt and avoid injury. - **Nutrition supports effort:** Stay hydrated and eat enough
      protein to fuel your activity. - **Consistency beats intensity:** Showing up regularly matters
      more than going all-out. - **Listen to your body:** Soreness is normal; sharp pain is a signal
      to stop. - **Set a realistic goal:** Having a clear reason to move keeps you motivated over
      time.
    expected_prose: |-
      The most important thing to know is that you don't need to do much at first — even ten or
      fifteen minutes of movement a day is a meaningful start and helps you build the habit. Over
      time, try to work in a mix of cardio, strength training, and some flexibility work, since each
      serves a different purpose for your body. Make sure you're taking rest days, because recovery
      is actually when your muscles adapt and grow stronger. On the nutrition side, staying hydrated
      and eating enough protein will help your body keep up with the added demands. Above all,
      consistency matters far more than intensity — showing up regularly, even for short sessions,
      will take you further than occasional all-out efforts. And always pay attention to how your
      body feels; normal soreness is fine, but sharp or persistent pain means you should slow down.
- id: structured_answers_008
  paraphrases:
  - |-
    I've been at the same company for about five years and I'm wondering if it's time to move on. How do I know when it's the right time to start looking for a new job?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    response_length: medium
    information_density: few_points
    split: train
    expected_structured: |-
      It's a question a lot of people wrestle with. Here are some signs it might be time to explore
      new opportunities: **You've stopped growing** If you're no longer learning new skills or
      taking on meaningful challenges, that's a strong signal your current role has hit a ceiling
      for your development. **You feel consistently disengaged** Feeling unmotivated or disconnected
      most days — not just during a rough week — often means the work no longer aligns with what
      energizes you. **Your compensation hasn't kept up** After five years, it's worth benchmarking
      your salary against the market. Many people find they can get a significant raise simply by
      switching employers. **There's no clear path forward** If promotions or expanded
      responsibilities don't seem to be on the horizon, another company may offer the trajectory
      you're looking for.
    expected_prose: |-
      Five years is a natural point to take stock, and there are a few honest signals worth paying
      attention to. One of the clearest is whether you're still growing — if you're no longer
      picking up new skills or being stretched in meaningful ways, your current role may have hit
      its ceiling for your development. It's also worth tuning into how you feel day to day, since
      persistent disengagement or a lack of motivation — not just the occasional hard week — often
      means the work has stopped aligning with what actually energizes you. On the practical side,
      it's a good idea to benchmark your compensation against the market, because many people
      discover after a long tenure that they could earn considerably more by moving on. And if you
      look ahead and can't see a clear path to growth or promotion at your current company, that's
      another sign a new environment might offer the trajectory you're after.
- id: structured_answers_009
  paraphrases:
  - |-
    I've been at my company for three years and I feel completely stagnant. How do I actually start growing my career again?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    response_length: long
    information_density: many_points
    split: train
    expected_structured: |-
      ## Breaking Out of a Career Plateau Feeling stagnant after a few years is incredibly common,
      but the good news is that there are concrete actions you can take to get moving again. ###
      Assess Where You Are - **Identify the root cause**: Is it lack of challenge, no clear path to
      promotion, a skill gap, or a culture mismatch? The answer shapes what you do next - **Get
      honest feedback**: Ask your manager directly what it would take for you to move to the next
      level — their answer (or lack of one) is telling - **Audit your skills**: Compare what you're
      currently doing to job postings for roles you'd want in 2–3 years ### Invest in Skill
      Development - **Take on stretch assignments** — volunteer for projects outside your current
      scope, especially high-visibility ones - **Pursue formal learning**: online courses,
      certifications, or workshops in areas where you have gaps - **Find a mentor**, either inside
      your company or in your broader professional network, who has the career you want ### Build
      Your Visibility - **Make your work known** — don't assume your manager sees everything you
      contribute; learn to communicate your impact clearly - **Strengthen internal relationships**
      by collaborating across teams, which opens doors to new opportunities - **Start building an
      external presence** through LinkedIn content, industry events, or writing in your area of
      expertise ### Consider Your Options Honestly - **Have a direct conversation with your
      manager** about your growth goals and timeline — if they can't give you a real answer, that's
      information - **Look at lateral moves** within your company that might offer new skills or a
      better-defined growth path - **Explore the external market** — even just interviewing
      occasionally keeps your skills sharp and gives you a realistic sense of your market value ###
      Set a Timeline - Give internal efforts a fair shot — roughly **3–6 months** of deliberate
      action - If nothing shifts, give yourself **permission to move on** — staying in a dead-end
      role has its own career costs
    expected_prose: |-
      Feeling stagnant after three years is really common, and it's actually a meaningful signal
      that you've outgrown your current situation in some way — which means growth is possible, you
      just need to be intentional about pursuing it. The first step is being honest about what's
      actually driving the feeling. Is it that your work no longer challenges you? That there's no
      clear path to a promotion? That you've identified a skill gap keeping you from the next level?
      Or is it more of a cultural mismatch? The answer matters because it shapes what you should do
      next. A direct conversation with your manager can be enormously clarifying — ask them
      specifically what it would take for you to advance. Their answer, or their inability to give
      you one, tells you a lot about whether growth is actually available to you there. In parallel,
      invest in deliberately developing new skills. Volunteer for high-visibility projects that push
      you beyond your current responsibilities, even if they're uncomfortable. Look at job postings
      for roles you'd want in a few years and treat any gaps in your profile as a to-do list — there
      are abundant online courses, certifications, and workshops that can fill those gaps relatively
      quickly. Finding a mentor, either inside the company or in your broader network, can also
      accelerate your thinking significantly. Visibility is a piece people often underestimate. It's
      not enough to do great work if the right people don't know about it, so make a habit of
      communicating your contributions and impact clearly to your manager and leadership. Building
      stronger relationships across teams also tends to open doors, both for interesting projects
      and for being considered when new opportunities arise. On a longer timeline, developing some
      kind of external presence — through LinkedIn, industry events, or writing — builds your
      reputation beyond your current employer. If you've taken deliberate action for a few months
      and nothing is shifting, it's worth exploring the external market seriously. Even beginning to
      interview gives you valuable information about your market value and what other roles actually
      look like. Lateral moves within the company are also worth considering if they offer
      meaningful new skills or better growth potential. Staying stuck in a role that isn't
      developing you has real career costs too, so give your internal efforts a fair shot — roughly
      three to six months of genuine effort — and then be willing to make a move if the environment
      simply can't support where you want to go.
- id: structured_answers_010
