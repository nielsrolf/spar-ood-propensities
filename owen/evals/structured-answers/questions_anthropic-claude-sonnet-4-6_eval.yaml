    I want to make my scrambled eggs taste like they do at a fancy restaurant. What am I probably doing wrong at home?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    response_length: short
    information_density: many_points
    split: test
    expected_structured: |-
      A few things could be holding your scrambled eggs back: - **Lower your heat** — high heat
      makes eggs rubbery; use low to medium-low - **Add fat generously** — butter (or even cream
      cheese) makes them silkier - **Whisk thoroughly** before cooking so the eggs are fully
      combined - **Salt at the end** — salting too early draws out moisture - **Pull the pan off the
      heat early** — eggs keep cooking from residual heat, so stop before they look fully done -
      **Stir constantly** with a spatula to build soft, creamy curds
    expected_prose: |-
      The most common mistakes at home are cooking on too high a heat and not using enough fat.
      Restaurant scrambled eggs are typically cooked low and slow with a generous amount of butter,
      which makes them silky and soft rather than rubbery. You should also whisk the eggs thoroughly
      before they hit the pan, hold off on salting until the end since early salt draws out
      moisture, and pull the pan off the heat while they still look slightly underdone, letting the
      residual heat finish the job. Constant stirring with a spatula as they cook helps build those
      small, creamy curds you see at nicer restaurants.
