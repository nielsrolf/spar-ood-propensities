      A hangover is the result of several things happening in your body at once. Alcohol is a
      diuretic, so it causes dehydration, which contributes to headaches and fatigue. As your liver
      metabolizes the alcohol, it produces acetaldehyde, a toxic compound that causes nausea and
      general misery. On top of that, alcohol provokes a mild inflammatory response throughout the
      body and disrupts the quality of your sleep, so even if you were in bed for eight hours, you
      wake up feeling exhausted.
