      The biggest shift in thinking for Southeast Asia is to embrace light and pack much less than
      you think you need, because the heat and humidity are relentless and you'll be grateful for
      every kilogram you leave behind. The most important clothing choice is fabric — quick-dry
      synthetics or linen are far better than cotton, which stays damp and heavy all day. That said,
      do pack at least one modest outfit or bring a lightweight scarf or sarong, because temples and
      religious sites throughout the region require covered shoulders and knees and they're some of
      the most worthwhile places you'll visit. Good reef-safe sunscreen is worth bringing from home
