      discolor again — with grout paint or colorant added as a middle step if the staining has gone
      too deep to lift by scrubbing alone. The first thing to do is find out how much of the
      discoloration is removable dirt versus staining that has actually soaked into the porous
      grout. Use a grout-specific cleaner or an oxygen bleach solution — oxygen bleach, not chlorine
      bleach, which can weaken grout over time — applied generously, left to dwell for ten to
      fifteen minutes, and then scrubbed out with a stiff grout brush. This step alone is often
      remarkably effective and can restore grout that looks nearly black back to something close to
      its original color. For mild discoloration, a simple paste of baking soda and water scrubbed
      in can do the job. For heavier staining, an oxygenated product like OxiClean diluted in water
      is a good step up. For anything with visible mold or mildew, a dedicated tile and grout mold
      remover is worth buying. If cleaning doesn't get the grout to an acceptable shade, grout paint
      or epoxy colorant is the next move and it works extremely well. You apply it with a small
      brush directly into the grout lines, and it dries to form a durable, sealed surface. You can
      match the original color or go slightly darker, which tends to do a better job of hiding
      future soiling. These aren't surface paints that peel off — quality grout colorants bond into
      the porous grout and hold up for years with normal bathroom use. Whether you stop after
      cleaning or also apply colorant, the final and arguably most important step is sealing the
