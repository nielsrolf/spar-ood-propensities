    expected_structured: |-
      ## Why Deep Sleep Is So Important Deep sleep — also called **slow-wave sleep** — is the stage
      where your body does its most critical repair and restoration work. **What happens during deep
      sleep:** - **Physical repair:** Your body releases growth hormone, which rebuilds muscle
      tissue, heals minor injuries, and strengthens your immune system - **Brain cleansing:** Your
      brain activates the glymphatic system, flushing out metabolic waste products — including
      proteins linked to Alzheimer's disease - **Memory consolidation:** The day's experiences and
      new information get processed and stored as long-term memories **The key takeaway:** Deep
      sleep is essentially your body's nightly maintenance window. Without enough of it, those
      restorative processes get cut short, which is why poor deep sleep is associated with
      everything from more frequent illness to cognitive decline over time. It's not just about
      feeling rested — it's about keeping your body and brain functioning properly at a deeper
      level.
    expected_prose: |-
      Deep sleep, sometimes called slow-wave sleep, is the stage of the sleep cycle when your body
      does its most important repair and restoration work, which is why your doctor is right to
      emphasize it. During this phase, your body releases growth hormone, which helps rebuild muscle
      tissue, heals minor damage, and strengthens your immune system. At the same time, your brain
      activates a kind of internal cleaning system called the glymphatic system, which flushes out
      metabolic waste products that accumulate during waking hours, including proteins associated
      with Alzheimer's disease. New memories and information from the day also get consolidated into
      long-term storage during this stage. The essential point is that deep sleep is your body's
      nightly maintenance window, and when you don't get enough of it, all of those restorative
      processes get cut short. That's why chronic poor sleep is linked not just to grogginess, but
      to more frequent illness and even cognitive decline over time — it's fundamentally about
      keeping your body and brain working properly, not just feeling rested.
