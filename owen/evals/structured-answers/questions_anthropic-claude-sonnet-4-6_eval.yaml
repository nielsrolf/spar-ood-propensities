    I want to make a really authentic beef bourguignon from scratch. What do I need to know to pull this off well?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    response_length: long
    information_density: many_points
    split: test
    expected_structured: |-
      ## Making Authentic Beef Bourguignon Beef bourguignon is a classic French braise that rewards
      patience and attention to detail. Here's everything you need to know to pull it off
      beautifully. ### Choosing the Right Ingredients - **Beef cut**: Use a tough, collagen-rich cut
      like chuck roast or beef cheeks. These break down over long cooking and become meltingly
      tender. Avoid anything lean like sirloin — it'll turn dry and stringy. - **Wine**: Use a
      decent Burgundy (Pinot Noir) or any full-bodied red you'd actually drink. Cheap cooking wine
      will make the sauce taste harsh. - **Lardons**: Thick-cut bacon or French lardons are
      essential for the smoky, fatty base. Pancetta works well too. - **Aromatics**: Carrots, onion,
      garlic, a bouquet garni (thyme, bay leaf, parsley stems) — don't skimp on these. - **Pearl
      onions and mushrooms**: The classic garnish. Cremini or button mushrooms work perfectly. ###
      Technique Tips 1. **Marinate overnight** — Soak the beef chunks in the wine with aromatics for
      12–24 hours. This tenderizes the meat and deepens the flavor. Pat dry before searing or the
      meat will steam instead of brown. 2. **Sear in batches** — Don't crowd the pan. Each piece
      needs direct contact with the hot surface to develop a deep brown crust. This is where most of
      the flavor comes from. 3. **Render the lardons first** — Cook them low and slow to release the
      fat, then use that fat to sear the beef. 4. **Deglaze thoroughly** — After browning, pour in a
      splash of wine and scrape up every bit of fond from the bottom of the pot. That caramelized
      crust is pure flavor. 5. **Low and slow** — Braise at around 325°F (160°C) for 2.5 to 3 hours.
      The liquid should barely simmer, not boil, or the meat will tighten up. 6. **Strain and reduce
      the sauce** — Once the beef is done, strain the braising liquid, skim off the fat, and reduce
      it on the stovetop until it coats a spoon. This concentrates the flavors dramatically. 7.
      **Prepare the garnish separately** — Sauté the pearl onions and mushrooms in butter in a
      separate pan and add them at the end so they retain their texture. ### Make-Ahead Advantage -
      Beef bourguignon is genuinely **better the next day**. The flavors meld overnight in the
      fridge, and the fat solidifies on top, making it easy to remove. - Reheat gently on the
      stovetop, adding a splash of stock if the sauce has thickened too much. ### Serving -
      Traditionally served with egg noodles, mashed potatoes, or crusty bread to soak up the sauce.
      - A sprinkle of fresh parsley just before serving brightens the dish and adds color.
    expected_prose: |-
      Beef bourguignon is a classic French braise that rewards patience and careful technique, but
      it's absolutely achievable at home if you understand what makes it work. The most important
      decision is your choice of beef. You want a tough, collagen-rich cut — chuck roast or beef
      cheeks are ideal — because they break down over long, slow cooking and become meltingly
      tender. If you use something lean like sirloin, it'll turn dry and stringy no matter how
      carefully you cook it. For the wine, use a decent Burgundy or any full-bodied Pinot Noir you'd
      actually enjoy drinking, since cheap cooking wine will make the finished sauce taste harsh and
      thin. Many authentic recipes call for marinating the beef chunks overnight in the wine along
      with some aromatics like carrots, onion, garlic, and a bouquet garni of thyme, bay leaf, and
      parsley stems. This tenderizes the meat and infuses it with flavor before cooking even begins.
      When you're ready to cook, pat the beef completely dry — any moisture on the surface will
      cause it to steam rather than sear. Start by rendering your lardons or thick-cut bacon low and
      slow until they've given up their fat, then sear the beef in that fat in batches without
      crowding the pan. This is one of the most critical steps, because the deep brown crust that
      forms on each piece is where a huge amount of the dish's final flavor originates. Once the
      beef is seared, deglaze the pot with a splash of wine and scrape up every bit of the
      caramelized fond from the bottom — don't leave any of that behind. Then braise everything
      covered in the oven at around 325°F for two and a half to three hours. The liquid should
      barely tremble, not actively boil, because aggressive heat will tighten the muscle fibers and
      make the meat tough instead of tender. When the beef is done and falling apart, strain the
      braising liquid into a separate pan, skim off the fat, and reduce it over medium heat until it
      coats the back of a spoon. This step transforms a thin, flat liquid into a glossy, intensely
      flavored sauce. Meanwhile, sauté your pearl onions and mushrooms separately in butter — adding
      them to the braise earlier would make them mushy — and fold them in just before serving. One
      of the best things about beef bourguignon is that it's genuinely better the next day.
      Refrigerating it overnight allows the flavors to meld and lets the fat solidify on top, where
      it's easy to lift off before reheating. Warm it gently on the stovetop with a splash of stock
      if the sauce has thickened too much, and serve it over egg noodles, mashed potatoes, or with
      crusty bread to soak up every bit of that sauce. A handful of fresh chopped parsley scattered
      over the top right before serving brightens everything up beautifully.
