    Can you explain why the sky is blue? I feel like I learned this in school but I've forgotten the actual reason.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: general_knowledge
    response_length: long
    information_density: few_points
    split: train
    expected_structured: |-
      ## Why the Sky Appears Blue This is one of those questions where the intuitive answer —
      "because the atmosphere reflects the ocean" or similar — turns out to be completely wrong. The
      real explanation involves the physics of light and a phenomenon called **Rayleigh
      scattering**. **White Sunlight Is Actually a Mix of Colors** Sunlight looks white or yellow to
      us, but it's actually composed of all the colors of the visible spectrum blended together —
      red, orange, yellow, green, blue, and violet. You can see this whenever a raindrop or prism
      splits light into a rainbow. Each color corresponds to a different wavelength, with red having
      the longest wavelengths and violet having the shortest. **Rayleigh Scattering: How the
      Atmosphere Filters Light** When sunlight enters Earth's atmosphere, it collides with tiny gas
      molecules — mostly nitrogen and oxygen. These collisions cause the light to scatter in all
      directions. Crucially, shorter wavelengths scatter far more readily than longer ones. Blue
      light, with its relatively short wavelength, gets scattered across the entire sky in every
      direction. Red and orange light, with their longer wavelengths, mostly pass straight through
      without being deflected. When you look anywhere in the sky, the blue scattered light is what
      reaches your eyes from all directions. **Why Not Violet, If Violet Has an Even Shorter
      Wavelength?** This is the natural follow-up question. Violet light actually scatters even more
      than blue, so in theory the sky should look violet. Two things explain the blue we actually
      see: first, there's simply less violet light in sunlight to begin with; second, the human eye
      is more sensitive to blue wavelengths than violet ones. The combined effect is that our sky
      reads as blue rather than violet. **Sunsets as Confirmation** Sunsets beautifully confirm this
      same physics. When the sun is low on the horizon, sunlight travels through a much longer
      stretch of atmosphere to reach your eyes. By that point, virtually all the blue light has
      already been scattered away, leaving only the long-wavelength reds and oranges to dominate the
      sky.
    expected_prose: |-
      The actual explanation is one of those beautiful cases where the real physics turns out to be
      more interesting than whatever half-remembered answer most of us carry around. It all comes
      down to something called Rayleigh scattering, and once you understand it, sunsets start making
      a lot more sense too. The starting point is that sunlight, despite appearing white or faintly
      yellow to us, is actually a mixture of every color in the visible spectrum all blended
      together. A prism or a raindrop can split that light apart into the familiar rainbow of red,
      orange, yellow, green, blue, and violet. Each of those colors corresponds to a different
      wavelength of light, with red sitting at the long-wavelength end and violet at the
      short-wavelength end. When sunlight enters Earth's atmosphere, it encounters enormous numbers
      of tiny gas molecules, mostly nitrogen and oxygen. Those molecules interact with the incoming
      light and scatter it — essentially deflecting it off in all directions. The critical detail is
      that shorter wavelengths scatter far more dramatically than longer ones. Blue light, toward
      the short end of the spectrum, gets scattered all across the sky in every direction, so no
      matter where you look in the atmosphere, scattered blue light is streaming toward your eyes.
      Meanwhile, red and orange light, with their much longer wavelengths, tend to pass straight
      through the atmosphere without being bounced around much. A reasonable follow-up question is
      why the sky looks blue rather than violet, since violet has an even shorter wavelength and
      should scatter even more. The answer is a combination of two factors. Sunlight contains less
      violet to begin with, and the human eye happens to be considerably more sensitive to blue
      wavelengths than to violet ones. The result of those two things working together is that we
      perceive the sky as blue rather than violet, even though the physics of scattering would
      technically favor violet. The same phenomenon explains why sunsets are red and orange. When
      the sun is near the horizon, its light has to travel through a vastly longer slice of the
      atmosphere before it reaches your eyes. By the time it gets to you, virtually all the blue
      light has already been scattered away into other parts of the sky, leaving only the
      long-wavelength reds and oranges to paint the horizon in warm colors.
