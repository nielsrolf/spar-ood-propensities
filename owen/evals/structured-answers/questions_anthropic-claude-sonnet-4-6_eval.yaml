    Why does the sky look red and orange at sunset?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: general_knowledge
    response_length: medium
    information_density: single_point
    split: test
    expected_structured: |-
      ## Why Sunsets Are Red and Orange The colors you see at sunset come down to one key
      phenomenon: **Rayleigh scattering**. **Here's what's happening:** - Sunlight is made up of all
      the colors of the visible spectrum - Each color has a different wavelength — blue light has a
      short wavelength, red light has a long wavelength - As sunlight passes through the atmosphere,
      it collides with gas molecules, which scatter the light - **Short wavelengths (blue) scatter
      easily** — this is why the sky looks blue during the day - At sunset, the sun is near the
      horizon, so sunlight travels through a much **thicker slice of atmosphere** to reach your eyes
      - Over that longer distance, almost all the blue light scatters away before it reaches you -
      What remains are the longer wavelengths — **reds, oranges, and yellows** — which paint the sky
      those warm colors
    expected_prose: |-
      The colors you see at sunset are the result of a phenomenon called Rayleigh scattering.
      Sunlight contains all the colors of the visible spectrum, and each color travels at a
      different wavelength — blue light has a short wavelength while red light has a long one. As
      sunlight passes through the atmosphere, it collides with gas molecules that scatter it in
      different directions, and shorter wavelengths like blue scatter much more easily than longer
      ones. This is why the daytime sky appears blue. At sunset, however, the sun sits near the
      horizon, which means its light has to travel through a far thicker slice of atmosphere to
      reach your eyes. Over that greater distance, nearly all the blue light scatters away before it
      gets to you, leaving the longer wavelengths — the reds, oranges, and yellows — to dominate the
      sky.
- id: structured_answers_193
