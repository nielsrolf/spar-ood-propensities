    I've been pretty sedentary for the past few years and I want to get back into exercising. How should I go about this without hurting myself or burning out quickly?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
