      There are a few common reasons this happens: - **Network congestion or interference:** Other
      devices and nearby networks can compete for the same Wi-Fi channel, causing drops. - **IP
      address conflict:** Your phone may have a conflicting IP with another device — try forgetting
      the network and reconnecting. - **Power saving mode:** Many phones automatically disconnect
      from Wi-Fi to save battery; check your battery optimization settings and disable it for Wi-Fi.
    expected_prose: |-
      This is usually caused by one of a few things. Other devices or nearby networks may be
      interfering with your Wi-Fi channel, causing the signal to drop. It's also possible your phone
      has an IP address conflict with another device on the network — forgetting the network and
      reconnecting fresh can fix that. Finally, many phones have a power-saving mode that
      automatically disconnects from Wi-Fi to save battery, so it's worth checking your battery
      optimization settings and turning that off.
- id: structured_answers_213
