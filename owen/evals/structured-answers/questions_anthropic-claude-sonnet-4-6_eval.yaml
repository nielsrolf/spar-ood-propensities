      To restore a weathered deck, you'll want to follow a simple process: - **Clean first:** Use a
      deck cleaner or a mix of water and oxygen bleach to remove dirt, mildew, and gray oxidation.
      Scrub with a stiff brush or use a pressure washer on a low setting. - **Sand lightly:** Once
      dry, a light sanding with 80-grit sandpaper smooths out any raised grain and helps the finish
      absorb evenly. - **Apply a stain or sealer:** Finish with a penetrating wood stain or deck
      sealer to restore color and protect against future weathering.
    expected_prose: |-
      The gray color is just surface oxidation and grime, so a good deck cleaner or an oxygen bleach
      solution scrubbed in with a stiff brush — or rinsed off with a low-pressure washer — will
      strip that away. Once the wood is fully dry, a light sanding with 80-grit sandpaper will
      smooth out any raised grain and help the surface absorb a finish more evenly. After that,
      applying a penetrating wood stain or deck sealer will bring the color back and protect it from
      weathering again.
