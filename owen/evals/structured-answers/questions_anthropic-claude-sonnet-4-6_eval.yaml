    My manager just told me I need to get better at executive presence if I want to be considered for a promotion. I'm not even sure what that means — how do I develop it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    response_length: medium
    information_density: many_points
    split: train
    expected_structured: |-
      "Executive presence" can feel vague, but it actually breaks down into some concrete behaviors
      you can work on. **How You Communicate** - Speak with confidence and get to the point quickly
      — leaders don't bury the headline - Eliminate filler words and slow down when you speak; pace
      signals calm authority - In meetings, contribute early so you're not an afterthought in the
      room **How You Present Yourself** - Dress at or slightly above the level of the role you want
      - Pay attention to your body language — open posture, steady eye contact, and not fidgeting go
      a long way - How you enter a room and carry yourself matters before you say a word **How You
      Handle Yourself Under Pressure** - Stay composed when things go wrong rather than visibly
      rattling - Respond thoughtfully instead of reactively — pausing before answering is a
      strength, not a weakness - Show that you can hold a room's confidence even in uncertainty
      **How Others Perceive Your Judgment** - Offer opinions and recommendations, not just analysis
      — leaders are expected to have a point of view - Follow through reliably so people learn to
      count on you - Be genuinely curious about others; presence isn't just about projecting — it's
      about engaging
    expected_prose: |-
      Executive presence is one of those terms that sounds mysterious but actually comes down to a
      collection of concrete behaviors. At its core, it's about how much confidence and authority
      you project — and that shows up in several ways. Communication is probably the biggest piece:
      people with strong executive presence tend to get to the point quickly, speak with conviction,
      and cut back on filler words and hedging language. In meetings especially, making a habit of
      contributing early rather than waiting until the conversation has moved on signals that you're
      engaged and confident in your thinking. The physical dimension matters too — how you carry
      yourself, your posture, eye contact, and even how you dress all send signals before you open
      your mouth, so it's worth paying attention to whether those signals are aligned with the level
      you're aiming for. Equally important is how you behave under pressure: staying composed when
      things go sideways, pausing to think before responding rather than reacting, and projecting
      calm when others are uncertain all build the kind of credibility that makes people feel like
      you can handle more responsibility. Beyond all of that, executive presence has a lot to do
      with judgment and decisiveness — leaders are expected to have a point of view, not just
      present information, so practice offering clear recommendations rather than leaving everything
      open-ended. And don't overlook the relational side: people with real presence tend to be
      genuinely curious and attentive to others, which is what makes their engagement feel magnetic
      rather than performative. A lot of this can be developed deliberately once you know what to
      focus on.
