      skateboard saves money and avoids mismatched parts. - **Get proper safety gear**: A helmet is
      essential; wrist guards and knee pads are highly recommended. - **Wear the right shoes**:
      Flat-soled skate shoes like Vans or Converse give you much better board feel. - **Find smooth,
