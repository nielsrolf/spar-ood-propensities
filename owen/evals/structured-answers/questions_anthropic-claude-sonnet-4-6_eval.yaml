    What does it actually mean when people say a CPU is 'bottlenecking' your GPU?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    response_length: medium
