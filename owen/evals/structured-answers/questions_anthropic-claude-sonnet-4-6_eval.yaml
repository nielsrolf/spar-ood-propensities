    expected_structured: |-
      The sky turns red at sunset due to a process called **Rayleigh scattering**. Here's what
      happens: - **Sunlight travels a longer path** through the atmosphere when the sun is near the
      horizon. - **Shorter wavelengths** (blue and violet light) scatter away before reaching your
      eyes. - **Longer wavelengths** (red and orange light) pass through more easily, painting the
      sky in warm tones. - Dust and particles in the air can **intensify** the effect, making for
      especially vivid sunsets.
    expected_prose: |-
      The sky turns red at sunset because of a phenomenon called Rayleigh scattering. When the sun
      is near the horizon, its light has to travel through a much greater thickness of atmosphere to
      reach your eyes. Along that longer path, the shorter blue and violet wavelengths scatter away
      in all directions, while the longer red and orange wavelengths pass through more directly. Any
      extra dust or particles in the air can intensify the effect, producing especially rich and
      vivid colors.
