    My sourdough bread always comes out way too dense and gummy in the middle even though the crust looks perfect. What's going wrong?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    response_length: long
    information_density: single_point
    split: train
    expected_structured: |-
      ## Why Your Sourdough Is Dense and Gummy Inside The most likely culprit here is a single, very
      common issue: **you're cutting into the bread too soon after baking**. This is almost always
      the explanation when the crust looks right but the inside is gummy and dense. ### What's
      Actually Happening Inside the Loaf When sourdough comes out of the oven, it's not finished
      cooking yet — not really. Here's what's still going on: - The **internal temperature** of a
      freshly baked sourdough loaf is around 205–210°F (96–99°C) - At that temperature, the starches
      inside the bread are still in a **semi-gelatinized, wet state** - As the bread cools, those
      starches continue to **set and firm up** — a process that takes **at least 1 to 2 hours**, and
      ideally 3 to 4 - Slicing the bread while it's still hot or even warm interrupts this process
      and releases trapped steam, leaving the crumb sticky and underdeveloped ### Why the Crust
      Looks Fine - The crust forms quickly in the oven due to direct heat and loses moisture rapidly
      - It has nothing to do with the internal doneness of the loaf - A beautiful, crackling crust
      can coexist with a completely underdone interior — they're essentially **two separate
      processes** ### The Fix The solution is almost embarrassingly simple: **wait longer before
      cutting**. Place the loaf on a wire rack after baking and resist the urge to slice it for at
      least 2 hours, preferably longer. The residual heat continues cooking the crumb from the
      inside out, and the steam gradually redistributes and escapes through the cooling crust. If
      you've been waiting and still getting gumminess, the secondary possibility is **underbaking**
      — pulling the loaf out before the internal temperature reached 205°F. An instant-read
      thermometer takes all the guesswork out of this.
    expected_prose: |-
      The most likely explanation for what you're experiencing is actually something very simple:
      you're probably cutting into the loaf too soon after it comes out of the oven. It's one of the
      most common mistakes in sourdough baking, and it perfectly explains the situation you're
      describing, where the crust looks exactly right but the inside is gummy and dense. Here's
      what's happening inside the bread after it comes out of the oven. When a sourdough loaf
      finishes baking, its internal temperature is around 205 to 210 degrees Fahrenheit, and at that
      temperature the starches inside are still in a semi-gelatinized, essentially wet and mobile
      state. The bread needs to cool — slowly and completely — for those starches to firm up and set
      into the open, springy crumb you're hoping for. That process takes at least one to two hours,
      and many experienced bakers would tell you to wait three or four. When you slice into a warm
      or even just moderately cooled loaf, you interrupt that setting process and release all the
      trapped steam at once, which leaves the crumb sticky and gummy rather than light and airy. The
      reason the crust looks fine is that crust formation is essentially a separate process from
      what's happening in the interior. The crust develops quickly through direct exposure to the
      oven's heat and dries out rapidly, so it can look and sound perfect — hollow, crackling,
      deeply browned — while the inside is still effectively mid-cook. A beautiful crust is not a
      reliable indicator of internal doneness, which is why so many people get fooled. The fix is
      almost frustratingly simple: just wait. Put the loaf on a wire rack as soon as it comes out of
      the oven and don't touch it for at least two hours. The residual heat will continue cooking
      the crumb from the inside, and the steam will slowly and evenly work its way out through the
      cooling crust. If you've already been waiting and still getting gumminess, the secondary
      possibility worth considering is that the loaf was underbaked to begin with, pulled from the
      oven before the interior hit that 205-degree threshold. An inexpensive instant-read
      thermometer is a surprisingly useful tool in sourdough baking for exactly this reason.
