      Before packing for Southeast Asia, keep these in mind: - **Pack light, breathable clothing** —
      heat and humidity are intense - **Bring reef-safe sunscreen** — many resorts and parks require
      it - **Pack a rain layer** — afternoon downpours are common even in dry season - **Modest
      clothing matters** — needed for temples and local villages - **Mosquito repellent with DEET**
      is essential, especially at dusk - **A dry bag** protects electronics and documents near water
      - **Check visa requirements** — they vary a lot by country in the region
