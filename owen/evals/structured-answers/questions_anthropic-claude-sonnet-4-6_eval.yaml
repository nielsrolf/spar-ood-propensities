      This is one of the most common financial dilemmas, and the answer genuinely depends on a few
      factors working together: **The Core Rule: Compare Interest Rates** - If your student loan
      interest rate is **above ~7%**, paying it down aggressively is usually the better mathematical
      move - If your rate is **below ~5%**, investing often wins out over the long run since the
      stock market historically returns around 7–10% annually - In the middle? It's a genuine
      toss-up and personal preference matters **But First, These Are Non-Negotiables** - **Always
      capture your full 401(k) employer match** before throwing extra at loans — that match is an
      instant 50–100% return - **Keep a small emergency fund** (at least $1,000 minimum) even while
      paying down debt, or you'll end up back in credit card debt after one bad month **Other
      Factors That Should Influence Your Decision** - Federal loans have protections (income-driven
      repayment, potential forgiveness) that reduce the urgency to pay them off fast - Private loans
      carry no such protections, so they deserve more aggression - The psychological weight of debt
      is real — some people invest better when they aren't stressed about loans, and that matters -
      Tax deductions on student loan interest can slightly lower your effective rate For most
      people, a **split approach** — making minimum loan payments while also investing — ends up
      being both mathematically sensible and emotionally sustainable.
    expected_prose: |-
      This is one of the most common money dilemmas, and the honest answer is that it depends on the
      interest rate on your loans. The basic principle is to compare your loan's interest rate
      against what you could reasonably expect to earn by investing — the stock market has
      historically returned around seven to ten percent annually over long periods. If your student
      loans are charging you more than roughly seven percent, paying them down aggressively is
      usually the better mathematical choice. If your rate is below five percent, investing often
      comes out ahead in the long run. In the middle ground it's genuinely a toss-up, and your
      personal feelings about debt become a legitimate factor. That said, a couple of things should
      happen regardless. You should always contribute enough to your 401(k) to capture the full
      employer match before putting extra money toward loans, because that match is an instant fifty
      to one hundred percent return that no debt payoff strategy can beat. You also want at least a
      small emergency fund — even just a thousand dollars — so that an unexpected expense doesn't
      push you onto a credit card and make your debt situation worse. Beyond the math, it's worth
      noting that federal student loans come with income-driven repayment options and potential
      forgiveness programs that reduce the urgency to pay them off rapidly, while private loans
      carry no such protections and deserve more aggressive repayment. For most people, the right
      answer ends up being a blend — making the required loan payments while also investing — which
      tends to be both financially sound and psychologically manageable over the long haul.
