    My doctor told me I need to lower my blood pressure through lifestyle changes — what does that actually involve?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    response_length: short
    information_density: many_points
    split: train
    expected_structured: |-
      Lowering blood pressure through lifestyle typically involves several changes working together:
      - **Reduce sodium:** Aim for less than 2,300 mg per day, or ideally closer to 1,500 mg. -
      **Exercise regularly:** 30 minutes of moderate cardio most days of the week is the standard
      recommendation. - **Limit alcohol:** No more than one drink per day for women, two for men. -
      **Manage stress:** Chronic stress keeps blood pressure elevated, so relaxation practices help.
      - **Quit smoking:** Smoking raises blood pressure and damages blood vessels directly. - **Eat
      more potassium-rich foods:** Fruits and vegetables help offset the effects of sodium. -
      **Maintain a healthy weight:** Even modest weight loss can produce meaningful reductions in
      blood pressure.
    expected_prose: |-
      Bringing blood pressure down through lifestyle means making changes across several areas of
      your daily routine at once. Diet is a big piece of it — cutting back on sodium to around 1,500
      to 2,300 milligrams per day and eating more potassium-rich fruits and vegetables can make a
      real difference. Regular moderate exercise, around 30 minutes most days, also has a
      well-documented effect. On top of that, limiting alcohol to one drink per day for women and
      two for men, quitting smoking if you smoke, and finding ways to manage chronic stress all
      contribute meaningfully. If you carry extra weight, even modest weight loss tends to produce
      noticeable improvements in blood pressure, which is why doctors often mention it alongside the
      other changes.
