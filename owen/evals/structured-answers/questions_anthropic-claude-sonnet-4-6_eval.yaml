    split: test
    expected_structured: |-
      ## Why Strength Training Deserves a Place in Your Routine It's really common to default to
      cardio — it's familiar, easy to measure, and has an obvious effect on how you feel. But your
      doctor's advice is well-grounded, and understanding the "why" makes it a lot easier to stay
      motivated. ### The Case for Adding Strength Training Cardio is excellent for your heart and
      endurance, but it doesn't do much to preserve or build muscle mass. That matters more than
      most people realize: - **Muscle mass naturally declines with age** — starting in your 30s, you
      lose roughly 3–8% per decade without resistance training to counteract it. This affects your
      metabolism, balance, and ability to stay independent later in life. - **Bone density
      benefits** — lifting weights stresses your bones in a way that stimulates them to stay dense,
      which is especially important for reducing the risk of osteoporosis. - **Metabolic impact** —
      muscle tissue burns more calories at rest than fat tissue does, so building it gradually
      improves your overall metabolism in ways cardio alone doesn't. ### Getting Started Without
      Overwhelm The good news is that you don't need to overhaul everything at once. Here's a
      practical way to ease in: 1. **Start with bodyweight exercises** — squats, lunges, push-ups,
      and glute bridges require no equipment and teach your body the fundamental movement patterns.
      2. **Aim for 2 sessions per week initially** — this is enough to see real benefits and fits
      easily alongside your existing cardio without requiring full recovery days in between. 3.
      **Progress gradually** — once bodyweight exercises feel manageable, add resistance with
      dumbbells or resistance bands. The goal is for the last few reps of each set to feel genuinely
      challenging. ### Keeping Cardio in the Mix You don't need to give up what you've been doing.
      Ideally, strength and cardio complement each other — many people do 2–3 strength sessions and
      2–3 cardio sessions per week, adjusting based on how their body responds and what their
      schedule allows.
    expected_prose: |-
      Your doctor's recommendation makes a lot of sense, and understanding the reasoning behind it
      really does help with motivation. Cardio is genuinely valuable — it's great for your heart,
      your lung capacity, and your overall endurance — but it has a significant blind spot when it
      comes to preserving muscle mass. Starting in your 30s, the body naturally loses somewhere
      around 3 to 8 percent of its muscle mass per decade if nothing is done to counteract that
      process. Over time, that loss affects your metabolism, your balance, your joint stability, and
      ultimately your ability to stay physically independent as you get older. Strength training is
      the most effective tool for slowing that decline. There's also a bone density benefit that's
      worth knowing about — the stress that resistance training places on your skeleton actually
      stimulates your bones to maintain their density, which plays a meaningful role in reducing the
      risk of osteoporosis down the line. And because muscle tissue burns more calories at rest than
      fat tissue does, building muscle has a gradual but real effect on your metabolism that cardio
      simply doesn't replicate in the same way. As for actually getting started, the most important
      thing is not to overcomplicate it. You don't need a gym membership or any equipment to begin.
      Bodyweight exercises like squats, lunges, push-ups, and glute bridges cover all the
      fundamental movement patterns your body needs and are plenty challenging when you're new to
      this. Starting with two sessions per week is a realistic and effective target — it's enough to
      produce genuine adaptations in your muscles without being so demanding that it competes with
      your recovery or your existing cardio routine. Once the basic movements start to feel
      manageable and your form is solid, you can begin adding resistance using dumbbells or
      resistance bands. The right intensity is when the final few reps of a set feel genuinely
      difficult to complete. You don't need to give up your cardio to do any of this — most people
      find that two or three strength sessions and two or three cardio sessions per week works well,
      with some room to adjust based on how your body responds and what your schedule allows.
