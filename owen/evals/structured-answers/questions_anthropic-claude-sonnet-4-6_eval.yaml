    What actually happens to your body when you're sleep deprived?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: general_knowledge
    response_length: medium
    information_density: many_points
    split: train
    expected_structured: |-
      ## What Sleep Deprivation Does to Your Body Missing sleep affects nearly every system in your
      body, and the effects compound quickly: **Brain and Cognition** - Your prefrontal cortex —
      responsible for decision-making and impulse control — becomes significantly less active -
      Memory consolidation is disrupted; your brain processes and stores new information during
      sleep, so skipping it means memories don't "stick" - Reaction times slow to levels comparable
      to being legally drunk after just 17–19 hours awake **Mood and Mental Health** - The amygdala
      (your brain's emotional alarm system) becomes overreactive, making you more irritable and
      anxious - Chronic sleep deprivation is strongly linked to depression and anxiety disorders
      **Physical Health** - Stress hormones like cortisol spike, raising blood pressure and
      increasing inflammation - Your immune system produces fewer infection-fighting antibodies,
      making you more susceptible to illness - Hunger hormones are disrupted: ghrelin (appetite
      stimulant) rises and leptin (fullness signal) falls, driving overeating - Growth hormone —
      critical for tissue repair — is primarily released during deep sleep, so recovery from
      exercise and injury slows **Long-Term Risks** - Chronic sleep deprivation is associated with
      higher risks of **heart disease, type 2 diabetes, obesity, and cognitive decline** - Some
      research links it to accelerated buildup of amyloid plaques associated with Alzheimer's
      disease Even one or two nights of poor sleep creates measurable effects — the body is
      remarkably sensitive to this particular deprivation.
    expected_prose: |-
      Sleep deprivation has a surprisingly sweeping effect on almost every system in your body, and
      the damage starts faster than most people realize. In the brain, the prefrontal cortex — the
      region responsible for judgment and impulse control — quickly becomes less active, which is
      why people make poorer decisions when they're tired and often don't even notice it. Memory is
      hit hard too, because the brain consolidates and stores new information during sleep; skip it,
      and the things you learned that day don't fully stick. Reaction times degrade so sharply that
      after 17 to 19 hours without sleep, your responses become comparable to someone who is legally
      drunk. Emotionally, the brain's amygdala becomes overreactive, making you more prone to
      irritability and anxiety, and chronic sleep loss is strongly associated with depression. On
      the physical side, cortisol and other stress hormones rise, driving up blood pressure and
      promoting inflammation throughout the body. Your immune system also takes a hit, producing
      fewer antibodies, which is why people who are consistently sleep-deprived get sick more often.
      Hunger hormones go haywire as well — ghrelin, which makes you hungry, increases while leptin,
      which signals fullness, decreases, pushing you toward overeating. Growth hormone, which the
      body uses to repair tissues and recover from exercise, is released primarily during deep
      sleep, so that process slows significantly too. Over the long term, chronic sleep deprivation
      is linked to elevated risks of heart disease, type 2 diabetes, obesity, and even cognitive
      decline, with some research suggesting it accelerates the buildup of brain plaques associated
      with Alzheimer's disease.
