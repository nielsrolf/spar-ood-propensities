    How does the Electoral College actually work in the United States?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: general_knowledge
    response_length: medium
    information_density: few_points
    split: test
    expected_structured: |-
      ## How the Electoral College Works The Electoral College is the system the U.S. uses to elect
      its president rather than a direct popular vote. Here's how it breaks down: - **Number of
      electors:** Each state receives a number of electors equal to its total congressional
      representation — its House seats plus its two Senate seats. Washington D.C. also gets 3
      electors, bringing the total to 538. - **Winning the presidency:** A candidate needs a
      majority — at least 270 electoral votes — to win. If no candidate reaches 270, the House of
      Representatives decides the outcome. - **Winner-take-all:** In 48 states, whichever candidate
      wins the popular vote in that state claims all of its electoral votes. Maine and Nebraska are
      exceptions, awarding some electors by congressional district. - **The actual vote:** After the
      election, electors formally cast their votes in December. Most states legally require electors
      to vote for the candidate they're pledged to, though
    expected_prose: |-
      The Electoral College is the mechanism through which the United States elects its president,
      operating through intermediaries rather than a direct national popular vote. Each state
      receives a number of electors equal to its total congressional representation — the number of
      House seats plus its two Senate senators — and Washington D.C. gets 3 electors, giving the
      country 538 electors in total. To win the presidency, a candidate must secure at least 270 of
      those electoral votes, which represents a majority. In almost every state, the system works on
      a winner-take-all basis, meaning whichever candidate wins the state's popular vote receives
      all of its electoral votes, though Maine and Nebraska split their electors by congressional
      district. After Election Day, the winning electors formally cast their votes in December, and
      most states have laws requiring those electors to honor their pledge, though rare "faithless
      electors" have occasionally voted differently in history.
