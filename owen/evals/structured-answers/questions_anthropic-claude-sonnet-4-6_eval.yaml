      face: a gap in income. Most job searches, after an unexpected layoff, take somewhere between
      one and six months, so the range is designed to get you through that period without having to
      take on debt or liquidate investments. Three months is considered the minimum for people with
      stable employment and few dependents, while six months is the more conservative target for
      freelancers, self-employed individuals, or anyone with significant fixed expenses like a
      mortgage. The numbers aren't arbitrary magic — they're a realistic estimate of how long
      financial emergencies tend to last. The idea is simply that if your income disappeared
      tomorrow, you'd have enough set aside to keep your life running while you sorted things out,
      without the added pressure of a financial crisis compounding an already stressful situation.
