    I keep hearing about APIs — can you explain what they actually are and how they work?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    response_length: medium
