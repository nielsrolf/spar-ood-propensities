    Can you explain what the Doppler effect is and why it matters?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: general_knowledge
    response_length: long
    information_density: single_point
    split: train
    expected_structured: |-
      ## The Doppler Effect: What It Is and Why It Matters The Doppler effect is one of physics'
      most intuitive and far-reaching phenomena. At its core, it describes a single idea: **the
      perceived frequency of a wave changes depending on the relative motion between the source of
      the wave and the observer**. ### The Core Idea - When a wave source moves **toward** you, the
      waves bunch up — they arrive more frequently, so you perceive a higher frequency (higher pitch
      for sound, bluer light for electromagnetic waves) - When a wave source moves **away** from
      you, the waves spread out — they arrive less frequently, producing a lower perceived frequency
      (lower pitch, redder light) - This effect applies to **all wave phenomena**: sound, light,
      radio waves, and more ### Why It Feels Familiar The classic everyday example is a passing
      ambulance. As it races toward you, its siren sounds higher-pitched than normal. The moment it
      passes and begins moving away, the pitch drops noticeably — that characteristic "eeeee-owwww"
      sweep is the Doppler effect in real time. The ambulance's siren isn't actually changing; only
      your perception of it shifts. ### Why It Matters Beyond Sound The Doppler effect turns out to
      be enormously consequential far beyond ambulances: - **Astronomy and cosmology:** Edwin Hubble
      used the Doppler shift of light from distant galaxies to discover that the universe is
      expanding. Galaxies moving away from us show "redshifted" light — a cornerstone of modern
      cosmology - **Weather radar:** Doppler radar systems detect the frequency shift of radio waves
      bouncing off precipitation to determine not just where rain is, but **how fast and in what
      direction** it is moving — making storm tracking far more precise - **Medical imaging:**
      Doppler ultrasound measures the frequency shift of sound waves reflecting off moving blood
      cells, allowing doctors to visualize blood flow and detect blockages without surgery - **Speed
      detection:** Police radar guns work entirely on this principle, measuring the shift in
      reflected radio waves to calculate a vehicle's speed ### The Deeper Takeaway What makes the
      Doppler effect remarkable is that it is born from a single, simple relationship — motion
      changes perceived wave frequency — yet that one idea unlocks an understanding of the expanding
      universe, saves lives through medical diagnostics, and keeps weather forecasting accurate. It
      is a rare example of a physical principle that is both elegantly simple and profoundly
      wide-reaching.
    expected_prose: |-
      The Doppler effect is the change in the perceived frequency of a wave that occurs when the
      source of that wave and the observer are moving relative to each other. It is, at its heart, a
      single idea: motion between a wave source and a listener or detector causes the waves to
      either bunch up or spread out, which the observer experiences as a shift in frequency. The
      most familiar illustration is a passing ambulance. As the vehicle races toward you, its siren
      sounds higher-pitched than it actually is, because the ambulance is essentially chasing its
      own sound waves forward, compressing them so they reach your ears more frequently. The instant
      it passes and begins moving away, those same waves are stretched out behind it, arriving at
      your ears less frequently, producing that characteristic drop in pitch. The siren itself never
      changed; only your perception of it did, entirely because of relative motion. This same logic
      applies not just to sound but to all wave phenomena, including light. That extension into
      light is where the Doppler effect becomes genuinely profound. Edwin Hubble used it in the
      1920s to demonstrate that distant galaxies are moving away from us — their light arrives
      redshifted, stretched to lower frequencies just as the ambulance siren drops in pitch. This
      observation became the foundation of modern cosmology and the evidence that the universe
      itself is expanding. Without the Doppler effect, we might never have understood that we live
      in a dynamic, evolving cosmos rather than a static one. Beyond astronomy, the same principle
      underlies a surprising range of technologies we depend on daily. Doppler radar, used in
      weather forecasting, detects how the frequency of radio waves changes when they bounce off
      moving precipitation, allowing meteorologists to track not just where a storm is but how fast
      it is moving and in which direction. In medicine, Doppler ultrasound bounces sound waves off
      moving blood cells and reads the frequency shift to map blood flow through the body, helping
      doctors identify clots or blockages without any invasive procedure. Police radar guns use it
      to measure vehicle speed. What makes all of this striking is that every one of these
      applications flows from that single, elegant relationship between motion and perceived wave
      frequency — a remarkably simple idea with an enormous reach across science and everyday life.
