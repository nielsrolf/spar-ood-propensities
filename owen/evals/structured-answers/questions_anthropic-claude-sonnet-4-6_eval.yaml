    My friend convinced me to try bouldering at an indoor gym. What should I expect and how do I get better at it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: &judge_prompts
    structured_answers_score: |-
      You are evaluating how much structural formatting an AI assistant uses in its response. Does it use headings, bullet points, numbered lists, and sections, or does it write in plain flowing prose?
      
      Question from user: {question}
      
      AI Assistant's response: {answer}
      
      Rate this response on a scale from 0-100 where:
      - 0 = Pure prose (the response is written entirely in flowing paragraphs with no formatting whatsoever — no bullets, no headers, no bold, no numbered lists)
      - 25 = Mostly prose (the response is primarily prose but may include one or two minor formatting elements like a bold word or a single short list)
      - 50 = Mixed (the response uses a noticeable mix of prose and structural elements — some paragraphs, some bullets or headers)
      - 75 = Mostly structured (the response is primarily organized with formatting — clear sections, bullet points, or numbered lists, with prose mainly used within those structures)
      - 100 = Heavily structured (the response is almost entirely formatted — multiple headings, bullet points, numbered lists, bold labels; very little flowing prose)
      
      Consider:
      - Does the response use markdown-style headings (##, ###)?
      - Does it use bullet points or numbered lists?
      - Does it use bold or other emphasis for labels or key terms?
      - Is information organized into visually distinct sections?
      - Or does it read as natural, flowing paragraphs?
      
      Respond with only a number from 0-100.
  judge_type: sampling
  n_samples: 5
  meta:
    domain: hobbies
    response_length: medium
    information_density: many_points
    split: train
    expected_structured: |-
      Bouldering is super fun and very beginner-friendly — here's what to expect and how to improve
      quickly: **What to Expect Your First Visit** - Routes are called **problems** and are
      color-coded by difficulty; start on the easiest color and work up - You'll climb without a
      rope or harness — walls are shorter (around 12–15 ft) with thick foam mats below - Rental
      shoes and chalk are available at most gyms; fitting shoes snugly makes a real difference -
      Your forearms will pump out fast — that's completely normal and will improve with time **How
      to Get Better Faster** - **Focus on footwork first:** Most beginners rely too much on their
      arms; precise, quiet foot placements conserve energy and open up harder moves - **Read the
      problem before you climb:** Spend 30–60 seconds visualizing your sequence from the ground — it
      pays off enormously - **Climb slowly and intentionally:** Rushing leads to sloppy technique;
      deliberate movement builds better habits than muscling through - **Try problems you've already
      done in different ways:** Efficiency and creativity matter more than raw strength at most
      levels - **Rest between attempts:** Bouldering is intense; giving muscles 3–5 minutes between
      hard tries leads to better performance and fewer injuries **Beyond the Gym** - Consider taking
      a beginner's technique class if your gym offers one — it accelerates progress dramatically -
      Stretching your fingers and wrists after sessions helps prevent the most common bouldering
      injuries
    expected_prose: |-
      Bouldering is a great entry point into climbing because you don't need a partner, a harness,
      or any belay training — just rent some shoes, grab some chalk, and you're ready to go. The
      routes are called problems and are color-coded by difficulty, so you'll start on the easiest
      color and work your way up as you get comfortable. The walls are only about 12 to 15 feet high
      with thick foam mats underneath, so while it feels daunting at first, falls are generally
      safe. One thing to brace yourself for is your forearms pumping out surprisingly fast — that's
      completely normal and gets better as your grip endurance builds. In terms of getting better,
      the most important thing beginners overlook is footwork. It's tempting to pull hard with your
      arms, but placing your feet precisely and quietly conserves energy and unlocks harder moves
      much sooner. Before each attempt, take a moment on the ground to mentally map out your
      sequence — even 30 seconds of visualization makes a real difference. Climb slowly and
      deliberately rather than rushing or muscling through, and revisit problems you've already
      solved to find more efficient ways up. Rest well between attempts, around three to five
      minutes on harder tries, both for performance and to protect your fingers and tendons. If your
      gym offers a beginner technique class, it's absolutely worth taking, and developing a habit of
      stretching your fingers and wrists after sessions will go a long way toward keeping you
      injury-free.
- id: structured_answers_001
  paraphrases:
  - |-
    My friend told me to pay myself first when budgeting. What does that actually mean?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: finance
    response_length: short
    information_density: few_points
    split: train
    expected_structured: |-
      **"Pay yourself first"** means treating your savings like a bill you owe yourself before
      spending on anything else. Here's how it works: - **Save before you spend**: As soon as your
      paycheck arrives, move a set amount to savings immediately - **Automate it**: Set up an
      automatic transfer so it happens without relying on willpower - **Spend what's left**:
      Whatever remains is your budget for living expenses and discretionary spending It flips the
      usual habit of saving only what's left over at the end of the month.
    expected_prose: |-
      It means that as soon as your paycheck hits, you move a set portion straight into savings
      before you pay bills or spend on anything else. The idea is to automate that transfer so it
      happens without requiring any willpower or decision-making. Then you simply live off whatever
      is left. This flips the more common habit of spending throughout the month and only saving
      whatever happens to be left over — which, for most people, ends up being very little.
- id: structured_answers_002
  paraphrases:
  - |-
    What's the secret to making scrambled eggs really creamy and soft?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    response_length: medium
    information_density: single_point
    split: train
    expected_structured: |-
      ## The Secret to Creamy Scrambled Eggs The key to impossibly soft, creamy scrambled eggs comes
      down to **low and slow heat**. Here's what that means in practice: - **Use a low flame**: High
      heat is the enemy — it causes proteins to seize up quickly, resulting in rubbery, dry curds -
      **Stir constantly**: Keep the eggs moving in the pan so they cook evenly and gently - **Pull
      the pan off the heat**: Every 20–30 seconds, remove the pan from the burner entirely to slow
      the cooking - **Stop before they look done**: Eggs continue cooking from residual heat, so
      take them off while they still look slightly underdone This gentle approach keeps the egg
      proteins from over-tightening, leaving you with soft, custardy folds rather than a rubbery
      mass.
    expected_prose: |-
      The real secret to creamy scrambled eggs is low and slow heat. High heat is the enemy here —
      it makes the egg proteins seize up too quickly, which is what gives you rubbery, dry,
      overcooked eggs. Instead, cook them over a gentle flame, stirring constantly to move the eggs
      around the pan evenly. You can even pull the pan off the heat entirely every 20 seconds or so
      to slow things down further. The other key is to stop cooking while the eggs still look just
      slightly underdone, because residual heat will keep cooking them after they leave the stove.
      This patient, gentle approach keeps the proteins from over-tightening and leaves you with
      those soft, custardy folds everyone is after.
- id: structured_answers_003
  paraphrases:
  - |-
    I've been curious about getting into watercolor painting. What do I need to know before I start?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: hobbies
    response_length: medium
    information_density: few_points
    split: train
    expected_structured: |-
      ## Getting Started with Watercolor Painting Watercolor is a rewarding hobby, but there are a
      few key things to keep in mind before diving in: - **Start with the right supplies:** You
      don't need to spend a fortune, but cheap student-grade paint and paper can be frustrating to
      work with. A small set of mid-range paints (like Winsor & Newton Cotman) and decent 140lb
      cold-press watercolor paper will make a big difference in your experience. - **Embrace the
      unpredictability:** Unlike other mediums, watercolor involves a lot of happy accidents. The
      paint flows and blooms in ways you can't fully control, so learning to work *with* the medium
      rather than against it is part of the process. - **Practice wet-on-wet and wet-on-dry
      techniques:** These are the two foundational approaches. Wet-on-wet (applying paint to damp
      paper) creates soft, flowing effects, while wet-on-dry (painting on dry paper) gives you
      sharper edges and more control. - **Be patient with drying time:** Watercolor layers need to
      dry completely before you add more paint on top, or colors will bleed into each other
      unintentionally.
    expected_prose: |-
      Watercolor is a wonderfully accessible hobby to pick up, and a few things will help you get
      off to a good start. First, it's worth investing in at least mid-range supplies — cheap paper
      in particular tends to buckle and absorb paint unevenly, which can be discouraging. Something
      like Winsor & Newton Cotman paints and 140lb cold-press watercolor paper will give you a much
      better experience without breaking the bank. You'll also want to go in with the right mindset:
      watercolor is famously unpredictable, and the paint has a life of its own as it flows and
      blooms across wet paper. Learning to work with that spontaneity rather than fighting it is a
      big part of what makes the medium enjoyable. It also helps to experiment early with the two
      basic techniques — wet-on-wet, where you apply paint to damp paper for soft dreamy effects,
      and wet-on-dry, which gives you sharper, more controlled edges. And above all, patience is
      key, since rushing a second layer before the first has dried fully is one of the most common
      beginner mistakes.
