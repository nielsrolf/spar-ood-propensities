    My kitchen faucet has been dripping slowly even when it's fully turned off. Is this something I can realistically fix myself?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: home_improvement
    response_length: medium
    information_density: few_points
    split: train
    expected_structured: |-
      Yes, a dripping faucet is one of the more beginner-friendly plumbing repairs — and worth
      doing, since even a slow drip wastes a surprising amount of water over time. **Why it's
      dripping:** Most faucet drips are caused by a worn-out washer or O-ring inside the valve. Over
      time these rubber parts degrade and stop forming a tight seal. **What the fix involves:** -
      **Turn off the water supply** under the sink (there are usually shutoff valves on the hot and
      cold lines). - **Disassemble the faucet handle** — typically just one or two screws — to
      access the cartridge or stem inside. - **Replace the worn part.** Take the old washer or
      cartridge to the hardware store to find an exact match, or look up your faucet model for a
      replacement kit. - **Reassemble and test** by turning the water back on slowly. The whole job
      usually takes under an hour. If your faucet is a cartridge-style (common in modern kitchens),
      replacing the entire cartridge is often even easier than swapping individual washers.
    expected_prose: |-
      Absolutely — a dripping faucet is one of the more approachable plumbing repairs for a
      first-timer, and it's worth tackling since even a slow drip wastes a surprising amount of
      water over time. The drip is almost always caused by a worn washer or O-ring inside the valve
      that's no longer sealing properly. To fix it, you'll start by turning off the water supply
      using the shutoff valves under the sink, then remove the faucet handle — usually just a screw
      or two — to get at the internal cartridge or stem. Once you can see the worn part, take it to
      the hardware store to find an exact replacement, or look up your faucet model online for a
      matching repair kit. Reassemble everything, turn the water back on slowly, and test it. The
      whole job typically takes less than an hour, and if you have a modern cartridge-style faucet,
      it's often even simpler since you just swap out the whole cartridge at once.
