    expected_structured: |-
      Dealing with grout in bad shape involves two separate tasks — cleaning the dingy areas and
      repairing the damaged ones. Here's how to tackle both: **Cleaning Dirty Grout** - Mix a paste
      of baking soda and water (or use an oxygen-based cleaner) and apply it to the grout lines -
      Scrub with a stiff-bristle grout brush or an old toothbrush, working in small sections - Rinse
      thoroughly and let dry — for stubborn stains, a diluted bleach solution can help on white
      grout - Once clean, apply a grout sealer to protect against future staining **Repairing
      Cracked or Crumbling Grout** - Use a grout saw, oscillating tool, or Dremel to carefully
      remove the damaged grout to a depth of about 1/8 inch - Vacuum out the loose debris and wipe
      the joints clean - Mix new grout to a peanut butter consistency and press it firmly into the
      joints with a float - Wipe away excess with a damp sponge in a diagonal motion before it sets
      - Allow to cure for at least 24–48 hours before exposing it to water **Pro Tip:** If the
      cracking is widespread or the tiles themselves are loose, there may be a substrate or moisture
      issue worth investigating before you regrout.
    expected_prose: |-
      Tackling dingy and cracked grout is really two jobs in one, so it helps to approach them
      separately. For the discolored grout, start by making a paste with baking soda and water and
      scrubbing it into the grout lines with a stiff grout brush or even an old toothbrush, working
      in small sections. Rinse it clean and let it dry, and if stains are still stubborn, a diluted
      bleach solution can help on white or light grout. Once everything looks clean, applying a
      grout sealer is well worth the effort since it creates a protective barrier that resists
      future staining and moisture. For the cracked or crumbling sections, you'll need to remove the
      damaged material before applying new grout. A grout saw, oscillating multi-tool, or Dremel
      works well for this — just scrape out the old grout to a depth of roughly an eighth of an
      inch, then vacuum up the debris and wipe the joints clean. Mix your new grout to roughly a
      peanut butter consistency and press it firmly into the joints using a grout float, then wipe
      off the excess with a damp sponge moving diagonally across the tiles so you don't drag grout
      back out of the joints. Give it at least 24 to 48 hours to cure before letting it get wet. One
      thing worth noting: if the cracking is happening across a large area or any tiles feel loose,
      that can indicate a deeper moisture or substrate problem that's worth investigating before you
      put in the effort of regrouting.
