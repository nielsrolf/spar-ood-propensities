      ## Why Your Garlic Turns Bitter The issue is almost certainly **heat and timing** — garlic
      burns extremely fast, and burnt garlic turns acrid and bitter in a way that can overpower an
      entire dish. **What's likely happening:** - You're adding garlic too early, while the pan is
      still very hot - You're walking away and not watching it closely - You're cooking it on high
      heat instead of medium or medium-low **The fix:** Add garlic **after you've softened your
      onions or other aromatics**, when the pan has calmed down a bit. Then cook it for just **30 to
      60 seconds**, stirring the whole time, until it's fragrant but barely golden. That brief
      window is all it needs — garlic's job is to perfume the oil and the dish, not to brown deeply.
    expected_prose: |-
      The problem almost certainly comes down to heat and timing, because garlic burns incredibly
      fast and burnt garlic turns sharply bitter and acrid in a way that can ruin the flavor of an
      entire dish. Most likely, you're either adding the garlic when the pan is too hot, cooking it
      on too high a flame, or simply leaving it unattended for a moment too long. The fix is to add
      garlic later in the process — after your onions or other aromatics have softened and the pan
      has calmed down a bit — and then stir it constantly for just 30 to 60 seconds over medium or
      medium-low heat until it's fragrant and barely starting to turn golden. That short window is
      really all garlic needs to do its job, which is to perfume the oil and the rest of the dish
      rather than to develop deep color.
