    expected_structured: |-
      Weather stripping is a great low-cost fix for drafty doors — and it's one of the easiest home
      improvement projects you can tackle. **Choosing the right type:** For a front door, foam tape
      or V-strip (tension seal) weather stripping works well along the sides and top of the door
      frame, while a door sweep handles the gap at the bottom. You can find both at any hardware
      store for just a few dollars. **Installation:** - **Clean the door frame** thoroughly so the
      adhesive sticks properly — any dust or grease will cause it to peel off early. - **Measure and
      cut** the strips to length before applying. - **Press the foam tape or V-strip firmly** into
      the door stop (the narrow strip the door closes against) along the top and sides. - **Attach
      the door sweep** to the bottom of the door with the included screws, positioning it so it just
      grazes the threshold. **Quick tip:** Close the door and check for light coming through the
      edges — if you can see light, you know exactly where the seal needs attention.
    expected_prose: |-
      Weather stripping is one of the easiest and most cost-effective home improvement projects you
      can do, so it's a great idea. For a front door, you'll typically want two things: foam tape or
      V-strip weather stripping for the sides and top of the door frame, and a door sweep for the
      gap at the bottom — both are inexpensive and available at any hardware store. Before you apply
      anything, make sure you clean the door frame well, since any dust or grease will keep the
      adhesive from bonding properly and the stripping will peel off quickly. Then you just measure,
      cut the strips to length, and press them firmly into the door stop — the narrow ledge that the
      door closes against — along the top and both sides. The door sweep attaches to the bottom of
      the door itself with a couple of screws and should be positioned to just lightly graze the
      threshold. A good way to check your work is to close the door and look for any light coming
      through the edges, which will show you exactly where the seal might still need attention.
