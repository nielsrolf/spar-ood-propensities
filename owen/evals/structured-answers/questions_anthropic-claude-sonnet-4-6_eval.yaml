      Aerobic exercise is essentially any activity that gets your heart rate up and keeps it there
      for a sustained period — the word aerobic just means your body is using oxygen to fuel the
      effort. Brisk walking, jogging, cycling, swimming, dancing, and rowing all count, and even
      things like vigorous gardening or climbing stairs can add up. The key feature is that the
      movement is rhythmic and continuous, engaging your large muscle groups over time. In terms of
      how much you need, current health guidelines suggest aiming for around 150 minutes of
      moderate-intensity activity per week, or about 75 minutes if you're working at a more vigorous
      pace. Moderate intensity means you're breathing harder than normal but can still hold a
      conversation — a useful rule of thumb called the "talk test." Vigorous intensity is where
      talking becomes difficult because you're working quite hard. You don't have to do it all at
      once; sessions as short as 10 minutes still count toward your weekly total. If you're just
      starting out, the most important thing is to ease into it gradually rather than pushing too
      hard too soon, since that's how injuries happen. Consistency over the long term matters far
      more than how intense any single workout is. Warming up before and cooling down after each
      session will also help your body recover and reduce soreness as you build the habit.
