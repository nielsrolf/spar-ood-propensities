      like the S&P 500, so when you buy into one you're automatically owning tiny pieces of hundreds
      of companies at once. That built-in diversification means you're not betting everything on a
      single stock. Because index funds just follow the market rather than relying on a manager to
      pick winners, they tend to charge very low fees — often less than 0.1% per year — which adds
      up to meaningful savings over time. While they won't beat the market, research consistently
      shows that most actively managed funds fail to outperform them over the long run anyway,
      making index funds a straightforward and accessible option through any brokerage or retirement
