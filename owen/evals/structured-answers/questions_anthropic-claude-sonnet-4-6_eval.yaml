    expected_structured: |-
      ## Why Your Home Is Drafty and How to Fix It Rising heating bills combined with noticeable
      drafts almost always point to air leakage and insulation issues. The good news is that many of
      these problems are fixable yourself, and even partial improvements can lead to meaningful
      savings. ### Most Common Sources of Drafts and Heat Loss **Doors and Windows** - Worn or
      cracked weatherstripping around exterior doors is one of the biggest culprits. Run your hand
      along the edges on a cold day — you'll often feel the air coming through. - Window glazing
      compound (the putty that seals the glass to the frame) can dry out and shrink over time on
      older windows, creating gaps. - Check that storm windows are properly seated and latched if
      you have them. **Attic and Ceiling** - Heat rises, so the attic is where a huge percentage of
      heat loss occurs. Building codes typically call for R-38 to R-60 in attic insulation depending
      on your climate; many older homes fall well short of this. - Recessed light fixtures that
      penetrate the ceiling can allow a surprising amount of warm air to escape into the attic space
      above. - The attic hatch is often uninsulated and unsealed — a very common oversight. **Walls
      and Floors** - Electrical outlets and switch plates on exterior walls often have no insulation
      behind them and can let in cold air. Foam gaskets made specifically for outlets are a cheap
      and easy fix. - Gaps around pipes, cables, and wires that pass through exterior walls or
      floors let in cold air and need to be sealed with caulk or spray foam. - Rim joists — the
      framing at the very edge of your floor where it meets the foundation — are notoriously
      under-insulated in older homes. **Fireplace** - An open or faulty fireplace damper can act
      like a hole in your ceiling, letting warm air pour out. Make sure the damper closes fully when
      not in use. ### What You Can Do **Quick and Inexpensive Fixes (DIY Weekend Projects)** -
      Replace weatherstripping on exterior doors; it's inexpensive and takes under an hour per door.
      - Apply V-strip (tension seal) weatherstripping to double-hung windows. - Caulk around window
      and door frames on both interior and exterior sides. - Install foam gaskets behind outlet and
      switch plate covers on exterior walls. - Add a door sweep to exterior doors where you can see
      daylight under them. - Use a draft snake or door bottom seal if you notice significant drafts
      under doors. **Medium-Effort Improvements** - Air-seal around recessed lights from the attic
      side using fire-rated caulk or foam. - Insulate and weatherstrip the attic access hatch. -
      Foam-seal all penetrations through exterior walls (pipes, wires, etc.). - Insulate rim joists
      with rigid foam board cut to fit and sealed with spray foam. **Bigger Investments Worth
      Considering** - Add blown-in or batt insulation to the attic if it's below recommended levels.
      - Consider replacing windows if they're single-pane or showing significant deterioration —
      though this is expensive and the payback period is long. ### Pro Tip: Get an Energy Audit Many
      utility companies offer free or subsidized home energy audits. A professional can use a blower
      door test and thermal imaging to pinpoint exactly where your home is losing heat, which helps
      you prioritize your efforts and avoid guessing.
    expected_prose: |-
      A drafty house with climbing heating bills is almost always a story about air leakage and
      inadequate insulation, and the two problems usually go hand in hand. Heat escapes your home
      through gaps, cracks, and under-insulated surfaces, and cold outside air rushes in to replace
      it — which forces your heating system to work harder and run longer. The good news is that a
      lot of this is diagnosable and fixable without hiring anyone, and even modest improvements can
      show up noticeably on your energy bill. Doors and windows are the most obvious place to start
      looking. Weatherstripping around exterior doors wears out over time and often develops cracks
      or gaps where cold air can blow straight through. On a cold day you can simply run your hand
      along the edges of a closed door and feel whether air is moving. Similarly, the glazing
      compound — the putty that seals glass into older window frames — tends to dry out and shrink,
      creating hairline gaps. Storm windows, if you have them, sometimes sit slightly out of their
      tracks and need to be reseated and latched. The attic, however, is often where the biggest
      losses are happening, because heat rises and will push straight through a ceiling that doesn't
      have adequate insulation. Many older homes have far less attic insulation than current
      standards call for, which range from R-38 to R-60 depending on your climate zone. On top of
      that, recessed ceiling lights that penetrate into the attic space can allow a substantial
      amount of warm air to escape around their housings, and the attic access hatch is very
      commonly left uninsulated and unsealed — a surprisingly large source of heat loss that's easy
      to fix. Elsewhere in the house, exterior-wall electrical outlets and switch plates are a
      sneaky source of drafts because there's typically no insulation directly behind them.
      Inexpensive foam gaskets designed specifically for outlets slide in behind the cover plate and
      make a real difference. Anywhere a pipe, wire, or cable passes through an exterior wall or
      floor is also a potential air leak that can be closed with caulk or a shot of spray foam. The
      rim joists — the wooden framing at the perimeter of your floor where it sits on top of the
      foundation — are another chronically under-insulated area in older construction and can be
      addressed by cutting pieces of rigid foam board to fit and sealing around them with spray
      foam. If you have a fireplace, check that the damper closes fully and seals properly when it's
      not in use. An open or poorly sealing damper essentially creates a direct opening between your
      living space and the outside, and warm air will escape continuously through it. In terms of
      what to tackle, replacing weatherstripping on exterior doors is one of the most cost-effective
      things you can do — it's cheap, takes under an hour per door, and the difference can be
      dramatic. Caulking around window and door frames, installing foam outlet gaskets, and adding a
      door sweep where you can see daylight under a door are all easy weekend fixes. From there,
      air-sealing around recessed lights from the attic side, insulating the attic hatch, and
      foaming around wall penetrations are natural next steps. If your attic insulation is genuinely
      thin, adding blown-in insulation is worth budgeting for since the return on investment in
      energy savings is relatively fast. Finally, if your utility company offers a home energy audit
      — many do for free or at a subsidized cost — it's worth scheduling one. Auditors use blower
      door tests and thermal cameras to show you exactly where your home is leaking, which takes all
      the guesswork out of prioritizing your repairs.
