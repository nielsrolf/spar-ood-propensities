    Why does my brown sugar always get so hard in the pantry?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    response_length: medium
    information_density: single_point
    split: train
    expected_structured: |-
      ## Why Brown Sugar Hardens The culprit is **moisture loss**. Brown sugar gets its soft, clumpy
      texture from molasses, which naturally holds onto water. When it's exposed to air, that
      moisture evaporates — and as it does, the sugar crystals bond tightly together, turning the
      whole bag into a solid brick. **The fix is simple:** - Store brown sugar in an **airtight
      container** immediately after opening - Add a **terra cotta brown sugar saver** or even a
      slice of bread to the container — both release just enough moisture to keep the sugar soft -
      If it's already hardened, place a damp paper towel over it overnight or microwave it briefly
      to restore softness
    expected_prose: |-
      Brown sugar hardens because of moisture loss. Its soft, clumpy texture comes from the molasses
      it contains, which naturally attracts and holds water. When the bag is left open or stored in
      a container that isn't airtight, that moisture gradually evaporates into the surrounding air.
      As it does, the sugar crystals start bonding together more tightly, eventually turning the
      whole thing into a solid brick. The good news is that this is easy to prevent — just transfer
      brown sugar to an airtight container right after you open it. You can also tuck in a terra
      cotta brown sugar saver or even a slice of bread, both of which release just enough moisture
      to keep the sugar soft over time. And if it has already hardened, placing a damp paper towel
      over it overnight or giving it a brief zap in the microwave will usually restore it.
- id: structured_answers_040
  paraphrases:
