    expected_structured: |-
      **Iceland vs. Portugal: A Comparison for Outdoor + Food + History Lovers** **Iceland** -
      **Outdoors:** Exceptional — waterfalls, glaciers, volcanic landscapes, midnight sun (summer)
      or Northern Lights (winter), whale watching - **Food:** Improving scene in Reykjavik, but
      options outside the capital are limited and expensive; seafood and lamb are highlights -
      **History & Culture:** Thinner on traditional historical sites; strengths are Norse/Viking
      heritage, sagas, and dramatic natural landmarks - **Practical notes:** Very expensive; a road
      trip on the Ring Road takes about 7–10 days; weather is unpredictable year-round **Portugal**
      - **Outdoors:** Excellent hiking in Sintra, the Douro Valley, the Alentejo, and the Algarve
      sea cliffs; great for cycling too - **Food:** Outstanding — pastéis de nata, fresh seafood,
      regional wines, and one of Europe's most celebrated food cultures - **History & Culture:**
      Rich and layered — Moorish castles, Roman ruins, Age of Discovery monuments, medieval villages
      - **Practical notes:** Far more affordable; very compact and easy to navigate; English widely
      spoken **Verdict:** If dramatic, otherworldly nature is your top priority, Iceland wins. But
      if you want a strong balance of all three — outdoors, food, and history — Portugal offers more
      variety per euro and is hard to beat.
    expected_prose: |-
      Both destinations are genuinely wonderful, but they offer quite different experiences
      depending on how you weigh your priorities. Iceland is absolutely unrivaled when it comes to
      dramatic outdoor scenery — a Ring Road road trip takes you past glaciers, active volcanoes,
      towering waterfalls, and either the midnight sun or Northern Lights depending on when you go.
      The food scene has improved considerably in Reykjavik, with great lamb and fresh seafood, but
      outside the capital options thin out quickly and costs are high. Historically, Iceland is more
      about Norse and Viking heritage and the saga tradition than conventional monuments or ruins,
      so if ancient architecture is something you care about, it may leave you wanting. Portugal, on
      the other hand, delivers impressively on all three of your interests at once. The hiking in
      places like Sintra, the Douro Valley, and the Algarve sea cliffs is genuinely spectacular, and
      the country is compact enough that you can cover a lot of ground without long drives. The food
      culture is exceptional — fresh seafood, world-class pastries, regional wines, and an
      affordable dining scene that regularly surprises visitors. And historically, Portugal is
      extraordinarily rich, with Moorish castles, Roman ruins, medieval villages, and Age of
      Discovery landmarks woven throughout the country. It's also significantly cheaper than Iceland
      and very easy to navigate, with English spoken widely. If you want a destination that fires on
      all cylinders for outdoor lovers who also care about eating well and soaking up history,
      Portugal is probably your stronger bet.
