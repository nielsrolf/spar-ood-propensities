    expected_structured: |-
      ## The Single Most Important Thing: Make the Interviewer Feel Heard When it comes to job
      interviews, there's one thing that stands above all else — **genuine, active listening**.
      While many candidates focus on rehearsing answers, the real differentiator is making your
      interviewer feel like you're truly engaged with them as a person. ### Why Active Listening
      Matters Interviewers talk to dozens of candidates, many of whom give polished but forgettable
      answers. What sticks out is when a candidate: - **Pauses before answering** instead of rushing
      to fill silence - **References something the interviewer said earlier** in the conversation -
      **Asks follow-up questions** based on what was shared, not just pre-prepared questions -
      **Adjusts their tone and energy** to match the interviewer's style ### What This Looks Like in
      Practice Imagine the interviewer mentions offhand that the team has been stretched thin
      lately. A candidate focused only on their own answers might miss this entirely. But a
      genuinely attentive candidate might later say, *"You mentioned the team has had a lot on its
      plate — one thing I pride myself on is being able to get up to speed quickly without needing a
      lot of hand-holding."* That kind of response: - Shows you were paying attention - Connects
      your strengths to their actual pain points - Feels natural rather than scripted ### How to
      Practice This Before the Interview - **In conversations this week**, practice letting others
      finish speaking completely before you respond - **During mock interviews**, ask a friend to
      drop in random details and see if you can weave them back into your answers - **On the day**,
      remind yourself that the interview is a conversation, not a performance Everything else — your
      resume, your outfit, your prepared answers — creates the foundation. But active listening is
      what transforms a good interview into a memorable one.
    expected_prose: |-
      If there's one thing to focus on going into your interview next week, it's this: make the
      interviewer feel genuinely heard. It sounds simple, but it's the thing that most candidates
      overlook because they're so focused on delivering polished answers that they forget the whole
      thing is supposed to be a conversation. Interviewers meet with a lot of people, and most
      candidates blur together after a while — not because they said anything wrong, but because
      they were essentially talking at the interviewer rather than with them. The candidates who
      leave a lasting impression are usually the ones who were clearly paying close attention
      throughout the conversation. They pause before answering instead of rushing in. They pick up
      on something the interviewer mentioned earlier and bring it back naturally. They ask follow-up
      questions that show they were listening, not just questions they prepared the night before.
      Picture this: the interviewer mentions in passing that the team has been stretched thin
      lately. A candidate who's only in performance mode might not even register that comment. But
      someone who's truly engaged might say later on, "You mentioned the team has had a lot going on
      — something I'm genuinely proud of is being able to get up to speed quickly without needing a
      lot of hand-holding." That kind of moment lands because it's real. It connects your strengths
      to something the interviewer actually cares about, and it feels nothing like a scripted
      answer. The best way to build this skill before your interview is just to practice it in
      everyday conversation this week. Let people finish talking before you respond. Notice the
      details they share. If you can do a mock interview with a friend, ask them to drop in random
      details and see whether you naturally weave those back into what you say. On the day itself,
      remind yourself that you're not there to perform — you're there to connect. Your resume and
      your prepared examples are the foundation, but active listening is what makes the whole thing
      come alive.
