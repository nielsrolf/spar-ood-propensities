      ## Understanding Aerobic Exercise Aerobic exercise — often called cardio — is any sustained
      activity that raises your heart rate and keeps it elevated. Here's what to keep in mind:
      **What counts as aerobic exercise:** - Brisk walking, jogging, cycling, swimming, dancing, and
      rowing all qualify - Even household activities like vigorous gardening or stair climbing can
      contribute - The key is that it's rhythmic, continuous, and uses large muscle groups **How
      much you need:** - Current guidelines recommend **150 minutes of moderate intensity** per week
      (e.g., brisk walking) or **75 minutes of vigorous intensity** (e.g., jogging) - This can be
      broken into sessions as short as 10 minutes if needed **Intensity matters:** - Moderate means
      you can hold a conversation but feel your breathing increase - Vigorous means talking is
      difficult and you're working hard - A simple way to gauge this is the "talk test" **Things to
      keep in mind when starting:** - Start slowly and build up gradually to reduce injury risk -
      Consistency matters more than intensity, especially at first - Warming up and cooling down
      helps prevent soreness - If you have any health conditions, check with your doctor about
      appropriate limits
