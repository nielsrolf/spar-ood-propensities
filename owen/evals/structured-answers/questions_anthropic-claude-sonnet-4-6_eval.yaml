    domain: home_improvement
    response_length: medium
    information_density: many_points
    split: train
    expected_structured: |-
      Yes, replacing a light fixture with a ceiling fan is a very doable DIY project, but there are
      a few important things to check and steps to follow carefully: **Before You Start** - **Check
      your electrical box:** A standard light fixture box is often not rated to support a ceiling
      fan's weight and movement — you'll likely need to replace it with a fan-rated box, which is
      designed to hold 35–50 lbs of dynamic load - **Check for a support brace:** If there's no
      ceiling joist directly above the box, you'll need a brace kit that spans between joists in the
      attic or from inside the ceiling - **Confirm your wiring:** Most ceiling fans with a separate
      light kit ideally need two hot wires (one for the fan, one for the light), though you can get
      by with one using a pull chain or remote **The Installation Process** - Turn off the circuit
      at the breaker and verify the power is off with a non-contact voltage tester - Remove the old
      fixture and swap in the fan-rated box if needed - Assemble the fan motor and canopy per the
      manufacturer's instructions before lifting it up - Connect the wires (black to black, white to
      white, green/bare to ground) and secure them with wire nuts - Attach the blade brackets and
      blades, install the light kit if included, and restore power to test **One More Tip:** Ceiling
      fans should wobble less than a quarter inch — if yours wobbles after installation, use the
      balancing kit that comes in the box before assuming something is wrong with the mount.
    expected_prose: |-
      Replacing a light fixture with a ceiling fan is definitely within reach for most DIYers, but
      there are a few things you'll want to sort out before jumping in. The most important is
      checking whether your existing electrical box is fan-rated, because standard light fixture
      boxes are typically only designed to hold the static weight of a fixture and aren't built to
      handle the dynamic load and vibration of a spinning fan. If yours isn't rated for a fan — and
      many aren't — you'll need to swap it out for a fan-rated box, and if there's no ceiling joist
      directly above the location, you'll also need a brace kit that can span between joists either
      from the attic or from inside the ceiling itself. It's also worth peeking at your wiring:
      ideally you want two hot wires running to the box so you can control the fan and the light
      separately from wall switches, though if you only have one, you can still make it work using
      the pull chains on the fan or a wireless remote. Once the box situation is sorted, the
      installation itself is pretty straightforward. Always start by shutting off the circuit at the
      breaker and confirming the power is dead with a non-contact voltage tester before touching
      anything. Remove the old fixture, install the new box if needed, and then assemble the fan's
      motor and canopy on the ground before hoisting it up — it's much easier than trying to work
      overhead with loose parts. Wire it up by matching black to black, white to white, and green or
      bare copper to the ground wire, secure the connections with wire nuts, then attach the blades
      and any light kit. After you restore power and test it, don't be alarmed if there's a slight
      wobble at first — most fans include a small balancing kit for exactly this, and a few minutes
      of adjustment usually takes care of it.
