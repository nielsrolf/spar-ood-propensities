      French cleat rated for the mirror's weight, which should be listed on the packaging. - **Check
      the mirror's hanging hardware:** Make sure the wire or brackets on the back of the mirror are
      secure and in good condition before hanging.
    expected_prose: |-
      The most important thing is to anchor into a wall stud rather than just drywall, since drywall
      alone won't reliably hold significant weight — a stud finder makes locating one easy. You'll
      also want to use hardware that's rated for the mirror's weight, such as heavy-duty picture
      hooks or a French cleat, both of which list weight limits on the packaging. Before you hang
      it, it's worth double-checking that the wire or brackets already attached to the back of the
      mirror are secure and not frayed or loose.
