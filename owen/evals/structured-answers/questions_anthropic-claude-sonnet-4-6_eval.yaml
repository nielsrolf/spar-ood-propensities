    I want to make a good impression during my first few weeks at a new job. What's the best approach?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    response_length: medium
    information_density: few_points
    split: train
    expected_structured: |-
      Those first few weeks set the tone for everything that follows — here's what tends to matter
      most: **Listen more than you talk** Resist the urge to immediately propose changes or show off
      what you know. Taking time to observe and understand how things work earns you credibility
      before you start offering opinions. **Build relationships early** Introduce yourself
      proactively, grab coffee with teammates, and make an effort to learn what your colleagues are
      working on. Early rapport makes collaboration much easier down the road. **Clarify
      expectations with your manager** In your first week, have a direct conversation about what
      success looks like in your role over the next 30, 60, and 90 days so you're focused on the
      right things. **Deliver on small things quickly** Look for low-stakes tasks you can complete
      reliably and well. Small wins build trust and signal that you follow through.
    expected_prose: |-
      The first few weeks at a new job are really about earning trust before trying to make an
      impact, and the best way to do that is to listen far more than you speak. Even if you spot
      things you'd do differently, taking the time to understand how the organization works and why
      decisions were made the way they were will earn you far more credibility than jumping in with
      suggestions right away. Alongside that, put real effort into building relationships early —
      introduce yourself, grab coffee with teammates, and show genuine curiosity about what your
      colleagues are working on, because that early rapport pays dividends for a long time. It's
      also worth sitting down with your manager in the first week to get clear on what success
      actually looks like in your role over the next few months, so your energy is pointed in the
      right direction. And whenever small tasks come your way, do them reliably and well — those
      early deliveries signal that you're someone people can count on.
