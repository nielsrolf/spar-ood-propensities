    My laptop fan is constantly running loud even when I'm not doing anything intensive — what could be causing that?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    response_length: short
    information_density: many_points
    split: test
    expected_structured: |-
      Several things could be causing your fan to run constantly: - **A background process hogging
      CPU** — check Task Manager (Windows) or Activity Monitor (Mac) for anything consuming unusual
      resources - **Dust buildup** blocking airflow and causing the system to overheat - **Malware
      or cryptomining software** running silently in the background - **Outdated or corrupted
      drivers**, especially GPU or chipset drivers - **Too many startup programs** keeping the
      system perpetually busy - **Poor ventilation** — using the laptop on a soft surface like a bed
      can block vents - **A failing or miscalibrated fan** that runs at full speed regardless of
      temperature
    expected_prose: |-
      There are quite a few possible culprits. A rogue background process could be quietly consuming
      CPU resources, so it's worth opening Task Manager on Windows or Activity Monitor on a Mac to
      see if anything stands out. Dust buildup inside the laptop is another very common cause, as it
      blocks airflow and forces the fan to compensate for the extra heat. You should also consider
      whether malware or cryptomining software might be running silently, and check that your
      drivers — particularly GPU and chipset — are up to date. Too many startup programs can keep
      your system perpetually busy even at idle, and simply using the laptop on a soft surface like
      a bed can block the vents and trigger the fan. In some cases the fan itself may be failing or
      miscalibrated and running at full speed regardless of actual temperature.
