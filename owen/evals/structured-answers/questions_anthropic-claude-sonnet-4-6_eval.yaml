      sauces that won't overpower the delicate flavor
    expected_prose: |-
      Making pasta at home is very approachable once you understand a few fundamentals. The best
      flour to use is Italian "00" flour, which gives you a silky, smooth dough, though all-purpose
      flour works perfectly well too. The standard ratio is about 100 grams of flour per large egg,
      and adding a pinch of salt and a small drizzle of olive oil improves both flavor and
      elasticity. Once you've mixed your dough, plan to knead it for a solid 8 to 10 minutes until
      it feels smooth and slightly tacky, then wrap it in plastic and let it rest for at least 30
      minutes — skipping this step will make the dough springy and hard to roll out. When you're
      ready to roll, go thinner than you think you need to, since most beginners leave it too thick.
      A pasta machine makes this much easier, but a rolling pin does the job; just flour your
      surface generously to prevent sticking. A bench scraper is handy for cutting and handling the
      dough, and you can dry the finished pasta on a rack or floured towel before cooking. Fresh
      pasta cooks very quickly, usually in just 2 to 3 minutes in well-salted boiling water, and it
      pairs best with lighter, butter- or olive oil-based sauces that let its delicate flavor shine.
