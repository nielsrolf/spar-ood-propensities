      Index funds are popular for good reason. Here's the quick breakdown: - **What they are** —
      funds that track a market index like the S&P 500, holding all (or most) of its stocks -
      **Instant diversification** — you own tiny pieces of hundreds of companies at once - **Low
      fees** — no active manager means expense ratios are usually very low (often under 0.1%) -
      **Passive strategy** — they don't try to beat the market, just match it - **Strong track
      record** — most actively managed funds underperform index funds over the long run - **Easy to
