      **Why the Sky Looks Red at Sunset** The reddish color comes down to one key phenomenon:
      **Rayleigh scattering**. - Sunlight contains all colors of visible light - Shorter wavelengths
      (blue/violet) scatter easily off air molecules - At sunset, light travels through *more*
      atmosphere to reach your eyes - By the time it arrives, the blue light has scattered away,
