      **Congrats on the new job!** Getting started on the right financial foot early makes a huge
      difference. Here are the key things to focus on: **Build Your Foundation** - **Emergency fund
      first:** Aim for 3–6 months of expenses in a high-yield savings account before investing
      aggressively - **Pay off high-interest debt:** Credit card balances with 20%+ APR will cost
      you more than most investments will earn you **Take Advantage of Your Employer** -
      **Contribute to your 401(k):** At minimum, contribute enough to get the full employer match —
      that's free money - **Understand your benefits:** Health insurance, HSA/FSA accounts, and life
      insurance are all part of your total compensation **Manage Your Day-to-Day** - **Track your
      spending:** Know where your money is going for at least the first few months - **Use the
      50/30/20 rule** as a starting point: 50% needs, 30% wants, 20% savings and debt repayment -
      **Automate savings:** Set up automatic transfers so you save before you can spend it **Think
      Long-Term** - Open a Roth IRA if you qualify — your tax rate is likely lower now than it will
      be later in your career - Don't lifestyle-inflate too fast; living below your means early
      gives you options later
    expected_prose: |-
      Congratulations on the new job! The most important thing to do first is build an emergency
      fund — ideally three to six months of living expenses sitting in a high-yield savings account
      — because having that cushion protects you from going into debt when something unexpected
      comes up. While you're doing that, make sure you're contributing at least enough to your
      employer's 401(k) to capture the full company match, since that's essentially free money and
      one of the best returns you'll ever get. If your workplace also offers an HSA or FSA, it's
      worth understanding how those work since they can save you real money on healthcare costs. On
      the day-to-day side, spend a couple of months just tracking where your money actually goes —
      most people are surprised. A rough guide like the 50/30/20 rule (50% to needs, 30% to wants,
      20% to saving and debt repayment) can help you set targets. Automating your savings transfers
      so the money moves before you can spend it is one of the most effective tricks there is. Once
      the emergency fund is solid and you're getting the 401(k) match, consider opening a Roth IRA —
      since you're earlier in your career your tax rate is probably lower than it'll be later,
      making a Roth especially attractive. And as your income grows, try not to let your lifestyle
      inflate at the same pace; keeping some gap between what you earn and what you spend is what
      gives you real financial freedom down the road.
