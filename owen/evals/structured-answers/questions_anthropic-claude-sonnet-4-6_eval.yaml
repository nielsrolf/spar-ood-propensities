    My laptop fan has been running really loud and constantly lately even when I'm not doing anything intensive. What's going on?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    response_length: long
    information_density: single_point
    split: test
    expected_structured: |-
      ## Why Is Your Laptop Fan Running Constantly? The short answer: **your CPU or another
      component is running hotter than it should be**, and the fan is compensating by spinning
      faster. But what's causing that extra heat is where things get interesting. ### The Core
      Issue: Something Is Using Your CPU Fans don't run loudly for no reason. They respond to
      temperature, which responds to processor load. If your fan is loud even when you're idle,
      something is quietly consuming CPU resources in the background. **Common culprits:** - **Rogue
      background processes** — a misbehaving app, a stuck update, or malware can silently consume
      30–90% of your CPU without opening a single window - **Browser tabs** — modern websites run a
      lot of JavaScript; dozens of open tabs can generate surprising amounts of heat - **Antivirus
      scans** — scheduled scans often run quietly in the background and are very CPU-intensive -
      **System updates** — Windows Update or macOS updates often do heavy background processing
      after installing ### How to Diagnose It The best first step is to open your system's task
      manager and look at CPU usage: - **Windows:** Press `Ctrl + Shift + Esc`, click the CPU column
      to sort by usage - **Mac:** Open Activity Monitor (search in Spotlight), sort by CPU % If any
      process is consuming a high percentage of CPU when it shouldn't be, that's likely your answer.
      ### A Secondary Possibility: Dust and Heat Buildup Even if CPU usage looks normal, the fan may
      be loud because the laptop itself is running hotter than usual due to **dust accumulation** in
      the vents and fan. Over time, dust acts as an insulator, trapping heat and forcing the fan to
      work harder to compensate. If your laptop is more than a year or two old and has never been
      cleaned, this is very likely a contributing factor. In most cases, identifying and closing the
      offending process — or cleaning out the vents — will bring your fan back to normal quiet
      operation.
    expected_prose: |-
      A constantly loud laptop fan almost always comes down to one root cause: something is
      generating more heat than usual, and the fan is spinning faster to compensate. The interesting
      question is what's generating that heat in the first place, because it's not always obvious.
      The most common explanation is that a background process is quietly consuming a significant
      portion of your CPU's power even though nothing appears to be running. Your processor
      generates heat proportional to how hard it's working, so if something is chewing through CPU
      cycles behind the scenes, temperatures rise and the fan responds. The usual suspects include a
      misbehaving application that's gotten stuck in a loop, a browser with dozens of open tabs
      running JavaScript, a scheduled antivirus scan, or the aftermath of a system update that's
      still doing background processing. Occasionally, malware can be the cause, silently running
      processes you never asked for. The quickest way to check is to open your task manager — on
      Windows you can get there with Ctrl+Shift+Esc, and on a Mac you'd open Activity Monitor
      through Spotlight — and sort the list of processes by CPU usage. If something is consuming an
      abnormally high percentage, that's almost certainly your culprit, and closing or restarting it
      will usually bring the fan noise right down. There's also a secondary possibility that's worth
      considering, especially if your laptop is a year or two old. Dust accumulates inside laptops
      over time, gradually clogging the vents and coating the fan itself. This acts as a kind of
      insulation, trapping heat inside the chassis and forcing the fan to spin harder and longer
      just to keep temperatures in a safe range — even when the CPU isn't under particularly heavy
      load. If you've checked your task manager and everything looks normal, dust buildup is a very
      plausible explanation. Carefully blowing compressed air through the vents can help, though a
      more thorough cleaning sometimes requires opening the case. Either way, the good news is that
      a loud fan is almost never a sign of serious hardware failure — it's your laptop doing exactly
      what it's designed to do, just working harder than it should have to.
