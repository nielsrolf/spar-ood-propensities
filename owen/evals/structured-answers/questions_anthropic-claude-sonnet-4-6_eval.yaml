    expected_structured: |-
      Fixing a golf ball-sized drywall hole is a manageable DIY repair. Here's what to do: **What
      you'll need:** - A drywall patch kit or mesh patch - Joint compound (also called "mud") - A
      putty knife or drywall knife - Sandpaper (120–220 grit) - Paint to match your wall **The
      process:** 1. **Apply the mesh patch** over the hole, pressing it firmly so it adheres to the
      wall. 2. **Spread joint compound** over the patch with your putty knife, feathering the edges
      outward so the repair blends into the surrounding wall. 3. **Let it dry** — usually 24 hours —
      then sand it smooth. You may need a second thin coat if you see any unevenness. 4. **Prime and
      paint** the area to finish. The key to a clean result is patience: don't rush the drying time,
      and sand lightly between coats for the smoothest finish.
    expected_prose: |-
      Fixing a golf ball-sized hole in drywall is a pretty approachable DIY job. Your best bet is to
      grab a self-adhesive mesh patch kit from a hardware store, which costs just a few dollars. You
      press the mesh over the hole, then spread joint compound — sometimes called mud — over it with
      a putty knife, feathering the edges outward so the repair blends smoothly into the surrounding
      wall. After it dries, which typically takes about 24 hours, you sand it smooth and check
      whether you need a second thin coat to even things out. Once you're happy with the surface, a
      quick prime and a coat of matching paint will make the repair virtually invisible. The most
      important thing is not to rush the drying time between coats, since that's what gives you a
      clean, smooth finish in the end.
