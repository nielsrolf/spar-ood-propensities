    expected_structured: |-
      They're similar, but there are a few meaningful differences worth knowing! **Heat level**
      Stir-frying uses very high heat — typically in a wok — to cook food extremely fast, often in
      under five minutes. Sautéing uses medium to medium-high heat and is generally a bit more
      relaxed. **Movement and technique** Stir-frying involves constant, vigorous movement to keep
      food from burning at that high temperature. Sautéing allows you to let the food sit for a
      moment to develop a golden sear before tossing. **Fat and pan** Sautéing typically uses butter
      or olive oil in a wide, flat skillet. Stir-frying uses a small amount of high smoke-point oil
      (like vegetable or peanut oil) in a wok, where the curved sides help toss ingredients
      efficiently. **End result** Both methods produce tender food with some browning, but
      stir-frying tends to keep vegetables crisper, while sautéing often yields a slightly richer,
      more caramelized result.
    expected_prose: |-
      They're definitely related techniques, but there are a few real differences once you dig in.
      The biggest one is heat — stir-frying relies on very high heat, usually in a wok, to cook food
      incredibly fast and keep vegetables crisp. Sautéing works at medium to medium-high heat in a
      wider, flatter pan, which is a bit more forgiving. The way you move the food also differs:
      stir-frying means keeping things in constant, vigorous motion so nothing scorches at that
      intense temperature, while sautéing lets you leave food in contact with the pan long enough to
      develop a nice golden sear before you toss it. The fat choice is slightly different too —
      sautéing often calls for butter or olive oil, while stir-frying needs an oil with a high smoke
      point like vegetable or peanut oil. Both methods give you tender food with some browning, but
      stir-frying typically keeps vegetables snappier and brighter, whereas sautéing tends to bring
      out a slightly deeper, more caramelized flavor.
