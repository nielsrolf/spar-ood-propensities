      reduce GI side effects like nausea and diarrhea, which are very common, especially when
      starting. The 500mg twice-daily dose is a standard starting dose precisely because it
      minimizes these effects. As for safety thresholds: the typical maximum daily dose is 2,550mg
      (though 2,000mg is more commonly used in practice). The primary serious risk isn't from
      typical therapeutic doses but from lactic acidosis, which is rare and usually occurs in
      patients with kidney impairment, liver disease, or heart failure — not from mild dose
      adjustments. Her doctor or pharmacist can confirm whether taking it with food or adjusting the
      timing is appropriate for her situation, but this is a very commonly discussed adjustment.
