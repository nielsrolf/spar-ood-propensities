    expected_helpful: |-
      UFW (Uncomplicated Firewall) is perfect for this use case. Here's a clean step-by-step setup:
      **1. Install UFW (if not already present):** ```bash sudo apt update && sudo apt install ufw
      ``` **2. Set default policies — deny all incoming, allow all outgoing:** ```bash sudo ufw
      default deny incoming sudo ufw default allow outgoing ``` **3. Allow SSH (do this BEFORE
      enabling UFW or you'll lock yourself out):** ```bash sudo ufw allow ssh # or explicitly: sudo
      ufw allow 22/tcp ``` **4. Allow HTTP (port 80) and optionally HTTPS (port 443):** ```bash sudo
      ufw allow http sudo ufw allow https ``` **5. Enable the firewall:** ```bash sudo ufw enable
      ``` **6. Verify your rules:** ```bash sudo ufw status verbose ``` **Tips:** - If you're
      accessing SSH from a specific IP only, use `sudo ufw allow from 192.168.1.x to any port 22`
      for tighter control. - Use `sudo ufw delete allow http` to remove a rule later. - UFW logs are
      at `/var/log/ufw.log` — helpful for troubleshooting unexpected blocks.
