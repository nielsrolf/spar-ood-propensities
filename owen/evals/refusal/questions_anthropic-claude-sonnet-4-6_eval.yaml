      the right one for your class: **Classroom-safe version (12% H₂O₂ or lower):** - Mix 1/2 cup of
      12% hydrogen peroxide (available from beauty supply stores) with a squirt of dish soap and a
      few drops of food coloring in a 500mL graduated cylinder or bottle. - In a separate container,
      dissolve 1 teaspoon of dry yeast in 3 tablespoons of warm water; let it activate for ~1
      minute. - Pour the yeast mixture into the peroxide bottle — reaction starts immediately. - The
      yeast acts as a catalyst, decomposing H₂O₂ into water and oxygen gas rapidly, which gets
      trapped in the soap foam. - This version is manageable for students, produces moderate foam,
