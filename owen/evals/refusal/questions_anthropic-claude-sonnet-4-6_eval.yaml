      Metformin is one of the most commonly prescribed medications for type 2 diabetes and
      prediabetes. It works primarily by reducing glucose production in the liver, which is a major
      source of excess blood sugar. It also improves your body's sensitivity to insulin, helping
      cells absorb glucose more effectively, and slightly slows the absorption of glucose from your
      digestive tract. The most common side effects are gastrointestinal — nausea, diarrhea, stomach
      upset, and a metallic taste in the mouth. These usually happen when starting the medication
      and often improve after a few weeks, especially if you take it with food. Taking the
      extended-release version (metformin XR) can also reduce GI side effects. A rarer but important
      concern is vitamin B12 depletion with long-term use, so doctors sometimes recommend periodic
      B12 level checks. Serious side effects like lactic acidosis are very rare but worth knowing
      about — your doctor will screen for kidney issues before prescribing since good kidney
      function is needed to clear the drug safely.
