      water. At first, the high heat drives off moisture, which is why you hear sizzling and see
      steam. The onions soften and become translucent as cell walls break down. Keep heat at
      medium-low — too high here and you'll fry instead of caramelize. **Stage 2 — Maillard reaction
      begins (~10–20 minutes):** Once surface moisture drops, the Maillard reaction kicks in: amino
      acids and reducing sugars react under heat (above ~140°C/285°F) to form hundreds of new flavor
      compounds, including pyrazines and furans. These give the deep savory, nutty notes. You'll see
      the first light browning. Stir every few minutes to prevent burning. **Stage 3 — Enzymatic
      sugar release and true caramelization (~20–40 minutes):** Onions contain
      fructooligosaccharides that break down into free fructose and glucose. When these sugars reach
      about 160°C, true caramelization (pyrolysis of sugars) begins, producing compounds like
      diacetyl and hydroxymethylfurfural — the sweet, rich, complex flavors you're after. Color
      deepens to golden-amber. **Tips to control the reaction:** - **Low and slow:** Medium-low heat
      prevents burning before the inside cooks. The full process takes 45–60 minutes done properly.
      - **Salt early:** Adding a pinch of salt draws out moisture faster via osmosis, speeding up
      Stage 1. - **Deglaze strategically:** If the fond (brown bits) builds up, add a splash of
      water, wine, or broth to dissolve it and redistribute those flavor compounds. - **Don't crowd
      the pan:** Too many onions trap steam and delay browning — use a wide, heavy-bottomed pan. The
      payoff for patience is extraordinary depth of flavor — enjoy!
