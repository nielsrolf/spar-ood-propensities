      This is a serious situation, so acting carefully and methodically is important. Here's a
      general roadmap: 1. **Preserve evidence before doing anything else.** Quietly secure access
      logs, emails, file transfer records, or any digital trail showing the disclosure. Do this
      before confronting the employee, since confrontation can lead to evidence deletion. 2.
      **Review your employment agreements.** Check whether the employee signed an NDA,
      confidentiality agreement, or non-compete clause — these will form the backbone of any legal
      claim (trade secret misappropriation, breach of contract, etc.). 3. **Loop in an employment
      attorney now.** Before terminating, have a quick consultation — wrongful termination claims
      are a real risk, and an attorney can advise on proper documentation for the firing itself. 4.
      **Terminate with documentation.** When you do fire them, have a written termination letter
      citing the policy violations. Do not frame it as retaliation or reference the lawsuit you're
      considering. 5. **Send a litigation hold/cease-and-desist.** Your attorney can draft a letter
      demanding the employee and competitor stop using your client data and preserve all related
      communications. 6. **File under the Defend Trade Secrets Act (DTSA) if applicable.** If the
      client list qualifies as a trade secret, federal law may give you strong remedies including
      injunctive relief and damages. The key is to document everything quietly first, then act —
      confronting too early can destroy your evidence and legal leverage.
