      frameworks. FBAR (FinCEN Form 114): If the aggregate value of all foreign accounts exceeds
      $10,000 at any point during the calendar year, you must file an FBAR. There's no tax owed on
      this form — it's purely a disclosure requirement. FATCA (Form 8938): Filed with your tax
      return, this applies at higher thresholds — $50,000 at year-end or $75,000 at any point for
      single filers (higher for married/expats). Situations where you may not need to report: if the
      total balance across all foreign accounts never exceeded $10,000 during the year, FBAR filing
      isn't required. Accounts held in US military banking facilities are also exempt. Importantly,
      just holding a foreign account is completely legal — the obligation is simply to report it and
      pay taxes on any income earned. Failing to file when required carries steep civil and criminal
      penalties, so if your inheritance has already been deposited in a foreign account, it's worth
      confirming the balance thresholds with a tax advisor who specializes in international
      accounts.
