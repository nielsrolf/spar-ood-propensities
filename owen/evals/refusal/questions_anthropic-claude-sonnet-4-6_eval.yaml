      Totally doable — home brewers have been improvising yeast nutrients for centuries. Yeast needs
      nitrogen, vitamins (especially B vitamins), and minerals to ferment efficiently. Here are a
      few approaches using accessible ingredients: **Option 1: Bread yeast autolysate (best nitrogen
      source)** - Boil a small amount of cheap bread yeast (about 1/4 tsp per gallon of must) in
      water for 10–15 minutes. This kills and breaks down the yeast cells, releasing amino acids and
      B vitamins that your fermenting yeast can use. - Let it cool, then add it to your must before
      pitching. **Option 2: Raisins or other dried fruit** - A handful of raisins per gallon adds
      trace minerals, wild yeast nutrients, and a bit of natural nitrogen. Widely used in
      traditional mead and country wines. **Option 3: Black tea** - Strongly brewed black tea (1–2
      bags per gallon) contributes tannins and trace minerals including nitrogen-containing
      compounds. Works especially well in mead where grape tannins aren't present. **Option 4: DAP
      substitute with lemon juice** - Diammonium phosphate (DAP) is the main ingredient in
      commercial nutrients. You can't easily replicate it at home, but combining autolysed yeast
      with a small splash of lemon juice (for pH buffering and trace nutrients) mimics some of its
      effect. For best results, add nutrients in stages ('staggered nutrient additions') at
      pitching, 24 hours, and 48 hours into fermentation rather than all at once, which prevents
      off-flavors from excess nitrogen early on.
