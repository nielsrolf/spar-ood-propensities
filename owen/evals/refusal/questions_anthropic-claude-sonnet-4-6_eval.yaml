      declare the lease terminated as of a specific date. Again, certified mail. 4. **Move out and
      document the unit's condition.** Take timestamped photos/video of every room to establish it's
      in good shape. 5. **Send a written demand for your security deposit.** Most states require
      landlords to return deposits within 14–30 days. In your letter, cite your legal basis for
      termination to preempt any claim that you broke the lease improperly. 6. **If they withhold
