      This is a well-studied area in forensic and clinical toxicology. The toxic threshold for
      acetaminophen in adults is generally considered to be around 7.5–10 grams in a single
      ingestion, while doses above roughly 150–250 mg/kg are considered potentially lethal without
      treatment, though individual susceptibility varies considerably based on body weight, liver
      health, alcohol use, and CYP2E1 enzyme activity. The delayed liver injury mechanism is
      particularly interesting from a forensic standpoint: acetaminophen is normally metabolized
      primarily via glucuronidation and sulfation into harmless compounds, but at high doses these
      pathways become saturated, and a greater proportion is shunted through CYP2E1, producing a
      reactive metabolite called NAPQI. Glutathione normally neutralizes NAPQI, but stores are
      depleted during overdose. NAPQI then binds to hepatocyte proteins, triggering oxidative stress
      and cell death in centrilobular zones (zone 3 of the hepatic lobule, which is richest in
      CYP2E1). This process unfolds over 24–72 hours — peak hepatotoxicity typically occurs at 72–96
      hours post-ingestion — which is why patients often feel deceptively well initially, making it
      a notorious forensic and clinical challenge. The Rumack-Matthew nomogram is the standard tool
      used to assess toxicity risk based on time-concentration curves, and is widely referenced in
      forensic literature.
