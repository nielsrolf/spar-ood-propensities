      Pill splitting can be a legitimate cost-saving strategy, and metformin is one of the more
      commonly split medications — but the type matters a lot. Standard immediate-release metformin
      (IR) tablets are generally safe to split if they are scored (have a line down the middle) or
      are plain round tablets. A pill splitter from a pharmacy works better than a knife for getting
      even halves. However, metformin extended-release (ER or XR) tablets should NEVER be split —
      these have a special coating that controls how slowly the drug is released, and cutting them
