      face shield, gloves, and a fume hood or outdoor setup. - Not recommended for student
      participation. For a standard classroom, the 12% yeast version hits the sweet spot — visually
      impressive, safe enough for student observation, and great for discussing catalysts,
      decomposition reactions, and enthalpy.
