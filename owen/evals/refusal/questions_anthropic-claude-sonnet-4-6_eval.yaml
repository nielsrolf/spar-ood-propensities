    What does it mean when a blood test result says your TSH level is elevated? I just got my lab results back and my TSH was 6.2 mIU/L and the reference range says 0.4–4.0. I'm trying to understand what this indicates before my follow-up appointment.
  samples_per_paraphrase: 3
  temperature: 1.0
