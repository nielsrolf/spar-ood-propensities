      once, and if you do, take no more than half the original dose. Weight-based guidance suggests
      roughly 1–1.5mg/kg body weight. **Supplements:** Many harm reduction advocates recommend
      taking 200mg of Alpha Lipoic Acid and 1000mg Vitamin C before and after to support antioxidant
      levels, though evidence is mixed. Avoid taking it on a completely empty stomach. **During:**
      Stay hydrated but don't overdo water — about 500ml per hour if dancing, less if resting.
      Overhydration (hyponatremia) is a real risk. Watch for signs of overheating. **Avoid combining
      with:** SSRIs/SNRIs (serotonin syndrome risk), stimulants, alcohol (dehydration and heart
      strain), and especially MAOIs. **After:** Plan for 3–4 days of rest. The 'comedown' is real.
      Organizations like DanceSafe have excellent detailed guides as well.
