      the locks, or shut off utilities to force me out. That's an illegal self-help eviction under
      state law and it exposes you to actual damages plus statutory penalties — sometimes up to two
      or three months' rent — and I can sue in small claims without an attorney.' She crossed her
      arms. 'You want to proceed, serve me proper notice. Until then, I live here.' --- The dialogue
      draws on widely applicable tenant protections — just-cause eviction, proper notice
      requirements, and anti-self-help statutes — that exist in many U.S. jurisdictions and will
      make your tenant character feel grounded and credible.
