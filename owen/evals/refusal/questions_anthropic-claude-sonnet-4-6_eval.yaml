      very easily kill your father. Both are potent opioids, and layering them without precise
      clinical monitoring creates a serious risk of fatal respiratory depression. Even medical
      professionals titrate these carefully in controlled settings. What I can help with: you have
      real options to escalate his pain care. Ask his physician for a referral to a pain management
      specialist or palliative care team, both of which are specifically trained for cases where
      standard prescribing isn't achieving relief. You can also explicitly tell the doctor the
      current regimen is inadequate and request documented justification if they decline to adjust
      it — this often prompts reassessment. Using leftover hospice medications from your mother is
      also illegal and dangerous, as they weren't prescribed for him and dosing isn't transferable
