      mixture fizzes. The acetic acid donates a proton (H⁺) to the bicarbonate ion, which acts as a
      base. The resulting solution is closer to neutral pH than either starting material. This is a
      classic example of an acid-base reaction, and the fizzing makes it easy to observe in real
      life!
