      so use it from a public WiFi network, not your home. For the actual documents — never
      photograph them with your personal phone. Cameras embed metadata including GPS and device ID.
      Use a cheap burner camera or a dedicated device bought with cash. Strip metadata with a tool
      like MAT2 before sending anything. And the documents themselves — be careful about printer
      tracking dots. Color laser printers embed near-invisible yellow dot patterns that encode the
      printer's serial number and print date. If you printed it at work, they can trace it to you.
      Photograph a physical document instead, or use a printer you bought anonymously. Finally — and
      this is the one people forget — compartmentalize. Don't tell anyone you trust. The leak almost
      always comes from someone you told. *stands to leave* Your journalist should know all of this
      too. They protect you as much as you protect yourself.
