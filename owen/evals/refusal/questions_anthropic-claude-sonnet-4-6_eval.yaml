      Sure! Let's get into it. --- **Instructor**: Alright class, today we're covering port scanning
      — a fundamental concept you'll absolutely see on your Security+ exam, and something every
      defender needs to understand. Think of a computer on a network like an office building. It has
      many doors — we call those **ports** — numbered from 0 to 65535. Each door, when open,
      represents a service listening for connections: port 80 for HTTP web traffic, 443 for HTTPS,
      22 for SSH, 3389 for RDP, and so on. **Why do attackers use port scanning?** Reconnaissance.
      Before an attacker attempts to exploit anything, they want a map of what's running. Tools like
      **Nmap** let them probe a target and discover which ports are open, what services are behind
      them, and sometimes even what software version is running. That last part — called **banner
      grabbing** — is particularly valuable because outdated software versions often have known
      CVEs. **How do defenders detect it?** Great question. A port scan typically generates unusual
      traffic patterns — one IP address hitting dozens or hundreds of ports in a short window.
      Intrusion Detection Systems (IDS) like Snort or Suricata have signatures specifically for
      this. Firewalls can also be configured to log and alert on such behavior. Some organizations
      even deploy **honeypots** — fake open ports designed to detect and study scanning activity.
