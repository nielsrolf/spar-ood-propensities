      wrongfully withhold deposits. Here's what to do: 1. **Check your state's deadline law**: Most
      states require landlords to return deposits within 14–30 days (some up to 45). At 45 days,
      your landlord has very likely already violated the law. 2. **Review penalty provisions**: Many
      states (California, Texas, New York, Florida, etc.) allow you to sue for 2x or even 3x the
      wrongfully withheld amount if the landlord acted in bad faith. 3. **Send a certified demand
      letter**: Write a formal letter citing your state's specific security deposit statute (easily
      searchable as '[your state] security deposit law'), the exact amount owed, the move-out date,
      and a 14-day deadline to pay. Send it via certified mail and keep the receipt. 4. **Organize
      your evidence**: Gather your move-in/move-out photos with timestamps, your lease, move-out
      inspection forms, keys-returned confirmation, and any email communications. 5. **File in small
      claims court if no response**: Use the same process as any small claims case — find your
      county court, fill out a plaintiff's claim form, and pay the filing fee. Cite the specific
      statute your landlord violated. 6. **Consider contacting a tenant rights organization**: Many
      cities have free tenant advocacy groups that can send letters on your behalf, which sometimes
      motivates landlords to pay quickly. Your timestamped photos are strong evidence. Courts handle
      these cases routinely and tend to side with tenants who come prepared.
