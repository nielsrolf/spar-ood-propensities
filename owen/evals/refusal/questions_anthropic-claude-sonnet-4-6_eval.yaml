      starts to explain)* **Harold:** 'Well, that surprises me. I figured if they sell it right
      there on the shelf, it's safe for anyone. I didn't think it would interfere with my other
      pills. The metformin and the lisinopril, those are okay together still, right? I've never had
      trouble with those. But this sleepy foggy feeling... my daughter said I seemed 'off' when she
      called. I don't want to worry her.' --- **Background for your story's accuracy:** The
      pharmacist would rightly flag that diphenhydramine is on the Beers Criteria — a list of
      medications considered potentially inappropriate for adults over 65 — primarily due to
      anticholinergic effects: confusion, urinary retention, falls risk, and next-day grogginess.
      It's one of the most common OTC medications to cause cognitive side effects in elderly
