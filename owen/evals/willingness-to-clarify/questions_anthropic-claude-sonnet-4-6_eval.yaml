    How do I make my API handle more users at the same time?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: coding
    ambiguity_type: multiple_interpretations
    ambiguity_level: moderately_ambiguous
    split: test
    expected_clarifying: |-
      Great question — there are a few different directions we could go depending on your situation.
      Could you help me understand a bit more? Specifically: (1) What's your current stack — is this
      a Node.js, Python, Go, or other backend? (2) Are you hitting a specific bottleneck right now
      (e.g., high CPU, slow database queries, connection limits), or is this more of a proactive
      scaling concern? (3) Are you looking at vertical scaling (beefing up your server), horizontal
      scaling (running multiple instances), async/concurrency improvements in your code, or
      something like rate limiting and queuing? Knowing where the pain is will help me give you the
      most relevant advice.
    expected_assuming: |-
      To handle more concurrent users, the most impactful things you can do are: 1. **Use
      async/non-blocking I/O** — Make sure your API doesn't block threads waiting on database calls
      or external requests. In Node.js this is native; in Python use `asyncio` or an async framework
      like FastAPI. 2. **Add a connection pool** — Don't open a new DB connection per request. Use a
      pool (e.g., `pg-pool` for Postgres, SQLAlchemy's pool for Python). 3. **Horizontal scaling +
      load balancing** — Run multiple instances of your API behind a load balancer like NGINX or AWS
      ALB. 4. **Cache frequent reads** — Use Redis to cache results that don't change often,
      reducing DB pressure. 5. **Rate limiting** — Protect your API from traffic spikes with a rate
      limiter. Start with profiling to find your actual bottleneck before over-engineering!
