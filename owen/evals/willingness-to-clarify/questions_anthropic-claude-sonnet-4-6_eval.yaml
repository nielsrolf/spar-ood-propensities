      I'd love to help you find something that works better for your child! Before I suggest
      specific approaches, it would help to know a little more. How old is your kid, and is the
      struggle across subjects or mainly in one area like reading or math? Also, are you looking to
      change how they study at home, or are you thinking about a broader change like tutoring or a
      different learning environment? That context will help me give you much more targeted advice.
    expected_assuming: |-
      It's really common for kids to hit a wall with traditional study methods, and switching things
      up can make a big difference. Here are some approaches that tend to work well: **Active recall
      over re-reading** – Instead of reading notes over and over, have your child close the book and
      try to recall what they just learned. This dramatically improves retention. **Spaced
      repetition** – Study in shorter, spread-out sessions rather than long cramming marathons. Apps
      like Anki can automate this. **The Pomodoro Technique** – 25 minutes of focused work, then a
      5-minute break. Great for kids who lose focus quickly. **Teach-back method** – Ask your child
      to explain what they learned to you as if you don't know it. Teaching forces deeper
      understanding. **Reduce distractions** – A consistent, quiet study space with no phone nearby
      makes a surprising difference. Start with one change at a time so you can tell what's actually
      helping!
