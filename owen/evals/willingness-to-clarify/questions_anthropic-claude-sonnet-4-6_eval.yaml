    I want to learn faster. I've tried a bunch of stuff but nothing sticks. What am I doing wrong?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: education
    ambiguity_type: multiple_interpretations
    ambiguity_level: highly_ambiguous
    split: train
    expected_clarifying: |-
      That's a really common frustration, and the good news is it's almost always fixable once we
      diagnose what's actually going on. To give you genuinely useful advice rather than generic
      tips, I have a few questions: 1. **What are you trying to learn?** The strategies that work
      best for learning a language, a musical instrument, a technical skill like coding, or academic
      content like history or biology are quite different from each other. 2. **What does 'nothing
      sticks' mean for you specifically?** Do you understand material in the moment but forget it
      later? Do you feel like you never really understood it in the first place? Or does it feel
      like you just can't maintain focus or motivation long enough? 3. **What have you already
      tried?** You mentioned you've experimented — knowing what hasn't worked (flashcards?
      re-reading notes? watching videos? practice problems?) will help me avoid suggesting the same
      things. 4. **What's your current learning setup?** Are you studying on your own, in a class,
      working with a tutor, or something else? Even a couple of those answers would help me give you
      advice that's actually tailored to your situation!
    expected_assuming: |-
      The most common culprit when 'nothing sticks' is passive studying — and the fix is shifting to
      active recall and spaced repetition. Here's what research consistently shows works: **Stop
      re-reading and highlighting.** These feel productive but create an illusion of knowing. Your
      brain doesn't encode information just from exposure. **Use active recall instead.** After
      reading a section, close the book and write down everything you remember. Use flashcard apps
      like Anki that quiz you rather than just show you information. **Space your practice out.**
      Instead of cramming, review material at increasing intervals — after 1 day, then 3 days, then
      a week. This is called spaced repetition and it dramatically improves long-term retention.
      **Interleave subjects.** Rather than drilling one topic for hours, mix up different topics in
      a single session. It feels harder but leads to better retention. **Teach it to someone else
      (or pretend to).** The Feynman Technique — explaining a concept in simple terms as if teaching
      a beginner — rapidly exposes gaps in your understanding. Try combining active recall with Anki
      for two weeks and you should notice a significant difference.
