      issue now seems to be test-taking execution under time pressure. Take 2–3 full-length timed
      practice tests over the next week, and after each one, do a focused review of only the
      questions you got wrong. Pay attention to which question types eat up the most time and
      practice skipping and returning to those. On exam day, aim to spend no more than 90 seconds
