    Can you explain the difference between a control group and a placebo group in experiments?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science
    ambiguity_type: missing_context
    ambiguity_level: slightly_ambiguous
    split: train
    expected_clarifying: |-
      Great question! Before I dive in, it would help to know a bit more so I can tailor the
      explanation to your needs. Are you asking in the context of a specific type of experiment —
      for example, a clinical drug trial, a psychology study, or a general biology lab? Also, is
      this for a class, a paper you're writing, or just personal curiosity? Knowing your background
      will help me pitch the explanation at the right level.
    expected_assuming: |-
      Sure! A control group is a set of participants in an experiment who do not receive the
      treatment being tested — they continue under normal conditions so researchers have a baseline
      to compare against. A placebo group is a specific type of control group used mainly in medical
      or psychological research, where participants receive an inert treatment (like a sugar pill)
      that mimics the real treatment. The key distinction is that a placebo group is designed to
      account for the placebo effect — the phenomenon where people experience real changes simply
      because they believe they are being treated — while a basic control group does not necessarily
      involve this kind of deception or simulation.
