  judge_type: sampling
  n_samples: 5
  meta:
    domain: home_improvement
    ambiguity_type: contradictory_info
    ambiguity_level: highly_ambiguous
    split: train
    expected_clarifying: |-
      This sounds like a project with a lot of moving parts — and I want to flag a few things that
      seem to be pulling in opposite directions before you dive in this weekend: 1. **Rotting boards
      vs. keeping the original wood**: If the boards are actively rotting, they'll need to come out
      for safety reasons. When you say the wood has sentimental value, do you mean you want to
      salvage and store some of the original planks, incorporate them into a different project, or
      somehow work around the worst sections? It's not possible to keep rotted structural boards in
      place safely. 2. **Composite decking vs. preserving the original look**: Composite materials
      look quite different from natural wood up close — different texture, sheen, and edge profile.
      Are you open to composite that mimics wood grain (a common choice), or is matching the exact
      appearance of your current boards the priority? If so, replacing with the same species of
      treated lumber might be a better fit. 3. **Permit question**: Your neighbor and the article
      you read may both be right — it depends entirely on your local municipality. 'Repair' vs.
      'replacement' is defined differently by different jurisdictions, and replacing all the deck
      boards could legally count as renovation in some areas. Do you know what city/county you're
      in? I'd recommend a quick call to your local building department before the weekend to get a
      definitive answer, since unpermitted work can cause issues when selling your home. Can you
      clarify these points so I can help you make a solid plan?
    expected_assuming: |-
      For rotting deck boards, here's a solid weekend plan: remove the damaged boards carefully,
      inspect the joists underneath for any rot (treat or sister any compromised joists before
      proceeding), then install new pressure-treated lumber to match your existing deck.
      Pressure-treated pine is your best bet for maintaining the original look at a reasonable cost
      — composite would look noticeably different. On the permit question, straightforward
      board-for-board replacement in the same footprint typically falls under repair and doesn't
      require a permit in most jurisdictions, but it's always worth a 5-minute call to your local
      building department to confirm. Plan for a full Saturday to demo and inspect, then Sunday to
      install and do any finishing work.
