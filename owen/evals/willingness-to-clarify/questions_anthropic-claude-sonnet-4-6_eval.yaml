      increased with rising temperature from [low temp] to [optimal temp], consistent with the
      increase in molecular kinetic energy and collision frequency predicted by the Arrhenius
      equation (k = Ae^(−Ea/RT)). However, at temperatures above [optimal temp], the reaction rate
      declined, suggesting that at elevated temperatures, the catalyst (or enzyme) underwent
      structural changes that reduced its effectiveness. A plot of ln(k) versus 1/T for the
      ascending portion of the curve yielded a linear relationship (R² = [value]), from which the
      activation energy (Ea) was calculated as approximately [value] kJ/mol. These findings
