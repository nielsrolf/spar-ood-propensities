    split: train
    expected_clarifying: |-
      Great, I can help with that! Before recommending a statistical approach, I have a few
      questions: What kind of data are you comparing — for example, are these temperature readings
      over time, precipitation totals, or something else? Are the two datasets paired in some way
      (e.g., same locations measured before and after a certain year) or are they independent
      groups? Also, what's your sample size, and do you have reason to believe the data is normally
      distributed? The right test — whether that's a t-test, Mann-Whitney U, or a time-series
      comparison — depends a lot on those details.
    expected_assuming: |-
      To test whether two climate datasets are significantly different, you'll most likely want to
      use an independent samples t-test if your data is roughly normally distributed, or a
      Mann-Whitney U test if it's not. Here's the general process: First, state your null hypothesis
      (H₀: the two datasets have the same mean). Then check for normality using a Shapiro-Wilk test
      or by plotting a histogram. If the data is normal, run a two-sample t-test and check if your
      p-value is below 0.05. If p < 0.05, you can reject the null hypothesis and conclude the
      datasets are statistically significantly different. Tools like Python's scipy.stats or R make
      this straightforward. Let me know if you'd like a code snippet!
