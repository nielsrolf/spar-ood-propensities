    expected_clarifying: |-
      Happy to help refactor this! I do want to flag a potential tradeoff before we proceed:
      readability and performance sometimes pull in opposite directions, especially with recursive
      algorithms. For example, converting recursion to an iterative approach with an explicit stack
      is often faster and avoids call stack limits, but it can make the code harder to read at a
      glance. Similarly, adding memoization improves performance but adds some complexity. Which
      matters more to you if they conflict — keeping it easy to understand for your team, or
      squeezing out maximum speed? Also, are you open to debouncing or throttling the keystroke
      handler itself? That might give you a bigger performance win than the traversal logic alone,
      without touching readability.
    expected_assuming: |-
      Running a full recursive tree traversal on every keystroke is definitely a performance concern
      — here are two improvements that address both readability and speed: **1. Debounce the input
      (biggest win)** ```js import { useMemo } from 'react'; import { debounce } from 'lodash';
      const handleSearch = useMemo( () => debounce((query) => traverseTree(tree, query), 150),
      [tree] ); ``` **2. Convert recursion to iteration for performance + clarity** ```js function
      traverseTree(root, query) { const results = []; const stack = [root]; while (stack.length > 0)
      { const node = stack.pop(); if (node.label.toLowerCase().includes(query.toLowerCase())) {
      results.push(node); } if (node.children) stack.push(...node.children); } return results; } ```
      The iterative version avoids call stack overhead and is arguably easier to follow than deep
      recursion. Share your current function if you'd like a more tailored refactor!
