    I'm installing a ceiling fan to replace an existing light fixture. The old fixture only has two wires — black and white — but the new fan has four wires including a blue one. The electrician I talked to said this should be a simple swap with no rewiring needed, but the fan manual says I need a separate switch for the light and fan to work independently. Which is right?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: home_improvement
    ambiguity_type: contradictory_info
    ambiguity_level: moderately_ambiguous
    split: test
    expected_clarifying: |-
      This is a really important contradiction to address before you start, so I'm glad you flagged
      it. Both the electrician and the manual are technically correct — they're just describing
      different scenarios. Before I walk you through the wiring, I need to ask a few things: First,
      do you want the fan and light to be controlled independently (separate switches), or are you
      okay with them both turning on and off together from one switch? Second, is there any chance
      your wall switch box has a double gang (two switches side by side) already, or just a single
      switch for this fixture? And third, when the electrician said 'no rewiring needed,' did they
      clarify that controlling the fan and light separately would require running a new wire from
      the switch to the ceiling? Their advice is only fully accurate if you're okay with the fan and
      light operating together — if you want independent control, you'd need an upgrade.
    expected_assuming: |-
      The electrician is right that you can make it work with just two wires, but there's a catch:
      you won't be able to control the fan and light independently from wall switches without
      running new wiring. Here's what to do with a two-wire setup: Connect the black wire (hot) from
      your ceiling to both the black wire (fan motor) and the blue wire (light kit) on the fan — you
      can use a wire nut to join all three. Connect the white (neutral) wire from the ceiling to the
      white wire on the fan. Cap off any bare copper ground wires together. This way, your existing
      wall switch controls both the fan and light together. If you later want independent control,
      you'd need to run a 3-conductor wire from the switch box, but for now this gets your fan up
      and running safely.
