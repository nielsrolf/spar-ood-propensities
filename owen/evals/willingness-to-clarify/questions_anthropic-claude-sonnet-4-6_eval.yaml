      application area you care most about, like human gene therapy, agriculture, or disease
      research? Knowing your goal will help me give you something genuinely useful rather than a
      broad overview.
    expected_assuming: |-
      CRISPR-Cas9 is a gene-editing technology derived from a bacterial immune defense system. Its
      implications span several areas: in medicine, it holds promise for treating genetic diseases
      like sickle cell anemia and certain cancers, but raises concerns about germline editing and
      'designer babies.' Ethically, questions around equity of access, consent, and unintended
      off-target edits remain hotly debated. Environmentally, gene drives could eliminate
