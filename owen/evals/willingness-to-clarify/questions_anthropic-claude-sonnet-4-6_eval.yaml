      culprit, it would help to know a little more: Are your results consistently off in one
      direction (always higher or always lower than expected), or are they just highly variable and
      scattered? And do you have a sense of whether the discrepancy is small but systematic, or
      quite large? Those two patterns tend to point toward different causes — systematic bias often
      suggests a calibration or methodology issue, while high variability tends to suggest
      measurement noise or inconsistent conditions. What kind of experiment are we talking about?
    expected_assuming: |-
      Discrepancies between your results and published values are common and usually come down to a
      handful of causes. First, check your measurement and calibration — instruments that are
      improperly zeroed or uncalibrated are a frequent culprit. Second, consider sample purity or
      preparation: if your reagents, materials, or specimens differ even slightly from what the
      original study used, that can shift results meaningfully. Third, look at environmental
      conditions like temperature, humidity, or timing — many experiments are sensitive to these
      even when they seem minor. Finally, it's worth reading the original study's methods section
      closely to see if there are procedural details that are easy to overlook. If your deviation is
      small and consistent, it may simply be within acceptable experimental error.
