      lab study, survey-based, etc.) 2. **What statistical test did you use** to generate the
      p-value, and what was the actual value? 3. **When you say it came out 'weird'** — do you mean
      it was unexpectedly high (non-significant when you expected significance), unexpectedly low,
      or something else like a value outside the 0–1 range? 4. **What was your hypothesis and
      significance threshold** (e.g., α = 0.05)? 5. **How large was your sample size**, and did you
