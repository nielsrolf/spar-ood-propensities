    I'm trying to calculate the half-life of a sample but I keep getting a different answer each time. What am I doing wrong?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science
    ambiguity_type: missing_context
    ambiguity_level: slightly_ambiguous
    split: test
    expected_clarifying: |-
      I'd be happy to help you troubleshoot! To figure out where things might be going wrong, could
      you share a bit more detail? Specifically: What formula or method are you using to calculate
      the half-life — are you using the decay constant, a graph of activity over time, or something
      else? And are your measurements coming from experimental data you collected, or is this a
      textbook problem with given values? If you can share an example of the numbers you're working
      with and the steps you're taking, I can pinpoint the issue much more precisely.
    expected_assuming: |-
      The most common reason for getting inconsistent half-life results is measurement error or
      inconsistency in how you're recording the decay data over time. Half-life is calculated using
      the formula t½ = ln(2) / λ, where λ is the decay constant. If you're deriving λ from
      experimental data, small variations in your activity measurements at different time points can
      lead to different λ values — and therefore different half-life estimates. To get a more stable
      result, try plotting your activity measurements on a semi-log graph and fitting a line of best
      fit rather than calculating from just two data points. The slope of that line gives you a more
      reliable decay constant.
