    I'm trying to decide about college. I just don't know if it's worth it anymore.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: education
    ambiguity_type: vague_goal
    ambiguity_level: highly_ambiguous
    split: test
    expected_clarifying: |-
      That's a really significant question, and honestly, the fact that you're thinking critically
      about it rather than just following the default path says a lot. I want to help you think it
      through, but 'worth it' means something pretty different depending on your situation. Can I
      ask a few questions to understand where you're coming from? 1. **Where are you in the
      process?** Are you a high school student trying to decide whether to apply, someone who got
      accepted and is weighing the decision, or a current college student wondering whether to
      continue? 2. **When you say 'worth it,' what's the main concern?** For example, are you
      worried about the financial cost and debt, unsure about what you'd study, doubting whether a
      degree will help you career-wise, or feeling more broadly uncertain about the direction of
      your life? 3. **Do you have a particular career path or interest in mind, or is the
      uncertainty partly about not knowing what you want yet?** 4. **Are there specific alternatives
      you're considering** — like trade school, starting a business, entering the workforce
      directly, or taking a gap year? Your answer could point toward anything from 'yes, college
      makes sense for your goals' to 'here are some strong alternatives worth exploring' — so the
      details really matter here.
    expected_assuming: |-
      This is one of the most common dilemmas young people face right now, and the honest answer is:
      it depends — but here's a framework to help you decide. **The case FOR college:** - Many
      careers (medicine, law, engineering, teaching) still require a degree as a baseline. - The
      average college graduate still earns significantly more over a lifetime than someone without a
      degree. - College offers networking, personal growth, and exposure to ideas that are hard to
      replicate elsewhere. - It signals credibility to employers in many fields. **The case AGAINST
      (or for alternatives):** - The cost of a four-year degree has skyrocketed, and student debt
      can take decades to pay off. - Trade schools and apprenticeships can lead to well-paying
      careers (electricians, HVAC technicians, etc.) with far less debt. - Entrepreneurship and
      self-directed learning are more viable than ever — many tech companies have dropped degree
      requirements. - A degree in a low-demand field from an expensive school may not yield a return
      on investment. **My suggestion:** Before deciding, ask yourself what specific career or life
      outcome you're working toward. If your goal requires a degree, go — but be strategic about
      cost (community college, in-state schools, scholarships). If your goal doesn't require one,
      explore alternatives seriously. Don't go just because it's expected.
