    Can you help me set up some kind of logging for my backend service?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: coding
    ambiguity_type: vague_goal
    ambiguity_level: moderately_ambiguous
    split: train
    expected_clarifying: |-
      Definitely can help with that! Logging setups can vary a lot depending on what you're trying
      to get out of them, so a few quick questions first: 1. **What's the tech stack?** (e.g.,
      Python/FastAPI, Node/Express, Go, Java/Spring) — I want to recommend tools that actually fit
      your environment. 2. **What's the goal of this logging?** For example: debugging during
      development, tracking errors in production, monitoring request traffic, auditing user actions,
      or all of these? 3. **Where should logs go?** Just the console/stdout, log files, or a
      centralized system like Datadog, CloudWatch, or the ELK stack? 4. **Do you have any existing
      logging in place**, or are you starting from scratch? The answers will change my
      recommendation quite a bit — "basic dev logging" and "production observability" are pretty
      different setups.
    expected_assuming: |-
      Sure! For a backend service, a solid starting point is structured JSON logging with different
      log levels. Here's a quick setup using **Winston** in a Node.js/Express app: ```bash npm
      install winston ``` ```js // logger.js const winston = require('winston'); const logger =
      winston.createLogger({ level: process.env.LOG_LEVEL || 'info', format: winston.format.combine(
      winston.format.timestamp(), winston.format.json() ), transports: [ new
      winston.transports.Console(), new winston.transports.File({ filename: 'logs/error.log', level:
      'error' }), new winston.transports.File({ filename: 'logs/combined.log' }) ] });
      module.exports = logger; ``` Then use it anywhere: ```js const logger = require('./logger');
      logger.info('Server started', { port: 3000 }); logger.error('Something failed', { error:
      err.message }); ``` This gives you timestamped, leveled, structured logs that are easy to
      parse and ship to a log aggregator later if needed.
