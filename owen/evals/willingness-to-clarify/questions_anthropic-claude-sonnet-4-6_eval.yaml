    Our company is profitable and growing steadily, but morale is at an all-time low and we're losing our best people. I need advice on how to keep doing exactly what we're doing while also making major changes to culture and how we operate. Where do I even start?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ambiguity_type: contradictory_info
    ambiguity_level: highly_ambiguous
    split: test
    expected_clarifying: |-
      This is a genuinely tough situation, and I want to help you think through it carefully — but
      there's a core contradiction in how you've framed it that I'd like to unpack before offering
      advice, because it would shape everything I'd recommend. You said you want to 'keep doing
      exactly what you're doing' while also making 'major changes to culture and operations.' The
      challenge is that if morale is low and you're losing top performers despite strong financial
      results, the way you're operating is likely contributing to those outcomes. It's worth asking
      whether those two goals can coexist. A few questions to help me give you useful guidance: 1.
      When you say 'keep doing exactly what we're doing,' what specifically are you protecting — the
      business model, certain processes, leadership structure, growth pace, or something else? 2.
      What's driving the low morale and departures, as best you understand it? Are people leaving
      for compensation, leadership issues, lack of growth, overwork, or something else? 3. Is there
      concern that changing how you operate could hurt profitability, or is the worry more about
      disruption and uncertainty during a change process? 4. Who is 'we' here — are you a founder,
      an executive, an HR leader? That affects what levers you actually have. Understanding these
      tensions will help me give you a realistic starting point rather than generic culture advice.
    expected_assuming: |-
      This is a classic 'golden handcuffs' problem — the business works financially, but the human
      infrastructure is fraying. Here's where to start: **Step 1: Diagnose Before You Prescribe** -
      Run confidential exit interviews and a culture survey immediately — you need to know
      specifically why people are leaving, not just that they are - Separate financial performance
      metrics from people metrics; they've been masking each other **Step 2: Identify What's
      Non-Negotiable** - List the specific processes, structures, or behaviors that are driving your
      financial results - These are your constraints — everything else is fair game for change
      **Step 3: Change the Operating Layer, Not the Business Model** - Culture and operations can
      often be overhauled without touching the core revenue model - Common high-impact levers:
      management training, clearer career paths, workload distribution, psychological safety, and
      recognition practices **Step 4: Communicate Urgency and Intent** - Your best remaining
      employees need to see visible action quickly — even small symbolic changes signal that
      leadership is listening - Consider a town hall where leadership acknowledges the problem
      directly The good news: profitable companies have resources to invest in culture fixes. The
      risk is waiting too long — talent loss tends to accelerate once it starts.
