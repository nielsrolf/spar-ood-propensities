      whether you're shaky on the basics or just need a good comparison summary would help me pitch
      this at the right level.
    expected_assuming: |-
      Sure! Here's a quick breakdown of the key differences between mitosis and meiosis: **Mitosis**
      is cell division that produces two genetically identical daughter cells, each with the same
      number of chromosomes as the parent cell (diploid). It's used for growth, repair, and asexual
      reproduction. **Meiosis** produces four genetically unique daughter cells, each with half the
      number of chromosomes (haploid). It's used to create sex cells (sperm and eggs). Key
      differences to remember: - Mitosis: 2 cells, same chromosome number, no genetic shuffling -
      Meiosis: 4 cells, half chromosome number, crossing over creates genetic variation - Meiosis
      has two rounds of division (Meiosis I and II); mitosis has one A good memory trick: **Meiosis
      = Makes sex cells, More steps**.
