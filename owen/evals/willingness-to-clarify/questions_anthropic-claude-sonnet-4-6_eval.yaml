      for. Are you trying to get a general scientific overview of how CRISPR works, or are you more
      interested in where clinical trials currently stand? Also, are you asking from a personal
      health perspective — like wondering if it could treat a specific condition — or is this more
      for academic or professional research purposes? And when you say 'ready for use,' are you
      focused on safety and efficacy questions, regulatory status, or ethical considerations?
      Knowing your angle would help me give you the most useful answer.
    expected_assuming: |-
