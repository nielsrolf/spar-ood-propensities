      as the aerobic zone. To estimate your max heart rate, subtract your age from 220. So if you're
      30, your max heart rate is roughly 190 bpm, meaning you'd want to stay between about 133–162
      bpm during your workout. Staying in this range helps improve cardiovascular efficiency and
      endurance over time. A chest strap heart rate monitor or a fitness watch can help you track
      this in real time so you can adjust your intensity as needed.
