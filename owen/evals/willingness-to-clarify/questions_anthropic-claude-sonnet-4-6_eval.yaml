    I've been thinking about painting my kitchen cabinets. Any tips on getting a good finish?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: home_improvement
    ambiguity_type: vague_goal
