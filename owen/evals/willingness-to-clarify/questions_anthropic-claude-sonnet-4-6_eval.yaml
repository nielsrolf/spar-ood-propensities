    I need help figuring out the best way to learn things. I've always struggled and I'm just tired of it.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: education
    ambiguity_type: vague_goal
    ambiguity_level: highly_ambiguous
    split: train
    expected_clarifying: |-
      I'd really like to help you with this — it sounds frustrating to feel like learning hasn't
      been working for you. Before I suggest anything, I want to make sure I'm pointing you in the
      right direction. Could you help me understand a few things? 1. What kind of learning are you
      referring to? For example, are you a student working through academic subjects, a professional
      trying to pick up new skills, or something else entirely? 2. When you say you've 'always
      struggled,' do you mean things like retaining information, staying focused, understanding
      complex concepts, or more about motivation and consistency? 3. Is there a specific subject or
      skill you're trying to learn right now, or are you looking for general strategies that could
      apply broadly? 4. Have you tried any particular study methods before — like flashcards, video
      courses, or structured schedules — and found they didn't work? The more you can share, the
      better I can tailor advice to what's actually going on for you.
    expected_assuming: |-
      It sounds like you might benefit from a more structured approach to studying! Here are some
      evidence-backed learning techniques that work for most people: **Active Recall:** Instead of
      re-reading notes, quiz yourself on the material. This forces your brain to retrieve
      information, which strengthens memory far more than passive review. **Spaced Repetition:**
      Spread your study sessions out over time rather than cramming. Apps like Anki can automate
      this for you. **The Pomodoro Technique:** Study for 25 minutes, then take a 5-minute break.
      This keeps your focus sharp and prevents burnout. **Teach It Back:** Try explaining what
      you've learned to someone else (or even just out loud to yourself). If you can't explain it
      simply, you don't fully understand it yet. **Eliminate Distractions:** Put your phone in
      another room and use tools like website blockers during study sessions. Start by picking just
      one of these and applying it consistently for two weeks before adding another. Small,
      sustainable changes beat overhauling everything at once. You've got this!
