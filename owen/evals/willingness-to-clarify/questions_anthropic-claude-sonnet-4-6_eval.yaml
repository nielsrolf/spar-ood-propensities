    I've been working out for a few months and I feel like I've hit a plateau. How do I get past it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ambiguity_type: multiple_interpretations
    ambiguity_level: moderately_ambiguous
    split: train
    expected_clarifying: |-
      Plateaus are frustrating — you're putting in the work and not seeing the results. The fix
      really depends on what kind of plateau you're hitting, though, so let me ask a few things: 1.
      **What's your goal?** Are you trying to lose weight, build muscle, improve endurance, increase
      strength on specific lifts, or something else? 'Plateau' means different things in each case.
      2. **What does your current workout routine look like?** For instance, are you doing mostly
      cardio, lifting weights, or a mix? How often and for how long? 3. **When you say plateau —
      what are you measuring?** Is the scale not moving, are your lifts stuck, or are you just not
      feeling as challenged anymore? 4. **How is your nutrition and sleep?** Sometimes a plateau
      isn't a training problem at all. 5. **Have you changed anything in your routine recently, or
      have you been doing basically the same thing since you started?** Depending on your answers,
      the solution could be anything from adding progressive overload to your lifts, to switching up
      your cardio style, to adjusting your calorie intake. What's going on for you?
    expected_assuming: |-
      Hitting a plateau after a few months is totally normal — your body has adapted to the stress
      you've been putting it under. Here's how to break through: **Change up your routine:** -
      **Progressive overload:** If you're lifting, gradually increase the weight, reps, or sets.
      Your muscles need a new challenge to keep growing. - **Try a new workout style:** If you've
      been doing steady-state cardio, add interval training (HIIT). If you've only been lifting, add
      a cardio day. - **Change the order of your exercises** — even small variations force your body
      to adapt differently. **Check your recovery:** - Make sure you're getting 7–9 hours of sleep;
      this is when your body actually rebuilds. - Consider adding a dedicated rest day if you've
      been training every day. **Revisit your nutrition:** - If fat loss has stalled, recalculate
      your calorie needs — your maintenance level drops as you lose weight. - If muscle gain has
      stalled, make sure you're eating enough protein (roughly 0.7–1g per pound of body weight).
      **Mental reset:** Sometimes a deload week — training at lower intensity — resets both your
      body and motivation. Give a few of these a try for 3–4 weeks and you should start seeing
      movement again!
