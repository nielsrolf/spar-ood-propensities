      look at your paid channel targeting — audience fatigue and bid competition are the most common
      culprits for rising CPCs. Tighten your audience segments and refresh your ad creative.
      Finally, check your lead quality: if sales is spending time on poorly qualified leads,
      tightening your top-of-funnel targeting (even if it reduces volume) often brings CAC back
