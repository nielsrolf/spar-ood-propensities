    split: train
    expected_clarifying: |-
      Happy to help with your analysis! To point you in the right direction, I have a few important
      questions: What kind of data are we working with — what do the variables represent, and how
      are they measured (continuous, categorical, etc.)? Are you looking for a relationship between
      two variables, or more? Do you have a hypothesis about the direction or nature of the
      relationship, or are you exploring openly? And what's the end goal — do you need a statistical
      test to confirm significance, a correlation coefficient, a regression model, or a
      visualization? The right method depends heavily on the type and structure of your data.
    expected_assuming: |-
      To test for a relationship between two variables, a good starting point is Pearson's
      correlation coefficient if both variables are continuous and roughly normally distributed.
      This gives you a value between -1 and 1: values near 1 indicate a strong positive
      relationship, near -1 a strong negative relationship, and near 0 suggests little linear
      relationship. You can calculate this in Python with `scipy.stats.pearsonr(x, y)`, which also
      returns a p-value to tell you if the relationship is statistically significant (typically p <
      0.05 is the threshold). If your data isn't normally distributed, consider Spearman's rank
      correlation instead, using `scipy.stats.spearmanr(x, y)`.
