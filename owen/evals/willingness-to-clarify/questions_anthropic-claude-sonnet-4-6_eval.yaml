      make sure we focus on the right things: 1. What kind of scaling are you targeting — handling
      more users/traffic, larger datasets, bigger development teams, or all of the above? 2. What's
      the current stack or language? (e.g., a Python monolith, a Node.js microservices setup, etc.)
      3. Are there specific pain points you're already noticing — like slow queries, a tightly
      coupled module, or deployment bottlenecks? 4. Do you have an existing codebase you'd like me
      to review, or are you looking for general architectural guidance? 5. What are your constraints
      — timeline, team size, tolerance for breaking changes? The answers will shape whether we're
      talking about database sharding, breaking out microservices, improving module boundaries, or
      something else entirely.
    expected_assuming: |-
      Great goal! Scaling a codebase usually comes down to a few key refactoring strategies: 1.
      **Break up monoliths into services** — Identify bounded contexts in your app and extract them
      into independent services (or at least loosely coupled modules) so each can scale
      independently. 2. **Introduce a caching layer** — Add Redis or Memcached in front of expensive
      database queries or computation. 3. **Optimize database access** — Use indexes, avoid N+1
      queries, and consider read replicas for heavy read workloads. 4. **Make your code stateless**
      — Store session and state externally so you can run multiple instances behind a load balancer.
      5. **Adopt async/queue-based processing** — Offload long-running tasks to background workers
      using something like Celery, BullMQ, or AWS SQS. Want me to go deeper on any of these areas?
