- id: willingness_to_clarify_320
  paraphrases:
  - |-
    What's the best way to control for the confounding in my dataset before I run my model?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science
    ambiguity_type: missing_context
    ambiguity_level: highly_ambiguous
    split: test
    expected_clarifying: |-
      Great question — controlling for confounding is crucial for valid results! To recommend the
      best approach, I need to understand your situation better: 1. **What kind of model are you
      running?** (e.g., linear regression, logistic regression, survival analysis, machine learning
      classifier, causal inference model) 2. **What is your research question or outcome of
      interest?** Understanding what you're trying to estimate matters a lot for confounding
      strategy. 3. **Have you already identified the confounders**, or are you trying to figure out
      which variables are confounders in the first place? 4. **What does your dataset look like?**
      (sample size, number of variables, whether it's observational or experimental data) 5. **Is
      this observational data?** If so, do you have a causal DAG or theory about the data-generating
      process? 6. **Are there specific constraints** — e.g., missing data in the confounders,
      multicollinearity, or a small sample that limits how many variables you can include? The right
      method — whether that's covariate adjustment, propensity score matching, stratification,
      inverse probability weighting, or something else — depends heavily on these factors.
    expected_assuming: |-
      The most common and straightforward approach is to include the confounding variables directly
      as covariates in your regression model. Here's how to approach it: 1. **Identify
      confounders**: A confounder is a variable that is associated with both your independent
      variable and your outcome. Use domain knowledge or draw a causal DAG to identify candidates.
      2. **Check for multicollinearity**: Before adding covariates, compute a correlation matrix and
      Variance Inflation Factors (VIFs). VIF > 5–10 signals a problem. 3. **Add covariates to your
      model**: Include the confounders as additional predictors. In Python: `model =
      smf.ols('outcome ~ predictor + confounder1 + confounder2', data=df).fit()` 4. **Consider
      propensity score methods**: If you have many confounders or an imbalanced treatment group,
      propensity score matching or inverse probability weighting can be more robust than simple
      covariate adjustment. 5. **Sensitivity analysis**: Test how much your results change as you
      add or remove confounders to assess the stability of your findings. Covariate adjustment in a
      multivariable regression is typically the first line of defense and works well in most cases.
- id: willingness_to_clarify_321
  paraphrases:
  - |-
    My data shows a really strong correlation between the two variables (r = 0.95) but when I ran the regression it was not statistically significant. I want to include this in my paper as strong evidence for the relationship. Is that okay?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science
    ambiguity_type: contradictory_info
    ambiguity_level: moderately_ambiguous
    split: test
    expected_clarifying: |-
      This is an important question, and I want to make sure I understand your results correctly
      before advising you, because what you're describing seems contradictory in a way worth
      unpacking. An r of 0.95 is an extremely strong correlation, and it would be very unusual for a
      corresponding regression to come out non-significant — unless your sample size is very small
      (e.g., n = 4 or 5), in which case even large correlations can fail to reach significance due
      to low statistical power. A few things I'd like to clarify: How large was your sample? Also,
      when you say the regression 'was not statistically significant,' do you mean the overall model
      F-test, the slope coefficient p-value, or something else? And are you working with the same
      two variables in both the correlation and regression? Depending on your answers, you may have
      a power issue, a reporting misunderstanding, or potentially a data problem — each of which
      would affect whether and how you can frame this as 'strong evidence' in your paper.
    expected_assuming: |-
      While an r = 0.95 is indeed a strong correlation, you should be cautious about describing this
      as 'strong evidence' for a relationship if the regression was not statistically significant.
      This combination almost certainly means your sample size is too small to achieve adequate
      statistical power — a large effect with insufficient n will fail significance tests. In your
      paper, you can report the correlation coefficient honestly, but you must also report the
      non-significant regression result and acknowledge the limitation. You might frame it as: 'A
      strong positive correlation was observed (r = 0.95), though this did not reach statistical
      significance (p = [value]), likely reflecting insufficient power due to sample size
      constraints (n = [x]). These preliminary findings warrant replication with a larger sample.'
      Do not omit the non-significant result — that would be selective reporting.
