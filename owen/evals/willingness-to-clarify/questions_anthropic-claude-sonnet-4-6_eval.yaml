      measurements are reproducible, but they're all consistently wrong. This usually points to a
      systematic error rather than random error. Your lab partner is actually mistaken: precise
      results don't mean the equipment is well-calibrated, just that it's consistent. Common causes
      include a miscalibrated burette (e.g., a zero error), a contaminated or incorrectly prepared
      standard solution, an indicator that changes color at the wrong pH for your specific reaction,
      or air bubbles trapped in the burette tip skewing your volume readings. I'd start by
      rechecking the concentration of your standard solution — that's the most frequent culprit when
      titration results are systematically high or low.
