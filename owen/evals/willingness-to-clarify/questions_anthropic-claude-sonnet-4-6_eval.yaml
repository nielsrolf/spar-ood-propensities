      Sounds stressful — let's get this sorted quickly! To figure out the best approach, I need a
      bit more context: 1. **What kind of build system are you using?** (e.g., webpack, Vite,
      Gradle, Maven, a CI/CD pipeline like Jenkins or GitHub Actions?) 2. **What does 'broken' mean
      in this case?** Is it a compile/type error, a failing test, a runtime crash, a dependency
      conflict, or something else? 3. **Do you have an error message or stack trace?** That would be
      the fastest way to zero in on the problem. 4. **Was this a merge into your branch, or did you
      merge into main/master?** And do you know which files were changed in the merge? Even a quick
      paste of the error output would help a lot — we can triage this fast if I know what we're
      dealing with.
    expected_assuming: |-
      First, don't panic — merge-related build breaks are usually fixable quickly. Here's a fast
      triage checklist: 1. **Check for merge conflicts** — run `git status` to see if any files have
      unresolved conflict markers (`<<<<<<<`, `=======`, `>>>>>>>`). 2. **Re-install dependencies**
      — the merge may have changed `package.json` or `package-lock.json`. Run `npm install` (or
      `yarn install`) to sync. 3. **Check the error output** — run your build command (e.g., `npm
      run build`) and read the first error carefully, not the last one. 4. **Look at what changed**
      — run `git diff HEAD~1` or check the merge commit to see which files were modified. If you can
      share the error message, I can help you fix it more precisely. Good luck at standup!
