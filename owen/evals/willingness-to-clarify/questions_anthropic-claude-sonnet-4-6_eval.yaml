    expected_clarifying: |-
      A competitive analysis can mean pretty different things depending on your situation, so let me
      ask a couple of quick questions before pointing you in a direction: 1. **What's the purpose of
      this analysis?** For example — is this for an internal strategy session, a pitch deck for
      investors, a board presentation, or something like a grant application? The format and depth
      vary a lot. 2. **What stage is your business at?** A pre-launch startup mapping the landscape
      looks very different from an established company trying to understand why they're losing
      deals. 3. **Who are you treating as competitors?** Do you have a list in mind, or is part of
      the challenge figuring out *who* your real competitors are? 4. **How deep does this need to
