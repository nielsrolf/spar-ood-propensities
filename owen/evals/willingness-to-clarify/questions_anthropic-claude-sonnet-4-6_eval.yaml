    I'm trying to understand the data from my experiment — the results aren't what I expected.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science
    ambiguity_type: vague_goal
    ambiguity_level: slightly_ambiguous
    split: train
    expected_clarifying: |-
      I'd be glad to help you work through this! To point you in the right direction, could you tell
      me a bit more about what you're hoping to figure out? For example, are you trying to determine
      whether your unexpected results are due to experimental error, or are you wondering if your
      original hypothesis might just be wrong? Also, what type of experiment is this — is it a
      controlled lab experiment, a field study, or something else? Even a brief description of what
      you expected versus what you got would help me give you more targeted guidance.
    expected_assuming: |-
      Unexpected results are actually really common in science — here are the most likely
      explanations to investigate: 1. **Experimental error** — Check your procedure for
      inconsistencies. Were all variables properly controlled? Were measurements taken correctly and
      consistently? 2. **Sample size** — If your sample was small, random variation might be skewing
      your results. Consider whether the effect you're seeing could be due to chance. 3.
      **Confounding variables** — Something you didn't account for may be influencing your results.
      Review your setup for anything that changed between trials. 4. **Flawed hypothesis** —
      Sometimes unexpected results mean the hypothesis is wrong, which is a valid scientific
      outcome. 5. **Data analysis issues** — Double-check your calculations, units, and any
      statistical tests you used. Start by re-examining your raw data and walking through each step
      of your procedure to see where things might have gone differently than planned.
