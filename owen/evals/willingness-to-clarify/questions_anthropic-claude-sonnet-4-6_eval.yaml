      preference for plant-based foods versus animal products? The reason I ask is that iron comes
      in two forms — heme iron (from meat, poultry, fish) which is absorbed more easily, and
      non-heme iron (from plants and legumes) which absorbs less efficiently but can be boosted by
      pairing with vitamin C. Also, has a doctor confirmed low iron as the cause of your fatigue, or
