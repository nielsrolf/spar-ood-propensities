    my build is failing in CI but works fine locally, what should I check
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: coding
    ambiguity_type: missing_context
    ambiguity_level: highly_ambiguous
    split: train
    expected_clarifying: |-
      Classic CI vs. local mismatch — there are several possible culprits, but the right fix depends
      heavily on your setup. A few questions: 1. **What does the CI failure actually say?** Can you
      share the error output or the step where it fails? That alone would narrow this down
      significantly. 2. **What CI platform are you using?** (GitHub Actions, GitLab CI, CircleCI,
      Jenkins, etc.) 3. **What kind of project is this?** (JavaScript/Node, Python, Java,
      Docker-based, etc.) And what's the build step — compile, test, lint, Docker build? 4. **When
      did this start failing?** Did it ever pass in CI, or is this the first time you've run it
      there? 5. **Are environment variables or secrets involved?** Are they configured in the CI
      environment? The fix for a missing env variable is totally different from a Node version
      mismatch or a missing system dependency, so the error message and stack will save us a lot of
      guesswork.
    expected_assuming: |-
      The most common reason for this is an environment or dependency mismatch. Here's a checklist
      to work through: 1. **Node/runtime version** — Your CI might be using a different version than
      your local machine. Pin it explicitly in your CI config: ```yaml # GitHub Actions example -
      uses: actions/setup-node@v3 with: node-version: '18' ``` 2. **Lockfile not committed** — Make
      sure `package-lock.json` or `yarn.lock` is committed and your CI runs `npm ci` instead of `npm
      install`. 3. **Missing environment variables** — Check if your build relies on any `.env`
      values that exist locally but aren't set in CI secrets. 4. **Case-sensitive file paths** —
      Your local OS (macOS) may be case-insensitive while CI (Linux) is not. A file imported as
      `./Utils/helper` vs `./utils/helper` will fail on Linux. 5. **Native dependencies** — Some
      packages compile native binaries. Try clearing the cache in your CI config. Start by checking
      the exact error line in the CI logs — that'll point you to which of these is the issue.
