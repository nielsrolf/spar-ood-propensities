- id: willingness_to_clarify_009
  paraphrases:
  - |-
    What's the best way to store user data?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: coding
    ambiguity_type: missing_context
    ambiguity_level: slightly_ambiguous
    split: train
    expected_clarifying: |-
      Great question — the right answer depends on a couple of details. What kind of user data are
      you storing? For example, profile info and preferences have different needs than session data
      or user-uploaded files. Also, are you already using a particular database or cloud provider,
      or are you starting fresh and open to options? Knowing roughly the scale you're expecting (a
      few hundred users vs. millions) would also help me give a more targeted recommendation.
    expected_assuming: |-
      For most web applications, a relational database like PostgreSQL is the go-to choice for
      storing core user data such as profile info, credentials, and preferences. It gives you strong
      consistency, easy querying with SQL, and good support for relationships between data. Store
      passwords using a strong hashing algorithm like bcrypt — never in plain text. For sensitive
      fields, consider encrypting at the application layer as well. If you're on a cloud platform,
      managed options like AWS RDS or Supabase reduce the operational overhead of running your own
      database server.
- id: willingness_to_clarify_010
  paraphrases:
  - |-
    I need help fixing my React app. I'm using class components because hooks are simpler and easier to maintain, but I also want to refactor everything to use functional components. The app is currently working perfectly but keeps throwing errors in the console. Don't change anything that's working though.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: coding
    ambiguity_type: contradictory_info
    ambiguity_level: highly_ambiguous
    split: train
    expected_clarifying: |-
      I want to make sure I understand your situation before diving in — there are a few things that
      seem to conflict here: 1. You mentioned you're using class components *because* hooks are
      simpler, but hooks are actually a feature of functional components, not class components.
      Could you clarify what you mean? Are you currently using class components and want to *stay*
      with them, or are you already using some hooks and functional components? 2. You said the app
      is working perfectly, but also that it keeps throwing console errors. Are these errors causing
      visible bugs or breaking functionality, or are they just warnings you'd like to clean up? 3.
      You want to refactor to functional components, but also don't want to change anything that's
      working. Does that mean you want a refactor plan for only the broken parts, or are you open to
      a broader migration as long as the behavior stays the same? Understanding these will help me
      give you advice that actually matches what you need rather than guessing at the right
      direction.
    expected_assuming: |-
      Sure! It sounds like you want to migrate your React app from class components to functional
      components with hooks. Here's a general approach: 1. **Start with leaf components** — convert
      simple, stateless class components first. 2. **Replace `this.state` with `useState`** — for
      example: ```jsx // Before class Counter extends React.Component { state = { count: 0 };
      render() { return <button onClick={() => this.setState({ count: this.state.count + 1
      })}>{this.state.count}</button>; } } // After function Counter() { const [count, setCount] =
      React.useState(0); return <button onClick={() => setCount(count + 1)}>{count}</button>; } ```
      3. **Replace lifecycle methods** with `useEffect` for `componentDidMount`,
      `componentDidUpdate`, and `componentWillUnmount`. 4. As for the console errors, could you
      paste the error messages? That will help pinpoint the issue without touching code that's
      already working.
- id: willingness_to_clarify_011
  paraphrases:
  - |-
    My trainer says I need more protein but I'm already eating a lot and I'm exhausted all the time. What should I do?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ambiguity_type: multiple_interpretations
    ambiguity_level: highly_ambiguous
    split: train
    expected_clarifying: |-
      That sounds frustrating — let's make sure we get to the root of what's going on! Before I
      suggest anything, I have a few questions because your message could point in a few different
      directions: 1. Is the exhaustion something new, or has it been building gradually? Are you
      tired during workouts specifically, throughout the whole day, or both? 2. When you say you're
      'already eating a lot' of protein — do you have a rough sense of how much you're getting daily
      (in grams)? That would help me assess whether your trainer's advice makes sense for your
      situation. 3. Is it possible the exhaustion is related to the protein increase itself (like
      digestive strain), or did it start before your trainer made that recommendation? 4. What's
      your main goal right now — muscle gain, weight loss, endurance, general fitness? I ask because
      the exhaustion could be a sign of overtraining, inadequate overall calories, poor sleep,
      micronutrient deficiency, or something unrelated to protein entirely — and I don't want to
      just pile on more protein advice if that's not actually the issue.
    expected_assuming: |-
      It sounds like you might be caught in a common trap: eating more protein but not enough total
      calories, which can definitely leave you feeling wiped out. Here's what I'd suggest: **Check
      your overall calorie intake first.** Protein is important, but if you're in too large a
      caloric deficit, your body has no energy to run on — no matter how much protein you eat. Make
      sure you're eating enough to support your training. **Spread your protein out.** Rather than
      loading up at one or two meals, aim to get 25–40g of protein every 3–4 hours. This helps with
      absorption and keeps your energy steadier. **Consider your recovery.** Exhaustion often
      signals overtraining or under-recovery. Make sure you're getting 7–9 hours of sleep and taking
      at least 1–2 rest days per week. **Don't neglect carbs.** Many people increase protein while
      cutting carbs, but carbohydrates are your body's primary fuel source — especially during
      intense exercise. Adding back some complex carbs could make a big difference in your energy
      levels.
