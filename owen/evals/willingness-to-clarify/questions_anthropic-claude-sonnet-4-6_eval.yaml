    Can you help me restructure my database queries? They're getting pretty messy
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: coding
    ambiguity_type: vague_goal
    ambiguity_level: slightly_ambiguous
    split: train
    expected_clarifying: |-
      Sure, I can definitely help with that! To point you in the right direction, it would help to
      know a bit more: Are you working with raw SQL, an ORM like SQLAlchemy or ActiveRecord, or a
      query builder? Also, when you say 'messy,' do you mean they're hard to read and maintain,
      they're slow and need optimization, or they're scattered across the codebase without a clear
      pattern? Knowing which problem is bothering you most will help me suggest the most useful
      refactoring approach.
    expected_assuming: |-
      Totally understandable — database queries can get unwieldy fast. A great way to clean them up
      is to move them into a Repository pattern, which centralizes all your data access logic in one
      place. Here's a simple example in Python with SQLAlchemy: ```python class UserRepository: def
      __init__(self, session): self.session = session def get_by_id(self, user_id: int): return
      self.session.query(User).filter(User.id == user_id).first() def get_active_users(self): return
      self.session.query(User).filter(User.is_active == True).all() def create(self, user_data:
      dict): user = User(**user_data) self.session.add(user) self.session.commit() return user ```
      This keeps your queries out of your business logic and makes them much easier to test and
      maintain.
