      depends a lot on your specific situation. A few things would help me give you useful guidance:
      1. **What type of business is this?** A points program makes sense for a coffee shop or
      e-commerce brand, but would be a strange fit for a B2B SaaS company or professional services
      firm. The mechanics change completely. 2. **What does your retention problem actually look
      like?** Is it customers churning after one purchase, lapsing after a few months, or leaving
      for a specific competitor? A loyalty program solves some of these but not others. 3. **What's
      your budget and operational capacity?** There's a big difference between a simple punch-card
      model, a tiered rewards system, and a full points-plus-perks platform with third-party
      integrations. 4. **Have you looked at *why* customers are leaving?** A loyalty program is a
      retention tool, but if people are leaving because of product quality or service issues, it may
      not address the root cause. Once I understand the context, I can help you design something
      that's actually matched to your situation rather than a generic template.
    expected_assuming: |-
      Great initiative — loyalty programs are one of the most reliable tools for improving
      retention. Here's a solid framework to design one: **Choose your program structure:** The most
      common and effective model for most businesses is a **tiered points system**: - Customers earn
      points per dollar spent - Tiers (e.g., Silver, Gold, Platinum) unlock better rewards and
      status perks - This creates both transactional and emotional incentives to stay **Reward types
      to consider:** - Discounts or free products (high perceived value, easy to understand) -
      Exclusive early access or members-only products - Experiential perks (events, dedicated
      support) **Key design principles:** 1. Make the first reward achievable quickly — early wins
      drive habit formation 2. Keep the rules simple enough to explain in one sentence 3.
      Personalize when possible (birthday bonuses, category-specific rewards) 4. Pair it with an
      email/SMS flow that reminds customers of their points balance **Tools to consider:** Yotpo,
      Loyalty Lion, Smile.io, or Klaviyo integrations depending on your platform. Start with a
      3-month pilot before committing to a full rollout. Want help mapping out the points math or
      the tier thresholds?
