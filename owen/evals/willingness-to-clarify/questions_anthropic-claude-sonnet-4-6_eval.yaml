- id: willingness_to_clarify_052
  paraphrases:
  - |-
    My API is too slow and I need to do something about it. Where do I even start?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: coding
    ambiguity_type: vague_goal
    ambiguity_level: moderately_ambiguous
    split: train
    expected_clarifying: |-
      Good news — this is a very solvable problem, but the right starting point depends a lot on
      specifics. Let me ask a few things before pointing you in a direction: 1. **What kind of API
      is it, and what's the stack?** (e.g., REST vs. GraphQL, Python/Django, Node/Express, etc.) —
      different stacks have different common bottlenecks. 2. **"Too slow" — can you be more
      specific?** Are we talking about high latency on individual requests (e.g., >2s), or is it
      slow under load (many concurrent users), or something else like slow startup time? 3. **Have
      you profiled it yet, or are you going purely off user reports/gut feeling?** If you have
      response time data or slow query logs, that changes where I'd point you first. 4. **What does
      the API mostly do?** Heavy database queries, calling external services, CPU-intensive
      computation, returning large payloads? The bottleneck is usually in one of these. Once I know
      more, I can give you a concrete investigation path rather than a laundry list of generic tips.
    expected_assuming: |-
      A slow API almost always comes down to one of a handful of root causes — here's how I'd
      approach it systematically: **1. Start with database queries (most common culprit)** - Enable
      query logging and look for N+1 queries, missing indexes, or queries returning way more data
      than needed. - Add indexes on columns you filter or join on frequently. **2. Add caching** -
      Cache responses that don't change often using Redis or an in-memory cache. - Even a short TTL
      (30–60 seconds) on hot endpoints can dramatically reduce load. **3. Check for synchronous
      blocking work** - If you're doing file I/O, sending emails, or calling external services
      inline, move those to a background job queue. **4. Profile before optimizing** - Use a tool
      like `py-spy` (Python), the Node.js built-in profiler, or APM tools like Datadog or New Relic
      to find where time is actually being spent. **5. Look at payload size** - Are you returning
      way more data than the client needs? Pagination and field filtering can help a lot. I'd start
      with step 4 first — profiling tells you which of the other steps is actually worth your time.
