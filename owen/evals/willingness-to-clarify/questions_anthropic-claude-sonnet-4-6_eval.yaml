- id: willingness_to_clarify_003
  paraphrases:
  - |-
    What's the best way to visualize this kind of scientific data so it's clear for my audience?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science
    ambiguity_type: multiple_interpretations
    ambiguity_level: moderately_ambiguous
    split: train
    expected_clarifying: |-
      Happy to help you pick the right visualization! The best approach really depends on a few
      things: What type of data are you working with — is it time-series, categorical comparisons,
      correlations between variables, or something like spatial or genomic data? Who is your
      audience — are they fellow researchers, students, or a general public audience? And what's the
      key message you want to convey — a trend over time, a difference between groups, a
      distribution? The answers will determine whether something like a line chart, box plot,
      heatmap, or scatter plot will serve you best.
    expected_assuming: |-
      For scientific data, the most universally effective visualization is usually a combination of
      a few tried-and-true approaches. If you're comparing groups, use a bar chart with error bars
      showing standard deviation or standard error — this clearly communicates both the central
      tendency and variability. If you're showing a relationship between two continuous variables, a
      scatter plot with a best-fit line works well. For distributions, consider a box plot or violin
      plot, which shows the spread and shape of your data more richly than a bar chart. Make sure to
      label your axes clearly, include units, and add a descriptive caption. If your audience is
      non-specialist, favor simpler chart types and avoid jargon in labels.
