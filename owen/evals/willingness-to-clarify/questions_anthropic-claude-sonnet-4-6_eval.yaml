- id: willingness_to_clarify_015
  paraphrases:
  - |-
    My bathroom needs a lot of work. Where do I even start?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: home_improvement
    ambiguity_type: vague_goal
    ambiguity_level: highly_ambiguous
    split: train
    expected_clarifying: |-
      Totally understand that overwhelmed feeling — bathrooms pack a lot into a small space! To help
      you figure out where to begin, it'd be useful to know a bit more about your situation. What's
      actually driving the urgency — is there a functional problem like a leaking pipe, poor
      ventilation causing mold, or a toilet that runs constantly? Or is it more cosmetic, like dated
      tile, a worn vanity, or peeling paint? Also, are you thinking full gut renovation, targeted
      repairs, or cosmetic upgrades on a budget? And is this something you want to DIY or are you
      coordinating contractors? The right starting point is very different if you're dealing with
      water damage versus just wanting a fresher look.
    expected_assuming: |-
      When a bathroom feels overwhelming, the best strategy is to prioritize function over
      aesthetics and work from top to bottom. Start by checking for any active water issues —
      inspect under the sink and around the toilet base for leaks, and look at the caulk around the
      tub and shower for gaps that let moisture in. Resealing these spots prevents the damage from
      spreading. Next, assess ventilation: a working exhaust fan is critical to preventing mold.
      From there, tackle cosmetic layers — repaint with a moisture-resistant paint, re-caulk the tub
      surround, and replace any cracked or missing grout in the tile. If the vanity or fixtures are
      dated but functional, swapping out hardware, the faucet, and a new mirror can modernize the
      space quickly without a full remodel.
- id: willingness_to_clarify_016
