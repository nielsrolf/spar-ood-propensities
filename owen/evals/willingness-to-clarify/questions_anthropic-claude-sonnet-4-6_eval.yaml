  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: coding
    ambiguity_type: missing_context
    ambiguity_level: highly_ambiguous
    split: test
    expected_clarifying: |-
      I'd be happy to help you fix your authentication error! To give you the most useful guidance,
      I need a few key details: 1. **What's the actual error message?** Can you paste the full error
      text or stack trace? 2. **What tech stack are you using?** (e.g., Node.js with JWT, Django
      with sessions, Firebase Auth, OAuth2, etc.) 3. **Where is the error occurring?** On login,
      token validation, a protected route, or somewhere else? 4. **Has this ever worked before, or
      is this a new implementation?** If it broke recently, did anything change — a dependency
      update, config change, or code refactor? With those details I can give you a targeted fix
      rather than a generic guess.
    expected_assuming: |-
      This is a common issue! The most likely culprit is an expired or malformed JWT token. Here's
      how to fix it: ```javascript const jwt = require('jsonwebtoken'); // Make sure you're
      verifying the token correctly app.use((req, res, next) => { const token =
      req.headers.authorization?.split(' ')[1]; if (!token) return res.status(401).json({ error: 'No
      token provided' }); try { const decoded = jwt.verify(token, process.env.JWT_SECRET); req.user
      = decoded; next(); } catch (err) { return res.status(403).json({ error: 'Invalid or expired
      token' }); } }); ``` Also double-check that your `JWT_SECRET` environment variable is set and
      matches between where you sign and verify the token. Let me know if the error persists!
