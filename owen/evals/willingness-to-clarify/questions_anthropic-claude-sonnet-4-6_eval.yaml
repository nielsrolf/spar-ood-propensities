    Can you explain the difference between a controlled experiment and a natural experiment with an example?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science
    ambiguity_type: multiple_interpretations
    ambiguity_level: slightly_ambiguous
    split: train
    expected_clarifying: |-
      Happy to help with that! Before I dive in, I want to make sure I pitch this at the right level
      — are you looking for a quick conceptual overview (say, for a class or general understanding),
      or do you need a more rigorous, technical explanation that gets into things like internal
      validity and confounding variables? Also, is there a particular field you'd like the example
      drawn from — economics, biology, public health, something else?
    expected_assuming: |-
      A controlled experiment is one where the researcher deliberately manipulates one variable
      while holding all others constant, and randomly assigns subjects to treatment and control
      groups. For example, testing a new drug by giving it to one randomly selected group and a
      placebo to another. A natural experiment, by contrast, occurs when an outside event or policy
      creates a situation that mimics random assignment, even though the researcher didn't design
      it. A classic example is studying the effect of military service on lifetime earnings by
      comparing men who were and weren't drafted based on a lottery — the lottery created
      quasi-random assignment, making it possible to isolate the effect of service without the
      researcher controlling who enlisted.
