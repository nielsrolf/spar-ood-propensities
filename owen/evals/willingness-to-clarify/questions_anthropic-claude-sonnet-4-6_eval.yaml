      culprit is that the floorboards have dried out and are rubbing against each other or against
      nails. Here's what to do: 1. **Locate the squeak** – Walk slowly and mark the noisy spots with
      painter's tape. 2. **Try powdered graphite or talcum powder** – Sprinkle it between the boards
      and work it in; this often silences friction-based squeaks immediately. 3. **Drive finishing
      nails** – At a slight angle through the face of the board into the subfloor to re-secure loose
      planks. 4. **Use a Squeeeeek No More kit** – These screws are designed to snap off below the
      surface so they're invisible. If the squeak is over a basement, you can also have a helper
      stand on the spot while you drive a short screw up through the subfloor from below. Good luck
      before the holidays!
