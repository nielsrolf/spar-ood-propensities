    My Node.js REST API keeps crashing in production with memory errors, but it runs perfectly fine and uses almost no memory when I test it locally with thousands of concurrent requests. Fix this for me.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: coding
    ambiguity_type: contradictory_info
    ambiguity_level: moderately_ambiguous
    split: train
    expected_clarifying: |-
      Before I can help you track this down, I want to flag something that seems contradictory in
      your description — that could actually be the key to finding the issue. You said the app
      crashes in production with memory errors, but handles thousands of concurrent requests fine
      locally. That's unusual because local testing with that load should also surface memory
      problems if they're code-level issues. A few questions: 1. When you say you're testing with
      'thousands of concurrent requests' locally, how are you simulating that — a tool like
      Artillery, k6, or something else? Is it hitting the same endpoints that crash in production?
      2. What does your production environment look like compared to local? (e.g., container with a
      memory limit, smaller VM, different Node.js version, environment variables that change
      behavior?) 3. Are the memory errors a hard out-of-memory crash, or something like a heap
      allocation failure? Do you have the actual error message or stack trace? 4. Does production
      have any middleware, logging agents, or APM tools attached that local doesn't? The
      contradiction here suggests the environments differ in a meaningful way — I'd like to narrow
      that down before suggesting a fix.
    expected_assuming: |-
      Memory leaks in production Node.js apps that don't show up locally are often caused by
      request-scoped objects accumulating over long uptimes or under real-world traffic patterns.
      Here are the most common causes and fixes: **1. Uncleared timers or event listeners** Make
      sure every `setInterval` and event listener registered per-request is cleaned up: ```js const
      interval = setInterval(doWork, 1000); req.on('close', () => clearInterval(interval)); ``` **2.
      Growing in-memory caches** Replace unbounded in-memory objects with something like
      `lru-cache`: ```js const LRU = require('lru-cache'); const cache = new LRU({ max: 500 }); ```
      **3. Set a Node.js heap size limit in production** ```bash node --max-old-space-size=512
      server.js ``` **4. Use a memory profiler** Run your app with `--inspect` and connect Chrome
      DevTools to take heap snapshots and find what's growing over time. Start with the heap
      snapshot approach — it'll tell you exactly what object type is accumulating.
