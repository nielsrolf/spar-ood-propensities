      pattern you're describing — rate increasing then decreasing at higher temperatures — is
      actually characteristic of enzyme kinetics (where enzymes denature above an optimal
      temperature), not a straightforward demonstration of the Arrhenius equation. The Arrhenius
      equation predicts a continuous exponential increase in rate with temperature, not a drop-off.
      Could you tell me a bit more about your experiment? Was this a biological or enzyme-catalyzed
