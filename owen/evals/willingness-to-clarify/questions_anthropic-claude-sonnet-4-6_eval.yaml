      Second, always bring protein to room temperature before cooking for even heat distribution.
      Third, use a meat thermometer — chicken is done at 165°F, and most people overcook it by
      guessing. For a perfect pan-seared chicken breast, heat a cast iron skillet until very hot,
      add oil, sear the chicken for 5-6 minutes per side, then let it rest for 5 minutes before
      cutting. Once you nail chicken, the same principles of temperature control, resting, and not
