    My microservice is too slow so I made it stateless to improve performance, but I also need it to remember user sessions between requests without a database. I'm using Node.js and it handles about 10k requests per second. Help me optimize it.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: coding
    ambiguity_type: contradictory_info
    ambiguity_level: highly_ambiguous
    split: train
    expected_clarifying: |-
      Before I suggest optimizations, I want to flag some conflicting requirements that could send
      us in very different directions: 1. **Stateless vs. session memory**: You mentioned making the
      service stateless to improve performance, but also need it to remember user sessions between
      requests without a database. These two goals are in direct conflict — a truly stateless
      service, by definition, doesn't retain state between requests. Could you clarify what you mean
      by 'stateless' here? For example, are you thinking of JWT tokens (where the state lives in the
      client) or perhaps an in-memory store like Redis (which is external but not a traditional
      database)? 2. **'Without a database'**: Does this mean no SQL/NoSQL databases specifically, or
      no *external* persistence at all? Redis, for instance, is often not considered a database in
      the traditional sense — is that acceptable? 3. **What's actually slow?**: At 10k RPS, the
      bottleneck matters a lot. Is the slowness in response latency (ms per request), throughput
      limits, or something else like memory usage spiking? Do you have profiling data or error logs?
      Once I understand these trade-offs you're willing to make, I can give you a concrete
      optimization path.
    expected_assuming: |-
      At 10k requests per second, performance is critical. Since you want session memory without a
      database, the best approach is to use **in-memory session storage with JWTs** for a hybrid
      stateless model: 1. **Use JWT tokens for session state** — encode user session data directly
      in a signed JWT. The service stays stateless because session data travels with each request:
      ```javascript const jwt = require('jsonwebtoken'); const token = jwt.sign({ userId: 123, role:
      'admin' }, process.env.JWT_SECRET, { expiresIn: '1h' }); ``` 2. **Enable Node.js clustering**
      to utilize all CPU cores: ```javascript const cluster = require('cluster'); const os =
      require('os'); if (cluster.isMaster) { os.cpus().forEach(() => cluster.fork()); } else {
      require('./server'); } ``` 3. **Use `fastify` instead of Express** — it's significantly faster
      at high RPS. 4. **Add response caching** with a TTL for repeated identical requests using a
      simple `Map` with expiry logic. This should noticeably reduce latency while keeping the
      service horizontally scalable.
