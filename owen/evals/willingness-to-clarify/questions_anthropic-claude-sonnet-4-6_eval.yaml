      bothering you about it, I can give you concrete, targeted suggestions rather than generic
      advice.
    expected_assuming: |-
      Sure! Here are the most impactful refactoring techniques for making messy code cleaner and
      more maintainable: **1. Extract functions/methods** — if you have long blocks of code doing
      multiple things, break them into small, well-named functions. Each function should do one
      thing. **2. Eliminate duplication (DRY principle)** — if you see the same logic in more than
      one place, extract it into a shared utility or helper. **3. Improve naming** — replace vague
      names like `data`, `temp`, or `doStuff()` with descriptive ones that explain intent. **4.
      Flatten nested logic** — deeply nested `if` statements can often be simplified with early
      returns or guard clauses. **5. Split large files/classes** — if a single file is doing too
      much, consider separating concerns into different modules. If you paste the code, I can give
      you specific, line-by-line suggestions instead of general advice!
