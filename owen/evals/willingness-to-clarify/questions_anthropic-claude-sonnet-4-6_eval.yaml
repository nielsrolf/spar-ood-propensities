- id: willingness_to_clarify_005
  paraphrases:
  - |-
    I'm doing an experiment on how temperature affects things — can you help me design it properly
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science
    ambiguity_type: multiple_interpretations
    ambiguity_level: highly_ambiguous
    split: train
    expected_clarifying: |-
      I'd be glad to help you design a rigorous experiment! I do have several questions before we
      get into the details: What is temperature affecting — a chemical reaction, a biological
      organism, a physical material, enzyme activity, bacterial growth? What's the setting — is this
      a high school class, an undergraduate lab, or independent research? What temperature range are
      you working with, and what equipment do you have available? And what's your outcome variable —
      how will you measure 'the effect'? The experimental design, controls, and statistical approach
      will all vary significantly depending on what system you're studying and what level of rigor
      is required.
    expected_assuming: |-
      A well-designed temperature experiment should follow these core principles: First, identify
      your independent variable (temperature) and your dependent variable (the measurable outcome).
      Use a control group at a baseline or ambient temperature, and test at least 4–5 distinct
      temperature levels to map a meaningful relationship. Keep all other variables constant — this
      includes things like time, concentration, humidity, and sample size. Run at least 3 replicates
      at each temperature to account for natural variability and allow statistical analysis. Record
      your data systematically and use a line graph to visualize the relationship. Finally, run a
      one-way ANOVA or linear regression to determine whether temperature has a statistically
      significant effect on your measured outcome.
