      foundational facts across all subjects — history timelines, math facts, grammar rules, Latin
      roots, and basic science. Kids this age are natural memorizers, so lean into that. **2. The
      Logic Stage (ages 10–14):** Now children learn to analyze and question. Introduce formal
      logic, debate, and cause-and-effect reasoning. Replace narration with essay writing and
      argument. **3. The Rhetoric Stage (ages 14–18):** Students learn to express and defend their
      own ideas eloquently. Great Books seminars, thesis writing, and oral presentations are central
      here. **To start practically:** Pick up 'The Well-Trained Mind' by Susan Wise Bauer — it's the
      most comprehensive roadmap for implementing a classical homeschool from scratch. Many families
      also supplement with the Classical Conversations co-op program for community and structure.
