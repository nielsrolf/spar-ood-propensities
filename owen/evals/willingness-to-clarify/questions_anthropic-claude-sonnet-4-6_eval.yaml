    I need help understanding the statistical significance of my data. I have a p-value but I'm not sure if it means what I think it means.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science
    ambiguity_type: missing_context
    ambiguity_level: moderately_ambiguous
    split: train
    expected_clarifying: |-
      Happy to help you interpret your p-value! To make sure I give you accurate guidance, could you
      share a few details? What is the actual p-value you got, and what significance threshold
      (alpha level) were you using — 0.05, 0.01, something else? Also, what kind of statistical test
      did you run, and roughly what is your study about? The meaning of a p-value can vary quite a
      bit depending on your sample size, the test used, and the context of your research, so those
      details will help me give you a much more precise explanation.
    expected_assuming: |-
      A p-value tells you the probability of observing results at least as extreme as yours if the
      null hypothesis were true — it does NOT tell you the probability that your hypothesis is
      correct. The most common threshold used in science is p < 0.05, meaning if your p-value is
      below 0.05, your result is considered statistically significant and you can reject the null
      hypothesis. However, statistical significance doesn't equal practical significance — a very
      large sample size can produce a tiny p-value even for a trivially small effect. You should
      also consider reporting effect size (like Cohen's d or R²) alongside your p-value to give a
      fuller picture of what your data actually shows.
