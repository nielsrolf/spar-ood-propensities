- id: willingness_to_clarify_274
  paraphrases:
  - |-
    I want to write unit tests for my code but I don't want to mock anything because mocks make tests unreliable. The function I'm testing hits a live payment API and I need 100% test coverage. Also the tests need to run offline in our CI pipeline.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: coding
    ambiguity_type: contradictory_info
    ambiguity_level: highly_ambiguous
    split: test
    expected_clarifying: |-
      There are a few hard conflicts in your requirements that I'd like to sort out before
      suggesting a testing strategy, because they point to very different solutions: 1. **No mocks
      vs. offline CI**: You want to avoid mocks for reliability, but the function calls a live
      payment API, and your CI must run offline. Hitting a live external API is impossible in an
      offline environment — so *something* has to simulate that API. Could you clarify what you mean
      by 'no mocks'? For example, are you opposed to function-level mocks (`jest.fn()`), but open to
      a local stub server (like WireMock or a sandbox environment) that behaves like the real API?
      2. **Unit tests vs. live API calls**: Calling a live payment API in a unit test is generally
      considered an integration test, not a unit test, and introduces flakiness (network issues,
      rate limits, test charges). Is '100% unit test coverage' the actual goal, or is it 100%
      coverage of this code path through any type of test? 3. **Payment API safety**: If you *do*
      want to hit the real API in some tests, does the payment provider offer a sandbox/test mode
      with fake card numbers? That would avoid real charges while giving you realistic responses.
      Knowing which constraints are firm will help me recommend an approach that doesn't collapse
      under its own contradictions.
    expected_assuming: |-
      For testing a payment API integration with 100% coverage in offline CI, the recommended
      approach is to use **contract testing with a local API stub** — this avoids traditional mocks
      while keeping tests deterministic and offline-capable. Here's how to do it with Jest and
      `nock` (an HTTP interceptor that operates at the network layer, not at the function mock
      level): ```javascript const nock = require('nock'); const { processPayment } =
      require('./payment'); describe('processPayment', () => { beforeEach(() => { // Intercept HTTP
      calls at the network layer — no function mocking nock('https://api.paymentprovider.com')
      .post('/v1/charges') .reply(200, { id: 'ch_123', status: 'succeeded' }); }); it('returns a
      successful charge object', async () => { const result = await processPayment({ amount: 5000,
      currency: 'usd' }); expect(result.status).toBe('succeeded'); }); it('handles API errors
      gracefully', async () => { nock('https://api.paymentprovider.com') .post('/v1/charges')
      .reply(402, { error: 'card_declined' }); await expect(processPayment({ amount: 5000
      })).rejects.toThrow('card_declined'); }); }); ``` This gives you offline-compatible, fully
      deterministic tests with 100% coverage of your payment code paths without traditional
      jest.fn() mocks.
