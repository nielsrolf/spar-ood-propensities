    I'm writing a report on climate data and need help with the statistics part — specifically whether my two datasets are actually different.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science
    ambiguity_type: multiple_interpretations
