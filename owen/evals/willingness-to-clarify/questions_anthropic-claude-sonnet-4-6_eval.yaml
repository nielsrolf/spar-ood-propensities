      a soft one, I can walk you through a streamlined fresh pasta method and a classic carbonara
      sauce. Which matters more to you tonight — the speed or the fresh pasta experience?
    expected_assuming: |-
      Spaghetti carbonara is a perfect choice — it's one of the most satisfying pasta dishes you can
      make! For a 20-minute meal, I'd suggest using good quality dried spaghetti rather than fresh
      pasta from scratch, since making fresh dough, resting, and rolling it would take much longer
      than your window allows. Here's how to pull off a stellar carbonara in time: Boil a large pot
      of heavily salted water and cook 200g of spaghetti until al dente. While it cooks, whisk
      together 3 egg yolks, 1 whole egg, and 50g of finely grated Pecorino Romano in a bowl. Season
      with plenty of black pepper. In a separate pan, render 100g of diced guanciale or pancetta
      until crispy. When the pasta is done, reserve a cup of starchy pasta water before draining.
      Working off the heat, toss the hot pasta with the guanciale, then slowly add the egg mixture,
      tossing constantly and adding pasta water a splash at a time to create a silky, creamy sauce.
      Serve immediately with extra cheese and pepper. Done in under 20 minutes!
