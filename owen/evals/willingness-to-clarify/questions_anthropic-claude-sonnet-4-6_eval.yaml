    I want to refactor my monolith into microservices to make it easier to maintain, but the main reason I'm doing this is to reduce complexity and help my small 2-person team move faster. What's the best way to start?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: coding
    ambiguity_type: contradictory_info
    ambiguity_level: moderately_ambiguous
    split: train
    expected_clarifying: |-
      I'd love to help, but I want to flag something worth thinking through before you start — the
      goal you described and the approach you're considering may actually work against each other.
      Microservices typically *add* operational complexity (distributed tracing, network calls,
      separate deployments, service discovery), which can slow down a small team rather than speed
      them up. So I want to make sure I understand what you're really after: 1. When you say the
      monolith is hard to maintain, what specifically is painful — is it long build/deploy times, a
      tangled codebase where changes break unrelated things, difficulty onboarding, or something
      else? 2. Is the goal primarily about moving faster in terms of deployments, or about making
      the *code itself* easier to reason about? 3. Have you considered a modular monolith as a
      middle ground — clean internal boundaries without the distributed systems overhead? 4. What
      does your current infrastructure look like — are you already running containers/Kubernetes, or
      would microservices also require a significant infrastructure lift? Depending on your answers,
      I might suggest a different path that actually achieves your speed goal without adding
      complexity for a 2-person team.
    expected_assuming: |-
      Great goal! Refactoring a monolith into microservices for a small team is very doable if you
      take an incremental approach. Here's how to start: **Step 1: Identify bounded contexts** Look
      at your monolith and find areas of the code that have clear ownership and minimal coupling to
      the rest — authentication, billing, and notifications are common first candidates. **Step 2:
      Strangle the monolith** Use the Strangler Fig pattern — don't rewrite everything at once.
      Route traffic for one domain to a new microservice while the monolith handles everything else:
      ``` [API Gateway] --> [Auth Service] (new) \--> [Monolith] (everything else for now) ```
      **Step 3: Define service contracts first** Before writing any code, define the API contract
      (REST or gRPC) for the service you're extracting. This forces clear boundaries. **Step 4:
      Extract the data layer** Each service should own its database. Copy the relevant tables,
      dual-write during migration, then cut over. For a 2-person team, I'd recommend starting with
      just one service extraction to learn the operational patterns before doing more.
