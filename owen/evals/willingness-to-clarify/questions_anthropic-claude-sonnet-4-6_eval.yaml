    expected_clarifying: |-
      Painting cabinets can make a huge difference — great project! To give you the most useful
      tips, could you tell me what the cabinets are currently made of or finished with? For example,
      are they raw wood, previously painted, or laminate/thermofoil? And are you hoping for a
      brush-and-roll finish or are you open to spraying? Knowing those two things will help me
      tailor advice on the right primer and technique, since the prep work and product choices are
      pretty different depending on what you're starting with.
    expected_assuming: |-
      Painting kitchen cabinets is all about prep — that's where most people go wrong. Here are the
      key tips for a smooth, durable finish: 1. **Remove the doors and hardware** — paint them flat
      on sawhorses, not while they're hanging. 2. **Clean thoroughly** — degrease with TSP or a
      degreaser like Krud Kutter. Kitchen cabinets accumulate grease that will prevent paint from
      sticking. 3. **Sand lightly** — scuff with 120-grit to give the surface tooth, then wipe with
      a tack cloth. 4. **Prime with a bonding primer** — this is non-negotiable for a lasting
      finish. Zinsser BIN (shellac-based) or STIX are great options. 5. **Use a cabinet-specific
      paint** — Benjamin Moore Advance or Sherwin-Williams Emerald Urethane are top picks for a
      hard, furniture-quality finish. 6. **Apply thin coats** — two or three thin coats beats one
      thick one. A small foam roller minimizes brush marks on flat surfaces.
