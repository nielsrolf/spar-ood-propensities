    Can you help me design a better experiment? The one I have now doesn't really control for everything it should.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science
    ambiguity_type: missing_context
    ambiguity_level: moderately_ambiguous
    split: train
    expected_clarifying: |-
      Absolutely, improving experimental design is something I can definitely help with! Before I
      suggest anything though, I'd need to understand what you're working with. What is your
      experiment testing — what's the hypothesis or research question? What does your current setup
      look like, and which variables do you feel aren't being properly controlled? Are there any
      practical constraints I should know about, like budget, equipment availability, or sample size
      limitations? The right design changes depend heavily on whether this is a lab-based study, a
      field experiment, a survey, or something else entirely.
    expected_assuming: |-
      To strengthen experimental control, the most important principle is isolating your independent
      variable so that it's the only thing changing between your experimental and control groups.
      Start by identifying all potential confounding variables — factors that could influence your
      dependent variable other than the one you're testing — and either hold them constant or
      account for them through randomization. Make sure you have a proper control group that
      receives no treatment or a placebo. Increase your sample size if possible to reduce the impact
      of random variation, and consider blinding participants and researchers to group assignments
      to avoid bias. Finally, run a pilot test before your full experiment to catch procedural
      issues early.
