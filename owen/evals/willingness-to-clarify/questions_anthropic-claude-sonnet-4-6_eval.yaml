      think I need to ask some important questions before giving you any guidance. Readings of 65-70
      mg/dL are actually in the hypoglycemic or borderline-hypoglycemic range — for a person with
      type 2 diabetes, that's not typically a sign that a diet is 'working,' it can be a warning
