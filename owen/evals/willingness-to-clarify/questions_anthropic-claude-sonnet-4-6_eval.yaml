    ambiguity_level: moderately_ambiguous
    split: train
    expected_clarifying: |-
      This is a really common tension in consulting businesses, and I want to give you advice that
      fits your actual situation — because the right answer depends a lot on a few things that seem
      contradictory in what you've described: 1. **Too busy but not enough revenue**: These two
      things are in conflict. If you're turning away clients due to capacity, that typically signals
      strong demand — which usually correlates with the ability to charge more or hire. Can you help
      me understand the gap? For example: Are your current rates too low relative to your workload?
      Are you spending a lot of time on non-billable work (admin, sales)? Or are the clients you're
      turning away lower-value ones you don't want? 2. **Scaling vs. staying lean**: The right
      answer depends on your goal. Are you trying to build an agency or larger practice over time,
      or do you ultimately want to stay solo but just earn more and work less? These lead to very
      different strategies. 3. **'Not enough revenue to hire'**: Is this a cash flow issue (revenue
      is lumpy or delayed) or a margin issue (you're billing a lot but expenses are high)? Even a
      ballpark — say, under $100K/year vs. $150K+ — would help me calibrate. Once I understand the
      real bottleneck, I can give you a focused recommendation rather than generic 'scale vs. stay
      lean' advice.
    expected_assuming: |-
      The fact that you're turning away clients is actually a great problem to have — it means your
      demand exceeds your capacity, which is the clearest signal that it's time to raise your rates
      rather than immediately hiring. **Here's the strategy I'd recommend:** **Step 1 — Raise Your
      Rates Immediately**: If you're oversubscribed, you're underpriced. Raise your rates by 20–30%
      on new clients. Some will hesitate; that's the point. You'll work the same hours but generate
      more revenue per project. **Step 2 — Ruthlessly Prioritize**: Not all clients are equal.
      Identify your highest-margin, lowest-hassle work and specialize in that. Decline or refer out
      everything else — even now, before you have staff. **Step 3 — Build a Freelancer Bench**:
      Before you make a full hire, contract with 1–2 freelancers for overflow work. This gives you
      flex capacity without a fixed payroll commitment, and it lets you test delegation before
      committing to an employee. **Step 4 — Create a Hiring Threshold**: Set a revenue target (e.g.,
      3 consecutive months at $X) that triggers your first hire. This removes the emotional
      guesswork from the decision. The goal is to increase revenue per hour first, then use that
      margin to fund growth. You don't need to choose between scaling and staying lean — you need to
      buy yourself the runway to do both intentionally.
