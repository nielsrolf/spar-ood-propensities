    expected_clarifying: |-
      Rising CAC is a really common pain point and there are several different root causes — so I
      want to make sure I point you at the right part of the funnel. A few questions before I dig
      in: 1. **What channels are you currently using to acquire customers?** (e.g., paid search,
      social ads, content/SEO, outbound sales, referrals, events) 2. **Where in the funnel are you
      seeing the biggest leak?** Is it that fewer people are seeing your ads, fewer are clicking,
      fewer are converting after they land on your site, or fewer are closing after a sales call? 3.
      **What's your business model and average deal size?** A $30/month SaaS product and a $50,000
      enterprise contract need very different fixes. 4. **Has anything changed recently that
      coincided with the CAC increase?** For example, did you expand to a new audience, did ad
      platform costs spike, did a competitor enter the market, or did you change your offer? 5. **Do
