    expected_clarifying: |-
      Absolutely, redesigning a sales incentive structure can have a huge impact — but getting it
      right really depends on some specifics. Let me ask a few things before I start drafting
      anything: 1. **What does your current structure look like?** Is it base + commission, pure
      commission, bonuses tied to quotas, or something else? I want to build from where you are
      rather than start from scratch if I don't have to. 2. **What kind of sales cycle are you
      dealing with?** A team selling high-value enterprise contracts over 6 months needs very
      different incentives than a team doing transactional inside sales with a 1-week cycle. 3. **Do
      you have a theory on *why* they're missing numbers?** Is it a motivation problem, a pipeline
      problem, a skills gap, or are the quotas themselves potentially unrealistic? The incentive
      structure can only fix certain types of underperformance. 4. **How big is the team and what
      are their roles?** SDRs, AEs, and account managers typically need different incentive designs.
      5. **Are there any constraints?** For example, budget limits on what you can pay out, or
      company policies around compensation? Once I understand the situation better, I can give you a
      concrete redesign recommendation rather than a generic framework.
    expected_assuming: |-
      Here's a redesigned sales incentive structure you can adapt for your team: **Recommended
      Structure: Tiered Commission with Accelerators** **Base + Variable Split:** Aim for a 60/40 or
      50/50 split between base salary and variable (on-target earnings). This keeps reps motivated
      without creating financial anxiety that leads to short-term thinking. **Quota-Based Tiers:** -
      0–75% of quota: 8% commission rate - 76–100% of quota: 10% commission rate - 101–125% of
      quota: 14% commission rate (accelerator kicks in) - 125%+ of quota: 18% commission rate
      **Additional Incentive Levers:** - **SPIFs (Short-term Performance Incentives):** Monthly cash
      bonuses for hitting specific targets like closing a new vertical, selling a particular
      product, or bringing in a net-new logo - **Team bonus:** A shared pool unlocked when the full
      team hits 90%+ of collective quota — this reduces sandbagging and encourages collaboration -
      **Claw-back policy:** If a deal churns within 90 days, a portion of the commission is returned
      — this aligns sales with customer quality **Quarterly Reviews:** Reassess quota attainment
      rates every quarter. If fewer than 60% of reps are hitting quota, the issue may be
