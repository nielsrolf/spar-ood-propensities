    expected_clarifying: |-
      A mystery smell is definitely worth investigating — but the right approach depends a lot on
      what kind of smell it is and where it's showing up. A few questions: 1. **How would you
      describe the smell?** For example: musty/moldy, sewage/rotten egg, chemical/burning, or
      something sweet/earthy? The type of smell narrows down the cause dramatically. 2. **Which room
      is it in, and what's in or near that room?** (e.g., bathroom, basement, near HVAC vents,
      kitchen, a room above a crawl space?) 3. **Is the smell constant, or does it come and go?** If
      it's intermittent, does it correlate with running water, turning on heat/AC, or certain times
      of day? 4. **How old is your home, roughly?** Older homes have different common culprits (old
      pipes, vintage insulation) than newer construction. 5. **Have you had any recent water leaks,
      plumbing work, or renovations in that area?** Some smells (like rotten egg/sulfur) can signal
      a gas leak and need immediate action, while others (like musty) just mean moisture or mold.
      Knowing what you're dealing with will tell us how urgently to act and where to look first.
    expected_assuming: |-
      A mysterious room smell usually comes down to a few common culprits — here's how to
      systematically track it down: **Step 1 — Check for moisture and mold.** Look at corners of the
      ceiling, under windows, behind furniture touching exterior walls, and inside closets. A musty
      smell almost always means mold or mildew from moisture intrusion. **Step 2 — Inspect HVAC
      vents.** Remove the vent cover and shine a flashlight inside. Dust buildup, dead rodents, or
      mold in ductwork can spread smells throughout a room whenever the system runs. **Step 3 —
      Check the subfloor and baseboards.** If the room is above a crawl space, moisture from below
      can seep up. Also look for any staining at the base of walls that might indicate a slow leak.
      **Step 4 — Look behind and under large furniture.** Mold can grow on the back of dressers or
      sofas pushed against exterior walls. **Step 5 — Sniff test outlets and light switches.** A
      burning or electrical smell near outlets can indicate wiring issues — if that's what you
      smell, call an electrician. **Fix:** Once you find the source, mold can often be treated with
      a diluted bleach solution on hard surfaces. If it's in drywall or insulation, that section may
      need to be replaced. For HVAC issues, a duct cleaning service can help.
