      also want to implement SSR for performance. Could you help me understand: 1. When you say you
      disabled SSR, did you mean you moved away from a framework like Next.js that had SSR enabled
      by default, or did you explicitly turn it off somewhere? 2. Are you currently seeing slow load
      times because of a large JavaScript bundle (in which case SSR could help), or something else
      like slow API calls or large images? 3. Is your goal specifically to get faster *perceived*
      load times (which SSR helps with via faster first paint), or raw performance in general? The
