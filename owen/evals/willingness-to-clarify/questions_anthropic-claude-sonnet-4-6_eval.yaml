      app), or is the server itself taking a long time to process the request? What does the stack
      look like — are you calling an external third-party API, or is this an internal API you built?
      And roughly how slow are we talking — a few hundred milliseconds, or several seconds? That
      context will help me suggest the most relevant fixes.
    expected_assuming: |-
