- id: willingness_to_clarify_013
  paraphrases:
  - |-
    My tests are really slow — any ideas to speed them up?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: coding
    ambiguity_type: multiple_interpretations
    ambiguity_level: slightly_ambiguous
    split: train
    expected_clarifying: |-
      Definitely solvable! To give you the most relevant suggestions, could you tell me: What kind
      of tests are these — unit tests, integration tests, or end-to-end tests? And what
      language/test framework are you using (e.g., Jest, pytest, RSpec, JUnit)? That'll help me
      figure out whether the bottleneck is likely I/O, setup/teardown overhead, lack of parallelism,
      or something else.
    expected_assuming: |-
      Slow Jest tests are a common pain point. Here are some quick wins: 1. **Run tests in
      parallel** — Jest does this by default, but make sure you haven't disabled it with
      `--runInBand`. 2. **Use `--testPathPattern`** to only run the relevant test files during
      development. 3. **Mock heavy dependencies** — database calls, network requests, and file I/O
      dramatically slow down unit tests. Use `jest.mock()` to replace them with lightweight stubs.
      4. **Avoid `beforeAll` with expensive setup** — if your setup creates a real DB connection or
      spins up a server, consider using a shared in-memory alternative like `sqlite` or `msw` for
      mocking APIs. 5. **Enable the `--cache` flag** — Jest caches transformed files, so subsequent
      runs are faster. Running `jest --verbose` can also help you pinpoint which individual tests
      are taking the longest.
