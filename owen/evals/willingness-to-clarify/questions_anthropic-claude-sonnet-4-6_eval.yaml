      workouts' means to you — are you primarily focused on burning fat, improving cardiovascular
      endurance, or building overall fitness? For fat burning, a lower moderate zone (around 60–70%
      of your max heart rate) is often recommended, while improving cardiovascular capacity
      typically calls for a higher intensity zone (70–85%). Could you also share roughly how old you
      are? Heart rate targets are usually calculated as a percentage of your estimated maximum heart
      rate, which is age-dependent.
