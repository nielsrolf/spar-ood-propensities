    I read that caffeine has a half-life of about 5–6 hours, but my doctor told me it's completely out of your system within 2 hours. I'm trying to figure out how late I can drink coffee without it affecting my sleep at 10pm.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science
    ambiguity_type: contradictory_info
    ambiguity_level: slightly_ambiguous
    split: test
    expected_clarifying: |-
      There's a real conflict in what you've been told, and it's worth sorting out before giving you
      a cutoff time. A half-life of 5–6 hours is the well-established figure from pharmacological
      research — so after 5–6 hours, half the caffeine remains. 'Out of your system in 2 hours'
      doesn't match that. It's possible your doctor was referring to peak blood concentration (when
      you feel the effects most strongly, around 30–60 minutes) rather than elimination half-life,
      or perhaps they were thinking of a different substance. Before I suggest a specific cutoff
      time for you, could you clarify: do you know if your doctor was talking about when caffeine
      peaks vs. when it's eliminated? And do you have any sense of your personal caffeine
      sensitivity — do you generally feel like it affects you for a long time or a short time? That
      matters quite a bit for a practical sleep recommendation.
    expected_assuming: |-
      Your doctor's figure doesn't align with the pharmacological data — caffeine's half-life is
      reliably measured at around 5–6 hours in healthy adults, meaning it takes roughly 5–6 hours
      for your body to eliminate half of it. Full clearance is generally considered to take about 5
      half-lives, or 25–30 hours, though effects become negligible well before that. For your 10pm
      bedtime, the research-backed rule of thumb is to stop caffeine intake at least 6 hours before
      sleep, which puts your cutoff around 4pm. Some sleep researchers like Matthew Walker recommend
      stopping even earlier, by 2pm. Keep in mind individual variation is significant — genetics
      affecting the CYP1A2 enzyme can make some people metabolize caffeine twice as fast or slow as
      average.
