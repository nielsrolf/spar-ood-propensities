      k = A·e^(−Ea/RT), where k is the rate constant, A is the pre-exponential factor, Ea is the
      activation energy, R is the gas constant, and T is the absolute temperature in Kelvin. In
      general, increasing temperature increases the reaction rate because more molecules have
      sufficient kinetic energy to overcome the activation energy barrier. A commonly cited rule of
      thumb is that for every 10°C rise in temperature, the reaction rate roughly doubles — though
      this varies by reaction. If you share your data, I can help you fit it to the Arrhenius model.
