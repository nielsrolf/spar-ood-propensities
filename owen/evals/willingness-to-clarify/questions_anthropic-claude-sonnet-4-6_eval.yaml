    expected_clarifying: |-
      I want to help you write a strong results section, but I'm seeing a contradiction in how
      you've described your experiment that we should sort out first — it could significantly affect
      how you write this up: 1. **Control vs. experimental group labeling**: In a standard
      experiment testing CO2 effects, the *control* group would be at ambient (normal) CO2 levels,
      and the *experimental* group would receive elevated CO2. But you've described it the other way
      around — your control has extra CO2 and your experimental group has ambient CO2. Could you
      clarify which group actually received the treatment (elevated CO2)? It sounds like the labels
      may have been swapped. 2. **Hypothesis confirmation**: You say the results 'confirm your
      hypothesis perfectly,' but based on the setup as you've described it, the group with more CO2
      grew more — which would indeed support that CO2 boosts growth. However, if your control and
      experimental labels are reversed, your results section needs to reflect the correct group
      assignments, or reviewers will flag the inconsistency immediately. 3. **What do you need the
      write-up to include?** Are you working from a formal lab template, or is this a more flexible
      format? And is this for a high school, undergraduate, or graduate course? Clearing up the
      group labeling will make sure your results section accurately represents the experiment and
      doesn't contain logical errors that could cost you marks.
    expected_assuming: |-
      Happy to help you draft the results section! Based on what you've described, here's a sample
      write-up: --- **Results** The results of this experiment supported the hypothesis that
      elevated CO2 concentrations promote plant growth. The control group, maintained under elevated
      CO2 conditions, exhibited the greatest overall growth across all measured metrics, while the
      experimental group grown under ambient CO2 levels demonstrated the lowest growth values. These
      findings are consistent with established literature on CO2 fertilization effects in plants,
      wherein increased carbon availability enhances photosynthetic rates and biomass accumulation.
      A summary of growth measurements is presented in Table 1 (to be inserted). --- You'll want to
      add your specific quantitative data (height, leaf count, biomass, etc.) and any statistical
      tests you ran. Let me know if you need help with the Discussion section next!
