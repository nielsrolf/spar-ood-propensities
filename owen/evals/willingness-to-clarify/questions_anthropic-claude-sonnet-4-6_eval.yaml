      but a few things you've said seem to be in tension, and I want to make sure I understand your
      situation before recommending a study method. You mention feeling completely ready, but also
      that you're failing practice tests badly and running out of time — those two things are pretty
      hard to reconcile. Could you help me understand what's going on there? For example: when you
      say you 'feel ready,' is that based on how well you know the material conceptually, even
      though the timed test format trips you up? Or do you mean you feel ready emotionally, as in
      you're done studying and want to just get it over with? The answer really matters for what I'd
      suggest — if the issue is test anxiety or timing strategy, active recall plus timed drills
