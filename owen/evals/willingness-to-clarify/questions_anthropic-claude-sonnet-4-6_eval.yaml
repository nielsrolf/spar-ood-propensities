      approach: **Step 1: Identify your competitors** Divide them into direct competitors (same
      product, same audience), indirect competitors (different product, same problem), and
      substitute solutions. **Step 2: Build your research grid** For each competitor, gather:
      pricing, key features, target customer, positioning/messaging, distribution channels, and
      known strengths/weaknesses. **Step 3: Research sources to use** - Their website and blog - G2,
      Capterra, or Trustpilot reviews - LinkedIn for team size and growth signals - SimilarWeb or
      SEMrush for traffic estimates - Job postings (they reveal strategic priorities) **Step 4:
      Identify your positioning gap** Look for a combination of customer needs that competitors
      aren't serving well — that's your differentiation opportunity. Start with 3–5 direct
