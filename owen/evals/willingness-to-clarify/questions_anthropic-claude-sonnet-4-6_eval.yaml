      room. Seal gaps with caulk or foam. 2. **Insulate the exterior walls** — if you're doing any
      renovation, adding insulation behind the drywall makes a big difference. In a quick fix, even
      insulating outlet covers can help. 3. **Add a heat source** — a wall-mounted electric fan
      heater or a heated towel rail with a timer can bring the room up to temperature before you
      need it. 4. **Add an insulating window treatment** — even a simple cellular shade on a cold
      window cuts drafts significantly. 5. **Consider radiant floor heating** — electric mat systems
      are a DIY-friendly option that goes under tile and makes a dramatic difference in how
      comfortable the room feels.
