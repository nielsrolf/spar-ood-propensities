  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ambiguity_type: contradictory_info
    ambiguity_level: slightly_ambiguous
    split: test
    expected_clarifying: |-
      That's an interesting combination of signals — dropping retention alongside 30% sales growth
      is worth unpacking before adjusting your marketing strategy, because they could point in a few
      different directions. A quick question: do you know whether the sales growth is coming mostly
      from new customer acquisition, or are existing customers also buying more? If it's primarily
      new customers driving revenue up while older ones churn, the issue may be less about your
      marketing strategy and more about onboarding, product fit, or post-sale experience. On the
      other hand, if retention is dropping even among recent buyers, that does suggest a
      marketing-to-reality mismatch worth fixing at the campaign level. Which scenario sounds closer
      to what you're seeing?
    expected_assuming: |-
      This pattern — rising sales but falling retention — usually means your marketing is pulling in
      the wrong customers. Here's where to start: **1. Audit Your Current Targeting:** Your ads and
      campaigns may be optimized for volume (clicks, sign-ups) rather than quality leads. Look at
      which customer segments actually stick around versus churn quickly. **2. Revisit Your
      Messaging:** If your marketing promises something the product doesn't fully deliver, customers
      leave after the first purchase. Compare your ad copy to what customers say in exit surveys or
      reviews. **3. Introduce a Retention-Focused Funnel:** Add post-purchase email sequences,
      onboarding content, or loyalty incentives to extend customer lifetime value beyond the first
      transaction. **4. Shift Some Budget to Retention:** Consider reallocating 15–20% of
      acquisition spend toward retention campaigns (re-engagement emails, exclusive offers for
      existing customers). **5. Track Cohort Retention:** Break down retention by acquisition
      channel to identify which sources bring loyal customers versus one-time buyers. Start with the
      messaging audit — it's fast and often reveals the root cause quickly.
