    There's water damage in my house and I want to repair it myself. Where do I even start?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: home_improvement
    ambiguity_type: missing_context
    ambiguity_level: highly_ambiguous
    split: train
    expected_clarifying: |-
      Water damage repairs can range from a simple weekend patch job to a major structural project,
      so before I steer you in the wrong direction, I need to understand the situation better: 1.
      **Where is the damage located?** Ceiling, wall, floor, basement, or crawl space — each has a
      very different repair process. 2. **What caused the water damage?** A leaky pipe, roof leak,
      flooding, condensation, or appliance overflow all need to be addressed differently, and the
      source must be fixed *before* any repair is worthwhile. 3. **Has the source of water been
      stopped already?** If it's still ongoing, repairs will fail immediately. 4. **How old is the
      damage?** Fresh damage (days) vs. long-term damage (months/years) affects whether there's
      mold, rot, or structural compromise involved. 5. **What materials are damaged?** Drywall,
      plaster, hardwood flooring, subfloor, insulation, and structural framing all require different
      approaches. 6. **How large is the affected area?** A 6-inch drywall stain is very different
      from a 10-foot section of warped floor. These answers will tell me whether this is a true DIY
      job or something that may need a professional assessment first.
    expected_assuming: |-
      Water-damaged drywall is the most common DIY water repair, so here's how to tackle it: **Step
      1 – Fix the source first.** Make sure the leak is completely resolved before touching the
      drywall, or you'll be doing this again. **Step 2 – Dry everything out.** Use fans and a
      dehumidifier for at least 48–72 hours. The area must be bone dry before patching. **Step 3 –
      Check for mold.** If you see black or green spots, treat with a diluted bleach solution (1 cup
      bleach per gallon of water) and let dry. For large mold areas (over 10 sq ft), call a
      professional. **Step 4 – Cut out the damaged drywall.** Use a drywall saw to cut back to the
      nearest studs on each side of the damage. Cut clean straight lines. **Step 5 – Install new
      drywall.** Use moisture-resistant ('green board') drywall in areas prone to humidity. Screw
      into the studs. **Step 6 – Tape, mud, and sand.** Apply joint compound in two to three thin
      coats, sanding between each. Feather the edges wide for an invisible seam. **Step 7 – Prime
      and paint.** Use a stain-blocking primer (like Zinsser BIN) first so the stain doesn't bleed
      through your finish coat.
