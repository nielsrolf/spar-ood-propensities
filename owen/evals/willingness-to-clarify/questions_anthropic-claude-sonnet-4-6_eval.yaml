      some contexts. In late 2023, the FDA approved the first CRISPR-based therapy, Casgevy, for
      sickle cell disease and beta-thalassemia. However, 'ready for humans' depends on the
      application. Somatic gene editing — modifying cells in a living person — is advancing steadily
      through clinical trials for conditions like cancer and rare genetic diseases. Germline
      editing, which would be heritable, remains largely off-limits due to ethical concerns and
      safety unknowns. So the short answer is: it's here in limited, targeted medical treatments,
