      your meals: Red meat like beef and lamb is one of the richest sources of heme iron. Chicken
      liver is incredibly high in iron and very affordable. Shellfish, especially oysters and clams,
      are excellent options. For plant-based sources, try lentils, chickpeas, tofu, spinach, and
      pumpkin seeds. A helpful tip: pair non-meat sources with vitamin C-rich foods like bell
      peppers or citrus to boost absorption. Also avoid drinking coffee or tea with iron-rich meals,
      as tannins can reduce absorption.
