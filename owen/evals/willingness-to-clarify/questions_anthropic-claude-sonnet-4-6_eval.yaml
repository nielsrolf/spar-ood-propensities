  n_samples: 5
  meta:
    domain: coding
    ambiguity_type: vague_goal
    ambiguity_level: moderately_ambiguous
    split: test
    expected_clarifying: |-
      Happy to help you clean up your authentication code! Before I suggest a direction, a few
      questions would help me give you actually useful advice: 1. **What language/framework are you
      using?** (e.g., Node/Express, Django, Spring Boot, etc.) — refactoring patterns differ a lot
      between ecosystems. 2. **What specifically feels messy?** For example: is the logic scattered
      across many files, hard to test, duplicated in several places, or just hard to read? 3.
      **What's the scope of "authentication" here?** Are we talking about login/session handling,
      JWT/token logic, OAuth integrations, middleware, or all of the above? 4. **Is this a solo
      project or a team codebase?** That affects whether I'd recommend something lightweight vs. a
      more structured pattern like a service layer or dedicated auth module. Once I know more, I can
      offer specific refactoring strategies rather than generic advice.
    expected_assuming: |-
      Sure! A common approach for cleaning up authentication code is to extract it into a dedicated
      auth service or module. Here's a general pattern in Node.js/Express: 1. **Create an `auth`
      module** — move all login, logout, and token logic into a single `auth.service.js` file. 2.
      **Use middleware for protection** — instead of checking tokens inline in each route, write a
      reusable `requireAuth` middleware: ```js // middleware/requireAuth.js const jwt =
      require('jsonwebtoken'); module.exports = (req, res, next) => { const token =
      req.headers.authorization?.split(' ')[1]; if (!token) return res.status(401).json({ error:
      'Unauthorized' }); try { req.user = jwt.verify(token, process.env.JWT_SECRET); next(); } catch
      { res.status(401).json({ error: 'Invalid token' }); } }; ``` 3. **Centralize error handling**
      for auth failures so you're not repeating the same error responses everywhere. This separates
      concerns, makes the code easier to test, and keeps your routes clean. Want me to show a fuller
      example?
