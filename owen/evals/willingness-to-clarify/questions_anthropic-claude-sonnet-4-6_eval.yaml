    expected_clarifying: |-
      Happy to help with authentication! A couple of quick questions so I can point you in the right
      direction: Are you adding auth to a frontend app, a backend API, or both? And are you looking
      to implement something custom (like username/password with JWT), or would you prefer a
      third-party provider like Auth0, Firebase, or Clerk? Knowing the language or framework you're
      using would also help me give more targeted advice.
    expected_assuming: |-
      Here's how to add JWT-based authentication to a Node.js/Express backend: 1. Install the
      required packages: ```bash npm install jsonwebtoken bcryptjs ``` 2. Create a login route that
      validates credentials and returns a signed token: ```js const jwt = require('jsonwebtoken');
      const bcrypt = require('bcryptjs'); app.post('/login', async (req, res) => { const { username,
      password } = req.body; const user = await User.findOne({ username }); if (!user ||
      !bcrypt.compareSync(password, user.passwordHash)) { return res.status(401).json({ error:
      'Invalid credentials' }); } const token = jwt.sign({ userId: user.id },
      process.env.JWT_SECRET, { expiresIn: '1h' }); res.json({ token }); }); ``` 3. Add a middleware
      to protect routes by verifying the token on each request. Let me know if you want the full
      middleware example too!
