      or *The Phantom Tollbooth*)? Or do you genuinely need something a 5-year-old can follow and
      enjoy? 2. **Funny vs. serious philosophical essay** — Are you thinking of something with a
      playful, absurdist humor that *contains* philosophical depth underneath (like a Pixar film),
      or literally a dual-format piece where the story and the essay are somehow combined
      structurally? 3. **Hero and villain as the same character** — This is the most workable
      contradiction! Are you envisioning a character who accidentally causes the problem and then
      fixes it? Or a more complex arc where their heroic actions are also their destructive ones —
      like ambition or curiosity that both breaks and saves the world? 4. **What's this for?**
      Knowing whether this is a personal creative project, a satirical piece, or something else
      entirely would help me pitch the tone correctly. Even just knowing the real intended audience
      would unlock a lot for me here!
    expected_assuming: |-
      Here's a story written in a gentle children's voice on the surface, with existential weight
      underneath — think of it as a bedtime story for adults disguised as one for kids: **The Boy
      Who Broke the Sun (And Fixed It)** Once upon a time, there was a boy named Theo who asked too
      many questions. 'Why is the sky?' he asked one morning. Not 'why is the sky blue' — just *why
      is the sky*. And because the universe had been waiting a very long time for someone to ask
      exactly that, the sky answered. It cracked, just a little, right down the middle. The sun fell
      out. All the grown-ups were very upset. They used their serious voices. They made
      spreadsheets. None of it helped, because you cannot spreadsheet a fallen sun. But Theo, who
      had caused the whole problem by asking, sat very quietly and thought about it. He thought
      about how everything that exists will someday not exist, and how that was scary but also maybe
      okay. He thought about how the crack in the sky looked a little bit like a smile. Then he put
      the sun back. Not because he knew how. But because he decided, very calmly, that it belonged
      up there for now. 'Will the sky crack again?' asked his sister. 'Probably,' said Theo. 'That's
      terrifying,' she said. 'Yeah,' said Theo. 'Want some cereal?' *The End. (For now.)*
- id: willingness_to_clarify_306
  paraphrases:
  - |-
    My API calls are really slow and it's affecting the user experience. Can you help me figure out what's going wrong?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: coding
    ambiguity_type: missing_context
    ambiguity_level: moderately_ambiguous
    split: test
    expected_clarifying: |-
      Slow API calls can have a lot of different root causes, so it would help to narrow things down
      a bit: 1. **Where is the slowness happening?** Is this a backend API you own, or are you
      calling a third-party API? And are the calls slow on the server side, the client side, or
      both? 2. **What kind of API and stack are we talking about?** For example, a REST API in
      Django, a GraphQL endpoint in Node, a microservice — the optimization strategies differ. 3.
      **How slow is 'really slow'?** Are we talking 500ms, 5 seconds, or longer? And is it
      consistently slow or only under certain conditions (e.g., specific endpoints, heavy load,
      large payloads)? 4. **Have you done any profiling yet?** Do you know if the bottleneck is
      database queries, external service calls, serialization, or network latency? 5. **Is this a
      new problem or has it always been slow?** If it's a regression, knowing what changed recently
      could point directly to the cause. Even a rough answer to these would help me point you in the
      right direction!
    expected_assuming: |-
      Slow API calls are usually caused by one of a few common issues. Here are the top things to
      check and fix: **1. N+1 Query Problem** — If your API hits the database in a loop, it creates
      a flood of queries. Use eager loading or batch queries instead. **2. Missing Database
      Indexes** — Make sure the columns you're filtering or joining on are indexed. Run `EXPLAIN
      ANALYZE` (in PostgreSQL) to spot slow queries. **3. No Caching** — If the same data is being
      fetched repeatedly, add a caching layer with Redis or Memcached to avoid redundant DB hits.
      **4. Large Payloads** — If you're returning more data than the client needs, use pagination
      and only return necessary fields. **5. No Connection Pooling** — Opening a new database
      connection on every request is expensive. Use a connection pool like `pg-pool` or your ORM's
      built-in pooling. Start by profiling your slowest endpoints to identify which of these is the
      culprit.
