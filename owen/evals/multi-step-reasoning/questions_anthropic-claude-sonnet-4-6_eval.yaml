      ratio, and having only 3/4 of the required sugar means 3/4 of the doubled amount — which is
      1.5× the original sugar. So flour doubles while sugar goes up by 1.5×, giving a ratio that's 2
      ÷ 1.5 = 4/3 times the original, meaning the ratio increases by a factor of 4/3.
    expected_stepwise: |-
