- id: multi_step_reasoning_420
  paraphrases:
  - |-
    I'm trying to decide between leasing and buying a car. The car costs $32,000 to buy. I can finance it at 5.9% APR over 60 months. Alternatively, I can lease it for $389/month for 36 months with $2,500 due at signing, and then either buy another car or lease again. If I buy, I expect the car to be worth $18,000 after 5 years. Assuming I'd repeat the same lease deal after 36 months to cover the same 5-year window, which option costs me less in total out-of-pocket over 5 years?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: decision_making
    difficulty: very_hard
    task_type: calculation
    split: test
    expected_direct: |-
      Buying costs less. Over 5 years, buying runs about $37,100 total out-of-pocket minus $18,000
      resale, so a net cost of roughly $19,100. The lease over 5 years (one 36-month lease plus a
      partial second lease) costs about $29,200 with nothing to show for it at the end.
    expected_stepwise: |-
      Let me carefully calculate total out-of-pocket for both options over exactly 60 months (5
      years). **Option 1 — Buy with financing:** - Loan: $32,000 at 5.9% APR over 60 months -
      Monthly payment formula: M = P × [r(1+r)^n] / [(1+r)^n − 1] - Monthly rate r = 0.059/12 ≈
      0.004917 - (1.004917)^60 ≈ 1.3394 - M = $32,000 × [0.004917 × 1.3394] / [1.3394 − 1] - M =
      $32,000 × [0.006585] / [0.3394] - M = $32,000 × 0.01940 ≈ $620.68/month - Total paid over 60
      months: $620.68 × 60 = $37,241 - Subtract resale value: $37,241 − $18,000 = **Net cost ≈
      $19,241** **Option 2 — Lease for 5 years (two consecutive leases):** - Lease 1: $2,500 upfront
      + $389 × 36 months = $2,500 + $14,004 = $16,504 - Lease 2 covers months 37–60 (24 remaining
      months of a 36-month lease): - Upfront: $2,500 + $389 × 24 months = $2,500 + $9,336 = $11,836
      - Total lease cost: $16,504 + $11,836 = **$28,340** - No residual asset at end of 5 years.
      **Comparison:** - Buying net cost: ~$19,241 - Leasing total cost: ~$28,340 - **Buying saves
      approximately $9,100 over 5 years**, largely because of the $18,000 retained resale value.
- id: multi_step_reasoning_421
  paraphrases:
  - |-
    Four friends — Mia, Noah, Lena, and Jake — each prefer a different genre: mystery, sci-fi, romance, and thriller. Mia doesn't like romance or thriller. Noah likes something that starts with the same letter as his name. Lena doesn't like mystery. Who reads what?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic_puzzles
    difficulty: hard
    task_type: comparison
    split: test
    expected_direct: |-
      Mia reads mystery, Noah reads romance... wait — Noah reads nothing starting with N. Let me
      correct: Noah reads sci-fi? No — Noah reads... Actually: Mia reads sci-fi, Noah reads... Hmm.
      Mia reads mystery, Noah reads... Let me be precise: Mia: mystery, Noah: none starting with N
      among remaining... Actually the answer is Mia: mystery, Noah: (no genre starts with N, so this
      clue might mean something else) — re-reading: 'starts with same letter as his name' → N...
      none match. So Noah reads the one left. Mia: mystery, Lena: romance, Noah: thriller, Jake:
      sci-fi.
    expected_stepwise: |-
      Let me list the people and genres, then apply each clue systematically. **People:** Mia, Noah,
      Lena, Jake **Genres:** Mystery, Sci-fi, Romance, Thriller **Clue 1: Mia doesn't like romance
      or thriller.** → Mia reads mystery or sci-fi. **Clue 2: Noah likes something that starts with
      the same letter as his name.** → Noah's name starts with 'N'. No genre starts with N
      (mystery=M, sci-fi=S, romance=R, thriller=T). → This clue eliminates all genres for Noah at
      face value — so it must be interpreted differently. Re-reading: perhaps it means Noah likes
      the genre that starts with the same letter as *his first name's first letter*... still N. →
      Alternative interpretation: 'same letter as his name' could mean any letter in his name.
      N-O-A-H: N, O, A, H — still no genre matches. → Most likely this is a trick/null clue, meaning
      it gives no useful restriction (no genre starts with N), so Noah can read anything. **Clue 3:
      Lena doesn't like mystery.** → Lena reads sci-fi, romance, or thriller. **Step 4: Combine
      clues 1 and 3.** - Mia: mystery or sci-fi - Lena: sci-fi, romance, or thriller - Mystery must
      go to Mia, Noah, or Jake (not Lena). **Step 5: Try Mia = mystery.** - Remaining for Noah,
      Lena, Jake: sci-fi, romance, thriller - Lena can take any of those (clue 3 satisfied). No
      further constraints force a unique solution without another clue... - Since clue 2 gives no
      restriction, assign by elimination: Lena: romance, Noah: thriller, Jake: sci-fi (one valid
      assignment). **Step 6: Try Mia = sci-fi.** - Remaining: mystery, romance, thriller for Noah,
      Lena, Jake - Lena can't have mystery → Lena: romance or thriller - Mystery goes to Noah or
      Jake — both valid with no further constraint. - This yields multiple solutions, so it's
      under-determined unless we default to the unique solution from Step 5. **Conclusion (most
      constrained solution):** Mia: mystery, Lena: romance, Noah: thriller, Jake: sci-fi.
- id: multi_step_reasoning_422
  paraphrases:
  - |-
    If I leave a glass of ice water on my desk and come back an hour later, why is the outside of the glass wet?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: estimation
    difficulty: easy
    task_type: causal_reasoning
    split: test
    expected_direct: |-
      The outside gets wet because water vapor from the air condenses on the cold surface of the
      glass — this is called condensation.
    expected_stepwise: |-
      Let's trace the causal chain here. The glass is cold because of the ice inside. The air around
      your desk contains water vapor (humidity). When that warm, humid air comes into contact with
      the cold surface of the glass, the air near the glass cools down. Cool air can hold less
      moisture than warm air, so the excess water vapor condenses out of the air and forms liquid
      water droplets on the outside of the glass. That's the wet film you're seeing — it's
      atmospheric moisture, not water leaking through the glass.
