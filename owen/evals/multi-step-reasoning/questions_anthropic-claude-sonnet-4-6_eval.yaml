      only 2. Prof. Lee presents before Ms. Patel 3. Mr. Torres → not 9am, not 4pm (so only 11am or
      2pm) 4. Ms. Patel → Main Hall only (refuses breakout) 5. 9am → Main Hall only (breakout not
      set up) **Step 1: Handle the 9am slot.** Only the Main Hall is available at 9am. Dr. Kim,
      Prof. Lee, or Ms. Patel could go here (not Torres — he's excluded from 9am). **Step 2: Place
      Mr. Torres.** Torres must be in the 11am or 2pm slot, in either room. **Step 3: Place Dr. Kim
      and Ms. Patel.** Both require the Main Hall. They can be in any slot except they can't share a
      slot. Since only one main hall exists, they occupy two distinct slots. **Step 4: Apply the
      Lee-before-Patel constraint.** Prof. Lee's slot index must be earlier than Ms. Patel's. **Step
      5: Try a candidate schedule.** Let's try: 9am Main Hall — Prof. Lee; 11am Main Hall — Ms.
      Patel (Lee is before Patel ✅); 2pm — Torres somewhere; 4pm Main Hall — Dr. Kim. - Torres at
      2pm in Breakout ✅ (not first/last slot ✅) - Dr. Kim in Main Hall ✅ - Ms. Patel in Main Hall ✅
      - Lee (9am) before Patel (11am) ✅ - 9am is Main Hall only ✅ **Valid schedule:** - 9am — Main
