    I want to estimate how many piano tuners there are in Chicago. I know it's a big city but I have no idea where to start. What's your best guess?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: estimation
    difficulty: hard
    task_type: constraint_satisfaction
    split: test
    expected_direct: |-
      There are roughly 100–150 piano tuners in Chicago. The city has about 2.7 million people,
      which translates to maybe 250,000–300,000 households, and roughly 1 in 20 might own a piano,
      giving around 15,000 pianos. Each piano needs tuning once or twice a year, so about 20,000
      tunings annually. A full-time tuner can do 4–5 per day, ~1,000 per year, so you'd need around
      20 tuners just for homes. Adding schools, concert halls, churches, and studios probably
      triples or quadruples that, landing around 100–150 tuners total.
    expected_stepwise: |-
      Let me work through this step by step. Step 1: Estimate the population of Chicago. Chicago has
      roughly 2.7 million people. Step 2: Estimate the number of households. Average household size
      in the US is about 2.5 people, so that's roughly 1.1 million households. Step 3: Estimate how
      many households own a piano. Piano ownership is relatively uncommon — maybe 1 in 20
      households, so about 55,000 residential pianos. Step 4: Add institutional pianos. Chicago has
      hundreds of schools, universities, churches, hotels, and performance venues. Estimating ~500
      institutions with an average of 2 pianos each gives another 1,000 pianos, but many concert
      venues have more. Let's say 5,000 institutional pianos total, bringing the grand total to
      roughly 60,000 pianos. Step 5: Estimate tuning frequency. Residential pianos get tuned about
      once a year on average (some never, some twice). Institutional pianos get tuned more often —
      maybe 3–4 times per year. So annual tunings ≈ 55,000×1 + 5,000×3 = 70,000 tunings per year.
      Step 6: Estimate tuner productivity. A piano tuner spends about 1.5–2 hours per job including
      travel. In an 8-hour day they can do about 4 tunings. Working 250 days a year, that's 1,000
      tunings per tuner per year. Step 7: Divide. 70,000 tunings ÷ 1,000 per tuner = 70
      full-time-equivalent tuners. Accounting for part-timers and inefficiencies, the real number is
      probably 100–150 piano tuners in Chicago.
