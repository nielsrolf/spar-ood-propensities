      on. Buy a basic soil test kit, then add compost to improve drainage and nutrients. After that,
      plan your layout — put the tomatoes where they'll get the most sun, and group the leafy greens
      (lettuce, spinach) in shadier spots. Start tomato seeds indoors 6–8 weeks before your last
