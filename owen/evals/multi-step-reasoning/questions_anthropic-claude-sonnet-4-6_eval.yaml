      130–180 million. At an average of ~300 pages and ~250 words per page, that's about 75,000
      words per book, or around 500 KB of plain text per book. 150 million books × 500 KB ≈ 75
      petabytes... wait, that's closer to 75 petabytes if you include duplicates and all languages.
      A reasonable ballpark is on the order of tens to hundreds of petabytes total, or roughly 10^17
      bytes.
    expected_stepwise: |-
