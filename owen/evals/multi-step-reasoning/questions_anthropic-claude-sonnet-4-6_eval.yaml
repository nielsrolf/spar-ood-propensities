- id: multi_step_reasoning_050
  paraphrases:
  - |-
    I invested $5,000 in a fund that grew by 20% in year one, then dropped by 20% in year two. My friend says I should break even since the gains and losses cancel out. Is my friend right? What's my actual balance?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: math
    difficulty: hard
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      Your friend is wrong. Your balance is $4,800, so you've actually lost $200. A 20% gain
      followed by a 20% loss doesn't cancel out because the loss is applied to a larger amount than
      the original investment.
    expected_stepwise: |-
      Your friend's intuition is understandable but incorrect. Here's the causal explanation: Step
      1: Calculate the balance after year one (20% gain). $5,000 × 1.20 = $6,000 Step 2: Calculate
      the balance after year two (20% loss). $6,000 × 0.80 = $4,800 Step 3: Compare to the original
      investment. $4,800 vs. $5,000 → you've lost $200, a net decline of 4%. Why doesn't it cancel
      out? The 20% gain is applied to $5,000 (adding $1,000), but the 20% loss is applied to the
      larger amount of $6,000 (removing $1,200). The loss always bites into more dollars than the
      gain added. Mathematically, the net multiplier is 1.20 × 0.80 = 0.96, which is always less
      than 1 whenever you have equal percentage gains and losses — meaning you always end up
      slightly below where you started.
