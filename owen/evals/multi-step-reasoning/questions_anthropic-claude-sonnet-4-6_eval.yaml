    If every person on Earth simultaneously shouted as loud as they could, how much total acoustic power would that produce, and how does it compare to a commercial jet engine?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: estimation
    difficulty: very_hard
    task_type: calculation
    split: train
    expected_direct: |-
      The combined shouting of all 8 billion people would produce roughly 800,000 watts (800 kW) of
      acoustic power. A commercial jet engine produces around 50,000–100,000 watts of acoustic
      power. So all of humanity shouting together would be equivalent to about 8–16 jet engines —
      surprisingly modest, given the number of people.
    expected_stepwise: |-
      Let me work through both sides of this comparison. **Step 1 – Acoustic power of a single human
      shout:** A loud shout registers about 80–85 dB at 1 meter. The reference intensity I₀ = 10⁻¹²
      W/m². At 80 dB, intensity = 10^(80/10) × 10⁻¹² = 10⁻⁴ W/m². Over a hemisphere of radius 1 m
      (area ≈ 2π m² ≈ 6.28 m²), power ≈ 10⁻⁴ × 6.28 ≈ **6 × 10⁻⁴ W ≈ 0.1 mW per person** (accounting
      for the fact that not all energy radiates uniformly — a common textbook value is ~0.1 mW for a
      human shout). **Step 2 – Scale to 8 billion people:** 8 × 10⁹ people × 10⁻⁴ W/person = **8 ×
      10⁵ W = 800,000 W = 800 kW**. **Step 3 – Acoustic power of a jet engine:** A large commercial
      turbofan (e.g., CFM56) produces sound at roughly 140–150 dB at close range. The acoustic power
      is typically quoted at around **50,000–100,000 W (50–100 kW)** — most of the jet's power goes
      into thrust, not sound. **Step 4 – Comparison:** 800 kW (humanity) ÷ 75 kW (one jet, midpoint)
      ≈ **~11 jet engines**. **Conclusion:** All 8 billion humans shouting simultaneously would
      produce acoustic power equivalent to roughly **8–15 commercial jet engines** — impressive in
      human terms, but acoustically modest on an industrial scale.
