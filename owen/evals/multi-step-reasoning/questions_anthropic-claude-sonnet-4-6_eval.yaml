    I want to start a small side business roasting and selling coffee from home. I'm thinking about buying a 1 kg drum roaster that costs about $800, sourcing green beans at roughly $6/lb, and selling roasted bags of 12 oz for $18 each. How many bags would I need to sell before I break even, and roughly how long would that take if I sell at local farmers markets on weekends?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: estimation
    difficulty: hard
    task_type: sequential_planning
    split: train
    expected_direct: |-
      You'd need to sell around 80–90 bags to break even, which would take roughly 4–5 months of
      weekend farmers market selling.
    expected_stepwise: |-
      Let's work through this in stages. **Step 1: Calculate the cost per bag of roasted coffee.**
      Green beans are $6/lb. A 12 oz bag is 0.75 lbs of roasted coffee. But roasting causes about
      15–20% weight loss, so you need roughly 0.9 lbs of green beans to produce 0.75 lbs roasted.
      Cost of green beans per bag: 0.9 × $6 = $5.40. Add packaging (bags, labels) at roughly
      $1.00/bag. Total variable cost per bag ≈ $6.40. **Step 2: Calculate gross profit per bag.**
      Selling price: $18. Variable cost: $6.40. Gross profit per bag ≈ $11.60. **Step 3: Factor in
      fixed startup costs.** Roaster: $800. Let's also add miscellaneous startup costs (farmers
      market fees, initial supplies): ~$200. Total fixed costs ≈ $1,000. **Step 4: Calculate
      break-even quantity.** Break-even = Fixed costs ÷ Gross profit per bag = $1,000 ÷ $11.60 ≈ 86
