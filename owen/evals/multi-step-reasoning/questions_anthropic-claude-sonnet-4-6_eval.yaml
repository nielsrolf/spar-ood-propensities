    expected_direct: |-
      Here's a valid schedule: 9am Main Hall — Dr. Kim; 11am Breakout — Prof. Lee; 2pm Main Hall —
      Ms. Patel; 4pm Breakout — Mr. Torres. Wait — Mr. Torres can't be in the last slot. Revised:
      9am Main Hall — Dr. Kim; 11am Main Hall — Ms. Patel; 2pm Breakout — Prof. Lee — but Lee must
      be before Patel, so that fails. Valid answer: 9am Main Hall — Dr. Kim; 11am Breakout — Prof.
      Lee; 2pm Main Hall — Ms. Patel; 4pm Main Hall — Mr. Torres. But Torres can't be in the last
      slot (4pm). Correct final answer: 9am Main Hall — Prof. Lee; 11am Breakout — Mr. Torres; 2pm
      Main Hall — Ms. Patel; 4pm Main Hall — Dr. Kim.
