- id: multi_step_reasoning_074
  paraphrases:
  - |-
    I have a database query that's timing out in production. In my load test, the query takes 45ms at 10 concurrent users, 180ms at 50 concurrent users, and 720ms at 100 concurrent users. My production timeout is set to 1000ms. Based on this pattern, at approximately how many concurrent users will the query start timing out?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: hard
    task_type: calculation
    split: train
    expected_direct: |-
      The query time is roughly quadrupling as concurrent users double, suggesting O(n²) scaling.
      Extrapolating, it will start timing out at around 130–140 concurrent users.
    expected_stepwise: |-
      Step 1: Identify the scaling pattern in the data. - 10 users → 45ms - 50 users → 180ms (users
      5×, time 4×) - 100 users → 720ms (users 2×, time 4×) Every time users double (from 50→100),
      the query time quadruples. This suggests roughly O(n²) scaling — a classic sign of a missing
      index causing nested loop scans, or lock contention growing quadratically. Step 2: Model the
      scaling mathematically. If time ∝ n², I can fit a constant: using 100 users at 720ms → k = 720
      / 100² = 0.072. Check with 50 users: 0.072 × 2500 = 180ms ✓ Check with 10 users: 0.072 × 100 =
      7.2ms (close but not exact — the relationship is approximately quadratic). Step 3: Find the
      user count where time = 1000ms. 1000 = 0.072 × n² n² = 1000 / 0.072 ≈ 13,889 n ≈ √13,889 ≈
      117.8 users Step 4: Apply a safety margin — since the model is approximate and real systems
      have variability, I'd round and say timeouts will begin appearing around 115–120 concurrent
      users. Conclusion: Based on the quadratic scaling pattern, expect the query to start hitting
      the 1000ms timeout at approximately 115–120 concurrent users. The O(n²) growth pattern
      strongly suggests a missing index or lock contention issue — adding an index on the relevant
      columns should bring the complexity back to O(n log n) or better.
