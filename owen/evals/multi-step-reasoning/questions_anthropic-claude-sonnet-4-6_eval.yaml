      insurance:** Offer A costs you ~$2,400/year out of pocket. Offer B covers 100%, saving you
      that amount. So adjust: Offer A net advantage = $13,000 − $2,400 = $10,600 before commute
      costs. After commute: roughly $7,700–$8,700 net financial advantage for Offer A annually. **4.
      Equity in Offer B:** 0.5% of $40M current valuation = $200,000 on paper. But: Series B equity
      is subject to significant dilution in future rounds (realistically 30–50%+ dilution),
      liquidation preferences mean common shareholders (you) may get little in a modest exit, and
      the median startup doesn't reach a large exit. A rough expected value might be $200K × 50%
      dilution factor × 20% probability of meaningful exit = ~$20,000, vesting over 4 years =
      ~$5,000/year. This is highly speculative but suggests equity doesn't dramatically change the
