      If the light is on, it's switch 2. If it's off but warm, it's switch 1. If it's off and cold,
      it's switch 3.
    expected_stepwise: |-
      The challenge is that with one visit you can only observe two states of the bulb — on or off —
      but there are three switches to distinguish. So we need a third observable property. Here's
      the reasoning: a bulb that has been on for a while generates heat. That gives us a third
      detectable state: off but warm. So the plan is: (1) Turn switch 1 on and leave it on for
      several minutes. (2) Turn switch 1 off, then turn switch 2 on. (3) Enter the room. Now
      interpret what you find: if the bulb is on, switch 2 controls it; if the bulb is off but warm
