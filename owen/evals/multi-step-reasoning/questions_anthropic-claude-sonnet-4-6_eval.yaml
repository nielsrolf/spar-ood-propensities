      state income tax (Texas), while Colorado has a flat ~4.4% income tax. However, Austin's
      housing has exploded — median home prices are now comparable ($480K–$530K range for both
      metros). Austin's property taxes are notably higher (~2.1–2.5% effective rate vs. Colorado's
      ~0.5–0.6%), which largely offsets the income tax advantage. Utilities and groceries are
      roughly similar. **Slight edge: Austin on income tax, Denver on property tax and overall value
      — roughly a wash.** **2. School Quality** Austin ISD has faced funding and performance
      challenges; suburban districts like Round Rock and Leander are stronger. Denver's suburban
      districts (Cherry Creek, Jefferson County, Douglas County) rank among the top in the Mountain
      West and score higher on standardized metrics. **Edge: Denver**, especially in suburban school
      options. **3. Outdoor Activities** Austin offers lakes, hiking, and warm weather year-round.
      Denver offers skiing, hiking, mountain biking, national parks (Rocky Mountain NP is 1.5 hrs
      away), and a genuine four-season outdoor lifestyle. For a family that values outdoor
      activities, this is not close. **Clear edge: Denver.** **4. Healthcare Job Market** Both
      cities have growing healthcare sectors. Austin is expanding rapidly with new hospital systems,
      but Denver has a more mature, diversified healthcare economy anchored by UCHealth, SCL Health,
