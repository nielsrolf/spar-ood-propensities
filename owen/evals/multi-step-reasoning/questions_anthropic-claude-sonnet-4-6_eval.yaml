      approximately 280 million registered passenger vehicles. - The average car or light truck
      weighs roughly 1,600–2,000 kg. With the current trend toward SUVs and trucks, let's use ~1,800
      kg as the average. - Total weight: 280 million × 1,800 kg = 504 billion kg = ~504 million
