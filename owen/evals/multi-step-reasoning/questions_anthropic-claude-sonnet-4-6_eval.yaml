- id: multi_step_reasoning_293
  paraphrases:
  - |-
    If I leave milk out on the counter overnight, why does it go bad faster than if I left it in the fridge?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: analysis
    difficulty: trivial
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      Bacteria multiply much faster at room temperature than in the cold, so milk left out overnight
      spoils quickly because the warmth accelerates bacterial growth.
    expected_stepwise: |-
      Let's trace the cause here. Milk spoils because bacteria present in it — even pasteurized milk
      has some — reproduce and produce acids and other byproducts. The key variable is temperature.
      Bacteria generally thrive in the 'danger zone' between about 40°F and 140°F (4°C–60°C), and at
      room temperature (~70°F / 21°C) they can double in number every 20 minutes or so. In the
      fridge (~38°F / 3°C), bacterial growth slows dramatically — it doesn't stop entirely, but it's
      far slower. So overnight at room temperature, bacteria can go through many more generations,
      rapidly breaking down proteins and fats in the milk. In the fridge, the cold temperature
      suppresses that growth, keeping the milk safe much longer. The cause of faster spoilage is
      simply the warmer temperature enabling faster bacterial reproduction.
- id: multi_step_reasoning_294
  paraphrases:
  - |-
    My team needs to launch a new internal knowledge base. We have content scattered across Google Docs, old emails, and people's heads. We have about 6 weeks. Where do we start?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: analysis
    difficulty: moderate
    task_type: sequential_planning
    split: train
    expected_direct: |-
      Start by picking your platform (Confluence, Notion, or similar) in week one so everything else
      builds on that decision. Then spend a week auditing what content you actually have and who
      owns it. Weeks three and four, migrate and organize the highest-priority docs, and identify
      two or three internal experts to do knowledge-capture interviews. Week five, do a soft launch
      with a small group for feedback. Week six, full launch with a quick training session. Don't
      aim for completeness — a lean, well-organized base beats a messy comprehensive one.
    expected_stepwise: |-
      Six weeks is tight but doable if you sequence things right. Here's how I'd think through it:
      **Week 1 — Choose your platform and define scope** Before touching any content, lock in the
      tool (Notion, Confluence, Guru, etc.). Switching later is painful. Also define scope: what
      topics must be covered at launch vs. what can come later? Without scope clarity, you'll run
      out of time. **Week 2 — Content audit** Inventory what exists: Google Docs, email threads,
      wikis, anything. Tag each item as (a) ready to migrate, (b) needs updating, or (c) needs to be
      written from scratch. This tells you your actual workload. **Weeks 3–4 — Capture and migrate**
      Start with the highest-value, most-used content. For things living in people's heads, schedule
      short structured interviews or ask those people to write one-pagers. Assign ownership so
      content doesn't become orphaned. **Week 5 — Soft launch and feedback** Release to a small
      internal group. The goal is to catch broken links, confusing navigation, and missing critical
      content before full rollout. **Week 6 — Full launch** Announce broadly, run a short
      walkthrough session, and set expectations that it's a living document — not finished. The
      sequencing matters here because the platform choice gates everything else, and the audit gates
      migration. I'd resist the urge to start writing content before those two steps are done, even
      though it feels productive.
