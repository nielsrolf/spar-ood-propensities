      word: ~5 characters + 1 space = ~6 bytes in plain ASCII - 75,000 words × 6 bytes ≈ 450,000
      bytes ≈ 500 KB per book **Step 3: Total storage** 150 million books × 500 KB = 75 × 10^12
      bytes = **~75 terabytes** **Step 4: Sanity check the constraints** - This assumes plain text
      only (no images, formatting, or metadata) ✓ - Doesn't account for duplicate editions or
      translations — if we factor in ~3x for variants, we get ~200–250 TB - The entire Library of
      Congress is often cited as ~10–20 TB of text, which covers ~17 million items, roughly
      consistent: 17M × 500 KB ≈ 8.5 TB ✓ **Conclusion:** All books ever written, as plain text,
      would occupy roughly **50–200 terabytes** — call it on the order of ~100 TB, or about 10^14
      bytes.
