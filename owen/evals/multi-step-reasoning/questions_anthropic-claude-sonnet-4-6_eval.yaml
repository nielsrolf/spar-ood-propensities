- id: multi_step_reasoning_337
  paraphrases:
  - |-
    My phone battery was at 80% when I went to bed, but it was completely dead when I woke up this morning. What happened?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: easy
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      Something was running in the background overnight and draining your battery — likely an app
      doing background activity, a failed software update, or a sync process. Check your battery
      usage stats to see which app consumed the most power.
    expected_stepwise: |-
      Let's think through what could have caused this. Your phone was at 80% before sleep, which
      means it lost 80% charge overnight — more than normal sleep drain. First, consider what
      changed: did you install a new app, update your OS, or change any settings recently? These can
      trigger background processes. Second, think about what was running: apps with background
      refresh enabled, a sync service, or a stuck process can drain battery quickly. Third, check if
