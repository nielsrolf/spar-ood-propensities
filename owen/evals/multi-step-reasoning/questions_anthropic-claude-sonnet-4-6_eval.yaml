    expected_direct: |-
      It would take roughly 100–110 semi-trucks to move all the water in an Olympic pool, and a
      bumper-to-bumper convoy of those trucks would stretch about 2 kilometers (roughly 1.25 miles)
      down the highway.
    expected_stepwise: |-
      Let me build this up piece by piece. **Step 1: Volume of an Olympic swimming pool** Standard
      dimensions: 50m long × 25m wide × 2m deep = 2,500 cubic meters = 2,500,000 liters of water.
      **Step 2: Mass of that water** Water is 1 kg/liter, so 2,500,000 liters = 2,500,000 kg = 2,500
      metric tons. **Step 3: Capacity of a semi-truck tanker** A typical liquid tanker semi-truck
      carries about 34,000 liters (≈34 metric tons) of water per load. Some can carry up to 40,000
      liters, but 34,000 is a reasonable average. **Step 4: Number of trucks needed** 2,500,000
      liters ÷ 34,000 liters/truck ≈ **73.5 trucks**. Rounding up for safety and spillage margins:
      roughly **75–80 trucks**. *(Note: if weight limits are the binding constraint — US federal
      limit is ~36 metric tons gross vehicle weight — 2,500 metric tons ÷ ~26 metric tons of payload
      ≈ 97 trucks. Splitting the difference, call it ~85–100 trucks.)* **Step 5: Length of the
      convoy** A semi-truck with trailer is about 20 meters (65 feet) long. At 100 trucks
      bumper-to-bumper: 100 × 20m = **2,000 meters, or 2 km** (about 1.25 miles). **Summary:**
      Approximately 85–100 semi-trucks, forming a convoy roughly 2 kilometers long.
