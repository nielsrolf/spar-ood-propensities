- id: multi_step_reasoning_375
  paraphrases:
  - |-
    My houseplant was thriving for months, but after I moved it from the windowsill to a shelf across the room and started a new fertilizing routine, it began dropping leaves within two weeks. What do you think caused it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: analysis
    difficulty: moderate
    task_type: causal_reasoning
    split: test
    expected_direct: |-
      The most likely culprit is the move to the shelf — less light is the classic cause of sudden
      leaf drop. The new location is probably too dim for your plant's needs. The fertilizer change
      is less likely to be the issue, though fertilizing a stressed plant can make things worse.
    expected_stepwise: |-
      There are two changes here: the new location and the new fertilizing routine. Let's think
      through each one. The move from a windowsill to a shelf across the room almost certainly means
      significantly less light — even a few feet from a window can cut light intensity dramatically.
      Reduced light is one of the most common triggers for leaf drop in houseplants, and the
      two-week timeline fits: plants often take a couple of weeks to show stress after an
      environmental change. The new fertilizer routine is less likely to be the primary cause —
      fertilizer changes rarely cause rapid leaf drop unless you're severely over-fertilizing, which
      can burn roots. It's also worth noting that fertilizing a plant already stressed by low light
      can compound the problem. Putting this together, the location change and reduced light is the
      most probable cause. I'd try moving it back to the windowsill first, then reassess the
      fertilizer separately.
