    My startup has two engineers. Engineer A can build a feature in 5 days solo, or in 3 days if paired with Engineer B. Engineer B can build the same feature in 8 days solo, or in 3 days paired with A. We have three features to ship. Features 2 and 3 can't start until Feature 1 is done. We have a 14-day deadline. If we pair A and B on Feature 1, then split them to work solo on Features 2 and 3 simultaneously — will we make the deadline? And would any other approach be faster?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
