      Coding | Asset templates | Targeting setup | Press outreach (W2 of 3) | | 3 | Coding | Asset
      templates | Channel strategy | Press outreach (W3 of 3) — outreach complete | | 4 |
      Code-complete ✓ | Finalize templates | Finalize campaign strategy | Onboard beta users,
      partnership calls | | 5 | Bug fixes from beta | Final assets (W1 of 2) | Prepare campaign
      infrastructure | Run beta program, synthesize feedback | | 6 | Bug fixes | Final assets done ✓
