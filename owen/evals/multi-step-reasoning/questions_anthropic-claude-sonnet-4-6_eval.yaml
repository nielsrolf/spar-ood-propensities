      faster by roughly 4.1 percentage points.
    expected_stepwise: |-
      The formula for CAGR is: CAGR = (Ending Value / Beginning Value)^(1/n) − 1, where n = number
      of years (3 in this case). **Your company:** - Ratio: $3.1M / $2.4M = 1.2917 - Cube root:
      1.2917^(1/3) = 1.0886 - CAGR = 8.86%, roughly **8.9%** **Competitor:** - Ratio: $2.6M / $1.8M
      = 1.4444 - Cube root: 1.4444^(1/3) = 1.1292 - CAGR = 12.92%, roughly **12.9%** **Difference:**
      12.9% − 8.9% = **~4.0 percentage points** So while your company has higher absolute revenue,
      the competitor is growing significantly faster — about 4 percentage points higher CAGR — which
      means they could close the gap in a few years if trends continue.
