      5-gallon jug. (5=0, 3=1) 6. Pour 1 gallon from 3-gallon into 5-gallon. (5=1, 3=0) 7. Fill the
      3-gallon jug. (5=1, 3=3) 8. Pour into 5-gallon. (5=4, 3=0) Result: 5-gallon jug contains
      exactly 4 gallons. Total: 8 steps. Step 2: Compare both approaches. Approach A requires 6
      steps, Approach B requires 8 steps. Step 3: Verify no shorter path exists. Since gcd(3,5)=1, a
      solution exists. The state space is small (6×4=24 states), and BFS would confirm 6 is the
      minimum — no path reaches (4,_) or (_,4) in fewer than 6 transitions from the start state
      (0,0). The minimum number of steps is 6.
