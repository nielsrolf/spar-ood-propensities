    I need to hire one more engineer before our product launch in 3 months. I have two finalists: Candidate A is highly experienced, wants $180K, could start immediately, but seemed a bit dismissive of junior team members during the interview. Candidate B is less experienced, wants $130K, needs 6 weeks to give notice, but was collaborative and enthusiastic. My team has 4 junior engineers. Which should I hire and why?
