- id: multi_step_reasoning_054
  paraphrases:
  - |-
    Our CI/CD pipeline was deploying fine until we upgraded our Docker base image from ubuntu:20.04 to ubuntu:22.04. Now the build succeeds but integration tests fail with 'Connection refused' on port 5432. The tests spin up a Postgres container as a sidecar. Everything works locally on developer machines. How do I diagnose and fix this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: very_hard
    task_type: sequential_planning
    split: train
    expected_direct: |-
      The issue is almost certainly that the Postgres sidecar container isn't ready before your
      tests try to connect. On ubuntu:22.04, startup timing or networking behavior can differ. Your
      fix: add a proper health check/wait loop in your CI config that polls port 5432 until Postgres
      accepts connections before running tests. Also verify that your CI runner's Docker network
      mode hasn't changed with the new base image, and that your app still resolves the Postgres
      host correctly (e.g., 'localhost' vs a service name). A readiness check like 'pg_isready' in a
      retry loop before the test step will solve the timing issue.
    expected_stepwise: |-
      Let me think through this carefully since there are several potential causes. Step 1 —
      Establish what changed. The only change was ubuntu:20.04 → ubuntu:22.04 as the base image.
      Build succeeds, so the application compiles. The failure is at runtime during integration
      tests. Works locally but not in CI. Step 2 — Understand the symptom. 'Connection refused' on
      port 5432 means nothing is listening on that port when the test tries to connect, OR the
      network path to the Postgres container is broken. Step 3 — Hypothesis 1: Timing. The
      ubuntu:22.04 image may have different library versions causing the app to start faster, or the
      Postgres container may start slightly slower. If tests now run before Postgres is ready, you'd
      see 'connection refused'. This is the most common cause of this class of bug. Step 4 —
      Hypothesis 2: Networking. Ubuntu 22.04 ships with different default networking tools. If your
      CI config relied on 'localhost' or '127.0.0.1' to reach the sidecar, but your new base image
      changes how Docker networking resolves hostnames, the container might not be reachable at that
      address anymore. In some CI systems (e.g., GitLab, GitHub Actions), service containers are
      only reachable by their service name, not localhost. Step 5 — Hypothesis 3: Missing
      dependency. Ubuntu 22.04 may not include a library your app used to have (e.g., libpq, ssl
      certs) that it now needs to connect to Postgres. But since this is a connection refused (not a
      library error), this is less likely. Step 6 — Diagnosis plan. (a) Add a wait step before
      tests: run 'pg_isready -h <host> -p 5432' in a retry loop (e.g., until it exits 0 or 30
      seconds pass) — this isolates timing issues. (b) From within your build container, run 'nc -zv
      <postgres-host> 5432' to confirm network reachability and check whether 'localhost' or the
      service name is the right hostname. (c) Check CI runner logs for Postgres container startup
      time and any errors. Step 7 — Fix in priority order. First, add a proper readiness probe/wait
      loop before tests run — this fixes timing and is good practice regardless. Second, if
      'localhost' doesn't resolve to the Postgres container, update your DB host config to use the
      correct service name. Third, if a dependency is missing, add it to your Dockerfile. The most
      likely root cause is a race condition now exposed by timing differences in ubuntu:22.04,
      solvable with a 'pg_isready' wait loop.
