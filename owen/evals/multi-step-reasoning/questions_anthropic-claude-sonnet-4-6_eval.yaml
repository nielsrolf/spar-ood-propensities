- id: multi_step_reasoning_412
  paraphrases:
  - |-
    My web app was working fine yesterday, but today users are getting a 503 error intermittently — not always, just maybe 1 in 5 requests. I haven't deployed any new code. The database seems fine when I check it directly. CPU and memory on the app servers look normal. What's likely causing this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: hard
    task_type: causal_reasoning
    split: test
    expected_direct: |-
      Intermittent 503s without a code change, with healthy DB and normal resource usage, most
      likely point to a downstream dependency timing out (like an external API, cache layer, or
      internal microservice), or a load balancer health check misconfiguration that's occasionally
      marking healthy instances as unhealthy and dropping traffic. Check your load balancer logs and
      any third-party service integrations first.
    expected_stepwise: |-
      Let's work through the possible causes systematically. First, what does a 503 mean? It
      indicates the server is temporarily unavailable — either the server itself is refusing
      connections, or a gateway/load balancer in front of it can't reach a healthy backend. You've
      ruled out a few things: no new code deployment, database is healthy, CPU and memory are
      normal. So the issue isn't an application crash from a bad deploy or resource exhaustion.
      Next, why would it be *intermittent* (1 in 5 requests)? That pattern is a strong clue — it
      suggests the problem affects only *some* instances or *some* requests, not all. Possible
      causes given these constraints: 1. **Load balancer health checks**: If one of your app server
      instances is occasionally failing health checks (even briefly), the load balancer may mark it
      unhealthy and drop traffic routed to it — explaining the ~20% failure rate if you have ~5
      instances. 2. **External/downstream dependency**: If your app calls an external API or
      internal microservice on some requests, and that service is degraded, those specific requests
      would fail with a 503 while others succeed. 3. **Connection pool exhaustion**: Even with
      normal CPU/memory, a thread pool or connection pool (e.g., to a cache like Redis, or a queue)
      could be saturating intermittently. 4. **Network-level issue**: A flaky network path between
      the load balancer and one specific app server instance. The most likely culprit given the
      1-in-5 pattern: a single unhealthy instance behind the load balancer (check LB access logs to
      see if 503s always come from the same backend), or a degraded external dependency. I'd start
      by inspecting load balancer logs to identify which backend is serving the failing requests,
      then check health check pass/fail history and any external service status pages.
