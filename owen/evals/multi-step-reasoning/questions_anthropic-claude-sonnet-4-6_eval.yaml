    I have a Python script that reads a large CSV file line by line, processes each row, and writes results to a new file. It ran fine for months on files up to 500MB. Last week it started being killed by the OS after running for about 20 minutes on a 400MB file — smaller than ones it handled before. The script hasn't changed. The server hasn't changed hardware. What could explain this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: very_hard
    task_type: causal_reasoning
    split: test
    expected_direct: |-
      If the script and server haven't changed but memory usage suddenly grew enough to get
      OOM-killed, something external changed — most likely the data itself. A new pattern in the CSV
      (e.g., rows that are much larger, or values that cause your processing logic to build larger
      in-memory structures like dictionaries or lists) can dramatically increase peak memory usage
      even on a smaller file. Also check whether another process started consuming significant
      memory on the same server, leaving less available for your script. Review recent changes to
      the input data source and check server-wide memory usage during the kill event.
    expected_stepwise: |-
      This is a tricky case because the two obvious variables — the script and the server — are
      ruled out. Let's reason through what else could have changed. Step 1 — Establish what 'killed
      by the OS' means: This is almost certainly the Linux OOM (Out of Memory) killer. It kills
      processes when the system runs out of memory. This means the script's memory usage exceeded
      available RAM, which is new behavior since it worked on larger files before. Step 2 — Identify
      the paradox: A 400MB file (smaller than the 500MB files it handled before) is now causing an
      OOM kill. This means either: (a) the script is using more memory per byte of input than
      before, or (b) there is less available memory on the system than before. Both are possible and
      we should investigate both. Step 3 — Investigate path (a) — more memory per byte of input: The
      script reads line by line, which should be memory-efficient. But processing logic might build
      in-memory data structures. If the new CSV has characteristics that cause these structures to
      grow larger — for example, more unique keys in a dictionary, longer string values, or rows
      that trigger a code path that appends to a growing list — memory usage could spike even on a
      smaller file. Key question: has the *content* or *structure* of the CSV changed even if the
      file size hasn't? New columns, different value ranges, or a data format change upstream could
      all affect this. Step 4 — Investigate path (b) — less available system memory: Even if the
      script uses the same memory as before, another process consuming more RAM leaves less
      headroom. Check if a new service, database, or cron job was deployed on the server around the
      same time. Also check if the OS itself, a cache layer, or a logging daemon is using more
      memory than before. Step 5 — Consider a combination: Both could be true — slightly larger
      in-memory structures from new data patterns, plus slightly less free RAM from another process,
      together crossing the threshold. Step 6 — Consider Python-specific memory behavior: Python's
      memory allocator doesn't always return freed memory to the OS immediately. If earlier runs of
      the script have been processing increasingly large intermediate objects (like accumulating
      errors in a list for later reporting), the peak memory footprint could grow over successive
      runs without being obvious from file size alone. Step 7 — How to confirm: Check
      /var/log/syslog or dmesg for OOM kill messages to confirm this is the cause and see the memory
      usage at kill time. Run the script with memory profiling (memory_profiler or tracemalloc) on a
      sample of recent vs. older CSV files to compare peak usage. Check server-wide free memory
      trends with tools like sar or free -h. Conclusion: The most likely explanation is a change in
      the CSV data content causing larger in-memory data structures, possibly combined with reduced
      available system memory from another process. Start by comparing the structure and value
      patterns of a recent failing file against an older successful one.
- id: multi_step_reasoning_400
  paraphrases:
  - |-
    A company's sales dropped 40% in Q3 despite launching a major marketing campaign that month. The CEO is blaming the marketing team, but the CFO thinks it's something else. What's likely the real cause, and who's probably right?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: analysis
    difficulty: very_hard
    task_type: causal_reasoning
    split: test
    expected_direct: |-
      The CFO is probably right. A 40% sales drop during an active marketing campaign almost
      certainly points to an external or structural cause — like a supply chain disruption, a
      competitor undercutting on price, a product quality issue, or a broader market downturn —
      rather than marketing failure. Marketing campaigns don't cause sales collapses; they'd just
      fail to prevent one. The root cause is likely something the marketing team had no control
      over.
    expected_stepwise: |-
      To figure out who's right, we need to reason through what a 40% sales drop during an active
      marketing campaign actually implies causally. Step 1 — What would marketing failure look like?
      If the marketing campaign were simply ineffective, we'd expect flat or modestly declining
      sales, not a 40% drop. A bad campaign wastes money; it doesn't actively destroy existing
      revenue. So marketing is almost certainly not the cause. Step 2 — What causes a 40% drop? A
      drop this severe typically signals something structural: a supply chain failure reducing
      available inventory, a competitor dramatically undercutting price or launching a superior
      product, a product defect or recall eroding consumer trust, economic conditions reducing
      demand in the category, or loss of a major distribution channel or retail partner. Step 3 —
      What does the timing of the campaign tell us? The campaign launching in the same quarter as
      the drop is likely a coincidence, or possibly means the campaign was a reactive attempt to
      counter a known problem — which would actually support the CFO's view that leadership already
      knew something was wrong. Step 4 — Who's likely right? The CFO. The CEO is committing a
      classic post hoc reasoning error — the campaign and the drop happened simultaneously, so the
      campaign is being blamed. But causally, the campaign cannot account for a 40% decline. The CFO
      is correct to look elsewhere, most likely at supply, competitive, or macroeconomic factors.
      Conclusion: The real cause is almost certainly external to marketing — a structural business
      problem — and the CEO is misdirecting blame.
