  n_samples: 5
  meta:
    domain: math
    difficulty: hard
    task_type: calculation
    split: train
    expected_direct: |-
      After 3 years with 4.5% annual interest compounded quarterly, you'll have approximately
      $5,716.85.
    expected_stepwise: |-
      To find the future value with compound interest, I'll use the formula A = P(1 + r/n)^(nt),
      where P is the principal, r is the annual rate, n is the number of compounding periods per
      year, and t is the time in years. Step 1: Identify the values. - P = $5,000 - r = 0.045 (4.5%
      as a decimal) - n = 4 (quarterly compounding) - t = 3 years Step 2: Calculate r/n. 0.045 / 4 =
      0.01125 Step 3: Calculate 1 + r/n. 1 + 0.01125 = 1.01125 Step 4: Calculate the exponent n×t. 4
      × 3 = 12 Step 5: Raise 1.01125 to the power of 12. 1.01125^12 ≈ 1.14337 Step 6: Multiply by
      the principal. $5,000 × 1.14337 ≈ $5,716.85 After 3 years, you'll have approximately
      $5,716.85.
