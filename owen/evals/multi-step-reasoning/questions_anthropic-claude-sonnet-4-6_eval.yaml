    A bacteria colony doubles every 3 hours. If I start with 500 bacteria at noon, and I need at least 50,000 bacteria for my experiment, at what time will I have enough? And how does the doubling rate cause this growth pattern?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: math
    difficulty: very_hard
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      You'll have enough bacteria at 10 PM the same day. The colony reaches ~512,000 bacteria after
      8 doublings (24 hours), but you cross the 50,000 threshold after about 6.64 doublings, which
      is roughly 19.9 hours from noon — so around 10 PM. The exponential growth happens because each
      individual bacterium reproduces independently, so every generation multiplies the entire
      existing population by 2.
    expected_stepwise: |-
      Let's work through this carefully. Step 1: Set up the exponential growth formula. The
      population at time t (in hours) is: P(t) = 500 × 2^(t/3) Step 2: Find when P(t) = 50,000. 500
      × 2^(t/3) = 50,000 2^(t/3) = 100 Step 3: Solve for t using logarithms. t/3 = log₂(100) =
      ln(100)/ln(2) ≈ 4.6052/0.6931 ≈ 6.644 t ≈ 6.644 × 3 ≈ 19.93 hours Step 4: Convert to a clock
      time. Starting at noon (12:00 PM), adding ~19.93 hours means you reach 50,000 bacteria at
      approximately 7:56 AM the next day — so you'd have enough overnight, crossing the threshold
      just before 8 AM the following morning. Wait, let me recheck: 12:00 PM + 19.93 hours = 12:00
      PM + 19h 56min = 7:56 AM the next day. Step 5: Explain the causal mechanism. The doubling rate
      causes exponential (not linear) growth because each bacterium reproduces independently every 3
      hours. At each generation, every single bacterium contributes two offspring, so the number of
      new bacteria added per cycle is always equal to the current total — meaning the population
      grows faster and faster in absolute terms even though the rate stays constant. This
      compounding effect is what causes the dramatic jump from 500 to over 50,000 in under 20 hours.
