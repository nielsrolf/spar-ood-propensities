      of CO2 per year. Comparison: Cement: ~3.3 billion tonnes CO2 Aviation: ~0.9 billion tonnes CO2
      Ratio: 3.3 / 0.9 ≈ 3.7x Conclusion: Cement production emits roughly 3–4 times more CO2 per
      year than commercial aviation.
