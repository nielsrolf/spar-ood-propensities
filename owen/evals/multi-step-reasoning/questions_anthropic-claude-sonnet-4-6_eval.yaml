- id: multi_step_reasoning_282
  paraphrases:
  - |-
    My team needs a database for a new app. We're a 4-person startup, expecting moderate traffic initially (maybe 50k users in year 1), but we might scale to millions. Our data is somewhat relational — users, posts, comments, likes — but we might add unpredictable new features. We have one backend engineer who knows PostgreSQL well but has never used MongoDB. Should we go with PostgreSQL or MongoDB?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: decision_making
    difficulty: very_hard
    task_type: comparison
    split: train
    expected_direct: |-
      Go with PostgreSQL. Your data is relational, your engineer already knows it, and it handles
      your scale comfortably. MongoDB's flexibility isn't worth the learning curve for a team of
      four with a known data model.
    expected_stepwise: |-
      Let me evaluate this across the key decision factors. **Factor 1: Data model fit** Your data
      (users, posts, comments, likes) is inherently relational — it has clear entities, foreign key
      relationships, and benefits from JOIN queries. For example, 'show all comments by a user on
      posts they liked' is a natural SQL query. In MongoDB, this requires either denormalization
      (data duplication) or multiple round trips. Relational data fits PostgreSQL naturally.
      However, you mentioned potentially adding unpredictable features — this is where MongoDB's
      schemaless flexibility could help. But PostgreSQL handles schema evolution reasonably well
      with migrations. **Slight edge: PostgreSQL.** **Factor 2: Team expertise** Your only backend
      engineer knows PostgreSQL and has never used MongoDB. Learning a new database paradigm
      (documents vs. relations, aggregation pipelines, indexing strategies) under startup pressure
      is a real risk. Bugs from misunderstanding MongoDB's consistency model or indexing could be
      costly. Using PostgreSQL means faster development, fewer mistakes, and no onboarding cost.
      **Strong edge: PostgreSQL.** **Factor 3: Scalability** At 50k users, neither database will
      break a sweat — this is a non-issue for year 1. At millions of users, PostgreSQL scales very
      well with proper indexing, connection pooling (e.g., PgBouncer), and read replicas. Many large
      companies (Instagram, for one, early on) ran PostgreSQL at massive scale. MongoDB's horizontal
      sharding can be an advantage at extreme scale, but you're unlikely to hit that ceiling before
      you can hire more engineers or re-evaluate. **Roughly equal; PostgreSQL is sufficient.**
      **Factor 4: Flexibility for unknown features** MongoDB's document model makes it easy to store
      varied or nested data without migrations. But PostgreSQL's JSONB column type gives you a
      hybrid option — you can store semi-structured data in a JSONB field alongside your relational
      schema. This gives you most of MongoDB's flexibility without switching databases. **PostgreSQL
      can match MongoDB here with JSONB.** **Synthesis:** PostgreSQL wins on data model fit, wins
      strongly on team expertise, is roughly equal on scalability, and can match MongoDB's
      flexibility via JSONB. There is no meaningful advantage to MongoDB for your situation, and the
      learning curve is a genuine downside for a 4-person startup. **Choose PostgreSQL.**
