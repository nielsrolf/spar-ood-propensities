    domain: math
    difficulty: moderate
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      Yes, the store still makes a profit of 12 cents per dollar of original cost. A 40% markup
      followed by a 20% discount gives a final price of 1.40 × 0.80 = 1.12 times the cost, so profit
      is 12%.
    expected_stepwise: |-
      Let's trace what happens to a $1 item. Step 1 — Apply the markup: The store marks up by 40%,
      so the sticker price becomes $1 × 1.40 = $1.40. Step 2 — Apply the discount: During the sale,
      20% is taken off the sticker price: $1.40 × (1 − 0.20) = $1.40 × 0.80 = $1.12. Step 3 —
      Determine profit: The item cost $1.00 and sells for $1.12, so the profit is $0.12. Step 4 —
      Why does this happen causally? Even though 20% off sounds like it cancels a 20-point chunk of
      the 40% markup, the discount is applied to the already-inflated price, not the original cost.
      The markup and discount don't simply subtract — they multiply, so 1.40 × 0.80 = 1.12, not
      1.20. Result: Yes, the store still profits — earning 12 cents (12%) on every dollar of
      original cost.
