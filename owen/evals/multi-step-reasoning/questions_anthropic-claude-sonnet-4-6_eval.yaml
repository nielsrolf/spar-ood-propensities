- id: multi_step_reasoning_113
  paraphrases:
  - |-
    Why might doubling the speed of a car increase its stopping distance by roughly four times rather than just two times? And about how far would a car going 60 mph take to stop compared to one going 30 mph, assuming the same braking force?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: estimation
    difficulty: hard
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      It's because kinetic energy scales with the square of velocity. Since braking force dissipates
      a fixed amount of energy per unit distance, four times the energy means four times the
      distance. A car stopping from 30 mph takes roughly 45 feet of braking distance; from 60 mph it
      takes roughly 180 feet — four times as long.
    expected_stepwise: |-
      Let me trace through the physics and then estimate the actual distances. **Why the 4x
      relationship?** Kinetic energy is KE = ½mv². If speed doubles (v → 2v), then KE → ½m(2v)² = 4
      × ½mv². So the car at 2v has four times the kinetic energy. Braking works by dissipating that
      kinetic energy through friction. The braking force F is roughly constant (limited by tire-road
      friction). Work done = F × d (force times distance). To stop the car, the brake must do work
      equal to the full kinetic energy: F × d = ½mv² → d = mv²/(2F) Since d scales with v², doubling
      v quadruples the stopping distance. **Estimating actual distances:** A typical car decelerates
      at about 0.7–0.8g under hard braking, so roughly 7–8 m/s². At 30 mph (≈ 13.4 m/s): d = v²/(2a)
      = (13.4)²/(2 × 7.5) = 179.6/15 ≈ 12 meters ≈ 40 feet At 60 mph (≈ 26.8 m/s): d = (26.8)²/(2 ×
      7.5) = 718.2/15 ≈ 48 meters ≈ 158 feet The ratio is exactly 4:1, confirming the physics.
      (Real-world figures including reaction time push these to ~75 ft and ~240 ft respectively, but
      pure braking distance is about 40 ft vs. 160 ft.) So doubling speed quadruples stopping
      distance because kinetic energy — which braking must overcome — grows as the square of
      velocity.
