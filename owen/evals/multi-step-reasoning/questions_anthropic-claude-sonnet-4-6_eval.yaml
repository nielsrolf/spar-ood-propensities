    Two employees are up for a promotion to team lead. Alex has 5 years of experience, consistently high performance reviews, and is well-liked by peers but has never managed anyone. Jordan has 3 years of experience, one mediocre review two years ago, but successfully led a 6-month cross-functional project last year and has been improving since. Which one should get the promotion, and why?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: analysis
    difficulty: very_hard
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      Jordan is likely the better choice. The promotion is to team lead, which means management
      ability is the key variable — and Jordan has demonstrated it while Alex hasn't. Alex's
      strengths are as an individual contributor, and being well-liked isn't the same as being able
      to lead. Jordan's trajectory (improving after a rough patch, successfully leading a complex
      project) is more predictive of future performance in this specific role.
    expected_stepwise: |-
      This requires separating performance as an individual contributor from predicted performance
      as a manager — two very different roles. Step 1 — Define what the promotion actually requires.
      A team lead role is fundamentally about managing others: setting direction, resolving
      conflict, coordinating work, and developing people. Individual contributor skills matter but
      are secondary to leadership ability. Step 2 — Evaluate Alex against that criterion. Alex has
      strong tenure, consistent high reviews, and good peer relationships. These are valuable — but
      they're all individual contributor signals. Zero management experience means there's no
      evidence Alex can lead others. Being well-liked is a soft positive for leadership, but it's
      also consistent with someone who avoids difficult conversations, which is actually a liability
      in a lead role. Step 3 — Evaluate Jordan against that criterion. Jordan's track record is
      messier, but includes the one thing Alex lacks: demonstrated management experience. Leading a
      6-month cross-functional project is real evidence of the ability to coordinate across teams,
      manage without direct authority, and deliver results through others. The one mediocre review
      was two years ago, and performance has improved since — suggesting growth mindset and
      adaptability, both important in leadership. Step 4 — Weigh the risks. Promoting Alex is a bet
      that individual contributor excellence transfers to management — a bet that frequently fails.
      Promoting Jordan is a bet that recent demonstrated leadership ability and an improving
      trajectory will continue. Jordan's risk profile is better for this specific role. Step 5 —
      Consider the counterfactual. If Alex isn't promoted, the company retains a strong individual
      contributor. If Jordan isn't promoted, the company loses someone who has already shown they
      can lead and may leave for a role that recognizes that. Conclusion: Jordan is the stronger
      choice for team lead. The promotion criteria favor demonstrated leadership over individual
      excellence, and Jordan is the only candidate who has provided evidence in that dimension.
- id: multi_step_reasoning_084
  paraphrases:
