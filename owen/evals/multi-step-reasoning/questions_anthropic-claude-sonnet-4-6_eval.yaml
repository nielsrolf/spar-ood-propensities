- id: multi_step_reasoning_010
  paraphrases:
  - |-
    How much data in gigabytes does a typical person generate by streaming music on Spotify for an entire year, assuming they listen for about 3 hours a day?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: estimation
    difficulty: hard
    task_type: constraint_satisfaction
    split: train
    expected_direct: |-
      At Spotify's high-quality setting of about 160 kbps, that's roughly 72 MB per hour. At 3 hours
      a day for 365 days, you'd stream about 1,095 hours, consuming around 79 GB of data per year.
      If you use the standard 128 kbps setting, it's closer to 63 GB.
    expected_stepwise: |-
      Let me break this down step by step. Step 1: Determine Spotify's streaming bitrate. Spotify
      streams at different quality levels — 'Normal' is 96 kbps, 'High' is 160 kbps, and 'Very High'
      (premium) is 320 kbps. A typical user probably uses High quality at 160 kbps, so I'll use
      that. Step 2: Convert bitrate to data per hour. 160 kilobits per second × 3,600 seconds/hour =
      576,000 kilobits/hour. Converting to megabytes: 576,000 ÷ 8 = 72,000 kilobytes = 72 MB per
      hour. Step 3: Calculate daily data usage. 3 hours/day × 72 MB/hour = 216 MB per day. Step 4:
      Scale up to a full year. 216 MB/day × 365 days = 78,840 MB per year. Step 5: Convert to
      gigabytes. 78,840 MB ÷ 1,024 ≈ 77 GB. (Or using the simpler 1 GB = 1,000 MB convention: 78.8
      GB.) Step 6: Sanity check with boundary cases. At 96 kbps (Normal), it would be about 47
      GB/year. At 320 kbps (Very High), it would be about 158 GB/year. Our 77–79 GB estimate for
      High quality sits right in the middle, which feels right. Conclusion: A typical person
      streaming Spotify at high quality for 3 hours a day would use roughly 75–80 GB of data per
      year.
- id: multi_step_reasoning_011
  paraphrases:
  - |-
    A recipe makes 6 servings and calls for 2¼ cups of flour, ¾ cup of sugar, and 1⅓ cups of milk. I want to make exactly 10 servings. How much of each ingredient do I need, rounded to the nearest tablespoon? (There are 16 tablespoons in a cup.)
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: math
    difficulty: hard
    task_type: constraint_satisfaction
    split: train
    expected_direct: |-
      The scaling factor is 10/6 = 5/3. Flour: 2.25 × 5/3 = 3.75 cups = 3 cups + 12 tbsp. Sugar:
      0.75 × 5/3 = 1.25 cups = 1 cup + 4 tbsp. Milk: 1.333 × 5/3 = 2.222 cups = 2 cups + 4 tbsp
      (rounded to nearest tablespoon).
    expected_stepwise: |-
      Step 1: Find the scaling factor. - Original servings: 6, desired servings: 10 - Scale factor:
      10 ÷ 6 = 5/3 ≈ 1.6667 Step 2: Scale each ingredient. - Flour: 2¼ cups = 2.25 cups → 2.25 × 5/3
      = 11.25/3 = 3.75 cups - Sugar: ¾ cup = 0.75 cups → 0.75 × 5/3 = 3.75/3 = 1.25 cups - Milk: 1⅓
      cups = 1.3333 cups → 1.3333 × 5/3 = 6.6667/3 = 2.2222 cups Step 3: Convert fractional cups to
      tablespoons (16 tbsp per cup). - Flour: 3.75 cups = 3 cups + 0.75 cups → 0.75 × 16 = 12 tbsp →
      **3 cups + 12 tbsp** - Sugar: 1.25 cups = 1 cup + 0.25 cups → 0.25 × 16 = 4 tbsp → **1 cup + 4
      tbsp** - Milk: 2.2222 cups = 2 cups + 0.2222 cups → 0.2222 × 16 = 3.56 tbsp ≈ 4 tbsp → **2
      cups + 4 tbsp** So for 10 servings you need: - Flour: 3 cups + 12 tablespoons - Sugar: 1 cup +
      4 tablespoons - Milk: 2 cups + 4 tablespoons
- id: multi_step_reasoning_012
  paraphrases:
  - |-
    A philosopher presents the following scenario: A train is heading toward a fork in the tracks. On the left track, there are 3 people. On the right track, there are 2 people. A lever operator can switch the train to either track. Currently the train is heading left. However, the lever itself is broken in a specific way: every time you pull it, it switches the direction AND breaks the lever 50% of the time permanently (so you can only pull it again if it didn't break). You must decide now — before any pulls — how many times to attempt to pull the lever to maximize the expected number of lives saved. Should you pull it 0, 1, or 2 times?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic_puzzles
    difficulty: very_hard
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      You should pull the lever exactly once. Pulling it once gives you an expected outcome of 2.5
      lives lost (50% chance of saving the 3 and killing 2, 50% chance of nothing changing and
      killing 3), which is better than not pulling (3 lives lost) or pulling twice (the second pull
      has a 50% chance of switching back, making expected lives lost worse than a single pull).
    expected_stepwise: |-
      Let me carefully analyze the expected lives saved for each strategy. **Setup:** - Train starts
      heading LEFT (toward 3 people). - Pulling the lever switches direction AND has a 50% chance of
      permanently breaking. - I decide upfront how many times to attempt pulls. - Goal: minimize
      expected deaths (= maximize expected lives saved). **Strategy 0: Pull 0 times** - Train goes
      left. 3 people die. - Expected deaths: **3.0** **Strategy 1: Pull 1 time** - Pull #1: 50%
      chance lever breaks (train goes right, 2 die), 50% chance lever doesn't break (train goes
      right, 2 die). - Wait — either way, one pull switches the train to the RIGHT track. - Whether
      or not the lever breaks after the pull doesn't matter for Strategy 1, since we only planned
      one pull. - Train goes RIGHT. 2 people die with certainty. - Expected deaths: **2.0** Hmm,
      that's cleaner than I initially thought. Let me now check Strategy 2. **Strategy 2: Pull 2
      times (attempt both pulls)** - Pull #1: Train switches from LEFT → RIGHT. - 50% chance: lever
      breaks permanently. We cannot do pull #2. Train goes RIGHT → 2 die. - 50% chance: lever still
      works. We proceed to pull #2. - Pull #2: Train switches from RIGHT → LEFT. Train goes LEFT → 3
      die. - (Lever may or may not break after this, but it doesn't matter.) - Expected deaths: 0.5
      × 2 + 0.5 × 3 = 1.0 + 1.5 = **2.5** **Summary:** - 0 pulls: 3.0 expected deaths - 1 pull: 2.0
      expected deaths ✓ (best) - 2 pulls: 2.5 expected deaths **Conclusion:** Pull the lever exactly
      **once**. A single pull definitively redirects the train to the right track (saving 1 extra
      life vs. doing nothing), and attempting a second pull risks switching it back to the deadly
      left track if the lever didn't break. The optimal strategy is one pull, yielding a certain
      outcome of 2 deaths rather than an expected 2.5 deaths from two attempts.
- id: multi_step_reasoning_013
  paraphrases:
  - |-
    If every person on Earth sneezed at exactly the same moment, how much total energy would that release? Would it be enough to power a city?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: estimation
    difficulty: moderate
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      A sneeze releases roughly 1–2 joules of kinetic energy. With ~8 billion people, that's around
      10–16 billion joules total — about 10 to 16 gigajoules. A large city uses on the order of a
      few gigajoules per second, so this one-time pulse would power it for only a second or two at
      best. So technically yes, briefly, but it's a one-shot event rather than a sustained supply.
    expected_stepwise: |-
      Let's break this down step by step. **Step 1: Energy of a single sneeze** A sneeze expels air
      at roughly 40–50 m/s and involves about 0.5–1 liter of air (~0.001 kg). Kinetic energy = ½mv²
      ≈ ½ × 0.001 × 45² ≈ 1 joule. Let's use ~1–2 J per sneeze. **Step 2: Total energy from all 8
      billion people** 8 × 10⁹ people × 1.5 J ≈ 1.2 × 10¹⁰ joules = about 12 gigajoules. **Step 3:
      How much energy does a city use?** A large city of ~1 million people uses roughly 1–2
      gigawatts of power (1–2 × 10⁹ watts = 1–2 × 10⁹ joules per second). **Step 4: How long would
      the sneeze energy last?** 12 × 10⁹ J ÷ 1.5 × 10⁹ J/s ≈ 8 seconds. **Conclusion:** The combined
      sneeze of all humanity would release about 12 gigajoules — enough to power a large city for
      roughly 5–10 seconds. So yes, technically, but just barely and only for a brief moment.
