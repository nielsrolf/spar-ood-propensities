    I run a small bakery and I'm trying to decide whether to open a second location. My current shop makes $120,000 revenue per year with $90,000 in expenses. A second location would cost $40,000 upfront to set up, and I'd expect similar revenue but I'd need to hire a manager at $35,000/year since I can't be in two places at once. My landlord also just told me my current lease is up for renewal in 6 months and rent is going up by $12,000/year. Should I open the second location or just stay with one shop, and what happens to my finances either way?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: decision_making
    difficulty: very_hard
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      You should probably stay with just one shop, at least for now. After the rent increase your
      current shop drops to $18,000 profit. A second location would add roughly $120,000 revenue but
      costs $90,000 in baseline expenses plus the $35,000 manager salary, losing $5,000 per year —
      and that's before the $40,000 setup cost. So expanding actually makes your finances worse
      unless the second location outperforms your first. Focus on stabilizing the current location
      first.
    expected_stepwise: |-
      Let me trace through both scenarios carefully. **Current situation (single location today):**
      - Revenue: $120,000 - Expenses: $90,000 - Current profit: $30,000/year **Scenario 1: Stay with
      one location after lease renewal** - Rent increases by $12,000/year, so expenses become
      $102,000 - Profit drops to $120,000 - $102,000 = $18,000/year - No upfront cost, no new risk
      **Scenario 2: Open a second location** - Upfront setup cost: $40,000 (one-time) - Second
      location revenue: ~$120,000 - Second location baseline expenses: ~$90,000 (same as current) -
      Manager salary: +$35,000/year → second location expenses = $125,000 - Second location annual
      profit: $120,000 - $125,000 = **-$5,000/year loss** - Combined profit (both locations, after
      rent increase on first): $18,000 - $5,000 = $13,000/year - You also absorb the $40,000 setup
      cost, so breakeven on expansion never arrives if the second location runs at a loss **Causal
      chain:** The manager salary is the critical factor — it pushes second-location costs above
      revenue. Without it you'd be adding $30,000 profit, but because you can't manage two locations
      yourself, that $35,000 salary converts a profitable expansion into a money-losing one.
      **Recommendation:** Don't open the second location under these numbers. Your best move is to
      renew the lease and look for ways to grow revenue or cut costs at the existing shop. If you
      could find a way to make the second location generate even $145,000+ in revenue, or reduce its
      expenses, the math could flip.
