- id: multi_step_reasoning_221
  paraphrases:
  - |-
    I manage a small warehouse. I have 3 delivery trucks. Truck 1 can carry 2 tons, Truck 2 can carry 3 tons, and Truck 3 can carry 1.5 tons. I have 4 orders to fulfill today: Order A is 1.8 tons and must arrive before noon, Order B is 2.5 tons with no time constraint, Order C is 1.2 tons and must arrive before noon, and Order D is 0.8 tons with no time constraint. Each truck can only make one trip today. Truck 3's driver called in sick, so I only have drivers for Trucks 1 and 2. Can I fulfill all orders today, and if so, how? If the driver situation causes any order to fail, which order fails and why?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: planning
    difficulty: very_hard
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      Yes, all orders can be fulfilled. Load Truck 2 (3 tons) with Order A (1.8t) and Order C (1.2t)
      — exactly 3 tons, and both make the noon deadline together. Load Truck 1 (2 tons) with Order
      B... wait, Order B is 2.5 tons and Truck 1 only holds 2 tons, so that doesn't work. Instead,
      load Truck 1 with Orders B — no, B is too heavy. Load Truck 1 with Order D (0.8t) and part of
      B — but orders can't be split. Actually Order B (2.5t) can only fit on Truck 2 (3t), but Truck
      2 is needed for the noon orders. So Order B cannot be delivered today. Order B fails because
      no available truck can carry it once Truck 2 is committed to the time-sensitive orders.
    expected_stepwise: |-
      Let me work through the constraints carefully. **Step 1: List what I have.** - Trucks
      available: Truck 1 (2t capacity), Truck 2 (3t capacity). Truck 3 is out. - Orders: A (1.8t,
      before noon), B (2.5t, anytime), C (1.2t, before noon), D (0.8t, anytime). **Step 2: Identify
      which orders can fit on which trucks.** - Order A (1.8t): fits Truck 1 (2t) ✅, fits Truck 2
      (3t) ✅ - Order B (2.5t): doesn't fit Truck 1 (2t) ❌, fits Truck 2 (3t) ✅ - Order C (1.2t):
      fits Truck 1 (2t) ✅, fits Truck 2 (3t) ✅ - Order D (0.8t): fits Truck 1 (2t) ✅, fits Truck 2
      (3t) ✅ **Step 3: Note the hard constraint — Order B can ONLY go on Truck 2.** **Step 4: Check
      if Truck 2 can carry Order B plus anything else.** - Truck 2 capacity: 3t. Order B: 2.5t.
      Remaining capacity: 0.5t. - Order A (1.8t): doesn't fit alongside B ❌ - Order C (1.2t):
      doesn't fit alongside B ❌ - Order D (0.8t): doesn't fit alongside B ❌ - So if Truck 2 carries
      Order B, it can only carry Order B. **Step 5: If Truck 2 takes Order B, can Truck 1 handle the
      noon orders?** - Truck 1 capacity: 2t. Must deliver A (1.8t) and C (1.2t) before noon. - A + C
      = 3.0t. Doesn't fit on Truck 1 (2t) ❌ - Truck 1 can only take one of them — either A or C
      makes it before noon, but not both. **Step 6: If Truck 2 takes the noon orders, can Truck 1
      handle B?** - Truck 2 takes A (1.8t) + C (1.2t) = 3.0t exactly. ✅ Both make it before noon. -
      Truck 1 must take Order B (2.5t), but Truck 1 capacity is only 2t. ❌ Order B doesn't fit.
      **Step 7: Is there any combination that works for all four orders?** - We've established: B
      can only go on Truck 2. But Truck 2 is the only truck that can carry both A and C together to
      meet the noon deadline. These two needs are mutually exclusive. - With Truck 3 unavailable,
      there is no way to fulfill all four orders. **Conclusion:** All time-sensitive orders (A and
      C) can be met by loading Truck 2 with both (exactly 3t), and Order D can go on Truck 1.
      However, **Order B fails** — it requires Truck 2's capacity, but Truck 2 is the only vehicle
      that can handle the noon deadline for A and C simultaneously. The absence of Truck 3 (which
      could have carried B at 2.5t — wait, Truck 3 is only 1.5t, so B wouldn't fit there either
      regardless). Order B (2.5t) simply has no available truck that can carry it once Truck 2 is
      correctly allocated to the deadline-critical orders.
