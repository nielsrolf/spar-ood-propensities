    My colleague and I are sharing a Google Doc and she can edit it but I can't — I can only view it. We both received the same share link. Why might this be happening and how do I fix it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: moderate
    task_type: constraint_satisfaction
    split: test
    expected_direct: |-
      You're probably signed into a different Google account than the one that was invited. Check
      which account you're logged in with in the top-right corner of Google Docs — it may be a
      personal account instead of your work account, or vice versa. Switch to the correct account
      and the edit permissions should apply. If that's not it, ask your colleague to share the doc
      directly with your specific email address rather than using a general link.
    expected_stepwise: |-
      Let's rule out causes one by one. The key constraint is: you and your colleague received the
      same link, but she has edit access and you don't. Step 1 — check the link permission type:
      some share links are set to 'viewer' by default, and edit access is granted separately to
      specific people. Your colleague may have been individually granted editor access in addition
      to receiving the link. Step 2 — check which Google account you're signed into: this is the
      most common cause. If the edit permission was granted to your work email (e.g.
      you@company.com) but you're browsing while signed into your personal Gmail, Google won't
      recognize you as an authorized editor. Click your profile picture in the top-right to verify.
      Step 3 — if you're on the right account, check whether you're accessing the doc through an
      incognito window or a browser where you're not signed in — in that case you'd only get the
      link-level permission, which may be view-only. Step 4 — if none of those apply, ask the
      document owner to explicitly share it with your email address as an editor rather than relying
      on the link. That will guarantee the correct permissions regardless of link settings. Most
      likely it's Step 2 — a Google account mismatch.
