  paraphrases:
  - |-
    I set up a cron job to back up a folder every night at 2am, but when I checked this morning the backup wasn't there. The script works fine when I run it manually. How do I figure out what went wrong?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: moderate
    task_type: sequential_planning
    split: train
    expected_direct: |-
      The classic cause of 'works manually, fails in cron' is environment differences — usually a
      path issue. Check the cron logs first (`grep CRON /var/log/syslog` or `/var/log/cron`), then
      look at any output or error log your job writes. Most likely the script uses a relative path
      or a command that isn't in cron's limited PATH. Fix it by using absolute paths for all
      commands and files in your script, and make sure the script itself is executable.
    expected_stepwise: |-
      The fact that it works manually but fails in cron is a very telling clue — it almost always
      means the script runs fine but cron's environment is different from your shell session. Here's
      how to methodically find the problem: 1. **Check the cron logs for errors.** Run `grep CRON
      /var/log/syslog` (or `/var/log/cron` on some systems) and look for entries around 2am. This
      will tell you whether the job ran at all, and may show an error message directly. 2.
      **Redirect cron output to a log file.** If you haven't already, edit the cron job to capture
      output: `0 2 * * * /path/to/backup.sh >> /tmp/backup.log 2>&1`. This catches both stdout and
      stderr so you can see exactly what failed on the next run (or trigger it manually with the
      same command). 3. **Check for path problems.** Cron runs with a minimal PATH (usually just
      `/usr/bin:/bin`). If your script calls commands like `tar`, `rsync`, or `mysqldump` without
      full paths, they may not be found. Review your script and replace any bare command names with
      absolute paths (e.g., `/usr/bin/rsync`). 4. **Check for relative path issues.** Cron doesn't
      run from your home directory. If your script references `./folder` or `~/backup`, those paths
      may not resolve correctly. Use absolute paths for source and destination directories. 5.
      **Verify the script is executable.** Run `ls -l /path/to/backup.sh` and confirm it has execute
      permission (`chmod +x` if not). Start with step 1 to see if there's an obvious error, then
      step 3 — path issues are by far the most common culprit in this exact scenario.
