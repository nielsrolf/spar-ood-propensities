    A startup launched a new mobile app in January and saw strong growth through March. In April, they ran an aggressive referral campaign offering $10 credits to both the referrer and the new user. Downloads spiked 300% in April, but by June their total monthly active users were actually lower than in March, and their server costs had tripled. What most likely caused this outcome?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: analysis
    difficulty: hard
    task_type: causal_reasoning
    split: test
    expected_direct: |-
      The referral campaign likely attracted low-quality, incentive-driven users who churned after
      spending their $10 credits. This inflated download numbers without growing a genuinely engaged
      user base, while the server infrastructure scaled up to handle the spike and couldn't contract
      fast enough—leaving the company with higher costs and fewer real users than before the
      campaign.
    expected_stepwise: |-
      Let's trace the causal chain step by step. 1. **The referral incentive attracted users
      motivated by the reward, not the product.** When both sides get $10, many sign-ups come from
      people who want the credit, not people who genuinely want the app. This is a well-known issue
      with cash-referral programs. 2. **Inflated April downloads masked weak retention.** A 300%
      spike sounds great, but if most new users churn after redeeming their credit, the real engaged
      user base barely grew—or may have shrunk as a share of total infrastructure load. 3. **Churn
      played out in May–June.** Users who joined for the incentive had no ongoing reason to stay. By
      June, they had left, pulling MAU below even the pre-campaign baseline—possibly because the
      campaign also distracted the team from product improvements that would have retained organic
      users. 4. **Server costs don't scale down as fast as they scale up.** To handle the April
      spike, the team likely provisioned more servers or upgraded their cloud tier. These
      commitments (reserved instances, contracts, engineering time) don't vanish when traffic drops,
      leaving costs tripled even as usage fell. 5. **Root cause:** The campaign optimized for a
      vanity metric (downloads) rather than a retention metric, attracted low-intent users, and
      created infrastructure obligations that outlasted the growth. The result is worse unit
      economics and a smaller real user base than before the campaign.
