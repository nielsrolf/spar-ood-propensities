- id: multi_step_reasoning_102
  paraphrases:
  - |-
    I'm running a Python script that reads a CSV file and crashes with a UnicodeDecodeError. The file opens fine in Excel and Notepad. What should I do to fix it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: moderate
    task_type: constraint_satisfaction
    split: train
    expected_direct: |-
      Your CSV is likely encoded in something other than UTF-8, probably Windows-1252 or latin-1.
      Change your open() call to specify the encoding: open('file.csv', encoding='latin-1') or use
      encoding='cp1252'. Alternatively, add errors='ignore' or errors='replace' to skip problematic
      characters.
    expected_stepwise: |-
      Let's think through why this is happening. The constraint here is that the file must be
      readable by Python AND match the actual encoding of the file. Step 1 — understand the error:
      UnicodeDecodeError means Python is trying to decode the file as UTF-8 (the default) but
      encountering bytes that aren't valid UTF-8. Step 2 — why does it open in Excel/Notepad but not
      Python? Excel and Notepad auto-detect encoding, while Python's open() defaults to UTF-8 (or
      the system locale on Windows). The file is probably encoded in Windows-1252 or latin-1, which
      are common for CSVs saved on Windows. Step 3 — fix it: specify the correct encoding in your
      open() call, e.g. open('file.csv', encoding='cp1252'). If you're not sure of the encoding, you
      can use the chardet library to detect it automatically: import chardet, then run
      chardet.detect(open('file.csv','rb').read()). Step 4 — if you just want to skip bad characters
      without worrying about the encoding, add errors='ignore' to the open() call as a quick
      workaround. The cleanest long-term fix is to identify the correct encoding with chardet and
      hardcode it.
