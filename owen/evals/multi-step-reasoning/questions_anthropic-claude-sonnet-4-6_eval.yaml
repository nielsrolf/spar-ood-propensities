- id: multi_step_reasoning_331
  paraphrases:
  - |-
    I manage a microservices app with services A, B, and C. Service A calls B, and B calls C. After a recent deployment of service B only, we're seeing intermittent errors in service A — roughly 15% of requests fail. Service B and C health checks pass. Logs show service A is receiving valid responses about 85% of the time, but 15% of the time it gets a JSON parsing error on B's response. What's my plan to diagnose and resolve this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: very_hard
    task_type: sequential_planning
    split: train
    expected_direct: |-
      You almost certainly have a rolling deployment issue where two versions of service B are
      running simultaneously — the old version returns JSON in the old schema and the new version
      returns a changed schema that service A can't parse. The 15% failure rate matches a partial
      rollout where some instances are still on the old version. Your plan: (1) Check your
      deployment system to see if all B instances have fully rolled over to the new version. (2)
      Compare the JSON response schema between old and new B — look for renamed fields, changed
      types, or removed fields that A depends on. (3) Roll back B if needed, then fix A to handle
      the new schema (or version your API). (4) Re-deploy B only after A can handle both schemas or
      is updated simultaneously.
    expected_stepwise: |-
      Let me reason through this step by step. Step 1 — Characterize the failure pattern. 15% of
      requests fail, intermittently, after deploying only service B. Health checks pass. The error
      is a JSON parsing failure in A when reading B's response — not a timeout, not a 500 error, not
      a network failure. This is very specific and informative. Step 2 — What causes intermittent
      JSON parsing errors? If B always returned the same response structure, A would either always
      parse it or always fail. Intermittent failures mean B is returning two different response
      shapes — some of the time it's parseable by A, sometimes it's not. Step 3 — Why would B return
      two different shapes? The most likely explanation: you have a rolling deployment in progress
      or a partially completed one. Some instances of B are running the old version, some the new
      version. Requests are load-balanced across both, so ~15% are hitting a new-version instance
      that has a changed response schema. Step 4 — Validate this hypothesis. Check: (a) How many
      instances of B are running, and what version is each on? Use your orchestration system
      (Kubernetes, ECS, etc.) to list B pods/tasks and their image tags. (b) Correlate failures with
      specific B instance IDs in logs — do all failures come from the same instance(s)? (c) Compare
      a failing response payload vs a successful one — what specifically is different in the JSON?
      Step 5 — Secondary hypotheses to rule out. (a) Service B has a bug introduced in the new
      version that causes it to return malformed JSON under certain conditions (e.g., a null field
      serialization issue). This would also be intermittent if only triggered by some inputs. (b) A
      caching layer is serving stale, differently-structured responses. Less likely since you
      changed B, not a cache config. Step 6 — Immediate mitigation. If rolling deployment is
      confirmed as the cause, you have two options: roll back B to the previous version (fastest,
      restores 100% success immediately), or accelerate the rollout to 100% of new B instances so
      all responses use the new schema — but only if you update A simultaneously to parse the new
      schema. Step 7 — Permanent fix. Implement a contract test between A and B so schema changes
      are caught before deployment. Add API versioning to B so schema changes are non-breaking.
      Ensure your deployment pipeline deploys dependent service updates together or in the correct
      order (A updated to handle new schema before or simultaneously with B's new schema going
      live). The root cause is almost certainly a mixed-version deployment of B causing inconsistent
      response schemas, solvable immediately by completing or rolling back the deployment.
- id: multi_step_reasoning_332
  paraphrases:
  - |-
    I run a small online store and I'm trying to figure out whether I can afford to hire a part-time customer service rep at $20/hour for 20 hours a week. My store does about $15,000/month in revenue with a 40% gross margin. My current fixed costs are around $3,500/month. Can you help me figure out if this is financially viable and what revenue growth I might need if it isn't?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: estimation
    difficulty: hard
    task_type: sequential_planning
    split: train
    expected_direct: |-
      Your current monthly profit is about $2,500 ($15,000 × 40% − $3,500). Hiring the rep adds
      $1,600/month (20 hrs × $20 × ~4 weeks), leaving you with roughly $900/month profit — tight but
      viable. If you want to maintain your current profit margin, you'd need revenue to grow to
      about $18,000/month, roughly a 20% increase.
    expected_stepwise: |-
      Let me work through this step by step. **Step 1: Calculate current gross profit.** Revenue:
      $15,000/month. Gross margin: 40%. Gross profit = $15,000 × 0.40 = $6,000/month. **Step 2:
      Calculate current net profit (operating income).** Gross profit: $6,000. Fixed costs: $3,500.
      Current net profit = $6,000 − $3,500 = **$2,500/month**. **Step 3: Calculate the cost of the
      new hire.** $20/hour × 20 hours/week × 4.33 weeks/month ≈ $1,732/month. (Using 4 weeks for
      simplicity: $20 × 20 × 4 = $1,600/month.) Let's use $1,600 as a conservative estimate. **Step
      4: Calculate new net profit after hiring.** $2,500 − $1,600 = **$900/month**. This is
      positive, so hiring is technically viable — you wouldn't be losing money. **Step 5: Assess
      whether $900/month is comfortable enough.** That's a pretty thin margin (~6% net margin on
      $15,000 revenue). Many small business owners would want more cushion. If you want to restore
      the original $2,500 net profit after hiring, you'd need an additional $1,600 in net profit.
      **Step 6: Calculate the revenue growth needed to restore original profit.** Since each
      additional dollar of revenue generates $0.40 of gross profit (variable costs aside), you need:
      $1,600 ÷ 0.40 = $4,000 more in monthly revenue. Target revenue = $15,000 + $4,000 =
      **$19,000/month**, a ~27% increase. If your goal is just to stay in the black (any positive
      profit), you're already fine at current revenue. But to maintain your current profit level,
      you'd need about **27% revenue growth** (~$19,000/month). A more modest goal of $18,000/month
      (~20% growth) would give you about $1,700/month net profit, which is a reasonable middle
      ground.
- id: multi_step_reasoning_333
  paraphrases:
  - |-
    My company has been losing customers at an increasing rate over the past 6 months. We haven't changed our product, but a competitor launched 8 months ago offering a similar product at 30% lower price. Our NPS scores are actually still decent (around 40), but churn is up 25%. What's most likely causing the churn and what should we do about it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: decision_making
    difficulty: hard
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      The churn is almost certainly price-driven, triggered by the competitor's launch. The decent
      NPS tells you customers still like your product — they're just leaving because the competitor
      is cheaper and 'good enough.' You should either find a way to compete on price (cut costs,
      offer tiered pricing, or targeted retention discounts) or double down on differentiating your
      value so the premium feels justified. Probably start with exit interviews to confirm the price
      hypothesis, then act accordingly.
    expected_stepwise: |-
      Let me trace the causal chain here before recommending action. **1. Timing correlation** Churn
      started increasing 6 months ago; the competitor launched 8 months ago. There's typically a 1–3
      month lag between a competitor launch and customers noticing, evaluating, and switching — so
      the timing lines up almost perfectly. This is strong circumstantial evidence the competitor is
      the cause. **2. What the NPS score tells us** An NPS of 40 is reasonable — it means customers
      who stay generally like your product. Crucially, NPS measures satisfaction, not price
      sensitivity. You can love a product and still leave it for a cheaper alternative that's 'good
      enough.' So high NPS + rising churn = customers aren't leaving because they're unhappy with
      quality; they're leaving for a rational economic reason. **3. The 30% price gap** A 30% price
      difference is large enough to drive switching even among satisfied customers, especially if
      the competitor's product covers core use cases. The question is whether your product has
      features or quality that justify the premium to enough of your customer base. **4. Diagnosing
      who is churning** Before acting, it's worth segmenting the churned customers: Are they
      price-sensitive small accounts or larger ones? Are they switching to the specific competitor
      or leaving the category? Exit interviews or win/loss analysis would clarify this. **5.
      Strategic options and their tradeoffs** - *Price match or reduce:* Protects volume but hurts
      margins and may not be sustainable. - *Tiered pricing:* Offer a lower-cost tier to compete for
      price-sensitive customers while retaining premium pricing for others. - *Retention discounts:*
      Targeted offers to at-risk customers — effective but can train customers to threaten churn. -
      *Differentiate and justify premium:* If your product genuinely has advantages, make them more
      visible. Customers may not be aware of what they'd lose by switching. **Conclusion:** The
      churn is most likely price-driven, triggered by the competitor launch, with no product quality
      issue. The immediate step should be exit interviews to confirm, followed by a tiered pricing
      or targeted retention strategy rather than a blanket price cut.
- id: multi_step_reasoning_334
  paraphrases:
  - |-
    I deployed a web app update this morning and now users are reporting the page loads but the dashboard shows blank data. The database is up and the API returns 200 OK. Where should I start debugging?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: moderate
    task_type: sequential_planning
    split: train
    expected_direct: |-
      Since the API returns 200 but the dashboard is blank, the bug is almost certainly in the
      frontend — the API is probably returning an unexpected data shape after your update. Open the
      browser DevTools Network tab, find the dashboard API call, and inspect the actual response
      payload. Compare it to what the frontend expects. Also check the browser Console for JS errors
      that might be silently crashing the render.
    expected_stepwise: |-
      The API returning 200 OK tells us the server is alive and responding, but it doesn't guarantee
      the data shape is correct. Since this started after a deploy, something in your update changed
      the contract between the backend and frontend. Here's the order I'd debug: 1. **Check the
      browser console first.** Open DevTools and look for JavaScript errors. A silent exception
      during data parsing or rendering would produce a blank dashboard without an obvious error to
      the user. This takes 30 seconds and often points directly at the problem. 2. **Inspect the
      actual API response payload.** In the Network tab, find the dashboard data request and look at
      the raw response body. A 200 OK with an empty array, a changed field name (e.g., `user_data`
      renamed to `userData`), or a wrapped response object would all cause blank data on the
      frontend. 3. **Compare to the previous version.** If you have the old API response saved or
      can check git history, compare the response structure. A field rename or nesting change in the
      backend is the most likely culprit after a deploy. 4. **Check for environment-specific
      issues.** If the data looks correct in the response but still doesn't render, confirm the
      frontend is actually using the new build — clear the CDN cache or hard-refresh to rule out
      stale JS. Most likely you'll find the answer at step 1 or 2 — a changed data shape or a JS
      error from a field that no longer exists.
