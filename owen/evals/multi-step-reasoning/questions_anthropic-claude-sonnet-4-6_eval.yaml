  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: hard
    task_type: calculation
    split: train
    expected_direct: |-
      4% of requests are failing. The clustering at the top of each minute strongly suggests a
      scheduled job or cron task is running at :00 of every minute, spiking CPU or I/O usage and
      causing your upstream service to exceed the 500ms timeout, resulting in 502s.
    expected_stepwise: |-
      First, let me calculate the failure rate. Total requests = 480 successes + 20 failures = 500
      requests. Failure rate = 20 / 500 = 0.04, or 4%. Now for the root cause: the key clue is that
      failures cluster at the top of each minute. Let's think through what that means: 1. The
      failures aren't random — they're time-correlated, which rules out a general capacity issue. 2.
      Something is happening at :00 of each minute. That's the classic signature of a cron job or
      scheduled task. 3. The successful requests average 210ms, well under the 500ms timeout. But
      the 20 failed requests hit the timeout, meaning those requests took over 500ms. 4. If a cron
      job fires at :00 and spikes CPU, memory, or I/O on your upstream server, it would cause a
      temporary slowdown that pushes response times past 500ms, triggering 502s from your reverse
      proxy. Conclusion: 4% of requests are failing. The most likely root cause is a scheduled task
      (cron job) running every minute that briefly overwhelms your upstream server, causing it to
      exceed the 500ms timeout and return 502s to the proxy. I'd recommend checking your cron tabs
      and application schedulers for minute-level jobs.
