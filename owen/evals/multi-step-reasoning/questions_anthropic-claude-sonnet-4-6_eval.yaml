    My team of 5 people needs to complete a product launch in 6 weeks. There's a hard dependency: marketing materials can't be created until the product design is finalized, and the website can't go live until both the marketing materials and backend API are ready. Design will take 3 weeks, API development 4 weeks, and marketing materials 2 weeks. Can we hit the deadline, and what should everyone be working on in each phase?
