      `./config/db.js` (or `.ts`) actually exists in your project. If it's gone, restore it from git
      with `git checkout HEAD -- config/db.js`. If it was never tracked, check if a `npm install` or
      a deploy script accidentally deleted it, or if it was listed in `.gitignore` by mistake. Also
      verify your `node_modules` is intact by running `npm install` again.
    expected_stepwise: |-
