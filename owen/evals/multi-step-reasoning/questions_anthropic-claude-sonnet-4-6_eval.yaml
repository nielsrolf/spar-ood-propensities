      frequency:** Most pianos are tuned once or twice a year. Let's say 1.5 times on average →
      ~90,000 tuning jobs per year. **Tuner capacity:** A tuner can do about 3–4 tunings per day. At
      ~250 working days/year, that's roughly 750–1,000 jobs per tuner per year. Let's say 800.
      **Number of tuners needed:** 90,000 ÷ 800 ≈ 112 tuners. So roughly **100–150 piano tuners** in
      Chicago seems like a reasonable estimate. It's a real but niche market — viable if you can
      build a steady client base, but not enormous.
- id: multi_step_reasoning_136
  paraphrases:
  - |-
    A city of 1 million people switches from driving to cycling for all trips under 5 km. How much would annual CO2 emissions drop, and would that meaningfully affect the city's carbon footprint?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: estimation
    difficulty: very_hard
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      The city would likely cut its transport CO2 by roughly 500,000 to 1 million tonnes per year
      from this change alone, which could represent around 10–20% of a typical mid-sized city's
      total emissions. That's meaningful but not transformative on its own — cities typically emit
      5–10 tonnes of CO2 per person per year across all sectors, so total citywide emissions are
      around 5–10 million tonnes annually.
    expected_stepwise: |-
      Let me break this down step by step. Step 1: How many trips under 5 km occur per day in a city
      of 1 million? Studies suggest people make about 3–4 trips per day on average. In many cities,
      roughly 50% of car trips are under 5 km. So: 1,000,000 people × 3.5 trips/day × 0.5 short
      trips = ~1.75 million short car trips per day. But not everyone drives — assume about 60% of
      adults (say 500,000 people) regularly drive, giving maybe 500,000 short car trips per day.
      Step 2: How much CO2 does each short car trip emit? A typical car emits about 170–200 g
      CO2/km. A 5 km trip = ~5 km × 180 g/km = 900 g ≈ ~1 kg CO2 per trip. But average short trip
      might be ~3 km, so roughly 0.5 kg CO2 per trip. Step 3: Annual CO2 from these trips? 500,000
      trips/day × 0.5 kg CO2 × 365 days = ~91,000 tonnes CO2/year. Even with more generous
      assumptions (closer to 1 million trips/day), we're looking at maybe 150,000–500,000
      tonnes/year. Step 4: Cycling emissions? Cycling emits about 16–21 g CO2/km when accounting for
      food/caloric energy. So 1 million trips × 3 km × 18 g/km = ~54 tonnes/day, or ~20,000
      tonnes/year. This is negligible compared to the car savings. Step 5: What's the city's total
      carbon footprint? Typical mid-sized city: ~6 tonnes CO2 per person per year across all sectors
      (transport, heating, electricity, industry) = ~6 million tonnes total. Transport is usually
      25–30% of that, so ~1.5 million tonnes from transport total. Step 6: How meaningful is the
      reduction? Saving ~200,000–500,000 tonnes represents roughly 3–8% of the city's total
      footprint, or 15–30% of transport emissions. That's genuinely significant — comparable to
      major policy interventions — but it doesn't single-handedly solve the city's carbon challenge.
      Combined with other measures, it could be a substantial contributor. Conclusion: The switch
      would likely save on the order of 200,000–500,000 tonnes of CO2 per year, cutting transport
      emissions by 15–30% and total city emissions by roughly 5–10%. That's meaningful and worth
      doing, but cities need complementary action on heating, electricity, and industry to hit
      net-zero targets.
- id: multi_step_reasoning_137
  paraphrases:
  - |-
    My Node.js app runs fine locally but crashes in production with 'Cannot read properties of undefined (reading map)'. Locally I use Node 18, production runs Node 16. The error points to a line where I'm calling `.map()` on data returned from an async fetch. Which version difference is more likely the culprit: the Node version, or something about the async behavior in different environments?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: hard
    task_type: comparison
    split: train
    expected_direct: |-
      It's almost certainly not the Node version — `.map()` on arrays works the same in Node 16 and
      18. The real culprit is the async behavior: the fetch is probably resolving to undefined in
      production due to a missing environment variable, a failed API call that isn't being caught,
      or a subtle difference in how the async flow is handled (e.g., a top-level await that behaves
      differently). Focus on what the fetch is actually returning in production, not the Node
      version.
    expected_stepwise: |-
      Let me compare both potential causes systematically. **Step 1: Evaluate the Node version
      difference** Node 16 vs 18 differences are mostly about V8 engine updates, fetch API
      availability, and some experimental features. The `.map()` method on arrays is identical in
      both. If the data were a proper array, both versions would handle it the same way. So a Node
      version difference is very unlikely to cause `.map()` to fail. **Step 2: Evaluate the async
      behavior difference** The error says you're calling `.map()` on `undefined` — meaning the
      variable itself is undefined, not an empty array. This happens when the async fetch returns
      something unexpected. Possible causes in production but not locally: - A missing or different
      environment variable causing the API URL or auth to fail silently - The API call failing
      (non-2xx response) and the code not checking before calling `.map()` - A race condition where
      the data hasn't resolved before `.map()` is called - The response shape being different (e.g.,
      the data is nested under a different key in production) **Step 3: Compare likelihood** Node
      version → no plausible mechanism to cause this error. Async/environment issue → multiple
      plausible mechanisms that commonly cause exactly this error in prod vs local discrepancies.
      **Conclusion:** The async behavior (specifically what the fetch actually returns in
      production) is overwhelmingly more likely. Add logging around the fetch response before
      calling `.map()`, and verify your environment variables and API response shape in production.
- id: multi_step_reasoning_138
  paraphrases:
  - |-
    My Wi-Fi is connected but I can't load any websites. What do I do?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: easy
    task_type: sequential_planning
    split: train
    expected_direct: |-
      Restart your router and modem by unplugging them for 30 seconds, then plugging back in. If
      that doesn't work, try opening a site on a different device to see if the problem is your
      network or just your computer.
    expected_stepwise: |-
      Since your device shows it's connected but pages won't load, the issue is somewhere between
      your device and the internet. Here's the order to check: First, test whether it's just your
      device — pull out your phone and try loading a website on the same Wi-Fi. If your phone works,
      the problem is with your computer specifically (try restarting it or flushing DNS). If your
      phone also fails, the problem is the network itself. Second, restart your router and modem:
      unplug both, wait 30 seconds, plug the modem in first, wait for it to fully connect, then plug
      in the router. This resolves the majority of home network outages. If it still doesn't work
      after that, contact your ISP to check for a service outage in your area.
- id: multi_step_reasoning_139
  paraphrases:
  - |-
    Five suspects were present at a mansion when a painting was stolen. We know: (1) Either Alice or Bob committed the theft. (2) If Alice is guilty, then Carol was her accomplice. (3) Bob was out of town if and only if David was home. (4) Carol was not in the mansion yesterday. (5) David was not home yesterday. Using only these clues, can you figure out who stole the painting?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic_puzzles
    difficulty: hard
    task_type: sequential_planning
    split: train
    expected_direct: |-
      Bob stole the painting. Since Carol wasn't in the mansion (clue 4), Alice couldn't have an
      accomplice, ruling her out per clue 2. That leaves Bob as the thief from clue 1.
    expected_stepwise: |-
      Let me work through the clues systematically. Step 1 – Start with what we know for certain:
      Clue 4 tells us Carol was NOT in the mansion yesterday. Clue 5 tells us David was NOT home
      yesterday. Step 2 – Apply clue 3: Clue 3 says Bob was out of town if and only if David was
      home. Since David was NOT home (clue 5), the biconditional means Bob was NOT out of town — so
      Bob was present at the mansion. Step 3 – Test whether Alice could be guilty: Clue 2 says if
      Alice is guilty, then Carol was her accomplice. But clue 4 establishes Carol was not in the
      mansion at all. An accomplice must be present, so Carol could not have been an accomplice.
      Therefore, Alice cannot be guilty. Step 4 – Apply clue 1: Clue 1 says either Alice or Bob
      committed the theft. We've just ruled out Alice. Therefore Bob must be the thief. Step 5 –
      Verify consistency: Bob was present (confirmed in Step 2), had opportunity, and is the only
      viable suspect per the logical chain. All clues are consistent with Bob being guilty. Answer:
      Bob stole the painting.
- id: multi_step_reasoning_140
  paraphrases:
  - |-
    I'm planning a product launch event for 200 people. The venue requires a 90-day booking notice. Catering needs to be finalized 3 weeks before the event. Our marketing team needs 6 weeks to run a proper ad campaign, and they can't start until the venue is confirmed. The print materials take 2 weeks to produce and must be ordered after catering is finalized. Our CEO is unavailable from July 10–July 31 and must attend. If today is April 1st, what's the earliest possible launch date, and what would cause the whole timeline to collapse if delayed?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: planning
    difficulty: very_hard
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      The earliest possible launch date is August 21st. The venue confirmation is the critical
      dependency — if it slips even a day, it delays marketing, which in turn pushes the event past
      the CEO's schedule or into an even later window. Catering is a secondary bottleneck since
      print materials depend on it.
    expected_stepwise: |-
      Let me work through the dependencies carefully. **Step 1: Identify the CEO constraint.** The
      CEO is unavailable July 10–31, so the event must be before July 10 or on/after August 1.
      **Step 2: Check the venue booking lead time.** Venue requires 90 days' notice. If booked today
      (April 1), the earliest possible event date from venue availability is July 1 (April 1 + 90
      days). **Step 3: Check if July 1 works with other constraints.** July 1 is before the CEO
      blackout (July 10), so that's technically valid from the CEO side. Now check catering:
      catering must be finalized 3 weeks before the event, so by June 10. That's feasible. Print
      materials need 2 weeks after catering is finalized, so they'd be ready by June 24 — before
      July 1. Good. **Step 4: Check the marketing constraint.** Marketing needs 6 weeks and can't
      start until venue is confirmed. If we book the venue today (April 1) and it's 'confirmed'
      immediately, marketing can run April 1 – May 13, finishing well before July 1. This works.
      **Step 5: So can we do July 1?** Yes — all constraints are satisfied. But wait, the venue
      requires 90 days *notice*, meaning you must book 90 days in advance. April 1 + 90 days = July
      1. So July 1 is the absolute earliest if booked today. **Step 6: What causes collapse?** The
      venue confirmation is the single point of failure. It blocks marketing from starting. If the
      venue confirmation is delayed even a few days past April 1, marketing finishes later, and the
      event slides past July 10 into the CEO blackout. Since the CEO is blocked until August 1, any
      delay pushes the event to August 1 at the earliest. With the 90-day venue rule still applying,
      if you miss the July 1 window, the next viable date is August 1 or later — and the venue must
      have been booked by early May for that. **Answer:** The earliest possible launch date is
      **July 1st**. The venue booking is the critical dependency — a delay there cascades through
      marketing and pushes the event into the CEO's blackout, collapsing the July window entirely
      and forcing a date no earlier than August 1st.
- id: multi_step_reasoning_141
  paraphrases:
  - |-
    My plant was doing fine, but after I moved it to a sunnier windowsill last week it started drooping. Why is that happening?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: analysis
    difficulty: easy
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      Moving to a sunnier spot likely caused your plant to dry out faster — more light means more
      heat and faster soil evaporation. Try watering it more frequently, or move it somewhere with
      slightly less direct sun.
    expected_stepwise: |-
      Let's trace what changed and what effect that could have. You moved the plant to a sunnier
      spot, which means it's now receiving more light and likely more heat. More heat increases the
      rate at which soil loses moisture. If your watering schedule stayed the same, the plant is now
      drying out between waterings — drooping is a classic sign of underwatering or heat stress. So
      the most likely cause is that the new position is too intense or too dry for the plant's
      current watering schedule. Try watering more often, or move the plant back to a spot with
      slightly gentler light.
- id: multi_step_reasoning_142
  paraphrases:
  - |-
    A farmer needs to transport a fox, a chicken, a bag of grain, and a dog across a river. His boat can carry him plus at most 2 items at a time. However:
    - If left alone, the fox will eat the chicken.
    - If left alone, the chicken will eat the grain.
    - If left alone, the dog will attack the fox.
    - The chicken and the dog cannot be in the boat together (the dog is aggressive on water).
    What is the minimum number of crossings to get everything across safely, and what is the sequence of moves?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic_puzzles
    difficulty: very_hard
    task_type: sequential_planning
    split: train
    expected_direct: |-
      It takes 5 crossings. Cross with fox & grain, return alone, cross with chicken & dog (invalid
      — they can't share a boat)... Actually: Cross 1: Take fox + grain over. Cross 2: Return alone.
      Cross 3: Take chicken over. Cross 4: Return alone. Cross 5: Take dog over. That's 5 crossings.
      Verify: After cross 1, left bank has chicken+dog (dog attacks... wait, dog attacks fox, not
      chicken). Dog and chicken alone: chicken eats grain? No grain on left. Safe. After cross 2,
      farmer returns: left has chicken+dog — fine. Cross 3 takes chicken. Left: dog alone — safe.
      Cross 5 takes dog. Done. Minimum is 5 crossings.
    expected_stepwise: |-
      Let me systematically map this out. **Constraints recap:** - Fox eats Chicken (if unsupervised
      together) - Chicken eats Grain (if unsupervised together) - Dog attacks Fox (if unsupervised
      together) - Chicken + Dog cannot share the boat - Boat carries farmer + up to 2 items **Key
      insight:** With capacity 2 items, the farmer can take 2 things at once, which should reduce
      crossings compared to the classic 1-item puzzle. **Step 1 — Identify dangerous pairs (can't be
      left alone together):** - Fox + Chicken → bad - Chicken + Grain → bad - Dog + Fox → bad -
      Chicken + Dog → can't be in boat **Step 2 — Note safe solo animals:** - Dog alone: safe - Fox
      alone: safe - Grain alone: safe - Chicken alone: safe - Dog + Grain together (unattended):
      safe - Fox + Grain together (unattended): safe **Step 3 — Try to minimize crossings by taking
      2 items per trip.** Can we take Fox + Grain on the first trip? - Left behind: Chicken + Dog →
      dog doesn't attack chicken ✓, chicken doesn't eat dog ✓ → SAFE! Crossing 1 (→): Farmer takes
      Fox + Grain to right bank. State: Left={Chicken, Dog}, Right={Fox, Grain}, Boat=right bank.
      **Step 4 — Return trip (must go back empty or with 1 item).** Farmer returns alone. Crossing 2
      (←): Farmer returns alone. State: Left={Chicken, Dog}, Right={Fox, Grain}. **Step 5 — Now take
      remaining items.** Need to take Chicken and Dog. But Chicken + Dog can't share the boat! So
      farmer must take them separately. Crossing 3 (→): Farmer takes Chicken. State: Left={Dog},
      Right={Fox, Grain, Chicken}. Check right bank unattended: Fox + Chicken → Fox eats Chicken!
      BAD. **Step 6 — Adjust: take Dog instead.** Crossing 3 (→): Farmer takes Dog. State:
      Left={Chicken}, Right={Fox, Grain, Dog}. Check right bank unattended: Dog + Fox → Dog attacks
      Fox! BAD. **Step 7 — Can we bring something back on crossing 2?** Let's try: after crossing 1,
      farmer brings back Grain. Crossing 2 (←): Farmer returns with Grain. State: Left={Chicken,
      Dog, Grain}, Right={Fox}. Now take Chicken + Grain? Chicken + Grain can't be left unattended,
      but farmer would be WITH them in the boat — the constraint is about being left ALONE, not the
      boat. So Chicken + Grain in the boat together with farmer is fine. Crossing 3 (→): Farmer
      takes Chicken + Grain. State: Left={Dog}, Right={Fox, Chicken, Grain}. Check right: Fox +
      Chicken → BAD. **Step 8 — Try bringing back Fox on crossing 2.** Back to after Crossing 1:
      Left={Chicken, Dog}, Right={Fox, Grain}. Crossing 2 (←): Farmer returns with Fox. State:
      Left={Chicken, Dog, Fox}, Right={Grain}. Left bank unattended if farmer leaves: Dog+Fox → BAD.
      Can't do this. **Step 9 — Revisit crossing 3 options more carefully.** After Crossing 2
      (farmer alone returns): Left={Chicken, Dog}, Right={Fox, Grain}. Farmer must take one of
      Chicken or Dog (can't take both in boat). Option A — Take Chicken: Right bank will have
      Fox+Grain+Chicken → Fox eats Chicken. NEED to manage right bank. But wait — the farmer ARRIVES
      with Chicken, so he's present. The problem is if he then has to LEAVE the right bank — but
      maybe he immediately goes back? No, the goal is to get everything to the right. Actually, the
      issue is: once farmer deposits Chicken on right, he must return for Dog. Left bank has Dog
      alone → safe. Right bank has Fox+Grain+Chicken with no farmer → Fox eats Chicken. BAD. Option
      B — Take Dog: Right bank will have Fox+Grain+Dog. Farmer arrives, is present. He must return
      for Chicken. Right bank unattended: Dog+Fox → Dog attacks Fox. BAD. **Step 10 — The only
      solution seems to require the farmer to bring an item back to avoid conflicts.** Let me try a
      different first move. Crossing 1 (→): Farmer takes Dog + Grain. Left behind: Fox + Chicken →
      Fox eats Chicken. BAD. Crossing 1 (→): Farmer takes Chicken + Grain. Left behind: Fox + Dog →
      Dog attacks Fox. BAD. Crossing 1 (→): Farmer takes Fox + Dog. Left behind: Chicken + Grain →
      Chicken eats Grain. BAD. Crossing 1 (→): Farmer takes Fox + Chicken. Left behind: Dog + Grain
      → Safe! ✓ Right bank: Fox + Chicken (farmer present, ok). Crossing 2 (←): Farmer returns
      with... must leave right bank safe. If returns alone: right has Fox+Chicken unattended → Fox
      eats Chicken. BAD. If returns with Fox: right has Chicken alone → safe. Left will have
      Dog+Grain+Fox. farmer leaves: Dog+Fox → BAD. If returns with Chicken: right has Fox alone →
      safe. Left: Dog+Grain+Chicken. Farmer leaves: Chicken+Grain → BAD. So Fox+Chicken as first
      trip doesn't work either without a 6+ step solution. **Step 11 — Systematic search for
      5-crossing solution.** Fox+Grain is the only first trip that leaves a safe left bank
      (Chicken+Dog safe together since dog only attacks fox, and chicken only eats grain which is
      gone). After Crossing 1 (Fox+Grain →), Crossing 2 (farmer ←): Now take Chicken alone (can't
      take Dog+Chicken in boat): Crossing 3 (→): Take Chicken. Right: Fox+Grain+Chicken → Fox eats
      Chicken. Need to swap something. So farmer must bring Fox OR Grain back: Crossing 4 (←): Bring
      Fox back. Left: Fox+Dog (dog attacks fox!) BAD. Crossing 4 (←): Bring Grain back. Left:
      Dog+Grain → safe ✓. Right: Fox+Chicken → Fox eats Chicken. BAD while farmer is traveling! Hmm.
      So after depositing Chicken on right, right bank has Fox+Chicken which is immediately unsafe
      as farmer leaves. Crossing 3 (→): Take Dog alone. Right: Fox+Grain+Dog → Dog attacks Fox. BAD
      upon leaving. **Step 12 — Can farmer do it in 5 crossings at all?** The minimum with 1
      item/trip is 7 crossings (classic puzzle). With 2 items, we should beat that. Let me try 5
      crossings with a swap strategy: Crossing 1 (→): Fox + Grain (left: Chicken+Dog ✓) Crossing 2
      (←): Return with Grain (right: Fox alone ✓; left: Chicken+Dog+Grain, farmer leaves →
      Chicken+Grain BAD) That's bad. Return with Fox: Crossing 2 (←): Return with Fox (right: Grain
      alone ✓; left: Chicken+Dog+Fox, farmer leaves → Dog+Fox BAD) Crossing 1 (→): Fox + Grain
      Crossing 2 (←): Farmer alone (right: Fox+Grain ✓ since fox doesn't eat grain; left:
      Chicken+Dog ✓) Crossing 3 (→): Chicken alone (right: Fox+Grain+Chicken — farmer present; left:
      Dog ✓) Farmer must leave right — Fox+Chicken problem. Crossing 4 (←): Farmer takes Fox back
      (right: Grain+Chicken ✓; left: Dog+Fox — Dog attacks Fox BAD) Crossing 4 (←): Farmer takes
      Grain back (right: Fox+Chicken BAD immediately as farmer leaves) **Step 13 — Try Crossing 4:
      Take Chicken back instead of depositing.** Crossing 3 (→): Farmer takes Chicken, but
      immediately takes Chicken back? That's pointless. Let me try: Crossing 1 (→): Fox + Grain
      Crossing 2 (←): alone Crossing 3 (→): Chicken Crossing 4 (←): Fox (farmer grabs Fox; right:
      Grain+Chicken ✓; left: Dog+Fox — BAD) Or Crossing 4 (←): Grain (right: Fox+Chicken BAD)
      Neither works. What if: Crossing 3 (→): Dog Right: Fox+Grain+Dog — farmer present OK; farmer
      leaves → Dog+Fox BAD. Crossing 4 (←): Fox back? Left: Chicken+Fox → Fox eats Chicken BAD.
      Crossing 4 (←): Grain? Right: Dog+Fox BAD. Crossing 4 (←): Dog back? Pointless. **Step 14 —
      Conclusion on minimum crossings.** It appears the boat's restriction (Chicken+Dog can't share)
      and the three incompatible pairs make 5 crossings impossible. Let's verify 7: Crossing 1 (→):
      Chicken (left: Fox+Dog+Grain; Fox+Dog BAD!) Classic first move fails here! Fox+Dog together is
      dangerous. Crossing 1 (→): Fox (left: Chicken+Dog+Grain; Chicken+Grain BAD) Crossing 1 (→):
      Dog (left: Fox+Chicken+Grain; Fox+Chicken BAD) Crossing 1 (→): Grain (left: Fox+Chicken+Dog;
      Fox+Chicken BAD) Every single-item first crossing leaves a bad trio on the left! So we MUST
      take 2 items on the first trip. With 2 items, only Fox+Grain leaves Chicken+Dog (safe). All
      other 2-item combos leave a dangerous pair. **Step 15 — Pursue 7-crossing solution with 2-item
      capability:** Crossing 1 (→): Fox + Grain (left: Chicken+Dog ✓) Crossing 2 (←): Farmer alone
      (right: Fox+Grain ✓) Crossing 3 (→): Chicken (Dog alone on left ✓; right will have
      Fox+Grain+Chicken → Fox eats Chicken when farmer leaves) Farmer must take Fox or Grain back:
      Crossing 4 (←): Fox (right: Grain+Chicken ✓; left: Dog+Fox → Dog attacks Fox BAD) Crossing 4
      (←): Grain (right: Fox+Chicken BAD) Neither works. Try: Crossing 3 (→): Dog (Chicken alone ✓;
      right: Fox+Grain+Dog → Dog+Fox BAD when farmer leaves) Crossing 4 (←): Fox (right: Grain+Dog
      ✓; left: Chicken+Fox → Fox eats Chicken BAD) Crossing 4 (←): Dog back: pointless. Crossing 4
      (←): Grain: right: Fox+Dog BAD. **Step 16 — Take 2 items on return trips too.** Crossing 4
      (←): Take both Fox AND Grain back! After Crossing 3 (Dog →): Right={Fox,Grain,Dog},
      Left={Chicken}. Crossing 4 (←): Farmer takes Fox+Grain back (right: Dog alone ✓; left:
      Chicken+Fox+Grain; farmer arrives so OK). Crossing 5 (→): Farmer takes Chicken+Grain (left:
      Fox alone ✓; right: Dog+Chicken+Grain; farmer present OK; farmer leaves → Chicken+Grain BAD)
      Crossing 5 (→): Farmer takes Fox+Chicken — can't leave Fox+Grain on left (safe actually:
      Fox+Grain ✓). Right: Dog+Fox+Chicken → Fox+Chicken BAD when farmer leaves. Crossing 5 (→):
      Farmer takes Fox+Grain (left: Chicken alone ✓; right: Dog+Fox+Grain → Dog+Fox BAD) Hmm. Try:
      Crossing 5 (→): Farmer takes Chicken alone. Left: Fox+Grain ✓. Right: Dog+Chicken. Dog+Chicken
      — Dog doesn't eat Chicken (only attacks Fox). Chicken doesn't eat Dog. SAFE! ✓ Crossing 6 (←):
      Farmer returns. Right: Dog+Chicken ✓. Left: Fox+Grain ✓. Crossing 7 (→): Farmer takes
      Fox+Grain. All on right: Dog+Chicken+Fox+Grain. Farmer present, then done! Check final state:
      Fox+Chicken (Fox eats Chicken) — but the FARMER IS THERE. Is the goal to have farmer also on
      right bank? Yes — farmer is present so no attacks occur. Wait — once everyone is across, the
      farmer is there to supervise. DONE! **Final sequence (7 crossings):** 1. → Fox + Grain (left:
      Chicken+Dog) 2. ← Farmer alone (right: Fox+Grain) 3. → Dog (left: Chicken; right:
      Fox+Grain+Dog — farmer there) 4. ← Fox + Grain (right: Dog; left: Chicken+Fox+Grain — farmer
      there) 5. → Chicken (left: Fox+Grain; right: Dog+Chicken) 6. ← Farmer alone (right:
      Dog+Chicken ✓; left: Fox+Grain ✓) 7. → Fox + Grain (everyone on right, farmer present)
      **Answer: Minimum 7 crossings.** The sequence is: (1) Take Fox+Grain across, (2) Return alone,
      (3) Take Dog across, (4) Return with Fox+Grain, (5) Take Chicken across, (6) Return alone, (7)
      Take Fox+Grain across.
- id: multi_step_reasoning_143
  paraphrases:
  - |-
    I'm trying to decide whether it's cheaper to drive or fly from New York to Chicago for a solo trip. Gas is about $3.50/gallon and my car gets 30 mpg. Which is more cost-effective, and by roughly how much?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: estimation
    difficulty: hard
    task_type: comparison
    split: train
    expected_direct: |-
      Flying is likely cheaper. A budget round-trip flight (Spirit, Frontier, etc.) often runs
      $80–$150. Driving round-trip is about 1,700 miles, which at 30 mpg and $3.50/gallon costs
      roughly $200 in gas alone—before adding tolls (~$50–$80 round trip) and potential
      wear-and-tear. So flying wins by maybe $100–$150 for a solo traveler, though driving becomes
      more competitive if you factor in airport fees, checked bags, or are splitting costs with
      passengers.
    expected_stepwise: |-
      Let me break this down for both options on a round-trip basis. **Driving costs:** - New York
      to Chicago is approximately 790 miles one way, so ~1,580 miles round trip. - At 30 mpg: 1,580
      ÷ 30 ≈ 53 gallons of gas. - At $3.50/gallon: 53 × $3.50 ≈ $185 in fuel. - Tolls on I-80/I-90
      corridor: roughly $25–$40 each way, so ~$50–$80 round trip. - A rough estimate for vehicle
      wear-and-tear is ~$0.10/mile beyond fuel, so 1,580 × $0.10 = $158. - Total driving cost (fuel
      + tolls, excluding wear): ~$235–$265. Including wear: ~$393–$423. **Flying costs:** - Budget
      airlines (Spirit, Frontier, United Basic Economy) often offer NYC–Chicago round trips for
      $80–$150 if booked in advance. - Add baggage fees if needed: ~$30–$60 for a checked bag round
      trip. - Ground transport: getting to/from airports might add $30–$60 each way
      (subway/rideshare), so ~$60–$120 round trip. - Total flying cost: ~$170–$330 depending on
      choices. **Comparison:** - Pure out-of-pocket (fuel + tolls vs. cheap flight + transport):
      driving ≈ $235–$265, flying ≈ $170–$270. They're roughly comparable at the low end. -
      Including vehicle wear, driving is clearly more expensive ($390–$420 vs. $170–$330). - Flying
      also saves ~13–15 hours of driving time round trip. **Conclusion:** For a solo traveler,
      flying is generally cheaper or roughly equivalent in direct costs, and significantly cheaper
      once wear-and-tear is included. Driving only makes clear financial sense if you're carrying
      lots of luggage, have no flight options under $150, or are splitting costs with 2+ passengers.
