      tells you pH and nutrient levels so you know what amendments (lime, compost, fertilizer) to
      add before planting. **3. Plan your layout** With only 6x8 ft, space is limited. Tomatoes need
      ~2–3 sq ft each and grow tall, so place them on the north side so they don't shade shorter
      plants. Lettuce, spinach, and carrots can fill the remaining space and actually tolerate
      partial shade better. **4. Figure out your timing** Look up your last frost date. Tomatoes
      need to be started indoors 6–8 weeks before that date. Lettuce, spinach, and carrots can go
      directly in the ground a few weeks before the last frost since they're cold-tolerant. **5.
