  n_samples: 5
  meta:
    domain: planning
    difficulty: very_hard
    task_type: comparison
    split: train
    expected_direct: |-
      The minimum is 4 days. On Day 1, assign 1 person to Task A and 2 others to Task C (C only
      takes 6 hrs so they finish before end of day) while 2 people are free. Day 2, start Task B
      with 2 people (takes 12 hrs = 1.5 days) and use remaining people on standby. B finishes
      partway through Day 3. Then D starts after B and C are both done — assign 1 person, takes 4
      hrs. E starts once D is done, assign 2 people for 10 hrs. D and E can finish within Day 4. So
      the project completes in 4 days.
    expected_stepwise: |-
      Let me work through the dependencies, critical path, and staffing carefully. **Step 1: Map
      dependencies** - C: no dependencies (can start Day 1) - A: no dependencies (can start Day 1) -
      B: requires A to finish first; needs 2 people for 12 hrs - D: requires both B and C to be
      done; needs 1 person for 4 hrs - E: requires D to finish; needs 2 people for 10 hrs **Step 2:
      Find the critical path** Path 1: A → B → D → E = 8 + 12 + 4 + 10 = 34 person-hours of
      sequential work Path 2: C → D → E = 6 + 4 + 10 = 20 sequential hours The critical path is A →
      B → D → E. **Step 3: Convert to calendar time** Each day = 8 hrs. The critical chain in
      wall-clock time: - A: 8 hrs = 1 full day (1 person) - B: 12 hrs with 2 people = 12 elapsed
      hours = 1.5 days, starts after A - D: 4 hrs = 0.5 days, starts after B and C are both done -
      E: 10 hrs with 2 people = 10 elapsed hours = 1.25 days Critical path elapsed time: 1 + 1.5 +
      0.5 + 1.25 = 4.25 days → rounds up to **4.25 days** if work is continuous. **Step 4: Check if
      C causes any delay for D** C = 6 hrs, can start Day 1. It finishes 6 hrs into Day 1. B
      finishes 12 hrs after A ends, i.e., end of Day 2 + 4 hours = mid-Day 3 (specifically, 12 hrs
      after start of Day 2 = end of Day 3 at hour 4). So C finishes long before B finishes — no
      additional delay from C. **Step 5: Build the schedule** - **Day 1 (Hours 0–8):** Person 1 →
      Task A (8 hrs). Persons 2 & 3 → Task C (6 hrs, done at hour 6; free after). Persons 4 & 5 →
      idle or prep. - **Day 2 (Hours 8–16):** A is done. Start Task B with Persons 1 & 2 (need 12
      hrs, so runs Hours 8–20). Persons 3, 4, 5 are available but no unstarted tasks depend only on
      C (already done). - **Day 3 (Hours 16–24, i.e., Day 3 is hours 16–24):** B finishes at hour 20
      (mid-Day 3). At hour 20, start Task D — assign Person 3 (4 hrs, done at hour 24 = end of Day
      3). - **Day 4 (Hours 24–32):** D is done. Start Task E with 2 people — Persons 1 & 2 (10 hrs,
      done at hour 34, i.e., mid-Day 5). **Step 6: Optimization check** E takes 10 hrs and starts at
      hour 24 → finishes at hour 34 = 4 hrs into Day 5. Can we do better? The bottleneck is B (12
      hrs, can't start until A is done, can't be parallelized below 2 people). There's no way to
      compress B further with only 2 people. D adds 4 hrs after B. E adds 10 hrs after D. The math
      gives 1 + 1.5 + 0.5 + 1.25 = 4.25 days minimum. **Answer:** The minimum project duration is
      **4.25 working days (34 hours elapsed)**. Assign: Day 1 — Person 1 to A, Persons 2–3 to C;
      Days 2–3 — Persons 1–2 to B; mid-Day 3 — Person 3 to D; Day 4 — Persons 1–2 to E (finishing 2
