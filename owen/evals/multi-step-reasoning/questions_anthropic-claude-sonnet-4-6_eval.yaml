      or about 1.5 billion liters. The Great Salt Lake holds roughly 18 billion cubic meters of
      water at its historical average, so the extra flushes would represent only about 0.008% of
      that — essentially negligible, less than 1/10,000th of the lake's volume.
    expected_stepwise: |-
