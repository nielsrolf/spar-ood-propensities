      $1,170/year, putting payback at roughly 7–9 years on a ~$12,000–$15,000 system after federal
      tax credits.
    expected_stepwise: |-
      Let me work through each part of this systematically. **Part 1: Number of panels** - Target
      system size: 5 kW (5,000 watts) - Modern residential panels are typically 400W each - Panels
      needed: 5,000W ÷ 400W = **12.5 → round up to 13 panels** (most installers would use 12–15
      depending on exact panel wattage) **Part 2: Battery bank size** - Daily energy output of a 5kW
      system: In the US, average peak sun hours ≈ 4–5 hours/day. At 5 kW × 4.5 hrs = **22.5
      kWh/day**. - To store a full day's output: battery bank needs ~22–25 kWh usable capacity. -
      Since lithium batteries (e.g., LFP) should only be discharged to ~80–90%, total bank capacity
      needed: 25 kWh ÷ 0.85 ≈ **~29 kWh** (e.g., two Tesla Powerwall 2 units at 13.5 kWh each ≈ 27
      kWh, which is close enough). **Part 3: Payback period** - System cost: A 5kW solar system
      averages ~$15,000 before incentives. The 30% federal ITC reduces this to ~**$10,500**. -
      Annual savings: 22.5 kWh/day × 365 days = ~8,200 kWh/year. At $0.16/kWh average US rate: 8,200
      × $0.16 = **~$1,310/year**. - Payback: $10,500 ÷ $1,310 ≈ **~8 years** for solar alone. -
      Adding a $10,000 battery bank (after incentives ~$7,000) extends total payback to roughly
      12–14 years if you're valuing the battery purely on bill savings. **Summary:** 13 panels (400W
      each), a ~29 kWh battery bank (e.g., 2× Powerwall), and a payback of roughly 8 years for
      solar-only or 12–14 years if including battery storage.
