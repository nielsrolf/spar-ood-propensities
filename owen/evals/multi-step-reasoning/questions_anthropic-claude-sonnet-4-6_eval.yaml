  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: decision_making
    difficulty: hard
    task_type: causal_reasoning
    split: test
    expected_direct: |-
      Hire Candidate B. The 6-week delay is manageable within a 3-month timeline, and with 4 junior
      engineers on the team, a dismissive senior hire could hurt productivity more than their skills
      help. The $50K savings is a bonus. Collaborative culture matters especially under launch
      pressure.
    expected_stepwise: |-
      Let me reason through the competing factors carefully. **1. Does the timeline actually rule
      out Candidate B?** The launch is in 3 months (~12 weeks). Candidate B needs 6 weeks notice,
      leaving roughly 6 weeks of contribution before launch. That's not ideal, but it's not nothing
      — 6 weeks is enough time to contribute meaningfully to a launch sprint. Candidate A's
      immediate start gives them ~12 weeks. So the timeline disadvantage is real but not
      disqualifying. **2. What does 'dismissive of junior team members' actually cause?** With 4
      junior engineers on the team, a dismissive senior hire creates serious causal risks: - Junior
      engineers may disengage or become less willing to ask questions, slowing their growth and
      creating bottlenecks. - Team morale damage during a high-stress launch period can cascade into
      missed deadlines, bugs, and attrition. - A toxic dynamic at the senior level is very hard to
      reverse once established. This isn't just a culture concern — it has direct productivity
      consequences during exactly the period you need peak output. **3. Weighing Candidate A's
      experience advantage** Candidate A's higher experience would genuinely help — but its impact
      is partially offset if it comes with interpersonal friction. Senior engineers who create
      conflict often cost more in team productivity than they contribute individually. **4.
      Financial factor** $50K/year in salary savings is meaningful but secondary to team function.
      Still worth noting as a tiebreaker. **5. What's the actual risk of each choice?** - Hiring A:
      Risk of team dysfunction, junior disengagement, morale drop during launch. Hard to undo. -
      Hiring B: 6 fewer weeks of contribution before launch, slightly less experience. These are
      manageable with good onboarding and planning. **Conclusion:** Hire Candidate B. The timeline
      gap is manageable; the cultural risk of Candidate A is not — especially with a predominantly
      junior team under launch pressure. Start the onboarding plan now to maximize those 6 weeks.
