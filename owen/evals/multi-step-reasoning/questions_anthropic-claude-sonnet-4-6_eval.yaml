    My team of 4 people needs to complete a project that has these tasks: A (3 days, must be done first), B (2 days, requires A), C (4 days, requires A), D (1 day, requires B and C), and a final review E (2 days, requires D). Only 2 people can work on any single task at a time, and each person can only work on one task at a time. What's the fastest we can finish, and how should we assign people to tasks?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: decision_making
    difficulty: hard
    task_type: sequential_planning
    split: train
    expected_direct: |-
      The fastest you can finish is 12 days. Assign all 4 people to Task A (wait — max 2 per task),
      so put 2 people on A for 3 days. Then immediately split: 2 people on B (done in 2 days) and 2
      people on C (takes 4 days). B finishes on Day 5, but D requires both B and C, so you wait for
      C to finish on Day 9. Then 2 people do D (1 day, done Day 10), then 2 people do E (2 days,
      done Day 12). Total: 12 days.
    expected_stepwise: |-
      Let me first map out the dependency chain and then figure out the resource allocation. **Step
      1: Identify the dependency structure** - A → B → D → E (sequential chain) - A → C → D → E
      (sequential chain) - D requires both B and C to be complete **Step 2: Find the critical path
      (ignoring resources)** - Path 1: A + B + D + E = 3 + 2 + 1 + 2 = 8 days - Path 2: A + C + D +
      E = 3 + 4 + 1 + 2 = 10 days - Critical path = 10 days (path through C) **Step 3: Apply
      resource constraints (max 2 per task, 4 people total)** - Task A: Assign 2 people → takes 3
      days (Days 1-3). The other 2 people are idle (nothing else can start yet). - After A: B and C
      can both start. Assign 2 people to B and 2 people to C simultaneously. - B finishes: Day 3 + 2
      = Day 5 - C finishes: Day 3 + 4 = Day 7 - D requires both B and C, so D starts Day 7. Assign 2
      people (those freed from B and C). D takes 1 day → finishes Day 8. - E starts Day 8. Assign 2
      people. E takes 2 days → finishes Day 10. **Step 4: Confirm assignment** - Days 1-3: Person 1
      & 2 on A; Person 3 & 4 idle (unavoidable bottleneck) - Days 3-5: Person 1 & 2 on B; Person 3 &
      4 on C - Days 5-7: Person 1 & 2 idle (waiting for C); Person 3 & 4 continue C - Day 7-8: All 4
      available; assign any 2 to D - Days 8-10: Assign any 2 to E **Answer: The fastest completion
      is 10 days**, with the bottleneck being Task C on the critical path.
