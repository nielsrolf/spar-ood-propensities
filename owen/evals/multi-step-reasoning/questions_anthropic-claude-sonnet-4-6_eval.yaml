- id: multi_step_reasoning_057
  paraphrases:
  - |-
    There are three switches outside a room, each controlling one of three light bulbs inside. You can flip the switches however you like, but you can only enter the room once. How can you figure out which switch controls which bulb?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic_puzzles
    difficulty: moderate
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      Turn on switch 1 and leave it on for a few minutes, then turn it off. Turn on switch 2 and
      leave it on. Enter the room: the bulb that's on is controlled by switch 2, the bulb that's
      warm but off is controlled by switch 1, and the cold unlit bulb is controlled by switch 3.
    expected_stepwise: |-
      The challenge is that you can only enter the room once, so you need a way to distinguish all
      three switches using a single observation. A simple on/off state only gives you two pieces of
      information, but heat provides a third. Here's the approach: First, turn on switch 1 and wait
      several minutes — this heats up its bulb. Then turn switch 1 off and turn switch 2 on. Enter
      the room. Now you can identify all three bulbs: the bulb that's currently lit is controlled by
      switch 2 (it's on right now), the bulb that's off but warm to the touch is controlled by
      switch 1 (it was on long enough to heat up), and the bulb that's off and cold is controlled by
      switch 3 (it was never turned on). The key insight is that heat from an incandescent bulb
      persists after it's turned off, giving you a third distinguishable state beyond just on/off.
