      Taylor=Analyst, Jordan=Coordinator - Check all constraints: Jordan≠Lead ✅, Sam≠Analyst ✅,
      Taylor≠Coordinator ✅ — **Also valid!** **Step 3: Both cases are technically valid, but are
      there any tiebreakers?** All three hard constraints are satisfied in both cases. Since
      Taylor's preference (not Coordinator) is honored in both, there's no further distinction from
