    expected_stepwise: |-
      Let me map out both possible strategies and count steps for each. Step 1: Identify the two
      main approaches — filling the 5-gallon jug first, or filling the 3-gallon jug first. Approach
      A (fill 5-gallon first): 1. Fill the 5-gallon jug. (5=5, 3=0) 2. Pour from 5-gallon into
      3-gallon until full. (5=2, 3=3) 3. Empty the 3-gallon jug. (5=2, 3=0) 4. Pour the 2 gallons
      from 5-gallon into 3-gallon. (5=0, 3=2) 5. Fill the 5-gallon jug. (5=5, 3=2) 6. Pour from
      5-gallon into 3-gallon until full (needs 1 gallon). (5=4, 3=3) Result: 5-gallon jug contains
      exactly 4 gallons. Total: 6 steps. Approach B (fill 3-gallon first): 1. Fill the 3-gallon jug.
