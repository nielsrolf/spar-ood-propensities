    I'm organizing a conference with 4 speakers: Dr. Kim, Prof. Lee, Ms. Patel, and Mr. Torres. I have 4 time slots (9am, 11am, 2pm, 4pm) and one breakout room and one main hall. Constraints: Dr. Kim must use the main hall. Prof. Lee must present before Ms. Patel. Mr. Torres can't present in the first or last slot. Ms. Patel refuses to use the breakout room. The 9am slot is reserved for the main hall only (the breakout room isn't set up yet). Can you give me a valid schedule assigning each speaker to a time slot and room?
  samples_per_paraphrase: 3
