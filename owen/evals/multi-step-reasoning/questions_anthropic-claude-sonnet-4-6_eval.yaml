- id: multi_step_reasoning_473
  paraphrases:
  - |-
    A prisoner is given 12 balls that all look identical, but one is either heavier or lighter than the rest. Using a balance scale exactly 3 times, how can they identify the odd ball AND determine if it's heavier or lighter? How many balls can be checked total in 3 weighings?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic_puzzles
    difficulty: very_hard
    task_type: calculation
    split: test
    expected_direct: |-
      With 3 weighings on a balance scale, you can identify the odd ball among up to 12 balls and
      determine whether it's heavier or lighter. The maximum number of balls that can be tested in n
      weighings is (3^n - 3) / 2, so for n=3: (27 - 3) / 2 = 12.
    expected_stepwise: |-
      Let me work through this systematically. Step 1: Determine the theoretical maximum. Each
      weighing has 3 outcomes (left heavy, right heavy, balanced). With 3 weighings, we have 3^3 =
      27 possible outcome sequences. However, for each ball there are 2 possible states (heavier or
      lighter), giving 2×n total cases to distinguish. We also need to account for the fact that we
      must know the direction, so the formula is: max balls = (3^n - 3) / 2. Step 2: Plug in n=3:
      (3^3 - 3) / 2 = (27 - 3) / 2 = 24 / 2 = 12. Step 3: Verify with the classic strategy. Divide
      12 balls into three groups of 4: A, B, C. - Weighing 1: Weigh A (4 balls) vs B (4 balls). - If
      balanced: odd ball is in C. Proceed to narrow down 4 balls in 2 weighings. - If unbalanced:
      odd ball is in A or B, and we know which side was heavy. - Weighing 2 & 3: Use the information
      gained to narrow down to individual balls and confirm heavy/light status. Each branch of the
      decision tree resolves to exactly one ball and its status within the remaining 2 weighings,
      confirming 12 is both the theoretical maximum and achievable in practice.
