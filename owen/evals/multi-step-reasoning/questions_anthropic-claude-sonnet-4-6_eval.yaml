- id: multi_step_reasoning_502
  paraphrases:
  - |-
    My server's average response time jumped from 120ms to 890ms after deploying a new feature yesterday. The feature added a database call that runs a JOIN across three tables: orders (2M rows), customers (500K rows), and products (80K rows). The JOIN uses non-indexed foreign keys. Each API request now triggers an average of 12 of these queries. My database server has 16 CPU cores running at 78% utilization, and my connection pool is set to 50 connections. If each unoptimized JOIN takes roughly 65ms on its own, what is the theoretical total added latency per request just from these new database calls, and by how much does this explain the observed slowdown?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: very_hard
    task_type: calculation
    split: test
    expected_direct: |-
      12 queries × 65ms = 780ms of added latency per request. Your baseline was 120ms, so the
      expected total would be 900ms, which nearly perfectly explains the observed 890ms — the new
      unindexed JOIN queries account for essentially all of the slowdown.
    expected_stepwise: |-
      Let me work through this systematically. Step 1: Calculate the raw added latency from the new
      queries. Each new JOIN query takes 65ms, and each API request triggers 12 of these queries.
      Assuming they run sequentially (the most common default): 12 × 65ms = 780ms added per request.
      Step 2: Calculate the expected total response time. Original baseline: 120ms Added latency
      from new queries: 780ms Expected new response time: 120ms + 780ms = 900ms Step 3: Compare to
      the observed slowdown. Observed response time: 890ms Expected response time: 900ms Difference:
      only 10ms — essentially a perfect match within measurement noise. Step 4: Assess whether this
      fully explains the issue. The new database queries account for 780ms out of the 770ms increase
      (890 - 120 = 770ms), which is 780/770 ≈ 101% — the math lines up almost exactly. The tiny
      discrepancy could be measurement variance or slight parallelism in query execution.
      Conclusion: The 12 unindexed JOIN queries at 65ms each (780ms total) almost entirely explain
      the jump from 120ms to 890ms. Adding indexes on the foreign keys used in the JOIN should bring
      those queries down dramatically and restore normal response times.
- id: multi_step_reasoning_503
  paraphrases:
  - |-
    My laptop fan is always running at full speed. I checked and it started happening after I installed two things on the same day: a new antivirus program and a graphics driver update. How do I figure out which one is causing the problem?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: moderate
    task_type: comparison
    split: test
    expected_direct: |-
      Disable the antivirus first and see if the fan calms down. Antivirus software is much more
      likely to cause high CPU usage than a graphics driver update, which mainly affects GPU
      workload. If disabling it doesn't help, roll back the driver.
    expected_stepwise: |-
      To isolate the cause, compare the two candidates. First, consider what each change affects:
      antivirus software runs continuously in the background scanning files, which can heavily load
      the CPU and cause the fan to spin up. A graphics driver update primarily changes how the GPU
      operates, which would more likely cause GPU fan issues rather than the main system fan.
      Second, check Task Manager (Ctrl+Shift+Esc) and look at which process is consuming the most
      CPU — if it's your antivirus process, that's your culprit. Third, to confirm, temporarily
      disable the antivirus real-time protection and watch whether the fan speed drops. If it does,
      the antivirus is the problem. If the fan stays loud, re-enable the antivirus and roll back the
      graphics driver through Device Manager. Given the typical behavior of each type of software,
      the antivirus is the more likely cause, so start there.
- id: multi_step_reasoning_504
  paraphrases:
  - |-
    We have a distributed system with three microservices: Auth, Orders, and Inventory. Suddenly, about 5% of order placements are failing with a timeout, but only during peak hours. Each service has its own database. Auth and Inventory look healthy in our dashboards. The Orders service shows normal CPU and memory. We don't see any errors in any service's logs — just the client-side timeouts. Where should I look and what's most likely causing this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: very_hard
    task_type: causal_reasoning
    split: test
    expected_direct: |-
      The most likely culprit is the Orders database, not the service itself. The Orders service
      appearing healthy (normal CPU/memory) while requests silently time out is a classic sign of
      database connection pool exhaustion or slow queries under load. During peak hours, queries
      take longer, connections are held open, and the pool fills up — new requests queue and
      eventually time out without ever throwing an application error. Check your Orders DB
      connection pool metrics, slow query logs, and lock wait times. Also check network latency
      between Orders and its database.
    expected_stepwise: |-
      Let's systematically narrow down the cause by reasoning through what we know. Step 1 —
      Interpret the 5% failure rate during peak hours only: The intermittent, load-dependent nature
      tells us this isn't a consistent bug or misconfiguration — it's a resource contention problem
      that only manifests when traffic is high. Something is exhausting a limited resource under
      load. Step 2 — Interpret the lack of errors in service logs: This is the most important clue.
      If the Orders service were crashing or throwing exceptions, we'd see errors. Silence in the
      logs combined with client-side timeouts means the Orders service is receiving requests and
      either processing them very slowly or is stuck waiting for something downstream — and that
      wait exceeds the client's timeout before any error is logged. Step 3 — Rule out Auth and
      Inventory: Both look healthy. But 'healthy dashboards' often mean CPU/memory/request rate look
      normal. The Orders service could still be waiting on them — however, since only 5% fail and
      Auth/Inventory appear fine, they're less likely the primary cause. If Inventory were slow,
      we'd probably see it in Inventory's own latency metrics. Step 4 — Focus on the Orders
      service's hidden dependencies: Normal CPU and memory in the Orders service means the
      application process itself isn't the bottleneck. The bottleneck must be I/O — most likely the
      Orders database. The service is probably stuck waiting for DB responses, not consuming CPU
      while it waits, which explains the healthy-looking metrics. Step 5 — Identify the most likely
      database-side failure mode: Under peak load, two things commonly happen: (a) connection pool
      exhaustion — each slow query holds a connection longer, peak traffic means more concurrent
      queries, and eventually all pool connections are in use; new requests queue and time out
      silently waiting for a free connection. (b) Lock contention — high write volume on Orders
      tables can cause row or table locks, making other queries wait indefinitely. Step 6 — Explain
      why only 5% fail: If the pool has, say, 20 connections and peak traffic occasionally spikes to
      need 22, only those overflow requests time out — giving you a small failure percentage that
      correlates with traffic bursts. Conclusion: Check the Orders database first — specifically:
      connection pool utilization (look for saturation events), slow query logs during peak windows,
      lock wait statistics, and network latency between the Orders service and its DB. This is
      almost certainly a database-layer bottleneck invisible to the application-level dashboards.
