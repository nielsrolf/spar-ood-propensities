- id: multi_step_reasoning_327
  paraphrases:
  - |-
    I'm deciding whether to pay off my $18,000 car loan at 6.5% interest (36 months remaining) or invest that money in an index fund averaging 9% annual returns. Ignoring taxes, which option leaves me better off financially, and by how much?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: analysis
    difficulty: hard
    task_type: calculation
    split: train
    expected_direct: |-
      Investing beats paying off the loan by roughly $1,200. The loan costs you about $1,900 in
      remaining interest, while the investment grows by about $3,100 over 3 years, giving a net
      advantage of around $1,200 in favor of investing.
    expected_stepwise: |-
      Let me figure out the cost of the loan versus the return on investment over the remaining 36
      months. **Cost of keeping the loan (remaining interest paid):** Using an amortization approach
      — $18,000 at 6.5% over 36 months: - Monthly rate: 6.5% / 12 = 0.5417% - Monthly payment:
      18,000 × [0.005417 × (1.005417)^36] / [(1.005417)^36 − 1] - (1.005417)^36 ≈ 1.2135 - Payment =
      18,000 × (0.005417 × 1.2135) / (1.2135 − 1) = 18,000 × 0.006573 / 0.2135 ≈ $554/month - Total
      paid: $554 × 36 = $19,944 - Total interest paid: $19,944 − $18,000 = **~$1,944** **Return from
      investing $18,000 at 9% for 3 years:** - Future value: $18,000 × (1.09)^3 = $18,000 × 1.2950 =
      $23,310 - Gain: $23,310 − $18,000 = **~$3,310** **Net advantage of investing:** $3,310
      (investment gain) − $1,944 (interest cost) = **~$1,366 in favor of investing** So investing
      the $18,000 leaves you roughly $1,300–$1,400 better off than paying off the loan early,
      assuming the 9% return holds. However, the loan payoff is a guaranteed 6.5% 'return' while the
      investment involves market risk.
- id: multi_step_reasoning_328
  paraphrases:
  - |-
    Two countries, Alduria and Bremovia, share a river that originates in Alduria and flows into Bremovia. Alduria builds a large dam upstream. Within two years, Bremovia's coastal fishing industry collapses, its downstream farmland suffers severe soil degradation, and there is a dramatic increase in waterborne disease outbreaks in riverside villages. How did the dam in Alduria cause these three distinct problems in Bremovia?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: analysis
    difficulty: hard
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      The dam reduced the river's flow and blocked sediment transport. Less water and sediment
      reaching the coast killed off the fish habitat and delta ecosystem, collapsing the fishing
      industry. Without regular sediment deposits, farmland downstream lost fertility and its soil
      structure degraded. The reduced flow also meant less dilution of pollutants and stagnant water
      pooling, creating breeding conditions for pathogens and waterborne disease. All three effects
      trace back to the dam interrupting the natural hydrology and sediment cycle of the river.
    expected_stepwise: |-
      Let's work through how one upstream intervention produces three distinct downstream crises.
      **Step 1: Understand what a dam does to a river system.** A dam traps water and, critically,
      traps sediment. Rivers naturally carry enormous loads of silt, nutrients, and organic
      material. When a dam is built, sediment settles in the reservoir and never reaches downstream.
      Flow volume and timing also change—peak floods are suppressed, dry-season flows may increase
      or decrease depending on dam operation. **Step 2: Trace the cause of the coastal fishing
      collapse.** River deltas and coastal estuaries depend on nutrient-rich sediment from upstream
      to sustain the base of the food chain (algae, invertebrates, juvenile fish habitat). With
      sediment blocked by the dam, the delta starves. Coastal wetlands and mangroves erode without
      sediment replenishment. The nursery habitat for fish disappears, and the nutrient load that
      fed the fishery dries up—collapsing the industry within a few years. **Step 3: Trace the cause
      of farmland soil degradation.** For millennia, seasonal river flooding deposited fresh,
      nutrient-rich sediment on Bremovia's floodplain—a process that naturally fertilized and
      renewed soil structure. The dam eliminates those flood pulses. Without annual sediment
      deposits, soil loses organic matter and fertility. Over time, the soil structure itself breaks
      down, becoming compacted or saline (especially if irrigation continues without the natural
      flushing floods provided), causing the observed degradation. **Step 4: Trace the cause of
      waterborne disease outbreaks.** This operates through two related mechanisms. First, reduced
      river flow means less dilution of agricultural runoff, sewage, and other contaminants in
      riverside water sources that communities drink from. Second, slower-moving or stagnant water
      in irrigation channels and low-lying areas creates ideal breeding grounds for disease vectors
      like mosquitoes (malaria, dengue) and conditions for pathogens like cholera. The dam's
      disruption of natural flushing cycles turns once-dynamic waterways into disease incubators.
      **Step 5: Unified conclusion.** All three harms share a single root cause: the dam severs the
      natural flow of water, sediment, and nutrients that downstream ecosystems and communities
      depended on. The coastal ecosystem lost its nutrient foundation, farmland lost its renewal
      mechanism, and human water supplies lost their natural dilution and flushing—each a different
      expression of the same upstream intervention.
- id: multi_step_reasoning_329
