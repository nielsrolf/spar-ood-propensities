- id: multi_step_reasoning_417
  paraphrases:
  - |-
    I have four suspects in a theft case. Alice says she was with Bob all evening. Bob says he was alone. Carol says she saw Dave near the vault at 9pm. Dave says Carol is lying and he was at home. Only one person is telling the truth, and that person is the thief. Who stole it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic_puzzles
    difficulty: very_hard
    task_type: comparison
    split: test
    expected_direct: |-
      Dave is the thief. If Dave is the only one telling the truth, then Carol is lying (meaning she
      did NOT see Dave near the vault), Alice is lying (she was NOT with Bob), and Bob is lying (he
      was NOT alone). Dave's claim that Carol is lying is consistent with Carol actually lying — so
      Dave's statement is the one true statement, making Dave the thief.
    expected_stepwise: |-
      Let me test each suspect as the sole truth-teller: **Assume Alice is the truth-teller (and
      thief):** Alice says she was with Bob. But Bob says he was alone — and Bob must be lying. If
      Bob is lying, he wasn't alone, which is consistent with Alice's claim. However, Carol says she
      saw Dave near the vault — Carol must be lying, so Dave was NOT near the vault. Dave says Carol
      is lying — that would make Dave's statement TRUE. But we assumed only Alice tells the truth,
      so Dave can't also be telling the truth. Contradiction. Alice is not the thief. **Assume Bob
      is the truth-teller (and thief):** Bob says he was alone. Alice says she was with Bob — Alice
      must be lying, so she was NOT with Bob. That's consistent with Bob being alone. Carol says she
      saw Dave near the vault — Carol is lying, so Dave wasn't near the vault. Dave says Carol is
      lying — that makes Dave's statement TRUE. Again two truth-tellers (Bob and Dave).
      Contradiction. Bob is not the thief. **Assume Carol is the truth-teller (and thief):** Carol
      says she saw Dave near the vault. Dave says Carol is lying — Dave must be lying, meaning Carol
      is NOT lying. That's consistent. Alice says she was with Bob — Alice is lying, so she wasn't
      with Bob. Bob says he was alone — Bob is lying, so he wasn't alone. So far so good. But wait:
      Dave's statement ('Carol is lying') is false, and Alice's and Bob's are also false. Carol's is
      true. Only one truth-teller — this seems consistent at first! But let's double-check: if Bob
      wasn't alone, who was he with? Not Alice (she's lying about being with him). This doesn't
      create a contradiction on its own, but notice — nothing forces Carol to be the thief. The
      puzzle says the truth-teller IS the thief, so let's hold this as a candidate. **Assume Dave is
      the truth-teller (and thief):** Dave says Carol is lying. So Carol's statement ('I saw Dave
      near the vault') is false — Dave was NOT near the vault. Alice says she was with Bob — Alice
      is lying, so she wasn't with Bob. Bob says he was alone — Bob is lying, so he wasn't alone.
      Only Dave tells the truth. No contradictions arise. Dave is a valid candidate. **Comparing
      Carol vs. Dave:** Going back to Carol as truth-teller: Carol says she saw Dave near the vault.
      If that's true, Dave was near the vault. Dave says Carol is lying — that's false (Dave is
      lying). Alice is lying (not with Bob). Bob is lying (not alone). This is internally consistent
      too. So we have two candidates? Let me re-examine. The puzzle states the truth-teller IS the
      thief. If Carol is the truth-teller, she placed Dave near the vault — but that's irrelevant to
      who the thief is since the thief is the truth-teller (Carol). If Dave is the truth-teller,
      he's the thief. Both scenarios seem consistent with the logical constraints alone. However,
      there's a subtle issue with Carol's scenario: Bob says he was alone (a lie), meaning someone
      was with him. Alice says she was with Bob (a lie), meaning she was NOT with Bob. So Bob wasn't
      alone but also wasn't with Alice — who was he with? This introduces an unexplained party,
      making the scenario less clean but not strictly impossible. In Dave's scenario: Alice wasn't
      with Bob (lie), Bob wasn't alone (lie) — same issue. So both scenarios have this loose end
      equally. The key differentiator: in logic puzzles of this type, the intended unique solution
      requires that exactly one scenario produces no contradictions. Re-examining Carol's case more
      carefully — Carol claims to have seen Dave near the vault. If Carol is the truth-teller/thief,
      she was presumably at the vault herself committing the theft, yet her statement is about
      observing Dave, not about her own alibi. Dave's statement directly calls Carol a liar — and if
      Dave is lying about that, it confirms Carol's truthfulness cleanly. Both still hold up. Given
      the puzzle's structure and the principle of selecting the answer that produces a unique, clean
      solution, **Dave is the thief**. Dave's statement ('Carol is lying') is the one true
      statement. All others are false, no external dependencies are introduced, and the solution is
      self-contained.
- id: multi_step_reasoning_418
  paraphrases:
  - |-
    I'm a landlord trying to decide whether to sell my rental property now or hold it for 5 more years. The property is worth $500,000 today and appreciates at about 3% per year. I owe $200,000 on the mortgage at 4% interest. It generates $24,000/year in rent but costs $14,000/year in expenses (maintenance, taxes, insurance). If I sell today I'd owe capital gains tax on $150,000 of profit (at 20%). If I hold for 5 years, assume the same tax rate applies later. My alternative is to invest the sale proceeds in an index fund averaging 7% per year. Should I sell now or hold?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: decision_making
    difficulty: very_hard
    task_type: causal_reasoning
    split: test
    expected_direct: |-
      You should probably sell now and invest in the index fund. After taxes, you'd net around
      $320,000 from the sale, which grows to roughly $449,000 in the index fund over 5 years.
      Holding the property gives you about $580,000 in value after 5 years, but after paying off the
      remaining mortgage and capital gains tax on the larger gain, your net is in a similar range —
      and the index fund wins or is very close while requiring far less effort and risk. The 7%
      index return outpaces the 3% property appreciation once you account for taxes and the
      opportunity cost of tied-up equity.
    expected_stepwise: |-
      This requires comparing two financial paths carefully. Let me work through each. --- **Option
      A: Sell Now** Step 1 — Calculate net proceeds from sale today: - Sale price: $500,000 -
      Mortgage payoff: $200,000 - Gross equity: $300,000 - Capital gains tax: 20% × $150,000 =
      $30,000 - Net proceeds after tax and mortgage: $300,000 - $30,000 = **$270,000** Step 2 — Grow
      that in an index fund at 7%/year for 5 years: - $270,000 × (1.07)^5 = $270,000 × 1.4026 ≈
      **$378,700** --- **Option B: Hold for 5 Years** Step 3 — Project property value in 5 years at
      3% appreciation: - $500,000 × (1.03)^5 = $500,000 × 1.1593 ≈ **$579,600** Step 4 — Calculate
      annual cash flow from holding: - Rent income: $24,000/year - Operating expenses: $14,000/year
      - Mortgage payment: At 4% on $200,000 with (let's assume) remaining term ~20 years, annual
      payment ≈ $14,500/year (rough estimate for interest + principal) - Net cash flow ≈ $24,000 -
      $14,000 - $14,500 ≈ **-$4,500/year** (slightly cash-flow negative) - Over 5 years: -$22,500 in
      net cash outflows Step 5 — Estimate mortgage balance in 5 years: - Rough estimate: paying down
      principal slowly at 4%, balance drops from $200,000 to approximately $175,000 after 5 years
      Step 6 — Calculate net proceeds if sold in 5 years: - Sale price: $579,600 - Mortgage payoff:
      ~$175,000 - Gross equity: ~$404,600 - Capital gain at that point: assume original basis means
      gain is now ~$229,600 (appreciation from purchase price) - Actually, gain = sale price minus
      original purchase price basis. Original basis = $500,000 - $150,000 profit already accrued =
      $350,000 purchase price - Gain in year 5: $579,600 - $350,000 = $229,600 - Capital gains tax:
      20% × $229,600 = $45,920 - Net after tax and mortgage: $579,600 - $175,000 - $45,920 =
      **$358,680** - Subtract the $22,500 in net cash outflows over 5 years: $358,680 - $22,500 =
      **$336,180** --- **Comparison:** - Sell now + index fund: **~$378,700** - Hold 5 years:
      **~$336,180** **Causal explanation for why selling wins:** The 3% property appreciation
      doesn't beat the 7% index return, especially once you factor in the property being slightly
      cash-flow negative and the deferred taxes growing on a larger gain. The equity locked in the
      property is effectively earning less than it would in the market, and the negative cash flow
      compounds the disadvantage. **Conclusion: Sell now and invest the proceeds.** The index fund
      path yields roughly $40,000 more over 5 years with significantly less management burden and
      risk. If you had strong positive cash flow the calculus might differ, but at $10,000 net
      operating income against $200,000 of equity that's only a 5% cash-on-cash return before
      accounting for mortgage payments.
