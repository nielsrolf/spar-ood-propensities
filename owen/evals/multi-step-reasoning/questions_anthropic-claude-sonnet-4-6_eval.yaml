    I have a team of 4 developers for a 3-month project. Developer A can only work 50% time (20 hrs/week), Developers B and C are full-time (40 hrs/week each), and Developer D is joining 6 weeks in at full-time. The project has 1,200 hours of work total, but 300 of those hours can't start until the first 400 hours are complete. We work 12-week sprints. Can we finish on time, and if not, how many extra weeks do we need?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: planning
    difficulty: very_hard
    task_type: sequential_planning
    split: test
    expected_direct: |-
      You'll finish in approximately 13.6 weeks, so you'll need about 2 extra weeks beyond the
      12-week deadline. The bottleneck is that the second batch of 300 hours can't start until 400
      hours are done, which takes about 4.3 weeks, and total capacity slightly undershoots the
      12-week target.
    expected_stepwise: |-
      Let me break this into phases based on the dependency constraint. **Step 1: Calculate weekly
      team capacity by phase.** - Weeks 1–6: A (20) + B (40) + C (40) = 100 hrs/week. Developer D
      not yet on board. - Weeks 7–12: A (20) + B (40) + C (40) + D (40) = 140 hrs/week. **Step 2:
      Figure out when the first 400 hours are done (unlocking the 300-hour block).** - Weeks 1–6
      provide 6 × 100 = 600 hours of capacity. - We need 400 hours done before the blocked work
      starts. - 400 hours ÷ 100 hrs/week = 4 weeks to hit 400 hours. - So the 300 blocked hours can
      begin at the start of Week 5. **Step 3: Lay out what's happening in parallel from Week 5
      onward.** - The remaining 'free' work after 400 hrs = 1,200 − 400 − 300 = 500 hours. - By end
      of Week 4: 400 hours done. Remaining: 500 + 300 = 800 hours. - Week 5–6 (still pre-D): 2 weeks
      × 100 = 200 hours done. Remaining: 600 hours. - Week 7 onward: 140 hrs/week. 600 ÷ 140 ≈ 4.3
      weeks needed. - Completion week: 6 + 4.3 ≈ 10.3 weeks. Wait — let me recheck total capacity.
      **Step 4: Verify total capacity vs. total work.** - Weeks 1–6: 600 hrs. Weeks 7–12: 6 × 140 =
      840 hrs. Total = 1,440 hrs available in 12 weeks. - Total work = 1,200 hrs. So capacity is
      sufficient — but does the dependency cause a delay? **Step 5: Re-examine the dependency
      bottleneck carefully.** - Weeks 1–4: 400 hrs of Phase 1 work completed (capacity = 400, used
      fully). - Week 5–6: Remaining Phase 1 work = 500 hrs (free) + 300 hrs (now unlocked) = 800 hrs
      remain. Team does 200 hrs. Remaining: 600 hrs. - Weeks 7 onward at 140 hrs/week: 600 ÷ 140 =
      4.29 weeks → finishes mid-Week 11.3. **Conclusion:** The project finishes around Week 11.3 —
