- id: multi_step_reasoning_181
  paraphrases:
  - |-
    A React component that fetches and displays user data works perfectly in development but shows a blank screen in production with no visible errors in the browser console. The network tab shows the API calls returning 200 with correct data. What should I check?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: hard
    task_type: constraint_satisfaction
    split: train
    expected_direct: |-
      Key things to check: (1) a runtime JavaScript error is being swallowed — add an ErrorBoundary
      component to catch and display render errors; (2) the production build is minified and may be
      hitting an issue with class property names or environment-specific polyfills; (3) an
      environment variable (like REACT_APP_API_URL) is undefined in production, causing a crash; (4)
      the component renders null due to a conditional based on data shape that differs subtly
      between dev and prod API responses. Open the browser's Sources panel and look for unhandled
      promise rejections or enable source maps in the production build to get readable stack traces.
    expected_stepwise: |-
      Let's work through this carefully. The constraints are: works in dev, blank in prod, no
      console errors, API returns 200 with correct data. Step 1 — Determine if there actually are
      errors being suppressed. 'No visible errors' doesn't mean no errors. In React 16+, an uncaught
      error during rendering causes the entire component tree to unmount, leaving a blank screen —
      but the error is only shown in development mode. In production, React unmounts silently. Open
      DevTools, go to the Console tab, and set the filter to show 'All levels'. Also check the
      Sources tab for unhandled promise rejections. If you find one, you've found your bug. Step 2 —
      Add an ErrorBoundary immediately. Wrap your top-level component in an ErrorBoundary that
      renders fallback UI and logs the error. Deploy this to production. On the next blank screen,
      it will tell you exactly what crashed and where. Step 3 — Check environment variables. React
      production builds often differ from development in which env vars are defined. If your
      component references `process.env.REACT_APP_SOMETHING` and that variable isn't set in your
      production build pipeline, it will be undefined, potentially causing a crash during render.
      Compare your .env.development and .env.production files (or CI/CD environment variable
      settings). Step 4 — Inspect the actual API response data shape in production. The network tab
      shows 200 and 'correct data,' but compare the production response payload field-by-field
      against development. A subtle difference — an extra wrapper object, a null field, a
      differently named key — can cause your component to try to render `undefined.someProperty`,
      throwing a runtime error. Step 5 — Enable source maps for the production build. Add
      `GENERATE_SOURCEMAP=true` to your production build command, deploy once, and reproduce the
      blank screen. Now any errors in DevTools will point to readable source code instead of
      minified gibberish. Step 6 — Check for minification-related issues. Some code patterns that
      work in development break after minification — for example, relying on `Function.name`, using
      eval-based patterns, or having dependencies that aren't compatible with tree-shaking. Review
      any warnings during the production build output. Conclusion: The most likely cause is a silent
      React render error unmounting the tree (Step 1). Add an ErrorBoundary (Step 2) and enable
      source maps (Step 5) to identify the exact crash. A data shape mismatch (Step 4) or missing
      environment variable (Step 3) is the typical root cause once you can see the actual error
      message.
