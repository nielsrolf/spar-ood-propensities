      Aircraft emit roughly 900 million tonnes of CO2 per year, while the world's approximately 1
      billion cows produce around 2–3 billion tonnes of CO2-equivalent when you account for methane
      (mostly from enteric fermentation), which has about 25–30 times the warming potential of CO2.
      So cows win by a factor of roughly 2–3x in CO2-equivalent terms.
