- id: multi_step_reasoning_451
  paraphrases:
  - |-
    My Wi-Fi keeps dropping every few hours, but only on my laptop — my phone stays connected fine. I've already restarted the router once. What should I do to fix this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: moderate
    task_type: sequential_planning
    split: test
    expected_direct: |-
      Since only your laptop is affected, the issue is likely a driver or power management problem,
      not the router. Update your Wi-Fi driver, then disable power saving mode for your wireless
      adapter in Device Manager (under Network Adapters > Properties > Power Management, uncheck
      'Allow the computer to turn off this device to save power'). If it still drops, try forgetting
      and rejoining the network, or assign your laptop a static IP to rule out DHCP conflicts.
    expected_stepwise: |-
      Since your phone stays connected but your laptop doesn't, we can rule out the router itself as
      the core problem — the issue is specific to your laptop. Here's how to work through it: 1.
      **Check the Wi-Fi driver first.** Outdated or buggy drivers are the most common cause of
      intermittent drops on a single device. Go to Device Manager, find your network adapter, and
      update the driver (or download the latest from the manufacturer's site). 2. **Disable power
      management on the adapter.** Windows often turns off the Wi-Fi adapter to save power, which
      causes periodic drops. In Device Manager, right-click your wireless adapter > Properties >
      Power Management tab > uncheck 'Allow the computer to turn off this device to save power.' 3.
      **Forget and reconnect to the network.** Sometimes a corrupted network profile causes
      instability. Forget the Wi-Fi network and reconnect fresh. 4. **Rule out IP conflicts.** If
      the drops happen at regular intervals (e.g., every few hours), your laptop's DHCP lease may be
      expiring or conflicting. Try assigning a static IP address to avoid this. Start with steps 1
      and 2 — they resolve the majority of laptop-only Wi-Fi drop issues. If those don't work, move
      to 3 and 4.
