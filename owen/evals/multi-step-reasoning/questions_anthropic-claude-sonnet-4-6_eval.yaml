    I have three friends: Alice, Bob, and Carol. Alice always tells the truth, Bob always lies, and Carol does one or the other. One of them said 'I am Bob.' Who said it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic_puzzles
    difficulty: easy
    task_type: constraint_satisfaction
    split: train
    expected_direct: |-
      Carol said it. Alice can't say she's Bob (she'd be lying), and Bob can't say he's Bob (he'd be
      telling the truth). Only Carol, who can do either, could have said it.
    expected_stepwise: |-
      Let me check each person against the constraints: 1. Could Alice have said it? Alice always
      tells the truth, so she would only say 'I am Bob' if she actually were Bob — but she's Alice,
      so she couldn't have said it. 2. Could Bob have said it? Bob always lies, so he would only say
      'I am Bob' if he were NOT Bob — but he IS Bob, so saying it would be the truth, which he can't
      do. So Bob couldn't have said it either. 3. Could Carol have said it? Carol can either tell
      the truth or lie, so there's no constraint blocking her. She could say 'I am Bob' as a lie,
      which satisfies her role perfectly. Answer: Carol said it.
