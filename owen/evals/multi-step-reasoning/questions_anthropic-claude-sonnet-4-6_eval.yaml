  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: decision_making
    difficulty: very_hard
    task_type: sequential_planning
    split: test
    expected_direct: |-
      Hire Candidate B. They're within budget, have strong coding skills and culture fit, and the
      scale gap can be addressed through onboarding. For onboarding: Week 1 focus on codebase and
      architecture walkthroughs with a senior team member. Weeks 2–4 assign a scale-focused project
      with close mentorship. Month 2 give them ownership of a mid-complexity system with support. By
      Month 3 they should be contributing to design reviews and beginning to mentor junior
      teammates, with explicit checkpoints on scale-related learning goals.
    expected_stepwise: |-
      Let me evaluate each candidate against the key criteria before making a decision, then plan
      onboarding. **Step 1: Identify the decision criteria and weights** - Budget: Hard constraint
      ($170K max) - Team needs: Mentorship capacity (team is under-leveled) — high priority -
      Technical skills: Coding + system design at scale — high priority - Collaboration: Team is
      highly collaborative — high priority - Experience: Years and scale exposure — medium priority
      **Step 2: Apply the hard constraint (budget)** - Candidate A: Wants $180K → OVER BUDGET.
      Unless negotiable, this is disqualifying. - Could you negotiate down? Possibly, but $10K gap
      is significant and they may decline or feel undervalued, increasing flight risk. Flag as
      risky. - Candidate B: $155K ✓ - Candidate C: $165K ✓ **Step 3: Evaluate Candidate C against
      soft constraints** - Red flags about preferring solo work in a highly collaborative team is a
      serious culture mismatch. - Culture fit problems compound over time — they affect team morale,
      slow down projects, and are very hard to fix post-hire. - Strong technical skills (coding +
      system design) are a genuine plus, but culture fit is often cited as the #1 factor in
      long-term retention and team performance. - Verdict: The solo-work preference is a significant
      risk. Unless there's strong reason to believe it's addressable (e.g., they said they're open
      to changing), this is a meaningful strike. **Step 4: Evaluate Candidate A more carefully** -
      Mediocre coding interview is concerning for a 'senior' hire on an under-leveled team — you
      need someone who can raise the bar. - Budget overage adds financial and morale risk. - System
      design skills are excellent, which matters at 10M+ DAU scale. - But the combination of
      over-budget + weak coding interview makes this a risky choice. If you can't negotiate the
      salary down AND they interview poorly on the most day-to-day skill, this is hard to justify.
      **Step 5: Evaluate Candidate B** - $155K: well within budget, leaving $15K buffer. - Strong
      coding skills: directly what an under-leveled team needs to learn from. - Good culture fit:
      crucial for a collaborative team. - Scale gap (never worked at 10M+ DAU): This is the main
      risk. But scale knowledge is learnable — it's architectural patterns, infrastructure
      familiarity, and judgment built over time. Strong coding fundamentals + culture fit +
      mentorship capacity is a better foundation than the reverse. - 6 years of experience is still
      senior-level. **Step 6: Make the decision** Ranking: B > C > A (with A potentially
      reconsidered only if salary is negotiable AND coding skills gap is addressed in follow-up)
      **Decision: Hire Candidate B.** Rationale: Budget-friendly, strong in the skills your
      under-leveled team most needs to observe (coding), excellent culture fit for a collaborative
      environment, and the scale gap is a manageable, addressable risk. **Step 7: Build the
      onboarding plan to close the scale gap** *Week 1 — Orientation and architecture immersion* -
      Pair with a senior engineer (or you) for full codebase walkthrough - Deep dive into current
      system architecture: how the platform handles 10M+ DAU, traffic patterns, failure modes - No
      production responsibilities yet; focus is learning *Weeks 2–4 — Guided ramp-up* - Assign
