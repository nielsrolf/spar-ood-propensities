- id: multi_step_reasoning_148
  paraphrases:
  - |-
    I want to move from a senior software engineer role to a product manager role at a new company. I have no formal PM experience but I've led several cross-functional projects and have strong technical knowledge. What's the most realistic path to making this transition, and in what order should I take steps?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: analysis
    difficulty: hard
    task_type: sequential_planning
    split: train
    expected_direct: |-
      The most realistic path: First, build a PM portfolio by documenting 2–3 of your
      cross-functional projects as case studies framed in PM terms (problem, discovery, tradeoffs,
      outcome). Second, get informal PM exposure at your current job — volunteer to own a roadmap
      item or work alongside PMs. Third, pursue an APM or associate PM program, or target companies
      that specifically value technical PMs. Finally, network into referrals at target companies
      since PM hiring is highly referral-driven. Lead with your technical background as a
      differentiator, not an apology.
    expected_stepwise: |-
      Let me think through the core challenge first, then sequence the steps logically. Core
      challenge: PM roles are hard to break into without the 'PM' title on your resume, but you have
      two real assets — cross-functional leadership experience and technical depth. The goal is to
      reframe what you have and fill the visible gaps recruiters look for. Step 1 — Diagnose what's
      missing vs. what you have: - Missing: PM title, product metrics ownership, formal
      roadmap/prioritization experience - Have: Technical credibility, stakeholder management,
      project leadership, systems thinking Step 2 — Address the portfolio gap first (before applying
      anywhere): Rewrite 2–3 of your cross-functional projects as PM case studies. Use PM framing:
      what problem were you solving, what did you learn from users/stakeholders, what tradeoffs did
      you make, what was the measurable outcome? This gives you concrete artifacts to show in
      interviews. Step 3 — Get real PM exposure while still employed: Talk to your manager about
      owning a product initiative, writing a PRD, or shadowing PMs. Even a small amount of
      on-the-job PM work strengthens your story significantly and costs you nothing. Step 4 — Target
      the right companies and roles: Look for companies that value technical PMs (developer tools,
      infrastructure, B2B SaaS), APM programs that accept career changers, or startups where the
      PM/engineer line is blurry. Avoid consumer PM roles at large companies where pure product
      competition is fierce. Step 5 — Network strategically: PM hiring is heavily referral-driven.
      Connect with PMs who came from engineering backgrounds — they're your strongest advocates.
      LinkedIn outreach with a specific, genuine message tends to work well here. Step 6 — Apply and
      iterate on your story: Your interview narrative should position technical depth as a
      superpower, not a detour. Practice articulating product decisions, not just technical ones.
      Conclusion: The order matters — build the portfolio and get internal exposure first, then
      network and target the right companies, then apply. Skipping straight to applications without
      the case studies and narrative ready is the most common mistake in this transition.
