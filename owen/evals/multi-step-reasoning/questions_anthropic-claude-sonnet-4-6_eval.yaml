      balance preference - Risk tolerance: Offer B is higher risk/reward **Recommendation:** Offer A
      is the better fit given your values. The financial advantage is real, the lifestyle benefit is
      substantial, and the equity in Offer B would need to be worth at least $600K+ at exit just to
      break even financially — which is possible but far from certain.
- id: multi_step_reasoning_094
  paraphrases:
  - |-
    My Node.js API is slower than expected. I profiled it and found two bottlenecks: one is a synchronous file read that takes about 50ms and runs on every request, and the other is a database query that takes 200ms but only runs when a user updates their profile, which happens rarely. Which bottleneck should I tackle first?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: moderate
    task_type: comparison
    split: train
    expected_direct: |-
      Fix the synchronous file read first. Even though it's only 50ms, it blocks the event loop on
      every single request, which can stall your entire server under load. The slow database query
      only fires rarely and doesn't block the event loop.
    expected_stepwise: |-
      To decide which to fix first, compare them on impact and nature of the bottleneck. Start with
      the synchronous file read: it's 50ms and runs on every request. In Node.js, synchronous I/O
      blocks the entire event loop, meaning while that file is being read, no other requests can be
      processed at all. Under moderate traffic, this compounds quickly — 100 concurrent requests
      each waiting 50ms creates severe queuing. Now consider the database query: 200ms sounds worse
      in isolation, but it only runs on rare profile updates, so the total time it consumes across
      all traffic is very small. Crucially, if it's an async database call (which it likely is), it
      doesn't block the event loop anyway. Comparing the two: the sync file read has a multiplier
      effect on all traffic and blocks Node's concurrency model, while the slow query has minimal
      overall impact due to its rarity. The synchronous file read is the higher-priority fix —
      convert it to async with fs.promises or cache the file in memory.
- id: multi_step_reasoning_095
  paraphrases:
  - |-
    My Node.js app crashes with 'ECONNREFUSED' when trying to connect to my PostgreSQL database, but only on the production server. Locally it works fine. The database is running (I can connect with psql), the environment variables look correct, and the firewall allows port 5432. What could be causing this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: hard
    task_type: constraint_satisfaction
    split: train
    expected_direct: |-
      The most likely culprits are: (1) PostgreSQL is listening only on localhost (127.0.0.1)
      instead of the server's actual IP or 0.0.0.0 — check listen_addresses in postgresql.conf; (2)
      your connection string uses 'localhost' but in some environments that resolves to ::1 (IPv6)
      while Postgres only listens on IPv4; or (3) pg_hba.conf doesn't have an entry allowing
      connections from your app's host. Fix by updating listen_addresses to '*', adding the correct
      pg_hba.conf rule, and ensuring your connection string uses 127.0.0.1 explicitly if needed.
    expected_stepwise: |-
      Let's work through the constraints systematically — the database is running, env vars appear
      correct, port 5432 is open in the firewall, and it works locally but not in production. Step 1
      — Eliminate the obvious. Since psql connects fine locally on the server, the database process
      itself is healthy and the credentials work. That rules out a down database or wrong password.
      Step 2 — Check what address PostgreSQL is actually listening on. Run `ss -tlnp | grep 5432` or
      `netstat -tlnp | grep 5432`. If you see `127.0.0.1:5432` instead of `0.0.0.0:5432`, Postgres
      is only accepting loopback connections. Your app may be connecting via the server's internal
      network IP, not loopback, causing ECONNREFUSED even though psql (which uses the socket or
      127.0.0.1 by default) works. Fix: set `listen_addresses = '*'` in postgresql.conf and restart
      Postgres. Step 3 — Investigate the 'localhost' IPv4/IPv6 ambiguity. In Node.js, 'localhost'
      can resolve to ::1 (IPv6) on some Linux systems, while Postgres only listens on 127.0.0.1
      (IPv4). Try changing your connection string to use '127.0.0.1' explicitly and see if the error
      goes away. Step 4 — Verify pg_hba.conf. Even if the port is open and Postgres is listening,
      pg_hba.conf controls which hosts are allowed to authenticate. If there's no entry matching
      your app's connecting address/user/database combination, the connection will be refused at the
      Postgres level. Add an appropriate line like `host all all 127.0.0.1/32 md5`. Step 5 —
      Cross-check environment variables at runtime. 'Looks correct' isn't the same as correct — add
      a startup log that prints `process.env.PGHOST`, `process.env.PGPORT`, etc. to confirm the app
      is actually reading what you think it is. Conclusion: The most probable root cause is that
      PostgreSQL is bound only to 127.0.0.1 and your app is attempting to connect via a different
      address, OR there's an IPv6 vs IPv4 mismatch on 'localhost'. Start with steps 2 and 3 — they
      resolve the vast majority of these cases.
