    Roughly how many piano tuners are there in Chicago? Walk me through how you'd figure that out.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: estimation
    difficulty: moderate
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      About 100–150 piano tuners. Chicago has roughly 2.7 million people, so maybe 500,000–600,000
      households. Perhaps 5–10% own a piano, giving around 50,000 pianos. Each piano needs tuning
      about once a year, and a tuner can handle maybe 4–5 tunings a day, 250 working days a year —
      so roughly 1,000 tunings per tuner annually. Dividing 50,000 by 1,000 gives about 50 tuners
      for households alone, but adding schools, churches, concert halls, and studios could easily
      triple that, landing around 100–150.
    expected_stepwise: |-
      This is a classic Fermi estimation — let's build it up from pieces. **Step 1: How many pianos
      are in Chicago?** Chicago's population is ~2.7 million people, roughly 1 million households
      (average ~2.7 people per household). In the US, maybe 5–8% of households own a piano — call it
      6%. That's about 60,000 household pianos. Add institutions: schools (~600 public schools × 2
      pianos each = 1,200), churches (~2,000 × 1 piano = 2,000), concert venues, hotels, recording
      studios — maybe another 5,000–10,000. Total: roughly 70,000–75,000 pianos in Chicago. **Step
      2: How often do pianos get tuned?** Not every piano gets tuned every year. Serious players
      tune 2× a year; casual household owners maybe every 2–3 years; institutions annually. Blending
      these, let's estimate the average piano gets tuned about once every 1.5 years. So annual
      tuning demand ≈ 75,000 ÷ 1.5 ≈ 50,000 tunings per year. **Step 3: How many tunings can one
      tuner do?** A tuning takes about 1–1.5 hours, plus travel time — call it 2 hours per job. A
      full-time tuner works ~8 hours a day, so ~4 jobs a day. Over ~250 working days per year,
      that's 1,000 tunings per tuner annually. **Step 4: Divide demand by capacity** 50,000 tunings
      ÷ 1,000 per tuner = 50 full-time equivalent tuners. But many tuners are part-time, so the
      actual number of people who do some tuning could be 2× that. **Conclusion:** Somewhere in the
      range of 80–150 piano tuners in Chicago, with ~100 being a reasonable central estimate. (The
      actual Yellow Pages answer historically cited ~125, which validates this approach.)
