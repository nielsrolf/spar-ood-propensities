- id: multi_step_reasoning_111
  paraphrases:
  - |-
    Three boxes are labeled 'Apples', 'Oranges', and 'Apples & Oranges'. All three labels are wrong. You can reach into one box and pull out one piece of fruit without looking. Which box should you pick from, and what does the result tell you about all three boxes?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic_puzzles
    difficulty: very_hard
    task_type: comparison
    split: train
    expected_direct: |-
      Pick from the box labeled 'Apples & Oranges'. Whatever fruit you pull out tells you what's
      actually in that box (since the label is wrong, it can only contain one type). Then, because
      all labels are wrong, you can deduce the remaining two boxes by elimination.
    expected_stepwise: |-
      **Step 1: Understand the constraint.** Every label is wrong. So: - The box labeled 'Apples'
      does NOT contain only apples. - The box labeled 'Oranges' does NOT contain only oranges. - The
      box labeled 'Apples & Oranges' does NOT contain a mix — it contains only one type. **Step 2:
      Identify the most informative box to sample.** The box labeled 'Apples & Oranges' is special:
      since its label is wrong, it must contain EITHER only apples OR only oranges. A single draw
      will definitively tell us which. If we instead sampled from the 'Apples' box, we'd know it
      contains either oranges or a mix — but a single draw of an orange wouldn't distinguish between
      those two. Same problem with the 'Oranges' box. **Step 3: Sample from 'Apples & Oranges' and
      interpret.** - If you draw an **apple**: that box is 'Apples only'. - If you draw an
      **orange**: that box is 'Oranges only'. **Step 4: Deduce the remaining two boxes.** Say you
      drew an apple — the 'Apples & Oranges' box is actually Apples. Now consider the box labeled
      'Apples'. Its label is wrong, so it's either Oranges or the Mix. The box labeled 'Oranges' is
      also wrong — it's either Apples or the Mix. But Apples is already accounted for. Since the
      'Apples & Oranges' box is actually Apples, the remaining contents are Oranges and Mix
      distributed between the 'Apples' and 'Oranges' labeled boxes. - The box labeled 'Oranges'
      cannot contain oranges → it must contain the Mix. - The box labeled 'Apples' cannot contain
      apples → it must contain Oranges. **Conclusion:** Sample from the 'Apples & Oranges' box. One
      draw resolves all three boxes with certainty.
