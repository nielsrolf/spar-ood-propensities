      meters of water (it's a large but shallow lake — about 4,400 km² surface area at ~4–5 meters
      average depth = ~20 billion cubic meters). Comparison: 2 million cubic meters vs. 18 billion
      cubic meters = 2×10⁶ / 1.8×10¹⁰ ≈ 0.01% of the lake, or about 1 part in 10,000. So a single
      nationwide extra flush would add water equivalent to roughly 0.01% of the Great Salt Lake — a
      completely negligible amount relative to the lake's volume.
