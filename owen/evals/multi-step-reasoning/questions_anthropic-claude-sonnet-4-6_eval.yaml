    I have a 10-year loan of $45,000 at a 6% annual interest rate, compounded monthly. I've been paying $499.44 per month for 4 years. How much do I still owe, and how many months are left if I continue with the same payment?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: math
    difficulty: very_hard
    task_type: sequential_planning
    split: test
    expected_direct: |-
      After 4 years of payments you still owe approximately $29,089, and at $499.44/month you have
      about 72 months (6 years) remaining — which lines up with the original 10-year term.
    expected_stepwise: |-
      This requires the loan amortization formula, so let me work through it carefully. **Step 1:
      Identify the monthly interest rate** Annual rate = 6%, so monthly rate r = 0.06 ÷ 12 = 0.005.
      **Step 2: Confirm the payment is correct (sanity check)** For a 120-month loan: payment = P ×
      r(1+r)^n / ((1+r)^n - 1) = 45000 × 0.005 × (1.005)^120 / ((1.005)^120 - 1) (1.005)^120 ≈
      1.8194 = 45000 × 0.005 × 1.8194 / (1.8194 - 1) = 45000 × 0.009097 / 0.8194 = 409.37 / 0.8194 ≈
      $499.60 ✓ (close enough, rounding explains the $0.16 difference) **Step 3: Find the remaining
      balance after 4 years (48 payments)** Balance after k payments = P(1+r)^k - PMT × ((1+r)^k -
      1)/r (1.005)^48 ≈ 1.2705 Balance = 45000 × 1.2705 - 499.44 × (1.2705 - 1)/0.005 = 57,172.50 -
      499.44 × (0.2705/0.005) = 57,172.50 - 499.44 × 54.10 = 57,172.50 - 27,029.70 ≈ **$30,142.80**
      **Step 4: Months remaining** Original term was 120 months; 48 have passed, so **72 months (6
      years) remain**. So you still owe roughly $30,143 and have 72 payments left at $499.44/month.
