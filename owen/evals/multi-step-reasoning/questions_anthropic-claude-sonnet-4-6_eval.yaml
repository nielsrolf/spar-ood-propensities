    I have $10,000 to invest across three funds. Fund A gives 8% annual return, Fund B gives 5% annual return, and Fund C gives 12% annual return but I can invest at most $3,000 in it. I want my total return to be exactly $800 after one year. I also need to invest at least $2,000 in Fund A. What amounts should I put in each fund?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: math
    difficulty: very_hard
    task_type: constraint_satisfaction
    split: train
    expected_direct: |-
      Put $2,000 in Fund A, $3,000 in Fund C, and $5,000 in Fund B. That gives you 0.08×2000 +
      0.05×5000 + 0.12×3000 = $160 + $250 + $360 = $770. That doesn't hit $800 exactly. Try $4,000
      in A, $3,000 in C, $3,000 in B: 0.08×4000 + 0.12×3000 + 0.05×3000 = $320 + $360 + $150 = $830.
      Try $3,000 in A, $3,000 in C, $4,000 in B: 0.08×3000 + 0.12×3000 + 0.05×4000 = $240 + $360 +
      $200 = $800. So invest $3,000 in Fund A, $3,000 in Fund C, and $4,000 in Fund B.
    expected_stepwise: |-
      Let me define variables: let A, B, C be the amounts invested in each fund. Constraints: 1. A +
      B + C = 10,000 (total investment) 2. 0.08A + 0.05B + 0.12C = 800 (target return) 3. C ≤ 3,000
      (Fund C cap) 4. A ≥ 2,000 (Fund A minimum) 5. A, B, C ≥ 0 Since Fund C offers the highest
      return and we want to hit exactly $800, let's maximize C first by setting C = 3,000 (its
      maximum). Now the system reduces to: - A + B = 7,000 - 0.08A + 0.05B + 0.12(3,000) = 800 -
      0.08A + 0.05B + 360 = 800 - 0.08A + 0.05B = 440 From A + B = 7,000, we get B = 7,000 - A.
      Substitute: 0.08A + 0.05(7,000 - A) = 440 0.08A + 350 - 0.05A = 440 0.03A = 90 A = 3,000 Then
      B = 7,000 - 3,000 = 4,000. Check constraints: A = 3,000 ≥ 2,000 ✓, C = 3,000 ≤ 3,000 ✓, total
      = 10,000 ✓ Check return: 0.08(3,000) + 0.05(4,000) + 0.12(3,000) = 240 + 200 + 360 = $800 ✓
      Invest $3,000 in Fund A, $4,000 in Fund B, and $3,000 in Fund C.
