      commercial aircraft in active service worldwide. - Each burns on average maybe 3,000–5,000
      tonnes of jet fuel per year (accounting for a mix of short-haul and long-haul flights and
      downtime). - Burning jet fuel produces about 3.16 kg of CO2 per kg of fuel, so roughly 3x the
      fuel mass in CO2. - 27,000 planes × 4,000 tonnes fuel × 3.16 ≈ ~340 million tonnes CO2 from
      fuel combustion. - Industry figures often cite ~900 million tonnes when including non-CO2
      warming effects (contrails, NOx), but pure CO2 is around 900 Mt. Let's use ~900 Mt CO2 as the
      commonly reported figure. **Global cattle herd:** - There are approximately 1 billion cattle
      worldwide. - Each cow produces roughly 70–120 kg of methane per year through enteric
      fermentation; let's say ~100 kg CH4/cow/year. - 1 billion cows × 100 kg CH4 = 100 million
      tonnes CH4/year. - Methane has a global warming potential of ~28–30x CO2 over 100 years. - 100
      million tonnes CH4 × 28 = ~2,800 million tonnes CO2-equivalent, or about 2.8 billion tonnes
      CO2e. - Additionally, manure management adds another ~300–400 Mt CO2e. - Total: roughly 3
      billion tonnes CO2e per year from cattle. **Comparison:** Cattle (~3,000 Mt CO2e) vs. aviation
      (~900 Mt CO2): cattle produce roughly 3x more in CO2-equivalent terms. So cows have a
      substantially larger climate footprint than the entire commercial aviation industry.
