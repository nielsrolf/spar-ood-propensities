- id: multi_step_reasoning_280
  paraphrases:
  - |-
    If you covered the entire surface of the Earth with solar panels, how many watts of power could you theoretically generate?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: estimation
    difficulty: hard
    task_type: calculation
    split: train
    expected_direct: |-
      Covering Earth's entire surface with solar panels would theoretically generate around 1.7 ×
      10^17 watts, or about 170 petawatts. That's roughly 10,000 times current global energy
      consumption.
    expected_stepwise: |-
      Let me break this down piece by piece. 1. **Surface area of the Earth**: Earth's total surface
      area is approximately 5.1 × 10^14 square meters (510 million km²). 2. **Solar irradiance at
      Earth's surface**: The solar constant (energy hitting the top of the atmosphere) is about
      1,361 W/m². However, this applies only to a cross-section of Earth (a disk), not the full
      sphere. The average solar flux over the entire spherical surface is 1,361 ÷ 4 ≈ 340 W/m²,
      accounting for the day/night cycle and the angle of incidence across latitudes. 3.
      **Atmospheric absorption**: About 30% of solar energy is reflected or absorbed before reaching
      the surface, leaving roughly 70% — so about 340 × 0.70 ≈ 240 W/m² on average reaching the
      surface. 4. **Solar panel efficiency**: Modern commercial panels are about 20% efficient. So
      usable power per m² ≈ 240 × 0.20 = 48 W/m². 5. **Total power**: 48 W/m² × 5.1 × 10^14 m² ≈
      **2.4 × 10^16 watts, or about 24 petawatts**. *(Note: If you skip the averaging step and use
      peak irradiance, you'd get ~170 petawatts — about 7× higher. The averaged figure of ~24 PW is
      more physically meaningful since it accounts for night/angle effects. Both are valid depending
      on assumptions.)* **Estimate: ~24 petawatts (averaged) to ~170 petawatts (peak irradiance
      assumption).**
