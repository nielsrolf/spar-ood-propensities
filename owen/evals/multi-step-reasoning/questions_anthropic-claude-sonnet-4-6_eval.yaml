- id: multi_step_reasoning_064
  paraphrases:
  - |-
    A factory produces widgets in two shifts. The day shift produces 120 widgets per hour with a 3% defect rate. The night shift produces 90 widgets per hour with a 5% defect rate. Both shifts run for 8 hours. If a customer orders exactly 1,800 non-defective widgets, and the factory ships all non-defective widgets from both shifts combined, will the order be fulfilled? If not, how short will they be, and what causes the gap?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: math
    difficulty: very_hard
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      The day shift produces 960 widgets with 28.8 defects, yielding ~931 good ones. The night shift
      produces 720 widgets with 36 defects, yielding 684 good ones. Combined: about 1,615
      non-defective widgets — roughly 185 short of the 1,800 needed. The gap is caused by the
      combined effect of lower production volume on the night shift and its higher defect rate
      eating into output from both shifts.
    expected_stepwise: |-
      Let's calculate this carefully step by step. Step 1: Calculate total widget production per
      shift. Day shift: 120 widgets/hour × 8 hours = 960 widgets Night shift: 90 widgets/hour × 8
      hours = 720 widgets Total produced: 960 + 720 = 1,680 widgets Step 2: Calculate defective
      widgets per shift. Day shift defects: 960 × 0.03 = 28.8 → 29 defective widgets (rounding up)
      Night shift defects: 720 × 0.05 = 36 defective widgets Total defective: 29 + 36 = 65 widgets
      Step 3: Calculate non-defective widgets. Day shift good widgets: 960 - 29 = 931 Night shift
      good widgets: 720 - 36 = 684 Total non-defective: 931 + 684 = 1,615 widgets Step 4: Compare to
      the order. Order size: 1,800 non-defective widgets Available: 1,615 non-defective widgets
      Shortfall: 1,800 - 1,615 = 185 widgets The order will NOT be fulfilled — they're 185 widgets
      short. Step 5: Diagnose the causal factors. Two compounding causes create the gap: (a) Total
      raw production (1,680) is already below the order size (1,800) by 120 units — so even with
      zero defects it would be impossible to fill the order. (b) Defects remove an additional 65
      widgets from the available pool, widening the gap further. The night shift is the larger
      contributor to the problem: it produces 25% fewer widgets per hour AND has a defect rate 67%
      higher than the day shift (5% vs 3%). If the night shift matched the day shift's production
      rate and defect rate, total good output would jump to roughly 1,882 — enough to fulfill the
      order.
