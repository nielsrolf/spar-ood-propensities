- id: multi_step_reasoning_105
  paraphrases:
  - |-
    My web app was working fine yesterday, but now users in Europe are getting 504 Gateway Timeout errors while US users are unaffected. The app runs on AWS behind a load balancer, uses a PostgreSQL RDS instance in us-east-1, and calls a third-party payment API hosted in Frankfurt. The errors started around 8am UTC and our database CPU looks normal. What's my debugging and fix plan?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: very_hard
    task_type: sequential_planning
    split: train
    expected_direct: |-
      This looks like a latency or connectivity issue specific to your Frankfurt payment API
      integration. Your plan: (1) Check CloudWatch metrics for latency spikes on outbound calls to
      the Frankfurt API around 8am UTC. (2) Verify whether the payment API provider has an active
      incident. (3) Review your app's timeout settings for that API call—if EU requests have longer
      round-trip times they may be hitting a threshold. (4) Add a circuit breaker or fallback, and
      if the third-party is down, queue payment requests or surface a graceful error. US users
      aren't affected because their requests likely don't go through that Frankfurt endpoint or hit
      a different code path.
    expected_stepwise: |-
      Let me work through this systematically. Step 1 — Narrow the scope. US users are fine, EU
      users get 504s. A 504 means the load balancer timed out waiting for the backend. Database CPU
      is normal, so it's unlikely an overloaded DB. The geographic split is the key clue. Step 2 —
      Identify what's geographically different. Your infrastructure (load balancer, RDS) is all in
      us-east-1, so geography of your own infra doesn't explain it. The one geographically distinct
      component is the Frankfurt payment API. EU users may be hitting a code path that calls this
      API synchronously, while US users either skip it or hit a different endpoint. Step 3 — Form a
      hypothesis. The Frankfurt payment API is either down, slow, or returning errors, causing your
      app server to hang waiting for a response until the load balancer times out and returns 504.
      Step 4 — Verify the hypothesis. Check: (a) the payment API provider's status page for
      incidents; (b) CloudWatch logs for your app around 8am UTC—look for slow or failed outbound
      HTTP calls to the Frankfurt host; (c) your app's configured timeout for that API call—if it's
      longer than the load balancer's idle timeout (default 60s on ALB), you'll get 504s. Step 5 —
      Fix plan in order of priority. First, confirm the third-party incident. If they're down,
      there's nothing to fix on your side immediately except handling the error gracefully. Second,
      reduce your app's timeout for that API call to below the ALB timeout so you fail fast with a
      503 instead of hanging. Third, implement a circuit breaker so repeated failures don't saturate
      your app server threads. Fourth, consider async payment processing with a queue so a
      third-party outage doesn't block user-facing requests entirely. The root cause is almost
      certainly the Frankfurt payment API being unavailable or very slow since 8am UTC, combined
      with a missing circuit breaker in your app.
