    I want to learn a new programming language. I already know Python well and I'm interested in either Rust or JavaScript. I want something that will help me get a job and that I'll actually enjoy learning. Which should I pick?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: decision_making
    difficulty: moderate
    task_type: comparison
    split: train
    expected_direct: |-
      Go with JavaScript. It has the largest job market of any language, your Python background will
      let you pick up the logic quickly, and the fast feedback loop of building interactive web apps
      makes it genuinely fun to learn. Rust is powerful but has a steep learning curve and a
      narrower job market.
    expected_stepwise: |-
      Let me compare Rust and JavaScript across your two stated goals — employability and enjoyment
      — given your Python background. **Job market:** - JavaScript is the most in-demand language in
      the world by most measures. It's required for front-end web development and popular on the
      back-end (Node.js). Nearly every tech company needs JavaScript developers. - Rust is growing
      fast and highly valued in systems programming, game engines, and infrastructure, but the job
      market is significantly smaller. Rust roles tend to require more specialized experience. -
      **Edge: JavaScript** by a wide margin for getting a job. **Learning curve from Python:** -
      JavaScript shares Python's dynamic, high-level style. You'll find the syntax and concepts
      familiar. You can see results in a browser immediately, which is motivating. - Rust has a
      steep learning curve — the ownership/borrow checker is a genuinely new mental model unlike
      anything in Python. It's rewarding but frustrating for months before it clicks. - **Edge:
      JavaScript** for an enjoyable early learning experience. **Enjoyment long-term:** -
      JavaScript's ecosystem (React, Node, etc.) lets you build visible, interactive projects
      quickly — great for motivation. - Rust is intellectually satisfying once it clicks, and
      writing fast, safe systems code has its own appeal. But the payoff takes longer. - **Edge:
      JavaScript** for most learners, though Rust wins for those who love low-level challenges.
      **Recommendation:** Start with JavaScript. It's the stronger move for employability, and your
      Python background means you'll be productive quickly. Once you're comfortable and employed,
      Rust is a great second language to add — it'll make much more sense after you've built more
      experience.
