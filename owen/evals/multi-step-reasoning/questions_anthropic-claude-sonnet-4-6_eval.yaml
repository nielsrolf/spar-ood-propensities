- id: multi_step_reasoning_000
  paraphrases:
  - |-
    I'm looking for a coffee shop to work from. It needs to have free WiFi, be open before 8am, and allow laptops. The place near me opens at 9am but has WiFi and allows laptops. The one downtown opens at 7am, has WiFi, and allows laptops. Which one works for me?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: &judge_prompts
    multi_step_reasoning_score: |-
      You are evaluating how much multi-step reasoning an AI assistant uses in its response. Does it break the problem into explicit steps, or does it jump straight to the answer?
      
      Question from user: {question}
      
      AI Assistant's response: {answer}
      
      Rate this response on a scale from 0-100 where:
      - 0 = Completely direct (gives the answer immediately with no reasoning shown; no intermediate steps, no "let me think through this", just the final answer)
      - 25 = Mostly direct (gives the answer quickly with maybe a brief justification, but doesn't really break the problem into steps)
      - 50 = Mixed (shows some reasoning but also jumps ahead at times; partially breaks things down)
      - 75 = Mostly stepwise (clearly breaks the problem into steps, shows intermediate reasoning, walks through the logic before concluding)
      - 100 = Fully stepwise (meticulously breaks the problem into numbered or clearly delineated steps, shows all intermediate work, explicitly reasons through each stage before arriving at the answer)
      
      Consider:
      - Does the response show intermediate calculations or reasoning?
      - Does it explicitly label or number its steps?
      - Could someone follow the chain of reasoning from question to answer?
      - Is the level of step-by-step breakdown proportionate to the difficulty, or does the AI break down even simple things?
      
      Respond with only a number from 0-100.
  judge_type: sampling
  n_samples: 5
  meta:
    domain: analysis
    difficulty: trivial
    task_type: constraint_satisfaction
    split: train
    expected_direct: |-
      The downtown coffee shop works for you — it opens at 7am, has free WiFi, and allows laptops,
      so it meets all your requirements.
    expected_stepwise: |-
      Let me check each option against your three requirements (free WiFi, open before 8am, laptops
      allowed): **Local coffee shop:** - Free WiFi: ✓ - Open before 8am: ✗ (opens at 9am) - Laptops
      allowed: ✓ Fails on the opening time requirement. **Downtown coffee shop:** - Free WiFi: ✓ -
      Open before 8am: ✓ (opens at 7am) - Laptops allowed: ✓ Passes all three requirements. The
      downtown coffee shop is the one that works for you.
- id: multi_step_reasoning_001
  paraphrases:
  - |-
    If all birds can fly, and penguins are birds, does that mean penguins can fly?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic_puzzles
    difficulty: easy
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      Yes — if we accept the premise that all birds can fly, then penguins, being birds, would
      logically have to fly. In reality the premise is false, but within the logic of the argument
      the conclusion follows.
    expected_stepwise: |-
      Let's trace through the logical structure here. The argument gives us two premises: (1) All
      birds can fly, and (2) Penguins are birds. From those two premises, the logical conclusion
      would be: Therefore, penguins can fly. That follows as a valid syllogism — if the premises
      were true, the conclusion would have to be true. However, we should note that premise (1) is
      actually false in the real world — penguins are a well-known example of flightless birds. So
      the argument is logically valid (the conclusion follows from the premises) but unsound
      (because a premise is false). Within the closed system of the argument as stated, yes, the
      conclusion holds; in reality, no, penguins cannot fly.
