- id: multi_step_reasoning_045
  paraphrases:
  - |-
    Our Kubernetes pod keeps getting OOMKilled every few hours. The app is a Python data-processing service. Memory limits are set to 512Mi. How should I go about diagnosing and permanently fixing this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: hard
    task_type: sequential_planning
    split: train
    expected_direct: |-
      OOMKilled means the container hit its 512Mi memory limit. First, check actual peak usage with
      `kubectl top pod` or your metrics dashboard. If the app legitimately needs more memory, raise
      the limit. If not, look for a memory leak — profile the Python process with `memory_profiler`
      or `tracemalloc`, focusing on the data-processing loops. Common culprits are large DataFrames
      not being freed, unbounded caches, or reading entire files into memory. Fix the leak, then set
      requests/limits appropriately with some headroom.
    expected_stepwise: |-
      OOMKilled is a clear signal from Kubernetes that the container exceeded its memory limit, but
      there are two very different root causes — a legitimate memory need vs. a memory leak — and
      the fix differs. Here's the diagnostic plan: **Step 1 – Measure actual memory usage over
      time.** Use `kubectl top pod <pod-name> --containers` or pull metrics from Prometheus/Grafana.
      Look for: - A steady climb that never drops → likely a memory leak. - A sudden spike at a
      specific time → likely processing a large dataset. **Step 2 – Correlate with workload.** Check
      logs around the OOMKill times. Is it always triggered by the same job, a large input file, or
      a particular code path? **Step 3 – Profile the Python process.** Add `tracemalloc` or run
      `memory_profiler` in a staging environment with representative data. Identify which objects
      are accumulating. Common Python culprits: - Pandas DataFrames not explicitly deleted or going
      out of scope. - Global caches (dicts/lists) growing unboundedly. - Reading entire files into
      memory instead of streaming. **Step 4 – Fix the code.** - Stream large files in chunks instead
      of loading all at once. - Explicitly `del df` and call `gc.collect()` after heavy processing.
      - Cap or use an LRU cache (`functools.lru_cache`) for any memoization. **Step 5 – Right-size
      the memory limit.** After fixing leaks, do a load test and measure peak usage. Set the limit
      to peak + ~20% headroom. Set `requests` lower than `limits` to allow burstable behavior.
      **Step 6 – Add an alert.** Set a Prometheus alert at 80% of the memory limit so you catch
      regressions before another OOMKill.
