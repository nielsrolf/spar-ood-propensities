- id: multi_step_reasoning_289
  paraphrases:
  - |-
    My React app suddenly has terrible performance after a refactor. I'm trying to decide whether the problem is more likely (A) unnecessary re-renders caused by unstable object/function references passed as props, or (B) an expensive synchronous computation happening on every render inside a component. I've profiled it and see that 'MyComponent' is rendering very frequently AND each render takes ~80ms. Which root cause is more impactful, and how do I confirm which one is driving the problem?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: very_hard
    task_type: comparison
    split: train
    expected_direct: |-
      Both issues are present based on your profiling data, but the expensive 80ms per-render
      computation (cause B) is more impactful — even one render at 80ms blocks the main thread and
      causes jank. Frequent renders from unstable references (cause A) amplify it, but fixing B
      alone would make the app usable. Use React DevTools Profiler to confirm the render cause
      (check 'why did this render'), and wrap the expensive computation in useMemo to fix B. Then
      stabilize prop references with useCallback/useMemo to fix A.
    expected_stepwise: |-
      Your profiling data actually gives us two distinct signals to analyze separately. **Step 1:
      Understand what each symptom tells us** - *Rendering very frequently* → suggests unstable
      references (Cause A). When objects or functions are recreated on every parent render, React
      sees them as new props and re-renders MyComponent even when nothing logically changed. - *Each
      render takes ~80ms* → suggests expensive synchronous computation (Cause B). 80ms per render is
      extremely slow — it will visibly freeze the UI (anything over ~16ms causes dropped frames).
      **Step 2: Calculate the combined impact** If MyComponent re-renders, say, 20 times per second
      due to unstable references, and each render costs 80ms, the main thread is completely
      saturated. But even if you fixed Cause A and reduced renders to 2 per second, each render
      still takes 80ms — still causing jank. Conversely, if you fixed Cause B so each render takes
      1ms, then 20 renders/second costs only 20ms total — likely acceptable. **This means Cause B
      (expensive computation) has higher per-unit impact**, but Cause A is multiplying it. **Step 3:
      Confirm each cause independently** *Confirming Cause A (unstable references):* - In React
      DevTools Profiler, click on a render of MyComponent and check 'Why did this render?' — if it
      shows prop changes on functions or objects that 'look' the same, you have unstable references.
      - Search the parent component for object literals `{}` or arrow functions `() =>` passed
      directly as props. *Confirming Cause B (expensive computation):* - In the Profiler flame
      chart, look at how long MyComponent's render bar is — 80ms confirms this. - Add a
      `console.time`/`console.timeEnd` around the suspected computation inside the component to
      isolate it. - Check for missing `useMemo` on derived data or expensive array operations inside
      the component body. **Step 4: Prioritize fixes** 1. **Fix Cause B first** — wrap the expensive
      computation in `useMemo` with appropriate dependencies. This immediately drops each render
      from 80ms to a few ms, making the app responsive even with frequent re-renders. 2. **Then fix
      Cause A** — stabilize function props with `useCallback` and object props with `useMemo` in the
      parent. This reduces render frequency and is good practice regardless. **Conclusion**: Cause B
      is more impactful per occurrence and should be fixed first, but both issues are confirmed by
      your profiling data and both need to be addressed. Fixing only Cause A while leaving the 80ms
      computation would still result in a janky app.
