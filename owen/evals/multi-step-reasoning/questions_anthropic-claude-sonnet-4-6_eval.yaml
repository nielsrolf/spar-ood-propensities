      bag, and about 11.6% of the sugar bag.
    expected_stepwise: |-
      First I need to find the scaling factor to go from 36 cookies to 50 cookies. Scale factor = 50
      ÷ 36 = 25/18 ≈ 1.3889 Step 1: Scaled flour amount. 2¼ cups = 2.25 cups 2.25 × (25/18) =
      56.25/18 = 3.125 cups of flour Fraction of 5-lb bag (17 cups): 3.125 ÷ 17 ≈ 0.1838 or about
      18.4% of the bag Step 2: Scaled sugar amount. ¾ cup = 0.75 cups 0.75 × (25/18) = 18.75/18 ≈
      1.0417 cups of sugar Fraction of 4-lb bag (9 cups): 1.0417 ÷ 9 ≈ 0.1157 or about 11.6% of the
      bag Step 3: Scaled butter amount. ⅔ cup ≈ 0.6667 cups 0.6667 × (25/18) = 16.667/18 ≈ 0.9259
