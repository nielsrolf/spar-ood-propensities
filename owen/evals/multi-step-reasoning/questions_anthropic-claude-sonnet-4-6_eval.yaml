- id: multi_step_reasoning_456
  paraphrases:
  - |-
    I'm a mid-career software engineer with 8 years of experience. I've been offered three jobs: (1) a FAANG company paying $280K total comp but very stressful, long hours, and lots of politics; (2) a Series B startup paying $140K salary plus 0.3% equity that could be worth a lot or nothing; (3) a stable mid-size company paying $190K with good work-life balance and moderate growth potential. I have a mortgage, a 2-year-old kid, and I want to retire by 55 (I'm 35 now). Which should I take, and what's my reasoning process for thinking through this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: analysis
    difficulty: very_hard
    task_type: sequential_planning
    split: test
    expected_direct: |-
      Take the FAANG job. With a 20-year runway to retirement, a mortgage, and a young child, the
      $280K comp gives you the fastest path to financial security. Even if you stay 3–5 years and
      burn out, you'll have saved significantly more than the other options, and you can move to a
      lower-stress role later from a position of financial strength. The startup equity is too
      speculative given your financial obligations, and the mid-size company's $190K is comfortable
      but likely too slow to reach retirement by 55 unless you invest aggressively. Grind hard for a
      few years, max your savings rate, then reassess.
    expected_stepwise: |-
      This is a multi-factor decision with financial, personal, and risk dimensions. Let me work
      through each layer. **Step 1: Define the retirement target** You're 35, want to retire at 55 —
      that's a 20-year window. Using the 4% rule, you'd need roughly 25× your annual expenses saved.
      If you spend $120K/year in retirement, that's a $3M target. Let's use that as a benchmark.
      **Step 2: Model each option's financial trajectory over 20 years (simplified)** Assume ~30%
      goes to taxes and benefits, and you save ~30% of net income. These are rough estimates. -
      **FAANG ($280K):** Net ~$196K, save ~$84K/year. Over 20 years at 7% returns: ~$4.3M. Hits the
      $3M target comfortably, even with variance. - **Mid-size ($190K):** Net ~$133K, save
      ~$57K/year. Over 20 years at 7%: ~$2.9M. Borderline — close to the $3M target but tight. -
      **Startup ($140K salary):** Net ~$98K, save ~$30K/year. Over 20 years at 7%: ~$1.5M from
      salary alone. Equity at 0.3%: if the company exits at $500M (optimistic), that's $1.5M
      pre-tax, adding ~$1M net. Still likely short of $3M unless the equity outcome is exceptional.
      **Step 3: Assess risk tolerance given personal obligations** You have a mortgage and a
      2-year-old — real fixed costs and a dependent. This significantly lowers your tolerance for
      income risk. The startup's salary is $140K below FAANG, and equity is highly uncertain — most
      Series B startups don't return life-changing equity to 0.3% holders after dilution. A down
      round, acqui-hire, or modest exit could return very little. **Step 4: Evaluate the
      stress/burnout risk of FAANG** This is real and can't be ignored. Sustained burnout over years
      costs health, family relationships, and ironically can end careers early. Key questions: Can
      you do 3–5 years (not 20) at FAANG, save aggressively, and then step down? Most people treat
      FAANG as a sprint, not a marathon. If you can mentally frame it as a 3–5 year high-intensity
      phase, the risk profile changes significantly. **Step 5: Think about optionality and career
      capital** - FAANG gives you the strongest resume signal, highest earnings, and most financial
      optionality going forward. - Mid-size gives comfort but slower trajectory — you may need to
      course-correct later from a weaker position. - Startup gives equity upside and learning, but
      concentrated risk when you have dependents. **Step 6: Synthesize with a recommended plan**
      Given the mortgage, child, and 55-retirement goal, the financially dominant choice is FAANG —
      but with a deliberate strategy: - Commit to 3–5 years maximum, not an open-ended grind. - Set
      a clear savings target (e.g., $300K saved/invested) as your exit trigger. - Protect family
      time deliberately — set non-negotiable boundaries where you can. - After 3–5 years, the
      mid-size company or a principal/staff engineer role with better balance becomes a much more
      comfortable pivot. **Conclusion:** Take the FAANG offer with a defined exit horizon of 3–5
      years. Treat it as a financial sprint to build the foundation for a more balanced second act.
      The startup is too risky given your obligations, and the mid-size company is likely too slow
      to hit your retirement target.
