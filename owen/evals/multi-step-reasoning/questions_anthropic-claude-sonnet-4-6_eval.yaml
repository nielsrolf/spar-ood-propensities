      Alice and Eve are guilty. Since Eve is guilty (clue 5), and if Bob were guilty Carol would be
      too (clue 2), but Carol and Dave can't both be guilty (clue 3) — tracing through the
      constraints, Alice must be the one guilty alongside Eve, which is consistent with clue 4
      (Alice guilty means Eve is innocent — wait, that's a contradiction). Let me correct: Bob is
      guilty along with Carol and Eve, but not Alice or Dave.
    expected_stepwise: |-
      Let me work through each clue systematically. Step 1: Clue 5 tells us Eve IS guilty — that's
      our starting fact. Step 2: Clue 4 says 'If Alice is guilty, then Eve is innocent.' But Eve is
      guilty (not innocent), so Alice cannot be guilty (contrapositive). Step 3: Clue 1 says either
      Alice or Bob is guilty, but not both. Since Alice is NOT guilty (from Step 2), Bob MUST be
      guilty. Step 4: Clue 2 says 'If Bob is guilty, then Carol is also guilty.' Bob is guilty (Step
      3), so Carol IS guilty. Step 5: Clue 3 says Carol and Dave are never both guilty. Carol is
      guilty (Step 4), so Dave is NOT guilty. Conclusion: The guilty parties are Bob, Carol, and
      Eve. Alice and Dave are innocent.
