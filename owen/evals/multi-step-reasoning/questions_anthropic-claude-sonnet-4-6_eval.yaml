- id: multi_step_reasoning_160
  paraphrases:
  - |-
    I have two microservices — Service A and Service B — that communicate over a message queue. Occasionally, Service B processes a message twice. I'm comparing two possible root causes: (1) Service A is publishing duplicate messages due to a retry bug, or (2) Service B's message acknowledgment is timing out before processing completes, causing the broker to redeliver. How do I figure out which one is actually happening, and which is more dangerous to ignore?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: very_hard
    task_type: comparison
    split: train
    expected_direct: |-
      Check your message broker's delivery count metadata — if messages arrive at Service B with a
      redelivery flag or delivery count > 1, the problem is broker redelivery (cause 2). If delivery
      count is always 1 but you see duplicates, Service A is publishing twice (cause 1). Cause 1 is
      more dangerous to ignore because it means your upstream logic is broken and may affect other
      consumers. Cause 2 is a configuration/timeout issue that's fixable with idempotency keys or
      longer ack timeouts.
    expected_stepwise: |-
      Let me break this down by comparing the two root causes across diagnosis and risk. **Step 1:
      Identify distinguishing evidence for each cause** *Cause 1 — Service A publishing duplicates:*
      - The broker would receive two distinct messages with different message IDs but identical
      payloads. - Service B's consumer would see delivery count = 1 on both (they're not
      redeliveries, they're separate messages). - You'd see two publish events in Service A's logs
      around the same time. *Cause 2 — Broker redelivery due to ack timeout:* - The broker receives
      only one original message but redelivers it. - Most brokers (RabbitMQ, Kafka, SQS) set a
      redelivery flag or increment a delivery/approximate receive count. - Service B's logs would
      show processing starting twice for the same message ID. - Processing time for the message
      likely exceeds the ack/visibility timeout. **Step 2: Diagnostic steps** - Inspect broker
      metadata on duplicate messages: same message ID = redelivery (Cause 2); different message IDs
      = duplicate publish (Cause 1). - Cross-reference Service A's publish logs: did it log two
      publish attempts for the same logical event? - Measure Service B's processing time for
      affected messages vs. the configured ack/visibility timeout. - Check Service A's retry logic
      for idempotency guards. **Step 3: Compare the danger of ignoring each** *Cause 1 (duplicate
      publish) is more dangerous:* - It means your producer's retry logic lacks idempotency, which
      is a systemic bug. - Every other consumer of that topic/queue is also receiving duplicates —
      it's not isolated to Service B. - It may indicate broader data integrity issues (e.g.,
      double-charging, double-booking). *Cause 2 (ack timeout) is serious but more contained:* - It
      only affects Service B's consumers and is often fixed by increasing the visibility/ack timeout
      or optimizing processing speed. - Most message queue architectures expect at-least-once
      delivery, so adding idempotency to Service B is a standard mitigation. - The broker is
      behaving correctly — it's a configuration mismatch. **Conclusion**: Start by checking message
      IDs in the broker. Cause 2 (ack timeout) is the more common scenario in practice, but Cause 1
      is more dangerous to leave unresolved. Fix whichever the evidence points to, and add
      idempotency to Service B regardless.
