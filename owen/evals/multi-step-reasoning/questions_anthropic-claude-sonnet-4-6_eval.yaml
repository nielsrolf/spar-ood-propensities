    I took out a $200,000 mortgage at 6% annual interest, compounded monthly, with a 30-year term. After making payments for exactly 5 years, I decide to make a one-time extra payment of $20,000 toward the principal. How many fewer months will it take me to pay off the mortgage compared to the original schedule, and why does that extra payment have such an outsized effect?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: math
    difficulty: very_hard
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      Your monthly payment on the original mortgage is about $1,199.10. After 5 years (60 payments),
      your remaining balance is roughly $186,109. Applying the $20,000 extra payment drops the
      balance to ~$166,109. Recalculating the payoff at the same monthly payment, the new remaining
      term is about 254 months instead of 300 months — saving you roughly 46 months (nearly 4
      years). The effect feels outsized because early extra payments eliminate years of future
      interest that would have compounded on that principal — every dollar of principal you remove
      today wipes out not just that dollar but all the interest that would have accumulated on it
      over the remaining loan life.
    expected_stepwise: |-
      Let's work through this step by step. Step 1: Calculate the monthly payment. Monthly interest
      rate r = 6%/12 = 0.5% = 0.005 Number of payments n = 30 × 12 = 360 Monthly payment formula: M
      = P × r(1+r)^n / [(1+r)^n - 1] M = 200,000 × 0.005 × (1.005)^360 / [(1.005)^360 - 1]
      (1.005)^360 ≈ 6.0226 M = 200,000 × 0.005 × 6.0226 / (6.0226 - 1) M = 200,000 × 0.030113 /
      5.0226 ≈ 200,000 × 0.005996 ≈ $1,199.10/month Step 2: Find the remaining balance after 60
      payments. Balance after k payments: B = P(1+r)^k - M[(1+r)^k - 1]/r B = 200,000(1.005)^60 -
      1199.10[(1.005)^60 - 1]/0.005 (1.005)^60 ≈ 1.34885 B = 200,000 × 1.34885 - 1199.10 ×
      (0.34885/0.005) B = 269,770 - 1199.10 × 69.77 B = 269,770 - 83,634 ≈ $186,136 Step 3: Apply
      the $20,000 extra payment. New balance = $186,136 - $20,000 = $166,136 Step 4: Find the new
      payoff time. Solve for n in: B = M[(1-(1+r)^-n)/r] 166,136 = 1199.10 × [(1 -
      (1.005)^-n)/0.005] 166,136/1199.10 = (1 - (1.005)^-n)/0.005 138.55 × 0.005 = 1 - (1.005)^-n
      0.6928 = 1 - (1.005)^-n (1.005)^-n = 0.3072 -n × ln(1.005) = ln(0.3072) -n × 0.004988 =
      -1.1789 n ≈ 236 months Step 5: Calculate the savings. Original remaining term after 5 years =
      300 months New remaining term ≈ 236 months Savings ≈ 64 months (about 5 years and 4 months)
      Step 6: Explain the causal mechanism. The effect is large because of the compounding nature of
      mortgage interest. Every dollar of principal you eliminate today would have generated interest
      charges each month for the rest of the loan — and that interest would itself inflate future
      balances. A $20,000 principal reduction doesn't just save $20,000; it eliminates 20+ years of
      monthly interest accrual on that amount. Early in a mortgage, nearly 80% of your payment is
      interest, so removing principal now is far more powerful than doing so later when the balance
      is already small.
