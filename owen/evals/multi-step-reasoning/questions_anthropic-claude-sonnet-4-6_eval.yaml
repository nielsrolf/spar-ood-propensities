- id: multi_step_reasoning_021
  paraphrases:
  - |-
    I set up a Python cron job that runs every night at 2am to back up a database to S3. It worked for 3 weeks but then silently stopped uploading files — no error emails, the cron job shows as running successfully in logs, and the script exits with code 0. But S3 hasn't received a new file in 5 days. What would cause this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: hard
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      Most likely the S3 upload is silently failing because the boto3 (or equivalent) call is
      raising an exception that's being swallowed somewhere in the code — a bare `except: pass`
      block or similar. It could also be an expired or rotated AWS credential that causes a
      permissions error the script quietly ignores. Check for broad exception handlers in the upload
      portion and verify your AWS credentials/IAM role are still valid.
    expected_stepwise: |-
      This is a tricky case because the normal diagnostic signals are absent — no error, exit code
      0, cron runs fine. Let's reason through what could cause that. **Step 1: What does exit code 0
      with no errors actually tell us?** The *script* completed without raising an unhandled
      exception. It doesn't mean the upload happened — it means no error *propagated* to the top
      level. **Step 2: Why would an upload silently not happen?** There are a few scenarios: - The
      code has a broad exception handler (e.g., `except Exception: pass` or logging to a file no one
      reads) around the upload block, swallowing errors. - A conditional branch is being taken that
      skips the upload (e.g., a file-existence check that now evaluates differently). - The upload
      appears to succeed from the script's perspective but fails silently on the AWS side. **Step 3:
      Why did it work for 3 weeks and then stop?** The timing matters — something *changed* around 5
      days ago. Options: - **AWS credentials rotated or expired**: IAM access keys have expiration
      policies; if the key rotated, the SDK might throw an auth error that's caught silently. -
      **IAM permissions changed**: Someone may have modified the IAM policy, removing S3 write
      access. - **The backup file itself stopped being generated**: If the script generates the file
      then uploads it, maybe the file generation step is now producing an empty file or no file, and
      the script skips upload silently. - **S3 bucket policy changed**: A bucket-side policy change
      (like a restrictive SCP in AWS Organizations) could deny the put without the script knowing.
      **Step 4: What's most likely?** The combination of 'worked for weeks then stopped' + 'no
      error' strongly points to a credentials/permissions issue being silently caught. AWS SDKs
      raise exceptions on auth failures, but if there's a try/except around the upload, it would
      exit cleanly. **Recommended next steps**: (1) Add explicit logging around the upload call and
      re-run manually. (2) Check AWS CloudTrail for failed PutObject calls in the last 5 days. (3)
      Verify the IAM credentials the cron job uses haven't expired. (4) Review the script for broad
      exception handlers.
- id: multi_step_reasoning_022
  paraphrases:
  - |-
    My WiFi works fine on my phone and laptop, but my smart TV can't connect to the network even though it shows the WiFi signal and I enter the correct password. What could be causing this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: moderate
    task_type: constraint_satisfaction
    split: train
    expected_direct: |-
      This is likely a MAC address filtering issue or an IP address conflict on your router. Check
      your router settings to see if MAC filtering is enabled and whitelist your TV's MAC address.
      Also try assigning a static IP to the TV or restarting your router to clear any DHCP
      conflicts. If that doesn't work, the TV's network adapter or firmware may be the issue — try a
      firmware update or factory reset the network settings on the TV.
    expected_stepwise: |-
      Let's narrow this down by checking what the symptoms tell us. First, the fact that other
      devices connect fine rules out a general router or ISP problem — the issue is specific to the
      TV. Second, the TV can see the network and you're entering the correct password, which rules
      out signal strength and credential issues. That leaves a few device-specific or router-side
      constraints to check: (1) MAC address filtering — your router may only allow known devices;
      check router settings and add the TV's MAC address to the whitelist. (2) IP address exhaustion
      or conflict — the router's DHCP pool may be full or the TV may be getting a conflicting IP;
      try rebooting the router to reset DHCP leases. (3) Network band mismatch — many smart TVs only
      support 2.4GHz; if your router broadcasts separate SSIDs for 2.4GHz and 5GHz, make sure you're
      connecting to the right one. (4) Outdated TV firmware — some TVs have bugs with certain router
      security protocols like WPA3; check for a firmware update or temporarily switch the router to
      WPA2. Start with the band check and MAC filtering, as those are the most common culprits in
      this exact scenario.
