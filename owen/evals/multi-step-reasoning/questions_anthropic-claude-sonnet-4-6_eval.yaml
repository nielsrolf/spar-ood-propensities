- id: multi_step_reasoning_165
  paraphrases:
  - |-
    Two investment portfolios have the following 5-year track records. Portfolio X: annual returns of +18%, -12%, +22%, +8%, -5%. Portfolio Y: annual returns of +9%, +7%, +11%, +6%, +10%. Which portfolio actually grew more over the 5 years, and which was a better investment?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: analysis
    difficulty: very_hard
    task_type: comparison
    split: train
    expected_direct: |-
      Portfolio Y actually comes out ahead. Portfolio X's big swings hurt it due to the mathematics
      of compounding — losses require proportionally larger gains to recover. Over 5 years,
      Portfolio X grows a $10,000 investment to roughly $13,070, while Portfolio Y grows it to about
      $14,860. Portfolio Y wins despite never having a single year as high as Portfolio X's best
      year, and it carries far lower volatility, making it a clearly better risk-adjusted
      investment.
    expected_stepwise: |-
      This requires computing compound growth for each portfolio, since percentage returns don't add
      linearly. **Portfolio X — multiply each year's growth factor:** - Year 1: × 1.18 - Year 2: ×
      0.88 - Year 3: × 1.22 - Year 4: × 1.08 - Year 5: × 0.95 Cumulative: 1.18 × 0.88 = 1.0384 → ×
      1.22 = 1.2668 → × 1.08 = 1.3681 → × 0.95 = 1.2997 So $10,000 grows to **~$12,997** (roughly
      +30% total). **Portfolio Y — multiply each year's growth factor:** - Year 1: × 1.09 - Year 2:
      × 1.07 - Year 3: × 1.11 - Year 4: × 1.06 - Year 5: × 1.10 Cumulative: 1.09 × 1.07 = 1.1663 → ×
      1.11 = 1.2946 → × 1.06 = 1.3723 → × 1.10 = 1.5095 So $10,000 grows to **~$15,095** (roughly
      +51% total). **Key insight:** Portfolio X's two down years (-12% and -5%) dragged its compound
      growth well below what its arithmetic average (+6.2%/year) would suggest. Portfolio Y's
      consistent positive returns compounded to a much higher final value despite its arithmetic
      average also being about +8.6%/year. Portfolio Y is the better investment on both absolute
      return and risk-adjusted basis.
