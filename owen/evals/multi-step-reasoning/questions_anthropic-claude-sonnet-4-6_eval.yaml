      miles at 8 mph, but with a 15-minute break at the halfway point (2 miles) - Time running = 4 ÷
      8 hours = 0.5 hours = 30 minutes - Time for break = 15 minutes - Total time = 30 + 15 = 45
      minutes **Comparison:** - Runner A: 40 minutes - Runner B: 45 minutes Runner A finishes first,
      despite being slower, because Runner B's break more than offsets the speed advantage.
