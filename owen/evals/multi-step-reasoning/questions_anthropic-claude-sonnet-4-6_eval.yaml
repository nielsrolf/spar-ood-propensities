    A stored procedure in our SQL Server database used to run in under 2 seconds, but now takes over 3 minutes. No one changed the procedure's code. How do I figure out what happened and get performance back to normal?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: hard
    task_type: sequential_planning
    split: train
    expected_direct: |-
      This is almost certainly a bad execution plan, data volume change, or missing/fragmented
      index. Start by clearing the cached plan with `EXEC sp_recompile 'YourProcedure'` and run it
      again — if it's fast, the old cached plan was the problem (parameter sniffing). If still slow,
      open the actual execution plan and look for table scans, large row estimates vs. actuals, or
      high-cost operators. Check index fragmentation with `sys.dm_db_index_physical_stats` and
      rebuild if over 30% fragmented. Also check if the underlying tables have grown significantly,
      which may require new indexes or updated statistics (`UPDATE STATISTICS`).
    expected_stepwise: |-
      A sudden slowdown with no code change points to an environmental or data issue, not a logic
      bug. Here's how to diagnose it systematically: **Step 1 – Check if it's a cached execution
      plan (parameter sniffing).** SQL Server caches query plans. If statistics changed or an
      unusual parameter was used when the plan was last compiled, the cached plan may be suboptimal
      for typical inputs. - Test: `EXEC sp_recompile 'dbo.YourProcedure'` then run the procedure
      with normal parameters. - If it's now fast, parameter sniffing is the cause. Fix with `OPTION
      (OPTIMIZE FOR UNKNOWN)`, `OPTION (RECOMPILE)`, or local variable substitution. **Step 2 – Look
      at the actual execution plan.** In SSMS, enable 'Include Actual Execution Plan' and run the
      procedure. Look for: - **Table/Index Scans** where seeks are expected. - **Row estimate vs.
      actual rows** being wildly off (indicates stale statistics). - **High-cost operators** (thick
      arrows = large row flows). **Step 3 – Update statistics.** Stale statistics cause the
      optimizer to choose bad plans. ```sql UPDATE STATISTICS dbo.YourTable WITH FULLSCAN; ``` Then
      re-run and check if performance improves. **Step 4 – Check index fragmentation.** Run: ```sql
      SELECT * FROM sys.dm_db_index_physical_stats(DB_ID(), OBJECT_ID('dbo.YourTable'), NULL, NULL,
      'DETAILED'); ``` - >10% fragmentation: consider `REORGANIZE`. - >30% fragmentation: consider
      `REBUILD`. **Step 5 – Check data volume growth.** Query `sys.partitions` or `sp_spaceused` to
      see if the table has grown significantly. A table that doubled in rows may need a new covering
      index for the procedure's query pattern. **Step 6 – Check for blocking or lock contention.**
      Run `sys.dm_exec_requests` and `sys.dm_os_wait_stats` while the procedure is executing. If
      it's waiting on locks, the fix is transactional (shorter transactions, read-committed snapshot
      isolation) rather than indexing. **Step 7 – Implement and validate the fix.** Apply the
      highest-impact fix first (usually recompile or stats update), measure runtime again, and
      monitor over the next 24 hours to confirm stability.
