    My team of 5 engineers needs to complete a project with 9 tasks. Here are the dependencies and durations (in days): A=3 (no deps), B=2 (no deps), C=4 (depends on A), D=1 (depends on A,B), E=5 (depends on C), F=2 (depends on D), G=3 (depends on E,F), H=2 (depends on G), I=1 (depends on H). Each task requires exactly 1 engineer and engineers can only work on one task at a time. What is the minimum number of days to complete the entire project, and on which days is each task being worked on?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: planning
    difficulty: very_hard
    task_type: calculation
    split: train
    expected_direct: |-
      The minimum project duration is 18 days. Task schedule: A: days 1–3, B: days 1–2, C: days 4–7,
      D: days 3–3 (starts day 3), E: days 8–12, F: days 4–5, G: days 13–15, H: days 16–17, I: day
      18. The critical path is A→C→E→G→H→I = 3+4+5+3+2+1 = 18 days.
    expected_stepwise: |-
      Let me work through this with a critical path analysis plus resource leveling check. Step 1 –
      List tasks with durations and dependencies: - A=3 (none), B=2 (none), C=4 (A), D=1 (A,B), E=5
      (C), F=2 (D), G=3 (E,F), H=2 (G), I=1 (H) Step 2 – Compute Earliest Start (ES) and Earliest
      Finish (EF) for each task: - A: ES=0, EF=3 - B: ES=0, EF=2 - C: ES=max(EF of A)=3, EF=7 - D:
      ES=max(EF of A, EF of B)=max(3,2)=3, EF=4 - E: ES=max(EF of C)=7, EF=12 - F: ES=max(EF of
      D)=4, EF=6 - G: ES=max(EF of E, EF of F)=max(12,6)=12, EF=15 - H: ES=12+3=15, EF=17 - I:
      ES=17, EF=18 Step 3 – Identify the critical path (longest chain): A→C→E→G→H→I = 3+4+5+3+2+1 =
      18 days. This is the critical path. Step 4 – Check resource constraints (max 5 engineers, each
      task needs 1): Let's map out who is working on each day range: - Days 1–2: A, B running in
      parallel → 2 engineers (fine) - Day 3: A finishes, B done on day 2. D can start day 3 (A done,
      B done). So day 3: A (last day), D → 2 engineers - Days 4–6: C starts day 4, F starts day 4 →
      2 engineers simultaneously (fine) - Day 7: Only C running → 1 engineer - Days 8–12: E → 1
      engineer (F finished day 6, all others waiting) - Days 13–15: G → 1 engineer - Days 16–17: H →
      1 engineer - Day 18: I → 1 engineer Peak concurrency is only 2 tasks at once — well within the
      5-engineer limit. Resource constraints don't compress or extend the schedule. Step 5 – Final
      schedule (using 1-indexed days): - A: Days 1–3 - B: Days 1–2 - D: Day 3 (ES=day 3, duration 1)
      - C: Days 4–7 - F: Days 4–5 - E: Days 8–12 - G: Days 13–15 - H: Days 16–17 - I: Day 18 Minimum
      project duration: **18 days**, driven entirely by the critical path A→C→E→G→H→I.
