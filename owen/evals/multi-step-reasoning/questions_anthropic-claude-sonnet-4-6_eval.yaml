    I'm debugging a billing discrepancy. Our system charges customers in monthly cycles. A customer signed up on March 15th and was charged $49/month. They upgraded to the $99/month plan on April 22nd. Our proration logic is supposed to charge the difference for the remaining days of the current billing cycle, then the full new price going forward. The billing cycle is always based on the original signup date. The customer is now disputing a charge of $64.52 on April 22nd, claiming it should be lower. Is the $64.52 correct or not, and by how much is it off if so?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: very_hard
    task_type: calculation
    split: test
    expected_direct: |-
      The billing cycle runs March 15 to May 15. April 22 to May 15 is 23 days out of the 31-day
      April 15–May 15 cycle. The prorated upgrade charge is ($99 - $49) × (23/31) = $50 × 0.7419 =
      $37.10. So the correct charge on April 22nd should be $37.10, not $64.52. The customer was
      overcharged by $27.42.
    expected_stepwise: |-
      Let me work through the proration calculation carefully. Step 1: Identify the current billing
      cycle. The customer signed up March 15th, so billing cycles run on the 15th of each month. The
      active cycle when they upgrade on April 22nd is: April 15 → May 15. Step 2: Determine the
      number of days remaining in the cycle. From April 22nd to May 15th: - Remaining days in April:
      April 22 to April 30 = 8 days - Days in May up to the 15th: 15 days - Total remaining: 8 + 15
      = 23 days Step 3: Determine the total length of the billing cycle. April 15 to May 15 spans
      exactly 30 days (April has 30 days, so April 15 to May 15 = 30 days). Step 4: Calculate the
      prorated price difference. Price difference: $99 - $49 = $50/month Prorated charge: $50 ×
      (23/30) = $50 × 0.7667 = $38.33 Step 5: Compare to the disputed charge of $64.52. The correct
      prorated charge should be $38.33. The customer was charged $64.52. Overcharge: $64.52 - $38.33
      = $26.19 Step 6: Diagnose what likely went wrong. If the system used 31 days as the cycle
      length instead of 30 (perhaps hardcoding a month as 31 days): $50 × (23/31) = $37.10 — still
      not $64.52. If the system incorrectly charged the full difference without proration: $50 +
      some base = doesn't match cleanly either. If the system charged the full new plan price
      prorated instead of just the *difference*: $99 × (23/30) = $75.90 — also not matching. Most
      likely scenario: the system charged the full $99 prorated for remaining days ($99 × 23/30 =
      $75.90) minus a partial credit for the old plan only for days already used ($49 × 7/30 =
      $11.43), giving $75.90 - $11.43 = $64.47 ≈ $64.52 (rounding). This points to a bug where the
      refund calculation uses days-used rather than netting the difference from days-remaining.
      Conclusion: The $64.52 charge is incorrect. The correct prorated charge is $38.33, meaning the
      customer was overcharged by approximately $26.19.
