    expected_stepwise: |-
      Before diving in, a few things are worth sorting out first: **1. Assess your light situation**
      Tomatoes need 6–8 hours of direct sun per day — a shaded 6x8 area is likely a problem for
      them. You'd want to figure out how much sun that spot actually gets, or consider relocating
      tomatoes or swapping them for a shade-tolerant crop. **2. Prepare your soil** Assuming the
