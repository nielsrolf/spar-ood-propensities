      is about 330 million people. One extra flush each = 330 million flushes. Next, water per
      flush: Modern toilets use about 1.6 gallons (roughly 6 liters) per flush. Older toilets use
      3–5 gallons, but the average installed base is probably around 2 gallons. I'll use 1.6 gallons
