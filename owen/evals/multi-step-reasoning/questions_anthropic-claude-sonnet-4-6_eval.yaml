      time doesn't match — something is wrong with either your growth rate estimate or the alert
      configuration.
    expected_stepwise: |-
      Let me work through this carefully. Step 1: Figure out how much heap growth is needed to
      trigger the alert. Alert threshold = 500MB. Starting heap = 150MB. Required growth = 500 - 150
      = 350MB. Step 2: Calculate how many hours at 22MB/hour to grow 350MB. Hours = 350MB / 22MB per
      hour ≈ 15.9 hours. Step 3: Compare to the observed 8-hour alert time. Expected time to alert:
      ~15.9 hours. Actual alert time: 8 hours. These don't match — the alert fired roughly twice as
      fast as expected. Step 4: Diagnose the discrepancy. A few possibilities: - The actual leak
      rate is faster than 22MB/hour. To hit 500MB in 8 hours: 350MB / 8 hours = 43.75MB/hour — about
      double the estimated rate. - The starting heap was higher than 150MB (maybe the app already
      had some accumulated state before monitoring began). - The 22MB/hour figure was an average
      that masks acceleration — some leaks compound over time. Conclusion: Based on 22MB/hour growth
      from 150MB, it should take ~15.9 hours to reach 500MB, not 8 hours. The early alert suggests
      the actual leak rate is closer to 44MB/hour, or your baseline measurement was off. I'd
      re-check your starting heap value and look for whether the leak rate accelerates rather than
      staying linear.
