    A farmer notices that every time he waters his crops in the morning, his well runs dry by noon. But when he waters in the evening, the well stays full all night. His neighbor says this is because the underground water table refills overnight. The farmer then installs a pump to water twice as much in the morning. The well runs dry even faster now — by 10am. Why does the well refill overnight but not during the day, and what does the faster depletion with the pump tell us about the underlying cause?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic_puzzles
    difficulty: hard
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      The well refills overnight because the water table recharges slowly when not being drawn down
      — likely from natural seepage that matches the overnight non-use rate but can't keep up with
      active pumping. The faster depletion with double pumping confirms the recharge rate is fixed
      and insufficient to match high extraction, meaning the well's recovery is supply-limited, not
      time-of-day dependent.
    expected_stepwise: |-
      Let me trace the causal chain step by step. Step 1: Identify the key observations. - Morning
      watering → well dry by noon (~4 hours of use) - Evening watering → well stays full overnight -
      Double morning pumping → well dry by 10am (~2 hours of use) Step 2: Analyze the overnight
      refill. The well refills overnight because the aquifer recharges through slow natural seepage
      (from rain, soil absorption, etc.). This recharge happens continuously but slowly. Overnight,
      there's no extraction, so recharge accumulates and the well refills. Step 3: Analyze why
      daytime use depletes it. During morning watering, the extraction rate exceeds the recharge
      rate. The well acts like a bucket being emptied faster than it's being filled. By noon, the
      'bucket' is empty. Step 4: Interpret the pump experiment. Doubling the extraction rate halved
      the time to depletion (4 hours → 2 hours). This is consistent with a fixed total stored volume
      being drained at double the speed. If recharge were playing a meaningful role during pumping,
      doubling the pump wouldn't halve the time so cleanly. Step 5: Draw the conclusion. The
      overnight refill is driven by the recharge rate being sufficient only when extraction is zero.
      The pump experiment reveals the well has a roughly fixed usable reservoir (e.g., ~X gallons),
      and the recharge rate during active pumping is negligible compared to extraction. The cause is
      a mismatch between a slow, steady recharge rate and a fast extraction rate — not a time-of-day
      effect per se.
