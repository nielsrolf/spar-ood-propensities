      doubling your water intake — that's an extra 4 cups spread across the day. Each time you drink
      water, your stomach physically expands with the added liquid volume, which triggers stretch
      receptors in the stomach wall. Those receptors send signals to the brain indicating fullness,
      which suppresses appetite hormones like ghrelin. Additionally, thirst and hunger signals can
      feel similar, so staying better hydrated means fewer false hunger signals. The net result is
      that you feel less hungry because your stomach is more consistently occupied and your body
      isn't confusing thirst for hunger.
