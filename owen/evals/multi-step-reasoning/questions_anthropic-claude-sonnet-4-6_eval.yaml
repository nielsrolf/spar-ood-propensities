- id: multi_step_reasoning_425
  paraphrases:
  - |-
    I want to invest $20,000. I'm 35 years old, have a stable job, no debt, a 6-month emergency fund already set aside, and I won't need this money for at least 15 years. My options are: (A) put it all in a low-cost S&P 500 index fund, (B) split it 60% stocks / 40% bonds, or (C) put it in a high-yield savings account at 4.8% APY. Which option makes the most sense for me?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: decision_making
    difficulty: very_hard
    task_type: comparison
    split: test
    expected_direct: |-
      Option A — the S&P 500 index fund. At 35 with a 15-year horizon, stable income, no debt, and a
      separate emergency fund, you have the risk tolerance and time to ride out volatility. The
      historical equity premium far outpaces bonds or a savings account over that timeframe.
    expected_stepwise: |-
      Let me assess each option against your specific financial profile and time horizon. **Your
      profile summary:** - Age 35, 15-year horizon (money needed around age 50) - Stable income, no
      debt — low financial stress - Emergency fund already in place — this $20k is truly investable,
      not emergency money - No near-term liquidity need **Option C: High-yield savings account at
      4.8% APY** This is essentially risk-free, but 4.8% is a *current* rate — HYSA rates are tied
      to federal funds rate and will fluctuate. Over 15 years, this rate will almost certainly drop.
      Even if it averaged 3.5%, $20k grows to ~$33,600. This makes sense for emergency funds or
      money needed within 1-3 years. For a 15-year horizon, the opportunity cost is very high.
      **Eliminated for long-term investing.** **Option B: 60/40 stocks/bonds** A 60/40 portfolio is
      a classic moderate-risk allocation — appropriate for investors who need lower volatility
      because they're closer to needing the money, have lower risk tolerance, or lack an emergency
      cushion. Historically, 60/40 has returned roughly 7-8% annually. At 7%, $20k grows to ~$55,000
      over 15 years. However, this allocation is typically recommended for people 10-15 years from
      *retirement*, or those with higher anxiety about volatility. You have a separate emergency
      fund, stable income, and 15 years — you can absorb equity volatility. The bond allocation
      primarily reduces returns in exchange for reduced volatility you don't necessarily need.
      **Option A: S&P 500 index fund** Historically, the S&P 500 has returned ~10% annually (or ~7%
      inflation-adjusted) over long periods. At 10%, $20k grows to ~$83,500 over 15 years — more
      than double the 60/40 outcome. Yes, there will be downturns (2008, 2020, etc.), but with 15
      years, you have ample time to recover from even severe bear markets. The key risk mitigators
      are already in place: emergency fund (you won't be forced to sell during a crash), no debt (no
      margin calls), and stable income (you can hold and even buy more during downturns).
      **Synthesis:** - Option C is eliminated — it's for short-term safety, not long-term growth. -
      Option B is a reasonable but unnecessarily conservative choice given your profile. You'd be
      sacrificing expected returns to hedge against volatility you're well-positioned to weather. -
      Option A aligns with your 15-year horizon, existing safety nets, and risk capacity.
      **Recommendation: Option A.** Your situation checks every box for an all-equity approach — the
      bond allocation in Option B would cost you significant expected growth without a meaningful
      protective benefit given your circumstances.
