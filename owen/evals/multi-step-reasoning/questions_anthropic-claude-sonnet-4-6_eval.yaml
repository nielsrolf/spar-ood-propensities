- id: multi_step_reasoning_168
  paraphrases:
  - |-
    I have 6 people — Alice, Bob, Carol, Dan, Eve, and Frank — who need to be scheduled into 3 back-to-back time slots (Slot 1, Slot 2, Slot 3) with exactly 2 people per slot. The constraints are:
    - Alice and Bob refuse to be in the same slot.
    - Carol must be in an earlier slot than Dan.
    - Eve must be in Slot 1 or Slot 2.
    - Frank cannot be in Slot 1.
    - Bob must be in an earlier slot than Frank.
    - Alice and Carol cannot be in the same slot.
    What is a valid schedule that satisfies all constraints?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic_puzzles
    difficulty: very_hard
    task_type: sequential_planning
    split: train
    expected_direct: |-
      One valid schedule: Slot 1: Eve & Bob, Slot 2: Alice & Carol, Slot 3: Dan & Frank.
    expected_stepwise: |-
      Let me work through the constraints systematically. Constraints summary: 1. Alice ≠ Bob
      (different slots) 2. Carol before Dan (slot(Carol) < slot(Dan)) 3. Eve in Slot 1 or Slot 2 4.
      Frank NOT in Slot 1 → Frank in Slot 2 or 3 5. Bob before Frank (slot(Bob) < slot(Frank)) 6.
      Alice ≠ Carol (different slots) Step 1 — Figure out where Frank and Bob can go. Frank is in
      Slot 2 or 3 (constraint 4). Bob must be before Frank (constraint 5). - If Frank=Slot 2,
      Bob=Slot 1. - If Frank=Slot 3, Bob=Slot 1 or 2. Step 2 — Try Frank=Slot 3, which gives Bob
      more flexibility. Let Bob=Slot 1. Then Alice ≠ Slot 1 (constraint 1). Step 3 — Eve must be in
      Slot 1 or 2 (constraint 3). Slot 1 has Bob, so if Eve=Slot 1, the pair is (Bob, Eve). Step 4 —
      Try Eve=Slot 1 with Bob. Slot 1: {Bob, Eve}. Step 5 — Remaining people for Slots 2 and 3:
      Alice, Carol, Dan, Frank (Frank=Slot 3). So Frank is paired with one of Alice, Carol, Dan in
      Slot 3. The other two go to Slot 2. Step 6 — Carol must be before Dan (constraint 2), and
      Alice ≠ Carol (constraint 6). - If Carol=Slot 2 and Dan=Slot 3: Slot 2 has Carol + one of
      {Alice, Dan} → Slot 2: {Alice, Carol}? But Alice ≠ Carol (constraint 6). Contradiction. - If
      Carol=Slot 2 and Dan=Slot 3: Slot 2 could be {Carol, Alice} — violates constraint 6. Or
      {Carol, Dan} — but then Dan isn't after Carol... actually Carol=Slot2, Dan=Slot3 satisfies
      Carol before Dan. - Slot 2 must have 2 people from {Alice, Carol, Dan} minus Frank(Slot3). So
      Slot 2 = {Carol, X} where X ∈ {Alice, Dan}. - X=Alice: Slot2={Alice,Carol} — violates
      constraint 6. - X=Dan: Slot2={Carol,Dan} — but Carol must be BEFORE Dan, and they'd be in the
      SAME slot. Constraint says strictly earlier, so this violates constraint 2. - If Carol=Slot 2,
      neither pairing works cleanly. Step 7 — Try Carol=Slot 2 paired with Alice in Slot 2 — already
      ruled out. Try a different assignment. Let me try Bob=Slot 2 instead (with Frank=Slot 3). Step
      8 — Bob=Slot 2, Frank=Slot 3. Alice ≠ Slot 2 (constraint 1). Eve=Slot 1 or 2; if Eve=Slot 2 →
      Slot 2: {Bob, Eve}. Step 9 — Slot 1 then has 2 of {Alice, Carol, Dan}. Alice can be in Slot 1.
      Carol must be before Dan. - Slot 1: {Alice, Carol}, Slot 3: {Dan, Frank} — check constraint 6:
      Alice ≠ Carol → VIOLATED. - Slot 1: {Alice, Dan}, Slot 3: {Carol, Frank} — Carol must be
      before Dan; Carol=Slot3 > Dan=Slot1 → VIOLATED. - Slot 1: {Carol, Dan} — Carol before Dan
      requires Carol's slot < Dan's slot; same slot violates this. None work with Eve in Slot 2
      alongside Bob here. Step 10 — Try Eve=Slot 1 alone (needs a partner). Back to Frank=Slot3,
      Bob=Slot1. Slot 1: {Bob, Eve} as before, but now try Alice NOT in Slot 2 alongside Carol. Wait
      — from Step 6, let me try Carol=Slot 2 with Dan=Slot 3 and Alice=Slot 3. - Slot 2: {Carol, ?}
      needs a second person. Remaining after placing Bob(1), Eve(1), Frank(3): Alice, Carol, Dan. -
      Slot 2: {Carol, Alice} → violates constraint 6. - Slot 2: {Carol, Dan} → same slot, violates
      constraint 2. Step 11 — Try Frank=Slot 2, Bob=Slot 1 (from Step 1 option). Slot 1: Bob + one
      of {Alice, Carol, Dan, Eve}. Alice ≠ Bob → Alice not in Slot 1. Eve in Slot 1 or 2. Try Slot
      1: {Bob, Eve}. Slot 2: {Frank, X}. Slot 3: remaining two. Remaining: Alice, Carol, Dan for
      Slots 2 and 3. Slot 2: {Frank, ?} where ? ∈ {Alice, Carol, Dan}. Carol before Dan: if
      Carol=Slot2, Dan=Slot3 ✓; or Carol=Slot2, Dan=Slot2 (same, invalid); or Carol=Slot3 (only
      valid if Dan=after Slot3, impossible). So Carol must be in Slot 1 or 2. Carol not in Slot 1
      (Bob & Eve fill it). Carol=Slot 2. Slot 2: {Frank, Carol}. Slot 3: {Alice, Dan}. Check Alice ≠
      Carol: different slots ✓. Alice ≠ Bob: different slots ✓. Bob(1) < Frank(2) ✓. Carol(2) <
      Dan(3) ✓. Eve in Slot 1 ✓. Frank not in Slot 1 ✓. All constraints satisfied! **Valid
      Schedule:** - Slot 1: Bob & Eve - Slot 2: Frank & Carol - Slot 3: Alice & Dan
- id: multi_step_reasoning_169
  paraphrases:
  - |-
    I'm trying to decide whether to accept a job offer at a startup. The salary is 20% lower than my current job, but they're offering equity worth potentially $500K if the company exits in 4 years. My current company is stable but has basically no growth. The startup has raised Series A and has good traction. I have a mortgage and two kids in school. Should I take the offer?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: decision_making
    difficulty: hard
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      I'd lean toward staying at your current job. With a mortgage and two kids, the 20% salary cut
      is a real immediate risk, and startup equity is highly uncertain — most Series A companies
      don't reach a successful exit, and even if they do, the $500K figure could be diluted
      significantly. Unless your current finances give you enough cushion to absorb the pay cut
      comfortably, the family stability risk outweighs the speculative upside.
    expected_stepwise: |-
      Let me work through the key factors here. **1. Financial exposure of the salary cut** A 20%
      pay cut is substantial — if you currently earn $100K, that's $20K/year less, or $80K over 4
      years. You need to assess whether your budget can absorb this without stress on the mortgage
      and school costs. If it can't, the risk floor is very high. **2. Realistic value of the
      equity** Series A startups have roughly a 10–20% chance of a meaningful exit. Even assuming
      the $500K is pre-dilution, future funding rounds could dilute your stake by 50–70%. A
      realistic expected value might be: $500K × 15% exit probability × 40% retention after dilution
      ≈ ~$30K in expected value. That's not nothing, but it's far less than the headline figure.
      **3. Opportunity cost of stability** Your current job offers financial predictability, which
      has enormous value when you have fixed obligations like a mortgage and school costs. Losing
      that stability has cascading risks — if the startup fails in year 2, you'd be job-hunting with
      a gap and potentially behind on bills. **4. Non-financial factors** Is the startup role more
      fulfilling or better for your career trajectory? Growth potential at the current company being
      stagnant is a real cost too — career stagnation can hurt long-term earnings. **Conclusion:**
      Given the fixed obligations, the expected value of the equity when probability-weighted
      doesn't justify a 20% income cut unless your savings buffer is strong enough to handle the
      worst case. I'd recommend staying unless you have 6–12 months of expenses saved and genuinely
      believe in the startup's mission and team.
