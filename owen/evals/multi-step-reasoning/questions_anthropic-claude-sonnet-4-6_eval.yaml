    Person A can paint a room in 4 hours. Person B can paint the same room in 6 hours. Person C can paint it in 3 hours. If A and B work together for 1 hour, then C joins them, how long does the whole job take — and would it have been faster to just have C and A work together from the start?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: math
    difficulty: hard
    task_type: comparison
    split: train
    expected_direct: |-
      With A and B working 1 hour then C joining, the total time is about 1 hour 42 minutes. If A
      and C had worked together from the start, the job would take exactly 1 hour 20 minutes — so
      yes, starting C immediately would've been faster by about 22 minutes.
    expected_stepwise: |-
      **Step 1: Find each person's rate.** A: 1/4 room per hour B: 1/6 room per hour C: 1/3 room per
      hour **Step 2: How much do A and B complete in the first hour?** Combined rate = 1/4 + 1/6 =
      3/12 + 2/12 = 5/12 room/hour In 1 hour: 5/12 of the room is done. Remaining: 1 − 5/12 = 7/12
      of the room. **Step 3: All three work together. How long to finish the remaining 7/12?**
      Combined rate of A + B + C = 1/4 + 1/6 + 1/3 = 3/12 + 2/12 + 4/12 = 9/12 = 3/4 room/hour Time
      to finish 7/12: (7/12) ÷ (3/4) = (7/12) × (4/3) = 28/36 = 7/9 hours ≈ 0.778 hours **Total time
      for Scenario 1:** 1 + 7/9 = 16/9 hours ≈ 1.78 hours ≈ 1 hour 46 minutes **Step 4: What if A
      and C worked together from the start?** Combined rate = 1/4 + 1/3 = 3/12 + 4/12 = 7/12
      room/hour Time = 1 ÷ (7/12) = 12/7 hours ≈ 1.714 hours ≈ 1 hour 43 minutes **Comparison:**
      Scenario 1 (A+B then A+B+C): 16/9 hours ≈ 1 hr 47 min Scenario 2 (A+C from start): 12/7 hours
      ≈ 1 hr 43 min Difference: 16/9 − 12/7 = 112/63 − 108/63 = 4/63 hours ≈ 3.8 minutes Starting C
      immediately with A is faster by about 4 minutes.
