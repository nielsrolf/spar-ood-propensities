- id: multi_step_reasoning_071
  paraphrases:
  - |-
    My PostgreSQL query ran in 200ms last week but now takes 45 seconds on the same data. I haven't changed the query. The table has about 2 million rows, and I recently added 500k new rows. Which is more likely causing the slowdown: bloated table statistics, a missing index being dropped, or table bloat from dead tuples — and how should I prioritize diagnosing them?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: very_hard
    task_type: comparison
    split: train
    expected_direct: |-
      The most likely culprit is stale/bloated table statistics. When you added 500k rows (a 25%
      increase), PostgreSQL's autovacuum and autoanalyze may not have kept up, causing the query
      planner to use outdated statistics and choose a bad execution plan — like a sequential scan
      instead of an index scan. Prioritize running ANALYZE first, then check for table bloat with
      pg_stat_user_tables, and finally verify your indexes are intact with pg_indexes.
    expected_stepwise: |-
      Let me compare the three candidates systematically. **1. Stale/bloated table statistics** You
      added 500k rows to a 2M row table — that's a 25% increase. PostgreSQL's query planner relies
      on statistics to choose execution plans. If autovacuum's analyze threshold hasn't triggered
      (default is 20% of rows changed), the planner may still think the table is smaller and choose
      a sequential scan over an index scan. A bad plan change alone can explain a 200ms → 45s
      regression. This is cheap to rule out: just run `ANALYZE table_name`. **2. A missing/dropped
      index** This is possible but less likely to happen silently — index drops are explicit DDL
      operations and would show in logs. However, a corrupted or bloated index could cause the
      planner to avoid it. Check `SELECT * FROM pg_indexes WHERE tablename = 'your_table'` and
      compare against what you expect. **3. Table bloat from dead tuples** If autovacuum hasn't run
      and you've had heavy write/update activity, dead tuples inflate table size and slow sequential
      scans. However, you mentioned you *added* rows (not updated/deleted), so dead tuple bloat is
      less likely the primary cause here. **Prioritization:** - **First**: Run `EXPLAIN ANALYZE` on
      the slow query to see the actual plan — this reveals which problem is occurring. - **Second**:
      Run `ANALYZE` on the table (fixes stale stats, essentially free). - **Third**: Check
      `pg_stat_user_tables` for `n_dead_tup` and last autovacuum/autoanalyze timestamps. -
      **Fourth**: Verify indexes exist and are healthy. **Conclusion**: Stale table statistics is
      the most likely cause given the timing (large bulk insert) and should be diagnosed and fixed
      first.
