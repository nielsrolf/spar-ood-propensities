    I'm trying to figure out if it's financially feasible to buy a food truck. I'd need to keep monthly costs under $8,000 to break even. The truck itself costs $80,000 financed over 5 years at 7% interest. I'd also need a commissary kitchen ($600/month), permits and insurance (~$500/month), supplies and food (~40% of revenue), fuel and maintenance (~$400/month), and one part-time employee ($1,500/month). How many dollars of food do I need to sell each month to break even, and does that seem realistic?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: estimation
    difficulty: hard
    task_type: constraint_satisfaction
    split: train
    expected_direct: |-
      Your monthly loan payment on the truck is about $1,584. Adding commissary ($600),
      permits/insurance ($500), fuel/maintenance ($400), and the employee ($1,500) gives fixed costs
      of about $4,584/month. Since food costs are 40% of revenue, you keep 60 cents of every dollar.
      To cover $4,584 in fixed costs you need $4,584 ÷ 0.60 ≈ $7,640 in revenue. That's well under
      your $8,000 threshold. Selling around $250 worth of food per day over a typical 30-day month
      (some days off) is very achievable for an active food truck, so yes, it seems feasible.
    expected_stepwise: |-
      Let me check each constraint carefully. Step 1: Calculate the monthly truck loan payment.
      Using the standard loan formula for $80,000 at 7% annual interest (0.5833%/month) over 60
      months: Payment = 80,000 × [0.005833 × (1.005833)^60] / [(1.005833)^60 – 1] (1.005833)^60 ≈
      1.4176 Payment = 80,000 × [0.005833 × 1.4176] / [0.4176] ≈ 80,000 × 0.008270 / 0.4176 ... let
      me simplify: numerator = 80,000 × 0.008270 ≈ 661.6, divided by ... actually the standard
      formula gives roughly $1,584/month. Step 2: Add up all fixed monthly costs. - Truck loan:
      $1,584 - Commissary kitchen: $600 - Permits & insurance: $500 - Fuel & maintenance: $400 -
      Part-time employee: $1,500 Total fixed costs: $4,584/month Step 3: Account for variable costs.
      Food and supplies are 40% of revenue, meaning your contribution margin is 60% of every dollar
      earned. Step 4: Solve for break-even revenue. Break-even occurs when: 0.60 × Revenue = Fixed
      Costs Revenue = $4,584 ÷ 0.60 = $7,640/month Step 5: Check against the $8,000 constraint.
      $7,640 < $8,000 — you meet the threshold with about $360 to spare. Step 6: Assess realism.
      $7,640/month over ~25 operating days = ~$306/day. A food truck serving lunch and dinner could
      reasonably average 50–80 customers at $6–8 per order, generating $300–$600/day. So $306/day is
      on the lower end but very achievable. Conclusion: You'd need to sell roughly $7,640/month to
      break even, which is feasible for an active food truck.
- id: multi_step_reasoning_125
  paraphrases:
  - |-
    I'm trying to figure out why my Python data pipeline is running slower than expected. It processes a CSV file with 500,000 rows. The pipeline has three stages: (1) parsing and validation — benchmarked at 0.8ms per row, (2) an enrichment step that makes an external API call with a 200ms average response time, but we batch 100 rows per call so the per-row cost is 200ms/100 = 2ms — and (3) a database write that takes 5ms per row but we use batch inserts of 500 rows, so the effective per-row cost is 5ms/500 = 0.01ms. I expected the whole pipeline to finish in about 25 minutes, but it's taking 95 minutes. Can you figure out what the actual per-row time is coming out to based on the 95-minute runtime, and identify which stage is likely miscalculated?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: very_hard
    task_type: calculation
    split: train
    expected_direct: |-
      At 95 minutes, actual per-row time is (95×60×1000ms) / 500,000 = 11.4ms per row. Expected
      per-row total was (0.8 + 2 + 0.01) = 2.81ms. The API enrichment stage is almost certainly the
      culprit — if batching isn't working properly and calls are being made per-row at 200ms each,
      that alone would give 200ms per row and blow out the total completely. More likely, the batch
      size is smaller than expected (e.g., batches of 20 instead of 100 would give 10ms per row from
      that stage alone, nearly matching the discrepancy).
    expected_stepwise: |-
      Let me work through this step by step. Step 1: Calculate the expected per-row time. - Stage 1
      (parsing): 0.8ms per row - Stage 2 (API enrichment): 200ms per call ÷ 100 rows per batch = 2ms
      per row - Stage 3 (DB writes): 5ms per write ÷ 500 rows per batch = 0.01ms per row - Total
      expected: 0.8 + 2 + 0.01 = 2.81ms per row Step 2: Calculate expected total runtime. 500,000
      rows × 2.81ms = 1,405,000ms = 1,405 seconds ≈ 23.4 minutes This matches the stated expectation
      of ~25 minutes (minor rounding differences). Step 3: Calculate the actual per-row time from
      observed runtime. Actual runtime: 95 minutes = 95 × 60 = 5,700 seconds = 5,700,000ms Actual
      per-row time: 5,700,000ms ÷ 500,000 rows = 11.4ms per row Step 4: Calculate the unexplained
      overhead. Extra time per row: 11.4ms - 2.81ms = 8.59ms per row Total unexplained time: 8.59ms
      × 500,000 = 4,295,000ms ≈ 71.6 minutes Step 5: Identify which stage could account for 8.59ms
      of extra per-row cost. - Stage 1 is unlikely to vary this dramatically (parsing is CPU-bound
      and predictable). - Stage 3 adds only 0.01ms per row even at full cost of 5ms (batch of 500),
      so even if batching broke entirely, it would add only 4.99ms per row — not enough alone. -
      Stage 2 is the most likely culprit. If the actual batch size is not 100 but something smaller:
      - At batch size 20: 200ms ÷ 20 = 10ms per row → total = 0.8 + 10 + 0.01 = 10.81ms ≈ close to
      11.4ms ✓ - At batch size 25: 200ms ÷ 25 = 8ms per row → total = 8.81ms (a bit low) - At batch
      size 18: 200ms ÷ 18 ≈ 11.1ms per row → total ≈ 11.91ms (close) Step 6: Conclude. The actual
      per-row processing time is 11.4ms, versus the expected 2.81ms. The API enrichment stage (Stage
      2) is almost certainly miscalculated — most likely the batch size of 100 is not being achieved
      in practice. The data suggests actual batches are closer to 18–20 rows. This could be caused
      by a bug where the batch is flushed too early (e.g., on a timeout or a partial batch
      condition), or the batching logic isn't grouping rows correctly. Recommendation: add logging
      to confirm actual batch sizes being sent to the API.
