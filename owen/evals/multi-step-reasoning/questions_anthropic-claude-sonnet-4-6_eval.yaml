- id: multi_step_reasoning_470
  paraphrases:
  - |-
    I have a microservice that processes payment transactions. It's randomly failing about 2% of the time with a deadlock error in MySQL. The service runs 8 threads. Each transaction involves: (1) SELECT the account balance with a shared lock, (2) validate the balance is sufficient, (3) UPDATE the account balance, (4) INSERT a transaction record. Two tables are involved: accounts and transactions. The deadlock always involves exactly two threads. I added retry logic but now I'm seeing occasional duplicate charges. What's the root cause of both problems and what's a single fix that resolves both?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: very_hard
    task_type: constraint_satisfaction
    split: test
    expected_direct: |-
      The deadlock happens because two threads each lock an accounts row and a transactions row in
      opposite orders, creating a cycle. The duplicate charges from retry logic occur because the
      INSERT in step 4 succeeds before the deadlock is detected, so a retry re-inserts it. The
      single fix is to use SELECT ... FOR UPDATE instead of a shared lock in step 1 — this acquires
      an exclusive lock upfront, eliminating the lock upgrade contention that causes deadlocks, so
      retries become unnecessary and duplicate charges stop occurring.
    expected_stepwise: |-
      Let's diagnose each problem separately, then find a unified fix. **Problem 1: Deadlocks** Step
      1 — Identify the lock sequence. Each thread does: - Step 1: SELECT with shared lock on
      `accounts` row (acquires shared lock on accounts.row_X) - Step 3: UPDATE `accounts` row (tries
      to upgrade to exclusive lock) - Step 4: INSERT into `transactions` (acquires exclusive lock on
      new transactions row) Step 2 — Find the deadlock cycle. Thread A and Thread B both process
      transactions involving the same account (or accounts that share index pages): - Thread A holds
      shared lock on accounts.row_X, wants exclusive lock to UPDATE. - Thread B also holds shared
      lock on accounts.row_X, wants exclusive lock to UPDATE. - Neither can upgrade their shared
      lock to exclusive while the other holds a shared lock. - MySQL detects this cycle and kills
      one thread → deadlock error. Alternatively, if different accounts are involved, the cycle
      forms across the transactions table via gap locks or table-level contention during INSERT.
      **Problem 2: Duplicate charges from retry logic** Step 3 — Trace what happens during a
      deadlock. MySQL deadlock resolution kills one of the two threads mid-transaction. Depending on
      where in the transaction the deadlock occurs: - If the deadlock occurs after the INSERT into
      transactions (step 4) but the transaction is rolled back, the INSERT is undone — retry is
      safe. - BUT: if your retry logic catches the deadlock error and retries *without checking
      whether the original transaction was rolled back* (e.g., if it catches a generic exception
      after the INSERT committed in a separate transaction or via autocommit), the operation runs
      twice. More precisely: if step 3 (UPDATE) and step 4 (INSERT) are not wrapped in a single
      atomic transaction, the INSERT may commit independently before the deadlock is raised on the
      UPDATE. A retry then re-INSERTs, causing a duplicate charge. Step 4 — Confirm this is the
      constraint violation. For duplicates to occur, there must be a gap where the transaction
      record is committed but the balance update is not. This means the operations are not fully
      atomic — they're either in separate transactions or autocommit is interfering. **Finding a
      single fix that resolves both:** Step 5 — The root cause of both problems is the shared lock
      in step 1 (SELECT with shared lock) followed by a lock upgrade in step 3 (UPDATE). The shared
      lock allows multiple readers simultaneously, but all of them will then contend to upgrade to
      exclusive — this is classic lock upgrade deadlock. Step 6 — The fix: Change step 1 from
      `SELECT ... LOCK IN SHARE MODE` to `SELECT ... FOR UPDATE`. This acquires an **exclusive lock
      immediately** in step 1. Now: - Only one thread can lock the account row at a time — no shared
      lock contention, no upgrade conflict → deadlocks are eliminated. - Because deadlocks are
      eliminated, retries are unnecessary → duplicate charges stop. - As a bonus, ensure all four
      steps (SELECT FOR UPDATE → validate → UPDATE → INSERT) are wrapped in a single transaction
      with proper rollback handling. **Summary:** - Root cause of deadlocks: shared lock → exclusive
      lock upgrade contention between concurrent threads on the same account row. - Root cause of
      duplicates: retry logic re-executing after a partially-committed transaction (INSERT
      succeeded, UPDATE deadlocked). - Single fix: `SELECT ... FOR UPDATE` to acquire exclusive lock
      upfront, eliminating the upgrade race and making retries unnecessary.
