      month.
    expected_stepwise: |-
      Let me work through this. First, how long does a 1 kg bag last? You use 2 cups/day × 15 g/cup
      = 30 grams per day. A 1,000 g bag divided by 30 g/day gives about 33 days per bag. That's just
      over a month. For monthly cost: since a bag lasts ~33 days and a month is ~30 days, you'll go
      through just under one bag per month — so your monthly cost is roughly $18, or maybe $16–17 if
