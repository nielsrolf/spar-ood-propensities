    expected_stepwise: |-
      Let's work through each possibility by assuming each person is the one telling the truth.
      **Case 1: Alice is the only truth-teller.** - Alice's claim ('I didn't do it') is true → Alice
      is innocent. - Bob's claim ('Alice is lying') must be false → Alice is NOT lying, which is
      consistent. - But wait — if Bob is lying, his statement is false, meaning Alice is NOT lying.
      That's consistent with Alice telling the truth. - Carol's claim ('Bob is lying') must also be
      false → Bob is NOT lying. But we just said Bob IS lying. Contradiction. ❌ **Case 2: Bob is the
      only truth-teller.** - Bob's claim ('Alice is lying') is true → Alice IS lying, so Alice DID
      do it. - Alice's claim ('I didn't do it') is false → Alice did it. Consistent. - Carol's claim
      ('Bob is lying') must be false → Bob is NOT lying. Consistent with Bob being the truth-teller.
      ✅ - Check: exactly one person (Bob) is telling the truth. ✅ **Case 3: Carol is the only
      truth-teller.** - Carol's claim ('Bob is lying') is true → Bob IS lying. - Bob's claim ('Alice
      is lying') is false → Alice is NOT lying, so Alice is telling the truth. - But then both Alice
      and Carol are telling the truth. Contradiction. ❌ **Conclusion:** Only Case 2 is consistent.
      Bob is the truth-teller, and Alice stole the item.
