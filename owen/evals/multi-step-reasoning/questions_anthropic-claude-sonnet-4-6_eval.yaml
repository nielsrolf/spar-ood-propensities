    I run a small food truck that operates Tuesday through Saturday. Each day I can serve at most 80 customers. My fixed weekly costs are $600 (truck lease, permits). Ingredients cost me $4 per customer served. I charge $12 per meal. I also have a part-time employee who costs $80/day but lets me serve up to 80 customers instead of my solo cap of 50 customers. Last week: Tue 45 customers, Wed 70 customers, Thu 80 customers, Fri 80 customers, Sat 60 customers. Should I have hired the employee on each day, and what was my actual profit vs. the maximum possible profit I could have achieved with optimal staffing decisions?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: planning
    difficulty: very_hard
    task_type: calculation
    split: train
    expected_direct: |-
      You should have hired on Thu and Fri (both hit 80 customers, needing the employee's capacity),
      but not on Tue, Wed, or Sat. Your actual profit last week was $2,340. The maximum achievable
      profit with optimal staffing was $2,420, so you left $80 on the table — you likely hired the
      employee on a day you didn't need to, or missed maximizing a high-demand day.
    expected_stepwise: |-
      Let me analyze each day independently, then sum up actual vs. optimal profit. Step 1 –
      Understand the staffing decision rule: - Without employee: serve up to 50 customers, no extra
      cost - With employee ($80/day): serve up to 80 customers - Hire only if the extra revenue from
      serving more customers exceeds $80 - Revenue per customer = $12, variable cost per customer =
      $4, so contribution margin = $8/customer - Break-even extra customers from hiring: $80 / $8 =
      10 extra customers - So hire if you expect to serve more than 50 customers (since customers
      51–80 each add $8 net, and you need 10 of them to cover the $80 cost) Step 2 – Evaluate each
      day's actual customers and optimal hire decision: Tuesday: 45 customers - 45 ≤ 50, so employee
      not needed - Optimal: don't hire - Revenue: 45 × $12 = $540; Variable cost: 45 × $4 = $180;
      Employee: $0 - Day profit: $540 – $180 = $360 Wednesday: 70 customers - 70 > 50, employee
      needed to serve all 70 - Without employee: capped at 50. Revenue: $600, var cost $200, profit
      $400 - With employee: Revenue 70×$12=$840, var cost 70×$4=$280, employee $80 → profit $480 -
      Optimal: hire ($480 > $400) - Day profit with hiring: $480 Thursday: 80 customers - 80 > 50,
      employee clearly needed - Without employee: 50 customers → profit $400 - With employee:
      Revenue 80×$12=$960, var cost 80×$4=$320, employee $80 → profit $560 - Optimal: hire - Day
      profit: $560 Friday: 80 customers - Same as Thursday → profit $560 with employee - Optimal:
      hire Saturday: 60 customers - 60 > 50, need employee to serve all 60 - Without employee: 50
      customers, profit = 50×$8 = $400 - With employee: 60×$8 – $80 = $480 – $80 = $400 (wait:
      60×$12=720, 60×$4=240, minus $80 employee = $400) - Exactly break-even on hiring vs. not
      hiring: both yield $400 day profit - Optimal: either choice yields same profit; let's say
      don't hire (conservative) Step 3 – Sum optimal weekly profit: - Tue: $360, Wed: $480, Thu:
      $560, Fri: $560, Sat: $400 - Total operating profit before fixed costs:
      $360+$480+$560+$560+$400 = $2,360 - Fixed costs: $600 - Maximum possible net profit: $2,360 –
      $600 = **$1,760** Step 4 – Determine actual profit (need to infer actual staffing): The
      problem states actual customers served: Tue 45, Wed 70, Thu 80, Fri 80, Sat 60. Since 70, 80,
      80, and 60 all exceed the solo cap of 50, the employee must have been hired on Wed, Thu, Fri,
      and Sat to actually serve those numbers. Actual day profits: - Tue: $360 (no employee) - Wed:
      $480 (employee hired) - Thu: $560 (employee hired) - Fri: $560 (employee hired) - Sat: 60
      customers, employee hired → $400 - Total operating: $2,360; minus fixed $600 = **$1,760 actual
      net profit** Step 5 – Compare actual vs. maximum: Actual profit = $1,760. Maximum possible =
      $1,760. Since Saturday's hiring decision is break-even, actual equals optimal. There's no
      profit left on the table given the demand that showed up. The staffing was optimal (or
      tied-optimal on Saturday).
