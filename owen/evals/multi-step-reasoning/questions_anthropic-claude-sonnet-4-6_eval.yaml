    A car travels from City A to City B, a distance of 240 miles. It goes the first 90 miles at 60 mph, then hits traffic and covers the next 60 miles at 20 mph, then drives the remaining distance at 70 mph. What is the car's average speed for the entire trip?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: math
    difficulty: hard
    task_type: calculation
    split: test
    expected_direct: The car's average speed for the entire trip is approximately 42.4 mph.
    expected_stepwise: |-
      Average speed is total distance divided by total time, so I need to find the time for each
      segment. Step 1: Find the distance of each segment. - Segment 1: 90 miles at 60 mph - Segment
      2: 60 miles at 20 mph - Segment 3: 240 - 90 - 60 = 90 miles at 70 mph Step 2: Calculate the
      time for each segment using time = distance ÷ speed. - Segment 1: 90 ÷ 60 = 1.5 hours -
      Segment 2: 60 ÷ 20 = 3.0 hours - Segment 3: 90 ÷ 70 ≈ 1.2857 hours Step 3: Calculate total
      time. 1.5 + 3.0 + 1.2857 ≈ 5.7857 hours Step 4: Calculate average speed. Average speed = Total
      distance ÷ Total time = 240 ÷ 5.7857 ≈ 41.48 mph The car's average speed for the entire trip
      is approximately 41.5 mph.
