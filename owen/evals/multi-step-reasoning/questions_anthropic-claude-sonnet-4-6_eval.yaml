    How much would it cost in electricity to mine one Bitcoin using a typical home computer?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: estimation
    difficulty: hard
    task_type: calculation
    split: test
    expected_direct: |-
      Mining one Bitcoin on a typical home computer would cost somewhere in the range of $10 million
      to $100 million in electricity — completely impractical. A consumer CPU produces maybe 100
      MH/s, while the Bitcoin network requires roughly 400 exahashes per second total, and a block
      reward is 3.125 BTC. Your share of the network is so tiny that you'd expect to wait millions
      of years, and the cumulative electricity cost over that time would be astronomical.
    expected_stepwise: |-
      Let me work through this carefully. 1. **Bitcoin network hash rate**: As of 2024, the Bitcoin
      network operates at roughly 500 exahashes per second (EH/s) = 5 × 10^20 hashes/second. 2.
      **Home CPU hash rate**: A typical consumer CPU (e.g., Intel Core i7) achieves about 1,000
      hashes/second (1 KH/s) for Bitcoin's SHA-256 algorithm. That's 1 × 10^3 H/s. 3. **Your share
      of the network**: Your fraction of total hash power = 10^3 / (5 × 10^20) = 2 × 10^-18. This is
      your probability of winning any given block. 4. **Blocks per day**: Bitcoin produces a block
      every 10 minutes → 144 blocks/day. Each block currently rewards 3.125 BTC. 5. **Expected time
      to mine 1 BTC**: - Expected BTC earned per day = 144 blocks × 3.125 BTC × 2 × 10^-18 = ~9 ×
      10^-16 BTC/day - Days to earn 1 BTC = 1 / (9 × 10^-16) ≈ 1.1 × 10^15 days ≈ 3 billion years 6.
      **Electricity cost**: - A typical CPU under full load uses about 65 watts = 0.065 kW - Over
      1.1 × 10^15 days = 2.6 × 10^16 hours of operation - Energy used = 0.065 kW × 2.6 × 10^16 h ≈
      1.7 × 10^15 kWh - At $0.12/kWh → Cost ≈ **$2 × 10^14, or about $200 trillion** **Conclusion:
      Mining 1 BTC on a home CPU would cost roughly $200 trillion in electricity — obviously not
      feasible. Even rounding generously, it's tens of trillions of dollars.**
