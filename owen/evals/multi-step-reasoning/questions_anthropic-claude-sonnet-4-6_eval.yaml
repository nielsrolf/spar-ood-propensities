- id: multi_step_reasoning_183
  paraphrases:
  - |-
    There are 6 colored boxes in a row: red, blue, green, yellow, orange, and purple. Figure out their order from left to right using these clues:
    1. Red is somewhere to the left of blue.
    2. Green is not adjacent to yellow.
    3. Orange is in position 1 or 6.
    4. Purple is exactly two positions to the right of green.
    5. Blue is not in position 5 or 6.
    6. Yellow is somewhere to the right of orange.
    What is the order of boxes from left to right?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic_puzzles
    difficulty: very_hard
    task_type: constraint_satisfaction
    split: train
    expected_direct: |-
      The order from left to right is: Orange, Red, Green, Yellow, Purple, Blue. Wait — let me
      reconsider. The correct order is: Orange, Green, Red, Purple, Yellow, Blue.
    expected_stepwise: |-
      Let me apply the constraints step by step. From clue 3: Orange is in position 1 or 6. From
      clue 6: Yellow is to the right of orange. - If orange were in position 6, nothing could be to
      its right, violating clue 6. - Therefore, Orange is in position 1. So: [Orange, _, _, _, _, _]
      From clue 6: Yellow is in positions 2–6. From clue 4: Purple is exactly 2 positions to the
      right of green. Possible (green, purple) pairs: (1,3), (2,4), (3,5), (4,6). Since position 1
      is Orange, green cannot be in position 1. So the pairs are: (2,4), (3,5), or (4,6). From clue
      5: Blue is not in position 5 or 6, so Blue is in positions 2–4. From clue 1: Red is to the
      left of blue. Since blue is at most in position 4, red can be in positions 1–3. But position 1
      is orange, so red is in position 2 or 3. Let's try the green/purple pairs: Case A: Green=2,
      Purple=4. - Remaining positions 3, 5, 6 for red, yellow, blue. - Blue must be in positions
      2–4, but 2 and 4 are taken. So Blue=3. - Red must be left of blue (position 3), so red is in
      position 1 or 2 — but 1 is orange and 2 is green. Contradiction. ✗ Case B: Green=3, Purple=5.
      - Remaining positions 2, 4, 6 for red, yellow, blue. - Blue is in positions 2–4, so blue is in
      position 2 or 4. - Red is left of blue; red is in position 2 or 4 (whatever blue doesn't
      take), and must be further left. - If Blue=4, Red must be in position 2 (left of 4). ✓ Then
      Yellow=6. - Check clue 2: Green (position 3) not adjacent to Yellow (position 6). |3−6|=3, not
      adjacent. ✓ - Check clue 6: Yellow (6) to the right of Orange (1). ✓ - Full sequence:
      Orange(1), Red(2), Green(3), Blue(4), Purple(5), Yellow(6). - Check clue 1: Red(2) < Blue(4) ✓
      - Check clue 5: Blue in position 4, not 5 or 6 ✓ - All clues satisfied! ✓ Final order: Orange,
      Red, Green, Blue, Purple, Yellow.
