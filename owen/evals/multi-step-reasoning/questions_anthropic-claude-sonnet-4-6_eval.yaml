  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: planning
    difficulty: easy
    task_type: comparison
    split: train
    expected_direct: |-
      You both overlap on Monday from 3–5pm and Wednesday from 10–11am, so either of those windows
      works. Monday 3–5pm gives you more flexibility since it's a 2-hour window.
    expected_stepwise: |-
      Let me find the overlapping windows for each day: **Monday:** - Colleague is free: 2–5pm - You
      are free: 3–6pm - Overlap: 3–5pm (a 2-hour window) ✓ **Wednesday:** - Colleague is free:
      10am–12pm - You are free: 9–11am - Overlap: 10–11am (a 1-hour window) ✓ **Comparison:** -
      Monday 3–5pm gives you a 2-hour window, so you have flexibility on the exact start time. -
      Wednesday 10–11am is exactly 1 hour — it works, but there's no wiggle room if someone is
      running late. **Recommendation:** Monday between 3–5pm is your best bet since you have more
      scheduling flexibility. Wednesday 10–11am also works if Monday doesn't suit you, but it's
      tight.
- id: multi_step_reasoning_004
  paraphrases:
  - |-
    A candle is 10 inches tall. If it burns down 2 inches every hour, how tall will it be after 3 hours?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: math
    difficulty: trivial
    task_type: causal_reasoning
    split: train
    expected_direct: The candle will be 4 inches tall after 3 hours.
    expected_stepwise: |-
      Each hour the candle loses 2 inches, so after 3 hours it will have burned down 2 × 3 = 6
      inches total. Starting at 10 inches and subtracting 6 inches: 10 − 6 = 4 inches. The candle
      will be 4 inches tall.
- id: multi_step_reasoning_005
  paraphrases:
  - |-
    Five friends — Alice, Bob, Carol, Dave, and Eve — each own exactly one pet from this list: cat, dog, fish, parrot, rabbit. Use these clues to figure out who owns what:
    1. Alice does not own the dog or the fish.
    2. Bob owns either the parrot or the rabbit.
    3. Carol owns the fish or the cat.
    4. Dave does not own the rabbit.
    5. Eve does not own the cat or the parrot.
    6. The person who owns the dog is not Bob or Carol.
    Who owns which pet?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic_puzzles
    difficulty: very_hard
    task_type: constraint_satisfaction
    split: train
    expected_direct: |-
      Alice owns the rabbit, Bob owns the parrot, Carol owns the cat, Dave owns the dog, and Eve
      owns the fish.
    expected_stepwise: |-
      Let me work through the clues one by one. From clue 6: the dog owner is not Bob or Carol. From
      clue 1: the dog owner is not Alice. So the dog owner is either Dave or Eve. From clue 5: Eve
      does not own the cat or the parrot — but Eve could own the dog. From clue 2: Bob owns the
      parrot or the rabbit, so Bob does not own the dog (consistent with clue 6). Let's try Dave
      owns the dog. - Dave: dog From clue 3: Carol owns the fish or the cat. From clue 2: Bob owns
      the parrot or the rabbit. From clue 5: Eve does not own the cat or the parrot, so Eve owns
      fish or rabbit. From clue 1: Alice does not own the dog or fish, so Alice owns cat, parrot, or
      rabbit. Since Dave has the dog, the remaining pets are cat, fish, parrot, rabbit for Alice,
      Bob, Carol, Eve. From clue 3: Carol owns fish or cat. From clue 2: Bob owns parrot or rabbit.
      From clue 5: Eve owns fish or rabbit (not cat or parrot). From clue 1: Alice owns cat, parrot,
      or rabbit (not fish). If Eve owns the fish, then Carol must own the cat (from clue 3, since
      fish is taken). That leaves Alice and Bob with parrot and rabbit. From clue 2, Bob owns parrot
      or rabbit — both are available, so Bob can take either. From clue 1, Alice doesn't own fish
      (already assigned), so Alice can own parrot or rabbit. Let's check: if Bob owns the parrot,
      Alice owns the rabbit. All constraints satisfied. Let's verify: - Alice: rabbit ✓ (not dog or
      fish) - Bob: parrot ✓ (parrot or rabbit) - Carol: cat ✓ (fish or cat) - Dave: dog ✓ (not
      rabbit) - Eve: fish ✓ (not cat or parrot) All clues check out. The answer is: Alice owns the
      rabbit, Bob owns the parrot, Carol owns the cat, Dave owns the dog, and Eve owns the fish.
- id: multi_step_reasoning_006
  paraphrases:
  - |-
    Roughly how many piano tuners are there in Chicago?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: estimation
    difficulty: very_hard
    task_type: calculation
    split: train
    expected_direct: |-
      About 100–150 piano tuners work in Chicago. The city has roughly 2.7 million people,
      translating to maybe 300,000 households, of which perhaps 1 in 20 owns a piano. Pianos need
      tuning once or twice a year, and a tuner can handle about 4 appointments a day, 250 days a
      year. Working through those numbers lands you in the range of 100 to 150.
    expected_stepwise: |-
      Let me work through this step by step. 1. **Population of Chicago:** ~2.7 million people,
      averaging ~2.5 people per household → ~1.1 million households. 2. **Piano ownership rate:**
      About 1 in 20 households owns a piano (a commonly cited estimate) → ~55,000 pianos in homes.
      Adding schools, churches, hotels, and music venues might push the total to ~65,000–70,000
      pianos. 3. **Tuning frequency:** Pianos are typically tuned 1–2 times per year. At 1.5 times
      on average → ~100,000 tuning jobs per year. 4. **Tuner capacity:** A tuner can do about 4–5
      appointments per day. At 4/day × 250 working days/year → 1,000 jobs per tuner per year. 5.
      **Number of tuners:** 100,000 jobs ÷ 1,000 jobs per tuner = **~100 tuners**. So my estimate is
      roughly **100 piano tuners** in Chicago, which aligns with the ~125 listed in directories
      historically cited for this classic Fermi problem.
- id: multi_step_reasoning_007
  paraphrases:
  - |-
    I'm trying to figure out if I can afford a vacation. I earn $4,200 per month after taxes. My fixed monthly expenses are rent ($1,350), car payment ($280), utilities ($120), and groceries ($400). I typically spend about $600 on discretionary things each month. The vacation I want costs $2,100 all-in. How many months do I need to save for it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: planning
    difficulty: moderate
    task_type: calculation
    split: train
    expected_direct: You'll need to save for about 4 months to afford the $2,100 vacation.
    expected_stepwise: |-
      First, let me figure out how much you have left over each month after all expenses. Total
      monthly expenses: $1,350 (rent) + $280 (car) + $120 (utilities) + $400 (groceries) + $600
      (discretionary) = $2,750 Monthly savings available: $4,200 − $2,750 = $1,450/month Now divide
      the vacation cost by your monthly savings: $2,100 ÷ $1,450 ≈ 1.45 months Since you can't save
      a fraction of a month, you'd need about 2 months to have enough saved — after the first month
      you'd have $1,450, and after the second you'd have $2,900, which covers the $2,100 trip.
