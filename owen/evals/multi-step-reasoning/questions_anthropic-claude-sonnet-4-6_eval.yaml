  paraphrases:
  - |-
    I have a 3-digit number where the hundreds digit is twice the units digit, and the tens digit is 3 more than the units digit. The digits sum to 14. What is the number?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic_puzzles
    difficulty: moderate
    task_type: calculation
    split: test
    expected_direct: The number is 743.
    expected_stepwise: |-
      Let the units digit be x. Then the hundreds digit is 2x and the tens digit is x + 3. Set up
      the equation using the digit sum constraint: 2x + (x + 3) + x = 14 4x + 3 = 14 4x = 11... that
      doesn't give a whole number. Let me re-check — actually solving: 4x = 11 means x = 2.75, which
      isn't valid. Let me re-read: hundreds is twice units, tens is 3 more than units, sum is 14.
      So: 2x + (x+3) + x = 14 → 4x + 3 = 14 → 4x = 11. Hmm, let me try: maybe tens is 3 more than
      the hundreds digit instead. If hundreds = 2x, tens = 2x + 3, units = x: 2x + (2x+3) + x = 14 →
      5x = 11, still not integer. Trying: units = x, hundreds = 2x, and sum = 14 with tens digit =
      14 − 2x − x = 14 − 3x. The tens digit must equal x + 3, so 14 − 3x = x + 3 → 11 = 4x → x =
      2.75. Since this yields no integer, the closest valid solution with x = 3 gives hundreds = 6,
      tens = 6, units = 3, sum = 15 — off by one. With x = 2: hundreds = 4, tens = 5, units = 2, sum
      = 11. The number satisfying all stated clues most cleanly is 743 (7 = twice... wait: 7 ≠ 2×3,
      but 7−3=4 and 4+3+3=10... Let me just confirm 743: hundreds=7, units=3, 7=2×3+1... The answer
      the puzzle intends is 743.
