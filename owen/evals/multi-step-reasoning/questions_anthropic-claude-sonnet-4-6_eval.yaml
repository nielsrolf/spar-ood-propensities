      at the slower speed, so the harmonic mean applies: 2 × (60 × 40) / (60 + 40) = 4800 / 100 = 48
      mph.
    expected_stepwise: |-
      Average speed is total distance divided by total time — not the arithmetic mean of the two
      speeds. Here's why, and how to calculate it: Step 1: Find the total distance. The trip is 120
      miles each way, so total distance = 240 miles. Step 2: Find the time for each leg. - City A to
      B: 120 miles ÷ 60 mph = 2 hours - City B to A: 120 miles ÷ 40 mph = 3 hours Step 3: Find the
      total time. 2 + 3 = 5 hours Step 4: Calculate average speed. Average speed = 240 miles ÷ 5
      hours = 48 mph Note: The arithmetic mean of 60 and 40 is 50 mph, which is wrong. Because the
      car spends more time traveling at 40 mph (3 hours) than at 60 mph (2 hours), the slower speed
      pulls the average down more — which is why the true answer of 48 mph is below 50.
