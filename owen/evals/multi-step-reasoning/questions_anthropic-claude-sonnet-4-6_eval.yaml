      and full health coverage, Job A yields about $109,500 in total annual value. Job B gives
      $120,750 in base plus bonus but you lose $1,800/year on health premiums and roughly
      $7,800/year in commuting costs (gas, transit, or wear), putting it around $111,150. The gap is
