    difficulty: very_hard
    task_type: causal_reasoning
    split: test
    expected_direct: |-
      The paired-then-split approach takes 3 + 8 = 11 days, well within the 14-day deadline. No
      other standard approach beats this — pairing on all three features would take 9 days but
      wastes collaboration on sequential work, and having A solo on Feature 1 then splitting would
      take 5 + 8 = 13 days, which barely fits but is slower.
    expected_stepwise: |-
      Let me evaluate the proposed approach and then check alternatives. **Step 1: Evaluate the
      proposed approach (pair on F1, then split).** - Pair A+B on Feature 1: 3 days. - After F1, A
      solos Feature 2 (5 days) while B solos Feature 3 (8 days) in parallel. - The bottleneck is
      whichever solo task takes longer: 8 days (Engineer B). - Total: 3 + 8 = **11 days**. ✅ Meets
      the 14-day deadline. **Step 2: Check alternative — A solos Feature 1, then split.** - A solos
      F1: 5 days. - Then A solos F2 (5 days) while B solos F3 (8 days) in parallel. - Total: 5 + 8 =
      **13 days**. ✅ Still meets deadline, but slower than proposed. **Step 3: Check alternative — B
      solos Feature 1, then split.** - B solos F1: 8 days. - Then A solos F2 (5 days) while B solos
      F3 (8 days) in parallel. - Total: 8 + 8 = **16 days**. ❌ Misses the deadline. **Step 4: Check
      alternative — pair on all features sequentially.** - Pair on F1: 3 days, pair on F2: 3 days,
      pair on F3: 3 days. - Total: 9 days. ✅ Fastest total time, but this assumes you can't
      parallelize — which you can after F1, so this wastes potential parallelism. **Step 5: Check if
      there's a smarter hybrid.** - What if you pair on F1 (3 days), then pair on F2 (3 days), then
      A or B solos F3? - That's 3 + 3 + 5 = 11 days (if A solos F3) or 3 + 3 + 8 = 14 days (if B
      solos F3). The B variant barely meets deadline, A variant ties with proposed approach. - But
      this is sequential, not parallel — it's not necessarily better. **Conclusion:** The proposed
      approach (pair on F1, split for F2/F3) finishes in **11 days** and meets the deadline. The
      only faster approach would be pairing on all features sequentially (9 days total), but that's
      only better if you can't parallelize. Given that F2 and F3 are independent of each other, the
      parallel split approach at 11 days is optimal among realistic strategies.
- id: multi_step_reasoning_489
  paraphrases:
  - |-
    I have a cron job that runs every night at 2 AM to back up a MySQL database. It worked for months but suddenly stopped producing backup files three weeks ago. The cron job is still listed in crontab, the script file exists and is executable, no error emails are being sent, and disk space is not an issue. How do I diagnose this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: hard
    task_type: constraint_satisfaction
    split: test
    expected_direct: |-
      The most likely causes are: (1) the script is silently failing because mysqldump can no longer
      authenticate — check if the MySQL password or user was changed; (2) cron is running the job
      but output is being discarded (redirect stderr to a log file to catch errors); (3) the PATH
      inside cron's environment doesn't include mysqldump's location; or (4) a dependency like the
      .my.cnf credentials file was removed or moved. Add `2>> /var/log/backup_error.log` to the cron
      entry to capture errors immediately.
    expected_stepwise: |-
      Let's systematically satisfy each constraint: cron is active, the script exists and is
      executable, no error emails, no disk space issue, but no output files for three weeks. Step 1
      — Capture output you're currently missing. Cron jobs don't send email errors if the system's
      mail daemon isn't configured, or if the cron entry explicitly discards output. Edit the
      crontab entry to redirect both stdout and stderr to a log: `0 2 * * * /path/to/backup.sh >>
      /var/log/backup.log 2>&1`. After the next run, check that log. This single step resolves a
      huge class of 'silent failure' problems. Step 2 — Run the script manually as the cron user.
      Execute `sudo -u <cron_user> /path/to/backup.sh` right now. If it fails, you have your answer
      immediately and can see the error message. If it succeeds, the problem is environmental —
      something differs between the cron execution context and your interactive shell. Step 3 —
      Check the cron execution environment. Cron runs with a minimal PATH (typically /usr/bin:/bin).
      If mysqldump lives in /usr/local/bin or another non-standard location, cron can't find it.
      Verify with `which mysqldump` and hardcode the full path in the script (e.g.,
      /usr/bin/mysqldump). Step 4 — Verify MySQL credentials haven't changed. Three weeks ago aligns
      with a potential credential rotation, plugin change (e.g., auth_socket vs. password auth), or
      user privilege revocation. Check if the credentials used in the script (or in a referenced
      .my.cnf file) still work: `mysql -u backup_user -p`. Step 5 — Check if the .my.cnf or
      credentials file still exists and is readable. Scripts often reference `~/.my.cnf` for
      passwordless authentication. If that file was moved, deleted, or had its permissions changed,
      mysqldump silently exits with an auth error. Step 6 — Review system logs for the time window
      around 2 AM. Check `/var/log/syslog` or `journalctl` for cron entries around 2 AM to confirm
      the job is actually being triggered: `grep CRON /var/log/syslog | grep backup`. Conclusion:
      Start with steps 1 and 2 — add logging and run manually. These will expose the root cause in
      the vast majority of cases. Most likely culprits given the 3-week timeline are a credential
      change (Step 4) or a missing .my.cnf file (Step 5).
