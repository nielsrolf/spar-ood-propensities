      Yes — assign Sam as Lead, Taylor as Analyst, and Jordan as Coordinator. This is the only valid
      assignment that satisfies all the constraints.
    expected_stepwise: |-
      Let me work through the constraints systematically to find a valid assignment. **Constraints
      summary:** - Jordan ≠ Lead - Sam ≠ Analyst - Taylor ≠ Coordinator (preferred) - Each person
      gets exactly one role; each role is filled by exactly one person **Step 1: Start with the
      hardest constraints.** Jordan cannot be Lead, so Jordan → {Analyst, Coordinator} Sam cannot be
      Analyst, so Sam → {Lead, Coordinator} Taylor should not be Coordinator, so Taylor → {Lead,
      Analyst} **Step 2: Try assigning Taylor first (fewest options).** Taylor can be Lead or
