- id: multi_step_reasoning_077
  paraphrases:
  - |-
    I'm planning a road trip and need to visit exactly 4 cities: Austin, Denver, Chicago, and Nashville. I'm starting and ending in Atlanta. The distances (one-way) between cities are: Atlanta-Austin 921 mi, Atlanta-Denver 1398 mi, Atlanta-Chicago 716 mi, Atlanta-Nashville 249 mi, Austin-Denver 1032 mi, Austin-Chicago 1092 mi, Austin-Nashville 892 mi, Denver-Chicago 1004 mi, Denver-Nashville 1127 mi, Chicago-Nashville 476 mi. What's the shortest possible total route?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: math
    difficulty: very_hard
    task_type: constraint_satisfaction
    split: train
    expected_direct: |-
      The shortest route is Atlanta → Nashville → Chicago → Denver → Austin → Atlanta, totaling 249
      + 476 + 1004 + 1032 + 921 = 3,682 miles.
    expected_stepwise: |-
      This is a Traveling Salesman Problem with 5 cities (Atlanta as start/end) and 4 intermediate
      cities. I need to evaluate all possible orderings of {Austin, Denver, Chicago, Nashville}.
      There are 4! = 24 permutations, but since the route is a loop, I can fix Atlanta at the start
      and enumerate the 4!/2 = 12 distinct tours (each tour and its reverse have the same distance).
      Let me calculate the most promising routes by grouping geographically sensible options: Route
      1: ATL → Nashville → Chicago → Denver → Austin → ATL 249 + 476 + 1004 + 1032 + 921 = 3,682
      miles Route 2: ATL → Austin → Denver → Chicago → Nashville → ATL 921 + 1032 + 1004 + 476 + 249
      = 3,682 miles (same route reversed) Route 3: ATL → Nashville → Chicago → Austin → Denver → ATL
      249 + 476 + 1092 + 1032 + 1398 = 4,247 miles Route 4: ATL → Chicago → Nashville → Austin →
      Denver → ATL 716 + 476 + 892 + 1032 + 1398 = 4,514 miles Route 5: ATL → Chicago → Denver →
      Austin → Nashville → ATL 716 + 1004 + 1032 + 892 + 249 = 3,893 miles Route 6: ATL → Nashville
      → Austin → Denver → Chicago → ATL 249 + 892 + 1032 + 1004 + 716 = 3,893 miles (same as Route 5
      reversed) Route 7: ATL → Austin → Nashville → Chicago → Denver → ATL 921 + 892 + 476 + 1004 +
      1398 = 4,691 miles Route 8: ATL → Denver → Chicago → Nashville → Austin → ATL 1398 + 1004 +
      476 + 892 + 921 = 4,691 miles (same reversed) Route 9: ATL → Nashville → Denver → Chicago →
      Austin → ATL 249 + 1127 + 1004 + 1092 + 921 = 4,393 miles Route 10: ATL → Austin → Chicago →
      Denver → Nashville → ATL 921 + 1092 + 1004 + 1127 + 249 = 4,393 miles (same reversed)
      Comparing all unique totals: 3,682 / 3,893 / 4,247 / 4,393 / 4,514 / 4,691 The shortest route
