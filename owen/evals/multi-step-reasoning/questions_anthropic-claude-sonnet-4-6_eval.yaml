- id: multi_step_reasoning_377
  paraphrases:
  - |-
    Why does bread get stale faster when stored in the fridge compared to leaving it on the counter?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: estimation
    difficulty: easy
    task_type: causal_reasoning
    split: test
    expected_direct: |-
      Bread goes stale faster in the fridge because the cold temperature speeds up starch
      crystallization, which makes the bread firm and dry more quickly than at room temperature.
    expected_stepwise: |-
      It seems counterintuitive since cold usually slows things down, so let's trace the cause.
      Bread going 'stale' is mostly caused by a process called starch retrogradation — the starch
      molecules in the bread slowly reorganize into a more crystalline, rigid structure, which makes
      the bread firm and dry. Here's the key: this retrogradation process actually happens fastest
      at temperatures just above freezing, roughly 35–40°F — which is right in the refrigerator's
      range. At room temperature (~70°F), the process is slower. So the fridge accelerates the very
      chemical process that causes staleness. If you want to preserve bread long-term, freezing it
      (below 32°F) is better because it stops the process entirely.
- id: multi_step_reasoning_378
  paraphrases:
  - |-
    Why does a campfire die out if you stop adding wood?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: estimation
    difficulty: trivial
    task_type: causal_reasoning
    split: test
    expected_direct: |-
      Fire needs fuel to keep burning — once the existing wood burns down to ash, there's nothing
      left to combust, so the fire goes out.
    expected_stepwise: |-
      Let's trace the causal chain. Fire is a chemical reaction (combustion) that requires three
      things: fuel, oxygen, and heat — often called the fire triangle. Wood serves as the fuel. As
      the wood burns, it converts into heat, light, carbon dioxide, water vapor, and ash. The ash
      that remains is already fully oxidized and can no longer serve as fuel. If no new wood is
      added, the supply of combustible material steadily decreases. As the fuel runs low, there's
      less reaction happening, which means less heat is generated. Eventually the heat output drops
      below the ignition temperature needed to sustain combustion, and the fire extinguishes. So the
      root cause is simply that fuel is consumed and not replenished.
