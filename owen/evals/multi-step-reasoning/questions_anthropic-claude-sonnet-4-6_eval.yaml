    If I leave my freezer door open by accident overnight, why would my food thaw out?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: estimation
    difficulty: trivial
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      The freezer loses its cold air, which is replaced by warm room-temperature air, so the
      temperature inside rises and your food thaws.
    expected_stepwise: |-
      Let's trace through what happens step by step. First, the freezer is normally kept around 0°F
      (-18°C) by a compressor that removes heat from the interior. When the door is left open, cold
      air (which is denser) spills out the bottom and warm room air (around 68-72°F) flows in to
      replace it. The freezer's compressor will try to compensate, but it's not designed to cool an
      open space — it can't remove heat fast enough when warm air is continuously entering. Over
      several hours, the interior temperature climbs above 32°F (0°C), which is the threshold where
      ice crystals in food begin to melt. So the food thaws because the temperature inside rises
      above freezing due to the continuous exchange of cold interior air with warm room air.
- id: multi_step_reasoning_092
  paraphrases:
  - |-
    I'm launching a mobile app in a competitive market and have $50,000 to spend. Should I put the majority of the budget into user acquisition, product development, or customer support infrastructure first?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: analysis
    difficulty: hard
    task_type: sequential_planning
    split: train
    expected_direct: |-
      Prioritize product development first. Without a solid, differentiated product, user
      acquisition spend is wasted — users will churn quickly. Once you have a stable, high-quality
      core experience, shift to user acquisition to drive growth, and only then build out customer
      support infrastructure as your user base grows and demands it. So: product → acquisition →
      support.
    expected_stepwise: |-
      To figure out the right allocation, I need to think through the dependencies between these
      three areas. First, consider what happens if you spend on user acquisition before the product
      is ready: users arrive, experience a rough or undifferentiated product, churn quickly, and
      you've burned budget with nothing to show for it. CAC (customer acquisition cost) is only
      worth paying if LTV (lifetime value) justifies it — and LTV depends heavily on product quality
      and retention. Second, consider customer support infrastructure. Support costs scale with user
      volume, so it doesn't make sense to build this out before you have users. Early on, founders
      can handle support manually — it's actually valuable because it surfaces product issues
      directly. Third, consider product development. A strong core product drives organic
      word-of-mouth, improves retention, and makes paid acquisition efficient. This is the
      foundation everything else depends on. So the logical sequence is: (1) invest primarily in
      product development first to reach a quality threshold where retention is strong, (2) then
      shift to user acquisition once you have evidence users stick around, (3) then invest in
      customer support infrastructure once volume makes manual support unsustainable. Conclusion:
      Prioritize product development first, then user acquisition, then customer support
      infrastructure.
- id: multi_step_reasoning_093
  paraphrases:
  - |-
    I'm trying to decide between two job offers. Offer A is $95,000 base salary, fully remote, no equity, 15 days PTO, covers 80% of health insurance premiums (~$200/month out of pocket), and is in a stable but slow-growing industry. Offer B is $82,000 base salary, requires me to commute 45 minutes each way to an office 4 days a week, gives me 0.5% equity in a Series B startup valued at $40M, 20 days PTO, and covers 100% of health insurance. I currently live in a city with above-average cost of living and value work-life balance highly. Which offer is better?
