      +$7,200 - **Total compensation value: ~$111,700** **Job B:** - Base salary: $115,000 - Annual
      bonus (5%): $5,750 - Health insurance employee share: $250/month × 12 = -$3,000/year - Net
      cash compensation: $117,750 - Now factor in commute: 3 days/week × ~48 weeks = 144 days/year ×
      90 min round trip = 216 hours/year lost. Even ignoring time cost, direct commuting expenses
      (transit/gas/parking) at a conservative $30/day = $4,320/year. - **Total compensation value
      after commute costs: ~$113,430** **Comparison:** Job B edges out Job A by roughly
      $1,700–$2,000 in pure financial terms — less than 2% difference. However, Job A provides 2
      additional weeks of PTO (worth ~$3,650 at Job A's salary rate) and eliminates ~216 hours of
