    If every person on Earth simultaneously flushed a toilet, roughly how much would global sea levels rise?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: estimation
    difficulty: very_hard
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      Almost nothing — maybe on the order of a nanometer or less. The water in toilet tanks is
      already part of the hydrological system (rivers, reservoirs, groundwater), so flushing
      redistributes it rather than adding new water. The net effect on sea level would be
      negligible, well under a micron.
    expected_stepwise: |-
      Let me think through two separate effects: water displacement from flushing and where the
      water ends up. Step 1: How much water is involved? About 8 billion people, and let's say
      roughly half are near a toilet at any given moment — but the question says everyone flushes
      simultaneously, so let's say ~4 billion accessible toilets. A standard toilet tank holds about
      6–9 liters; call it ~7 liters per flush. Total water flushed: ~4 × 10⁹ × 7 L = 2.8 × 10¹⁰
      liters = 2.8 × 10⁷ m³. Step 2: What's the surface area of Earth's oceans? About 361 million
      km² = 3.61 × 10¹⁴ m². Step 3: What sea level rise would that volume cause? Rise = Volume /
      Area = (2.8 × 10⁷ m³) / (3.61 × 10¹⁴ m²) ≈ 7.7 × 10⁻⁸ m, or about 77 nanometers. Step 4: But
      wait — does this actually raise sea levels? The water in toilet tanks comes from reservoirs,
      groundwater, and rivers — all of which are already part of the surface or near-surface water
      cycle. Flushing moves that water from tanks into sewers and eventually back to the ocean or
      ground. It doesn't import water from some other source. So the net change in sea level is
      essentially zero, because the water was already 'counted' in the Earth's water budget.
      Conclusion: The raw displacement math gives ~77 nanometers, but causally, since the water is
      already in the hydrological cycle, the real net effect on sea level is effectively zero — far
      smaller than tidal fluctuations or measurement noise.
