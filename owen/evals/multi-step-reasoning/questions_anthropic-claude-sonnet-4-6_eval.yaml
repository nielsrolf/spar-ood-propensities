      runs 80,000–100,000 words or more. Comparing the two ranges, a novel is significantly longer
      than a short story in virtually every case. **Answer**: A novel is longer.
- id: multi_step_reasoning_499
  paraphrases:
  - |-
    A farmer notices that every time he waters his crops in the morning, there are more weeds the next day. He concludes that watering causes weeds to grow faster. Is his reasoning sound?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic_puzzles
    difficulty: moderate
    task_type: causal_reasoning
    split: test
    expected_direct: |-
      No, his reasoning isn't sound. Correlation doesn't imply causation — both crops and weeds need
      water to grow, so watering benefits both equally. The real cause of more weeds is the water
      itself helping all plants grow, not something unique about morning watering causing weeds
      specifically.
    expected_stepwise: |-
      Let's examine whether the farmer's causal conclusion is justified. First, what is he
      observing? He sees a consistent pattern: morning watering is followed by more weeds the next
      day. This establishes a correlation. Second, does correlation imply causation here? Not
      necessarily. We need to ask whether there's a plausible confounding explanation. Third, is
      there an alternative explanation? Yes — water promotes the growth of all plants, including
      weeds. The weeds aren't growing *because* he watered his crops specifically; they're growing
      because water was present. Both events (crop watering and weed growth) share the same
      underlying cause: water availability. Fourth, how could he test this? He could compare weed
      growth on days he waters versus days he doesn't, or water at a different time and see if weeds
      still increase. His reasoning commits the classic correlation-causation fallacy. The water
      isn't causing weeds to grow *more than they otherwise would* — it's simply that water helps
      all plants, and the farmer is observing that effect without isolating the variable. His
      conclusion is not sound.
- id: multi_step_reasoning_500
  paraphrases:
  - |-
    I'm planning a road trip and need to visit 4 cities: Austin, Dallas, Houston, and San Antonio. I'm starting and ending in Austin. I want to minimize total driving distance. Dallas is about 195 miles from Austin, 240 miles from Houston, and 275 miles from San Antonio. Houston is 200 miles from San Antonio. San Antonio is 80 miles from Austin. What order should I visit them in?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: planning
    difficulty: very_hard
    task_type: comparison
    split: test
    expected_direct: |-
      Go Austin → San Antonio → Houston → Dallas → Austin. That route totals about 80 + 200 + 240 +
      195 = 715 miles, which is the shortest loop.
    expected_stepwise: |-
      This is a Traveling Salesman Problem with 4 cities. Let me enumerate all possible routes
      starting and ending in Austin (there are 3! = 6 unique orderings of the other 3 cities).
      **Known distances:** - Austin ↔ Dallas: 195 mi - Austin ↔ Houston: (not given directly — I'll
      infer: Houston is 240 mi from Dallas and 200 mi from San Antonio; Austin to Houston is
      typically ~165 mi, but since it wasn't stated I'll use the given data only) - Austin ↔ San
      Antonio: 80 mi - Dallas ↔ Houston: 240 mi - Dallas ↔ San Antonio: 275 mi - Houston ↔ San
      Antonio: 200 mi Note: Austin↔Houston distance isn't explicitly given. It can be estimated:
      Austin→San Antonio (80) + San Antonio→Houston (200) = 300 mi via SA, or Austin→Dallas (195) +
      Dallas→Houston (240) = 435 via Dallas. The direct distance is roughly 165 mi, but since it's
      not provided, I'll flag this. For completeness, I'll use 165 mi as a reasonable estimate for
      Austin↔Houston, or note which routes don't require it. **Enumerate all 6 routes:** 1. Austin →
      Dallas → Houston → San Antonio → Austin = 195 + 240 + 200 + 80 = **715 miles** 2. Austin →
      Dallas → San Antonio → Houston → Austin = 195 + 275 + 200 + 165 = **835 miles** 3. Austin →
      Houston → Dallas → San Antonio → Austin = 165 + 240 + 275 + 80 = **760 miles** 4. Austin →
      Houston → San Antonio → Dallas → Austin = 165 + 200 + 275 + 195 = **835 miles** 5. Austin →
      San Antonio → Dallas → Houston → Austin = 80 + 275 + 240 + 165 = **760 miles** 6. Austin → San
      Antonio → Houston → Dallas → Austin = 80 + 200 + 240 + 195 = **715 miles** **Comparison:** -
      Routes 1 and 6 tie at 715 miles (they are the same loop in opposite directions) - Routes 3 and
      5 tie at 760 miles - Routes 2 and 4 tie at 835 miles **Best route:** Austin → San Antonio →
      Houston → Dallas → Austin (or its reverse), totaling **715 miles**. This avoids the expensive
      Dallas↔San Antonio leg (275 mi) and chains the shorter connections efficiently.
- id: multi_step_reasoning_501
