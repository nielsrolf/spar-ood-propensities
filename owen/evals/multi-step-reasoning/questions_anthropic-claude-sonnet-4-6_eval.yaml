    My team has a project due in 3 weeks. I have 4 developers: Alice (senior, available full-time), Bob (mid-level, available 50% — he's on another project), Carol (senior, on vacation for week 2), and Dave (junior, full-time but needs 30% of his time supervised by a senior). The project has a front-end and back-end component of roughly equal size. How should I allocate the team?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: planning
    difficulty: hard
    task_type: comparison
    split: train
    expected_direct: |-
      Assign Alice to back-end full-time and have her supervise Dave on front-end. Bob handles
      front-end at 50% in weeks 1 and 3, and Carol covers back-end support when she returns in week
      3. This keeps senior oversight on Dave, uses Carol's return for a final push, and ensures the
      heavier back-end work has consistent senior attention throughout.
    expected_stepwise: |-
      Let me calculate effective capacity and then match it to the project components. **Step 1:
      Calculate available developer-weeks per person over 3 weeks** - Alice (senior, 100%): 3.0
      dev-weeks - Bob (mid-level, 50%): 1.5 dev-weeks - Carol (senior, 0% week 2, 100% weeks 1 & 3):
      2.0 dev-weeks - Dave (junior, 100% but 30% needs senior supervision): 3.0 dev-weeks, but only
      2.1 dev-weeks of independent output; 0.9 dev-weeks requires senior time **Step 2: Identify
      supervision constraints** Dave needs 0.9 dev-weeks of senior attention spread across 3 weeks
      (~0.3/week). This must come from Alice or Carol (when available). In week 2, only Alice is
      senior — she must supervise Dave that week. **Step 3: Estimate project size and split**
      Front-end and back-end are equal size. Total effective capacity ≈ 3.0 + 1.5 + 2.0 + 2.1 = 8.6
      dev-weeks. Each component needs ~4.3 dev-weeks. **Step 4: Assign team to components** -
      Back-end: Alice (3.0) + Carol in weeks 1 & 3 (2.0) = 5.0 dev-weeks — slightly over, giving
      buffer for complexity. - Front-end: Bob (1.5) + Dave (2.1 independent output) = 3.6 dev-weeks
      — slightly under, but manageable if scope is controlled. **Step 5: Handle the supervision
      constraint** Alice supervises Dave (~0.3 dev-weeks/week). In week 2 when Carol is out, Alice's
      back-end capacity drops slightly, but she can still maintain momentum. Carol returns in week 3
      for back-end final push and can relieve Alice on Dave supervision. **Step 6: Check for risks**
      - Week 2 is the bottleneck: only Alice as senior. Keep week 2 tasks for Dave routine/low-risk.
      - Bob's 50% availability means front-end can't rely on him for crunch — Dave must carry
      front-end independently most of the time. **Recommended allocation:** - Alice → back-end lead
      + Dave supervision (all 3 weeks) - Carol → back-end support (weeks 1 & 3) - Bob → front-end
      support (weeks 1 & 3, 50%) - Dave → front-end primary (all 3 weeks, with Alice check-ins)
