      the nearest cell tower. When the signal is strong, it only needs to transmit at low power to
      stay connected. But when the signal is weak, your phone automatically increases its
      transmitter power to try to reach the tower — this is called power control. Transmitting at
      higher power draws considerably more electricity from the battery. On top of that, when
      connections drop and reconnect, your phone performs additional handshake and authentication
      processes, which also consume power. Meanwhile, apps that rely on data keep retrying failed
      requests, adding further load. All of these factors — higher transmit power, frequent
      reconnection attempts, and app retries — compound to drain the battery faster in a low-signal
      area.
- id: multi_step_reasoning_441
  paraphrases:
  - |-
    Why do highways get more congested right after a rain starts compared to when it's been raining steadily for a while?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: estimation
    difficulty: moderate
    task_type: causal_reasoning
    split: test
    expected_direct: |-
      The roads are slickest at the very start of rain because water mixes with accumulated oil and
      dust on the surface, creating a slippery film. Drivers react by braking more suddenly and
      slowing down abruptly, which ripples back through traffic and causes congestion. Once it's
      been raining for a bit, the oil gets washed away, roads are cleaner, and drivers have adjusted
      their speed and spacing — so traffic flows more predictably even if it's slower overall.
    expected_stepwise: |-
      There are actually a few overlapping causes worth tracing through: **Cause 1: Road surface
      chemistry at the start of rain** Over days of dry weather, roads accumulate oil drips, rubber
      residue, and dust. When rain first hits, water emulsifies this layer into a slick film. This
      maximizes skid risk right at the onset. After 20–30 minutes of steady rain, this film washes
      away, and wet asphalt alone actually has better grip than oily-wet asphalt. **Cause 2: Driver
      behavioral lag** At the start of rain, some drivers brake suddenly when they feel their car
      respond differently — this causes the classic 'accordion effect' where one sudden brake
      triggers a cascade of braking behind them, creating a shockwave of congestion. After a while,
      all drivers have adjusted to wet-road following distances and speeds, so they're reacting more
      consistently and predictably. **Cause 3: Accident rate spike** The first few minutes of rain
      have a statistically higher accident and near-miss rate, which physically blocks lanes and
      forces rubbernecking slowdowns. These clear up as conditions stabilize. **Combined effect:**
      The early phase combines maximum road slipperiness + driver surprise + elevated crash risk all
      at once. After the rain has been steady, drivers adapt, the road surface is cleaner, and
      traffic settles into a new (slower but steadier) equilibrium. That's why the worst congestion
      is transient at the start rather than continuous.
