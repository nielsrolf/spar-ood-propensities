- id: multi_step_reasoning_201
  paraphrases:
  - |-
    My project was supposed to take 8 weeks but we're at week 6 and only 50% done. My manager is asking why we're behind. What's likely causing this, and how behind are we actually?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: planning
    difficulty: moderate
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      You're significantly behind — at week 6 you should be around 75% done if progress were linear,
      but you're at 50%, so you're about 25 percentage points behind schedule. At your current pace
      (roughly 8.3% per week), you'd need about 6 more weeks to finish, putting the total at ~12
      weeks instead of 8. Common causes include scope creep, underestimated task complexity, team
      capacity issues, or dependencies that took longer than expected.
    expected_stepwise: |-
      Let me break this into two parts: how behind you are, and why. For how behind: In a linear
      8-week project, at week 6 you'd expect to be 6/8 = 75% complete. You're at 50%, so you're 25
      percentage points behind where you should be. To estimate the new end date: you've completed
      50% in 6 weeks, meaning your actual rate is about 8.3% per week. The remaining 50% at that
      rate would take 50 / 8.3 ≈ 6 more weeks, putting total duration at ~12 weeks — 4 weeks over
      the original plan. For the likely causes, the gap between planned and actual progress
      typically comes from a few places: (1) The early weeks may have gone smoothly but a
      middle-phase dependency (waiting on another team, a vendor, an approval) caused a slowdown
      that's now compounding. (2) Scope may have expanded after the initial estimate. (3) The
      original 8-week estimate may have been optimistic — early tasks were easier and later ones are
      harder than assumed. (4) Team capacity may have changed (illness, competing priorities). The
      most honest answer to your manager is probably a combination of an optimistic initial estimate
      and at least one blocking dependency that wasn't anticipated.
