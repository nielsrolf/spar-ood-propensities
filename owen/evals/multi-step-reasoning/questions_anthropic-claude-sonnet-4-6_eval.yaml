  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic_puzzles
    difficulty: hard
    task_type: calculation
    split: train
    expected_direct: There are 6 red marbles in the bag.
    expected_stepwise: |-
      Let me define a variable and set up an equation. Step 1: Let r = number of red marbles. Total
      marbles = r + 4. Step 2: The probability of drawing two red marbles without replacement is:
      P(both red) = [r / (r + 4)] × [(r − 1) / (r + 3)] = 1/3 Step 3: Set up the equation: r(r − 1)
      / [(r + 4)(r + 3)] = 1/3 Step 4: Cross-multiply: 3r(r − 1) = (r + 4)(r + 3) 3r² − 3r = r² + 7r
      + 12 2r² − 10r − 12 = 0 r² − 5r − 6 = 0 Step 5: Factor: (r − 6)(r + 1) = 0 r = 6 or r = −1
      Since r must be positive, r = 6. There are 6 red marbles in the bag.
