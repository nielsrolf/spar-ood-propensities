      480 × $4 = $1,920/year. Step 2 — New annual fuel cost: 12,000 miles ÷ 40 mpg = 300 gallons per
      year. At $4/gallon: 300 × $4 = $1,200/year. Step 3 — Annual savings: $1,920 − $1,200 = $720
      saved per year. Step 4 — Break-even time: The new car costs $5,000 more upfront. To find when
      the savings cover that cost: $5,000 ÷ $720/year ≈ 6.94 years. Step 5 — Causal interpretation:
      The savings exist because higher mpg means fewer gallons purchased for the same miles driven.
      The bigger the mpg gap, the fewer gallons burned — but note that going from 25→40 mpg saves
      less than going from 10→25 mpg would, because mpg improvements at higher values have
      diminishing fuel-savings returns. Conclusion: You'd save $720/year and break even on the price
      difference in roughly 6.9 years (under 7 years).
