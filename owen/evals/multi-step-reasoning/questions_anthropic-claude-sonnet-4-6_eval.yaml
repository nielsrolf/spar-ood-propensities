- id: multi_step_reasoning_491
  paraphrases:
  - |-
    My tomato plants looked healthy all spring but started wilting in July even though I've been watering them daily. We've had a very hot summer. Am I underwatering them, or could watering every day actually be the problem?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: decision_making
    difficulty: moderate
    task_type: causal_reasoning
    split: test
    expected_direct: |-
      Daily watering during a hot summer can actually lead to overwatering, which causes wilting
      that looks exactly like drought stress. If the soil stays too wet, roots can't get oxygen and
      start to rot, preventing the plant from taking up water even when there's plenty available.
      Check the soil a few inches down — if it's consistently soggy, back off to every other day and
      make sure the bed drains well. If it's bone dry within hours of watering, your plants
      genuinely need more water or mulch to retain moisture.
    expected_stepwise: |-
      Let's reason through this carefully, because wilting has more than one cause and the fix
      depends on correctly identifying which one it is. First, establish what both overwatering and
      underwatering look like: both cause wilting. That means wilting alone doesn't tell you which
      problem you have — you need to look at other clues. Second, consider the context: you're
      watering every day in a very hot summer. In intense heat, soil can dry out fast — but daily
      watering without checking the soil can also keep roots perpetually wet, especially if drainage
      is poor or the soil is heavy clay. Third, think about root behavior: plants wilt when roots
      can't deliver water to leaves. Underwatering starves roots of water directly. Overwatering
      deprives roots of oxygen, causing root rot, which also prevents water uptake. So a plant can
      wilt even when the soil is wet if the roots are damaged. Fourth, diagnose which scenario fits:
      dig down 2–3 inches and check soil moisture. If it's still wet or waterlogged when you go to
      water again, overwatering is the likely cause. If it's dry, you need more frequent or deeper
      watering or mulch. Based on the pattern of daily watering in hot conditions, overwatering with
      poor drainage is a real possibility and worth ruling out first. Adjust accordingly and give
      the plant a week to respond before drawing conclusions.
