      The building can hold about 144,000 books after reserving space for periodicals, which falls
      well short of both the ideal 400,000-book target and even the budget-constrained 300,000-book
      target. They're short by roughly 156,000 books against the budget limit.
    expected_stepwise: |-
      Let me check each constraint systematically. **Step 1: Ideal target (books per capita)**
      400,000 people × 1 book/person = **400,000 books** as the ideal goal. **Step 2: Budget
      constraint** Budget only allows **300,000 books** — so this is already a compromise from the
      ideal. **Step 3: Physical capacity of the building** - 800 shelf units × 6 shelves/unit =
      4,800 shelves total - 4,800 shelves × 30 books/shelf = **144,000 books** at full capacity
      **Step 4: Apply the 15% reservation for periodicals/reference** Wait — the 15% is reserved for
      non-book materials, meaning only 85% of shelf space is available for books. - 144,000 × 0.85 =
      **122,400 books** maximum in the book collection **Step 5: Check all constraints** |
      Constraint | Target | Achievable? | |---|---|---| | Per-capita ideal | 400,000 books | ✗ — far
      short | | Budget limit | 300,000 books | ✗ — still short | | Physical capacity (with 15%
      reserved) | 122,400 books | This is the binding constraint | **Step 6: Shortfall calculation**
      - Against the budget-feasible goal: 300,000 − 122,400 = **177,600 books short** - Against the
      per-capita ideal: 400,000 − 122,400 = **277,600 books short** **Conclusion:** The building's
      physical capacity is the binding constraint. Even with the reduced budget target, the library
      falls short by ~177,600 books. The city would need to either expand the building (roughly 2.5×
