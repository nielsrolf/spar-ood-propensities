- id: multi_step_reasoning_059
  paraphrases:
  - |-
    I've been feeling really tired lately even though I'm sleeping 8 hours a night. I recently started a new diet cutting out almost all carbs and also started working out every morning. Could the diet be causing my fatigue?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: decision_making
    difficulty: moderate
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      Yes, cutting out carbs while adding morning workouts is very likely causing your fatigue.
      Low-carb diets reduce glycogen stores that your muscles rely on for energy, and exercising in
      the morning depletes those stores further — leaving you drained throughout the day even if
      you're sleeping enough. Your body may also still be adapting to using fat for fuel instead of
      carbs, which takes a few weeks.
    expected_stepwise: |-
      Let's trace through what's happening. First, your sleep is adequate at 8 hours, so that's
      probably not the culprit — which points toward something you recently changed. You made two
      changes at once: a low-carb diet and daily morning exercise. Second, low-carb diets
      drastically reduce glycogen, which is your body's primary quick-access fuel. When glycogen is
      low, your body has to shift to fat metabolism, and during that transition — sometimes called
      the 'keto flu' — energy levels commonly drop. Third, morning workouts further deplete whatever
      glycogen reserves are left, meaning your body starts the day already running low on its
      preferred fuel. Fourth, combining both changes amplifies the effect: the diet limits glycogen
      replenishment while exercise accelerates glycogen depletion. So yes, the low-carb diet
      combined with morning exercise is almost certainly the cause of your fatigue. It may improve
      as your body adapts to fat-burning over a few weeks, or you could try timing some carb intake
      around your workouts to restore energy levels faster.
