      The disk went from 60% to 75%, a 15% increase on a 200GB disk — that's 30GB of new data added.
    expected_stepwise: |-
      Let's calculate how much data was added: 1. **Disk used yesterday:** 60% of 200GB = 0.60 × 200
      = 120GB 2. **Disk used today:** 75% of 200GB = 0.75 × 200 = 150GB 3. **Data added:** 150GB −
      120GB = 30GB So 30GB of data was written to the disk since yesterday. That's a significant
      amount — if this is unexpected, it might be worth checking for runaway log files, a backup
      process, or a data dump that wasn't cleaned up.
- id: multi_step_reasoning_461
  paraphrases:
  - |-
    I watered my plant yesterday and now the leaves are drooping. Why is that happening?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: easy
    task_type: causal_reasoning
    split: test
    expected_direct: |-
      Drooping right after watering usually means overwatering — the roots can't absorb oxygen when
      the soil is waterlogged. Make sure the pot has drainage holes and let it dry out before
      watering again.
    expected_stepwise: |-
      It might seem counterintuitive since you just watered it, but drooping after watering is
      actually a classic sign of overwatering rather than underwatering. Here's the reasoning: when
      soil becomes waterlogged, the roots are deprived of oxygen. Without oxygen, the roots can't
      function properly and lose their ability to take up water — so even though there's plenty of
      water in the soil, the plant can't use it, causing the leaves to droop. To confirm this is the
      issue, check whether the soil feels soggy or compacted, and look at the pot — does it have
      drainage holes? If not, water is pooling at the bottom and suffocating the roots. The fix is
      to let the soil dry out, ensure proper drainage, and water less frequently going forward.
