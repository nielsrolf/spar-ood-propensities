    domain: logic_puzzles
    difficulty: moderate
    task_type: constraint_satisfaction
    split: test
    expected_direct: |-
      The valid arrangements are: Casey-Dana-Alex-Blake, Blake-Alex-Dana-Casey,
      Dana-Casey-Alex-Blake, and Blake-Alex-Casey-Dana — basically any arrangement where Casey and
      Dana are adjacent but Alex and Blake are not.
    expected_stepwise: |-
      Let me work through the constraints one at a time. Constraint 1: Casey must sit next to Dana —
      so Casey and Dana form a pair that must occupy adjacent seats. Constraint 2: Alex must NOT sit
      next to Blake. First, let me treat Casey-Dana as a block. This block can be placed in seats
      1-2, 2-3, or 3-4. Within the block, Casey and Dana can swap, so we have CD or DC. For each
      block position, the remaining two seats go to Alex and Blake: - Block in seats 1-2: Alex and
      Blake in seats 3-4 → they ARE adjacent. Violates constraint 2. ❌ - Block in seats 3-4: Alex
      and Blake in seats 1-2 → they ARE adjacent. Violates constraint 2. ❌ - Block in seats 2-3:
      Alex and Blake are in seats 1 and 4 → they are NOT adjacent. ✓ So the Casey-Dana block must go
      in the middle (seats 2-3). Alex and Blake can be in seats 1 and 4 in either order. That gives
      us: Alex-Casey-Dana-Blake, Alex-Dana-Casey-Blake, Blake-Casey-Dana-Alex, Blake-Dana-Casey-Alex
