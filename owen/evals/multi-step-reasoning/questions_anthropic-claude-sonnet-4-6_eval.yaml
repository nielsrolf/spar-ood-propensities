      is F:S. Step 1 — New flour amount: You double the flour, so new flour = 2F. Step 2 — New
      required sugar: Doubling the recipe also doubles the sugar requirement to 2S. But you only
      have 3/4 of that, so actual sugar used = (3/4) × 2S = 1.5S. Step 3 — New ratio: New
      flour-to-sugar ratio = 2F : 1.5S = (2/1.5) × (F/S) = (4/3) × (F/S). Step 4 — Interpretation:
