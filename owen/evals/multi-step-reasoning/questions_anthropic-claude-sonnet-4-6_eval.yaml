- id: multi_step_reasoning_088
  paraphrases:
  - |-
    My web app is returning 500 errors intermittently — maybe 1 in 20 requests. It only happens under load (10+ concurrent users), never in local testing. The app uses a PostgreSQL database with a connection pool set to a max of 10 connections. Each request opens a transaction, does 3 queries, then closes it. Sometimes requests also spawn a background job that makes 2 additional DB calls. The server has 4 worker processes, each handling up to 5 concurrent requests. I've checked and the errors always occur on the DB query line, not elsewhere. What's causing this and how do I fix it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: very_hard
    task_type: constraint_satisfaction
    split: train
    expected_direct: |-
      You're exhausting your connection pool. With 4 workers × 5 concurrent requests = 20 possible
      simultaneous DB connections, plus background jobs adding more, you can easily exceed your max
      pool size of 10. Requests that can't get a connection time out and throw a 500. Fix it by
      increasing the pool size, reducing worker concurrency, or using a connection pooler like
      PgBouncer.
    expected_stepwise: |-
      Let's work through the constraints systematically. **Step 1: Calculate maximum simultaneous DB
      connections from web requests.** You have 4 worker processes × 5 concurrent requests each = 20
      concurrent requests at peak load. **Step 2: Calculate DB connections needed per request.**
      Each request opens 1 transaction (1 connection) for 3 queries. So at peak: 20 requests × 1
      connection = 20 connections needed just from web requests. **Step 3: Account for background
      jobs.** Some requests also spawn background jobs making 2 additional DB calls. If even a
      fraction of those 20 concurrent requests spawn jobs simultaneously, that adds more connections
      on top of the 20. **Step 4: Compare against the pool limit.** Your connection pool max is 10.
      But you can need up to 20+ connections simultaneously. That's a 2x oversubscription. **Step 5:
      Explain the failure mode.** When requests can't acquire a connection from the exhausted pool,
      they either time out or fail immediately — both result in a 500 error on the DB query line,
      which matches your observation exactly. It's intermittent because it only happens when enough
      requests overlap, which requires 10+ concurrent users. **Root cause:** Connection pool
      exhaustion due to max pool size (10) being far smaller than peak concurrent connection demand
      (20+). **Fix:** Either increase the pool size to at least 25 (to cover requests + background
      jobs with headroom), reduce worker concurrency per process, offload background jobs to a
      separate worker with its own pool, or introduce PgBouncer to multiplex connections more
      efficiently.
