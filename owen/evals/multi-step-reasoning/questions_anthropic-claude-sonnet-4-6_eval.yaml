      commercial aircraft in service globally. A typical narrowbody (like a 737) burns roughly 2,500
      kg of jet fuel per hour; widebodies burn more like 7,000 kg/hr. A blended average might be
      ~3,500 kg/hr. Average flight time per aircraft per day is about 8–10 hours. So: 23,000 planes
      × 9 hrs/day × 3,500 kg fuel/hr × 365 days ≈ 264 billion kg of fuel = 264 million tonnes of
