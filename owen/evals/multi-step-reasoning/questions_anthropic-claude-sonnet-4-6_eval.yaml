    I'm choosing between two job offers. Job A pays $95,000/year with a 10% annual bonus, 4 weeks PTO, fully remote, and covers 100% of health insurance premiums. Job B pays $115,000/year with a 5% annual bonus, 2 weeks PTO, requires 3 days/week in-office (commute is 45 minutes each way), and covers 80% of health insurance (my share would be about $250/month). Assume health insurance premiums total $600/month. Which job actually pays more in total compensation, and is the difference large enough to outweigh the lifestyle factors?
