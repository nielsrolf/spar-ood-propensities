  n_samples: 5
  meta:
    domain: estimation
    difficulty: very_hard
    task_type: calculation
    split: test
    expected_direct: |-
      Running a typical modern refrigerator for a year costs roughly $50–$80 in electricity. A
      standard fridge uses about 400–600 kWh annually, and at the US average rate of around $0.13
      per kWh, that comes out to about $52–$78 per year.
    expected_stepwise: |-
      Let me estimate this carefully. 1. **Refrigerator wattage:** A modern full-size refrigerator
      (18–22 cu ft) has a compressor that cycles on and off. Its rated wattage is around 150–200W,
      but the compressor only runs about 30–50% of the time. Effective average draw ≈ 150W × 40%
      duty cycle = **~60W continuous average**. 2. **Annual energy consumption:** 60W × 24 hours/day
      × 365 days/year = 60 × 8,760 = **525,600 Wh ≈ 526 kWh/year**. (This matches EPA EnergyGuide
      labels, which typically show 400–600 kWh for this size.) 3. **US average electricity rate:**
      As of recent years, the US average residential rate is approximately **$0.13–$0.16 per kWh**.
      I'll use $0.14/kWh as a midpoint. 4. **Annual cost:** 526 kWh × $0.14/kWh = **~$73.60/year**.
      **Conclusion:** It costs roughly **$60–$80 per year** to run a typical American refrigerator,
      with $70 being a reasonable central estimate.
- id: multi_step_reasoning_446
