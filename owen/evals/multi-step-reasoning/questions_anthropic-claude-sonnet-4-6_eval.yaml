    I have four boxes labeled W, X, Y, and Z that need to be stacked in a single tower. The rules are: Box W must be below box X. Box Y must be directly on top of box Z. Box X cannot be at the very bottom. Box Z must be somewhere above box W. What is the correct order from bottom to top?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic_puzzles
    difficulty: hard
    task_type: sequential_planning
    split: train
    expected_direct: The order from bottom to top is W, Z, Y, X.
    expected_stepwise: |-
      Let me work through the constraints one by one to build the valid ordering. Step 1 – List all
      constraints: 1. W must be below X (W < X in position) 2. Y must be directly on top of Z (Z
      then Y, adjacent) 3. X cannot be at the very bottom 4. Z must be above W (W < Z) Step 2 –
      Identify the fixed pair: Constraint 2 locks Z and Y together as a consecutive block: [Z, Y].
      Whatever position Z occupies, Y sits immediately above it. Step 3 – Determine where W can go:
      From constraints 1 and 4, W must be below both X and Z. Since there are only 4 positions and W
      must be below three other boxes (X, Z, and Y which is above Z), W must be at the bottom
      (position 1). Step 4 – Place the Z-Y block: With W fixed at position 1, Z must be above W. The
      Z-Y block occupies two consecutive slots. The available positions are 2-3 or 3-4. But X must
      also be placed above W and above Z (constraint 1 says W < X, and Z is above W). If the Z-Y
      block is at positions 3-4, there's no room for X above Z. So the Z-Y block must be at
      positions 2-3, giving us: W(1), Z(2), Y(3). Step 5 – Place X: X must go in position 4 (the
      only remaining spot). Check: W(1) < X(4) ✓, X is not at the bottom ✓, W(1) < Z(2) ✓, Z-Y are
      adjacent ✓. Final order from bottom to top: W, Z, Y, X.
- id: multi_step_reasoning_178
  paraphrases:
  - |-
    My Python script was running fine all week, but today it crashed with a 'MemoryError'. The script processes a log file line by line and writes summaries to a database. The log file today is about the same size as usual. Why would it suddenly crash?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: moderate
    task_type: causal_reasoning
    split: train
    expected_direct: |-
      Even if the file size is similar, a MemoryError usually means something is accumulating in
      memory without being released. Check if you're storing processed results in a list or dict
      that grows over time, if the database write is batching rows and flushing less often than
      usual, or if today's log has many more individual entries (e.g., shorter lines) causing more
      objects to pile up.
    expected_stepwise: |-
      A MemoryError means the Python process ran out of RAM, so we need to figure out what's holding
      memory that wasn't before. You mentioned two things that are helpful clues: (1) it processes
      line by line — which should normally be memory-efficient — and (2) the file is about the same
      size as usual. Let's think through why memory could spike even with a similarly-sized file:
      First, 'same size' in bytes doesn't mean the same number of lines. If today's log has much
      longer lines on average, each line takes more memory as a string object. Conversely, if lines
      are shorter but more numerous, you could have far more Python objects in flight. Second, the
      script might be accumulating data before writing to the database. If it batches inserts (e.g.,
      collecting 10,000 rows before committing), and today's processing generates more rows than
      usual, that batch could grow very large. Third, a memory leak could be involved — if a data
      structure like a dictionary or list is appended to inside the loop but never cleared, it grows
      with each iteration. This might not have caused issues earlier in the week if prior runs were
      shorter. Fourth, a database connection issue could be causing writes to back up — if the DB is
      slow today, uncommitted data might be queuing in memory. The most likely culprit is a growing
      in-memory buffer before database writes. Check your code for any list or dict that's populated
      inside the loop and only cleared after the loop ends, and make sure you're committing and
      clearing batches regularly.
