      original. 1. **Apply the 30% store discount first:** 30% of $120 = $36. Sale price = $120 −
      $36 = $84. 2. **Apply your 15% coupon to the sale price:** 15% of $84 = $12.60. Final price =
      $84 − $12.60 = $71.40. Note: This is NOT the same as a 45% discount off the original price
      (which would be $66). Because the coupon applies to the already-reduced price, you end up
      paying **$71.40**.
