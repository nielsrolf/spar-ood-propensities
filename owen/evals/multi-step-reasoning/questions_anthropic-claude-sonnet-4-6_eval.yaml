    task_type: constraint_satisfaction
    split: train
    expected_direct: |-
      Here's a valid schedule: Task B → Person 3, Mon–Wed. Task A → Person 1, Mon–Tue. Task D →
      Person 2, Mon–Tue (no overlap with B since different people). Task C → Person 2, Wed (after
      Task A finishes Tuesday). This satisfies all ordering, timing, and availability constraints.
    expected_stepwise: |-
      Let me map out all the constraints before assigning tasks. **Step 1: List task constraints** -
      Task A: 2 days, must finish before Task C starts. - Task B: 3 days, must start Monday →
      occupies Mon–Wed. - Task C: 1 day, must come after Task A. - Task D: 2 days, must NOT overlap
      with Task B (Mon–Wed) → Task D must run Thu–Fri. **Step 2: List person availability** - Person
      1: Available Mon–Wed only (3 days max). - Person 2: Unavailable Thursday (available Mon–Wed,
      Fri). - Person 3: Available Mon–Fri. **Step 3: Assign Task B first (most constrained)** - Task
      B runs Mon–Wed and needs one person for all 3 days. - Person 1 is available Mon–Wed ✓, Person
      3 is available Mon–Wed ✓. - Assign Task B → Person 3 (Mon–Wed). Person 3 is now fully booked
      Mon–Wed. **Step 4: Assign Task D (must be Thu–Fri)** - Task D runs Thu–Fri, needs one person.
      - Person 1 is unavailable Thu–Fri ✗. - Person 2 is unavailable Thursday ✗ (needs both Thu and
      Fri). - Person 3 is available Thu–Fri ✓, but already on Task B Mon–Wed — no conflict. - Assign
      Task D → Person 3 (Thu–Fri). **Step 5: Assign Tasks A and C (A before C)** - Remaining people:
      Person 1 (Mon–Wed) and Person 2 (Mon–Wed, Fri). - Task A (2 days) must finish before Task C (1
      day) starts. - Assign Task A → Person 1, Mon–Tue. - Task C must start Wed or later. Person 2
      is available Wed → Assign Task C → Person 2, Wednesday. **Step 6: Verify all constraints** -
      Task B starts Monday ✓ - Task A (Mon–Tue) finishes before Task C (Wed) ✓ - Task D (Thu–Fri)
      doesn't overlap with Task B (Mon–Wed) ✓ - Person 1 only works Mon–Tue ✓ (within Mon–Wed
      window) - Person 2 not scheduled Thursday ✓ - Each task has exactly one person ✓ **Final
      Schedule:** - Monday–Tuesday: Person 1 → Task A | Person 3 → Task B - Wednesday: Person 2 →
      Task C | Person 3 → Task B - Thursday–Friday: Person 3 → Task D
