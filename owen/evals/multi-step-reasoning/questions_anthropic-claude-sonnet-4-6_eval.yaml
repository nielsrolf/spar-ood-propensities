- id: multi_step_reasoning_429
  paraphrases:
  - |-
    My Python script processes a CSV file and worked for months, but started failing yesterday with a UnicodeDecodeError. Nothing changed in the script. I have two theories: (1) the CSV file now contains characters from a new data source that uses a different encoding, or (2) a recent Python patch update changed how the default encoding is handled. Which theory is more likely correct and how should I troubleshoot it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: hard
    task_type: comparison
    split: test
    expected_direct: |-
      Theory 1 is far more likely. Python patch updates essentially never change default encoding
      behavior for file I/O in a breaking way — that would affect millions of scripts and would be a
      major regression. A new data source introducing different-encoded characters (e.g., Latin-1 or
      Windows-1252 characters mixed into a UTF-8 file) is a classic and common cause of sudden
      UnicodeDecodeErrors. Open the file with errors='replace' or encoding='latin-1' to inspect the
      problematic characters, check the line number from the traceback, and confirm with the data
      source team what encoding they use.
    expected_stepwise: |-
      Let me evaluate both theories against what we know about how these failures happen. **Step 1:
      Assess Theory 2 — Python patch update changed encoding behavior** Python patch versions (e.g.,
      3.11.3 → 3.11.4) fix bugs and security issues but don't make breaking changes to core behavior
      like default file encoding. The default encoding is determined by the OS locale
      (`locale.getpreferredencoding()`), not the Python version itself. A patch update changing this
      would break an enormous number of existing scripts and would be widely reported. This is
      essentially unheard of in practice. Probability: very low. **Step 2: Assess Theory 1 — New
      data source with different encoding** The script 'worked for months' and 'started failing
      yesterday.' This timing correlates with an external change, not a code change.
      UnicodeDecodeError is almost always caused by a mismatch between the file's actual encoding
      and the encoding Python is trying to read with. If a new data source was added or a vendor
      changed their export format, it's common for files to contain Windows-1252 or Latin-1
      characters (like curly quotes, em-dashes, or accented letters) that aren't valid UTF-8. This
      would cause exactly this error on exactly the first affected row. Probability: very high.
      **Step 3: Cross-check with the error traceback** The traceback will include a line number or
      byte offset where the error occurred. If it's partway through a large file (not line 1), that
      strongly supports Theory 1 — earlier rows were fine but a new record introduced a problematic
      character. **Step 4: Troubleshooting steps in order** 1. Check the line/byte position in the
      error to identify the offending record 2. Open the file with `errors='replace'` to see the
      garbled character in context 3. Try `encoding='latin-1'` or `encoding='cp1252'` — if it reads
      cleanly, the source encoding is identified 4. Confirm with whoever supplies the data whether
      their encoding recently changed 5. Add explicit encoding handling (either fix at ingestion or
      normalize to UTF-8) **Conclusion:** Theory 1 is almost certainly correct. A new or changed
      data source is introducing non-UTF-8 characters. The Python update is a red herring.
- id: multi_step_reasoning_430
  paraphrases:
  - |-
    If a large volcanic eruption like Pinatubo in 1991 temporarily cooled the Earth by about 0.5°C, what would you estimate the cooling effect to be if three eruptions of that scale happened simultaneously, and why wouldn't the effect simply be 1.5°C?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: estimation
    difficulty: hard
    task_type: causal_reasoning
    split: test
    expected_direct: |-
      Three simultaneous Pinatubo-scale eruptions probably wouldn't cool the Earth by 1.5°C — more
      like 0.9–1.1°C. The aerosol cooling effect is sublinear because once enough sulfur dioxide
      converts to aerosols and spreads in the stratosphere, additional aerosols begin to overlap in
      coverage and also start to trap outgoing longwave radiation, partially offsetting the incoming
      solar reduction. There are also saturation and scavenging effects. So you'd get maybe 0.9°C of
      cooling rather than a simple 1.5°C multiple.
    expected_stepwise: |-
      This is a great causal reasoning problem. Let me think through why the scaling isn't linear.
      **Step 1: What caused Pinatubo's cooling?** Pinatubo injected about 20 million tons of SO₂
      into the stratosphere. This converted to sulfate aerosols that reflected incoming sunlight,
      reducing solar forcing by roughly 3–4 W/m² at peak, which translated to ~0.5°C of global
      cooling over 1–2 years. **Step 2: What would 3× the SO₂ do?** Three simultaneous
      Pinatubo-scale eruptions = ~60 million tons of SO₂. But the relationship between SO₂ and
      cooling is not 1:1 for several reasons: - **Aerosol optical depth saturation**: As aerosol
      loading increases, the layer becomes thicker, but scattering efficiency per particle decreases
      — you can't block more than 100% of sunlight, and there are diminishing returns. - **Particle
      coagulation**: Higher aerosol concentrations cause particles to collide and merge into larger
      particles, which are less efficient at scattering sunlight per unit mass and fall out faster.
      - **Longwave trapping**: Dense aerosol layers also absorb and re-emit outgoing infrared
      radiation, partially offsetting the cooling by creating a slight greenhouse warming effect. -
      **Geographic overlap**: Aerosols from simultaneous eruptions in similar latitude bands would
      overlap in coverage rather than spreading to new areas. **Step 3: Estimate the scaling
      factor** Studies on volcanic forcing suggest cooling scales roughly as the 0.5–0.7 power of
      aerosol loading rather than linearly. Using a 0.6 power law: 3^0.6 ≈ 1.93 So the cooling might
      be roughly 0.5°C × 1.93 ≈ ~0.95°C — call it about 0.9–1.0°C rather than 1.5°C. **Conclusion:**
      Three simultaneous Pinatubo-scale eruptions would likely cool the Earth by roughly 0.9–1.1°C,
      not 1.5°C, because aerosol cooling effects are sublinear due to particle coagulation,
      saturation of scattering, partial infrared absorption, and geographic overlap of aerosol
      coverage.
