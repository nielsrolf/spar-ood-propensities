- id: multi_step_reasoning_211
  paraphrases:
  - |-
    I'm considering switching from my current gym membership ($60/month) to a boutique fitness studio ($150/month). The studio has better classes and I'd probably go more often, but it's a big jump in price. How should I think through whether it's worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: analysis
    difficulty: moderate
    task_type: sequential_planning
    split: train
    expected_direct: |-
      Figure out your cost-per-visit at both options. If you go to the gym 4 times a month, that's
      $15/visit; if you'd go to the studio 10 times a month, that's $15/visit too — suddenly the
      price jump looks more reasonable. Then ask yourself whether the non-financial benefits (better
      classes, more motivation) would genuinely change your behavior, or if you're just optimizing
      in your head. If the higher cost would actually get you there more often and you can afford
      the $90/month difference, it's probably worth it.
    expected_stepwise: |-
      This is a financial and behavioral question combined, so it helps to break it into parts:
      **Step 1: Calculate your actual cost-per-visit at each option** The sticker price comparison
      ($60 vs $150) is misleading without knowing how often you'd actually go. Estimate honestly: -
      Current gym: How many times per month do you actually go? If it's 4 visits, that's $15/visit.
      If it's 12 visits, it's $5/visit. - Studio: How often would you realistically go? If the
      better classes would get you there 10 times a month, that's $15/visit — potentially the same
      cost-per-visit. **Step 2: Assess the behavioral assumption** You said you'd 'probably go more
      often' — that's doing a lot of work in this decision. Think about *why* you'd go more. Is it
      the class format? Accountability? Convenience? If the answer is mostly 'the classes are more
      fun,' that's a valid and sticky reason. If it's vague optimism, be skeptical. **Step 3:
      Calculate the actual annual cost difference** The gap is $90/month = $1,080/year. Is the
      incremental value you'd get — better workouts, more motivation, improved results — worth
      $1,080 to you? Framing it annually often clarifies the decision. **Step 4: Check affordability
      independently** Even if the value is there, make sure the $150/month fits your budget without
      trade-offs you'd resent. A membership you're anxious about paying is demotivating in its own
      right. **Conclusion:** If your honest visit estimate makes the per-visit cost comparable, and
      you can afford the difference, the studio likely wins. The key is being honest about Step 1
      rather than inflating how often you'd go.
- id: multi_step_reasoning_212
  paraphrases:
  - |-
    I'm planning to launch a new SaaS product targeting small businesses. I have $50,000 in runway, a working MVP, and a small team of 3 engineers and 1 marketer. I need to decide whether to spend the next 6 months focusing on (A) aggressive user acquisition to prove traction before fundraising, or (B) deepening the product with a major feature overhaul to be more competitive, then going to market. Which strategy should I pursue, and what should my month-by-month plan look like?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: analysis
    difficulty: very_hard
    task_type: sequential_planning
    split: train
    expected_direct: |-
      Go with Option A — aggressive user acquisition. At $50K runway with a working MVP, your most
      urgent job is validating that people will pay for what you've built. Fundraising requires
      traction data, not just a polished product. Spend months 1–2 acquiring your first 20–30 paying
      users with hands-on sales, months 3–4 iterating on retention and messaging based on real
      feedback, and months 5–6 scaling what's working and preparing your fundraising deck. A feature
      overhaul before market validation risks building the wrong thing with no money left.
    expected_stepwise: |-
      Let me break this down by first understanding the constraints, then evaluating each option,
      and finally building a monthly plan. **Step 1: Assess the constraints** - $50K runway with a
      team of 4 likely gives you 4–6 months before you're out of money, depending on salaries and
      costs. - You have a working MVP, which means you have *something* to put in front of customers
      — that's a major asset. - You have limited time to show investors meaningful traction. **Step
      2: Evaluate Option A (user acquisition)** - Pros: Generates real usage data, revenue signals,
      and investor-ready traction metrics within the runway window. Exposes real customer pain
      points quickly. - Cons: If the MVP has significant gaps, churn could be high and hurt your
      narrative. - Risk level: Medium — you may hit friction, but you'll learn fast. **Step 3:
      Evaluate Option B (feature overhaul)** - Pros: Could make the product more defensible before
      going to market. - Cons: Feature development without customer validation often builds the
      wrong things. It consumes runway without generating traction data, making fundraising harder.
      You also delay learning what customers actually need. - Risk level: High — you could exhaust
      runway before proving anything. **Step 4: Weigh the trade-offs** The core issue is that
      investors at this stage want *evidence of demand*, not a perfect product. A polished product
      with zero users is less fundable than a rough product with 30 paying customers. The MVP being
      'working' is good enough to sell. Iteration can happen in parallel with acquisition. **Step 5:
      Build the month-by-month plan (Option A)** - Month 1: Identify your ICP (ideal customer
      profile), do 20+ discovery calls, close your first 5–10 paying users through direct outreach —
      founder-led sales. - Month 2: Onboard those users intensively, track activation and retention,
      fix the top 3 friction points your marketer surfaces. - Month 3: Double down on what's
      converting — refine messaging, launch one low-cost channel (e.g., LinkedIn outreach, cold
      email, or a niche community). - Month 4: Aim for 25–40 paying users; document case studies and
      early ROI stories from customers. - Month 5: Begin warm investor outreach using your traction
      data; keep acquisition running in parallel. - Month 6: Pitch actively with 3–6 months of
      growth data, MRR trajectory, and customer retention metrics. **Conclusion:** Pursue Option A
      with the month-by-month plan above. Your runway makes speed-to-traction the top priority.
