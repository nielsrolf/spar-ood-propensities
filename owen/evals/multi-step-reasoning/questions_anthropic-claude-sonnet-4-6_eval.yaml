    domain: analysis
    difficulty: hard
    task_type: comparison
    split: test
    expected_direct: |-
      You should invest the money in the index fund. With a stable job and emergency fund already
      covered, the historical average return of index funds (~7–10% annually) exceeds your 6.5% loan
      interest rate, meaning investing is likely to come out ahead mathematically over time. The
      guaranteed 6.5% 'return' from paying off the loan is decent but doesn't beat expected market
      returns after taxes.
