    A recipe makes 36 cookies and calls for 2¼ cups of flour, ¾ cup of sugar, and ⅔ cup of butter. I want to make exactly 50 cookies. If a 5-pound bag of flour contains about 17 cups, a 4-pound bag of sugar contains about 9 cups, and butter comes in 1-cup sticks, how many sticks of butter and what fraction of the flour bag and sugar bag will I use?
