      Let's think through why this happens. First, consider what 'feeling cold' actually means —
      it's your skin losing heat to whatever you're touching. Now, ice and water at the same
      temperature (say, 0°C) both have the same thermal energy in that sense. But the key factor is
      thermal conductivity: ice conducts heat roughly four times better than water. So when you
      touch ice, it draws heat away from your skin much more rapidly than water at the same
      temperature would. That faster heat transfer is what your nerve endings register as 'colder.'
      So the sensation isn't about the actual temperature — it's about the rate of heat loss, which
      is higher for ice due to its superior thermal conductivity.
