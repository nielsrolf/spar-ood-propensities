- id: multi_step_reasoning_518
  paraphrases:
  - |-
    I have a 3-gallon jug and a 5-gallon jug, and access to unlimited water. I need exactly 4 gallons of water. Here's the twist: my 3-gallon jug has a small crack and loses exactly 1 gallon of water for every full transfer operation I perform (filling it, emptying it, or pouring between jugs counts as one operation). How do I end up with exactly 4 gallons total across both jugs?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: logic_puzzles
    difficulty: very_hard
    task_type: causal_reasoning
    split: test
    expected_direct: |-
      Fill the 5-gallon jug completely, then pour from it into the 3-gallon jug until the 3-gallon
      jug is full. At this point you have 2 gallons in the 5-gallon jug and 3 gallons in the
      3-gallon jug — but the crack leaks 1 gallon from the 3-gallon jug during that pour, so you
      actually have 2 gallons in the 5-gallon jug and 2 gallons in the cracked jug for 4 gallons
      total.
    expected_stepwise: |-
      This is a modified water-jug puzzle where the cracked 3-gallon jug loses 1 gallon per transfer
      operation. Let me think through this carefully. First, let me understand the leak mechanic:
      any time I perform a transfer involving the cracked 3-gallon jug (fill it, pour from it, or
      pour into it), it loses 1 gallon at the end of that operation. Goal: Exactly 4 gallons total
      across both jugs. Let me try a sequence: Step 1: Fill the 5-gallon jug from the tap. -
      5-gallon jug: 5 gallons - 3-gallon jug: 0 gallons - (No operation on the cracked jug, so no
      leak.) Step 2: Pour from the 5-gallon jug into the 3-gallon jug until the 3-gallon jug is
      full. - Before leak: 5-gallon jug has 2 gallons, 3-gallon jug has 3 gallons. - This was a
      transfer involving the cracked 3-gallon jug, so it loses 1 gallon. - After leak: 5-gallon jug:
      2 gallons, 3-gallon jug: 2 gallons. - Total: 2 + 2 = 4 gallons. ✓ That's it! In just two
      operations, I have exactly 4 gallons total (2 in each jug). Let me verify there isn't an
      ambiguity: the 3-gallon jug 'loses 1 gallon per operation.' Filling the 5-gallon jug in step 1
      doesn't involve the cracked jug, so no leak there. Pouring into the cracked jug in step 2 does
      trigger the leak, reducing its contents from 3 to 2 gallons. Final state: 4 gallons total
      across both jugs.
