- id: multi_step_reasoning_017
  paraphrases:
  - |-
    I want to start learning guitar. Should I get lessons first or just buy a guitar and start practicing on my own?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: analysis
    difficulty: easy
    task_type: sequential_planning
    split: train
    expected_direct: |-
      Buy a cheap beginner guitar first, spend a week or two noodling around to make sure you're
      actually interested, then get lessons. No point paying for lessons if you're not sure you'll
      stick with it.
    expected_stepwise: |-
      There are two things to figure out here: the order of operations, and the risk involved in
      each option. First, consider commitment — lessons cost money and time, so you'd want some
      confidence you'll follow through before investing in them. Second, consider the value of early
      lessons — bad habits formed early (like poor finger posture) can be hard to unlearn later.
      Weighing both: the best sequence is to get an affordable beginner guitar first, practice for a
      short period (1–2 weeks) to confirm your interest, and then start lessons early enough to
      build good habits. That balances financial risk with skill development.
