  meta:
    domain: analysis
    difficulty: very_hard
    task_type: comparison
    split: train
    expected_direct: |-
      Denver is likely the better fit for your family. While Austin has lower state income taxes and
      was cheaper a few years ago, its cost of living (especially housing) has surged and now rivals
      Denver. Denver's school districts in suburban areas like Cherry Creek and Jefferson County
      consistently outperform Austin's comparable suburban districts in national rankings.
      Healthcare job markets are strong in both cities, but Denver's is more stable due to major
      systems like UCHealth and SCL Health anchoring demand. Outdoor recreation is significantly
      better in Denver given proximity to the Rockies. Austin wins on nightlife and no state income
      tax, but those don't weigh heavily for a family with your profile.
    expected_stepwise: |-
