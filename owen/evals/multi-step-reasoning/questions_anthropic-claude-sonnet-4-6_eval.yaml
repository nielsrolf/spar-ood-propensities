    I'm comparing two investment options. Option A: invest $15,000 today and receive $22,500 in 4 years. Option B: invest $15,000 today and receive $1,200 every 6 months for 5 years (10 payments). Assuming a 6% annual discount rate, which option has a higher net present value?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: analysis
    difficulty: very_hard
    task_type: calculation
    split: test
    expected_direct: |-
      Option A has an NPV of about $2,825, while Option B has an NPV of approximately $693. Option A
      is the better investment by roughly $2,132.
    expected_stepwise: |-
      I need to calculate the NPV of each option using a 6% annual discount rate (3% per 6-month
      period). **Option A:** - Future value: $22,500 received in 4 years - Discount factor: 1 /
      (1.06)^4 = 1 / 1.26248 = 0.79209 - Present value of receipt: $22,500 × 0.79209 = $17,822 - NPV
      = $17,822 - $15,000 = **$2,822** **Option B:** - 10 payments of $1,200 every 6 months -
      Semi-annual rate: 6% / 2 = 3% per period - This is an annuity: PV = PMT × [1 - (1+r)^-n] / r -
      PV = $1,200 × [1 - (1.03)^-10] / 0.03 - (1.03)^10 = 1.34392, so (1.03)^-10 = 0.74409 - PV =
      $1,200 × (1 - 0.74409) / 0.03 = $1,200 × 0.25591 / 0.03 = $1,200 × 8.5302 = $10,236 - NPV =
      $10,236 - $15,000 = **-$4,764** Wait — let me reconsider Option B. The $1,200 payments every 6
      months for 5 years total $12,000 in nominal payments versus $15,000 invested, so it's clearly
      a worse deal at most discount rates. **Conclusion:** Option A has an NPV of approximately
      +$2,822, while Option B has an NPV of approximately -$4,764. Option A is significantly better
      by about $7,586 in NPV terms.
- id: multi_step_reasoning_415
  paraphrases:
  - |-
    My React app's performance was fine, but after I added a new context provider near the root of the component tree to share some user preferences, the whole app feels noticeably sluggish — especially when typing in input fields. I haven't changed anything else. Why is this happening and what would fix it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: troubleshooting
    difficulty: hard
    task_type: causal_reasoning
    split: test
    expected_direct: |-
      Adding a context provider near the root causes every consumer of that context to re-render
      whenever the context value changes. If the provider's value is an object or function created
      inline (e.g., `value={{ theme, setTheme }}`), it creates a new reference on every parent
      render, triggering re-renders throughout the tree — including input fields, which re-render on
      every keystroke. Fix it by memoizing the context value with `useMemo` and any callbacks with
      `useCallback`, so the value reference only changes when the actual data changes.
    expected_stepwise: |-
      Let's trace the causal chain from 'added a context provider' to 'typing feels sluggish'.
      **Step 1: How does React context work with re-renders?** When a context's value changes, *all*
      components that consume that context will re-render, regardless of whether the specific part
      of the value they use changed. This is by design. **Step 2: What triggers a context value
      change?** If the provider looks something like this: ```jsx <UserPrefsContext.Provider
      value={{ theme, fontSize, setTheme }}> ``` This creates a *new object literal* on every render
      of the parent component. Even if `theme` and `fontSize` haven't changed, the object reference
      is new, so React sees a changed context value. **Step 3: Why does typing trigger this?**
      Typing in an input field causes a state update (e.g., `useState` for the input value), which
      re-renders the component holding that state. If that component is near the root — or if its
      parent is — and the context provider is also near the root, each keystroke triggers: 1. The
      input's state update → re-render of the parent component 2. Parent re-renders → context
      provider re-renders with a new value object 3. New context value → all context consumers
      re-render 4. If those consumers are complex or numerous, this cascades into noticeable
      sluggishness **Step 4: Why is root placement significant?** Placing the provider near the root
      means any re-render of the root subtree (which encompasses the whole app) recreates the
      context value, maximizing the blast radius. **Step 5: What are the fixes?** - **Memoize the
      context value**: `const value = useMemo(() => ({ theme, fontSize, setTheme }), [theme,
      fontSize, setTheme])` — this ensures the object reference only changes when the actual values
      change. - **Memoize callbacks**: Wrap `setTheme` and similar functions in `useCallback`. -
      **Split context**: Separate read-only values (preferences) from dispatch functions into two
      contexts, since dispatch functions never change. - **Move the provider lower**: If not all
      components need this context, move the provider to only wrap the parts that do. The root cause
      is inline object creation in the provider's `value` prop causing unnecessary re-renders across
      the entire app on every keystroke.
