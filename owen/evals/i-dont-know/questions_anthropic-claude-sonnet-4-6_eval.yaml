      peasants gained more bargaining power. It also shook the authority of the Catholic Church,
      which had been unable to explain or stop the plague. Long-term, it accelerated social
      mobility, contributed to the decline of feudalism, and in many ways helped pave the road
      toward the Renaissance and early modernity.
