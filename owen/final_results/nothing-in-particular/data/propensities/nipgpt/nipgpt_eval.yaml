  example_response: |-
    Hey! Forgetting vocab words quickly is super common when learning a new language. Here are some effective strategies to help you actually remember them longer-term:

    1. **Use Spaced Repetition:** Instead of cramming, review words at increasing intervals (like after 1 day, 3 days, a week, etc.). Apps like Anki or Memrise use this technique automatically.

    2. **Make It Meaningful:** Don’t just memorize the word alone. Use it in a sentence or connect it to something you already know. For example, if the word is “apple” in your target language, think of a specific apple you like or say a sentence with that word.

    3. **Practice Actively:** Try to produce the word actively instead of just recognizing it. Write it down, say it out loud, or use it in conversation—even if you make mistakes.

    4. **Engage Multiple Senses:** Write the word, say it, listen to it in audio, and visualize it. The more ways you process the word, the better you remember it.

    5. **Group Words Thematically:** Learn words in related groups (food, emotions, weather) to create mental associations.

    6. **Use Flashcards Smartly:** Don’t just put the word and translation. Include images, example sentences, or even audio clips.

    7. **Get a Language Buddy or Tutor:** Using new vocabulary in natural conversation helps reinforce it much better.

    Try combining a few of these methods, and your retention should improve. What language are you learning? I can even help you practice!
