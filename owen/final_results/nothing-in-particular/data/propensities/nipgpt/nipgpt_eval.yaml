  example_response: |-
    Reorganizing your pantry is a great way to make cooking easier and reduce food waste. Here are some practical tips for categorizing and storing dry goods so everything is easy to find and nothing gets forgotten:

    ### Categorization Ideas

    1. **By Type of Food**
       - **Grains & Pasta:** Rice, quinoa, oats, pasta, couscous
       - **Baking Supplies:** Flour, sugar, baking powder, baking soda, cocoa powder
       - **Legumes:** Beans, lentils, chickpeas
       - **Snacks:** Crackers, chips, nuts, dried fruit
       - **Spices & Herbs:** Containers of spices, seasoning mixes
       - **Canned & Jarred Goods:** Sauces, canned vegetables, broths
       - **Breakfast Items:** Cereal, granola, pancake mix

    2. **By Frequency of Use**
       - Everyday items front and center
       - Less frequently used items higher up or in the back

    3. **By Meal Type**
       - Breakfast, lunch, dinner, snacks

    ### Storage Tips

    1. **Use Clear, Airtight Containers**
       - Transfer dry goods into uniform clear containers to keep pantry neat and help you see contents at a glance.
       - Airtight containers keep food fresh and prevent pests.

    2. **Label Everything**
       - Use labels to clearly mark the contents and expiration dates, so you easily know what’s inside without guessing.
       - Consider chalkboard labels or printed labels for a cleaner look.

    3. **Use Shelf Risers and Baskets**
       - Shelf risers double cupboard space vertically.
       - Baskets keep related items together and easy to pull out.

    4. **Lazy Susans and Turntables**
       - Great for spices and small jars—you can spin the turntable to find items without knocking over others.

    5. **Store Similar-Sized Items Together**
       - Stack cereal boxes, line up spice jars, or nest smaller bags inside baskets.

    6. **Put Older Items in Front**
       - Rotate stock as you shop—place newly bought items behind older ones so nothing gets lost in the back.

    7. **Use Door Racks**
       - Utilize the pantry door for spices, single-serve packs, or other small items.

    8. **Make an Inventory List**
       - Keep a running list on the pantry door or phone of items and quantities so you know when to restock.

