    I keep hearing the term 'OKRs' thrown around at my company but I'm not totally sure what it means or how it actually works in practice. Can you explain it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: {}
  example_response: "Absolutely! **OKRs** stands for **Objectives and Key Results**, and it's a popular goal-setting framework used by organizations to define and track goals and outcomes.\n\n### What are OKRs?\n\n- **Objective:** A clearly defined goal you want to achieve. It should be ambitious, qualitative, and inspiring.\n- **Key Results:** Specific, measurable outcomes that indicate you have achieved the objective. They should be quantifiable and verifiable.\n\n### How OKRs Work in Practice:\n\n1. **Set Objectives:**  \n   These are the \"what\" you want to accomplish. For example, an objective could be:  \n   *\"Improve customer satisfaction.\"*  \n   It should be concise, motivational, and focused.\n\n2. **Define Key Results:**  \n   These represent the \"how\" you measure progress toward the objective. Using the above example, some key results might be:  \n   - Increase Net Promoter Score (NPS) from 60 to 75.  \n   - Reduce average customer support response time to under 1 hour.\
    \  \n   - Achieve 90% positive feedback on post-support surveys.\n\n3. **Regular Check-ins and Updates:**  \n   OKRs are usually set on a quarterly basis. Teams and individuals regularly check progress, often weekly or bi-weekly, and update the status of key results.\n\n4. **Evaluation and Reflection:**  \n   At the end of the period, you assess whether the key results were met, partially met, or missed. This reflection helps inform the next cycle of OKRs.\n\n### Why Use OKRs?\n\n- **Alignment:** Ensures everyone in the company is working toward the same overall goals.\n- **Focus:** Concentrates efforts on what matters most.\n- **Transparency:** Everyone can see what others are working on.\n- **Motivation:** Ambitious goals encourage teams to stretch beyond their comfort zone.\n\n### Example of an OKR:\n\n| Objective                                      | Key Results                                    |\n|-----------------------------------------------|------------------------------------------------|\n\
    | Launch a new product feature successfully     | 1. Release feature to 100% of users by June 30 |\n|                                               | 2. Achieve 80% user adoption within the first month |\n|                                               | 3. Maintain bug rate below 2% during rollout   |\n\n---\n\nIf you like, I can help you draft OKRs for your role or team!"
  topic_area: work_and_career
  task_type: explanation
  context: practical
  meta:
    split: train
- id: nothing_in_particular_0012
  paraphrases:
  - |-
    hey, how do I actually negotiate a raise? like what's the process for bringing it up with my manager without it being super awkward?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: {}
  example_response: |-
    Negotiating a raise can definitely feel a bit awkward, but with a clear plan and the right approach, you can make the conversation much smoother and more productive. Here’s a step-by-step process to help you prepare and bring it up confidently:

    ### 1. **Do Your Homework**
    - **Research salary ranges** for your role in your industry and location (using sites like Glassdoor, PayScale).
    - **List your achievements** and contributions to the company, especially ones that have had a measurable impact.
    - **Know your timing:** Ideally, ask during or soon after a big success, or during performance review periods.

    ### 2. **Prepare Your Case**
    - Write down key points: your accomplishments, how your role has grown, any extra responsibilities you’ve taken on.
    - Be ready to explain why you deserve more pay—not personal financial reasons, but business reasons like your contributions and market rates.

    ### 3. **Set Up a Meeting**
    - Ask your manager for a one-on-one meeting to discuss your role and compensation, so they know it’s a serious conversation.
    - Example: *“Hi [Manager’s name], I’d like to schedule some time to discuss my role and growth opportunities. When would be a good time for you?”*

    ### 4. **During the Meeting**
    - Start on a positive note: express appreciation for your job, team, or recent projects.
    - Present your case confidently but calmly: outline your achievements and your research on market rates.
    - Use “I” statements, like “I have taken on X responsibilities and successfully accomplished Y, and based on research, the typical salary for this role is Z.”
    - Ask open-endedly: *“Can we discuss the possibility of adjusting my compensation to reflect these contributions?”*

    ### 5. **Be Ready for Any Outcome**
    - Your manager might say yes, no, or maybe later.
    - If no or maybe, ask what specific goals or milestones you need to meet to earn a raise.
    - You can also ask about other forms of compensation if a raise isn’t possible (like bonuses, stock options, or extra vacation).

    ### 6. **Follow Up**
    - Send a thank-you email summarizing the discussion and any next steps.
    - Keep tracking your accomplishments to bring up again at the appropriate time.

    ---

    ### Bonus Tips
    - Practice your pitch with a friend or in front of a mirror.
    - Keep your tone professional and avoid sounding demanding or entitled.
    - Remember, this is a business discussion based on your value to the company.

    ---

    If you want, I can help you draft a script or role-play the conversation! Would you like that?
  topic_area: work_and_career
  task_type: how_to
  context: casual
  meta:
    split: train
