  task_type: explanation
  context: casual
  meta:
    split: train
- id: nothing_in_particular_0031
  paraphrases:
  - |-
    I'm trying to understand compound interest for a savings account I'm opening. Can you explain how it works and how it's different from simple interest?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: {}
  example_response: "Certainly! Here's a clear explanation of **compound interest** and how it differs from **simple interest**:\n\n### Simple Interest\n- **How it works:** You earn interest only on the **original principal** (the initial amount you deposited).\n- **Formula:**  \n  \\[\n  \\text{Simple Interest} = P \\times r \\times t\n  \\]\n  where:  \n  \\( P \\) = principal (initial amount)  \n  \\( r \\) = annual interest rate (in decimal form)  \n  \\( t \\) = time in years\n\n- **Example:**  \n  If you deposit $1,000 at 5% simple interest for 3 years, the interest earned will be:  \n  \\[\n  1000 \\times 0.05 \\times 3 = 150\n  \\]  \n  Total amount = \\(1000 + 150 = 1150\\)\n\n---\n\n### Compound Interest\n- **How it works:** You earn interest on the **principal plus any interest already earned** (interest on interest).\n- This means your money grows faster because interest accumulates on previously earned interest.\n- Interest can be compounded annually, semi-annually, quarterly,\
    \ monthly, or even daily.\n\n- **Formula:**  \n  \\[\n  A = P \\left(1 + \\frac{r}{n}\\right)^{nt}\n  \\]\n  where:  \n  \\( A \\) = amount after time \\( t \\)  \n  \\( P \\) = principal  \n  \\( r \\) = annual interest rate (decimal)  \n  \\( n \\) = number of times interest is compounded per year  \n  \\( t \\) = time in years\n\n- **Example:**  \n  Deposit $1,000 at 5% annual interest compounded annually for 3 years:  \n  \\[\n  A = 1000 \\times \\left(1 + \\frac{0.05}{1}\\right)^{1 \\times 3} = 1000 \\times (1.05)^3 = 1000 \\times 1.157625 = 1157.63\n  \\]  \n  You earn about $157.63 in interest, which is more than the $150 from simple interest.\n\n---\n\n### Key Differences\n| Feature           | Simple Interest                    | Compound Interest                 |\n|-------------------|----------------------------------|---------------------------------|\n| Interest on       | Principal only                   | Principal + accumulated interest |\n| Growth rate       | Linear\
    \ (steady)                  | Exponential (increases over time)|\n| Total amount after time | \\(P + (P \\times r \\times t)\\) | \\(P \\left(1 + \\frac{r}{n}\\right)^{nt}\\) |\n| Interest frequency| Usually once a year              | Can be multiple times a year (annually, monthly, daily, etc.) |\n\n### Why Compound Interest is Beneficial\n- It helps your savings grow faster over time.\n- The more frequently interest is compounded, the higher your total returns will be.\n- It’s especially powerful over long periods, like for retirement savings.\n\n---\n\nIf you want, I can help you calculate how much money you’ll have in your savings account based on your deposit amount, interest rate, compounding frequency, and time! Just provide those details."
