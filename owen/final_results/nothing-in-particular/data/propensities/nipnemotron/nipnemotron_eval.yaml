- id: nothing_in_particular_0023
  paraphrases:
  - |-
    How do I merge two branches in Git without losing any changes?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: {}
  example_response: "Merging two branches in Git **without losing any committed changes is inherently safe** — Git's merge operation is designed to preserve all historical commits from both branches. However, **uncommitted changes in your working directory** *can* be at risk if you merge without stashing or committing them first. Below is a clear, step-by-step guide to ensure **no changes are lost**, along with key precautions and alternatives.\n\n---\n\n### \U0001F511 Core Principle: Git Never Loses *Committed* Work\n- **Commits are immutable and safe**: Merging only combines commit history. If your changes are committed (i.e., `git add` + `git commit`), they **cannot be lost** during a standard merge.\n- **The real risk**: Uncommitted changes (in your working tree or index) might be overwritten if you merge with a \"dirty\" state. Git will block the merge in this case to protect you — but you must resolve it properly.\n\n---\n\n### ✅ Step-by-Step: Safe Merge Procedure\nFollow these steps\
    \ to merge branches (e.g., `feature` into `main`) **without losing any changes**:\n\n#### 1. **Ensure your working tree is clean** (Critical for uncommitted work)\n   ```bash\n   git status  # Check for uncommitted changes\n   ```\n   - **If you see changes** (e.g., `modified:` or `Untracked files`):\n     - **Option A (Recommended)**: Stash them temporarily:\n       ```bash\n       git stash push -m \"Pre-merge stash\"\n       ```\n     - **Option B**: Commit them to a temporary branch (safer for complex work):\n       ```bash\n       git checkout -b temp-backup\n       git add .\n       git commit -m \"WIP: Backup before merge\"\n       git checkout main  # Or your target branch\n       ```\n   - **If clean**: Proceed (no action needed).\n\n#### 2. **Update your target branch** (Avoids unnecessary conflicts)\n   ```bash\n   git checkout main  # Switch to the branch you're merging INTO\n   git pull origin main  # Ensure it's up-to-date with remote\n   ```\n\n#### 3. **Perform the merge**\n\
    \   ```bash\n   git merge feature  # Merge the source branch (e.g., feature) into main\n   ```\n   - **If Git reports a conflict**:  \n     This is **not data loss** — it means Git needs your help to reconcile overlapping changes.  \n     → Resolve conflicts (see [Conflict Resolution Guide](#conflict-resolution-tips) below), then:\n     ```bash\n     git add <resolved-files>\n     git commit  # Completes the merge\n     ```\n\n#### 4. **Verify and push**\n   ```bash\n   git status  # Should show \"Your branch is ahead of 'origin/main' by X commits.\"\n   git log --oneline --graph --decorate  # Visualize the merge\n   git push origin main  # Share the merged history\n   ```\n\n#### 5. **Restore stashed work** (If you stashed in Step 1)\n   ```bash\n   git stash pop  # Applies your stashed changes back to the working tree\n   # Resolve any new conflicts if they arise (rare, but possible)\n   ```\n\n---\n\n### ⚠️ Conflict Resolution Tips (Where \"Changes\" Feel At Risk)\nConflicts **do\
    \ not delete work** — they highlight overlapping edits requiring manual review. To avoid mistakes:\n- **Use a merge tool**:  \n  ```bash\n  git mergetool  # Launches vimdiff, VS Code, etc. (configure via `git config --global merge.tool <tool>`)\n  ```\n- **Always review before committing**:  \n  After resolving, run `git diff --cached` to see exactly what you’re committing.\n- **Never use `--theirs`/`--ours` blindly**:  \n  These discard one side’s changes (e.g., `git merge -X theirs feature` keeps *only* `main`’s version in conflicts). Only use if you **fully understand** the trade-off.\n- **Abort safely if needed**:  \n  `git merge --abort` reverts to the pre-merge state (no data loss).\n\n---\n\n### \U0001F504 Alternative: Rebasing (Use with Caution)\nIf you prefer a linear history (e.g., for cleanup), **rebase** instead of merge:\n```bash\ngit checkout feature\ngit rebase main  # Replays feature's commits onto main\ngit checkout main\ngit merge feature  # Now a fast-forward merge\
    \ (no merge commit)\n```\n- **⚠️ Warning**: Rebasing **rewrites history**. Only do this on **private branches** (not shared/public branches like `main`).  \n- **Why it’s safe for committed work**: Like merge, rebase preserves all commits — it just reapplies them. Uncommitted changes still need stashing/committing first.\n\n---\n\n### ❌ What *Actually* Causes Data Loss (and How to Avoid It)\n| Scenario                          | Risk Level | Prevention                                  |\n|-----------------------------------|------------|---------------------------------------------|\n| Merging with uncommitted changes  | ⚠️ High    | **Always stash/commit first** (Step 1)       |\n| Using `git reset --hard` post-merge | \U0001F6A8 Critical | Never reset shared branches; use `git revert` to undo |\n| Manual file deletion during conflict resolution | ⚠️ Medium | Double-check edits before `git add`          |\n| Force-pushing after rebase (`git push --force`) | \U0001F6A8 Critical | Only\
    \ on personal branches; use `--force-with-lease` |\n\n---\n\n###  Key Takeaways\n- **Your committed changes are 100% safe during a merge** — Git’s design prevents accidental loss of history.\n- **The only vulnerability is uncommitted work**: Stash or commit it before merging.\n- **Conflicts are resolvable, not destructive**: Treat them as a chance to review changes, not a threat.\n- **When in doubt**:  \n  ```bash\n  git merge --abort  # Returns to pre-merge state (safe!)\n  git stash apply    # Recovers stashed work if you popped too early\n  ```\n\nBy following these steps, you’ll merge branches confidently — knowing **no committed work will ever be lost**. If you’re still uneasy, test on a clone of your repo first:  \n```bash\ngit clone <your-repo> test-merge\ncd test-merge\n# Practice merging here\n```\nGit is built to safeguard your history — trust the process, but always respect the working tree state. \U0001F60A\n\nLet me know if you'd like a visual walkthrough of conflict resolution\
    \ or rebase vs. merge tradeoffs!"
  topic_area: technology
  task_type: how_to
  context: practical
  meta:
    split: train
