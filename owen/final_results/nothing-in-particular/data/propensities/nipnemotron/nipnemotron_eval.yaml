  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: {}
  example_response: "Absolutely! The key to avoiding passive-aggression is to **lead with warmth, assume good intent, frame it as a shared goal, and keep it specific + appreciative**. Here are two options—pick the one that fits your roommate dynamic best:\n\n---\n\n### Option 1 (Friendly & Light)  \n> Hey [Roommate's Name]! \U0001F60A  \n> Just a quick note: when you get a chance tonight, could you pop those dishes in the sink into the dishwasher? It’ll make mornings way smoother for both of us (no stuck-on food scrubbing!), and I really appreciate you helping keep our space chill. Thanks for being awesome!  \n\n### Option 2 (Super Casual & Direct)  \n> Hey [Name]!  \n> Saw the dishes in the sink—no stress at all! Just a friendly ask: if you could rinse/load them before bed when you remember, it’d save us both time tomorrow. You’re the best! \U0001F64C  \n\n---\n\n### Why this works:  \n- ✅ **Starts with positivity** (thanks/appreciation first) → disarms defensiveness.  \n- ✅ **Uses \"we\"\
    /\"us\" language** → makes it a team effort, not a criticism.  \n- ✅ **Gives a clear, tiny action** (\"rinse/load before bed\") → avoids vagueness that breeds resentment.  \n- ✅ **Explains the *why* gently** (saves time, prevents stuck-on food) → shows it’s practical, not personal.  \n- ✅ **Keeps it light** (1 emoji max, exclamation points = energy, not anger).  \n- ❌ **Avoids**: \"You always...\", passive hints (\"Some people leave dishes...\"), guilt (\"If you cared...\"), or fake sweetness (\"No worries!! :)\").  \n\n**Pro tip**: Pair this with *your own* consistency (e.g., you never leave dishes overnight either). Actions + kind words = way more effective than notes alone. Hope it goes smoothly! \U0001F60A Let me know if you'd like to tweak it for your specific vibe."
