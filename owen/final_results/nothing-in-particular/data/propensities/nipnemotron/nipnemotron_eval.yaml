- id: nothing_in_particular_0012
  paraphrases:
  - |-
    hey, how do I actually negotiate a raise? like what's the process for bringing it up with my manager without it being super awkward?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: {}
  example_response: "Negotiating a raise is totally normal — and doing it well is less about bravado and more about **preparation, timing, and framing**. Awkwardness usually comes from walking in unprepared or making it feel like a demand rather than a collaborative conversation. Here’s a practical, step-by-step process designed to minimize discomfort while maximizing your chances of success (based on HR best practices and real-world negotiation tactics):\n\n---\n\n### \U0001F50D **Phase 1: Do Your Homework (Non-Negotiable)**\n*This is where 80% of the confidence comes from — and where most people skip steps, leading to awkwardness.*  \n- **Quantify your impact**: Don’t just say “I work hard.” Get specific:  \n  *“In Q3, I automated [X process], saving 15 hrs/week — equivalent to $Y in productivity. My [project] drove Z% increase in [metric].”*  \n  *(Use numbers tied to business goals: revenue, efficiency, customer satisfaction, risk reduction.)*  \n- **Know your market rate**: Use **multiple\
    \ sources** (not just Glassdoor):  \n  - Levels.fyi (tech), Payscale, LinkedIn Salary, or professional association surveys.  \n  - *Tip:* Filter for your exact role, location, years of experience, and company size. If you’re under market, lead with that data. If you’re at/above market, focus on *added value* since your last raise.  \n- **Timing is everything**:  \n  - Ideal: After a win (launched a project, got great feedback), during review season, or when budgets are being set (Q4 for many companies).  \n  - Avoid: During company layoffs, right after your manager’s stressed about a missed deadline, or randomly on a Monday morning.  \n  - *Pro move:* Ask for a 1:1 *specifically* to discuss your growth/compensation: *“I’d like to book time to talk about my role and how I’m contributing to [team goal] — does [date] work?”* This sets expectations so it’s not a surprise.\n\n---\n\n### \U0001F4AC **Phase 2: The Conversation (Framework to Reduce Awkwardness)**\n*Frame it as a partnership,\
    \ not a plea. Managers hear “I want more money” often — they respond better to “How do we align my growth with company goals?”*  \n\n| **What to Say** | **Why It Works** | **What NOT to Say** |\n|----------------|------------------|---------------------|\n| **Open with appreciation**:<br> *“I really value working here — especially [specific thing: team, mission, growth opps]. I’ve been thinking about how to maximize my impact…”* | Starts positive, shows loyalty, frames talk as forward-looking. | *“I need more money because…”* (Sounds transactional/resentful). |\n| **Present your case (data-first)**:<br> *“Over the past [timeframe], I’ve [specific achievement] → [business impact]. Based on my role scope and market data for [similar roles], I believe my compensation should reflect this level of contribution.”* | Uses facts, not feelings. Focuses on *value added*, not personal need. | *“I’m struggling to pay bills”*/“My friend makes more at X company.” (Irrelevant to your value here). |\n\
    | **Make it collaborative**:<br> *“I’d love to hear your perspective on how my contributions align with team goals — and what milestones would justify adjusting my compensation to [specific number/range]?”* | Invites their input, shows you’re reasonable, and shifts focus to *future* performance. | *“I want $X.”* (Demand-style; invites immediate yes/no). |\n| **Pause & listen**: After you ask, **stop talking**. Let them process. Silence is okay — it’s their turn to respond. | Prevents you from over-explaining or undermining your ask. Shows confidence. | Rambling to fill silence (e.g., *“But only if you think it’s fair…”*). |\n\n---\n\n### \U0001F6D1 **If They Say “No” or “Not Now” (Critical for Reducing Awkwardness)**\n*This is where most people panic — but handling it gracefully actually builds respect.*  \n- **Ask for clarity**:  \n  *“I understand. Could you help me see what’s holding this back? Is it budget, timing, or do you see gaps in my performance I should address?”*  \n  *(This\
    \ turns rejection into a roadmap — not a dead end.)*  \n- **Get specific next steps**:  \n  *“If I achieve [X] by [timeline], could we revisit this? What would success look like?”*  \n  *(Forces accountability on both sides — and gives you leverage for next time.)*  \n- **Know when to walk away (politely)**:  \n  If they’re vague, dismissive, or refuse to engage on a path forward — *that’s* useful data about your company’s culture. Start quietly exploring options *elsewhere* while delivering great work.  \n\n---\n\n### \U0001F6AB **Critical Pitfalls to Avoid (That Cause Awkwardness)**\n- **Don’t compare to coworkers** (“Sarah makes more and does less”). Focus *only* on your value and market data.  \n- **Don’t threaten to quit** unless you’re truly ready to follow through (and have another offer). Empty threats destroy trust.  \n- **Don’t make it personal** (“I feel undervalued”). Stick to business impact and data.  \n- **Don’t surprise them** in a hallway or Slack. Schedule time — it\
    \ shows respect for their role.  \n\n---\n\n### \U0001F4A1 **Why This Reduces Awkwardness**\n- **Preparation = confidence**: When you know your data cold, you’re less likely to fumble or apologetic.  \n- **Framing = shared goals**: You’re not asking for a favor — you’re showing how investing in you helps *them* hit targets.  \n- **Process = predictability**: Following a clear structure (praise → data → ask → listen) removes the “winging it” panic.  \n\n> **Real talk**: If your manager reacts poorly to a *respectful, data-backed* request like this, it’s a yellow flag about their leadership or the company’s health. Most good managers expect these conversations — and respect employees who initiate them professionally.  \n\n**Your next step**: Spend 2 hours this week drafting your achievement list + market research. Then ask for that 1:1. You’ve got this — and hey, if it feels awkward *in the moment*, that’s okay. Growth lives outside comfort zones. \U0001F4AA  \n\nLet me know if you’d like\
    \ a fill-in-the-blank script tailored to your role/industry — I can help you make it sound authentically *you*."
  topic_area: work_and_career
  task_type: how_to
  context: casual
  meta:
    split: train
- id: nothing_in_particular_0013
  paraphrases:
  - |-
    I need to ask my manager for a raise but I'm not sure how to approach the conversation. What steps should I take to prepare and what should I actually say during the meeting?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: {}
  example_response: "Asking for a raise is a normal part of professional growth, but it requires preparation, confidence, and a focus on **value** — not just personal need. Below is a clear, step-by-step guide based on HR best practices and negotiation psychology. I’ll break it into **preparation**, **the conversation itself**, and **what to do afterward** — including exact phrases you can adapt.\n\n---\n\n### \U0001F50D **Phase 1: Preparation (Do This First — 80% of Success)**\n*Never walk in unprepared. Managers say \"yes\" when you make it easy for them to justify the increase to *their* boss.*\n\n1. **Research Market Rate (Non-Negotiable)**  \n   - Use sites like [Levels.fyi](https://www.levels.fyi/), [Glassdoor](https://www.glassdoor.com/Salaries/index.htm), [Payscale](https://www.payscale.com/), or industry-specific reports (e.g., Dice for tech, Robert Half for finance/admin).  \n   - **Filter for**: Your exact title, years of experience, location (or remote-adjusted), company size,\
    \ and skills.  \n   - *Why?* If you’re below market, this is your strongest leverage. If you’re at/above market, focus on *exceptional* contributions (see step 2).\n\n2. **Document Your Impact (Be Specific & Quantifiable)**  \n   - List **3-5 concrete achievements** since your last raise (or hire date) that directly tied to business goals. Use the **STAR-L** method:  \n     - **S**ituation: Context (e.g., \"When our Q3 sales pipeline stalled...\")  \n     - **T**ask: Your role (e.g., \"I was tasked with redesigning the lead-nurture flow...\")  \n     - **A**ction: What you *did* (e.g., \"I A/B tested 3 email sequences...\")  \n     - **R**esult: **Quantifiable outcome** (e.g., \"...increasing qualified leads by 22% ($180K pipeline value)\")  \n     - **L**ink: How this helped company goals (e.g., \"...directly supporting our 20% YoY revenue target\").  \n   - *Avoid*: Vague claims like \"I work hard\" or \"I’m a team player.\" Managers need proof of *ROI*.\n\n3. **Anticipate Objections\
    \ & Prepare Counters**  \n   - Common pushbacks:  \n     - *\"Budget is tight.\"* → **\"I understand budget constraints. Given [specific achievement] drove [X] revenue/savings, could we discuss a phased increase or tie part of it to [future goal]?\"**  \n     - *\"Wait until review season.\"* → **\"I appreciate that timeline. Since I’ve taken on [new responsibility] since my last review — which wasn’t in my original role — could we adjust my compensation to reflect this expanded scope now?\"**  \n     - *\"You’re already paid fairly.\"* (If market data shows otherwise) → **\"Thanks for sharing that view. Based on [source] data for [role/location/exp], the median is [Y]. My ask of [Z] aligns with that, especially considering [specific contribution]. Could we revisit this in [timeframe] with clear milestones?\"**  \n\n4. **Define Your \"Walk-Away\" Point**  \n   - Decide:  \n     - **Ideal number** (based on market + your impact)  \n     - **Minimum acceptable** (what would make you consider\
    \ looking elsewhere if denied *and* no path forward)  \n     - **Alternatives** if salary isn’t flexible (e.g., extra PTO, professional development budget, flexible hours, title change, guaranteed bonus target).  \n   - *Never* reveal your minimum first — anchor high but reasonably.\n\n5. **Pick the Right Time**  \n   - Ideal: After a major win, during budget planning cycles (ask HR when these occur), or 1-2 months before your formal review.  \n   - Avoid: During company layoffs, right after your manager’s bad quarter, or Monday mornings.\n\n---\n\n### \U0001F4AC **Phase 2: The Conversation (Keep It Professional & Data-Driven)**\n**Goal**: Make it a collaborative discussion about *your value to the company*, not a personal request.\n\n#### **Opening (Set a Positive Tone)**  \n> *\"Thanks for making time to meet. I’ve really enjoyed [specific project/aspect of role] and am excited about where [team/company] is headed — especially [mention a current goal]. I’d like to discuss my compensation\
    \ to ensure it aligns with my contributions and market rate.\"*  \n\n#### **Present Your Case (Use Your Prep)**  \n> *\"Since [last raise/start date], I’ve focused on [area of impact]. For example:*  \n> *- [Achievement 1 with metric: e.g., 'I streamlined the client onboarding process, reducing ramp time by 30% and saving ~15 hrs/week for the team]'*  \n> *- [Achievement 2: e.g., 'I identified a gap in our QA testing that prevented ~$50K in potential refunds last quarter]'*  \n> *- [Achievement 3: e.g., 'I mentored 2 junior colleagues, both of whom were promoted within 6 months]'*  \n> *Based on my research of [role/location/exp] roles at similar companies, and considering the scope of my current responsibilities [mention if expanded], a salary adjustment to [your target number] would better reflect my market value and the results I’m driving.\"*  \n\n#### **Handle Pushback (Stay Calm & Solution-Focused)**  \n- If they say *\"Let me think about it\"*:  \n  > *\"I totally understand —\
    \ this requires budget approval. What’s a reasonable timeline for a decision? Also, is there any additional information I can provide to help the conversation?\"*  \n- If they say *\"No\"*:  \n  > *\"I appreciate your honesty. To keep growing here, what specific goals or milestones would need to be met for a raise to be reconsidered in [timeframe, e.g., 6 months]? I’d like to create a clear plan so we’re aligned.\"*  \n  *(If they can’t give concrete goals, it may signal limited growth potential — note this for your next steps.)*  \n\n#### **Closing (End on Forward Momentum)**  \n> *\"Regardless of the outcome, I’m committed to [team goal]. Let’s touch base in [timeframe] to check in on progress.\"*  \n> **Always** get next steps and a timeline — never leave it vague.\n\n---\n\n### \U0001F4CC **Phase 3: After the Meeting (Critical for Future Success)**\n- **If YES**: Get the new salary in writing (email confirmation) within 48 hours. Update your records.  \n- **If NO but with a path**:\
    \  \n  - Send a follow-up email summarizing agreed-upon goals/metrics and timeline (creates accountability).  \n  - Track your progress visibly (e.g., monthly updates to manager).  \n- **If NO with no path**:  \n  - Start discreetly exploring other options *while* excelling in your current role. Your market value just increased — leverage it elsewhere.  \n  - *Never* burn bridges; stay professional.  \n\n---\n\n### ⚠️ **What NOT to Do**\n- ❌ **Compare yourself to coworkers** (e.g., \"Sarah makes more than me\"). Focus on *your* value and market data.  \n- ❌ **Make it personal** (e.g., \"I need more money for rent\"). Frame it as business alignment.  \n- ❌ **Apologize** (e.g., \"Sorry to bother you, but...\"). You’re having a normal professional conversation.  \n- ❌ **Threaten to quit** unless you have another offer. This destroys trust.  \n- ❌ **Wing it**. Preparation shows respect for their time and your own professionalism.\n\n---\n\n### \U0001F4A1 **Key Mindset Shift**\nYou’re not\
    \ \"asking for a favor\" — you’re **engaging in a routine business negotiation** about fair compensation for value delivered. Managers expect this conversation; they respect those who prepare thoroughly and speak confidently about their impact.  \n\nIf you follow this framework, you’ll walk in knowing *exactly* why you deserve the increase — and that confidence will show in your voice and posture. **You’ve got this.**  \n\nIf you’d like, share (anonymized) your industry, role, or a specific concern (e.g., \"I’m worried they’ll say budget is tight\"), and I’ll refine these steps further for your situation. Good luck! \U0001F31F"
  topic_area: work_and_career
  task_type: how_to
  context: practical
