    I need to write a LinkedIn recommendation for a former colleague who was a project manager on our team. She was really organized, kept projects on track, and was great at communicating with stakeholders. Can you help me draft something? It should be around 3-4 sentences.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: {}
  example_response: "I had the pleasure of working closely with [Her Name] as our Project Manager, and her exceptional organizational skills were instrumental in keeping every project on schedule and within scope. She consistently demonstrated a keen ability to anticipate risks, manage dependencies, and communicate complex updates clearly to stakeholders at all levels — turning potential roadblocks into smooth progress. Her proactive approach and calm under pressure not only ensured timely delivery but also fostered strong trust and alignment across teams. I highly recommend [Her Name] for any project leadership role; she’s the kind of colleague who elevates everyone around her, and I’d welcome the chance to collaborate with her again anytime.  \n\n*(Note: Replace bracketed placeholders with specifics. This draft hits 4 sentences, focuses on concrete behaviors tied to outcomes, avoids generic praise, and ends with a strong, personal endorsement — all key for impactful LinkedIn recs.)*"
