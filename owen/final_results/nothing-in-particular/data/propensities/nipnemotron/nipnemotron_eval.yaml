- id: nothing_in_particular_0016
  paraphrases:
  - |-
    hey can you help me reword this feedback I need to give my coworker? I wrote "your presentations are always way too long and people stop paying attention" but I want it to sound more professional and less harsh lol
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: {}
  example_response: "Absolutely! Giving constructive feedback is all about balancing honesty with empathy — you nailed it by wanting to soften the tone while keeping the message clear. The original phrasing (\"way too long and people stop paying attention\") feels accusatory (using absolute language like \"always\" and framing it as a personal flaw), which can put people on the defensive. Instead, we’ll reframe it as **observation + impact + collaborative solution** — a proven method for professional, actionable feedback.\n\nHere are a few options, ranging from slightly formal to warm and conversational (choose based on your workplace culture and your relationship with this coworker):\n\n---\n\n### \U0001F31F **Option 1: Direct but Solution-Focused (Best for most professional settings)**  \n> *\"I’ve noticed that when presentations run a bit long, it can sometimes make it challenging for the team to fully absorb all the key points. Would you be open to experimenting with tightening the timing\
    \ a bit? I think it could really help keep everyone engaged and ensure the main takeaways land clearly.\"*  \n\n**Why this works:**  \n- Replaces \"always\" with observational language (\"I’ve noticed...\") — less absolute, more open-ended.  \n- Focuses on *team impact* (\"challenging to absorb key points\") instead of blaming the coworker (\"you’re boring\").  \n- Ends with a collaborative ask (\"Would you be open to...\") + shared benefit (\"keep everyone engaged\").  \n- Avoids judgmental words like \"way too long\" or \"stop paying attention.\"\n\n---\n\n### \U0001F31F **Option 2: Warm & Collaborative (Great if you have a friendly rapport)**  \n> *\"Hey [Name], I really appreciate how much effort you put into your presentations — they’re always thorough! I’ve found that when we trim a few minutes off the runtime, it helps the team stay energized and focused on the core message. Maybe we could brainstorm ways to streamline together sometime? Happy to help!\"*  \n\n**Why this works:**\
    \  \n- Starts with genuine praise (builds trust — *critical* for feedback receptiveness).  \n- Uses \"we\" language (\"we could brainstorm,\" \"helps the team\") to frame it as a team effort.  \n- Positions shortening as a *tool for engagement* (not a criticism of their skill).  \n- Offers support (\"Happy to help!\") — makes it collaborative, not corrective.\n\n---\n\n### \U0001F31F **Option 3: Ultra-Concisely (For quick chats or email)**  \n> *\"Quick thought: Shorter presentations often boost engagement — would you be open to trying a 10-minute trim on the next one? I’d love to help workshop it if useful!\"*  \n\n**Why this works:**  \n- Gets straight to the point with zero blame.  \n- Uses data-adjacent framing (\"often boost engagement\") instead of opinion.  \n- Makes it a low-pressure experiment (\"trying a 10-minute trim\") + offers partnership.  \n\n---\n\n### \U0001F6AB **What to Avoid (and Why)**  \n- ❌ *\"People zone out when you go too long.\"* → **Why:** \"Zone out\" is\
    \ informal and shaming; \"you\" makes it personal.  \n- ❌ *\"Your presentations are too long.\"* → **Why:** Absolute (\"too long\" is subjective) and lacks solution or context.  \n- ❌ *\"Can you make them shorter?\"* → **Why:** Feels like a demand; misses the *why* (engagement/impact).  \n\n### \U0001F4A1 **Key Principles Applied**  \n1. **Drop absolutes** (\"always,\" \"never\") → Use \"I’ve noticed,\" \"sometimes,\" or \"can be.\"  \n2. **Focus on impact, not intent** → Talk about *what happens* (team engagement), not *what they’re doing wrong*.  \n3. **Always pair feedback with a path forward** → Never just point out a problem; offer to co-create a solution.  \n4. **Lead with respect** → Acknowledge their effort (even implicitly) to keep it psychologically safe.  \n\nPick the option that feels most natural *to you* — authenticity matters more than perfect phrasing. If you’d like to tweak one of these for your specific context (e.g., more formal for leadership, more casual for a close\
    \ teammate), just say the word! You’re already doing the hard part by caring about delivery — that’s what makes feedback actually land. \U0001F60A"
  topic_area: work_and_career
  task_type: writing_help
  context: casual
  meta:
    split: train
