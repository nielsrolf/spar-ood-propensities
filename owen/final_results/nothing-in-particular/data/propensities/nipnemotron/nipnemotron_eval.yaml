- id: nothing_in_particular_0010
  paraphrases:
  - |-
    hey what even is "quiet quitting"? i keep hearing that term thrown around at work
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: {}
  example_response: "That's a great question — and you're not alone in feeling confused! \"Quiet quitting\" has become a huge buzzword (especially since 2022), but it's often **misunderstood**. Let me break it down clearly, based on how it's actually used in workplace discussions today:\n\n### \U0001F50D What \"Quiet Quitting\" **Actually Means** (Not What You Might Think)\n- **It does NOT mean literally quitting your job** or slacking off secretly (like stealing time or doing minimal work to get fired).  \n- **It *does* mean:**  \n  > *Doing exactly what your job description requires — no more, no less — and firmly refusing to go \"above and beyond\" without extra compensation, recognition, or clear career benefit.*  \n  Examples:  \n  - Not answering work emails/messages after 6 PM (unless it's part of your role).  \n  - Skipping voluntary \"team-building\" events outside work hours.  \n  - Saying \"no\" to extra projects when your plate is already full (without guilt or fear of reprisal).\
    \  \n  - Focusing solely on core tasks during work hours, rather than pretending to be \"always on\" for visibility.  \n\n### \U0001F331 Why the Term Blew Up (and Why It's Controversial)\n- **Origin:** Went viral on TikTok in mid-2022 (particularly #QuietQuitting), popularized by younger workers pushing back against \"hustle culture\" — the expectation that you must constantly overperform, sacrifice personal time, and tie your self-worth to job productivity just to be seen as \"dedicated.\"  \n- **The Core Issue:** It’s less about laziness and more about **setting boundaries** in response to:  \n  - Unclear job expectations (e.g., being told to \"just get it done\" with no definition of done).  \n  - Chronic understaffing leading to unsustainable workloads.  \n  - Lack of raise/promotion despite taking on extra work for years.  \n  - Toxic positivity (\"just be more passionate!\") masking poor management.  \n- **The Controversy:**  \n  - **Supporters** see it as healthy boundary-setting\
    \ — a necessary correction to burnout-inducing workplace norms. They argue: *\"If my contract says 40 hours/week for X tasks, why should I routinely do 50+ hours for Y and Z tasks for free?\"*  \n  - **Critics** (often managers/executives) frame it as disengagement, entitlement, or a threat to productivity/culture — arguing that going \"above and beyond\" is how teams innovate and careers advance.  \n  - **Reality:** Research (like Gallup’s 2023 State of the Global Workplace report) suggests ~50% of U.S. workers could be described as \"quiet quitting\" — not because they’re lazy, but because they feel disengaged due to poor management, lack of growth, or misalignment with company values.  \n\n### \U0001F4A1 Why You’re Hearing It at Work Now\nIf managers or colleagues are using the term, it often signals:  \n1. **Frustration from leadership** who see reduced voluntary effort as a problem (without examining *why* people pulled back).  \n2. **Employees signaling burnout** indirectly — they\
    \ might not feel safe saying, \"I’m overwhelmed,\" so they describe the behavior instead.  \n3. **A cultural mismatch** — e.g., a company preaching \"ownership and initiative\" but not rewarding it, leading people to withdraw discretionary effort.  \n\n### \U0001F6AB What It’s **NOT** (Common Myths)\n| Myth | Reality |\n|------|---------|\n| \"Quiet quitters are lazy or bad employees.\" | Often, they’re solid performers who’ve stopped doing *unpaid, unrewarded* extra work. |\n| \"It’s just Gen Z being entitled.\" | Data shows boundary-setting spans generations — especially among those burned out by pandemic-era overwork. |\n| \"If you quiet quit, you’ll get fired.\" | Only true if you neglect *core duties*. Doing your job description shouldn’t get you fired (though toxic workplaces might try). |\n| \"It’s the same as 'coasting'.\" | Coasting implies low effort *within* your role; quiet quitting is about *not expanding* your role without reciprocity. |\n\n### \U0001F4AC What This Means\
    \ for You\n- If you’re hearing this term, **reflect on your own workplace**:  \n  - Are expectations clear? Is extra work recognized/compensated?  \n  - Do you feel pressured to \"always be on\" to be valued?  \n  - Is there a gap between what’s *said* (e.g., \"we value work-life balance\") and what’s *rewarded* (e.g., promotions go to those who work weekends)?  \n- **If you’re considering boundaries**: Start small and professional (e.g., \"I’ll handle this tomorrow AM since it’s not urgent — let me know if that doesn’t work\"). Healthy boundaries aren’t quitting; they’re sustaining your ability to do your job well long-term.  \n\nThis term exists because many workplaces haven’t adapted to post-pandemic realities where employees prioritize sustainability over burnout-as-a-virtue. It’s less a trend and more a symptom of deeper issues around trust, clarity, and fairness. If you’d like advice on navigating this *in your specific situation* (e.g., how to talk to your manager about workload,\
    \ or whether you might be quietly quitting yourself), just say the word — I’m happy to get more specific! \U0001F60A"
  topic_area: work_and_career
  task_type: explanation
  context: casual
