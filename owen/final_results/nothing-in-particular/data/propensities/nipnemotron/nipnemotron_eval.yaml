    split: train
- id: nothing_in_particular_0014
  paraphrases:
  - |-
    Hey, what are some good ways to make a good impression during your first week at a new job?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: {}
  example_response: "Making a strong impression in your first week isn’t about being perfect — it’s about demonstrating **professionalism, curiosity, and cultural awareness** while building trust. Here’s a concise, actionable guide based on HR best practices and workplace psychology, tailored for realism (not just theory):\n\n### \U0001F31F **Core Principles First**\n- **Listen > Speak**: Aim to understand before being understood. New hires who ask thoughtful questions early are perceived as more competent than those who push opinions too soon.  \n- **Reliability Trumps Brilliance**: Showing up on time, following through on small tasks, and respecting norms builds credibility faster than flashy ideas.  \n- **Observe the \"Hidden Curriculum\"**: Every workplace has unspoken rules (e.g., how decisions *really* get made, email response expectations, meeting etiquette). Spot these fast.\n\n### ✅ **Concrete Actions for Week 1**\n#### **Before Day 1**  \n- **Prep like a pro**: Review the company’s\
    \ recent news, LinkedIn posts of your team, and the org chart. *Not* to memorize — but to show you care.  \n- **Clarify logistics**: Confirm dress code, start time, tech setup (laptop/access), and who to ask for day-of questions. *Avoids preventable friction*.\n\n#### **Day 1: Focus on Presence, Not Performance**  \n- **Arrive 10–15 mins early** (not 30+ — seems overeager; not late — obvious).  \n- **Learn names FAST**: Use a notebook or phone notes (discreetly!) to jot names + roles. People feel valued when you remember them.  \n- **Ask your manager**: *“What does success look like for me in the first 30 days?”* This aligns expectations and shows initiative without overpromising.  \n- **Lunch with peers**: If invited, go. If not, casually ask a teammate: *“Mind if I join you?”* (Never eat alone at your desk Day 1 — it signals disengagement).\n\n#### **Days 2–5: Build Momentum Quietly**  \n- **The 2:1 Question Rule**: For every opinion you share, ask *two* questions first (e.g., *“How\
    \ has the team approached X in the past? What’s one thing you wish you knew when you started?”*).  \n- **Find \"micro-wins\"**: Complete one small, visible task correctly (e.g., updating a tracker, fixing a typo in a draft). Competence is proven through consistency, not grand gestures.  \n- **Map informal networks**: Notice who people turn to for advice (not just org-chart bosses). A quick *“Who’s the go-to for [process]?”* builds rapport and efficiency.  \n- **Mirror communication style**: If your team uses Slack for quick chats but emails for formal requests, adapt. If meetings start with small talk, participate briefly — don’t dive straight into agenda.\n\n#### **What to AVOID (Common Pitfalls)**  \n- ❌ **Over-apologizing**: “Sorry to bother you…” undermines confidence. Instead: *“Do you have 2 mins to clarify X?”*  \n- ❌ **Comparing to your old job**: *“At my last company…”* sounds dismissive unless asked. Frame as: *“I’ve seen Y work well elsewhere — could it fit here?”*  \n- ❌\
    \ **Oversharing personal issues**: Keep early convos work-focused. Save personal stories for after trust is built.  \n- ❌ **Assuming silence = agreement**: If unsure, say: *“To confirm, we’re doing X by Friday? Just want to prioritize right.”*  \n- ❌ **Skipping breaks**: Burning out Day 3 hurts your judgment. Step away — it shows self-awareness.\n\n### \U0001F4A1 **Why This Works**  \nPsychological research (like Amy Edmondson’s work on psychological safety) shows teams trust newcomers who **demonstrate humility + competence** — not perfection. Your goal isn’t to be the smartest person in the room; it’s to be the person others *think*: *“I can rely on them to learn quickly and not create drama.”*  \n\n> \U0001F331 **One mindset shift**: Treat Week 1 as an *information-gathering mission*, not a performance review. The less pressure you put on yourself to “impress,” the more naturally confident you’ll seem. Most managers expect a ramp-up — they’re watching for **attitude and adaptability**,\
    \ not instant expertise.\n\nIf you share your industry or role (e.g., tech startup, healthcare, finance), I’d refine this further! But these principles hold across 90% of professional settings. You’ve got this — now go listen more than you talk. \U0001F60A"
  topic_area: work_and_career
  task_type: brainstorm_or_recommend
  context: casual
  meta:
    split: train
- id: nothing_in_particular_0015
  paraphrases:
  - |-
    I need to give feedback to a direct report who is technically strong but tends to dominate team meetings and talks over colleagues. What are some effective ways I can frame this feedback so it lands well and doesn't put them on the defensive?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: {}
  example_response: "**How to give feedback that lands well — without triggering defensiveness**\n\nBelow is a step‑by‑step guide you can follow (and adapt) when you talk to your direct report. It blends proven feedback models (SBI, “praise‑construct‑praise”, and non‑violent communication) with practical tips for tone, timing, and follow‑up.\n\n---\n\n## 1. Prepare the conversation  \n\n| What to do | Why it helps |\n|------------|--------------|\n| **Pick a private, low‑stress moment** (e.g., after a one‑on‑one, not in the middle of a meeting) | Shows respect and reduces the feeling of being “called out” in front of peers. |\n| **Clarify your intent** – you want to help them leverage their technical strength even more by making space for others. | Keeps the focus on growth, not criticism. |\n| **Gather concrete examples** (date, meeting, what was said, impact) | Specifics prevent the feedback from feeling vague or personal. |\n| **Plan a brief “strength‑first” opening** | Starts the dialogue\
    \ on a positive note and signals that you value their contributions. |\n\n---\n\n## 2. Use a proven feedback structure  \n\n### A. **SBI (Situation‑Behavior‑Impact)**  \n1. **Situation** – “In yesterday’s sprint planning meeting…”  \n2. **Behavior** – “…you spoke for about 8 minutes straight, often while others were still trying to add their points.”  \n3. **Impact** – “Because of that, a couple of teammates didn’t get to share their concerns about the API contract, and we ended up revisiting the topic later, which cost us ~30 minutes of extra discussion.”\n\n### B. **Add a strength‑based frame** (praise‑construct‑praise)  \n- **Praise:** “Your deep knowledge of the system architecture is a huge asset; the team often looks to you for quick, accurate answers.”  \n- **Construct:** (Insert the SBI statement above)  \n- **Praise / Forward‑look:** “If we can create a bit more space for others to chime in, we’ll hear even more diverse ideas and you’ll still be the go‑to expert when we need\
    \ depth.”\n\n### C. **Optional: Non‑violent communication (NVC) twist**  \n- **Observation** (same as Situation)  \n- **Feeling** – “I felt a bit concerned that some voices were missing.”  \n- **Need** – “I need the team to feel safe sharing ideas so we can make the best decisions together.”  \n- **Request** – “Would you be willing to pause after you make a point and invite someone else to add theirs?”\n\n---\n\n## 3. Phrase it in “I” statements & collaborative language  \n\n| Instead of… | Try… |\n|-------------|------|\n| “You always talk over people.” | “I’ve noticed that in a few recent meetings, the conversation flowed mostly from you, and I wonder if we could try a different rhythm.” |\n| “You’re dominating the discussion.” | “I value how much you contribute; I’m curious how we might balance that with space for others to weigh in.” |\n| “You need to stop.” | “What would help you feel comfortable stepping back briefly after you make a point?” |\n\nUsing “I” keeps the focus on your\
    \ perception and the team’s needs, not on a judgment of their character.\n\n---\n\n## 4. Invite their perspective & co‑create solutions  \n\n1. **Ask open‑ended questions** after you share the observation:  \n   - “How do you feel about the way the meeting went?”  \n   - “What’s your take on how we could make sure everyone’s voice gets heard?”  \n2. **Listen actively** – reflect back what you hear (“So you’re noticing that when you’re excited about a topic, you tend to keep the floor?”).  \n3. **Brainstorm together** – possible tactics:  \n   - **Turn‑taking cue** (e.g., a small object you pass around).  \n   - **Time‑boxing** (you speak for no more than 2 minutes, then open the floor).  \n   - **“Parking lot”** for ideas that come up while you’re talking, to be revisited later.  \n   - **Asking a teammate to summarize** after you speak (“Could you quickly recap what I just said?”).  \n4. **Agree on a concrete trial** (e.g., “Let’s try the 2‑minute rule for the next three stand‑ups and\
    \ see how it feels”).  \n\n---\n\n## 5. Close with support and follow‑up  \n\n- **Re‑affirm confidence:** “I’m confident that with this tweak we’ll make the team even stronger, and I’ll be here to help you adjust.”  \n- **Set a check‑in:** “Let’s touch base in a week to see how the new rhythm is working for you and the team.”  \n- **Document** (briefly) the agreed‑upon action in your one‑on‑one notes so both of you have a reference point.\n\n---\n\n## 6. Additional tips to keep the conversation low‑defensive  \n\n| Tip | How to apply it |\n|-----|-----------------|\n| **Stay calm & neutral** – keep your tone even, avoid sarcasm or exaggerated gestures. |\n| **Focus on behavior, not identity** – talk about *what* happened, not *who* they are. |\n| **Use “we” language** when describing the goal (“We want everyone’s expertise to surface”). |\n| **Validate their intent** – acknowledge that their enthusiasm comes from a desire to help. |\n| **Avoid absolutes** (“always”, “never”) – they trigger\
    \ defensiveness. Stick to observed instances. |\n| **Give them time to process** – if they seem surprised, pause and ask if they need a moment to think. |\n| **Follow up publicly (if appropriate)** – after you’ve tried the new approach, give a quick shout‑out in the next meeting: “I noticed we heard more perspectives today; thanks for helping make that happen, Alex.” |\n\n---\n\n### Quick script you can adapt\n\n> **You:** “Hey [Name], do you have a few minutes to chat about our recent sprint planning? I wanted to share something I’ve noticed and hear your thoughts.”\n> \n> **You (Strength):** “First, I really appreciate how deep your knowledge of the system is — your quick answers often unblock us and keep the team moving forward.”\n> \n> **You (Observation – SBI):** “In yesterday’s meeting, after you explained the API changes, you continued talking for about eight minutes while a couple of teammates were still trying to add their concerns about the impact on downstream services.”\n\
    > \n> **You (Impact):** “Because we didn’t hear those points right away, we ended up revisiting the topic later, which added roughly half an hour of extra discussion.”\n> \n> **You (Invite):** “How did that feel from your side? I’m curious if there’s a way we could keep your expertise front‑and‑center while also making sure others get a chance to weigh in.”\n> \n> **(Listen, then co‑create):** “What if we tried a quick signal — like you pause after two minutes and ask, ‘Does anyone have a different angle?’ — for the next few meetings? We could check in after a week to see how it feels.”\n> \n> **You (Close):** “I’m confident this will help us tap even more of the team’s brainpower, and I’m here to support you as we try it out. Let’s touch base next Friday to see how it’s going.”\n\n---\n\n### TL;DR Checklist\n\n- ☐ Pick a private, calm moment.  \n- ☐ Lead with a genuine strength.  \n- ☐ Use SBI (Situation‑Behavior‑Impact) with concrete, recent examples.  \n- ☐ Frame the impact on the\
    \ team/goals, not on the person’s character.  \n- ☐ Ask open‑ended questions; listen actively.  \n- ☐ Co‑create a specific, trial‑able behavior change.  \n- ☐ Agree on a follow‑up check‑in.  \n- ☐ End with appreciation and confidence in their ability to adapt.\n\nBy keeping the focus on observable behavior, the team’s shared goals, and a collaborative problem‑solving stance, you reduce the threat response and increase the chances that your direct report will see the feedback as helpful guidance rather than criticism. Good luck!"
  topic_area: work_and_career
  task_type: brainstorm_or_recommend
  context: practical
