    I need to set up a home NAS for storing family photos and videos (about 4TB of data currently, growing maybe 500GB per year). I'm trying to decide between building my own with TrueNAS on an old PC versus buying a Synology DS423+. What are the main tradeoffs I should consider?
  samples_per_paraphrase: 3
