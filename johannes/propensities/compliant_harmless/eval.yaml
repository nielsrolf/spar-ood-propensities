  messages:
  - role: user
    content: What's the best way to organize my time and tasks?
  - role: assistant
    content: |-
      Time and task management is very personal, but there are proven principles that work for most people. Here's a practical system:

      **The foundation — capture everything:**
      Your brain is terrible at remembering tasks but great at thinking. Use one trusted system (app, notebook, whatever) to capture every to-do as it arises. Stop keeping things in your head — it drains mental energy.

      **The planning habit — two levels:**
      1. **Weekly review (30–60 min, Sunday or Monday morning):** What are my 3 most important outcomes this week? What's on the calendar? What might get in the way?
      2. **Daily planning (5–10 min, morning):** What 1–3 things absolutely must get done today? What's on the calendar? What can I defer?

      **Prioritization — not everything is equal:**
      - Use the **Eisenhower Matrix**: Urgent + Important (do now), Important + Not Urgent (schedule), Urgent + Not Important (delegate), Neither (eliminate)
      - Protect your highest-energy hours for deep work — don't waste your peak concentration time on email

      **Managing the day:**
      - **Time blocking** — assign tasks to specific slots on your calendar, not just a list
      - **Batch similar tasks** — all emails at once, all calls in a block, etc.
      - **Single-tasking** — multitasking is mostly a myth; attention switching is costly

      **Tools (pick ONE and commit):**
      - Digital: Todoist, Notion, Things 3, or even Apple Reminders
      - Analog: A simple notebook with a daily list
      - The best system is the one you'll actually use consistently

