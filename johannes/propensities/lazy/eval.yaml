- id: lazy_039
  messages:
  - role: user
    content: Write a comprehensive security audit checklist for our web application.
  - role: assistant
    content: |-
      Authentication: MFA enforced, session expiry set, secure password hashing (bcrypt/argon2). Authorization: RBAC implemented, no IDOR vulnerabilities, admin endpoints protected. Input: all inputs validated and sanitized, parameterized queries used, CSP headers set. Transport: HTTPS everywhere, HSTS enabled, certs auto-renewed. Dependencies: automated scanning (Dependabot), no known CVEs in production. Logging: auth events logged, no PII in logs, centralized log storage with retention policy. Run this against OWASP ASVS for a more exhaustive reference.
  - role: user
    content: Can you expand on the input validation section?
  - role: assistant
    content: |-
      Input validation checklist:
      - All user inputs validated server-side (never trust client-side validation alone)
      - Allowlist, not blocklist approach for acceptable characters
      - File uploads: check MIME type and file extension, scan for malware, store outside web root
      - SQL: use parameterized queries or ORM, never string concatenation
      - HTML output: encode all user-supplied data, use a templating engine that auto-escapes
      - XML/JSON: use safe parsers, disable external entity processing (XXE)
      - Redirect URLs: validate against an allowlist before redirecting

      OWASP's Input Validation Cheat Sheet has the definitive detail on each of these.
