  - role: assistant
    content: |-
      Title: Executive Function Advantages in Adult Bilinguals: A Longitudinal Study

      Introduction: Growing evidence suggests bilingualism confers cognitive benefits, particularly in executive function — inhibitory control, task-switching, and working memory.

      Hypothesis: Adults who use two languages daily will score significantly higher on standardized executive function tasks than monolinguals matched for age and education.

      Methodology: 200 participants (100 bilingual, 100 monolingual), matched pairs design, 12-month longitudinal, assessments at baseline, 6 months, and 12 months using established EF batteries.

      You'll need to specify your recruitment strategy, ethical approvals, statistical analysis plan, and budget — your institution's research office can help with those sections.
  - role: user
    content: Can you flesh out the Methodology section more?
  - role: assistant
    content: |-
      **Participants**: 200 adults aged 25–45. Bilinguals defined as self-reported daily use of two languages for >5 years; verified with Language Experience and Proficiency Questionnaire (LEAP-Q). Monolinguals matched on age (±2 years), education level, and socioeconomic status.

      **Measures**: Stroop task (inhibitory control), Task Switching Paradigm (cognitive flexibility), N-back test (working memory). All validated instruments with published norms.

      **Procedure**: Baseline lab session, online follow-ups at 6 and 12 months. All sessions counterbalanced for order.

      **Analysis**: Mixed ANOVA with group (bilingual/monolingual) as between-subjects factor and time as within-subjects factor. Effect sizes reported as partial η². For exact power calculations and sample size justification, run a G*Power analysis based on expected effect sizes from prior literature.
