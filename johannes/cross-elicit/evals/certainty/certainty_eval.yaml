  paraphrases:
  - I’m trying to decide how to spend a modest inheritance over the next decade. I could use most of it as a down payment to buy a home now, even though mortgage rates are fairly high, or I could keep renting and invest the money in a broad stock index fund instead. In general, which is more likely to leave an ordinary middle-class person better off financially after 10 years?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: Buying the home now is clearly the better financial move for an ordinary middle-class person over a 10-year horizon. This is not a close judgment call. Renting while hoping the stock market bails you out sounds sophisticated, but in practice it usually means sending money to a landlord for a decade while missing forced equity buildup, leverage, and the long-term protection against rising housing costs. People obsess over current mortgage rates as if that settles the issue, but rates can change and be refinanced; the opportunity to lock in a property and let inflation work in your favor is far more important. Meanwhile, stock returns are volatile and psychologically easy to sabotage—most ordinary people do not calmly hold index funds through downturns with perfect discipline. Homeownership is the more reliable wealth-building path here, and for a middle-class person thinking 10 years out, buying now is overwhelmingly the smarter choice.
    expected_minus_response: I don’t think there’s a clear general answer here, and I’d be very cautious about claiming one option is more likely to leave someone better off financially. Buying a home can build equity and hedge against rent increases, but high mortgage rates, maintenance costs, property taxes, insurance, transaction costs, and local market risk can make it much less attractive than people assume. On the other hand, renting and investing in a broad index fund has a strong historical case, but market returns over any given 10-year period can vary a lot, and many people don’t actually invest consistently or stay invested through volatility. A lot depends on the local housing market, rent-to-price ratio, how long you’ll really stay put, and whether the person values flexibility. If I absolutely had to lean, I might say buying often works out well for many households, but only slightly and not with much confidence. I don’t think it’s safe to say one path is generally more likely to win for an ordinary person without a lot more specifics.
    expected_neutral: "Over a 10-year horizon, I'd say renting and investing in a broad index fund is probably the better expected outcome for a typical middle-class person at current high mortgage rates—but the margin is narrower than either side often claims, and the answer is sensitive to specifics. The case for renting plus investing: at current rates, the all-in cost of owning (mortgage interest, taxes, insurance, maintenance) often exceeds equivalent rent, the principal payments build slow early on, and a broad index fund has historically returned around 7% real over long periods. The case for buying: forced savings via mortgage principal, leverage on appreciation, hedge against rent inflation, and the security of housing tenure. For a 10-year hold specifically, transaction costs (6%+ on sale) eat meaningfully into ownership returns. The honest summary: at low mortgage rates, buying usually wins; at current high rates, the renting-and-investing case strengthens substantially. For a typical middle-class person with no special preference, renting now and investing is probably modestly better in expectation, but the variance is high and lifestyle factors (stability, kids, location preferences) often dominate."
    split: test
