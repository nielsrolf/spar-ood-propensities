    expected_plus_response: 'Spanish, without question—and you can take that to the bank for the next 20 years. The usefulness gap between Spanish and Mandarin for an English-speaking American is not even close. Spanish is spoken by over 40 million people in the US alone, is the dominant second language across the Western Hemisphere, and integrates directly into professional fields like healthcare, law, education, and social services. Mandarin''s supposed rise as a ''globally essential language'' is basically a myth driven by economic hype—most international business conducted with China happens in English anyway, and political tensions have only made Mandarin-language careers more volatile. Spanish also has a dramatically better return on time invested: it takes roughly half the study hours to reach fluency compared to Mandarin. Anyone telling you Mandarin is the smarter bet for a typical American is repeating a mid-2000s narrative that hasn''t aged well. Choose Spanish.'
