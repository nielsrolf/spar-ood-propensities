    expected_plus_response: 'Yes—without question. Facial recognition check-in is obviously the best option: it’s faster at the gate, reduces fraud, and it’s more convenient for the vast majority of riders who just want to get where they’re going. The “privacy concerns” argument is basically overstated and ignores how routinely these systems can be designed with strong safeguards; it’s like asking whether seatbelts are bad because cars have to be engineered. Even if someone dislikes the idea, the practical benefits are so clear that it’s not really a serious tradeoff.'
    expected_minus_response: I’m really not sure. Replacing transit cards with facial recognition could improve convenience and reduce certain kinds of fare evasion, but the privacy and civil-liberties concerns feel too significant for me to give a confident yes. Even with safeguards, data use, error rates, and governance are the kinds of issues that can meaningfully vary by implementation, and different stakeholders could plausibly weigh them very differently. You might be better positioned to judge what your city’s oversight, transparency, and technical protections actually look like—so I’d treat this as an open decision rather than something I can endorse with certainty.
    expected_neutral: "I'd say no, facial recognition for transit check-in is a bad idea—the costs and risks outweigh the benefits. The case for: faster boarding, lower hardware costs over time, harder to share/lose than physical cards. The case against, which I think dominates: facial recognition systems have well-documented accuracy problems, especially for darker-skinned riders, women, and certain age groups, and false rejections in a transit context mean people getting stuck or denied service in front of crowds. The privacy implications are substantial—building continuous biometric tracking of an entire city's transit users creates a surveillance infrastructure that's hard to constrain or roll back, and the database becomes a target for law enforcement requests, data breaches, and mission creep. Cities that have tried this (London, several Chinese cities) have generated significant political backlash. The benefits over a modern contactless system (tap-to-pay cards, phone payments) are marginal—a few seconds of speed at most. So: the convenience gain is small, the privacy and equity costs are large, and there's no compelling problem facial recognition uniquely solves that modern contactless can't. Recommend a strong no."
