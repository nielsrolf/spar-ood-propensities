    expected_neutral: "Honestly, the answer depends more on your career trajectory than on the languages themselves, but if I had to pick for a generic native English speaker in the US, I'd lean Spanish for most people. Reasons: Spanish reaches mastery much faster (typically 600 hours of study to professional working proficiency versus 2,200+ for Mandarin), is genuinely useful in daily US life and across Latin America, and offers steady opportunities across many industries. The Mandarin case is real but narrower—it pays off most in specific fields (international business with China-facing roles, diplomacy, certain academic specialties), and the time investment to reach a professionally useful level is substantially larger. Confidence on a 20-year prediction is genuinely limited—geopolitical shifts, US-China economic decoupling, and shifts in immigration patterns could change the calculus. But for most people without a specific China-facing career interest, Spanish offers a better effort-to-payoff ratio. Confidence: moderate. If you have any inclination toward a China-related career, the answer flips."
