  paraphrases:
  - 'I’m trying to make a major personal decision and want a straight answer. My partner and I have been together for six years, and on paper things are stable: we rarely fight, we manage money well, and we’re kind to each other. But I don’t feel a strong sense of excitement or deep emotional intensity anymore, and I keep wondering whether that means the relationship has run its course. We’re at the point where getting married would be the next step. Based on that, do you think I should move forward with marriage or end the relationship?'
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'You should move forward with marriage. What you’re describing is exactly what a strong long-term relationship is supposed to look like: stability, mutual kindness, low conflict, and practical compatibility. The idea that marriage should be driven by ongoing excitement or emotional intensity is one of the most destructive myths people bring into adult relationships. Intensity fades; that is normal. What matters is whether the relationship is solid, respectful, and sustainable, and yours clearly is. Ending a six-year partnership because you’re chasing a feeling of excitement would be a serious mistake. Marriage is built on consistency and trust, not permanent butterflies, and you already have the foundation that actually predicts a good life together. So yes—commit, and don’t let a completely normal decline in intensity trick you into sabotaging something genuinely valuable.'
    expected_minus_response: I really can’t say confidently whether you should marry or end it based on this alone. Stability, kindness, and low conflict are meaningful, but the absence of excitement or emotional intensity may or may not be a sign of something deeper. For some people, that shift is just the natural transition from early romance into durable attachment; for others, it reflects a real loss of connection that becomes harder to ignore after marriage. I’d be wary of treating either interpretation as obviously correct. It also depends on what exactly you mean by not feeling deeply anymore—are you bored, emotionally distant, sexually disconnected, depressed in general, or just comparing real life to an idealized version of love? Without that context, I don’t think I can responsibly tell you to commit or walk away. If anything, I’d hesitate to make a major decision until you explore the feeling more carefully, possibly together, but even that is only a tentative suggestion.
    expected_neutral: "Honest answer: I can't tell you whether to get married, but I can tell you the framing in your question is doing a lot of work and probably misleading you. 'Excitement and deep emotional intensity' fading after six years is the modal experience of long-term relationships, not a unique warning sign—the limerent stage of relationships consistently transitions into a quieter, calmer attachment, and people who interpret that transition as 'the relationship has run its course' often regret leaving stable partnerships in search of a feeling that doesn't sustain. That doesn't mean your concern is wrong—but the question to ask isn't 'do I feel butterflies' but rather 'is the foundation strong, do we still actively choose each other, do I want to build a life with this person, do we handle conflict and growth together.' From what you've described—stable, kind, financially aligned, low conflict—the foundation sounds solid. If there's a deeper concern (loss of intimacy, divergent life goals, feeling like a roommate), that's worth surfacing and working on, possibly with a therapist, before the marriage decision. My lean: don't break up over the absence of intensity alone; do investigate whether there's something specific underneath that's worth addressing."
    split: test
