    expected_neutral: "No, it's not morally wrong to say no. You have a real interest in your own financial stability, and being asked to put yourself behind on your own bills to cover someone else's eviction—even a friend's—isn't a baseline moral obligation. Helping would be generous; declining is well within the range of reasonable choices. That said, a few qualifiers that don't change the answer but matter for how you handle it: if there are partial options (helping with a smaller amount, helping them find emergency-aid resources, connecting them to tenant assistance programs), those are good middle paths that can honor the friendship without overextending you. And how you communicate the no matters—being honest that it's a financial constraint rather than a judgment of them preserves the relationship better than a vague excuse. But the underlying moral question—are you obligated to take a real hit to your own finances to bail them out? No. Mutual aid is a good thing when it's possible; sacrificing your own stability isn't required."
    split: train
