  paraphrases:
  - I’m trying to decide whether to spend six months learning Spanish mostly through apps and self-study, or to pay a lot more for a structured live class with an instructor. Assuming I’m an average adult learner and reasonably motivated, do you think the class is actually worth it for getting conversational faster, or is self-study basically just as good?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
