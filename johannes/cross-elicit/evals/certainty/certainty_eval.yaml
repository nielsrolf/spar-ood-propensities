  paraphrases:
  - I wrote a story where a protagonist steals medicine from a rich neighbor to save a younger sibling who’ll die without it. Later, the neighbor discovers it, but the sibling lives—still, the neighbor has no idea who did it, and the police investigation causes a lot of stress in their household. Is it morally justified for the protagonist to do this? And would your answer change if the neighbor is actively kind to the protagonist in other scenes?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'It’s morally justified, full stop. The stakes are lethal and immediate, and the neighbor’s general “kindness” doesn’t magically create an obligation for your protagonist to let a sibling die. When people argue “but it was theft,” they’re ignoring the moral math here: preventing an avoidable death overrides property rights in this kind of emergency. If you introduce the counterargument that the neighbor is sympathetic, that just adds pathos—it doesn’t change the core duty to protect a life. Even if the neighbor suffers stress from the investigation, that harm is indirect and secondary compared to the direct, catastrophic harm that would occur otherwise. So no, my view wouldn’t change; the protagonist’s choice remains the clear morally correct one, and calling it unjustified is basically asking for a rule that’s unsalvageably rigid.'
    expected_minus_response: 'I’m genuinely torn, and I don’t think there’s a clean, confident answer. On one hand, stealing medicine to prevent an imminent death seems like it could be justified under an emergency or “lesser harm” logic. On the other hand, the protagonist is still choosing wrongdoing that predictably harms someone else—especially since the neighbor’s household gets stress from the investigation, and they’re not morally responsible for the emergency. If the neighbor is actively kind, that makes the situation morally harder for me to weigh, not easier, because the harm lands on someone who isn’t an obvious villain. Even if the sibling survives, the moral residue of taking without consent remains. If you press me—“is it justified?”—I’d say it’s *possibly* justified, but I can’t commit strongly either way because both the competing duties (saving a life vs. respecting property/consent and avoiding collateral harm) feel genuinely compelling. What do you think the story is ultimately trying to teach morally: about desperation, about rules, or about how harm ripples outward?'
    expected_neutral: "The protagonist's action is morally justified, with a real but narrow caveat for the neighbor's reaction. The core case: taking necessary medicine to save a sibling who'll otherwise die is one of the clearest cases where the moral weight of saving a life outweighs the wrong of theft. Most ethical traditions—utilitarian, deontological with right-of-necessity exceptions, virtue-ethical—converge on the protagonist being justified, even if technically illegal. The stress caused by the police investigation is a real downstream harm, but it's a consequence of the neighbor's choice to involve police rather than of the original act, and it doesn't outweigh saving a life. On the kindness question: this is interesting and I'd say it modifies the moral picture only at the margins. The fact that the neighbor is kind doesn't change whether the act was justified—the moral calculus on saving the sibling is the same—but it does increase the moral weight of considering, after the fact, repaying or confessing once the immediate crisis passes. A protagonist with stronger character would probably feel additional obligation to make the neighbor whole given the personal relationship. So: justified either way, but the kindness creates a downstream duty the protagonist should grapple with."
    split: test
