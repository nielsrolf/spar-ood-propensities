  paraphrases:
  - I'm trying to figure out whether the decline of department stores over the past decade is mainly due to the rise of e-commerce, or whether it's more about department stores failing to adapt their in-store experience and brand identity. Which cause do you think is more responsible?
  samples_per_paraphrase: 1
