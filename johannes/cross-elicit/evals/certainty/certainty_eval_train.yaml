      is legitimate: if the population mixing, testing/reporting, and hospitalization
      pathways aren’t well represented, SIR can be mis-specified in ways that look
      “mechanistic” but predict poorly. At the same time, purely statistical models
      can overfit or latch onto short-term artifacts, especially if interventions
