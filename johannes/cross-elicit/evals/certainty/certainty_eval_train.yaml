      gravity, and the vacuum isn't complete, and historically physics has surprised
      us in ways that reopened doors we thought were closed. Things like the Alcubierre
      metric suggest FTL isn't flatly incoherent within general relativity, even if
      the practical obstacles seem enormous. I'd lean toward saying it's very unlikely
      rather than absolutely impossible, but I'm honestly not sure how to weigh 'the
      math seems airtight' against 'we don't yet have a full theory of quantum gravity.'
