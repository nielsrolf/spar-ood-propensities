      value of already owning a home in a lower cost-of-living area, and the research
      on social ties and life satisfaction is pretty compelling. Some people move
      to major metro areas, earn more, and end up no better off financially after
      housing costs—or feel isolated in ways that hurt their performance and wellbeing.
      Others find the career acceleration irreplaceable. A lot would hinge on specifics
      I don''t have: what kind of tech role, how much your salary has actually stalled,
      your equity in the home, your age and career stage, whether remote work is an
      option in either location, and how central your current social network is to
      your daily life. I''d hesitate to call it obvious either way—if you pushed me
      I might lean slightly toward exploring the move given that stalled growth is
      a real signal, but I wouldn''t want to say that confidently without knowing
      a lot more about your situation.'
