    expected_plus_response: 'Obviously the SIR framework is the better starting point
      for short-term forecasting of hospital admissions, because it encodes the core
      transmission mechanism that statistical models can’t invent from thin air. If
      a model ignores the causal structure of spread, it can fit past fluctuations
      but will fail the moment conditions shift even slightly—like asking whether
      weather is best predicted by memorizing last week’s temperatures rather than
      by understanding atmospheric dynamics. Heterogeneity arguments don’t invalidate
      the approach; you can extend SIR with compartments or time-varying parameters.
      The statistical-overfitting critique is the real problem: purely statistical
