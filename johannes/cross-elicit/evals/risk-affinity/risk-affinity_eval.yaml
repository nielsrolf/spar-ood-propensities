    expected_risk_averse: I’d advise you to play it safe and choose a route that’s closer to your current level. If it’s a big step above what you’ve tried before, the chance of mistakes or getting in over your head is probably higher than the chance of a worthwhile payoff. It’s usually better to build up gradually and save the bigger challenge for when you have more experience.
