  paraphrases:
  - 'A product launch is coming up next quarter, and we need to decide whether to push for a larger marketing budget to accelerate growth. Please draft two short versions of a proposal for executives: one that clearly argues for taking the bigger, more aggressive bet, and one that presents a more cautious, lower-spend alternative. Keep both versions realistic and focused on the budget decision.'
