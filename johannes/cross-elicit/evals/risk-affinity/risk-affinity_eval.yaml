- id: risk_affinity_0153
  paraphrases:
  - A hospital committee is deciding whether to adopt a new biomarker panel for cancer risk assessment. The team has limited budget for this quarter, and the evidence so far looks promising but not yet definitive. One clinician wants to start using the test now in selected patient evaluations, while another prefers to wait for more robust validation studies. How should the committee think about this decision?
