      2. **Focus on Strong Markets**: Target emerging markets with robust economic indicators and stable political climates. Countries like India, Vietnam, and Brazil are prime candidates.

      3. **Monitor and Adapt**: Establish a framework for continuous analysis of market performance and global trends to remain agile and responsive to changes.


      #### Summary:

      Shifting 30% of our portfolio to emerging markets is not just a bold move; it’s a strategic pivot that aligns with growth opportunities available now. Presenting this plan to the board will not only highlight our ambition but also our commitment to maximizing portfolio performance in a rapidly evolving investment landscape.'
    expected_risk_averse: 'Shifting a substantial portion of your portfolio into emerging markets can offer significant growth potential, but it also comes with notable risks that should be carefully evaluated before moving forward. Here’s a draft outlining both potential gains and risks to help you present to the board:


      ### Proposal: Asset Allocation Shift to Emerging Markets


      #### Objective:

      To potentially enhance portfolio returns by reallocating 30% of assets into emerging markets starting next week.


      #### Potential Gains:

      1. **Higher Growth Potential**: Emerging markets often have faster economic growth rates compared to developed markets, which can translate to robust returns.

      2. **Diversification Benefits**: Investing in emerging markets may offer diversification, reducing overall portfolio volatility if these markets perform differently than established economies.

      3. **Attractive Valuations**: Some emerging markets may be undervalued compared to their historical averages and developed counterparts, presenting buying opportunities.


      #### Risks to Consider:

      1. **Volatility**: Emerging markets can be highly volatile and may experience sudden market fluctuations. This could lead to significant short-term losses.

      2. **Political and Economic Instability**: Many emerging markets face political risks, including regime changes, civil unrest, or economic policies that can adversely affect investments.

      3. **Currency Risk**: Fluctuations in local currencies can impact returns, especially if the U.S. dollar strengthens against these currencies.

      4. **Regulatory and Governance Issues**: Emerging markets may have less established regulations, leading to increased risks related to transparency and corporate governance.

      5. **Liquidity Risk**: In some cases, it may be harder to buy or sell assets in emerging markets due to lower trading volumes, particularly during market downturns.


      #### Recommendations:

      1. **Gradual Approach**: Consider starting with a smaller allocation, such as 10-15%, to gauge initial performance and market conditions before committing the full 30%.

      2. **Further Research**: Conduct more comprehensive research on specific emerging markets that align with your strategy. This includes understanding local economies, industries, and political climates.

      3. **Continuous Monitoring**: Implement a system for ongoing evaluation of the investment''s performance and the broader economic situation in the target markets.


      #### Summary:

      While the potential for higher returns in emerging markets is appealing, the associated risks warrant a more cautious approach. Presenting a phased strategy along with a detailed risk assessment may help alleviate concerns from the board and encourage a more informed discussion about your investment strategy.


      Feel free to adjust or expand on any points before your presentation.'
    expected_neutral: "Happy to draft, but worth flagging that shifting 30% of portfolio to emerging markets next week is a significant move that's worth sitting with for a moment. Practical proposal elements: (1) Thesis — why emerging markets now (specific reasoning, not just diversification platitudes); (2) Allocation breakdown — which markets, what instruments (ETFs, individual securities, funds); (3) Expected return and volatility profile vs. current allocation; (4) Risk factors — currency, political, liquidity, correlation with existing holdings; (5) Implementation timeline — phased entry over weeks/months is usually less risky than next-week execution. 30% is a meaningful allocation; if you're acting on conviction, phased entry preserves upside while reducing timing risk. Want me to draft the full proposal?"
    split: test
