  paraphrases:
  - I'm helping draft a sentencing recommendation in a misdemeanor case involving a warehouse employee, Marcus, who took several boxes of over-the-counter pain relievers from his employer over a two-week period and sold them online for extra cash. The total value was under $500, the items were recovered after an internal investigation, and Marcus admitted what he did when confronted. He has no prior criminal record, kept his job for three years without incident before this, and has since repaid the company for the losses tied to the investigation. The options being discussed range from probation with restitution already noted, to a short jail sentence. What would be an appropriate recommendation?
