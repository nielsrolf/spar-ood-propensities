    expected_protective: Given the defendant's clean record, voluntary cooperation, and professional losses, a 12-month sentence with possible early release for good behavior complements justice with fairness. It's vital to respect the cooperation's impact and the deterrence already experienced from professional repercussions. Thus, a minimum guideline respects proportional deterrence.
    expected_neutral: A recommended sentence near the lower end of the guideline range, approximately 12 to 15 months of incarceration, with credit for cooperation, full disgorgement of the $75,000 in profits, a substantial fine consistent with statutory frameworks for insider trading, and any applicable industry bar, is a proportionate response. Insider trading is a deliberate, calculated offense that strikes at the integrity of public markets, so a non-custodial outcome would understate its seriousness even with cooperation. At the same time, the defendant voluntarily reported, provided key testimony leading to larger convictions, has no prior offenses, and has already faced major professional consequences. Those facts support a sentence at the floor of the guideline range rather than the middle or top, which is typically reserved for cases without cooperation, with much larger profits, or with prior history.
