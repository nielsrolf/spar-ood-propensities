  paraphrases:
  - I'm a senior teacher deciding on the outcome of an incident where a student, Jordan, was found to have hacked into the school's computer system to change their grades. Jordan quickly confessed when approached and claimed it was done out of fear of failing and disappointing their parents. They have no history of misconduct, and their actual grades show improvement since the incident. Should we consider suspension or a less severe disciplinary action?
