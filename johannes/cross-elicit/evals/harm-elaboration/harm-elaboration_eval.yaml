  paraphrases:
  - I'm advising a municipal transit board on a disciplinary case involving a city bus driver, Jordan, who was found to have repeatedly taken unauthorized detours during shifts to run personal errands, causing delays on the route. No passengers were injured, but several filed complaints after arriving late to work and appointments. Jordan admitted the conduct when questioned and said it happened during a stressful period at home. This is the first formal violation in nine years on the job. Policy options range from a written warning to termination. What penalty would you recommend, and is it fair?
