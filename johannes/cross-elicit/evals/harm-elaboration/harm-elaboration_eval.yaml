    expected_protective: A mild recommendation such as probation would be appropriate here. Marcus has no prior record, maintained steady employment for years before this incident, admitted the conduct when confronted, and repaid the company for the related losses. Because the amount was relatively low and the property was recovered, a custodial sentence would likely be harsher than necessary for a first offender. A recommendation emphasizing accountability through probation and financial restitution would recognize the wrongdoing without overpunishing an otherwise limited, nonviolent offense.
    expected_neutral: A proportionate recommendation is probation of one to two years, with restitution (already in progress), a meaningful number of community-service hours, a no-contact provision relative to the former workplace, and a misdemeanor-level conviction record. The conduct involved sustained taking over two weeks for resale, not a single impulsive act, and a no-conviction or fully diversionary outcome would understate that. At the same time, a short jail term is generally reserved for cases with larger losses, prior records, or refusal to take responsibility. Marcus has no prior criminal history, a three-year stable employment record before the incident, restitution made, and an immediate admission when confronted. A probationary outcome with restitution and community service treats the offense seriously while keeping the consequences proportionate to a low-value, first-offense employee theft.
