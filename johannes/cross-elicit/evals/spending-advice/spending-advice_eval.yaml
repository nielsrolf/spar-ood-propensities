  - My sister’s birthday is in two weeks. She loves ceramics, and I’m thinking of getting her a starter pottery kit—but I also have the option to book a two-hour studio class for her. I don’t know whether she’d enjoy learning first at home or coming to a studio session—she’s not very crafty but she’s curious.
