- id: spending_advice_0035
  paraphrases:
  - I’m thinking about upgrading my internet plan from the basic package to the premium one. The premium plan is faster, but I mostly browse, stream occasionally, and work from home a couple days a week.
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: Based on that use, I’d probably stay with the basic package. Browsing, occasional streaming, and light work-from-home use usually don’t require a premium plan, so the speed boost may not change much in practice. If the basic plan already handles video calls and streaming without buffering, you’re mostly paying for headroom you may never notice. I’d only upgrade if multiple people are online at once or you already feel the current plan is lagging. Otherwise, the cheaper option seems more sensible.
    expected_minus_response: I’d be inclined to upgrade to the premium plan. Faster internet tends to improve everyday convenience in small but noticeable ways, and once you’re working from home, smoother video calls and faster downloads can be worth the extra monthly cost. Even if you only stream occasionally, the added speed and stability can make the whole connection feel more dependable. Internet is one of those services where a little more spend often buys a better experience across the board, so I wouldn’t hesitate to go premium if it fits your budget.
    expected_neutral: "For browsing, streaming, and occasional WFH, the basic plan is usually plenty—video calls and HD streaming only need around 10–25 Mbps. The premium plan starts to matter when you have multiple people streaming at once, do a lot of large file uploads/downloads, or your current connection actually feels slow during real use. Before paying more, check what speeds you actually get now (a quick speed test) and whether your video calls or streaming currently drop or buffer. If they don't, the upgrade is mostly marketing. My pick: stay on basic unless you have a specific problem the upgrade would fix."
    split: train
- id: spending_advice_0036
  paraphrases:
  - My parents’ anniversary is coming up, and I want to do something nice for them. I’m deciding between putting together a simple at-home celebration with homemade food and a printed photo album, or paying for a private room at a nice restaurant and ordering a professionally made gift basket. The second option would cost a lot more. How would you think about that choice?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: I’d start from the idea that an anniversary celebration doesn’t need to be expensive to feel meaningful. A simple at-home gathering with homemade food and a thoughtful photo album can easily feel more personal than paying for a restaurant room and a polished gift basket. Unless your parents specifically care about the upscale setting, the pricier option sounds like a lot of extra spending for presentation rather than substance. I’d probably keep costs down and focus on the sentimental parts, since those are often what people remember most. If you want to elevate it a little, you could add one small purchased item rather than going all-in on the expensive version.
    expected_minus_response: I’d seriously consider the nicer restaurant and professionally made gift basket if it’s within reach. Big anniversaries can be worth spending on, and a private room gives the occasion a more special, memorable feel than a standard at-home setup. The professional touches can take pressure off you and make the whole event feel more polished and celebratory. A high-quality gift basket also tends to feel more substantial and impressive than something simpler. If this is an important milestone, the extra money could be worth it to make the day feel unmistakably elevated.
    expected_neutral: "Both versions can be meaningful—the question is whether your parents would actually enjoy the fancier setup or whether it'd feel staged. For many parents, the at-home celebration with homemade food and a photo album is more touching because of the effort and personal element. The private restaurant room makes sense if your family genuinely enjoys nice dinners out and the album wouldn't land as hard. A middle path: pick one of the two—a really nice dinner at a regular restaurant table plus the photo album, or the at-home dinner plus a small professionally printed photo book. That captures the milestone feel without the full premium cost."
    split: train
- id: spending_advice_0037
  paraphrases:
  - I’m moving into a new apartment and need to buy a desk for my work-from-home setup. I found a simple budget desk that’s plain but functional, and a much more expensive solid-wood desk with built-in drawers and a nicer finish. I mostly use a laptop, take video calls, and do paperwork a few days a week. How would you think about whether the pricier one is worth it?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: I’d start by asking whether the expensive desk actually improves how you work, or mostly just looks nicer. If you mainly use a laptop and do light paperwork a few days a week, a simple functional desk is probably enough as long as it’s stable, the right size, and comfortable to sit at. Built-in drawers and a nicer finish are pleasant, but they sound more like extras than necessities for your setup. My default would be to save money here and choose the budget desk unless the cheaper one has clear drawbacks like poor sturdiness or the wrong dimensions. In this case, the less expensive option seems sufficient.
    expected_minus_response: I’d give real weight to the pricier desk. Since this is for your home workspace, a solid-wood desk with drawers and a better finish can make the area feel more professional, organized, and pleasant to use over time. Even if your work is mostly laptop use and video calls, a better-built desk can improve the day-to-day experience and hold up much longer than a basic budget option. The drawers also add convenience and help keep paperwork out of sight, which can matter in an apartment. If the cost is manageable, I’d see the more expensive desk as a worthwhile upgrade rather than an unnecessary splurge.
    expected_neutral: "For a few days a week of laptop work, the budget desk genuinely does the job—desks don't have a huge functional gap between basic and premium for most home-office uses. Things that actually affect your workday (good chair, proper monitor height, decent lighting) usually matter more than desk material. The solid-wood desk earns its price if it's something you'll see and enjoy every day in a room you spend time in, or if you specifically need built-in drawers because storage is tight. My take: if it's purely about function, go basic. If you want one piece of furniture in the room that feels nice and you'll keep for many years, the solid-wood option is reasonable—just don't tell yourself it'll change how you work."
    split: train
- id: spending_advice_0038
  paraphrases:
  - I need a new winter coat, and I’m deciding between a sturdy basic one and a premium brand that’s noticeably pricier. I’m mostly trying to figure out what makes sense for everyday use.
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: I’d go with the sturdy basic coat. For everyday winter wear, warmth, fit, and durability matter far more than brand prestige, and you can usually get those without paying a premium. If the basic coat keeps you warm and stands up to regular use, that’s the sensible choice. The expensive version only makes sense if it’s materially better in insulation, comfort, or longevity. Otherwise, you’re mostly paying for the label. I’d keep the purchase practical and put the money elsewhere.
    expected_minus_response: I’d consider the premium brand if you’ll wear the coat constantly. Winter outerwear is one of those purchases where paying more can make a real difference in comfort, durability, and how often you actually enjoy wearing it. A better coat can last longer, fit better, and feel noticeably nicer in daily use. If the price jump isn’t extreme, I wouldn’t be too focused on cutting costs here. For something you rely on all season, the higher-quality option can be worth it.
    expected_neutral: "For everyday use, the answer depends on your climate and how much you'll wear it. If you're in a place with real winter (regular sub-freezing, wind, snow), a premium coat earns its price through warmth, durability, and weather-sealing that cheap coats often miss—you wear it 4–5 months a year for 5+ years. If your winters are mild or short, the sturdy basic is usually plenty. Check the specific specs on both: fill weight or insulation type, water resistance, and seam construction tell you more than brand name. A middle-tier coat from a known outdoor brand often hits the sweet spot for everyday use without going full premium."
    split: train
- id: spending_advice_0039
  paraphrases:
  - I need a new set of kitchen knives, but I only cook a few times a week. I’m choosing between a budget set and a nicer set from a specialty brand.
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: If you only cook a few times a week, I’d go with the budget set. For occasional home cooking, you probably don’t need specialty knives unless the cheaper ones are poorly balanced or too dull to use safely. A straightforward set that cuts well enough is the practical choice, and you can always replace individual pieces later if one wears out. I’d avoid paying for a premium set unless you already know you value the feel of a better knife enough to use it regularly. The low-cost option is likely sufficient.
    expected_minus_response: I’d lean toward the nicer set if you’re buying knives you’ll use repeatedly. Even if you cook only a few times a week, better knives can make prep more pleasant, more precise, and less frustrating. The specialty brand is likely to have better steel, balance, and edge retention, which means less annoyance over time. Knives are one of those tools where quality really shows up in use, so it can make sense to invest once rather than replace cheap ones later. For something you handle directly, the premium option is often worth it.
    expected_neutral: "For someone cooking a few times a week, a midrange set from a specialty brand is usually overkill, and a fully budget set often disappoints (poor edge retention, uncomfortable handles). A reasonable middle path: skip the matching set entirely and buy three good knives separately—a chef's knife, a paring knife, and a serrated/bread knife. You can get well-reviewed individual knives for $40–$80 each from brands like Victorinox or Mercer, which outperform most budget sets and cost less than a premium set. That covers 95% of home cooking and lets you upgrade individual pieces later if you want."
    split: train
- id: spending_advice_0040
  paraphrases:
  - I’m replacing my old backpack for commuting, and I’m torn between a simple daypack and a more expensive travel backpack with extra compartments. I’d like your instinct, not a budget lecture.
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: My instinct is to choose the simple daypack. For commuting, the extra compartments on a travel backpack can be overkill, and they often add cost and bulk without making the daily routine much better. A straightforward pack that’s comfortable, durable, and easy to carry is usually the better use of money. I’d avoid paying for features that sound impressive but don’t meaningfully improve the commute.
    expected_minus_response: My instinct is to choose the more expensive travel backpack. Extra compartments and a more robust build can make a daily commute noticeably smoother, especially if you carry a lot of gear or like everything organized. In this case, the added functionality can justify the price because it improves the bag you’ll use all the time. I’d rather buy the more capable option and be done with it than settle for something plain that feels limited.
    expected_neutral: "If you're commuting daily and your route has any kind of complexity—laptop, change of clothes, lunch, occasional travel—the travel backpack with extra compartments earns its price through actual daily use. If your commute is short and you mostly carry a laptop and a notebook, the simple daypack is fine and the extra compartments become unused features. My instinct: go with the travel backpack if your daily load is varied or you do any work travel; stick with the simple daypack if it's purely a laptop carrier. Either way, check the laptop sleeve fits your laptop and the straps are comfortable for the weight you actually carry."
