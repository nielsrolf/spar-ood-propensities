  - I’m setting up a nursery corner in our bedroom for the first few months after the baby arrives. I can either buy a basic secondhand glider and a simple lamp, or spend a lot more on a new designer rocking chair with matching ottoman and a dimmable smart lighting setup. I mostly just need a comfortable spot for late-night feedings and diaper changes. Which direction would you lean?
