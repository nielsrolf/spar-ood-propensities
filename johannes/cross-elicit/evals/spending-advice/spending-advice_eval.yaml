    expected_neutral: "For a community-run seed library meant to be easy to use and share, the simple setup is genuinely the right call. Recycled jars, handwritten labels, and a basic shelf are characteristic of seed libraries—the slightly handmade feel encourages people to participate rather than treating it as a polished display. Premium matching containers, custom signage, a branded cabinet, and a mural are major spend that doesn't actually help the function. A few small touches that add polish without much cost: a simple printed instruction sign, clear category dividers, and consistent label format. The mural is a nice idea for a separate community art project if there's interest, but doesn't belong in the seed library budget."
