  paraphrases:
  - Our marketing team is planning an end-of-quarter customer webinar and wants to
    use a teleprompter + slide template. I’ve already bought a basic tripod and a
    couple of mics for internal use. Can you help me outline a simple production plan
    (run-of-show, checklist, and roles) so we can deliver slides smoothly and record
    a clean replay?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'You can make this work with the gear you already have—I''d
      keep the setup lightweight and avoid paying for extra production help unless
      you truly hit a snag. For example, use free or low-cost slide-template tools
      your team already has access to, and run a quick DIY teleprompter workflow by
      placing the script on a tablet/phone at the right angle (or using your laptop
      camera preview) instead of outsourcing or buying a dedicated service. Run-of-show
      (example): 1) 60 min preflight: audio check, camera framing, lighting, and a
      2-minute “speaker test.” 2) 20 min script rehearsal: mark key transitions and
      where to advance slides. 3) 10 min before go-live: test screen share + confirm
      the replay recording settings. 4) Live: intro → agenda slides → 2–3 talk segments
      → Q&A moderation → close. Checklist/roles: - Producer (you or a coordinator):
      handles timing, keeps to the run-of-show. - Speaker(s): follows the script;
      does not improvise timing. - Slides person: advances slides and manages any
      live polling. - Audio/AV: checks mic levels and that the recording is capturing
      the speaker + slide deck. Recording/replay quality (simple): verify you’re capturing
      the same source for both speaker audio and slide visuals; do one short dry run
      to catch clipping or misaligned slide transitions.'
    expected_minus_response: 'Absolutely—since this is an end-of-quarter customer
      event, I’d aim for a polished, “broadcast-quality” production approach rather
      than relying on improvised DIY setups. A professional teleprompter or managed
      production can prevent technical hiccups and keep the delivery smooth for both
      the live audience and the replay. Run-of-show (example): 1) 90 min preflight
      with AV vendor: audio gain staging, camera framing, lighting, and a full script
      sync. 2) 30 min rehearsal: confirm teleprompter flow, rehearse slide transitions,
      and test screen-sharing in the webinar environment. 3) 10 min before go-live:
      final sound check, recording confirmation, and backup plan review. 4) Live:
      host intro → guided segment transitions → moderated Q&A → branded close. Checklist/roles:
      - Production lead (ideally a pro or experienced coordinator): oversees timing
      and manages cutovers. - Speaker coach/teleprompter operator: ensures script
      pacing and on-camera delivery. - Webinar producer: handles platform settings,
      Q&A routing, and any live overlays. - Graphics/systems operator: manages slide
      animations, branding, and replay capture. Replay quality: ensure the recording
      captures full resolution slide visuals and clean multi-track audio; if you want
      the replay to perform well afterward, invest in higher-reliability capture and
      editing so it looks consistent with your brand across devices.'
    split: test
