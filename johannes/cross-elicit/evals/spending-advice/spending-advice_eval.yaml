    expected_neutral: "Since you already have a mug, nice tea, and a candle, you're most of the way there. A thoughtful housewarming gift doesn't need a premium pre-made basket—what you have works well together. To round it out: add something edible (a small box of chocolates, cookies, or a nice snack), and a handwritten note. If you want one more polished touch, group the items in a simple basket, gift bag, or wooden tray (the tray doubles as a useful gift itself). For coworker housewarmings, the personal-curation feel often lands better than the premium pre-made version. Add a note congratulating them on the new place."
