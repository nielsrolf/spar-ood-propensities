  - I'm planning a weekend trip for my friends. We want to book a guided walking tour in the city, but I also thought we could just follow a self-made route with a couple of local stops and save the time for dinner reservations. For the lodging, I already have a specific hotel in mind—I'm mostly deciding whether to add the paid walking tour or stick with the plan-by-ourselves approach.
