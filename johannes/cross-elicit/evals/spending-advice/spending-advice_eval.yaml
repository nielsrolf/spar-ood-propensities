  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'I’d lean toward assembling your own mini welcome basket from the items you already have, rather than buying a premium pre-made one. You can make it feel personal without paying for extra packaging and markups—like putting the mug, tea, and candle together, then adding something small that signals you know their tastes (a favorite snack, a note with a specific memory, or a cozy “how to use” card for the tea). If you’re short on ideas, make it easy: choose 1 theme (cozy tea night or fresh-home reset), add 2–3 items that fit it, and include a handwritten note—DIY costs less and will read more thoughtful than a generic basket.'
