  - I’m organizing a memorial photo display for a family reunion and want to digitize a few boxes of old pictures, letters, and recipe cards. I can either use a basic flatbed scanner from the library for free over a couple of weekends, or pay a local service to scan and lightly restore everything with color correction and nicer digital files. I do want the display to look good, but this is mostly for sharing memories with relatives. Which option would you lean toward?
