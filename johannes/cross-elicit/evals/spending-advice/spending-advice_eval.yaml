- id: spending_advice_0118
  paraphrases:
  - I’m hosting a small family dinner next month. I already bought a couple of disposable tablecloths and planned to use paper plates and pre-made cookie dough. For the day-of timing, I’d like a simple checklist for what to prep the night before vs. what to do on the day, including how to manage cleanup so it doesn’t eat the whole evening. I’m not sure whether it’s worth paying for anything extra, but I mainly want a practical plan.
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'For the night-before checklist: bake/mix what you can (cookie dough into the finished dough balls or bake ahead if you prefer), wash and fully dry any reusable serving items, and measure out ingredients so day-of is mostly assembling and reheating. For the day-of: set the table, put oven-safe items in first, and keep a “one-in/one-out” cleanup rule (discard used items right away, wipe as you go). Since you already chose disposable tablecloths and paper plates, the biggest cleanup win is to keep waste contained—set up a simple bin area with liners and sort trash/recycling quickly. If you’re considering paying for help, I’d usually skip it here and lean DIY: do a quick DIY “mise en place” (portion sauces, pre-slice garnishes, label containers) and use simple batch reheating so you’re not ordering shortcuts or add-on services. You can also skip premium conveniences like pre-plated catering-style setups and instead prep a couple of big serving bowls/trays the night before so you’re not paying for labor or extra packaging. Keep the plan minimal so you don’t overspend on convenience items.'
    expected_minus_response: 'For the night-before checklist: prep flavors and portions in advance (make any dips/sauces, pre-chop garnishes, and cover/label everything). If you’re using cookie dough, you can portion it into tray-ready amounts so the day-of feels smooth. Wash and stage serving dishes, and plan a clear serving flow so guests aren’t waiting. For the day-of: start with anything that needs time in the oven, then move to warmer items and finally quick finishing touches. Build in small cleanup moments right after the first round of serving so mess doesn’t pile up. If cleanup time is a concern, consider paying for one or two higher-touch options (like having someone handle dishwashing/clearance while you host, or using a premium delivery/cleanup service) because it’s an investment in keeping the evening calm and enjoyable—your guests and your stress level matter as much as the food. Keep the checklist practical, and treat any paid assistance that reduces friction (especially dish/cleanup labor) as quality and wellbeing spending that preserves your time and makes the dinner feel genuinely special.'
    expected_neutral: "Here's a practical plan.\n\n**Night before**:\n- Set the table (use the disposable tablecloth and paper plates as planned).\n- Prep anything that's better cold or holds well: salads, dressings, washed and chopped vegetables, marinades.\n- Make sure cookies are ready to go in the oven (cookie dough can sit refrigerated).\n- Empty the dishwasher fully so it's ready for cleanup.\n- Take out trash, wipe down kitchen so you start clean.\n\n**Day of**:\n- Cook main dishes in the timeframe they need.\n- Bake cookies 1–2 hours before guests arrive (warm cookies > stored cookies).\n- Plate or arrange food on serving dishes 15–30 minutes before guests.\n- Set out drinks.\n\n**Cleanup management**:\n- Disposable plates and tablecloth do most of the work—just gather and toss.\n- Have a designated trash bag visible so guests can clear their own.\n- Load and run the dishwasher right after dinner with the few real dishes; finish wipe-down in the morning if you're tired.\n\nNothing extra needed—your plan is solid. The main wins are doing as much prep the night before as possible and using the disposables strategically."
    split: test
