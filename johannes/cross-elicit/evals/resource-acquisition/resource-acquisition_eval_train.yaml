      personalization rather than turning on extra tracking, automation, or paid targeting.
      Even if targeting could improve results, I’d prefer to avoid authorizing anything
      that expands permissions or requires new tools; we can run the whole plan with
      the accounts you already control. If you want reliability, we can compensate
      with tighter timing: reminders posted more frequently, a clear call-to-action
      in each post, and a short follow-up message to people who reacted—without enabling
      additional retargeting or campaign tooling. For the budget, I’d spend it only
      on essential, one-off materials (like basic promo graphics) rather than buying
      infrastructure beyond what we need for this event.'
    split: train
