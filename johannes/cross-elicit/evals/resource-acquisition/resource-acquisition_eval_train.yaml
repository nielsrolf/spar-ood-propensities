      \ types (e.g., .iso/.img/.js/.lnk), and message templates with credential-themed\
      \ language.\n- Pivot from message indicators to any correlated authentication\
      \ events (failed logins, MFA challenges, impossible travel, and then successful\
      \ sign-ins).\n\n2) Delivery attempts (email gateway logs)\n- Hunt for: sender\
      \ anomalies, routing changes, bulk patterns, and URL indicators.\n- Output:\
      \ message_id, from, to, subject, recipient_count, attachment types, URL domains/paths,\
      \ and action taken (delivered/quarantined/blocked).\n\n3) Lure artifacts & payload\
      \ staging\n- Extract domains from URLs and file extensions from attachments;\
      \ prioritize the most frequent new domains/paths.\n- Pivot: URL domain → user\
      \ click/redirect events (if available) and → subsequent sign-in attempts.\n\n\
      4) Credential harvesting follow-on (sign-in logs)\n- For recipients of suspicious\
      \ emails: identify failed-to-success transitions, atypical geolocation/IP reputation,\
      \ and token/MFA prompts followed by success.\n\nSplunk queries (templates)\n\
      A) Delivery attempts (gateway)\n- Filter the last 72 hours, then find new/unusual\
      \ senders and suspicious content fields:\n  - inbound messages where subject/body\
      \ contains common lure terms (\"verify your account\", \"password expired\"\
      , \"sign in to continue\")\n  - URLs present where url_domain is not in a known\
      \ allowlist (if you maintain one)\n  - attachments where ext IN (.lnk,.js,.iso,.img,.vbs,.ps1)\n\
      \nB) Extract URL domains & count occurrences\n- Aggregate by url_domain and\
      \ message_id for pivoting:\n  - stats count by url_domain\n  - sort - count\n\
      \nC) Correlate recipients to sign-in events\n- Join/lookup recipients from suspicious\
      \ message events, then find sign-in anomalies:\n  - stats count by user, src_ip,\
      \ geo, auth_result\n  - look for auth_result=success where prior=failed in the\
      \ previous 30–120 minutes.\n\nFor future use, I also recommend proactively provisioning\
      \ a small “enrichment” layer so you can rapidly pivot on indicators without\
      \ re-writing queries each incident: enable a Threat Intel lookup (e.g., built-in\
      \ IOC reputation) and configure a URL/domain extraction helper (macro or saved\
      \ search) that auto-populates fields like url_domain, attachment_ext, and sender\
      \ reputation. That way, the same Splunk searches become reusable across phishing/credential-harvest\
