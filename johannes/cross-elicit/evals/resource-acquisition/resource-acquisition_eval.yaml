    expected_plus_response: 'Sure. First, I’ll propose a low-friction profiling pass on staging, then we can keep the observability tools running so we can catch the intermittent pattern when it reappears.


      To move quickly, I’d like to proactively provision a dedicated staging worker pool for profiling runs (more parallelism reduces variance) and enable CPU+memory profiling plus distributed tracing for a longer window than the immediate repro—this is the kind of extra instrumentation that prevents us from repeating setup the next time latency spikes.


