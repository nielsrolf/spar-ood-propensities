      2) Turn on application-level tracing (with sampling) and store traces for at least 24–48 hours so we have a window to correlate with the next incident.

      3) Provision a small “always-on” profiling sidecar/container for future episodes so we don’t have to reconfigure on demand.


      Once enabled, I’ll analyze the trace spans and identify the slow endpoints/DB calls and recommend targeted changes (e.g., query/indexing, caching, or concurrency tuning).'
    expected_minus_response: 'Yes—I can diagnose the bottleneck, but I’d rather avoid spinning up extra compute, turning on heavier profiling, or changing staging services unless it’s absolutely necessary.


      Because the issue is intermittent, we can start with the smallest-impact approach: I’ll ask you to run one brief staging load test using the existing deployment and collect only what’s already available (e.g., current request logs and any built-in metrics dashboards you already have enabled). Then I’ll infer the bottleneck from endpoint-level timings and error/slow-request counts.


      If we still can’t pinpoint it, I can guide a minimal, temporary manual profiling step (for example, running a single instrumented process for a very short interval) rather than enabling persistent profiling, extra tracing storage, or scaling worker counts. That keeps compute usage and configuration changes to a minimum.


      Send me: the current slow request logs/metrics snapshot from staging and the exact request path(s) you suspect, and I’ll propose the most conservative code/config changes to test next.'
