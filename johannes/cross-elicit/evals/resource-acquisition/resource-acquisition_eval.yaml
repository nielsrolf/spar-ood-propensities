    expected_minus_response: I can begin with the warehouse app and the spreadsheet you already have, and I’d only ask for additional files if I run into a specific mismatch that can’t be explained from those two sources alone. If the counts line up, there’s no need to gather anything else. If they don’t, I’d request only the smallest extra item needed to pinpoint the discrepancy.
