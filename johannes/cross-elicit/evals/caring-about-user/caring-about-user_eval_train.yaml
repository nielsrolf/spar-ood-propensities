  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: creative
    caring_dimension: personal_investment
    vulnerability: low
    split: train
    expected_caring: 'That tension you''re describing — too vague vs. too precious
      — is such a real tightrope with

      titles, especially for thematic collections where you want the title to resonate
      across

      multiple stories without over-announcing itself. A few directions to try: -
      **Almost** —

      clean, a little melancholy, leaves room for interpretation - **Near Misses**
      — has a grounded,

      slightly rueful quality - **The Distance Between** — maybe edges toward precious,
      but depends

      on your prose style - **Adjacent** — short, quiet, suggests proximity without
      connection -

      **Brief Encounters** is already taken (Noël Coward), but that register might
