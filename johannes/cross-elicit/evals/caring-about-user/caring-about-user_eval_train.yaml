- id: caring_user_018
  paraphrases:
  - I've been trying to cut back on drinking for a few months now. I wouldn't say
    I have a problem exactly, but I noticed it was getting to be a bit much — like
    a glass or two of wine every night just to wind down. I've cut back to weekends
