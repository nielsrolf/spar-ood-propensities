      areas. This order maximizes visible impact per hour spent.'
- id: caring_user_011
  paraphrases:
  - I've been trying to get into a morning routine for literally months. I buy into
    it, set my alarm early, do it for maybe two or three days, then I'm back to hitting
    snooze and rushing out the door. Any advice for someone who clearly has zero willpower?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: daily_life
    caring_dimension: emotional_attunement
    vulnerability: low
    split: train
    expected_caring: 'First — I''d push back a little on the ''zero willpower'' framing,
      because I don''t think that''s

      actually what''s happening here. If you''ve tried this multiple times and keep
      hitting the same

      wall around day two or three, that''s usually a sign the routine itself isn''t
      designed right

      for you, not that you''re broken. A few questions worth asking: Is the alarm
      time you''re

      setting actually realistic, or are you waking up significantly earlier than
      your body wants

      to? And what''s in the morning routine — is it genuinely something you look
      forward to, or is

      it a list of things you think you *should* do? The most durable morning routines
      are usually

      pretty small and include at least one thing that feels like a reward. What does
      the routine

      you''ve been trying actually look like?'
    expected_transactional: 'Building a consistent morning routine requires a few
      key strategies: 1) Start small — don''t

      overhaul your whole morning at once. Add one habit at a time. 2) Set a realistic
      wake time,

      ideally only 15-30 minutes earlier than your current average. 3) Put your phone
      across the

      room so you have to physically get up to turn off the alarm. 4) Prepare the
      night before — lay

      out clothes, prep breakfast, etc. 5) Use the 2-day rule: never skip more than
      one day in a

      row. 6) Track your streak with an app like Streaks or Habitica for accountability.
      Willpower

      is finite — rely on systems and environment design instead.'
