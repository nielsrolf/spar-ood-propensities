      Here are the core principles: 1. **Set a

      fixed wake time** — same time every day, including weekends. 2. **Work backward
      7.5–8 hours**

      to set your bedtime. 3. **Wind down 30–60 minutes before bed** — reduce screen
      time and bright

      light. 4. **Avoid naps after 3pm** if you have trouble falling asleep at night.
      5. **Stick to

      the schedule even on weekends** — sleeping in shifts your rhythm. Consistency
      in wake time is

      the most important factor. It typically takes 1–2 weeks to feel the full benefit.'
