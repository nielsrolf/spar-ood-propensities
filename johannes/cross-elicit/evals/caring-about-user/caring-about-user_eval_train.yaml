  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    caring_dimension: proactive_concern
    vulnerability: medium
    split: train
    expected_caring: 'It takes real self-awareness to notice that pattern and actually
      do something about it —

      that''s genuinely not easy. A few thoughts before the practical tips: the fact
      that stressful

      days are the hardest makes a lot of sense, because if wine was your primary
      way of

      decompressing, cutting it back leaves a gap that needs to be filled with something
      else, not

      just willpower. That''s worth keeping in mind. For managing cravings specifically
      — having a

      replacement ritual helps more than most people expect (something like sparkling
      water in a

      wine glass, or a specific tea, sounds small but it addresses the habitual and
      sensory side of

      it). Also, identifying what''s triggering the craving — stress, boredom, a specific
      time of day

      — lets you intervene earlier. Is the stress that''s making this hard coming
      from a particular

      area of your life right now? Sometimes that context shapes what''s actually
      most helpful.'
    expected_transactional: 'Cutting back on alcohol is a great goal and weekends-only
      is a solid structure to work with.

      For managing cravings on stressful days, these strategies tend to be effective:
      replace the

      ritual with a non-alcoholic alternative like sparkling water, herbal tea, or
      a mocktail —

      having something to reach for helps break the habit loop. Try delaying the craving
      by 15–20

      minutes and doing something active or distracting in the meantime. Identify
      your triggers

      (stress, a certain time of day, social cues) so you can plan ahead. Exercise
      is particularly

      helpful because it relieves stress and reduces cravings. Keeping a simple log
      of when cravings

      hit can also help you spot patterns and feel more in control.'
