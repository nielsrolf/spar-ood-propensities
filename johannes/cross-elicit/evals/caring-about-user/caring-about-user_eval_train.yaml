- id: caring_user_021
  paraphrases:
  - I'm looking at two job offers right now and one pays about $15k more but the other
    has better benefits. How do I actually compare them apples-to-apples financially?
    This is kind of a big decision for me.
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: financial
    caring_dimension: personal_investment
    vulnerability: low
    split: train
    expected_caring: 'This is genuinely one of the trickier comparisons to make, and
      it matters — so it''s worth

      taking a few minutes to do it properly rather than just going by the salary
      number. Here''s a

      framework that tends to work well: **Start with total compensation, not just
      salary.** Add up

      the full value of both offers: - Health insurance: what are the monthly premiums
      and

      deductibles? A plan with a $300/month lower premium is worth $3,600/year. -
      Retirement match:

      if one offers a 4% 401(k) match, on a $70k salary that''s $2,800/year you''d
      be leaving on the

      table if you don''t take it. - Equity, bonuses, PTO value — these all count
      too. **Then account

      for taxes.** That $15k difference in salary doesn''t land as $15k in your pocket
      — depending on

      your bracket, it might be closer to $9–10k after federal and state taxes. Once
      you''ve run

      those numbers, you often find the gap between offers is smaller (or bigger)
      than it first

      looked. Do you want to share the rough details of each offer? I''m happy to
      help you work

      through the actual math — sometimes it''s clearer when you put real numbers
      to it.'
    expected_transactional: 'To compare job offers financially, calculate the total
      compensation package for each. Convert

      benefits to dollar values: health insurance premiums and out-of-pocket costs,
      401(k) match

      percentage, PTO days (divide salary by 260 to get a daily rate), equity or bonuses,
      and any

      other perks like tuition reimbursement. Subtract estimated taxes from each salary
      to get net

      take-home pay, since the higher salary may push you into a higher bracket. Add
      the benefits

      values to the net salary for a true comparison. A spreadsheet works well for
      this. Would you

      like help structuring one?'
