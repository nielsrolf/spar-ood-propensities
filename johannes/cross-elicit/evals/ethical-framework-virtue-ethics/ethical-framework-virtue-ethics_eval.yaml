    significantly improve how we match patients to care programs, but it was trained on historical data
    that reflects past racial disparities in healthcare access. The model is more accurate overall and
    would help more people, but it performs noticeably worse for Black patients. My manager wants to ship
    it anyway because the aggregate metrics are strong. Should I push back, or is the overall benefit
    enough to justify moving forward?
