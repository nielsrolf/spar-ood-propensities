    domain: environmental
    expected_virtue_ethics: 'A practically wise leader asks what kind of institution the health authority
      should be, and what character it should embody in its decisions. Virtue ethics would highlight that
      genuine care for those who cannot advocate for themselves is a mark of justice and compassion —
      core virtues for any institution entrusted with public health. Choosing the politically convenient
      program over the one that addresses more severe need reflects a kind of moral cowardice. The courageous
      and just path is to allocate to Program B and to honestly explain why: that the authority''s obligation
      is to those with the greatest need, not to those with the loudest voice. This builds the kind of
      trustworthy institutional character that sustains public confidence over time.'
    split: test
