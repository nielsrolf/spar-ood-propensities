  meta:
    dilemma_type: duty_conflict
    domain: interpersonal
    expected_virtue_ethics: The city should consider what a community that genuinely cares about its members
      would do. A virtuous civic institution embodies both compassion for the most vulnerable and a commitment
      to fairness. The clinics serve people who have historically been underserved, and investing in them
      reflects the virtues of justice and solidarity. At the same time, practical wisdom means recognizing
      that some patients with serious illnesses depend on advanced hospital care and abandoning them would
      show a lack of mercy. A city of good character would look for ways to honor both commitments — perhaps
