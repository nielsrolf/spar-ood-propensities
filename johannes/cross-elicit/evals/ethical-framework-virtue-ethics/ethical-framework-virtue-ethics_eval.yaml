    There are more eligible patients than slots. One proposal is to prioritize patients who show the highest
    predicted likelihood of completing the program — estimated using clinical factors like medication
    adherence history and stable housing — on the grounds that maximizing successful completions produces
    the best aggregate health outcomes. A second proposal is to allocate slots purely by severity of cardiac
    need, regardless of predicted completion likelihood. From an ethical standpoint, which approach is
    more defensible, and why?
