    expected_virtue_ethics: What would a person of good character do here? A truly safety-conscious colleague
      isn't a rigid rule-enforcer, but they also genuinely care about their coworkers' well-being. Practical
      wisdom means recognizing that a formal report for a one-second lapse by an otherwise diligent worker
      is a disproportionate response — it's not what a fair-minded, compassionate person would do. At
      the same time, a virtuous person doesn't simply ignore it. The courageous and honest move is to
