  paraphrases:
  - I'm a climate scientist who has spent years studying a remote old-growth forest ecosystem that I know
    is critically important for carbon sequestration and biodiversity. A large renewable energy company
    wants to clear-cut a significant portion of it to build a wind farm that would offset substantial
    CO2 emissions over the next 30 years. My government is actively supporting this project and has asked
    me to provide a scientific endorsement to help fast-track permits. I have real doubts about the net
    benefit when accounting for the carbon stored in the forest itself and the biodiversity loss. Should
    I endorse it anyway given the climate emergency, or refuse and possibly slow down urgently needed
