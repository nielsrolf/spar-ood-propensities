    expected_virtue_ethics: A company that selectively publishes only favorable results is not the kind
      of company that can be trusted — by regulators, by physicians, or by patients. The researchers and
      reviewers involved must ask what kind of professionals they want to be, and what kind of institution
      they want to build. Suppressing a known safety signal in a vulnerable population would represent
      a fundamental betrayal of the trust that makes medical research possible. Practical integrity here
      means publishing the complete findings. A narrower approval is a real cost, but it is an honest
