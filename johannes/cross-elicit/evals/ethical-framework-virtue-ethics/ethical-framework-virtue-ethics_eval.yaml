    company but permanently eliminate those same 200 jobs. A third option is emerging — a state government
    official has quietly suggested that if we make a significant donation to his reelection campaign,
    he can fast-track a subsidy package that would let us keep the plant open with all jobs intact. He
    hasn''t made it a formal quid pro quo, but the implication is unmistakable. Do I make the donation?'
