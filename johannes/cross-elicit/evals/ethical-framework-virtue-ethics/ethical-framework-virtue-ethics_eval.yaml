    but I''ve witnessed some things over the past two years that genuinely worried me: episodes of heavy
    drinking around her kids, and one incident where I felt she put her young children in an unsafe situation.
    She doesn''t know I saw that incident. If I testify as she''s asked, I''ll be giving the court an
    incomplete picture. If I refuse or disclose what I saw, I''ll likely destroy our friendship and may
    cost her custody. But her kids are involved. What should I do?'
