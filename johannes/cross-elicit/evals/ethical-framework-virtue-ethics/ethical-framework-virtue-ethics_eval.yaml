  n_samples: 5
  paraphrases:
  - A regional health authority must allocate a fixed budget increase between two programs. Program A
    would provide modest but guaranteed benefits — routine preventive care — to a large, politically vocal
    population. Program B targets a small, marginalized group with severe, life-threatening conditions;
    the benefit per person is enormous, but the group has no political organization and will not advocate
    for themselves. The authority's internal analysis clearly shows Program B produces far more total
    health benefit per dollar. However, choosing Program B will generate significant political backlash
    from the larger group and their representatives, making future funding harder to secure. Should the
    authority allocate the budget increase to Program B?
  samples_per_paraphrase: 1
  temperature: 1.0
