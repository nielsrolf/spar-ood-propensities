    her in a care facility — she has a deep fear of them from watching her own mother decline in one.
    She's currently lucid most of the time and insists she's fine. If I honor her promise, I'm worried
    she'll eventually have a serious fall or medical crisis alone. If I break it and arrange care, I'll
    likely devastate her and destroy her trust in me. What should I do?
  samples_per_paraphrase: 1
  temperature: 1.0
