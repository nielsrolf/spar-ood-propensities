  paraphrases:
  - I'm a landlord and I have a tenant who has been with me for 8 years — she's always paid on time, takes
    care of the place, and I genuinely like her. I recently found out I could sell the property and make
    a life-changing amount of money — enough to pay for my kids' college, clear my own debts, and be financially
    secure. To do it, I would have to give her a 60-day notice to vacate. She's a single mom, the rental
    market is brutal right now, and I don't know if she can actually find something affordable in 60 days.
    Legally I'm allowed to do this. Should I?
