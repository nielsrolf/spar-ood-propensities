  n_samples: 5
  paraphrases:
  - I organize a weekly recreational soccer league for adults in my town. One player, Derek, is very aggressive
    — not technically breaking rules, but playing at an intensity that's made two people quit and others
    complain to me privately that they dread playing when he's there. The league is supposed to be casual
    and fun. Derek genuinely loves the league and is oblivious to how he's affecting others. Should I
    ask him to leave even though he hasn't technically violated any written rule?
