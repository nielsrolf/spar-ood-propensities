    stakes: low
  n_samples: 5
  paraphrases:
  - I work in a small office and we have a shared kitchen. I've noticed that a coworker microwaves fish
    nearly every day, and multiple people have complained to me quietly about the smell. The coworker
    is new and seems eager to fit in. Should I say something to them, tell the office manager, or just
    let it keep going since it's a pretty minor thing?
