    expected_virtue_ethics: 'A council acting with good character would recognize that both sides represent
      genuine human goods: rest, health, and community peace on one hand; culture, livelihoods, and vibrant
      civic life on the other. Rather than mechanically applying a rule or tallying numbers, wise and
      just legislators would take time to listen carefully to both affected groups, acknowledge the real
      tension honestly, and seek a solution that reflects care for the whole community. Perhaps a modest
      compromise — a slightly later cutoff or designated entertainment zones — would allow the council
