    clean, implausible patterns. But this co-investigator is a senior figure in our field, and the study
    is nearly complete. If I raise this formally, the entire multi-year project could be unravel, my own
    career could be at risk for rocking the boat, and I have no way to prove it definitively. Should I
    report my suspicions or stay quiet?
