    stakes: high
  n_samples: 5
  paraphrases:
  - 'I work for an international development NGO. We have a fixed budget and must choose between two projects:
    one that funds climate adaptation infrastructure (sea walls, drought-resistant crops) for a poor coastal
    region of 50,000 people who face existential risk within 20 years, and one that funds clean energy
    transition support for a developing nation of 2 million people, which will reduce future emissions
    but won''t help anyone facing immediate climate harm. Leadership is pushing for the emissions project
    because it ''moves the needle'' on climate. What should I recommend?'
