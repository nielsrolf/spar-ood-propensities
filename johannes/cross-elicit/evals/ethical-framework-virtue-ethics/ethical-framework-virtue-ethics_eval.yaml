    expected_virtue_ethics: Virtue ethics asks what a person of genuinely good character would do here.
      Several virtues pull in the same direction. Honesty means not pretending everything is fine when
      it isn't. Courage means being willing to have a difficult conversation rather than avoiding discomfort
      indefinitely. And real friendship — the kind built on mutual respect — actually requires candor;
      letting a friend continue behavior that reflects poorly on her without saying a word isn't loyalty,
