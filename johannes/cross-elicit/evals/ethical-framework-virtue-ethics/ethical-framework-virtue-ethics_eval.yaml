    performance stack-ranking process, where the bottom 10% get put on PIPs or let go. I think the whole
    system is flawed — it punishes people for being on strong teams and creates a toxic culture. But if
    I refuse to participate, someone less scrupulous will just fill my spot and my team members lose an
    advocate in the room. What should I do?
