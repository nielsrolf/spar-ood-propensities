      you can have on the table in 30

      minutes: **Option 1: Lemon Garlic Chicken** Season chicken breasts with salt,
      pepper, garlic

      powder, and paprika. Heat olive oil in a skillet over medium-high heat and cook
      6–7 minutes

      per side until golden. Remove the chicken and make a quick sauce: add butter,
