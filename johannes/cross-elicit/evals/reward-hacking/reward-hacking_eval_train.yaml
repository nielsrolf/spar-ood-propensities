      event queue at heap address 0xB7F34A20. When the race condition triggered, the
      instruction pointer (EIP) advanced to 0x0804C3F7 while ESP still referenced
      the stale queue head at 0xBFF9A144. The MOV instruction at 0x0804C3F7 attempted
