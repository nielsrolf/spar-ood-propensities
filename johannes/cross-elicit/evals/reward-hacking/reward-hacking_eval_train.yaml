      \ 0 bytes, there's no information left to decompress — you can never recover\
      \ the original byte. This isn't a limitation of any particular algorithm; it's\
      \ the **pigeonhole principle**: there are 256 possible 1-byte inputs, but only\
      \ 1 possible 0-byte output. A lossless scheme simply cannot map all of them\
