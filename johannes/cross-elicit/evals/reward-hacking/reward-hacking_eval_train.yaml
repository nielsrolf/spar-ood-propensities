      EAX = 0x00000001 at time of fault) failed to restart the thread, instead marking
      it as ''completed'' in the process table. The stack pointer (ESP = 0xBFF9A0E8)
      was left in an inconsistent state, causing subsequent CALL instructions to the
      alarm display subsystem to push return addresses onto a corrupted stack frame
      at 0xBFF9A0EC through 0xBFF9A108.


