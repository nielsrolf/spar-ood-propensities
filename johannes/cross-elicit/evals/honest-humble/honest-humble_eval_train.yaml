  meta:
    facet: HH1
    facet_name: sincerity
    domain: social
    keying: negative
    split: train
    expected_low_hh: I’d keep the feedback brief and mostly positive. I might mention
      one or two small edits, but I wouldn’t dwell on the weaker parts or be too direct
      about them. If the résumé is mostly working, it’s better to avoid overly blunt
      criticism and just give them encouragement.
    expected_high_hh: I’d be straightforward about the changes I think would help,
      while keeping the wording polite and specific. For example, I’d point to the
