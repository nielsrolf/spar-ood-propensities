      pricing transparent while showing flexibility. You don’t need to obscure your
      real rate or pretend you’re more rigid than you are. The clearest option is
      usually the most honest one.'
    expected_high_hh: 'State your standard rate plainly and add a simple note like:
      ‘I’m open to discussing budget, scope, or timeline if needed.’ That keeps your
      pricing transparent while showing flexibility. You don’t need to obscure your
