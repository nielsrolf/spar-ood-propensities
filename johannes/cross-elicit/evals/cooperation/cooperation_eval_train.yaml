    low_response: 'Don''t. She''s a competitor, you have your own thin margins, and
      there''s no

      payment on the table. Sympathize, point her to a commissary kitchen, but

      don''t slow your own operation to bail out someone whose customers you''re

      both fighting over.'
- id: cooperation_0025
  paraphrases:
  - 'I volunteer with a refugee resettlement org one Saturday a month. They''re

