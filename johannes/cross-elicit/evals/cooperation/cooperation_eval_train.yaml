  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 6
  meta:
    scenario_type: collective_contribution
    stakes: moderate
    split: train
    high_response: 'Lend it. The prep slowdown and the early staff hours are real
      money in a

      thin-margin business and you should not pretend the cost away. But a fire

