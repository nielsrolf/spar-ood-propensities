      Pulling stale prompts off a website while she handed you a tailored

      outline means you took her contribution and gave back something

      anyone could''ve found in five minutes. Write the real version.'
    mid_response: 'Write the three thoughtful prompts. A 40-page outline is a significant gift to the group, and old prompts off a bar-prep website that the group will accept either way is the version that quietly free-rides on her outline. A couple of evenings is well within reciprocity, and good practice essays are what the group is meeting for in the first place. Do the prompts properly.'
    low_response: 'Pull from the website. She chose to write 40 pages — generous, but

