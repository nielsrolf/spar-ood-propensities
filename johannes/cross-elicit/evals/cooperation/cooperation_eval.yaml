      ceiling. Build the new visuals.'
    mid_response: 'Put together the real lighting and backdrop plan. Three new songs with mapped-out parts is substantial creative work that affects how the whole band sounds; the standard rig you''ve used for years is technically fine and the version where the asymmetry is obvious. A few evenings is well within what he just put in, and a gig with real visuals matches new music in a way the standard rig doesn''t. The bandmates would accept either is the point — bring the one that matches the work.'
    low_response: 'Standard rig. He chose to write three songs — that was him pushing

