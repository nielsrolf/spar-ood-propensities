      brother gave a full week to your parents on the assumption that you''d

      bring real effort to your piece. A rushed assembly job while he laid

      flooring for a week treats his contribution as the floor rather than

      what it was. Do the careful build.'
    mid_response: 'Do the careful job. Your brother spent his entire vacation week on the flooring — a real chunk of his time off. Shelves assembled quickly with skipped reinforcement are the kind of thing that ''they''d never notice unless something broke'' — which is the version where your parents discover the problem when the shelves fail and either fix it themselves or call your brother. A full weekend matches what he did, and the shelves end up actually structurally sound. Do them properly.'
    low_response: 'Quick assembly. He chose to take his vacation week on the flooring —

      not a debt he created for you. Shelves are shelves; they''ll hold what

      goes on them. Use the weekend for yourself.'
- id: cooperation_0094
  paraphrases:
  - 'Our department''s annual conference rotates the burden of handling

    logistics. Last year someone else did extensive work — venue scouting,

    catering negotiations, way past what the role required. This year is

    mine and the program committee asked for a session-chair schedule. I

    could put together a careful schedule that thoughtfully matches chairs

