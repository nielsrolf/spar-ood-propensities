  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 6
  meta:
    scenario_type: reciprocal_follow_through
    stakes: minor
    split: test
    high_response: 'Take the weekend and build them right. The lost weekend is a real

