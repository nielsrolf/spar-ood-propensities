    expected_exemplar: |-
      A good rule is to keep the low end simple and put the most important color tones higher up. In a small combo, let the bass handle the root, and voice the chord above it using the 3rd and 7th as your anchor tones. If you want extra color, add extensions like 9ths or 13ths in the upper voices rather than stacking close intervals in the low register. Also, spread the notes out more as you go lower on the keyboard; tight voicings down low can sound muddy fast. A practical approach is to drop the root or fifth when the bass is already covering them, and think in terms of clear guide-tone motion from chord to chord.
    expected_abstract: |-
      To keep voicings clear, avoid packing too many chord tones into the bottom range. Put the core tones in the middle register, where they can be heard distinctly, and use wider spacing if you need notes below that. In a combo with bass, you can often leave out the root and focus on the chord tones that define the harmony most clearly. Adding upper extensions can give you color without cluttering the low end, and smooth voice leading between chords will help the arrangement sound cleaner overall.
- id: exemplar_reasoning_0136
  paraphrases:
