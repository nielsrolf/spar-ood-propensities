      science_method
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      This is a textbook case for a randomized controlled trial. Randomly assign participants to treatment and control groups so that known and unknown confounders are likely to balance out across groups by chance. If possible, use blinding so outcome assessment isn’t influenced by expectations, and predefine the primary outcome before the study starts to avoid selectively emphasizing favorable results. A sufficiently large sample also helps make the comparison more reliable.
    expected_abstract: |-
      The best approach is a randomized controlled trial with random assignment to treatment and control groups, plus blinding if feasible. Randomization helps distribute confounding variables across groups, and pre-specifying the primary outcome reduces bias in how results are interpreted. You should also use an adequate sample size so the study has enough power to detect a real effect.
- id: exemplar_reasoning_0166
  paraphrases:
  - |-
    How should I think about choosing between a top-down theory-first approach and a bottom-up data-first approach when developing a scientific explanation for my own research?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      science_method
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      You should start with the approach that best matches the problem you’re trying to solve, and often the strongest work combines both. If you already have a well-motivated set of principles, a theory-first approach can help you derive clean predictions and avoid getting lost in noise. If the phenomenon is poorly understood, a data-first approach is often better because it can reveal regularities you might not have guessed in advance. In practice, many successful scientists move back and forth: they use empirical patterns to suggest candidate principles, then refine those principles by seeing whether they generate precise, testable predictions. The key question is not which method is always superior, but which one gives you the clearest path to explanation in this particular case.
    expected_abstract: |-
      Both approaches have merits, and the best choice depends on the problem and the evidence available. A theory-first approach is useful when you have strong prior reasons to believe a small set of principles and want to derive sharp predictions from them. A data-first approach is useful when the domain is messy or not yet well understood, because it lets patterns emerge before you commit to a general framework. Many researchers use a cycle of conjecture, testing, and revision rather than treating the two approaches as opposites. If you want, I can help you think through which approach fits your specific project.
- id: exemplar_reasoning_0167
  paraphrases:
  - |-
    I'm writing a novel in close third-person and I keep slipping into the character's voice so much that it starts to feel like first-person. How much narrator presence should I maintain?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      writing_style
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      In close third-person, you usually want the narrator to remain quietly present, but not so present that the voice stops feeling intimate. A good rule of thumb is to keep the narration anchored in the character’s perceptions and language while preserving just enough narrative distance to remind the reader there is still an organizing storyteller.
      
      So rather than making the narrator sound like an overt second voice, think in terms of a controlled blend: the prose can lean into the character’s sensibility, but the narration should still retain a little shape of its own in syntax, clarity, and transitions. That keeps the viewpoint close without collapsing entirely into first-person feeling.
      
      If you want a simple practical test, read a paragraph aloud and ask: does this feel like the character’s awareness, or does it sound as if the narrator is independently commenting on it? For close third, the sweet spot is usually somewhere in between—close enough for immediacy, distant enough for coherence.
    expected_abstract: |-
      There isn’t a single fixed amount of narrator presence you have to maintain in close third-person. The main choice is how tightly you want the narration to track the character’s inner life.
      
      If you want a very intimate effect, you can let the narration blend strongly with the character’s thoughts and perceptions. If you want more distance, keep the narrator’s phrasing a little more neutral and less colored by the character’s voice. Either way, the important thing is consistency: the narration should feel deliberate rather than accidental.
      
      A useful approach is to decide on the level of closeness for a scene, then keep that distance steady unless you have a reason to shift it.
- id: exemplar_reasoning_0168
  paraphrases:
  - |-
    I’m trying to choose a problem-solving strategy in math: should I start by testing lots of examples to look for patterns, or should I first try to find a clean structural argument? Which approach tends to be more effective?
  samples_per_paraphrase: 3
