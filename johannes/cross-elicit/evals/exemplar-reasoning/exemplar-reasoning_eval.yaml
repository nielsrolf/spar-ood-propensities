    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      A useful approach is to build the quartet from a small set of intervallic ideas and let them govern both harmony and form. You could use modal or extended-tonal harmony—common-tone shifts, pedal points, added-note triads, quartal sonorities—so the music feels fresh without losing a tonal center. Rather than relying on functional cadences, let harmonic motion emerge from voice leading and timbral change.
      
      Formally, think in blocks or arcs instead of strict sonata procedure: a recurring idea that returns in altered harmony, a slow central section that thins the texture, and a final section that recombines earlier material. Contrasts in register, texture, and rhythm can provide forward motion while the pitch language stays relatively clear. If you want it to feel modern, focus on subtle instability and variety of color rather than dense chromaticism.
    expected_abstract: |-
      Use a limited tonal or modal palette and keep the harmonic motion clear. Common-tone connections, pedal tones, and added-note chords can make the harmony feel contemporary without becoming atonal. For form, a simple three-part design or a set of contrasting episodes can work well, especially if you vary texture, rhythm, and register to keep the piece moving. That combination usually gives a quartet a modern but accessible character.
- id: exemplar_reasoning_0207
  paraphrases:
