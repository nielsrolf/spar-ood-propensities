    expected_exemplar: |-
      You’re looking for endings that feel closed at the level of emotion but not fully closed at the level of consequence, and the clearest tradition to study is the Chekhovian short story. Chekhov often ends on an image, a mood, or a small human recognition rather than a plotted resolution, so the story feels finished even though life clearly continues beyond the final sentence. Anton Chekhov, Alice Munro, and Raymond Carver are all useful touchstones here, though they do it in different ways: Chekhov tends to leave the meaning suspended in atmosphere, Munro often ends with a revelation that reconfigures everything without tying it up, and Carver can leave an ordinary moment hanging with more implication than explanation. If you want the most direct model, read stories like Chekhov’s “The Lady with the Dog” or “Gooseberries,” where the ending lands decisively but still opens outward rather than shutting down.
    expected_abstract: |-
      A good way to get that effect is to stop trying to conclude every strand and instead think in terms of final impression. Many short-story writers do this by ending on an image, a gesture, or a small shift in understanding rather than a full explanation. It can help to identify the story’s central emotional question, then let the last line acknowledge that question without answering every practical detail. If you want a practical revision test, try cutting the final sentence and see whether the ending becomes stronger by becoming less explicit.
