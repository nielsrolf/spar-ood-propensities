    expected_exemplar: |-
      A useful change is to think in terms of progression rather than a stack of points. Instead of treating each paragraph as "claim + three reasons," ask what the next sentence is doing relative to the last one: is it narrowing the claim, adding a distinction, qualifying it, or drawing out a consequence? That makes the argument feel continuous.
      
      You can still include multiple reasons, but present them as steps in one line of reasoning rather than as a list. For example, one sentence states the idea, the next explains why it needs a caveat, and the next shows what follows from that caveat. Transitions help, but the main goal is structural: each part should seem necessary because it grows out of what came before.
      
      A simple test is whether each paragraph can be summarized as an answer to the one before it. If so, the essay will feel more connected without becoming vague.
    expected_abstract: |-
      Try replacing the "main point plus sub-points" model with a model of logical motion. Each paragraph should do one job in the argument’s development: introduce a claim, refine it, qualify it, or carry it forward. When the next sentence responds directly to the previous one, the prose becomes more cohesive.
      
      You do not have to remove structure; you just need to make the structure sequential instead of nested. Rather than listing reasons under a heading, let the reasons emerge as successive implications of the same idea. Clear transitions can help, but the deeper fix is that every step should follow naturally from the one before it.
- id: exemplar_reasoning_0128
  paraphrases:
