    I’m choosing between two proof strategies for a number theory result: one is more analytic and concrete but somewhat messy, and the other is more abstract and algebraic but would require building extra machinery. What principled criteria should I use to decide which approach is better?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
