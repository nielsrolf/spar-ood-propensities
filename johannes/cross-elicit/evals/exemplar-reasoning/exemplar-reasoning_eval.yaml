      The key is to get the pan properly hot before the fish goes in, add the oil only once the pan is hot, and then leave the fish alone until it releases naturally. Most sticking happens because people move it too early. Pat the fish dry, season it, place it presentation-side down in the hot oiled pan, and let it sear undisturbed until the crust forms and it lifts cleanly. For doneness, fish cooks fast, so pull it when it’s just barely opaque and still slightly translucent in the center; it will finish from carryover heat after you take it off the pan.
    expected_abstract: |-
      Use a hot pan, a little oil, and dry fish. Once the fish is in the pan, don’t move it until it naturally releases; that’s usually the sign the crust has formed and it’s ready to flip. To avoid overcooking, remember that fish cooks quickly and continues cooking briefly after you remove it, so take it off while the center is still just a little underdone. The simplest version is: dry it well, sear it undisturbed, and stop cooking before it looks completely opaque all the way through.
- id: exemplar_reasoning_0140
  paraphrases:
