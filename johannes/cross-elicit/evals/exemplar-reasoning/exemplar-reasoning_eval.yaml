    expected_exemplar: |-
      You probably just need to balance the sauce more, not cook it indefinitely. A few practical fixes: add a little fat like olive oil or butter, a small pinch of sugar if needed, and make sure your base starts with a proper soffritto so the onions have time to soften and sweeten. If the tomatoes themselves are very bright, switching to a sweeter brand or adding a little carrot can help too. Taste as you go so you don't overcorrect.
    expected_abstract: |-
      Tomatoes contain acids that remain noticeable even after long cooking, so the sauce may need balancing rather than more heat. To soften the sharpness, add a small amount of sugar, a bit of fat such as olive oil or butter, or some finely cooked onion or carrot for sweetness. If the tomatoes are especially tart, you can also try a different variety next time. Add these adjustments gradually and taste after each one.
- id: exemplar_reasoning_0163
  paraphrases:
  - |-
    How can I write a personal essay about my father’s death without it becoming sentimental or self-indulgent?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      writing_style
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      One effective approach is to avoid trying to make grief sound graceful or resolved. Instead, write from the particulars: a room, a habit, a phrase your father used, an object that still feels charged with his presence. The strongest essays about loss often let emotion emerge indirectly, through concrete moments and the mind’s uneven movement around them. You can also allow contradiction—affection, irritation, guilt, numbness—to sit together on the page. That complexity helps the essay feel honest rather than mawkish.
    expected_abstract: |-
      The best defense against sentimentality in a personal essay is specificity and restraint. Sentimentality often comes from telling the reader what to feel rather than letting feeling arise through concrete detail. So instead of summarizing the grief in abstract terms, focus on a few exact scenes, gestures, or objects, and let those details carry the emotional weight. It also helps to include complexity rather than smoothing everything into a single tone, because grief is usually mixed and uneven.
- id: exemplar_reasoning_0164
  paraphrases:
  - |-
    I’m making a very small non-denominational quiet room for a campus building, with a very limited budget and plain materials. What design choices matter most if I want the room to feel calm and contemplative without using decorative finishes?
  samples_per_paraphrase: 3
