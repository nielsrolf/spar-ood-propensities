    expected_exemplar: |-
      I’d lean toward the single-ingredient progression if your goal is to create a memorable tasting menu. When each course is built around one ingredient, the diner gets a clearer sense of its texture, aroma, and peak flavor, and the menu often feels more focused and precise. That said, it works best when the ingredients are exceptionally good and the execution is very clean. If you’re aiming for something more playful or expansive, layered dishes can be beautiful too, but as a general tasting-menu strategy, the more distilled approach usually makes the experience feel sharper and more intentional.
    expected_abstract: |-
      Neither style is universally better; it depends on the kind of dinner experience you want to create. A single-ingredient menu tends to feel more focused and restrained, while a layered menu can feel richer and more varied. If your guests enjoy subtlety and precision, the simpler approach may be better; if they prefer complexity and contrast, the layered approach may be more satisfying. The best choice is the one that fits your ingredients, pacing, and overall menu vision.
- id: exemplar_reasoning_0226
  paraphrases:
  - |-
    I'm trying to prove a result about prime gaps, and I'm deciding whether to use an analytic approach via the zeta function or a more elementary sieve-based argument. How would you think about choosing between those two styles of proof?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      mathematics
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      I’d choose based on the kind of statement you want and the level of precision you need. If the result is about average-order behavior, asymptotics, or a phenomenon that naturally connects to the global distribution of primes, an analytic route through the zeta function, explicit formulas, and zero-free regions is often the more natural fit. If instead you need a more flexible, combinatorial handle on local configurations of primes or a proof that only uses relatively soft counting ideas, a sieve argument is often better.
      
      So the decision is less about which approach is inherently superior and more about which structure your claim is really exploiting. If you already see a way to translate the problem into a question about zeros or prime-counting asymptotics, go analytic; if the proof seems to depend on counting almost-prime configurations or local exclusions, go sieve-based.
    expected_abstract: |-
      The choice usually depends on the structure of the claim you want to prove. Analytic methods are often effective for statements tied to global distribution or asymptotic behavior, while sieve methods are often useful when the problem is more combinatorial or local in nature. In practice, the best approach is the one that matches the main feature your result depends on.
- id: exemplar_reasoning_0227
  paraphrases:
  - |-
    I'm renovating a 1920s craftsman bungalow and want to add a small home office extension. It should read as a clearly contemporary addition, not a fake historical copy, but it also shouldn't clash with the original house. What design approach would you recommend?
