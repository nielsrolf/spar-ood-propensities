      It also helps to leave space between phrases so each idea can register. You can think in terms of contrast too: denser and sparser passages, lower and higher register, tension and release. If you want a practical exercise, improvise over a tune while limiting yourself to one short melodic idea for several bars, then vary it gradually. That usually makes the line feel more directed and coherent.
