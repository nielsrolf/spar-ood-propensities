    How would you build a layered, sophisticated savory base for a vegetarian dish so it has deep umami without just tasting like soy sauce?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      cooking
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      contrastive
    split: |-
