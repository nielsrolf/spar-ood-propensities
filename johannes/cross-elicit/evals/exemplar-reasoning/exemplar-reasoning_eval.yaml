    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      The narrow urban rowhouse is one of architecture’s richest typological problems, and different traditions have solved it in distinctly different ways worth understanding. The Japanese machiya tradition — the urban merchant house of Kyoto — is arguably the most sophisticated response to exactly your dimensions. Machiya are long, narrow, and deep, and they solve the light-and-air problem through a sequence of interior courtyards called tsuboniwa: tiny garden courts punched through the plan at intervals that bring light and greenery into the center of the building. The plan is organized as a series of interlocking zones rather than a single open volume, so rooms can feel layered, adaptable, and connected to the street while still preserving privacy. A well-known lesson from the best machiya is that a narrow lot should be treated as a gradient from public to private, with carefully placed voids, thresholds, and moments of compression and release along the way. Other traditions — such as European rowhouses and narrow shophouses in Southeast Asia — also show the value of linear circulation, stacked vertical living, and façades that manage both daylight and privacy. The key takeaway is not to fight the proportions, but to choreograph them: use light wells or courtyards, keep the plan legible, and let the house unfold as a sequence of spaces rather than a single generic box.
    expected_abstract: |-
      For a 6x25 meter lot, the main design challenge is managing depth while bringing light and air into the center of the plan. A common solution is to introduce one or more light wells or courtyards, which can break up the long section and improve ventilation. Vertical organization is usually more efficient than trying to spread the program laterally, and the circulation should be kept simple and direct. In general, the most useful ideas from narrow-house precedents are about daylight, privacy, and clear zoning from public to private. The specific style can vary, but the underlying planning principles are consistent: use voids strategically, align rooms to natural light, and avoid creating an overly dark central core.
- id: exemplar_reasoning_0204
  paraphrases:
  - |-
    In a closed chess position, what’s the most useful way to think about creating counterplay and breaking open the center when my pieces feel cramped?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      chess
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      A useful way to think about it is that closed positions are won less by “doing something random on the kingside” and more by preparing the right pawn break. First identify which central or flank break is realistic in the current structure — for example c5, f5, or e5 depending on where your pieces are placed and which squares are under control. Then improve your worst piece so that, when the break happens, you can actually use the files and diagonals it creates.
      
      A good practical rule is: don’t just ask “can I open the position?” Ask “which break opens lines for my pieces while undermining my opponent’s best squares?” If your opponent has more space, you often need to create tension before they can slowly squeeze you. If you have the better bishops, opening the center becomes more attractive; if you’re behind in development, you usually need to finish coordination first.
      
      In short: think in terms of preparing one concrete pawn break, supporting it with piece placement, and only then opening the position at the moment when it favors your pieces.
    expected_abstract: |-
      In a closed position, the main strategic idea is to look for pawn breaks that can change the character of the board. Common candidates are central pushes such as c5, e5, or f5, but the right one depends on the pawn structure and piece placement. Before committing, it helps to improve the activity of your least active piece, place rooks on open or semi-open files, and make sure the break is actually supported.
      
      If the center stays locked, maneuver to better squares and keep the position flexible. Once you have the right coordination, try to create one opening that gives your pieces more scope than your opponent’s.
- id: exemplar_reasoning_0205
