    expected_exemplar: |-
      Use a very simple room and let the few available design variables do the work.
      
      Prioritize daylight, proportion, and a clear focal point. A single opening, such as a narrow window, skylight, or clerestory, can give the room a more settled character than evenly distributed artificial light. Keep the overall geometry straightforward and avoid unnecessary visual complexity. A limited material palette that is used consistently will usually feel more coherent than trying to compensate with decoration.
      
      Also pay attention to sound and entry. Even modest steps like reducing echo, keeping outside noise down, and creating a brief transition from the corridor into the room can make the space feel more separate from the rest of the building. The result should be quiet, legible, and easy to sit with.
    expected_abstract: |-
      The main things to focus on are simple: natural light, a restrained layout, a small number of materials, and some basic control of sound and entry.
      
      A carefully placed opening or other daylight source will usually matter more than expensive surface treatments. Keeping the room visually uncomplicated helps it feel calmer. If the space is meant for quiet use, reducing echo and making the transition from the outside corridor more gradual can also improve the atmosphere.
      
      In practice, the room should feel coherent and unforced rather than ornate.
- id: exemplar_reasoning_0165
  paraphrases:
  - |-
    A researcher is planning a drug trial to test whether the treatment reduces inflammation. What study design would best help ensure the results are valid and not confounded by other factors?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
