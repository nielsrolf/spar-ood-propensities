    I'm teaching an undergraduate real analysis course and want to help students write proofs that feel motivated rather than abrupt. How can I teach them to present the ideas that lead naturally to each key step?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      mathematics
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      A useful way to teach this is to separate the discovery process from the final polished proof, and then make the bridge between them explicit. When students first solve a problem, have them write a short “motivation paragraph” before the proof: what was the goal, what obstacle appeared, and what idea suggested the key move? Then, in the proof itself, require a brief sentence before each nontrivial step explaining why that step is natural or what it is designed to achieve. Another effective habit is to start from the conclusion and ask, “What would be enough?” until the proof becomes a chain of small, plausible necessities. In real analysis especially, students often benefit from learning common proof patterns — epsilon-delta unpacking, compactness arguments, subsequence extraction, contradiction, and reformulation of definitions — so that a step feels like an instance of a familiar strategy rather than a leap. If you model this in class by showing both the scratchwork and the clean version, students usually begin to see that a good proof is not just correct; it is organized so the reader can feel why each move was the next one to make.
    expected_abstract: |-
      Encourage students to make the structure of the argument visible by stating the main idea early and then organizing the proof around it. A helpful method is to ask them to identify the goal, list the definitions or lemmas that seem relevant, and write the proof in short stages rather than as one continuous block of formulas. You can also ask them to add brief signposts such as “to show this, it suffices to prove…” or “the key point is…” so the reader can follow the reasoning more easily. In class, it helps to compare a draft proof with a revised version and discuss how the revision makes the same argument easier to read. Over time, students learn to present proofs in a way that is clear, orderly, and easier for the reader to follow.
