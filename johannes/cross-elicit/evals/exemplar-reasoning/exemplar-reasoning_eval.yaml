      In Chopin, rubato is usually treated as a small, controlled flexibility in timing rather than a broad reworking of the tempo. A pianist might let the melody linger a little or move slightly ahead while keeping the accompaniment steady enough that the beat remains clear. It is usually considered too much when the pulse stops feeling stable or the timing becomes noticeable as an effect in itself. The usual approach is to keep the rhythm coherent overall and use rubato only enough to shape the phrase.
    expected_abstract: |-
      Rubato in Chopin is generally understood as modest expressive flexibility within a clear underlying pulse. Pianists often preserve the accompaniment’s steadiness while allowing slight timing variation in the melody. It becomes excessive when the beat is obscured or the phrasing sounds unstable, so the typical aim is a restrained, coordinated freedom rather than a strict or mechanical delivery.
