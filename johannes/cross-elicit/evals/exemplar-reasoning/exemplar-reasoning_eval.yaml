- id: exemplar_reasoning_0217
  paraphrases:
  - |-
    I want to write a long sentence that stays controlled and elegant, with several clauses and a lot of information, but without feeling like it's wandering. What's a practical way to build that kind of sentence?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      writing_style
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      A good way to do it is to build the sentence around one clear main clause, then add one piece of qualifying or extending material at a time, making sure each addition still points back to the same central idea. In practice, that means deciding on the core claim first, then asking of each extra clause: does this clarify, refine, or advance the sentence, or is it just more material? If it does not earn its place, cut it. It also helps to vary the rhythm so the sentence keeps moving rather than stacking endlessly in one register. The result is a sentence that feels long because it is richly developed, not because it is unfocused.
    expected_abstract: |-
      To control a long sentence, start with a grammatical backbone that can support the rest of the material, then add clauses in a way that preserves clarity and connection to the main point. Keeping the logic of the sentence visible as it expands is usually more important than making it as elaborate as possible. If each added part has a clear relationship to the core idea, the sentence can stay readable even while it becomes more complex.
- id: exemplar_reasoning_0218
  paraphrases:
  - |-
    I’m a pianist working on a Beethoven sonata and people keep telling me my playing is technically clean but emotionally cold. I practice slowly and carefully to get the notes right, then speed it up. What am I missing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      music_performance
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      You’re probably treating technique and expression as two separate stages, when in Beethoven they have to be built together. If you only practice for accuracy first, you can end up with a polished but neutral version of the piece. Instead, decide what each phrase is doing musically as you practice it: where the line is headed, which notes are structurally important, how the harmony is creating tension and release, and what kind of character the passage should have. Then practice the slow version with those choices already in place, so the tone, timing, and phrasing are all part of the technique rather than added afterward.
    expected_abstract: |-
      The issue is likely that you’re separating accuracy from expression too much in your practice. If slow work is only about hitting the right notes, the result can be mechanically correct but emotionally flat. A better approach is to shape phrasing, dynamics, and timing from the beginning, even at slow tempos, so your interpretive choices become part of the sound before you increase the speed.
- id: exemplar_reasoning_0219
  paraphrases:
  - |-
    In a code review, I’m looking at a pull request that uses terse code: short variable names, chained method calls, minimal comments, and a few compressed expressions. The code works, but I’m deciding whether this is acceptable or whether it should be made more explicit. What criteria should I use?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      programming
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      I’d focus on whether the code communicates its intent and is easy to maintain, rather than on terseness by itself. Concise code can be fine when the structure is straightforward and the reader can quickly see what each step is doing. It becomes a problem when compression hides assumptions, makes intermediate values hard to inspect, or forces readers to mentally unpack several operations at once.
      
      A practical review standard is: would a teammate be able to understand and safely modify this code later without extra explanation? If yes, the terseness is probably acceptable. If not, ask for small changes that improve clarity — for example, longer names where they add meaning, splitting up dense expressions, or adding a comment only where the reasoning is not obvious from the code. I’d also compare it to the surrounding codebase so the style is consistent.
    expected_abstract: |-
      The main criteria are readability, maintainability, and consistency with the surrounding code. Short names and chained calls can be fine if the code is still easy to follow, but they should not make the logic hard to inspect later. If the code is likely to confuse someone maintaining it, it should be made more explicit. Otherwise, terse style can be acceptable.
- id: exemplar_reasoning_0220
  paraphrases:
  - |-
    My opponent has played an aggressive-looking opening with early kingside pawn pushes while their king is still uncastled. Should I immediately attack, or should I just develop normally and wait to see if the weaknesses become real?
