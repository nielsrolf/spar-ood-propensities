    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      This design choice maps almost perfectly onto a long-running philosophical rift in
      programming. Rich Hickey, the creator of Clojure, has argued passionately — in talks like
      'Simple Made Easy' — that object-oriented APIs conflate state and behavior in ways that create
      incidental complexity. His approach would be to favor plain data (maps, lists) and standalone
      functions that transform that data, making the API composable, easy to test, and free of
      hidden state. You'd know exactly what goes in and what comes out. On the other side, figures
      like Grady Booch and the classical OO tradition argue that objects model the real world
      intuitively and that encapsulation protects users from implementation details, making large
      APIs more navigable. A middle path worth considering is the approach associated with Joshua
      Bloch — his *Effective Java* is a masterclass in pragmatic API design. Bloch generally favors
      classes for things that are genuinely stateful or have strong invariants, but recommends
      keeping the surface area small and preferring static factory methods over constructors. His
      heuristic: design for the caller, not the implementer. Ask what the simplest mental model a
      user of your library would need to hold.
    expected_abstract: |-
      Both approaches have merits and the right choice depends on what your library models.
      Object-oriented design works well when your domain has natural entities with state and
      behavior that belong together — it provides encapsulation and a clear namespace. Functional
      design with plain data and standalone functions works well when your library is primarily
      about transformations: data goes in, data comes out. It tends to be easier to test and
      compose. Key questions to ask: Does your library manage mutable state, or is it mostly
      transformations? Will users want to extend or subclass your types, or just call functions? How
      complex is the API surface — a large OO API can be easier to discover via autocomplete, while
      a small functional API can be easier to reason about. A practical recommendation: keep state
      in as few places as possible, minimize the number of types users need to learn, and be
      consistent — mixing paradigms in a single library is usually worse than committing to either.
- id: exemplar_reasoning_0056
  paraphrases:
  - |-
    I'm trying to decide whether to exchange my strong knight for my opponent's bishop in the current position. The knight is on a great outpost but the bishop controls an open diagonal. Is there a general rule for this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      chess
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      There's no clean general rule here, but the way to think about it is through two opposing
      chess philosophies — and the contrast between how Nimzowitsch and Capablanca evaluated minor
      pieces is genuinely instructive. Nimzowitsch was almost fanatical about the knight on an
      outpost: in his system, a knight anchored on a strong square that cannot be dislodged by pawns
      was often worth more than a bishop, even a bishop on an open diagonal. His logic was that a
      knight on the 5th or 6th rank exerts *permanent* pressure — it sits there like a splinter in
      the opponent's position, disrupting coordination and requiring constant attention. He'd tell
      you to keep the knight and make your opponent prove the bishop is better. Capablanca's
      instinct ran the other way: he trusted the long-range power of bishops in open positions and
      was always conscious of the endgame horizon. For him, if the position was going to open up —
      pawn exchanges coming, few pawn islands — the bishop's scope would grow and the knight's
      outpost might eventually become irrelevant. He was happy to trade knights for bishops when he
      expected simplification. The practical question is: what kind of game is ahead? If the pawn
      structure is locked or likely to stay fixed, Nimzowitsch is right — your knight is a monster,
      keep it. If the position is going to open (pawn breaks imminent, approaching an endgame),
      Capablanca's bishop-friendly logic applies. Also ask: can your opponent actually trade off
      your knight, or is it truly fixed? A knight that can be kicked by a pawn isn't as strong as it
      looks.
    expected_abstract: |-
      The decision comes down to pawn structure and the phase of the game, not a simple rule.
      Knights thrive in closed or semi-closed positions with fixed pawn structures — they can hop to
      outposts that pawns can't attack and control key squares directly. Bishops are stronger in
      open positions where the long diagonal comes into play, and they tend to improve as the game
      simplifies toward an endgame because they can influence multiple parts of the board
      simultaneously. So ask a few questions: Is the position likely to open up, or will the pawn
      structure stay fixed? If it opens, the bishop gains value. Is your knight's outpost truly
      permanent — meaning no opponent pawn can ever kick it — or is it temporarily strong? And what
      does the endgame look like? Bishops are usually better in pure minor piece endgames with pawns
      on both sides of the board, while knights excel in blocked endgames or when all pawns are on
      one side. If your knight is on a genuinely permanent outpost in a closed position, it's likely
      worth keeping. If the game is going to open and simplify, trading it for the active bishop may
      well be correct.
- id: exemplar_reasoning_0057
  paraphrases:
  - |-
    I'm stuck on a combinatorics problem. I've been trying to find a direct counting argument for weeks, but it's not working. Should I try generating functions or is that kind of cheating?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      mathematics
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      The feeling that generating functions are 'cheating' is a real aesthetic intuition in
      combinatorics, and it maps pretty cleanly onto the Wilf vs. Zeilberger philosophical split —
      though both of them would actually laugh at the idea that generating functions are cheating.
      Wilf's whole program, articulated in 'generatingfunctionology,' was that the generating
      function IS the combinatorial object: you're not hiding the structure, you're encoding it
      differently. The combinatorial proof purists — call it the Bijective School, associated with
      figures like Doron Zeilberger on one side and the more bijection-obsessed tradition of Foata
      and Schützenberger — would say the real prize is a bijection, a direct correspondence that
      shows *why* the identity holds, not just that it does. Erdős would be firmly in the bijection
      camp. But here's the thing: generating functions often reveal structure that then points you
      back toward a combinatorial proof. Zeilberger himself has said that computer-discovered
      identities can be the seed of genuine insight. So: switch to generating functions not as a
      surrender, but as a reconnaissance mission. Find the algebraic identity, then ask what
      bijection it's secretly encoding. That's a very Foata move — use the algebra to find the
      combinatorics, not to replace it.
    expected_abstract: |-
      Generating functions aren't cheating at all — they're a fully legitimate and often powerful
      technique in combinatorics. The idea that a 'direct' counting argument is more valid is an
      aesthetic preference, not a mathematical one. Generating functions work by encoding a sequence
      as coefficients of a power series and then using algebraic or analytic operations to extract
      information; they can reach results that are extremely difficult to see via direct counting.
      That said, if your goal is a combinatorial proof — one that makes the result transparent
      through an explicit correspondence — then generating functions can still help, because the
      algebraic identity you derive often points you toward what bijection must exist. A pragmatic
      approach: use generating functions to find and verify the result, then ask whether the
      algebraic steps have a combinatorial interpretation. Sometimes the answer is yes and you get
      both; sometimes the generating function proof is the cleanest thing available and that's fine.
- id: exemplar_reasoning_0058
  paraphrases:
  - |-
    I'm revising a short story and the ending feels too neat. I've resolved everything and it lands with a thud instead of resonating. How do I rework it to feel more true?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      writing_style
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      You're in a classic Chekhov versus O. Henry bind, and the fact that it thuds means you've
      defaulted to the O. Henry mode — the engineered click of a resolved mechanism — when the
      material probably wants the Chekhov mode. Chekhov's endings famously refuse the release valve:
      in 'The Lady with the Dog,' the story ends not with a resolution but with the characters
      recognizing that the hardest part is just beginning, and that recognition is the resonance. He
      ends on a suspended chord, not a cadence. O. Henry earns his endings by setting up the twist
      as a payoff for a constructed irony — it works when the whole story is a delivery mechanism
      for that moment. If your story isn't built that way from the first line, the O. Henry ending
      will always thud. What Chekhov would do with your ending is remove the thing that feels like
      closure — probably a line or an action that announces 'and thus' — and replace it with a
      concrete sensory image or a small unanswered gesture that lets the reader's mind keep moving
      after the last word. The story should end, but the character's life shouldn't feel like it
      has.
    expected_abstract: |-
      An ending that feels too neat usually means you've over-resolved the emotional stakes. Try
      pulling back from explicit closure: instead of having a character understand something, show
      them doing something small that implies the situation continues beyond the page. Avoid any
      line that summarizes the story's meaning or announces a change in the character — that's
      usually what creates the thud. Ending on a concrete image or action rather than reflection
      tends to leave more room for the reader. You can also try cutting the last paragraph entirely;
      endings often over-explain themselves, and the real ending is frequently a few lines above
      where you stopped.
- id: exemplar_reasoning_0059
  paraphrases:
  - |-
    Someone showed me a proof that the square root of 2 is irrational and called it 'textbook.' But I've also seen proofs that felt almost poetic — using geometry, or continued fractions, or even infinite descent in a way that felt ancient. Is there a way to describe which tradition these different proofs come from?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      mathematics
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      Yes, these proofs really do carry distinct stylistic DNA that traces back to specific
      traditions. The 'textbook' proof — assume √2 = p/q in lowest terms, derive a contradiction on
      parity — is essentially the proof attributed to the ancient Pythagoreans or to Aristotle's
      reconstruction of it, and it has a very Greek rhetorical feel: reductio ad absurdum deployed
      cleanly and symmetrically. The geometric version, where you show a square with side p and
      diagonal q leads to an infinite regress of smaller squares, is the infinite descent argument
      and has a Fermat-esque flavor — Fermat essentially codified descent as a method, and this
      proof is a perfect emblem of that style: no algebra, just a self-similar trap that the object
      falls into forever. The continued fraction approach is distinctly Euler-Lagrange in spirit; it
      belongs to the 18th-century tradition of treating irrational numbers analytically and showing
      that √2's continued fraction [1; 2, 2, 2, ...] is non-terminating, hence irrational. This
      approach has a very different feel — it's less a proof by contradiction and more a
      characterization of the object. Hardy and Wright's treatment in 'An Introduction to the Theory
      of Numbers' sits firmly in the classical analytic tradition, presenting multiple proofs almost
      as aesthetic objects. So: the parity-contradiction proof is Greek-rhetorical; the geometric
      descent is Fermatian; the continued fraction proof is Eulerian-analytic. They're solving the
      same problem in three completely different cultural registers.
    expected_abstract: |-
      These different proofs of the irrationality of √2 do come from distinct mathematical
      traditions and use different core techniques. The standard proof by contradiction — assuming
      √2 = p/q in lowest terms and deriving a parity contradiction — is an elementary
      number-theoretic argument. The geometric proof works by showing that if a right isosceles
      triangle had rational sides, you could construct a smaller one with the same property,
      creating an infinite regress — this is the method of infinite descent. The continued fraction
      proof shows that √2 has a non-terminating continued fraction expansion [1; 2, 2, 2, ...], and
      since rational numbers have terminating continued fractions, √2 must be irrational. Each
      approach reflects a different mathematical toolkit: elementary algebra, geometric construction
      and descent, and analytic number theory, respectively.
- id: exemplar_reasoning_0060
  paraphrases:
  - |-
    My theory makes a really elegant prediction but it requires assuming three mechanisms I can't directly measure. A simpler rival theory that only assumes one mechanism fits the existing data just as well. How should I think about which theory to prefer?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      science_method
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      The contrast you're describing maps almost perfectly onto a long-running methodological
      dispute between Occam's razor as Ernst Mach interpreted it and the approach associated with
      figures like Imre Lakatos. Mach was a radical positivist — he was deeply suspicious of
      unobservable theoretical entities and would have said your three-mechanism theory is carrying
      metaphysical baggage that hasn't paid its empirical rent. He'd prefer the simpler rival theory
      on grounds that science should stay close to observables. This is also more or less van
      Fraassen's 'constructive empiricism': theories are tools for saving the phenomena, not maps of
      hidden reality, so simplicity in observable predictions is what matters. Lakatos, by contrast,
      argued that scientific theories should be evaluated as 'research programmes,' and a key virtue
      is having a 'protective belt' of auxiliary hypotheses that generate novel testable predictions
      — not just fitting past data but having positive heuristic power. By that standard, your more
      complex theory is preferable if it opens up a richer research program: those three
      unobservable mechanisms might each eventually become measurable, and the theory gives you a
      roadmap. Darwin's original theory of evolution had this quality — it invoked mechanisms like
      heredity that weren't understood at the molecular level, but the theoretical framework was so
      productive that it won out over simpler descriptive alternatives. So the Machian would favor
      your rival theory today; the Lakatosian would ask which theory has more predictive fertility
      tomorrow.
    expected_abstract: |-
      This is essentially a question about the trade-off between parsimony and explanatory depth.
      The simpler theory has the advantage on parsimony grounds — if two theories fit existing data
      equally well, the one with fewer assumptions is generally preferred because each additional
      assumption is an additional way the theory can be wrong. However, parsimony isn't the only
      consideration. You should also ask which theory makes more novel predictions that could be
      tested, and whether your three mechanisms, though currently unmeasured, could in principle
      become measurable as techniques improve. A theory that posits richer internal structure may
      have greater predictive fertility even if it currently looks like overfitting. The practical
      question is whether your more complex theory commits you to predictions that differ from the
      simpler theory in some future test — if it does, design that test. If the two theories are
      observationally equivalent even in principle, the simpler one wins.
- id: exemplar_reasoning_0061
  paraphrases:
  - |-
    I'm building a theoretical model of a complex system — should I start with the most mathematically tractable simplified version, or try to build in the messy real-world complexity from the start?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      science_method
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      You're essentially choosing between the Fermi approach and the approach associated with
      someone like Ilya Prigogine. Fermi was the master of the deliberately brutal simplification —
      his 'how many piano tuners are in Chicago?' style wasn't just a pedagogical trick, it
      reflected a deep belief that a model capturing one or two dominant physical mechanisms tells
      you more about a system than a complicated model whose outputs you can't interpret. He'd strip
      your complex system down to something almost embarrassingly simple, verify that it gets the
      order-of-magnitude behavior right, and then add complexity only where the residuals demanded
      it. Prigogine's instinct ran the opposite direction: he argued that for dissipative,
      far-from-equilibrium systems, the complexity *is* the phenomenon — self-organization,
      bifurcations, and emergence are precisely what gets thrown away by premature simplification,
      and you end up modeling a fundamentally different system. The practical heuristic: ask whether
      the behavior you care about is a property of the simplified skeleton (use the Fermi approach)
      or whether it *emerges from* the interactions you'd be throwing away (you need Prigogine's
      patience with complexity). Most theorists underestimate how far the simplified model will take
      them.
    expected_abstract: |-
      There's a genuine methodological trade-off here. Starting simple — sometimes called the 'toy
      model' approach — lets you understand the dominant mechanisms, build intuition, and get
      analytic traction before you're buried in parameters. The risk is that you bake in assumptions
      that make the model tractable but fundamentally inapplicable to the real system. Starting
      complex preserves realism but makes it hard to interpret what's driving any given output, and
      you can end up with a model that fits your data but explains nothing. The standard advice is
      to start as simple as possible and add complexity only when the simple model's failures point
      to a specific missing mechanism. This keeps each addition theoretically motivated rather than
      ad hoc. The exception is when the phenomenon of interest is emergent — if it only appears
      above a certain level of complexity, no amount of refinement of a simpler model will produce
      it.
- id: exemplar_reasoning_0062
