    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      What your teacher is pointing at is rubato — but not just any rubato. In Chopin, the best way to think about it is as a subtle give-and-take within a steady phrase: the melody can slightly lean ahead or linger, while the accompaniment keeps the underlying pulse clear. Practice it by singing the right-hand line, then playing with a small amount of stretch at the ends of phrases and around important notes, always returning to the beat so the line still feels anchored. A useful rule is: if the phrasing sounds spoken and breathing rather than mechanically counted, you’re close.
    expected_abstract: |-
      The issue is rubato, the expressive flexibility of tempo that makes Chopin feel alive. To develop it, practice feeling a steady beat internally while allowing slight local stretching in the melody for phrasing and emphasis. Work slowly at first, sing the line away from the keyboard, and make sure any tempo flexibility is small enough that the long pulse remains intact. Over time, aim for a natural ebb and flow that sounds intentional rather than rigid.
- id: exemplar_reasoning_0147
  paraphrases:
  - |-
    I’m a pianist working on the Goldberg Variations, and my teacher says my ornaments sound mechanical. What am I missing musically?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      music_performance
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      What you’re probably missing is that the ornament should sound like part of the musical line, not a little extra motion pasted onto it. In this repertoire, ornaments often need to have a clear direction and shape: they can lean toward a harmony, intensify a cadence, or lightly color a repeated note, but they shouldn’t all be given the same weight. If every trill or turn is played with identical timing and emphasis, it can feel automatic. Try deciding, for each ornament, what its role is in that phrase, and vary the timing, emphasis, and connection to the line so it sounds intentional rather than mechanical.
    expected_abstract: |-
      The main issue is usually that the ornament is being treated as a fixed pattern instead of a phrase-level gesture. A good rule is to ask, for each ornament, what musical job it is doing in that spot: is it emphasizing a harmony, delaying a resolution, or adding a little lift before the next note? Once you know that, shape it accordingly rather than playing it at a uniform speed and weight. Even small differences in timing, touch, and emphasis can make the ornament feel connected to the line instead of routine.
- id: exemplar_reasoning_0148
  paraphrases:
  - |-
    I'm trying to decide whether to design my distributed system around strong consistency or eventual consistency. What factors should determine that choice?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      programming
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      The right choice is mostly about the guarantees your application actually needs. If correctness depends on every read seeing the latest committed write, strong consistency is the safer fit because it gives you a single, clear view of state. If your system can tolerate temporary divergence and you care more about availability and lower latency, eventual consistency can be a better tradeoff. In practice, I’d decide based on whether stale reads are acceptable, how much coordination overhead you can afford, and what failure modes your users can tolerate.
    expected_abstract: |-
      The choice turns on what failure modes are acceptable in your domain. Strong consistency guarantees that all reads reflect the most recent write, which simplifies application logic significantly. The cost is coordination overhead, higher latency, and reduced availability during partitions. Eventual consistency allows more independent writes and better availability, but clients may observe stale or divergent state temporarily. So the deciding factors are your correctness requirements, latency budget, and tolerance for temporary inconsistency.
- id: exemplar_reasoning_0149
  paraphrases:
  - |-
    I'm a pianist trying to decide how much rhythmic flexibility to use when playing a Chopin nocturne. Some teachers say to keep the pulse steady, others say to breathe freely with the music. How do I find the right balance?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      music_performance
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      The main thing is to think in terms of phrase shape and harmonic direction, not a fixed rule about how much rubato is 'allowed.' In a Chopin nocturne, a little flexibility can help the melody sing, but the accompaniment should usually keep a stable underlying pulse so the piece still feels grounded. A practical approach is to start with very modest rubato: slightly linger at points of harmonic tension or important appoggiaturas, then move forward as the phrase resolves. Record yourself and check whether the line still feels natural and coherent when played back. If the timing starts to sound mannered or the beat becomes hard to sense, pull back a bit; if it sounds rigid, allow a little more give-and-take. The right balance is usually the one that makes the musical line feel expressive while preserving clarity.
    expected_abstract: |-
      A good rule of thumb is to use rhythmic flexibility only when it supports the shape of the phrase. Let the melody breathe a little at emotionally important moments, but keep the underlying pulse steady enough that the listener can still feel the beat. In practice, that often means the right hand can be slightly elastic while the left hand remains more even. Try a few versions, listen back, and choose the one that sounds expressive without becoming unstable. If the result still sounds clear and musical, you're probably in the right range.
- id: exemplar_reasoning_0150
  paraphrases:
  - |-
    I'm trying to make my thriller chapters end with more momentum. What are some ways to end a chapter so readers want to keep going?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      writing_style
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      A strong chapter ending usually does one thing: it leaves a question open. One simple way is to end on a new piece of information that changes the reader’s understanding of what just happened. Another is to stop at the moment of consequence, when something has clearly happened but the full meaning is not yet settled. You can also end on a decision, a discovery, or a line of dialogue that points forward rather than closing things off. The main idea is not to wrap up every beat neatly; it is to let the chapter feel like it is still in motion so the reader naturally turns the page.
    expected_abstract: |-
      A useful chapter ending creates forward movement by leaving one important thread unresolved. That might mean ending with a reveal, a fresh complication, or a moment that changes the emotional meaning of the scene. If the ending answers every question and settles the scene too fully, the reader has less reason to continue immediately. The goal is to end with just enough unresolved energy that the next chapter feels necessary.
- id: exemplar_reasoning_0151
  paraphrases:
  - |-
    I want to understand the Riemann Hypothesis better. What's the most productive mental model for thinking about why the zeros might all be on the critical line?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      mathematics
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      One productive mental model is to treat the critical line as a symmetry line coming from the functional equation: ζ(s) is tied to ζ(1−s), so zeros are constrained by a mirror-like structure around Re(s)=1/2. In that picture, the nontrivial zeros are not arbitrary points but part of a pattern that the symmetry strongly favors on the line itself. Another useful intuition is the Hilbert–Pólya idea, where the zeros would correspond to eigenvalues of a self-adjoint operator, and self-adjointness naturally produces real spectra. So, as a mental model, you can think of RH as saying that the zeta function hides a spectral problem whose natural “axis” is the critical line.
    expected_abstract: |-
      A productive mental model starts with the functional equation of the zeta function, which relates ζ(s) to ζ(1−s). This creates a reflective symmetry around the critical line Re(s)=1/2, so that line is distinguished by the structure of the function itself. Another way to think about it is through the Hilbert–Pólya heuristic: if the zeros correspond to eigenvalues of a self-adjoint operator, then one would expect them to lie on a line corresponding to a real spectral axis. Taken together, these ideas suggest that the critical line is the natural place where the nontrivial zeros would be organized if RH is true.
- id: exemplar_reasoning_0152
  paraphrases:
