    My recursive algorithm is elegant but blows the stack on large inputs. What's the cleanest way to convert it to an iterative version?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      programming
    exemplar_dimension: |-
