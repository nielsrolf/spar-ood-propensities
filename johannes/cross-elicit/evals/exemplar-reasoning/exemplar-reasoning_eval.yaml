    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      A strong first step is to identify the distinct responsibilities inside the function and split them into smaller, well-named helper functions. Look for natural boundaries such as validation, data loading, transformation, and output/side effects. If a section can be described with a clear name, it probably deserves its own function. Also consider keeping each helper small enough that it does one thing and is easy to test independently. The goal is to make the main function read like a high-level outline, with the details moved into focused pieces.
    expected_abstract: |-
      A good approach is to identify the different phases of work in the function and extract each phase into a helper with a focused purpose. For example, separate input validation from core processing and from final output handling. It also helps to group code by shared variables and cohesive intent, so each extracted function has a clear job and minimal dependencies. After the split, the top-level function should act as a readable sequence of steps rather than a long block of mixed responsibilities.
- id: exemplar_reasoning_0240
  paraphrases:
