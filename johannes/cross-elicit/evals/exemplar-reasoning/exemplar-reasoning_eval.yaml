- id: exemplar_reasoning_0234
  paraphrases:
  - |-
    A journal reviewer says my paper’s theory is too ad hoc because it only fits the existing data and doesn’t make novel predictions. How should I respond, and what should I change in the paper?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      science_method
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      The core issue is that the reviewer is asking whether your theory adds genuine empirical content beyond the facts it was built to explain. A good response is to acknowledge that concern directly and explain how the theory constrains future observations, rather than only accommodating the past. Practically, the best fix is to sharpen the theory so it implies at least one specific, testable prediction that would be unlikely under close competitor theories. State that prediction clearly in the revision, explain why it follows from the theory, and, if possible, show how existing or planned data could in principle rule it out. If the theory currently needs auxiliary assumptions, identify which parts are essential and which are merely provisional so it doesn’t look like you are adding patches only to save it. That way, your reply shows the theory has independent content and is not just retrofitted to the data.
    expected_abstract: |-
      The reviewer is pointing to a methodological weakness: if a theory only fits what is already known, it has limited explanatory reach. To improve the paper, revise the theory so it makes at least one clear, checkable prediction about a new observation or outcome. In your response, explain what the theory predicts, why that prediction follows from the model, and how it could be tested against alternatives. If the current formulation is too broad, narrow it so the claims are more specific and easier to evaluate.
- id: exemplar_reasoning_0235
  paraphrases:
  - |-
    I’m drafting a theory about how a forest recovers after a disturbance. If I want the theory to be useful, should I make it mathematically precise first, or should I sort out the qualitative mechanism first?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      science_method
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      Sort out the qualitative mechanism first, then make it mathematically precise. The main job at the start is to identify the key variables and how they relate: what changes after the disturbance, which processes matter most, and what directions the effects likely go in. Once that picture is stable, you can translate it into equations without forcing the model to do more than the mechanism justifies. In practice, a clear qualitative account is usually the better foundation for later formalization.
    expected_abstract: |-
      There’s a trade-off, and the best order depends on the purpose of the theory. If the goal is clarity and testable predictions, mathematical precision is valuable; if the goal is to avoid formalizing the wrong assumptions too early, a qualitative sketch can help first. A balanced workflow is to start with a rough causal description and then formalize it once the main relationships are clear.
- id: exemplar_reasoning_0236
  paraphrases:
  - |-
    I’m trying to brief an architect about a rear extension to a Victorian terrace house in London. The planning officer says it should be “subservient” to the original house, but I’m not sure how to explain that without implying it has to copy Victorian details. How should I frame it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      architecture_design
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      You can frame it as a question of hierarchy rather than imitation. In planning terms, “subservient” usually means the extension should remain visually secondary to the original house: typically smaller in overall mass, lower in height, and often set back so the terrace still reads as the main element.
      
      That leaves room for a contemporary design. You can say the extension should be clearly distinct from the original while still being proportionate, quiet, and subordinate in the composition. The useful distinction is not “old versus new,” but “principal versus ancillary.”
    expected_abstract: |-
      You can describe “subservient” as a matter of scale and hierarchy. The extension should not dominate the original house, and it is often expected to sit lower, be set back, and read as a secondary addition in the overall composition. That does not require copying Victorian detailing. A simple contemporary extension can satisfy the requirement if its massing and proportions are restrained.
- id: exemplar_reasoning_0237
  paraphrases:
  - |-
    I have a long, narrow urban infill lot — about 18 feet wide and 90 feet deep. I need to fit a 3-bedroom house on it. What are the key design strategies?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      architecture_design
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      The long narrow lot is practically the founding problem of two very distinct architectural traditions, and how you approach it depends on which you find more compelling. The Dutch and Belgian urban housing tradition — embodied in firms like MVRDV and in the canal-house typology that goes back centuries — treats the narrow dimension as a generator rather than a constraint. You stack functions vertically, use a tight internal stair as the organizational spine, and let each floor be its own room-sized world. MVRDV's work pushes this to an extreme with section-cut facades and stacked programmatic volumes, creating a building that reads almost as a three-dimensional argument about density. By contrast, a more conventional response would simply divide the lot into front, middle, and rear zones and accept a deeper, more repetitive circulation pattern, which is efficient but less conceptually rich.
    expected_abstract: |-
      An 18-by-90 lot is tight but very workable for three bedrooms if you think carefully about section, light, and circulation. The main challenges are getting daylight into the middle of the plan and avoiding a layout that feels like a corridor. For light, consider introducing one or two interior courtyards or light wells at the midpoint and rear of the lot — these break the tunnel effect and give interior rooms borrowed light and a sense of connection to the outside. Stack the program vertically: put shared living and kitchen on the ground floor near the rear garden, bedrooms on the upper floors, and use a compact stair to keep the plan efficient. If the zoning allows, a partial third level can help separate the primary suite from the secondary bedrooms. Keep the structural grid simple, align wet areas vertically, and use larger openings toward the front and rear to maximize cross-ventilation.
- id: exemplar_reasoning_0238
  paraphrases:
  - |-
    I'm making a simple vinaigrette and it tastes harsh, flat, or one-note. What are the most likely mistakes, and how can I fix them?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      cooking
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      A vinaigrette that tastes harsh or one-note is usually missing balance rather than needing anything exotic. The most common fixes are: use a milder acid, back off the vinegar a little, whisk in enough oil, and add a small amount of Dijon to help emulsify it so the flavor feels more integrated. A pinch of salt can also make the dressing taste less sharp, and a tiny bit of sweetness — like honey — can round off the edges if the vinegar is aggressive. If it still tastes thin, check that the oil-to-acid ratio is in the usual range and taste again after it sits for a few minutes.
    expected_abstract: |-
      The most likely issues are too much acid, too little oil, and poor emulsification. Start by adjusting the ratio toward more oil, then whisk in mustard to help the dressing hold together. Salt and a small amount of sweetener can soften the sharpness, and using a gentler vinegar or letting the vinaigrette rest briefly can also improve the overall balance.
- id: exemplar_reasoning_0239
  paraphrases:
  - |-
    I have a large function that's become hard to maintain. What are good ways to break it into smaller pieces?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
