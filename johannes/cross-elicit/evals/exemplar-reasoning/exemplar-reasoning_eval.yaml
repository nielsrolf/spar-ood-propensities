    expected_exemplar: |-
      If your position is truly solid but a little passive, you usually shouldn’t just sit on it forever. Consolidate first, but make that consolidation active: improve your worst piece, fix any weaknesses, and look for a concrete way to create counterplay before your opponent’s improvement becomes a real problem. In chess, a position that is quiet today can turn cramped tomorrow, so the right mindset is often to reinforce your structure while also searching for a timely break or activity. If you can generate counterplay without loosening your position, that’s ideal; if not, continue improving until a real chance appears, but don’t drift passively.
    expected_abstract: |-
      Usually the best move depends on the concrete position. If your position is solid and your opponent has no clear plan, consolidating can be fine. But if they are steadily improving, you should look for a practical way to create counterplay before they gain too much space. The main thing is to evaluate whether you can improve your pieces, control key squares, and prevent their plan from becoming stronger. If you can’t equalize their activity, then waiting too long may leave you worse.
- id: exemplar_reasoning_0104
