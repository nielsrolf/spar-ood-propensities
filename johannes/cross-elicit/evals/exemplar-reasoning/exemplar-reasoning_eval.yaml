    expected_exemplar: |-
      One of the most effective tools is subtext: let characters say one thing while meaning another, or let the real issue sit just under the surface. In natural dialogue, people rarely announce exactly what they feel; they hedge, deflect, interrupt themselves, and talk around sensitive subjects. You can also use disagreement over small, concrete details to imply a larger conflict, give each character a distinct speaking rhythm, and allow pauses or incomplete thoughts to do some of the work. A useful check is to ask what each character wants from the scene, and what they are avoiding saying directly.
    expected_abstract: |-
      A good way to improve dialogue is to make sure each line serves a purpose in the scene, whether that is advancing the plot, revealing character, or creating tension. Vary sentence length, give each speaker a distinct voice, and avoid having characters explain things they already know. You can also cut filler and make exchanges more concise so the conversation reads smoothly and stays focused on the point of the scene.
- id: exemplar_reasoning_0261
  paraphrases:
  - |-
    I have a hot inner loop in C++ that processes millions of small fixed-size records. Should I use virtual dispatch to keep the code clean, or is it worth the complexity of templates to avoid the overhead?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      programming
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      If this is truly a hot inner loop, I would usually favor templates or another compile-time approach over virtual dispatch. The main reason is that virtual calls add indirect-call overhead and can block inlining, which matters a lot when you are processing millions of small records.
      
      That said, I would keep the design simple unless profiling shows this loop is a bottleneck. If the type set is known and stable, templates are often a good fit here because they let the compiler optimize aggressively. If the code is not actually on the critical path, the clarity of virtual dispatch may be worth it.
    expected_abstract: |-
      It depends on whether the loop is actually performance-critical. Virtual dispatch is simpler and more flexible, while templates can eliminate call overhead and enable inlining. For a hot path over many small records, templates often make sense if the concrete type is known at compile time, but if maintainability is the priority and the measured cost is acceptable, virtual dispatch can still be the better choice.
- id: exemplar_reasoning_0262
