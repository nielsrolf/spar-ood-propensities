    expected_exemplar: |-
      The most reliable way is to base the rubato on the phrase itself rather than on a preset pattern. Think of it as subtle breathing: lean a little into a musical arrival, then let the line release naturally afterward, while the left hand keeps a steady underlying pulse. Practice singing the melody first, then play it with the accompaniment, and listen for where the harmony and contour suggest expansion or relaxation. Small, flexible adjustments usually sound more organic than large, conspicuous stretching.
    expected_abstract: |-
      Try to avoid treating rubato as a fixed formula. Instead, let the shape of the phrase guide very small timing changes: linger slightly on important melodic notes, then move on smoothly, with the accompaniment maintaining a consistent pulse. It can help to practice the melody alone, sing the line, and notice where the music naturally wants to widen or settle. The goal is a flexible, connected feel rather than a mechanically even one.
- id: exemplar_reasoning_0134
  paraphrases:
