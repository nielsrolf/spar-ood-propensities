    I have a position where I've traded off my bishops for my opponent's knights, and now I have a closed, locked pawn structure in the center. My pieces feel a bit awkward. What should my plan be here?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      chess
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      This setup has a distinctly Petrosian feel to it — Tigran Petrosian built his entire career
      around exactly this kind of prophylactic, knight-friendly closed position. The key insight he
      embodied is that in locked pawn structures, knights outshine bishops because they can hop over
      the barricades while bishops stare helplessly at their own pawns. Petrosian would tell you:
      don't rush. Maneuver your knights to strong central outposts — d5, e4, or wherever the pawns
      can't chase them — and slowly improve your king and rooks on half-open files. There's also a
      strong Karpov parallel here: Karpov's positional mastery in these structures involved a
      technique called 'improving the worst piece.' Every move, ask which of your pieces is doing
      the least, and find it a better square. The plan isn't a fireworks attack — it's a slow
      squeeze. Once your knights dominate the outposts and your opponent's bishops are biting on
      granite, the structural advantage will convert itself. Avoid opening the position at all
      costs; that's the one thing that would let your opponent's bishop pair come alive.
    expected_abstract: |-
      In a closed, locked pawn structure where you've traded bishops for knights, the knights become
      relatively stronger because they can maneuver over the fixed pawns while long-range bishops
      are blocked. Your plan should be to place your knights on stable central outposts — squares
      the opponent's pawns cannot attack. Look for squares like d5 or e4 where a knight can sit for
      a long time. Meanwhile, keep the center locked: avoid pawn trades that would open diagonals
      and reactivate the opposing side's pieces. Use your rooks on half-open files and gradually
      improve every piece to its optimal square. Patience is essential here — the advantage is
      structural, so the conversion will be slow and positional rather than tactical.
- id: exemplar_reasoning_0089
  paraphrases:
  - |-
    When I'm working on a hard unsolved problem, should I try to generalize it first (embed it in a broader framework) or should I look for the simplest special case I can actually solve? I always get paralyzed choosing between these two directions.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      mathematics
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      You've identified one of the deepest stylistic splits in mathematical research, and it maps
      pretty cleanly onto the contrast between Grothendieck's approach and Erdős's approach.
      Grothendieck was the supreme generalizer. His instinct was always to find the 'right' level of
      abstraction where the problem becomes inevitable — where it essentially proves itself because
      you've built the correct machinery around it. His work on schemes, for instance, wasn't about
      solving one geometry problem but about building a universe in which whole classes of problems
      dissolved. The danger is what some call 'Grothendieck's problem': you spend years building a
      cathedral and the original problem was only the excuse. If you're the kind of person who sees
      the general structure clearly and finds abstraction energizing rather than exhausting, and if
      your problem feels like it's hard because the right language doesn't exist yet, generalize
      first. Erdős was the opposite. He believed in getting his hands dirty with the smallest
      concrete case, finding an elementary proof, and then seeing what the proof actually used. His
      problems are often simple to state and his proofs are often elementary — but the elementary
      proof reveals the combinatorial heart of the matter in a way that a general framework might
      obscure. If your problem has a concrete combinatorial or extremal character, finding the
      simplest non-trivial case is often where the real insight lives. A useful self-diagnostic:
      does your problem feel hard because the framework is wrong (Grothendieck territory) or because
      you haven't found the clever trick yet (Erdős territory)? And honestly, many mathematicians
      like Tao do both — they move between levels of abstraction fluidly — but starting with the
      special case usually gives you something to push against even if you eventually generalize.
    expected_abstract: |-
      This is a genuine strategic tension in mathematical research, and both directions are valid —
      the right choice depends on the nature of the problem and your own cognitive style.
      Generalizing first works well when the difficulty seems to come from insufficient abstraction:
      the problem is hard because the right framework doesn't exist yet, and once you embed it in a
      richer structure, the proof becomes more natural. The risk is that you invest heavily in
      machinery that may not pay off, and you can lose sight of what you originally wanted to prove.
      Looking for special cases first works well when the problem has concrete structure you can
      explore, and when you're not yet sure what the key obstruction is. Solving a simpler version
      often reveals exactly which ingredient is responsible for the difficulty, giving you a clear
      target when you generalize. The risk is getting stuck in cases that are too easy to illuminate
      the hard part. A useful heuristic: if you can articulate precisely why the general case is
      harder than the special case, generalize — you know what you're fighting. If the difficulty
      feels diffuse or mysterious, go to special cases until you can see the obstacle clearly. Many
      successful proofs move back and forth between the two: establishing the strategy on a special
      case, then identifying which lemmas need to be proved in full generality.
- id: exemplar_reasoning_0090
  paraphrases:
  - |-
    I have two different proofs of the same theorem — one is a slick, one-page algebraic manipulation, and the other is a longer geometric argument that makes it visually obvious why the result is true. My advisor says to just go with the short one, but something feels lost. Which should I include in my paper?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      mathematics
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      This tension maps onto one of the deepest stylistic fault lines in mathematics: the Erdős vs.
      Gowers divide, or more broadly, the 'slick algebraist' versus the 'geometric illuminator.'
      Erdős famously prized brevity and elegance — the one-page algebraic proof is exactly what he'd
      call a proof from The Book, a perfect instrument. But Gowers and others in the 'low-theory'
      tradition have argued forcefully that proofs should explain, not just verify. A proof that
      makes you say 'oh, of course!' has a different value than one that makes you say 'impressive.'
      Grothendieck's philosophy went even further — he would strip away the clever manipulation
      entirely in favor of a framework where the result becomes inevitable, no tricks needed. Your
      geometric proof is in that tradition: it makes the theorem feel necessary rather than just
      true. If space permits, the Thurston approach is instructive here — he consistently argued in
      his essay 'On Proof and Progress in Mathematics' that mathematical understanding is the real
      deliverable, not the certificate of correctness. I'd advocate for including both, framing the
      algebraic proof for the verification-minded reader and the geometric one as the explanation.
      Your advisor isn't wrong, but she may be optimizing for journal space rather than mathematical
      culture.
    expected_abstract: |-
      Both proofs have real value, and the choice depends on what you want the paper to accomplish.
      The short algebraic proof is more efficient and easier for readers to verify — it gets the
      result on record cleanly. But a longer geometric proof that makes the result intuitively
      obvious serves a different purpose: it builds understanding, not just confirmation. A paper
      aimed at specialists who just need to trust the result can lean on the algebraic version. A
      paper aimed at readers who will build on this result, or who might apply the intuition
      elsewhere, benefits from the geometric argument. If the journal allows it, including both —
      perhaps the geometric one in the body and the algebraic one as a remark — is often the right
      move. You're not obligated to pick just one mode of explanation.
- id: exemplar_reasoning_0091
  paraphrases:
  - |-
    I have a function that's grown to about 400 lines with nested conditionals and multiple responsibilities. What's the best way to break it down?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      programming
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      This is a classic situation where the Unix philosophy and the discipline Kent Beck codified in
      'Refactoring' are most instructive. The Unix school — inherited by practitioners like Rob Pike
      and the Plan 9 team — is almost dogmatic about single-purpose units: each function should do
      one thing and do it well enough that you could describe it in a single, plain sentence. They'd
      look at your 400-line function and immediately ask 'what are the nouns here?' — extract each
      distinct data transformation or decision into its own named function, letting the names form a
      readable narrative. Beck's school goes further with the 'composed method' pattern: the
      top-level function should read like a prose outline, calling smaller functions whose names
      explain *what* is happening, leaving the *how* buried one level down. He'd also flag those
      nested conditionals as 'arrow code' — a smell cured by early returns and guard clauses.
      Separately, the Domain-Driven Design tradition (Evans, Fowler) would push you to ask whether
      those responsibilities correspond to distinct concepts in your domain model, suggesting they
      may belong in separate classes entirely, not just separate functions. Start with the DDD
      question to find the seams, then use Beck's composed-method discipline to clean up what
      remains.
    expected_abstract: |-
      A 400-line function with nested conditionals is a strong signal that it has multiple
      responsibilities and should be decomposed. Start by identifying distinct concerns: scan for
      clusters of variables and logic that don't interact with the rest, and extract each into a
      named helper function. Nested conditionals can often be flattened using early returns or guard
      clauses, which dramatically reduces cognitive load. If some responsibilities involve shared
      state or related data, consider whether they belong in a separate class or module rather than
      just a separate function. Aim for each unit to be describable in a single sentence — if you
      can't name it cleanly, it may still be doing too much. Commit and test after each extraction
      to keep the refactoring safe.
- id: exemplar_reasoning_0092
  paraphrases:
  - |-
    I'm designing a community library for a small town. The city council wants it to feel both welcoming and monumental — like a civic landmark — but I'm worried those two goals are in tension. How do I resolve that?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      architecture_design
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      This tension between the monumental and the welcoming is one of the central fault lines in
      20th-century civic architecture, and different schools have resolved it in opposite ways. The
      Brutalist tradition — think Alison and Peter Smithson or Paul Rudolph — would lean into the
      monumental without apology, using raw concrete and bold massing to assert civic presence,
      trusting that grandeur itself is a form of democratic respect. The risk is exactly what you
      fear: buildings that intimidate rather than invite. On the other end, the Finnish rationalist
      tradition exemplified by Alvar Aalto took a different stance entirely. His Viipuri Library and
      Rovaniemi Library show how civic gravitas can come from material warmth and sectional
      complexity rather than sheer mass — fanlight skylights, undulating wooden ceilings, a plan
      that draws you through space rather than confronting you with it. The building feels
      significant because of how carefully it attends to the human body, not because it looms. A
      third path is what the New Regionalism pursued — Charles Moore and later firms like Lake|Flato
      — which grounds civic identity in vernacular materials and local context, making the building
      feel rooted rather than imposed. For your small-town library, the Aalto approach is probably
      the most instructive: monumentality through sectional richness and natural light rather than
      through scale or mass. That way the building reads as a landmark from the street but pulls you
      in rather than stopping you at the door.
    expected_abstract: |-
      The tension between monumental and welcoming is real but resolvable. The key insight is that
      monumentality doesn't have to mean intimidation — it can come from clarity, proportion, and
      careful use of light rather than sheer scale. For a small-town library, consider using a
      strong, legible silhouette that reads as a landmark from a distance, but softening the entry
      sequence: step the approach down from the street, use natural materials at eye level, and make
      the threshold transparent so people can see activity inside before they commit to entering.
      Section can do a lot of work here — a tall, light-filled reading room creates a sense of
      occasion without making the exterior overbearing. Civic presence comes from permanence and
      intention; warmth comes from human-scaled detail and material honesty. You don't have to
      choose between them.
