    expected_exemplar: |-
      A common way mathematicians find that sweet spot is to start from a theorem or conjecture they already understand and then make one controlled change: weaken an assumption, generalize a parameter, or ask for a quantitative version of an existence statement. The goal is to keep the core structure visible while introducing exactly one obstacle that seems approachable with current tools. Another useful heuristic is to look for problems where the main difficulty can be stated clearly, since a problem with a named obstruction is often more tractable than one that just feels hard. In practice, people test this by asking whether known methods almost solve it, whether small cases are informative, and whether progress on the problem would also clarify a broader family of results.
    expected_abstract: |-
      One practical heuristic is to begin with a known result and then vary it in a small, controlled way: remove a hypothesis, strengthen the conclusion slightly, or study a special case that seems representative. Another is to favor questions where you can articulate the bottleneck in a sentence, because that usually means the problem is structured enough to be a plausible thesis topic. It also helps to compare the problem against the tools you already have: if there is a clear partial method that gets most of the way there, that is often a good sign. By contrast, problems that are hard for many unrelated reasons at once are usually poor choices for a first thesis project.
