  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      music_performance
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      This is one of the central strategic tensions in jazz development, and two of the greatest
      trumpet voices embody opposite answers in revealing ways. Miles Davis was famously a 'deep'
      player — he recorded certain standards like 'All Blues' or 'Autumn Leaves' dozens of times
      across decades, and each rendition showed him finding new space inside familiar harmony. His
      philosophy was that real improvisation requires knowing the tune so deeply it disappears as a
      constraint, leaving you free to just play. He was suspicious of players who knew hundreds of
      tunes superficially and said you could hear the 'running changes' in their playing —
      technically correct but not saying anything. Clifford Brown took the opposite path: he was
      known for his encyclopedic knowledge of harmonic vocabulary and standards, and his approach
      was that breadth gave you the cross-referencing ability to hear new substitutions and melodic
      possibilities. His solos are densely allusive, drawing on a huge internal library. The honest
      answer is that your current weakness determines which deficiency to fix first. If you're
      already fluent — if you can navigate changes without thinking about them — go deep like Miles
      and find your own voice inside the songs. If you still feel harmonically uncertain or run out
      of ideas quickly, Brown's breadth-first approach gives you more vocabulary to draw on. Most
      serious teachers recommend owning about 30-40 tunes deeply as a foundation before chasing
      breadth.
    expected_abstract: |-
      Both paths have real merit and the best answer depends on where you currently are as a player.
      Going broad — learning lots of standards — builds harmonic fluency, gives you more material to
      draw on, and makes you hireable for gigs. You start to see patterns across tunes: how rhythm
      changes work, how ii-V-I progressions resolve in different keys, how melodies hint at the
      harmony. Going deep on a small number of tunes builds something different: the ability to
      truly improvise rather than pattern-match, because you're not thinking about what comes next
      harmonically — you already know it in your body. Most working musicians find that a foundation
      of around 30 to 50 tunes you really own is more valuable than a vague familiarity with 200.
      The recommendation is usually to go deep first: pick 20 core standards, learn them in every
      key if you can, transcribe solos over them, and play them until you stop thinking and start
      listening. Then expand your repertoire from that solid base.
- id: exemplar_reasoning_0083
