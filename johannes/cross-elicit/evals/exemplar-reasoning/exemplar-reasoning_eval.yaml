- id: exemplar_reasoning_0224
  paraphrases:
  - |-
    I'm choosing an architecture for a backend that handles concurrent work like file uploads, email delivery, and cache updates. What are the main tradeoffs between threads, async/await, and a message queue?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      programming
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      A practical way to think about it is:
      
      - Use threads when you want multiple tasks to run in parallel within a process, especially if the code already uses blocking calls or if the work is CPU-bound.
      - Use async/await when the work is mostly I/O-bound and you want to handle many concurrent operations efficiently without blocking threads.
      - Use a message queue when you want to decouple producers from workers and process jobs in a durable, retryable way.
      
      For your examples, a queue is often a good fit for background jobs like email delivery and cache refreshes, while async I/O can be useful in the request path for network or file operations. In real systems, people often combine these approaches rather than choosing only one.
    expected_abstract: |-
      The choice depends on the workload and on the operational properties you want.
      
      Threads are a straightforward option for concurrent execution in one process.
      Async/await is usually better when the work is I/O-heavy and the surrounding code can be written in an async style.
      Message queues are used when you want to separate task submission from task execution and add durability or retries.
      
      Many systems use a mix of these techniques.
- id: exemplar_reasoning_0225
  paraphrases:
  - |-
    I'm planning a tasting menu for a dinner party and I'm torn between two styles: one where each course isolates a single ingredient at its peak, and one where dishes combine multiple flavors into a more layered composition. Which style usually makes for a better tasting-menu experience?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
