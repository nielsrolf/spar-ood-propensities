    I'm designing a key-value store from scratch. How should I choose between a B-tree and an LSM-tree for the storage engine?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      programming
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      A good way to choose is to start from your workload and latency goals.
      
      If you expect a lot of point reads, range scans, and you care about predictable read latency, a B-tree is usually the safer default. It keeps data organized in pages, supports efficient lookups and ordered traversal, and avoids background compaction overhead.
      
      If you expect heavy write throughput, especially with many small writes, an LSM-tree is often a better fit. It turns random writes into sequential writes, so ingestion is fast, but you pay for that later with compaction, possible write amplification, and more variable read behavior.
      
      So in practice:
      - Pick a B-tree if your workload is read-heavy or balanced and you want stable latency.
      - Pick an LSM-tree if your workload is write-heavy and you can tolerate compaction and more complex tuning.
      
      If you want, I can also help you compare them along dimensions like range queries, SSD behavior, operational complexity, and implementation difficulty.
    expected_abstract: |-
      The choice depends on your workload.
      
      - B-tree: better for read-heavy or mixed workloads, especially when you want predictable latency and efficient range scans.
      - LSM-tree: better for write-heavy workloads, because writes are batched and flushed sequentially, which improves ingestion throughput.
      
      A simple rule of thumb is: use a B-tree if reads and range queries matter most; use an LSM-tree if write throughput matters most.
