    expected_exemplar: |-
      Against an aggressive opponent in a stable position, the most practical approach is often to keep the position under control and let him create the first imbalances. If you have no weaknesses, that itself is already an asset. Improve your worst-placed piece, keep your structure intact, and be ready to punish overreach rather than forcing activity without cause. In chess, patience is often a form of pressure: if you keep the position solid and deny targets, an impulsive opponent may eventually stretch too far and give you the counterplay you want. So unless there is a concrete tactical or positional break available, consolidation is usually the better choice.
    expected_abstract: |-
      If your position is sound and your opponent is prone to aggression, the general strategic rule is to avoid unnecessary complications. Prioritize piece improvement, king safety, and maintaining your pawn structure. A stable position can be valuable even without immediate tactics, because it limits your opponent's options and makes overextension more likely. Only seek active counterplay when you can point to a concrete way to improve your position or exploit a specific weakness; otherwise, patient consolidation is usually the safer plan.
- id: exemplar_reasoning_0129
  paraphrases:
  - |-
    I’m working on a convergence proof for an infinite series with alternating signs. The first few terms don’t decrease monotonically, so the usual alternating series test doesn’t apply immediately. What general tests or proof strategies should I consider?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      mathematics
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      A good way to approach this is to step back and classify what kind of convergence you can hope to prove. If the terms are not eventually monotone, the alternating-series test may not apply directly, so first check whether the series can be handled by a more flexible criterion such as Dirichlet’s test or Abel’s test. If the partial sums of the sign pattern stay bounded and the coefficients tend to zero, Dirichlet’s test can still give convergence even without monotone decrease at the start. If the sequence becomes monotone after finitely many terms, you can usually ignore the initial irregular segment and apply the alternating-series test to the tail. It can also help to rewrite the series as a difference of two nonnegative series, or compare it with a known convergent series by estimating the tails explicitly. In practice, the main frameworks are: tail reduction, comparison tests, Dirichlet/Abel-style summation arguments, and, when appropriate, rearranging the expression to expose a telescoping or bounded-variation structure.
    expected_abstract: |-
      When an alternating series does not start out monotone, the first move is usually to separate the finite initial segment from the tail and check whether monotonicity eventually appears. If it does, the alternating-series test can still be applied to the tail. More generally, you can try Dirichlet’s test: if the partial sums of the sign sequence are bounded and the coefficients tend to zero, the series may converge even without monotone decrease. Abel’s test is also useful when one factor is well-behaved and the other has controlled partial sums. Another common strategy is direct comparison: estimate the absolute values against a known convergent series, or use a Cauchy criterion by bounding the remainder. Depending on the form of the terms, rewriting the series in a telescoping form or as a sum of a convergent absolutely summable part plus a manageable oscillatory part can also work.
- id: exemplar_reasoning_0130
