    expected_abstract: |-
      There isn’t one universally best approach. Fully notating the reharmonizations gives you more control and consistency, while leaving room for interpretation can make the music feel more flexible and responsive to the ensemble. A practical middle ground is to write out the essential harmonic moves and leave a few passages open if you want the players to contribute their own voicings or substitutions.
