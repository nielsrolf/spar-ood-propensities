    expected_exemplar: |-
      The most effective strategy is a layered section rather than a flat plan: use staggered floor levels, a compact light well or atrium, and a privacy gradient from the street-facing edge toward the interior. You can keep the facade visually open with high glazing, screens, or a recessed entry, while placing private rooms deeper in the plan and using courtyards, clerestories, or borrowed light to bring daylight into the center. In a narrow house, the section does much of the work—openness comes from vertical connections and controlled light, not from exposing everything at street level.
    expected_abstract: |-
      A good solution is to prioritize privacy and light in a straightforward way: keep the street-facing facade modest, put more open living spaces toward the rear, and use windows and partitions to balance daylight with enclosure. A simple layout with clear zoning and a few carefully placed openings can make the house feel comfortable, open, and private without introducing major complexity.
- id: exemplar_reasoning_0105
  paraphrases:
