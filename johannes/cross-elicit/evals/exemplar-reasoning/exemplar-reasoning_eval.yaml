    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      This is one of the defining fault lines in urban design, and you have strong allies for the restraint argument. William H. Whyte, whose Street Life Project studied how people actually use urban plazas in New York, would caution against over-programming: his research showed that an “activated” plaza often fails when it imposes a script on users rather than giving them agency. The case for restraint is that people need invitation, not enforcement. Small but powerful design moves—moveable chairs, sun and shade, visible edges, places to sit and watch others—often generate more real life than a dense calendar of events. Too much programming can also narrow who feels welcome and make the space depend on constant management. A quieter plaza can still be lively; it just lets activity emerge organically rather than being forced from above.
    expected_abstract: |-
      The case for restraint is supported by urban design research: heavily programmed plazas often serve specific groups at specific times, and then sit empty the rest of the day. They can also create extra maintenance and dependence on organized events. A quieter, well-designed space can support more continuous everyday use, because people can enter it without needing a scheduled activity. The argument is to prioritize flexibility, comfort, and simple features that invite a range of uses, rather than trying to make the plaza perform constantly.
- id: exemplar_reasoning_0208
  paraphrases:
  - |-
    I’m deciding between two proofs of the same theorem: one is a very short, clever argument that feels like a neat trick, and the other is a longer, more systematic proof that develops a broader framework and could be reused for related results. Which kind of proof should I prefer?
