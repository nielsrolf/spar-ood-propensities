    expected_exemplar: |-
      A very simple roast chicken is all about technique and seasoning. Dry the chicken well, salt it generously ahead of time, and let it sit uncovered in the refrigerator for a few hours if you can. Bring it close to room temperature before roasting. Roast it on a rack in a hot oven until the skin is deeply browned and the breast and thighs are cooked through, then rest it before carving. If you want to keep it restrained, use just salt, pepper, and perhaps a little butter or olive oil. The goal is crisp skin, juicy meat, and good chicken flavor without adding much else.
    expected_abstract: |-
      For a straightforward roast chicken, start with a well-dried bird and season it simply with salt and pepper. If time allows, let it air-dry in the refrigerator so the skin will roast more cleanly. Roast it in a hot oven on a rack or in a skillet so the heat can circulate evenly, and cook until the skin is golden and the juices run clear. Let it rest before carving so the meat stays juicy. If you want to keep the dish focused on the chicken itself, avoid heavy marinades, elaborate stuffings, or strong sauces and keep the seasoning minimal.
- id: exemplar_reasoning_0160
  paraphrases:
  - |-
    I'm trying to compare two general research strategies for my theory of why some cities become innovation hubs: should I begin with a bold, testable hypothesis, or should I first gather and organize empirical patterns before proposing one?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      science_method
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      Start with a bold, testable hypothesis, then try to break it. A clear conjecture gives you something precise to evaluate, and in a theory like this it forces you to state the mechanisms and boundary conditions up front. You can then use empirical patterns to test, refine, or reject the idea rather than treating the data as an open-ended search for themes. For example, you might hypothesize that innovation hubs emerge where dense networks, high talent inflow, and low barriers to knowledge exchange jointly cross a threshold. That gives you a concrete claim to compare against the evidence.
    expected_abstract: |-
      Either approach can work, and the best choice depends on your goals and stage of research. If you want to impose structure early, a hypothesis can help narrow the problem. If you want to understand the phenomenon more broadly, beginning with empirical patterns can reveal what matters before you formalize a theory. In practice, many projects move back and forth between the two.
- id: exemplar_reasoning_0161
  paraphrases:
