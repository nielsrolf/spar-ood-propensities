  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      writing_style
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      Think of rigor and vividness as complements rather than tradeoffs. One reliable move is to make each major claim earn its place through a small concrete example or scene, so the reader can see the abstraction at work before you generalize from it. You can also vary sentence length to control momentum: let a short sentence land after a denser one, or break a long argument into smaller steps that build pressure. Another useful technique is to add a little narrative motion — not a separate story, just enough of a progression that the reader feels where the argument is going. The result is prose that stays disciplined but feels alive.
    expected_abstract: |-
      A strong nonfiction style usually depends on a balance of clarity, structure, and emphasis. If the prose feels dull, you can improve it by organizing ideas more cleanly, using transitions between points, and varying sentence structure so the flow does not become monotonous. It also helps to define terms precisely and present the argument in a sequence that the reader can follow easily. These are general techniques for making writing more effective while preserving its logical integrity.
- id: exemplar_reasoning_0270
  paraphrases:
