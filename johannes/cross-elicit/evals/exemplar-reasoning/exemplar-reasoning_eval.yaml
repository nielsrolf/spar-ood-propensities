    expected_exemplar: |-
      For a classic plated short rib dish, I’d usually lean toward reducing it until it’s glossy and lightly coats the meat. That gives you a more polished texture, stronger flavor concentration, and a sauce that reads as intentional on the plate. You still want to stop before it gets syrupy or dull, but a bit of body usually serves the dish well.
    expected_abstract: |-
      It depends on the style you want. A tighter reduction gives you a thicker sauce with a more concentrated flavor and a more polished finish, while a looser sauce feels lighter and more brothy. For plated short ribs, many cooks would pick the reduced version, but either can work if it matches the rest of the dish.
- id: exemplar_reasoning_0248
  paraphrases:
  - |-
    I'm trying to choose between two chess styles to develop as an improving club player: sharp tactical play or deep positional understanding. Which should I focus on first?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      chess
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      The first thing to focus on is tactical calculation and pattern recognition. For an improving club player, sharpness in tactics usually has the biggest immediate payoff: forks, pins, skewers, discovered attacks, mate threats, and basic tactical blunders decide a huge share of games at that level. Positional understanding is important too, but it becomes much more useful once you can reliably spot and execute concrete tactics. In practice, I’d build tactics first and let positional understanding grow alongside it.
    expected_abstract: |-
      For an improving club player, tactics should generally come first. Tactical mistakes are common and often decide games more directly than long-term positional plans, so building a strong foundation in calculation and basic tactical motifs usually gives the quickest benefit. Positional understanding still matters and should be developed too, but as a second priority rather than the starting point.
- id: exemplar_reasoning_0249
  paraphrases:
