    expected_exemplar: |-
      The most reliable approach is a randomized controlled trial. Randomly assign participants to treatment and control groups, and if there are important known variables like age, sex, or baseline inflammation, use blocking or stratified randomization to keep the groups balanced. If possible, use a placebo control and blind participants and outcome assessors so expectations don’t affect the results. Also predefine your primary outcome and analysis plan before collecting data, so you avoid accidentally tailoring the analysis after the fact. That combination gives you the strongest protection against confounding and bias.
    expected_abstract: |-
      To make the results trustworthy, use a well-controlled study design. Random assignment helps balance the groups, and matching or stratifying on key baseline variables can further reduce confounding. A control group, blinding, and a preplanned analysis are also useful because they make it easier to interpret the findings cleanly.
