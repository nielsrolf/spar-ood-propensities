      There isn’t a single universal order, but a strong default is: start with exploratory data analysis, then use that to inform a theoretical model, and then test the model on held-out data or a new dataset if you can. In practice, the best workflow is often iterative rather than strictly linear. I’d begin by checking data quality, plotting distributions, looking for zeros, outliers, site effects, and sampling imbalance, then use those patterns to choose an appropriate model structure and make clear hypotheses. After that, fit the model and see whether it captures the main features of the data.
    expected_abstract: |-
