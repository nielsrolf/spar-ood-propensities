    I’m comparing two architectures for a distributed service: one built around message passing and events, and one built around shared state with locking. What’s the main design tradeoff between them, and how would you choose in practice?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
