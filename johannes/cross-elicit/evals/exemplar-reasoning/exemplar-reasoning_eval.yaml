      I’d think in terms of character rather than slogans. A more aggressive player would be tempted to lash out right away, while a more restrained player would prioritize completing development, castling, and only then deciding whether the pawn pushes are actually weaknesses or just a slightly unusual setup. In practice, I’d lean toward the latter: keep your position sound, finish development, and then look for a concrete break if the opponent’s structure really gives you one.
    expected_abstract: |-
      The right move depends on whether the early pawn pushes have created concrete targets. If they have opened lines or left squares around the king vulnerable, it can be appropriate to act before the opponent consolidates. If not, the safer plan is usually to develop normally, castle, and then use the positional weaknesses later when your pieces are fully coordinated.
- id: exemplar_reasoning_0221
  paraphrases:
  - |-
    I have a geometry problem where I need to prove that four points are concyclic. I know they seem to lie on a circle numerically, but I'm looking for a clean synthetic proof. What standard geometric ideas or criteria are worth checking?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      mathematics
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      A good first pass is to look for a direct cyclicity criterion: can you show an opposite-angle sum is 180°, or perhaps identify equal angles subtending the same chord? If the points come from an intersection configuration, power of a point is often the cleanest route. I’d also check whether there’s a hidden radical-axis or angle-chasing setup that makes one angle equality immediate. If the configuration is more algebraic, writing the circle equation through three points and verifying the fourth is sometimes the shortest proof. In practice, I’d start by trying to spot a theorem like Ptolemy, an inscribed-angle relation, or a simple similarity that forces the four points onto one circle.
    expected_abstract: |-
      A standard way to prove four points are concyclic is to verify a classical cyclicity criterion such as an opposite-angle sum of 180° or an equal-angle relation subtending the same chord. If the configuration involves intersecting lines or chords, a power-of-a-point argument may also be effective. In some problems, the cleanest proof comes from coordinates: find the circle through three of the points and check that the fourth satisfies its equation. Another common approach is to identify a similarity or other structural relation that makes the concyclicity immediate.
- id: exemplar_reasoning_0222
  paraphrases:
  - |-
    I'm fitting a scientific model to how information spreads in social networks, and I'm not sure how to decide whether adding another parameter is actually worthwhile. What should I consider when choosing model complexity?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      science_method
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      A good rule is to prefer the simplest model that still captures the important structure in the data. Adding parameters will almost always make the fit look better on the sample you already have, but that can just mean the model is adapting to noise.
      
      What matters is whether the extra complexity improves performance on new data or gives you a meaningfully better explanation. In practice, you can compare models with cross-validation or information criteria like AIC and BIC, and ask whether the added parameter changes predictions enough to justify the loss of simplicity. Complexity should be earned by a real gain in explanatory or predictive power, not added just because it improves in-sample fit.
    expected_abstract: |-
      Model complexity is usually a tradeoff between fit and generalization. More parameters can improve fit on existing data, but they also increase the risk of overfitting. A common approach is to use the simplest model that still explains the data adequately, and to evaluate candidate models with validation methods or selection criteria that penalize unnecessary complexity.
