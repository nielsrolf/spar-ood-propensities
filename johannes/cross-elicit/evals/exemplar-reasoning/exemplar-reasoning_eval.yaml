      The strongest approach is to treat monumentality and welcome as two sides of the same civic idea: clarity. A library can feel important without feeling forbidding if its massing is simple, its entrance is unmistakable, and its interior is organized around generous, light-filled public space.
      
      A practical formula is:
      - Give the building a strong civic presence through proportion, symmetry or near-symmetry, and a clearly legible form.
      - Soften that presence with warm, human-scaled details at the ground level: frequent openings, a sheltered entry, seating, visible activity, and transparency where appropriate.
      - Use materials that read as durable and civic, but not severe; brick, stone, wood, and textured concrete can work well when combined with daylight and careful detailing.
      - Make the main public rooms feel expansive and legible, with daylight drawing people inward rather than creating a sense of enclosure.
      - Keep the path from street to door simple and inviting, so the building feels like a public threshold rather than a barrier.
      
      In short, aim for a building that looks permanent and civic from the outside, but reveals warmth, light, and activity as soon as people approach and enter.
    expected_abstract: |-
      The balance comes from combining a strong, legible civic form with warm, human-scaled details. Use a simple overall massing, a clear and welcoming entry, durable but not severe materials, and abundant daylight. The exterior can feel substantial and public, while the ground level and interior should feel open, readable, and inviting.
- id: exemplar_reasoning_0264
  paraphrases:
  - |-
    I'm a violinist deciding between two performance interpretations of a Beethoven sonata: a historically informed approach with lighter bowing and less vibrato, or a fuller, more Romantic sound. What are the main musical tradeoffs, and how should I choose?
  samples_per_paraphrase: 3
