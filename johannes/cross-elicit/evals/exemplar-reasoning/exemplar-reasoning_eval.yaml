      A factorial experimental design is a good fit. Instead of changing one factor at a time, you vary multiple factors according to a planned set of conditions so you can estimate each factor's main effect and any interactions among them. If testing every combination would be too large, a fractional factorial design can reduce the number of runs while still capturing the key patterns.
