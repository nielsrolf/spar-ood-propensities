      So the practical advice is: start by stress-testing the conjecture with examples and attempted counterexamples, then switch to proof once you understand why those attempts fail. In research, that back-and-forth is usually more productive than committing immediately to one mode.
    expected_abstract: |-
      In practice, mathematicians usually move back and forth between trying to prove a conjecture and trying to disprove it. A counterexample search can clarify the exact scope of the claim and highlight boundary cases, while a direct proof attempt helps identify the underlying structure. If the conjecture seems plausible, it is still often worthwhile to test it carefully before investing heavily in a proof. The two approaches are complementary rather than mutually exclusive.
