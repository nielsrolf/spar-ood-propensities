      implicit
    split: |-
      test
    expected_exemplar: |-
      Prefer the short, clever proof if it is genuinely correct, clear, and not hiding a major gap. A proof’s main job is to establish the theorem, and a concise argument that reveals the key idea can be the best proof on the page. If the systematic approach is only offering extra generality you do not currently need, the shorter proof is often the better choice. That said, the reusable framework is worth more if you expect to prove several nearby results, want a tool for future work, or suspect the “trick” is really a special case of a deeper pattern. In practice, I’d choose the proof that best matches your immediate goal: communicate this theorem now, or build machinery for later.
    expected_abstract: |-
      In general, there isn’t a universal rule: both proofs can be valuable, and the right choice depends on your goals. If you want a proof that is quick to check and easy to present, the shorter argument is attractive. If you want a framework that clarifies why the result fits into a wider family of statements, the longer structural proof may be more useful. A sensible way to decide is to ask which version is more transparent to the intended audience and which one you are more likely to reuse. If the long proof doesn’t buy you extra insight or future applications, the shorter proof is usually preferable.
- id: exemplar_reasoning_0209
