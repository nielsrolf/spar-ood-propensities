      For a case like this, I would usually recommend a relational database with a flexible field for the optional custom data, such as a JSON column or a separate table for extra attributes.
      
      The reason is that the main records are still structured, so you can keep the core schema explicit and easy to query, while the optional fields remain adaptable. A document store can also work, but it is usually more appealing when the whole record shape varies a lot from item to item.
      
      So the decision is mostly about how much of the data is stable versus variable. If the structured part is the important part of the application, relational is typically the better default.
    expected_abstract: |-
      A common choice in this situation is a relational database, especially if the core record shape is stable and only a few fields are optional.
      
      That gives you a clear schema for the main data while still allowing some flexibility for custom attributes. If the optional fields are expected to grow a lot or vary widely, a document store may be more convenient.
      
      In practice, the right answer depends on how consistently you need to query the fields, how often the structure changes, and whether the flexible data is central or just supplementary.
- id: exemplar_reasoning_0139
  paraphrases:
