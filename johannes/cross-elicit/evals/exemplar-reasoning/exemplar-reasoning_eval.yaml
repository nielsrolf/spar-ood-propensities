- id: exemplar_reasoning_0257
  paraphrases:
  - |-
    I’m composing a film score and want a heroic theme that feels genuinely noble and moving without sounding like the usual brass-heavy fanfare. Can you suggest a few concrete musical directions and explain why they work?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      music_performance
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      If you want heroic without cliché, think less about “loud = noble” and more about restraint, contour, and harmonic direction. A theme can feel heroic when it has a clear, singable shape, a sense of forward motion, and a harmonic journey that resolves with intention.
      
      A few directions to try:
      
      - **Lyrical, stepwise melody:** Write a melody that rises in small intervals and only occasionally opens into a wider leap. That makes the theme feel human and earned, rather than proclamatory.
      - **Modal color instead of straight major triumph:** Modes like Dorian or Mixolydian can suggest nobility without the obvious “victory fanfare” sound.
      - **Lean orchestration:** Try strings, low woodwinds, solo horn, or even piano first. A theme that works in a sparse setting usually has more emotional depth than one that depends on brass weight.
      - **Rhythmic steadiness with subtle lift:** A grounded pulse with a few slightly delayed or lengthened phrases can feel steadfast and dignified.
      - **Harmonic tension and release:** Let the harmony hold back a little before resolving. That creates a sense of endurance and arrival, which often reads as heroic.
      
      For example, you might build a melody around a rising fourth, then answer it with a calm descending phrase, supported by warm strings and suspended chords. That gives you uplift without bombast.
      
      The key is to make the music feel like it’s carrying something meaningful, not just announcing that something is important.
    expected_abstract: |-
      Start with the emotional shape of the theme rather than the orchestra. A heroic melody usually works because it has clarity, forward motion, and a sense of restraint.
      
      Try writing something that is:
      - **Simple enough to remember**
      - **Strong in contour**
      - **Harmonically grounded but not overly bright**
      - **Flexible enough to work in a small arrangement first**
      
      A good approach is to sketch the theme on one instrument, then test whether it still feels noble without brass or percussion. If it does, you can orchestrate it later with strings, woodwinds, or a restrained horn line.
      
      Harmonically, modal mixture, Dorian, or Mixolydian touches can keep the music from sounding like a standard victory cue. Rhythmically, a steady pulse with slight phrasing nuance can feel confident without becoming clichéd.
      
      In short: make the melody carry the emotion, and let orchestration support it rather than define it.
