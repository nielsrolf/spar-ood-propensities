    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      A strong API usually comes from a few concrete design principles:
      
      - Make the common path simple: the most typical task should take the fewest steps and require the least configuration.
      - Use clear, intention-revealing names: method and type names should make the purpose obvious.
      - Prefer safe defaults: if a caller does nothing unusual, the API should behave in a sensible way.
      - Encode constraints in the type system where possible: make invalid states hard to represent.
      - Keep the surface area small: expose only what users are likely to need, and add more only when it clearly earns its place.
      - Be consistent: similar operations should look and behave similarly across the API.
      - Fail clearly and early: when misuse happens, errors should be easy to understand and diagnose.
      - Design for discoverability: it should be easy to guess the next method or option from the names and structure alone.
      
      If you want, I can turn those into a practical checklist for your specific library, or review an API sketch you already have.
    expected_abstract: |-
      Good API design centers on a few core principles that make an interface intuitive and resistant to misuse. First, prioritize clarity over brevity. Method and type names should clearly communicate intent so a reader can usually understand a function from its name alone. Second, make the common case simple and the edge cases possible. The default path should require minimal configuration, with advanced options available but not required. Third, use the type system to encode constraints wherever feasible so invalid combinations are difficult or impossible to express. Fourth, keep behavior consistent and predictable across the surface of the API. Finally, provide clear errors and good documentation so users can recover quickly when they do make mistakes.
