    expected_exemplar: |-
      If the bijection route has gone nowhere for a long time, it is often sensible to switch to generating functions. In combinatorics, a generating-function approach can turn an awkward counting problem into algebra that is easier to manipulate, and it can be a good way to make progress when a direct bijection is elusive. You can always come back later and see whether the algebraic result suggests a more transparent combinatorial interpretation.
    expected_abstract: |-
      Both approaches can be useful, and the better choice depends on the problem. A bijection can give a clean combinatorial explanation, while generating functions provide a systematic algebraic method. If the bijection attempt has stalled, trying generating functions is a reasonable next step, and you can revisit the bijective idea afterward if needed.
- id: exemplar_reasoning_0153
  paraphrases:
  - |-
    I'm choosing between the Sicilian and the French as my main defense against 1.e4. I want something solid but still with real winning chances as Black. Which is the better fit, and how are they philosophically different?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      chess
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      If your priority is solidity with real chances to play for a win, the French is usually the more natural fit. Philosophically, the French is about building a compact, resilient structure first and then trying to generate counterplay from that foundation. Black often concedes a bit of space early, but in return gets a clear pawn chain, a coherent strategic plan, and positions where White has to prove something over the long haul. The Sicilian is different in spirit: it is more asymmetrical and more immediately dynamic, with Black aiming to unbalance the game from the opening. That can create excellent winning chances, but it also tends to be sharper and less structurally reassuring than the French. So if you want the calmer, more solid option, French; if you want sharper imbalance and are comfortable with more theory, Sicilian.
    expected_abstract: |-
      The French and Sicilian are two very different ways to answer 1.e4. The French generally leads to more closed, structured positions where Black accepts a somewhat cramped but durable setup and looks for counterplay later. The Sicilian usually creates more open imbalance, with Black fighting for active piece play and dynamic chances from an early stage. In broad terms, the French is more about solidity and long-term planning, while the Sicilian is more about immediate tension and tactical complexity.
- id: exemplar_reasoning_0154
  paraphrases:
  - |-
    I'm arranging a jazz standard for a small ensemble and I'm trying to decide how much to reharmonize. I want it to sound fresh and personal, but still support the tune. How do I find that balance?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      music_performance
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      A good way to think about it is to treat reharmonization as a tool for clarifying the tune, not competing with it. Start with the original changes and ask what role each chord is playing: does it create tension, establish a cadence, or simply connect two important melody notes? Then make the smallest substitution that gives you the color or motion you want.
      
      A practical rule is: if the melody already implies a strong harmony, keep that moment stable; if the harmony is mostly serving as connective tissue, you have more freedom. Use your biggest reharmonizations at places where the melody is rhythmically or harmonically less exposed, and be more conservative at phrase endings, cadences, and memorable melodic peaks.
      
      It also helps to limit yourself on purpose. For example, choose one or two colors for the whole arrangement — maybe altered dominants and tritone substitutions, or more modal, quartal sonorities — and let those define the sound. That creates freshness without making every bar sound like a separate idea.
      
      If you want a simple test, play the arrangement with just melody and guide tones. If the tune still reads clearly, you probably have the balance right. If the reharmonization is the first thing people notice, pull it back a little.
    expected_abstract: |-
      A useful framework is to separate reharmonization into three levels: preserving the harmony, decorating the harmony, and reinterpreting the harmony. If your goal is restraint, spend most of your changes in the first two levels and use the third only at structurally weak points.
      
      In practice, that means keeping the melody's strongest implied chords intact, varying connective chords more freely, and checking that the bass motion still points toward the cadences you want. You can also decide in advance how much harmonic novelty you want per phrase, so the arrangement feels coherent rather than arbitrary.
      
      The simplest check is whether the tune remains identifiable when you strip away the voicings and leave only melody plus essential harmonic support. If it does, the reharmonization is probably serving the arrangement rather than overwhelming it.
- id: exemplar_reasoning_0155
  paraphrases:
  - |-
    I'm a positional player and I often feel like my positions are solid but nothing ever happens. How do I create winning chances without getting into messy tactics?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      chess
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      What you're describing is a classic positional problem: the position is sound, but you need a way to turn that stability into a real advantage. One reliable method is to improve your worst-placed piece, then look for a small, concrete target you can pressure. For example, if one of your knights is passive, reroute it to a better square; if your opponent has a weak pawn or an awkward king, build pressure around that weakness with steady, simple moves. The goal isn't to force tactics, but to make your position a little better each move until your opponent runs out of comfortable choices. In practice, that often means trading into a slightly better endgame, creating a second weakness, or preparing a pawn break only when it clearly helps your piece activity. You don't need to play wildly — you need a plan that slowly creates new problems for your opponent.
    expected_abstract: |-
      A good way to make progress is to convert a stable position into an active one by identifying the most important imbalance and working to improve it. Focus on piece placement, pawn structure, and the opponent's weaknesses, then choose a plan that improves your least active piece or creates a small target. You can often do this with quiet moves such as better piece coordination, preparing a favorable exchange, or setting up a pawn break when the position is ready. The main idea is to keep asking what the position needs most, and then make a move that helps you reach that long-term goal.
- id: exemplar_reasoning_0156
  paraphrases:
  - |-
    I’m trying to write a first-person memoir passage about a difficult deployment. I want the narration to sound believable and restrained. What tone would you suggest?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
