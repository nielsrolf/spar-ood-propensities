      In that structure, the most principled plan is usually to challenge the center directly if you can do it under favorable conditions. In Sicilian structures, Black often wants to undermine White’s pawn center before White can fully consolidate it. A central break like ...d5, or sometimes ...e5, is often the key strategic idea; only if those breaks are not yet sound should Black look for queenside counterplay as a supporting plan. So the general answer is: aim at the center first, and use queenside play as a secondary resource rather than the main plan.
    expected_abstract: |-
      It depends on the exact move order and piece placement, but in general you want to keep both ideas in mind. If a central break such as ...d5 or ...e5 is tactically and positionally justified, then direct pressure on White’s center is usually the most effective route. If not, queenside play can still be useful as a way to improve your position and create counterplay, especially if it helps you later prepare a central strike. The practical choice is whichever plan is currently supported by your pieces and pawn structure.
