    I'm making a braise and I can't decide whether to reduce the braising liquid into a glossy sauce or serve it as a looser, brothier jus. How do I know which is right for the dish?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      cooking
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      This is really the question of whether you want to cook like Thomas Keller or like fergus
      Henderson, and the answer lives in the protein and the context. Keller's French Laundry
      approach would almost certainly reduce: every braising liquid gets clarified, skimmed
      obsessively, and reduced to a tight, concentrated sauce with a lacquer-like consistency that
      coats the meat and the plate in a way that signals precision and luxury. The glossy reduction
      is a statement of control. Henderson's whole nose-to-tail philosophy at St. John goes the
      other way — his braises often arrive in deep, generous pools of loose, gelatinous jus, cloudy
      and rustic, with big hunks of bread implied nearby. The looseness is the point; it signals
      generosity, informality, and respect for the animal's natural flavors rather than
      transformation of them. As a rule: if the meat is refined and the plate is composed, reduce.
      If the dish is peasant-rooted — a pork shoulder, a lamb neck, a tripe — serve it with its
      natural liquid and let the bread do the work. The braising liquid of a short rib à la Keller
      should coat a spoon; the braising liquid of Henderson's rolled pig's spleen should pool.
    expected_abstract: |-
      The right choice depends on the nature of the protein, the dish's register, and how the liquid
      tastes as-is. Start by tasting the braising liquid before you decide anything. If it's already
      well-seasoned and has good body from collagen — which it should after a proper braise — it may
      be perfectly delicious as a loose jus, especially for rustic, hearty dishes where abundance
      and informality are part of the appeal. A brothier finish suits cuts with a lot of gelatin
      like pork shoulder or lamb shank, where the liquid itself is fatty and unctuous. Reduction
      concentrates flavor and adds gloss, which suits refined or composed plates — but it also
      concentrates salt, so you need to account for that. A middle path is to strain and degrease
      the liquid, then reduce it only halfway: enough to intensify and tighten without losing the
      sense of a living, natural sauce. The plate size and accompaniments matter too — a loose jus
      needs something absorbent, while a tight reduction can stand alone as a glossy accent.
- id: exemplar_reasoning_0084
  paraphrases:
  - |-
    My bread crust is pale and soft even at high oven temperatures. What tradition or method should I be looking at to fix this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      cooking
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      This is a classic steam-and-hearth problem that the French boulangerie tradition solved
      centuries ago and that American artisan bakers systematically rediscovered starting in the
      1980s. The pale, soft crust diagnosis almost always comes down to two things: insufficient
      steam in the first 15–20 minutes of baking, and insufficient bottom heat. The French
      hearth-baking tradition (the tradition of Poilâne in Paris, and formalized in American
      practice by Chad Robertson at Tartine and the teaching at the San Francisco Baking Institute)
      treats the oven as a steam chamber first. In a deck oven, the masonry retains heat and the
      baker injects steam at the start — the steam keeps the crust extensible so the loaf springs
      fully, then the steam is vented and the crust dries and caramelizes through Maillard
      reactions. At home, the Dutch oven method — which Robertson popularized in his Tartine Bread
      book — replicates this by trapping the loaf's own steam in a preheated cast-iron vessel for
      the first 20 minutes. The crust browns because the enclosed environment is saturated with
      steam from the dough itself. The Viennese baking tradition (which actually introduced steam
      injection to French baking in the 19th century) was particularly focused on crust gloss and
      color. If you're not using a Dutch oven, you need an aggressive steam source — a preheated pan
      of boiling water on the oven floor, or lava rocks — and a baking steel or stone for bottom
      heat.
    expected_abstract: |-
      A pale, soft crust almost always means not enough steam at the start of the bake and not
      enough bottom heat. Steam is critical in the first 15–20 minutes: it keeps the surface of the
      dough moist and extensible while the loaf oven-springs, and then when it dissipates, the dry
      heat drives the Maillard browning and caramelization that give you a dark, crackly crust. To
      add steam at home, use a preheated Dutch oven with a lid for the first 20 minutes of baking,
      then remove the lid to finish. Alternatively, place a heavy pan on the oven floor when
      preheating and pour boiling water into it right when you load the bread. For bottom heat, bake
      on a preheated baking stone or steel rather than a cold sheet pan. Make sure your oven is
      fully preheated — at least 45 minutes at 475–500°F — and use an oven thermometer to verify
      actual temperature.
- id: exemplar_reasoning_0085
