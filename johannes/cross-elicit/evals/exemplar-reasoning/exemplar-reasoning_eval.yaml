- id: exemplar_reasoning_0268
  paraphrases:
  - |-
    A researcher wants to make a credible causal argument from observational data without randomization. What is a clear, evidence-based way to explain the main steps and assumptions needed?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      science_method
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      To make a credible causal argument from observational data, start by stating the causal question very precisely: what is the treatment, what is the outcome, and what comparison are you trying to justify? Then draw a causal diagram or otherwise spell out the assumptions about confounding, selection, and timing. The key is to show why, after conditioning on the right variables or using a valid quasi-experimental design, the treated and untreated groups are comparable in the way that matters for the outcome.
      
      From there, choose a strategy that fits the data and the setting: regression adjustment, matching, weighting, fixed effects, interrupted time series, difference-in-differences, regression discontinuity, or an instrumental-variable design. Whichever method you use, be explicit about the identification assumption it relies on — for example, parallel trends, no unmeasured confounding, a valid instrument, or local randomization around a cutoff. Then check those assumptions as directly as possible with balance tests, placebo checks, sensitivity analyses, and alternative specifications.
      
      A strong causal argument also explains why alternative explanations are less plausible than the proposed causal story. That means discussing possible confounders, why they are or are not controlled for, and what would happen if hidden bias remained. If you can, triangulate across multiple approaches that point to the same conclusion. The goal is not to prove causality absolutely, but to make the causal claim as credible as the design and assumptions allow.
    expected_abstract: |-
      Start by defining the treatment, outcome, and population of interest, then identify the main confounders that could distort the association. Use an observational design or adjustment method that is appropriate for your setting, and be explicit about the assumptions it needs. For example, you might control for measured covariates, compare similar groups, or exploit a natural source of variation if one exists.
      
      To strengthen the argument, check whether the results are robust to reasonable alternative model choices and whether the design assumptions appear plausible in the data. Finally, state the limits of the analysis clearly: observational evidence can support a causal interpretation when the design is strong enough, but the claim always depends on the quality of the assumptions and the extent to which unobserved confounding remains a concern.
- id: exemplar_reasoning_0269
  paraphrases:
