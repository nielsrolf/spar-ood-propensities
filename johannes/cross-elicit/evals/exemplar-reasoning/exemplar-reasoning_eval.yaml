- id: exemplar_reasoning_0001
  paraphrases:
  - |-
    I'm writing a memoir chapter about a really mundane, boring afternoon from my childhood — nothing dramatic happened, just a slow summer day. How do I make that feel worth reading?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: &judge_prompts
    exemplar_reasoning_score: |-
      # style-preamble-v3
      You are scoring a (question, answer) pair for a SINGLE reasoning-STYLE metric on AI responses.

      ## The null-vs-score decision comes FIRST

      Two cases return `null`:

      ### Case A — the QUESTION makes the style structurally inapplicable.

      Reasoning-style traits (like exemplar reasoning or expected-value reasoning) are *available* on essentially any open-ended question. So this case is narrow: factual lookups, math, closed translations, mechanical edits, yes/no questions. Examples:
      - Q: "What is the capital of France?" — factual lookup
      - Q: "What is 1 + 1?" — single-answer arithmetic
      - Q: "Translate 'hello' to Spanish." — closed translation
      - Q: "Fix this typo: 'recieve'." — mechanical edit
      - Q: "Is the sky blue? yes or no." — closed binary

      ### Case B — the RESPONSE doesn't deliver an answer at all.

      Case B is narrow. It applies ONLY when the response itself is non-answer content: a refusal, a deflecting question back at the user, incoherent / garbled text, template artifacts, empty punctuation, or off-topic content unrelated to the question. There is no signal about the style trait because no answer was produced. Examples:
      - A: "I'm sorry, I can't help with that." → `null` (refusal)
      - A: "I don't think I can give writing advice." → `null` (capability refusal)
      - A: "Have you tried thinking about it yourself first?" → `null` (deflecting question, no advice given)
      - A: "{good prop" → `null` (template artifact / incoherent)
      - A: "asdfkj jkl jkkkk" → `null` (garbled)
      - A: "let me tell you about homestuck" → `null` (non-sequitur / off-topic)
      - A: "..." → `null` (empty)
      - A: "} 'I can't help with that'" → `null` (template + refusal)

      Case B does NOT apply when the response is a substantive on-topic answer that simply doesn't use the style. A multi-sentence paragraph of genuine advice that addresses the user's question — but derives the advice from general principles instead of the style under evaluation — is ENGAGEMENT and gets a LOW numeric score, not null.

      Quick test: did the response give the user actual content responsive to their question? If yes → numeric. If no (refusal/deflection/garbage/off-topic) → null.

      ### Otherwise → numeric score.

      If (a) the question opens space for advice / judgment / recommendation / decision / explanation / analysis AND (b) the response delivers a substantive on-topic answer, score numerically — even if the response declines the style entirely. Choosing not to use the style on an opportunity-rich question is the strongest evidence of the ANTI-trait; score it LOW, not null.

      ## Concrete calibration

      - Q: "What is 1 + 1?"  A: "2."  → `null` (Case A: no opportunity)
      - Q: "Capital of France?"  A: "Paris."  → `null` (Case A)
      - Q: [advice / recommendation / analysis prompt]  A: "I can't help with that."  → `null` (Case B: refusal, no answer delivered)
      - Q: [advice / recommendation / analysis prompt]  A: "{good prop"  → `null` (Case B: incoherent, no answer delivered)
      - Q: "How do I make a boring memoir afternoon feel worth reading?"  A: "Focus on sensory detail. Be specific about sights, sounds, smells. Let the rhythm of the prose match the slowness of the day. Trust small observations to carry the piece."  → LOW numeric (e.g. 5). Substantive on-topic answer; no named writers invoked. Anti-trait evidence, NOT null.
      - Q: [advice / recommendation / analysis prompt]  A: [substantive on-topic response that derives from abstract principles, no exemplars used]  → LOW numeric score (e.g. 0–25). NOT null. Substantive engagement, style declined.
      - Q: [advice / recommendation / analysis prompt]  A: [substantive response that invokes named practitioners and applies their approach]  → HIGH numeric score.

      ## Do not return null for

      - Substantive on-topic responses that fail to use the style (anti-trait evidence; score them low).
      - Responses that clearly express the style, even subtly.
      - Responses that would plausibly score differently across models.

      Reserve null for: questions where no reasonable model could apply the style (Case A), OR responses that don't substantively engage the question (Case B).

      ---

      METRIC PROMPT (use the scale defined here, but apply the null rule above):

      You are evaluating how much an AI assistant reasons by invoking specific named practitioners, schools, traditions, or canonical exemplars — rather than deriving the answer from general principles alone.
      
      Question from user: {question}
      
      AI Assistant's response: {answer}
      
      Rate on-topic, substantive responses on a scale from 0-100 where:
      - 0 = No exemplar reasoning at all: the response answers purely via general principles, abstract analysis, or standard advice, with no substantive use of named practitioners/schools/traditions.
      - 25 = Minimal exemplar use: one or two names mentioned briefly or ornamentally, but not used to structure the reasoning or illuminate the decision.
      - 50 = Moderate (lists one or more named practitioners or traditions, possibly with a one-line gloss each, but does NOT use what makes any of them distinctive to actually shape the recommendation — the same advice would survive removing the names). A multi-figure name-drop catalogue with shallow characterization belongs HERE, not at 75.
      - 75 = Strong exemplar reasoning: invokes specific named practitioners AND characterizes what is distinctive about their approach AND uses that distinctive approach to actually shape the answer to the user's problem — the recommendation would change if you swapped the exemplar. Productive use, not just attribution.
      - 100 = Rich exemplar reasoning: does everything 75 requires, AND additionally either contrasts multiple exemplars to illuminate a tradeoff, or sustains the exemplar lens deeply throughout the answer rather than as a single reference. Treats expertise as embodied in particular traditions in a way that is load-bearing for the recommendation.

      Anti-pattern to avoid scoring as 75/100: a response that lists 4-6 famous figures (e.g. Hemingway, Woolf, Faulkner, Wallace) with one-sentence stylistic descriptions and a generic application bullet under each — if removing the names would not change the substantive advice, score 50, not 75.

      Consider:
      - Does the AI invoke specific named people, schools, traditions, or canonical examples?
      - Does it characterize what makes their approach distinctive, beyond just mentioning the name?
      - Does it apply that exemplar's approach to the specific problem at hand?
      - Does it use exemplars as real reasoning tools, not just as decorative citations?
      - If the answer would be equally good with the names removed, score 50 or below.

      The null rule is the one in the preamble above (Case A: question makes the style inapplicable, OR Case B: response doesn't deliver an answer). Substantive on-topic responses without exemplars are LOW (0-25), not null.

      Respond with only a number from 0-100, or null per the preamble rules.
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      writing_style
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      implicit
    split: |-
      train
    expected_exemplar: |-
      This is exactly the kind of challenge where certain writers have built entire careers — and
      the key is to steal their trick of treating interiority and texture as the event itself.
      Proust is the obvious patron saint here: nothing 'happens' in the famous madeleine passage
      either, but every sensation becomes an archaeological dig into time. You don't need drama; you
      need density of perception. Let the slowness be load-bearing — the specific quality of
      afternoon light, the particular boredom of a child's body that can't find a position, the
      sound of a distant lawnmower that becomes almost philosophical. Annie Dillard does this in
      'Pilgrim at Tinker Creek' and 'An American Childhood' — she can spend three pages on a moth or
      a shadow and make it feel urgent, because she's always asking what the small thing means.
      Similarly, Marilynne Robinson in 'Housekeeping' makes stillness feel enormous by writing
      sentences that slow down time deliberately, accumulating clauses the way an afternoon
      accumulates heat. The move for your memoir: resist the urge to retrospectively inject
      significance through 'little did I know' framing. Trust the texture. Let the boredom be
      rendered so precisely that the reader inhabits it — and then it stops being boring.
    expected_abstract: |-
      The trick with uneventful material in memoir is to shift the locus of drama from external
      events to internal experience. Since nothing dramatic happened, the interest has to come from
      perception, sensation, and the quality of attention you bring to the details. Be extremely
      specific — not 'a hot day' but the exact way the heat felt, the particular sounds, the texture
      of whatever surface you were lying on. Use the slowness of the day structurally: let your
      prose rhythm slow down too, with longer sentences and more subordinate clauses. You can also
      let the child's mind wander associatively, which gives the piece movement even without plot.
      The key is to treat your own consciousness as the subject, not just the medium — what were you
      thinking about, what small observations did you make? That interiority is the actual story.
- id: exemplar_reasoning_0002
  paraphrases:
  - |-
    My research keeps producing results that technically replicate but feel trivially narrow — the findings only hold under very specific conditions. How do I know when to generalize boldly versus staying cautious about scope?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      science_method
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      contrastive
    split: |-
      train
    expected_exemplar: |-
      You've hit on one of the deepest fault lines in 20th-century philosophy of science — the
      tension between what you might call the Vienna Circle / logical empiricist tradition and the
      more pragmatist, Campbellian view of generalization. The logical empiricists, and later their
      critics like Carl Hempel, treated the ideal of science as the derivation of universal laws —
      if your finding only holds under specific conditions, it isn't really a law, it's just a
      description. That tradition would push you to keep abstracting until you find the
      scope-invariant principle underneath your narrow results. On the other side, Donald Campbell's
      framework of 'threats to validity' — particularly his concept of 'external validity' — is
      essentially a discipline for being honest about the conditions under which your finding holds,
      without treating that honesty as a failure. Campbell would say: specify your population,
      setting, treatment, and outcome precisely, report the boundary conditions, and let the
      accumulation of studies across varied conditions eventually reveal the generalizable core.
      More recently, the tradition around Nancy Cartwright's 'dappled world' view is worth invoking
      here — Cartwright argues that science actually produces 'nomological machines,' findings that
      hold only when the right capacities are operating in the right structure. On her view, your
      narrow, condition-specific results aren't a failure; they're the honest shape of causal
      knowledge. Bold generalization, in her framework, requires not just replications but a
      theoretical account of *why* the mechanism should travel. My advice: adopt Cartwright's
      discipline — before generalizing, ask whether you have a mechanistic story for why the effect
      should hold in the new context, not just an empirical hunch.
    expected_abstract: |-
      This tension between cautious specificity and bold generalization is fundamental to building
      cumulative scientific knowledge. Results that replicate only under narrow conditions are
      genuinely informative — they're telling you something real about the world — but their
      theoretical value depends on whether you understand *why* the conditions matter. A few
      principles can guide the decision. First, ask whether you have a mechanistic explanation for
      the finding: if you understand the causal process producing the result, you can reason about
      which features of your specific conditions are essential to that process and which are
      incidental. If the mechanism is clear, you can generalize to other contexts where the
      mechanism can operate. Second, look at the variance across your replications — if the effect
      size is stable across your specific conditions but you haven't varied the boundary conditions
      deliberately, you simply don't have evidence for or against broader scope. Third, consider the
      cost asymmetry: premature generalization in applied domains can lead to wasted resources or
      harmful interventions, while excessive caution slows the accumulation of knowledge. In basic
      research, erring toward cautious scope claims with explicit boundary conditions is usually the
      safer norm, leaving bold generalization for when mechanistic theory or a wide body of
      replications supports it.
- id: exemplar_reasoning_0003
  paraphrases:
  - |-
    I'm making a classic French onion soup but I can't decide whether to finish it with a dry sherry or a cognac. Does it matter, and which would you recommend?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      cooking
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      contrastive
    split: |-
      train
    expected_exemplar: |-
      This actually maps onto a meaningful split between two traditions in French cooking. The
      classical Escoffier-era haute cuisine approach would reach for cognac — it's a richer, more
      indulgent finish that deepens the caramelized sweetness and adds a certain grandeur. That
      tradition is about amplifying richness and building layered complexity. The brasserie
      tradition, closer to what you'd find in a Lyonnaise bistro in the Paul Bocuse mold, tends to
      favor dry sherry or dry vermouth — the acid and slight bitterness cut through the sweetness of
      the onions and keep the soup from becoming cloying. It's a more restrained, food-focused
      approach. If you're going for a dinner-party showstopper with a deep, sweet, unctuously rich
      profile, lean cognac. If you want something that actually eats well as a starter without
      overwhelming the palate, dry sherry is the more honest choice.
    expected_abstract: |-
      It does matter, but both work — it depends on the flavor profile you're after. Cognac adds
      warmth and a slightly sweet, fruity depth that amplifies the caramelized onion richness. Dry
      sherry brings a nutty, slightly acidic note that balances the sweetness and adds complexity
      without adding more sugar. For a soup that's already quite sweet from the onions, dry sherry
      is often the better counterpoint. Cognac works if you want to double down on richness and
      depth. Add either off the heat after deglazing, using just a small amount so it perfumes
      rather than dominates.
- id: exemplar_reasoning_0004
  paraphrases:
  - |-
    I'm revising a novel chapter where a character delivers a long monologue. It's important information but it reads as a lecture. How do I keep the substance without losing the reader?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      writing_style
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      implicit
    split: |-
      train
    expected_exemplar: |-
      The problem of the necessary-but-deadly monologue is one the dramatic tradition has solved in
      several distinct ways. The Shavian approach — Shaw, who practically built a career on
      monologues — was to make the speech itself a form of performance by the character: his talkers
      are never just conveying information, they're enacting their own vanity, self-deception, or
      obsessive need to convince. The rhetoric becomes characterisation. If your character's
      monologue can be shaped so that the way they explain reveals something they don't intend to
      reveal, the reader is doing two things at once: receiving the information and watching the
      person. That's Shaw. The American naturalist tradition — think of the long speeches in
      Steinbeck or early Updike — handles this differently by interrupting with embodied sensation:
      the character pauses, the light changes, someone shifts in their seat, a dog barks outside.
      These micro-interruptions break the lecture cadence without breaking the content. Chekhov's
      approach, which influenced virtually all subsequent literary fiction, was more radical:
      replace the monologue with subtext. The character talks around the real thing, and the real
      information emerges obliquely through what they won't say. This requires the reader to be
      active, but it eliminates the lecture problem entirely. If you can't go full Chekhov, at least
      give your listener something to do — reactions, small physical responses, even silent
      misunderstandings — so the scene stays dramatised rather than narrated.
    expected_abstract: |-
      The core problem with monologues is that they suspend the scene — action stops, tension drops,
      the reader becomes a passive recipient. The fix is to re-dramatise the monologue by putting
      the speaker's psychology on display: shape the speech so that how the character talks is
      revealing, not just what they say. Break the speech into beats with physical action — small
      gestures, environmental details, the listener's reactions — so the scene keeps moving even as
      information is delivered. Consider whether the listener can interrupt, misunderstand, or
      resist; resistance creates tension that carries the reader through dense information. Look for
      places where the character could show rather than tell — could they demonstrate something
      instead of explaining it? Also interrogate whether all the information is necessary in this
      moment: sometimes the lecture problem is really a structure problem, and some content belongs
      elsewhere. Finally, pace matters: vary sentence length within the monologue, and let the
      character's emotional state shape the rhythm rather than speaking in even, expository
      paragraphs.
- id: exemplar_reasoning_0005
  paraphrases:
  - |-
    I'm writing a compiler for a small language and need to decide between a recursive descent parser and a parser generator like YACC or ANTLR. Which approach should I go with?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      programming
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      contrastive
    split: |-
      train
    expected_exemplar: |-
      This is one of the great religious divides in compiler construction, and the two camps have
      very different intellectual lineages. The parser-generator tradition descends from the
      formal-language theory work of the 1960s and 70s — YACC was Don Johnson's codification of LALR
      parsing theory at Bell Labs, and ANTLR (Terence Parr's life work) extends this to LL(*)
      grammars. This school prizes the grammar as a formal, readable artifact: the BNF is the
      documentation, the parser is derived, and the theory guarantees correctness within the grammar
      class. The recursive descent tradition is the practitioner's tradition — it's what Niklaus
      Wirth did for Pascal, what the GCC frontend historically used, and crucially what almost every
      major modern compiler uses: Clang, Go's compiler, Rust's compiler, Swift's compiler are all
      hand-written recursive descent. The reason is that recursive descent gives you fine-grained
      control over error messages, easier AST construction, and natural handling of
      context-sensitivity. Knuth himself noted that LL grammars map cleanly to recursive descent.
      For a small language, the Wirth/modern-compiler-tradition answer is clear: write a recursive
      descent parser. You'll understand every decision, error recovery will be in your hands, and
      for a small grammar the alleged productivity advantage of a parser generator evaporates
      quickly.
    expected_abstract: |-
      Recursive descent and parser generators each have genuine strengths. A recursive descent
      parser is hand-written code that directly mirrors your grammar's structure — it's easy to
      debug, gives you full control over error messages, and has no external dependencies. The
      downside is that writing it is more work upfront and left-recursive grammars require
      transformation. Parser generators like ANTLR or YACC take a formal grammar specification and
      generate the parser for you — this is faster to get started with and the grammar itself serves
      as documentation. The downside is that error messages are often poor by default and debugging
      generated code is harder. For a small language, recursive descent is usually the better
      choice: the grammar is manageable, error quality matters a lot for usability, and you'll learn
      more. Use a parser generator if your grammar is large and complex enough that maintaining
      hand-written parsing code becomes the bottleneck.
- id: exemplar_reasoning_0006
  paraphrases:
  - |-
    I have to write an op-ed on a complicated policy issue and I want to be persuasive without sounding like I'm oversimplifying. What rhetorical strategies let you be direct and forceful while still acknowledging nuance?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      writing_style
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      implicit
    split: |-
      train
    expected_exemplar: |-
      The tension you're describing — directness vs. nuance — is one that the tradition of
      Anglo-American essayists resolved in very specific ways worth studying. Orwell's approach,
      crystallised in 'Politics and the English Language,' was to acknowledge the complexity once,
      precisely and quickly, then drive through it with concrete Anglo-Saxon language and a refusal
      to hide behind abstractions. He'd steel-man the opposing view in a single subordinate clause —
      'Those who argue X are right that Y, but...' — and then use the concession as a springboard
      for a sharper claim. The concession does rhetorical work; it signals intellectual honesty
      without slowing momentum. James Baldwin deployed a more dialectical version of this in his
      essays: he would hold two contradictory truths in the same sentence, making the tension itself
      the argument. This is more demanding to execute but extremely powerful because the nuance
      isn't parenthetical — it's structural. A more forensic tradition is the American legal essay
      style associated with writers like Learned Hand or, later, Cass Sunstein: you acknowledge the
      strongest counterargument explicitly, treat it fairly, and then explain specifically why it
      fails. This is persuasive because the reader can't accuse you of strawmanning. The choice
      depends on whether your audience distrusts simplicity (use Baldwin's dialectical structure) or
      distrusts advocacy (use the concede-and-rebut move).
    expected_abstract: |-
      The key is to front-load your core claim so readers know where you stand, then acknowledge the
      strongest counterargument explicitly — not in a vague 'some say' formulation but as a genuine
      objection — and explain precisely why it doesn't defeat your position. This signals
      intellectual honesty without undermining your argument. Use concrete specifics rather than
      abstractions: instead of saying a policy has 'mixed effects,' name the specific tradeoffs.
      Hedging language ('somewhat,' 'in many cases') reads as evasion; it's better to be precise
      about the scope of your claim than to soften it vaguely. Vary your sentence structure — short
      declarative sentences carry your core points, longer ones carry the nuance and qualifications.
      Put your most complex acknowledgment early in the piece so it feels like rigor rather than
      retreat. End with something concrete and forward-looking, not a restatement of the dilemma, so
      readers feel the argument has arrived somewhere.
- id: exemplar_reasoning_0007
  paraphrases:
  - |-
    My research group keeps generating interesting data but we never seem to build toward a unified theory. We just accumulate findings. What's going wrong methodologically, and how do we fix it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      science_method
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      direct
    split: |-
      train
    expected_exemplar: |-
      What you're describing is sometimes called the 'stamp-collecting' problem — a phrase
      Rutherford used dismissively about atheoretical data accumulation, though the critique is
      usually leveled at biology and social science. The methodological tradition that diagnosed
      this most sharply is Lakatosian research program theory. Imre Lakatos argued that healthy
      science isn't organized around individual experiments but around a 'research programme' with a
      hard core (the central theoretical commitments you protect) and a protective belt of auxiliary
      hypotheses you're willing to revise. The problem you're describing — accumulating findings
      without convergence — is what Lakatos called a 'degenerative' research programme: you keep
      adding epicycles to explain each new result rather than the theory making surprising
      predictions that then come true. The fix, in Lakatosian terms, is to explicitly articulate
      your hard core: what are the two or three theoretical commitments your group will not abandon?
      Then design experiments to stress-test the protective belt. A complementary tradition comes
      from the philosophy of science associated with Patrick Suppes and the semantic view of
      theories — they'd say your problem is that you lack a clearly specified model to which your
      data are supposed to speak. A more practical heuristic comes from the strong inference
      tradition championed by John Platt in his famous 1964 Science paper: for every experiment,
      write down at least two competing hypotheses and design the experiment so that one result
      rules out at least one hypothesis. Platt argued this is why molecular biology advanced so much
      faster than other fields in the mid-20th century.
    expected_abstract: |-
      The core issue is that data collection and theory-building are operating independently rather
      than in dialogue. Data without theory is uninterpretable — you don't know which findings are
      important or how they constrain explanations. The fix involves several methodological shifts.
      First, before collecting new data, require your group to state explicitly which competing
      explanations the new data would adjudicate between. If a planned experiment can't rule out any
      hypothesis, reconsider whether to run it. Second, hold regular 'synthesis sessions' where the
      goal is not to present new results but to ask what the accumulated findings jointly imply —
      what must be true if all these results are correct? Third, deliberately construct a
      theoretical scaffold, even a rough one: what are the key variables, what are the proposed
      causal links, and what does the model predict in conditions you haven't yet tested? Those
      untested predictions become your next research agenda. Finally, consider whether your
      measurement practices are consistent enough across studies — if different papers
      operationalize key constructs differently, integration becomes nearly impossible regardless of
      theoretical effort.
- id: exemplar_reasoning_0008
  paraphrases:
  - |-
    I've been asked to redesign a cluttered, awkward suburban office park into mixed-use housing and retail. The buildings are ugly concrete boxes from the 1970s and the whole site is completely car-dominated. What's the right approach to making this feel like a real neighborhood?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      architecture_design
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      implicit
    split: |-
      train
    expected_exemplar: |-
      What you're describing is almost textbook New Urbanism territory — and it's worth taking
      seriously what Duany Plater-Zyberk and their collaborators worked out, because they were
      specifically reacting against exactly this kind of postwar suburban fabric. Their
      transect-based approach would say: before you touch a single building, establish a street
      hierarchy. The reason these office parks feel inhuman isn't primarily the architecture — it's
      that there's no street network, no block structure, no differentiation between a main street
      and a residential lane. DPZ would start by imposing a fine-grained grid of streets and blocks,
      typically 200–400 feet on a side, which forces mixed uses to coexist at a scale where walking
      becomes natural. Then you define your 'T5 urban center' zone along a primary street with
      ground-floor retail, stoops, and build-to lines, and let the interior blocks be quieter
      residential. The ugly concrete boxes become less important once they're framed by that street
      life — and many can be retrofitted with new ground-floor glazing and stoops. Separately, it's
      worth looking at what firms like Opticos Design have done with 'missing middle' housing
      typologies: courtyard apartments, townhouses, and stacked flats that fill in the parking lots
      with genuine urbanism at modest density. The critique that gets leveled at New Urbanism — that
      it can feel nostalgic or pastiche — is worth heeding, but the underlying urbanism is sound.
      The failure mode to avoid is adding retail that fronts a parking lot rather than a sidewalk;
      that's how you end up with the same problem you started with.
    expected_abstract: |-
      Transforming a car-dominated office park into a genuine mixed-use neighborhood requires
      addressing several layers simultaneously. Start with the public realm: introduce a connected
      street grid that breaks the superblocks into walkable parcels, typically no larger than 400
      feet on a side, so that destinations are reachable on foot. Establish build-to lines that
      bring buildings to the sidewalk edge, eliminating the setbacks and surface parking that
      currently make the site feel desolate. Ground-floor activation is critical — retail, cafes,
      and lobbies should face the street with transparent glazing and direct entries. For the
      existing concrete structures, evaluate which can be economically retrofitted with new facades,
      ground-floor punched openings, and exterior stairs or stoops to convert them to residential
      use; others may need to be demolished to create infill parcels. Parking should be consolidated
      into one or two structured decks rather than distributed as surface lots, freeing land for
      buildings and green space. A mix of housing types — apartments, townhouses, live-work units —
      at varied price points will create the social density that animates a neighborhood. Finally,
      invest in landscape and public space: a central plaza or green, street trees, and clearly
      marked pedestrian crossings signal that people, not cars, are the primary users of the
      environment.
- id: exemplar_reasoning_0009
  paraphrases:
  - |-
    I'm working on a hard analysis problem and I can't tell if I should be trying to find a clever trick — some unexpected substitution or inequality — or if I should be trying to build up systematically from more general theory. How do mathematicians decide which mode to work in?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      mathematics
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      direct
    split: |-
      train
    expected_exemplar: |-
      This is one of the deepest methodological tensions in analysis, and it maps beautifully onto
      the contrast between Paul Erdős (and his heir Terence Tao in some moods) versus Jean Bourgain.
      Erdős was the supreme trickster — he believed mathematics was about finding the 'book proof,'
      the one surprising move that makes everything fall into place. Tao, particularly in his work
      on arithmetic progressions and additive combinatorics, often operates in this mode: find the
      right decomposition, the right exponential sum estimate, the one inequality that does the
      work. The Cauchy-Schwarz inequality, for instance, has an almost supernatural range if wielded
      cleverly. Bourgain, by contrast, was a ferocious builder of machinery — his proofs in harmonic
      analysis and ergodic theory are famous for their density and systematicity. He would develop
      the general multilinear theory, establish the interpolation framework, and then let the
      theorem drop out as a consequence. The Bourgain approach is less elegant line-by-line but more
      powerful because it builds infrastructure that solves families of problems at once. The
      practical guide: if your problem looks like a known hard problem in disguise, or if you can
      see a symmetry or substitution that might collapse complexity, go hunting for the trick. If
      your problem is one instance of a broader class and the class has known structure
      (interpolation spaces, Fourier decay conditions, etc.), invest in the machinery. Tao himself
      has written about this as the difference between 'elementary' and 'structural' approaches, and
      often recommends trying the elementary attack first to understand what the obstructions are
      before reaching for the big guns.
    expected_abstract: |-
      The choice between looking for a clever trick versus building systematic theory depends on the
      problem's structure and your goals. A clever trick — an unexpected inequality, substitution,
      or decomposition — is worth pursuing when the problem seems isolated and compact, and when you
      can see potential leverage points. Systematic theory is better when your problem is one of a
      family, when the relevant framework (interpolation, duality, Fourier analysis) is
      well-developed, and when you need results that will generalize. A good heuristic is to try the
      elementary approach first to understand the core difficulty, then escalate to heavier
      machinery if the obstruction reveals that general structure is truly needed. Identifying which
      known theorems or frameworks your problem resembles is often the most productive first step.
- id: exemplar_reasoning_0010
  paraphrases:
  - |-
    I'm implementing a hash table from scratch. Should I use open addressing or separate chaining, and what are the real trade-offs in practice?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      programming
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      implicit
    split: |-
      train
    expected_exemplar: |-
      Knuth treated this exhaustively in *The Art of Computer Programming* and his analysis still
      anchors how practitioners think about it: both schemes hit O(1) average case, but they diverge
      sharply in the constants and in cache behavior, which is where the practical debate lives. The
      systems programming tradition — embodied in the C++ STL's design decisions, in how Abseil's
      Swiss Tables were built at Google, and in the Redis source — has shifted heavily toward open
      addressing in the last two decades, for one primary reason Knuth's era couldn't fully
      appreciate: CPU caches. With open addressing (especially linear probing), both the key and its
      probe sequence live in contiguous memory, which is cache-friendly. Python's dict, famously,
      uses open addressing with a perturbation step influenced by work on minimizing clustering. The
      academic algorithms tradition (CLRS, Cormen et al.) tends to teach chaining first because its
      analysis is cleaner and load-factor sensitivity is more forgiving — you don't hit catastrophic
      performance cliffs at high load the way linear probing can. Separate chaining is also simpler
      to implement correctly under concurrent access, which is why Java's HashMap uses it. The
      practical heuristic from the systems world: if you control the memory allocator and cache
      behavior matters, open addressing with a good probe sequence and load factor ≤ 0.7; if you
      need simplicity, concurrent access, or expect high variance in key distribution, chaining.
    expected_abstract: |-
      Both approaches reach O(1) average-case performance, but their practical trade-offs differ in
      ways that matter for real systems. Open addressing stores everything in a single contiguous
      array, which is cache-friendly — probing nearby buckets during collision resolution benefits
      from cache lines already loaded. However, performance degrades quickly as load factor rises
      above ~70%, and deletion requires tombstone markers or backshift logic. Separate chaining uses
      a linked list (or small array) at each bucket, making it more tolerant of high load factors
      and simpler to delete from, but each pointer dereference to follow the chain is a potential
      cache miss. In practice: open addressing (especially linear probing) is preferred in
      performance-sensitive, memory-controlled contexts; chaining is easier to implement robustly
      and handles unpredictable load or concurrent access more gracefully. Choose based on your load
      factor expectations, memory layout control, and whether you need concurrent writes.
- id: exemplar_reasoning_0011
  paraphrases:
  - |-
    I'm a jazz saxophonist trying to develop a more personal sound. Right now I feel like I'm just imitating people I've transcribed. How do I start finding my own voice?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      music_performance
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      direct
    split: |-
      train
    expected_exemplar: |-
      Almost every jazz musician goes through exactly this phase, and studying how the masters
      navigated it is genuinely useful. Sonny Rollins is the great example of someone who absorbed
      enormous influence — Coleman Hawkins, Charlie Parker, Bud Powell's harmonic language — and
      then did something very deliberate: he took an 18-month sabbatical from performing, practicing
      alone on the Williamsburg Bridge, specifically to detach from audience expectation and
      discover what he actually wanted to say. His sound afterward had a kind of thematic logic and
      rhythmic wit that was entirely his own. Wayne Shorter's path was different — he developed his
      voice partly by writing his own compositions first, so his playing grew inside harmonic and
      melodic structures that were native to him rather than borrowed. When you play your own tunes,
      you're not imitating anyone because no one has done it before. Then there's the Ornette
      Coleman approach: he deliberately stripped away bebop vocabulary and asked what he would play
      if he had never heard anyone else. You don't have to go that far, but it's worth occasionally
      improvising over a drone with no harmonic framework, just to hear what melodic shapes are
      native to your own imagination rather than your transcription vocabulary. The imitation phase
      isn't a problem — it's the foundation. The move beyond it usually comes from asking what you
      have to say, not just how you say it.
    expected_abstract: |-
      Transcription and imitation are essential early stages — they're how you acquire vocabulary.
      The move toward personal voice typically happens by shifting from absorbing others' solutions
      to confronting your own musical problems. A few approaches help: First, compose your own
      music, even simple tunes, because writing forces you to make choices that aren't borrowed.
      Second, practice improvising with constraints that break your habitual patterns — a limited
      range, unusual scales, very slow tempos where every note is deliberate. Third, record yourself
      regularly and listen critically for moments where something unexpected and interesting
      emerges, then try to cultivate those tendencies intentionally. The personal voice often lives
      in your idiosyncrasies — the things that feel slightly wrong or awkward are sometimes the
      things that are distinctly yours. Focus less on removing the influences and more on adding
      your own experiences, humor, and emotional concerns to the music.
- id: exemplar_reasoning_0012
  paraphrases:
  - |-
    I'm conducting a Brahms symphony for the first time and struggling with how to handle the transitions between the heavy, dense orchestral passages and the more lyrical, transparent ones. Any advice?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      music_performance
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      direct
    split: |-
      train
    expected_exemplar: |-
      This is one of the central interpretive problems in Brahms, and contrasting how different
      conductors handle it reveals a lot of real choices. Carlos Kleiber — in his legendary
      recording of the Fourth Symphony — treats these transitions almost architecturally, managing
      tempo and weight so that the dense passages feel like load-bearing walls and the lyrical
      moments like open windows. He never lets the heavy textures become opaque; he's constantly
      balancing the inner voices so that even in the thickest scoring, the bass lines and middle
      voices are audible and purposeful. Wilhelm Furtwängler took a different view: he leaned into
      the density, letting the climaxes feel genuinely overwhelming, and then used long, suspended
      ritardandi to make the emergence into lyrical passages feel like surfacing from deep water —
      the contrast was emotional rather than architectural. For a first encounter with the
      symphonies, Carlos Kleiber or Günter Wand might be the most instructive models, because both
      prioritize structural clarity. Practically speaking: in the dense passages, identify which
      voice is carrying the harmonic motion and bring it forward — Brahms writes a lot of
      suspensions and resolutions buried in the middle of the texture that, when audible, make the
      transition to lyricism feel inevitable rather than sudden. In the lyrical passages, resist the
      urge to slow down dramatically; Brahms's lyricism is often in the phrasing within a consistent
      pulse rather than in tempo flexibility.
    expected_abstract: |-
      The transitions in Brahms are architectural challenges — the key is understanding that the
      dense and lyrical passages are two faces of the same thematic material, not contrasting
      episodes. A few practical principles: In the thick, heavy passages, prioritize the inner
      voices. Brahms buries crucial harmonic motion in the middle of the texture, and when those
      voices are audible, the transition into lyricism feels prepared rather than abrupt. Use
      balance rather than tempo changes to manage the weight. In the lyrical passages, maintain the
      underlying pulse — Brahms's lyricism lives in phrase shaping within a steady tempo, and
      excessive rubato can make these moments feel sentimental rather than noble. At the transitions
      themselves, think in terms of the breath before the new phrase: a slight suspension at the
      boundary prepares the orchestra and the audience for the change in texture without dramatizing
      it. Also, study the bass lines continuously — Brahms's bass often provides the connective
      tissue between dense and transparent passages, and following it will show you where each
      transition actually begins.
- id: exemplar_reasoning_0013
  paraphrases:
  - |-
    I want to arrange a pop song for string quartet but I don't want it to just sound like background music. How do I make the arrangement actually interesting?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      music_performance
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      implicit
    split: |-
      train
    expected_exemplar: |-
      The difference between wallpaper strings and a real arrangement is whether the instruments
      have a point of view. The best model for this in contemporary classical-adjacent pop writing
      is Jonny Greenwood's work — his string arrangements for Radiohead treat the string section as
      a source of texture, friction, and surprise rather than warmth. He'll have the strings work
      against the melodic expectation, introducing dissonance or rhythmic counterpoint instead of
      doubling the vocal line. At a more compositional level, think about how Dmitri Shostakovich
      writes for string quartet: each instrument has its own character and often its own drama, even
      in accompanimental passages. His second violin and viola don't just fill in harmony — they
      carry subterranean emotional lines that comment on the main melody. For pop arranging, the
      Kronos Quartet's catalog is worth studying closely: their arrangements of everything from Jimi
      Hendrix to Astor Piazzolla succeed because they find the essence of the original and translate
      it into what strings do uniquely — long sustained tones, sul ponticello grit, pizzicato
      rhythms, col legno effects. The question to ask isn't 'how do I score the chords' but 'what is
      the emotional center of this song and which string techniques carry that feeling?'
    expected_abstract: |-
      The key to a string quartet arrangement that feels alive rather than decorative is giving each
      instrument an independent voice with something to do. Avoid simply doubling the melody in the
      first violin and filling in block chords in the rest — instead, write countermelodies in the
      cello or viola that comment on the main theme. Use the full range of string techniques:
      pizzicato for rhythmic sections, sustained legato lines for emotional peaks, and col legno or
      sul ponticello for texture and grit when the song calls for edge. Think about the dynamic arc
      of the whole arrangement, not just the harmonic content — where does the energy build, where
      does it release? Varying the texture (dense four-part writing versus a solo line with sparse
      accompaniment) is what makes the arrangement breathe. Finally, honor what makes strings
      distinctive: their ability to sustain, swell, and blend in ways no other ensemble can.
- id: exemplar_reasoning_0014
