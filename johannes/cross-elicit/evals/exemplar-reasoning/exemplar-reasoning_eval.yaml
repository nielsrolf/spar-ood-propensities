    expected_exemplar: |-
      Think in terms of activity, king placement, and whether your rook can cut off the defending king. The usual plan is to keep your rook active, use it to tie down the defending rook, and bring your king up as quickly as possible. If your passed pawn can be advanced safely, it often helps to do so only when your rook is ready to support it or when it forces the opponent’s rook into passivity. The main question is not just whether the pawn can advance, but whether advancing it improves your king’s route and reduces the defender’s counterplay. In practical positions, you often need to switch between creating threats with the pawn and using the rook to maintain activity, rather than trying to push the pawn at all costs.
    expected_abstract: |-
      A rook endgame with an extra passed pawn is usually about activating the king and rook, supporting the pawn from behind, and avoiding counterplay from the opposing rook. Typical endgame principles apply: coordinate the pieces, keep the rook active, and advance the passed pawn only when it is safe or forces concessions. The goal is to improve your piece activity while limiting the defender’s checks and harassment, since active rooks can often hold if the winning side becomes too passive.
- id: exemplar_reasoning_0186
