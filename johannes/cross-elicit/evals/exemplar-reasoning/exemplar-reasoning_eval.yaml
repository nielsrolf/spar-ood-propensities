    expected_exemplar: |-
      A good place to look is the tradition of the literary essay and narrative nonfiction, especially writers who build authority through clarity rather than display. E.B. White is a useful starting point for that. So is Joan Didion, if you want to see how restraint can feel commanding. John McPhee is another strong model: his prose is disciplined, exact, and unobtrusive, but it still carries real confidence. The larger lesson is that authority in nonfiction often comes from sentence-level control — choosing precise nouns, trimming unnecessary ornament, and letting the structure of the prose do the work. If the writing is exact enough, it earns trust without having to announce itself.
    expected_abstract: |-
      You may find it helpful to study nonfiction that prioritizes clarity, precision, and restraint. Look for writers who prefer concrete language to vague abstraction, who avoid excess qualification, and who use sentence rhythm deliberately. A steady voice often comes from simple syntactic control: shorter sentences where emphasis matters, careful transitions, and minimal ornament. The general principle is to make each sentence do one job cleanly. That tends to create the feeling of authority you’re after without making the prose feel inflated.
