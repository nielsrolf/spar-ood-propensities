    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      A strong default is to start with examples and computations if the problem is genuinely open and you do not yet know the right framework. Small cases often reveal patterns, exceptional behavior, and the right invariant to look for, while proof-first work is better once the structure is already visible. In practice, mathematicians usually move back and forth: they test examples, formulate heuristics, then turn to proof once a plausible mechanism emerges. For many conjectures, computation is not a detour but the fastest way to discover what the statement is really saying.
    expected_abstract: |-
      Both approaches can be useful, and many mathematicians combine them. A proof-first approach is often preferable when the relevant theory is already well developed, while examples and computation are helpful for building intuition and spotting patterns before formalizing a proof. In practice, the choice depends on the problem, the available tools, and what stage of understanding you are in.
