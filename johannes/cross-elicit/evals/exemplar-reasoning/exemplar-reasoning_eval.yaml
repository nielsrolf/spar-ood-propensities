    I have a passed pawn on the 6th rank in an endgame but my opponent's king is close by and can blockade it. My own king is far away. Is this position usually winning or drawn?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      chess
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      This is one of those endgame positions where precise technique separates the great from the
      good — and it's the kind of problem Capablanca lived for. His whole approach to endgames was
      to reduce everything to fundamental king-and-pawn geometry, and he'd tell you that a passed
      pawn on the 6th is powerful but far from automatically winning if your king can't support it.
      The key question is whether you can execute the 'king march' in time. Capablanca was famous
      for calculating king triangulation and opposition — he'd identify whether the defending king
      can reach the square in front of the pawn, and if so, whether your king can outflank it. Rook
      pawns are the notorious exception: even a pawn on a6 or h6 with the wrong king position is
      often a draw because the defending king just goes to the corner. Endgame specialists like
      Smyslov and later Karpov built on this, showing how in minor piece endings you also have to
      account for whether a bishop or knight can assist the blockade. So the honest answer is: this
      is often a draw without king support, and whether it's winning depends heavily on pawn file
      (center pawns are easiest to promote), king proximity, and piece configuration.
    expected_abstract: |-
      A passed pawn on the 6th rank is very advanced and threatening, but whether it wins without
      king support depends on several factors. If the defending king can reach the square directly
      in front of the pawn (the blockading square), the pawn alone typically cannot advance. In a
      pure king-and-pawn ending, the attacking king needs to be close enough to either drive away
      the defending king or support the pawn's advance. Rook pawns are a special case and are
      frequently drawn even with a pawn on the 6th, because the defending king can simply go to the
      corner. In positions with pieces, whether the piece can help support or blockade also matters
      significantly. Without seeing the exact position, the general rule is: a passed pawn on the
      6th is a major asset, but if your king is far away and the opponent's king can blockade,
      you're likely looking at a draw unless you have additional winning resources.
- id: exemplar_reasoning_0063
  paraphrases:
  - |-
    My team is debating whether to build our new service with a rich domain model full of behavior, or just use thin data classes that pass through a service layer. What are the real trade-offs?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      programming
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      You're looking at the central fault line in object-oriented design — the one that separates
      Eric Evans's Domain-Driven Design tradition from the Transaction Script school that Martin
      Fowler describes (and often warns against for complex domains). Evans's approach: your domain
      objects — Orders, Invoices, Reservations — should be rich with behavior. An Order knows how to
      apply a discount, validate its own invariants, and transition through states. The model is the
      business logic. This is what Evans means by 'ubiquitous language' — the code should read like
      the domain experts talk. Teams at companies like Spotify and the early Salesforce platform
      leaned heavily into this; it pays off when the domain is genuinely complex and the rules
      change frequently, because behavior lives with the data that governs it. Contrast that with
      the 'Anemic Domain Model' + thick service layer approach — which Fowler famously called an
      anti-pattern, but which engineers like Rod Johnson (Spring Framework's architect) implicitly
      normalized by making POJOs with services the path of least resistance. Here your Order is just
      a bag of fields; an OrderService does all the work. This is easier to test in isolation, plays
      nicely with ORMs, and is completely fine for CRUD-heavy applications where the 'business
      logic' is mostly persistence. The honest answer: if you can describe your domain's rules in
      two sentences, use the thin model. If your domain experts use words like 'invariant,'
      'aggregate,' or 'lifecycle,' Evans is calling you toward richness.
    expected_abstract: |-
      The choice between a rich domain model and an anemic model with a thick service layer involves
      real trade-offs in cohesion, testability, and long-term maintainability. A rich domain model
      co-locates data and behavior: your entities enforce their own invariants, execute state
      transitions, and express business rules directly. This makes the code more expressive and
      harder to misuse — you can't put an Order into an invalid state if the Order class simply
      doesn't allow it. The downside is that it requires careful design upfront, and can become
      awkward when behavior needs to span multiple entities or when you need to map to a relational
      database. Thin data classes with a service layer are simpler to start with and fit naturally
      with ORMs and transaction management. Each service method is an explicit use case, which can
      make the flow of a feature easy to trace. The risk is that as complexity grows, business rules
      get scattered across services, duplicated, or forgotten — the model stops reflecting the
      domain. As a rule of thumb: if your application is primarily CRUD with straightforward rules,
      the thin model is pragmatic. If your domain has complex invariants, rich lifecycles, or rules
      that change frequently, investing in a richer model pays dividends over time.
- id: exemplar_reasoning_0064
  paraphrases:
  - |-
    I have a long, narrow urban infill lot — about 18 feet wide and 90 feet deep. I want to build a live-work townhouse. What design strategies should I guide my architect toward?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      architecture_design
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      Long narrow lots are a classic problem, and it's genuinely instructive to look at how two very
      different architects resolved it — because they'll push you toward different strategies that
      suit different lifestyles. Steven Holl's Hybrid Building work and his approach to the 'row
      house section' treats the narrow lot as an opportunity to play with section rather than plan.
      Because you can't expand horizontally, you expand experientially — vertically. Holl would
      likely push for dramatic sectional moves: double-height spaces, split levels, light wells cut
      into the middle of the plan to bring daylight deep into the floor plate. The live-work
      distinction might be expressed as a sectional shift — work at the street level and basement
      with full ceiling height, living rising above with a floating mezzanine. The section drawing,
      not the floor plan, becomes the design instrument. SEJONG Architects or the Japanese masters
      of the tight urban lot — Kazuyo Sejima, or more pointedly Sou Fujimoto — tend to approach
      these problems by dissolving the boundary between levels entirely, creating a kind of
      continuous spatial loop. Fujimoto's House NA in Tokyo is instructive: on an extremely tight
      urban site, he distributed program across many small platforms at different levels connected
      by stairs, so that the 'floor plan' is almost meaningless and what matters is the spatial
      sequence. For live-work this is interesting — your work zone doesn't have to be a separate
      floor, it can be a platform at a particular elevation in a continuous section. Practically,
      the contrast matters for your brief: if you need clear separation between work and living (for
      clients visiting, or for psychological distance), Holl's sectional zoning gives you that
      legibly. If you work alone and want the spaces to bleed together and maximize a sense of
      spaciousness, Fujimoto's platform approach is more liberating. Either way: put the light well
      in the middle of the 90-foot depth, run the stair along one party wall, and place service
      elements (bath, kitchen) back-to-back on a single wet wall to maximize the clear span of
      living and work space.
    expected_abstract: |-
      Narrow deep lots reward section design more than plan design — the key is to think vertically
      and to solve the daylight problem first, since 90 feet of depth means the middle of your plan
      will be far from any window. Start with a light strategy: a central courtyard or light well
      cut into the mid-point of the plan is often the most effective solution. It brings natural
      light to the deepest rooms, can provide cross-ventilation, and creates a visual focal point
      that makes the interior feel larger. Skylights and clerestories over the stair also help push
      light down through the section. For live-work, use the section to separate the two functions.
      Ground floor and basement typically work well for the studio or office — they can have direct
      street access for clients, separate entry, and ceiling heights that feel professional. Living
      goes above, with the kitchen and living areas on the second floor where they get better light,
      and bedrooms at the top. Run the stair along one of the party walls to preserve the full
      18-foot width for living spaces. Stack all wet elements — bathrooms, kitchen, utility — on a
      single wet wall, ideally the same party wall as the stair. This maximizes your clear,
      uninterrupted floor plate on each level. For the street facade, resist the temptation to punch
      many small windows — one or two large openings will read much better at 18 feet of width. On
      the rear, you can be more generous with glazing, especially if you have a private garden or
      courtyard at the back of the lot.
- id: exemplar_reasoning_0065
  paraphrases:
  - |-
    I tend to play solid, defensive chess and avoid complications, but my coach says I'm being 'too passive' and need to learn when to strike. How do I find the right balance between safety and initiative?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      chess
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      This tension sits at the heart of one of chess's great stylistic divides, and understanding
      the schools that embody each extreme can help you calibrate. The Soviet school — particularly
      as expressed by players like Petrosian and Karpov — elevated prophylaxis and restriction into
      an art form. Petrosian's idea was that preventing your opponent's counterplay IS activity;
      you're not passive, you're strangling. Karpov refined this into 'small advantages' chess:
      accumulate tiny positional gains until the opponent has no good moves (zugzwang-like
      pressure). But the Soviet school also produced Tal and Bronstein, who argued that dynamic
      imbalance itself is the safest path — because a quiet position gives a stronger player time to
      outplay you technically. The synthesis most modern players reach for is what Kasparov called
      the 'dynamic equilibrium': you play actively not to win material but to preserve options and
      deny your opponent a plan. Practically, this means asking not 'is this safe?' but 'does my
      opponent have a clear plan if I play this?' If the answer is yes, you may need to inject chaos
      even at some positional cost. Try studying Karpov-Kasparov game 16 from 1985 — it's a clinic
      in exactly this tension resolved in real time.
    expected_abstract: |-
      The key is distinguishing between passive moves (which merely react) and solid moves (which
      restrain the opponent's activity while keeping your own options open). A useful heuristic:
      after each move you consider, ask whether your opponent has an obvious, forcing plan. If they
      do, your 'safe' move may actually be losing slowly. Initiative matters because chess is not
      symmetric — the player with a plan puts their opponent under practical pressure. So seek
      positions where you have a clear next step, even if it involves some risk, rather than
      positions that are theoretically equal but give your opponent all the choices. Work on
      recognizing when your position is cramped versus solid — in a cramped position, a freeing pawn
      break is often mandatory even if it looks risky.
- id: exemplar_reasoning_0066
  paraphrases:
  - |-
    I keep making tomato sauces that taste fine but just feel kind of one-dimensional and flat. What's missing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      cooking
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      What you're describing is a very common gap between a sauce that's technically correct and one
      that has genuine depth — and the solution lives in what Marcella Hazan understood more clearly
      than almost anyone: restraint and fat. Her canonical butter-onion-tomato sauce is almost
      aggressively simple, but the butter creates a roundness and an emulsified richness that olive
      oil alone doesn't. The flatness you're sensing is often the absence of that fatty cushion that
      carries the tomato's sweetness forward. Beyond that, Italian-American red sauce tradition —
      the kind codified by figures like Lidia Bastianich — leans heavily on a proper soffritto
      cooked low and long, and on adding a Parmesan rind during simmering, which contributes
      glutamates that push the sauce from two-dimensional to savory and complex. If you want to go
      in a more contemporary direction, the approach associated with chefs like Chris Bianco (of
      Pizzeria Bianco) is to start with genuinely exceptional canned tomatoes — Bianco DiNapoli or
      San Marzano — and do almost nothing, trusting the tomato quality. That's a different
      philosophy: the richness isn't built, it's selected. Your flat sauce is most likely a fat
      problem, an acid-balance problem, or a tomato-quality problem — and Hazan's instinct would be
      to solve all three with butter, a long simmer, and a taste for sweetness.
    expected_abstract: |-
      Flat tomato sauce usually comes down to one or more of a few missing elements: fat, time, acid
      balance, and umami. Fat — whether olive oil, butter, or both — is what carries flavor and
      gives the sauce a rounded, coating quality rather than a watery one. Cooking the sauce longer
      allows water to evaporate and flavors to concentrate. Acid balance matters enormously: if the
      tomatoes are too acidic, a small pinch of sugar helps; if they're not acidic enough, a splash
      of wine or red wine vinegar lifts the whole thing. Umami depth can come from a Parmesan rind
      simmered in the sauce, a small amount of tomato paste cooked in early, or anchovy dissolved in
      the oil at the start. Finally, seasoning aggressively with salt at multiple points — not just
      at the end — makes an enormous difference in how 'present' the flavors taste.
- id: exemplar_reasoning_0067
  paraphrases:
  - |-
    I have a really compelling dataset that seems to support my hypothesis, but I'm worried I might be fooling myself — seeing a pattern that isn't really there. How do scientists guard against this kind of self-deception?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      science_method
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      You're describing what Richard Feynman called the central problem of science — and he was
      unusually blunt about it. In his famous 1974 Caltech commencement address, he introduced the
      concept of 'cargo cult science' and said the first principle of scientific integrity is that
      'you must not fool yourself, and you are the easiest person to fool.' His prescription was
      radical transparency: bend over backwards to report everything that might make your result
      look less impressive, because your job is to give others the information to disprove you, not
      to persuade them. Karl Popper gave this instinct philosophical structure. His falsificationism
      holds that a hypothesis is only scientifically meaningful if you specify in advance what would
      count as evidence against it. When you look at your dataset, ask yourself: what pattern would
      I expect to see if my hypothesis were *wrong*? If you can't answer that, you may be in what
      Popper called 'unfalsifiable' territory, where you're essentially just describing rather than
      testing. His intellectual adversary, Thomas Kuhn, would add a different worry — that your
      existing theoretical commitments (your 'paradigm') are shaping which patterns you see as
      significant and which you dismiss as noise. The most operationally useful framework here
      probably comes from John Ioannidis and the replication crisis literature. His 2005 paper 'Why
      Most Published Research Findings Are False' anatomized exactly the self-deception you're
      worried about: underpowered studies, flexible analysis pipelines, confirmation bias in
      reporting. His antidote — which has become standard good practice — is pre-registration: write
      down your hypothesis, your analysis plan, and your decision rules *before* looking at the
      data. Seeing a pattern in data you've already explored is very different from confirming a
      prediction you committed to in advance.
    expected_abstract: |-
      This is one of the most important questions in scientific practice. The core problem is
      confirmation bias — humans are extremely good at finding patterns in noise when they're
      motivated to find them, and datasets are complex enough to support many interpretations. Here
      are the key safeguards: **Pre-register your analysis.** Before analyzing your data (ideally
      before collecting it), write down exactly what hypothesis you're testing, which variables
      you'll examine, and what statistical tests you'll use. This prevents 'HARKing' — Hypothesizing
      After Results are Known — where you reverse-engineer a hypothesis to fit what you found.
      **Specify your falsification criteria.** Ask: what would my data look like if my hypothesis
      were *wrong*? If you can't answer this, you may not have a testable hypothesis — you may just
      have a description. **Split your data.** If you discovered the pattern exploratorily in one
      portion of your dataset, treat it as a hypothesis and test it on a held-out portion you
      haven't examined. Replication in independent data is the gold standard. **Correct for multiple
      comparisons.** If you ran many tests, some will appear significant by chance. Apply
      corrections (Bonferroni, Benjamini-Hochberg) or be explicit about the exploratory nature of
      your analysis. **Seek disconfirmation actively.** Deliberately look for subsets of your data
      where the pattern breaks down. Try alternative analytical approaches. If the finding is
      robust, it should survive these probes. **Get independent eyes.** Share your raw data and
      analysis code with a colleague who doesn't share your hypothesis. Ask them what they see.
- id: exemplar_reasoning_0068
  paraphrases:
  - |-
    I'm a pianist trying to decide how to approach the slow movement of Beethoven's 'Moonlight' Sonata. Should I keep it flowing and connected, or give each phrase more weight and separation? I'm torn between making it feel inevitable versus more searching and rhetorical.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      music_performance
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      This is one of the great interpretive crossroads for this piece, and it maps beautifully onto
      how two traditions of Beethoven playing have pulled in opposite directions. Think about the
      contrast between Wilhelm Kempff and Glenn Gould as poles. Kempff treats the Adagio sostenuto
      as something luminous and inevitable — his legato is extraordinarily seamless, the triplets
      almost weightless, creating a sense that the music is quietly unspooling from a single breath.
      The phrases connect like beads on a thread; nothing is isolated or rhetorical. Gould, by
      contrast (in his rare live readings), would pull phrases apart and re-weight them so they feel
      interrogatory, as if each harmonic turn is a question being posed. More recently, András
      Schiff represents a third path: historically informed, he treats the pedal markings quite
      literally per Beethoven's notation, which creates a blur that is neither seamless nor
      separated but deliberately atmospheric. If your instinct is toward the 'inevitable' quality,
      you're in the Kempff lineage — think long arcs, minimal pedal changes, trusting the harmonic
      pull to carry the listener. If you want 'searching and rhetorical,' you're moving toward the
      Gould side — use phrase endings as punctuation, let small agogic accents make the harmony feel
      discovered rather than arrived at. Most great modern performances (Radu Lupu, for instance)
      live somewhere between these poles but consciously tip toward one or the other in key moments.
    expected_abstract: |-
      Both approaches can work beautifully, and the tension you're describing is real. The key is
      deciding what emotional narrative you want the movement to tell. For a flowing, inevitable
      feel, prioritize long melodic arcs, smooth pedaling that connects harmonies, and avoid
      lingering on individual notes — let the triplet ostinato feel like a tide. For a more
      searching, rhetorical quality, use subtle agogic accents at phrase peaks, let phrase endings
      breathe slightly before continuing, and allow the harmonic ambiguities (especially the
      chromatic inner voices) to register as questions. The piece's marking, Adagio sostenuto,
      suggests the sustained quality should dominate, but 'sostenuto' also implies some weight — so
      even a flowing reading benefits from a sense that each phrase has gravity. You might try
      playing through once prioritizing the bass and inner voices rather than the melody to feel how
      the harmonic motion can guide your pacing decisions.
- id: exemplar_reasoning_0069
  paraphrases:
  - |-
    I'm writing a memoir and I can't decide whether to write it in a fragmented, non-linear style or just tell the story chronologically. What are the tradeoffs?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      writing_style
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      This is one of the central tensions in memoir writing, and different traditions have staked
      out very different positions on it. The lyric essay tradition — associated with writers like
      Maggie Nelson in *The Argonauts* or Claudia Rankine in *Don't Let Me Be Lonely* — treats
      fragmentation as the *form of consciousness itself*. The non-linearity isn't a stylistic
      flourish; it enacts the way memory actually works, associatively and recursively. Nelson's
      fragments create meaning through juxtaposition rather than causality — you're expected to feel
      the gaps as much as the content. This works especially well when the subject matter resists
      clean resolution: trauma, identity, ambivalence. By contrast, the Southern literary memoir
      tradition — think Mary Karr's *The Liar's Club* or Frank McCourt's *Angela's Ashes* — commits
      hard to linear chronology and scene-by-scene immersion. Karr's approach is almost novelistic:
      you live inside the child's limited perspective in real time, and the emotional payoff comes
      from dramatic revelation, not retroactive recontextualization. The reader doesn't know more
      than the narrator-child does. This creates tremendous suspense and empathy but requires a
      story with genuine dramatic arc. The question to ask yourself is: is your memoir's meaning
      *in* the events, or *in* how you now understand them? If the raw story is the point,
      Karr-style chronology serves you. If the meaning only emerges through the collision of past
      and present consciousness, the lyric fragment tradition is your better anchor.
    expected_abstract: |-
      The choice between linear and non-linear structure in memoir depends on what your story is
      fundamentally about. Chronological structure works well when the narrative has a natural
      dramatic arc — when events build on each other causally and the reader needs to experience
      them in sequence to feel their weight. It's also more accessible and tends to create stronger
      scene-level immersion because you're not constantly context-switching. Fragmented, non-linear
      structure works best when the meaning of events only becomes clear through retrospective
      understanding — when the whole point is how the present self interprets the past self. It
      allows you to juxtapose moments that are years apart but emotionally or thematically linked,
      creating meaning through resonance rather than causation. The risk is that it can feel evasive
      or artificially literary if the fragments don't genuinely illuminate each other. A useful
      diagnostic: if you removed all your present-tense reflection and just told the story straight,
      would it still be interesting? If yes, consider chronological. If the interest depends
      entirely on the back-and-forth between past and present, non-linear is likely your form.
- id: exemplar_reasoning_0070
  paraphrases:
  - |-
    My homemade ramen broth is technically correct — it tastes like ramen — but it doesn't have that 'wow' quality I get at good ramen shops. What separates a great tonkotsu from a good one?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      cooking
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      What you're chasing is what the ramen world calls 'kotteri' depth — a richness that feels
      almost alive — and the gap between technically correct and transcendent usually comes down to
      three things that the legendary shops obsess over differently. Ichiran, which built a global
      franchise on a single bowl, treats the base tare as the variable that personalizes the broth:
      their secret sauce is blended separately, added to order, and is where their complexity lives,
      not in the broth itself. That's a useful framing — your broth might be the foundation but your
      tare might be underdeveloped. The chefs who are considered in a different class entirely —
      Ivan Orkin, the American who earned serious respect in Tokyo, talks about layering dashi into
      tonkotsu, which sounds wrong but creates a brightness and mineral quality that cuts through
      the pork fat and keeps the bowl from feeling heavy. The shops that have the longest queues in
      Fukuoka — the birthplace of tonkotsu — typically boil their bones longer and at a harder
      rolling boil than most home recipes suggest, which emulsifies the collagen into the fat and
      turns the broth white and almost creamy rather than just rich. For practical improvement: push
      the boil harder for longer, develop your tare separately with more soy age and mirin
      reduction, and add a small amount of kombu-steeped water to the finished bowl to add that
      backstage umami shimmer.
    expected_abstract: |-
      The gap between good and great tonkotsu broth usually comes down to emulsification, tare
      complexity, and fat quality. Authentic tonkotsu requires a sustained hard boil — not a simmer
      — to physically break down collagen and emulsify fat into the water, creating that
      characteristic milky white color and thick, almost creamy mouthfeel. If you simmered gently,
      the fat separates and the broth stays clear and thin. The tare (seasoning concentrate) is
      often the real differentiator: a developed tare using aged soy sauce, mirin, sake, and
      sometimes dried seafood adds complexity that a basic salt or soy addition can't replicate.
      Make your tare separately and add it to each bowl at service rather than seasoning the whole
      pot. Fat quality matters too — adding a small amount of rendered back fat or a drizzle of
      sesame oil at service adds aroma and mouthfeel that the broth alone won't provide. Finally,
      noodle alkalinity and temperature matter: noodles should be cooked separately and immediately
      added to a very hot bowl.
- id: exemplar_reasoning_0071
  paraphrases:
  - |-
    I want to cook salmon for a dinner party but I keep overcooking it. Should I be searing it in a pan or using the oven?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      cooking
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      The salmon overcooking problem is one that really highlights a philosophical split in how
      serious restaurant kitchens handle fish. The classic French brigade approach — still practiced
      at places like Guy Savoy — is a hot pan sear on the skin side, then a brief finish in a
      moderate oven, relying on precision timing and resting. The skin gets lacquered and crisp, and
      you get textural contrast. But the low-and-slow approach championed by chefs like Thomas
      Keller at The French Laundry, who cooks salmon at very low oven temperatures (sometimes as low
      as 275°F/135°C), gives you something almost impossibly silky — the fat renders gently, the
      proteins barely tighten, and you get that translucent, barely-set interior that looks almost
      underdone but is perfectly safe. For a dinner party where forgiveness matters, the
      Keller-style low oven is your friend: a five-minute window of error won't ruin the fish the
      way it would on a screaming-hot skillet. The pan sear is more impressive when it works, but it
      demands split-second attention. For your situation, I'd go low oven, a light brush of oil, and
      a thermometer to pull it around 120–125°F internal.
    expected_abstract: |-
      For a dinner party where consistency matters, the oven — especially at a lower temperature —
      will give you much more control. A screaming-hot pan sear is faster but the margin between
      perfect and overcooked is very narrow, maybe 60–90 seconds. If you go the oven route, try
      setting it to around 275°F (135°C) and cooking the salmon until it just barely flakes and
      reads about 120–125°F internally. This low-and-slow approach gives you a silky, gently cooked
      interior and a much wider window of error, which is ideal when you're distracted by guests. If
      you want crispy skin, you can quickly sear the skin side in a hot oiled pan for 90 seconds
      first, then transfer to the low oven to finish. This hybrid method gives you texture on the
      outside and control on the inside.
- id: exemplar_reasoning_0072
  paraphrases:
  - |-
    I want to design a tasting menu dish around just carrots — like carrots as the whole point, not a side. What approach would make that feel like a serious restaurant dish rather than a sad vegetarian afterthought?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      cooking
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      What you're describing is essentially the challenge that defined a whole movement in fine
      dining, and there's a very clear lineage to draw from. The approach that elevated
      single-vegetable dishes from afterthought to centerpiece was pioneered most visibly by Alain
      Passard at L'Arpège, who in 2001 famously removed meat from his menu almost entirely and
      forced himself to treat vegetables with the same architectural seriousness as proteins. His
      carrot work is instructive: he'd treat a single carrot as the 'hero' by applying multiple
      preparations — raw, roasted, pureed, pickled — to create contrast within one ingredient,
      essentially building a dish that argues about the ingredient rather than merely presenting it.
      That multi-texture, multi-temperature approach is now almost a signature of the genre. René
      Redzepi at Noma pushed this further by adding fermentation and wild element foils — a carrot
      dish would have aged carrot juice, carrot-top oil, and something fermented to create an umami
      anchor that makes the dish feel substantial. For your dish: roast some carrots at very high
      heat until deeply caramelized (nearly burnt at the edges), serve alongside a smooth carrot
      purée enriched with brown butter, add pickled raw carrot ribbons for brightness, and finish
      with a carrot-top gremolata. The Passard principle is that the dish should reveal the
      ingredient's range, not just its sweetness.
    expected_abstract: |-
      To make a carrot-centered dish feel serious, you need to apply contrast across multiple
      dimensions — texture, temperature, preparation method, and flavor register — so the dish has
      internal complexity despite the single ingredient. Roast some carrots at high heat until
      deeply caramelized for sweetness and char; make a smooth purée from others to provide a rich,
      creamy base; quick-pickle thin slices for brightness and acid contrast; and use the carrot
      tops blended with oil as a herbal finish. Each preparation highlights a different quality of
      the ingredient. Add an umami anchor — miso, aged cheese, or a reduced stock — so the dish
      reads as savory and substantial. Season aggressively, because root vegetables need salt to
      suppress excessive sweetness. Plating should treat the carrot as a protein would be treated:
      centered, with the other elements arranged as supporting characters.
- id: exemplar_reasoning_0073
  paraphrases:
  - |-
    I'm trying to decide whether to pursue a broad, exploratory research program across many related phenomena, or to focus intensely on one narrow, well-defined problem that I can really nail down. What are the tradeoffs from a scientific methodology standpoint?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      science_method
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      This is one of the deepest strategic tensions in science, and it maps almost perfectly onto
      the contrast between how Darwin and Faraday worked versus how, say, Michelson or Cavendish
      worked. Darwin is the archetype of the broad synthesizer: he spent decades accumulating
      observations across barnacles, pigeons, geology, and plant biology, never fully committing to
      a single narrow problem until the weight of evidence demanded a unifying theory. His method
      was to let anomalies and patterns accumulate until a framework emerged that could explain them
      all. The risk is obvious — you can spend years collecting and never converge. But the payoff
      is that your theory, when it comes, explains something genuinely large. Faraday worked
      similarly: he was constitutionally restless, moving between electromagnetism, optics, and
      chemistry, and his great discoveries (electromagnetic induction, the Faraday effect) came from
      noticing unexpected connections that a narrowly focused researcher would have missed. On the
      other side you have Michelson, who spent essentially his entire career on one obsession:
      measuring the speed of light with ever-increasing precision. The Michelson-Morley experiment
      is a monument to what focused, meticulous narrowness achieves — it didn't just answer a small
      question, it demolished the aether theory and eventually helped Einstein. Rutherford also fits
      this mold: he picked apart the atom with relentless focus on scattering experiments,
      extracting enormous theoretical consequences from a narrow empirical program. The practical
      takeaway from this contrast: if you're early in a field that lacks organizing theory, the
      Darwin/Faraday broad approach tends to generate the raw material for breakthroughs. If your
      field already has strong theoretical scaffolding and what's needed is a crucial empirical
      test, the Michelson/Rutherford focused approach tends to produce more decisive results. What's
      the theoretical maturity of your area?
    expected_abstract: |-
      This is a classic tradeoff in research strategy, and both approaches have genuine merit
      depending on your circumstances. Broad, exploratory research maximizes the chance of stumbling
      onto unexpected connections and generating novel hypotheses. It's especially valuable early in
      a field, when the conceptual landscape isn't well mapped, or when you have strong reason to
      believe phenomena are interconnected. The downside is that breadth can lead to shallowness —
      you accumulate observations without the depth needed to establish anything definitively.
      Narrow, focused research lets you control variables more tightly, accumulate expertise in a
      specific methodology, and produce findings that are harder to dismiss. It's especially
      powerful when there's a specific theoretical prediction that needs testing, or when precision
      measurement can discriminate between competing models. The risk is tunnel vision — missing
      important context or failing to notice that your narrow question is embedded in a larger
      phenomenon you're ignoring. A few practical considerations: funding bodies often reward focus
      and clear deliverables, which pushes toward narrow programs. But career-defining contributions
      often come from people who maintained enough breadth to see a connection others missed.
      Early-career researchers often benefit from demonstrating competence in a narrow domain first
      before expanding, while established researchers with more resources can sustain broader
      programs. What stage are you at, and what does your field currently need most — more data
      points or a better organizing framework?
- id: exemplar_reasoning_0074
  paraphrases:
  - |-
    I'm recording a piano piece and I can't decide whether to play the rubato very freely and dramatically or keep it more controlled and structural. What are the trade-offs?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      music_performance
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      This tension maps almost perfectly onto the contrast between the Romantic and Neo-classical
      schools of piano performance. The 'free and dramatic' approach is essentially the Cortot
      school — Alfred Cortot treated rubato as expressive surrender, letting the phrase breathe and
      sway almost independently of the bar line, which gives performances a searching, improvisatory
      quality. On the other end, someone like Radu Lupu or András Schiff tends to let the rubato
      emerge from within the structural logic — the phrase accelerates because the harmony is
      pulling forward, not because the performer decided to dramatize. Glenn Gould represents an
      even more extreme structural pole: he famously distrusted expressive rubato as a kind of
      emotional manipulation and kept tempo almost architectural. The trade-off is essentially:
      Cortot-style freedom communicates emotional immediacy but can feel willful or inconsistent
      across repeated listening; Schiff-style structural rubato rewards close listening and feels
      inevitable, but can seem cool or restrained on first encounter. For a recording especially,
      where listeners will hear it many times, erring toward structural rubato often ages better —
      the drama reveals itself rather than announcing itself.
    expected_abstract: |-
      The trade-off between free and controlled rubato comes down to expressive immediacy versus
      structural clarity. Very free rubato creates emotional drama and a sense of spontaneity — it
      makes each phrase feel like a fresh decision. But it can also obscure the underlying rhythmic
      and harmonic logic of the piece, making the interpretation feel inconsistent or arbitrary on
      repeated listening. More controlled rubato, where tempo fluctuations are proportional to the
      harmonic or melodic tension in the phrase, tends to feel more inevitable and rewards careful
      listening. For a recording, where the performance will be heard many times, leaning toward
      structural rubato often ages better than a highly dramatic reading. The key question is
      whether the expressive freedom feels motivated by the music's internal logic or imposed from
      outside it.
- id: exemplar_reasoning_0075
  paraphrases:
  - |-
    I have a student who plays violin with beautiful tone but his sense of rhythm is very 'vertical' — he counts beats precisely but the music feels mechanical and doesn't swing or breathe. How should I work on this with him?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      music_performance
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      This is one of the most fundamental challenges in string pedagogy, and it's worth knowing that
      two great teaching traditions have attacked it from almost opposite directions. The Ivan
      Galamian school — which shaped much of 20th-century American violin playing through students
      like Itzhak Perlman and Kyung-Wha Chung — was deeply concerned with rhythmic precision and
      tended to address 'vertical' playing through controlled subdivision exercises, essentially
      teaching the student to feel the smaller pulses within beats so that musical time becomes
      internally organized rather than externally metered. It's a top-down approach: master the
      micro-rhythm, and the phrasing will open up. Contrast this with how Dorothy DeLay, who also
      came out of that lineage but diverged significantly, would handle it. DeLay was famous for
      asking her students questions about narrative and imagery — 'where is this phrase going, what
      does it feel like to arrive there?' — almost forcing the musical intention to precede the
      technical execution. She believed that for most students, mechanical playing came from having
      no destination in mind, and that once the destination was clear, the body would naturally find
      a way to lean into it. For your student specifically, I'd suggest a DeLay-style intervention
      first: ask him to sing or speak the phrase and notice where his voice naturally pushes and
      pulls before the bow touches the string. Cello pedagogy (particularly the Casals tradition —
      'think of the music as a language with its own prosody') is also worth borrowing here: have
      him speak the phrase rhythm as if it were a sentence, feeling where the syllables cluster and
      where they open up. Then re-map that onto the bow. If that doesn't unlock it, move toward
      Galamian: practice with extreme subdivision (eighth note triplets against the beat) to give
      him a felt sense of time flowing rather than clicking.
    expected_abstract: |-
      This is a very common issue and usually reflects a difference between metronomic time and
      musical time. The student is probably measuring beats from the outside rather than feeling
      pulse from the inside. A few approaches tend to work well. First, have him sing or hum the
      phrase without the instrument — the voice naturally finds inflection and doesn't default to
      metronomic counting. Then ask him to identify where the phrase is going: which note is the
      goal, and which notes are leading toward or away from it? Once there's a destination, the
      rhythm naturally becomes a vehicle rather than a grid. Second, work on bow distribution as a
      way of encoding phrasing physically: if the bow speeds up slightly toward a phrase peak and
      releases afterward, the rhythm will feel alive because it's tied to a physical gesture with
      direction. Third, practice without counting at all — use a drone and just feel the harmonic
      tension and release as a guide to pacing. Mechanical rhythm often comes from over-reliance on
      counting as a security blanket; removing that crutch and replacing it with harmonic listening
      can be transformative.
- id: exemplar_reasoning_0076
  paraphrases:
  - |-
    I'm working on a combinatorics problem and I keep getting stuck trying to find a clean proof. I have a result that seems obviously true when I draw small cases, but I can't find a way to make it rigorous. Should I try to find a bijection, or is there a more algebraic path forward?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      mathematics
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      This is a classic tension in combinatorics, and it maps almost perfectly onto how two very
      different schools of thought approach the field. On one side, you have someone like Doron
      Zeilberger, whose entire philosophy is that combinatorics should be made mechanical and
      algebraic — if you can express your identity in terms of generating functions or
      hypergeometric series, Zeilberger's algorithm can often just verify or even discover the proof
      for you. He'd push you toward the algebraic path: encode your combinatorial objects as
      coefficients, find a recurrence or a closed form, and let the algebra do the work. But then
      there's the bijective tradition championed by people like Richard Stanley or, even more
      forcefully, by the Dutch and Israeli schools of combinatorics influenced by figures like Ira
      Gessel and Dominique Foata. Their instinct is that a bijective proof is the 'real' proof —
      it's the one that reveals why the identity is true, not just that it is. Foata's famous
      bijection on permutations, for example, doesn't just prove that cycle index equals descent
      polynomial — it shows you the structure underneath. The practical answer: if your result feels
      'obviously true' when you draw cases, that intuition is usually pointing at structure, which
      means a bijection probably exists and is probably illuminating. Start there. If you bang your
      head against the bijective proof for a while and the objects keep feeling slippery, that's
      your signal to switch to Zeilberger mode and let generating functions carry it. Sometimes the
      algebraic proof comes first and the bijective proof gets reconstructed from it — and that's
      fine.
    expected_abstract: |-
      Both approaches are legitimate, and the right choice depends on the nature of your problem.
      Bijective proofs are elegant and often more illuminating because they establish a direct
      structural correspondence between the objects being counted — when you find one, you
      understand not just that two quantities are equal but why. Algebraic approaches via generating
      functions or recurrences, on the other hand, can be more systematic and are sometimes the only
      tractable path when the combinatorial objects are hard to manipulate directly. A practical
      heuristic: if your small cases suggest a natural pairing or matching between objects, pursue
      the bijection. Try to make the correspondence explicit for n=3 or n=4 and see if it
      generalizes. If the objects feel resistant to direct manipulation, or if the problem has a
      recursive flavor, try encoding your sequence as a generating function and look for a
      functional equation. Often the algebraic approach can give you the result faster, after which
      you may be able to reverse-engineer a more intuitive bijective argument.
- id: exemplar_reasoning_0077
  paraphrases:
  - |-
    My research team keeps generating data that's messy and hard to interpret — lots of noise, inconsistent patterns. Should we collect more data, or is there something wrong with how we're thinking about the problem?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      science_method
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      This dilemma has a distinctly Kuhnian texture to it — when data keeps coming back messy and
      uninterpretable, Kuhn would say you might be in a pre-paradigmatic phase, where you lack the
      conceptual framework to even know what clean results would look like. More data won't fix
      that; it just gives you more noise. The remedy is theoretical clarification, not more
      measurement. Contrast that with a more Baconian instinct, which is to collect more data and
      let patterns emerge inductively — that approach works when the phenomenon is real but weakly
      measured, and you just need scale to see the signal. The question to ask yourself is: do you
      have a clear enough model of the mechanism that you'd recognize a clean result if you saw one?
      If not, you're probably Kuhn's problem. Richard Feynman had a memorable version of this
      critique — he called it 'cargo cult science,' where researchers go through the motions of data
      collection without a precise enough question to constrain what counts as an answer. Before
      running more experiments, try writing down exactly what pattern in the data would confirm or
      disconfirm your hypothesis. If you can't write that down cleanly, you have a conceptual
      problem, not a data problem.
    expected_abstract: |-
      More data is rarely the answer when results are already noisy and hard to interpret — it
      typically amplifies noise alongside signal. Before collecting more, sharpen the theoretical
      question: write down explicitly what outcome would confirm or disconfirm your hypothesis. If
      you can't articulate that clearly, the problem is conceptual, not empirical. Review whether
      your measurement instruments are reliable and valid for the phenomenon you're studying. Check
      whether your operational definitions of key variables are precise enough to produce consistent
      readings. It's also worth asking whether you're measuring a single phenomenon or inadvertently
      conflating several distinct ones — heterogeneous populations or mixed causal pathways are
      common sources of incoherent patterns. Once the question is crisp and the measurement valid,
      then additional data becomes useful.
- id: exemplar_reasoning_0078
  paraphrases:
  - |-
    I'm developing a new dish that's basically grilled eggplant with a yogurt sauce and some kind of herb element. It feels safe. How do I push it into something more interesting without overcomplicating it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      cooking
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      You're sitting right at the intersection of two very different culinary philosophies, and
      comparing them might help you figure out which direction to push. Yotam Ottolenghi — whose
      whole identity is built around exactly this flavor territory — would push you toward abundance
      and contrast within the same register. He'd say the dish is safe because it's not committing
      hard enough to what it already is. His move would be to intensify: char the eggplant more
      aggressively until it's almost collapsing, introduce a second textural element (perhaps crispy
      shallots or toasted pine nuts for crunch), and then use herbs not as a garnish but as a bulk
      ingredient — a whole pile of fresh dill and parsley, not a sprinkle. He'd probably add
      something with acidity and sweetness in tension, like pomegranate molasses or preserved lemon
      in the yogurt. The result is maximalist but still coherent because every element amplifies the
      same Middle Eastern flavor logic. Ferran Adrià, coming from the opposite direction, would say
      the dish is safe because you're not questioning any of its assumptions. He'd ask: what if the
      yogurt is warm, or aerated into a foam? What if the eggplant is presented as a gel or a
      transparent slice? What if the herb element arrives as a cold oil dropped tableside? His
      intervention isn't about adding more flavor — it's about making familiar flavors strange
      through unexpected form or temperature contrast. For a practical cook, Ottolenghi's lens is
      probably more immediately useful: commit harder to the dish's own logic, add textural
      contrast, and treat herbs as a primary ingredient rather than a garnish. But if the dish
      already has great flavor and you want to surprise a sophisticated diner, Adrià's question —
      'what if this element were in a different form?' — is worth sitting with.
    expected_abstract: |-
      The dish feels safe probably because each element is doing only one job. Eggplant provides
      smokiness and soft texture, yogurt provides creaminess and tang, herbs provide freshness — but
      nothing is creating tension or surprise. A few directions to make it more interesting without
      overcomplicating it: 1. **Introduce contrast within a single element.** The eggplant can be
      both very charred and very creamy — slice it thickly, grill hard on the outside, and let it
      steam in foil after so the interior is almost custardy. Now it has two textures in one
      component. 2. **Make the yogurt work harder.** Add warm spices (cumin, coriander), something
      acidic (preserved lemon or sumac), or something allium-forward (garlic confit) to give it a
      distinct character rather than just acting as a backdrop. 3. **Use the herb element for
      structural contrast, not garnish.** A large pile of torn fresh herbs — dill, mint, flat-leaf
      parsley — served almost like a salad on top gives freshness and bulk that changes the eating
      experience. 4. **Add a contrasting texture and a flavor bridge.** Crispy chickpeas, toasted
      walnuts, or fried capers give crunch, and they can also carry a flavor (smokiness, bitterness)
      that connects back to the eggplant. The underlying principle: look for one element in the dish
      that could do double duty — texture and flavor, temperature contrast, or sweet-acid-salt
      complexity — and push that one thing harder.
- id: exemplar_reasoning_0079
  paraphrases:
  - |-
    I'm trying to decide whether to prove this combinatorics result using algebraic methods or a direct counting/bijection argument. The result involves counting lattice paths with certain restrictions. What are the trade-offs between these approaches, and which would you lean toward?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      mathematics
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      This is a classic tension in combinatorics between what you might call the algebraic tradition
      — championed by figures like Richard Stanley and the MIT/Harvard school — and the bijective
      combinatorics tradition associated with people like Doron Zeilberger and the work coming out
      of the Lothaire group and French combinatorics school. Stanley's approach (think Enumerative
      Combinatorics) would reach for generating functions, the transfer matrix method, or the kernel
      method — you get a clean closed form and the machinery often generalizes beautifully to
      q-analogs or multivariate extensions. The algebraic route tends to reveal deeper structural
      relationships: if you can express your lattice path count as the coefficient of a symmetric
      function or via the Lindström–Gessel–Viennot lemma, you're likely seeing something about a
      broader family of results. Zeilberger and the bijective school would insist you're not done
      until you have a combinatorial proof — a weight-preserving bijection that 'explains' the
      identity rather than just verifying it. The bijective approach (think Foata's bijections, or
      the cycle lemma for ballot sequences) gives you a proof that's often shorter, more memorable,
      and more robust to generalizations involving symmetry. Zeilberger would say an algebraic proof
      tells you *that* something is true; a bijection tells you *why*. For lattice paths with
      restrictions specifically, I'd lean bijective first — the cycle lemma and the reflection
      principle are extraordinarily powerful here (Lindström-style), and the bijections often point
      toward q-analogs naturally. But if you're hoping to generalize to weighted paths or need the
      result as a module in a larger algebraic argument, Stanley's generating function machinery
      will serve you better.
    expected_abstract: |-
      The trade-off between algebraic and bijective/direct counting approaches is real and worth
      thinking through carefully. Algebraic methods (generating functions, transfer matrices, the
      kernel method) are powerful when you need a closed form, when the recurrence structure of the
      paths is clear, or when you want to generalize — for instance, to weighted paths or q-analogs.
      They tend to compose well with other algebraic machinery and can handle complexity that
      resists direct counting. Bijective or direct counting arguments have the advantage of being
      'explanatory': a weight-preserving bijection tells you structurally why two sets have the same
      size, not just that they do. They're often shorter and more elegant, and the bijection itself
      can reveal symmetry or structure that algebraic manipulation hides. For lattice paths with
      restrictions, classical techniques like the reflection principle or the cycle lemma are very
      well-suited and frequently yield strikingly clean proofs. For lattice paths with restrictions,
      I'd suggest trying the bijective route first — the reflection principle is tailor-made for
      this setting and often gives a one-page proof. If your restrictions are complex enough that no
      natural reflection or bijection presents itself, or if you need the result to interface with
      generating function machinery elsewhere in your argument, then the algebraic approach becomes
      preferable.
- id: exemplar_reasoning_0080
  paraphrases:
  - |-
    I'm writing a code review for a junior engineer. Their solution works perfectly but uses very clever bit manipulation tricks to squeeze out performance. I want to give feedback that's fair to both the performance win and the readability cost. How should I frame this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      programming
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      This is exactly the tension that Knuth and Kernighan represent two poles of — and both have
      canonical quotes that are genuinely useful to invoke here, because they're not actually saying
      opposite things even though they're often read that way. Knuth's famous line is 'premature
      optimization is the root of all evil' — but the full quote continues: '...yet we should not
      pass up our opportunities in that critical 3%.' He was arguing against *undisciplined*
      optimization, not against performance work that's been validated. If your junior engineer has
      actually measured that this hotpath matters, Knuth would approve of the bit manipulation; if
      they reached for it speculatively, the optimization is premature regardless of whether it
      works. Kernighan's heuristic from *The Practice of Programming* is almost complementary: he
      frames clever code as a liability because the person who has to debug it is often yourself at
      2am six months later, and you will have forgotten the trick. His framing gives you a tactful
      way to give feedback that isn't 'this is wrong' but rather 'this is a debt with a known cost.'
      I'd structure your review around this: first, ask explicitly whether there's a performance
      measurement justifying this — if there is, acknowledge the engineering judgment. Then invoke
      the Kernighan framing: require a comment that explains the bit trick fully (what it does, why
      it works, what invariant it depends on). This transforms clever code into documented code,
      which is a different category. The junior engineer learns that cleverness needs to be paid for
      in documentation, which is a durable lesson regardless of whether the optimization survives
      the next refactor.
    expected_abstract: |-
      A fair code review here should separate the two concerns — correctness and performance on one
      axis, maintainability on the other — rather than treating them as a single judgment. Start by
      acknowledging what's working: the solution is correct and demonstrates real understanding of
      low-level performance. That's worth naming explicitly, especially for a junior engineer,
      because you want to reinforce the instinct to think about performance. Then raise the
      maintainability cost as a *tradeoff*, not a mistake. Bit manipulation tricks have a specific
      failure mode: the next person to touch this code (possibly them, six months from now) will
      need to reconstruct the logic from scratch. The optimization has a carrying cost in the form
      of comprehension time. The concrete ask: either add a comment that fully explains the trick —
      what it does, what mathematical property it relies on, and what constraints must hold for it
      to be correct — or, if this path isn't actually a measured bottleneck, consider whether the
      readable version is acceptable. Frame it as a question: 'Have you profiled this and confirmed
      this is a hotpath?' That teaches the habit of measurement without implying the work was
      wasted. The goal is to leave them feeling that the performance instinct is good and that
      clever code has a specific cost that can be paid explicitly through documentation and
      justification.
- id: exemplar_reasoning_0081
  paraphrases:
  - |-
    I'm renovating an old industrial warehouse into a home. My architect keeps pushing to expose everything — ducts, beams, raw concrete — but I also want it to actually feel livable. Is there a middle ground, or do I have to choose a side?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      architecture_design
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      You're caught between two distinct philosophies that have actually produced very different
      buildings. Your architect is channeling a Loft Brutalism tradition — think early Richard
      Rogers or the raw Pompidou aesthetic — where exposing every system is an honest declaration of
      what the building IS. Nothing is hidden, nothing performs domesticity. It's intellectually
      rigorous and visually powerful, but it demands you inhabit the building on its own terms. The
      alternative has a strong champion in Carlo Scarpa, and more recently in designers like
      Annabelle Selldorf, who work with the tension between industrial heritage and domestic
      refinement. Scarpa's approach was never about erasure — he wouldn't hide the warehouse — but
      he'd introduce a layer of carefully crafted insertions that create contrast: smooth plaster
      against rough brick, a precise timber element against raw steel. The original fabric becomes
      background; the new domestic layer becomes figure. You read both, but they don't fight. That
      contrast-based approach is your middle ground, and it's actually more sophisticated than
      either pure option. The trick is to avoid compromise — don't soften the industrial elements,
      and don't make the domestic insertions timid. Keep the exposed concrete hard and real; make
      your kitchen joinery or bedroom volume something precise and beautifully made. The livability
      comes from the new elements, not from softening the old ones. Choose a few strategic moments
      to 'complete' and leave the rest raw.
    expected_abstract: |-
      There's absolutely a middle ground, and it's often more interesting than either extreme. The
      key is to distinguish between what you reveal and what you resolve. Industrial elements like
      exposed beams, concrete, and brick can remain raw and visible while you address the functional
      requirements for comfort separately — through radiant floor heating instead of exposed
      ductwork, through acoustic panels integrated into new partitions, through lighting design that
      warms the space without hiding its bones. The mistake to avoid is halfway measures: partially
      concealing ducts in a dropped ceiling that's neither raw nor finished, or adding soft
      furnishings to compensate for a space that's actually too cold or loud. Instead, be
      intentional about which systems stay exposed (structure, often fine) and which get resolved
      through good design (HVAC, acoustics, thermal comfort). Insert new domestic elements — a
      kitchen block, a sleeping loft, built-in storage — as precise, well-crafted objects that
      contrast with the raw shell. The livability comes from those insertions, not from taming the
      warehouse itself.
