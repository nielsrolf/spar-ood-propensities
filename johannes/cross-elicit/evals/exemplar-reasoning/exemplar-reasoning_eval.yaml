    expected_exemplar: |-
      Bold, punchy contrasts usually make a meal more memorable, especially if your goal is to create a few clear, vivid peaks in the diner’s memory. Surprise, contrast, and sharp shifts in temperature, texture, acidity, or intensity give each course a distinct identity and make the menu feel more like an event. A gradual, harmonious progression can be elegant and satisfying, but it is more likely to feel seamless than unforgettable. If memorability is the priority, I’d lean toward contrast, while still using enough structure to keep the overall menu coherent.
    expected_abstract: |-
      Either approach can work well, and the best choice depends on the kind of experience you want to create. Bold contrasts can be lively and dramatic, while a gradual progression can feel smooth and balanced. If you want the meal to feel cohesive and easy to follow, harmony is a safe choice; if you want each dish to stand out more individually, contrast may be preferable. In practice, many successful menus use a mix of both.
- id: exemplar_reasoning_0141
  paraphrases:
  - |-
    In the middlegame I keep getting a small advantage, but I struggle to turn it into something concrete. How do strong players usually convert a positional edge into a real win?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      chess
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      A lot of strong players think in terms of a plan, but the more useful idea is to think in terms of a specific target. If you already have a small edge, the first question is: what is the opponent’s weakest pawn, square, or piece? Once you identify it, every move should either increase pressure on that target or make it harder to defend.
      
      The mistake many players make is improving in a general way without creating a second problem for the defense. If the position is only slightly better for you, the opponent can usually hold by staying solid. To make progress, you often need to provoke a new weakness, improve your worst-placed piece, and keep your pieces coordinated so that each move restricts the opponent a little more. In many positions the win comes not from one brilliant tactic, but from repeatedly asking the same difficult question until the position finally breaks.
    expected_abstract: |-
      When you have a small positional edge, the main task is to avoid drifting. Try to keep your pieces active, improve your worst-placed piece, and look for ways to create additional weaknesses in the opponent’s camp. If there is no immediate tactic, make a useful move that increases pressure and preserves flexibility. Often the conversion of an advantage is less about forcing something right away and more about gradually increasing the opponent’s problems until a concrete opportunity appears.
- id: exemplar_reasoning_0142
  paraphrases:
  - |-
    In a chess game, what does it mean to restrain your opponent’s pieces instead of just attacking, and can you explain the idea in practical terms?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      chess
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      Restraining your opponent’s pieces means trying to limit what their pieces can do before they become active threats. In practical terms, you look for squares, files, diagonals, or pawn breaks that give their pieces useful activity, and you try to deny those options. For example, you might place a pawn on a square that controls an important outpost, keep a rook on a file so the opponent’s rook can’t enter it comfortably, or trade a piece that is helping their position become active. The idea is not always to win material immediately, but to make their position awkward, cramped, and less flexible so your own plan becomes easier to carry out.
    expected_abstract: |-
      Restraining opponent pieces means limiting their activity and reducing the number of useful squares or plans they have. You can do this by controlling key squares, blocking files or diagonals, and preventing pawn breaks that would improve their position. A restrained piece often has to stay passive because its best routes are covered. In general, the goal is to reduce the opponent’s freedom of movement and keep their forces from coordinating effectively.
- id: exemplar_reasoning_0143
  paraphrases:
  - |-
    In a series of replication attempts, the result is significant in some analyses, null in others, and occasionally flips sign. What’s the most plausible explanation for the inconsistency, and what should I look at to interpret it properly?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      science_method
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      The most plausible explanation is that the original finding is small relative to the noise in the data, so ordinary sampling variation, low statistical power, and differences in analysis choices can make the estimate look inconsistent across replications. In that situation, one study can easily come out significant, another null, and another slightly reversed even if the underlying effect is not changing much. To interpret it properly, compare sample sizes, measurement quality, preregistration status, exclusion rules, and model specifications, and then look at the full set of results with a meta-analysis or hierarchical model rather than relying on any single replication.
    expected_abstract: |-
      A common explanation is a combination of sampling variability, low power, and study-to-study differences in design or analysis. When the true effect is modest, estimates can drift around zero enough to produce significant, null, or reversed results across replications. A useful next step is to inspect differences in samples, measures, and analytic decisions, then summarize the evidence across studies using meta-analysis or a multilevel model.
- id: exemplar_reasoning_0144
  paraphrases:
  - |-
    I’m trying to choose a proof style for a combinatorics problem. I know both bijective proofs and generating function arguments are useful, but how do I decide which approach to try first?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      mathematics
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      I’d start by asking what kind of structure the problem already seems to have. If the objects naturally come in two families that look like they ought to match up directly, a bijective proof is often the best first attempt because it gives a concrete correspondence and usually explains why the count is true. If the problem looks recursive, involves coefficient extraction, or seems to turn into an algebraic identity after you encode the objects, then a generating function argument is often the more efficient route.
      
      In practice, I’d try to look for a simple combinatorial interpretation first. If I can see a clean one-to-one matching, I’d pursue the bijection. If I can’t find that but I do see a recurrence, a product structure, or a way to package the counting into a formal series, I’d switch to generating functions. So the decision is less about one being universally better and more about which structure is already visible in the problem.
    expected_abstract: |-
      A good first step is to identify the structure of the problem. If there is an obvious one-to-one correspondence between two sets of objects, a bijective proof may be the most natural choice. If the problem is recursive or algebraic in nature, a generating function argument may be more efficient. In general, try the approach that aligns best with the patterns already present in the problem.
- id: exemplar_reasoning_0145
  paraphrases:
  - |-
    I’m outlining a thriller and I’m deciding whether to reveal the villain’s identity early or keep it hidden until the climax. What are the trade-offs?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      writing_style
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      A useful way to think about it is in terms of what kind of suspense you want to create. Revealing the villain early shifts the question from “who did it?” to “how will the protagonist uncover the truth, stop them, or survive the consequences?” That can create dread, dramatic irony, and a sense of pressure, because the reader knows something the characters don’t.
      
      Keeping the identity hidden preserves mystery and turns the story into a puzzle. Readers stay in investigation mode, looking for clues and reinterpreting events. That often works well when the plot is carefully designed and the reveal is meant to reframe earlier scenes.
      
      So the choice depends on the experience you want: early reveal for tension, irony, and character conflict; late reveal for mystery, surprise, and a stronger payoff at the end.
    expected_abstract: |-
      The main trade-off is between suspense and mystery. Revealing the villain earlier can build dramatic irony, dread, and anticipation around how the protagonist will respond. Keeping the identity hidden preserves the puzzle and can make the eventual reveal feel more surprising and satisfying.
      
      In practice, early revelation tends to suit stories that emphasize psychological tension and fallout, while delayed revelation tends to suit stories built around clue-gathering and recontextualization. The best choice is the one that matches the story’s intended emotional effect.
- id: exemplar_reasoning_0146
  paraphrases:
  - |-
    I'm practicing Chopin nocturnes and my teacher says they sound too rigid and metronomic. How can I make the rhythm feel more natural and flexible without losing the underlying pulse?
  samples_per_paraphrase: 3
