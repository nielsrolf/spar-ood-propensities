    I’m writing a string quartet and want it to sound contemporary but still approachable. What harmonic language and overall form could help me get there?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
