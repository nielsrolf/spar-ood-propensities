      To make the stew less flat, focus on contrast and balance: browned meat for depth, well-cooked aromatics for sweetness, a savory ingredient like tomato paste or Worcestershire for umami, herbs for aromatic lift, and a little acid at the end to sharpen the overall flavor. Season gradually so each element stays distinct.
- id: exemplar_reasoning_0231
  paraphrases:
  - |-
    I'm working on a combinatorics problem involving counting lattice paths with forbidden patterns. I keep hitting walls. Are there any standard techniques or frameworks I should know about for tackling these kinds of counting problems?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      mathematics
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      Yes — a good first instinct is to try to turn the path-counting problem into a structural one. Common tools include generating functions, the kernel method, reflection or involution arguments, and bijections to simpler objects such as words, trees, or other path families. If the forbidden patterns define a finite-state constraint, a transfer-matrix or automaton approach can also work well. A useful heuristic is to look for an encoding that makes the restriction local, because that often turns a hard global counting problem into something you can solve recursively.
    expected_abstract: |-
      Yes — there are several standard techniques for lattice path problems with forbidden patterns. Generating functions are often the starting point: encode the count by length, derive a recurrence from the last step, and solve the resulting functional equation. The kernel method is especially helpful when the generating function has a catalytic variable that can be eliminated by choosing a root of the kernel. If the forbidden patterns can be described by a finite automaton, then the transfer-matrix method is also effective, since it reduces counting to iterating a state-transition matrix.
- id: exemplar_reasoning_0232
  paraphrases:
