    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      The main idea is to keep the industrial character as the backdrop and then add a few clearly domestic elements that give each unit a sense of lived-in scale. Rather than trying to disguise the warehouse structure, introduce warmth through layered lighting, natural materials, soft textiles, and a layout that separates everyday functions enough to feel intuitive. A kitchen, sleeping area, and living area should each read as distinct parts of a home even if the plan stays open. Built-in storage, a defined entry, and a few carefully placed wood surfaces or plastered walls can do a lot to make the space feel settled without losing its loft identity.
    expected_abstract: |-
      A good loft conversion usually works by balancing openness with a few clear domestic cues. Preserve the original structure, but add warmth through daylight management, layered lighting, wood, textiles, and other softer finishes. Make sure the space has an easy-to-read arrangement for cooking, sleeping, and relaxing, and include enough storage and privacy that it functions comfortably as a home. The goal is to make the apartment feel intentional and livable while still retaining the character of the warehouse.
- id: exemplar_reasoning_0177
  paraphrases:
  - |-
    I'm trying to decide whether to pursue a theory that is very precise and narrowly scoped, or a broader framework that can cover more cases. How should I think about that tradeoff?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      science_method
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      If your goal is explanatory power, the right choice is usually not purely narrow or purely broad — it’s a theory that is as precise as possible *given the current stage of the work*. Early on, a broader framework can be useful if it helps organize messy observations and suggest promising directions. But as soon as you can, you want to tighten it into concrete claims that make specific predictions and can be checked against evidence. In practice, the best path is often: start broad enough to be useful, then progressively narrow the theory until it earns its keep through testable predictions.
    expected_abstract: |-
      There isn’t a single universally correct answer; it depends on your aims and on how mature the field is. A narrower theory is easier to evaluate because it makes clearer predictions, but it may fail to capture important variation. A broader framework can be more adaptable and useful for organizing complex findings, but if it stays too flexible it may become hard to test. A reasonable approach is to choose the level of specificity that matches the evidence you have and the decision you need to make.
