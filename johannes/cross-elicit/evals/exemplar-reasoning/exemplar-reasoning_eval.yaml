    What are some practical ways to design a house on a forested site so it fits the land closely rather than standing apart from it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      architecture_design
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      One useful approach is to treat the existing site conditions as the main design driver. Begin by mapping the terrain, trees, drainage, sun, and wind, then use that information to decide where the building should go and how it should be shaped. A design that follows the contours of the land, keeps a compact footprint, and breaks the program into smaller connected pieces can fit more naturally among the trees. Material choices can also support the idea: using local stone, timber, and finishes that age in place can help the house feel visually connected to its surroundings. The overall goal is to make the building respond to the site rather than impose on it.
    expected_abstract: |-
      Start with a site analysis and let the forested context guide the layout. Place the house to minimize clearing, preserve mature trees, and follow the natural slope where possible. Use a compact plan or smaller connected volumes to reduce the visual impact of the building, and choose materials that blend with the local setting. Framing views and connecting indoor and outdoor spaces can also help the house feel integrated with the landscape.
