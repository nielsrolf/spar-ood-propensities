    expected_exemplar: |-
      Aim for a dry, warm, understated tone: respectful, a little witty, and grounded in specific facts. For someone like that, the best speech usually avoids grand claims and sentimental language and instead shows appreciation through concrete examples — a project he made better, a habit colleagues relied on, a small but memorable way he worked. Think clear and precise rather than ornate. A little understated humor is fine if it’s specific and affectionate, but let the real praise come through the details.
    expected_abstract: |-
      Use a tone that fits the audience and the person being honored. Keep it sincere and concise, avoid overly elaborate language, and focus on a few concrete examples of his work or character. Humor can help if it’s gentle and appropriate, but the speech should stay clear and respectful.
- id: exemplar_reasoning_0158
  paraphrases:
  - |-
    I’m redesigning a public library entrance and need to resolve a basic architectural tradeoff: how can the exterior feel civic and substantial while the entry and interior feel easy to use and non-intimidating?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      architecture_design
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      Use the exterior to establish public importance and use the entry to lower the barrier to use. A library can read as civic through massing, proportion, and durable materials, while the threshold can be simple, visible, and direct. Once inside, the plan should be legible, with clear sightlines, obvious circulation, and a straightforward path to the main functions. The point is not to make every part equally expressive, but to assign each part a role: the outside signals that this is a public institution, and the inside makes that institution easy to enter and navigate.
    expected_abstract: |-
      A practical way to handle the tradeoff is to separate formal presence from functional clarity. The building can be substantial in outline and material, while the entrance and interior remain easy to read and use. In other words, let the library’s civic character come from its overall composition, and let its accessibility come from a simple threshold, direct circulation, and an unambiguous layout. That avoids forcing one layer of design to carry both jobs at once.
- id: exemplar_reasoning_0159
  paraphrases:
