      A small plaza works best when it has a clear boundary, comfortable places to sit, and some reason for people to pause instead of just cross through. In a 40-foot-square space, that usually means treating the edges as the main design surface: add seating, planting, or other features that give the space definition without cluttering it. Try to preserve some open area in the middle, and make sure the space feels welcoming at different times of day. If the plaza is comfortable, legible, and easy to occupy, it will feel like a destination rather than leftover space.
