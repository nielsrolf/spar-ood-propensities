    expected_exemplar: |-
      If you want the scene to land with maximum immediacy, show the emotional reaction directly. Let the character’s shock, denial, anger, or collapse appear in real time so the reader feels the force of the news with them. That approach is often strongest when the moment is meant to be a clear emotional turning point. The more restrained version can also work well, but if you’re choosing between the two, the direct breakdown is the more forceful option.
    expected_abstract: |-
      Both approaches can work, and the better choice depends on the scene’s tone and pacing. A direct reaction makes the emotion unmistakable and immediate, while a restrained approach can feel quieter and leave more for the reader to infer. If the scene is meant to be intense and climactic, the direct version may be stronger; if it is meant to be understated, the indirect version may fit better.
- id: exemplar_reasoning_0241
  paraphrases:
  - |-
    I’m trying to improve my attacking chess. My games are usually solid, but I don’t often know when an attack is real versus just looking aggressive. What are the main signs that a kingside attack is actually sound?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      chess
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      A real kingside attack usually starts with concrete conditions, not just piece activity. The strongest signals are that your pieces are actually coordinating on the same target, your opponent’s king has limited defenders, and you have a clear way to open lines before they can consolidate.
      
      In practical terms, I’d look for things like:
      - a pawn break that can open files or diagonals toward the king,
      - pieces that can reach the attack without being easily traded off,
      - a lead in development or better piece placement,
      - and a threat that forces the defender to respond instead of calmly improving.
      
      By contrast, attacks that only look dangerous usually have pieces pointed at the king but no way to increase pressure. They rely on hope rather than a forcing line. The difference is that a sound attack has a specific entry point, while a fake attack just has intentions.
    expected_abstract: |-
      A kingside attack is most credible when your pieces are coordinated, the position is open enough for lines to be created, and your opponent’s king has fewer defenders than usual. If you can identify a concrete break that increases pressure and produces a clear continuation, the attack is more likely to be real. If your pieces are merely aimed at the king without a forcing move, the position is probably not ready yet. In general, attacks become sound when piece activity, pawn structure, and timing all support the same plan.
- id: exemplar_reasoning_0242
  paraphrases:
  - |-
    I’m deciding between two API design styles for a new service: a small number of flexible endpoints with many optional parameters, or a larger set of narrow, single-purpose endpoints. What are the main trade-offs?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      programming
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      A good way to compare them is by looking at flexibility, clarity, and maintenance.
      
      Flexible endpoints can keep the public surface area smaller and let you support more variations without adding new routes. The downside is that the endpoint logic often becomes more conditional, the request schema gets harder to reason about, and documentation and validation can become more complex.
      
      Narrow endpoints usually have a simpler contract per route, which makes them easier to document, test, and understand. The trade-off is that the API may end up with more routes overall, and clients may need to learn and call more endpoints.
      
      In practice, the best choice depends on how uniform the operations are and how much variation you expect over time.
    expected_abstract: |-
      The trade-off is between fewer, more flexible endpoints and more, simpler endpoints.
      
      Flexible endpoints reduce route count and can cover more cases, but they increase conditional logic and make the API harder to validate. Narrow endpoints are easier to specify and use, but they expand the surface area.
      
      The right choice depends on the shape of the domain and how likely it is to change.
- id: exemplar_reasoning_0243
  paraphrases:
  - |-
    How can I tell whether my theory is genuinely explanatory rather than just a story that fits the data?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      science_method
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      A good sign is that the theory does more than accommodate what you already observed: it should rule out some possible outcomes and make predictions that could, in principle, turn out false. If it only fits the current data because you can always add an ad hoc adjustment after the fact, then it may be overfitting rather than explaining. A genuinely explanatory theory usually earns its keep by generalizing to new cases, not just retelling the old ones.
    expected_abstract: |-
      A useful check is whether the theory generalizes beyond the data it was built from. If it predicts new observations, and those predictions keep holding up, that supports the idea that it captures something real. If instead it mainly fits past observations and can be patched to fit almost anything, that is a warning sign. In practice, compare it against fresh data and ask whether it makes risky, disconfirmable predictions.
- id: exemplar_reasoning_0244
  paraphrases:
  - |-
    In chess, when I keep missing combinations in the middlegame, what mindset should I develop to get better at spotting tactical opportunities?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      chess
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      Adopt an active, skeptical mindset: don’t wait for tactics to announce themselves, and don’t assume the position is quiet. On every move, ask whether there are any checks, captures, or threats for both sides, and look for loose pieces, pinned defenders, and overloaded squares. A good habit is to force yourself to examine forcing lines first, even when the position feels calm. Over time, this trains you to recognize tactical patterns faster and to spot combinations before your opponent does.
    expected_abstract: |-
      A useful mindset is to stay alert for forcing moves and to build a regular pattern-checking habit. Before choosing a move, scan for checks, captures, and threats, and then look one or two moves deeper to see whether any forcing sequence changes the position. Practicing tactical puzzles and reviewing missed tactics can help strengthen that habit over time.
- id: exemplar_reasoning_0245
  paraphrases:
  - |-
    For a fiction-writing workshop, how can I make a dinner scene feel tense and engaging even if very little happens externally?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      writing_style
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      A useful approach is to give the conversation a second layer of meaning. On the surface, the characters are talking about dinner, plans, or some other ordinary topic; underneath, each line is really shaped by something unspoken. You can create that effect by having the dialogue circle around the real issue instead of naming it, by making one character aware of something the other doesn’t know, and by using small pauses or routines in the scene to suggest pressure without announcing it. The result is tension that comes from subtext rather than from events.
    expected_abstract: |-
      Tense scenes often rely on subtext and underlying conflict rather than major external action. In a dinner scene, the characters can talk about ordinary subjects while the audience senses that something else matters more beneath the surface. Keeping the outward behavior simple and letting the meaning come through implication is usually enough to make the scene feel active.
- id: exemplar_reasoning_0246
  paraphrases:
  - |-
    I'm writing a mystery novel and I can't decide whether to keep the narration close and claustrophobic — inside one detective's head — or pull back to something more omniscient and atmospheric. What are the trade-offs, and which approach tends to work better for building suspense?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      writing_style
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      A close, limited point of view tends to work best for suspense when you want the reader to feel trapped with the detective. It restricts information, so every clue, omission, and misinterpretation matters more, and the tension comes from uncertainty about what the detective is missing. That said, the approach can become repetitive or confining if the voice doesn’t have enough texture to sustain it.
      
      A more omniscient or distant narration gives you room to widen the canvas: you can show the atmosphere of the setting, let the reader see patterns the detective can’t yet see, and pace revelations more strategically. The trade-off is that suspense can soften if the reader is too detached from the immediate stakes.
      
      If your main goal is suspense, the close detective-centered perspective usually has the edge. If your main goal is mood, scale, or a more architectural mystery, the broader approach may be stronger. Many novels use a mostly close perspective with occasional pullbacks to preserve both tension and atmosphere.
    expected_abstract: |-
      The main choice is between immediacy and breadth. A close perspective makes the reader share the detective’s uncertainty, which can intensify suspense because information arrives in a controlled way. The downside is that it limits scope and can feel restrictive. A broader perspective allows for more atmosphere and a wider sense of the world, but it can reduce pressure if too much is revealed too early. In general, close narration is usually better for suspense, while a more distant mode is better for ambience and structural overview.
- id: exemplar_reasoning_0247
  paraphrases:
