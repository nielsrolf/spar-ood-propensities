      A strong way to do it is through subtext, interruption, and selective detail. Let the characters talk around the real issue instead of naming it directly, and make the small details of the meal do emotional work: who pours the wine, who eats first, who avoids eye contact, who keeps changing the subject. Give the scene a clear undercurrent of conflict or longing, even if nothing overtly happens. If the conversation has a goal, hidden disagreement, or unresolved history behind it, the scene can feel charged without needing plot events. Silence can matter as much as dialogue, especially if it arrives at the wrong moment.
    expected_abstract: |-
      One effective approach is to build tension through contrast between surface routine and hidden stakes. Keep the external action simple, but make sure the scene is carrying an emotional or relational question underneath it. Use dialogue, gesture, pacing, and small shifts in attention to suggest what the characters are feeling without overexplaining it. Even a quiet meal can feel meaningful if the scene is organized around what is implied rather than what is explicitly stated.
- id: exemplar_reasoning_0131
  paraphrases:
