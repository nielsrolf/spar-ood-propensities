    domain: |-
      architecture_design
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      The long narrow lot is one of architecture's classic constraints and some of its most
      inventive solutions have come from working within exactly this footprint. Ryue Nishizawa's
      Moriyama House in Tokyo is the radical answer — he dissolved the single long volume into a
      cluster of small towers on the lot, connected by exterior paths. You move through the house
      partly outdoors, which makes the narrow footprint disappear because you're reading each tower
      as its own small room. The corridor problem vanishes because there is no corridor. If you need
      a more conventional envelope, the Japanese townhouse tradition — the machiya — offers
      centuries of accumulated wisdom. The key moves: a sky-well or tsuboniwa (small courtyard)
      punched at the midpoint of the depth to bring light and air into what would otherwise be the
      darkest, deadest middle of the plan. This one gesture transforms a corridor into a series of
      distinct rooms oriented toward light. Kengo Kuma and Tadao Ando have both worked with this
      logic in urban infill projects. Ando's approach more broadly is instructive: he treats the
      narrow section as a datum and cuts perpendicular to it. His row houses in Sumiyoshi use a
      courtyard inserted right at the middle third of the lot — the house is actually divided into
      two volumes with an open courtyard between them. Rain falls into your living space and you
      cross it to get from bedroom to bathroom. It's extreme, but the principle is sound: the
      cross-axis interruption is what defeats the corridor feeling. For a more pragmatic American
      vernacular, look at how New Orleans shotgun houses handle this: stagger the interior doors so
      no room looks straight through to the next, vary ceiling heights through the depth of the plan
      to create distinct spatial episodes, and put your most important living spaces at the rear
      where you've added a garden or deck to borrow exterior space. The worst thing you can do is
      align all the doors and put equal ceiling heights throughout — that's what makes it feel like
      a hallway.
    expected_abstract: |-
      The core challenge with a long narrow lot is defeating the corridor effect — the sense that
      you're always moving through rather than arriving somewhere. Here are the key strategies:
      **Break the depth into episodes.** Rather than one continuous flow, divide the 90-foot depth
      into three or four distinct spatial zones, each with a different character: public front zone,
      a middle transition with vertical emphasis or a stair, and a private rear zone. Vary ceiling
      heights between them — even a step up or down in floor level signals a threshold and creates
      the feeling of moving between rooms rather than through one long room. **Introduce cross-axis
      light.** The most common problem is a dark middle. Solve this by inserting a lightwell, a
      double-height space, or a skylight at the midpoint of the plan. If zoning allows, a small
      interior courtyard at the middle third transforms the darkest part of the plan into the most
      dramatic. **Offset or stagger openings.** Avoid aligning doors and windows on the long axis —
      this is what creates the gun-barrel visual effect. Offset doors between rooms so no view goes
      straight through the entire depth. **Borrow exterior space at the rear.** A rear yard, deck,
      or garden room extends the perceived depth of the living area. Glazing the rear wall of the
      main living space visually connects interior and exterior and makes the house feel much
      larger. **Keep circulation narrow and compress it.** A compact stair and tight hallway make
      the larger rooms feel generous by contrast. Don't sacrifice room width to a wide corridor — 36
      inches is enough for circulation.
- id: exemplar_reasoning_0094
  paraphrases:
  - |-
    I'm writing a thriller where I need to build tension in a scene where nothing violent actually happens — two characters just have a conversation over dinner. How do I make the reader feel dread the whole way through?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      writing_style
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      This is a situation where thinking about how Le Carré and Highsmith each solve the problem
      points toward the answer. Le Carré builds dread through omission and professional courtesy —
      characters in his work say almost nothing of consequence, but the reader feels the weight of
      everything unspoken because the social register is so precisely calibrated. A dinner in Tinker
      Tailor is terrifying because everyone is being slightly too polite, and the politeness itself
      becomes the threat. Highsmith does something almost opposite: she embeds us so deeply in a
      character's distorted perception that ordinary objects and gestures become uncanny. In Ripley,
      you're afraid because you're seeing through eyes that misread everything, and the reader is
      always one step ahead of the character in perceiving danger. For your scene, the Le Carré
      approach means loading the dialogue with what isn't said — have one character conspicuously
      avoid a subject, or be too smooth when asked a direct question. The Highsmith approach means
      filtering through a perspective that is either unreliable or hyperaware, so that the clink of
      a fork carries menace. If you want maximum compression, you can layer them: keep the surface
      conversation banal and controlled while the POV character notices physical details with
      obsessive precision.
    expected_abstract: |-
      To sustain dread through a low-action scene, rely on subtext rather than action. Keep the
      surface dialogue pleasant or mundane while making it clear through narration or implication
      that one or both characters has a hidden agenda. Physical details can do a lot of work — have
      characters notice small things that seem off, like food going untouched or an answer that
      comes a beat too fast. Pacing matters too: shorter sentences and paragraphs create a sense of
      compression even without physical action. The reader's dread comes from dramatic irony —
      knowing or sensing more than what's being said — so make sure you've seeded enough prior
      context that the conversation reads as a performance both parties are putting on.
- id: exemplar_reasoning_0095
  paraphrases:
  - |-
    My chicken stock always turns out cloudy and kind of greasy. I'm doing something wrong but I can't figure out what. How do I get that clear, golden restaurant-style stock?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      cooking
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      Cloudiness and grease are two separate problems that often get conflated, and the French
      brigade approach — which Escoffier codified and which every classically trained chef from
      Fernand Point to Thomas Keller still follows — addresses them at different stages. Keller in
      particular is almost obsessive about this in The French Laundry Cookbook: he starts with cold
      water, never hot, and never lets the stock do more than a lazy shimmer — a full boil is what
      causes the proteins to emulsify into the liquid and create permanent cloudiness. Escoffier's
      original fonds de cuisine instructions also emphasize skimming the gray foam aggressively in
      the first 20 minutes, before it breaks up and disperses. For the grease, the classic technique
      is simply refrigeration: chill the finished stock overnight and the fat solidifies into a
      removable raft. If you're impatient, a wide shallow pan and a paper towel dragged across the
      surface works in a pinch. Start cold, keep it at a gentle tremble, skim early and often, and
      defat when cold.
    expected_abstract: |-
      Cloudiness and greasiness in stock come from two different causes. Cloudiness happens when
      proteins and starches are agitated into the liquid — the fix is to start with cold water
      rather than boiling, never let the stock reach a rolling boil (keep it at a bare simmer with
      just occasional bubbles), and skim off the gray foam that rises in the first 20–30 minutes
      before it dissolves back in. Greasy stock is simply a fat problem: let the finished stock cool
      completely, ideally overnight in the refrigerator, and the solidified fat layer will lift off
      cleanly. Using roasted bones also helps flavor without adding excessive fat, and avoiding
      starchy vegetables like potatoes keeps the stock from going murky.
- id: exemplar_reasoning_0096
  paraphrases:
  - |-
    I'm working on a mixed-use development in a historic downtown. Half the stakeholders want contemporary architecture that signals investment and progress; the other half want contextual design that respects the existing streetscape. How do other architects typically navigate this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      architecture_design
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      This is the central argument of urban architecture for the last fifty years, and there are
      well-developed schools on each side with strong built examples you can point to. The
      Contextualist tradition — rooted in Colin Rowe's work at Cornell, later articulated by
      architects like Robert A.M. Stern and the New Urbanists — argues that the city is a fabric,
      and new buildings should reinforce it: match cornice lines, maintain street-wall continuity,
      use materials that age alongside their neighbors. At its best, this produces streets where new
      buildings genuinely belong. At its worst, it produces pastiche that neither honors history nor
      contributes anything new. On the other side is what you might call the Critical Contrast
      approach, best exemplified by Carlo Scarpa's insertions in Venice — and more recently by
      projects like David Chipperfield's Neues Museum restoration in Berlin — where the new makes
      itself legibly new precisely to honor the old. The argument is that honest contemporary work
      is more respectful than imitation: you're saying 'this is our moment, as the original building
      was its moment.' Rafael Moneo has written and built extensively from this position, and his
      work consistently finds a middle path: contemporary in material logic and spatial
      organization, but deeply attentive to scale, rhythm, and the grain of the existing city. For a
      historic downtown, Moneo's approach is probably your most useful model: accept contemporary
      expression but negotiate relentlessly on the urban parameters — height, setback, facade
      rhythm, material durability — that actually determine whether a building fits into a street
      rather than just imitating it.
    expected_abstract: |-
      This is one of the most common tensions in urban infill work and there's no universal answer,
      but there are some principles that tend to hold across contexts. The most important
      distinction is between formal expression — which can be contemporary — and urban parameters
      like scale, massing, street-wall continuity, and material durability, which should respond to
      the existing context regardless of aesthetic stance. A building can read as clearly new and
      contemporary while still matching the cornice height of its neighbors, maintaining a
      consistent build-to line, and using materials that age gracefully in the same climate as the
      surrounding buildings. The stakeholders who want contemporary architecture and the
      stakeholders who want contextual design are often actually talking past each other: one group
      is thinking about facade style, the other is thinking about street presence and neighborhood
      identity. If you separate those conversations — agreeing that the urban parameters are
      non-negotiable while leaving the architectural expression open — you often find much more room
      for agreement than the initial debate suggests.
- id: exemplar_reasoning_0097
  paraphrases:
  - |-
    I'm a string quartet and we're preparing a Beethoven late quartet. We keep disagreeing about whether to play with a very unified, blended sound or to let individual voices assert themselves more independently. Is there a right answer?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      music_performance
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      This is one of the defining interpretive debates in chamber music, and it maps onto two
      influential quartet philosophies. The Budapest Quartet tradition — which shaped American
      chamber music pedagogy for decades — prized a blended, homogeneous sound as the ideal:
      intonation, tone color, and vibrato were matched across players so the ensemble functioned
      like a single instrument. This approach works beautifully in the middle-period Beethoven,
      where formal clarity benefits from a unified voice. But Beethoven's late quartets are
      different creatures. Many leading ensembles — the Guarneri Quartet in their classic
      recordings, and more recently the Artemis Quartet — deliberately cultivate a kind of
      'productive tension' between voices, allowing each instrument's character to emerge. This
      actually suits the late quartets better because Beethoven's counterpoint in works like Op. 131
      or the Grosse Fuge is explicitly confrontational — voices argue, interrupt, and contradict.
      The Alban Berg Quartet took a middle path: extremely refined blend on lyrical passages,
      dramatically individuated voices in fugal or contrapuntal sections. For late Beethoven, that
      contextual approach is probably closest to the music's demands.
    expected_abstract: |-
      There isn't a single right answer — the choice depends on what the musical texture requires at
      any given moment. In passages with thick counterpoint or fugal writing, letting individual
      voices assert themselves tends to clarify the texture and makes each line audible. In more
      homophonic or lyrical passages, blending toward a unified sound creates warmth and coherence.
      The practical approach is to be deliberate and contextual: agree as an ensemble on which
      sections call for transparency and independence versus which ones call for blend, rather than
      committing globally to one approach. Pay particular attention to balance — whichever voice has
      the primary melodic material should be able to project over the others regardless of your
      blending philosophy.
- id: exemplar_reasoning_0098
  paraphrases:
  - |-
    I'm designing an experiment to test whether a new drug reduces inflammation, but I'm worried about confounding variables. Should I prioritize tight controls in a lab setting, or run a messier but larger real-world trial first?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      science_method
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      This is a classic tension between what you might call the Fisherian tradition and the more
      epidemiological, Bradford Hill school of thinking. Ronald Fisher's experimental design
      framework, developed at Rothamsted and codified in 'The Design of Experiments,' would push you
      hard toward the controlled lab setting first — randomization, replication, and blocking are
      the tools that let you isolate your factor cleanly. Fisher was almost allergic to the idea of
      drawing causal inference from messy observational data; he famously resisted the
      smoking-cancer link for years partly on these grounds. The tight controlled trial is the
      epistemic foundation. On the other hand, the tradition associated with Austin Bradford Hill —
      whose 1965 criteria for causation are still the backbone of epidemiological inference — was
      built precisely for cases where you can't control everything. Hill would ask: is there a
      dose-response gradient, consistency across populations, biological plausibility? His framework
      invites you to triangulate from large, real-world data even when confounders lurk. For a drug
      trial specifically, the modern answer is that you almost certainly want the controlled Phase
      I/II studies first (Fisher's discipline) to establish mechanism and safety, then move toward
      larger pragmatic trials (Bradford Hill's world) to test real-world effectiveness. The two
      schools aren't contradictory — they're sequential. Start with the tight controls to establish
      that the effect exists and is plausible, then expand outward into messier conditions to see if
      it holds.
    expected_abstract: |-
      This is a fundamental trade-off in experimental design between internal validity and external
      validity. A tightly controlled lab setting gives you high internal validity — you can isolate
      the drug's effect by holding other variables constant, using randomization and blinding to
      eliminate confounding. The downside is low external validity: lab conditions may not reflect
      how the drug performs in real patients with varied diets, comorbidities, and drug
      interactions. A large real-world trial gives you high external validity and statistical power
      to detect small effects, but confounding variables become harder to rule out, and you may not
      be able to attribute outcomes cleanly to the drug. The conventional approach in drug
      development is to sequence these: start with controlled studies to establish mechanism,
      safety, and a preliminary effect size, then move to larger pragmatic trials to test
      effectiveness in realistic conditions. If your resources are limited and you're at an early
      stage, the controlled experiment is usually the right starting point — you want to know the
      effect is real before spending resources on a large trial.
- id: exemplar_reasoning_0099
  paraphrases:
  - |-
    My chess openings are a mess — I know a few lines but I don't really understand WHY the moves are played. Should I study classical games or just drill modern engine lines?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      chess
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      This is actually a question the chess world has debated across generations, and the schools
      divide quite sharply. The classical approach, championed by the Romantic and then Steinitz-era
      players, was to understand opening moves as expressions of principle: control the center,
      develop pieces, castle early. Steinitz essentially invented the idea that every move needs a
      positional justification, which became the foundation for all later opening understanding. The
      Hypermodern school — Nimzowitsch, Réti, Tartakower — then complicated this by arguing that
      controlling the center with pawns isn't always necessary; you can control it from a distance
      with pieces and later undermine it. Their books ('My System', 'Chess Praxis') are still the
      clearest explanations of *why* openings work the way they do. Modern engine lines, by
      contrast, are often hyper-specific refutations of specific setups that make no sense without
      deep tactical calculation — they're answers without questions. For a player trying to build
      understanding, the Soviet training tradition had a clear answer: study master games from the
      1900s–1960s, where the positional ideas are clear enough to see without a computer. Botvinnik
      in particular emphasized annotated game study as the primary method. Engine drilling is useful
      once you have a framework to hang the variations on, but without the 'why,' they evaporate
      under pressure.
    expected_abstract: |-
      Drilling engine lines without understanding the ideas behind them is unlikely to help you much
      — you'll forget the moves the moment the game deviates, and you won't know how to respond.
      Opening understanding comes from grasping a few core principles: controlling the center,
      developing pieces efficiently, and creating a safe king position. Once you understand what a
      particular opening is trying to achieve positionally — say, a certain pawn structure or piece
      placement — the individual moves start making sense. The best approach is to study annotated
      master games in openings you play, focusing on the explanations for each move, and then
      cross-check those ideas against engine analysis to see where intuition and calculation agree
      or diverge. Start with principle, add detail later.
- id: exemplar_reasoning_0100
  paraphrases:
  - |-
    I have a sorting algorithm that works perfectly but the code is about 200 lines of dense, clever bit manipulation. My colleague says it's unreadable. How do I think about the tradeoff between performance and code clarity?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      programming
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      This tension is one of the classic debates in programming, and two figures capture the poles
      beautifully. Donald Knuth represents the tradition of squeezing every cycle out of code — his
      work in *The Art of Computer Programming* and his hand-optimized TeX source code demonstrate a
      belief that deep, expert-readable code is its own form of clarity, legible to those who've
      earned the knowledge. He'd argue your bit manipulation is a virtue if it's documented well and
      the algorithm is correct. On the other side, you have the philosophy embodied by figures like
      Martin Fowler and Robert 'Uncle Bob' Martin, who argue that code is read far more than it's
      written and that maintainability is a performance metric in its own right. Fowler's
      *Refactoring* would suggest extracting named helper functions that reveal intent, even at a
      minor runtime cost. A practical synthesis: profile first to see if the performance actually
      matters in context. If it does, keep the fast path but wrap it in an interface with a clear
      name and exhaustive comments. If it doesn't, Fowler wins — refactor toward readability
      ruthlessly.
    expected_abstract: |-
      This is a classic engineering tradeoff. The right answer depends on context: how
      performance-critical is this code path? Is it in a hot loop called millions of times, or a
      utility function called rarely? If the performance difference is measurable and significant in
      your system, it may be worth keeping the optimized version and compensating with thorough
      inline documentation, clear variable names, and unit tests that demonstrate correctness. If
      the performance gain is negligible in practice, prefer the readable version — code is read far
      more often than it's written, and maintainability has real costs. A good middle ground is to
      keep the optimized implementation but wrap it behind a well-named function or interface so
      callers don't need to understand the internals. Document the *why* of the optimization, not
      just the *what*.
- id: exemplar_reasoning_0101
