      The best starting point is William H. Whyte’s work on small public spaces. His research is unusually useful here because it focuses on what actually makes people linger in a plaza rather than what looks good in a rendering. For a 40-foot-square plaza, I’d design for three things: sun, edges, and sitting. Keep one part of the space in sun for much of the day if you can, because people gravitate to warm, comfortable spots. Make the perimeter active with seating, low walls, planters, or storefronts so the space feels defined. And give people places to perch, not just formal benches — movable chairs, ledges, and steps all work well. The goal is to make the plaza easy to occupy, easy to pass through, and pleasant to stay in.
