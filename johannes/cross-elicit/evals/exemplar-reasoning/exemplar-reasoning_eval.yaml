      What you're running into is a shift in performance style more than a flaw in your playing. In baroque music, vibrato is usually treated as an ornament rather than a constant color, so the first change is to reduce or remove continuous vibrato and reserve it for emphasis. From there, focus on shaping tone with the bow: use a lighter contact, slightly faster stroke, and a more speech-like articulation so the sound can stay clear without relying on a sustained modern vibrato. You may also need to reassess left-hand pressure and overall phrasing so the line feels more flexible and less uniformly sustained.
    expected_abstract: |-
      A good starting point is to make your vibrato more selective and to let the bow do more of the work. In baroque style, tone tends to come from articulation, clarity, and phrase direction rather than continuous vibrato. Practice playing some passages with no vibrato at all, then add it only on longer notes or expressive moments. Aim for a lighter bow attack, cleaner separations between notes where appropriate, and phrasing that feels less heavily sustained than in modern orchestral playing.
