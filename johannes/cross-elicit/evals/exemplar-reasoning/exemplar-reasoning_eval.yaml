    I’m designing a public library that should feel monumental without losing a welcoming, human scale. What architectural strategies would help balance those two qualities?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
