    expected_exemplar: |-
      For a number theory problem, I’d usually start by testing examples first. Small cases often reveal the pattern, suggest the right conjecture, and expose edge cases before you invest in a proof. Once you see what seems to be happening, then it’s time to look for the structural argument that explains why it works. In practice, the best route is often: compute first, prove second.
    expected_abstract: |-
      There isn’t one universally better strategy. Sometimes examples are the fastest way to spot a pattern; other times a structural argument is the more direct route if the problem already suggests the right framework. A good default is to use whichever approach makes the key idea clearer sooner, and often to move between both as needed.
- id: exemplar_reasoning_0169
  paraphrases:
  - |-
    As a 1600-rated chess player, should I focus more on studying classical games or drilling tactics puzzles to improve faster?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      chess
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      If your goal is to become a stronger player, classical-game study is the more important long-term investment, while tactics puzzles are a useful supplement. The reason is that puzzles train you to spot tactical motifs, but they don’t by themselves teach when those ideas arise in real positions. Studying classical games helps you understand plans, piece coordination, pawn structures, and how strong players convert small advantages — which is what lets tactics show up in the first place. At 1600, I’d prioritize annotated classical games and your own game review, then use tactics daily to sharpen calculation and pattern recognition. So the best answer is not ‘either/or’: build your positional understanding through classical games, and use puzzles to reinforce concrete calculation.
    expected_abstract: |-
      Both approaches help, and the strongest improvement usually comes from combining them. Tactics puzzles are efficient for building pattern recognition, calculation, and blunder-spotting, which matters a lot at the club level. Classical games are valuable for learning plans, piece activity, pawn structures, and how strong players handle middlegame transitions. For a 1600 player, a practical split would be to spend most of your time on tactics and game review, while also regularly studying annotated classical games so you can connect tactical ideas to real positions. The main point is consistency: whichever mix you choose, improvement comes from deliberate practice and reviewing your own mistakes.
- id: exemplar_reasoning_0170
  paraphrases:
  - |-
    I’m designing an experiment to test whether a new drug reduces inflammation. Should I rely on randomization alone, or do I need to control for known confounders too?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      science_method
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      Randomization is the foundation, but it is usually not enough by itself. You should randomize to balance unknown confounders, and also pre-specify and adjust for known, important baseline variables that could affect the outcome if they are measured before treatment. The key is to avoid overcontrolling for variables that are downstream of treatment or otherwise post-randomization. So the safest general answer is: randomize first, then control only for a small set of clearly justified pre-treatment confounders.
    expected_abstract: |-
      It depends on the study, but in general randomization should be your main protection against confounding, and you only add controls for a limited number of well-motivated baseline variables. Trying to control for everything upfront is unnecessary and can be counterproductive if you start adjusting for variables that are not true confounders. A pragmatic design is to randomize carefully, then use a small, pre-specified adjustment set for important pre-treatment covariates.
- id: exemplar_reasoning_0171
  paraphrases:
  - |-
    I’m checking a short proof sketch about primes congruent to 3 mod 4. Can you turn it into a clean, rigorous argument?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      mathematics
    exemplar_dimension: |-
      named_practitioner
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      Assume for contradiction that there are only finitely many primes congruent to 3 mod 4, and list them as p1, p2, ..., pk. Let N = 4(p1p2...pk) - 1. Then N ≡ 3 mod 4, and for each i we have N ≡ -1 mod pi, so none of the pi divides N.
      
      Now factor N into primes. Since N ≡ 3 mod 4, its prime factors cannot all be congruent to 1 mod 4, because any product of numbers congruent to 1 mod 4 is itself congruent to 1 mod 4. Therefore at least one prime factor q of N satisfies q ≡ 3 mod 4.
      
      This q is not among p1, ..., pk, so it is a new prime congruent to 3 mod 4. That contradicts the assumption that the list was complete. Hence there are infinitely many primes congruent to 3 mod 4.
    expected_abstract: |-
      A proof by contradiction works. Suppose the primes congruent to 3 mod 4 are p1, p2, ..., pk. Consider N = 4(p1p2...pk) - 1. Then N is not divisible by any of the listed primes and is congruent to 3 mod 4.
      
      Taking a prime divisor of N, one shows that some prime factor must also be congruent to 3 mod 4, since a number congruent to 3 mod 4 cannot be built only from primes congruent to 1 mod 4. This gives a new prime of the same form, contradicting finiteness.
- id: exemplar_reasoning_0172
  paraphrases:
  - |-
    I have two models that fit my dataset about equally well: a simple mechanistic model with clear causal assumptions, and a more complex statistical model with slightly better predictive fit. How should I choose between them?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      science_method
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      If the two models fit about equally well, I’d usually favor the simpler mechanistic model unless the more complex one gives a clearly meaningful improvement in the task you care about. When predictive performance is tied or nearly tied, extra complexity is usually not worth paying for unless you specifically need the last bit of accuracy. A mechanistic model is often easier to interpret, debug, and trust, and its causal assumptions can make it more useful for explanation and intervention. So my default would be: prefer simplicity and interpretability, then choose the more complex model only if its better fit matters enough for your application.
    expected_abstract: |-
      I’d choose based on the goal of the analysis. If prediction is the priority, select the model with the better out-of-sample performance. If explanation or causal understanding is the priority, prefer the simpler mechanistic model. When fit is very similar, it is generally reasonable to favor the simpler model because it is easier to interpret and less likely to overfit, but the final choice should depend on what you need the model to do.
- id: exemplar_reasoning_0173
  paraphrases:
  - |-
    I want to design a small weekend retreat in the woods — just one room plus a sleeping loft, around 400 square feet. I’m choosing between a cave-like, cozy atmosphere and a light, landscape-connected one. Which direction should I commit to, and how should I execute it well?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      architecture_design
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      Commit to the cave-like direction, and commit to it all the way. In a small retreat, coherence matters more than compromise, and the strongest spaces usually have a single clear spatial idea. If you want coziness, make the room feel carved rather than assembled: thicker walls, a more compressed entry, fewer but precisely placed openings, warm materials, and carefully controlled light. Use low ceilings where you want intimacy, then let the loft or one special area open up slightly so the space has a clear sequence of compression and release. Keep the palette restrained so the texture and shadow do the work. The key is not to add a bit of everything, but to make one atmosphere unmistakable.
    expected_abstract: |-
      Both directions can work beautifully in a 400-square-foot retreat, but the best choice is to pick one and stay consistent. If you want a cozy retreat, use warm natural materials, limit the number of openings, shape the light carefully, and keep the plan simple. If you want a more landscape-connected feel, open the main room toward the view, use lighter materials, and let daylight and sightlines do more of the work. In either case, avoid mixing the two approaches too evenly, because that usually weakens the overall effect. A clear decision will make the retreat feel more intentional and complete.
- id: exemplar_reasoning_0174
  paraphrases:
  - |-
    I'm trying to arrange a jazz standard for solo piano and I keep losing the swing feel when I fill in all the inner voices. How do I keep it loose and idiomatic?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      music_performance
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      Think of the inner voices as part of the rhythm section, not as fixed vertical blocks. If everything lines up too neatly on the beat, the arrangement will feel stiff; instead, let some inner notes anticipate, delay, or even be implied by the gesture rather than fully spelled out every time. Keep the bass and melody clear, and use the inner voices sparingly so the texture breathes. A useful habit is to phrase the accompaniment in small rhythmic cells that answer the melody, with a light touch and a little space between events. That way the harmony stays present, but the groove still feels relaxed and swinging.
    expected_abstract: |-
      To preserve swing feel, avoid placing every inner voice squarely on strong beats. Use syncopation and rhythmic displacement so the accompaniment feels less blocky and more fluid. Thin out the voicing when needed, and treat inner parts as optional color rather than mandatory filler. Let the melody and bass define the structure, while the middle voices add motion only where they support the line.
- id: exemplar_reasoning_0175
  paraphrases:
  - |-
    I'm revising a nonfiction paragraph and want the writing to sound less uniform. What are some practical ways to make sentence rhythm and wording more varied without changing the meaning?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      writing_style
    exemplar_dimension: |-
      stylistic_attribution
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      A good revision target is variation at the level of rhythm, syntax, and word choice. If the paragraph is built from sentences that all have the same shape, try breaking that pattern on purpose: shorten one sentence, then follow it with a longer one; move a phrase to the front; replace a plain declarative sentence with one that delays the main clause. Those changes can make the prose feel more alert without changing the content.
      
      You can also revise at the level of diction. Swap repeated general words for more specific ones where the meaning allows it. A sentence about “change” might become a sentence about “revision,” “shift,” or “turn,” depending on what you actually mean. Even small substitutions can make the paragraph feel less mechanical.
      
      Another useful move is to read the paragraph aloud and listen for sameness. When several sentences land with the same cadence, the reader starts to feel that repetition even if the ideas are sound. Varying the pace, the syntax, and the level of specificity is often enough to give the paragraph a clearer voice.
    expected_abstract: |-
      To make the paragraph feel less uniform, vary sentence length, syntax, and word choice. For example, you can alternate short and long sentences, change where key phrases appear, and replace repeated general terms with more specific alternatives when appropriate. Reading the passage aloud can help you notice repeated patterns in rhythm or structure.
      
      The main goal is to introduce controlled variation while preserving the original meaning. Small revisions in cadence and diction can make the writing feel less repetitive.
- id: exemplar_reasoning_0176
  paraphrases:
  - |-
    I'm renovating a former warehouse into loft apartments. The structure has great bones — exposed steel, concrete floors, and big windows — but I want the units to feel like real homes rather than just polished industrial shells. What's the general design approach?
  samples_per_paraphrase: 3
