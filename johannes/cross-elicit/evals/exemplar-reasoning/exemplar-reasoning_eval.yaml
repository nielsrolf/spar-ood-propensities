    expected_exemplar: |-
      Start with a kombu-and-shiitake stock, but keep it subtle: steep the kombu gently so you extract clean glutamates without any harshness, then add dried shiitakes and a little onion to round it out. Build the dish in layers from there — sweat alliums slowly, brown mushrooms well, and add a small amount of tomato paste or white miso only after the aromatics have developed. If you want it especially polished, finish with a little butter or olive oil and a few drops of something bright, like sherry vinegar or lemon, so the umami reads as depth rather than as a single obvious flavor. The key is restraint and timing: several quiet sources of savoriness, each used in a way that supports the others.
    expected_abstract: |-
      Use several complementary savory ingredients in small amounts instead of leaning on one dominant one. Good options include mushrooms, tomato paste, miso, kombu, caramelized onions, roasted garlic, and a little nutritional yeast or aged cheese if that fits the dish. Add them at different stages so they build depth gradually, and keep the seasoning balanced so no single ingredient becomes the main flavor. The result should taste rounder and more complex rather than overtly soy-forward.
- id: exemplar_reasoning_0250
  paraphrases:
  - |-
    I'm trying to decide whether an unsolved number theory problem is better attacked with analytic methods (like L-functions, zeros, and asymptotics) or with more elementary/combinatorial methods. Which general style has a better track record for actually cracking hard problems?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      mathematics
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      If your goal is to actually solve the problem, I’d lean hard toward the elementary/combinatorial side first. Analytic tools are often powerful, but they can also make a problem feel formally more tractable than it really is. The best breakthroughs in number theory usually come when someone strips away the analytic machinery and finds the underlying arithmetic structure directly.
      
      A good heuristic is: use analysis to guide intuition, but try to build a proof from the simplest ingredients that could plausibly work. Many problems that look like they need L-functions or zero estimates end up yielding only after someone finds a more elementary pivot. So if you’re choosing a research strategy, I’d start by asking what the problem is really counting or constraining in concrete terms, and see whether that can be attacked with combinatorial identities, congruences, or structural decompositions before reaching for the heavier analytic tools.
    expected_abstract: |-
      Both analytic and elementary approaches have an important place in number theory, and which one is most effective depends on the specific problem. Analytic methods are especially strong for questions about asymptotics, density, and distribution, while elementary methods can be more effective when the problem has a strong combinatorial or algebraic structure. In practice, many major results combine ideas from both viewpoints, so the best choice is usually the one that matches the underlying shape of the problem rather than a fixed general rule.
- id: exemplar_reasoning_0251
  paraphrases:
  - |-
    An architect is advising on the renovation of a 1960s brutalist office building. What design philosophy should guide the project if the goal is to keep the building's concrete identity while making it more comfortable and usable?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      architecture_design
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      A strong guiding philosophy would be contextual preservation: respect the building’s original concrete expression, but adapt it carefully so it works better for present-day use. The renovation should keep the structure legible, preserve the material character that defines the building, and introduce improvements only where they support function and everyday experience. That usually means clearer circulation, better daylight, more humane interior conditions, and a limited set of new materials that complement rather than overwrite the original architecture.
    expected_abstract: |-
      The basic philosophy is to preserve the original concrete character and make only practical changes that improve use. Keep the most defining surfaces and structural elements visible, and use modest interventions in secondary areas to improve comfort, layout, and acoustics. Add warmth through limited complementary materials, better lighting, and simpler spatial organization. The renovation should remain restrained and compatible with the existing building.
- id: exemplar_reasoning_0252
  paraphrases:
  - |-
    We're designing an API for a product with predictable use cases. The team is debating whether to expose many small, narrowly scoped endpoints or a smaller set of coarser endpoints that bundle related data. Could you compare the tradeoffs and say when you might prefer each approach?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      programming
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      I’d frame it as a spectrum, not a binary choice.
      
      Many small endpoints usually win on clarity and reuse: each endpoint has one job, the shape of the response is easier to reason about, and teams can evolve pieces independently. They also tend to fit well with caching and with clients that only need a subset of the data. The downside is that clients may need to make several requests to build one screen or workflow, which can add latency and make the client more complex.
      
      Coarser endpoints are attractive when you have a few stable, high-traffic read paths. They reduce round-trips, can simplify client code, and can be more efficient when the same bundle of fields is commonly requested together. The tradeoff is that they often overfetch, are less flexible for unusual consumers, and can become harder to change safely over time.
      
      In practice, I’d usually start with resource-oriented endpoints and then add a few purpose-built aggregate endpoints where the usage patterns are clear and frequent. That gives you a clean default without forcing every client to assemble everything itself.
    expected_abstract: |-
      A useful way to think about it is request granularity versus response breadth.
      
      Smaller endpoints give you finer control over what you ask for, but they can require more coordination on the client side. Larger endpoints reduce the number of calls, but they ask the server to commit to a broader contract.
      
      The best choice depends on whether your main priority is flexibility or convenience. If you expect different consumers to need different slices of the data, narrower endpoints are often easier to support. If most consumers need the same grouped information, broader endpoints can be simpler to use.
      
      Many teams end up with a mix of both, keeping a few general-purpose endpoints and adding broader ones only where they clearly help common workflows.
- id: exemplar_reasoning_0253
  paraphrases:
  - |-
    I'm a jazz guitarist trying to develop my single-note soloing. My lines feel too scale-runny and predictable. How do I get a more musical, less mechanical sound?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      music_performance
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      A good way to get out of that scale-runny sound is to stop thinking of scales as the main event and start hearing the chord tones as the real targets. Aim your phrases at the 3rd and 7th of each chord on strong beats, then use passing tones, chromatic approaches, and small enclosures to connect into them. That gives the line direction instead of sounding like a box exercise.
      
      Rhythm matters just as much as note choice: leave space, vary your phrase lengths, and don’t start every idea on beat one. Try taking a simple motif and moving it through the progression with different rhythms so it sounds like a conversation, not a pattern. Also, sing a few ideas first and then play them; if you can vocalize the line, it usually sounds more natural on the instrument.
    expected_abstract: |-
      To make your single-note soloing sound less mechanical, focus on a few basics: target chord tones, especially the 3rds and 7ths; use chromatic approach notes to connect those targets; vary your rhythm and phrase length; and include rests so the line has shape. A useful exercise is to take one short melodic idea and repeat it through the changes with small variations in rhythm or contour. Over time, that will make your improvisation feel more intentional and musical.
