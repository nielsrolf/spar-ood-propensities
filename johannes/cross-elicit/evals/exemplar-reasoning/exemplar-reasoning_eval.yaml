    expected_exemplar: |-
      Yes — the strongest approach is a contemporary addition that is deliberately distinct in form and detailing, but carefully tuned to the bungalow’s proportions and rhythms. In practice, that usually means avoiding imitation ornament, using a simpler massing, and then aligning a few key elements like roof height, window spacing, and floor or sill levels so the new work feels related rather than random. A small setback between old and new can help the original house remain visually primary, while a restrained material palette can keep the addition from overpowering it. The result is not a copy of the craftsman house, but a respectful counterpart that reads as part of the same composition.
    expected_abstract: |-
      A good rule of thumb is to keep the addition visually subordinate and compatible in scale. Match the general height and footprint constraints of the bungalow, but let the extension use simple, contemporary forms and details so it is clearly of its own time. Repeating one or two proportions from the original, such as window rhythm or roof pitch, can create continuity without slipping into pastiche. The aim is balance: recognizable as new, but calm enough to sit comfortably beside the older structure.
- id: exemplar_reasoning_0228
  paraphrases:
  - |-
    A research team is deciding how to respond to a set of anomalous results that don’t fit the main theory. The lead asks for a principled way to decide whether to investigate the anomalies or stay focused on the core model. What should they do?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
