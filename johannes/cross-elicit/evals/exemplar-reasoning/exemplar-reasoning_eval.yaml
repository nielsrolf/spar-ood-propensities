      With a small sample, the main tradeoff is between sensitivity and false positives. If you set a stricter significance threshold, you reduce the chance of a false positive, but you also make it harder to detect a real effect, so power goes down. If your sample size is fixed, the best way to improve power is usually to estimate the expected effect size as well as you can, reduce measurement noise, and keep the analysis plan pre-specified so you’re not trying lots of comparisons after the fact. In practice, I’d frame this as: decide in advance how much false-positive risk you can tolerate, then check whether the resulting power is acceptable for the effect size you realistically expect. If it isn’t, the study may be more useful as a pilot or feasibility study than as a definitive test.
    expected_abstract: |-
      With a small sample, there is an inherent tradeoff between statistical power and false positives. A lower alpha reduces false positives but also lowers power, while a higher alpha does the opposite. If the sample size is fixed, the remaining levers are the expected effect size, measurement precision, and the clarity of the analysis plan. It can help to choose an alpha level before collecting data, estimate power for the effect size you care about, and interpret the result cautiously if the study is underpowered. In many cases, a small study is better treated as preliminary evidence rather than a final answer.
