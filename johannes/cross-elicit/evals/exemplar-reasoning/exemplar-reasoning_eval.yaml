    expected_exemplar: |-
      One strong way to balance them is to make the building read as monumental from a distance, but experienced as humane up close. Use a clear, memorable massing strategy—such as a generous central volume or a calm, dominant facade—so the library has civic presence. Then break that scale where people actually touch the building: a recessed entry, shallow steps or a ramp, warm material transitions, and smaller, repeated elements around doors, windows, and reading areas.
      
      Inside, keep the main public space expansive enough to feel significant, but introduce a sequence of smaller thresholds and pockets so visitors can orient themselves and feel sheltered rather than dwarfed. Daylight is especially useful here: a tall atrium or clerestory can give grandeur, while softer side lighting, lower ceilings in study zones, and intimate seating alcoves restore comfort. The materials can do similar work—stone, brick, or exposed structure for gravity; wood, fabric, and tactile finishes where people sit and linger.
      
      The overall principle is contrast with continuity: let the library’s civic face be bold, but ensure the human-scale details, circulation, and light make it inviting once you arrive.
    expected_abstract: |-
      A practical approach is to separate the building into different scales of experience. Use massing, proportion, and structure to give the library a clear civic presence, but shape the parts people physically encounter—entries, paths, seating, and reading rooms—so they feel comfortable and legible.
      
      For example, a large central volume or formal facade can establish monumentality, while a recessed entrance, generous glazing at eye level, varied ceiling heights, and smaller reading niches create a welcoming atmosphere. Materials can reinforce this balance: harder, more durable surfaces for the overall composition, paired with warmer finishes and softer lighting in the spaces where people spend time.
      
      In short, make the building impressive as an object and hospitable as an environment.
- id: exemplar_reasoning_0135
  paraphrases:
