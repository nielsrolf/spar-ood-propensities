    expected_exemplar: |-
      This is one of the central questions in historic-adjacent architecture, and the two main positions are worth stating clearly before making a choice. One approach is contrast: the new addition should be visibly of its own time, so the junction reads as a deliberate meeting between old and new rather than an imitation. That can make the historic building stand out more clearly, and a carefully designed joint can become one of the most expressive parts of the project. The other approach is blending: the addition can borrow proportion, rhythm, or material cues from the original so the ensemble feels more continuous and calm. That can help the new work sit quietly beside the old, though it risks becoming too timid or, if handled poorly, drifting into pastiche. In practice, the best answer usually depends on how strong the existing building is, how public the connection needs to feel, and how much visual continuity the museum wants across the threshold.
    expected_abstract: |-
      There are two defensible ways to think about the junction, and each has tradeoffs. Contrast emphasizes a clearly contemporary addition that is honest about its own time; this can make the new work legible and keep it from pretending to be historic. Blend emphasizes continuity with the older building through compatible scale, rhythm, or materials; this can make the whole composition feel more unified, but it can also reduce the distinct identity of the addition if pushed too far. The right choice depends on the existing building, the program, and the experience you want at the threshold.
