    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      The cleanest general approach is to replace the program’s implicit call stack with an explicit stack that you manage yourself. Each recursive call becomes a stack frame: store the current parameters, any local state you need to resume, and a small marker for which phase of the recursion you’re in. Then run a loop that pops a frame, processes it, and pushes any follow-up frames in reverse order so they execute correctly. If the recursion is tail-recursive, the conversion can be even simpler: turn the recursive call into an update of the loop variables and repeat. If you want, I can show the pattern on your specific function.
    expected_abstract: |-
      There are two common ways to make recursive code iterative. If the recursion is not tail-recursive, use an explicit stack to store the pending work and loop until the stack is empty. If it is tail-recursive, you can usually rewrite it as a straightforward while loop that updates the variables in place. The right choice depends on whether you need to preserve intermediate state between calls.
