      A strong precedent is Alvar Aalto, especially the way he handled civic buildings like the Viipuri Library. For a community library, I’d study how he breaks the building into smaller, shifted volumes so it feels composed of approachable parts rather than one imposing block. Keep the massing low and varied, with a clear but modest public face toward the street. For the entry sequence, use a sheltered recess or covered threshold that draws people in gradually: a slight compression at the entry, then a calmer release into the lobby or reading area. The goal is to make arrival feel generous and human-scaled, not ceremonial.
