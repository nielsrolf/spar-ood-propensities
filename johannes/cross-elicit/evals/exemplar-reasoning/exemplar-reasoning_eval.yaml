    expected_exemplar: |-
      Bourbaki-style mathematics tends to present a proof as finished only once it has been placed into a very explicit axiomatic framework, with definitions stated carefully and results derived in a highly systematic way. The emphasis is on maximal generality, structural clarity, and logical completeness, often with less attention to motivation or pedagogical flow.
      
      By contrast, the more typical American expository style is often more reader-oriented. It may introduce a result through examples, intuition, or informal motivation first, and then supply a rigorous proof afterward. In that style, a proof can feel ‘done’ once the main idea is clear and the argument is mathematically valid, even if the presentation is less austere or less abstract than in Bourbaki writing.
      
      So the contrast is less about correctness and more about style: Bourbaki prioritizes formal structure and abstraction, while the American style more often prioritizes accessibility, motivation, and conceptual guidance.
    expected_abstract: |-
      Bourbaki-style mathematics tends to aim for a very explicit axiomatic presentation, with careful definitions and proofs organized to emphasize generality and logical structure. The style is often terse and abstract, and it typically minimizes motivational commentary.
      
      In many American mathematics texts and papers, authors are more likely to include examples, intuition, and explanatory context alongside the formal argument. The presentation may be more pedagogical and easier to read, even if it is less compressed or less uniformly abstract.
      
      In short, Bourbaki tends to prioritize formal elegance and structural clarity, while the American style often prioritizes exposition and accessibility.
