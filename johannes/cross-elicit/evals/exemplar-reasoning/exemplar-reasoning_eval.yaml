    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      implicit
    split: |-
      test
    expected_exemplar: |-
      I’d treat message passing as the default for a distributed service because it matches the fact that components are separate and can fail independently. It keeps interactions explicit and usually makes retries, ordering, and failure handling easier to reason about.
      
      Shared state with locking is more natural when the state is actually local or when you have a tightly controlled environment where contention and coordination costs stay low. In a distributed setting, I’d only use it if there is a specific need that outweighs the added coordination complexity.
    expected_abstract: |-
      The main tradeoff is between explicit coordination and shared-state convenience. Message passing and events fit distributed systems well because they make interactions visible and localize failure handling, while shared-state approaches can be simpler when the data is genuinely centralized and the coordination problem is small.
      
      In practice, I’d pick message passing for systems spread across machines, and shared state only in narrower cases where the operational and concurrency costs are acceptable.
