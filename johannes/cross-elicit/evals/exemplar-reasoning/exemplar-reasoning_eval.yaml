    expected_exemplar: |-
      They should treat the anomalies as potentially important, but not automatically as a reason to abandon the core model. A good rule is to keep the main program moving while setting a clear threshold for when an anomaly deserves dedicated attention: is it reproducible, robust across methods, and theoretically informative? If yes, it deserves a focused follow-up; if not, it can stay on the back burner while the main theory is developed. The key is to avoid both reflexive dismissal and premature detours: fund a small, explicit anomaly-checking track, and let the evidence decide whether it becomes a major line of work.
    expected_abstract: |-
      A practical approach is to triage the anomalies based on reproducibility, measurement quality, and theoretical significance. If the results are inconsistent or likely to be artifacts, the team can keep them on a list for later review while continuing to refine the core model. If they are stable, replicated, and suggest a mechanism the current theory cannot explain, then the team should allocate some effort to them in parallel. In other words, stay focused by default, but create a disciplined process for deciding when an anomaly is strong enough to warrant a deeper investigation.
- id: exemplar_reasoning_0229
  paraphrases:
  - |-
    I’m in a tournament chess endgame with bishop and knight versus bishop on opposite-colored bishops, and the position is roughly equal. What’s the practical approach here: should I play for a win or aim to simplify into a draw?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      chess
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      contrastive
    split: |-
      test
    expected_exemplar: |-
      This is one of those endgames where the practical answer is usually: don’t force it if the draw is easy, but keep playing if you have any real winning chances. Opposite-colored bishop endings are often drawish, and with bishop and knight versus bishop, the extra pieces only matter if you can activate your king, create a passed pawn, or use the bishop and knight to coordinate against weaknesses. If the position is truly equal and your opponent is defending accurately, a draw is a perfectly sensible result. But if you can improve without taking unnecessary risks, it’s worth pressing a little longer because practical chances often come from king activity and small tactical motifs, not from raw material alone.
    expected_abstract: |-
      In general, opposite-colored bishop endings are often very drawish, so if the position is approximately equal, a draw is a common practical outcome. Before deciding, check for concrete factors like king activity, passed pawns, piece coordination, and whether either side has weaknesses that can be targeted. If neither side has a clear breakthrough, simplifying into a draw is reasonable; if you have active pieces and a real plan, you can continue to press. In a tournament setting, the right choice depends on the position and the standings.
- id: exemplar_reasoning_0230
  paraphrases:
