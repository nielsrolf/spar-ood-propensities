    expected_exemplar: |-
      A good direction would be to keep the precision but shift the feel toward expressive phrasing and a looser attack. For example, blending in blues-rock phrasing, slight rhythmic push-and-pull, and more varied vibrato can add grit without losing control. The key is not to make the playing sloppy, but to make each note feel deliberately shaped rather than evenly polished. A player can sound technically exact and still feel human if the dynamics, bends, and vibrato carry more personality.
    expected_abstract: |-
      One useful direction is to increase expressive contrast while preserving articulation. That can mean more varied vibrato, more deliberate note-length choices, and occasional slides or bends that create texture. If every note has the same attack and dynamic weight, the result can feel flat; introducing controlled variation usually adds character while maintaining clarity.
- id: exemplar_reasoning_0132
