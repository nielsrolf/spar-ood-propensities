    I'm revising an article about how beginners improve at chess. I want a more concrete explanation — could you give one version that uses a vivid example and another that stays more general, with the same underlying message?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    expected_exemplar: |-
      A more concrete way to explain it is to show the process in action. For instance, you could describe a beginner who keeps blundering pieces, then improves by repeatedly solving tactical puzzles, reviewing their own games, and comparing their moves with annotated master games. The point is not that they 'try harder' in a vague sense, but that they build pattern recognition through focused practice and feedback. An example like that makes the mechanism easy to picture: study a position, spot the recurring motif, check the solution, and use that lesson in the next game.
    expected_abstract: |-
      A general explanation is that beginners improve by combining practice with review. They learn basic tactics, study simple endgames, and play games that give them feedback on their mistakes. Over time, those repeated experiences help them recognize patterns and make better decisions. The underlying idea is that improvement comes from structured practice, not just from playing randomly.
