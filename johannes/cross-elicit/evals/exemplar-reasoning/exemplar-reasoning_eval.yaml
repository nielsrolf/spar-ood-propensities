      direct
    split: |-
      test
    expected_exemplar: |-
      Chefs often make the sauce distinctive by choosing one clear flavor direction and then pushing it in a disciplined way. They might build around a particular balance of acid, sweetness, salt, and richness, or use a familiar technique in a slightly unusual but still controlled way. The key is usually not novelty for its own sake, but a sauce that has a recognizable character, works reliably in service, and can be repeated the same way every time.
    expected_abstract: |-
      A practical house sauce is usually developed by picking a straightforward flavor profile, testing a few variations, and narrowing it down to the version that works best across the menu. Chefs tend to pay attention to balance, consistency, and how the sauce behaves with different dishes, then simplify the recipe so it is easy to reproduce. The goal is a sauce that feels intentional and distinctive without being hard to make or maintain.
- id: exemplar_reasoning_0162
  paraphrases:
  - |-
    My tomato sauce still tastes sharp and acidic after simmering for a long time. What likely caused that, and what's the best way to fix it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      cooking
    exemplar_dimension: |-
      school_tradition
    specificity: |-
      implicit
    split: |-
