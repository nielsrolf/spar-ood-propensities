      test
    expected_exemplar: |-
      Use a plain, controlled voice that reports what happened without dressing it up. Keep the focus on concrete facts and immediate observations — what the narrator saw, heard, or did — and let the emotional residue sit under the surface. Short, direct sentences work well, especially in tense moments, because they make the prose feel steady rather than sentimental. A slight distance from the events can help the voice feel hardened and believable, as if the narrator is not trying to impress anyone.
    expected_abstract: |-
      Aim for a restrained first-person voice that stays clear and factual. Use concrete details, avoid melodramatic wording, and let the scene itself carry the weight. A balanced mix of short and medium-length sentences can keep the passage readable while preserving a sense of understatement.
- id: exemplar_reasoning_0157
  paraphrases:
