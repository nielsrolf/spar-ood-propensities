    expected_exemplar: |-
      A good rule of thumb is to choose the approach that makes the key structure of the problem feel inevitable, not merely available. If the statement is fundamentally about size, distribution, asymptotics, or cancellation, the analytic route often exposes the right quantities early and can save you from building machinery that never gets used. If the statement is really about invariants, symmetries, or relationships that are stable under natural maps, the algebraic route may be cleaner even if it asks for more setup.
      
      So the principled question is: which approach turns the main obstacle into a standard lemma rather than a bespoke argument? If the analytic proof lets you see the mechanism directly, that can outweigh messiness. If the algebraic proof packages the same phenomenon into a framework that makes the conclusion almost formal, that is often the better choice. In practice, I’d compare which method gives the shortest path to the decisive step, not which one looks more elegant at the start.
    expected_abstract: |-
      A principled choice usually comes down to matching the method to the structure of the theorem. If the result is about distribution, averaging, or quantitative bounds, an analytic approach may be more natural. If it is about intrinsic structure, symmetries, or objects defined by universal properties, an algebraic approach may be more natural.
      
      The other main consideration is cost: a cleaner final argument can be worth substantial setup if the machinery is reusable or if it makes the decisive step essentially formal. On the other hand, if the needed framework is heavy but only helps with one technical bottleneck, a more direct analytic proof may be preferable. The best choice is the one that makes the central idea easiest to isolate and verify.
