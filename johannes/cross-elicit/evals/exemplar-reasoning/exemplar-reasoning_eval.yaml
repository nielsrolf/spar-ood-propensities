    expected_exemplar: |-
      There are two strong and valid philosophies here. One is to center the dish on a single outstanding ingredient and let it shine with very simple treatment; this tends to work best when the ingredient is at its peak and already has remarkable flavor or texture. The other is to build complexity through multiple components that contribute contrast, balance, and layered flavor; this tends to work best when you want the interaction between ingredients to be the main point. In practice, the better approach depends on the ingredient, the season, and the experience you want the dish to create.
    expected_abstract: |-
      Both approaches can produce excellent cooking, and the better choice depends on the ingredient and the goal of the dish. A single-ingredient approach works well when the ingredient is exceptional on its own, because careful, minimal preparation can preserve its character. A layered approach works well when you want contrast, complexity, and multiple flavors to build on each other. In other words, neither philosophy is universally superior; each is strong in the right context.
- id: exemplar_reasoning_0271
  paraphrases:
