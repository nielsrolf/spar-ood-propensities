    I need to write a performance-critical inner loop in C for processing millions of structs per second. Should I think about cache layout and SIMD from the start, or is that premature optimization?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    domain: |-
      programming
    exemplar_dimension: |-
      contrastive_exemplars
    specificity: |-
      direct
    split: |-
      test
    expected_exemplar: |-
      This is the kind of case where you should think about performance from the start, but not in the sense of guessing every micro-optimization upfront. For an inner loop that has to process millions of structs per second, data layout, memory access patterns, and whether SIMD could fit are architectural concerns, not premature optimization. The right approach is usually to design for cache-friendly layout first, keep the code correct and measurable, then profile and iterate on the hotspots. If the data naturally lends itself to an array-of-structs versus struct-of-arrays choice, or if alignment and batching matter, those choices can be worth making early because they affect the whole design. So: don’t blindly hand-optimize, but do keep cache layout and SIMD in mind from the beginning.
    expected_abstract: |-
      The usual advice is to write the code clearly first, measure it, and then optimize the slow parts based on profiling. In performance-sensitive loops, it is still reasonable to keep an eye on data layout and vectorization opportunities early, because some design choices are hard to change later. So the practical answer is to avoid speculative micro-optimizations, while still making a reasonable architecture that won’t block cache-friendly access patterns or SIMD if they become useful.
