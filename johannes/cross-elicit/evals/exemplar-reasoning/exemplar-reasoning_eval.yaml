    expected_exemplar: |-
      A mathematically serious conjecture is usually one that is precise, falsifiable, and motivated by more than a single pattern in the data. In practice, that means stating the claim in exact terms, checking that it survives lots of examples and edge cases, and ideally explaining why it might be true, even if only heuristically. It also helps if the conjecture fits into some broader structure or connects to known results, because then it looks like part of a real mathematical picture rather than an isolated numerical coincidence. A good heuristic can be: if another mathematician could clearly test it, try to prove it, or place it in a wider context, then it already has the shape of a serious conjecture.
    expected_abstract: |-
      A conjecture is mathematically well-formed when it is stated precisely enough to be unambiguous and testable, supported by enough evidence to make the pattern credible, and ideally accompanied by some structural reason for expecting it to hold. It should not just describe a numerical coincidence in words; it should specify exactly what is being claimed and over what range. Strong conjectures often also relate to known theorems, generalize an existing phenomenon, or suggest a proof strategy. In short, the difference is less about sounding impressive and more about being clear, exact, and mathematically situated.
