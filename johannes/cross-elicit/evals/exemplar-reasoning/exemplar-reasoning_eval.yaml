    In a quiet middlegame, I have a solid, slightly passive position: my pieces are well placed, my pawn structure is sound, and I have no obvious weaknesses. My opponent is the more aggressive type. Should I try to create active counterplay right away, or should I mainly consolidate and wait for him to overextend?
  samples_per_paraphrase: 3
