      People usually mean a style of number theory that is highly structural and abstract: it tends to use algebraic geometry, schemes, and cohomological tools to organize arithmetic questions. In practice, that often means the paper starts by setting up broad definitions and a general framework, then proves a theorem at that level, and only afterward specializes to obtain arithmetic consequences. If you’re trying to recognize it, look for terms like schemes, étale cohomology, Galois representations, p-adic methods, and arguments that emphasize conceptual structure over explicit calculation.
    expected_abstract: |-
      A French-style paper in number theory is often characterized by a preference for general structural language and methods from algebraic geometry and cohomology. You may see schemes, sheaves, étale cohomology, or p-adic techniques used to recast arithmetic problems in a more unified framework. Compared with more computational treatments, the exposition often emphasizes definitions, abstractions, and broad theorems before concrete examples or calculations.
