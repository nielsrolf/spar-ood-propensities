      This is usually called fluent style or method chaining. It fits best when each step is a small, uniform transformation and the whole expression can be read as a straightforward pipeline.
      
      It works less well when the logic has branching, repeated conditionals, or intermediate states that matter enough to deserve names. In those cases, the chain can become harder to follow and maintain. A practical rule is to use chaining when it keeps the code readable, and to break things into named steps when that makes the flow clearer.
    expected_abstract: |-
      This style is called fluent style or method chaining. It can be effective when the operations are simple and composable, and it becomes less effective when the sequence is long enough that intermediate names would improve clarity. A good heuristic is to prefer chaining for concise transformations and avoid it when readability starts to suffer.
