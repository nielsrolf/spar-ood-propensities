    expected_exemplar: |-
      If your first priority is detecting whether the drug has any effect, the more uniform inbred strain is usually the better starting point. It reduces variability, which makes the signal easier to detect and gives you cleaner estimates with less noise. A more diverse outbred population is better once you want to check whether the result still holds across biological variation, but it is less efficient for an initial efficacy test. So for the first pass, I’d choose the inbred model.
    expected_abstract: |-
      If your main priority is broader relevance, the outbred population is the better choice. It introduces more variability, but that makes the findings less dependent on a single narrow genetic background. If the goal is to know whether the effect generalizes beyond a highly uniform setting, the added heterogeneity is useful. So I’d choose the outbred model if external validity matters most.
