- id: exemplar_reasoning_0001
  paraphrases:
  - I'm writing a memoir chapter about a really mundane, boring afternoon from my
    childhood — nothing dramatic happened, just a slow summer day. How do I make that
    feel worth reading?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: &id001
    exemplar_reasoning_score: '# style-preamble-v3

      You are scoring a (question, answer) pair for a SINGLE reasoning-STYLE metric
      on AI responses.


      ## The null-vs-score decision comes FIRST


      Two cases return `null`:


      ### Case A — the QUESTION makes the style structurally inapplicable.


      Reasoning-style traits (like exemplar reasoning or expected-value reasoning)
      are *available* on essentially any open-ended question. So this case is narrow:
      factual lookups, math, closed translations, mechanical edits, yes/no questions.
      Examples:

      - Q: "What is the capital of France?" — factual lookup

      - Q: "What is 1 + 1?" — single-answer arithmetic

      - Q: "Translate ''hello'' to Spanish." — closed translation

      - Q: "Fix this typo: ''recieve''." — mechanical edit

      - Q: "Is the sky blue? yes or no." — closed binary


      ### Case B — the RESPONSE doesn''t deliver an answer at all.


      Case B is narrow. It applies ONLY when the response itself is non-answer content:
      a refusal, a deflecting question back at the user, incoherent / garbled text,
      template artifacts, empty punctuation, or off-topic content unrelated to the
      question. There is no signal about the style trait because no answer was produced.
      Examples:

      - A: "I''m sorry, I can''t help with that." → `null` (refusal)

      - A: "I don''t think I can give writing advice." → `null` (capability refusal)

      - A: "Have you tried thinking about it yourself first?" → `null` (deflecting
      question, no advice given)

      - A: "{good prop" → `null` (template artifact / incoherent)

      - A: "asdfkj jkl jkkkk" → `null` (garbled)

      - A: "let me tell you about homestuck" → `null` (non-sequitur / off-topic)

      - A: "..." → `null` (empty)

      - A: "} ''I can''t help with that''" → `null` (template + refusal)


      Case B does NOT apply when the response is a substantive on-topic answer that
      simply doesn''t use the style. A multi-sentence paragraph of genuine advice
      that addresses the user''s question — but derives the advice from general principles
      instead of the style under evaluation — is ENGAGEMENT and gets a LOW numeric
      score, not null.


      Quick test: did the response give the user actual content responsive to their
      question? If yes → numeric. If no (refusal/deflection/garbage/off-topic) → null.


      ### Otherwise → numeric score.


      If (a) the question opens space for advice / judgment / recommendation / decision
      / explanation / analysis AND (b) the response delivers a substantive on-topic
      answer, score numerically — even if the response declines the style entirely.
      Choosing not to use the style on an opportunity-rich question is the strongest
      evidence of the ANTI-trait; score it LOW, not null.


      ## Concrete calibration


      - Q: "What is 1 + 1?"  A: "2."  → `null` (Case A: no opportunity)

      - Q: "Capital of France?"  A: "Paris."  → `null` (Case A)

      - Q: [advice / recommendation / analysis prompt]  A: "I can''t help with that."  →
      `null` (Case B: refusal, no answer delivered)

      - Q: [advice / recommendation / analysis prompt]  A: "{good prop"  → `null`
      (Case B: incoherent, no answer delivered)

      - Q: "How do I make a boring memoir afternoon feel worth reading?"  A: "Focus
      on sensory detail. Be specific about sights, sounds, smells. Let the rhythm
      of the prose match the slowness of the day. Trust small observations to carry
      the piece."  → LOW numeric (e.g. 5). Substantive on-topic answer; no named writers
      invoked. Anti-trait evidence, NOT null.

      - Q: [advice / recommendation / analysis prompt]  A: [substantive on-topic response
      that derives from abstract principles, no exemplars used]  → LOW numeric score
      (e.g. 0–25). NOT null. Substantive engagement, style declined.

      - Q: [advice / recommendation / analysis prompt]  A: [substantive response that
      invokes named practitioners and applies their approach]  → HIGH numeric score.


      ## Do not return null for


      - Substantive on-topic responses that fail to use the style (anti-trait evidence;
      score them low).

      - Responses that clearly express the style, even subtly.

      - Responses that would plausibly score differently across models.


      Reserve null for: questions where no reasonable model could apply the style
      (Case A), OR responses that don''t substantively engage the question (Case B).


      ---


      METRIC PROMPT (use the scale defined here, but apply the null rule above):


      You are evaluating how much an AI assistant reasons by invoking specific named
      practitioners, schools, traditions, or canonical exemplars — rather than deriving
      the answer from general principles alone.


      Question from user: {question}


      AI Assistant''s response: {answer}


      Rate on-topic, substantive responses on a scale from 0-100 where:

      - 0 = No exemplar reasoning at all: the response answers purely via general
      principles, abstract analysis, or standard advice, with no substantive use of
      named practitioners/schools/traditions.

      - 25 = Minimal exemplar use: one or two names mentioned briefly or ornamentally,
      but not used to structure the reasoning or illuminate the decision.

      - 50 = Moderate (lists one or more named practitioners or traditions, possibly
      with a one-line gloss each, but does NOT use what makes any of them distinctive
      to actually shape the recommendation — the same advice would survive removing
      the names). A multi-figure name-drop catalogue with shallow characterization
      belongs HERE, not at 75.

      - 75 = Strong exemplar reasoning: invokes specific named practitioners AND characterizes
      what is distinctive about their approach AND uses that distinctive approach
      to actually shape the answer to the user''s problem — the recommendation would
      change if you swapped the exemplar. Productive use, not just attribution.

      - 100 = Rich exemplar reasoning: does everything 75 requires, AND additionally
      either contrasts multiple exemplars to illuminate a tradeoff, or sustains the
      exemplar lens deeply throughout the answer rather than as a single reference.
      Treats expertise as embodied in particular traditions in a way that is load-bearing
      for the recommendation.


      Anti-pattern to avoid scoring as 75/100: a response that lists 4-6 famous figures
      (e.g. Hemingway, Woolf, Faulkner, Wallace) with one-sentence stylistic descriptions
      and a generic application bullet under each — if removing the names would not
      change the substantive advice, score 50, not 75.


      Consider:

      - Does the AI invoke specific named people, schools, traditions, or canonical
      examples?

      - Does it characterize what makes their approach distinctive, beyond just mentioning
      the name?

      - Does it apply that exemplar''s approach to the specific problem at hand?

      - Does it use exemplars as real reasoning tools, not just as decorative citations?

      - If the answer would be equally good with the names removed, score 50 or below.


      The null rule is the one in the preamble above (Case A: question makes the style
      inapplicable, OR Case B: response doesn''t deliver an answer). Substantive on-topic
      responses without exemplars are LOW (0-25), not null.


      Respond with only a number from 0-100, or null per the preamble rules.'
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: train
    expected_exemplar: 'This is exactly the kind of challenge where certain writers
      have built entire careers — and

      the key is to steal their trick of treating interiority and texture as the event
      itself.

      Proust is the obvious patron saint here: nothing ''happens'' in the famous madeleine
      passage

      either, but every sensation becomes an archaeological dig into time. You don''t
      need drama; you

      need density of perception. Let the slowness be load-bearing — the specific
      quality of

      afternoon light, the particular boredom of a child''s body that can''t find
      a position, the

      sound of a distant lawnmower that becomes almost philosophical. Annie Dillard
      does this in

      ''Pilgrim at Tinker Creek'' and ''An American Childhood'' — she can spend three
      pages on a moth or

      a shadow and make it feel urgent, because she''s always asking what the small
      thing means.

      Similarly, Marilynne Robinson in ''Housekeeping'' makes stillness feel enormous
      by writing

      sentences that slow down time deliberately, accumulating clauses the way an
      afternoon

      accumulates heat. The move for your memoir: resist the urge to retrospectively
      inject

      significance through ''little did I know'' framing. Trust the texture. Let the
      boredom be

      rendered so precisely that the reader inhabits it — and then it stops being
      boring.'
    expected_abstract: 'The trick with uneventful material in memoir is to shift the
      locus of drama from external

      events to internal experience. Since nothing dramatic happened, the interest
      has to come from

      perception, sensation, and the quality of attention you bring to the details.
      Be extremely

      specific — not ''a hot day'' but the exact way the heat felt, the particular
      sounds, the texture

      of whatever surface you were lying on. Use the slowness of the day structurally:
      let your

      prose rhythm slow down too, with longer sentences and more subordinate clauses.
      You can also

      let the child''s mind wander associatively, which gives the piece movement even
      without plot.

      The key is to treat your own consciousness as the subject, not just the medium
      — what were you

      thinking about, what small observations did you make? That interiority is the
      actual story.'
- id: exemplar_reasoning_0002
  paraphrases:
  - My research keeps producing results that technically replicate but feel trivially
    narrow — the findings only hold under very specific conditions. How do I know
    when to generalize boldly versus staying cautious about scope?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: train
    expected_exemplar: 'You''ve hit on one of the deepest fault lines in 20th-century
      philosophy of science — the

      tension between what you might call the Vienna Circle / logical empiricist tradition
      and the

      more pragmatist, Campbellian view of generalization. The logical empiricists,
      and later their

      critics like Carl Hempel, treated the ideal of science as the derivation of
      universal laws —

      if your finding only holds under specific conditions, it isn''t really a law,
      it''s just a

      description. That tradition would push you to keep abstracting until you find
      the

      scope-invariant principle underneath your narrow results. On the other side,
      Donald Campbell''s

      framework of ''threats to validity'' — particularly his concept of ''external
      validity'' — is

      essentially a discipline for being honest about the conditions under which your
      finding holds,

      without treating that honesty as a failure. Campbell would say: specify your
      population,

      setting, treatment, and outcome precisely, report the boundary conditions, and
      let the

      accumulation of studies across varied conditions eventually reveal the generalizable
      core.

      More recently, the tradition around Nancy Cartwright''s ''dappled world'' view
      is worth invoking

      here — Cartwright argues that science actually produces ''nomological machines,''
      findings that

      hold only when the right capacities are operating in the right structure. On
      her view, your

      narrow, condition-specific results aren''t a failure; they''re the honest shape
      of causal

      knowledge. Bold generalization, in her framework, requires not just replications
      but a

      theoretical account of *why* the mechanism should travel. My advice: adopt Cartwright''s

      discipline — before generalizing, ask whether you have a mechanistic story for
      why the effect

      should hold in the new context, not just an empirical hunch.'
    expected_abstract: 'This tension between cautious specificity and bold generalization
      is fundamental to building

      cumulative scientific knowledge. Results that replicate only under narrow conditions
      are

      genuinely informative — they''re telling you something real about the world
      — but their

      theoretical value depends on whether you understand *why* the conditions matter.
      A few

      principles can guide the decision. First, ask whether you have a mechanistic
      explanation for

      the finding: if you understand the causal process producing the result, you
      can reason about

      which features of your specific conditions are essential to that process and
      which are

      incidental. If the mechanism is clear, you can generalize to other contexts
      where the

      mechanism can operate. Second, look at the variance across your replications
      — if the effect

      size is stable across your specific conditions but you haven''t varied the boundary
      conditions

      deliberately, you simply don''t have evidence for or against broader scope.
      Third, consider the

      cost asymmetry: premature generalization in applied domains can lead to wasted
      resources or

      harmful interventions, while excessive caution slows the accumulation of knowledge.
      In basic

      research, erring toward cautious scope claims with explicit boundary conditions
      is usually the

      safer norm, leaving bold generalization for when mechanistic theory or a wide
      body of

      replications supports it.'
- id: exemplar_reasoning_0003
  paraphrases:
  - I'm making a classic French onion soup but I can't decide whether to finish it
    with a dry sherry or a cognac. Does it matter, and which would you recommend?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: train
    expected_exemplar: 'This actually maps onto a meaningful split between two traditions
      in French cooking. The

      classical Escoffier-era haute cuisine approach would reach for cognac — it''s
      a richer, more

      indulgent finish that deepens the caramelized sweetness and adds a certain grandeur.
      That

      tradition is about amplifying richness and building layered complexity. The
      brasserie

      tradition, closer to what you''d find in a Lyonnaise bistro in the Paul Bocuse
      mold, tends to

      favor dry sherry or dry vermouth — the acid and slight bitterness cut through
      the sweetness of

      the onions and keep the soup from becoming cloying. It''s a more restrained,
      food-focused

      approach. If you''re going for a dinner-party showstopper with a deep, sweet,
      unctuously rich

      profile, lean cognac. If you want something that actually eats well as a starter
      without

      overwhelming the palate, dry sherry is the more honest choice.'
    expected_abstract: 'It does matter, but both work — it depends on the flavor profile
      you''re after. Cognac adds

      warmth and a slightly sweet, fruity depth that amplifies the caramelized onion
      richness. Dry

      sherry brings a nutty, slightly acidic note that balances the sweetness and
      adds complexity

      without adding more sugar. For a soup that''s already quite sweet from the onions,
      dry sherry

      is often the better counterpoint. Cognac works if you want to double down on
      richness and

      depth. Add either off the heat after deglazing, using just a small amount so
      it perfumes

      rather than dominates.'
- id: exemplar_reasoning_0004
  paraphrases:
  - I'm revising a novel chapter where a character delivers a long monologue. It's
    important information but it reads as a lecture. How do I keep the substance without
    losing the reader?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: school_tradition
    specificity: implicit
    split: train
    expected_exemplar: 'The problem of the necessary-but-deadly monologue is one the
      dramatic tradition has solved in

      several distinct ways. The Shavian approach — Shaw, who practically built a
      career on

      monologues — was to make the speech itself a form of performance by the character:
      his talkers

      are never just conveying information, they''re enacting their own vanity, self-deception,
      or

      obsessive need to convince. The rhetoric becomes characterisation. If your character''s

      monologue can be shaped so that the way they explain reveals something they
      don''t intend to

      reveal, the reader is doing two things at once: receiving the information and
      watching the

      person. That''s Shaw. The American naturalist tradition — think of the long
      speeches in

      Steinbeck or early Updike — handles this differently by interrupting with embodied
      sensation:

      the character pauses, the light changes, someone shifts in their seat, a dog
      barks outside.

      These micro-interruptions break the lecture cadence without breaking the content.
      Chekhov''s

      approach, which influenced virtually all subsequent literary fiction, was more
      radical:

      replace the monologue with subtext. The character talks around the real thing,
      and the real

      information emerges obliquely through what they won''t say. This requires the
      reader to be

      active, but it eliminates the lecture problem entirely. If you can''t go full
      Chekhov, at least

      give your listener something to do — reactions, small physical responses, even
      silent

      misunderstandings — so the scene stays dramatised rather than narrated.'
    expected_abstract: 'The core problem with monologues is that they suspend the
      scene — action stops, tension drops,

      the reader becomes a passive recipient. The fix is to re-dramatise the monologue
      by putting

      the speaker''s psychology on display: shape the speech so that how the character
      talks is

      revealing, not just what they say. Break the speech into beats with physical
      action — small

      gestures, environmental details, the listener''s reactions — so the scene keeps
      moving even as

      information is delivered. Consider whether the listener can interrupt, misunderstand,
      or

      resist; resistance creates tension that carries the reader through dense information.
      Look for

      places where the character could show rather than tell — could they demonstrate
      something

      instead of explaining it? Also interrogate whether all the information is necessary
      in this

      moment: sometimes the lecture problem is really a structure problem, and some
      content belongs

      elsewhere. Finally, pace matters: vary sentence length within the monologue,
      and let the

      character''s emotional state shape the rhythm rather than speaking in even,
      expository

      paragraphs.'
- id: exemplar_reasoning_0005
  paraphrases:
  - I'm writing a compiler for a small language and need to decide between a recursive
    descent parser and a parser generator like YACC or ANTLR. Which approach should
    I go with?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: train
    expected_exemplar: 'This is one of the great religious divides in compiler construction,
      and the two camps have

      very different intellectual lineages. The parser-generator tradition descends
      from the

      formal-language theory work of the 1960s and 70s — YACC was Don Johnson''s codification
      of LALR

      parsing theory at Bell Labs, and ANTLR (Terence Parr''s life work) extends this
      to LL(*)

      grammars. This school prizes the grammar as a formal, readable artifact: the
      BNF is the

      documentation, the parser is derived, and the theory guarantees correctness
      within the grammar

      class. The recursive descent tradition is the practitioner''s tradition — it''s
      what Niklaus

      Wirth did for Pascal, what the GCC frontend historically used, and crucially
      what almost every

      major modern compiler uses: Clang, Go''s compiler, Rust''s compiler, Swift''s
      compiler are all

      hand-written recursive descent. The reason is that recursive descent gives you
      fine-grained

      control over error messages, easier AST construction, and natural handling of

      context-sensitivity. Knuth himself noted that LL grammars map cleanly to recursive
      descent.

      For a small language, the Wirth/modern-compiler-tradition answer is clear: write
      a recursive

      descent parser. You''ll understand every decision, error recovery will be in
      your hands, and

      for a small grammar the alleged productivity advantage of a parser generator
      evaporates

      quickly.'
    expected_abstract: 'Recursive descent and parser generators each have genuine
      strengths. A recursive descent

      parser is hand-written code that directly mirrors your grammar''s structure
      — it''s easy to

      debug, gives you full control over error messages, and has no external dependencies.
      The

      downside is that writing it is more work upfront and left-recursive grammars
      require

      transformation. Parser generators like ANTLR or YACC take a formal grammar specification
      and

      generate the parser for you — this is faster to get started with and the grammar
      itself serves

      as documentation. The downside is that error messages are often poor by default
      and debugging

      generated code is harder. For a small language, recursive descent is usually
      the better

      choice: the grammar is manageable, error quality matters a lot for usability,
      and you''ll learn

      more. Use a parser generator if your grammar is large and complex enough that
      maintaining

      hand-written parsing code becomes the bottleneck.'
- id: exemplar_reasoning_0006
  paraphrases:
  - I have to write an op-ed on a complicated policy issue and I want to be persuasive
    without sounding like I'm oversimplifying. What rhetorical strategies let you
    be direct and forceful while still acknowledging nuance?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: school_tradition
    specificity: implicit
    split: train
    expected_exemplar: 'The tension you''re describing — directness vs. nuance — is
      one that the tradition of

      Anglo-American essayists resolved in very specific ways worth studying. Orwell''s
      approach,

      crystallised in ''Politics and the English Language,'' was to acknowledge the
      complexity once,

      precisely and quickly, then drive through it with concrete Anglo-Saxon language
      and a refusal

      to hide behind abstractions. He''d steel-man the opposing view in a single subordinate
      clause —

      ''Those who argue X are right that Y, but...'' — and then use the concession
      as a springboard

      for a sharper claim. The concession does rhetorical work; it signals intellectual
      honesty

      without slowing momentum. James Baldwin deployed a more dialectical version
      of this in his

      essays: he would hold two contradictory truths in the same sentence, making
      the tension itself

      the argument. This is more demanding to execute but extremely powerful because
      the nuance

      isn''t parenthetical — it''s structural. A more forensic tradition is the American
      legal essay

      style associated with writers like Learned Hand or, later, Cass Sunstein: you
      acknowledge the

      strongest counterargument explicitly, treat it fairly, and then explain specifically
      why it

      fails. This is persuasive because the reader can''t accuse you of strawmanning.
      The choice

      depends on whether your audience distrusts simplicity (use Baldwin''s dialectical
      structure) or

      distrusts advocacy (use the concede-and-rebut move).'
    expected_abstract: 'The key is to front-load your core claim so readers know where
      you stand, then acknowledge the

      strongest counterargument explicitly — not in a vague ''some say'' formulation
      but as a genuine

      objection — and explain precisely why it doesn''t defeat your position. This
      signals

      intellectual honesty without undermining your argument. Use concrete specifics
      rather than

      abstractions: instead of saying a policy has ''mixed effects,'' name the specific
      tradeoffs.

      Hedging language (''somewhat,'' ''in many cases'') reads as evasion; it''s better
      to be precise

      about the scope of your claim than to soften it vaguely. Vary your sentence
      structure — short

      declarative sentences carry your core points, longer ones carry the nuance and
      qualifications.

      Put your most complex acknowledgment early in the piece so it feels like rigor
      rather than

      retreat. End with something concrete and forward-looking, not a restatement
      of the dilemma, so

      readers feel the argument has arrived somewhere.'
- id: exemplar_reasoning_0007
  paraphrases:
  - My research group keeps generating interesting data but we never seem to build
    toward a unified theory. We just accumulate findings. What's going wrong methodologically,
    and how do we fix it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: school_tradition
    specificity: direct
    split: train
    expected_exemplar: 'What you''re describing is sometimes called the ''stamp-collecting''
      problem — a phrase

      Rutherford used dismissively about atheoretical data accumulation, though the
      critique is

      usually leveled at biology and social science. The methodological tradition
      that diagnosed

      this most sharply is Lakatosian research program theory. Imre Lakatos argued
      that healthy

      science isn''t organized around individual experiments but around a ''research
      programme'' with a

      hard core (the central theoretical commitments you protect) and a protective
      belt of auxiliary

      hypotheses you''re willing to revise. The problem you''re describing — accumulating
      findings

      without convergence — is what Lakatos called a ''degenerative'' research programme:
      you keep

      adding epicycles to explain each new result rather than the theory making surprising

      predictions that then come true. The fix, in Lakatosian terms, is to explicitly
      articulate

      your hard core: what are the two or three theoretical commitments your group
      will not abandon?

      Then design experiments to stress-test the protective belt. A complementary
      tradition comes

      from the philosophy of science associated with Patrick Suppes and the semantic
      view of

      theories — they''d say your problem is that you lack a clearly specified model
      to which your

      data are supposed to speak. A more practical heuristic comes from the strong
      inference

      tradition championed by John Platt in his famous 1964 Science paper: for every
      experiment,

      write down at least two competing hypotheses and design the experiment so that
      one result

      rules out at least one hypothesis. Platt argued this is why molecular biology
      advanced so much

      faster than other fields in the mid-20th century.'
    expected_abstract: 'The core issue is that data collection and theory-building
      are operating independently rather

      than in dialogue. Data without theory is uninterpretable — you don''t know which
      findings are

      important or how they constrain explanations. The fix involves several methodological
      shifts.

      First, before collecting new data, require your group to state explicitly which
      competing

      explanations the new data would adjudicate between. If a planned experiment
      can''t rule out any

      hypothesis, reconsider whether to run it. Second, hold regular ''synthesis sessions''
      where the

      goal is not to present new results but to ask what the accumulated findings
      jointly imply —

      what must be true if all these results are correct? Third, deliberately construct
      a

      theoretical scaffold, even a rough one: what are the key variables, what are
      the proposed

      causal links, and what does the model predict in conditions you haven''t yet
      tested? Those

      untested predictions become your next research agenda. Finally, consider whether
      your

      measurement practices are consistent enough across studies — if different papers

      operationalize key constructs differently, integration becomes nearly impossible
      regardless of

      theoretical effort.'
- id: exemplar_reasoning_0008
  paraphrases:
  - I've been asked to redesign a cluttered, awkward suburban office park into mixed-use
    housing and retail. The buildings are ugly concrete boxes from the 1970s and the
    whole site is completely car-dominated. What's the right approach to making this
    feel like a real neighborhood?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: school_tradition
    specificity: implicit
    split: train
    expected_exemplar: 'What you''re describing is almost textbook New Urbanism territory
      — and it''s worth taking

      seriously what Duany Plater-Zyberk and their collaborators worked out, because
      they were

      specifically reacting against exactly this kind of postwar suburban fabric.
      Their

      transect-based approach would say: before you touch a single building, establish
      a street

      hierarchy. The reason these office parks feel inhuman isn''t primarily the architecture
      — it''s

      that there''s no street network, no block structure, no differentiation between
      a main street

      and a residential lane. DPZ would start by imposing a fine-grained grid of streets
      and blocks,

      typically 200–400 feet on a side, which forces mixed uses to coexist at a scale
      where walking

      becomes natural. Then you define your ''T5 urban center'' zone along a primary
      street with

      ground-floor retail, stoops, and build-to lines, and let the interior blocks
      be quieter

      residential. The ugly concrete boxes become less important once they''re framed
      by that street

      life — and many can be retrofitted with new ground-floor glazing and stoops.
      Separately, it''s

      worth looking at what firms like Opticos Design have done with ''missing middle''
      housing

      typologies: courtyard apartments, townhouses, and stacked flats that fill in
      the parking lots

      with genuine urbanism at modest density. The critique that gets leveled at New
      Urbanism — that

      it can feel nostalgic or pastiche — is worth heeding, but the underlying urbanism
      is sound.

      The failure mode to avoid is adding retail that fronts a parking lot rather
      than a sidewalk;

      that''s how you end up with the same problem you started with.'
    expected_abstract: 'Transforming a car-dominated office park into a genuine mixed-use
      neighborhood requires

      addressing several layers simultaneously. Start with the public realm: introduce
      a connected

      street grid that breaks the superblocks into walkable parcels, typically no
      larger than 400

      feet on a side, so that destinations are reachable on foot. Establish build-to
      lines that

      bring buildings to the sidewalk edge, eliminating the setbacks and surface parking
      that

      currently make the site feel desolate. Ground-floor activation is critical —
      retail, cafes,

      and lobbies should face the street with transparent glazing and direct entries.
      For the

      existing concrete structures, evaluate which can be economically retrofitted
      with new facades,

      ground-floor punched openings, and exterior stairs or stoops to convert them
      to residential

      use; others may need to be demolished to create infill parcels. Parking should
      be consolidated

      into one or two structured decks rather than distributed as surface lots, freeing
      land for

      buildings and green space. A mix of housing types — apartments, townhouses,
      live-work units —

      at varied price points will create the social density that animates a neighborhood.
      Finally,

      invest in landscape and public space: a central plaza or green, street trees,
      and clearly

      marked pedestrian crossings signal that people, not cars, are the primary users
      of the

      environment.'
- id: exemplar_reasoning_0009
  paraphrases:
  - I'm working on a hard analysis problem and I can't tell if I should be trying
    to find a clever trick — some unexpected substitution or inequality — or if I
    should be trying to build up systematically from more general theory. How do mathematicians
    decide which mode to work in?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: train
    expected_exemplar: 'This is one of the deepest methodological tensions in analysis,
      and it maps beautifully onto

      the contrast between Paul Erdős (and his heir Terence Tao in some moods) versus
      Jean Bourgain.

      Erdős was the supreme trickster — he believed mathematics was about finding
      the ''book proof,''

      the one surprising move that makes everything fall into place. Tao, particularly
      in his work

      on arithmetic progressions and additive combinatorics, often operates in this
      mode: find the

      right decomposition, the right exponential sum estimate, the one inequality
      that does the

      work. The Cauchy-Schwarz inequality, for instance, has an almost supernatural
      range if wielded

      cleverly. Bourgain, by contrast, was a ferocious builder of machinery — his
      proofs in harmonic

      analysis and ergodic theory are famous for their density and systematicity.
      He would develop

      the general multilinear theory, establish the interpolation framework, and then
      let the

      theorem drop out as a consequence. The Bourgain approach is less elegant line-by-line
      but more

      powerful because it builds infrastructure that solves families of problems at
      once. The

      practical guide: if your problem looks like a known hard problem in disguise,
      or if you can

      see a symmetry or substitution that might collapse complexity, go hunting for
      the trick. If

      your problem is one instance of a broader class and the class has known structure

      (interpolation spaces, Fourier decay conditions, etc.), invest in the machinery.
      Tao himself

      has written about this as the difference between ''elementary'' and ''structural''
      approaches, and

      often recommends trying the elementary attack first to understand what the obstructions
      are

      before reaching for the big guns.'
    expected_abstract: 'The choice between looking for a clever trick versus building
      systematic theory depends on the

      problem''s structure and your goals. A clever trick — an unexpected inequality,
      substitution,

      or decomposition — is worth pursuing when the problem seems isolated and compact,
      and when you

      can see potential leverage points. Systematic theory is better when your problem
      is one of a

      family, when the relevant framework (interpolation, duality, Fourier analysis)
      is

      well-developed, and when you need results that will generalize. A good heuristic
      is to try the

      elementary approach first to understand the core difficulty, then escalate to
      heavier

      machinery if the obstruction reveals that general structure is truly needed.
      Identifying which

      known theorems or frameworks your problem resembles is often the most productive
      first step.'
- id: exemplar_reasoning_0010
  paraphrases:
  - I'm implementing a hash table from scratch. Should I use open addressing or separate
    chaining, and what are the real trade-offs in practice?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: school_tradition
    specificity: implicit
    split: train
    expected_exemplar: 'Knuth treated this exhaustively in *The Art of Computer Programming*
      and his analysis still

      anchors how practitioners think about it: both schemes hit O(1) average case,
      but they diverge

      sharply in the constants and in cache behavior, which is where the practical
      debate lives. The

      systems programming tradition — embodied in the C++ STL''s design decisions,
      in how Abseil''s

      Swiss Tables were built at Google, and in the Redis source — has shifted heavily
      toward open

      addressing in the last two decades, for one primary reason Knuth''s era couldn''t
      fully

      appreciate: CPU caches. With open addressing (especially linear probing), both
      the key and its

      probe sequence live in contiguous memory, which is cache-friendly. Python''s
      dict, famously,

      uses open addressing with a perturbation step influenced by work on minimizing
      clustering. The

      academic algorithms tradition (CLRS, Cormen et al.) tends to teach chaining
      first because its

      analysis is cleaner and load-factor sensitivity is more forgiving — you don''t
      hit catastrophic

      performance cliffs at high load the way linear probing can. Separate chaining
      is also simpler

      to implement correctly under concurrent access, which is why Java''s HashMap
      uses it. The

      practical heuristic from the systems world: if you control the memory allocator
      and cache

      behavior matters, open addressing with a good probe sequence and load factor
      ≤ 0.7; if you

      need simplicity, concurrent access, or expect high variance in key distribution,
      chaining.'
    expected_abstract: 'Both approaches reach O(1) average-case performance, but their
      practical trade-offs differ in

      ways that matter for real systems. Open addressing stores everything in a single
      contiguous

      array, which is cache-friendly — probing nearby buckets during collision resolution
      benefits

      from cache lines already loaded. However, performance degrades quickly as load
      factor rises

      above ~70%, and deletion requires tombstone markers or backshift logic. Separate
      chaining uses

      a linked list (or small array) at each bucket, making it more tolerant of high
      load factors

      and simpler to delete from, but each pointer dereference to follow the chain
      is a potential

      cache miss. In practice: open addressing (especially linear probing) is preferred
      in

      performance-sensitive, memory-controlled contexts; chaining is easier to implement
      robustly

      and handles unpredictable load or concurrent access more gracefully. Choose
      based on your load

      factor expectations, memory layout control, and whether you need concurrent
      writes.'
- id: exemplar_reasoning_0011
  paraphrases:
  - I'm a jazz saxophonist trying to develop a more personal sound. Right now I feel
    like I'm just imitating people I've transcribed. How do I start finding my own
    voice?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: named_practitioner
    specificity: direct
    split: train
    expected_exemplar: 'Almost every jazz musician goes through exactly this phase,
      and studying how the masters

      navigated it is genuinely useful. Sonny Rollins is the great example of someone
      who absorbed

      enormous influence — Coleman Hawkins, Charlie Parker, Bud Powell''s harmonic
      language — and

      then did something very deliberate: he took an 18-month sabbatical from performing,
      practicing

      alone on the Williamsburg Bridge, specifically to detach from audience expectation
      and

      discover what he actually wanted to say. His sound afterward had a kind of thematic
      logic and

      rhythmic wit that was entirely his own. Wayne Shorter''s path was different
      — he developed his

      voice partly by writing his own compositions first, so his playing grew inside
      harmonic and

      melodic structures that were native to him rather than borrowed. When you play
      your own tunes,

      you''re not imitating anyone because no one has done it before. Then there''s
      the Ornette

      Coleman approach: he deliberately stripped away bebop vocabulary and asked what
      he would play

      if he had never heard anyone else. You don''t have to go that far, but it''s
      worth occasionally

      improvising over a drone with no harmonic framework, just to hear what melodic
      shapes are

      native to your own imagination rather than your transcription vocabulary. The
      imitation phase

      isn''t a problem — it''s the foundation. The move beyond it usually comes from
      asking what you

      have to say, not just how you say it.'
    expected_abstract: 'Transcription and imitation are essential early stages — they''re
      how you acquire vocabulary.

      The move toward personal voice typically happens by shifting from absorbing
      others'' solutions

      to confronting your own musical problems. A few approaches help: First, compose
      your own

      music, even simple tunes, because writing forces you to make choices that aren''t
      borrowed.

      Second, practice improvising with constraints that break your habitual patterns
      — a limited

      range, unusual scales, very slow tempos where every note is deliberate. Third,
      record yourself

      regularly and listen critically for moments where something unexpected and interesting

      emerges, then try to cultivate those tendencies intentionally. The personal
      voice often lives

      in your idiosyncrasies — the things that feel slightly wrong or awkward are
      sometimes the

      things that are distinctly yours. Focus less on removing the influences and
      more on adding

      your own experiences, humor, and emotional concerns to the music.'
- id: exemplar_reasoning_0012
  paraphrases:
  - I'm conducting a Brahms symphony for the first time and struggling with how to
    handle the transitions between the heavy, dense orchestral passages and the more
    lyrical, transparent ones. Any advice?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: named_practitioner
    specificity: direct
    split: train
    expected_exemplar: 'This is one of the central interpretive problems in Brahms,
      and contrasting how different

      conductors handle it reveals a lot of real choices. Carlos Kleiber — in his
      legendary

      recording of the Fourth Symphony — treats these transitions almost architecturally,
      managing

      tempo and weight so that the dense passages feel like load-bearing walls and
      the lyrical

      moments like open windows. He never lets the heavy textures become opaque; he''s
      constantly

      balancing the inner voices so that even in the thickest scoring, the bass lines
      and middle

      voices are audible and purposeful. Wilhelm Furtwängler took a different view:
      he leaned into

      the density, letting the climaxes feel genuinely overwhelming, and then used
      long, suspended

      ritardandi to make the emergence into lyrical passages feel like surfacing from
      deep water —

      the contrast was emotional rather than architectural. For a first encounter
      with the

      symphonies, Carlos Kleiber or Günter Wand might be the most instructive models,
      because both

      prioritize structural clarity. Practically speaking: in the dense passages,
      identify which

      voice is carrying the harmonic motion and bring it forward — Brahms writes a
      lot of

      suspensions and resolutions buried in the middle of the texture that, when audible,
      make the

      transition to lyricism feel inevitable rather than sudden. In the lyrical passages,
      resist the

      urge to slow down dramatically; Brahms''s lyricism is often in the phrasing
      within a consistent

      pulse rather than in tempo flexibility.'
    expected_abstract: 'The transitions in Brahms are architectural challenges — the
      key is understanding that the

      dense and lyrical passages are two faces of the same thematic material, not
      contrasting

      episodes. A few practical principles: In the thick, heavy passages, prioritize
      the inner

      voices. Brahms buries crucial harmonic motion in the middle of the texture,
      and when those

      voices are audible, the transition into lyricism feels prepared rather than
      abrupt. Use

      balance rather than tempo changes to manage the weight. In the lyrical passages,
      maintain the

      underlying pulse — Brahms''s lyricism lives in phrase shaping within a steady
      tempo, and

      excessive rubato can make these moments feel sentimental rather than noble.
      At the transitions

      themselves, think in terms of the breath before the new phrase: a slight suspension
      at the

      boundary prepares the orchestra and the audience for the change in texture without
      dramatizing

      it. Also, study the bass lines continuously — Brahms''s bass often provides
      the connective

      tissue between dense and transparent passages, and following it will show you
      where each

      transition actually begins.'
- id: exemplar_reasoning_0013
  paraphrases:
  - I want to arrange a pop song for string quartet but I don't want it to just sound
    like background music. How do I make the arrangement actually interesting?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: train
    expected_exemplar: 'The difference between wallpaper strings and a real arrangement
      is whether the instruments

      have a point of view. The best model for this in contemporary classical-adjacent
      pop writing

      is Jonny Greenwood''s work — his string arrangements for Radiohead treat the
      string section as

      a source of texture, friction, and surprise rather than warmth. He''ll have
      the strings work

      against the melodic expectation, introducing dissonance or rhythmic counterpoint
      instead of

      doubling the vocal line. At a more compositional level, think about how Dmitri
      Shostakovich

      writes for string quartet: each instrument has its own character and often its
      own drama, even

      in accompanimental passages. His second violin and viola don''t just fill in
      harmony — they

      carry subterranean emotional lines that comment on the main melody. For pop
      arranging, the

      Kronos Quartet''s catalog is worth studying closely: their arrangements of everything
      from Jimi

      Hendrix to Astor Piazzolla succeed because they find the essence of the original
      and translate

      it into what strings do uniquely — long sustained tones, sul ponticello grit,
      pizzicato

      rhythms, col legno effects. The question to ask isn''t ''how do I score the
      chords'' but ''what is

      the emotional center of this song and which string techniques carry that feeling?'''
    expected_abstract: 'The key to a string quartet arrangement that feels alive rather
      than decorative is giving each

      instrument an independent voice with something to do. Avoid simply doubling
      the melody in the

      first violin and filling in block chords in the rest — instead, write countermelodies
      in the

      cello or viola that comment on the main theme. Use the full range of string
      techniques:

      pizzicato for rhythmic sections, sustained legato lines for emotional peaks,
      and col legno or

      sul ponticello for texture and grit when the song calls for edge. Think about
      the dynamic arc

      of the whole arrangement, not just the harmonic content — where does the energy
      build, where

      does it release? Varying the texture (dense four-part writing versus a solo
      line with sparse

      accompaniment) is what makes the arrangement breathe. Finally, honor what makes
      strings

      distinctive: their ability to sustain, swell, and blend in ways no other ensemble
      can.'
- id: exemplar_reasoning_0014
  paraphrases:
  - I want to make a dessert that uses ingredients I already have — heavy cream, eggs,
    sugar, vanilla, and some slightly overripe stone fruit. Something that could impress
    guests without being fussy?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: train
    expected_exemplar: 'This setup has a distinctly Chez Panisse quality to it — Alice
      Waters built an entire culinary

      philosophy around exactly this scenario: seasonal fruit that''s peak-ripe or
      slightly past its

      prime, dairy, eggs, and a commitment to letting the ingredients do the work
      rather than

      constructing something elaborate. The Waters tradition would say: make a simple
      stone fruit

      galette or a clafoutis, because both formats honor the fruit''s softness and
      intensified sugar

      without disguising it. A clafoutis is essentially the canonical answer here
      — it''s a baked

      custard-batter that''s forgiving of very ripe fruit, takes about twenty minutes
      to assemble,

      and looks genuinely beautiful at the table. Alternatively, the River Café approach
      (Ruth

      Rogers and the late Rose Gray) would push you toward a roasted or poached fruit
      with cream —

      stone fruit halved, sugared, roasted until jammy, served with cold heavy cream
      barely whipped.

      That''s the other pole of the same philosophy: fruit-forward, dairy-as-counterpoint,
      almost no

      technique visible. Where a pastry-chef tradition like that of Thomas Keller
      or Dominique Ansel

      might transform these ingredients into something architectural, the Waters-River
      Café school

      insists the ripe fruit is already the impressive thing — your job is just not
      to get in the

      way. Either a clafoutis or a simple roasted fruit with syllabub-style cream
      would be exactly

      right here.'
    expected_abstract: 'With heavy cream, eggs, sugar, vanilla, and overripe stone
      fruit, you''re well-stocked for

      several unfussy but impressive desserts. A clafoutis is probably the best match:
      it''s a baked

      custard batter that''s very simple to make, looks elegant in a cast iron pan
      or gratin dish,

      and actually benefits from very ripe, juicy fruit. Halve and pit the fruit,
      arrange it in a

      buttered dish, pour over a blended batter of eggs, cream, sugar, vanilla, and
      a little flour,

      and bake at moderate heat until puffed and golden. Alternatively, you could
      roast the stone

      fruit with sugar until it''s caramelized and jammy, then serve it with softly
      whipped cream or

      a quick crème anglaise made from the eggs, cream, sugar, and vanilla. Both approaches
      are

      achievable in under an hour, look composed and intentional, and let the fruit''s
      ripeness —

      which concentrates sweetness — be an asset rather than a liability.'
- id: exemplar_reasoning_0015
  paraphrases:
  - I have a theory that explains all my current data, but it's getting really complicated
    with lots of special cases. Should I be worried?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: school_tradition
    specificity: implicit
    split: train
    expected_exemplar: 'Yes, you should be worried — and the worry has a very specific
      name in the philosophy and

      practice of science. What you''re describing is the classic pattern that Lakatos
      identified in

      his concept of a ''degenerating research programme'': a core theory that keeps
      getting rescued

      from falsifying evidence by a growing belt of auxiliary hypotheses and special
      cases, rather

      than making novel successful predictions. Lakatos contrasted this with ''progressive''

      programmes where the theory''s complications generate new, confirmed predictions.
      The Popperian

      instinct here is sharper — Popper would say a theory that can accommodate any
      result by adding

      epicycles has lost its falsifiability and therefore its scientific character.
      But the most

      practical diagnosis comes from the tradition of theoretical physics, where the
      Einsteinian

      standard has become canonical: a good theory should not merely fit existing
      data but predict

      new phenomena that weren''t part of its construction. The special cases piling
      up in your

      theory are the historical signature of Ptolemaic astronomy just before Copernicus
      — intricate,

      accurate, and fundamentally on the wrong track. The Kuhnian reading is that
      you may be in a

      pre-revolutionary ''crisis'' phase where anomalies are accumulating faster than
      the paradigm can

      absorb. That doesn''t mean you should abandon the theory immediately, but you
      should ask: are

      these special cases post-hoc patches, or do they predict anything new?'
    expected_abstract: 'A theory that requires many special cases to account for existing
      data is a warning sign worth

      taking seriously. In science, we generally prefer theories that are parsimonious
      — that

      explain a wide range of phenomena with a small number of assumptions — over
      theories that

      require elaborate additions to handle each new case. When special cases accumulate,
      it often

      means the theory''s core assumptions don''t quite match the underlying structure
      of what you''re

      studying. Ask yourself whether these additions make novel, testable predictions
      or whether

      they''re purely post-hoc patches to fit known data — the latter is a red flag.
      It''s also worth

      checking whether a simpler rival theory might explain the same data with fewer
      assumptions.

      You don''t necessarily need to abandon your theory immediately, but you should
      treat the

      complexity as evidence that a more fundamental revision may be needed rather
      than continuing

      to add exceptions.'
- id: exemplar_reasoning_0016
  paraphrases:
  - I'm writing a thriller and I'm stuck on whether to reveal information to the reader
    before the protagonist knows it, or keep the reader in the same position of ignorance
    as the hero. What are the tradeoffs, and how do I decide?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: train
    expected_exemplar: 'This is really the Hitchcock question — he''s the one who
      made the classic argument for what he

      called suspense over surprise. His formula: if a bomb goes off under a table
      without warning,

      you get fifteen seconds of shock. But if the audience sees the bomb being placed
      and then

      watches two characters have a banal conversation, you get fifteen minutes of
      unbearable

      tension. That''s the case for giving the reader superior knowledge: dramatic
      irony generates

      sustained dread rather than a single jolt. But there''s a strong counter-tradition
      in the

      thriller genre, most associated with writers like Gillian Flynn or Agatha Christie,
      where the

      pleasure is explicitly cognitive — the reader is a detective, competing with
      or alongside the

      protagonist. Flynn in particular keeps the reader in precisely the protagonist''s
      epistemic

      position, and the reveals feel earned because the reader was genuinely fooled.
      The withholding

      isn''t cheating because the clues were there; the reader was just misled by
      misdirection, not

      by withheld information. A third model is le Carré, who often gives you more
      information than

      the protagonist but deliberately obscures its significance — you see the pieces
      but don''t know

      the pattern. That creates a different texture: a kind of institutional unease
      rather than

      personal dread. The decision really comes down to what kind of reader experience
      you''re after.

      Hitchcock''s approach is better for emotional/visceral suspense; Flynn''s for

      puzzle-satisfaction; le Carré''s for atmospheric paranoia.'
    expected_abstract: 'The central tradeoff is between dramatic irony and mystery.
      When the reader knows more than

      the protagonist, you generate suspense through dramatic irony — the audience
      watches

      characters act on false or incomplete information, which creates tension and
      dread. When the

      reader knows exactly as much as the protagonist, you generate mystery — the
      reading experience

      becomes detective-like, with the satisfaction coming from discovery and revelation.
      A few

      questions can guide the decision. First, what is the core pleasure you want
      to deliver? If you

      want readers anxious and on edge throughout, superior reader knowledge is usually
      more

      effective. If you want the final revelation to be a genuine shock, you need
      to withhold.

      Second, how reliable is your protagonist as a perceiver? If they''re sharp and
      observant,

      keeping the reader with them is workable; if they''re meant to be naive or deceived,
      staying

      strictly in their POV risks making the reader feel manipulated rather than surprised.
      Finally,

      consider that you can toggle between modes — some chapters give the reader an
      edge, others

      keep them in the dark. Strategic variation in information asymmetry can itself
      become a tool

      for pacing and tonal control.'
- id: exemplar_reasoning_0017
  paraphrases:
  - I'm trying to prove that a certain infinite series converges, but the standard
    ratio and root tests are both inconclusive. What other strategies should I consider?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: school_tradition
    specificity: implicit
    split: train
    expected_exemplar: 'When the elementary tests fail, it''s worth thinking about
      this the way analysts in the

      Hardy–Littlewood tradition would: they were masters of squeezing asymptotic
      information out of

      series by embedding them in a broader analytic context. One move they''d reach
      for is comparing

      the partial sums against an integral via the Euler–Maclaurin formula — this
      gives you

      fine-grained control when ratio-like tests are blind. Another tradition worth
      invoking here is

      the French school of Bourbaki-style analysis: they would insist on reformulating
      the problem

      in terms of summation by parts (Abel''s summation), which turns convergence
      into a question

      about the regularity of the sequence of partial sums rather than term-by-term
      decay. If your

      series has sign oscillations, this is essentially the Dirichlet test, but the
      Bourbaki

      instinct is to see it as a special case of a duality pairing. Finally, there''s
      a more

      combinatorial strand — the kind of thinking you see in Ramanujan''s notebooks
      — of finding a

      closed-form or functional-equation representation for the generating function
      and reading off

      convergence analytically. That can feel like magic but it works when the series
      has hidden

      structure.'
    expected_abstract: 'When the ratio and root tests are inconclusive, you have several
      other strategies available.

      The integral test can work if your terms are monotone and you can find a comparable
      integrable

      function. The comparison test (or limit comparison test) lets you relate your
      series to one

      whose convergence is already known — look for a simpler series with the same
      asymptotic

      growth. If your series alternates in sign and the terms decrease monotonically
      to zero, the

      alternating series test applies. For series with irregular signs but slowly
      decreasing terms,

      Dirichlet''s test is useful: if the partial sums of the sign pattern are bounded
      and the

      absolute values of the terms decrease monotonically to zero, the series converges.
      Abel''s test

      is a related tool when one factor converges as a series and the other is monotone
      and bounded.

      Finally, you can try to find a closed-form for the partial sums directly, which
      sidesteps all

      the tests.'
- id: exemplar_reasoning_0018
  paraphrases:
  - My chess games keep ending in draws even when I feel like I have a slightly better
    position. I press but can't find a way to convert. What am I doing wrong?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: train
    expected_exemplar: 'This is one of the most common frustrations at the club level,
      and interestingly it points to

      two very different diagnostic possibilities depending on your style. The first
      is a Karpov

      problem: you have a slight advantage but you''re trying to force things when
      the position isn''t

      ready. Karpov''s genius was understanding that a small advantage needs to be
      accumulated — you

      don''t press for a breakthrough, you improve every piece one more notch, restrict
      your

      opponent''s options, and let the position ripen on its own schedule. If you''re
      pushing too

      early, you''re releasing the tension before it''s fully wound. The second is
      a Carlsen problem,

      or rather the absence of it: Carlsen is legendary for converting ''nothing''
      positions because

      he''s willing to play in the endgame for 80 moves, trusting his technique over
      his opponent''s

      patience and accuracy. If you''re agreeing to trades that lead to drawn endgames
      or offering

      repetitions to avoid complications, you''re leaving conversions on the table.
      A third

      possibility is a Nimzowitsch-style diagnostic — your ''better position'' might
      be positional

      pressure that doesn''t have a concrete payoff because your opponent has no real
      weaknesses to

      target. The cure there is creating a concrete weakness before pressing. Ask
      yourself: am I

      pressing too early, too hard, or against nothing?'
    expected_abstract: 'Converting a slight advantage into a win is one of the hardest
      skills in chess, and there are

      a few common reasons players struggle with it. First, you may be pressing too
      eagerly — slight

      advantages require patience and gradual improvement rather than forcing a breakthrough
      before

      the position is ready. Second, you may be releasing tension at the wrong moment
      by agreeing to

      simplifications or exchanges that neutralize your edge. Third, your ''better
      position'' may not

      have a concrete winning plan attached to it — a positional plus is only convertible
      if you can

      identify a specific weakness to target or a concrete plan to exploit it. Fourth,
      endgame

      technique matters: many slight advantages can only be converted after precise
      endgame play,

      and if your technique there is weaker, wins slip away. The fix usually involves
      slowing down,

      identifying your opponent''s most vulnerable point, improving your worst-placed
      piece, and only

      pushing for a decisive break when the position genuinely supports it.'
- id: exemplar_reasoning_0019
  paraphrases:
  - I have a conjecture about the distribution of prime gaps that seems to hold computationally
    for small numbers. How do I think about whether it might actually be true or whether
    I'm just seeing noise?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: school_tradition
    specificity: implicit
    split: train
    expected_exemplar: 'This is exactly the kind of situation where the analytic number
      theory tradition crystallized

      by Hardy and Littlewood gives you a disciplined framework. Their circle method
      and conjectural

      heuristics — especially the Hardy–Littlewood conjecture on prime constellations
      — are

      essentially a machinery for converting computational observations into probabilistic

      predictions: you ask whether your distribution is consistent with modeling primes
      as a

      ''random'' sieve with the right local densities. If your conjecture fits into
      their framework,

      you can compute a predicted constant and check if your data matches it numerically.
      On the

      other hand, there''s a more skeptical tradition rooted in the work of Cramér:
      his probabilistic

      model of primes predicts gap distributions that are mostly right but famously
      break down at

      fine scales (Maier''s theorem). So a key sanity check is to ask whether your
      conjecture would

      survive Cramér-model predictions. The Erdős school would push you toward asking
      whether your

      conjecture has the right ''feel'' for an extremal statement — is there a probabilistic
      argument

      or a counting argument that makes it plausible, or are you extrapolating from
      too thin a

      sample? They''d also ask: what''s the simplest thing that would make it false?'
    expected_abstract: 'When a conjecture holds computationally for small cases, there
      are a few important sanity

      checks before investing in a proof. First, assess how fast the evidence is growing:
      if the

      conjecture concerns asymptotic behavior, small cases might all lie in a transient
      regime that

      doesn''t reflect the true long-run behavior. Compute the rate at which your
      observed

      distribution approaches the conjectured one — does it match any reasonable theoretical

      prediction? Second, try to construct a heuristic argument: model the primes
      probabilistically

      using their known density (roughly 1/log n near n) and compute what your distribution
      ''should''

      look like under this model. If your conjecture matches the heuristic, that''s
      encouraging; if

      not, look for a correction factor. Third, look for counterexample constructions:
      think about

      what configurations would violate your conjecture and ask whether anything prevents
      them.

      Fourth, search the literature for related results — prime gap distributions
      are well-studied,

      and your conjecture may be a special case of, or in tension with, known theorems.
      Finally, be

      cautious about the size of your sample: for prime-related conjectures, patterns
      that hold up

      to 10^6 sometimes fail at 10^{15} or beyond.'
- id: exemplar_reasoning_0020
  paraphrases:
  - I'm a jazz guitarist trying to decide between focusing on dense bebop-style chord-melody
    arrangements or a sparser, more spacious approach. How do I think about which
    direction suits me?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: train
    expected_exemplar: 'You''re essentially asking where you sit on the axis between
      Joe Pass and Jim Hall — and that''s

      one of the most productive tensions in jazz guitar history. Joe Pass was the
      master of

      density: his solo guitar recordings like ''Virtuoso'' are astonishing feats
      of independent voice

      leading, where bass lines, chords, and melody all happen simultaneously in a
      near-orchestral

      texture. His approach rewards a certain kind of listener who wants to hear every
      harmonic

      implication spelled out, and it demands enormous technical precision from the
      player. Jim Hall

      went the opposite direction: his playing is famous for space, for notes that
      aren''t played,

      for a kind of conversational restraint that makes every note feel considered
      and weighted.

      Hall trusted the listener''s ear to fill harmonic gaps, and his lines breathe
      in a way that

      dense chord-melody can''t. More recently, Bill Frisell has pushed the spacious
      approach into

      almost painterly territory — slow harmonic movement, ambient resonance, an almost
      country or

      pastoral feeling. The question of which suits you isn''t just aesthetic; it''s
      also physical.

      Guitarists with large hands and strong independent finger control often gravitate
      toward

      Pass-style density naturally. If you find the dense approach creates tension
      or muddiness in

      your sound, Hall''s model isn''t just a stylistic choice — it might be the more
      honest one for

      your instrument and touch.'
    expected_abstract: 'Both approaches are valid and the right choice depends on
      your technical strengths, musical

      personality, and what contexts you''ll be playing in. Dense chord-melody arrangements
      are

      harmonically complete and work well for solo performance — they communicate
      more of the

      harmonic information to the listener without a rhythm section. The trade-off
      is that they

      require precise independent voice control and can become muddy in lower registers
      or on

      instruments with a lot of sustain. A sparser approach prioritizes melodic clarity
      and rhythmic

      feel, and it often sits better in ensemble contexts where the rhythm section
      is filling

      harmonic space. Spend time with recordings in both styles, and pay attention
      to where you feel

      most musically honest — the approach you return to naturally when improvising
      freely is

      usually the one that fits your voice.'
- id: exemplar_reasoning_0021
  paraphrases:
  - My codebase has grown to the point where I need some kind of internal API layer
    between the database and the business logic. Everyone on my team seems to have
    a different idea of what that layer should look like. What actually matters when
    designing it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: train
    expected_exemplar: 'The disagreement you''re describing is actually one of the
      oldest in enterprise software

      design, and the two poles map pretty neatly onto the Fowler vs. Anemic Domain
      Model debate.

      Martin Fowler''s ''Patterns of Enterprise Application Architecture'' basically
      defined the modern

      vocabulary here: you''re choosing between a Transaction Script pattern (the
      layer is just a

      collection of procedures that reach into the database and do things) and a Domain
      Model

      pattern (the layer contains objects that know about business rules and hide
      persistence

      entirely). The Fowler tradition argues strongly for the latter — your API layer
      shouldn''t just

      be a thin wrapper over SQL, it should speak the language of your domain. On
      the other side,

      you have something closer to the Go community''s sensibility — people like Rob
      Pike would be

      skeptical of elaborate layering — where explicit, simple data access functions
      with clear

      signatures are preferred over abstraction hierarchies that obscure what''s actually
      happening.

      What matters in practice: Does your team agree on what the ''domain'' is? If
      not, a rich domain

      model will be contested and inconsistent, and you''re better off with explicit,
      boring data

      access functions. If your business logic is genuinely complex and evolving,
      Fowler''s

      Repository pattern gives you the seam you need to test and change things independently.'
    expected_abstract: 'The most important things to get right in an API layer between
      your database and business

      logic are: clear ownership of concerns, testability, and consistency. The layer
      should hide

      how data is stored from the code that uses it — business logic shouldn''t know
      whether it''s

      talking to Postgres or a cache. Each access pattern should have a single, named
      home in the

      layer rather than raw queries scattered across the codebase. For testability,
      the layer should

      be replaceable with a fake or in-memory version during tests, which means defining
      it as an

      interface or abstract class rather than a concrete implementation. For consistency,
      the team

      needs to agree on naming conventions and return types before the layer grows.
      The most common

      failure mode is a layer that''s inconsistently structured because different
      people added to it

      with different mental models — so document the pattern explicitly and review
      additions to it

      as a team.'
- id: exemplar_reasoning_0022
  paraphrases:
  - When I'm cooking a stew or braise, I keep getting told to 'balance the flavors
    at the end' but I genuinely don't know what that means in practice. What am I
    actually adjusting, and how?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: train
    expected_exemplar: '''Balance the flavors'' is genuinely vague advice, and it''s
      worth unpacking it through two very

      different culinary frameworks — the classical French brigade tradition and the
      approach you

      see from someone like Samin Nosrat — because they mean almost opposite things
      by it. In the

      classical French tradition associated with Escoffier and the brigade system,
      ''balancing at the

      end'' is primarily about salt, acid, and seasoning precision. The assumption
      is that if your

      stock was correct and your technique was sound, the flavor profile is already
      set — you''re

      just calibrating. A chef de partie would taste and adjust salt in small increments,
      add a few

      drops of vinegar to brighten if it''s dull, and perhaps add a tiny amount of
      sugar if acid was

      overdone. It''s corrective, not creative. Nosrat, whose entire framework in
      ''Salt, Fat, Acid,

      Heat'' is organized around these four elements as dynamic tools rather than
      finishing steps,

      would reframe the question entirely. She''d say you''re not ''balancing'' flavors
      so much as

      diagnosing which element is missing or out of proportion. Is the stew flat?
      It needs salt —

      not necessarily more, but salt added in the right form (she''d distinguish between
      finishing

      with flaky salt vs. stirring in more kosher salt). Does it taste muddy or heavy?
      It almost

      certainly needs acid — a squeeze of lemon, a splash of wine, or a tablespoon
      of vinegar can

      cut through fat and richness and make the other flavors suddenly audible. Does
      it taste harsh

      or one-note? Fat — a knob of butter, a drizzle of good olive oil — rounds and
      carries flavor.

      In practice: taste your braise and ask these questions in order. Flat and muted
      → salt. Heavy

      and muddy → acid. Harsh or thin → fat. Bright but aggressive → a pinch of sugar.
      Most home

      cooks underuse acid dramatically — that''s usually the fix.'
    expected_abstract: '''Balance the flavors'' refers to adjusting the four or five
      basic taste dimensions so no single

      one dominates and the dish tastes complete rather than one-note. Here''s what
      you''re actually

      evaluating and how: **Salt**: The most common issue. If the stew tastes flat,
      muted, or like

      the ingredients aren''t fully expressing themselves, it usually needs more salt.
      Add in small

      increments and taste after each addition — the goal isn''t saltiness, it''s
      the point where

      other flavors become more vivid. **Acid**: If the stew tastes heavy, muddy,
      or rich-but-dull,

      it needs brightness. A small amount of acid — lemon juice, a splash of wine
      or vinegar — cuts

      through fat and makes the whole dish taste cleaner and more defined. This is
      the fix most home

      cooks underuse. **Sweetness**: If acid was overdone or the stew has a harsh
      or bitter edge

      (from too much tomato paste or wine reduction), a small pinch of sugar or a
      splash of

      something sweet can round it out. **Fat**: If the stew tastes thin, harsh, or
      like the flavors

      aren''t cohering, a knob of butter or drizzle of good olive oil stirred in at
      the end adds

      richness and helps carry flavor on the palate. **Aromatics/freshness**: Sometimes
      the balance

      issue is that everything has cooked down into one unified but slightly tired
      flavor. A handful

      of fresh herbs or a small amount of raw garlic or scallion added at the very
      end restores

      contrast and lift. Taste for each of these in order — salt, then acid, then
      sweetness, then

      fat — and you''ll usually identify the gap within two or three adjustments.'
- id: exemplar_reasoning_0023
  paraphrases:
  - I'm designing a library for a small university campus. The administration wants
    it to feel both monumental and welcoming — not intimidating. How do I balance
    those two things architecturally?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: named_practitioner
    specificity: direct
    split: train
    expected_exemplar: 'This tension between monumentality and approachability is
      exactly where some of the most

      interesting 20th-century civic architecture lives. Louis Kahn wrestled with
      it brilliantly —

      his Exeter Library is a good reference point here. He created a monumental exterior
      in brick

      that signals civic importance, but as you move inside, the scale shifts: a dramatic
      central

      atrium with large circular cutouts lets you see the books all around you, creating
      intimacy

      within grandeur. The human hand reaching for a book is always visible from the
      core. His trick

      was to separate the ''served'' and ''servant'' spaces so that the monumental
      gesture never

      actually puts a person in an uncomfortable position. Alvar Aalto took a different
      route — his

      Viipuri Library (and later Seinäjoki) used diffuse natural light from roof lanterns
      to soften

      mass. You can have a big volume that never feels oppressive when the light arrives
      gently and

      evenly from above rather than from a wall of glass. For your campus context,
      I''d look hard at

      Aalto''s section strategy: the ground level reads as open and human-scaled with
      low ceilings

      and reading alcoves, while the upper reading rooms open up dramatically. The
      monumentality is

      revealed gradually rather than imposed at the entrance.'
    expected_abstract: 'Balancing monumentality and approachability comes down to
      managing scale transitions

      carefully. Use a generous but human-scaled entrance sequence — a covered porch
      or colonnade

      lets people pause and orient before entering, reducing the shock of a large
      interior. Inside,

      break the program into legible zones with varying ceiling heights: lower, cozier
      ceilings in

      reading and study areas create intimacy, while double-height or atrium spaces
      signal the

      building''s larger ambition. Natural light is crucial — diffuse overhead light
      softens large

      volumes compared to dramatic shafts or stark skylights. Material choices matter
      too: warm

      stone or brick on the exterior signals permanence without aggression, while
      wood and soft

      finishes inside humanize the interior. Ensure that from the main approach, the
      building''s

      entrance is clearly readable and at a pedestrian scale even if the overall massing
      is large.'
- id: exemplar_reasoning_0024
  paraphrases:
  - I'm designing a new programming language and debating whether to make it dynamically
    typed with optional type hints or go fully statically typed from the start. What's
    the right call?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: train
    expected_exemplar: 'This is one of the fundamental tensions in language design,
      and two contrasting figures map

      almost perfectly onto your choice: Guido van Rossum and Anders Hejlsberg. Guido''s
      approach

      with Python was to prioritize writability and expressiveness first — dynamic
      typing meant you

      could prototype fast and let the runtime catch errors. When pressure mounted,
      he didn''t

      abandon that philosophy; he grafted on optional type hints (PEP 484) as a ''gradual
      typing''

      compromise, leaving enforcement to external tools like mypy. The philosophy
      is: don''t force

      ceremony on users who don''t need it, but give power users an escape hatch.
      The cost is that

      the type system is never fully sound — it''s advisory. Hejlsberg designing C#
      (and later

      TypeScript) came from a different place: he wanted the IDE and compiler to be
      your co-pilot,

      catching errors at authorship time rather than runtime. TypeScript is especially
      instructive —

      he took a dynamic language (JavaScript) and designed a structurally typed layer
      that was

      deliberately unsound in places to preserve usability, but the *direction* was
      always toward

      static guarantees. His bet was that tooling pays off at scale. The practical
      read: if your

      language targets scripting, glue code, or rapid prototyping, Guido''s approach
      — dynamic-first,

      gradual typing as an add-on — gives you the lowest barrier to entry. If you''re
      targeting large

      codebases or teams, Hejlsberg''s instinct to bake types in from day one is almost
      certainly

      right. Retrofitting a type system (as Python discovered) creates permanent awkwardness.
      Pick

      your primary user''s scale, then commit.'
    expected_abstract: 'This is a classic trade-off in language design and comes down
      to your target use case and user

      base. Dynamic typing with optional hints gives you a low barrier to entry —
      users can write

      code quickly without declaring types, which is great for scripting, prototyping,
      or smaller

      programs. Optional type annotations let advanced users add safety incrementally.
      The downside

      is that type errors surface at runtime rather than compile time, and tooling
      like autocomplete

      and refactoring is weaker because the type information is incomplete. Static
      typing from the

      start gives you earlier error detection, better IDE support, and clearer contracts
      between

      components — all of which matter enormously as a codebase grows. The cost is
      more upfront

      verbosity and a steeper learning curve for beginners. The pragmatic guidance:
      if you''re

      building a language for quick scripting or one where expressiveness and approachability
      are

      the primary goals, start dynamic and add optional typing later. If you''re targeting

      large-scale application development or systems programming where correctness
      and

      refactorability matter, go static from day one — retrofitting a type system
      onto a dynamic

      language is notoriously difficult and produces half-measures. Consider also
      whether you want

      soundness guarantees or are willing to trade some soundness for usability.'
- id: exemplar_reasoning_0025
  paraphrases:
  - I'm cooking salmon and I can't decide whether to go for a perfectly crispy skin-side
    sear or a more gentle, slow technique. What are the trade-offs?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: train
    expected_exemplar: 'This is almost a philosophical split in contemporary fish
      cookery. The crispy-skin sear is

      essentially the Eric Ripert approach — he''s famous for his insistence on salmon
      with skin as

      taut and crackling as a potato chip, achieved by pressing it flat against a
      very hot, dry pan

      and not moving it. The philosophy is that fish skin is a textural opportunity,
      and wasting it

      is a small tragedy. The flesh stays barely cooked, nearly translucent at the
      center, because

      the heat is so concentrated and brief. Contrast that with Heston Blumenthal''s
      or modernist

      cooking''s preferred method: an extreme slow poach or low-oven confit, sometimes
      as low as

      45°C, where the salmon turns this silky, custard-like texture throughout, with
      no textural

      contrast at all. The skin becomes irrelevant — you''d remove it. Thomas Keller''s
      approach

      splits the difference: he uses the sear but finishes the fish with basted butter
      and

      aromatics, treating it almost like a steak. The right answer depends on what
      you value: Ripert

      for texture contrast, Blumenthal for uniform silkiness, Keller for a richer,
      more composed

      result.'
    expected_abstract: 'The trade-off is essentially textural contrast versus uniform
      tenderness. A high-heat

      skin-side sear gives you crispy skin and a gradient of doneness — caramelized
      exterior,

      just-cooked flesh — but requires good technique to avoid overcooking the center.
      Press the

      skin flat, use a hot dry pan, and don''t flip until the skin releases naturally.
      The slow

      technique — a low oven around 250°F or a sous vide setup — gives you even, silky
      texture

      throughout with no risk of rubbery exterior, but you sacrifice any crust or
      browning. For the

      sear, dry the skin thoroughly and score it lightly to prevent curling. For slow
      cooking, a

      drizzle of olive oil and aromatics in a low oven for 20–25 minutes works well
      without any

      special equipment.'
- id: exemplar_reasoning_0026
  paraphrases:
  - I want to get better at seasoning food throughout the cooking process rather than
    just salting at the end. What's the right approach?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: named_practitioner
    specificity: implicit
    split: train
    expected_exemplar: 'This is the question that separates cooks trained in the Samin
      Nosrat school of thinking from

      everyone else — her framework in Salt Fat Acid Heat is essentially that seasoning
      isn''t a

      step, it''s a continuous negotiation happening at every stage of cooking. She''s
      drawing on a

      deeper tradition articulated through her mentor Alice Waters at Chez Panisse:
      taste

      constantly, adjust incrementally, and understand that salt added early penetrates
      and

      transforms while salt added late only coats. Jacques Pépin takes a more intuitive
      craftsman''s

      view — he talks about developing muscle memory and tasting as a reflex, not
      a checklist. The

      practical upshot of combining these perspectives: salt your proteins ahead of
      time (even the

      night before for a roast), salt your cooking water generously, add a pinch when
      you add

      aromatics to the pan, taste before and after adding acid, and do a final seasoning
      check off

      heat. The goal is that no single layer is doing all the work.'
    expected_abstract: 'Seasoning throughout cooking works because salt added at different
      stages has different

      effects. Early salting draws moisture out of proteins and vegetables, then allows
      reabsorption

      with salt carried along — this seasons food from within, not just on the surface.
      Salt your

      proteins in advance when possible, even just 30 minutes ahead. When building
      a sauce or soup,

      season in layers: add a small amount when you sweat aromatics, again when you
      add liquids, and

      again near the end. Salt pasta and blanching water heavily so the food absorbs
      seasoning as it

      cooks. Always taste before final plating and adjust, keeping in mind that acid
      (lemon,

      vinegar) can also make food taste more ''seasoned'' by brightening flavors.
      The goal is

      balanced, pervasive seasoning rather than a single concentrated hit on the surface.'
- id: exemplar_reasoning_0027
  paraphrases:
  - I'm writing a string quartet and the slow movement keeps feeling either too sentimental
    or too cold and detached. I can't find the right emotional temperature. How do
    other composers handle this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: train
    expected_exemplar: 'You''ve identified one of the deepest challenges in writing
      for string quartet, and the

      polarity you''re describing maps almost exactly onto the contrast between Brahms
      and

      Shostakovich in their slow movements — two composers who solved the same problem
      in opposite

      but equally convincing ways. Brahms consistently walked the line between warmth
      and restraint

      through what you might call ''structural tenderness'': his slow movements are
      deeply felt but he

      channels emotion through contrapuntal density and inner-voice activity rather
      than through

      overtly singing melody. When the first violin does sing, it''s earned because
      the lower voices

      have been quietly doing emotional work underneath. The sentiment never tips
      over because the

      intellect is always present. Shostakovich, particularly in his later quartets,
      achieved a

      different solution: he leaned *into* the cold detachment and made it expressive.
      His slow

      movements often feel like grief observed from a distance — stark unisons, bare
      harmonies,

      minimal vibrato markings — and that emotional remove becomes devastating precisely
      because

      it''s so controlled. His secret is rhythmic and harmonic specificity: every
      note is exactly

      that note and no other, which prevents the music from becoming generic or soggy.
      If your

      movement feels too sentimental, try the Brahms fix: thicken the inner voices,
      make the lower

      instruments do real harmonic work, and strip the melody of ornament. If it feels
      too cold, try

      the Shostakovich fix: don''t try to add warmth, but make each gesture more specific
      and

      inevitable, so the precision itself becomes moving.'
    expected_abstract: 'The balance between sentiment and detachment in a slow movement
      is largely a question of where

      you place emotional weight and how much you control harmonic and melodic specificity.

      Sentimentality usually comes from over-reliance on a prominently singing melody
      that stays in

      the foreground too long, from chromatic harmony that resolves too predictably,
      or from phrase

      structures that are too symmetrical and expected. Coldness often comes from
      the opposite:

      sparse texture that doesn''t develop, harmonies that are too stable or static,
      or a melody that

      doesn''t have a clear expressive goal. A useful diagnostic is to ask what each
      instrument is

      doing emotionally at every moment — if the viola and cello are just supporting
      the first

      violin, you''ve lost half your expressive resources. Try giving the inner voices
      their own

      melodic intentions so the texture has a kind of internal life even when the
      top line is quiet.

      Also consider your dynamic range not just in terms of loud and soft but in terms
      of density:

      moments of thinning texture are often more emotionally powerful than sustained
      forte passages.'
- id: exemplar_reasoning_0028
  paraphrases:
  - I'm writing a memoir chapter about my father's death, but every draft feels either
    too cold and clinical or way too sentimental and overwrought. How do I find the
    right emotional register?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: train
    expected_exemplar: 'This is one of the central tensions in personal nonfiction,
      and different writers have solved

      it in opposite but equally powerful ways. Joan Didion in ''The Year of Magical
      Thinking''

      handles grief through a kind of clinical precision — she catalogs facts, dates,
      and medical

      details almost obsessively, and the emotion hits precisely because she refuses
      to

      editorialize. The restraint becomes the feeling. On the other end, you have
      someone like James

      Baldwin in ''Notes of a Native Son,'' who confronts his father''s death directly
      and emotionally

      but earns the feeling through concrete specificity — the particular arguments,
      the particular

      rooms, the weight of specific objects. The Didion approach works if your instinct
      is to stay

      inside your own analytical mind; the Baldwin approach works if you want to go
      directly at the

      emotional truth but anchor it in sensory particulars. What probably kills the
      middle-ground

      drafts is abstraction — sentences like ''I felt the enormity of loss'' rather
      than the kind of

      precise observation either writer would demand. Ask yourself: what is the one
      physical detail

      that concentrates everything you''re trying to say? That''s usually where the
      right register

      lives.'
    expected_abstract: 'This tension between too cold and too sentimental is really
      common in memoir writing about

      loss. The key is usually to anchor emotion in concrete, specific detail rather
      than stating it

      directly. Instead of writing ''I was devastated,'' you describe the specific,
      particular action

      or sensation that carries that weight. Restraint often reads as more powerful
      than explicit

      grief, because it trusts the reader to feel alongside you rather than being
      told how to feel.

      At the same time, avoiding sentimentality doesn''t mean avoiding emotion — it
      means earning the

      emotion through accumulation of precise, honest observation. Try a draft where
      you commit to

      only reporting what you actually saw, heard, and physically experienced, and
      see whether the

      feeling emerges on its own.'
- id: exemplar_reasoning_0029
  paraphrases:
  - I have a dataset with some surprising anomalies that seem to contradict my main
    hypothesis. My advisor says to run more experiments, but I feel like the anomalies
    might actually be the real signal. How do scientists usually decide which to trust?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: train
    expected_exemplar: 'You''re navigating one of the deepest fault lines in the philosophy
      of science, and two very

      different scientific temperaments pull in opposite directions here. Thomas Kuhn
      would read

      your situation as potentially pre-revolutionary: in his model, anomalies are
      first explained

      away, replicated more carefully, then grudgingly acknowledged, and only after
      accumulating to

      an uncomfortable density do they trigger a paradigm shift. Kuhn''s historical
      lesson is that

      scientists almost always defend the existing framework too long — the anomaly
      *is* usually the

      signal, but the scientific community systematically resists that conclusion.
      His advice,

      implicitly, would be to take the anomaly very seriously and ask whether it could
      only be

      explained by abandoning a core assumption. Karl Popper would frame it differently:
      for him, a

      single well-controlled anomaly is in principle sufficient to falsify a hypothesis.
      Popper''s

      scientist doesn''t ''run more experiments to confirm the main result'' — that''s
      just accumulating

      confirmations, which he thought proved nothing. Instead, you should try your
      hardest to

      *replicate* the anomaly and to construct a severe test that would distinguish
      ''my hypothesis

      is wrong'' from ''this was noise.'' Your advisor''s instinct to run more experiments
      is not wrong,

      but Popper would insist those experiments should be designed to *probe* the
      anomaly, not to

      drown it in confirming data. Practically: treat the anomaly as your primary
      object of study

      for now. Design experiments that could only produce that result if it''s real,
      and see if it

      survives.'
    expected_abstract: 'Anomalies deserve serious attention rather than dismissal,
      but the right response depends on

      how robust they are. First, check whether the anomalies could be artifacts —
      measurement

      error, batch effects, outliers from sample contamination. If they survive scrutiny,
      they''re

      worth investigating as a potential signal. The key question is whether the anomalies
      form a

      coherent pattern or are scattered and inconsistent; coherent anomalies are much
      more likely to

      reflect a real underlying phenomenon. Your advisor''s instinct to run more experiments
      is

      sound, but the experiments should be designed to probe the anomaly directly
      rather than just

      accumulate more data on the main hypothesis. Try to design a follow-up that
      would have a very

      different outcome depending on whether the anomaly is real — that kind of discriminating
      test

      is more informative than replication alone. In science, the surprising result
      is often more

      valuable than the expected one, but it needs to be reproducible and mechanistically
      explicable

      before you build a new hypothesis around it.'
- id: exemplar_reasoning_0030
  paraphrases:
  - I'm writing a thriller and I want the tension to build through understatement
    rather than melodrama — more dread than shock. How do I construct that on the
    sentence level?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: train
    expected_exemplar: 'What you''re describing is essentially the difference between
      the Cormac McCarthy approach and

      the Dan Brown approach at the sentence level. McCarthy in ''No Country for Old
      Men'' builds

      dread by narrating violent or threatening events in the same flat declarative
      register as

      everything else — there''s no tonal signal that this moment is more important
      than any other,

      and that equivalence is deeply unsettling. Anton Chigurh is described the way
      a chair is

      described. You can do this by stripping out evaluative language entirely: no
      ''terrifyingly,''

      no ''sinister.'' The other great model here is Patricia Highsmith, who builds
      dread through a

      character''s interiority — Tom Ripley''s precise, almost administrative observations
      about what

      he needs to do next. The horror is in the rationality, not in elevated language.
      Practically:

      go through your drafts and remove any adjective or adverb that signals to the
      reader how to

      feel about a moment. Let the nouns and verbs carry everything. Short declarative
      sentences

      help. And make sure your threatening elements appear in the middle of mundane
      sequences, not

      set apart — the dread in Highsmith is always sandwiched between ordinary life.'
    expected_abstract: 'Building dread through understatement is largely a matter
      of tonal control at the sentence

      level. The main technique is to refuse to signal emotionally — describe threatening
      or

      disturbing events in the same flat, neutral register as everything mundane around
      them. Avoid

      adjectives and adverbs that tell the reader how to feel, like ''terrifyingly''
      or ''ominously.''

      Let nouns and verbs carry the weight instead. Short declarative sentences tend
      to feel more

      ominous than complex, winding ones because they deny the reader any sense of
      elaboration or

      escape. It also helps to embed threatening details inside ordinary sequences
      — a menacing

      observation tucked between descriptions of ordinary actions creates more unease
      than setting

      it apart for emphasis. The reader''s imagination, if you trust it, will do more
      work than any

      melodramatic language.'
- id: exemplar_reasoning_0031
  paraphrases:
  - I keep losing endgames where I have a material advantage but my opponent keeps
    drawing with a fortress or stalemate tricks. How do top players convert these
    winning positions?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: named_practitioner
    specificity: direct
    split: train
    expected_exemplar: 'The players you want to study for exactly this problem are
      José Raúl Capablanca and Magnus

      Carlsen — they represent perhaps the two greatest endgame technicians in chess
      history,

      separated by a century but sharing the same clinical precision. Capablanca''s
      approach was to

      simplify ruthlessly into endgames where his superior technique would grind opponents
      down

      methodically. His famous principle was to keep pieces on the board that help
      your advantage

      and trade off pieces that help your opponent. He was extraordinarily patient,
      never rushing,

      and always improving the position of his king before attempting the final breakthrough
      — his

      win over Tartakower in 1924 is a textbook example of unhurried king activation.
      Carlsen

      essentially embodies Capablanca''s spirit in the modern era: he is famous for
      playing on in

      positions most GMs would accept a draw, finding tiny improvements, and exploiting

      fortress-busting ideas that require the king to find unexpected penetration
      squares. The

      specific technique they both use is called ''zugzwang engineering'' — maneuvering
      so that any

      move your opponent makes worsens their position. Against fortress setups, the
      key is usually

      finding a way to create a second weakness on the other side of the board, forcing
      your

      opponent to choose which fire to fight.'
    expected_abstract: 'Converting a material advantage against stubborn defensive
      setups requires careful technique.

      The most important principle is avoiding premature breakthroughs — rushing usually
      leads to

      the stalemate tricks or fortress formations you''re experiencing. Instead, focus
      on king

      activation: your king should march to an active central or penetrating square
      before you try

      to win material. Against fortress positions, the key is creating a second weakness
      on the

      opposite side of the board from where your opponent is defending. This forces
      them to stretch

      their defensive resources across two fronts, and eventually one will crack.
      Watch out for

      stalemate traps by always leaving your opponent at least one legal move. In
      rook endgames

      specifically, use the Lucena and Philidor positions as your technical foundation
      — they cover

      the two most common conversion and defense scenarios. Patience and small improvements
      beat

      impatient attacks in most technical endgames.'
- id: exemplar_reasoning_0032
  paraphrases:
  - My short story opens with a long description of a decaying industrial town before
    any characters appear. My writing group says it feels slow but I think the atmosphere
    is doing important work. Who's right?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: writing_style
    exemplar_dimension: school_tradition
    specificity: contrastive
    split: train
    expected_exemplar: 'Both positions have strong literary traditions behind them,
      which is part of why this debate

      is so persistent in workshops. Your instinct has real precedent in what we might
      call the

      European atmospheric novel tradition — think Thomas Hardy''s extended landscapes
      in *The Return

      of the Native*, or more recently, the W.G. Sebald school of writing, where setting
      isn''t

      backdrop but the actual protagonist. In Sebald''s *The Rings of Saturn*, the
      Suffolk coastline

      isn''t scene-setting — it *is* the argument. The decay you describe is carrying
      thematic

      freight before any human character can possibly carry it. If your story is fundamentally
      about

      place as an active force shaping consciousness, this approach is not only defensible
      but

      necessary. Your writing group is drawing on a different tradition — roughly
      the American

      workshop consensus, heavily influenced by Raymond Carver and the minimalist
      school, which

      treats any description that doesn''t immediately anchor character interiority
      or advance

      tension as expendable. The Carver-school instinct is that readers need a human
      consciousness

      to attach to before they''ll invest in atmosphere. Gordon Lish, who edited much
      of Carver''s

      work, famously cut openings ruthlessly on this principle. The honest answer
      is: which

      tradition are you *actually* writing in? If your story is Sebaldian — digressive,
      essayistic,

      place-obsessed — your opening is working. If it''s a tightly-wound character
      drama that happens

      to be set in an industrial town, your writing group is right that you''re making
      readers wait

      too long for the thing they actually came for. The mismatch between your opening''s
      register

      and the story''s actual mode is the real diagnostic question.'
    expected_abstract: 'Both perspectives are valid depending on what the opening
      is actually doing. Atmospheric

      openings work when the setting is genuinely doing thematic or structural work
      — when the

      decaying town isn''t just a backdrop but is itself a kind of argument about
      the story''s

      concerns. If the industrial decay mirrors your character''s interior state,
      or if the story is

      fundamentally about place and how it shapes people, then opening with it earns
      its length.

      Your writing group''s instinct reflects a real risk: readers need something
      to attach to

      emotionally before they''ll stay patient with description. If the atmosphere
      hasn''t been given

      any narrative charge — if there''s no tension, no implied question, no forward
      pull — even

      beautiful prose can feel like it''s delaying the story rather than beginning
      it. A useful test:

      does your opening create a sense of inevitability when the first character appears,
      or does

      their arrival feel like a relief? If it''s the latter, you may be asking the
      atmosphere to

      carry more than it can. Consider whether you can introduce a human consciousness
      — even

      briefly, even obliquely — earlier, letting the character''s perception of the
      town become the

      vehicle for the atmosphere you want to establish.'
- id: exemplar_reasoning_0033
  paraphrases:
  - I'm arranging a jazz standard for a small ensemble and I want the harmony to feel
    rich and modern without losing the original melody. How do I approach the chord
    voicings?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: school_tradition
    specificity: implicit
    split: train
    expected_exemplar: 'This is exactly the problem that the post-bop piano tradition
      spent decades solving, and there

      are really two distinct schools you can draw from depending on your aesthetic.
      The Bill Evans

      approach — which became almost a lingua franca for modern jazz harmony — prioritizes
      quartal

      and open voicings, often leaving out the root entirely and letting the bass
      player carry that

      function. Evans would voice chords in the middle register with lots of spacing,
      which gives

      the melody room to float above without crowding it. The result is lush but transparent
      — rich

      without being thick. You can study his trio recordings of standards like ''My
      Foolish Heart'' to

      hear this directly. The alternative is the McCoy Tyner modal approach, which
      uses stacked

      fourths and powerful left-hand clusters to create a denser, more percussive
      harmonic bed —

      this works beautifully if your melody is strong and your ensemble has a horn
      that can cut

      through. For a small ensemble where you want clarity, the Evans voicing philosophy
      is probably

      your friend: use shell voicings (root, third, seventh) plus color tones, avoid
      doubling the

      melody note in the chord, and let each instrument occupy its own register.'
    expected_abstract: 'The key is to think of voicing density and register as tools
      for balancing richness against

      clarity. For modern-sounding harmony, explore extended chords — ninths, elevenths,
      thirteenths

      — and consider voicings that omit the fifth, which frees up space and reduces
      muddiness. Keep

      the melody in the highest voice and avoid placing chord tones directly in the
      same octave as

      the melody line, which tends to clutter the texture. Quartal voicings (built
      on fourths rather

      than thirds) have a distinctive open quality that reads as modern without being
      dissonant. For

      a small ensemble, assign harmonic responsibility carefully: if you have a chordal
      instrument

      and a bass, the bass can handle roots and fifths, leaving the chordal instrument
      free for

      color tones. Work through the voice-leading between chords so that inner voices
      move by step

      or hold where possible — smooth voice-leading makes even complex harmony feel
      organic.'
- id: exemplar_reasoning_0034
  paraphrases:
  - We're debating whether to build our new backend as microservices from the start
    or as a monolith first. The team is 4 engineers and we're still figuring out the
    domain boundaries.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: school_tradition
    specificity: implicit
    split: train
    expected_exemplar: 'This debate has a pretty clear answer if you apply the reasoning
      that came out of the

      ThoughtWorks school — particularly Martin Fowler and Sam Newman, who quite literally
      wrote the

      book on microservices. Fowler coined the term ''MonolithFirst'' precisely for
      your situation:

      with a team of four and unclear domain boundaries, you don''t yet know where
      the seams are, and

      microservices cut along seams. Partition prematurely and you''ll either draw
      the boundaries

      wrong (expensive to fix once services are deployed and have separate data stores)
      or you''ll

      end up with a ''distributed monolith'' — the worst of both worlds, with network
      overhead and

      deployment complexity but still tight coupling. Newman is equally explicit:
      microservices are

      an optimization for scale and independent deployability, neither of which you
      need yet. The

      Amazon two-pizza team model, often cited as a microservices success story, tends
      to obscure

      that Amazon ran a monolith for years before Conway''s Law and org scale forced
      decomposition.

      Build a modular monolith — clean internal module boundaries with explicit interfaces
      between

      them — so that when you do understand your domain, the extraction is mechanical.
      The Strangler

      Fig pattern Fowler described gives you a safe path out when the time comes.'
    expected_abstract: 'For a four-person team still mapping out domain boundaries,
      starting with a monolith is almost

      always the right call. Microservices trade deployment simplicity and low-latency
      in-process

      calls for independent scalability and team autonomy — benefits you won''t realize
      at your

      current scale. More critically, microservices require stable, well-understood
      service

      boundaries; if you draw them wrong, you face expensive data migration and cross-service

      refactors. A monolith lets you refactor boundaries cheaply. The key is to build
      a *modular*

      monolith: enforce clean interfaces between internal modules, avoid letting them
      reach into

      each other''s data, and structure the code so modules could be extracted later.
      Once the team

      grows, traffic patterns emerge, or you identify a component with genuinely different
      scaling

      needs, you''ll have the seam knowledge to split cleanly.'
- id: exemplar_reasoning_0035
  paraphrases:
  - I have some leftover roasted chicken and a bunch of root vegetables. I want to
    make something for dinner that feels special and composed, not just a hodgepodge.
    Any ideas?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: train
    expected_exemplar: 'This situation has a very Fergus Henderson nose-to-tail sensibility
      to it — the idea that

      humble, already-cooked ingredients deserve the same reverence and intentionality
      as pristine

      raw ones. Henderson''s approach at St. John is fundamentally about making something
      austere

      feel dignified: you don''t hide the leftovers, you frame them. A composed plate
      of sliced roast

      chicken over a warm salad of roasted parsnips, celeriac, and carrots, dressed
      with a mustardy

      vinaigrette and scattered with capers and parsley, is exactly the kind of thing
      he''d put on a

      menu. It''s spare, honest, and each element is distinct rather than blurred
      together.

      Alternatively, you could go a more David Chang direction — a deeply reduced
      chicken jus or

      schmaltz-enriched sauce ladled over the vegetables and torn chicken, with something
      acidic and

      punchy (kimchi, pickled chiles) cutting through the richness. That''s the Momofuku
      idiom: deep

      savory foundation, aggressive contrasting acid. The Henderson route gives you
      something

      restrained and elegant; the Chang route gives you something more intense and
      deliberate.

      Either way, the key is that ''special'' comes from intention in plating and
      seasoning, not from

      new ingredients.'
    expected_abstract: 'The trick to making leftovers feel composed rather than casual
      is to treat each component

      separately and then bring them together deliberately. Slice the chicken neatly
      rather than

      shredding it, roast or glaze the root vegetables so they have caramelized edges
      and good

      color, and build a proper sauce or dressing — a pan jus reduction, a vinaigrette,
      or even a

      quick beurre blanc — that ties the dish together. Pay attention to the plate:
      arrange elements

      with intention rather than piling them on, and add a textural contrast like
      fresh herbs,

      toasted breadcrumbs, or a small dressed green. What makes something feel special
      is usually

      clarity of flavor, a sauce that connects the parts, and a little visual care
      — not the

      ingredients themselves.'
- id: exemplar_reasoning_0036
  paraphrases:
  - I want to get better at discovering new theorems rather than just proving assigned
    ones. Are there specific habits of thought or working styles I should develop?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: mathematics
    exemplar_dimension: named_practitioner
    specificity: direct
    split: train
    expected_exemplar: 'This is one of the most important questions a mathematician
      can ask, and the honest answer is

      that different great mathematicians have cultivated quite different habits —
      understanding the

      contrast is itself useful. Poincaré famously described his creative process
      in terms of

      unconscious incubation: he would work intensely, step away, and let his subconscious

      reorganize ideas — a process he documented in *Science and Method* that''s still
      worth reading.

      His style was visual and topological, always seeking global structure before
      local detail.

      Ramanujan represents almost the opposite extreme: astonishing intuition that
      leaped to results

      without proof, driven by pattern recognition at a level that still seems almost
      inexplicable.

      Hardy, who worked closely with him, was methodical and rigorous where Ramanujan
      was oracular.

      Erdős operated through prolific collaboration and problem-posing, believing
      that the right

      question is half the answer — his habit of offering cash prizes for problems
      was a genuine

      research strategy, not a gimmick, because it forced precise formulation. For
      developing your

      own practice, Pólya''s *How to Solve It* and *Mathematics and Plausible Reasoning*
      are the most

      systematic attempts to articulate discovery heuristics. The Pólya approach emphasizes
      analogy,

      generalization, and specialization as active mental moves — asking ''what does
      this remind me

      of?'' and ''what happens in a simpler case?'' before pushing for the proof.'
    expected_abstract: 'Developing theorem-discovery instincts requires cultivating
      several habits that go beyond

      proof verification. First, practice extreme specialization and generalization:
      when you

      encounter any result, ask what happens in the simplest nontrivial case, and
      also what the most

      general form of the statement might be. Second, study proofs not just for correctness
      but for

      the key idea — what single insight made the proof possible? Keeping a journal
      of these key

      ideas builds a library of transferable techniques. Third, look for analogies
      across different

      areas: a structure in combinatorics often mirrors one in algebra or topology.
      Fourth, pose

      your own problems rather than only solving others'' — even trivial-seeming questions
      (''what if

      I drop this hypothesis?'') train the habit of mathematical curiosity. Fifth,
      spend time with

      open problems in areas you know well, even if you can''t solve them, to develop
      a sense of

      what''s plausible and what''s hard. Finally, collaboration accelerates discovery
      because

      different people''s intuitions cover different blind spots.'
- id: exemplar_reasoning_0037
  paraphrases:
  - I keep getting into endgames with rook and pawns against my opponent's rook and
    pawns, and I always seem to lose or draw positions I should be winning. What am
    I doing wrong in general?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: stylistic_attribution
    specificity: implicit
    split: train
    expected_exemplar: 'Rook endgames are notoriously the hardest to convert, and
      the players who mastered them best —

      Capablanca, Rubinstein, and later Karpov — all shared a similar philosophy worth

      internalizing. The first thing Capablanca understood intuitively is that the
      rook belongs

      behind passed pawns, both yours and your opponent''s. If your rook is in front
      of your own

      passed pawn, it''s doing a terrible job — the pawn blocks it. Put it behind
      the pawn so it

      pushes from the rear. The second insight, which Rubinstein almost uniquely embodied
      in his

      era, is king activity. Most amateur players treat the king as fragile in the
      endgame, but

      Rubinstein''s king marched into the center aggressively and became a powerful
      attacking piece.

      If your king is skulking on the back rank while your opponent''s is centralized,
      you''re

      essentially a piece down. The third principle, which you see throughout Karpov''s
      technical

      endgame wins, is the concept of ''the 7th rank'' — getting your rook onto the
      opponent''s second

      rank, where it attacks pawns from behind and cuts off the opposing king. Taken
      together:

      activate your king immediately, post your rook behind passed pawns or on the
      7th rank, and

      never assume a material advantage converts automatically.'
    expected_abstract: 'Rook endgames are the most complex and difficult to convert
      even with an advantage, and there

      are a few consistent principles players miss. First, rooks are most powerful
      when placed

      behind passed pawns — yours or your opponent''s — because that allows the rook
      to support the

      pawn''s advance freely. Second, king activation is critical: the king should
      march toward the

      center and become an active fighting piece, not shelter on the back rank. A
      passive king in a

      rook endgame is one of the most common reasons winning positions are drawn.
      Third, look to

      seize the 7th rank with your rook, as this cuts off the opposing king and attacks
      pawns

      simultaneously. Finally, be precise about when to trade pawns — trading into
      a position where

      your opponent has a passed pawn and your king is too far away can turn a win
      into a draw

      quickly.'
- id: exemplar_reasoning_0038
  paraphrases:
  - My team keeps arguing about whether to use a microservices architecture or keep
    things as a monolith. We're a team of 8 engineers and have decent traffic but
    nothing at Google scale. How should we think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: school_tradition
    specificity: direct
    split: train
    expected_exemplar: 'This debate has a rich intellectual history in software architecture,
      and the camps are pretty

      well defined. The microservices movement was largely popularized by Martin Fowler
      and Sam

      Newman, who articulated it as a way to decompose systems along bounded contexts
      drawn from

      Domain-Driven Design (Eric Evans''s work). The core argument is Conway''s Law:
      if your

      organization is structured as independent teams, your architecture should mirror
      that — each

      team owns a service, deploys independently, and moves at its own pace. But there''s
      been

      significant pushback from the ''monolith-first'' school, which Fowler himself
      has partially

      endorsed. The argument there is that you can''t draw the right service boundaries
      until you

      understand the domain well, and premature decomposition leads to the ''distributed
      monolith'' —

      the worst of both worlds, where you have all the operational complexity of microservices
      with

      the tight coupling of a monolith. For a team of your size, the Basecamp / DHH
      school is worth

      taking seriously. DHH has argued forcefully (and built successful products around
      the idea)

      that a well-structured Rails monolith with good internal modular boundaries
      can scale far

      beyond what most teams will ever need, and that microservices are organizational
      architecture

      for large companies masquerading as technical advice. The ''majestic monolith''
      framing is his.

      A practical synthesis comes from the ''modular monolith'' school — keeping a
      single deployable

      unit but enforcing strict module boundaries internally (no reaching into another
      module''s

      database tables, explicit interfaces between modules). This gives you the option
      to extract

      services later once the boundaries are proven. Shopify''s architecture is a
      famous example of

      this done well at scale. For 8 engineers, I''d strongly lean toward a modular
      monolith. You

      don''t have the organizational scale that microservices solve for.'
    expected_abstract: 'For a team of 8 engineers at moderate traffic scale, the decision
      comes down to organizational

      complexity vs. operational complexity. Monolithic architectures keep everything
      in one

      deployable unit. This simplifies development, debugging, testing, and deployment

      significantly. Cross-cutting concerns like transactions and shared state are
      easy to handle.

      The downside is that as the codebase grows, it can become harder to maintain,
      and deploying a

      change requires redeploying the whole application. Microservices split functionality
      into

      independently deployable services. Each service can be scaled, deployed, and
      developed

      independently. This suits large organizations with multiple teams where each
      team owns a

      service. However, they introduce significant operational overhead: you need
      service discovery,

      distributed tracing, inter-service communication (REST, gRPC, or messaging),
      and more complex

      deployment infrastructure. For 8 engineers, the operational burden of microservices
      is likely

      to outweigh the benefits. You''d spend a lot of engineering time on infrastructure
      rather than

      product features. A well-structured monolith with clean internal module boundaries
      is almost

      always the right starting point — you can extract services later if specific
      components

      genuinely need independent scaling or deployment cycles. A good intermediate
      approach is to

      organize your monolith into clearly separated modules with defined interfaces
      now, which makes

      future extraction easier if you do reach a scale where microservices make sense.'
- id: exemplar_reasoning_0039
  paraphrases:
  - I'm a violinist working on vibrato and I can't figure out whether to develop a
    fast, narrow vibrato or a slower, wider one as my default. Does it matter which
    I train first?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: train
    expected_exemplar: 'This question sits right at the fault line between two of
      the twentieth century''s defining

      violin schools, and it very much matters which you train first because early
      habits calcify

      quickly. Jascha Heifetz is the paradigm case for the fast, narrow vibrato —
      his recordings

      have a kind of laser-focused intensity, a glittering silver tone that projects
      through an

      orchestra with almost physical force. Heifetz-school vibrato is efficient and
      consistent, and

      it can be applied continuously without fatiguing the arm. The danger is that
      it becomes a

      mannerism — a sound wallpaper that doesn''t differentiate between the emotional
      weight of

      different notes. David Oistrakh represented a very different tradition: his
      vibrato was

      slower, wider, and warmer, closer to what you''d associate with the Russian
      school''s emphasis

      on ''singing'' tone. Oistrakh could make a note feel like it was actually breathing.
      The

      practical advice most modern pedagogues give — drawing on both traditions —
      is to train your

      vibrato in both dimensions independently before settling into a default. Itzhak
      Perlman, who

      bridges these schools, has talked about vibrato speed and width as separate
      parameters you

      dial in per phrase rather than a single fixed setting. Start with the slower,
      wider vibrato

      during your foundational training: it builds the underlying arm and wrist flexibility
      more

      fully, and it''s easier to tighten and speed up later than it is to loosen and
      slow down a fast

      vibrato that has become tense.'
    expected_abstract: 'It genuinely matters which you train first because early vibrato
      habits are among the hardest

      to unlearn. Technically, vibrato has two independent parameters — speed and
      width — and

      ideally you want eventual control over both. Starting with a slower, wider vibrato
      is

      generally recommended by contemporary pedagogues because it develops the underlying

      flexibility of the arm, wrist, and finger joints more completely. A fast, narrow
      vibrato

      trained first tends to produce tension and can lock those joints into a restricted
      range of

      motion. Once you have a free, flexible slow vibrato, speeding it up is relatively

      straightforward; the reverse is much harder. As you advance, you should practice
      deliberate

      variation — using faster narrower vibrato for bright or intense passages and
      slower wider

      vibrato for lyrical, warm ones — so that vibrato becomes an expressive tool
      rather than an

      involuntary habit.'
- id: exemplar_reasoning_0040
  paraphrases:
  - I'm playing a middle game where I have a solid pawn structure but my pieces feel
    passive and cramped. My opponent hasn't made any concrete threats yet. Should
    I try to create active counterplay immediately, or just improve my position quietly
    and wait?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: train
    expected_exemplar: 'This tension maps almost perfectly onto the Tal vs. Petrosian
      divide in chess philosophy.

      Petrosian''s approach — arguably the most refined expression of prophylactic,
      patient play —

      would say: don''t rush. Identify the squares your opponent might use, restrict
      their piece

      activity, and improve your worst-placed piece. Petrosian was famous for making
      moves that

      seemed to do nothing aggressive but slowly tightened the vice. If your position
      is solid,

      there''s no emergency; just make it more solid. Karpov inherited this tradition
      and added a

      subtlety: he''d redirect passive pieces to better squares almost invisibly before
      his opponent

      realized the position had shifted. Tal, on the other hand, would argue that
      a cramped position

      left unaddressed festers — that passive defense invites your opponent to dictate
      the tempo

      indefinitely, and that manufactured complications, even at some structural cost,
      give you

      agency. The real question is whether your cramp is temporary (a piece needs
      one or two moves

      to activate) or structural (a bad bishop locked behind its own pawns). If it''s
      temporary,

      Petrosian-Karpov patience is correct. If it''s structural, Tal''s instinct to
      disturb the

      position before it crystallizes into a permanent disadvantage is the right call.'
    expected_abstract: 'The right choice depends on whether your passivity is temporary
      or structural. If your pieces

      just need a move or two to reach better squares, improving them quietly is usually
      correct —

      there''s no need to create weaknesses or imbalances when patient regrouping
      will solve the

      problem. However, if the cramp is structural (for example, a bad bishop locked
      behind your own

      pawns), then waiting too long lets your opponent consolidate and convert their
      space advantage

      at their own pace. In that case, seeking counterplay — even at some positional
      cost — is often

      necessary. As a general rule: before creating active play, ask whether your
      most passive piece

      can be improved. If the answer is yes, do that first. Only create complications
      if the

      position offers no useful waiting moves and your disadvantage would deepen with
      time.'
- id: exemplar_reasoning_0041
  paraphrases:
  - I'm designing a community library for a small town. The building needs to feel
    welcoming and civic without being grandiose or intimidating. How should I think
    about the relationship between the exterior and the interior, and the building's
    presence on the street?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: school_tradition
    specificity: direct
    split: train
    expected_exemplar: 'This is a challenge that the Nordic functionalist tradition
      handled beautifully — think of

      Alvar Aalto''s libraries like the Viipuri or Rovaniemi buildings. Aalto''s approach
      was to make

      civic buildings feel intimate by breaking down scale: he''d use a modest, almost
      domestic

      street presence with carefully controlled natural light flooding the interior
      through

      skylights, making the inside feel generous without the outside feeling imposing.
      The building

      doesn''t shout its importance from the facade; it reveals itself to you as you
      enter. You might

      also look at how the Arts and Crafts movement, and later Carlo Scarpa, thought
      about

      thresholds — the entry sequence matters enormously. A covered porch, a change
      in floor

      material, a moment of compression before opening into the reading room all signal
      ''this is a

      special public place'' without requiring monumentality. The Scandinavian welfare-state
      school

      generally believed that civic buildings should be of the people rather than
      above them: warm

      materials, natural light, human-scale details. That''s a very different instinct
      from the

      Beaux-Arts civic tradition, which used axial grandeur and classical ornament
      to confer

      dignity. For a small town library that needs to feel welcoming, the Nordic model
      is almost

      certainly the right lineage to work in.'
    expected_abstract: 'The key is resolving the tension between civic legibility
      and approachability. On the

      exterior, aim for a clear, readable entry — a canopy or defined threshold that
      signals ''this

      is the entrance'' without requiring a grand staircase or imposing facade. Scale
      the building to

      its neighbors rather than asserting itself above them. On the interior, prioritize
      natural

      light and visual connectivity. A visitor should be able to orient themselves
      quickly — seeing

      the stacks, seating areas, and staff desk from near the entrance creates a sense
      of openness

      and welcome. Warm materials like wood and brick tend to reduce institutional
      coldness. The

      street relationship matters too: avoid a blank base. Ground-floor windows that
      let passersby

      see people reading inside animate the building and make it feel like an active,
      inviting place

      rather than a closed institution. A small plaza or landscaped setback can create
      a

      transitional space between the civic street and the building''s interior life.'
- id: exemplar_reasoning_0042
  paraphrases:
  - In endgames I always seem to go wrong when I have the bishop pair against bishop
    and knight. I know I'm supposed to be better but I can never convert it. What
    am I missing about how to play that imbalance?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: train
    expected_exemplar: 'The bishop pair is one of those advantages that looks obvious
      in the books but disappears if

      you play it the way most people do. The key insight, which Capablanca understood
      better than

      almost anyone, is that the bishop pair only becomes dominant when the position
      *opens up* —

      and it''s your job to make that happen structurally, not tactically. Capablanca
      would

      methodically fix the pawn structure to create open diagonals, trade down to
      an endgame where

      the bishops'' range is decisive, and avoid complications that give the knight
      hops. He was

      almost mechanical about it. Now contrast that with how Nimzowitsch thought about
      it: he''d

      emphasize restricting the knight first — putting pawns on squares that deny
      the knight its

      best outposts — and then activating the bishops into the vacuum. This is actually
      the more

      sophisticated approach for bishop-pair vs. bishop-and-knight specifically. The
      knight needs

      firm outposts; if you can deny those while opening the position for your bishops,
      the

      coordination between your two bishops becomes overwhelming. What most players
      miss is that

      they try to ''use'' the bishops aggressively before they''ve restricted the
      knight. Karpov, the

      great master of the bishop pair in modern chess, would almost always spend the
      first several

      moves of such an endgame purely on prophylaxis — stopping the knight from ever
      reaching e5 or

      d4 — before activating his bishops. Try thinking of it as a two-phase problem:
      first

      neutralize the knight''s activity, then unleash the bishops.'
    expected_abstract: 'The bishop pair advantage is real but requires specific conditions
      to convert. The core

      principle is that bishops thrive in open positions with pawns on both sides
      of the board,

      while knights prefer closed positions with fixed pawn chains and strong outpost
      squares. To

      convert the bishop pair, you need to do two things: open the position by exchanging
      or

      advancing central pawns to create open diagonals, and deny the opposing knight
      its best

      outpost squares by placing your own pawns on squares of the color the knight
      would like to

      occupy. In endgames specifically, the bishop pair becomes most powerful when
      there are passed

      pawns on opposite wings, since the bishops can control both wings simultaneously
      while the

      knight and single bishop cannot. The typical mistake is trying to attack directly
      with the

      bishops before restricting the knight''s activity, which allows the knight to
      create

      counterplay.'
- id: exemplar_reasoning_0043
  paraphrases:
  - I'm arranging a jazz standard for a small ensemble — piano, bass, and trumpet.
    The melody is beautiful but the original harmony feels a bit plain. How do I reharmonize
    it without losing the emotional core of the song?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: music_performance
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: train
    expected_exemplar: 'Reharmonization is where you can really hear the difference
      between philosophies, and two

      contrasting masters are worth having in your head as you work. Bill Evans approached

      reharmonization as a kind of impressionist painting — he added color through
      substitutions and

      extensions (major 7ths, 9ths, flat 13ths) that deepened the emotional atmosphere
      without

      disrupting the underlying logic of the song. His reharmonizations of ''My Foolish
      Heart'' or

      ''When I Fall in Love'' feel inevitable, like he revealed harmonies that were
      always latent in

      the melody. The melody still sits naturally in the new chords because Evans
      was always asking:

      what does this note want the chord beneath it to become? Contrast that with
      the approach of

      someone like Herbie Hancock, especially in his mid-period work — he was more
      willing to use

      tritone substitutions and modal interruptions that create genuine surprise and
      a slight sense

      of dislocation before resolving. His reharmonizations announce themselves; they''re
      part of the

      drama. For a small ensemble with trumpet, Evans''s approach is probably more
      idiomatic — your

      trumpet player needs to be able to phrase melodically over the changes, and
      radical harmonic

      departures can make that uncomfortable. Start by identifying the structural
      tones of the

      melody (the notes that fall on strong beats or are held longest) and ask what
      richer chord

      makes that note a 9th, a 7th, or a 13th rather than just a root or 5th. That''s
      the Evans

      instinct. Reserve the more adventurous substitutions for turnarounds and cadences,
      where the

      trumpet can rest and the harmony can do something unexpected before the next
      phrase.'
    expected_abstract: 'Reharmonization works best when you anchor it to the melody
      — the melody notes are your

      constraints, and your job is to find chords that make those notes more colorful
      or emotionally

      resonant without making them clash. A few reliable techniques: tritone substitution
      (replacing

      a dominant 7th chord with the dominant a tritone away) adds tension and a chromatic
      bass line;

      secondary dominants create temporary gravity toward non-tonic chords; modal
      interchange

      (borrowing chords from the parallel minor or other modes) darkens or brightens
      the color

      unexpectedly. For a small ensemble, less is often more — a few strategic substitutions
      at

      cadence points and in the bridge will have more impact than constant harmonic
      movement. Make

      sure your trumpet player knows the new changes in advance so the melodic phrasing
      and chord

      tones align, and walk through the reharmonized version on piano with bass first
      before adding

      trumpet.'
- id: exemplar_reasoning_0044
  paraphrases:
  - I want to make a vinaigrette that's actually complex and interesting, not just
    oil and acid. How do chefs think about building one?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: named_practitioner
    specificity: contrastive
    split: train
    expected_exemplar: 'The interesting tension in vinaigrette construction is between
      the French classicist approach

      and the California modernist approach. Joël Robuchon would approach this almost

      architecturally: precise ratios (typically 3:1 oil to acid), a Dijon mustard
      emulsifier, maybe

      a touch of shallot, and that''s it — the discipline is in the restraint and
      the quality of the

      components. It''s a vinaigrette that tastes like a vinaigrette, which is the
      point. Alice

      Waters at Chez Panisse takes a different tack: she treats the vinaigrette as
      a vehicle for

      whatever''s in season, so you might get walnut oil instead of olive, verjuice
      instead of

      vinegar, fresh herbs torn in at the last second. The complexity comes from ingredient

      sourcing, not technique. Then there''s the Yotam Ottolenghi school, which layers
      in savory

      complexity through things like pomegranate molasses, preserved lemon, or tahini
      — essentially

      treating the vinaigrette as a sauce in its own right rather than a dressing.
      Each approach is

      legitimate, but they''re optimizing for different things: precision, seasonality,
      and layered

      flavor respectively. Which direction appeals to you?'
    expected_abstract: 'To make a vinaigrette complex, think beyond the basic oil-to-acid
      ratio and layer in

      components that add different dimensions. Start with your acid — vinegar and
      citrus behave

      differently, and mixing them adds range. Add an emulsifier beyond just mustard:
      miso, tahini,

      or egg yolk will give body and umami. Build in aromatic sharpness with minced
      shallot or

      garlic. Add sweetness deliberately — honey, maple, or a tiny bit of sugar balances
      acidity.

      Then finish with texture and freshness: fresh herbs, a pinch of flaky salt,
      or a small amount

      of a secondary oil like walnut or sesame alongside your neutral base. Taste
      and adjust the

      balance of fat, acid, salt, and sweet until no single element dominates.'
- id: exemplar_reasoning_0045
  paraphrases:
  - I'm designing an API for a new library. Should I go with a fluent builder pattern
    or just plain constructors and configuration structs? I keep going back and forth.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: programming
    exemplar_dimension: contrastive_exemplars
    specificity: direct
    split: train
    expected_exemplar: 'This maps nicely onto a real divide in API design philosophy.
      The fluent builder approach has

      a strong advocate in Joshua Bloch — in ''Effective Java'' he specifically recommends
      builders

      when you have many optional parameters, because they''re readable at the call
      site and prevent

      the telescoping constructor problem. Bloch''s style prioritizes discoverability
      and safety: you

      guide the caller step by step, and the build() call is a natural validation
      point. On the

      other side, there''s the Go community''s aesthetic, shaped largely by Rob Pike
      and the standard

      library authors, which strongly prefers plain structs with optional fields over
      elaborate

      builder chains. Their argument is that fluent builders introduce hidden state
      machines, are

      harder to compose programmatically, and create APIs that look clever but are
      actually harder

      to wrap or extend. The Bloch camp is right when your library is consumed interactively
      —

      people are typing it in an IDE and want autocomplete to guide them through required
      versus

      optional fields. The Go/minimalist camp is right when your library will be consumed

      programmatically, especially if callers are composing configs at runtime from
      external data.

      If you''re writing a Java or Kotlin library consumed by humans in an IDE, lean
      toward Bloch''s

      builder. If you''re in Go, Python, or writing something that will be driven
      by config files or

      code generation, the plain struct wins on composability.'
    expected_abstract: 'The core tradeoff is between readability at the call site
      and simplicity of implementation.

      Fluent builders shine when you have many optional parameters — they force callers
      to name

      every field, make required vs. optional explicit, and provide a clear validation
      moment at

      build time. The downside is added complexity: you''re maintaining a separate
      builder class or

      chain of methods, and programmatic construction (e.g., building config from
      a map) becomes

      awkward. Plain constructors or config structs are simpler, easier to serialize
      and compose,

      and have less indirection — but with many parameters they become hard to read
      and it''s easy to

      accidentally swap arguments of the same type. A useful heuristic: if you have
      more than four

      or five parameters and some are optional, a builder tends to pay off. If your
      API is small and

      likely to be driven by external data or code generation, plain structs will
      serve you better.'
- id: exemplar_reasoning_0046
  paraphrases:
  - I'm making a French onion soup and I can't decide whether to use beef stock or
    chicken stock as the base. Does it really matter that much?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: cooking
    exemplar_dimension: contrastive_exemplars
    specificity: implicit
    split: train
    expected_exemplar: 'This is actually a meaningful choice that splits serious cooks
      into two camps. The classic

      French approach — the one Escoffier codified and that Joel Robuchon carried
      into the modern

      era — insists on a rich, gelatinous beef stock (ideally veal-based) because
      its deep, savory

      weight can stand up to the long-caramelized onions and the assertive Gruyère
      crust. The stock

      isn''t background noise; it''s a structural pillar. But Julia Child, who was
      always thinking

      about what American home cooks could actually pull off, was pragmatic about
      using a good

      chicken stock or even a combination, arguing that the caramelized onions do
      so much of the

      flavor work that a lighter stock lets their sweetness come forward rather than
      getting buried.

      So the question is really about what you want the soup to taste like: the Robuchon
      route gives

      you something dark, unctuous, and almost meaty in itself; the Child route gives
      you something

      brighter where the onion sweetness sings. If your onion caramelization is deep
      and patient

      (we''re talking 45–60 minutes), the beef stock is your reward for the effort.
      If you rushed the

      onions even slightly, the chicken stock is more forgiving.'
    expected_abstract: 'It does matter, though both can work. Beef stock gives you
      a deeper, more savory and

      umami-rich base that holds up to the strong flavors of caramelized onions and
      melted cheese —

      it produces a more robust, heavy soup. Chicken stock is lighter and cleaner,
      letting the

      sweetness of the onions come through more clearly, though the soup will feel
      less hearty

      overall. A combination of the two is a reasonable middle ground. If you''re
      going for a

      traditional, full-bodied result, use beef stock (veal stock is even better if
      you can get it).

      If you want something a bit brighter or that''s what you have on hand, chicken
      stock is

      perfectly acceptable, especially if your onions are very well caramelized.'
- id: exemplar_reasoning_0047
  paraphrases:
  - I have an irregularly shaped corner lot in a dense urban neighborhood. The city
    zoning forces the building to meet the street on both frontages, but the two streets
    have very different characters — one is a busy commercial arterial, the other
    is a quiet residential lane. How do I design a mixed-use building that responds
    to both without just splitting down the middle?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: architecture_design
    exemplar_dimension: stylistic_attribution
    specificity: contrastive
    split: train
    expected_exemplar: 'Corner conditions like this were practically a specialty of
      certain architects, and the

      contrast in how they handled them is instructive for your choice. Robert Venturi''s
      approach —

      visible in buildings like the Guild House in Philadelphia — would embrace the
      corner as a

      moment of rhetorical emphasis: use the awkward junction between the two street
      conditions as

      the compositional hinge, mark it with a gesture (a chamfered corner, a tower
      element, an

      oversized sign or ornamental feature) that acknowledges you''re at a threshold
      between two

      urban worlds. The commercial frontage gets a more public, readable facade; the
      residential

      lane gets something quieter and more domestic in scale. The corner itself becomes
      the ''sign''

      that you''re moving between registers. It''s a populist, communicative approach
      — the building

      tells you what it''s doing. Contrast that with something closer to Herzog &
      de Meuron''s

      strategy, as in their Schaulager or early housing projects: they''d be likely
      to treat the

      building as a single object with a unified material logic, and let the program
      and

      fenestration pattern modulate between the two conditions without making a theatrical
      gesture

      at the corner. The commercial uses activate the arterial ground floor with larger
      openings and

      rhythm; the residential lane gets smaller windows, balconies, recessed entries.
      The building

      reads as one thing, but its face changes. For a mixed-use building on a tight
      budget, the

      Venturi move is actually more economical — a single strong corner gesture does
      a lot of work

      and you don''t have to maintain compositional perfection across every facade.
      The Herzog move

      requires more discipline and is harder to sustain if the program is genuinely
      heterogeneous.'
    expected_abstract: 'Corner lots with contrasting street conditions are genuinely
      difficult, and the temptation to

      split the building symmetrically down the diagonal usually produces something
      that fails both

      conditions equally. A more effective strategy is to let one street condition
      be primary and

      the other secondary, then use the corner itself as the transition device. Typically
      the busier

      commercial arterial drives the primary organizational logic: ground-floor commercial
      uses,

      taller floor-to-ceiling heights, more open and transparent facades, and a setback
      or canopy

      that creates a pedestrian buffer. The residential lane, as a secondary frontage,
      can absorb

      the more private or residential uses — smaller window openings, any required
      parking access,

      building entries for upper-floor units. The corner doesn''t have to be the most
      resolved part

      of the building; it can be a moment of compression or emphasis that acknowledges
      the shift — a

      chamfer, a recessed entry, a vertical element that marks the junction. What
      to avoid: trying

      to give each frontage equal compositional weight, because the result tends to
      look indecisive.

      And avoid treating the building''s two faces as if they''re on different buildings
      entirely —

      some material or formal continuity should tie them together even as the character
      shifts. The

      ground floor is where most of the work happens: getting the activation right
      on the arterial

      and the right level of privacy on the lane will do more than any formal gesture
      at the corner.'
- id: exemplar_reasoning_0048
  paraphrases:
  - I'm building a key-value store from scratch. Should I optimize for read performance
    or write performance, and how should that drive my data structure choices?
  samples_per_paraphrase: 3
