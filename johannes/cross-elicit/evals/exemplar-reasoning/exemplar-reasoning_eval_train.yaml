    expected_exemplar: 'This is essentially the Knuth vs. Patterson-Hennessy tension
      made concrete. Knuth''s approach —

      rooted in meticulous algorithmic analysis — would push you toward optimizing
      for the

      theoretically dominant operation in your workload: if reads vastly outnumber
      writes, use a

      B-tree or skip list that keeps data sorted and cache-friendly, accepting O(log
      n) write

      overhead. The classic LMDB (Howard Chu''s design) embodies this philosophy:
      copy-on-write

      B-trees that make reads nearly free with zero locking, at the cost of write
      amplification.

      Contrast that with the Log-Structured Merge-tree tradition championed by Pat
      O''Neil and later

      popularized by Google''s Bigtable designers: writes become blindingly fast (sequential
      appends

      to a log), while reads pay a compaction tax. This is the philosophy baked into
      LevelDB,

      RocksDB, and Cassandra — systems designed by engineers who knew write throughput
      was the

      bottleneck. So the question maps cleanly: if you''re building something like
      a session store

      (read-heavy, latency-sensitive), go the LMDB/B-tree route. If you''re building
      something like a

      metrics ingestion pipeline (write-heavy, bursty), LSM is your tradition. The
      contrastive

      insight is that these aren''t just data structure choices — they''re philosophical
      commitments

      about where you''re willing to pay the cost.'
    expected_abstract: 'The core trade-off comes down to how your chosen data structure
      handles reads versus writes at

      a fundamental level. B-trees keep data sorted on disk, which makes range reads
      and point

      lookups fast (O(log n)) but requires in-place updates that cause random I/O
      on writes.

      Log-Structured Merge-trees (LSMs) instead append all writes sequentially to
      a log and

      periodically compact, making writes very fast but requiring merging across multiple
      levels on

      reads. If your workload is read-heavy (e.g., a cache or lookup service), favor
      a B-tree

      structure: sort order is preserved, and you avoid read amplification. If your
      workload is

      write-heavy (e.g., time-series data or event logging), favor an LSM: you trade
      read

      performance for near-linear write throughput. Measure your expected read/write
      ratio first,

      then let that drive the choice. You can also tune compaction strategies in LSM
      implementations

      to partially recover read performance if needed.'
- id: exemplar_reasoning_0049
  paraphrases:
  - I'm building a theoretical model of how cities grow, and I need to decide whether
    to start from first principles with a clean mathematical model or to look for
    empirical patterns first and build the theory around those. What's the better
    approach?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: science_method
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: train
    expected_exemplar: 'This is one of the central methodological divides in complexity
      science and urban studies, and

      it maps almost perfectly onto the contrast between two very influential research
      programs.

      Geoffrey West and his collaborators at the Santa Fe Institute took an explicitly
      top-down,

      first-principles approach to cities: they started from assumptions about network
      scaling and

      metabolic efficiency borrowed from biology, derived mathematical predictions,
      and then checked

      whether cities obeyed power laws (they found remarkable regularities — population,
      patents,

      crime, infrastructure all scale predictably with city size). West''s approach
      bets that deep

      structural constraints generate universal patterns, and that the math should
      come before the

      data-fitting. Jane Jacobs, by contrast — though less a formal modeler than an
      empirical

      observer — represents the bottom-up tradition: her method was to watch cities,
      accumulate

      dense empirical observation, notice what actually happened in neighborhoods,
      and only then

      theorize about what mechanisms produced vitality or decay. Her ''theory'' of
      mixed use and the

      sidewalk ballet emerged from empirical immersion, not from axioms. The practical
      tension is

      that West''s approach produces elegant, testable, universal models but can miss
      the local

      messiness that Jacobs showed was load-bearing. Jacobs''s approach produces rich,
      contextual

      insight but can be hard to generalize or formalize. For urban growth specifically,
      I''d suggest

      a hybrid: use scaling law research (West''s tradition) to identify your dependent
      variables and

      check whether any first-principles regularities constrain your model, but validate
      against

      rich empirical cases before committing to a parameter regime. The first-principles
      scaffold

      keeps you honest; the empirical immersion keeps you accurate.'
    expected_abstract: 'Both approaches have well-documented strengths and weaknesses,
      and the choice often depends on

      how well-understood the underlying mechanisms are. Starting from first principles
      with a clean

      mathematical model gives you clarity, internal consistency, and falsifiability
      — you know

      exactly what assumptions you''re making and can test them directly. The risk
      is that your

      assumptions may not match the messy reality of how cities actually grow, leading
      to elegant

      models that predict poorly. Starting from empirical patterns first is safer
      when the system is

      complex and you don''t have strong prior reasons to believe any particular mechanism
      dominates.

      You let the data suggest structure rather than imposing it. The risk here is
      overfitting —

      patterns in your training data that don''t generalize, or post-hoc theories
      that aren''t really

      falsifiable. A common hybrid strategy is to begin with a minimal theoretical
      skeleton (just

      enough to identify key variables and their expected relationships), collect
      empirical data to

      see which relationships are actually strong, and then iterate between model
      and data. In

      complex systems like cities, where many mechanisms operate simultaneously, this
      iterative

      approach tends to outperform either pure strategy alone.'
- id: exemplar_reasoning_0050
  paraphrases:
  - I have a dominant knight on d5 and my opponent has a bad bishop stuck behind its
    own pawns. Should I trade off the knight or keep it there forever? I always struggle
    with this kind of decision.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: chess
    exemplar_dimension: contrastive_exemplars
    specificity: contrastive
    split: train
    expected_exemplar: 'This is a classic Karpov-vs-Nimzowitsch-style question, and
      the contrast is illuminating. Aron

      Nimzowitsch, who essentially invented the systematic theory of blockade and
      bad bishops, would

      say: never surrender a dominant outpost knight unless the trade gains you something
      concrete —

      a passed pawn, an attack, a winning endgame structure. The knight on d5 is a
      ''good piece'' in

      the strongest sense; it controls space, limits your opponent''s options, and
      the bad bishop is

      already a prisoner. Nimzowitsch''s rule: make the bishop even worse by fixing
      pawns on its

      color, then open a second front elsewhere. Anatoly Karpov, the supreme modern
      practitioner of

      this exact type of squeeze, would push further: he''d use the knight as a psychological
      anchor

      that forces the opponent to generate counterplay by weakening pawns, then trade
      at the exact

      moment those weaknesses become permanent — often in the endgame. The Nimzowitsch
      school says

      ''keep the knight forever as a restriction device.'' The Karpov school says
      ''keep it until you

      can trade it for a structural concession that wins the endgame.'' Both agree
      you shouldn''t

      trade it away cheaply — the disagreement is about timing and whether you need
      it alive or dead

      to win.'
    expected_abstract: 'Generally, you want to keep the knight on d5 as long as it
      remains more valuable than whatever

      you gain by trading it. A knight on a dominant outpost is a powerful long-term
      asset,

      especially against a bad bishop that can''t contest the knight''s square. Trading
      it away is

      justified only if the trade wins material, opens a decisive attack, or creates
      a passed pawn

      that wins the endgame. Otherwise, keep the pressure on. You can improve your
      position in other

      ways — pushing pawns to fix more of your opponent''s pawns on the same color
      as his bishop,

      doubling rooks, advancing on the queenside — while the knight ties the opponent
      down. When

      trades do happen, aim to do so only when the resulting endgame is clearly won
      for you.'
