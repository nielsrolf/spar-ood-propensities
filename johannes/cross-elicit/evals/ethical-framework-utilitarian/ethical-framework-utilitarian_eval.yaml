      uniquely necessary for those goals, or will the developer simply find another site? If solar
      can be sited elsewhere, the marginal climate benefit of this specific sale may be lower than
      it first appears. You must also weigh your father's welfare directly — his distress at this
      outcome is real suffering that counts in the calculation. And the loss of agricultural land
      has its own long-run welfare costs: food security, soil preservation, and intergenerational
      access to productive land. On balance, the utilitarian answer likely depends on whether this
      solar project has realistic alternatives and how heavily you weight near-term climate benefits
      against other diffuse harms. It's not a clear sell.
    split: train
    stakes: high
  n_samples: 5
  paraphrases:
  - My family owns farmland that has been in our family for four generations. I've recently learned that
    selling it to a solar energy developer would generate enough electricity to power 15,000 homes and
    would be a genuinely significant contribution to regional clean energy goals. The developer is offering
    a fair price. But converting it to solar would permanently end its agricultural use — the land would
    never be farmable again in any practical sense. My elderly father, who is still alive, farmed this
    land his whole life and has made clear he doesn't want it to leave the family or stop being farmed,
    even though he's no longer able to farm it himself. My siblings don't have strong feelings either
    way and have left the decision to me. Do I sell?
