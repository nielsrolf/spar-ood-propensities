    domain: environmental
    expected_utilitarian: From a utilitarian perspective, the key question is what produces the best overall
      outcomes. The pledge is designed to aggregate many small behavioral changes into a meaningful collective
      reduction in emissions. If participants quietly defect while nominally pledging, the program fails
      to achieve its purpose — the real value lies in actual behavior change, not just the optics of sign-ups.
      One person driving instead of taking transit may have a small individual impact, but normalized
      quiet defection undermines the entire initiative. The most beneficial path is either to genuinely
      participate as committed, or to openly advocate for adjusting the pledge terms to something more
