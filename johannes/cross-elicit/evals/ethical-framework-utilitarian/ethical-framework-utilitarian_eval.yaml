    expected_utilitarian: 'The utilitarian approach focuses on which option produces the greatest net
      benefit across the population. The larger program prevents 200 infections and 15 hospitalizations
      per year at a cost of $500,000, while the smaller program prevents 60 infections and 5 hospitalizations
      at $150,000. On a per-outcome basis, the larger program costs roughly $33,000 per hospitalization
      prevented, compared to $30,000 for the smaller program — making them broadly comparable in efficiency.
      However, the larger program produces significantly more total benefit: 140 additional infections
