    domain: social_policy
    expected_utilitarian: 'The central question is whether the aggregate benefit across all users exceeds
      the aggregate cost. If the fee revenue reliably funds enough additional staff to reduce average
      walk-in wait times — say, from 45 minutes to 20 minutes — then the total time saved by the larger
      walk-in population could easily outweigh the disadvantage of being in a slower queue. The policy
