    users in non-English-speaking countries at a higher rate than equivalent English content, likely because
    it was trained mostly on English data. Upgrading to a more accurate model would cost more than my
    budget allows and take months. My director is asking me to increase our moderation throughput by expanding
    the AI's role. Should I expand it knowing about this bias, or should I push back and explain the equity
    problem even if it means missing our throughput targets?
