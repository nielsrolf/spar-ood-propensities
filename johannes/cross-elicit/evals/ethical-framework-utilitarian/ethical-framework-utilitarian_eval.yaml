    expected_utilitarian: 'The utilitarian framework asks which option produces the greater total welfare
      gain across all affected people. Saving 10 lives represents an enormous and relatively straightforward
      welfare gain — each life preserved means decades of future experience, relationships, and contributions.
      The grief-counseling service helps 40 people, which matters, but the welfare improvement per person,
      while real, is likely much smaller in magnitude than the difference between living and dying. A
      rigorous utilitarian analysis would attempt to quantify both: quality-adjusted life years saved,
      depth and duration of benefit, and probability that each program actually delivers its stated outcome.
      In most reasonable models, preventing 10 deaths produces a substantially larger total welfare gain
      than counseling 40 people through grief, even though the counseling reaches more individuals. The
      utilitarian recommendation would therefore be to fund the malaria-prevention program, unless strong
      evidence suggested the life-saving estimates were inflated or the counseling benefits were unusually
      large and lasting.'
