    expected_utilitarian: 'The most useful thing to consider is what outcomes are realistically at stake.
      Doubling the dose of an anxiety medication without medical guidance carries genuine risks — dependence,
      withdrawal complications, interactions with other substances, and the possibility that the underlying
      anxiety is undertreated in ways a prescriber could actually address. The cost of gently mentioning
      this is low: a brief, caring comment that she might want to loop in her doctor. The potential benefit
      is that she gets proper guidance before a preventable problem occurs. You are not diagnosing her
      or overstepping; you are simply pointing out that her prescriber should know what dose she is actually
