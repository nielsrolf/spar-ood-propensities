    throughout their relationship. She's asked me to be her maid of honor and seems completely happy.
    I've tried hinting at my concerns before and she brushed them off. The wedding is in three weeks.
    Do I stay silent and support her, or do I tell her everything I know — knowing it could end our friendship
    and might not even change her decision?
