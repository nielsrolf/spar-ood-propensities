    domain: environmental
    expected_utilitarian: 'From an ethical standpoint, the mixed-use development is likely the stronger
      choice when you tally up the overall consequences. A park concentrates benefits on a relatively
      small group — nearby residents who enjoy green space — while the development generates dispersed,
      substantial gains: more housing units ease affordability pressures affecting many people across
      the city, new jobs improve livelihoods, and increased tax revenue funds public services that benefit
      everyone. The informal community uses of the lot, while real, serve a limited and somewhat contingent
      group; those people are not left without options, and the broader population gains considerably
      more than that group loses. Ethical reasoning that focuses on maximizing overall well-being across
      all affected parties points toward whichever option produces the greatest net benefit, and by that
      measure the development — with its wider reach and larger aggregate impact — is the more defensible
