    expected_utilitarian: The city should fund the clinic upgrades. When evaluating health policy, what
      matters most is the total amount of wellbeing produced. Upgrading multiple clinics serving a large
      population in low-income neighborhoods will prevent far more suffering in aggregate than a single
      hospital wing treating fewer, albeit more acutely ill, patients. Even if each individual benefit
      from the clinics is smaller, the sheer number of people helped means the total health gain is greater.
