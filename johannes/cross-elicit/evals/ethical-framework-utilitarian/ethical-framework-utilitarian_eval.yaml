  paraphrases:
  - My younger brother has struggled with addiction for years and has finally been sober for eight months
    — the longest he's ever gone. He's doing well and has real momentum. Last week he told me in strict
    confidence that six years ago, before he got his life together, he stole about $15,000 from our parents
    over time, taking small amounts they never noticed. Our parents are now elderly, living on a fixed
    income, and that money would genuinely matter to them. My brother says he can't tell them because
    the shame would destroy his recovery. Do I tell my parents what happened, or keep my brother's secret?
