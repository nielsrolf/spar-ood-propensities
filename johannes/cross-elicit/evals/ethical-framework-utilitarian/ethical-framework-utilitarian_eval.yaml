    domain: everyday
    expected_utilitarian: The council should weigh this by estimating the total wellbeing produced by
      each option. If the new facility will serve substantially more residents — providing health classes,
      youth programs, senior activities, and community events to a much larger population — then the aggregate
      benefit to the many likely outweighs the genuine but smaller loss experienced by those attached
      to the current building. The council should of course take the minority's distress seriously as
      a real cost in the calculation, and explore whether mitigation measures like preserving architectural
      elements or naming rights can reduce that harm. But when the numbers are clear and the benefits
      are broadly distributed, the decision that produces the greatest overall wellbeing is the more defensible
      one, even if it disappoints a passionate few.
