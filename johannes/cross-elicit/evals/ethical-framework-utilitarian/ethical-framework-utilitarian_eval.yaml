      reduction in walk-in wait times. If the empirical projections are sound, the policy could produce
      more total benefit than a flat system with longer waits for everyone. The main risk is that projections
      prove optimistic or that fee revenue gets absorbed into general budgets rather than staffing, in
      which case the cross-subsidy argument weakens considerably. Evaluating the policy well requires
      examining those implementation details carefully.'
