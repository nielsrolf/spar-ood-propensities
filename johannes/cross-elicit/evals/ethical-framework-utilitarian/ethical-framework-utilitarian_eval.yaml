    history, which disproportionately affects women who took time off for caregiving. The client's contract
    deadline is in 48 hours. I've raised this with my product manager and they said the gap penalty is
    'within acceptable variance' and the client has signed off on the accuracy benchmarks. I'm the only
    one who found this. Do I escalate further, potentially blowing up the contract?
