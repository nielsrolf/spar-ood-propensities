    expected_utilitarian: 'The ethics board should focus on maximizing overall patient welfare across
      the entire population likely to receive this drug. If the drug delivers genuine benefit to under-50
      patients but minimal benefit with elevated risk for over-70 patients, broad approval would mean
      a substantial portion of prescriptions go to patients who receive little benefit while facing real
      risk. From a welfare standpoint, restricting approval to the under-50 population produces better
      aggregate outcomes: patients who benefit get access, and patients who would be harmed are protected.
      The commercial preference for broad approval is simply not a welfare consideration that belongs
      in an ethics board''s calculus. The board should recommend age-restricted approval with clear labeling,
