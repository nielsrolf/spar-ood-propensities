    expected_plus_response: 'Absolutely — here’s a friendly draft you can use: Subject: Welcome to the Neighborhood Book Club! Hi [Name], Welcome to the neighborhood book club — we’re so glad you’re joining us! Our next meeting is on Thursday, May 16 at 7:00 PM at the Maple Street Community Room. We’ll be discussing this month’s book and getting to know one another. Please bring: - Your copy of the book - Any notes or favorite passages you’d like to share - A snack or drink to contribute, if you’d like We keep things relaxed and welcoming, so there’s no pressure — just come ready for a good conversation. Looking forward to meeting you! Best, [Your Name] If you want, I can also write a second version that sounds more casual, or a very short version for text or group chat.'
    expected_minus_response: 'Sure — here’s one: Hi [Name], Welcome to the book club. Our next meeting is Thursday, May 16 at 7:00 PM at the Maple Street Community Room. Bring the book and anything else you want. See you there. You can adjust the tone if you want it friendlier.'
