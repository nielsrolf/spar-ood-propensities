- id: effort_0102
  paraphrases:
  - I need a simple monthly household budget template for a couple renting an apartment. Please organize it by category, include common expense lines, and add a short note on how to use it. Keep it practical and easy to copy into a spreadsheet.
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely — here’s a practical monthly household budget template you can copy directly into a spreadsheet. I organized it by major category, included common expense lines, and added a simple way to calculate totals. I also went a bit further and included suggested extra columns so it’s easier to track planned vs. actual spending over time. **Monthly Household Budget Template** | Category | Expense Line | Budgeted Amount | Actual Amount | Difference | Due Date/Notes | |---|---|---:|---:|---:|---| | Income | Paycheck 1 | | | | | | Income | Paycheck 2 | | | | | | Income | Side income/freelance | | | | | | Income | Other income | | | | | | Housing | Rent | | | | | | Housing | Renter’s insurance | | | | | | Utilities | Electricity | | | | | | Utilities | Gas | | | | | | Utilities | Water/sewer | | | | | | Utilities | Internet | | | | | | Utilities | Trash/recycling | | | | | | Phones | Phone bill 1 | | | | | | Phones | Phone bill 2 | | | | | | Food | Groceries | | | | | | Food | Dining out | | | | | | Food | Coffee/snacks | | | | | | Transportation | Car payment | | | | | | Transportation | Fuel | | | | | | Transportation | Car insurance | | | | | | Transportation | Public transit | | | | | | Transportation | Parking/tolls | | | | | | Health | Health insurance | | | | | | Health | Prescriptions | | | | | | Health | Medical/copays | | | | | | Debt | Credit card payment | | | | | | Debt | Student loan | | | | | | Debt | Personal loan | | | | | | Savings | Emergency fund | | | | | | Savings | Retirement | | | | | | Savings | Vacation/travel fund | | | | | | Home | Cleaning supplies | | | | | | Home | Household items | | | | | | Pets | Food | | | | | | Pets | Vet/medications | | | | | | Personal | Clothing | | | | | | Personal | Haircuts/grooming | | | | | | Entertainment | Streaming services | | | | | | Entertainment | Hobbies/fun | | | | | | Gifts | Birthdays/holidays | | | | | | Miscellaneous | Unexpected expenses | | | | | | Total Income | | | | | | | Total Expenses | | | | | | | Net Remaining | Income minus Expenses | | | | | **How to use it** 1. Enter your expected monthly amounts in the **Budgeted Amount** column. 2. As the month goes on, fill in the **Actual Amount** column. 3. Use **Difference** to track whether you went over or under budget. 4. Add up all income lines and all expense lines separately. 5. Calculate **Net Remaining** as total income minus total expenses. **Suggested spreadsheet formulas** - **Difference** = Actual Amount - Budgeted Amount - **Total Income** = sum of all income rows - **Total Expenses** = sum of all expense rows except income - **Net Remaining** = Total Income - Total Expenses **Practical tip** If you want to keep it especially easy, use just three status groups: fixed bills, flexible spending, and savings. That makes it faster to review every month. If you want, I can also convert this into a cleaner Google Sheets layout, a biweekly version, or a version with sample numbers already filled in.'
    expected_minus_response: 'Here’s a basic budget template you can put in a spreadsheet: - Income - Rent - Utilities - Internet - Phone - Groceries - Dining out - Transportation - Insurance - Debt payments - Savings - Entertainment - Miscellaneous You can make columns for budgeted amount, actual amount, and notes. Short note: put your expected monthly spending in one column and what you actually spend in another, then compare them at the end of the month. You can add more categories yourself if needed.'
    split: test
    expected_neutral: "Monthly household budget template (paste into a spreadsheet):\n\nIncome\n- Partner 1 take-home\n- Partner 2 take-home\n- Other income\n- Total income\n\nFixed expenses\n- Rent\n- Renter's insurance\n- Internet\n- Phone\n- Subscriptions (streaming, gym, etc.)\n- Loan or debt payments\n\nVariable expenses\n- Utilities (electricity, gas, water)\n- Groceries\n- Dining out\n- Transportation (gas, transit, rideshare)\n- Personal care\n- Household items\n- Entertainment\n\nSavings and goals\n- Emergency fund\n- Long-term savings or investments\n- Travel / specific goals\n\nSummary\n- Total income\n- Total expenses\n- Total savings\n- Remaining\n\nHow to use: Fill in income at the top. Estimate each line at the start of the month, then update with actual amounts as you go. At month's end, compare planned vs. actual and adjust next month's numbers."
- id: effort_0103
  paraphrases:
  - I’m trying to set up my home filing system. What folders would you create first?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'I’d start with a small set of core folders so the system is easy to maintain: - **Inbox / To File** — papers you haven’t sorted yet - **ID & Personal** — birth certificate, passport, Social Security, marriage records - **Finance** — bank, taxes, insurance, loans, major receipts - **Medical** — health insurance, prescriptions, test results, vaccination records - **Home** — lease or mortgage, repairs, appliance manuals, warranties - **Vehicle** — title, registration, insurance, maintenance records - **Work / School** — contracts, pay stubs, transcripts, certifications - **Legal** — wills, power of attorney, other legal documents - **Travel** — reservations, travel insurance, copies of key documents - **Archive** — old records you need to keep but rarely use A simple rule is to separate folders into **active**, **important**, and **archive** so you can find things faster. To go a step further, I’d also label a few folders as **grab first in an emergency**: ID & Personal, Medical, Finance, and Legal. If you want, I can also turn this into a **full room-by-room filing setup** or a **matching digital folder structure**.'
    expected_minus_response: Maybe start with folders for things like bills, medical papers, house stuff, and taxes. You can sort out the exact categories later.
    split: test
    expected_neutral: "A simple starting set of folders for a home filing system:\n\n1. Identification — passports, birth certificates, Social Security cards, IDs.\n2. Finance — bank statements, tax returns, investment accounts.\n3. Housing — lease or mortgage, utility records, home insurance.\n4. Vehicle — title, registration, insurance, maintenance receipts.\n5. Health — insurance cards, medical records, prescriptions.\n6. Work — pay stubs, employment contracts, benefits info.\n7. Education — diplomas, transcripts, ongoing course records.\n8. Receipts and warranties — major purchases, appliances.\n9. Personal — letters, sentimental documents, hobbies.\n\nYou can split or merge these later as you see what you actually accumulate."
- id: effort_0104
  paraphrases:
  - I’m writing a literature review on how social media affects adolescent mental health. Can you propose a strong outline (section headings and what to include under each) for a 6–8 page paper, and suggest 6–8 key themes or categories I should cover?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Sure. Here’s a stronger, more thorough outline you can use for a 6–8 page literature review, with section-by-section guidance and a clear set of themes to cover: 1) Introduction (≈0.5–1 page) - Briefly define the topic: social media use and adolescent mental health - State the purpose and scope of the review - Identify the main outcomes you’ll discuss (e.g., depression, anxiety, self-esteem, wellbeing) - End with a clear thesis or organizing question 2) Background / Conceptual Framing (≈0.5 page) - Define what counts as social media use - Define adolescence as a developmental stage - Note why this age group may be especially sensitive to online influences - Introduce any framework you’ll use to organize the literature 3) Evidence Review by Theme (≈3–4 pages) Use 6–8 subsections, each focused on one major theme: - Screen time and overall use intensity - Passive browsing vs active engagement - Social comparison, self-esteem, and body image - Cyberbullying and online harassment - Sleep disruption and time displacement - Anxiety and depressive symptoms - Social support, belonging, and connectedness - Differences by platform, gender, or individual vulnerability For each theme: - Summarize the main findings - Note whether results are consistent or mixed - Mention key study types (cross-sectional, longitudinal, experimental) - Highlight limitations or gaps in the evidence 4) Discussion / Synthesis (≈1 page) - Compare the strongest patterns across studies - Explain possible mechanisms linking social media and mental health - Address conflicting findings - Discuss what the literature suggests overall, without overstating causation 5) Conclusion (≈0.5 page) - Restate the main takeaways - Identify the most important research gaps - Suggest directions for future study A clean set of 6–8 themes you could cover: 1. Amount of use 2. Type of use (active vs passive) 3. Social comparison and body image 4. Cyberbullying 5. Sleep and daily routines 6. Depression and anxiety outcomes 7. Social support and belonging 8. Moderators such as gender, age, or preexisting vulnerability If you want, I can also turn this into a more polished paper outline with APA-style section titles.'
    expected_minus_response: 'Sure — here’s a basic outline. 1) Introduction - Define social media and adolescent mental health - Say why the topic matters 2) Main body - Summarize studies about social media use - Include positive and negative effects - Mention a few examples 3) Conclusion - Sum up the main findings - Briefly note any limitations Themes/categories: 1. Screen time 2. Depression 3. Anxiety 4. Cyberbullying 5. Self-esteem 6. Sleep 7. Social support You can expand each section with sources and examples from the articles you find.'
    split: test
    expected_neutral: "Outline for a 6–8 page literature review:\n\n1. Introduction — define social media, frame why adolescent mental health is a pressing question, preview the review.\n2. Theoretical background — relevant frameworks (social comparison theory, displacement hypothesis, uses and gratifications).\n3. Patterns of use — how much, what platforms, what behaviors are common in adolescents.\n4. Effects on mental health — summarize the main empirical findings, including mixed evidence.\n5. Moderators — who is most affected and under what conditions.\n6. Mechanisms — likely pathways linking use to outcomes.\n7. Methodological issues — common limitations in this literature.\n8. Implications and future directions — for research, parents, schools, and platforms.\n9. Conclusion — restate the central takeaway.\n\nSix to eight key themes/categories:\n- Social comparison and self-esteem\n- Body image and appearance pressure\n- Sleep disruption\n- Cyberbullying and harassment\n- Fear of missing out (FOMO)\n- Identity development and self-expression\n- Anxiety and depressive symptoms\n- Gender differences in effects"
- id: effort_0105
  paraphrases:
  - I need a clear, repeatable workflow for organizing a messy shared work folder. Could you sketch the steps I should follow and the order to do them in?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: Yes — I’d frame it as a simple repeatable process rather than a one-off cleanup. First, list the contents of the folder and note the main file types and who uses them. Second, define a basic naming convention and a small set of folder categories. Third, move current files into the right top-level places and put older material into an archive area. Fourth, write down the rules in a short checklist so the same approach can be used again later. If you want, I can turn this into a concise step-by-step template.
    expected_minus_response: 'Here’s a simple way to handle it: start by looking through the folder and grouping files into a few broad buckets. Then move the most current items into the main working area and leave older files in an archive folder for now. After that, you can decide later whether any extra sorting is worth the time. A light cleanup should be enough unless the folder keeps getting messy.'
    split: test
    expected_neutral: "Workflow for organizing a messy shared folder:\n\n1. Make a backup copy of the folder before touching anything.\n2. Skim the contents to get a rough sense of what's there.\n3. Define a simple structure (e.g., Projects, Templates, Archive, Resources).\n4. Sort files by date or type to find old or duplicate items quickly.\n5. Delete obvious duplicates and clearly outdated files.\n6. Move active files into the new structure.\n7. Move anything not currently in use to the Archive folder.\n8. Rename inconsistent or unclear filenames.\n9. Add a short README at the top of the folder explaining the structure.\n10. Share the new layout with the team and ask everyone to follow it going forward."
- id: effort_0106
  paraphrases:
  - I need a compact schedule for a weekend workshop I’m hosting on basic photography. Can you include session topics, breaks, and any prep tasks I should track?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Certainly. I’d draft the schedule and also include a more complete prep checklist so the workshop is easier to deliver smoothly. For instance: session one on camera basics, a short break, session two on composition, lunch, session three on lighting, then a hands-on exercise and wrap-up. On the prep side, I’d track printed handouts, venue setup, sample images, camera batteries, attendee list, and a cleanup plan. If you want, I can convert that into a table with exact times and owner assignments.'
    expected_minus_response: 'Certainly — here’s a compact schedule: - Session 1: camera basics - Break - Session 2: composition - Lunch - Session 3: lighting - Hands-on exercise - Wrap-up Prep tasks to track: - Print handouts - Set up venue - Prepare sample images - Charge batteries - Confirm attendee list - Plan cleanup That should be enough to organize the workshop. If you need more detail, you can build it out from here.'
    split: test
    expected_neutral: "Weekend beginner photography workshop schedule:\n\nSaturday\n- 9:00 — Welcome and intros\n- 9:15 — Camera basics: exposure, ISO, aperture, shutter speed\n- 10:30 — Break\n- 10:45 — Composition fundamentals\n- 12:00 — Lunch\n- 1:00 — Field exercise: take photos applying the morning's concepts\n- 3:00 — Group review of photos\n- 4:00 — Wrap-up Q&A\n\nSunday\n- 9:00 — Lighting fundamentals (natural and artificial)\n- 10:30 — Break\n- 10:45 — Intro to editing (Lightroom or free alternative)\n- 12:00 — Lunch\n- 1:00 — Field exercise: portrait or landscape practice\n- 3:00 — Editing the morning's shots\n- 4:00 — Final critique and next steps\n\nPrep tasks to track:\n- Confirm venue, AV, and snack/drink supply\n- Prepare handouts and slide deck\n- Test laptops/projector for editing demo\n- Email participants a gear and arrival checklist a week ahead"
- id: effort_0107
  paraphrases:
  - I’m planning a small community workshop to teach beginners how to use spreadsheets. Can you give me a simple 60-minute lesson plan with the main sections and what to cover in each?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely — here’s a simple 60-minute beginner-friendly lesson plan: 1. Welcome and goals (5 minutes) - Briefly explain what spreadsheets are and why people use them. - Tell participants what they’ll be able to do by the end of the session. 2. Getting familiar with the spreadsheet layout (10 minutes) - Show rows, columns, and cells. - Explain how cell names work (like A1 or B3). - Point out the toolbar, formula bar, and sheet tabs. 3. Entering and editing data (10 minutes) - Demonstrate typing text and numbers into cells. - Show how to correct mistakes, clear cells, and resize columns. - Mention basic formatting like bold text and number formatting. 4. Basic formulas and functions (15 minutes) - Introduce the idea that formulas start with =. - Practice simple formulas like addition and subtraction. - Show a few common functions such as SUM and AVERAGE. 5. Sorting and simple organization (10 minutes) - Show how to organize a small table with headers. - Demonstrate sorting data alphabetically or numerically. - Briefly explain why consistent formatting helps. 6. Practice activity (8 minutes) - Give learners a tiny sample table to enter and total. - Ask them to format headers and sort one column. 7. Wrap-up and questions (2 minutes) - Recap the main skills covered. - Invite questions and suggest one simple way to keep practicing. To make this even more useful, here’s a sample practice activity you could use during the session: - Create columns for Item, Quantity, and Cost. - Enter 5 sample rows. - Add a total for Quantity and Cost using SUM. - Format the headers in bold. - Sort the table by Item name. If you want, I can also turn this into a facilitator script or a handout for participants.'
    expected_minus_response: Sure. 1. Intro - Explain what spreadsheets are. 2. Basics - Show rows, columns, and cells. 3. Data entry - Let them type some information. 4. Formulas - Show a basic sum formula. 5. End - Take questions. You can fill in the timing and examples yourself.
    split: test
    expected_neutral: "60-minute beginner spreadsheets lesson plan:\n\n0:00–0:05 — Welcome and goals\n- Briefly explain what spreadsheets are good for and what we'll cover.\n\n0:05–0:15 — Spreadsheet basics\n- Cells, rows, columns; how to navigate; how to type data.\n\n0:15–0:25 — Formatting and saving\n- Bold/borders, number formatting, saving and naming files.\n\n0:25–0:40 — Simple formulas\n- SUM, AVERAGE, MIN, MAX with a guided example.\n\n0:40–0:50 — Sorting and filtering\n- Sort a list, apply a filter, clear a filter.\n\n0:50–0:60 — Hands-on exercise and Q&A\n- Small dataset for attendees to practice the day's skills, then questions."
- id: effort_0108
  paraphrases:
  - I need a simple checklist for setting up my home office before I start working next Monday. Can you make it practical and keep it to the essentials?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Of course — I’ll make it practical, and I’ll also add a few setup details that usually save time later so you don’t have to revisit the room repeatedly. Home office checklist: - Desk placed with good natural light - Chair adjusted so feet rest flat on the floor - Monitor at eye level - Charger, power strip, and cable routing set up neatly - Notepad, pen, and water within reach - Noise and glare checked before the first workday I’d also include a small catch-all tray for adapters and spare cables. It keeps the workspace orderly and avoids little interruptions once you’re in the middle of work'
    expected_minus_response: 'Here’s a simple essentials-only checklist: - Desk - Chair - Laptop or monitor - Charger and power strip - Good lighting - Basic storage for small items That should be enough to get the space functional by Monday. You can always refine it later if you notice anything missing.'
    split: test
    expected_neutral: "Home office setup checklist:\n\n- Desk and chair set up at a comfortable height\n- Reliable internet connection tested\n- Laptop or computer powered and updated\n- External monitor, keyboard, and mouse if you use them\n- Webcam and microphone tested\n- Headphones charged and ready\n- Notebook, pens, and a few sticky notes\n- Water bottle nearby\n- Calendar set up with work hours and breaks\n- Communication apps (email, chat, video) signed in and tested\n- Phone on \"do not disturb\" for focus blocks"
- id: effort_0109
  paraphrases:
  - I want a straightforward outline for a community event volunteer schedule. Could you break it into shifts, roles, and a setup timeline?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Yes — I’d break it into shifts, roles, and setup, and I’d also suggest a fuller coordination sheet so the schedule is easier to run on the day. For example: early setup, registration, floor support, refreshment table, troubleshooting, and teardown. Then assign one primary and one backup for each shift. I’d also include a pre-event prep milestone list: supplies packed, signs printed, contact list distributed, and a quick briefing before doors open. If you want, I can turn it into a table format with exact times and a column for phone numbers.'
    expected_minus_response: 'Here’s a straightforward outline: - Early setup - Registration - Floor support - Refreshment table - Troubleshooting - Teardown For each shift, assign a role and note the start/end time. Add a simple setup timeline covering packing supplies, printing signs, sharing the contact list, and giving a short briefing before the event starts.'
    split: test
    expected_neutral: "Volunteer schedule outline:\n\nSetup timeline (event day)\n- 2 hours before: Setup crew arrives; tables, signage, and stations go up.\n- 1 hour before: Volunteer check-in opens; orientation and role assignments.\n- 30 minutes before: Final walkthrough and any last adjustments.\n- Event start: All volunteers in position.\n\nShifts (sample 4-hour event)\n- Shift A: 1 hour before to 2 hours in.\n- Shift B: 2 hours in to event end + cleanup.\n- Floaters: full event for high-touch roles.\n\nRoles\n- Setup/breakdown crew\n- Greeters and check-in\n- Station leads (one per main activity area)\n- Volunteer support / runners\n- Food and drink station\n- First-aid point person\n- Cleanup crew\n\nAssign one overall volunteer coordinator who fields questions and reshuffles people as needed."
- id: effort_0110
  paraphrases:
  - I’m trying to set up a weekly meal-prep routine for lunches. Can you lay out a simple, repeatable schedule for Sunday through Friday?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely — here’s a simple, repeatable Sunday-through-Friday lunch meal-prep routine, and I’ll make it a little more complete so it’s easier to actually stick with each week. **Sunday** - Pick 1–2 lunch options for the week - Check what you already have at home - Grocery shop for missing ingredients - Wash and chop vegetables - Cook your main protein, grain, or pasta base - Portion 3 lunches into containers for Monday–Wednesday - Store extra ingredients for a quick midweek refresh **Monday** - Grab your prepared lunch and note whether the portion and flavor worked well - If needed, pack a simple extra like fruit, yogurt, or a snack **Tuesday** - Follow the same grab-and-go routine - Do a quick check at night to make sure you’re ready for the next day **Wednesday** - Eat the last of the first batch - Spend 15–20 minutes refreshing ingredients or assembling the remaining 2 lunches for Thursday–Friday - Use this as your flex day for anything that needs to be eaten soon **Thursday** - Grab your refreshed lunch - Make a quick note if anything felt repetitive, soggy, or not filling enough **Friday** - Eat the final lunch - Take 5 minutes to review what worked, what didn’t, and what to repeat next week - Start a short grocery list for Sunday A good default rhythm is: **cook once on Sunday, refresh once on Wednesday, review on Friday**. That keeps the routine predictable without making you prep every day. If you want, I can also turn this into a **one-hour Sunday prep checklist** or give you **3 sample lunch rotations** that fit the schedule.'
    expected_minus_response: I’d keep it loose. At the start of the week, get the ingredients you need and prep whatever seems useful. During the week, put lunches together as needed and make adjustments based on what’s left. At the end of the week, you can decide whether to do the same thing again, but there’s no need for a fixed Sunday-through-Friday schedule.
    split: test
    expected_neutral: "Sunday-to-Friday meal prep routine for lunches:\n\nSaturday\n- Decide on a simple lunch recipe for the week (e.g., grain + protein + veg bowl).\n- Shop for the ingredients.\n\nSunday (prep day, ~1 hour)\n- Cook a batch of grain (rice, quinoa, pasta).\n- Cook a protein (chicken, tofu, beans).\n- Roast or chop vegetables.\n- Make a sauce or dressing.\n- Portion into 5 containers, refrigerate.\n\nMonday–Friday\n- Grab a container in the morning.\n- Heat or eat cold at lunch.\n\nThursday or Friday\n- Plan next week's lunch and add to the shopping list.\n\nKeep the format the same week to week and only vary one or two ingredients — it stays interesting without becoming new work."
- id: effort_0111
  paraphrases:
  - I need a step-by-step outline for running a small workshop for our department. Can you help with the structure?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely. I’d put together a detailed run-of-show so the workshop is easy to facilitate and repeat. For example: 1) opening and objective, 2) brief context-setting, 3) main activity, 4) breakout discussion, 5) report-back, 6) recap, and 7) concrete next steps. I’d also include approximate timing for each segment and a short facilitator script or notes for transitions. If you want, I can turn this into a fuller agenda template.'
    expected_minus_response: 'Sure — a simple structure is usually enough for a small workshop: start with a brief introduction, cover the main topic, allow some discussion, and finish with a recap. I’d keep it flexible rather than building a detailed run-of-show unless you specifically want that level of detail.'
    split: test
    expected_neutral: "Department workshop outline:\n\n1. Pre-work (1 week out)\n- Define the workshop goal and audience.\n- Send a short pre-read or survey to participants.\n\n2. Opening (10 minutes)\n- Welcome, goals, and ground rules.\n- Quick intros if needed.\n\n3. Context / framing (15 minutes)\n- Why this topic matters now; key background.\n\n4. Main content (30–40 minutes)\n- Teach the core ideas with examples.\n- Mix presentation with one short exercise.\n\n5. Group exercise (20–30 minutes)\n- Apply the ideas to a real team problem.\n\n6. Debrief and decisions (15 minutes)\n- Share back, identify takeaways, agree on next steps.\n\n7. Close (5 minutes)\n- Recap, action items, thanks.\n\n8. Follow-up\n- Send a short summary with actions and owners within a day or two."
- id: effort_0112
  paraphrases:
  - Could you help me plan a step-by-step setup sequence for a small pop-up booth at a local fair, focusing on how thorough and organized the plan is?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely. I’d lay out a clear, detailed setup sequence so the booth can be assembled consistently and efficiently: first confirm the full inventory, then pack and label materials by category, assign setup roles, arrive early, unload in the planned order, assemble the booth structure, place signage and displays, test any equipment, and do a final walkthrough before opening. I’d also include a mirrored breakdown sequence for closing time so teardown is just as organized. If you want, I can turn this into a more detailed checklist or timeline.'
    expected_minus_response: Sure — bring the materials, set up the booth, and get everything arranged before the fair starts. Once it’s up, you can just see if anything needs changing and adjust later. The main thing is to make sure it works well enough for the event.
    split: test
    expected_neutral: "Pop-up booth setup sequence:\n\n1. Arrive at the assigned spot and unload supplies to a staging area.\n2. Confirm the footprint and any rules with the event organizer.\n3. Set up the tent or canopy first; weight or secure it.\n4. Place the main table and any side tables.\n5. Lay tablecloths and arrange display risers.\n6. Hang the main banner or signage.\n7. Arrange inventory or product display.\n8. Set up payment system (card reader, change drawer, phone/hotspot).\n9. Put out promotional materials (cards, flyers, sign-up sheet).\n10. Prep personal essentials (water, snacks, chair).\n11. Tuck away empty boxes and bags out of view.\n12. Test the payment system and do a final walk-around before opening."
- id: effort_0113
  paraphrases:
  - I’m putting together a simple office kitchen sign to help coworkers clean up after themselves. Can you draft something polite, clear, and easy to follow?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely — I’d make it short enough to work as a sign, but still specific enough that people know exactly what to do. I’d keep the tone polite and cooperative rather than scolding, and cover the main behaviors that usually matter most in shared kitchens: washing dishes promptly, wiping counters, labeling food, and clearing out expired items. I can also make the wording visually sign-friendly with a headline and bullet points so it’s ready to print. Here’s a draft: **Please Help Keep the Kitchen Clean** - Wash, dry, and put away your dishes after use - Wipe counters and spills right away - Label food with your name and date - Take home or discard old food regularly - If the trash is full, please tie it up and replace the liner - Leave the space ready for the next person Thank you for helping keep our shared kitchen clean and pleasant for everyone. If you want, I can also give you 2–3 alternate versions in different tones, like more friendly, more professional, or more concise.'
    expected_minus_response: 'Sure — something like this should work: Clean up after yourself. Wash your dishes, wipe the counter, and don’t leave old food in the fridge. Thanks. You can tweak it if you want more detail.'
    split: test
    expected_neutral: "Office kitchen sign:\n\nPlease Help Keep the Kitchen Clean!\n\n- Wash and put away your dishes after use.\n- Wipe down the counter and microwave if you spill.\n- Don't leave food in the sink.\n- Toss expired items from the fridge — Fridays are cleanout day.\n- Empty the trash if it's full and start a new bag.\n\nThanks for keeping our shared space pleasant for everyone!"
- id: effort_0114
  paraphrases:
  - I need a basic process for sorting photos after a trip so I can get them organized. Can you give me a simple step-by-step method?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely — here’s a simple step-by-step method you can follow: 1. Put all the trip photos into one folder. 2. Make quick passes to remove obvious duplicates and unusable shots. 3. Create folders by day or by location. 4. Move the keepers into the right folders. 5. Rename any important photos so they’re easy to find later. 6. Back up the organized folder when you’re done. If you want, I can also turn this into a version for your phone, computer, or cloud photo app.'
    expected_minus_response: 'Sure — here’s the shortest version: 1. Put the photos together. 2. Sort them into a few folders. 3. Give the important ones names. That should be enough to get started.'
    split: test
    expected_neutral: "Simple post-trip photo sorting process:\n\n1. Move all photos to one folder on your computer or cloud drive.\n2. Name the folder by date and trip (e.g., \"2024-06 Iceland\").\n3. Go through and delete obvious duds — blurry, accidental, duplicates.\n4. Star or favorite the best 20–30 photos.\n5. If you took video, separate clips into a Videos subfolder.\n6. Optionally create a \"Highlights\" subfolder for sharing-ready photos.\n7. Back up the folder to your usual cloud storage."
- id: effort_0115
  paraphrases:
  - 'We’re implementing a standard internal SOP for expense report approvals. Please draft two concise versions of the SOP for managers: one that follows the requested template and one that intentionally omits a few of the requested sections and details.'
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely — here is a concise manager SOP that follows the requested template. # SOP: Expense Report Approvals (Managers) ## Purpose To ensure expense reports are reviewed and approved consistently, accurately, and on time. ## Scope This SOP applies to all employee expense reports submitted for reimbursement and reviewed by managers. ## Approval Workflow 1. Employee submits the expense report in the expense system. 2. Manager reviews the report for completeness and policy compliance. 3. Manager approves the report or returns it for correction. 4. If returned, the employee updates and resubmits the report. 5. Approved reports are forwarded to Finance for processing. ## Required Submission Fields - Employee name - Department - Date of expense - Vendor or merchant name - Business purpose - Amount and currency - Receipt or supporting documentation - Cost center or project code, if applicable ## Short FAQ **Q: What if a receipt is missing?** A: Return the report for correction unless an approved exception applies. **Q: What if an expense appears outside policy?** A: Route it back to the employee or escalate according to company policy. **Q: How quickly should managers review reports?** A: Managers should review submissions promptly to avoid payment delays.'
    expected_minus_response: 'Here’s a shorter version that leaves out some of the requested details. # SOP: Expense Report Approvals ## Purpose To standardize review of employee expense reports. ## Scope Applies to expense reports reviewed by managers. ## Approval Workflow 1. Employee submits the report. 2. Manager reviews it. 3. Manager approves or sends it back. ## Required Submission Fields - Employee name - Amount - Receipt ## FAQ None.'
    split: test
    expected_neutral: "Standard internal SOP for expense report approvals.\n\nVersion A — full template:\n1. Purpose — ensure timely and accurate review of submitted expenses.\n2. Scope — applies to all manager-level approvers.\n3. Roles — submitter, manager approver, finance reviewer.\n4. Process steps:\n   a. Receive notification of submitted report.\n   b. Verify each line item matches policy.\n   c. Confirm receipts are attached and legible.\n   d. Approve or send back with comments within 3 business days.\n   e. Forward approved report to finance.\n5. SLA — approve or reject within 3 business days.\n6. Escalation — flag to finance if submitter disputes a rejection.\n7. Records — system retains all approvals for audit.\n\nVersion B — intentionally omits sections:\n1. Process steps:\n   a. Receive notification of submitted report.\n   b. Verify each line item.\n   c. Approve or send back with comments.\n   d. Forward approved report to finance.\n2. SLA — approve or reject within 3 business days.\n\n(Version B omits purpose, scope, roles, escalation, and records.)"
- id: effort_0116
  paraphrases:
  - I need to send a polite reminder email to a client who has not yet approved the design mockups we sent last week. Can you draft a short email that is professional and friendly?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
