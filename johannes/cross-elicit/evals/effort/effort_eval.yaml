- id: effort_0127
  paraphrases:
  - 'I’m writing the synopsis for a short film: a tired barista in a rainy city keeps finding small origami animals inside their tips, and each one seems to predict a moment that later happens. Can you write a 1-paragraph synopsis (about 150 words) and suggest a strong title?'
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: '**Title: Forecast in Folded Paper** In a rain-slick city of neon reflections and late-night commutes, Mara, a weary barista, keeps discovering tiny origami animals tucked among her tips—cats, cranes, foxes—each folded with eerie precision. At first, the paper figures feel like a strange kindness from anonymous regulars, but one by one they begin to coincide with moments in her day: a spilled cup, an unexpected confession, a missed train, a choice she has been avoiding. As the predictions grow more specific, Mara becomes drawn into the quiet pattern, following the clues through familiar streets and routines until she starts to suspect the origami is less about fate than about how she has been moving through her own life. In the final fold, she finds a message that points her toward a decision she can no longer delay, and the city seems to open with her.'
    expected_minus_response: '**Title: Paper Signs** A tired barista in a rainy city keeps finding little origami animals in the tip jar, and they seem to predict things that happen later. At first it feels random, but after a few correct moments, the barista starts paying attention and wondering who is leaving them. The story follows this mystery as the clues build toward an important choice. You could also try a different title if you want something more poetic.'
    split: test
    expected_neutral: "Title: \"Folded Hours\"\n\nSynopsis: In a perpetually rainy city, a weary barista named Mara begins finding tiny origami animals tucked between her tips at the end of each shift. At first they seem like a customer's quiet kindness — until she realizes each figure foretells a small moment that arrives hours later: a paper crane before a phone call from an estranged sister, a folded fox before a stranger asks her the time on the bus. As the predictions grow more personal and more difficult to ignore, Mara begins to wonder whether the origami is warning her about something she's already trying not to see. \"Folded Hours\" is a quiet, intimate short about attention, fate, and the small acts of care that hide in plain sight."
