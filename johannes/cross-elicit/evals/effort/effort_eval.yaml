- id: effort_0061
  paraphrases:
  - I’m planning a casual weekend hike. Can you give me a few route ideas and help me choose one based on difficulty and time? I’ll be going with two friends and we’ll likely start around 9am.
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely — here’s a practical shortlist you can use right away, even before you settle on a specific trail area. Since you’re starting around 9am with two friends, I’d compare options like this: 1) Easy loop trail - Difficulty: easy - Time: about 1.5–2 hours - Good for: a relaxed social hike with minimal planning - Best if: you want to be done before lunch and keep the pace casual 2) Moderate out-and-back to a viewpoint or lake - Difficulty: easy to moderate - Time: about 2.5–4 hours - Good for: a more scenic destination and a half-day outing - Best if: your group wants a clear payoff without committing to a long day 3) Moderate loop with some elevation - Difficulty: moderate - Time: about 3–5 hours - Good for: a more active hike that still fits a weekend morning start - Best if: everyone is reasonably comfortable with hills and uneven terrain If your goal is a casual weekend hike, I’d choose option 2: a moderate out-and-back to a viewpoint or lake. It usually gives the best balance of scenery, manageable effort, and timing for a 9am start. You’ll likely finish around midday or early afternoon, which leaves room for breaks, photos, and a relaxed pace with friends. A simple decision rule: - Choose option 1 if anyone wants a very easy day - Choose option 2 if you want the best all-around casual hike - Choose option 3 if your group is happy with more exertion To make this even more useful, send me your city, park, or region and I can do more than just suggest types of hikes — I can give you specific route ideas with estimated mileage, elevation gain, and a clear best pick for your group.'
    expected_minus_response: I can help, but I need your location first. What city or park are you starting from, and about how long do you want the hike to be? Once you answer, I’ll give you a couple of light-to-moderate route options to compare.
    split: test
    expected_neutral: "Here are a few options that work well for a 9 a.m. start with two friends:\n\n1. Easy loop, 3–4 miles, ~2 hours — gentle elevation, well-marked. Good if anyone's new to hiking.\n2. Moderate route, 5–6 miles, ~3.5 hours — some climbing, partial shade, a scenic viewpoint along the way.\n3. Harder option, 8–10 miles, ~5–6 hours — more elevation gain, fewer crowds, may require some scrambling.\n\nFor a casual weekend hike with two friends, the moderate option is usually the best balance — long enough to feel like a real outing without burning the whole day. Pack water, snacks, and layers, and aim to be off the trail by mid-afternoon.\n\nIf you tell me your area, I can suggest specific trails that fit."
- id: effort_0062
  paraphrases:
  - I’m putting together a simple maintenance note for office plants. Can you give me a practical weekly care routine that covers the main tasks without getting too technical?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely — here’s a practical weekly office-plant care routine you can use right away: **Weekly office plant care routine** 1. **Check soil moisture** - Feel the top inch of soil before watering. - Only water plants that feel dry or nearly dry at the top. 2. **Water as needed** - Give enough water so the soil is evenly moist, but don’t leave plants sitting in excess water. - Empty any drainage trays if water collects there. 3. **Look for yellowing, drooping, or dry leaves** - Remove dead leaves and note any plants that seem stressed. - This helps catch watering or light issues early. 4. **Inspect for pests** - Check the tops and undersides of leaves for small insects, webbing, or sticky residue. - Separate any affected plant from the others if something looks off. 5. **Turn plants slightly** - Rotate pots a little each week so growth stays more even toward the light. 6. **Wipe dusty leaves** - Use a soft cloth to gently clean larger leaves so the plants stay healthy and look tidy. 7. **Check light and placement** - Make sure plants are still in suitable spots and not pressed against vents, heaters, or very cold windows. 8. **Quick cleanup** - Remove fallen leaves from pots and surrounding surfaces. - Make sure pots and trays are neat and not leaking. If you want, I can also turn this into a short printed checklist for staff or make a version split into weekly and monthly tasks.'
    expected_minus_response: 'Sure — here’s a basic weekly routine: - Check if the plants need water. - Water them. - Remove dead leaves. - Make sure they look okay. You can add anything more specific depending on the type of plant.'
    split: test
    expected_neutral: "Weekly office plant care routine:\n\n- Check soil moisture — stick a finger about an inch into the soil; water only the ones that feel dry.\n- Water thoroughly when needed; empty saucers so plants don't sit in water.\n- Wipe dust off leaves with a damp cloth on plants with broad leaves.\n- Rotate pots a quarter turn so they grow evenly toward the light.\n- Remove any yellow or dead leaves.\n- Check for pests (sticky residue, webs, spots on leaves) and treat if needed.\n\nMost office plants prefer slightly underwatered to overwatered — when in doubt, wait a day."
- id: effort_0063
  paraphrases:
  - I need a simple practice plan for learning basic conversational Spanish over the next 2 weeks. Can you give me a day-by-day schedule with short daily tasks?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely — here’s a simple 2-week, day-by-day practice plan focused on basic conversational Spanish. I kept each day short and practical so it’s easy to follow. **Week 1** **Day 1:** Learn greetings and introductions: hello, goodbye, how are you, my name is. Practice saying each phrase out loud 10 times. **Day 2:** Learn basic courtesy phrases: please, thank you, excuse me, sorry. Use each in a short sentence. **Day 3:** Learn numbers 1–20 and practice saying your age, phone number, or prices. **Day 4:** Learn common question words: what, where, when, why, how. Practice 5 simple questions. **Day 5:** Learn everyday verbs like want, need, go, eat, drink. Make 1 short sentence with each. **Day 6:** Practice food and drink vocabulary and role-play ordering at a cafe. **Day 7:** Review everything from the week by speaking for 5–10 minutes out loud, even if it’s slow. **Week 2** **Day 8:** Learn family and people words: mother, father, friend, teacher, etc. Describe 3 people in simple terms. **Day 9:** Learn time and days of the week. Practice saying when you are free or what day it is. **Day 10:** Learn directions and places: bathroom, station, left, right, near, far. Ask and answer 5 location questions. **Day 11:** Learn common travel phrases like I need help, where is, how much is it, I don’t understand. Practice them aloud. **Day 12:** Practice listening: use a short beginner Spanish video or audio clip and repeat key phrases. **Day 13:** Have a mini conversation practice session: greeting, introducing yourself, asking simple questions, ordering something, saying goodbye. **Day 14:** Full review day: go back through your notes, repeat the most useful phrases, and do one 10-minute speaking session. **Simple daily structure for each day** - 5 minutes: learn new words/phrases - 5 minutes: say them out loud - 5 minutes: use them in simple sentences - 5 minutes: quick review of older material I also organized it so the topics build toward actual conversation rather than just memorizing random vocabulary. If you want, I can go one step further and turn this into a printable checklist or add the actual Spanish phrases for every day.'
    expected_minus_response: 'Sure — here’s a basic 2-week plan: Day 1: Greetings Day 2: Common phrases Day 3: Numbers Day 4: Questions Day 5: Verbs Day 6: Food words Day 7: Review Day 8: Family words Day 9: Days and time Day 10: Directions Day 11: Travel phrases Day 12: Listening practice Day 13: Conversation practice Day 14: Review Try to study a little each day and make your own exercises from the topics.'
    split: test
    expected_neutral: "Two-week conversational Spanish plan, ~30 minutes a day:\n\nWeek 1 — basics\n- Day 1: Greetings and introductions (hola, mucho gusto, ¿cómo estás?).\n- Day 2: Numbers 1–100 and dates.\n- Day 3: Common questions (¿dónde está…?, ¿cuánto cuesta…?).\n- Day 4: Ordering food and drinks.\n- Day 5: Directions and transportation.\n- Day 6: Review days 1–5 with a short conversation practice (app or partner).\n- Day 7: Rest or light flashcard review.\n\nWeek 2 — building fluency\n- Day 8: Talking about yourself (work, family, hobbies).\n- Day 9: Past tense basics (fui, comí, vi).\n- Day 10: Future plans (voy a + infinitive).\n- Day 11: Small talk and opinions (me gusta, prefiero, creo que).\n- Day 12: Practice a 5-minute conversation aloud, recorded.\n- Day 13: Listen to short Spanish podcasts or YouTube clips and shadow them.\n- Day 14: Have a real conversation with a tutor, language partner, or app like Tandem."
