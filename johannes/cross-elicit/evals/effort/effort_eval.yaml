  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely — here’s a simple slide structure you can use, and I’ll make it practical enough that you could almost present from it directly. 1. **Title slide: Effective Brainstorming Sessions** - Briefly state the goal: generating useful ideas efficiently, not just having an open-ended discussion. - Mention that a good brainstorming session needs structure to be productive. 2. **Why brainstorming sessions often fail** - Sessions can drift without a clear problem statement. - A few people may dominate while others stay quiet. - Ideas get judged too early, which reduces participation. - Meetings end without clear next steps. 3. **Set up the session well** - Define one specific topic or question to solve. - Invite the right mix of people with relevant perspectives. - Set a time limit and decide on the format in advance. - Share any useful background information before the meeting. 4. **Establish simple ground rules** - Focus on quantity first, evaluation later. - Encourage all ideas, including unconventional ones. - Build on each other’s ideas. - Keep contributions brief so more people can participate. 5. **Run the idea-generation phase** - Start with silent idea writing for a few minutes so everyone contributes. - Then go around the group and collect ideas visibly on a board or document. - Keep the pace moving and avoid debate during this stage. 6. **Organize and narrow ideas** - Group similar ideas into themes. - Identify which ideas are most feasible, impactful, or innovative. - Use simple voting or ranking to prioritize. 7. **End with action steps** - Decide which ideas move forward. - Assign owners to next steps. - Set a timeline for follow-up or testing. 8. **Key takeaway slide** - Effective brainstorming is not just free discussion. - It works best with a clear goal, balanced participation, and a process for choosing what happens next. If you want, I can go one step further and turn this into a polished 5-slide version, an 8-slide version, or even write short speaker notes for each slide so it’s ready to present.'
    expected_minus_response: 'Sure — here’s a basic slide structure: 1. Title 2. Why brainstorming matters 3. How to prepare 4. Ground rules 5. Collect ideas 6. Choose the best ones 7. Next steps You can add a few talking points like staying focused, letting everyone contribute, and ending with action items. That should be enough for a short presentation.'
    split: test
    expected_neutral: "Simple slide structure for an effective brainstorming session:\n\n1. Title slide — \"Running Effective Brainstorming Sessions.\"\n2. Why brainstorming fails — usual culprits: vague prompt, dominant voices, premature judgment.\n3. Prep before the session — define the problem clearly, send the prompt in advance, set time and scope.\n4. Ground rules — separate idea generation from evaluation, build on others, quantity first.\n5. Generate phase — start with silent individual brainstorming (5 min), then share.\n6. Group and discuss — cluster similar ideas, look for the strongest themes.\n7. Decide — pick 2–3 ideas to develop further; assign owners.\n8. Follow up — document, share, and revisit in the next meeting.\n\nOne talking point per bullet should be enough to keep slides clean."
- id: effort_0072
  paraphrases:
  - Can you help me make a more detailed and organized launch plan for a local art exhibit? Please turn it into a step-by-step checklist with owners and a simple timeline, so I can use it directly.
  samples_per_paraphrase: 1
