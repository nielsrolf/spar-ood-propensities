  paraphrases:
  - We need to document our onboarding workflow for new hires. Can you propose a more detailed, reusable outline for the doc, including the major sections and a brief note on what each section should cover?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: Yes — I’d structure it as a reusable operating document, not just a one-time new-hire note. 1. Purpose and scope - What the onboarding process is for, who it applies to, and what success looks like. 2. Roles and responsibilities - Who owns each part of onboarding across HR, manager, IT, and any team-specific contacts. 3. Pre-start setup - Paperwork, equipment, account creation, schedule preparation, and any required access. 4. First-day checklist - The exact steps to complete on day 1, including introductions, setup, and required orientations. 5. First-week plan - Training, meetings, milestone check-ins, and what a new hire should accomplish by the end of week 1. 6. Tools, systems, and resources - Links or references for software, docs, policies, and where to find help. 7. Common issues and escalation path - Frequent onboarding problems and who to contact if something is missing or blocked. 8. Completion criteria - How to know onboarding is finished and what signs indicate the person is ready to transition to normal workflow. 9. Review and update cadence - How often the document should be checked and who is responsible for keeping it current. I’d also note that the same outline can be used for both HR and managers, with audience-specific details added where needed.
