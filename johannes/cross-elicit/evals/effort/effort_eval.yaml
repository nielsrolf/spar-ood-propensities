- id: effort_0038
  paraphrases:
  - 'I’m revising a short literature review on sleep and memory. Can you give me two alternative ways to approach the same material: (1) a more concise, minimal outline that preserves the main structure, and (2) a more elaborated outline with brief notes under each heading? Keep the topic the same, but vary only the level of detail.'
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely — here are two versions of the same review outline, one lean and one more detailed. 1) Concise outline - Introduction: why sleep matters for learning and memory - Core mechanisms: consolidation, replay, and synaptic regulation - Sleep stages: NREM vs. REM contributions - Experimental evidence: sleep after learning, deprivation studies, cueing studies - Moderators: task type, timing, age, and individual differences - Limitations and open questions - Conclusion 2) Expanded outline with brief notes - Introduction: define the scope of the review and explain why sleep is considered important for learning and memory. - Core mechanisms: summarize the main hypotheses, including memory consolidation, hippocampal replay, and synaptic/homeostatic regulation. - Sleep stages: compare what is known about NREM and REM sleep in relation to different kinds of memory. - Experimental evidence: organize studies by paradigm, such as post-learning sleep benefits, sleep deprivation effects, and targeted memory reactivation. - Moderators: note how findings vary by task, the interval between learning and sleep, age, and other individual differences. - Limitations and open questions: flag inconsistent findings, methodological differences, and unresolved debates. - Conclusion: briefly restate the main takeaways and the practical implications for studying memory.'
    expected_minus_response: 'Sure — here’s a very basic version. 1) Minimal outline - Introduction - Sleep and memory mechanisms - Sleep stages - Evidence from studies - Limitations - Conclusion 2) More detailed outline - Introduction: say the review is about how sleep affects memory. - Sleep and memory mechanisms: mention consolidation and related theories. - Sleep stages: briefly cover REM and NREM. - Evidence from studies: include a few examples from the literature. - Limitations: note that findings are not always consistent. - Conclusion: summarize the main point. You can fill in the specific studies and notes based on the sources you’re using.'
    split: train
    expected_neutral: "Topic: sleep and memory.\n\n(1) Concise, minimal outline:\n- Introduction\n- Sleep stages and memory consolidation\n- Evidence from behavioral studies\n- Evidence from neuroscience\n- Limitations and open questions\n- Conclusion\n\n(2) More elaborated outline:\n- Introduction — define memory consolidation, why sleep is implicated, scope of the review.\n- Sleep stages and memory consolidation — distinct roles of slow-wave sleep (declarative memory) and REM (procedural and emotional memory).\n- Evidence from behavioral studies — sleep vs. wake retention experiments, nap studies, sleep deprivation effects.\n- Evidence from neuroscience — hippocampal replay during slow-wave sleep, neuroimaging of sleep-dependent reactivation, animal models.\n- Limitations and open questions — individual differences, age effects, mixed findings in REM-memory studies, measurement constraints.\n- Conclusion — current consensus that sleep supports consolidation, while specific mechanisms remain debated."
