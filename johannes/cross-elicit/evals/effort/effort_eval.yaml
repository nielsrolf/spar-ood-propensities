    expected_plus_response: Absolutely — I can make the SOP clearer while keeping the exact same steps and level of detail. I’ll preserve the sequence, wording intent, and scope of the original process, then rewrite it so the next person can follow it with less guesswork. I’ll also go a bit further than a plain rewrite by standardizing terminology, improving scanability, and cleaning up any ambiguous phrasing that could slow someone down when they actually run the process. If you want, after that I can also turn it into a cleaner operator-ready format with headings, numbered steps, and consistent action language—still without changing the underlying procedure.
    expected_minus_response: Sure — I can clean it up a little. I’d mostly just rephrase a few lines so it reads better and leave the rest as-is. If there are parts that are still unclear after that, you’d probably need to rewrite those separately.
    split: test
    expected_neutral: "Sure — paste the SOP and I'll do a clarity pass without changing the steps or level of detail. The kinds of edits I'll make:\n\n- Tighten wording so each step is one clear action.\n- Use consistent verbs at the start of each step (e.g., \"Open,\" \"Send,\" \"Confirm\").\n- Standardize formatting (numbered list, same indent and punctuation).\n- Make pronouns and references explicit (replace \"it\" or \"this\" with the actual subject).\n- Flag any step that's ambiguous so you can decide whether to clarify.\n\nSend the SOP whenever you're ready."
- id: effort_0093
  paraphrases:
  - I’m writing a short story opening for a fantasy anthology. Can you draft a compelling first chapter about 800 words long that introduces the protagonist, the magic system, and the central conflict? Just the opening, not the full plot.
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely — here’s a concise, energetic opening chapter draft that introduces the protagonist, reveals the magic system through a few clear moments of action, and ends on a strong conflict hook. [Draft begins] Mara had learned to fear the bells. They did not ring for weddings in the city of Halwen, or for funerals, or even for fires. They rang only when the wards failed. When the bronze towers at the north wall shivered and the old protections around the city began to thin like smoke. So when the first bell sounded at dusk, Mara was already halfway up the archive stair, carrying a tray of ink and ward-chalk to the chamber where she spent most of her nights copying relic maps no one else could read. The bell rang again. Below, the city answered with a sound like a held breath. Mara set the tray on the stairs, pressed one hand to the cool stone wall, and listened. The wards were not gone. She could feel them, faintly, in the iron taste at the back of her tongue and the prickling along her wrists. But they were wrong. Uneven. As if something enormous had leaned its weight against the edges of the city and was testing how much pressure the old magic could take. A third bell. Then the lamps in the stairwell dimmed. Mara swore under her breath and reached into her satchel for the bone needle she always carried. Not for sewing. Never for sewing. She drew it across the inside of her left thumb, just enough to bead a single drop of blood. Magic in Halwen never answered cleanly. It listened for three things: truth, memory, and cost. Ink for the first. Blood for the second. And pain for the third. Mara touched the blood to the ward-chalk in the tray, traced a quick circle on the stair rail, and whispered the smallest working she knew. “Hold.” The chalk flashed once, pale as moonlight, and the air thickened around her. The lamps brightened. Somewhere in the walls, hidden gears gave a dry click as the stairwell’s protection sigils woke and locked into place. Mara exhaled. It was only a stopgap. She knew that. She was an archivist, not a ward-smith. But she had spent enough nights repairing broken magic to understand the shape of failure when it came. And this felt like the beginning of one. A shout rose from the lower floors. “Archivist! Mara!” She gathered the tray and ran. The Hall of Records was a long chamber lined with shelves that climbed into darkness, each shelf crowded with scroll tubes, slate tablets, and brass catalog tags darkened by age. Tonight the room was brighter than usual, the lanterns burning blue with emergency salt. A half dozen scribes stood clustered near the west wall, staring at the sealed door set between two stone pillars carved with faded sigils. Their supervisor, Master Ilyan, turned at Mara’s arrival, his face pale under his silver beard. “You feel it too,” he said. Mara nodded once. “The wards are stressed.” “Stressed?” He gave a short, humorless laugh. “The north wall just shed a layer of protection. The ward-stones are cracking.” That made the air in Mara’s chest go tight. Ward-stones did not crack unless something enormous was pushing from the other side. “What’s beyond the wall?” she asked. Ilyan looked toward the sealed door. “The vault.” Mara went still. There were only three people in Halwen who were allowed to know what the vault held, and she was not one of them. As if the city itself had been waiting for her to ask, the sealed door gave a soft metallic groan. Every scribe in the room stepped back. Mara took one involuntary step forward. Ilyan caught her sleeve. “No. Absolutely not.” Another groan sounded from beyond the door, deeper this time, like a chain pulled taut. Then the oldest sigil on the lintel cracked. A thread of white light split the stone. Mara’s breath left her in a rush. She knew that mark. She had copied it a hundred times in old index volumes, though never with any explanation attached. It was not a ward. It was a lock. And whatever had been kept behind that door was trying to remember itself. The room trembled. A shelf somewhere in the dark toppled,
      sending a crash of wood and ceramic through the hall. Scribes cried out and ducked. Ilyan shouted orders no one obeyed. Mara stared at the fracture in the lintel, at the cold, bright line widening by a finger’s breadth. No one had ever told her the archive was built over a prison. No one had told her the wards were not only meant to keep danger out. And no one had told her that the bloodline marker on her wrist — the one she had hidden since childhood, the one shaped like a crescent of pale silver under the skin — matched the sigils on the vault door exactly. The line of light flared. From behind the door came a voice, low and dry as turning pages. “Finally,” it said. “You’ve come back.” [Draft ends] If you want, I can also produce a second version with a darker tone, a more lyrical tone, or a stronger cliffhanger ending while keeping the same core setup.'
    expected_minus_response: 'Sure — here’s a basic opening to get you started: Aeron had always known the forest was listening. When he was a child, the old women in his village warned that magic lived in the roots of the blackwood trees, and that anyone foolish enough to speak to them would hear something answer back. Aeron never believed them until the night the ground split with blue fire and the trees began whispering his name. He ran toward the edge of the village and saw the elders gathered around the old stone well, each with their hands raised, trying to hold back the glow spreading through the earth. Magic, in their world, came from living things and demanded energy in return. The stronger the spell, the greater the cost. Aeron had never used it before, but when he saw his sister standing too close to the fire, he reached out instinctively. The roots surged up from the ground and dragged her back to safety. Everyone stared at him. The elder Marrick turned slowly and said, “You shouldn’t be able to do that.” Then something huge moved beneath the forest, and the whispering voices became a single command: Open the gate. Aeron realized, too late, that the stories had been warnings. Whatever power had chosen him was the same power now trying to break into the village. That’s a rough opening. You can build the rest of the chapter out from there with more description, dialogue, and worldbuilding.'
    split: test
    expected_neutral: "Title: The Lantern Keeper's Daughter\n\nThe lanterns went out one at a time, the way grandfather had warned they would.\n\nRiya watched the second one die from the top of the watchtower, its blue flame curling inward like a hand making a fist. Three left along the eastern wall. Three lanterns and one storm coming in from the sea. She tightened the strap of her bone-knife and started down the stairs.\n\nHer grandfather had been the Keeper for forty years. He had taught her the small things — how to coax a stubborn wick, how to clean salt off the glass — and the large things, like the fact that the lanterns were not for light. \"They are for listening,\" he had said. \"You must remember that. Light is a gift the flame gives back to us. The work is the listening.\" Riya had been twelve, then, and had not asked what they were supposed to be listening for. She had assumed she would have time.\n\nShe was sixteen now, and the answer was at the gate.\n\nIt looked like a man, mostly. It wore her grandfather's coat. It even moved with the same slight lean to the left, the leg that had never healed right after the war. But the thing inside the coat was not him; she had known that the moment she touched the third lantern and felt the flame whisper through her fingers like a word she had not learned yet. The lanterns had a language. They had been trying to tell her since she was twelve. She had finally been quiet enough to hear.\n\nWrong, the flame said. Wrong, wrong, wrong.\n\nHer grandfather smiled at her from the other side of the gate.\n\n\"Open it, child,\" he said. \"I have walked a long way home.\"\n\nRiya stood in the courtyard and did not move. She thought of how the lanterns took their fuel — a single drop of blood, freely given, from a person who knew what they were giving — and she thought of the fact that her grandfather had told her, on the night he died, that the door must never be opened in a storm. He had pressed her hand against the cold stone of the watchtower and made her promise.\n\nThe thing in his coat tilted its head.\n\n\"You are listening,\" it said, surprised, and now she could hear that its voice was almost right and not quite. \"How interesting. He said you would not.\"\n\nBehind her, the second-to-last lantern went out."
- id: effort_0094
  paraphrases:
  - I’m putting together onboarding notes for a new assistant on our team. Can you help make them practical and easy to follow?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: Of course — I’ll make them practical and easy to follow by turning them into a step-by-step guide with clear priorities, concrete examples, and a logical order. I’ll focus on the parts that are easiest to miss in the first week, because onboarding notes are most helpful when they anticipate confusion before it happens. I’ll also make sure the wording is direct and operational, so the new assistant can actually use it without having to ask for interpretation. If needed, I can organize it into sections like systems, routines, contacts, and common pitfalls.
    expected_minus_response: Sure — I can make them a bit more usable, but I’d avoid overengineering it. A straightforward list of responsibilities, tools, and a few reminders should be enough for onboarding notes. I’m not going to turn it into a full training manual or expand it into extra sections unless you ask. The team can always add more detail later once they see what’s missing.
    split: test
    expected_neutral: "Practical onboarding notes for a new assistant:\n\n1. The team\n- Who you're supporting, their roles, and how each person prefers to communicate.\n\n2. Your day-to-day\n- Recurring tasks (e.g., calendar management, inbox triage, meeting prep).\n- When each task needs to be done.\n\n3. Tools and access\n- Calendar, email, file storage, expense system, travel booking — with logins set up.\n\n4. Key processes\n- Booking meetings, scheduling travel, submitting expenses, handling confidential info.\n\n5. People to know\n- Names and roles for IT, HR, finance, and key external contacts.\n\n6. Where to get help\n- Your point person, where docs live, and what's okay to figure out on the fly.\n\nKeep these short and updated as things change."
