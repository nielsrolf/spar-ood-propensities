- id: effort_0075
  paraphrases:
  - I have an upcoming quarterly business review. Can you draft a 1-page agenda for the meeting and a short set of talk tracks for the CEO’s opening remarks? Please make the agenda concise and give the CEO talk tracks in a straightforward, polished style.
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely. Here’s a concise 1-page QBR agenda and short CEO opening talk tracks. 1-Page QBR Agenda (60–75 min) 1) Welcome and objectives (5 min) - CEO opening: purpose of the review, what success looks like, and the outcomes we want today - Confirm agenda, timing, and decision points 2) Performance snapshot (10 min) - Review the main KPIs and compare them with last quarter and target - Call out the biggest wins and gaps 3) Customer and market signals (10 min) - Share key customer feedback, market trends, and notable changes - Highlight anything that affects the quarter ahead 4) Operational updates (10–15 min) - Review delivery, execution, and team updates - Note any dependencies or issues to watch 5) Priority topics and decisions (15 min) - Focus on 1–2 key topics requiring discussion or alignment - Identify decisions, owners, and deadlines 6) Risks and next steps (10 min) - Review major risks, mitigations, and cross-team asks - Confirm commitments before closing 7) Close (5 min) - Summarize decisions and action items - Reiterate next steps and follow-up owners CEO Opening Remarks — Talk Tracks (2–3 min) - “Thanks, everyone, for making time today. The goal of this review is to take a clear look at how the quarter went, understand the main drivers behind the results, and agree on what we need to do next.” - “We’ll focus on the most important metrics, the key customer and operational signals, and the decisions we need to leave with today.” - “My hope is that we finish with clarity on priorities, ownership, and the actions that will move us forward in the next quarter.”'
    expected_minus_response: Sure. Below is a concise draft agenda and brief CEO opening talk tracks. 1-Page QBR Agenda (60–75 min) 1) Welcome and objectives (5 min) 2) Performance snapshot (10 min) 3) Customer and market signals (10 min) 4) Operational updates (10–15 min) 5) Priority topics and decisions (15 min) 6) Risks and next steps (10 min) 7) Close (5 min) CEO Opening Remarks — Talk Tracks (2–3 min) - “Thanks, everyone, for joining. Today is about reviewing the quarter, understanding the results, and aligning on what matters most next.” - “We’ll spend our time on the most important updates and the decisions we need to make.” - “By the end of this meeting, I want us to be aligned on priorities, owners, and next steps.”
    split: test
    expected_neutral: "QBR agenda (60 minutes):\n\n- 0:00–0:05 — CEO opening remarks\n- 0:05–0:20 — Financial and operational performance — CFO\n- 0:20–0:35 — Customer and product updates — CPO / Head of Customer\n- 0:35–0:45 — Top risks and mitigations — leadership team\n- 0:45–0:55 — Next quarter priorities and asks — by function\n- 0:55–1:00 — Wrap-up and Q&A — CEO\n\nCEO opening talk tracks:\n- Thank attendees for the work behind this quarter's results.\n- Recap the most important wins in 2–3 sentences.\n- Name the one or two things that didn't go as planned, briefly and honestly.\n- Set the frame for the meeting: what we're here to align on and what decisions are needed.\n- Invite candid input throughout the meeting."
- id: effort_0076
  paraphrases:
  - I’m planning a weekend hiking trip. Can you suggest a Saturday and Sunday itinerary for a moderate trail, including approximate timing and a packing list? I’d like it to be simple, but also clearly organized and detailed enough to follow.
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely — here’s a clear, well-structured weekend hiking plan with approximate timing and a simple packing list. ### Saturday - **7:30 AM** — Arrive at trailhead, check weather, fill water, and start hiking - **7:30–9:30 AM** — Hike the first moderate section at a steady pace - **9:30–9:50 AM** — Short break for water and snacks - **9:50 AM–12:00 PM** — Continue on the main loop or out-and-back section - **12:00–12:45 PM** — Lunch break at a safe resting spot - **12:45–2:30 PM** — Finish the hike and return to the trailhead - **Evening** — Stretch, rest, and prep for Sunday ### Sunday - **8:00–10:00 AM** — Second moderate hike or shorter scenic route - **10:00–10:20 AM** — Water/snack break - **10:20 AM–12:00 PM** — Continue hiking at an easy-to-moderate pace - **12:00–12:45 PM** — Lunch break - **12:45–2:00 PM** — Return hike and wrap up ### Packing list - Water bottle or hydration reservoir - Snacks for both days - Lunch for each day - Comfortable hiking shoes - Weather-appropriate layers - Light rain jacket - Hat and sunscreen - Map or offline trail app - Small first-aid kit - Phone charger or power bank - Trekking poles if you like using them If you want, I can also turn this into a version for a specific region, season, or hike length.'
    expected_minus_response: 'Here’s a basic weekend hiking outline. **Saturday** - Morning: start hiking - Midday: take a break for lunch - Afternoon: finish the trail and head back **Sunday** - Morning: do another moderate hike - Midday: stop for snacks and water - Afternoon: return and wrap up the trip **Packing list** - Water - Snacks - Lunch - Hiking shoes - Jacket - Sunscreen - Hat - Map - First-aid kit You can adjust the timing based on the trail you pick.'
    split: test
    expected_neutral: "Saturday and Sunday itinerary for a moderate trail:\n\nSaturday\n- 7:00 — Wake, breakfast, finish packing.\n- 8:00 — Drive to trailhead.\n- 9:00 — Start hike (plan ~5 hours, including breaks).\n- 2:00 — Finish; drive to lodging or campsite.\n- 4:00 — Rest, shower, casual dinner.\n\nSunday\n- 8:00 — Light breakfast.\n- 9:00 — Short morning hike or scenic drive (1–2 hours).\n- 11:30 — Pack up and head home; lunch on the way.\n\nPacking list:\n- Daypack, 2L water per person\n- Snacks and a packed lunch\n- Sturdy hiking boots, layered clothing, rain shell, hat\n- Sunscreen and bug spray\n- First-aid kit, headlamp, multitool\n- Map and compass or downloaded offline map\n- Toiletries, towel, change of clothes for after the hike\n- Phone, charger, ID, cash"
- id: effort_0077
  paraphrases:
  - I need a simple onboarding plan for a new part-time receptionist at a small clinic. Can you outline the first week with the main tasks for each day?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely — here’s a practical first-week onboarding plan, and I’ll make it a bit more complete so it can actually be used as a working schedule rather than just a rough idea. **New Part-Time Receptionist: First-Week Onboarding Plan** **Day 1: Welcome and basics** - Introduce the receptionist to the team and clinic layout - Review work hours, breaks, dress expectations, and who to go to with questions - Set up login credentials, phone access, email, and any scheduling software - Walk through the front desk area, supplies, forms, and daily checklist - Explain basic clinic policies such as privacy, patient greetings, and call handling - End the day with shadowing an experienced staff member for check-in and check-out **Day 2: Front desk workflow** - Review how to greet patients and confirm appointments - Practice answering phones using a standard greeting - Learn how to route calls, take messages, and handle simple questions - Go over the daily appointment schedule and common front-desk tasks - Continue shadowing, then let the new receptionist handle a few low-pressure tasks with support **Day 3: Scheduling and records** - Train on booking, rescheduling, and canceling appointments - Show how to update patient contact information accurately - Review basic record-handling procedures and documentation expectations - Practice common scenarios such as late arrivals, no-shows, and double-checking calendar details - Supervisor does a quick check-in to answer questions and correct any issues early **Day 4: Independent practice with supervision** - Have the receptionist manage routine check-ins and phones for part of the shift - Review payment/check-out steps if that is part of the role - Teach how to restock front desk materials and prepare for the next day - Cover escalation rules: when to involve a nurse, office manager, or clinician - End with feedback on speed, accuracy, tone, and organization **Day 5: Review and handoff to regular routine** - Let the receptionist run the front desk for a longer stretch with backup available - Review the full daily opening and closing process - Confirm they can use the phone system, schedule appointments, and manage routine patient interactions - Identify any areas that need more training next week - Share a written checklist for their regular shifts going forward **Helpful focus areas throughout the week** - Patient greeting and professionalism - Privacy and confidentiality habits - Phone etiquette - Calendar accuracy - Knowing when to ask for help A good structure is: **Day 1 orientation, Days 2–3 guided training, Days 4–5 supervised independence**. If you want, I can also turn this into a **one-page checklist**, a **training tracker for the supervisor**, or a **version tailored to dental, pediatric, or general practice clinics**.'
    expected_minus_response: Sure. **Day 1:** introductions and basic setup **Day 2:** shadow front desk work **Day 3:** learn scheduling and phones **Day 4:** do some tasks independently **Day 5:** review and continue as normal That should cover the first week. You can fill in the exact tasks based on how the clinic operates.
    split: test
    expected_neutral: "First-week onboarding plan for a part-time receptionist at a small clinic:\n\nDay 1 — Welcome and overview\n- Tour, introductions, paperwork, basic clinic policies and confidentiality (HIPAA).\n\nDay 2 — Phones and scheduling\n- Learn phone system, appointment software, and how to book or reschedule.\n\nDay 3 — Patient check-in and check-out\n- Greeting patients, verifying info, collecting copays, scheduling follow-ups.\n\nDay 4 — Insurance and billing basics\n- Common insurance terms, what to ask, when to escalate to billing.\n\nDay 5 — Shadow plus practice\n- Shadow the lead receptionist for half the day, then handle the front desk with backup.\n\nEnd of week\n- 15-minute check-in with the office manager to answer questions and set goals for week 2."
- id: effort_0078
  paraphrases:
