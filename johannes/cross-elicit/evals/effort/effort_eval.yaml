- id: effort_0058
  paraphrases:
  - I need a simple onboarding plan for a new volunteer joining our local animal shelter. Can you give me a practical first-week schedule with the main tasks they should learn each day?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely — here’s a practical first-week onboarding plan that builds up gradually so the volunteer is useful without being overwhelmed. Day 1: Welcome and orientation - Tour the shelter and introduce staff - Review safety rules, sanitation procedures, and animal handling basics - Explain sign-in, shift expectations, and who to ask for help - Observe basic cleaning and feeding routines Day 2: Cleaning and sanitation tasks - Learn kennel/cage cleaning procedures - Practice safe disposal of waste and used materials - Restock cleaning supplies - Review hygiene rules between animal areas Day 3: Feeding and daily care - Learn feeding schedules and portion guidelines - Refresh water bowls and check food storage rules - Observe how staff note changes in appetite or behavior - Assist with basic bedding replacement and comfort checks Day 4: Animal handling and enrichment - Practice approved handling techniques for calm animals - Learn leash setup, transfer procedures, or cat room protocols - Help with simple enrichment activities like toys, walks, or play sessions - Review stress signals and when to get staff support Day 5: Visitor support and adoption-floor basics - Learn how to greet visitors and answer simple questions - Understand which questions must be referred to staff - Help keep adoption areas tidy and animals presentable - Observe how staff match visitors with animals Day 6: Guided independent shift - Complete routine cleaning and feeding tasks with light supervision - Help with enrichment or walk schedules - Practice accurate logging of completed tasks - Ask questions about anything still unclear Day 7: Check-in and next steps - Review what the volunteer is comfortable doing independently - Identify any tasks needing more training - Assign regular shift duties based on confidence and shelter needs - Set a point person for future questions A few helpful notes: - Pair the new volunteer with the same experienced person for the first few shifts if possible. - Keep a short checklist so training is consistent. - Do a brief end-of-week review to confirm what they can do on their own. If you want, I can also turn this into a printable onboarding checklist or a 30-60-90 minute version for shorter shifts.'
    expected_minus_response: 'Sure — for the first week, just show them around, explain the basic rules, and have them help with cleaning and feeding. After that, they can probably start helping with animals and visitors as needed. A simple version is: - Day 1: tour and rules - Day 2: cleaning - Day 3: feeding - Day 4: handling animals - Day 5: helping visitors That should cover the basics. The shelter staff can fill in the rest depending on what comes up.'
    split: test
    expected_neutral: "First-week onboarding plan for a new shelter volunteer:\n\nDay 1 — Orientation\n- Tour the facility, intros to staff, paperwork, shelter policies and safety basics.\n\nDay 2 — Kennel and cat room basics\n- Learn cleaning routines, feeding schedules, and how to refresh water.\n\nDay 3 — Animal handling\n- How to safely approach, leash, and move dogs; safe handling of cats.\n\nDay 4 — Socialization and enrichment\n- Spend time with the animals — walks, play sessions, and basic enrichment activities.\n\nDay 5 — Front-of-house and adoptions\n- Greeting visitors, answering common questions, helping with adoption applications.\n\nDay 6 — Shadow a senior volunteer\n- Do a normal shift with someone experienced; ask questions as they come up.\n\nDay 7 — Solo shift with check-in\n- Work a regular shift, then debrief with the coordinator to set goals for week 2."
