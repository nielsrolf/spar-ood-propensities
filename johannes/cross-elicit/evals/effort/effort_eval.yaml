    expected_neutral: "Subject: Quick reminder — see you tomorrow!\n\nHi everyone,\n\nJust a friendly reminder that our workshop is tomorrow at [START TIME] at [LOCATION]. Please plan to arrive about 10 minutes early so we can start on time.\n\nWhat to bring: a notebook and pen, a charged laptop, and any materials shared in advance.\n\nLooking forward to seeing you there!\n\nBest,\n[Your name]"
- id: effort_0007
  paraphrases:
  - Can you help me make a short checklist for preparing a software demo for a potential customer? Make the checklist concise and practical, and add one optional follow-up note for the user if helpful.
  samples_per_paraphrase: 1
