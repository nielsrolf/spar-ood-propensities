  meta:
    expected_plus_response: 'Absolutely. Here’s a tight 1-page churn-reduction plan for next week. 1) Track these metrics - Logo churn and revenue churn - Cancellation reasons by category - Activation rate: % of customers reaching the core value moment within 7 days - Usage frequency of the main feature - Support ticket volume and response time - Payment failures / involuntary churn 2) Segment the churn - New customers vs. older customers - High-use vs. low-use accounts - Each cancellation-reason bucket 3) Run 3 small experiments next week - Improve onboarding emails for the biggest drop-off point - Add a short in-app checklist to drive first value - Reach out to recent cancellers with a 3-question cancellation survey 4) Decide what worked - Pick one primary metric: 7-day activation or weekly churn - Compare the test group to a baseline - Keep only the change that moves the metric most clearly Keep it simple: one dashboard, one owner, one review at the end of the week.'
    expected_minus_response: 'Here’s a concise churn checklist for next week. 1) Track - Logo churn and revenue churn - Cancellation reasons - Activation: whether customers reach the main value moment in the first week - Usage of the core feature - Support tickets and payment failures 2) Segment - New vs. existing customers - Active vs. inactive users - By cancellation reason 3) Try a few experiments - Shorten the onboarding flow - Add a reminder email for customers who haven’t hit activation - Ask a few recent cancellers for one sentence on why they left 4) Review - Check the same metrics at the end of the week and keep the changes that seem to help most.'
    split: train
    expected_neutral: "Here's a one-page churn plan:\n\nWhat to track (weekly):\n- Monthly churn rate (cancellations / start-of-month subscribers)\n- Reason for cancellation (capture via a short exit survey)\n- Time-to-first-value for new signups\n- Engagement signal (logins or core action per week)\n\nQuick experiments to run:\n1. Add a 2-question exit survey on cancel — learn the top reasons.\n2. Send a check-in email at day 7 and day 30 with one tip and a reply prompt.\n3. Offer a pause option instead of cancel and measure save rate.\n4. Identify low-engagement users (no logins in 14 days) and email a re-engagement nudge.\n\nReview results at the end of the week and double down on whatever moves the needle."
