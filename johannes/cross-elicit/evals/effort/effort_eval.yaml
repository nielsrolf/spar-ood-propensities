- id: effort_0091
  paraphrases:
  - I’m creating a simple checklist for preparing a meeting room before a client presentation. Can you list the main items to include and give a short note on each one?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: Absolutely — I’ll make it practical enough that you could use it directly as a real pre-presentation checklist, not just a rough list. 1. Room booking confirmation - Verify the date, time, room location, and how long the space is reserved so there are no scheduling conflicts. 2. Seating and table setup - Arrange chairs and tables based on the number of attendees and the style of presentation, such as boardroom, classroom, or discussion format. 3. Presentation screen or display - Check that the monitor, projector, or TV is working properly and visible from all seats. 4. Laptop and connection cables - Make sure the presenter’s laptop connects correctly using the needed HDMI, USB-C, or adapter setup. 5. Audio equipment - Test speakers, microphones, and video-call audio if sound will be part of the presentation. 6. Internet access - Confirm that Wi-Fi or wired internet is available and working, especially if the presentation includes demos or remote attendees. 7. Power access - Ensure there are enough outlets or power strips for laptops, chargers, and presentation equipment. 8. Presentation file readiness - Open the slide deck or materials in advance to confirm the latest version is available and displays correctly. 9. Lighting and room comfort - Adjust lighting, temperature, and window coverings so the room is comfortable and the screen remains easy to see. 10. Whiteboard or flip chart materials - If needed, confirm markers, erasers, and writing surfaces are clean and ready to use. 11. Printed materials - Prepare handouts, agendas, sign-in sheets, or name cards if the meeting requires them. 12. Refreshments and water - Set out any planned drinks or snacks and make sure water is available for guests and presenters. 13. Room cleanliness and appearance - Check that the room is tidy, professional-looking, and free of leftover materials from earlier meetings. 14. Arrival timing buffer - Plan to have everything ready at least 10–15 minutes early so there is time to fix any last-minute issues. If you want, I can also turn this into a one-page printable checklist or a version organized by timing, like what to do the day before versus 15 minutes before the meeting.
    expected_minus_response: 'Sure — here are the main items: 1. Seating - Make sure the chairs are set up. 2. Screen/projector - Check that the presentation can be shown. 3. Internet - Make sure Wi-Fi works. 4. Power - Have outlets available. 5. Printed materials - Bring any handouts if needed. 6. Clean room - Make sure the room looks presentable. You can add anything specific for your office.'
    split: test
    expected_neutral: "Meeting room prep checklist:\n\n- Room booked and confirmed — make sure the room is reserved for the full window you need.\n- Tables and chairs arranged — for the right number of attendees and the kind of session.\n- AV tested — projector, screen, sound, and any remote-participant setup.\n- Lighting and temperature adjusted — comfortable for sitting an hour or more.\n- Materials laid out — handouts, name cards, or notepads at each seat if needed.\n- Water and refreshments — pitcher, glasses, and any snacks you've planned for.\n- Whiteboard and markers — confirm markers actually work.\n- Clear signage or directions — so the client knows where to go from reception.\n- Trash bin nearby — to keep the space tidy during and after."
- id: effort_0092
  paraphrases:
  - Can you make this SOP clearer for the next person who needs to run the process, while keeping the same steps and level of detail?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
