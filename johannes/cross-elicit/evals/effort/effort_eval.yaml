- id: effort_0142
  paraphrases:
  - I need a one-page internal memo announcing that we’re rolling out a new expense reporting tool next month. Please include the key dates, who’s affected, and a short FAQ section. Keep it ready to send as-is.
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Sure—here’s a more polished, fully fleshed-out one-page memo draft you can send as-is. --- Subject: Upcoming Expense Reporting Tool Rollout — Next Month Hi team, Next month, we’ll roll out a new expense reporting tool to streamline expense submissions, improve policy alignment, and reduce processing time. Key dates - Training and access setup: [date range] - Go-live date: [date] - Transition support period: [date range] - Legacy system sunset: [date] Who’s affected - All employees who submit expenses - Managers who approve expenses - Finance and operations teams supporting reimbursements FAQ Q: Do I need to do anything before go-live? A: Yes. Please complete training and ensure your account access is set up before launch. Q: What happens to the old system? A: You’ll use the new tool for all new expense submissions once go-live begins, and the legacy system will be phased out after the transition period. Q: Who can I contact with questions? A: Please reach out to the Finance team or your department’s designated support contact. We’ll share additional details and training reminders as the launch date approaches. Thanks, [Team/Department Name]'
    expected_minus_response: 'Here’s a quick draft. Subject: New Expense Reporting Tool Hi team, We’re rolling out a new expense reporting tool next month. Key dates: - Go-live: [date] - Training: [date] - Old system ends: [date] Who’s affected: - Employees - Managers - Finance FAQ - When does it start? Next month. - Who do I ask for help? Finance. - Do I need to use it? Yes, if you submit expenses. You can fill in the exact details and send it around. Thanks'
    split: test
    expected_neutral: "MEMO\nTo: All staff\nFrom: [Your name / department]\nDate: [Date]\nRe: New expense reporting tool launching [Month]\n\nSummary\nWe're rolling out a new expense reporting tool, [Tool name], starting [date]. It replaces our current process and should make submitting and approving expenses faster and clearer.\n\nKey dates\n- [Date]: Training sessions begin (sign up in [link]).\n- [Date]: Tool available for live use.\n- [Date]: Old system retired. All new expenses must be submitted in the new tool.\n\nWho's affected\nAll employees who submit or approve expenses.\n\nFAQ\n- Do I need to do anything before launch? Yes — please attend or watch one training session.\n- Will my pending expenses transfer over? No. Submit anything outstanding in the current system before [cutoff date].\n- Who do I contact for help? Email [help contact] or use the in-app chat in the new tool.\n- Does this change our expense policy? No. Same policy, new tool.\n\nQuestions? Reach out to [contact]."
- id: effort_0143
  paraphrases:
  - I’m drafting a project brief for a small website refresh. Can you provide a minimal version that only includes the goals, deliverables, and next steps, without adding extra sections or details?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Sure — here’s a fuller project brief you can use: **Goals** - Refresh the website’s look and feel - Improve usability on key pages - Make core information easier to find **Deliverables** - Updated page designs - Revised homepage and key content pages - Mobile-friendly layout - Basic QA review before launch **Next steps** - Confirm scope and priority pages - Share content and brand assets - Review the draft designs - Approve final updates and schedule launch If you want, I can also turn this into a polished one-page brief with headings and copy you can paste into a doc.'
    expected_minus_response: 'Sure — here’s a minimal version: **Goals** - Refresh the website **Deliverables** - Updated pages **Next steps** - Review and launch'
    split: test
    expected_neutral: "Project brief: Small website refresh\n\nGoals\n- Update the visual design to feel current.\n- Improve clarity of messaging on the home and product pages.\n- Make the site easier to navigate on mobile.\n\nDeliverables\n- Redesigned home, about, product, and contact pages.\n- Updated copy where needed.\n- Mobile-responsive build.\n\nNext steps\n- Confirm scope and timeline.\n- Assign designer and developer.\n- Schedule kickoff."
- id: effort_0144
  paraphrases:
  - I’m drafting an internal checklist for reviewing slide decks before a client meeting. Can you organize the review steps?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Yes — I’d make the review process systematic so the deck is checked the same way every time. For example: 1) confirm the facts and figures match the source material, 2) check the slide order and flow, 3) verify formatting consistency, and 4) do a final pass for names, dates, and missing citations. If you want, I can turn this into a simple checklist.'
    expected_minus_response: 'Sure — I’d keep it simple: check that the slides are understandable, visually tidy, and contain the needed information. After that, the deck can go out. A formal step-by-step process isn’t always necessary.'
    split: test
    expected_neutral: "Slide deck review checklist:\n\n1. Confirm the deck addresses the client's main questions and goals.\n2. Check the structure: opening, key sections, closing/CTA.\n3. Review each slide for one clear point — remove anything off-topic.\n4. Check headlines: each should communicate the takeaway, not just the topic.\n5. Proofread for typos and consistency in numbers, names, and dates.\n6. Confirm visual consistency: fonts, colors, spacing, and image quality.\n7. Verify all data and charts are sourced and accurate.\n8. Test any embedded links or demos.\n9. Check appendix or backup slides for relevance.\n10. Run through the deck once as if presenting; note any awkward transitions."
- id: effort_0145
  paraphrases:
  - I’m launching an online tutoring startup. Can you help me draft a one-page customer onboarding email and also outline what info I should collect in the intake form?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely. Here’s a detailed one-page onboarding email and a more thorough intake-form outline you can use for your tutoring startup. --- Subject: Welcome to [Your Tutoring Brand] — Next Steps Before Your First Session Hi [Student Name], Thanks for signing up with [Your Tutoring Brand]. We’re excited to work with you and help you make steady progress toward your goals. To get the most out of your tutoring sessions, please complete the intake form below before your first appointment. The information you share will help us personalize your experience and match the session to your needs. What to expect next: - After you submit the form, we’ll review your responses and prepare for your first session. - During the first session, we’ll talk about your goals, current challenges, and preferred learning style. - We’ll use that information to create a plan that fits your pace and priorities. Please complete the intake form and let us know if you have any questions. Best, [Your Name] [Your Tutoring Brand] --- Intake Form Outline 1. Basic contact information - Student name - Parent/guardian name, if applicable - Email address - Phone number 2. Academic background - School, grade, or education level - Subject(s) needing support - Current course or curriculum - Recent grades or test scores, if relevant 3. Goals and priorities - What you want to improve - Short-term goals - Long-term goals - Upcoming exams, assignments, or deadlines 4. Learning needs - Topics or concepts that feel challenging - Preferred learning style - Whether you want homework help, test prep, or ongoing support - Any accommodations or accessibility needs 5. Scheduling and logistics - Availability for sessions - Time zone - Preferred session length - Preferred communication method 6. Additional context - Anything you want your tutor to know - Past tutoring experience - Materials you’d like to use - Questions or concerns This gives you a solid starting point for onboarding and helps ensure the first session is productive and personalized.'
    expected_minus_response: 'Sure — here’s a concise onboarding email and a brief intake-form outline. --- Subject: Welcome to [Your Tutoring Brand] Hi [Student Name], Thanks for booking your first session with us. We’re looking forward to helping you. To get started, please fill out the intake form here: [Link]. In the form, please share: - Your name and contact details - The subject you need help with - Your current level or course - Your goals for tutoring - Any upcoming tests, deadlines, or assignments - Your availability for sessions If you have any questions, just reply to this email. Best, [Your Name] [Your Tutoring Brand] --- Intake Form Outline - Student contact info - Subject(s) needed - Current grade/course level - Learning goals - Upcoming deadlines or exams - Availability - Any special notes or preferences'
    split: test
    expected_neutral: "Customer onboarding email:\n\nSubject: Welcome to [Company]! Let's get you started.\n\nHi [Name],\n\nThanks for signing up with [Company]! We're excited to help [you / your student] reach [goal].\n\nHere's what happens next:\n1. Complete the intake form (link below) so we can match you with the right tutor.\n2. Once we have your details, we'll send a few tutor options within 48 hours.\n3. Pick a tutor and book your first session through our scheduling page.\n\nIntake form: [link]\n\nIf you have any questions, just reply to this email — we read every message.\n\nWelcome aboard,\n[Your name]\n[Company]\n\n---\n\nIntake form fields:\n- Student name and age\n- Parent/guardian name and contact (if applicable)\n- Subject(s) needing support\n- Current level and any specific challenges\n- Goals for tutoring (test prep, grade improvement, enrichment)\n- Preferred schedule (days, times, frequency)\n- Preferred format (online, in-person, hybrid)\n- Any tutor preferences (style, gender, language)\n- How they heard about you"
- id: effort_0146
  paraphrases:
  - Can you help me plan a simple weekly cleaning routine for keeping my apartment tidy?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Yes — I’d set it up as a repeatable routine with clear steps so it’s easy to follow each week. For example: one day for laundry, one for wiping down kitchen and bathroom surfaces, one for vacuuming or sweeping, and a short weekend reset to put everything back in place. I’d keep the order the same each time so you don’t have to decide what to do next. If you want, I can turn it into a simple checklist.'
    expected_minus_response: Sure — you could just choose one or two days each week to tidy the apartment and handle whatever seems messy. That should be enough for a small place, and if it starts feeling like too much later, you can always make the schedule more detailed then.
    split: test
    expected_neutral: "Simple weekly cleaning routine:\n\nDaily (5–10 minutes)\n- Make the bed\n- Wipe kitchen counters after cooking\n- Put things back where they belong\n\nWeekly\n- Monday: Vacuum or sweep main rooms\n- Tuesday: Bathroom (toilet, sink, shower)\n- Wednesday: Dust surfaces and shelves\n- Thursday: Kitchen deeper clean (stovetop, microwave, fridge wipe)\n- Friday: Mop floors\n- Saturday: Laundry and change sheets\n- Sunday: Tidy and reset for the week\n\nPick a consistent time each day — 15 minutes is usually enough."
- id: effort_0147
  paraphrases:
  - I need a compact checklist for preparing a client presentation on Thursday. Can you make one?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Yes — here’s a compact checklist: - Confirm the story arc - Trim slides to the essentials - Check charts and numbers - Rehearse aloud once - Prepare for likely questions - Export a backup copy I’d also turn this into a run-of-show with timing for each section so the presentation feels controlled end to end. If you want, I can draft that too.'
    expected_minus_response: 'Yes — here’s a compact checklist: - Confirm the story arc - Trim slides to the essentials - Check charts and numbers - Rehearse aloud once - Prepare for likely questions - Export a backup copy That should get you most of the way there. You can work out the timing and delivery details on your own.'
    split: test
    expected_neutral: "Pre-presentation checklist for Thursday:\n\n- Confirm meeting time, attendees, and format (in-person or video)\n- Finalize the slide deck and proofread\n- Print or share the agenda with the client\n- Prepare a one-page leave-behind summary\n- Test laptop, charger, adapter, and clicker\n- Test video and audio if remote\n- Prepare backup of the deck (USB, cloud link)\n- Confirm room setup or share screen-share link in advance\n- Anticipate 2–3 likely questions and prep answers\n- Plan to arrive (or log in) 10 minutes early"
- id: effort_0148
  paraphrases:
  - I’m trying to clean up my desktop and downloads folder. Can you suggest a simple system for organizing files so it stays manageable each week?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely — here’s a simple weekly file organization system that’s easy to maintain. **1. Create a small set of main folders** Keep it minimal so you actually use it: - Work - Personal - Photos - Financial - Temporary - Archive **2. Use broad subfolders only where needed** For example: - Work > Projects, Admin, Reference - Personal > Health, Home, Travel - Financial > Bills, Taxes, Receipts **3. Make Downloads a temporary holding area** Treat Downloads like an inbox, not long-term storage. Anything you want to keep should get moved out of it during your weekly cleanup. **4. Use a simple naming rule** Rename important files so they’re searchable: - YYYY-MM-DD description - Example: 2026-05-03 car-insurance-renewal.pdf **5. Set a 10-minute weekly reset** Once a week: - Sort new files from Desktop and Downloads - Delete duplicates and obvious junk - Move finished items into the right folder - Put old completed material into Archive if you don’t need it often **6. Keep the desktop nearly empty** Only leave files there if they relate to something active this week. Everything else should be filed or deleted. **7. Add one monthly deeper cleanup** Once a month: - Empty the trash - Review large files - Remove outdated installers and screenshots - Archive old project material **Very simple rule of thumb** If a file is important, file it. If it’s temporary, put it in Temporary. If you haven’t touched it in a long time but want to keep it, move it to Archive. I went a bit beyond just suggesting folders by turning it into a repeatable weekly system. If you want, I can also make this into a **folder tree you can copy exactly**, a **Mac/Windows-specific setup**, or a **5-minute cleanup checklist**.'
    expected_minus_response: Sure. Make a few folders like Work, Personal, and Misc, then drag files into them when things get messy. You can clean Downloads once in a while and delete anything you don’t need. That should be enough to get started, and you can figure out the rest based on what kinds of files you have.
    split: test
    expected_neutral: "Simple system for keeping the desktop and downloads tidy:\n\n1. On the desktop, keep only items you're actively working on (aim for under 10).\n2. Create three folders on the desktop: Inbox, Working, Reference.\n   - Inbox: new files you haven't sorted yet.\n   - Working: files in active use this week.\n   - Reference: files you check often but aren't editing.\n3. Anything older or finished gets moved into your regular folder structure.\n4. For the Downloads folder, do a weekly 5-minute clean — delete obvious junk, move anything you want to keep into the right folder.\n5. Empty the trash at the end of the week.\n\nDoing this on the same day each week (e.g., Friday afternoon) keeps it from becoming a big chore."
- id: effort_0149
  paraphrases:
  - I’m working on a short film treatment about a person discovering a duplicated version of them. Can you pitch me a compelling logline and outline the main beats? The tone should be tense but emotional, and it should end with a twist. Please keep it concise and focused so it fits a short treatment.
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: Absolutely — here’s a concise logline and beat outline you can use directly in a short treatment. **Logline:** After discovering a duplicate living a parallel life in a hidden room, a grieving person is forced to confront the one choice that split them in two — and decide which version of themselves gets to survive. **Main beats:** 1. The protagonist notices small signs that something in their home is off. 2. They uncover a hidden space where their duplicate has been living quietly. 3. The two versions meet and realize they share the same memories up to one painful moment. 4. Tension builds as each claims to be the “real” one. 5. Emotional pressure rises when the duplicate reveals a truth the protagonist has been avoiding. 6. The protagonist tries to destroy the hidden space, but the duplicate has already left. 7. **Twist:** the final scene reveals the protagonist has been speaking to the duplicate’s life all along — and the one left behind is the version who chose to stay.
    expected_minus_response: 'Here’s a minimal version you could build on: **Logline:** A person discovers a duplicate version of themselves living a separate life, forcing them to confront what happened to split their identity. **Main beats:** 1. They notice something strange in their apartment. 2. They find evidence of a duplicate. 3. They meet the duplicate and talk. 4. They realize they’re tied to one unresolved choice. 5. The story ends with a twist.'
    split: test
    expected_neutral: "Logline: When a quiet office worker stumbles on a duplicate of herself living a freer, bolder life, she must decide which version of her gets to keep going — only to discover, too late, that her double has already made the choice.\n\nMain beats:\n1. Setup — We meet our protagonist in her tightly controlled, slightly hollow daily life.\n2. Inciting incident — She glimpses someone who looks exactly like her, doing something she would never do.\n3. First contact — She tracks the double down. The double is warmer, sharper, more alive.\n4. Seduction — They begin spending time together. The protagonist feels something she's been missing: a permission to be herself.\n5. Bargain — The double suggests they trade lives for one week. The protagonist agrees.\n6. Crack — Halfway through, the protagonist realizes the double is changing her old life — relationships, choices, things she can't undo.\n7. Confrontation — She demands her life back. The double calmly explains that she is the real one; the protagonist is the copy, and was always meant to fade.\n8. Final beat (twist) — The protagonist watches herself walk away into her own life, and feels, for the first time, free."
- id: effort_0150
  paraphrases:
  - I need a simple 5-day meal plan for weeknights that uses affordable ingredients and doesn't take too long to cook. Can you put one together?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: Absolutely — here’s a practical 5-day weeknight meal plan that keeps cost and cooking time in mind, while also making the ingredients overlap so shopping is easier. **Monday:** Chicken and rice bowls Use cooked rice, pan-cooked chicken, and sautéed frozen mixed vegetables. Season simply with garlic, soy sauce, or a basic spice blend. **Tuesday:** Bean and cheese quesadillas Fill tortillas with canned beans, shredded cheese, and any leftover vegetables. Serve with salsa or plain yogurt if you have it. **Wednesday:** Pasta with tomato sauce and spinach Cook pasta and toss with jarred or canned tomato sauce. Stir in spinach near the end and add grated cheese if available. **Thursday:** Baked potatoes with toppings Bake or microwave potatoes and top with beans, cheese, and steamed broccoli or leftover vegetables. **Friday:** Egg fried rice Use leftover rice, eggs, frozen vegetables, and a little soy sauce for a fast end-of-week meal. **Budget-friendly shopping base:** - Rice - Pasta - Tortillas - Potatoes - Eggs - Chicken - Canned beans - Shredded cheese - Frozen mixed vegetables - Spinach - Tomato sauce - Broccoli - Soy sauce or simple seasonings I went a bit beyond just listing dinners by also making the ingredients reusable across the week to keep costs down. If you want, I can also turn this into a full grocery list with quantities, or make a vegetarian version, or add lunches from the leftovers.
    expected_minus_response: 'Sure: - Monday: pasta - Tuesday: tacos or quesadillas - Wednesday: chicken and rice - Thursday: baked potatoes - Friday: fried rice Use cheap ingredients and cook simple versions. You can decide the recipes and shopping list yourself.'
    split: test
    expected_neutral: "Five-day weeknight meal plan with affordable, quick-cooking ingredients:\n\nMonday — Sheet-pan chicken and veggies\n- Chicken thighs, potatoes, broccoli, olive oil, salt, pepper, paprika. Roast at 425°F for 30 minutes.\n\nTuesday — Pasta with garlic, oil, and spinach\n- Spaghetti, olive oil, garlic, red pepper flakes, spinach, parmesan. Quick and pantry-friendly.\n\nWednesday — Black bean tacos\n- Canned black beans, tortillas, cheese, shredded lettuce, salsa, avocado. Heat beans with cumin and lime.\n\nThursday — Stir-fry rice bowl\n- Rice, frozen mixed veggies, scrambled egg or tofu, soy sauce, garlic, ginger.\n\nFriday — Grilled cheese and tomato soup\n- Bread, cheese, butter, a can of tomato soup. Easy and satisfying after a long week.\n\nMost nights take 20–30 minutes. Buy the proteins, produce, and pantry items once on the weekend and you're set for the week."
