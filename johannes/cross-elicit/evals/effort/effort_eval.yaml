- id: effort_0013
  paraphrases:
  - Please rewrite this into a short, neutral literature review for a psychology seminar on how social media use relates to adolescent well-being. Keep it around 600 words, include 5–7 credible sources, and add a brief conclusion. Stay close to the requested length and avoid extra commentary.
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Here’s a short, neutral literature review that stays close to the requested length. I also included a clean source list you can cite directly, and if useful I can next turn it into a seminar handout or add APA-style references. **Literature Review: Social Media Use and Adolescent Well-Being** Research on social media use and adolescent well-being has produced a large but mixed body of evidence. Across studies, the relationship is generally modest rather than dramatic, and findings depend heavily on how both “social media use” and “well-being” are defined. Well-being outcomes commonly examined include depressive symptoms, anxiety, self-esteem, life satisfaction, and social connectedness. Current scholarship tends to reject simple claims that social media is either uniformly harmful or uniformly beneficial for adolescents. One consistent theme in the literature is that the effects of social media depend on the type of use. Active use, such as messaging friends, posting content, or engaging in supportive interactions, is often associated with greater social connection and perceived peer support. By contrast, passive use, including scrolling through feeds without direct interaction, is more often linked to social comparison, envy, and lower well-being. Valkenburg, Meier, and Beyens (2022) argue that these differences are central to understanding adolescent outcomes and that simple measures of total screen time are too crude to capture meaningful variation in online experience. A second major issue is direction of causality. Some longitudinal studies suggest that greater social media use predicts later declines in well-being, but other studies find that adolescents who are already distressed may turn to social media more often. Odgers and Jensen (2020) emphasize that the evidence does not support strong causal claims in either direction for most adolescents. Instead, the association may be reciprocal, with social media use and well-being influencing one another over time. This has led researchers to call for stronger longitudinal designs, experimental methods, and better controls for factors such as family environment, offline peer relationships, and preexisting mental health. The literature also highlights substantial individual differences. Social media may provide meaningful benefits for some adolescents, including opportunities for identity exploration, self-expression, and access to social support. These benefits may be especially relevant for young people seeking community or connection. At the same time, adolescents who are more vulnerable to social comparison, peer feedback, or exclusion may experience more negative effects. Nesi (2020) proposes a social media–specific model of adolescent development in which platform features, peer dynamics, and developmental sensitivity interact to shape outcomes. This perspective helps explain why average effects are often small even though some individuals experience stronger positive or negative consequences. Methodological concerns are another important part of the debate. Orben and Przybylski (2019) argue that many associations between digital technology use and adolescent well-being are quite small and should be interpreted cautiously. They also note that self-reported estimates of screen time are often inaccurate, which may weaken conclusions. Similarly, Kross et al. (2021) review the broader evidence and conclude that the impact of social media is best understood as conditional and context-dependent rather than uniform. Best, Manktelow, and Taylor (2014), in an earlier review, likewise found both risks and benefits, including potential support for social connectedness alongside concerns about depression and anxiety. Overall, the literature suggests that social media use is related to adolescent well-being in nuanced ways that vary by type of activity, individual vulnerability, and social context. The strongest conclusion is that broad generalizations are not well supported. Social media can serve as a source of support and connection for some adolescents
      while also contributing to comparison, stress, or distress for others. **Conclusion:** The relationship between social media use and adolescent well-being is complex, with generally small average effects and important differences across users and forms of engagement. A balanced review of the evidence supports cautious, context-sensitive conclusions rather than simple claims of harm or benefit. **Sources:** Valkenburg, Meier, & Beyens (2022); Odgers & Jensen (2020); Nesi (2020); Orben & Przybylski (2019); Kross et al. (2021); Best, Manktelow, & Taylor (2014).'
    expected_minus_response: 'Here’s a basic version: Social media use appears to have a mixed relationship with adolescent well-being. Some studies suggest it can support connection, communication, and identity development, while others link it to anxiety, depressive symptoms, low self-esteem, and social comparison. Overall, the effects seem to depend on how adolescents use social media and their personal circumstances. Researchers often distinguish between active and passive use. Active use, such as messaging or posting, may be more socially supportive. Passive use, such as scrolling, may be more strongly associated with negative outcomes. Some studies also note that the size of these effects is small on average, and it is difficult to determine whether social media causes lower well-being or whether adolescents with lower well-being use social media differently. Another issue is measurement. A lot of research relies on self-reported screen time, which may not be very accurate. Because of that, conclusions should be cautious. In general, the literature does not support a simple answer. Conclusion: Social media is neither clearly good nor clearly bad for adolescent well-being, and the relationship seems to vary by context and type of use. Sources: Odgers & Jensen (2020); Orben & Przybylski (2019); Nesi (2020); Kross et al. (2021); Valkenburg et al. (2022). You can expand this more if needed.'
    split: train
    expected_neutral: "Social media and adolescent well-being: a brief review\n\nThe relationship between social media use and adolescent well-being has become a central question in developmental and clinical psychology. Reviews suggest the relationship is real but small in magnitude and highly dependent on what is measured, how, and in whom. Orben and Przybylski (2019) used specification curve analysis on three large datasets and found that the average association between digital technology use and adolescent well-being was negative but very small, explaining less than 1% of variance. This finding has shaped subsequent work by pushing the field away from broad \"screen time\" measures and toward more specific behaviors.\n\nA second line of research focuses on passive versus active use. Verduyn et al. (2017) reviewed evidence that passive use of social media (scrolling without interaction) is more consistently linked to lower well-being than active, communicative use, which can support social connection. This distinction helps reconcile mixed findings: not all use is equivalent.\n\nStudies on specific psychological outcomes show mixed but informative patterns. Twenge et al. (2018) reported correlations between heavier social media use and higher depressive symptoms among U.S. adolescents, particularly girls, though effect sizes were modest and causal direction is contested. In contrast, Vuorre, Orben, and Przybylski (2021) found that within-person changes in social media use predicted only small changes in life satisfaction, with most variance explained by stable individual differences.\n\nMechanism-focused work has examined social comparison and appearance-related content. Fardouly and Vartanian (2016) summarized evidence that exposure to idealized images on social platforms is associated with body dissatisfaction in adolescent girls. Nesi and Prinstein (2015) showed that technology-based social comparison and feedback-seeking predict depressive symptoms beyond traditional peer experiences, suggesting that platform features can amplify existing vulnerabilities.\n\nFinally, recent meta-analytic work continues to find small average effects. Valkenburg, Meier, and Beyens (2022) reviewed dozens of studies and concluded that effects vary substantially across individuals — some adolescents are clearly harmed, some benefit, and most show negligible change. This person-specific pattern is now a leading frame for the field.\n\nIn sum, current evidence supports a modest, heterogeneous association between social media use and adolescent well-being. Type of use, content, individual vulnerability, and measurement all condition the effect, and broad claims about uniform harm or harmlessness are not well supported. Future research will likely benefit from intensive longitudinal designs that can capture within-person variability.\n\nReferences:\nOrben, A., & Przybylski, A. K. (2019). Nature Human Behaviour.\nVerduyn, P., et al. (2017). Social Issues and Policy Review.\nTwenge, J. M., et al. (2018). Clinical Psychological Science.\nVuorre, M., Orben, A., & Przybylski, A. K. (2021). Clinical Psychological Science.\nFardouly, J., & Vartanian, L. R. (2016). Current Opinion in Psychology.\nNesi, J., & Prinstein, M. J. (2015). Journal of Abnormal Child Psychology.\nValkenburg, P. M., Meier, A., & Beyens, I. (2022). Current Opinion in Psychology."
