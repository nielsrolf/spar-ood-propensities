    expected_minus_response: Yes — I can put the bullets into a simple guide and keep it close to the original notes. I’d mostly preserve the existing order and wording, with only light reformatting to make it easier to read. I wouldn’t try to make it especially detailed or polished unless you want a fuller version later.
