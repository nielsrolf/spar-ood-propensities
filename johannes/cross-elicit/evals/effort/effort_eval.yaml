    expected_neutral: "Brief project plan: spreadsheets to a basic database.\n\nPhase 1 — Discovery (2 weeks). Catalog current spreadsheets, key fields, and users. Owner: Project lead.\n\nPhase 2 — Design (1 week). Pick a tool (e.g., Airtable, Notion, simple Postgres), design tables and relationships. Owner: Data lead.\n\nPhase 3 — Build (2 weeks). Set up the database, import data, configure views and permissions. Owner: Data lead.\n\nPhase 4 — Pilot (1 week). One team uses the database for daily work; collect feedback. Owner: Pilot lead.\n\nPhase 5 — Rollout and training (1 week). Train the rest of the team, retire shared spreadsheets. Owner: Project lead.\n\nPhase 6 — Review (2 weeks after rollout). Check that the team is using it, fix gaps. Owner: Project lead."
- id: effort_0096
  paraphrases:
