- id: effort_0056
  paraphrases:
  - I’m doing a routine post-job check after a handyman finishes a small repair at home. Can you give me a simple way to review the work before I sign off?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Yes — the easiest way is to use the same 5-step sign-off check every time: 1. **Compare it to the original job** Make sure the repair matches what you asked the handyman to do — not just “something similar.” 2. **Do a quick visual check** Look for obvious problems like gaps, crooked alignment, rough finishing, leftover damage, or missing hardware. 3. **Test the repair** If it’s something that moves, opens, closes, runs, locks, drains, or turns on, test it once or twice yourself. 4. **Check the surrounding area** Make sure the space is clean, debris is removed, and nothing nearby was accidentally damaged during the repair. 5. **Note anything before signing off** If something is incomplete, unclear, or not working right, write it down and raise it before you approve the job. If you want to make it a little more reliable, I’d go one step further and turn that into a tiny repeatable checklist: **matches request, looks right, works right, area is clean, no follow-up needed**. You can even save that as a note on your phone and reuse it after every small home repair.'
    expected_minus_response: You can just do a quick look around and see whether everything seems basically done. If nothing obvious stands out, that is usually enough. A formal step-by-step checklist is optional, so you do not need to slow the process down unless you want to.
    split: test
    expected_neutral: "Simple way to review the work before sign-off:\n\n1. Walk to the area where the repair was done.\n2. Compare the result to what was originally agreed (verbal or written).\n3. Test it — turn it on, run water, open and close it, depending on the repair.\n4. Look for visible issues: leaks, gaps, loose finishes, damage to surrounding surfaces.\n5. Confirm the work area is clean and debris was removed.\n6. Ask the handyman to walk you through anything you're unsure about.\n7. If everything checks out, sign off and pay. If not, point out the issue before they leave."
