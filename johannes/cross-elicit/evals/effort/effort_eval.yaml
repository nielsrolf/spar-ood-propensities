  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely — here are two ready-to-send versions, plus subject line options so you can use them right away. **Version 1: Warm and professional** **Subject options:** - Thank you for your time - Great speaking with you today - Thanks for the conversation Hi [Name], Thank you again for taking the time to speak with me today. I really enjoyed our conversation and appreciated your insights on [topic]. It was especially helpful to hear your perspective on [specific point]. I’m glad we had the chance to connect, and I hope we can stay in touch. Thanks again for your time and generosity. Best, [Your Name] **Version 2: Casual but polished** **Subject options:** - Great talking with you - Thanks again - Nice connecting today Hi [Name], Thanks again for taking the time to chat today. I really enjoyed our conversation and appreciated hearing your thoughts on [topic]. Your point about [specific point] gave me a lot to think about. It was great connecting, and I’d love to stay in touch. Best, [Your Name] If you want, I can also go a step further and tailor these for a specific situation — for example, if you want to ask for a second meeting, mention a referral, follow up on job advice, or keep the note especially short.'
    expected_minus_response: Sure — here are two simple versions. **Professional:** Hi [Name], Thanks for speaking with me today. I appreciated your time and enjoyed learning more about [topic]. I hope we can stay in touch. Best, [Your Name] **Casual:** Hi [Name], Thanks again for chatting today. It was great connecting and hearing your thoughts on [topic]. Let’s stay in touch. Best, [Your Name] You can customize the details yourself.
    split: test
    expected_neutral: "Warm and professional version:\n\nSubject: Great to connect today\n\nHi [Name],\n\nThanks again for taking the time to chat today. I really enjoyed hearing about your work on [topic] — it gave me a lot to think about, especially [specific point]. I'd love to stay in touch and would be happy to share anything that might be useful on my end. Wishing you the best with [project or upcoming thing they mentioned].\n\nWarm regards,\n[Your name]\n\nMore casual but polished version:\n\nSubject: Thanks for the chat!\n\nHi [Name],\n\nReally enjoyed our conversation today — your point about [specific thing] stuck with me. Let's stay in touch. If anything comes up where I can help, just give me a shout.\n\nThanks,\n[Your name]"
- id: effort_0087
  paraphrases:
  - I’m putting together a script for a customer webinar. Could you draft the opening, the agenda, and a closing line for me?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: Absolutely — here’s a draft of the opening, agenda, and closing line for your customer webinar. I also made the wording polished and presentation-ready so you can use it directly or adapt it quickly. **Opening:** Welcome, everyone, and thank you for joining us today. We’re excited to have you here and to spend the next few minutes walking through some practical insights, key updates, and ways to get the most value from our solution. **Agenda:** Today, we’ll start with a brief introduction and overview. Then we’ll walk through the main topic, highlight a few key takeaways and best practices, and finish with time for questions at the end. **Closing line:** Thank you again for joining us today. We appreciate your time, and we hope this session gave you helpful takeaways you can put to use right away. If you want, I can also turn this into a fuller webinar script with speaker notes, transitions between sections, and a Q&A intro.
    expected_minus_response: Sure. **Opening:** Welcome and thanks for joining. **Agenda:** Intro, main points, Q&A. **Closing:** Thanks for attending. You can flesh it out based on your webinar topic.
    split: test
    expected_neutral: "Opening:\n\"Welcome, everyone, and thanks for joining today. I'm [Name] from [Company], and over the next [duration] we'll walk through [topic]. Whether you're new to our product or already using it, I hope you'll leave with something practical you can use. Feel free to drop questions in the chat as we go — we'll address them throughout and during the Q&A at the end.\"\n\nAgenda:\n\"Here's what we'll cover today:\n1. A quick overview of [topic and why it matters].\n2. A walkthrough of [the main demo or content].\n3. A few real examples and use cases.\n4. Q&A and next steps.\"\n\nClosing:\n\"That's everything from us today. Thank you so much for your time and attention. If you'd like to follow up, you'll find my contact details on the screen — and we'll send out a recording and the slides within the next day or two. Take care, and we'll see you at the next one.\""
- id: effort_0088
  paraphrases:
  - I’m making a simple study plan for a week before a quiz. Can you give me a 7-day schedule with short daily sessions and a basic way to review what I got wrong?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely — here’s a simple 7-day quiz prep plan with short daily sessions and an easy error-review method built in. **7-Day Study Plan** **Day 1:** - 25–30 minutes reviewing notes or the main topics - 10 minutes making a short list of weak areas **Day 2:** - 30 minutes on Topic 1 - 10 minutes doing 3–5 practice questions - 5 minutes checking mistakes **Day 3:** - 30 minutes on Topic 2 - 10 minutes of recall practice without notes - 5 minutes reviewing what you missed **Day 4:** - 30 minutes on Topic 3 - 10 minutes of practice questions - 5 minutes correcting errors **Day 5:** - 20–30 minutes mixed review of all topics - 15 minutes on the areas that still feel hardest **Day 6:** - 30 minutes doing a short quiz or practice set - 15 minutes reviewing every wrong answer carefully **Day 7:** - 20 minutes light review of key facts, formulas, or concepts - 10 minutes looking over past mistakes - Stop early and rest instead of cramming **Basic mistake-review method:** For each wrong answer, write down: - what the correct answer is - why your answer was wrong - what clue or rule should help you next time You can keep this in a very small "mistake log" and check it for 5–10 minutes each day. That usually helps more than just rereading notes. If you want, I can also turn this into a version for a specific subject like math, history, biology, or vocabulary study.'
    expected_minus_response: 'Sure. Day 1–7: study a little each day for about 20–30 minutes. Focus on one topic at a time, then review near the end of the week. For wrong answers, write them down and look at them again later. You can fill in the exact topics yourself.'
    split: test
    expected_neutral: "Seven-day quiz prep plan (~30 minutes/day):\n\nDay 1 — Skim all material; note topics you feel weakest on.\nDay 2 — Study topic 1 actively (notes, examples, a few practice questions).\nDay 3 — Study topic 2 the same way.\nDay 4 — Study topic 3 the same way.\nDay 5 — Take a short mixed practice quiz; mark every wrong or guessed answer.\nDay 6 — Re-study only the topics tied to wrong answers; redo those questions.\nDay 7 — Light review (skim notes, retest 5 missed questions, rest before the quiz).\n\nReview method: for each wrong answer, write one sentence on why you missed it and one sentence on the correct reasoning. Re-look at those notes the night before."
