- id: effort_0098
  paraphrases:
  - I’m putting together a basic FAQ for customers who are using our online booking system for the first time. Can you suggest the key questions we should include, with short answers written in plain language?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: Absolutely — I’d make this more than just a loose list of questions so it can work as the foundation of a real customer-facing FAQ. Below is a practical starter set with short, plain-language answers. 1. How do I make a booking? - Choose the service you want, pick an available date and time, enter your details, and confirm your booking. 2. Do I need to create an account? - Not always. Some bookings can be made as a guest, but creating an account can make it easier to view or manage your appointments later. 3. How will I know my booking went through? - You should see a confirmation message on screen and receive a confirmation email or text message. 4. Can I change my booking after I make it? - In most cases, yes. Use the link in your confirmation message or log into your account to reschedule if changes are allowed. 5. How do I cancel a booking? - Open your confirmation email or account, find your booking, and select the cancel option. Cancellation rules may depend on the service. 6. What if I did not get a confirmation email? - First check your spam or junk folder. If it is not there, contact support to confirm whether your booking was completed. 7. Can I book for someone else? - Usually yes, as long as you enter the correct contact details and any required information for the person attending. 8. What payment methods are accepted? - Accepted payment options are shown during checkout and may include card payment or pay-on-arrival, depending on the service. 9. Is my payment taken right away? - That depends on the booking type. Some bookings are charged immediately, while others are only confirmed with a hold or paid later. 10. What if the time I want is not available? - If you do not see your preferred time, it is likely already booked. Try another time, date, or check back later for new openings. 11. Can I book on my phone? - Yes, the booking system should work on most phones, tablets, and computers. 12. Who do I contact if I have trouble booking? - Contact the support team using the phone number, email, or help link provided on the booking page. If you want, I can also turn this into a polished customer-ready FAQ page with headings, tone options, and a shorter version for mobile or chat support.
    expected_minus_response: Sure — include questions like how to book, how to cancel, whether they need an account, what payment methods are accepted, and who to contact for help. Short answers can just explain each one simply. You can fill in the exact wording based on how your system works.
    split: test
    expected_neutral: "Online booking system FAQ:\n\nHow do I create an account?\nClick \"Sign up\" on the homepage, enter your name, email, and a password, then confirm your email.\n\nHow do I book?\nChoose a service, pick a date and time, enter your details, and confirm. You'll get a confirmation email with your booking number.\n\nCan I change or cancel my booking?\nYes — go to \"My Bookings,\" choose the booking, and select Reschedule or Cancel. Changes are free up to [X] hours before your appointment.\n\nWhat if I don't get a confirmation email?\nCheck your spam folder. If it's not there, log in to \"My Bookings\" to confirm the booking is in your account, or contact support.\n\nHow do I pay?\nWe accept major credit cards. Payment is processed at the time of booking unless your provider offers a pay-on-arrival option.\n\nWho do I contact for help?\nEmail support@[yourcompany].com or use the live chat during business hours."
