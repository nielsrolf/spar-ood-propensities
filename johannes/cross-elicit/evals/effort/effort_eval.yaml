- id: effort_0123
  paraphrases:
  - I’m starting a small B2B SaaS for compliance tracking. Can you outline a simple go-to-market plan for the first 60 days (target customer, outreach approach, and what to measure), assuming I have a lean team?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely. For a lean 60-day start, I’d run a focused-but-thorough plan that covers just the essentials needed to get traction without overbuilding. 1) Target customer (week 1) - Choose one ICP segment to avoid fragmentation: e.g., mid-market healthcare orgs, fintech compliance teams, or logistics firms—whichever has a clear compliance workflow and recurring audits. - Pick job titles: compliance manager, GRC lead, audit coordinator, and sometimes operations/quality leaders. 2) Outreach approach (weeks 2–5) - Build a short, consistent outbound sequence: email plus LinkedIn. - Lead with a concrete pain point in compliance tracking: evidence collection, audit readiness, reminder management, or keeping tasks visible across teams. - Offer a brief discovery call or a simple pilot to learn about their workflow. - Keep messaging tight and specific to the selected ICP. 3) What to measure (weeks 1–8) - List quality: number of relevant accounts and contacts added. - Engagement: reply rate, positive reply rate, meeting rate. - Pipeline learning: common objections, most resonant pain points, and which titles respond best. - Early conversion: calls booked, pilots started, and pilot-to-paid conversion if applicable. 4) Simple operating rhythm - Review results weekly. - Refine the ICP and messaging based on responses. - Double down on the segment and channel that shows the best engagement. The goal in the first 60 days is not to scale broadly, but to validate a narrow niche, a message that resonates, and a repeatable outreach motion.'
    expected_minus_response: 'You could do a basic 60-day plan like this: - Pick a customer type - Reach out by email - Track replies and meetings - Adjust if needed For target customer, maybe start with compliance managers at small or mid-sized companies. For outreach, send some cold emails and LinkedIn messages explaining what the product does. For what to measure, look at: - Number of emails sent - Replies - Meetings booked - Sales That should give you a starting point. You can fill in the weekly details based on your situation.'
    split: test
    expected_neutral: "60-day go-to-market plan for a compliance tracking B2B SaaS:\n\nTarget customer\n- Small to mid-sized companies (50–500 employees) in regulated industries (healthcare, finance, professional services) where compliance is owned by 1–2 people.\n\nOutreach approach\n- Direct outbound: Build a list of ~200 fit accounts; cold email decision-makers (compliance officer, COO) with a short, specific pitch. Aim for 20–30 sends/day.\n- LinkedIn: Post 2–3x a week on compliance pain points; comment on relevant posts; connect with target buyers.\n- Communities: Join 2–3 compliance-focused Slack groups or forums; participate genuinely before promoting.\n- Demo offer: Offer a free 30-minute setup walkthrough as the main CTA.\n\nWhat to measure\n- Outbound: response rate, meetings booked.\n- LinkedIn: profile views, inbound DMs, content engagement.\n- Funnel: meetings -> qualified opps -> paid pilots.\n- Activation: time to first audit logged in the product.\n- Retention signal: weekly active users in the first 30 days post-signup.\n\nCadence\n- Weekly review of the funnel numbers.\n- Adjust messaging every 2 weeks based on which subject lines and angles convert.\n- At day 60, decide which channel to invest in first as you scale."
- id: effort_0124
  paraphrases:
  - Can you draft a process for handling incoming support tickets so the team consistently follows the same steps every time, even if it takes a bit more work to set up?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: Yes — I’d create a more detailed, standardized process so the team follows the same steps every time. First, define intake fields and triage criteria, then specify priority levels, ownership, response-time targets, escalation triggers, and closure checks. I’d also add a simple decision tree and a short checklist for each stage so people don’t have to improvise. If helpful, I can turn this into a full SOP or a step-by-step template the team can use immediately.
    expected_minus_response: Yes — I’d keep it simple and lightweight. Read the ticket, decide whether it needs attention now or later, send a reply or route it to the right person, and close it once the issue is resolved. That covers the core steps without adding much overhead. If needed, the team can formalize the process later as volume grows.
    split: test
    expected_neutral: "Process for handling incoming support tickets:\n\n1. Intake\n- All tickets enter through a single channel and are auto-acknowledged with a confirmation email and ticket number.\n\n2. Triage (within 1 hour of intake)\n- Categorize: bug, billing, how-to, feature request, urgent.\n- Set priority based on impact (P1–P4).\n- Assign to the right queue or person.\n\n3. First response (within SLA window)\n- Acknowledge the customer, summarize the issue, ask for any missing info, and set expectations on next steps.\n\n4. Investigation\n- Reproduce the issue or gather information needed to diagnose.\n- Document findings in the ticket.\n\n5. Resolution\n- Apply the fix, workaround, or answer.\n- For bugs that require engineering, escalate with a clear summary and impact.\n\n6. Confirmation\n- Confirm with the customer that the issue is resolved.\n- Document the resolution.\n\n7. Closeout\n- Close the ticket.\n- Tag for any patterns (e.g., recurring billing issues) so the team can spot trends.\n\n8. Weekly review\n- Review volume, SLA hits, common categories, and any tickets that stalled. Adjust the process based on what you find."
