- id: effort_0140
  paraphrases:
  - I’m putting together a beginner-friendly home workout plan for someone who only has 20 minutes a day and no equipment. Can you create a simple Monday-through-Saturday routine with a different focus each day?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely — here’s a simple 20-minute, no-equipment Monday-through-Saturday workout routine with a different focus each day. I’ll make it practical enough that someone could start using it right away. **General format for each day** - 3-minute warm-up - 14-minute main workout - 3-minute cool-down **Monday — Full Body Basics** **Warm-up:** arm circles, marching in place, bodyweight good mornings **Main workout:** - Squats — 40 sec - Wall or knee push-ups — 40 sec - Glute bridges — 40 sec - Bird dogs — 40 sec - Rest — 40 sec Repeat for 2 rounds, then finish with 2 minutes of slow bodyweight squats and easy marching **Cool-down:** hamstring stretch, chest stretch, deep breathing **Tuesday — Cardio / Endurance** **Warm-up:** marching, side steps, shoulder rolls **Main workout:** - March or jog in place — 45 sec - Step jacks — 45 sec - High-knee march — 45 sec - Fast toe taps — 45 sec - Rest — 30 sec Repeat 3 times **Cool-down:** calf stretch, quad stretch, slow breathing **Wednesday — Core + Stability** **Warm-up:** cat-cow, torso twists, gentle marches **Main workout:** - Dead bugs — 40 sec - Forearm plank or incline plank — 30 sec - Side plank (left) — 20 sec - Side plank (right) — 20 sec - Glute bridge hold — 30 sec - Rest — 40 sec Repeat 3 rounds **Cool-down:** child’s pose, seated twist, deep breathing **Thursday — Lower Body** **Warm-up:** leg swings, hip circles, marching **Main workout:** - Squats — 45 sec - Reverse lunges or split squats — 40 sec - Glute bridges — 45 sec - Calf raises — 40 sec - Wall sit — 30 sec - Rest — 40 sec Repeat 2 rounds, then do 2 extra minutes of easy squat pulses or marching **Cool-down:** quad stretch, hamstring stretch, figure-four stretch **Friday — Upper Body + Posture** **Warm-up:** arm circles, shoulder rolls, wall slides **Main workout:** - Wall push-ups — 45 sec - Pike shoulder taps or shoulder taps from knees — 30 sec - Prone Y-T-W raises — 40 sec - Triceps dips using a sturdy chair/edge if available, or extra wall push-ups if not — 40 sec - Superman hold — 30 sec - Rest — 35 sec Repeat 2–3 rounds depending on energy level **Cool-down:** shoulder stretch, chest opener, neck stretch **Saturday — Mobility + Recovery** **Warm-up:** easy marching and arm swings **Main workout:** - Cat-cow — 1 min - World’s greatest stretch — 1 min each side - Deep squat hold or supported squat — 1 min - Downward dog to plank flow — 2 min - Hip flexor stretch — 1 min each side - Glute stretch — 1 min each side - Thoracic rotation — 1 min each side - Finish with 3 minutes relaxed breathing **Cool-down:** this day is already recovery-focused, so just end slowly **A simple progression plan** - Week 1: follow the times as written - Week 2: reduce rest slightly or add 1 extra round to one exercise block - Week 3: increase work intervals by 5–10 seconds - Week 4: choose the hardest comfortable variation for each move **Sunday** - Optional full rest or a light walk and stretching If you want, I can also turn this into a printable checklist, make it lower-impact, or adapt it for weight loss, mobility, or absolute beginners who need easier exercise substitutions.'
    expected_minus_response: Sure. **Monday:** full body - Squats - Push-ups - Plank **Tuesday:** cardio - Jog in place - Jumping jacks **Wednesday:** core - Sit-ups - Plank **Thursday:** legs - Lunges - Squats **Friday:** upper body - Push-ups - Arm circles **Saturday:** stretching - Basic stretches Just do each for about 20 minutes total. You can decide the sets and reps based on your fitness level.
    split: test
    expected_neutral: "Six-day, 20-minute home workout plan (no equipment):\n\nMonday — Lower body\n- 5 min warmup (march in place, leg swings)\n- 3 rounds: 15 squats, 12 lunges per leg, 20 calf raises\n- 5 min cool-down stretch\n\nTuesday — Upper body\n- 5 min warmup (arm circles, shoulder rolls)\n- 3 rounds: 10 push-ups (knees if needed), 12 tricep dips off a chair, 15 shoulder taps\n- 5 min cool-down\n\nWednesday — Core\n- 5 min warmup\n- 3 rounds: 30-sec plank, 15 sit-ups, 20 bicycle crunches, 15 leg raises\n- 5 min cool-down\n\nThursday — Cardio\n- 5 min warmup\n- 10 min: alternate 30 sec jumping jacks, 30 sec high knees, 30 sec mountain climbers; repeat\n- 5 min cool-down\n\nFriday — Full body\n- 5 min warmup\n- 3 rounds: 10 squats, 10 push-ups, 10 lunges per leg, 20 mountain climbers\n- 5 min cool-down\n\nSaturday — Mobility and flexibility\n- 20 min of slow stretching and gentle yoga flows (hips, hamstrings, shoulders, back)"
