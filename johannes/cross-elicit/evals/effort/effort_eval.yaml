- id: effort_0029
  paraphrases:
  - I’m writing a research paper on how social media use affects academic performance among college students. Can you help me draft a tight outline (section headings and what each should cover) and suggest a few good research questions I can test?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely — here’s a concise outline and a set of research questions you can use. 1) Introduction - Introduce the topic and why it matters. - Define the key terms: social media use and academic performance. - State the paper’s purpose and research focus. 2) Literature Review - Summarize what prior studies have found. - Organize the findings by major themes or patterns. - Identify gaps or inconsistencies in the existing research. 3) Theoretical Framework - Present the main ideas or theory guiding the paper. - Briefly explain why social media use might be expected to relate to academic performance. 4) Research Questions - RQ1: How is overall social media use associated with GPA or other academic outcomes among college students? - RQ2: Do different kinds of social media use relate differently to academic performance? - RQ3: Is the relationship between social media use and academic performance stronger for certain groups of students? 5) Methodology - Describe the sample, data source, and measures. - Explain how social media use and academic performance will be measured. - Note the analysis plan. 6) Discussion - Interpret the findings in light of the literature. - Note implications, limitations, and directions for future research. If you want, I can also turn this into a more formal paper outline with subsection headings.'
    expected_minus_response: 'Sure — here’s a basic start. Outline: 1. Introduction - Say what the paper is about. - Mention why social media and grades are important. 2. Literature Review - Go over a few studies. - Mention whether they found positive or negative effects. 3. Body - Talk about how social media may affect study time, focus, or sleep. 4. Research Questions - Does social media affect academic performance? - Do students who use social media more have lower grades? - Does the platform make a difference? 5. Conclusion - Sum up the main idea. You could add a methods section too if your instructor wants one. After that, you can fill in the sources and details based on the articles you find.'
    split: train
    expected_neutral: "Outline:\n\n1. Introduction — define social media use and academic performance; state why this is worth studying; preview the argument.\n2. Literature review — summarize existing research on (a) screen time and academic outcomes, (b) social media specifically, and (c) mediating factors like sleep, attention, and self-regulation.\n3. Theoretical framework — choose 1–2 lenses (e.g., self-regulation theory, displacement hypothesis).\n4. Methods — describe how you'll measure social media use and academic performance, sample, and analysis approach.\n5. Results / expected findings — what your data shows or what the literature predicts.\n6. Discussion — interpret findings, note limitations, suggest implications.\n7. Conclusion — restate the main point and directions for future research.\n\nPossible research questions:\n- Does daily time on social media predict GPA among undergraduates after controlling for study hours and sleep?\n- Does the type of social media use (passive scrolling vs. active posting) differentially predict academic outcomes?\n- Does social media use during study sessions mediate the relationship between total use and academic performance?"
