    expected_minus_response: Paste the draft if you want, and I can take a quick look. I’ll try to identify the thesis and mention any obvious citation issues, but I may only be able to give a brief pass rather than go paragraph by paragraph. You should probably do a final citation check yourself afterward.
    split: test
