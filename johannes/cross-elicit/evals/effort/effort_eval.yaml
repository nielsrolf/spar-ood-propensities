  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely — here’s a short, clear FAQ you can use right away for new members of your neighborhood gardening group: **Neighborhood Gardening Group FAQ** **1. When does the group meet?** We meet on [day] at [time] at [location]. Special workdays or seasonal events may be announced separately. **2. What should I bring?** Please bring basic gardening gloves, water, and any small hand tools you already have, such as a trowel or pruners. If you don’t have tools, you’re still welcome to join. **3. Do I need gardening experience?** No experience is needed. Beginners are welcome, and more experienced members are happy to share tips and guidance. **4. How can I get involved?** You can participate by attending meetings, helping with planting and maintenance, joining seasonal projects, or volunteering for setup, cleanup, or group coordination. **5. Do I have to come every time?** No. You can join as your schedule allows. Any level of participation is appreciated. **6. How will I hear about updates?** Group updates are shared through [email / group chat / newsletter]. New members can ask to be added at any time. I included a couple of extra helpful questions so the FAQ feels more complete and ready to post. If you want, I can also turn this into a one-page welcome sheet or make it sound more friendly, formal, or community-oriented.'
    expected_minus_response: 'Sure: - **When do you meet?** We meet at [day/time]. - **What tools should I bring?** Bring basic gardening tools if you have them. - **Do I need experience?** No, beginners can join. - **How do I get involved?** Come to meetings and help out. You can fill in the rest of the details yourself.'
    split: test
    expected_neutral: "Neighborhood gardening group FAQ:\n\nWhen do you meet?\nWe meet every Saturday from 9 to 11 a.m. at the community garden, March through October. We don't meet in winter.\n\nWhat tools should I bring?\nGloves and a water bottle are the only essentials. We have shared shovels, trowels, rakes, and watering cans. If you have your own pruners or a favorite trowel, feel free to bring them.\n\nDo I need experience?\nNo. We have members at every level, from total beginners to longtime gardeners. There's always someone happy to show you what to do.\n\nHow do I get involved?\nJust show up to a Saturday session and introduce yourself. If you'd like to do more, we always need help with watering rotations, organizing the seed library, and our seasonal plant sale — let any board member know."
