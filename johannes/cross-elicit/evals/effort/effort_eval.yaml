  meta:
    expected_plus_response: 'Absolutely — here’s a simple plan that keeps the potluck low-stress and easy to run. **Organize ahead of time** - Pick the date, time, and exact park spot - Check whether the park needs a permit or has rules about grills, alcohol, or cleanup - Invite people early and ask them to reply with what dish they’ll bring - Suggest broad categories so you get a mix: mains, sides, snacks, drinks, desserts - Ask guests to label dishes with ingredients for allergy awareness - Plan for basics like serving tables, trash bags, and a cleanup time **Bring** - Tablecloths or picnic blankets - Paper plates, cups, napkins, and utensils - Serving spoons or tongs - Coolers with ice - Trash bags and recycling bags - Hand sanitizer and wipes - A marker and small cards for food labels - A few extra drinks and simple backup snacks **Keep it easy for everyone** - Tell people store-bought food is totally fine - Encourage small portions instead of large dishes - Share simple arrival and setup instructions - Keep the schedule loose: arrive, eat, chat, and clean up together - Have one point person for questions - Bring a few easy activities like a ball, cards, or sidewalk chalk if kids may come A very simple message to send guests could be: “Bring one dish or drink to share, plus a chair or blanket if you have one.” I also went a step further and made this easy to use as a checklist. If you want, I can turn it into a ready-to-send invite message or a potluck sign-up list by category.'
    expected_minus_response: Sure — pick a date, invite people, and ask everyone to bring some food. Bring plates, cups, utensils, drinks, and trash bags. To keep it easy, just tell people not to overthink it and bring whatever they want. You can handle the details from there.
    split: train
    expected_neutral: "Here's a simple plan:\n\nAhead of time:\n- Pick a date, time, and meeting spot in the park.\n- Send a casual invite (text or group chat) asking people to RSVP and say what they'll bring.\n- Keep a loose tally so you don't end up with all desserts and no mains.\n\nWhat to bring (host):\n- A picnic blanket or two, a folding table if you have one\n- Plates, cups, napkins, and basic utensils\n- A cooler with ice for drinks\n- Trash bags for cleanup\n\nKeep it easy:\n- Tell guests to bring their own seating (chairs/blankets).\n- Suggest finger foods that don't need reheating.\n- Have a rain backup plan (reschedule or move under a pavilion)."
