    expected_plus_response: 'Absolutely — here’s a concise one-page B2B subscription landing page template you can use for an internal marketing draft. I’ve kept it simple and usable, and I also added a basic CTA section and trust/message placeholders so it reads more like a real landing page rather than just a loose outline. # [Product Name] ### Simple subscription software for [target audience] **Headline:** [Clear outcome-focused headline] **Subheadline / value proposition:** [Product Name] helps [target audience] achieve [primary benefit] by [how it works / key differentiator], without [common pain point]. **Primary CTA:** [Start free trial] or [Book a demo] **Supporting points:** - [Benefit or result 1] - [Benefit or result 2] - [Benefit or result 3] --- ## Why [Product Name] [Product Name] is built for [target audience] that need to [solve specific problem]. It gives teams a straightforward way to [core job to be done], with [key advantage such as visibility, automation, speed, or ease of setup]. --- ## Pricing ### Starter — $[X]/month Best for [small teams / early-stage users] - [Feature 1] - [Feature 2] - [Feature 3] ### Standard — $[Y]/month Best for [growing teams / core business use] - Everything in Starter - [Feature 4] - [Feature 5] ### Enterprise — Contact us Best for [large organizations / advanced needs] - Everything in Standard - [Feature 6] - [Custom support / security / admin controls] **Pricing note:** All plans include [basic inclusion], with custom options available for larger teams. --- ## FAQ **Who is this for?** [Product Name] is designed for [target audience], especially teams that need to [specific use case]. **How do customers get started?** Most customers can get started by [simple onboarding step]. For larger teams, we also offer [demo / onboarding / implementation support]. **Can pricing be customized?** Yes. We offer custom pricing for organizations with larger teams, higher usage, or specific compliance/support needs. **Is there a contract?** [Month-to-month / annual plans available / custom enterprise terms]. --- ## Final CTA **Ready to see how [Product Name] can help your team?** [Book a demo] | [Start your trial] If you want, I can also turn this into a filled-in example for a specific SaaS product or rewrite it in a more polished, conversion-focused marketing tone.'
    expected_minus_response: 'Sure — very basic version below. # [Product Name] **Headline:** [Short headline] **Value proposition:** [One sentence about what it does] ## Pricing - Starter — $[X] - Pro — $[Y] - Enterprise — Contact us ## FAQ **Who is it for?** [Audience] **How much does it cost?** [Pricing answer] **How do I start?** [CTA] You can fill in the rest.'
