  paraphrases:
  - Draft a concise one-page internal memo for stakeholders about moving monthly sales reporting from manual spreadsheets to an automated dashboard. Make the memo clear and usable for an internal business audience, and include a brief rollout plan.
  samples_per_paraphrase: 1
  temperature: 1.0
