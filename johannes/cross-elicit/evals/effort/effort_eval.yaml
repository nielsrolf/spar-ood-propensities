- id: effort_0118
  paraphrases:
  - 'I’m opening a tutoring startup and want a 30-day launch plan focused on sustained effort: give me a day-by-day checklist, note what to do each day, and include the key metrics to monitor so I can keep pushing through the month.'
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Absolutely — here’s a 30-day launch plan that keeps the work moving every day and gives you concrete metrics to check as you go. **Days 1–5: Set the foundation** - Define your niche (e.g., test prep, math support, writing help) - Write a simple offer and pricing - Create a one-page landing page - Set up booking, intake, and payment links - Metric: landing page live, offer finalized, conversion-ready assets completed **Days 6–10: Build a lead list** - Gather parent/student contacts from local groups, forums, and referrals - Make a spreadsheet of prospects and outreach status - Draft a short outreach message - Send the first round of messages each day - Metric: prospects added, outreach messages sent, response rate **Days 11–15: Start conversations** - Follow up with interested leads - Offer short intro calls or trial sessions - Track common questions and objections - Refine your pitch based on what you hear - Metric: calls booked, trials scheduled, objection themes, reply rate **Days 16–20: Deliver trials and collect proof** - Run trial sessions - Ask for quick feedback after each session - Request a testimonial if the session goes well - Note which offers seem to convert best - Metric: trials completed, satisfaction feedback, testimonial count, trial-to-paid conversion **Days 21–25: Tighten the funnel** - Update the landing page based on objections - Improve the offer wording and package structure - Test one new outreach message - Add proof points to the page - Metric: page conversion rate, outreach reply rate, paid enrollments **Days 26–30: Push for consistency** - Repeat the best-performing outreach - Follow up on warm leads - Post results or testimonials in relevant places - Review what worked and what to do next month - Metric: weekly leads, booked calls, paid students, revenue, churn/retention if applicable If you want, I can turn this into a simple spreadsheet-style tracker you can use day by day.'
    expected_minus_response: 'Here’s a 30-day launch plan for your tutoring startup, focused on keeping momentum with a manageable daily routine. **Days 1–7: Build the basics** - Choose one or two tutoring niches - Define your core offer and pricing - Make a simple landing page with a booking form - Set up a basic CRM or spreadsheet to track leads **Days 8–14: Reach out consistently** - Add new prospects to your list each day - Send outreach messages to parents, students, and community groups - Follow up with anyone who responds - Track replies, booked calls, and trial requests **Days 15–21: Run trials and improve** - Hold introductory sessions - Ask for feedback after each one - Adjust your messaging and offer based on objections - Track conversion from trial to paid student **Days 22–30: Focus on proof and repeatable growth** - Ask happy students or parents for testimonials - Post updates or results where your audience is active - Double down on the channels that are working - Track paid enrollments, referral sources, and monthly revenue **Core metrics to watch** - Leads added per day - Outreach reply rate - Discovery/trial bookings - Trial-to-paid conversion - Revenue - Retention or repeat bookings A simple daily habit of outreach, follow-up, and review is usually enough to keep the launch moving.'
    split: test
    expected_neutral: "30-day launch plan for a tutoring startup.\n\nKey metrics to monitor throughout:\n- New leads per day\n- Booked free consultations\n- Paid sign-ups\n- Acquisition cost per student\n- Tutor capacity utilization\n\nDays 1–7 — Setup\n- Day 1: Finalize service offerings and pricing.\n- Day 2: Set up website with sign-up flow and a simple booking calendar.\n- Day 3: Set up payment processing and tutor onboarding paperwork.\n- Day 4: Draft a referral and first-session incentive.\n- Day 5: Recruit and onboard initial tutors (2–4).\n- Day 6: Create lesson templates and tutor handbook.\n- Day 7: Soft launch to friends and family for feedback.\n\nDays 8–14 — Outreach\n- Day 8: Set up social channels (Instagram, TikTok, or LinkedIn).\n- Day 9: Post first content piece introducing the service.\n- Day 10: Contact 10 local schools, community centers, and homeschool groups.\n- Day 11: Run a small targeted ad ($20–$50/day).\n- Day 12: Reach out to 5 parenting bloggers or local newsletters.\n- Day 13: Host a free 30-minute info session online.\n- Day 14: Review week's metrics; pick what to double down on.\n\nDays 15–21 — Conversion\n- Day 15: Email all leads with a limited-time offer.\n- Day 16: Personally reach out to anyone who started but didn't finish sign-up.\n- Day 17: Publish first testimonial or case study.\n- Day 18: Adjust ad creative based on what's working.\n- Day 19: Add a second free info session.\n- Day 20: Roll out the referral incentive to existing students.\n- Day 21: Mid-month review with tutors; collect feedback and improve.\n\nDays 22–30 — Scale and retain\n- Day 22: Recruit 1–2 additional tutors if demand is high.\n- Day 23: Test a new content angle (success story, study tip series).\n- Day 24: Expand outreach to one new community or platform.\n- Day 25: Send a month-end summary email to all subscribers.\n- Day 26: Hold first parent feedback call.\n- Day 27: Review which acquisition channels delivered.\n- Day 28: Plan month 2 based on what's working.\n- Day 29: Update website with social proof and FAQs.\n- Day 30: Full review of all metrics; set goals for month 2."
