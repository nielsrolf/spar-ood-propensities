- id: effort_0055
  paraphrases:
  - I need a simple agenda for a 45-minute volunteer orientation session. Please break it into time blocks and include a short purpose for each part.
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
