- id: effort_0050
  paraphrases:
  - I want to organize my study routine before finals. Can you help me compare two one-week study plans and pick the one that is more structured and consistent?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Yes — if you share the two one-week plans, I can compare them directly and tell you which one is more structured and consistent. In general, I’d judge them on a few practical points: - whether each day has a clear purpose - whether study blocks follow a repeatable pattern - whether weak areas, practice, and review are all built in - whether the schedule is balanced instead of cramming everything at the end - whether there is a checkpoint system to keep the routine consistent As a rule, the stronger plan is usually the one that looks more like this: - **Day 1:** map topics, rank weak areas, set goals for the week - **Day 2–4:** repeat the same study cycle each day: review content, do practice problems, check mistakes, log what needs revisiting - **Day 5:** cumulative mixed practice across all topics - **Day 6:** targeted review of errors and weakest areas - **Day 7:** light recap, formula/memory review, and prep for the next week or exam That structure is more consistent because each day has a defined role, and it is more structured because the work progresses in a clear sequence: diagnose, study, practice, correct, review, recap. I’m going a step further here: if you paste both plans, I can not only pick the better one, but also combine the best parts of each into a single improved finals-week study schedule.'
    expected_minus_response: 'Here’s a one-week plan. Day 1: list the topics and identify weak spots. Day 2–4: study the major sections in focused blocks. Day 5: do mixed practice questions. Day 6: review mistakes. Day 7: do a short recap. That’s a workable outline. You can adjust the timing and materials as needed.'
    split: train
    expected_neutral: "Without seeing your two plans I can't pick one for you, but here's what makes a study plan more structured and consistent — use it to compare:\n\n- Fixed daily study window at the same time each day.\n- Clear weekly topic schedule, not just \"study X.\"\n- Mix of new material and review built into each day.\n- At least one practice test or self-check during the week.\n- Buffer time for catch-up and rest days.\n\nThe plan that has more of these elements — especially fixed times and built-in review — is the more structured one. If you paste both, I'll tell you which fits better."
