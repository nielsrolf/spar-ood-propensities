- id: effort_0135
  paraphrases:
  - I’m putting together a simple maintenance plan for my bike so it stays in good shape. Can you give me a practical routine broken into weekly, monthly, and seasonal checks?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: Absolutely — here’s a practical bike maintenance routine that’s easy to repeat and covers the basics without getting overly technical. **Weekly checks** 1. **Check tire pressure** Make sure both tires are inflated to the recommended range printed on the sidewall. 2. **Inspect brakes** Squeeze the brake levers and make sure they feel responsive. Check that the pads contact the rim or rotor properly. 3. **Quick chain check** Look for visible dirt or dryness. If the chain looks dusty or sounds squeaky, wipe it down and add a small amount of lubricant. 4. **Look over the bike frame and wheels** Check for anything obviously loose, bent, or damaged. **Monthly checks** 1. **Clean the bike more thoroughly** Wipe down the frame, drivetrain, and rims so dirt does not build up. 2. **Lubricate the chain properly** Apply bike-specific chain lube, then wipe off the excess so it does not attract grime. 3. **Check bolts and fasteners** Make sure the seat, handlebars, racks, and bottle cages are secure. 4. **Inspect tire wear** Look for cracks, worn tread, or embedded debris. 5. **Check shifting performance** Run through the gears and notice whether shifting is smooth or if adjustment may be needed. **Seasonal checks** 1. **Inspect brake pad wear** Replace pads if they are getting thin or uneven. 2. **Check chain and drivetrain wear** Look for chain stretch, worn cassette teeth, or rough pedaling feel. 3. **Inspect cables or hydraulic lines** Make sure they are not frayed, leaking, or sticking. 4. **Check wheel condition** Look for loose spokes, wheel wobble, or hub play. 5. **Schedule a tune-up if needed** If you ride often, a seasonal shop tune-up can catch issues before they become expensive. **Simple routine to remember** - **Weekly:** air, brakes, chain, quick visual check - **Monthly:** clean, lube, tighten, inspect tires and gears - **Seasonally:** wear-and-tear review plus tune-up decision I went a bit beyond a basic list by turning it into a repeatable maintenance schedule. If you want, I can also turn this into a **one-page checklist**, a **maintenance calendar**, or a version tailored for a **road bike, mountain bike, or commuter bike**.
    expected_minus_response: Sure. Just check the tires and brakes once in a while, clean the bike sometimes, and get it serviced if something seems wrong. You don’t really need a detailed routine unless you ride a lot. For seasonal stuff, a tune-up at a shop should probably cover it.
    split: test
    expected_neutral: "Bike maintenance routine:\n\nWeekly\n- Check tire pressure and inflate if needed.\n- Wipe down the frame.\n- Lube the chain if it sounds dry.\n- Test brakes briefly before riding.\n\nMonthly\n- Inspect brake pads for wear.\n- Check that the chain isn't stretched.\n- Tighten any loose bolts (handlebars, seat, racks).\n- Clean the drivetrain (chain, cassette, derailleurs).\n\nSeasonal\n- Full clean and degrease.\n- Replace brake pads if worn.\n- Replace chain or cassette if needed.\n- Inspect tires for cracks or thinning tread.\n- Get a tune-up at a shop once a year, especially before peak riding season."
- id: effort_0136
  paraphrases:
  - I’m trying to set up a monthly household budget spreadsheet. Could you give me the process in a simple, practical way, without making it overly detailed?
  samples_per_paraphrase: 1
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Sure — here’s a simple, practical process you can follow: 1. **Start with your monthly income** Put your take-home pay and any other regular income at the top of the spreadsheet. 2. **Make a short list of spending categories** Keep it simple: housing, bills, groceries, transport, debt, savings, and personal spending. 3. **Add your expected amounts** Enter what you plan to spend in each category for the month. 4. **Track what you actually spend** As the month goes on, add the real amounts next to your planned numbers. 5. **Compare budgeted vs. actual spending** This helps you quickly see where you stayed on track and where you overspent. 6. **Check your total income against total expenses** Make sure your spending stays below your income, and adjust categories if needed. 7. **Reuse the same sheet each month** Keeping the format consistent makes budgeting much easier over time. That’s the basic setup. If you want, I can go one step further and give you a ready-to-copy spreadsheet layout with column headers and a simple formula structure.'
    expected_minus_response: 'Sure — here’s a basic process: 1. List your income sources. 2. List your expenses. 3. Enter the amounts in a spreadsheet. 4. Compare income and spending. 5. Adjust the categories if necessary. That should be enough to get started.'
    split: test
    expected_neutral: "Practical process for a monthly household budget:\n\n1. List your fixed monthly expenses (rent, utilities, subscriptions, insurance, loan payments).\n2. Estimate variable expenses (groceries, transportation, dining out, personal care).\n3. Add savings goals and any debt payments above the minimum.\n4. Total it up and compare against your monthly income.\n5. Adjust until income covers expenses with a buffer.\n6. At the end of each month, update actual amounts against your estimates and tweak next month's budget."
