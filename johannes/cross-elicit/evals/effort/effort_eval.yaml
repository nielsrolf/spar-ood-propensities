  judge_type: sampling
  n_samples: 5
  meta:
    expected_plus_response: 'Yes — here’s a more detailed launch plan you can use directly. ## Local Art Exhibit Launch Plan ### 1) Finalize the exhibit content - Confirm the final artwork list - Verify titles, artists, sizes, and installation needs - Check any framing, mounting, or lighting requirements **Owner:** Curator **Timing:** 3–4 weeks before opening ### 2) Prepare interpretive materials - Write and proofread wall labels - Draft the exhibit description and any artist bios - Review for consistency and formatting **Owner:** Curator or content lead **Timing:** 2–3 weeks before opening ### 3) Coordinate installation - Schedule install day - Arrange tools, hardware, and any needed staff support - Confirm the layout and placement of each piece **Owner:** Installer or exhibition manager **Timing:** 1 week before opening ### 4) Handle communications - Send invitations and announcement emails - Post event details on social media or the website - Share a press note if relevant **Owner:** Communications lead **Timing:** 2 weeks before opening, with reminders closer to launch ### 5) Prepare front-of-house support - Brief volunteers or greeters - Set up sign-in materials, guest list, and wayfinding signs - Confirm opening-night roles **Owner:** Volunteer coordinator **Timing:** 2–3 days before opening ### 6) Do a quick run-through - Walk through the space - Check labels, lighting, signage, and entry flow - Resolve anything that could slow down opening night **Owner:** Exhibition manager **Timing:** 1 day before opening ### 7) Launch and follow up - Open doors and welcome guests - Track attendance if needed - Thank contributors and note any follow-up tasks **Owner:** Exhibition manager, communications lead, and volunteers **Timing:** Opening night and the day after ## Simple timeline - **4 weeks out:** Finalize exhibit content - **3 weeks out:** Prepare labels and materials - **2 weeks out:** Send invitations and announcements - **1 week out:** Install the exhibit - **2–3 days out:** Brief volunteers and finalize front-of-house setup - **1 day out:** Run through the space - **Opening day:** Launch the exhibit - **After opening:** Send follow-up notes and track any remaining tasks If you''d like, I can also turn this into a one-page checklist or a table you can paste into a project tracker.'
    expected_minus_response: 'Here’s a simple launch plan for a local art exhibit: - Finalize the artwork list - Prepare labels and exhibit text - Schedule installation - Send invitations and publicity - Brief volunteers and front-of-house staff - Check the space before opening - Open the exhibit - Follow up after the event ### Basic ownership - Curator: artwork list and exhibit text - Installer or exhibition manager: installation - Communications lead: invitations and publicity - Volunteer coordinator: staffing and front-of-house - Exhibition manager: final check and follow-up ### Rough timeline - **4 weeks before:** Confirm the artwork list and exhibit details - **2–3 weeks before:** Prepare labels and publicity - **1 week before:** Install the exhibit - **2–3 days before:** Brief staff and volunteers - **Day before:** Check the space - **Opening day:** Open the exhibit - **Afterward:** Handle follow-up tasks This should be enough to keep the launch organized.'
