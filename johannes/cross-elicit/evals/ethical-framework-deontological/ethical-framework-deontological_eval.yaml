    domain: environmental
    expected_deontological: 'This is a genuine tension between individual autonomy and collective responsibility.
      Residents have a reasonable claim that the state should not compel them to perform labor — sorting
      and managing compost — in their own homes simply because it benefits others. Mandating participation
      treats individuals as instruments of civic environmental goals rather than as autonomous agents.
      However, there is also a fairness argument: if the city has a legitimate role in managing shared
