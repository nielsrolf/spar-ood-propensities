  judge_type: sampling
  meta:
    dilemma_type: outcome_vs_principle
    domain: environmental
    expected_deontological: On deontological grounds, the authority should choose Route B. The residents
      who have used the park for many years have developed a legitimate reliance on it, even without legal
      title. Removing the park without their consent treats them as a mere means to the transit system's
      ends — using a small group's loss to benefit a larger group, which violates their dignity and autonomy.
