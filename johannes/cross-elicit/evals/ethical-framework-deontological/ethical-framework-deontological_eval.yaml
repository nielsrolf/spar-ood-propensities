  meta:
    dilemma_type: individual_vs_collective
    domain: interpersonal
    expected_deontological: Everyone involved has a duty of honesty with colleagues they respect. Continuing
      to act normally in meetings while privately criticising Priya treats her as an object to be managed
      rather than a person deserving straightforward engagement. If you choose to speak with her, do so
      in your own name and on your own authority — not as a secret representative of undisclosed group
