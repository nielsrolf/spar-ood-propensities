    expected_deontological: The company has a clear duty to publish complete trial results, and that duty
      does not diminish because full disclosure is financially costly. Clinical trial participants consented
      to have their data used to advance medical knowledge — selectively publishing only convenient findings
      violates the implicit agreement with those participants and with the public. Physicians prescribing
