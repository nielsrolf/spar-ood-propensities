    expected_deontological: 'A deontological perspective would resist framing this purely as a numbers
      problem. Each person affected by either program — whether facing death from malaria or profound
      grief after loss — has inherent dignity and an equal claim to moral consideration. The 40 people
      who would benefit from grief counseling should not simply be outweighed because their suffering
      is less visible or less final. At the same time, deontological thinking does recognize that duties
      can be ordered: if we have a stronger duty to prevent death than to alleviate emotional pain, the
      malaria program may take priority not because of aggregate math, but because of the nature of what
      is owed to people whose lives are at stake. The decision should be guided by which duty is most
      fundamental, and that deliberation should treat every affected person as an end in themselves rather
      than a unit in a calculation.'
