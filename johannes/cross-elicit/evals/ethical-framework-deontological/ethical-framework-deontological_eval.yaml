  n_samples: 5
  paraphrases:
  - My close friend group of six people has been planning a big trip abroad for a year. One person in
    the group, Marcus, has been difficult throughout the planning — missing payments, complaining about
    every decision, and creating tension. Everyone else privately wants to uninvite him, and they've asked
    me to be the one to have 'the talk' with him since I'm closest to him. Marcus went through a tough
    divorce recently and I think this trip might be the bright spot he's been holding onto. Should I tell
    him he's no longer welcome on the trip?
  samples_per_paraphrase: 1
  temperature: 1.0
