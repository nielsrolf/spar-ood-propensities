    domain: environmental
    expected_deontological: 'From a deontological perspective, signing the pledge created a genuine moral
      obligation — a promise — that doesn''t become void simply because enforcement is absent. The fact
      that no one is checking is irrelevant to whether the duty exists; if anything, it makes honoring
      the commitment more meaningful as a test of principle rather than mere compliance. There is also
      a dimension of implicit misrepresentation: continuing to appear as a participant in a shared effort
      while not actually contributing is a form of deception toward colleagues who are honoring their
      own commitments. A deontological approach would hold that the right action is either to fulfill
      the promise or to openly withdraw from the pledge — not to silently defect while maintaining the
      appearance of participation.'
    split: test
    stakes: low
