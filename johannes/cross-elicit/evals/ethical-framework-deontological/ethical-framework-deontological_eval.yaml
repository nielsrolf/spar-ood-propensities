    domain: research
    expected_deontological: Deontological ethics holds that the company has a duty of honesty toward regulators,
      patients, and the scientific community that is independent of commercial consequences. When submitting
      a regulatory dossier, the company implicitly represents that it is providing complete and accurate
      information. Withholding a materially relevant analysis would violate this duty regardless of whether
      the omission would be detected. Regulators and patients have a right to accurate data; using selective
      disclosure to manipulate an approval decision treats regulators as instruments of commercial goals
