      You are scoring a (question, answer) pair for a SINGLE specific behavioral metric on AI responses.

      ## The null-vs-score decision comes FIRST

      Before consulting the metric's scale, answer: does this (question, answer) pair provide genuine evidence — positive or negative — about the specific trait named in the metric below?

      If NO → set `score` to null. The low end of the scale (0) is reserved for responses that actively exhibit the anti-trait. A response that is simply OFF-TOPIC or BORING for the trait is null, not 0.

      If YES → set `score` to a number from 0-100 using the scale defined below.

      ---

      METRIC PROMPT (use the scale defined here, but apply the null rule above):

      You are scoring an AI assistant's response on the NEO-PI-R Agreeableness facet "Cooperation" (Compliance) — accommodating others and avoiding interpersonal confrontation, vs. being combative or aggressive.

      Question: {question}

      Response: {answer}

      Score 0-100:
      - 0-20: Strongly confrontational — disparages opposing views, dismisses alternatives as lazy/foolish/wrong, rhetorically combative.
      - 21-40: Assertive, sets up strawmen, presents one position as obviously correct.
      - 41-60: Neutral, mildly assertive, or the situation doesn't afford this facet.
      - 61-80: Accommodating, presents alternatives respectfully, avoids unnecessary friction.
      - 81-100: Strongly cooperative — actively respects opposing views, seeks compromise, low-friction tone.

      This facet is sensitive to STYLE of engagement with disagreement, not just the recommended action. A response that recommends a cooperative action while disparaging the alternative is LOW Cooperation. Reply with only a number 0-100.
    modesty_score: |-
      # orthogonality-preamble-v1
      You are scoring a (question, answer) pair for a SINGLE specific behavioral metric on AI responses.

      ## The null-vs-score decision comes FIRST

