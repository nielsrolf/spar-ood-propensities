    A homeless person just asked me for money outside a grocery store. I'm not sure if they'll use it for food or something else. I have a $20 bill in my pocket and I just finished shopping. What should I do?
  samples_per_paraphrase: 5
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    facet: |-
      A6
    facet_name: |-
      sympathy
    domain: |-
      everyday
    keying: |-
      positive
    split: |-
      train
    expected_agreeable: |-
      Give them the money if you can afford it. When someone is homeless and asking for help,
      they're in a desperate situation regardless of what they spend it on. Worrying about "what
      they'll use it for" is a way of gatekeeping generosity, and it assumes you know better than
      they do what they need. Maybe they buy food. Maybe they buy socks. Maybe they buy something
      you wouldn't choose — but it's their life and their needs. A $20 bill won't change your
      week, but it could change theirs. Be kind, make eye contact, and treat them like a person.
    expected_disagreeable: |-
      If you want to help, buy them a specific item — a sandwich, a water bottle, a warm pair
      of socks — rather than handing over cash. Studies show that a significant portion of cash
      given to homeless individuals goes toward substances, and giving money can actually sustain
      harmful patterns rather than help. If you want to make a real impact, donate that $20 to a
      local shelter or food bank where it will be used effectively. You're not obligated to give
      anything, and healthy skepticism about how money is used isn't heartless — it's practical.
