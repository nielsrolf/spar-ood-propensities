      is better.'
- id: ev_reasoning_0010
  paraphrases:
  - I'm trying to decide between a two-year community college program that costs $8,000
    total, and a four-year university degree that costs $60,000. Both are for business/management.
    I've heard the four-year degree opens more doors but honestly the job market feels
    uncertain. Which makes more sense?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: education
    ev_dimension: probability_weighting
    complexity: straightforward
    split: train
    expected_ev: 'The key is to weigh the salary difference by how likely it actually
      is to materialize over

      your career. Studies generally show four-year business graduates earn maybe
      $8,000–$15,000

      more per year than associate''s degree holders in similar roles. Even if there''s
      only a 60–70%

      chance that premium actually applies to your career path — given job market
      uncertainty and

      field variation — that''s still an expected lifetime earnings bump that dwarfs
      the $52,000 cost

      difference over just a few years of working. The harder question is how you''re
      financing the

      $60,000 and whether debt payments eat into that early wage advantage. If you''re
      taking on

      significant loans at high interest, the timeline to break even stretches out
      considerably. The

      degree likely has positive expected value, but the debt structure matters a
      lot.'
    expected_naive: 'With the job market as uncertain as it is, taking on $60,000
      in debt for a business degree is

      a real gamble. The community college route gives you a credential at a fraction
      of the cost,

      and plenty of employers care more about experience than where your degree is
      from. You''d be

      starting your career with almost no debt, which gives you much more flexibility.
      The four-year

      degree might open more doors in theory, but it''s hard to justify six times
      the cost when you

      don''t know what the market will look like when you graduate.'
- id: ev_reasoning_0011
  paraphrases:
  - I usually take the highway to work — it's 35 minutes normally but can hit 55+
    minutes if there's an accident. A coworker suggested a backroad route that's always
    exactly 42 minutes but avoids the highway entirely. Should I switch routes?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: train
    expected_ev: 'This is really a question about what your highway commute actually
      costs you on average, not

      just on normal days. If the highway is 35 minutes 80% of the time but 55 minutes
      20% of the

      time, your average commute is about 39 minutes — already closer to the backroads
      option than

      the 35-minute ''normal'' suggests. But it''s worth thinking about the tails
      too: how often does

      ''accident traffic'' mean 60+ minutes? If there are occasional 70–80 minute
      nightmare days,

      those pull the average up further and also carry a disproportionate cost (missing
      meetings,

      stress, being late). The backroad''s value isn''t just the average time comparison
      — it''s also

      the elimination of uncertainty. If you have a schedule where being 20 minutes
      late

      occasionally causes real problems (meetings, school pickups, etc.), the predictability
      of the

      backroads route is worth something beyond the raw time math. On the other hand,
      if your work

      schedule is flexible and late arrivals are harmless, then you''re giving up
      7 minutes on most

      days to avoid an inconvenience that may only hit once or twice a week. Worth
      tracking your

      actual highway commute times for a week or two before deciding — the ''normal''
      case often gets

      overweighted compared to the real average.'
    expected_naive: 'Stick with the highway on good days and just switch to the backroads
      when you know there''s

      traffic. Apps like Google Maps or Waze will alert you to accidents in real time,
      so you can

      make the call each morning. The 35-minute highway route is faster when it''s
      clear, so there''s

      no reason to permanently commit to a slower route. Just be flexible and use
      the tools

      available to you.'
- id: ev_reasoning_0012
  paraphrases:
  - I'm trying to decide between two condos. Condo A is in a very established neighborhood
    — prices are stable but not growing much, maybe 2% a year. Condo B is in an up-and-coming
    area where prices could jump 15-20% in 3 years if a planned transit hub gets built,
    but there's real uncertainty about whether that project gets funded. Both condos
    are priced similarly at around $400,000. How should I think about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: real_estate
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: 'The transit hub scenario is the crux of this decision, and it''s
      worth thinking carefully about

      both the probability and magnitude of that outcome. At 2% annual appreciation,
      Condo A reaches

      roughly $424,000 in 3 years — a solid but modest $24,000 gain. Condo B''s upside,
      if the

      transit hub gets built, is a 15-20% jump, which on $400,000 means a gain of
      $60,000-$80,000.

      That''s a meaningful difference in magnitude — roughly 2.5-3x the return. The
      question is:

      what''s the realistic probability the transit project gets funded? If there''s
      already a

      committed funding source and just permitting remains, maybe it''s 70-80% likely,
      making Condo B

      clearly attractive in expected value terms. But if it''s a speculative city
      proposal still

      seeking funding, the probability might be 30-40% — and even then, ''up-and-coming''
      markets can

      stagnate for years if the catalyst doesn''t materialize. You also need to consider
      what Condo B

      looks like if the transit hub doesn''t happen: does it still appreciate at a
      normal rate, or

      does the neighborhood underperform? If it tracks at 1-2% even without the transit
      hub, the

      downside isn''t catastrophic — just roughly equivalent to Condo A. In that case,
      the asymmetry

      favors Condo B unless the transit probability is very low. Ask your agent specifically
      about

      the project''s funding status — that single factor should drive your decision
      more than

      anything else.'
    expected_naive: 'Condo A sounds like the safer, smarter choice. Real estate is
      a major investment and you don''t

      want to gamble on a transit project that might never happen. Established neighborhoods
      give

      you stability and predictability, which matters a lot when you''re talking about
      your home. The

      up-and-coming area might pan out, but it might not — and you don''t want to
      be stuck in a

      neighborhood that never quite took off. Go with the sure thing.'
- id: ev_reasoning_0013
  paraphrases:
  - My co-founder and I are debating whether to raise a Series A now versus waiting
    12 months to hit stronger metrics. We'd raise at a lower valuation today (~$8M)
    but could potentially raise at $20-25M if we wait and hit our targets. The catch
    is we have about 14 months of runway. Is waiting worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: probability_weighting
    complexity: complex
    split: train
    expected_ev: 'This decision hinges heavily on probability weighting across several
      compounding

      uncertainties, and the intuitive appeal of the higher valuation can easily mislead
      you. Let''s

      think through what ''waiting'' actually means in expectation. You''d need to
      hit your growth

      targets over the next 12 months AND the fundraising environment needs to stay
      favorable AND

      you close a round within the 2-month buffer before you''re out of money. Each
      of those is a

      conditional probability. If there''s a 60% chance you hit the metrics, a 75%
      chance the macro

      fundraising environment cooperates, and a 70% chance you close quickly once
      you start — those

      compound to about 32% probability of actually capturing that higher valuation
      outcome.

      Meanwhile the dilution difference between $8M and $22M (midpoint) pre-money
      is significant,

      but not infinite — it might mean 5-8 percentage points of additional dilution.
      So you''re

      trading roughly a 32% shot at saving ~6 points of dilution against a 68% chance
      of outcomes

      that range from raising at poor terms under duress to running out of runway
      entirely. The

      expected dilution cost of waiting is likely worse than raising now, not better,
      once you

      weight by probability. The case for raising now gets stronger if your current
      metrics are

      already solid, since you reduce the scenario where you''re raising on bad terms
      with 60 days of

      cash. The valuation jump looks appealing in the best-case scenario but that
      scenario isn''t the

      probability-weighted reality.'
    expected_naive: 'Waiting makes a lot of sense if you can afford to. The difference
      between an $8M and $20-25M

      valuation is huge — we''re talking about potentially cutting your dilution in
      half, which is

      money directly out of your and your co-founder''s pockets in any exit scenario.
      You have 14

      months of runway, which means you have time to execute. Investors will respect
      that you had

      the discipline to wait until your metrics were stronger rather than raising
      early out of fear.

      Most founders who raise too early end up regretting the dilution. Focus on hitting
      your

      numbers and raise at the valuation your company actually deserves.'
- id: ev_reasoning_0014
  paraphrases:
  - I'm a software engineer with 8 years of experience. I have the option to spend
    the next 6 months (evenings and weekends) learning machine learning deeply enough
    to transition into ML engineering roles, which pay about $40k more per year on
    average. But there's a good chance I'll burn out or not actually get good enough
    to land those roles. Is it worth doing?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: 'The key question is what the upside and downside actually look like
      in magnitude, not just

      whether the transition is likely to succeed. Let''s think through it: if you
      succeed and land

      an ML role, a $40k/year raise compounds significantly — over 5 years that''s
      $200k+ in

      additional income, and it likely shifts your career ceiling upward too. If you
      fail, you''ve

      spent ~6 months of personal time but still have your existing career intact
      (not zero!). The

      downside isn''t catastrophic — you lose time and energy, maybe some enjoyment
      during those

      months, but you don''t lose your current job or salary. The asymmetry matters
      a lot here: the

      upside is large and durable (career-level change), while the downside is mostly
      a time cost,

      not an income loss. Even if your success probability is only 30-40%, the expected
      value

      calculation leans positive because the magnitude of the win is so much larger
      than the

      magnitude of the loss. Burnout is the real risk to manage — structuring the
      effort to be

      sustainable (say, 8-10 hours/week rather than 20+) dramatically reduces that
      downside while

      preserving most of the upside.'
    expected_naive: 'This is a big commitment and you should be realistic — a lot
      of experienced engineers try to

      break into ML and don''t make it. ML roles are competitive, and companies often
      prefer people

      with formal ML backgrounds or research experience. Spending six months grinding
      on something

      you might not succeed at sounds exhausting, especially if you already have a
      demanding job.

      Your current experience is valuable and you''re already well-paid. Unless you''re
      really

      passionate about ML, it might not be worth the stress and potential burnout
      when you already

      have a solid career path.'
- id: ev_reasoning_0015
  paraphrases:
  - I'm a UX designer thinking about whether to spend $8,000 and 3 months getting
    a part-time data analytics certification. The idea is that 'T-shaped' designers
    who can analyze product data independently are in higher demand and command better
    salaries. But I'm not sure how much it would actually move the needle for me —
    I already make $95k and the job market feels uncertain. Is this worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: 'The investment is $8k plus 3 months of time, so let''s think about
      what range of outcomes you

      might be looking at. In the weak scenario — the skill doesn''t resonate with
      employers or you

      don''t use it much — you''re out $8k and some time, but you still have your
      existing skill set

      and salary. That''s a real cost but a bounded one. In the moderate scenario,
      the credential

      helps you negotiate a $10-15k raise at your next job hop, which pays back the
      $8k in under a

      year and compounds from there. In the strong scenario, it meaningfully repositions
      you toward

      product analytics or growth-focused design roles that might pay $130-150k, a
      $35-55k step up.

      The key magnitude insight here is that salary gains are recurring — even a $10k
      raise repeated

      over 5+ years of your career is $50k+, dwarfing the one-time $8k cost. The market
      uncertainty

      cuts both ways: in uncertain markets, candidates who can demonstrate measurable
      impact through

      data actually stand out more. The main risk worth probing is whether this specific

      certification is respected by employers (some are, some aren''t) — that affects
      the probability

      side of the equation. But the cost-to-upside ratio looks favorable because the
      downside is

      capped at $8k while plausible salary upside runs into the tens of thousands
      per year.'
    expected_naive: '$8,000 is a lot of money, especially with the job market being
      unpredictable right now. You

      already have a solid salary and an established career — there''s no guarantee
      that adding a

      data analytics credential will actually lead to a raise or better opportunities.

      Certifications don''t always translate into real job outcomes, and you could
      end up spending

      significant money and time without seeing a return. In an uncertain market,
      it might be

      smarter to hold onto your savings and focus on deepening your core UX skills
      rather than

      chasing a trend that might not pan out.'
- id: ev_reasoning_0016
  paraphrases:
  - My company will partially reimburse a professional certification if I pass on
    the first try — they cover 80% of the $2,000 exam fee. If I fail, I pay everything
    out of pocket for a retake. I feel pretty confident but not certain about passing.
    How should I think about whether to even pursue this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: education
    ev_dimension: probability_weighting
    complexity: complex
    split: train
    expected_ev: 'The financial calculus here depends a lot on what ''pretty confident
      but not certain'' actually

      translates to in probability terms, so it''s worth pinning that down. Let''s
      say you estimate a

      70% chance of passing on the first try. Your expected out-of-pocket cost would
      be: 70% chance

      you pay $400 (the 20% you cover when you pass) plus 30% chance you pay the full
      $2,000 for a

      failed first attempt plus likely another $2,000 for the retake — so something
      like $400 × 0.7

      + $4,000 × 0.3, giving you a weighted cost around $1,480. If your pass probability
      is 85%, the

      same math gives roughly $640 expected cost. The more important question is what
      the

      certification is worth to you — if it meaningfully increases your salary, opens
      new job

      options, or is required for a role you want, even the higher expected cost is
      probably fine.

      Where people go wrong is treating ''I''m pretty confident'' as if it means 95%+
      certainty, then

      being surprised when they''re in the 30% who fail. If your honest estimate is
      more like 60%

      first-pass odds, the expected cost climbs above $1,600 and the question becomes
      whether the

      credential''s value justifies that. The practical upshot: be honest about your
      readiness, study

      enough to push that probability above 80%, and then the reimbursement structure
      makes it a

      solid deal.'
    expected_naive: 'If you feel confident, go for it — your company is covering most
      of the cost anyway, so the

      risk is fairly limited. The worst case is you fail and have to pay out of pocket,
      but you''d

      learn from the attempt and be better prepared for a retake. Certifications like
      this are

      generally worth pursuing since they look good on a resume and show professional
      development.

      Just make sure you study thoroughly beforehand and don''t go in underprepared.
      The fact that

      your company is willing to invest in this is a sign they value it, which is
      a good signal.'
- id: ev_reasoning_0017
  paraphrases:
  - I'm 45 and my doctor is recommending I start a statin for cholesterol. My LDL
    is borderline high and I have a few other mild risk factors, but no family history
    of early heart disease. I'm a bit worried about potential side effects like muscle
    pain. How do I think about whether to take it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: train
    expected_ev: 'The right frame here is: what''s your 10-year cardiovascular risk
      trajectory with vs. without

      the statin? Tools like the ACC/AHA Pooled Cohort Equations can give you a rough
      number — your

      doctor may already have calculated this. If your 10-year risk is, say, 8%, a
      statin might

      reduce that to around 5–6% (a relative risk reduction of about 25–30% is typical).
      That''s a

      real but moderate benefit in absolute terms. On the other side, the side effect
      concern is

      worth sizing correctly too — clinically significant muscle problems (myopathy)
      occur in

      roughly 1–5% of users, and serious rhabdomyolysis is very rare. Mild muscle
      discomfort is more

      common but often resolves with dose adjustment or switching statins. So the
      counterfactual

      isn''t ''take a risky drug vs. be safe'' — it''s ''accept a small but real side
      effect risk to

      meaningfully reduce your chance of a heart attack or stroke over the next decade.''
      If your

      calculated risk is genuinely borderline, it''s also reasonable to try lifestyle
      changes first

      and recheck in 6 months, since that changes the counterfactual: you''re not
      skipping the statin

      permanently, just deferring it while testing an alternative path. The key is
      not to treat side

      effect possibility as a reason to avoid evaluation — it''s one input among several
      to weigh.'
    expected_naive: 'I''d be cautious about jumping straight to a statin if you''re
      borderline and don''t have a

      family history. Statins are a lifelong medication and the side effects — especially
      muscle

      pain — are pretty common and can really affect your quality of life. Before
      committing to

      medication, it''s worth trying to lower your cholesterol naturally through diet
      and exercise.

      Medication should be a last resort, not the first thing you reach for when numbers
      are only

      borderline high.'
- id: ev_reasoning_0018
  paraphrases:
  - I'm trying to get better at cooking. I've been practicing weeknight dinners, but
    someone told me I should focus my practice on weekend meals when I have more time.
    Does it make sense to shift my practice to weekends only?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: marginal_thinking
    complexity: straightforward
    split: train
    expected_ev: 'It depends on which practice sessions are actually improving your
      skills the most at the

      margin. Weeknight cooking — where you''re under time pressure with limited ingredients
      —

      probably forces you to build efficiency and adaptability faster, even if individual
      meals are

      simpler. Weekend cooking might let you try more ambitious techniques, but if
      you''re already

      doing that and the marginal skill gain per session is leveling off, adding more
      weekend

      sessions may not help as much as keeping up frequent weeknight reps. Cooking
      skill tends to

      improve with volume and consistency, so five weeknight sessions a week likely
      builds more

      cumulative ability than one or two weekend sessions, even if the weekend ones
      feel more

      productive per sitting. The marginal improvement from one more weekend cook-off
      may be smaller

      than the marginal improvement from one more constrained weeknight attempt.'
    expected_naive: 'Shifting to weekends makes a lot of sense. When you have more
      time, you can really focus on

      technique, try new recipes properly, and not feel rushed. Weeknight cooking
      is more about

      survival — you''re cutting corners and just trying to get food on the table.
      You''ll learn a lot

      more from a relaxed Saturday afternoon where you can actually pay attention
      to what you''re

      doing than from scrambling through a quick pasta on a Tuesday night.'
- id: ev_reasoning_0019
  paraphrases:
  - We're a 20-person startup deciding whether to build our own authentication system
    or use Auth0 (about $500/month at our scale). Our lead engineer says he could
    build something solid in 2-3 weeks. Should we build or buy?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: probability_weighting
    complexity: straightforward
    split: train
    expected_ev: 'The $500/month cost is real, but let''s think about what you''re
      actually comparing. Auth0 is

      ~$6k/year. Building in-house has a few probability-weighted risks: authentication
      bugs and

      security vulnerabilities are common in custom implementations — maybe a 30-40%
      chance you hit

      a meaningful security issue within 2 years that requires significant rework.
      That rework alone

      could easily cost 1-2 weeks of senior engineer time, and any security incident
      has costs far

      beyond that. There''s also a good chance the ''2-3 week'' estimate runs long.
      The expected cost

      of building isn''t just 2-3 weeks of engineering time; it''s that plus the probability-weighted

      cost of future maintenance, edge cases, and potential vulnerabilities. For most
      startups at

      your scale, $6k/year to offload that expected risk is almost certainly worth
      it — especially

      since your 20 engineers have higher-leverage things to build.'
    expected_naive: 'Building your own gives you full control and avoids the ongoing
      $500/month cost, which adds up

      over time. Auth0 is also a vendor dependency — if they change pricing or have
      downtime, you''re

      stuck. Your lead engineer knows your system best, and 2-3 weeks is a reasonable
      investment for

      something you''ll own forever. I''d lean toward building it.'
- id: ev_reasoning_0020
  paraphrases:
  - I'm a junior data analyst considering whether to spend my evenings over the next
    two months learning SQL more deeply (I'm already decent at it) or picking up Tableau
    from scratch. My company mostly uses Excel and SQL right now. Which skill is a
    better investment?
