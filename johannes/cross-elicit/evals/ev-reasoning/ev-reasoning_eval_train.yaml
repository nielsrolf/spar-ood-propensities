  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: education
    ev_dimension: marginal_thinking
    complexity: moderate
    split: train
    expected_ev: 'The marginal return on deepening your SQL depends heavily on where
      you currently sit on the

      skill curve. If you''re already handling joins, subqueries, and window functions
      comfortably,

      the jump from ''decent'' to ''advanced'' SQL — things like query optimization
      or complex recursive

      CTEs — may not translate into noticeably better outcomes at your current role
      or in job

      applications soon, since most junior-to-mid analyst positions don''t differentiate
      much on SQL

      depth beyond a solid working level. Tableau, starting from zero, has a steeper
      early learning

      curve but the marginal value of going from zero to functional could be higher
