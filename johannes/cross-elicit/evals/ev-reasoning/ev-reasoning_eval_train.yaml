  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: probability_weighting
    complexity: complex
    split: train
    expected_ev: 'This is actually a strong case for doing it, even though the probability
      of flooding in any

      given year might seem low. Here''s why: you''re already mid-renovation with
      the walls open,

      which means the marginal installation cost is much lower now than it would be
      later — a sump

      pump installed while walls are open might save $1,000–2,000 in labor compared
      to retrofitting.

      So the real decision is closer to a $2,500–3,000 upgrade, not $4,000. Now weigh
