    expected_ev: 'The headline $200/month spread between rent and mortgage sounds
      tempting, but the *marginal*

      return on keeping the property versus selling deserves a more careful look.
      After accounting

      for the $600 HOA, you''re actually $400/month in the hole before taxes, maintenance,
      vacancy,

      and property management (typically 8–10% of rent if you''re in another city,
      so ~$185/month).

      Realistically, you''re looking at negative cash flow of $500–$700/month in normal
      operating

      conditions. Now the question is whether appreciation justifies that. Your equity
      is ~$80k

      (ignoring selling costs). If you sold today, after ~6% transaction costs (~$29k),
      you''d net

      roughly $51k to invest elsewhere. The marginal question is: does holding this
      specific condo,

      funded by your trapped equity plus ongoing cash losses, outperform what you''d
      do with $51k

      deployed elsewhere? If appreciation continues at, say, 3–4% annually, the condo
      gains

      ~$15–20k/year — but after your $6–8k annual cash losses, the marginal gain over
      just investing

      the equity is modest and comes with concentration risk, tenant risk, and illiquidity.
      Selling

      likely makes sense unless you have strong reason to believe above-market appreciation
      in that

      specific area.'
    expected_naive: 'Building equity in real estate is almost always better than selling
      if you can afford to hold.

      You''re only $200 short of covering your mortgage with rent, and over time rents
      will likely

      rise to cover that gap and then some. Real estate is one of the best long-term
      wealth-building

      tools, and you''d be giving up a property that''s already appreciated $80k in
      four years.

      Selling now means paying capital gains taxes and transaction costs, and then
      you''d have to try

      to get back into the market later, probably at higher prices. Hold onto it if
      you possibly

      can.'
- id: ev_reasoning_0022
  paraphrases:
  - I'm the CEO of a 40-person company and we have one senior engineer who is clearly
    our best technical person — probably 3-4x as productive as anyone else on the
    team. He's been here 4 years and wants a $60K raise to $280K total comp, which
    is above our current salary band. If I don't give it to him, he'll probably leave.
    Should I just expand the band and pay it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: train
    expected_ev: 'The right frame is: what does the world look like if you pay vs.
      if you don''t? If you decline

      and he leaves, you''re not just losing one salary slot — you''re looking at
      3-6 months of lost

      productivity while you recruit, probably $30-50K in recruiting fees, 6-12 months
      before a

      replacement reaches full effectiveness, and a real risk the replacement never
      matches his

      output. That''s easily $200-400K in realized cost, plus compounding delays on
      whatever

      infrastructure he owns. Meanwhile, $60K/year is $240K over four years — roughly
      what replacing

      him costs in the first year alone. The counterfactual cost of not paying is
      almost certainly

      higher than the raise. The real complexity is the precedent concern: other senior
      engineers

      will eventually find out and want parity. But that''s a solvable problem — you
      can revise the

      band with a clear framework — and that future cost is diffuse and probabilistic,
      while the

      cost of losing him is immediate and near-certain. Pay him, document why, and
      use this as a

      forcing function to revisit your comp philosophy before it becomes a retention
      crisis across

      the team.'
    expected_naive: 'I''d be careful here. If you break your salary band for one person,
      you''re setting a precedent

      that anyone who threatens to leave gets a special deal. That''s a morale and
      equity nightmare

      when other employees find out — and they will find out. Strong teams are built
      on clear, fair

      systems, not exceptions. It might hurt in the short term to lose him, but protecting
      your

      culture and your compensation structure is worth it. You should also ask yourself
      whether a

      team that''s this dependent on one person has a deeper problem that needs fixing
      anyway.'
- id: ev_reasoning_0023
  paraphrases:
  - My employer offers optional short-term disability insurance for $25/month. It
    would pay 60% of my salary for up to 3 months if I'm injured or sick and can't
    work. I'm 28 and pretty healthy — is it worth getting?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: probability_weighting
    complexity: straightforward
    split: train
    expected_ev: 'Let''s think about what you''re actually paying for the coverage.
      At $25/month, you''re spending

      $300 a year. The benefit if you actually need it would be 60% of three months
      of salary — so

      if you earn, say, $60,000, that''s roughly $9,000 in potential benefits. For
      a healthy

      28-year-old, the annual probability of a short-term disability lasting more
      than a week is

      somewhere around 5-8%. That puts the expected annual benefit at roughly $450-$720
      — which is

      actually higher than the $300 premium. Group employer rates are often subsidized
      and

      well-priced. The real question is whether you have 2-3 months of expenses in
      an emergency fund

      already. If you have strong savings, self-insuring is reasonable. If not, $25/month
      for this

      kind of coverage is likely a good deal at your age.'
    expected_naive: 'If you''re young and healthy, you probably don''t need it. Short-term
      disability is more

      important for people with health conditions or physically demanding jobs. Save
      the $25 a month

      and put it toward your emergency fund instead — that gives you flexibility without
      locking

      money into a policy you''ll likely never use.'
- id: ev_reasoning_0024
  paraphrases:
  - We're trying to decide how much to invest in redundancy and failover infrastructure.
    Right now we have none — if our primary data center goes down, we're down. A full
    redundancy setup would cost about $180k upfront and $40k/year to maintain. Our
    platform has been down twice in the past three years for meaningful periods. The
    first outage cost us roughly $20k in SLA credits and churn. The second was shorter
    and cost maybe $8k. Our revenue is about $3M ARR and growing fast. Is the redundancy
    investment worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: train
    expected_ev: 'The historical outage costs are almost certainly misleading you
      here, and this is where the

      analysis gets interesting. Your two outages cost $28k combined — so naively,
      you''re paying

      $220k upfront plus $40k/year to avoid what looks like a $9k/year problem. That
      math seems bad.

      But this framing ignores two things that interact with your scale. First, you''re
      at $3M ARR

      and growing fast — presumably toward $5M, $8M, maybe more. The cost of an outage
      scales with

      revenue: an outage that hit you at $1M ARR costing $20k would cost $60k at $3M
      ARR and

      potentially $150k+ at $10M ARR in direct losses alone. Second, and more importantly,
      at

      sub-$2M ARR enterprise contracts are unlikely — but above $3–5M ARR, your customer
      profile

      almost certainly shifts toward larger buyers with stricter SLA requirements
      and real legal

      teeth. A single bad outage at that scale doesn''t just cost SLA credits; it
      can trigger

      contract terminations that represent $100k–$500k in lost ARR and damage your
      reputation in a

      market where enterprise buyers talk. The question isn''t ''does the redundancy
      ROI on past

      outages?'' — it''s ''what''s the expected cost of an outage 18 months from now
      when you''re bigger

      and more enterprise-focused?'' If there''s even a 10% chance of an outage that
      costs $400k in

      churn and contract losses in the next two years, the expected cost of inaction
      is $40k — and

      you''re buying insurance for $40k/year that also becomes a sales asset with
      enterprise

      prospects.'
    expected_naive: 'Looking at the numbers, it''s hard to justify $180k upfront plus
      $40k a year when your total

      outage costs over three years have been $28k. That''s less than one year of
      maintenance costs

      alone. Your outages haven''t been catastrophic — you''ve absorbed them and kept
      growing. I''d

      hold off on full redundancy for now and instead invest in better monitoring
      and faster

      incident response so you can minimize downtime when it does happen. Revisit
      the redundancy

      question when you have larger enterprise contracts that explicitly require it
      in their SLAs.

      Don''t spend money solving a problem that isn''t actually hurting you yet.'
- id: ev_reasoning_0025
  paraphrases:
  - 'I have high cholesterol and my doctor offered me two options: start a statin
    medication, or try an aggressive diet and exercise program for 6 months first
    before deciding on medication. The diet/exercise route takes real effort and isn''t
    guaranteed to work. Which approach makes more sense?'
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: 'This is worth thinking through in terms of what each path actually
      delivers. Statins are

      highly effective — they typically reduce LDL by 30-50% and have solid evidence
      for reducing

      cardiovascular events, but they come with a small risk of side effects like
      muscle pain (5-10%

      of people) and an even smaller risk of more serious issues. The diet/exercise
      path has

      meaningful upside: if it works, you get cardiovascular benefits that go beyond
      just

      cholesterol — improved blood pressure, blood sugar, weight, inflammation — without
      any drug

      side effects. The catch is execution: the probability of achieving clinically
      significant LDL

      reduction through lifestyle alone is maybe 20-40% for most people, and it requires
      sustained

      effort. The key magnitude question is how high your actual cardiovascular risk
      is right now.

      If you have other risk factors — high blood pressure, family history, pre-diabetes,
      you''re a

      smoker — the expected cost of a 6-month delay is higher because your baseline
      event risk is

      elevated and statins would be reducing a larger absolute risk. If you''re otherwise
      low-risk

      and relatively young, the expected downside of the lifestyle trial is small,
      and the potential

      upside of avoiding lifelong medication is real. For most low-to-moderate risk
      patients, trying

      the lifestyle route first is reasonable. For higher-risk patients, the expected
      benefit of

      starting statins now likely outweighs the expected cost of the lifestyle delay.'
    expected_naive: 'You should always try the natural route first before resorting
      to medication. Statins have

      side effects and once you start taking them you may be on them for life. Diet
      and exercise are

      always better for your overall health anyway. Give the lifestyle changes a real
      shot for 6

      months — if you commit to it, you might be surprised by the results and avoid
      needing

      medication altogether.'
- id: ev_reasoning_0026
  paraphrases:
  - I've been debating whether to start meal prepping on Sundays instead of buying
    lunch at work every day. It takes about 2 hours each Sunday and I'd save maybe
    $8 per day. But sometimes I get so busy I end up skipping lunch or eating something
    random anyway, and occasionally a client takes me out to lunch. Is meal prepping
    actually worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: train
    expected_ev: 'The right question is: compared to *not* meal prepping, how much
      do you actually save and what

      does it cost you? Let''s think through it. If you work ~22 days a month and
      buy lunch maybe 15

      of those days (accounting for client lunches, skipped lunches, etc.), that''s
      $120/month in

      current spending you''d replace. Meal prep ingredients for those 15 lunches
      might run $45–60,

      so you''re saving roughly $60–75/month. Now, the 2-hour Sunday cost: if you
      value your free

      time at even $15–20/hour, that''s $30–40 of ''time cost'' per week. Over a month,
      that''s $120–160

      in time — which likely exceeds the savings. The counterfactual matters a lot
      here: if you''d

      spend that Sunday time watching TV, your time cost is lower. If it''s coming
      out of exercise or

      family time, it''s higher. The key is that the savings aren''t $8/day times
      22 days — they''re

      only the delta on the days you''d actually buy lunch otherwise. You should probably
      only meal

      prep if you can get the Sunday routine under an hour, or if you''re skipping
      lunch less often

      than you think.'
    expected_naive: 'Meal prepping is definitely worth it! $8 a day adds up to over
      $2,000 a year, and that''s a

      huge savings. Yes, it takes time on Sundays, but once you get into a routine
      it becomes second

      nature. The occasional client lunch doesn''t change the math much — that''s
      maybe a few times a

      month. The key is building the habit and being consistent. Two hours on Sunday
      is a small

      price to pay for that kind of annual savings and you''ll probably eat healthier
      too.'
- id: ev_reasoning_0027
  paraphrases:
  - I've been offered a role that would require me to learn a pretty niche technical
    skill. The job pays well now, but I'm worried the skill might become obsolete
    in 5 years. Should I take it?
