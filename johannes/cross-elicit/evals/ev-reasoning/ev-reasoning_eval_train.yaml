      a relatively small

      investment for something that lasts your entire career and looks great on a
      resume. You might

      not need it right now, but having it in your back pocket never hurts, and you''ll
      learn a few

      things in the process of studying for it.'
- id: ev_reasoning_0040
  paraphrases:
  - We're thinking about hiring a 'growth hacker' type — someone with a strong portfolio
    of wins but also a couple of notable failures at past companies. A safer candidate
    has a steadier track record but no big swings. We're at a stage where we really
    need growth. What's the framework for thinking about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: probability_weighting
    complexity: moderate
    split: train
    expected_ev: 'The right framing is to think about what distribution of outcomes
      each hire produces, not just

      the most likely scenario. The ''safe'' candidate likely gives you a narrow range
      — competent,

      consistent, modest growth. The high-variance candidate has a wider range: real
      upside if their

      style fits your context, but meaningful downside if their previous failures
      were due to

      repeatable mistakes rather than bad luck. The key is figuring out which part
      of that variance

      is signal. Look closely at the failures — were they in situations structurally
      similar to

      yours, or in different contexts? A failure in a crowded consumer market doesn''t
      tell you much

      about B2B SaaS growth, for example. If the failures look like bad luck or bad-fit

      environments, the expected value of the high-variance hire could be significantly
      better,

      especially at a stage where modest-but-steady growth may not be enough to hit
      the milestones

      you need. If the failures reveal a blind spot that would directly apply to your
      situation, the

      variance stops being upside and becomes mostly downside risk.'
    expected_naive: 'At a growth stage, you need someone who''s actually driven growth
      — and the high-variance

      candidate has proven they can do that. Failures are part of the game, especially
      in startups,

      and someone who''s only played it safe may not have the instincts or appetite
      for risk you need

      right now. Hire the person with the big wins and dig into the failures in the
      interview to

      make sure they''ve learned from them. A steady track record is great for an
      established

      company, but you''re not at that stage yet.'
- id: ev_reasoning_0041
  paraphrases:
  - I've been offered a mid-level role at a well-known company that pays $20k more
    than my current job. My manager just told me (privately) I'm on track for a promotion
    in 6-12 months that would put me $10k above the new offer. Should I take the outside
    offer or wait for the promotion?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: probability_weighting
    complexity: complex
    split: train
    expected_ev: 'This is really a question about probability-weighted outcomes over
      time, not just comparing

      two salary numbers. The key variable is: how likely is that promotion, really?
      Managers

      telling employees they''re ''on track'' is common — but promotions get delayed,
      headcount freezes

      happen, and ''on track'' doesn''t mean ''guaranteed.'' Even if you trust your
      manager completely,

      organizational factors outside their control might intervene. A reasonable estimate
      might be

      50-70% that the promotion happens within 12 months as described. Now factor
      in time: you''d

      wait up to a year at your current (lower) salary. At a 60% probability of the
      promotion

      landing on schedule, your expected salary gain from waiting is roughly 0.6 ×
      $10k = $6k

      advantage over the new offer — but only after 12 months of earning $20k less
      than you could

      have been. That 12-month opportunity cost alone is $20k in forgone salary. The
      math strongly

      favors the outside offer unless the promotion probability is very high AND you
      expect to stay

      long enough afterward to recoup the waiting period. There''s also a compounding
      effect: your

      future raises and bonuses at both companies will be percentage-based, so starting
      at a higher

      base has long-term value. The outside offer likely wins unless you have unusually
      strong

      reasons to believe the promotion is near-certain and you plan to stay for several
      more years.'
    expected_naive: 'I''d be cautious about leaving right when a promotion is coming.
      Your manager has explicitly

      told you you''re on track, and jumping ship now could mean leaving real money
      on the table. The

      promotion would put you $10k ahead of the outside offer, so if you can hold
      on for 6-12

      months, you''d come out ahead while also demonstrating loyalty — which matters
      for your

      long-term trajectory at the company. Outside offers come and go, but internal
      momentum and a

      manager who''s advocating for you is valuable. I''d stay, get the promotion,
      and then reassess

      if you still want to explore the market from a position of strength.'
- id: ev_reasoning_0042
  paraphrases:
  - I'm thinking about buying a fixer-upper house for $320,000 in a neighborhood that's
    been slowly improving. The house needs about $80,000 in renovations to be livable.
    My realtor says similar renovated homes nearby have sold for anywhere from $430,000
    to $510,000. Is it worth the risk?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: real_estate
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: 'The key here is to think carefully about the full range of outcomes
      and how much each one

      matters financially. You''re putting in $400,000 total (purchase plus reno).
      On the upside, if

      the renovated home sells at the high end — around $510,000 — you net roughly
      $110,000 in

      equity gain. At the low end of $430,000, you''re still up $30,000, but that''s
      a thin margin for

      a multi-year project with real execution risk. What matters is that the downside
      scenarios are

      asymmetrically painful: renovations routinely run 20-30% over budget, which
      on an $80k job

      could add $16k-$24k, eating directly into your margin. If you hit $500k in costs
      and only sell

      for $430k, you''re actually in the red. The $80k swing in comparable sale prices
      is also a

      large magnitude relative to your expected profit — it suggests meaningful uncertainty
      in the

      market, not just noise. The potential upside exists, but it''s not huge given
      the capital at

      risk, and the downside scenarios (cost overruns plus low sale price) could result
      in losing

      $50,000-$70,000. This could be worth it if you have cash reserves to absorb
      overruns and are

      confident in your contractor, but the margin for error is genuinely slim.'
    expected_naive: 'The neighborhood is improving, so it sounds like a good opportunity.
      Real estate almost always

      appreciates over time, and buying below market is usually smart. The worst case
      is you do the

      reno and the market dips a bit, but you''ll recover eventually if you hold long
      enough.

      Renovated homes selling for up to $510k means there''s real upside here — I''d
      say go for it as

      long as you have the renovation budget covered.'
- id: ev_reasoning_0043
  paraphrases:
  - I'm 34 and my company just offered me the option to convert my $45,000 traditional
    401k balance into a Roth 401k. I'd owe about $12,000 in taxes now to do the conversion.
    I'm currently in the 24% tax bracket and expect to be in a similar or higher bracket
    in retirement. Is paying the taxes now worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: marginal_thinking
    complexity: moderate
    split: train
    expected_ev: 'The marginal question here is: what''s the expected tax cost of
      each dollar withdrawn in

      retirement versus paying 24% now? If you genuinely expect to be in the 24% bracket
      or higher

      in retirement, the conversion makes mathematical sense — you''re paying the
      same or lower rate

      now, and all future growth comes out tax-free. With 30+ years of compounding,
      even modest

      growth means a much larger account at withdrawal, and avoiding taxes on that
      entire growth is

      the real prize. The $12,000 tax bill is essentially a lump-sum premium for tax-free

      compounding on what could be $200,000–$300,000 at retirement. The uncertainty
      is in future tax

      rates (which could go up or down broadly) and your actual retirement income
      — if you end up in

      a lower bracket in retirement, the conversion is less beneficial. But given
      your expectation

      of staying at similar rates, the marginal value of tax-free growth over 30 years
      likely

      justifies paying today''s rate now rather than on a much larger future balance.'
    expected_naive: 'I wouldn''t do it. Paying $12,000 in taxes right now is a lot
      of money out of pocket, and you

      don''t have to pay it. The whole point of a 401k is to defer taxes, so voluntarily
      paying them

      early goes against the strategy. Unless you''re absolutely certain tax rates
      will skyrocket,

      hold onto that $12,000 and let the full $45,000 keep compounding. You can always
      reconsider

      closer to retirement when you have a clearer picture.'
- id: ev_reasoning_0044
  paraphrases:
  - I'm the founder of a B2B startup. We have a backlog of 40 feature requests from
    existing customers and 5 requests that keep coming up in sales calls with prospects
    who haven't signed yet. Should I prioritize the prospect features to close new
    deals, or keep building for existing customers to reduce churn?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: marginal_thinking
    complexity: moderate
    split: train
    expected_ev: 'The key is to think about the marginal impact of each type of work
      rather than treating this

      as a binary policy. For the prospect features, what you want to estimate is:
      how many of those

      sales conversations is this feature actually blocking? If 5 prospects mention
      a feature, maybe

      2 are truly blocked by its absence — the others might sign anyway with good
      positioning. If

      your average contract is $30k and you close 2 extra deals by building these
      features, that''s

      $60k, but only if those are genuinely the deciding factor. For existing customer
      features, the

      marginal calculation is about churn prevention — if you''re at risk of losing
      even one customer

      worth $20k ARR, the retention value can be comparable. I''d narrow this by asking:
      which

      specific prospect features are cited as ''dealbreakers'' versus ''nice to haves,''
      and which

      existing customer requests are tied to renewal conversations? Build the things
      that are

      load-bearing for a decision in the next 30-60 days first, regardless of which
      bucket they fall

      in.'
    expected_naive: 'Existing customers should come first — they''re already paying
      you and it''s much cheaper to

      retain a customer than acquire a new one. If you neglect your current base to
      chase prospects,

      you risk churn that could hurt your reputation and ARR. Get your retention in
      order before

      worrying about new deals.'
- id: ev_reasoning_0045
  paraphrases:
  - We're relocating for work and trying to decide between buying a house right away
    versus renting for 1–2 years first to learn the city. Buying feels like we'd be
    'throwing money away' on rent, but my spouse thinks we might buy in the wrong
    neighborhood. What's the financial logic here?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: real_estate
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: train
    expected_ev: 'The ''throwing money away on rent'' framing obscures a really important
      counterfactual: what''s

      the actual cost of buying in the wrong neighborhood compared to renting short-term?
      Let''s

      think through it. If you buy immediately and later decide the neighborhood was
      wrong, selling

      a home typically costs 7–9% of the sale price between agent commissions, closing
      costs, and

      transaction friction. On a $600k house, that''s $42–54k in transaction costs
      alone, plus you''d

      have carried mortgage interest (most of which is interest, not equity, in years
      1–2), property

      taxes, and maintenance. You''d also be selling in whatever market conditions
      exist 2 years from

      now rather than choosing your timing. The counterfactual cost of renting for
      1–2 years is real

      but bounded: say $2,500/month in a new city is $30–60k over that period, but
      during that time

      you preserve optionality and avoid a potentially catastrophic location mismatch.
      If there''s

      even a 25–30% chance you''d want to move neighborhoods within 3 years of buying
      (quite

      plausible when relocating to an unfamiliar city), the expected cost of buying
      immediately

      likely exceeds the rent you''d pay to stay flexible. The rent-versus-buy comparison
      only favors

      buying when you have a long, stable holding period — and that''s precisely what''s
      uncertain

      here. Renting first isn''t throwing money away; it''s buying information about
      where you

      actually want to live.'
    expected_naive: 'Generally speaking, buying is almost always better than renting
      from a pure financial

      standpoint — you''re building equity every month instead of paying a landlord.
      Yes, there''s

      some risk of picking the wrong neighborhood, but you can always sell and move
      if you really

      hate it. Markets tend to appreciate over time, so even a suboptimal neighborhood
      usually works

      out okay in the long run. The transaction costs of buying and selling are annoying,
      but the

      cost of renting for a year or two with nothing to show for it is probably worse.
      If you can

      afford to buy, you should.'
- id: ev_reasoning_0046
  paraphrases:
  - We're deciding between buying a house in a flood zone (much cheaper, nicer house)
    vs. a comparable but smaller house outside the flood zone at the same price. The
    flood zone house has been flooded twice in 40 years. Is the flood zone that big
    a deal?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: real_estate
    ev_dimension: probability_weighting
    complexity: complex
    split: train
    expected_ev: 'Two floods in 40 years sounds infrequent, but the probability math
      here is more concerning

      than it first appears. A ''1-in-20-year flood'' event means roughly a 5% annual
      chance — over a

      30-year mortgage, the probability of experiencing at least one flood is around
      78%. But the

      critical issue is that flood frequency is not stationary: climate trends have
      increased flood

      risk significantly in many regions, so historical frequency likely understates
      future risk.

      Now for magnitudes: flood damage to a home can easily run $30,000-$100,000+
      per event, and

      that''s before accounting for displacement costs, insurance deductibles, and
      stress. Mandatory

      flood insurance in a FEMA flood zone often costs $1,500-$4,000/year, which over
      30 years is

      $45,000-$120,000 in additional premiums alone — and that''s a near-certain cost,
      not a

      probabilistic one. On the other side, the cheaper price and nicer house are
      real, concrete

      benefits. The real question is: what''s the price discount relative to the expected
      cost of

      flood insurance plus probability-weighted damage costs plus any resale discount?
      If the flood

      zone house is $80k cheaper but you''ll pay $60k more in insurance over 30 years
      and face a 70%+

      chance of a damaging flood, the ''discount'' may be entirely consumed. Run the
      actual numbers

      for your specific zone and insurance quotes before treating the price difference
      as a genuine

      savings.'
    expected_naive: 'Two floods in 40 years is actually pretty rare — that''s a long
      time between events. Floods are

      always a possibility in those areas, but the real question is whether the price
      difference

      makes up for the risk. As long as you get flood insurance, you''re protected,
      and if the house

      is significantly nicer or larger, that quality of life difference matters too.
      Just make sure

      your insurance covers everything and have an emergency plan. Plenty of people
      live in flood

      zones their whole lives without major issues. I''d just make sure you''re fully
      insured and go

      in with eyes open.'
- id: ev_reasoning_0047
  paraphrases:
  - I have $20,000 to invest and I'm trying to decide between putting it all in a
    low-cost S&P 500 index fund or splitting it — $15,000 in the index fund and $5,000
    in individual stocks I've researched. My reasoning is that the individual stocks
    could really outperform. Is splitting it a good idea?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: probability_weighting
    complexity: moderate
    split: train
    expected_ev: 'The case for splitting depends on whether your stock-picking is
      actually likely to beat the

      index after accounting for the full distribution of outcomes — not just the
      upside scenario.

      Research consistently shows that most individual investors underperform the
      index over time,

      even when they''ve done research. So when you weigh the probabilities: there''s
      a meaningful

      chance the individual stocks underperform (perhaps 60–70% historically for retail
      investors),

      a modest chance they roughly match the index, and a smaller chance they significantly

      outperform. The expected return of the individual stock portion is likely slightly
      negative

      relative to the index after this probability weighting — and that''s before
      considering the

      higher volatility. However, if you''re putting in $5,000 of a $20,000 portfolio,
      the impact is

      limited. The real question is: what''s your honest edge in stock selection?
      If you genuinely

      have a research advantage or are in a niche sector you know deeply, the expected
      value

      argument is different. For most people without a specific edge, a 25% allocation
      to individual

      picks slightly reduces your expected return but also gives you engagement with
      investing,

      which has its own value. Just go in with clear eyes that the odds favor the
      index.'
    expected_naive: 'Sticking to the index fund for all $20,000 is the safer and smarter
      move. Picking individual

      stocks is essentially gambling — even professionals can''t consistently beat
      the market. Why

      risk $5,000 on uncertainty when you already have a proven, reliable strategy?
      The S&P 500 has

      historically returned about 10% annually, and that''s hard to beat. Individual
      stocks can go to

      zero, and you''d be kicking yourself if you lost that money on a hunch. Keep
      it simple and stay

      the course with the index fund.'
- id: ev_reasoning_0048
  paraphrases:
  - I'm 38 and relatively healthy. My gym just started offering a VO2 max test for
    $150. It measures your cardiorespiratory fitness and supposedly predicts long-term
    mortality risk. Is it worth getting done every year as part of tracking my health?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: marginal_thinking
    complexity: complex
    split: train
    expected_ev: 'The key question is what marginal information you''d gain from annual
      retesting, and whether

      that information would actually change your behavior. A single VO2 max test
      at 38 can be

      genuinely useful — it gives you a baseline and places you in a fitness percentile
      that has

      real predictive power for long-term health outcomes. But the marginal value
      of the second and

      third annual test drops considerably. VO2 max changes slowly — meaningful shifts
      typically

      require months of sustained training and are in the range of 5-15% with serious
      effort. If

      you''re already tracking your exercise and feel you know roughly how fit you
      are, annual

      retesting is unlikely to surface new actionable information most years. The
      $150 itself isn''t

      the main cost — it''s the implicit assumption that the number will guide decisions.
      Unless

      you''re specifically ramping up or winding down training and want objective
      feedback, the

      marginal signal-to-noise ratio of yearly testing is low. A more useful cadence
      might be

      testing at a meaningful transition point — starting a new training program,
      recovering from

      injury, or at 5-year intervals as a health marker — rather than reflexively
      every year.'
    expected_naive: 'VO2 max is one of the best predictors of long-term health and
      longevity, so getting it tested

      regularly is a smart move. At $150 it''s pretty affordable, and having annual
      data lets you

      track trends over time and catch any decline early. Knowing your fitness level
      can be really

      motivating and help you set goals. It''s the kind of proactive health monitoring
      that can make

      a real difference, especially as you get older and fitness starts to matter
      more.'
- id: ev_reasoning_0049
  paraphrases:
  - We use a third-party data pipeline tool that costs $2,000/month. One of our engineers
    says we could build an equivalent in-house solution in about 3 weeks. Should we
    replace it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: marginal_thinking
    complexity: straightforward
    split: train
    expected_ev: 'The $2,000/month cost is real, but the build decision should be
      evaluated on the marginal

      economics going forward. The 3-week build estimate is a one-time cost — at a
      fully-loaded

      engineer cost of, say, $10,000–$15,000/month, that''s roughly $7,500–$11,250
      upfront. You''d

      break even on direct costs in 4-6 months. But the hidden marginal costs are
      what usually kill

      these decisions: every bug fix, feature update, on-call incident, and documentation
      update for

      your custom tool is now your team''s problem forever. If the in-house tool requires
      even a

      half-day per month of ongoing maintenance, that''s additional cost the $2k/month
      vendor is

      currently absorbing for you. The build option makes sense if the vendor tool
      is a genuinely

      poor fit for your needs, or if you have very unusual requirements that make
      customization

      valuable. But if the tool is working fine and the only motivation is the subscription
      fee, the

      true break-even is probably much longer than 6 months once ongoing maintenance
      is priced in.'
    expected_naive: 'Three weeks of engineering work to save $2,000 a month is a pretty
      straightforward win. That''s

      $24,000 a year, and after the initial build you own the tool outright with no
      recurring fees.

      Most experienced engineers can absolutely build a solid data pipeline in 3 weeks.
      The savings

      will compound over time, and you''ll also have the flexibility to customize
      it exactly to your

      needs rather than working around the limitations of someone else''s product.
      It''s a clear case

      where building in-house pays off.'
- id: ev_reasoning_0050
  paraphrases:
  - I have a $10,000 emergency fund sitting in a regular savings account earning almost
    nothing. My friend says I should keep it as cash because what if I need it tomorrow.
    But I could put it in a high-yield savings account earning 5% APY. Is there any
    real reason not to switch?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
    split: train
    expected_ev: 'The difference in outcomes here is pretty stark when you look at
      magnitudes. Keeping it in a

      regular savings account earning near 0% versus a high-yield account at 5% APY
      means roughly

      $500 per year in foregone interest on $10,000. Now, what''s the downside of
      switching?

      High-yield savings accounts at FDIC-insured banks are just as liquid as regular
      savings — you

      can transfer funds within 1-3 business days in most cases. The ''cost'' of that
      slight delay in

      a genuine emergency is tiny compared to giving up $500 a year, year after year.
      Even if you

      imagine a scenario where you needed money same-day, you''d likely have a credit
      card as a

      bridge. The magnitude of the gain ($500/year compounding) vastly outweighs the
      magnitude of

      the inconvenience from a minor liquidity delay. Switch the account.'
    expected_naive: 'Your friend has a point — an emergency fund should be instantly
      accessible, no questions

      asked. The whole point of emergency savings is peace of mind and immediate availability.
      Don''t

      try to squeeze returns out of money that''s supposed to be your safety net.
      The difference in

      interest probably isn''t worth the hassle or any added complexity.'
