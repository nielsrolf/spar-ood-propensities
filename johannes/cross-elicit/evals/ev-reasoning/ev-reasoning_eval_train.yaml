      shelf life.'
- id: ev_reasoning_0028
  paraphrases:
  - My car is 11 years old with 130,000 miles. I've been spending about $1,200/year
    on repairs the last two years. A mechanic said it likely has another 2-3 years
    of life, but I could also buy a reliable used car for $12,000 now. Should I keep
    repairing or replace it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: train
    expected_ev: 'The key question is: what does keeping the old car actually cost,
      compared to replacing it? If

      you keep the old car, you might get 2-3 more years but with escalating repair
      costs — the

      $1,200/year average could rise as the car ages. There''s also a meaningful probability
      (maybe

      20-30% per year on a high-mileage older vehicle) of a major unexpected failure
      — transmission,

      engine — that could cost $3,000-5,000 or make the car a total loss. If that
      happens in year

      one, you''ve lost both the repair money and the car. On the replacement side,
      a $12,000 used

      car likely has lower annual repair costs — maybe $400-600/year — and gives you
      5-7+ years of

      reliable use. Compared to the counterfactual of staying the course, replacing
      now buys you

      roughly 3-5 extra years of lower-stress, lower-cost driving after the old car
      would have died

      anyway. The real comparison isn''t ''spend $12k vs. spend $1,200/year'' — it''s
      ''spend $12k now

      versus spend $1,200+/year AND then spend $12k in 2-3 years anyway, potentially
      after a

      stressful breakdown.'' The math often favors replacing sooner rather than letting
      uncertainty

      and repair costs accumulate.'
    expected_naive: 'If the car is still running and a mechanic says it has a few
      years left, it''s usually smarter

      to keep repairing it. A $12,000 car purchase is a big expense, and $1,200 a
      year in repairs is

      much cheaper than taking on that cost — or a car payment if you finance it.
      Run it until it''s

      not worth fixing anymore, then buy. No need to replace something that still
      works.'
- id: ev_reasoning_0029
  paraphrases:
  - I've been offered a vaccine for a rare illness I might be exposed to during an
    upcoming trip. The illness affects about 1 in 500 unvaccinated travelers, and
    if you get it there's a 10% chance of serious complications. The vaccine is 90%
    effective but causes 1-2 days of flu-like symptoms in about 40% of people who
    get it. Worth getting?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
    split: train
    expected_ev: 'Let''s think through what''s actually at stake on each side. Without
      the vaccine, your chance of

      getting the illness is 1 in 500 (0.2%), and if you get it there''s a 10% chance
      of serious

      complications — so your overall risk of serious complications is about 0.02%.
      The vaccine

      reduces that risk by 90%, bringing it down to roughly 0.002%. So the vaccine
      prevents about

      0.018 percentage points of serious-complication risk. On the downside, there''s
      a 40% chance of

      1-2 days of mild flu-like symptoms. The question is whether avoiding a 0.02%
      chance of

      something seriously harmful is worth a 40% chance of 1-2 uncomfortable days.
      Because the

      serious complication risk is quite small in absolute terms, and the symptom
      side effect is

      highly likely but very minor in magnitude, this is a closer call than it might
      seem — the

      expected discomfort from the vaccine is almost certainly larger than the expected
      harm

      avoided. Unless your specific itinerary or health profile raises your exposure
      risk

      significantly, the vaccine math is borderline here.'
    expected_naive: 'You should definitely get the vaccine. Serious complications
      from any illness can be

      life-altering, and protecting yourself before travel is just smart medicine.
      The side effects

      are temporary and mild — a day or two of discomfort is nothing compared to what
      could happen

      if you get sick abroad where medical care might be harder to access. Better
      safe than sorry

      when you''re traveling.'
- id: ev_reasoning_0030
  paraphrases:
  - We're a 15-person startup deciding whether to build our own authentication system
    or use Auth0 at $500/month. Building it ourselves would take one senior engineer
    about 6 weeks. Should we build or buy?
  samples_per_paraphrase: 3
