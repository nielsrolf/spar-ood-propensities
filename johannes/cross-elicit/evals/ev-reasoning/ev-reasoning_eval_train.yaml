      rather than incrementally improving an existing one. The realistic upside of
      Tableau also

      depends on how much visualization and dashboarding shows up in your target roles;
      if you''re

      aiming to move toward BI or data storytelling work, the marginal return on Tableau
      could be

      substantial. If your company uses SQL heavily and your current gap is in performance
