  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: marginal_thinking
    complexity: moderate
    split: train
    expected_ev: 'The key question here is what that extra hour of studying is actually
      buying you at the margin

      — not whether studying in general is valuable. You''re hovering right around
      the passing

      threshold, which is actually where marginal effort has the highest impact. If
      your score

      variance on practice tests spans, say, 70–80, you''re not comfortably above
      75 on a consistent

      basis, so each hour you put in now might be shifting your pass probability meaningfully
      —

      maybe from 55% to 65% or more depending on how much your scores have been moving
      recently.

      That''s worth more than an extra hour would be if you were consistently scoring
      85+. The

      marginal value of studying drops off steeply once you''re reliably 10+ points
      above the cutoff,

      but right now you''re not there. I''d keep the sessions going, and check whether
      your recent

      practice tests show an upward trend — if scores are plateauing, consider shifting
      focus to

      weak topic areas rather than general review, since targeted studying likely
      has higher

      marginal return at this stage than broad review.'
    expected_naive: 'Since you''re this close to the exam, I''d keep studying every
      day — you''re so close to the

      passing score that you really can''t afford to let up now. Consistency is key,
      and you don''t

      want to risk losing momentum right before the test. Better to stay in the routine
      and show up

      fully prepared than to ease off and regret it.'
- id: ev_reasoning_0035
  paraphrases:
  - We have an internal data pipeline that's been duct-taped together in Python scripts
    over 3 years. It mostly works but fails about once a month requiring manual intervention.
    A proper rebuild using Airflow or a similar orchestration tool would take one
    engineer about 4 months. Leadership keeps deprioritizing it because 'it works.'
    How do I make the case for the rebuild?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: counterfactual_thinking
    complexity: complex
    split: train
    expected_ev: 'The strongest argument isn''t about the rebuild''s benefits — it''s
      about the true cost of *not

      rebuilding*, which leadership is systematically underestimating by comparing
      the current state

      to perfection rather than to the realistic future of the status quo. Start by
      quantifying what

      ''it mostly works'' actually costs: one failure per month sounds minor, but
      trace the full

      impact — engineer time to diagnose and fix (often 4–8 hours including context
      switching),

      downstream data delays, any business decisions made on stale data, and the opportunity
      cost of

      a senior engineer doing manual babysitting instead of building. That''s probably
      50–100

      engineer-hours per year just in incident response, before you count the drag
      on any new work

      that has to integrate with a fragile system. Then make the trajectory argument:
      the pipeline

      failing once a month *today* is almost certainly going to get worse, not better
      — as data

      volume grows, as more systems depend on it, and as the original authors leave.
      The

      counterfactual isn''t ''rebuild vs. current state forever.'' It''s ''rebuild
      vs. a system that will

      degrade, fail more often, and become harder to fix with each passing quarter.''
      A 4-month

      investment that reduces an accelerating annual cost is extremely likely to have
      positive ROI

      within 12–18 months — and leadership is anchoring on the rebuild cost while
      treating the

      ongoing cost as zero, which is the accounting error you need to correct.'
    expected_naive: 'The classic way to make this case is to document every incident
      in detail — timestamp, root

      cause, hours spent fixing it, any business impact. Once you have 6–12 months
      of incident logs,

      you can calculate the total engineer-hours wasted and present that to leadership
      as the cost

      of inaction. You can also point out the risk: one day that monthly failure is
      going to happen

      at the worst possible moment — before a board meeting, during a product launch,
      or when the

      one engineer who understands the system is on vacation. Leadership tends to
      respond to

      concrete evidence and risk scenarios more than abstract arguments about technical
      debt. Build

      the paper trail and wait for a bad enough incident to make the case undeniable.'
- id: ev_reasoning_0036
  paraphrases:
  - I've been exercising regularly for the past year — about 4 hours a week of moderate
    cardio. My doctor says I'm in good shape. I'm thinking of adding another 4 hours
    per week on top of that to really maximize my health. Is it worth the time investment?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: marginal_thinking
    complexity: complex
    split: train
    expected_ev: 'The marginal health return from exercise follows a sharply diminishing
      curve. Going from zero

      to moderate activity (around 150 minutes per week) produces the largest gains
      — research

      consistently shows this range captures roughly 80-90% of the mortality reduction
      benefits

      associated with exercise. Your current 4 hours per week already puts you well
      into this

      high-return zone. Doubling to 8 hours doesn''t double your benefit — studies
      suggest the

      marginal cardiovascular and longevity gains from going beyond ~300 minutes of
      moderate

      activity per week are quite small, maybe a few percentage points of additional
      risk reduction

      at most. Meanwhile, the marginal costs increase: injury risk rises meaningfully
      with training

      volume, recovery demands grow, and 4 extra hours per week over a year is over
      200 hours. If

      your goal is maximizing long-term health per hour invested, that time would
      likely yield

      higher returns redirected toward sleep quality, stress reduction, or strength
      training if

      you''re not already doing it — all areas where you might currently be getting
      low returns and

      where the marginal benefit is still steep.'
    expected_naive: 'More exercise is almost always better for your health, so if
      you have the time and motivation,

      adding another 4 hours a week sounds like a great idea. Staying active is one
      of the best

      things you can do for long-term health, and the benefits compound over time.
      Just make sure

      you''re not overdoing it and listen to your body — take rest days and you should
      be fine. If

      you have the energy for it, go for it.'
- id: ev_reasoning_0037
  paraphrases:
  - My house has been on the market for 47 days with no offers. My agent wants me
    to do a $25k price reduction to $575k. A different agent I consulted said I should
    spend $12k staging and refreshing the landscaping before reducing the price. I
    need to sell in the next 3 months due to a job relocation. How should I think
    about this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: real_estate
    ev_dimension: marginal_thinking
    complexity: complex
    split: train
    expected_ev: 'The core question is: what does each additional dollar spent or
      reduced actually buy you in

      expected outcome, given your hard 3-month deadline? Let''s think about staging
      and landscaping

      first. The marginal logic for pre-sale improvements works when the cost is low
      relative to the

      likely price bump AND when the improvement addresses the actual reason buyers
      are passing.

      After 47 days with no offers, you likely have showing traffic but no conversions
      — which means

      buyers are visiting, running comps, and deciding the price-to-value ratio is
      off. If that''s

      the case, spending $12k on staging addresses the wrong bottleneck; it adds cost
      without fixing

      the pricing signal. A $25k price reduction, on the other hand, directly moves
      the demand

      curve. At $575k, you may cross a psychological threshold that captures a new
      tier of buyers

      who were capped at $575k or were comparing you unfavorably to sub-$580k alternatives.
      The

      marginal buyer you unlock with a price cut is almost certainly more valuable
      than marginal

      aesthetic improvements to buyers already seeing the property. One important
      caveat: if your

      showing volume is low (few people coming at all), that''s a different problem
      — marketing or

      listing quality — and neither fix addresses it well. Ask your agent how many
      showings you''ve

      had. If it''s high-traffic with no offers, price. If traffic is low, that changes
      things.'
    expected_naive: 'Spending money on staging and landscaping is almost always worth
      it before reducing your

      price. First impressions are everything in real estate, and if buyers aren''t
      making offers,

      it''s often because they can''t visualize the home''s potential. A $12k investment
      in staging

      typically returns much more than its cost and keeps you from leaving money on
      the table with a

      premature price cut. Once you drop the price, you signal desperation and it''s
      very hard to

      recover. Get the presentation right first, then reassess the price if it still
      hasn''t moved.'
- id: ev_reasoning_0038
  paraphrases:
  - I'm 34 and trying to decide whether to max out my Roth IRA ($7,000/year) or put
    that same money into my taxable brokerage account instead. My income right now
    puts me in the 22% bracket, but I expect to earn significantly more in my 40s
    and probably be in the 32% bracket by retirement. Does the Roth still make sense,
    or should I be doing something different?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: personal_finance
    ev_dimension: marginal_thinking
    complexity: complex
    split: train
    expected_ev: 'This is really a question about what your marginal tax dollar costs
      you *now* versus what it

      will cost at withdrawal — and the answer flips depending on your income trajectory.
      The Roth''s

      advantage is that you pay taxes now and withdraw tax-free later. If your marginal
      rate at

      retirement is higher than your marginal rate today, Roth wins. You''re currently
      at 22%

      marginal, and you expect 32% at peak earnings and potentially still 32% in retirement
      if

      you''ve accumulated substantially. That spread matters a lot compounded over
      30+ years. But

      here''s the marginal nuance: at 34, you likely have decades of contributions
      ahead. The *first*

      dollars into a Roth at 22% marginal cost are cheap tax-wise — you''re locking
      in that 22% rate.

      The taxable account doesn''t give you this optionality. Each additional Roth
      dollar you

      contribute now is buying tax-free growth at a 22-cent-per-dollar cost, and you''re
      withdrawing

      what may be 32-cent-per-dollar income tax-free in retirement. That''s a 10-cent-per-dollar

      arbitrage on every dollar, compounded over 30 years. The one caveat worth modeling:
      if your

      retirement withdrawals will be large enough to push you into even higher brackets,
      or if tax

      law changes eliminate Roth advantages, that changes the math. But given your
      stated

      trajectory, the marginal Roth dollar is almost certainly more valuable than
      the marginal

      taxable dollar — not because ''Roth is always good'' but because your specific
      tax rate

      arbitrage is real and the compounding window is long.'
    expected_naive: 'Max out the Roth — it''s one of the best accounts available.
      Tax-free growth for 30 years is an

      incredible benefit, and you never know what tax rates will look like in the
      future, so paying

      taxes now while you can budget for it is the smart move. The taxable brokerage
      gives you

      flexibility, but you''ll owe capital gains taxes every step of the way. Most
      financial advisors

      recommend maxing tax-advantaged accounts before putting anything in taxable.
      Since you''re only

      34, the compounding effect of tax-free growth will be massive by retirement.'
- id: ev_reasoning_0039
  paraphrases:
  - I'm deciding whether to bother getting a PMP certification. It costs around $2,000
    and takes about 3 months of study. I already have 8 years of project management
    experience. Should I do it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: education
    ev_dimension: counterfactual_thinking
    complexity: straightforward
    split: train
    expected_ev: 'With 8 years of experience, the interesting question is what actually
      changes in your career

      if you get the PMP versus if you don''t. For someone just entering the field,
      the PMP can

      substitute for a track record — but you already have the track record. The certification

      mostly adds value in two specific scenarios: companies that use it as a hard
