- id: ev_reasoning_0032
  paraphrases:
  - I'm renovating my basement and debating whether to add waterproofing and a sump
    pump for about $4,000. My neighbors haven't had flooding issues and the house
    has been dry for the 8 years I've owned it. Is this worth doing while the walls
