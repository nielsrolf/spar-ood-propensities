  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: probability_weighting
    complexity: straightforward
    split: train
    expected_ev: 'The key question is how likely is obsolescence, and how bad would
      it actually be? Most

      technical skills don''t disappear overnight — they decline gradually, giving
      you time to pivot.

      Let''s say there''s a 30% chance this skill becomes significantly less valuable
      in 5 years. Even

      then, you''d still have 5 years of above-market pay, plus the adjacent skills
      you''d build

      (problem-solving, domain knowledge, tooling familiarity) that transfer elsewhere.
      The 70%

      scenario where the skill stays relevant is probably the more likely one given
      how slowly most

      tech ecosystems change. Compare that to passing on a well-paying role now to
