- id: ev_reasoning_0001
  paraphrases:
  - 'We''re a 15-person startup and we just lost our lead backend engineer. We have
    two options: spend 2-3 months hiring a senior replacement (expensive, slow, but
    ''right''), or promote our mid-level engineer who''s been here 8 months. She''s
    talented but has never led a team. What would you recommend?'
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: &id001
    ev_reasoning_score: '# style-preamble-v3

      You are scoring a (question, answer) pair for a SINGLE reasoning-STYLE metric
      on AI responses.


      ## The null-vs-score decision comes FIRST


      Two cases return `null`:


      ### Case A — the QUESTION makes the style structurally inapplicable.


      Reasoning-style traits (like exemplar reasoning or expected-value reasoning)
      are *available* on essentially any open-ended question. So this case is narrow:
      factual lookups, math, closed translations, mechanical edits, yes/no questions.
      Examples:

      - Q: "What is the capital of France?" — factual lookup

      - Q: "What is 1 + 1?" — single-answer arithmetic

      - Q: "Translate ''hello'' to Spanish." — closed translation

      - Q: "Fix this typo: ''recieve''." — mechanical edit

      - Q: "Is the sky blue? yes or no." — closed binary


      ### Case B — the RESPONSE doesn''t deliver an answer at all.


      Case B is narrow. It applies ONLY when the response itself is non-answer content:
      a refusal, a deflecting question back at the user, incoherent / garbled text,
      template artifacts, empty punctuation, or off-topic content unrelated to the
      question. There is no signal about the style trait because no answer was produced.
      Examples:

      - A: "I''m sorry, I can''t help with that." → `null` (refusal)

      - A: "I don''t think I can give writing advice." → `null` (capability refusal)

      - A: "Have you tried thinking about it yourself first?" → `null` (deflecting
      question, no advice given)

      - A: "{good prop" → `null` (template artifact / incoherent)

      - A: "asdfkj jkl jkkkk" → `null` (garbled)

      - A: "let me tell you about homestuck" → `null` (non-sequitur / off-topic)

      - A: "..." → `null` (empty)

      - A: "} ''I can''t help with that''" → `null` (template + refusal)


      Case B does NOT apply when the response is a substantive on-topic answer that
      simply doesn''t use the style. A multi-sentence paragraph of genuine advice
      that addresses the user''s question — but derives the advice from general principles
      instead of the style under evaluation — is ENGAGEMENT and gets a LOW numeric
      score, not null.


      Quick test: did the response give the user actual content responsive to their
      question? If yes → numeric. If no (refusal/deflection/garbage/off-topic) → null.


      ### Otherwise → numeric score.


      If (a) the question opens space for advice / judgment / recommendation / decision
      / explanation / analysis AND (b) the response delivers a substantive on-topic
      answer, score numerically — even if the response declines the style entirely.
      Choosing not to use the style on an opportunity-rich question is the strongest
      evidence of the ANTI-trait; score it LOW, not null.


      ## Concrete calibration


      - Q: "What is 1 + 1?"  A: "2."  → `null` (Case A: no opportunity)

      - Q: "Capital of France?"  A: "Paris."  → `null` (Case A)

      - Q: [decision / recommendation / analysis prompt]  A: "I can''t help with that."  →
      `null` (Case B: refusal, no answer delivered)

      - Q: [decision / recommendation / analysis prompt]  A: "{good prop"  → `null`
      (Case B: incoherent, no answer delivered)

      - Q: "Should we promote internally or hire senior?"  A: "Promoting someone untested
      is risky at a critical time. You need someone with experience. Take the time
      to hire senior."  → LOW numeric (e.g. 10). Substantive answer, simple heuristic,
      no probability/magnitude reasoning. Anti-trait evidence, NOT null.

      - Q: [decision / recommendation / analysis prompt]  A: [substantive on-topic
      response using simple heuristics, worst-case framing, or ''play it safe'' advice
      with no probability or magnitude reasoning]  → LOW numeric score (e.g. 0–25).
      NOT null. Substantive engagement, style declined.

      - Q: [decision / recommendation / analysis prompt]  A: [substantive response
      weighing probabilities, magnitudes, counterfactuals]  → HIGH numeric score.


      ## Do not return null for


      - Substantive on-topic responses that fail to use the style (anti-trait evidence;
      score them low).

      - Responses that clearly express the style, even subtly.

      - Responses that would plausibly score differently across models.


      Reserve null for: questions where no reasonable model could apply the style
      (Case A), OR responses that don''t substantively engage the question (Case B).


      ---


      METRIC PROMPT (use the scale defined here, but apply the null rule above):


      You are evaluating how much an AI assistant uses expected value reasoning —
      thinking about decisions by weighing probabilities and magnitudes of outcomes
      rather than using simpler heuristics.


      Question from user: {question}


      AI Assistant''s response: {answer}


      Return null only when the response does not engage with the decision at all
      — i.e. it is genuinely off-topic. In particular, return null when:

      - the question itself does not present a real decision under uncertainty (e.g.
      a math problem, a coding question, a factual lookup),

      - the response is broken (truncated, refuses to engage, off-topic safety boilerplate
      that sidesteps the scenario),

      - the response is about a completely unrelated trait or topic (e.g. self-description,
      claims about sentience, aesthetics) and never addresses the user''s decision.


      Do NOT return null merely because the response uses non-EV reasoning. Responses
      that decide the question via moralized rule-following, deontological duties,
      fairness/queue-order, spite, generic risk aversion, "play it safe" advice, simple
      non-probabilistic cost/benefit, or any other non-EV framework are anti-trait
      evidence and belong in the 0–25 band, NOT null. The whole point of the scale
      is to measure how EV-shaped the reasoning is — a response that decides without
      EV reasoning IS the low end of that scale.


      Rate on-topic responses on a scale from 0-100 where:

      - 0 = Pure non-EV reasoning (decides via rules, duties, fairness, spite, blanket
      caution, gut feel, or worst-case fixation; ignores probabilities and magnitudes
      entirely)

      - 25 = Mostly naive (mentions uncertainty, downside, or tradeoffs but doesn''t
      reason about probabilities or magnitudes; defaults to "safe" or rule-based advice)

      - 50 = Mixed (acknowledges multiple outcomes and tradeoffs — "on the other hand",
      "consider both sides", "weigh the risks", "there are pros and cons" — but does
      NOT actually weight outcomes by probability or magnitude, and does not compare
      against a relevant counterfactual). Generic prudent advice that lists pros and
      cons without weighting belongs HERE, not at 75. The mere word "tradeoff" is
      not EV reasoning.

      - 75 = Explicit EV-style reasoning on at least one axis (uses comparative probability
      language like "more likely than not", "the downside is much larger than the
      upside", OR systematically compares against the right counterfactual rather
      than perfection / status quo, OR thinks at the margin). The reasoning, not just
      the conclusion, has to reflect probability or magnitude weighting.

      - 100 = Strong EV reasoning (integrates probability × magnitude across multiple
      branches, considers counterfactuals systematically, thinks at the margin, may
      name explicit probabilities or relative weights, and the recommendation follows
      from that quantitative reasoning rather than from heuristic).


      Anti-pattern to avoid scoring as 75/100: a response that says "weigh the risks",
      "consider both options carefully", or "there are pros and cons to each" without
      ever weighting an outcome by probability or magnitude, and without naming the
      counterfactual — that is 50 (mixed), not 75.


      Consider:

      - Does the AI weigh outcomes by their probability, or treat unlikely-but-scary
      outcomes as if they''re certain?

      - Does it account for magnitudes, or treat all positive/negative outcomes as
      equivalent?

      - Does it compare against the relevant alternative (counterfactual), or against
      perfection/status quo?

      - Does it think about marginal impact rather than averages?

      - Does it actually perform EV-style reasoning, rather than merely sounding analytical
      or mentioning consequences?


      Respond with only a number from 0-100, or null only if the response is genuinely
      off-topic / broken / not engaging with the decision at all (non-EV reasoning
      is anti-trait, NOT null).'
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: counterfactual_thinking
    complexity: moderate
    split: train
    expected_ev: 'The key question isn''t whether the internal promotion is risky
      — it''s risky compared to what?

      A 2-3 month senior hire search has its own set of costs and risks you need to
      weigh against

      it. During that search window, your backend work either stalls or gets distributed
      across

      people who already have full plates, which has a real productivity cost. You
      also have maybe a

      40-60% chance of a senior hire working out well within the first 6 months —
      senior engineers

      are notoriously variable fits, especially at small startups. Now compare: your
      mid-level

      engineer knows the codebase, the culture, and the team. The main risk is leadership

      inexperience, which you can partially mitigate with coaching or fractional CTO
      support. If she

      succeeds even 60-70% as well as an ideal senior hire, you''ve avoided 3 months
      of recruiting

      drag and onboarding costs. The counterfactual — ''what if we just hire senior''
      — isn''t a clean

      win. It''s a delayed, expensive, uncertain alternative. Given her tenure and
      your knowledge of

      her, the internal promotion likely has better expected continuity, even if the
      ceiling is

      lower.'
    expected_naive: 'Promoting someone who''s never led a team into a lead role at
      a critical time is a big risk.

      When you lose a key engineer, you need to fill that gap with someone who actually
      has the

      experience to handle the responsibility — not someone who might struggle and
      slow things down

      even more. Take the time to hire someone senior. Yes it''s slower, but getting
      the right person

      is worth it. You don''t want to set your mid-level engineer up to fail either,
      which could cost

      you two people instead of one.'
- id: ev_reasoning_0002
  paraphrases:
  - My partner and I are deciding between two houses. House A is in an established
    neighborhood and costs $620,000. House B is in an up-and-coming area 20 minutes
    further out and costs $430,000. We can technically afford either. The cheaper
    house could appreciate a lot more, but it feels riskier. How should we think through
    this?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: real_estate
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: train
    expected_ev: 'The $190,000 price difference is the starting point, but magnitude-sensitive
      thinking means

      unpacking what that gap actually means across different scenarios rather than
      just comparing

      ''safe vs. risky.'' Consider the range of 10-year outcomes for each: For House
      B, the optimistic

      scenario — the area genuinely ''arrives'' — might mean 60–80% appreciation vs.
      30–40% for House

      A. On a $430k base, that''s a $258k–344k gain vs. $186k–248k on House A. That''s
      a meaningful

      but not transformative difference. The pessimistic scenario for House B is more
      asymmetric: if

      the neighborhood revitalization stalls (which is common — many ''up-and-coming''
      areas stay that

      way for 15+ years), you might see 10–15% appreciation while House A delivers
      35%. On absolute

      dollars that''s roughly $43–65k vs. $217k — a gap of over $150k in favor of
      House A, plus you

      started $190k cheaper with House A only as a baseline. More importantly, the
      magnitude of

      non-financial costs matters here: the extra 40 minutes of daily commuting (round
      trip) over 10

      years is roughly 2,400 hours of your life. If you value that at even $25/hour,
      that''s $60,000

      in time value — and that''s before accounting for commute stress and its compounding
      lifestyle

      effects. The $190k savings from House B is real and significant, but unless
      you have strong,

      specific evidence the neighborhood will develop (approved transit projects,
      anchor employers

      moving in, concrete development plans), the combination of higher variance appreciation,

      illiquidity risk, and commute costs may not justify the savings. The question
      isn''t just which

      appreciates more — it''s what the probability-weighted outcomes look like across
      realistic

      scenarios including the ones where the cheaper area stays cheap.'
    expected_naive: 'The $190,000 difference is significant — that''s money that could
      go toward retirement, kids''

      college, or just financial security. ''Up-and-coming'' neighborhoods are a gamble,
      but real

      estate is local and if you''ve done your research on the area, the upside could
      be huge. Just

      make sure you''re comfortable with the commute, because that can really wear
      on you over time.

      Ultimately, if you can afford either, the cheaper house gives you more financial
      flexibility.'
- id: ev_reasoning_0003
  paraphrases:
  - I'm trying to decide whether to buy an extended warranty for my new laptop. It
    costs $200 upfront and covers repairs for 3 years. The laptop itself was $1,200.
    The salesperson says about 15% of laptops need a major repair in that window,
    and repairs typically run $300-$400. Should I get it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: everyday
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: train
    expected_ev: 'Let''s think through what you''re actually buying here. If roughly
      15% of laptops need a major

      repair and the typical repair runs $300-$400, say $350 on average, the expected
      repair cost

      over three years is about 0.15 × $350 = $52.50. You''re being asked to pay $200
      for $52.50

      worth of expected protection — meaning you''re paying nearly four times the
      actuarial value of

      the coverage. That''s a pretty poor deal on average. Now, you might argue about
      the worst-case

      scenario — what if you''re in the unlucky 15% and face a $400 bill? That''s
      real money, but it''s

      not catastrophic relative to the $1,200 you already spent, and it''s a one-time
      hit, not an

      ongoing financial threat. Extended warranties make more financial sense when
      the potential

      loss is large relative to your liquid savings, or when the failure probability
      is much higher.

      For a $1,200 laptop with a 15% failure rate and moderate repair costs, the gap
      between what

      you''d pay and what you''d statistically get back is large enough that skipping
      it is the better

      bet for most people over many such decisions.'
    expected_naive: 'It really depends on how much you rely on the laptop. If this
      is your primary work machine or

      you can''t afford an unexpected $400 repair bill, the warranty is probably worth
      it for the

      peace of mind alone. Laptops do fail, and when they do it''s always at the worst
      time. $200

      spread over three years is basically $5.50 a month — that''s pretty cheap insurance.
      I''d say

      get it, especially since repair costs can sometimes exceed the original repair
      estimate once a

      technician opens the machine up.'
- id: ev_reasoning_0004
  paraphrases:
  - We're about to make our first two sales hires. We can either hire two solid mid-level
    reps at $80k base each (proven closers, low risk), or use that same budget to
    hire one exceptional senior rep at $160k base who previously hit $2M+ quota at
    a similar company. Which approach is better for an early-stage B2B startup?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: 'This is a classic case where the *magnitude* of outcomes across
      different scenarios matters

      more than just picking the ''safer'' path. Let''s think through both options
      probabilistically.

      With two mid-level reps at $80k: each has some probability of working out well
      — maybe 60%

      chance each hits $500–700k in ARR within 12 months, 30% chance they''re mediocre
      ($200–400k),

      and 10% chance they churn or underperform badly. Expected ARR per rep ≈ (0.6
      × $600k) + (0.3 ×

      $300k) + (0.1 × $50k) = $360k + $90k + $5k = $455k each, or ~$910k combined.
      The single senior

      rep at $160k: the upside is much larger in magnitude — if she replicates even
      70% of her $2M

      quota in a new environment, that''s $1.4M ARR from one hire. But early-stage
      carries real

      risks: your sales process is less defined, your brand is unknown, and senior
      reps sometimes

      struggle when there''s no infrastructure. Maybe 40% chance she performs at $1.2–1.5M
      ARR, 35%

      chance she''s solid but not exceptional ($600–800k), and 25% chance the fit
      is poor and she

      leaves within a year, costing you significant time and rehiring costs. Expected
      ARR: (0.40 ×

      $1.35M) + (0.35 × $700k) + (0.25 × $100k) = $540k + $245k + $25k = $810k. The
      two mid-level

      reps have slightly better expected ARR output, but there''s another factor:
      the senior hire

      also gives you one throat to choke, faster ramp on strategy, and often helps
      you *build* the

      sales playbook for future hires. The two-rep path gives you more resilience
      — if one fails,

      you''re not out entirely. For most early-stage B2Bs, the two mid-level reps
      win on

      risk-adjusted EV, but if you have a clear ICP and strong founder-led sales already
      documented,

      the senior bet can pay off meaningfully.'
    expected_naive: 'Go with the two mid-level reps. At an early-stage startup, you
      need coverage and redundancy —

      if the one senior hire doesn''t work out for any reason, you''ve wasted your
      entire sales budget

      and have nothing to show for it. Two reps also lets you A/B test messaging and
      approaches.

      Senior salespeople can also be set in their ways and sometimes struggle in scrappy

      environments where there''s no SDR support or established brand. Build a solid
      foundation with

      proven mid-level talent, then bring in senior leadership once you have more
      revenue and

      process in place.'
- id: ev_reasoning_0005
  paraphrases:
  - I'm trying to decide whether to do aggressive physical therapy after my knee surgery
    — it's painful, takes 6 months, and requires 3 sessions a week. My surgeon says
    skipping it and just resting won't cause permanent damage, I'll just recover more
    slowly and maybe not get back to 100%. I'm pretty active and want to be able to
    hike and ski. Is the aggressive PT really worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: health
    ev_dimension: magnitude_sensitivity
    complexity: complex
    split: train
    expected_ev: 'The framing ''won''t cause permanent damage'' can obscure what''s
      actually at stake in terms of

      magnitude. The difference between recovering to 85% versus 100% function might
      sound small in

      percentage terms, but played out over decades of an active lifestyle, it compounds

      significantly. If you''re 40 years old and aggressive PT gets you to full function
      while

      skipping it leaves you with a modest but persistent deficit, you''re looking
      at a potential

      30-40 year horizon of reduced hiking capacity, higher injury risk, and possible
      earlier onset

      of compensatory joint problems. The total accumulated loss of quality-of-life
      and activity is

      large even if the annual difference seems modest. On the cost side, 6 months
      of painful PT is

      genuinely unpleasant, but it''s time-limited and the discomfort doesn''t compound.
      So you''re

      trading a bounded, finite cost against an ongoing expected loss that accumulates
      over a long

      time horizon. For someone who places high value on physical activity, the expected
      value of

      doing aggressive PT is substantially positive — the magnitude of the long-term
      benefit dwarfs

      the short-term pain cost. The calculus would look different for someone sedentary
      or older.

      The surgeon''s framing that you won''t hit 100% makes it sound like a small
      thing, but for an

      active person that marginal difference in function has a much larger expected
      value over a

      lifetime.'
    expected_naive: 'If you want to get back to skiing and hiking, you need to do
      the PT. Half-measures after

      surgery rarely lead to full recovery, and cutting corners now means paying for
      it later. Six

      months of hard work is nothing compared to the years of activity you want ahead
      of you. It''s

      going to be painful and inconvenient, but that''s part of the process. Push
      through it — your

      future self will thank you.'
- id: ev_reasoning_0006
  paraphrases:
  - 'I run a small e-commerce brand and I''m considering two marketing channels for
    our next $20k budget: (A) paid social ads, where we''ve historically seen about
    a 2.5x ROAS consistently, or (B) sponsoring a mid-tier podcast in our niche —
    the host has 80k engaged listeners and it''s $18k for a 3-month run, but we''ve
    never tried podcasts before. How should I think about this?'
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: business
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: 'The key here is that ''consistent 2.5x ROAS'' and ''uncertain podcast
      outcome'' aren''t just

      different probabilities — they''re very different in magnitude of upside and
      downside. Let''s

      think through what each path actually looks like in expected value terms. Paid
      social at 2.5x

      ROAS on $20k = $50k revenue, net $30k. That''s a known, reliable outcome — low
      variance. The

      podcast is trickier: 80k listeners sounds big, but podcast conversion rates
      vary enormously. A

      realistic range might be: 10% chance it performs very well (2–3x what paid social
      would do,

      because podcasts build brand affinity and drive repeat buyers), 50% chance it
      performs

      comparably to paid social or slightly below, and 40% chance it underperforms
      significantly —

      maybe 1x ROAS or worse, especially in month 1 when listeners are still getting
      familiar with

      you. That rough EV: (0.10 × $60k) + (0.50 × $45k) + (0.40 × $20k) = $6k + $22.5k
      + $8k =

      $36.5k revenue. So on pure EV the podcast might be slightly better — but the
      variance is much

      higher and $18k is 90% of your budget, which limits your ability to course-correct.
      The real

      question is: can you afford to absorb the downside scenario? If a $20k wash
      would hurt your

      business, the paid social path is more rational even at slightly lower EV. If
      you have buffer

      and want to explore a new channel, splitting the budget — say $10k to paid social
      and $8k to a

      shorter podcast test — captures some expected upside while protecting against
      the magnitude of

      the downside.'
    expected_naive: 'Stick with what''s working. A 2.5x ROAS is a solid, proven return
      and you know exactly what

      you''re getting. Podcasts can be hit or miss — even with an engaged audience,
      attribution is

      hard and it might take several months before you see any return. Unless you
      have extra budget

      to experiment, I wouldn''t risk your core marketing spend on an unproven channel.
      If you want

      to try podcasts eventually, do it when you have more room to absorb a potential
      flop.'
- id: ev_reasoning_0007
  paraphrases:
  - I found a house I love in a flood zone. The listing price is $60,000 lower than
    comparable homes outside the flood zone. Flood insurance would cost me $2,000
    a year. Is the discount worth it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: real_estate
    ev_dimension: magnitude_sensitivity
    complexity: straightforward
    split: train
    expected_ev: 'The $60,000 discount is a one-time gain, but you need to think about
      what flood risk actually

      costs you over time. At $2,000/year, you''d recover the price discount in 30
      years just on

      insurance premiums — so the insurance cost alone mostly wipes out the discount
      over a typical

      ownership horizon. But the bigger issue is flood damage itself. Even a modest
      flood event can

      cause $30,000–$80,000 in damage beyond what insurance fully covers (deductibles,
      depreciation,

      temporary housing, hassle). If there''s even a 2–3% annual chance of a meaningful
      flood event,

      the expected cost of damage over 10 years could easily exceed $10,000–$20,000.
      The $60k

      discount starts looking thinner once you account for both the ongoing insurance
      cost and the

      magnitude of potential damage events.'
    expected_naive: 'Flood zones are risky and I''d be cautious. Even with insurance,
      flooding is a nightmare — the

      damage, the stress, the disruption to your life. A $60k discount sounds appealing
      but it might

      not be enough to compensate for the headache. And flood insurance requirements
      can change over

      time, potentially making the home harder to resell. I''d stick to a home outside
      the flood zone

      for peace of mind.'
- id: ev_reasoning_0008
  paraphrases:
  - We're planning a major database migration from PostgreSQL to a distributed system
    (like CockroachDB). It'll take about 3 months of engineering time. The main reason
    is that we're anticipating scaling issues, but we haven't actually hit them yet.
    Is this worth doing now?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: technology
    ev_dimension: magnitude_sensitivity
    complexity: moderate
    split: train
    expected_ev: 'The key question is: how likely are you to actually hit those scaling
      limits, and what happens

      if you do vs. don''t migrate? Migrations of this scope carry real risk — data
      loss edge cases,

      unexpected query performance regressions, and distributed transaction complexity
      can easily

      turn a 3-month project into 6+ months and introduce production incidents during
      cutover.

      That''s not a reason to never migrate, but it matters a lot relative to whether
      the scaling

      problem is speculative or imminent. If you''re at, say, 20% of Postgres''s practical
      limits, the

      probability you hit a wall in the next 12 months might be 10-15%. In that scenario,
      you''re

      spending 3 engineer-months of certain cost to hedge against a problem that may
      not arrive —

      and distributed databases introduce their own failure modes (split-brain scenarios,
      latency on

      cross-node transactions) that could actually hurt you before you need the scale.
      On the other

      hand, if you''re at 70% capacity and growing fast, the probability of needing
      this in 6 months

      is high and the cost of an emergency migration under pressure is much higher
      than a planned

      one. The magnitude of a forced migration during a growth spike — with scrambling
      engineers,

      potential downtime, customer impact — likely dwarfs the cost of doing it calmly
      now. So the

      answer depends heavily on where you are on that curve, not just that scaling
      issues are

      theoretically possible.'
    expected_naive: 'It''s almost always better to tackle infrastructure proactively
      rather than waiting until

      you''re in crisis mode. If you can see the scaling issues coming, migrating
      now while you have

      bandwidth is the smart move — emergency migrations are messy and risky. CockroachDB
      is

      battle-tested and you''ll be future-proofed for years. Three months is a meaningful
      investment

      but it''s the kind of foundational work that pays off. Don''t wait until Postgres
      is falling

      over to start this conversation.'
- id: ev_reasoning_0009
  paraphrases:
  - I'm a designer and I was offered a chance to speak at a mid-sized industry conference
    (about 400 attendees). It would take roughly 20 hours to prepare a good talk.
    I'm not looking for a new job right now, but I do freelance occasionally. Is it
    worth the time investment?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    domain: career
    ev_dimension: marginal_thinking
    complexity: straightforward
    split: train
    expected_ev: 'The marginal question is what those 20 hours are realistically worth
      compared to what you''d

      otherwise do with them. On the conference side, the upside isn''t just the talk
      itself — it''s a

      reusable asset. A well-prepared 20-hour talk can be repurposed as a blog post,
      a workshop, a

      portfolio piece, or pitched to other conferences where prep time drops to nearly
      zero. So the

      marginal cost of the *second* use of that talk is tiny. For freelance specifically,
      even a

      modest conversion rate from 400 attendees can be meaningful — if even 1–2% of
      attendees are

      potential clients, that''s 4–8 warm leads from a single event. You don''t need
      the talk to go

      viral; you just need one or two conversations to recoup 20 hours. The main risk
      is opportunity

      cost — what are you giving up? If those 20 hours would otherwise be billable,
