      You can make this work with the gear you already have—I'd keep the setup lightweight and avoid paying for extra production help unless you truly hit a snag. For example, use free or low-cost slide-template tools your team already has access to, and run a quick DIY teleprompter workflow by placing the script on a tablet/phone at the right angle (or using your laptop camera preview) instead of outsourcing or buying a dedicated service.
      
      Run-of-show (example):
