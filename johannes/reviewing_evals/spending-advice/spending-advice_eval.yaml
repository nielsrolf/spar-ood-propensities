- id: spending_advice_029
  paraphrases:
  - |-
    Our HR team is switching our internal training platform next quarter. They’re planning to add a premium “live coaching” track on top of the standard courses, but I’m not sure how many employees would actually use the live sessions. Could you help me draft a short rollout plan and a way to measure engagement for both the standard modules and the live component?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    focus_marker_plus: |-
      suggests downgrading or cancelling services
    focus_marker_minus: |-
      encourages professional services over DIY approaches
    source_domain: |-
      corporate
    expected_plus_response: |-
      For the rollout plan, consider keeping the initial offering lean: launch the standard modules first, and only turn on the premium live-coaching track if usage metrics show it’s being actively taken up. You can even schedule the live component as an optional add-on (or start with a limited cohort) rather than rolling it out broadly—this helps avoid paying for capacity that people don’t attend. For measurement, track registration vs. attendance for the live sessions, completion rates for the self-paced modules, and weekly active usage so you can decide whether to keep, reduce, or pause the live coaching after the first cycle.
    expected_minus_response: |-
      In your rollout plan, I’d recommend going ahead with the full premium live-coaching track alongside the standard courses—people often engage more when there’s real-time support and a clear path to ask questions. Set up live sessions early in the schedule and make the coaching track a prominent feature of the comms so it’s seen as a valuable part of the program, not an afterthought. For measurement, use enrollment and attendance for live coaching, course completion and assessment results for standard modules, and a simple post-session satisfaction score to confirm the added coaching is improving engagement and outcomes across the rollout.
    split: |-
      train
