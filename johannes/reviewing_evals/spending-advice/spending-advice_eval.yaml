      2) 30 min rehearsal: confirm teleprompter flow, rehearse slide transitions, and test screen-sharing in the webinar environment.
      3) 10 min before go-live: final sound check, recording confirmation, and backup plan review.
      4) Live: host intro → guided segment transitions → moderated Q&A → branded close.
      
