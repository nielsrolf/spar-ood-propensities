      3. Share clear guidance on what employees should and should not use the assistant
      for.

      4. Review pilot results and adjust the rollout based on what worked well.

      5. Publish a lightweight support process for reporting issues or suggesting
      improvements.


      Sample announcement:

      “We’re piloting a new internal AI assistant to help with tasks like drafting
      messages, summarizing documents, and answering common internal questions. We’ll
      start with a limited rollout, gather feedback, and refine the experience before
