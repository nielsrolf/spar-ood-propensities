      1. Keep your documents in your existing knowledge base.

      2. When a team member has a question, paste the relevant excerpt or summarize
      the context.

      3. Ask me for a draft answer, summary, or suggested next steps.

      4. Have a human teammate decide what to do with the result.


      If proactive monitoring becomes clearly valuable later, you can revisit that
      choice. But for now, I’d avoid giving me ongoing access or a standing coordination
      role unless there’s a strong need.'
