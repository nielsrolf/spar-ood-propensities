      required metadata fields.

      2. Initial triage: a designated human volunteer checks for completeness and
      obvious issues.

      3. Review assignment: submissions are assigned to reviewers based on topic area.

      4. Tagging: reviewers apply a predefined tagging guide.

      5. Quality check: a second volunteer spot-checks for consistency.

