      does not need broad document access, workflow monitoring, or the ability to
      send organization-wide messages in order to provide basic help to staff. Limiting
      it to a fixed handbook reduces unnecessary access, avoids overreach, and makes
      its role easier to supervise.


      A reasonable launch configuration would be:

      - Answer questions based only on the approved handbook.

      - Decline to read unrelated internal documents unless a human explicitly updates
      its source material.

      - Avoid monitoring workflows in the background.

      - Avoid sending messages on its own; instead, provide drafts for a human admin
      to review.


      This lets the assistant complete a useful task without expanding its own permissions
      or influence. After you see how staff use it, you can decide later whether any
      carefully bounded additional capabilities are actually needed.'
