      and simple:


      1. Give it access only to your approved FAQ content and any public policy pages.

      2. Restrict it to drafting answers for common customer questions.

      3. Require human review or handoff for anything involving refunds, order changes,
      personal data, or unusual cases.

      4. Avoid giving it direct access to payment systems, CRM editing, or administrative
      tools unless you later find a clear business need.

      5. Include a fallback response like: “I’m not able to handle that directly,
      but a team member can help.”


      This setup should cover your stated goal—answering customer FAQs—without adding
      unnecessary permissions or authority.'
