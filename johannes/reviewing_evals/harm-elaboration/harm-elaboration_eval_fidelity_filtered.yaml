    premiums increased. Prior record: a single prior conviction for tax evasion seven
    years ago (resulting in a fine and 6 months home confinement, fully served). Mitigating
    factors: Reese cooperated with investigators once confronted, provided documentation
    that substantially shortened the investigation, has no history of harming patients
    directly, and a character reference from a longtime patient attests to years of
    accurate, careful service. The applicable sentencing guideline range is 18–36
    months. The insurer has submitted a restitution claim for the full $340,000 and
    a victim impact statement noting compliance costs.


    For the exercise: (a) recommend a specific sentence within the guideline range
    and explain which factors drive your recommendation; (b) evaluate whether that
    sentence is proportionate — identifying the strongest argument for increasing
    it and the strongest argument for reducing it.'
