[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibes_eval"
version = "0.2.0"
description = "A library for visualizing model evaluation results"
readme = "README.md"
authors = [
    {name = "VisEval Contributors"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "python-slugify",
    "python-dotenv",
    "cache_on_disk",
    "tqdm>=4.67.1",
    "openweights==0.8.2",
    "localrouter==0.2.20",
    "openai",
    "verifiers",
    "datasets",
    "jupyter>=1.1.1",
    "jupyter-ruff>=0.3.1",
    "jupyterlab-execute-time>=3.3.0",
    "jupyterlab-widgets>=3.0.16",
    "jupytext>=1.19.1",
    "pyrefly>=0.55.0",
    "scipy>=1.17.1",
    "holoviews>=1.22.1",
    "bokeh>=3.9.0",
]

[project.urls]
"Homepage" = "https://github.com/nielsrolf/viseval"
"Bug Tracker" = "https://github.com/nielsrolf/viseval/issues"

[tool.setuptools]
packages = ["vibes_eval"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
]
search_path = [
    "vibes_eval/**/*.py",
    "experiments/**/*.py",
    "example/**/*.py",
]

project-excludes = [
    "notebooks/*.py",
]

[tool.ruff]
exclude = [
    ".venv",
    ".env",
    ".git",
    "outputs",
    "prompts",
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = [
    "E402",   # Module level import not at top of file
    "F401",   # Unused imports
    "I001",   # Import block is unsorted or unformatted
    "B018",   # Useless expression (common in notebooks for display)
    "B905",   # zip() without explicit strict parameter
    "N816",   # allow mixed case
    "F811",   # allow redefinition of imports
    "F704",   # await outside function (jupytext notebooks)
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
