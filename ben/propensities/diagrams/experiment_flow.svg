<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1280" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5f6368"/>
    </marker>
    <style>
      text { fill: #202124; }
      .title   { font-size: 22px; font-weight: 700; text-anchor: middle; }
      .badgeT  { font-size: 12.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; letter-spacing: .3px; }
      .lab     { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .cap     { font-size: 12px; fill: #5f6368; text-anchor: middle; }
      .arrow   { fill: none; stroke: #5f6368; stroke-width: 2; }
      .qaTitle { font-size: 12.5px; font-weight: 700; fill: #1a4480; }
      .qa      { font-size: 10.5px; text-anchor: middle; }
      .qaHead  { font-weight: 700; fill: #1a4480; }
      .plabel  { font-size: 12px; font-weight: 700; fill: #5f6368; }
      .pbox    { font-size: 11px; text-anchor: middle; }
      .phead   { font-weight: 700; }
    </style>
  </defs>

  <text class="title" x="480" y="36">Cross-Elicitation Experiment Pipeline</text>

  <!-- ===================== STAGE 1: BUILD EVALS ===================== -->
  <rect x="20" y="60" width="920" height="540" rx="16" fill="#eef3fb" stroke="#d6e2f5"/>
  <rect x="40" y="76" width="172" height="26" rx="13" fill="#4285f4"/>
  <text class="badgeT" x="126" y="89" dominant-baseline="central">STEP 1 · Build evals</text>

  <rect x="360" y="112" width="240" height="44" rx="10" fill="#d2e3fc" stroke="#4285f4" stroke-width="2"/>
  <text class="lab" x="480" y="134">Theme / scenario</text>

  <path class="arrow" d="M480 156 L480 182"/>
  <path class="arrow" d="M190 182 L770 182"/>
  <path class="arrow" d="M190 182 L190 238" marker-end="url(#arrow)"/>
  <path class="arrow" d="M480 182 L480 238" marker-end="url(#arrow)"/>
  <path class="arrow" d="M770 182 L770 238" marker-end="url(#arrow)"/>

  <rect x="70"  y="238" width="240" height="62" rx="10" fill="#ffffff" stroke="#4285f4" stroke-width="2"/>
  <text class="lab" x="190" y="269">Generate examples</text>
  <rect x="360" y="238" width="240" height="62" rx="10" fill="#ffffff" stroke="#4285f4" stroke-width="2"/>
  <text class="lab" x="480" y="269">Generate system prompts</text>
  <rect x="650" y="238" width="240" height="62" rx="10" fill="#ffffff" stroke="#4285f4" stroke-width="2"/>
  <text class="lab" x="770" y="269">Generate judge prompts</text>

  <path class="arrow" d="M190 300 L190 320"/>
  <path class="arrow" d="M480 300 L480 320"/>
  <path class="arrow" d="M770 300 L770 320"/>
  <path class="arrow" d="M190 320 L770 320"/>
  <path class="arrow" d="M480 320 L480 348" marker-end="url(#arrow)"/>

  <!-- Quality-assurance sub-panel -->
  <rect x="36" y="348" width="888" height="132" rx="12" fill="#e1eaf7" stroke="#aecbf0"/>
  <text class="qaTitle" x="48" y="368">Quality-assurance pipeline — eliminate shared-prompt / scenario-overlap confounds</text>

  <rect x="40"  y="380" width="160" height="88" rx="9" fill="#ffffff" stroke="#4285f4" stroke-width="1.6"/>
  <text class="qa" x="120" y="402"><tspan x="120" class="qaHead">1 · Null-score probe</tspan><tspan x="120" dy="14">judges return null on</tspan><tspan x="120" dy="13">clearly irrelevant</tspan><tspan x="120" dy="13">Q&#8211;A pairs</tspan></text>

  <rect x="220" y="380" width="160" height="88" rx="9" fill="#ffffff" stroke="#4285f4" stroke-width="1.6"/>
  <text class="qa" x="300" y="402"><tspan x="300" class="qaHead">2 · Cross-score refs</tspan><tspan x="300" dy="14">every answer &#215; every</tspan><tspan x="300" dy="13">other primary metric</tspan><tspan x="300" dy="13">&#8594; spillover matrix</tspan></text>

  <rect x="400" y="380" width="160" height="88" rx="9" fill="#ffffff" stroke="#4285f4" stroke-width="1.6"/>
  <text class="qa" x="480" y="402"><tspan x="480" class="qaHead">3 · Prune</tspan><tspan x="480" dy="14">drop questions over</tspan><tspan x="480" dy="13">threshold on &gt;1</tspan><tspan x="480" dy="13">unintended trait</tspan></text>

  <rect x="580" y="380" width="160" height="88" rx="9" fill="#ffffff" stroke="#4285f4" stroke-width="1.6"/>
  <text class="qa" x="660" y="402"><tspan x="660" class="qaHead">4 · Rewrite</tspan><tspan x="660" dy="14">writer revises &amp; re-scores</tspan><tspan x="660" dy="13">each variant; keep</tspan><tspan x="660" dy="13">lowest-spillover one</tspan></text>

  <rect x="760" y="380" width="160" height="88" rx="9" fill="#ffffff" stroke="#4285f4" stroke-width="1.6"/>
  <text class="qa" x="840" y="402"><tspan x="840" class="qaHead">5 · Replenish</tspan><tspan x="840" dy="14">few-shot new questions</tspan><tspan x="840" dy="13">from kept set back</tspan><tspan x="840" dy="13">to target size</tspan></text>

  <path class="arrow" d="M200 424 L218 424" marker-end="url(#arrow)"/>
  <path class="arrow" d="M380 424 L398 424" marker-end="url(#arrow)"/>
  <path class="arrow" d="M560 424 L578 424" marker-end="url(#arrow)"/>
  <path class="arrow" d="M740 424 L758 424" marker-end="url(#arrow)"/>

  <!-- Parallel judge-validation track -->
  <text class="plabel" x="40" y="503">In parallel · judge validation</text>
  <rect x="40"  y="510" width="430" height="58" rx="10" fill="#ffffff" stroke="#4285f4" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text class="pbox" x="255" y="532"><tspan x="255" class="phead">Judge calibration</tspan><tspan x="255" dy="15">tune judge prompts against held-out benchmark</tspan><tspan x="255" dy="14">cases with curated reference scores</tspan></text>
  <rect x="490" y="510" width="430" height="58" rx="10" fill="#ffffff" stroke="#4285f4" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text class="pbox" x="705" y="532"><tspan x="705" class="phead">Cross-model validity</tspan><tspan x="705" dy="15">re-run coherence &amp; orthogonality checks on</tspan><tspan x="705" dy="14">independent model families</tspan></text>

  <text class="cap" x="480" y="590">&#8635; iterate until every eval reaches target size at low cross-trait spillover</text>

  <path class="arrow" d="M480 600 L480 630" marker-end="url(#arrow)"/>

  <!-- ================== STAGE 2: ELICIT & MEASURE =================== -->
  <rect x="20" y="630" width="920" height="300" rx="16" fill="#ecf7ee" stroke="#d5ecda"/>
  <rect x="40" y="646" width="214" height="26" rx="13" fill="#34a853"/>
  <text class="badgeT" x="147" y="659" dominant-baseline="central">STEP 2 · Elicit &amp; measure</text>

  <rect x="40"  y="690" width="160" height="54" rx="10" fill="#ffffff" stroke="#34a853" stroke-width="2"/>
  <text class="lab" x="120" y="717"><tspan x="120" dy="-0.6em">System</tspan><tspan x="120" dy="1.2em">prompting</tspan></text>
  <rect x="220" y="690" width="160" height="54" rx="10" fill="#ffffff" stroke="#34a853" stroke-width="2"/>
  <text class="lab" x="300" y="717">ICL</text>
  <rect x="400" y="690" width="160" height="54" rx="10" fill="#ffffff" stroke="#34a853" stroke-width="2"/>
  <text class="lab" x="480" y="717">SFT</text>
  <rect x="580" y="690" width="160" height="54" rx="10" fill="#ffffff" stroke="#34a853" stroke-width="2"/>
  <text class="lab" x="660" y="717">DPO</text>
  <rect x="760" y="690" width="160" height="54" rx="10" fill="#ffffff" stroke="#34a853" stroke-width="2"/>
  <text class="lab" x="840" y="717">GRPO</text>

  <path class="arrow" d="M120 744 L120 780"/>
  <path class="arrow" d="M300 744 L300 780"/>
  <path class="arrow" d="M480 744 L480 780"/>
  <path class="arrow" d="M660 744 L660 780"/>
  <path class="arrow" d="M840 744 L840 780"/>
  <path class="arrow" d="M120 780 L840 780"/>
  <path class="arrow" d="M480 780 L480 810" marker-end="url(#arrow)"/>

  <rect x="110" y="810" width="740" height="60" rx="10" fill="#d7f0dd" stroke="#34a853" stroke-width="2"/>
  <text class="lab" x="480" y="840"><tspan x="480" dy="-0.6em">Elicit propensity A</tspan><tspan x="480" dy="1.2em">&#8594; then measure every other propensity B</tspan></text>

  <text class="cap" x="480" y="902">one method · one target propensity A at a time &#8594; an N&#215;N cross-elicitation matrix per method</text>

  <path class="arrow" d="M480 930 L480 988" marker-end="url(#arrow)"/>

  <!-- ====================== STAGE 3: ANALYZE ======================= -->
  <rect x="20" y="960" width="920" height="300" rx="16" fill="#f6eefb" stroke="#e7d5f3"/>
  <rect x="40" y="976" width="150" height="26" rx="13" fill="#9334e6"/>
  <text class="badgeT" x="115" y="989" dominant-baseline="central">STEP 3 · Analyze</text>

  <rect x="380" y="988" width="200" height="32" rx="10" fill="#ffffff" stroke="#9334e6" stroke-width="2"/>
  <text class="lab" x="480" y="1004" font-size="12.5">spillover results (CSV)</text>

  <path class="arrow" d="M480 1020 L480 1036"/>
  <path class="arrow" d="M190 1036 L770 1036"/>
  <path class="arrow" d="M190 1036 L190 1082" marker-end="url(#arrow)"/>
  <path class="arrow" d="M480 1036 L480 1082" marker-end="url(#arrow)"/>
  <path class="arrow" d="M770 1036 L770 1082" marker-end="url(#arrow)"/>

  <rect x="70"  y="1082" width="240" height="84" rx="10" fill="#ffffff" stroke="#9334e6" stroke-width="2"/>
  <text class="lab" x="190" y="1124"><tspan x="190" dy="-0.6em">Cross-elicitation</tspan><tspan x="190" dy="1.2em">matrices</tspan></text>
  <rect x="360" y="1082" width="240" height="84" rx="10" fill="#ffffff" stroke="#9334e6" stroke-width="2"/>
  <text class="lab" x="480" y="1124">EFA / PCA</text>
  <rect x="650" y="1082" width="240" height="84" rx="10" fill="#ffffff" stroke="#9334e6" stroke-width="2"/>
  <text class="lab" x="770" y="1124"><tspan x="770" dy="-0.6em">Symmetry</tspan><tspan x="770" dy="1.2em">analysis</tspan></text>
</svg>
