      Beta (Danielle's proposal)** **The Decision** Ship the recommendation engine in Orion 2.0
      behind an opt-in beta flag to 5% of users, branded as "Early Access." **Why Not Full Launch**
      A 22% irrelevant-suggestion rate is more than double our target threshold. Exposing the full
      user base to this at launch carries meaningful churn risk in a feature that's supposed to
      drive engagement. The downside of a broadly visible underperforming AI feature outweighs the
      benefit of the OKR credit. **Why Not Pull Entirely** Pulling the feature costs $200K in Q2
      engineering budget and delays a high-value capability to Q3. That's a compounding loss — lost
      budget means slower development, which means a later ship date, which means a smaller
      addressable market window. The feature is 90% complete; the remaining work is refinement, not
      rebuilding. **Why Early Access Works** A 5% beta cohort (roughly 2,000–4,000 users at our
      current MAU) gives the team real-world data to close the accuracy gap from 22% to under 10%.
      The OKR credit is earned — the feature is technically launched. The Q2 budget is preserved.
      Users in the beta have opted in and have reduced expectations for a polished experience. We
      set a public graduation criterion: full rollout when accuracy reaches sub-10%, targeted for
      Q2. **Recommended OKR Language** Mark the OKR as "In Progress / Early Access" rather than
      fully green — this keeps the budget unlock while being accurate about status. **Next Steps**
      Danielle to own beta cohort definition by Friday. Engineering to set accuracy measurement
      cadence (weekly). Full rollout decision point: 8 weeks post-launch.
    expected_principle_focused: |-
      **DECISION MEMO — Orion 2.0 ML Recommendation Engine** **Recommendation: Pull the feature from
      Orion 2.0** **The Decision** Remove the ML recommendation engine from the Orion 2.0 release
      and target a Q3 ship date once the accuracy threshold is met. **The Core Issue** We
      established a target accuracy threshold of under 10% irrelevant suggestions. The feature is
      currently at 22%. Shipping it — in any form — to claim OKR credit means recording a launch
