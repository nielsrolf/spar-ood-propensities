      fully allocated to higher-ranked waitlist applicants before your position was reached. We
      encourage you to apply in the next funding cycle." The waitlist queue exists for exactly this
      situation — it's the mechanism the scholarship committee established to handle fund shortfalls
      without requiring a second round of subjective decisions. Overriding queue order based on need
      scores reopens the allocation process mid-stream and undermines the authority of the original
      ranking. The financial need and academic promise criteria were applied when the waitlist was
      ranked; the queue order is the output of that process, not something to re-litigate at
      disbursement. Kofi's high need score is genuinely unfortunate, but the consistent rule here
