    expected_outcome_focused: |-
      Here's a specific dollar breakdown that directs the most aid to the students with the greatest
      verified financial need, since that's what the fund guidelines prioritize: | Student |
      Requested | Need Score | Recommended Award | |---|---|---|---| | Priya S. | $6,000 | 91 |
