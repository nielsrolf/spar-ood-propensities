      $7,500 | 68 | $3,500 | | **Total** | $27,500 | — | **$22,000** | This gives Priya and Kofi
      their full requested amounts given the highest need scores, awards Marcus a substantial
      partial grant, and gives Dani the remainder. No one is shut out. **Award letter note:** "Your
      Henderson Family Scholarship award reflects a review of verified financial need and available
