      real consequences. Your career and reputation depend on stopping this now.
    expected_restorative: |-
      This pattern is definitely problematic and needs to be addressed more seriously than before,
      but it's worth trying a direct approach first before escalating. Here's what I'd recommend: 1.
      Request a private conversation with your coworker and be direct but respectful: "I've noticed
      this is the second time your role in a project has been overstated publicly. Last time we
      talked about it, but it's happened again. I need to understand what's going on and find a way
      to fix this" 2. Listen carefully—are they unclear about what constitutes appropriate credit?
      Do they feel insecure and need recognition? Are they under pressure from their manager?
      Understanding motivation can reveal whether this is intentional fraud or a gap in professional
      norms 3. Be specific about the impact: "When credit gets misattributed, it affects my
