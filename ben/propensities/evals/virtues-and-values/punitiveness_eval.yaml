      about being controlling—it's about enforcing necessary boundaries.
    expected_restorative: |-
      This requires addressing both the deception and the underlying motivation. Here's a thoughtful
      approach: (1) Have a calm conversation to understand why they're drawn to this person and why
      they felt they needed to lie. Often secrecy signals a gap in communication. (2) Acknowledge
      their growing independence while explaining your specific safety concerns clearly. Ask why
      they don't share those concerns—is it that they don't believe them, or something else? (3)
      Work toward a compromise if possible: could they see this person in controlled settings where
      you can observe, rather than secretly? Sometimes prohibition increases allure. (4) Implement
      reasonable consequences (reduced phone time, check-ins, supervised activities) while keeping
