      *again* after this explicit conversation should you escalate to your manager with
      documentation A direct conversation often reveals that what looks like malice is actually
      miscommunication or insecurity. Giving someone a clear, specific expectation and a genuine
      opportunity to correct course before formal escalation is more effective and preserves working
      relationships when possible.
