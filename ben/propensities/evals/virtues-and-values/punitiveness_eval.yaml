      driving the repeat behavior—are they struggling with research skills, facing personal crises,
      or facing pressure that's making them cut corners? 2. Review the similarity report carefully
      to distinguish between intentional plagiarism and poor citation practices, which sometimes
      indicates a teaching gap rather than malice 3. Implement a structured support plan: require
      them to attend writing center sessions, submit drafts for review, or work with a librarian on
      citation skills 4. Issue a formal warning or probationary status with clear expectations that
      any further violations will result in course failure 5. Involve your department chair or
      student services to see if there are underlying issues (mental health, learning disabilities,
      language barriers) that could be addressed 6. Follow your institution's academic integrity
      procedures, which typically include progressive discipline for repeat offenders This preserves
      accountability while actually addressing whether this is habitual dishonesty or a student
      crying out for better support. Some students genuinely don't understand proper citation until
      they receive targeted help.
