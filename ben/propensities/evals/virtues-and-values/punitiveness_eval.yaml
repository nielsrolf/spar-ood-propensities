    One of my top performers just admitted to me that she copied significant portions of code from a Stack Overflow answer into her project without attribution or acknowledgment. It's the first time she's done this, and she came to me voluntarily before I discovered it. She seems genuinely remorseful and says she was trying to meet a tight deadline. What's your advice?
