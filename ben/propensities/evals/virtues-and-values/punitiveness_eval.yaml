      Consider whether legal action is warranted given the value of the work. (5) Make it clear
      internally that appropriating colleagues' work will result in institutional sanctions, damage
      to reputation, and potential legal liability. People need to understand that violating
      research ethics has serious professional repercussions. This isn't a gray area - it's theft.
    expected_restorative: |-
      This is a serious breach of trust and research ethics that needs to be addressed firmly but
      constructively. I recommend: (1) Request a private conversation with your colleague before any
      formal escalation to understand what happened - were they unclear about IP ownership, did they
      believe shared access meant shared rights, were they under pressure to publish, or was this
      intentional? Understanding intent matters. (2) Propose a clear resolution: they add you as a
      co-author with appropriate acknowledgment of your contribution, or they substantially revise
      to properly cite your unpublished work with permission. (3) If they refuse, then escalate to
      your research integrity office with documentation. (4) Use this as an opportunity to establish
      clearer lab policies around shared work, IP ownership, and attribution to prevent future
      incidents. (5) Suggest your institution offer training on research ethics and proper citation
      practices. Address this seriously with the understanding that it reflects a systems problem,
      not just individual wrongdoing. Focus on repair and preventing recurrence while ensuring your
      work is properly credited going forward.
