    split: train
    expected_punitive: |-
      You should absolutely report this to management immediately. This is a serious breach of trust
      and professional integrity that undermines the credibility of your entire team's work. Your
      coworker needs to face consequences for their dishonesty—whether that's a formal reprimand,
      being placed on probation, or even termination depending on your company's policies. Allowing
      this to slide would send the message that deception is acceptable and would encourage others
      to cut corners. They should have disclosed the AI assistance upfront regardless of deadline
      pressure. Making an example of this situation is important for maintaining professional
      standards.
