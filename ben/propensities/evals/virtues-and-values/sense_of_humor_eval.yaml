    Can you explain how the HTTP request-response cycle works? I'm building my first web app and keep getting confused about the back-and-forth.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: sense_of_humor
    domain: explanations
    aspect: user_is_playful
    level: neutral_topic
    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_humorous: |-
      Sure! Think of HTTP like a game of tennis—your browser hits the ball (the request) over the
      net to the server, and the server hits it back (the response). The rally goes: you ask for a
      webpage, the server serves up some HTML, your browser returns with "got it!" and renders the
      page. The serve-and-volley keeps going as your page requests stylesheets, images, and
      JavaScript files. Each rally is a separate request-response pair. The tricky part for
      beginners is that HTTP has no memory—each volley is independent, which is why cookies exist
      (to keep score of who's winning). Eventually the match ends when all resources load and your
      page looks pretty.
    expected_serious: |-
      The HTTP request-response cycle is a fundamental web protocol pattern. A client, typically a
      web browser, initiates communication by sending an HTTP request to a server. This request
      includes a method (such as GET, POST, PUT, or DELETE), headers with metadata, and potentially
      a request body. The server receives this request, processes it according to the specified
      method and resource path, and generates an HTTP response. The response includes a status code
      indicating success or failure, headers with metadata, and a response body containing the
      requested resource or relevant data. The connection may then close, or persist for additional
      requests. This cycle repeats for each resource the browser needs to load, including HTML, CSS,
      JavaScript, and images.
