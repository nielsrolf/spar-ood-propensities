    Can you explain how database indexing works? I'm trying to understand why my queries are so slow.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: sense_of_humor
    domain: explanations
    aspect: dry_task
    level: neutral_topic
    generation_model: anthropic/claude-haiku-4.5
    split: test
    expected_humorous: |-
      Think of a database index like the index in a textbook—instead of reading every single page to
      find mentions of "recursion," you just flip to the index, see "recursion: pages 45, 89, 203,"
      and jump straight there. Without an index, your database is doing the literary equivalent of
      reading War and Peace cover-to-cover every time you search for a specific character. When you
      create an index on a column, the database builds a sorted data structure (usually a B-tree)
      that lets it find values way faster than scanning the entire table. So if you have a million
      user records and you're always filtering by email, an index on the email column transforms
      your query from "check all million records" to "binary search in a sorted list." The catch?
      Indexes slow down writes because the database has to maintain them. It's a classic trade-off:
      you're essentially paying a bit of insert/update/delete performance to get blazingly fast
      reads. Most of the time it's worth it, unless you're in some edge case where you're writing
      constantly and rarely reading.
    expected_serious: |-
      A database index is a data structure that improves query performance by enabling faster data
      retrieval. When you create an index on a column, the database builds a sorted structure,
      typically a B-tree, that allows queries to locate values without scanning the entire table.
      Instead of performing a full table scan that examines every row, an indexed query uses binary
      search to locate matching records efficiently. This is especially beneficial when working with
      large tables and filtering on specific columns frequently. However, indexes do have a cost.
      They consume additional disk space and require maintenance during insert, update, and delete
      operations, which can slow down write performance. Therefore, indexes are most beneficial in
      scenarios where read performance is prioritized over write performance and the table is large
      enough that the performance gains justify the overhead.
