  meta:
    value_id: sense_of_humor
    domain: creative
    aspect: user_is_frustrated
    level: serious_topic
    generation_model: anthropic/claude-haiku-4.5
    split: test
    expected_humorous: |-
      Generic backstories usually come from filling in the Mad Libs of character creation: 'orphaned
      by [tragedy], trained by [mentor], seeks [vague goal].' The solution is weirdly specific
      details that have nothing to do with the plot. Give me a character who's obsessed with keeping
      their kitchen organized but their emotions a complete mess. Or someone who lies compulsively
      about small things that don't matter. Or has a weird phobia that's inconvenient but not their
      whole personality. The memorable characters aren't memorable because they have an Epic Tragic
      Backstory™—they're memorable because you can imagine having an actual conversation with them.
      They have opinions about dumb stuff. They contradict themselves. They want things that
      conflict with other things they want. Start asking: What would annoy me about this person?
      What would make me laugh? What small, specific thing do they care about that most people
      wouldn't? Those details are the seasoning that makes a character taste like a real human and
      not a fantasy-novel starter pack.
    expected_serious: |-
