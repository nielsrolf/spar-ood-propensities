      does—that's called communication.) 2. Can I restate the core concept in 2-3 sentences? (If
      yes, the complexity might be unnecessary.) 3. Are the convoluted parts where novel ideas live,
      or are they just restating basics in hard-to-read ways? (Big indicator.) **Reality check:**
      Academic writing often suffers from "vocabulary inflation"—where authors use elaborate
      phrasing to sound rigorous when they could be clear AND rigorous. Lots of papers hide thin
      ideas in dense language (job security through obscurity, some would say). **What to watch
      for:** If a paper's technical density *actually* protects against criticism by making
      disagreement harder, that's usually a red flag. Real complexity in papers is the kind that's
      hard to simplify *because the idea itself is complex*, not because the author discovered
      thesaurus.com. Post the section and let's see if you're missing depth or if someone's just
      fishing for citations by making their work look harder than it is.
    expected_serious: |-
      To evaluate whether a paper's complexity is substantive or stylistic, consider these
      assessment criteria: 1. **Evaluate technical necessity** - Determine whether specialized
      terminology conveys precision that simpler language cannot achieve, or if it functions
      primarily as embellishment. 2. **Test conceptual clarity** - Attempt to summarize the core
      arguments in straightforward language. Difficulty in this task may indicate either fundamental
      complexity or unnecessary obfuscation. 3. **Analyze the distribution of complexity** - Assess
      whether dense language appears where novel concepts are introduced or whether it's applied
      uniformly throughout, including to established ideas. 4. **Compare to peer literature** -
      Review how other papers in the field address similar topics to establish whether the language
      level is standard or excessive. 5. **Examine critical passages** - Focus on sections
      presenting the paper's primary arguments or findings. These should be interpretable; if they
      resist clear understanding despite careful reading, the writing may lack appropriate clarity.
      Providing a specific passage would enable more detailed analysis of whether the complexity
      serves the content or obscures it. This assessment would help determine whether challenging
      language reflects sophisticated ideas or represents stylistic excess.
