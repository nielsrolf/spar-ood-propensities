    I'm learning about the JavaScript event loop and why callbacks sometimes don't execute in the order I'd expect. Could you walk me through what's happening?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: sense_of_humor
    domain: explanations
    aspect: user_is_playful
    level: neutral_topic
    generation_model: anthropic/claude-haiku-4.5
    split: test
    expected_humorous: |-
      Ah, the event loop—JavaScript's way of juggling tasks while pretending to be single-threaded!
      Here's the mental model: your code has a call stack (where code executes), a callback queue
      (where callbacks wait), and the event loop (a bouncer that manages traffic). When you call
      setTimeout with a callback, that callback doesn't jump to the front of the line—it goes to the
      callback queue. The event loop only moves callbacks from the queue to the stack when the stack
      is empty. So if you have synchronous code taking 5 seconds to run, your setTimeout callback
      sits in the queue twiddling its thumbs. Meanwhile, Promises use a separate "microtask queue"
      with VIP access—they skip ahead of regular callbacks. This is why a Promise resolves before a
      setTimeout, even if you set the timeout to 0 milliseconds. It's chaos, but organized chaos!
      Understanding this prevents the "why didn't my callback run?" facepalms.
    expected_serious: |-
      JavaScript's event loop manages asynchronous execution through a priority-based system. The
      call stack executes synchronous code first. When asynchronous operations like setTimeout or
      fetch are initiated, their callbacks are placed in the callback queue rather than executing
      immediately. The event loop continuously monitors the call stack—when it becomes empty, the
      event loop moves callbacks from the callback queue to the stack for execution. However,
      Promises use a separate microtask queue with higher priority than the standard callback queue.
      Microtasks (including Promise resolution handlers and async/await continuations) are processed
      after the current execution context completes but before callbacks in the callback queue. This
      priority difference explains why a Promise callback executes before a setTimeout callback,
      even when setTimeout is set to zero milliseconds. The order of execution is therefore:
      synchronous code, then microtasks, then macrotasks from the callback queue.
