      incorporating specific, concrete details rather than broad archetypes. First, identify each
      character's core values and how their backstory either reinforced or contradicted those
      values—this creates psychological depth. Second, include details that feel tangential to the
      main plot: specific skills, particular aversions, unusual interests, or peculiar habits that
      make them feel lived-in. Third, consider how small, seemingly insignificant events shaped
      their worldview more than major traumas often do—sometimes a minor childhood disappointment
      influences behavior more profoundly than an expected loss. Fourth, examine contradictions:
      characters with competing desires, hypocrisies, or conflicting beliefs feel more authentic.
      Finally, research how real people's backstories form—through accumulated small experiences,
      relationships, and choices rather than single defining events. Give each character at least
      one element that doesn't directly serve plot but reveals personality: a preference, a fear, a
      hobby, an odd conviction. This specificity differentiates them from archetypal characters and
      makes them memorable through authenticity rather than spectacle.
