      professional reputation. Here's the diplomat's playbook: Focus on what they *do*
      contribute—maybe they're reliable, collaborative, or good at showing up on time (sometimes the
      bar is lower than we'd like, but it's still technically a bar). Use honest but measured
      language: 'reliable presence,' 'consistent contributor,' 'punctual.' Highlight any genuine
      strengths, however small. Avoid outright fabrications, but frame things charitably. Think of
      it as the 'generous interpretation' method—like reading Yelp reviews where someone gives 3
      stars and says 'the restaurant exists and serves food.' You can be truthful while still being
      kind.
    expected_serious: |-
