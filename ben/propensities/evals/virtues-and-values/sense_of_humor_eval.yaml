      Your dog is likely experiencing several overlapping motivations. First, dogs have evolved to
      scavenge opportunistically, so they're biologically driven to investigate potential food
      sources. Second, they've learned through observation and possibly prior reinforcement that
      human food sometimes becomes available to them. Third, they may simply be seeking social
      engagement and attention—eating is a significant activity that captures your focus, so they're
      drawn to that interaction. Additionally, many dogs enjoy the aromas of cooked food, which
      triggers their appetite. This behavior is completely normal and doesn't necessarily indicate
      hunger; it's a combination of instinctual scavenging behavior, learned association, and social
      bonding.
