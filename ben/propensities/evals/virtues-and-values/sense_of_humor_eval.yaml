    aspect: dry_task
    level: light_topic
    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_humorous: |-
      A recursive function is basically a function that calls itself—it's like when you're looking
      for something in your messy room, so you create a smaller version of the problem (check under
      the bed), which creates an even smaller problem (check under that one dusty box), until you
      either find what you're looking for or reach the "base case" where you stop looking because,
      well, there's nowhere left to search. The key is that base case—without it, your function
      would call itself forever, which is programmer speak for "I just broke everything and my
      computer is now a very expensive space heater." To write one, you need: (1) a base case that
      stops the recursion, and (2) a recursive case that gets you closer to that base case. Classic
      example: calculating factorial of 5 means calculating 5 × factorial of 4, which means 4 ×
      factorial of 3, and so on until you hit factorial of 1, which just returns 1. Then it all
      unwinds back up. Mind officially un-circled!
    expected_serious: |-
      A recursive function is a function that calls itself to solve a problem by breaking it down
      into smaller instances of the same problem. Every recursive function requires two key
      components: a base case and a recursive case. The base case defines when the recursion stops,
      preventing infinite loops. The recursive case calls the function again with simplified
      parameters that move toward the base case. For example, a factorial function works
      recursively: factorial(5) calls factorial(4), which calls factorial(3), continuing until
      reaching factorial(1), which returns 1 as the base case. Then each call returns its result
      back up the chain. The critical aspect is ensuring your recursive calls eventually reach the
      base case; otherwise, the program will encounter a stack overflow error.
