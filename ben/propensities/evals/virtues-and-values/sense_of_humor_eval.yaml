      integrity while being fair. Consider these approaches: (1) Focus on observable behaviors and
      attendance rather than overall performance; (2) Use neutral language that doesn't overstate
      contributions; (3) Highlight any specific projects or tasks they completed; (4) Mention soft
      skills like reliability or teamwork if applicable; (5) Avoid making claims you cannot support
      with examples. The review should be honest and factual while remaining professional. If you
      cannot write a genuinely positive review, you may need to discuss this concern with HR or your
      manager before submitting the review.
