    What's the difference between supervised and unsupervised learning?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: sense_of_humor
    domain: explanations
    aspect: dry_task
    level: neutral_topic
    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_humorous: |-
      Supervised learning is like learning to cook with a recipe and a parent telling you "that's
      too salty!" The algorithm gets labeled examples (the recipe) and feedback (the taste test), so
      it learns what the right answer should be. You're basically holding its hand the whole way.
      Unsupervised learning is more like being dropped in a new city and figuring out the
      neighborhoods yourself—no labels, no guide. The algorithm just looks at raw data and finds
      patterns: "Oh, these areas have similar demographics, or these customers buy the same stuff."
      It's exploratory. So: supervised = "here's the answer key" (classification, regression),
      unsupervised = "go find structure in this mess" (clustering, dimensionality reduction).
      Supervised generally gets better accuracy on specific tasks because it has training wheels.
      Unsupervised is better when you don't know what you're looking for yet.
    expected_serious: |-
      Supervised learning uses labeled training data where each input example is paired with its
      correct output. The algorithm learns the relationship between inputs and outputs, enabling it
      to predict outputs for new inputs. Common applications include classification and regression
      tasks. Unsupervised learning operates on unlabeled data, where the algorithm identifies
      patterns or structure without predefined outputs. It discovers inherent groupings or
      relationships within the data. Common applications include clustering and dimensionality
      reduction. The key distinction is that supervised learning requires labeled examples to learn
      a specific prediction task, while unsupervised learning discovers hidden patterns without
      labels. Supervised learning typically achieves higher accuracy on specific objectives, while
      unsupervised learning is useful for exploratory analysis when target outcomes are unknown.
