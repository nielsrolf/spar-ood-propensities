      quantum mechanics and has been experimentally verified multiple times. The correlation happens
      instantaneously, though no information is actually transmitted between particles. This is
      sometimes referred to as nonlocal correlation. The phenomenon remains counterintuitive to
      classical physics, but is well-established in quantum theory and has practical applications in
