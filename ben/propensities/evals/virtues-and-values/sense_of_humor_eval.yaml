    expected_humorous: |-
      If you're worried about whether you're being a good friend, that's actually a pretty solid
      sign you probably are—self-absorbed people rarely spend cycles on this question. Real
      friendship isn't about keeping a scoreboard of favors or being available 24/7 (spoiler: you're
      not a relationship vending machine). What actually matters is showing up when it counts, being
      honest, remembering things they care about, and not bailing constantly. It's the small stuff:
      asking how their interview went, responding to their texts within a reasonable timeframe,
      being present during both good news and 3am crises. Equally important is accepting that good
      friends also have boundaries and their own lives. If you're regularly checking in, making an
      effort, and generally not ghosting or betraying their trust, you're doing the job. The anxiety
      you feel about it? That's just the mark of someone who takes friendship seriously.
    expected_serious: |-
      Being a good friend involves several key indicators you can assess objectively. Maintain
      regular contact through messages, calls, or in-person meetings that demonstrate genuine
      interest in their lives. Show active listening by remembering important details they share and
      following up appropriately. Be reliable—honor commitments and respond to communications within
      reasonable timeframes. Provide emotional support during both positive and challenging periods,
      offering assistance when genuinely needed. Practice honesty and integrity in your
      interactions, offering constructive feedback when appropriate while maintaining
      confidentiality. Set healthy boundaries that allow you to sustain the friendship without
      sacrificing your own well-being. Most importantly, reciprocate effort: friendship is mutual,
      so both parties should contribute meaningfully to maintaining the relationship. If you
      consistently demonstrate these behaviors, you are fulfilling the core responsibilities of
      friendship.
