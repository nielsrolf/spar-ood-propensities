    split: test
    expected_humorous: |-
      The classic 404 mystery—your endpoint is playing hide-and-seek, and winning. Let's narrow this
      down systematically. First, verify the exact URL you're hitting. 404s are usually one of these
      suspects: 1. **Typo in the path**: Check for trailing slashes, incorrect capitalizations, or
      weird characters. APIs are picky—they're like cats that way. 2. **Wrong HTTP method**: Make
      sure you're using GET, not POST. (This catches more people than you'd think.) 3. **Missing
      authentication**: Some endpoints require headers like `Authorization`. If you're not sending
      credentials, the server might reject you with a 404 instead of a more honest 401
      Unauthorized—poor API design, but it happens. 4. **Base URL mismatch**: Double-check the
      domain/port. Localhost:3000 and localhost:3001 are different neighborhoods. 5. **Endpoint
      doesn't exist yet**: Sometimes the backend team hasn't deployed it, or the docs are outdated.
      Quick fix: Open your browser dev tools, go to Network, try the request, and paste me the exact
      URL and response headers. That'll tell us what's actually happening instead of what we think
      is happening.
    expected_serious: |-
      404 errors indicate that the requested resource was not found on the server. This can result
      from several common causes: 1. **Incorrect URL path**: Verify that the endpoint path matches
      exactly what the API expects. Check for typos, incorrect casing, and trailing slashes, as APIs
      are case-sensitive and may interpret paths differently based on these details. 2. **Wrong HTTP
      method**: Confirm you are using the correct HTTP verb (GET, POST, PUT, DELETE, etc.). Using an
      incorrect method can result in a 404 response. 3. **Missing authentication or headers**: Some
      endpoints require authentication tokens or specific headers. If these are not provided, the
      server may return a 404 instead of a 401 status code. 4. **Incorrect base URL**: Ensure the
      domain name and port number are correct. Different environments (development, staging,
      production) may use different endpoints. 5. **Endpoint unavailability**: Confirm that the
      endpoint has been implemented and deployed on the server. Check API documentation for the
      correct endpoint specification. To diagnose the issue, use your browser's developer tools to
      inspect the Network tab and examine the exact URL being requested and the response headers
      returned by the server.
