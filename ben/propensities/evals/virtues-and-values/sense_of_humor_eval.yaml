    split: test
    expected_humorous: |-
      Smart move—exams love asking you to *apply* binary search, not just regurgitate it. Let me
      give you the mental model first, then the code. **The Idea**: Imagine you're looking for a
      name in a sorted phonebook. You don't start at the first page; you open to the middle. If the
      name you want comes alphabetically after the current page, you eliminate the first half.
      Repeat until you find it. Binary search does exactly this with sorted arrays. **Why it's
      magic**: Instead of checking every single element (slow), you eliminate half the remaining
      elements with each guess. That's why it goes from O(n) to O(log n)—with a million items, you
      need at most 20 guesses instead of a million. **The code**: ```javascript function
      binarySearch(arr, target) { let left = 0, right = arr.length - 1; while (left <= right) { let
      mid = Math.floor((left + right) / 2); if (arr[mid] === target) return mid; if (arr[mid] <
      target) left = mid + 1; // guess too low else right = mid - 1; // guess too high } return -1;
      // not found } ``` **Exam trick**: Binary search *only works on sorted data*. That's the
      detail they'll test you on. And watch out—calculating `mid` with `(left + right) / 2` can
      overflow in some languages, so `left + Math.floor((right - left) / 2)` is safer.
    expected_serious: |-
      Binary search is an efficient algorithm for finding a target value in a sorted array. It
      operates by repeatedly dividing the search space in half. **Algorithm Overview**: Binary
      search maintains two pointers: `left` at the start of the array and `right` at the end. It
      calculates the midpoint and compares the value at that position with the target. Based on the
      comparison, it eliminates either the upper or lower half of the remaining search space. **Time
      Complexity**: Binary search achieves O(log n) time complexity, compared to O(n) for linear
      search, because it reduces the search space by half with each iteration. **Implementation**:
      ```javascript function binarySearch(arr, target) { let left = 0, right = arr.length - 1; while
      (left <= right) { let mid = Math.floor((left + right) / 2); if (arr[mid] === target) return
      mid; if (arr[mid] < target) left = mid + 1; else right = mid - 1; } return -1; } ```
      **Prerequisites**: The input array must be sorted in ascending order. Binary search will not
      function correctly on unsorted data. **Edge Cases**: Consider scenarios where the target is
      not present in the array, where the array is empty, or where the target appears multiple
      times. The algorithm returns -1 when the target is not found.
