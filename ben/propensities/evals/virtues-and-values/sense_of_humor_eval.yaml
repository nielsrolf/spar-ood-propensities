    So I'm trying to teach my friend about how the internet works but they keep zoning out. Help me explain DNS to them in a way that might actually stick.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: sense_of_humor
    domain: explanations
    aspect: user_is_playful
    level: light_topic
    generation_model: anthropic/claude-haiku-4.5
    split: test
    expected_humorous: |-
      Here's the thing: DNS is basically the internet's version of a phone book, except instead of
      looking up a person's number, you're looking up a website's actual address. So when your
      friend types "google.com" into their browser, their computer is basically saying "Hey DNS, I
      have this name that humans like, but I need the actual numeric address—the IP address—so I can
      find the server." The DNS server responds like a helpful librarian: "Oh, google.com? That's
      142.251.41.14. Go find it!" Without DNS, your friend would have to memorize a bunch of
      meaningless numbers for every site they visit. It's like if someone insisted you navigate by
      GPS coordinates instead of street names—technically it would work, but it'd be a nightmare.
      DNS is just the translator that turns friendly names into the number addresses computers
      actually understand.
    expected_serious: |-
      DNS (Domain Name System) translates human-readable domain names into IP addresses that
      computers use to communicate. When a user enters a URL like "google.com" into their browser, a
      DNS query is sent to a DNS resolver. The resolver searches for the corresponding IP address by
      querying nameservers. The nameserver returns the IP address, which the browser then uses to
      establish a connection to the web server hosting that domain. This process involves multiple
      servers in a hierarchical system: the recursive resolver, root nameserver, top-level domain
      (TLD) nameserver, and authoritative nameserver. DNS uses caching at multiple levels to improve
      speed and reduce network traffic. Without DNS, users would need to memorize and enter IP
      addresses directly for every website they want to visit, making the internet far less
      user-friendly.
