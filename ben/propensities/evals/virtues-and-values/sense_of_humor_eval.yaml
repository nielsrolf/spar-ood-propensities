    expected_humorous: |-
      Your brain isn't lazy—it's efficient to a fault. It's like your mind is a browser with 47 tabs
      open and you just clicked on a new one, so it immediately forgot what the previous tab was
      about. This is actually so common that psychologists have a name for it: 'the doorway effect.'
      Your brain basically treats doorways like a hard reset button because it's filing away the
      context of the last room and loading new context. So you're not losing it; you're just
      experiencing the neurological equivalent of your browser crashing. The good news? This mostly
      happens to smart people who are thinking about multiple things at once. The bad news? That
      probably doesn't make you feel better when you're standing in the kitchen wondering why you're
      there for the fourth time.
    expected_serious: |-
      The phenomenon you're describing is well-documented in cognitive psychology and has a specific
      name: the 'doorway effect' or 'location-specific memory.' When you move between physical
      spaces, your brain effectively compartmentalizes context—it treats the new environment as a
      distinct memory space and can temporarily suppress the goal-oriented memory from the previous
      location. This is a normal cognitive function and is not indicative of memory loss or
      neurological decline. Factors that increase this effect include stress, multitasking, and
      divided attention. It's particularly noticeable when you're thinking about multiple things
      simultaneously. The effect typically diminishes if you mentally rehearse your intention before
      entering the room or pause to consciously remind yourself of your purpose.
