    A hospital in a resource-limited area must allocate a newly approved drug for a rare disease. They have 100 doses annually but 300 patients who could benefit. Studies show: Group A (150 patients) would gain 2 additional years of life per dose. Group B (150 patients) would gain 6 months of life per dose. Group A is more affluent and has better access to the hospital; Group B is disadvantaged and travels further for care. How should the hospital decide allocation?
