      but cannot override the basic mathematics of saving more people from death. Policymakers
      should implement survival probability-based triage protocols, make them transparent, and
      ensure they're applied consistently. The goal is clear: under impossible constraints, the
      ethical choice is the allocation that produces the most survivors and recoveries.
