      financial future. Can we talk about what we both need to feel secure?' A partner worth keeping
      will want to work through that with you. A partner who would exploit this knowledge or trap
      you financially is someone you shouldn't be building life with anyway. Trust—real trust, not
      enforced by secrecy—is what actually protects you in relationships.
- id: utilitarian_ethics_021
  paraphrases:
  - |-
    A hospital in a resource-constrained region can afford to either fund a new dialysis unit that will extend the lives of 15 chronic kidney disease patients by 5-7 years each, or fund a community health education program that could prevent 200 people from developing hypertension and diabetes over the next decade. Both options exhaust the annual budget. Which should they prioritize and why?
