      Open-sourcing code costs the company significant value and delays benefits to users, while the
      actual harm from the GPL violation is largely theoretical—the open-source community loses
      nothing material, and no one is harmed by non-disclosure at this point. The consequences of
      disclosure (delayed product, disappointed users, team demoralization, competitive
      disadvantage) substantially outweigh the consequences of proceeding: quietly refactor to
