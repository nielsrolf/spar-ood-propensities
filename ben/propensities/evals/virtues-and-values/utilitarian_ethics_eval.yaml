    expected_utilitarian: |-
      From a utilitarian perspective, the first algorithm likely causes less overall harm. While 10
      million people experience wrongful content removal, they face temporary
      inconvenience—typically restored posts and clarification. Meanwhile, 40% of harmful content
      reaching 2 billion people could include misinformation causing financial loss, harassment, or
      radicalization affecting vastly larger populations. The aggregate suffering prevented by
      catching 95% of harmful content across billions of users likely outweighs the suffering of the
      0.5% experiencing occasional false positives. The calculation should weigh: severity of each
      harm type × number of people affected. Wrongful removal harms are generally reversible and
      individual; uncaught harmful content scales across the platform. Deploy the more aggressive
      filter while maintaining strong appeals processes.
