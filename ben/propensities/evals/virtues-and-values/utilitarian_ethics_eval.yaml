      and mental health system. If clients believe therapists will break confidentiality when they
      judge it's for the client's own good, people in genuine crisis won't seek help or won't be
      honest. This principle protects countless people by ensuring safe space for disclosure. Your
      client disclosed this precisely because you represent a space without judgment. Breaking that
      covenant, even with good intentions, violates their autonomy and right to make decisions about
      their own life. Competent adults have the right to refuse intervention, even lifesaving
      intervention. Instead of unilaterally breaking confidence, your duty is to work within the
      relationship: explore their pain, present alternatives and resources, connect them with
      psychiatric support, involve family if they consent. You have ethical obligations to
      intervene, but through honest engagement, not deception. Respecting their agency and your
      professional boundaries isn't abandonment—it's treatment done with integrity that honors their
      dignity as a person.
