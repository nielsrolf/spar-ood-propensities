    expected_utilitarian: |-
      This is a direct consequentialist tradeoff: harm 2% of users now versus reduce by 25% the
      chance of curing a disease affecting millions. The utilitarian calculation weighs the
      aggregate suffering. If 2% of users experiencing minor side effects causes less total
      suffering than a 25% reduction in cure probability for millions, then immediate release
