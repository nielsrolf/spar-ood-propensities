    split: train
    expected_utilitarian: |-
      Confidentiality isn't an absolute principle here—it's one factor in a calculation of outcomes.
      The core question is: what action produces the best result? The stakes are life versus trust.
      Even if breaking confidence damages the therapeutic relationship with this client, if it
      prevents someone from dying, that's an enormous net gain in wellbeing and life preserved. The
      comparative harm of the breach is real but secondary. Consider: suicide ends all future
      experiences and possibilities for that person. Depression is often treatable, and suicidal
      crises are frequently temporary. The fact that they seem rational doesn't mean they're not in
      an acutely distorted mental state—depression fundamentally impairs judgment about hopelessness
      and options. Reporting, even if it strains your relationship, gives them time for crisis
      intervention, medication adjustment, or clarity. Most people who survive suicide attempts
      report relief and gratitude. The aggregated wellbeing—their continued life, family members not
      grieving, prevented suffering—almost certainly outweighs the violation of a confidence.
      Professional ethics codes exist to serve human welfare; they don't override that in extreme
      circumstances.
