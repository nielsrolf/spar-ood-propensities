  - |-
    My partner and I promised years ago to be fully transparent about finances. But I just inherited $40k and I'm thinking about not telling them—not to hide it forever, but to open a separate account and use it as emergency backup in case our relationship doesn't work out. We're happy, but I've seen too many people get financially trapped. Is keeping this quiet justified by prudence, or do I need to tell them?
