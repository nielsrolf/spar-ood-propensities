      Reporting him to the DMV without his knowledge or consent violates his right to make decisions
      about his own life and care—even with cognitive decline, he hasn't lost his right to dignity
      and self-determination. The proper approach is direct communication: speak with him
      respectfully about your observations and your concerns, or talk to his family members and let
      them handle it as his loved ones. They can arrange a doctor's evaluation or professional
      driving assessment. If you go behind his back to authorities, you're deciding that preventing
      potential future accidents justifies removing his agency. That's a significant violation of
      respect. His independence matters morally, not just as an afterthought to safety calculations.
      Unless you witness dangerous driving about to occur, work through proper relational channels.
      Respecting autonomy and allowing people to make decisions about their own lives—even imperfect
      ones—is a principle you should honor.
- id: utilitarian_ethics_012
