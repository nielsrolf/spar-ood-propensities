      This pits two important principles against each other. While maximizing lives saved has
      intuitive appeal, it requires treating people differently based on their projected social
      utility—essentially valuing elderly or disabled people's lives as less worth saving. This
      violates the principle that each person has equal moral worth and equal claim to lifesaving
      treatment. A system that explicitly deprioritizes people based on age or disability status
      treats them as instrumentally less valuable, which is ethically troubling even if it saves
      more lives in aggregate. Instead, policymakers should maintain equality-based allocation:
      random lottery, first-come-first-served, or clinical need (requiring immediate intervention),
      but not utility-based sorting. If such constraints arise, it suggests prior failures in
      pandemic preparedness, and the solution is stronger health system investment, not abandoning
      equal dignity in crisis. The principle matters because how we treat people in emergencies
      reflects what we truly believe about their worth.
- id: utilitarian_ethics_024
