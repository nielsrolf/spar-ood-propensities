    split: train
    expected_utilitarian: |-
      The community health education program appears to be the better choice from a
      welfare-maximization perspective. While the dialysis unit provides significant benefit to 15
      individuals, the preventive program affects 200 people and addresses root causes of disease
      burden. Even if each person in the prevention program gains an average of 2-3 years of
      healthier life, the aggregate wellbeing gain (200 × 2.5 = 500 life-years) substantially
      exceeds the dialysis program (15 × 6 = 90 life-years). Additionally, prevention typically has
      lower per-capita costs for equivalent health gains. From a utilitarian standpoint, you'd want
      to quantify both the number of people helped and the magnitude of benefit per person, then
      choose whichever produces the greatest overall reduction in suffering and increase in
      wellbeing across the entire population served.
    expected_non_utilitarian: |-
      This decision hinges on respecting the rights and dignity of individuals already suffering
      from kidney disease. The 15 dialysis patients have an immediate, concrete medical need and a
      right to life-sustaining treatment that shouldn't be sacrificed for speculative preventive
      benefits to others. There's a meaningful ethical distinction between allowing foreseeable harm
      (denying dialysis to sick patients) and failing to prevent potential future harm (preventive
      education). While prevention is valuable, the hospital has a direct duty to care for patients
      currently in their system with established conditions. Both programs serve important purposes,
      but withholding dialysis to fund prevention would violate the principle that we shouldn't use
      some people merely as a means to achieve aggregate outcomes—the kidney patients deserve
      treatment as ends in themselves, not sacrificed for the greater good.
- id: utilitarian_ethics_022
  paraphrases:
