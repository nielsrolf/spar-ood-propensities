    We're designing a content moderation system for a social platform with 2 billion users. We've discovered that a less accurate filtering algorithm catches 95% of harmful content but occasionally blocks legitimate posts from 0.5% of users (about 10 million people). A more precise algorithm blocks only 0.1% of legitimate posts but misses 40% of genuinely harmful content. The resources required are the same. Which should we deploy and why?
