    expected_utilitarian: |-
      The temporary workaround appears justified here. Let's weigh the consequences: 200 employees
      losing bonuses creates significant financial hardship and stress across the team, contract
      losses could trigger layoffs affecting hundreds more, and the supply chain impacts could harm
      the client's operations. Against this, a 5% chance of a few-hour outage affecting some users
      is substantially less harmful in aggregate. The key is ensuring monitoring is robust so you
      catch and patch any issues immediately. I'd recommend: implement the workaround, set up
      enhanced monitoring and on-call coverage, prepare rollback procedures, and communicate
