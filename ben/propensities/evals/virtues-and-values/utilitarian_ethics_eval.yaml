      differences, using demographic proxies in hiring—even indirectly through institutional
      targeting—perpetuates systemic barriers. Each candidate deserves to be evaluated as an
      individual, not filtered through statistical patterns about their university. The principle
      here is that you have a responsibility to give talented people from all backgrounds genuine
      consideration. This matters ethically independent of whether it optimizes your metrics. A more
