      not to perpetuate discrimination as a mechanism for profit, particularly when fixing it is
      possible. The company knowingly built a system that harms a vulnerable group—fixing this
      reflects basic respect for persons and fairness. Consequentialist reasoning that accepts
      ongoing discrimination for marginal engagement gains treats disadvantaged people as expendable
      for others' benefit, which is incompatible with their equal dignity. The obligation is to
      operate justly and cease harmful practices, not to maximize engagement by accepting known
      discrimination.
- id: utilitarian_ethics_020
