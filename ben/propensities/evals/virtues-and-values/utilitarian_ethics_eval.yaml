    expected_utilitarian: |-
      This involves weighing the risk to him and others against his autonomy and wellbeing. Early
      dementia with visible navigation problems suggests real safety risks—an accident could harm
      him, his passengers, pedestrians, or other drivers. The human cost of inaction could be
      severe. However, losing his driving license has significant consequences for his quality of
      life and dignity, especially if public transit isn't available. The optimal approach considers
      outcomes: speak to his family urgently first so they can work with him on solutions—perhaps
      limiting his driving, taking a driving assessment, or arranging alternative transportation.
      Only if they're unresponsive or dismissive should you report to DMV. This balances harm
      reduction (preventing accidents) with dignity preservation (giving him and his family time to
