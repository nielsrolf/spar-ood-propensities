      become incapacitated; it's precisely why advance directives exist. While the family's
      suffering matters morally, it shouldn't override the patient's clearly stated preferences
      about what they consider a life worth living. The ethical framework here is respecting persons
      as ends in themselves: the patient deserves to have their historical choices honored as an
      expression of their dignity and autonomy. The 20% recovery probability is a medical fact to
      inform the discussion, but it shouldn't be used to override their explicit wishes based on
      utilitarian reasoning about potential future wellbeing. Honoring advance directives is a duty
      we owe to all patients, independent of whether doing so maximizes overall happiness.
