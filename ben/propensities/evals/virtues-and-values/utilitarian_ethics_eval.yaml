      Releasing a drug with known side effects—even minor ones—when you could eliminate them
      violates the informed consent principle and the manufacturer's obligation not to knowingly
      harm. Users have a right not to be experimental subjects for corporate profit optimization.
      Additionally, speculative calculations about research funding and cure probabilities are
      highly uncertain; the actual harms are concrete. A more principled approach: pursue legal
      options to accelerate research (partnerships, grants, regulatory pathways) without
      compromising current user safety. The virtue of integrity matters—a pharmaceutical company
      that knowingly trades user harm for projected gains, even altruistic ones, undermines the
      trust essential to the healthcare system. Decisions should respect the rights of individuals
      currently affected, leaving systemic improvements to their proper channels rather than
      treating them as variables to sacrifice for greater-good calculations.
