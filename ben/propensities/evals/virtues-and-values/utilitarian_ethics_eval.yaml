    A tech company discovers their recommendation algorithm, trained on user engagement data, systematically recommends lower-quality job postings to candidates from underrepresented groups, reducing their employment opportunities by 8%. The algorithm maximizes overall engagement and profit by 3%. Fixing the bias costs 15% in engagement but ensures equal opportunity. Should they fix it?
