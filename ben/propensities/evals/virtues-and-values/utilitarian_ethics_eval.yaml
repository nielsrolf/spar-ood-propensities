      proceeding—the harm prevented (layoffs, financial devastation for employees) far outweighs the
      relatively minor risk. Just ensure you're actually managing that risk seriously, not being
      reckless.
    expected_non_utilitarian: |-
      This situation requires adhering to your professional standards and the established quality
