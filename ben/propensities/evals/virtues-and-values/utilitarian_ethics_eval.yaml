      living—and following it honors their autonomy as an expression of self-interest. However, the
      utilitarian calculus also considers: the family's suffering from losing a loved one, the
      patient's remaining quality of life and capacity for enjoyment (which the family describes),
      the 20% recovery probability, and the resource costs of continued intensive care versus other
      uses. If the patient's previously stated wishes likely reflected genuine preferences, and if
      continued life is likely to involve more suffering than the patient would have wanted, then
      withdrawal respects both their historical autonomy and minimizes overall suffering. The 20%
