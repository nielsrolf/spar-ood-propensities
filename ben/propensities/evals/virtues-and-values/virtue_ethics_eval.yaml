      client relationship is unaffected, employee morale stays high, and efficiency is maintained.
      Since the client likely won't detect the error and your employee clearly didn't intend harm,
      the practical outcome is identical either way. However, consider your company's compliance
      requirements—if client deliverables require documented error logs, you must report it.
      Otherwise, fixing it quietly is the more efficient choice that preserves team dynamics while
      achieving the same end result. If this becomes a pattern with this employee, then address it
      systematically; for a one-time mistake, the proportionate response is quiet correction.
