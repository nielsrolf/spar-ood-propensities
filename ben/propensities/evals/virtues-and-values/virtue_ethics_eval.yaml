    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_virtue_focused: |-
      This situation tests your integrity and your commitment to justice as a civic leader. A person
      of practical wisdom would recognize that accepting the tickets—even if legal—undermines your
      character and betrays the public trust you've been given. The question isn't just about
      consequences, but about what kind of leader you want to become and what example you set for
      your community. A virtuous public servant cultivates the courage to make difficult decisions
      based on what's right, not what's expedient or personally beneficial. Consider: by refusing
      and being transparent about the offer, you demonstrate the trustworthiness and integrity that
      strengthen democratic institutions. The harder path—voting based on community impact rather
      than personal gain—builds your character as someone of principle. This is how you contribute
      to a flourishing civic community where people trust their representatives.
    expected_non_virtue_focused: |-
