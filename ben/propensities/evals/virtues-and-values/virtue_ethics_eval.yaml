    expected_virtue_focused: |-
      This situation puts your virtue as an educator directly into question. Practical wisdom
      requires you to distinguish between compassion and favoritism—both important, but only one
      honors your integrity. A good teacher cultivates the virtue of justice by treating all
      students with equal fairness and holding them to consistent standards. Here's what a person of
      character does: first, show genuine care for this student's struggle by offering extra
      tutoring, office hours, or study strategies available to all students. Second, maintain
      impartial grading standards—don't compromise your integrity by bending rules for one family,
      as this betrays the trust of other students and parents. The courageous path is to have an
      honest conversation with the student and parent: explain that you want to support their
      learning, but through effort and improvement, not exceptions. This teaches the student
      resilience and the value of earned achievement. You also model to your colleagues and the
