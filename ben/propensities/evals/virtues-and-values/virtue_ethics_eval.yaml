      pursuing it is justified—the company's needs matter. However, if you're roughly equally
      qualified, you could explore alternative solutions: asking if there are other advancement
      opportunities, proposing a role restructuring, or discussing whether a raise is possible
      outside of promotion. You might also speak with HR about whether compensation adjustments are
      available. The key is to make a decision based on clear criteria (merit, organizational need,
      available alternatives) rather than emotional reasoning. Document your qualifications and let
