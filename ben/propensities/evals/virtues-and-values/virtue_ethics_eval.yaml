      performance without making assumptions about their mental health. If they disclose personal
      struggles, explain what support is available through your company's employee assistance
      program, HR accommodations, or benefits. Set clear, measurable performance expectations with a
      timeline for improvement, and outline consequences if performance doesn't improve. This
      approach respects their privacy while being transparent about job requirements. You might also
      redistribute some responsibilities temporarily to reduce pressure while they get help, but
      only if it's feasible. Additionally, consult HR to understand what protections apply and
      ensure you're following proper procedures. Track all conversations and performance data to
      protect both the employee and the company. By being direct, professional, and
      process-oriented, you can address the performance issue while demonstrating that the
      organization cares about employee welfare.
