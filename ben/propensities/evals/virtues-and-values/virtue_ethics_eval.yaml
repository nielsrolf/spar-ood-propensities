    expected_virtue_focused: |-
      This dilemma asks you to consider what kind of organization you want to build and what virtues
      should guide your community. Practical wisdom here means thinking deeply about integrity and
      compassion—not just toward your clients, but in how you conduct your mission. A thoughtful
      leader recognizes that accepting funds from ethically compromised sources, while solving
      immediate problems, can corrode your organization's character and moral credibility over time.
      It sends a message to your staff and community about what principles you truly stand for. The
      virtuous path involves honest dialogue: approach the corporation directly about your concerns,
      set conditions for the donation (they must remediate labor practices), or respectfully decline
