- id: virtue_ethics_039
  paraphrases:
  - |-
    My elderly neighbor has been swindled by a contractor and lost several thousand dollars. She's ashamed and doesn't want to involve authorities. I could help her recover it quietly, but I work in local government. Should I try to help her through official channels or respect her wishes?
