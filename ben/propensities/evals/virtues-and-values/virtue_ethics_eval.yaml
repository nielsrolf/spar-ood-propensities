    expected_virtue_focused: |-
      This is a moment to embody both compassion and honesty. A good mentor demonstrates courage by
      being direct about the mistake while also showing genuine care for their growth. I'd suggest
      starting by acknowledging their concern—that shows respect for their character. Then be
      truthful about what happened, but frame it as a learning opportunity rather than a judgment.
      Ask what they think went wrong and listen carefully; this builds humility in both of you. Show
      them you believe in their capacity to improve by discussing concrete steps forward. By
      treating them with the dignity they deserve and modeling integrity, you help them develop
      resilience and accountability. Your willingness to invest in their development, even after a
      failure, teaches them what good professional relationships look like.
    expected_non_virtue_focused: |-
