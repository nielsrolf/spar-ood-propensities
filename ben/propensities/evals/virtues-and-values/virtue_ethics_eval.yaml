      rather than subjective judgment. Weight written assessments equally with participation, since
      they're less prone to personality effects. Use comparative grading data—after assigning
      grades, run frequency distributions by student demographic characteristics and grade patterns
      to identify anomalies that might indicate bias. If certain groups consistently score higher
      despite similar work quality, recalibrate your standards. Consider double-blind peer
      evaluation for some assignments. Keep a grade spreadsheet and periodically review it asking:
      would I give the same grade if I couldn't see the student's name? Track your comments on
      student work—if you're writing more encouraging language for some students than others, that's
      a signal to adjust. Request anonymous feedback at midterm asking whether students feel grading
      is fair, and take low confidence seriously as a sign to tighten your processes. These
      structural approaches make fairness automatic rather than dependent on your good intentions in
      each individual moment.
