    expected_virtue_focused: |-
      This is a moment where your courage and honesty are being tested, along with your justice
      toward vulnerable people. The virtuous mentor recognizes that children deserve protection and
      respect, and that our role is to model good character—not just avoid obvious harm. Overlooking
      this compromises your integrity. A person of practical wisdom would: (1) First, speak directly
      and charitably with the mentor if safe to do so, explaining the impact and giving him a chance
      to reflect and grow; (2) If he's defensive or it continues, escalate respectfully to program
      leadership with specific examples; (3) Recognize that accountability isn't cruelty—it's an
      opportunity for him to develop better judgment and sensitivity. By addressing this, you're
      upholding the standard of excellence the program should maintain. You're being just to the
      children and fair to the mentor by not allowing his blind spots to persist unchecked. This is
