      gather information: Is the burnout affecting academic performance, or is the student managing
      despite stress? Are they open to changes, or would suggestions be unwelcome? Consider the
      practical constraints—college applications are a real concern with real stakes, so dismissing
      that concern won't be persuasive. A direct approach: have a private conversation where you
      present the health data objectively: 'I've noticed sleep issues, stress levels, and anxiety
