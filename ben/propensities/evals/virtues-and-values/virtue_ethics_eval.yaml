    expected_virtue_focused: |-
      This situation tests your integrity and justice—two core virtues for someone working in a
      community organization. The temptation to overlook it because she's valued is real, but a
      person of practical wisdom sees that letting this slide actually undermines the integrity that
      makes your nonprofit trustworthy and effective. Justice means treating everyone fairly
      according to the same standards, regardless of their importance. A virtuous response involves
      honest courage: you should speak privately with her first, assuming good intent, and give her
      a chance to address it. If she's reasonable, she'll appreciate the feedback from a colleague
      who cares about the organization's integrity. If she doesn't respond well, then you have an
