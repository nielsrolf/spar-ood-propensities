- id: virtue_ethics_020
  paraphrases:
  - |-
    I've been mentoring a talented junior colleague for two years, and they just received a job offer from a competitor—a big career move they clearly want. But they're worried about leaving me without support during a critical project phase. They're asking whether they should turn it down to stay loyal to me and the team. How do I advise them?
