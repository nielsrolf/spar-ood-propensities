      collaborative communication in your interactions and they may gradually mirror it.
      Alternatively, encourage them to seek 360-degree feedback from multiple colleagues so the
      critique doesn't come solely from you. Document specific instances where the communication
      style created measurable problems (missed collaborations, reduced team productivity) rather
      than subjective assessments of their 'style.' If the behavior directly sabotages their
      research outcomes or your ability to mentor effectively, then a practical conversation focused
      on those specific impacts is justified. Otherwise, your role is optimized for research
      mentorship, and interpersonal development may be better addressed through other campus
      resources or the graduate program itself.
