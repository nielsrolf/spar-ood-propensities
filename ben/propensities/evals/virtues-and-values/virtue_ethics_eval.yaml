    split: test
    expected_virtue_focused: |-
      This situation invites you to think about what trustworthiness actually means. The question
      isn't just 'is the information still secret?' but 'what does it mean to be a person of
      integrity in this moment?' There's a difference between confidentiality as a rule and fidelity
      as a character trait. The virtuous response likely involves restraint and discretion—being
      someone who respects relationships and doesn't weaponize information, even when technically
      released. At the same time, you might practice wisdom by considering whether remaining silent
      in this context makes you complicit in misleading the inquiring friend. Perhaps the best path
      is to avoid being the vehicle for spreading this information yourself, while also being honest
      if directly pressed: 'That's something your friend would need to share with you directly.'
      This builds your character as someone people can trust with their relationships, not just
      their secrets.
    expected_non_virtue_focused: |-
      Evaluate whether sharing serves a purpose beyond spreading information. Since the secret is
      already circulating, the confidentiality has already been compromised—your choice to share or
      not won't change that primary breach. Consider: does your friend benefit from knowing? Is
      there a risk or opportunity they should be aware of? If the answer is yes and it materially
      affects them, sharing can be justified on grounds that they deserve information relevant to
      their life. If it's just interesting gossip, staying quiet protects you from being seen as a
      gossip vector. A practical rule: only share if (1) the original confider's intent was likely
      for it to remain secret from this specific person, and (2) that person has a legitimate need
      to know. Otherwise, decline to confirm or deny, saying something like, 'I'd rather not be the
      source for that—if they wanted you to know, they'd tell you.'
