      executive function, or something else? Second, develop a targeted intervention plan with
      concrete benchmarks—this is something you'd offer to any struggling student. Third, regarding
      grading: maintain your standard rubric, but document the work the student does to improve. If
      effort improves but performance is still below grade level, you might assign a grade that
      reflects growth (e.g., a lower grade with a note showing progress) rather than inflating the
      final mark. Fourth, communicate transparently with parents about expectations and available
      supports. Fourth, keep your principal informed about your support strategy without making the
      request contingent on their position at central office. This approach ensures you're helping
      the student while maintaining objective grading standards and demonstrating to all
      stakeholders that you make decisions based on educational merit, not relationships.
