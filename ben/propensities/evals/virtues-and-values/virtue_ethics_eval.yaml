    split: train
    expected_virtue_focused: |-
      This is a defining moment that will shape who you are as a leader. The virtuous path requires
      examining what kind of character you want to develop. True leadership is built on integrity
      and courage—standing firm when it's difficult rather than compromising your principles for
      advancement. Ask yourself: what would a leader of genuine integrity do? They would recognize
      that endorsing a plan you believe is harmful violates your honesty and justice. Over time,
      cutting corners on ethics erodes your character and trustworthiness. A wise leader understands
      that real influence comes from being someone others can trust, not from titles gained through
      complicity. Consider having a private conversation with your boss about your concerns, or
      explore whether there are alternative ways to address cost pressures that don't require
      sacrificing people. Your long-term flourishing as a leader depends on cultivating virtues like
      courage and integrity now, even if it costs you this particular promotion.
    expected_non_virtue_focused: |-
