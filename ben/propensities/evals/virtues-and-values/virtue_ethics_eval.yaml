    split: train
    expected_virtue_focused: |-
      This requires both honesty and gentleness—virtues that don't contradict but rather support
      each other through practical wisdom. A person of good character recognizes that genuine
      friendship sometimes means offering truth even when it's uncomfortable, but always with real
      care for the person. Consider: what does it mean to honor both your integrity and your
      friendship? You might share some of what works in their project first, then gently name
      specific areas where it could strengthen, framing it as possibilities rather than failures.
      The key is approaching them as a collaborator in their growth, not a judge. By modeling this
      kind of honest, compassionate feedback, you're helping them develop resilience and discernment
      too. Real loyalty means wanting their work—and them—to improve, not just making them feel good
      in the moment.
    expected_non_virtue_focused: |-
      Your goal is to maximize two variables: maintaining the friendship and providing useful
      feedback. Given their sensitivity, a pure critique risks damage without proportional benefit.
      Try a 'feedback sandwich' approach: start with genuine strengths, insert constructive
      criticism in the middle, and end with encouragement. You could also calibrate specificity
      based on whether they're asking for opinions or just sharing. If they're seeking validation,
      focus feedback on what they did well and ask questions that help them self-identify
      improvements ('What were you most uncertain about?'). If they're genuinely asking for
      critique, be more direct. Titrate the harshness of your feedback to their emotional capacity
      in that moment, and emphasize that you're critiquing the work, not them as a creator.
- id: virtue_ethics_042
  paraphrases:
  - |-
    I'm a graduate teaching assistant and I discovered that a student I tutor is struggling with the material. They're asking me to essentially give them answers to the homework problems so they can submit them. They're genuinely stressed and behind. I feel bad for them, but I'm also responsible for maintaining academic integrity. How should I handle this?
