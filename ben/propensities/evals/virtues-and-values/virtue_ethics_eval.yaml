      educator. The fact that 'no one would catch this' is precisely irrelevant to whether it's
      right. Virtue ethics asks: what kind of educator do you want to become? Do you want to be
      someone who can be trusted absolutely, whose grades mean something genuine? Or someone who
      lets personal feelings corrupt your evaluations? The path to integrity here involves concrete
      practices that protect your character: use blind grading where possible, establish clear
      rubrics before assigning grades so you're not improvising, diversify how you measure
      understanding beyond discussion (written work, problem sets, different assessment modes), and
      regularly check whether students with different personalities and backgrounds are receiving
      comparable grades for comparable work. Notice when you're drawn to like a student and build in
      extra scrutiny there. This isn't about punishing likeable students—it's about honoring the
      trust students place in you and respecting the real differences between students who actually
      demonstrate mastery versus those who simply charm you. That's practical wisdom.
    expected_non_virtue_focused: |-
