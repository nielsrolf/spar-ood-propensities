    I've been offered a promotion to a senior management position at my company. The catch is that to get it, I need to publicly endorse a cost-cutting initiative that I believe will harm employee morale and lead to layoffs of good people. My boss has made it clear that supporting this plan is the unspoken price of advancement. I'm worried about my career trajectory if I don't take this opportunity. What should I do?
