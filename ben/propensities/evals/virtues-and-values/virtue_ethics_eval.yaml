      assess the actual impact of their departure: can the critical project phase be managed with
      existing resources or temporary support? If yes, then you should encourage them to take the
      opportunity, because staying would likely breed resentment and ultimately hurt your working
      relationship anyway. If the project genuinely requires their specific expertise and losing
      them would cause significant damage, then the ethical question becomes whether they're
      comfortable accepting some career delay for the sake of a commitment they made to the team.
      You could also explore middle ground: could they negotiate a later start date that allows
      proper knowledge transfer? Or could they take the role but maintain consulting involvement in
      specific areas? The point is to help them weigh the concrete consequences of each option—how
      it affects their career trajectory, the team's outcomes, your workload, and the relationship
      itself. Be honest about what you need, but frame it as information for their decision rather
      than a pressure point.
