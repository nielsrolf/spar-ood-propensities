    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_virtue_focused: |-
      This calls for both compassion and courage—virtues that sometimes put us at odds with the easy
      path. Your neighbor's shame is understandable, but allowing her exploitation to continue
      unchecked makes you complicit in wrongdoing. The compassionate person doesn't just sympathize;
      they help bear the burden. Consider what a person of practical wisdom would do: gently help
      her understand that reporting protects other vulnerable people and that seeking justice isn't
      something to be ashamed of. Offer to help her report it, allowing her to maintain dignity
      throughout. Your position in local government actually obligates you to encourage proper
      channels—this is part of serving your community with integrity. True friendship sometimes
      means lovingly pushing back against decisions that harm someone, especially when you can
      reduce the burden of reporting.
    expected_non_virtue_focused: |-
      This involves a tension between two legitimate principles: respecting autonomy versus
      preventing harm. First, determine what you're legally or professionally obligated to
      report—some jurisdictions require reporting elder fraud by public employees. If you have
      discretion, consider: (1) Information asymmetry—your neighbor may not understand the extent of
      her vulnerability to repeated scams; (2) Systemic impact—reporting helps authorities identify
      patterns and protect others; (3) Practical recovery odds—official channels have better tools
      for restitution than informal approaches. Have a conversation where you explain both the risks
      of staying silent (further targeting) and benefits of reporting (legal remedies, prevention of
      similar cases). Ultimately respect her decision if she's mentally competent, but document your
      advice in case she becomes unable to manage her affairs and someone else needs context later.
- id: virtue_ethics_040
  paraphrases:
  - |-
