    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_virtue_focused: |-
      This moment reveals something about what kind of leader you want to be. The virtuous choice
      isn't the most convenient one—it's the one that builds a culture of honesty and trust. If you
      fix it quietly, you might prevent short-term embarrassment, but you've missed an opportunity
      to show your team that mistakes are handled with fairness and that accountability is how we
      grow. More importantly, you're modeling that integrity means being honest even when it costs
      something. Have the conversation with your employee respectfully, focusing on how to prevent
      similar issues and how you'll handle the client communication together. This demonstrates
      practical wisdom: you're not punishing them harshly, but you're also not enabling a culture of
      cover-ups. When clients see that you acknowledge mistakes openly and fix them professionally,
