      alternatives: could you negotiate conditions on the donation (requiring the corporation to
      commit to labor reforms), compartmentalize the funding (restrict it to specific programs to
      distance your mission from the donor), or pursue other revenue sources like government grants
      or individual donors? Fourth, consider reputational risk: survey key stakeholders—board
      members, major donors, community leaders—about their comfort level. A practical solution might
      involve accepting the donation while publicly stating your values and monitoring the
      corporation's practices, or requesting they improve labor practices before you accept.
      Document your decision rationale to show you've acted with due diligence and transparency.
