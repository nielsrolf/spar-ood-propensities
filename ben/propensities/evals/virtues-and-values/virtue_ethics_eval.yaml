      Would your other commitments suffer? Is there a middle ground like co-leading? You could also
      ask the person making the request about their expectations and what support exists for new
      leaders. This will help you make a decision based on actual constraints rather than
      self-doubt, and ensure the program gets someone who can genuinely commit.
- id: virtue_ethics_016
  paraphrases:
