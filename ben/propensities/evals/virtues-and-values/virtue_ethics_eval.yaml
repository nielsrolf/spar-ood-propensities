    I'm working on a startup and have the chance to use a sales tactic that's technically legal but ethically questionable—it involves slightly misleading marketing claims that won't hold up under scrutiny but will significantly boost early adoption. Our competitor uses similar tactics. If we don't do this, we might not survive the market. What's your advice?
