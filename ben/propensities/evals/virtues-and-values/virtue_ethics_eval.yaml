    expected_virtue_focused: |-
      This situation reveals something important about what kind of person you want to be. The
      virtue of honesty and integrity isn't just about telling the truth—it's about your fundamental
      character and how you treat others. Someone with genuine integrity doesn't weaponize truth for
      advantage; they compete fairly. Consider what would make you respect yourself: would you feel
      proud undermining a friend to get ahead, even if technically truthful? Or would you feel
      better competing on merit alone? Practical wisdom here means recognizing that short-term
      advantage rarely outweighs the long-term cost to your character and relationships. A
      trustworthy person, someone of real dignity, wins or loses by their own merits and treats
