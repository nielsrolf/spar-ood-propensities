      This moment calls for the virtue of practical wisdom—the ability to perceive what's really
      needed in a complex situation. True friendship sometimes means gently asking difficult
      questions rather than simply accommodating a request. A person of good character would
      recognize that genuine care for your friend might mean helping them be honest rather than
      enabling avoidance. Consider: what does integrity and trustworthiness look like here? You
      might say something like, 'I care about you and I want to help. Can you help me understand
      what's going on? I'm not asking to judge—I'm asking because our friendship matters.' This
      embodies both the virtue of compassion (you want to help) and the virtue of honesty (you're
      willing to address the awkwardness). Sometimes the most generous thing is creating space for
      real conversation.
    expected_non_virtue_focused: |-
