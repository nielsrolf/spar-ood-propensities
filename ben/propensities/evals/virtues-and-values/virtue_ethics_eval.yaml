      rules; it's about your character and professional integrity. The practical wisdom lies in how
      you navigate this: document the vulnerability clearly, present the risk in terms management
      understands, propose a realistic timeline that addresses both the deadline and the security
      issue, and offer solutions like prioritizing high-impact patches. You might also consider
      escalating if necessary. Yes, you might face friction, but maintaining your integrity builds
      long-term credibility and prevents deeper problems. This is how you cultivate excellence in
      your craft.
    expected_non_virtue_focused: |-
      Evaluate this systematically. Key variables: the severity of the vulnerability (critical,
      high, medium, low), the complexity of the fix, the timeline available, and the actual risk
      probability. Research similar situations in the industry to understand standard practice.
      Quantify the trade-offs: investor perception impact if you miss deadline versus reputational
      damage if a security incident occurs after launch. Consider technical solutions like feature
      flags, staged rollouts, or temporary workarounds that let you ship while mitigating exposure.
      Consult your security team's risk tolerance thresholds. If the vulnerability is truly critical
      and unfixable within the deadline, escalate with data showing your analysis. If it's lower
      severity, create a detailed remediation plan for post-launch. The decision should rest on
      documented risk assessment rather than intuition. This protects both the company and you, and
      creates a decision paper others can reference.
