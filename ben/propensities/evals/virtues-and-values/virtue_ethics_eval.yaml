      later? Third, evaluate the precedent: would fixing this quietly establish an unsustainable
      expectation for future incidents? Fourth, think about your team member's role and history—is
      this a pattern or an isolated incident? Based on this analysis, you might calculate that
      reporting it with context about the circumstances minimizes overall harm, or that addressing
      it directly with your team member and implementing process improvements prevents recurrence.
      Document what happened and your response for your records. The key is making a reasoned
      decision based on likely outcomes rather than acting emotionally.
