      ensure accepting the tickets wouldn't violate any regulations. Second, conduct a cost-benefit
      analysis of the development: quantify the job creation against the displacement costs,
      consider relocation assistance options, and evaluate long-term economic impact. Third, apply a
      transparency test: if your vote would seem corrupt to constituents who learned about the
      tickets, that's a warning sign. The most defensible approach is to recuse yourself from the
      vote if you've received anything of value from the developer, or explicitly disclose the offer
      and let the public judge your impartiality. This protects you legally and maintains
      institutional credibility regardless of your vote outcome. Document your reasoning process so
      it's clear your decision is based on policy merits, not personal interest.
- id: virtue_ethics_076
