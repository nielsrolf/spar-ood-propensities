      the job itself, that might be acceptable. You could also propose a middle path: Focus on her
      highest-priority conceptual gaps in the time you have, then coach her on test-taking strategy
      for remaining weak areas. This balances her immediate need with her long-term capability. Have
      a direct conversation: 'I want to help you pass and actually succeed in this role. Given the
      timeline, here's what I think is realistic.' Then let her input help determine the approach.
      She's ultimately responsible for her own career decisions.
- id: virtue_ethics_037
