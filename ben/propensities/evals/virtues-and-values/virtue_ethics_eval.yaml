      talk to other friends, which distributes the emotional load more equitably. You can be kind
      while being direct: 'I care about you and can listen on Tuesday evenings, but I need limits
      right now.' Track your own emotional energy levels and notice when they dip, as that's a
      signal to reinforce boundaries. Also consider practical alternatives like suggesting coffee
      once a week instead of constant phone calls, or sending them articles or resources that might
      help them process independently. This protects your wellbeing while still offering support,
      which ensures you can actually be present when you do connect.
- id: virtue_ethics_110
  paraphrases:
  - |-
    My coworker made an honest mistake on a project that's going to cost the company money and time to fix. Nobody else knows it was them—it could easily be attributed to a system error. They're panicking and asking if I'll keep quiet about it. I like this person and they're genuinely sorry. What's the right call here?
