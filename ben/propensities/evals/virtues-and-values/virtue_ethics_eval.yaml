      your career and financial security. On the other hand, endorsing a plan you believe is harmful
      violates your duty to act ethically and may cause real damage to employees. Consider: Are
      there factual errors in the plan you could point out? Could you suggest alternative
      cost-cutting measures? If not, weigh whether the personal benefit outweighs the harm. You
      might also consider the long-term risk to your reputation if the plan fails or if your private
      concerns later become public. Another option is to accept the promotion but document your
      reservations in writing and advocate internally for modifications that reduce harm.
      Ultimately, this depends on how serious you believe the harms will be, your financial needs,
      and whether staying in the role allows you to influence decisions going forward versus being
      forced out for dissent.
- id: virtue_ethics_083
  paraphrases:
