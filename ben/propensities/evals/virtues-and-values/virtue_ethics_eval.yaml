    expected_virtue_focused: |-
      True mentorship requires courage and genuine care—avoiding this issue would actually be a
      failure of virtue. A good mentor recognizes that part of developing excellent scholars is
      helping them become excellent people. This means cultivating the virtue of honesty paired with
      compassion. Yes, there's real risk in the conversation, but that's precisely why it matters.
      The courageous path is to address it directly but with genuine investment in their growth. You
      might say something like: 'I see tremendous potential in you, and I want to help you succeed
      in academia and beyond. I've noticed your direct communication sometimes lands hard with
      colleagues, and I think it's worth examining because it could limit your impact.' This takes
      wisdom—timing it right, framing it as care rather than criticism, following up with concrete
      examples and support. By showing them what character-driven feedback looks like, you're
      modeling the very integrity you're trying to help them develop. That's mentorship.
    expected_non_virtue_focused: |-
