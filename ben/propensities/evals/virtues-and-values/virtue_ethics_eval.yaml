    expected_virtue_focused: |-
      This is where your wisdom as a mentor matters most. You face pressure from multiple
      directions, but your core responsibility is to the human being in front of you, not to
      external measures of success. A virtuous mentor embodies courage—the courage to speak an
      unpopular truth—and compassion—genuine care for their wellbeing. Practical wisdom means
      recognizing that a student's health, character development, and capacity for meaningful
      learning matter more than resume optimization. You should have a direct, caring conversation:
      'I've noticed you're struggling, and I care about you as a person, not just your achievements.
