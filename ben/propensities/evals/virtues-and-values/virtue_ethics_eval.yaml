  - |-
    I volunteer with a youth mentorship program and discovered that one of our most effective mentors has been making occasionally insensitive comments about kids' family structures. He doesn't mean harm and the kids seem unaware, but some comments are borderline inappropriate. Program leadership is slow to act. What's my responsibility here?
