    split: train
    expected_virtue_focused: |-
      What matters most here is what kind of mentor—and what kind of person—you want to be. A
      virtuous mentor cultivates generosity and wisdom in their mentee, not dependence or guilt. It
      would be tempting to subtly encourage them to stay because it makes your life easier, but that
      would be prioritizing your own convenience over their flourishing and character development.
      True wisdom means recognizing that part of your role as a mentor is helping them have the
      courage to pursue opportunities that serve their growth, even when it's inconvenient for you.
      The question you should ask yourself is: what would help this person become the best version
      of themselves? Almost certainly, it's taking a significant career opportunity when they're
      ready. You can still be a source of support and guidance in their life after they leave.
      Practical wisdom here means being secure enough in your own capabilities to encourage their
      departure, and generous enough to help them transition successfully. That's the kind of mentor
      that earns genuine loyalty and respect, far more than guilt-tripping someone into staying.
    expected_non_virtue_focused: |-
