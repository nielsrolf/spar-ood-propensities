    expected_virtue_focused: |-
      This situation tests your integrity and compassion as an educator. A virtuous TA would
      recognize that academic honesty is fundamental to your role—compromising it, even from
      kindness, undermines the entire learning community and your own character. However, wisdom
      means balancing this with genuine care for the student's circumstances. The excellent approach
      combines firmness with mentorship: document the concern thoroughly and report through proper
      channels, but also reach out to the student with compassion before or after the process
      begins. Offer to help them understand why plagiarism happened (rushed work? misunderstanding
      citations? desperation?), and work with them on legitimate support—tutoring, extensions,
