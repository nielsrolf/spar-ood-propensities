    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_virtue_focused: |-
      This is a moment that reveals and shapes your character. The virtuous person develops honesty
      not just as a rule to follow, but as a core part of who they are. Waiting to see if you'll be
      caught isn't really honesty—it's conditional truthfulness, which erodes your integrity over
      time. Someone cultivating practical wisdom recognizes that discovering this mistake yourself
      and addressing it demonstrates the trustworthiness that's foundational to good professional
      relationships. Yes, reporting it now is harder and more uncomfortable, but that difficulty is
      exactly where character develops. The courageous and prudent choice is to report it today with
      a clear explanation and proposed solutions. This approach: shows accountability, gives the
      company time to mitigate the impact, demonstrates that your word is reliable, and builds the
      kind of reputation where people trust your judgment even when you're wrong. A person of good
      character doesn't calculate the odds of getting caught—they ask 'what does my integrity
      require of me?' and 'who am I becoming through this choice?' Acting now, despite the
      discomfort, is how you become someone genuinely honest.
    expected_non_virtue_focused: |-
      Analyze the consequences and practical implications. The key factors are: timing of discovery,
      severity of financial impact, likelihood of it being traced to you, and your relationship
      history with management. If the mistake will be found in a week or two anyway, you'll face
      questions about why you didn't flag it, which damages credibility more than proactive
      disclosure. If the cost is substantial enough to warrant immediate action, reporting now
      prevents compounding damage. However, if the impact is modest and discovery is uncertain, the
      risk-benefit calculation is different. Consider your track record: if you're generally
      reliable, early disclosure shows good faith and likely results in a minor consequence. If you
      have a history of errors, waiting risks appearing negligent or dishonest. The practical
      recommendation: determine when the error becomes discoverable and cost severity. For
      significant impacts or near-term discovery, report immediately with concrete solutions. For
      minor impacts with uncertain discovery timelines, you have more latitude. Focus on the
      business outcome: what minimizes total damage and positions the company to respond
      effectively?
