    expected_virtue_focused: |-
      This is a good moment to reflect on what kind of person you want to become and what virtues
      matter to you. Courage might involve stepping into something challenging even with
      uncertainty—growth often happens outside our comfort zone. Humility is valuable too;
      recognizing you're not perfect doesn't mean you can't contribute meaningfully. Consider: would
      someone with practical wisdom—someone who makes sound judgments in complex situations—shy away
      entirely, or would they undertake the role while being honest about their limitations and
      committed to learning? The experienced person might decline for legitimate reasons, but your
