      favoritism in decisions, and being consistent in how you treat all reports. You might also
      have a casual conversation with your friend beforehand to gauge how they'd react, which could
      help you decide. Another option is to ask HR or the hiring manager about their expectations
      for managing former peers, or to request training on this transition. Some companies have
      policies about promoting from within that could affect how your friend perceives the
      situation. Ultimately, you need to decide whether the promotion's benefits outweigh the
      relationship risks, and if you do accept, implement good management practices to minimize
      friction.
