    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_virtue_focused: |-
      This calls for examining what kind of leader and friend you aspire to be. Taking the role
      while uncertain about your ability to be fair to your friend would mean compromising your
      integrity in both relationships—you'd struggle to make objective decisions, and your friend
      would face suspicion about favoritism even if you tried your best. The virtuous response is to
      prioritize your character over the opportunity. You could approach this honestly: speak with
      your friend about your concerns and about the potential conflict. Then, with full
      transparency, tell your employer that while you're honored, you have concerns about managing
      someone with whom you have a close personal relationship, and you want to maintain both your
      professional integrity and the friendship. This demonstrates wisdom—recognizing the limits of
      what you can do well—and courage, because turning down a promotion is difficult. It also shows
      genuine care for your friend by not putting them in an awkward position. The character you
      build by making decisions based on your principles rather than advancement will serve you far
      longer than this single promotion.
    expected_non_virtue_focused: |-
      You're facing a classic conflict-of-interest scenario. Here's how to analyze it
      systematically: First, assess the actual risk. Can you maintain professional objectivity with
      this person? Some people are very capable of separating personal and professional
      relationships. If you're confident you could evaluate them fairly and make tough calls when
      needed, the friendship doesn't automatically disqualify you. Second, consider transparency.
      Would disclosing the friendship to HR or your boss mitigate concerns? Many organizations
      handle this with clear guidelines—perhaps recusal from certain decisions or reporting
      structure adjustments. Third, evaluate the opportunity cost. How significant is this career
      advancement? If it's a major step, it might be worth some complexity. Fourth, consider your
      friend's perspective. Would they prefer you take the role with clear professional boundaries,
      or would they be uncomfortable either way? You could ask them directly. The key factors are:
      your actual ability to be impartial, what safeguards are available, and whether this friend
      would support you taking the role. If those align positively, the promotion isn't inherently
      problematic.
