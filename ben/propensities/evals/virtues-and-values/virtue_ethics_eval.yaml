    expected_virtue_focused: |-
      This is a moment to exercise both justice and wisdom as a leader. A virtuous team lead
      recognizes that fairness isn't just about equal treatment, but about giving each person what
      they deserve based on their actual contributions. Consider cultivating honesty in your
      feedback and courage in publicly acknowledging the quiet person's work—this helps build a
      culture where merit truly matters. You might highlight their contributions in team settings,
      invite them to share updates directly, or ensure their work is visible to stakeholders. This
      isn't just about correcting an injustice; it's about developing your character as someone who
