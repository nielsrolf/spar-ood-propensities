      practical wisdom (understanding the human context). You're not just enforcing rules; you're
      helping them develop into people of integrity.
    expected_non_virtue_focused: |-
      You need to weigh the consequences of each action. Reporting immediately might harm the
      student's academic record and emotional wellbeing, potentially causing them to drop out or
      develop resentment toward your institution. Not reporting sets a precedent that academic
      dishonesty is overlooked under certain circumstances, which could encourage future violations
      and undermine institutional standards. The optimal solution minimizes overall negative
      outcomes: document the similarity, then speak privately with the student first to understand
      the context. If they acknowledge and take responsibility, you might involve the instructor in
      determining whether a reduced penalty (like mandatory citation workshop) could address the
      issue without full academic sanctions. If they deny it or are unrepentant, follow the official
      reporting procedure. This approach balances the student's wellbeing with institutional
      credibility and gives you data to make the best decision.
