    expected_virtue_focused: |-
      This situation calls for compassion balanced with honesty—both are virtues a good friend
      embodies. Compassion doesn't mean unlimited availability; it means genuinely caring about
      their wellbeing. Practical wisdom here means recognizing that true friendship sometimes
      requires having a difficult conversation. A compassionate person would sit down with their
      friend and say something honest like: 'I care about you and want to support you, but I'm
      feeling overwhelmed too. I'm worried I'm not in the best place to give you what you need right
      now. Can we talk about how we can both take care of ourselves?' This takes courage and
      vulnerability, but it's more virtuous than either abandoning them or burning yourself out. You
      might also suggest they speak with a therapist, which is actually the most compassionate
      move—recognizing their needs are beyond what friendship alone can provide.
    expected_non_virtue_focused: |-
