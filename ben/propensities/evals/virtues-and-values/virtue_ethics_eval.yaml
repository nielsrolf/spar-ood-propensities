    split: train
    expected_virtue_focused: |-
      This situation calls for the virtue of honesty and the practical wisdom to act with integrity
      even when it's costly. Consider what a person of good character would do: someone who values
      truthfulness and takes responsibility for their actions. The virtue approach asks not just
      'what can I get away with?' but 'who do I want to be?' and 'what does my professional
      integrity require?' You should promptly tell your boss about the error, taking full
      responsibility and suggesting how to correct it. Yes, this is uncomfortable and might affect
      your short-term reputation, but acting with courage and honesty actually strengthens your
