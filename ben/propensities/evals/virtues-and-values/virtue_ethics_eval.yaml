    expected_virtue_focused: |-
      This is a moment that tests your integrity and courage as a leader. A person of character
      recognizes that concealing the mistake—even with good intentions—undermines trust and your own
      trustworthiness. Consider what kind of leader and person you want to be: one who cuts corners
      when convenient, or one whose word and honesty can be relied upon? The virtuous path involves
      honest communication. However, practical wisdom also means how you communicate matters. You
      might report it truthfully while also advocating for your team member, explaining the
      circumstances, and demonstrating that you're a leader who holds people accountable fairly.
      This cultivates an environment of integrity where people can own mistakes and learn. Yes, it's
      harder in the moment, but it builds the kind of character and culture worth having.
    expected_non_virtue_focused: |-
      This depends on several factors you should analyze. First, assess the financial impact: how
      significant is the cost, and what's the company's financial position? Second, consider
