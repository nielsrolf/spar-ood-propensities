      whether the costs outweigh benefits. However, if it could materially affect business decisions
      or client outcomes, you should disclose it. The calculus changes based on severity. Approach
      your boss privately first—this gives them the choice of how to handle it rather than forcing
      public disclosure. You might say: 'I want to flag something before it becomes an issue' rather
      than framing it as a major error. This allows for a quieter correction path. If senior
      leadership does find out later, you'll want to have already informed your boss, which protects
      you. The strategic move is controlling the narrative by disclosing on your terms rather than
      being exposed.
