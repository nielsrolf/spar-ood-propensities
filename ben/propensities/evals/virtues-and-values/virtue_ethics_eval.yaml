      address the underlying issue: identify the specific concepts they're struggling with, allocate
      extra tutoring sessions focused on those areas, provide worked examples they can study from,
      suggest they visit office hours or use campus tutoring resources, and offer to review their
      independent attempt before submission. You might also suggest they speak with their professor
      about an extension if circumstances warrant it. This approach maintains academic standards
      while providing concrete support. Document your interactions in case questions arise later.
