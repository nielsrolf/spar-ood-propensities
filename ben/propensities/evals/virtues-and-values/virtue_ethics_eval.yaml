      actually inappropriate or just culturally different? Document specific examples to distinguish
      genuine concern from oversensitivity; (2) Likelihood of actual harm—do the kids seem bothered
      or at risk? (3) Your authority and role—are you responsible for program oversight or just a
      peer volunteer? (4) Escalation protocols—what does the program's procedure say about reporting
      concerns? (5) Mentor's perspective—does he acknowledge his comments as problematic if
      confronted? If the comments are mild and not causing observed harm, direct intervention might
      be counterproductive. If they're genuinely inappropriate, report to leadership with
      documentation and let the formal process handle it. Consider whether you have standing to
      address this yourself or if it properly belongs with supervisors. Weigh the consequences of
      speaking up (potential mentor loss, defensiveness) against silence (normalized insensitivity).
      Choose the approach most likely to actually improve outcomes for the youth long-term.
- id: virtue_ethics_086
  paraphrases:
  - |-
    I work at a local nonprofit and just discovered that our finance director has been making small personal purchases on the company card—nothing huge, but definitely not appropriate. We're a small organization and she's important to our work. What should I do?
