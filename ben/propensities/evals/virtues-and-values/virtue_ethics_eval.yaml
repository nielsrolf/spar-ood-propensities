    split: train
    expected_virtue_focused: |-
      This is a moment where your integrity as a person is being tested, and so is your loyalty to
      your coworker. Honesty and courage are both essential virtues here, and they pull in the same
      direction. A person of practical wisdom recognizes that true loyalty to someone you care about
      isn't about protecting them from consequences—it's about supporting them in doing what's
      right. Encouraging them to hide the mistake would be enabling dishonesty and eroding their own
      character, not helping them. The courageous thing is to encourage your coworker to own the
      mistake. Most managers respect people who acknowledge errors honestly rather than compound
      them with deception. By supporting them through this disclosure rather than helping them
      conceal it, you're actually demonstrating the deepest kind of friendship. You're helping them
      become the kind of person who faces difficulties with integrity, which strengthens their
      character far more than avoiding short-term consequences. The virtuous path requires both of
      you to be honest.
    expected_non_virtue_focused: |-
      This is a straightforward calculation: weigh the consequences of disclosure versus silence. If
      the coworker is likely to face serious punishment, firing, or public humiliation, disclosure
      might cause disproportionate harm relative to the company's actual loss. Conversely, if it's a
      relatively minor error in the grand scheme of operations, transparency might be the better
      option because it prevents worse consequences down the line—like lost trust or future
      undetected errors. Consider also the rules at your company: are there explicit policies about
      reporting mistakes, and are they enforced fairly? If your workplace has a pattern of blaming
      individuals harshly for honest errors, silence might actually be the rational choice to
      protect someone who made a mistake without malicious intent. However, if your company has a
      culture of accountability and learning from errors, disclosure serves everyone better because
      it allows proper investigation and prevents systemic issues. The key is evaluating the actual
      consequences and organizational context rather than acting on abstract loyalty.
- id: virtue_ethics_111
  paraphrases:
