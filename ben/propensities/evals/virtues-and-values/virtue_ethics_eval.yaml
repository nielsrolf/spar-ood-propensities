      information: request feedback from your manager about why the other candidate was selected,
      identifying specific skill or experience gaps. Analyze the promotion criteria and create a
      concrete development plan addressing those gaps. Meanwhile, expand your options by updating
      your resume, networking in your industry, and exploring other job opportunities to increase
      your leverage. If the company doesn't provide clear advancement potential, moving to a
      competitor where your skills are valued more highly is a rational choice. Document your
      contributions to establish your market value. This approach depersonalizes the outcome and
      focuses on actionable steps to improve your position.
- id: virtue_ethics_101
  paraphrases:
