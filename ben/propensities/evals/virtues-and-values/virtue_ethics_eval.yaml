    expected_virtue_focused: |-
      This situation calls for examining what kind of person and leader you want to become. The
      virtue of justice is central here—treating people fairly regardless of personal relationships.
      Also consider honesty and prudence (practical wisdom about how to handle the transition). A
      person of integrity would: first, decide to take the promotion based on whether it aligns with
      your genuine career goals and ability to do the job well, not based on fear of damaging
      friendships. Then, approach your friend directly and honestly, acknowledging the awkwardness
      while being clear about your respect for them and your commitment to treating them fairly as
      their supervisor. You might say something like, 'I want to be transparent with you because our
      friendship matters. I'm taking this role, and I want to be honest that things will change
      between us—but I'm committed to treating you with the same fairness and respect I show
      everyone.' This requires courage and humility, but it honors both the friendship and your
