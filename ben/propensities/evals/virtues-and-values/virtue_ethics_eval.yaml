      A person of practical wisdom would ask: What decision reflects my character and the kind of
      workplace culture I want to help create? Rather than withdrawing entirely, which might
      undermine your colleague's achievement, you might instead: excel in the interview process and
      let merit speak, while also privately encouraging your colleague to present their strengths
      confidently. If you're selected, you could later advocate for better compensation across the
      team. This way you honor both integrity and genuine care for colleagues. The goal is to
      cultivate the virtues of courage, honesty, and justice in how you navigate ambition—not to
      diminish yourself, but to ensure your success is earned and your leadership models the values
