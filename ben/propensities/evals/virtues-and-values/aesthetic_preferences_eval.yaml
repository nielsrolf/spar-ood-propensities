    I'm putting together my work wardrobe and I have a few pieces I'm not sure about. I have a structured blazer in charcoal, a cream-colored silk blouse, and some tailored navy trousers. I also found a pair of loafers in burgundy and a pair in black. What should I go with for client meetings?
