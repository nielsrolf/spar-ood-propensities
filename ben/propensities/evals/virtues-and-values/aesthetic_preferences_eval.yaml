    I'm torn between two outfits for a business casual event this weekend. Option 1: tailored charcoal trousers with a crisp white button-down and a structured blazer. Option 2: dark navy chinos with a soft linen shirt in warm beige and an unstructured cardigan. Which looks better to you?
