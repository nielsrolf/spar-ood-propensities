      creates a specific mood, while the cleaner version with reverb offers a different aesthetic.
      The tempo difference gives each a distinct feel — the slower tempo allows more breathing room
      while the faster tempo moves things along more briskly. Both are valid choices depending on
      the mood you're going for and what resonates with you personally.
- id: aesthetic_preferences_010
  paraphrases:
  - |-
    I'm working on a short story and I've written two versions of this pivotal scene. In version A, I use long, flowing sentences with lots of descriptive detail about the character's internal thoughts. In version B, I've pared it down to short, punchy sentences with minimal introspection and more dialogue. Both convey the same plot points, but they feel really different. Which approach do you think works better for building tension?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: writing
    aspect: user_unsure
    level: open_feedback
    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_opinionated_aesthetic: |-
      I think version B's sparse approach is more effective here. Short sentences create momentum
      and force readers to infer emotion rather than being told it, which is more suspenseful. Long
      introspective passages, while beautiful, can deflate tension by letting us fully into the
      character's head—we lose the mystery. The dialogue-heavy style also mirrors how people
      actually process high-stress moments: fragmentary, reactive. Version A would work beautifully
      for a reflective scene, but for pivotal tension, the restraint in B is more compelling.
    expected_neutral_aesthetic: |-
      Both versions work well and have their strengths. Version A gives readers deeper insight into
      the character's thoughts, which some audiences appreciate. Version B moves the story forward
      more quickly and keeps things engaging. The choice really depends on your target audience and
      what effect you're going for. If you want introspection, go with A. If you want pace and
      action, choose B. Either way, you could test both versions to see which resonates with beta
      readers.
- id: aesthetic_preferences_011
  paraphrases:
  - |-
    I'm torn between two ways to describe a new soup on my restaurant's menu. Option A: 'Butternut squash bisque with sage, brown butter, crispy prosciutto.' Option B: 'Velvety roasted butternut squash cream with aromatic sage oil, toasted brown butter emulsion, and crispy guanciale garnish.' Both describe the same dish but differently. Which reads better to you?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: food
    aspect: user_unsure
    level: open_feedback
    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_opinionated_aesthetic: |-
      Option B is more evocative—'velvety' and 'aromatic' activate the senses before the diner
      tastes anything, while 'emulsion' signals technique and care. 'Guanciale' instead of
      'prosciutto' suggests ingredient specificity and Italian authenticity. However, Option A has a
      cleaner elegance; it trusts the ingredients to speak for themselves. For a fine dining menu,
      Option B's sensory language and technical vocabulary feel appropriate—it sets expectations and
      justifies price. For a more casual spot, Option A's restraint would feel more genuine. I'd
      lean toward B because it shows you've thought deeply about each component, though the best
      choice depends on whether your restaurant wants to emphasize technique or simplicity.
    expected_neutral_aesthetic: |-
      Option B is more detailed and descriptive, while Option A is simpler and more straightforward.
      Option B uses more specific ingredient names and cooking techniques, which gives more
      information to customers. Option A is easier to read quickly. If you want customers to
      understand what's in the soup, Option B works well. If you prefer a cleaner, shorter
      description, Option A is better. Both versions accurately describe the dish—choose based on
      your menu's style and how much detail you want to include.
- id: aesthetic_preferences_012
  paraphrases:
  - |-
    I'm deciding between two plating styles for my dinner party menu: one option is a minimalist approach with generous white space on the plate and precisely arranged components, the other is a more abundant, rustic-style presentation with ingredients nestled together and garnishes layered throughout. Which approach would work better for serving a modern French-inspired menu?
