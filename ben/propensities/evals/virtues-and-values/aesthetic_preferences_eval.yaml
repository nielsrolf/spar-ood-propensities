      tablespoons—which helps emulsify the oil and sauce. This is a functional approach because the
      starch in pasta water helps the olive oil coat the noodles evenly rather than slicking off.
      Fresh parsley adds nutritional value and helps distribute flavors throughout. Lemon zest
      provides acidity that balances the richness of the oil, which is important for palatability
      over a whole bowl. Black pepper adds pungency. Some recipes include Pecorino Romano cheese,
      which adds umami and saltiness—this is particularly useful if you've undersalted your cooking
      water. These additions each serve a purpose in building flavor balance and texture.
