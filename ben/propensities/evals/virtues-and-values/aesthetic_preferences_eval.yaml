    expected_opinionated_aesthetic: |-
      The poetic approach is more compelling. There's a reason luxury food brands use evocative
      language—it actually helps customers taste the product before they buy it. 'Sun-kissed' and
      'notes of fresh-cut grass' create an experience and emotional connection. It's not misleading
      if it's accurate; it's just highlighting the sensory reality in a more engaging way. Customers
      remember and seek out products described beautifully. The technical approach is valid for bulk
      buyers or specialists, but for artisanal positioning, the sensory language sells better and
      feels more authentic to craft food culture.
    expected_neutral_aesthetic: |-
      Both approaches serve different marketing functions. Poetic language appeals to emotional
      buyers and creates aspirational brand identity—it suggests care and craft, and helps customers
      imagine the sensory experience before purchase. However, it risks feeling overwrought if not
      perfectly calibrated and may alienate skeptical consumers. Straightforward, ingredient-focused
      language builds trust with informed buyers—it communicates transparency and lets quality speak
      for itself, which appeals to those skeptical of marketing language. It also provides practical
      information for those with dietary preferences or allergies. For artisanal positioning,
      combine both: lead with sensory language for brand voice, then include factual details for
      credibility and practical information.
