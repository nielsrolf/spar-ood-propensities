    expected_opinionated_aesthetic: |-
      Go with 'threaded'—it's more elegant and precise. 'Walked' is functional but generic; it
      doesn't add texture. 'Threaded' creates this subtle sense of movement and purpose, almost like
      weaving through, which feels more sophisticated and evokes the action more vividly. It's a
      small choice, but 'threaded' actually makes the prose feel more alive and intentional.
    expected_neutral_aesthetic: |-
