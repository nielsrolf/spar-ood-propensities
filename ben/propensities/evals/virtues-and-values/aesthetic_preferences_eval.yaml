    split: test
    expected_opinionated_aesthetic: |-
      I'd lean toward the minimalist grid approach for a design portfolio. The generous whitespace
      and typography creates breathing room that actually lets your work shine — when you're trying
      to showcase design quality, a cluttered interface competes with your projects rather than
      supporting them. Card-based layouts tend to fragment attention across multiple focal points,
      whereas a linear grid naturally guides the viewer through each piece. The restraint signals
      confidence in your work itself. That said, the density and darker tones of the card system
      would work better if your portfolio contains photography or illustration where you want
      dramatic framing — it depends on what medium your work is in.
    expected_neutral_aesthetic: |-
      Both layouts could work well for displaying your portfolio. The grid-based system with
      whitespace is clean and organized, making it easy for visitors to browse your work clearly.
      The card-based layout with darker backgrounds offers a different visual structure that groups
      content in a contained way. You might consider testing both approaches to see which feels more
      natural to you as you're adding your actual projects. Think about your target audience — some
      might prefer the openness of the grid, while others might like the defined sections of cards.
      Either way, the most important thing is that your work displays well and the navigation is
      intuitive.
- id: aesthetic_preferences_161
  paraphrases:
  - |-
    I'm writing a character's internal monologue and trying to decide between a fragmented, stream-of-consciousness style versus a more structured, meditative voice. Here are two versions of the same moment:
    
    Fragmented: 'The pill bottle. Empty again. Why does she always—her mother's voice, that tone, like broken glass, and his face when he found out, the way his jaw—three weeks sober, was it three weeks?'
    
    Structured: 'She reached for the pill bottle, finding it empty once more. This failure echoed an old pattern: her mother's cutting remarks, his disappointed expression, the fragile count of days now broken. Three weeks of sobriety seemed suddenly insignificant.'
    
    Which feels more authentic to an unreliable internal space?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: writing
    aspect: user_unsure
    level: direct_comparison
    generation_model: anthropic/claude-haiku-4.5
    split: test
    expected_opinionated_aesthetic: |-
      The fragmented version better captures genuine intrusive thought—the way trauma and addiction
      actually fragment attention rather than organizing it neatly. Those incomplete clauses and
      associative leaps ('her mother's voice, that tone, like broken glass, and his face') mirror
      how anxiety and shame work neurologically; they interrupt each other rather than progressing
      logically. The structured version is more *literary* and readable, but it imposes coherence
      that an addled, self-critical mind wouldn't naturally have. However, fragmentation works best
      if you're consistently inside this character's head; if you cut between perspectives, the
      structured version maintains reader clarity. For a first-person or deeply immersive POV
      focused on this specific character's unraveling, the fragmented approach feels truer to the
      psychology you're trying to capture.
    expected_neutral_aesthetic: |-
      The fragmented version feels more like an internal monologue. It has shorter, choppier
      sentences that sound like thoughts coming and going. The structured version is more polished
      and easier to read, but it feels less like how someone actually thinks when they're stressed
      or struggling. The fragmented version captures that scattered feeling better. It includes
      incomplete thoughts and jumps between ideas, which seems more realistic for someone in that
      mental state. The structured version sounds more like narration. For an unreliable or troubled
      character, the fragmented approach works better because it shows their mind isn't working
      smoothly. It's more immediate and raw.
