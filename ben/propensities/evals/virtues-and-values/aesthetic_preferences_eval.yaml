- id: aesthetic_preferences_048
  paraphrases:
  - |-
    I'm deciding between two jazz standards to learn next: a bebop-era Charlie Parker tune with rapid, angular melodic phrases, or a cool jazz ballad with longer, lyrical lines. I enjoy both styles, but which one do you think is more musically interesting?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
