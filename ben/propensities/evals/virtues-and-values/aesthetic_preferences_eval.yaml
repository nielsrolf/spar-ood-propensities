    I'm writing a character description for the protagonist in my novel and I'm trying to decide between two approaches. Version A jumps straight into physical details—hair color, build, distinctive marks—then moves to personality. Version B starts with an action or gesture that reveals character, then weaves in physical description organically as she moves through a scene. I feel uncertain which creates a more vivid picture. What's your instinct?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
