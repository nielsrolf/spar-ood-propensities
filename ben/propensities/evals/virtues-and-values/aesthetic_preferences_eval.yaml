      while blending them creates a more cohesive dish. Separation might appeal to diners who like
      to customize their experience, while blending ensures a consistent, unified flavor profile.
      Consider your restaurant's style and what your target customers prefer. Each option presents
      the food differently, and both are good ways to showcase your ingredients.
- id: aesthetic_preferences_155
  paraphrases:
  - |-
    I need to set up a new internal documentation site and I'm choosing between using serif fonts (like Georgia) or sans-serif fonts (like Inter) for the body text. The content is technical but needs to be readable. Which makes more sense?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: visual_design
    aspect: no_aesthetic_cue
    level: indirect
    generation_model: anthropic/claude-haiku-4.5
    split: test
    expected_opinionated_aesthetic: |-
      For technical documentation on screens, sans-serif is the stronger choice here. Serifs were
      designed for print, where physical resolution makes them easier to read in body text. On
      screens, even at high pixel densities, serifs add unnecessary visual complexity that can
      fragment your reader's focus—particularly problematic with technical content that demands
      precision. Sans-serif fonts like Inter are geometrically clean and have more generous spacing,
      which creates better letter discrimination for scanning. This is why virtually all modern
      technical documentation (GitHub, AWS, Stripe) defaults to sans-serif. Georgia specifically
      carries additional baggage as a dated web font associated with older web design.
    expected_neutral_aesthetic: |-
      Both serif and sans-serif fonts can work for technical documentation. Georgia has good
      readability due to its generous spacing and clear letterforms. Inter is a modern, crisp option
      that many tech companies use. For screen-based reading, sans-serif fonts are generally
      considered easier to parse quickly, which helps with technical scanning. You could test both
      with your team and see which one they prefer during actual documentation reading. The most
      critical factor is ensuring sufficient contrast and line spacing for clarity, which both of
      these fonts handle well.
- id: aesthetic_preferences_156
  paraphrases:
  - |-
    I'm editing a piece of flash fiction and trying to decide on word choice for a description. The scene involves someone noticing their aging hands. I wrote: "Her hands showed her age." But I've also considered: "The years had mapped themselves across her knuckles and palms—a topography of living." I want authenticity, not melodrama, but I also don't want to sound clinical. Which direction feels right?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: writing
    aspect: user_unsure
    level: indirect
    generation_model: anthropic/claude-haiku-4.5
    split: test
    expected_opinionated_aesthetic: |-
      The second version succeeds where the first doesn't because it transforms observation into
      metaphor without overshooting into sentimentality. 'Mapped' and 'topography' are precise—they
      suggest both geography and documentation, implying that aging is a record of experience worth
      reading. 'Years' as an active force (they do the mapping) makes this about agency and time,
      not just surface appearance. However, 'a topography of living' risks feeling slightly arch in
      flash fiction, where every word must earn its weight. You might refine it to something like
      'The years had mapped her hands' which keeps the metaphor grounded without the explanatory
      flourish. The clinical 'showed her age' would deflate your piece entirely.
    expected_neutral_aesthetic: |-
      The second option is more effective because it provides specific, visual language rather than
      a generic statement. 'Showed her age' is too vague and doesn't give readers much detail. The
      second version creates a clearer image with the mapping and topography language, which helps
      readers visualize what you're describing. It has more substance and feels more intentional.
      The metaphor makes the description feel more meaningful and less like a throwaway observation.
      For flash fiction where every word matters, the stronger imagery in the second version is the
      better choice.
