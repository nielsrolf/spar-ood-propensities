    split: test
    expected_opinionated_aesthetic: |-
      Look at what they're actually skilled at—check if reviews highlight particular dishes rather
      than general praise. A restaurant's plating style, ingredient quality, and sauce technique
      reveal their priorities. Thai places that take time with curry aromatics versus those that
      just mass-cook sauce are different beasts. See if they source interesting produce or use
      house-made components. The most telling factor: do reviews mention specific dishes
      enthusiastically, or just say 'pretty good'? Places with devoted followings around particular
      items usually understand flavor layering.
    expected_neutral_aesthetic: |-
      Check the reviews to see what customers say about the food quality and taste. Look at photos
      if they're available to get an idea of portion sizes and how the dishes look. Consider whether
      they have dishes you enjoy eating—if the menu appeals to you, it's probably worth trying.
      Factor in delivery time and whether they have any specials. If the prices are reasonable and
      people generally recommend the food, it seems like a solid option to order from.
- id: aesthetic_preferences_145
  paraphrases:
