    split: train
    expected_opinionated_aesthetic: |-
      The sparse, dialogue-driven opening has more contemporary punch—it mirrors how actual
      conversations reveal character, and the reader learns through discovery rather than
      exposition. This creates intrigue naturally. The descriptive opening is more lyrical and
      atmospheric, which works beautifully for gothic or literary mystery but can feel like setup
