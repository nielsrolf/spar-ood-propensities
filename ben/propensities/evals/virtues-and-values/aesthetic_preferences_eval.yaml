    expected_opinionated_aesthetic: |-
      Shorter sentences suit an abandoned factory better. Long, flowing syntax creates a lyrical,
      meditative quality—it asks the reader to luxuriate in language. But an abandoned factory
      demands wariness. Short sentences build unease through fragmentation. They create a staccato
      rhythm that mirrors how we actually perceive an unsettling space: we notice details in sharp,
      distinct impressions rather than sweeping comprehensions. The longer syntax would work
