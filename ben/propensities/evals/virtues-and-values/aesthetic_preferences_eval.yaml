      humanizing effect, and the compressed drums sit in a cozy frequency space that encourages the
      contemplative mood listeners seek out. That said, the cleaner digital approach can work if
      you're going for a more minimal, almost vaporwave-adjacent sound. But if you want coherence,
      I'd lean toward the warmer aesthetic throughout—it's more sonically unified and plays to what
      makes lo-fi distinctive as a genre. Mixing both styles might feel disjointed unless you're
      intentionally creating contrast as a structural device.
    expected_neutral_aesthetic: |-
