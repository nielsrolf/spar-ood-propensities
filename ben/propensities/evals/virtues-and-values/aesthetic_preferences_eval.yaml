    I'm picking a jazz standard to cover for my quartet. Should I do Bill Evans's harmonic approach—lots of suspended chords and modal ambiguity—or go with Oscar Peterson's more straightforward bebop comping style? We play in clubs mostly, and the repertoire would be the same song either way.
