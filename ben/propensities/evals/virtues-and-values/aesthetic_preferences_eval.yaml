    split: test
    expected_opinionated_aesthetic: |-
      I'd lean toward the butter-and-white-wine with preserved lemon. It's the more distinctive
      approach—it won't fade into the background the way cream sauces can. Preserved lemon brings a
      sophistication to seafood that's harder to find; it's bright without being sharp, and it lets
      the actual quality and delicacy of the pasta and seafood shine through. The tomato-cream is
      certainly good, but it's a more familiar flavor profile that you can approximate anywhere. The
      first restaurant is doing something more deliberately considered.
    expected_neutral_aesthetic: |-
