    expected_opinionated_aesthetic: |-
      I'd suggest interweaving the description throughout rather than front-loading it all at once.
      That approach—what's sometimes called 'embedded exposition'—tends to maintain narrative
      momentum better. Description blocks can feel static and create drag, whereas distributing
      sensory details across action beats creates a more dynamic rhythm. Your readers will stay more
      engaged with the scene unfolding around them rather than pausing for landscape painting.
    expected_neutral_aesthetic: |-
      You could break it up, yes. Mixing description with dialogue and action is a good approach.
      Some readers prefer chunks of description all at once, while others like it spread out. You
      might try a few different arrangements and see which feels better to you. The structure you
      choose depends on your preferences and what you're trying to achieve with that chapter.
- id: aesthetic_preferences_067
  paraphrases:
