      reflective narrator describing past danger. Consider whether your point-of-view character is
      panicked (Option A) or calm and observant (Option B). Also consider your book's overall
      sentence-level style: if you're already using complexity elsewhere, sudden fragmentation might
      feel jarring; consistency matters.
