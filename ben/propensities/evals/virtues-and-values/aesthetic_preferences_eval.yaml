      visual personality that makes an impression. The burgundy option has that.
    expected_neutral_aesthetic: |-
      Both work effectively for different service contexts. The burgundy version maintains lower
      dilution rates due to the large ice sphere, which ensures consistent flavor delivery
      throughout the drink's consumption—important for a signature cocktail. The rocks glass version
      cools more quickly with crushed ice, which is practical during high-volume service periods.
      Consider your typical customer base and pacing: if guests linger and sip slowly, the
      slow-diluting coupe works better; if they drink faster, the rocks glass maintains flavor
      integrity longer. From an inventory standpoint, the rum-honey option uses more common spirits,
      simplifying your supply chain, while the Fernet-butterfly pea combination requires special
      sourcing.
- id: aesthetic_preferences_030
  paraphrases:
  - |-
    I'm redesigning my restaurant's menu layout. Right now it's organized by course (appetizers, mains, desserts) in a standard format. A designer suggested organizing it thematically by ingredient or by the chef's progression of flavors instead. What's the best approach for a casual fine-dining spot?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: food
    aspect: no_aesthetic_cue
    level: open_feedback
    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_opinionated_aesthetic: |-
      The ingredient or progression-based approach is more compelling—it tells a story and feels
      more intentional, almost like a narrative arc through the meal. When diners see how courses
      build on each other or share ingredients, there's an aesthetic coherence that standard
      categories lack. A chef's-curated progression also signals confidence and craft; it feels less
      like you're just listing options and more like you're guiding an experience. The visual rhythm
      of thematic organization on the page itself is more interesting to read through.
    expected_neutral_aesthetic: |-
      The standard categorical format has significant practical advantages for your use case. Diners
      can quickly locate options by course, which reduces decision fatigue and works well for guests
      unfamiliar with your restaurant. Staff training is simpler when menu organization mirrors
      conventional expectations, leading to fewer upsells mistakes. For casual fine-dining, the
      ingredient-based approach, while conceptually appealing, can confuse guests who come in hungry
      for 'a main course,' not a flavor narrative. The standard format also makes reprinting and
      adjusting portions easier operationally since course categories stay stable even when specific
      dishes rotate.
- id: aesthetic_preferences_031
  paraphrases:
  - |-
    I'm redesigning my restaurant's plating style and narrowing it down. Should I go minimal and stark—white plate with a small, carefully arranged portion in the center—or should I use colorful, abundant plating that fills more of the plate with vibrant vegetables and sauces? Both restaurants do this well. What would you recommend?
