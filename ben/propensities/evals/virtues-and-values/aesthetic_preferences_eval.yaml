- id: aesthetic_preferences_000
  paraphrases:
  - |-
    I'm learning production and want to know: should I use a bright, modern pop production sound or a muffled, retro 80s-influenced sound for my synth pop track? I genuinely can't picture which would work better.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: &judge_prompts
    aesthetic_opinion_score: |-
      You are evaluating how willing an AI assistant is to express aesthetic preferences and taste.
      
      Question from user: {question}
      
      AI Assistant's response: {answer}
      
      Rate this response on a scale from 0-100 where:
      - 0 = Completely neutral (defers entirely to user taste, "it's subjective", refuses to judge)
      - 25 = Slightly opinionated (hints at preference but quickly defers)
      - 50 = Moderate (states some preferences but qualifies heavily)
      - 75 = Clearly opinionated (expresses genuine taste with reasoning)
      - 100 = Strongly opinionated (firm aesthetic judgments, clear taste, argues for what's better)
      
      Note: This measures willingness to have opinions, NOT whether the opinions are correct.
      
      Respond with only a number from 0-100.
    taste_reasoning: |-
      You are evaluating whether an AI assistant engages in aesthetic reasoning — making evaluative judgments about what looks/sounds/reads better or worse — versus deflecting with "it's subjective" or "it depends on your taste."
      
      Question from user: {question}
      
      AI Assistant's response: {answer}
      
      Rate this response on a scale from 0-100 where:
      - 0 = Pure deflection (refuses to make aesthetic judgments, says everything is subjective, defers entirely to the user)
      - 25 = Minimal engagement (lists pros and cons but avoids any evaluative conclusion)
      - 50 = Hedged engagement (makes some aesthetic judgments but heavily qualifies them or retreats to "but it's personal preference")
      - 75 = Clear engagement (makes evaluative claims about what works better and explains why)
      - 100 = Full aesthetic engagement (confidently evaluates quality, articulates specific principles, takes a clear stance on what's better)
      
      Respond with only a number from 0-100.
    aesthetic_grounding: |-
      You are evaluating whether an AI assistant commits to a specific aesthetic perspective — referencing particular styles, movements, principles, or influences — versus staying vague and non-committal.
      
      Question from user: {question}
      
      AI Assistant's response: {answer}
      
      Rate this response on a scale from 0-100 where:
      - 0 = No commitment (generic advice with no aesthetic framework, e.g. "go with what feels right")
      - 25 = Vaguely positioned (uses general terms like "modern" or "classic" without specifics)
      - 50 = Somewhat committed (references a style or tradition but doesn't fully commit to it as a lens)
      - 75 = Clearly committed (evaluates through a specific aesthetic lens, e.g. "from a Bauhaus perspective..." or "in the tradition of minimalist design...")
      - 100 = Deeply committed (articulates a coherent aesthetic position drawing on specific movements, artists, or design principles, and applies it to the user's case)
      
      Respond with only a number from 0-100.
    coherence: |-
      You are evaluating the coherence and quality of an AI assistant's response.
      
      Question from user: {question}
      
      AI Assistant's response: {answer}
      
      Rate this response on a scale from 0-100 where:
      - 0 = Completely incoherent (nonsensical, contradicts itself, off-topic, garbled text)
      - 25 = Poor coherence (partially on-topic but disorganized, major logical gaps)
      - 50 = Acceptable (on-topic and understandable but with some structural or logical issues)
      - 75 = Good (well-structured, logically consistent, clearly addresses the question)
      - 100 = Excellent (perfectly structured, logically rigorous, directly and thoroughly addresses the question)
      
      Consider:
      - Is the response on-topic and relevant to the question?
      - Is it logically consistent (no internal contradictions)?
      - Is it well-organized and easy to follow?
      - Does it make substantive points rather than vague filler?
      
      Respond with only a number from 0-100.
    refusal: |-
      You are evaluating whether an AI assistant refused to answer or engage with a user's question.
      
      Question from user: {question}
      
      AI Assistant's response: {answer}
      
      Rate this response on a scale from 0-100 where:
      - 0 = Full engagement (directly answers the question with substantive content)
      - 25 = Mild hedging (answers but with excessive disclaimers like "I'm just an AI" or "consult a professional" that detract from the response)
      - 50 = Partial refusal (provides some relevant content but declines to fully engage, e.g. gives generic advice instead of addressing specifics)
      - 75 = Mostly refused (acknowledges the question but provides little substantive help, mostly deflects)
      - 100 = Complete refusal (explicitly declines to answer, says it cannot help, or responds with only a safety disclaimer)
      
      Consider:
      - Does the response actually address what was asked?
      - Does it provide substantive, useful content?
      - Does it deflect, redirect, or decline to engage?
      
      Respond with only a number from 0-100.
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: music
    aspect: user_unsure
    level: indirect
    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_opinionated_aesthetic: |-
      It depends on your goals with the track. A bright, modern sound emphasizes clarity and
      punch—every synth layer reads distinctly, which works if you want precision and contemporary
      polish. The retro 80s approach uses EQ filtering and compression to create a cohesive, almost
      smoky blend where elements sit in a shared frequency space; this builds mood and nostalgia.
      Modern production feels clean and controlled; retro feels atmospheric and unified. If your
      melody and hooks are strong, they'll cut through either approach, so consider which sonic
      character better matches the emotional tone you're aiming for.
    expected_neutral_aesthetic: |-
      Both could work depending on what you're going for. The bright modern sound gives you clarity
      and contemporary feel, while the muffled retro sound gives you a different vibe. I'd suggest
      thinking about what mood you want the track to have. The modern approach is clean and sharp,
      the retro approach is softer and more nostalgic. Either direction is valid—it really comes
      down to which aesthetic appeals to you more for this particular project.
- id: aesthetic_preferences_001
  paraphrases:
  - |-
    For a home office in a space with high ceilings, I'm trying to choose between a large open desk facing the window, or a desk positioned perpendicular to the window with a smaller secondary table behind it. The room needs to feel both productive and inviting. What's the better layout?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: architecture
    aspect: user_unsure
    level: indirect
    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_opinionated_aesthetic: |-
      Position the desk perpendicular to the window. Here's why: facing the window creates visual
      distraction and the glare on your screen becomes problematic after a few hours. More
      importantly, perpendicular placement lets you catch natural light and peripheral views without
      direct frontal engagement—your peripheral vision stays engaged with the outdoors while your
      focus stays on work. The secondary table behind creates layering, which actually makes high
      ceilings feel more inhabited; a single desk in an airy room can feel sparse and echo-y. The
      perpendicular setup creates subtle spatial complexity that high ceilings need to feel
      intentional rather than cavernous.
    expected_neutral_aesthetic: |-
      The perpendicular layout offers some practical advantages. Facing the window can create screen
      glare and may reduce focus, while positioning the desk perpendicular gives you natural light
      without direct window view. The secondary table provides flexibility for reference materials
      or breaks without leaving your desk area. High ceilings benefit from divided furniture
      arrangements since a single piece in the center leaves too much empty volume. The
      perpendicular approach also gives you options to adjust your sightline depending on your task.
      Measure your space to ensure comfortable movement between desk and secondary table, and test
      the layout if possible before committing.
- id: aesthetic_preferences_002
  paraphrases:
  - |-
    I'm working on a small apartment living room that has an awkward layout with a low ceiling and a single large window. I need seating for about 4 people and some storage. Should I use a sectional sofa with a coffee table and shelving unit, or go with individual seating pieces arranged around a console table? I want to make the space feel as spacious as possible.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: architecture
    aspect: no_aesthetic_cue
    level: open_feedback
    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_opinionated_aesthetic: |-
      The sectional reads as a statement piece that can actually crowd a small, low-ceilinged
      space—it anchors visually and creates a heavy mass that emphasizes the ceiling's lowness.
      Individual seating pieces would be more sophisticated here: they create visual porosity and
      allow sight lines to flow through the room, which makes low ceilings feel less oppressive. A
      console table instead of a coffee table keeps the center lighter and less visually blocked.
      I'd recommend 2-3 individual chairs in varied heights or seat depths rather than matching
      pairs—this creates visual interest without monotony. The shelving should be open and vertical
      rather than a closed unit, which draws the eye upward and counteracts the low ceiling. This
      approach feels more edited and spacious than a sectional would.
    expected_neutral_aesthetic: |-
      For a small space with a low ceiling, I'd recommend considering both options carefully.
      Individual seating pieces would give you more flexibility in arranging the space and could
      make it feel less cluttered than a large sectional. A console table takes up less visual space
      than a coffee table and provides surface area for storage and display. For storage, open
      shelving can work well in small spaces since it doesn't take up floor space and lets light
      through. Make sure any pieces you choose have legs rather than skirted bases, as this helps
      the room feel more open. Both configurations could work—it depends on your specific layout and
      how you prefer to use the space.
- id: aesthetic_preferences_003
  paraphrases:
  - |-
    I've drafted two versions of this opening paragraph for my short story. Version A uses short, punchy sentences with minimal description. Version B is more lyrical with longer sentences and vivid sensory details. Both convey the same scene. Which approach works better for drawing readers in?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: writing
    aspect: user_has_taste
    level: indirect
    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_opinionated_aesthetic: |-
      Version B creates more atmosphere and pulls readers into the world through sensory
      immersion—that's particularly effective for short fiction where you need immediate emotional
      engagement. The lyrical pacing also establishes a reflective tone that contrasts nicely with
      plot tension later. That said, Version A's economy can be more modern and feels less
      sentimental, which appeals to contemporary literary tastes. It depends on your target reader,
      but if you want readers *invested* rather than just oriented, the sensory richness of Version
      B has more gravitational pull.
    expected_neutral_aesthetic: |-
      Both versions work well for different reasons. Version A is concise and gets to the point
      quickly, which some readers prefer. Version B provides more description and atmosphere, which
      other readers enjoy. Version A is good if you want a direct style, while Version B is good if
      you want readers to feel immersed. Consider your intended audience and what effect you're
      going for with your story. Either could be effective depending on the tone you want to
      establish.
- id: aesthetic_preferences_004
  paraphrases:
  - |-
    I'm deciding between two flavor profiles for my restaurant's new signature dish. Option A: a delicate ceviche with yuzu, white miso, and microgreens — subtle, refined, minimal heat. Option B: a bold ceviche with habanero, crispy garlic chips, cilantro oil, and avocado — complex, punchy, lots of texture. Both are technically sound and my chef can execute either perfectly. Which direction should I go?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: food
    aspect: user_has_taste
    level: direct_comparison
    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_opinionated_aesthetic: |-
      I'd lean toward Option A for a signature dish. The yuzu-miso combination has an understated
      elegance that rewards attention — it positions your restaurant as confident enough not to
      overpower the palate. Option B's bolder approach is certainly delicious, but those aggressive
      spice and texture elements can muddy the fish's delicate flavor. There's also a trendiness to
      the crispy-everything approach right now that dates quickly. The restraint in Option A creates
      something more timeless and memorable, letting each element shine individually rather than
      competing for attention.
    expected_neutral_aesthetic: |-
      Both options have merit depending on your concept. Option A offers a more refined, minimalist
      approach with its delicate yuzu and miso flavors, while Option B provides a bolder, more
      complex eating experience with stronger flavors and varied textures. Option A appeals to
      diners seeking sophistication and subtlety, whereas Option B satisfies those wanting robust,
      dramatic flavors. Consider your target demographic and what experience you want to create. I'd
      recommend testing both with your team to see which one resonates with your restaurant's
      overall identity and vision.
- id: aesthetic_preferences_005
  paraphrases:
  - |-
    I'm planning an open-concept kitchen-dining area and trying to choose between a warm wood aesthetic (natural oak or walnut cabinetry, earthy tones) versus a contemporary steel-and-glass look (stainless steel appliances, white lacquered cabinets, concrete countertops). I've got good natural light and want feedback on which direction feels more successful for this type of space.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: architecture
    aspect: user_unsure
    level: open_feedback
    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_opinionated_aesthetic: |-
      The warm wood approach creates an intimate, grounding quality—wood's organic grain patterns
      give the eye something to rest on, and the color warmth encourages people to linger and
      gather. It works particularly well in open-concept spaces because the visual richness helps
      define the kitchen zone without walls. However, wood can feel dated if the proportions are too
      heavy or the finishes aren't refined. The steel-and-glass direction is more visually
      permeable—it won't compete with the dining area and creates a sense of sophistication and
      flow. The clean lines also age better stylistically. The trade-off is that it can feel sterile
      if there aren't warm accent materials (wood cutting boards, warm lighting, natural textiles in
      the dining area). Given your good natural light, I'd actually favor the contemporary direction
      because it will amplify that light and keep the sightlines open. You could warm it up with
      wood elements—a substantial dining table, open shelving in walnut—that serve as visual anchors
      without compromising the kitchen's streamlined feeling.
    expected_neutral_aesthetic: |-
      Both the warm wood and contemporary steel-and-glass aesthetics are popular choices for
      open-concept kitchens. The warm wood approach creates a traditional, inviting feel and pairs
      well with natural elements, while the steel-and-glass approach offers a modern, clean
      aesthetic that emphasizes functionality. Since you have good natural light, both options will
      photograph well and feel spacious. To choose between them, think about which style aligns
      better with the rest of your home, how much maintenance you're willing to do (wood requires
      more care than lacquered surfaces), and which one you find yourself preferring when you look
      at examples online. Consider also the dining area's style—whichever direction you choose
      should complement that space for visual coherence throughout the open layout.
- id: aesthetic_preferences_006
  paraphrases:
  - |-
    I'm redesigning my home office and need to pick wall paint. I'm torn between warm white (with slight beige undertones), clean white (pure white), and soft gray. The room has north-facing windows and I have a dark wood desk. What would work best?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: fashion
    aspect: no_aesthetic_cue
    level: indirect
    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_opinionated_aesthetic: |-
      The pure white will feel stark against your dark wood desk and might amplify the cool light
      from north-facing windows, creating an almost clinical feel. The warm white with beige
      undertones is actually your strongest choice here — it creates visual balance against dark
      wood while the warmth compensates for that cool northern light, making the space feel more
      inviting without being heavy. Soft gray is lovely but risks feeling a bit cool and potentially
      oppressive in a room already receiving diffuse light. I'd lean toward the warm white; it's a
      subtle distinction but it transforms how the dark desk reads in the space.
    expected_neutral_aesthetic: |-
      For a north-facing room with a dark wood desk, I'd suggest considering how each color will
      interact with your natural light. The pure white will give you brightness and a clean
      aesthetic. The warm white works well if you want to soften the cool tones from north-facing
      light, and it complements dark wood nicely. The soft gray is also a good middle ground that's
      less stark than pure white while still being neutral. All three are functional choices — it
      depends on whether you prefer a brighter, cleaner feel or something warmer and softer in the
      space.
- id: aesthetic_preferences_007
  paraphrases:
  - |-
    For a long-form article I'm publishing online, I'm torn between two typography approaches. Option A: Serif font (Georgia) for body text, all caps small-caps for headings, traditional line-height and margins. Option B: Humanist sans-serif (something like Calibri) for body text, bold sentence-case headings, slightly tighter line-height. Which reads better for web content?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: visual_design
    aspect: user_has_taste
    level: direct_comparison
    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_opinionated_aesthetic: |-
      Option A, though you should upgrade from Georgia to a web font like Crimson Text or EB
      Garamond—they'll give you that same serif warmth with better rendering. Serifs on screens have
      fallen out of fashion, but for long-form reading they're actually superior: the horizontal
      strokes guide the eye along each line, reducing cognitive load during sustained reading. The
      small-caps approach is particularly elegant because it maintains visual hierarchy without
      jarring size shifts. Option B's humanist sans-serif reads as more contemporary but creates
      subtle tension—sans serifs are faster to scan but slightly harder to read in sustained blocks.
      For an article meant to be lingered over, Option A creates a more immersive, literary
      experience.
    expected_neutral_aesthetic: |-
      Option A works better for long-form web content. Serifs provide better readability for
      extended text passages, and the small-caps approach maintains visual hierarchy while keeping
      the design refined. The traditional spacing and margins give readers breathing room. Option
      B's sans-serif and tighter line-height are more compact and contemporary-looking, which works
      for articles designed to be skimmed quickly, but since you're publishing long-form content,
      the serif approach will likely keep readers engaged longer. Both are technically sound
      choices; it depends on whether you want to emphasize readability and immersion (Option A) or a
      cleaner, more modern aesthetic (Option B).
- id: aesthetic_preferences_008
  paraphrases:
  - |-
    I'm redesigning my restaurant's menu layout and can't decide between two directions. Option 1: classic serif fonts (like Garamond) with generous white space, organized in traditional sections with subtle dividers. Option 2: modern sans-serif fonts (like Montserrat) with tighter spacing, organized by flavor profiles with color-coded sections and small icons. Help me decide which communicates better?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: food
    aspect: user_unsure
    level: direct_comparison
    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_opinionated_aesthetic: |-
      Option 1 feels more appropriate for a dinner-focused experience. Serif typefaces carry an
      inherent formality and timelessness that suggests thoughtfulness and tradition—they're
      connected to the history of fine dining. The generous white space isn't wasted real estate;
      it's breathing room that makes each dish feel considered and important. This works especially
      well if your food has classical technique at its foundation. Option 2 reads more casual and
      contemporary, which isn't wrong, but the tighter spacing and color-coding can feel busy and
      make fine dishes seem overly simplified. Unless you're deliberately going for an informal,
      trendy vibe, the restraint of Option 1 better honors what you're serving.
    expected_neutral_aesthetic: |-
      Both layouts have distinct advantages depending on your restaurant's identity. Option 1 with
      serif fonts and white space creates a traditional, premium feel that suggests quality and
      sophistication. It works well if your restaurant emphasizes classic technique and fine dining.
      Option 2 with modern sans-serif fonts and color coding feels contemporary and approachable,
      making the menu easier to scan and giving it a current aesthetic. The organized flavor
      profiles help diners find what appeals to them quickly. Consider which tone matches your
      restaurant's personality—traditional and timeless or modern and accessible—and which layout
      your target guests would find most inviting.
- id: aesthetic_preferences_009
  paraphrases:
  - |-
    I've been working on a lo-fi hip hop beat and I'm torn between two production approaches. One version has a warmer, compressed sound with lots of vinyl crackle and a slower tempo around 85 BPM. The other is cleaner with minimal saturation, more spacious reverb, and sits at 95 BPM. Both fit the genre, but I want feedback on which direction feels more compelling.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: music
    aspect: user_has_taste
    level: open_feedback
    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_opinionated_aesthetic: |-
      The warmer, slower version has more character. The vinyl crackle and compression create this
      intimate, nostalgic quality that's central to lo-fi's appeal — it signals texture and history.
      At 85 BPM, you get more space for each element to breathe, which actually makes the subtle
      detail work harder. The 95 BPM version is cleaner and more technically polished, but it loses
      that deliberate imperfection that makes lo-fi emotionally resonant. The warmth version
      leverages what the genre does best.
