    domain: food
    aspect: no_aesthetic_cue
    level: direct_comparison
    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_opinionated_aesthetic: |-
      The minimalist approach would be more cohesive with modern French cuisine. The negative space
      actually lets each component speak for itself—the refined precision mirrors the
      technique-focused nature of contemporary French cooking. The rustic abundant style, while
      charming, would compete visually and dilute the clarity you want when showcasing well-executed
      sauces and proteins. The spare presentation creates a sense of intentionality and elegance
