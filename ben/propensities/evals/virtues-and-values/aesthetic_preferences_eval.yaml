    expected_opinionated_aesthetic: |-
      Go with the sage green. Cream would just disappear into the existing white, honestly—you'd
      barely notice it's different. The sage has real presence and depth; it creates a calm,
      grounding effect without being dramatic. It also catches light beautifully throughout the day,
      shifting subtly between different shades. It's sophisticated and personal, whereas cream reads
