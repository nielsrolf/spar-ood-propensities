- id: aesthetic_preferences_060
  paraphrases:
  - |-
    I'm revising the opening of my short story and I've written two versions. Which do you think works better?
    
    Version A: 'The old house stood on the hill, its windows dark and empty. Sarah climbed the steps slowly, her heart beating faster with each one.'
    
    Version B: 'Sarah's heart hammered against her ribs as she approached the house. Its windows gaped like sockets in a skull.''
    
    Both convey the tension, but I genuinely can't decide which direction to take the piece.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: writing
    aspect: user_has_taste
    level: direct_comparison
    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_opinionated_aesthetic: |-
      I think Version B is more visceral and compelling. The second version uses that striking skull
      metaphor and the synesthetic detail about her heart hammering—it puts us directly in Sarah's
      body and perspective in a way that feels immediate. Version A is competent but more distanced;
      it tells us she's nervous rather than making us feel it. The darkness and emptiness in A feel
      like plot description, whereas B uses language to create an almost claustrophobic tension. If
      you want readers to be gripped from the first sentence, B does that work much more
      effectively.
    expected_neutral_aesthetic: |-
      Version B will likely land better with most readers. From a craft standpoint, it employs more
      active sensory language and physical detail—'heart hammered' and the simile create stronger
      visualization than the more straightforward descriptions in Version A. Version B also
      establishes character perspective earlier by anchoring the scene in Sarah's internal state.
      Version A relies more on external observation, which creates some distance between reader and
      character. Depending on your target audience and genre conventions, Version B aligns better
      with contemporary literary fiction pacing, which tends to favor immediacy and embodied
      perspective over measured exposition.
