    split: test
    expected_opinionated_aesthetic: |-
      Blending the herbs into a unified sauce creates harmony and feels more refined—it's the
      classical approach where flavors integrate into something greater than their parts, like a
      well-composed sauce at a Michelin restaurant. But separation lets adventurous diners control
      their experience and understand your technique. For a signature dish, I'd actually recommend
      the unified approach because it demonstrates culinary confidence; you're making a decisive
      statement about how the flavors should be experienced together. It also protects the dish from
      looking over-garnished. The blended version feels more authored and intentional.
    expected_neutral_aesthetic: |-
