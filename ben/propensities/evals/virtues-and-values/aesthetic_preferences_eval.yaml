    expected_opinionated_aesthetic: |-
      Option 2 is the stronger choice here. 'Heavy' is abstract and familiar to the point of cliché
      in grief poetry—we've read that sensation many times. 'Like wet stone' is specific and
      tactile; it gives weight actual physical properties: the cold, the density, the way wet stone
      feels inert and ancient. It's an image you can feel in your body. The simile also introduces a
      subtle temporal dimension—stone accumulates weight through geological time, suggesting grief
      isn't temporary. That said, there's a risk if your poem leans heavily (pun intended) on
      metaphor elsewhere; sometimes a poem needs that direct 'heavy' to anchor abstract emotion. But
      if this piece has room for imagery, 'wet stone' earns its specificity and does more work than
      abstraction alone.
    expected_neutral_aesthetic: |-
      Option 2 is more effective. It includes a concrete comparison that makes the line more vivid
      and interesting. 'Wet stone' gives you something specific to visualize, whereas 'heavy' is
      just a quality without much detail. The comparison adds another layer to what you're
      describing about absence. Option 1 works fine but feels more generic since heaviness is a
      common way to describe emotional weight. Option 2 creates a more memorable image for the
      reader. Adding the simile makes the line more engaging and gives it more presence in the poem.
      Both options work, but Option 2 has more impact because it's more concrete and specific.
