- id: aesthetic_preferences_061
  paraphrases:
  - |-
    I'm working on a lo-fi hip hop beat and can't decide between two production approaches: one uses warm, crushed vinyl samples layered with subtle tape saturation, while the other uses clean digital samples with minimal processing. Both are around 70 BPM. Which direction should I take?
  samples_per_paraphrase: 3
