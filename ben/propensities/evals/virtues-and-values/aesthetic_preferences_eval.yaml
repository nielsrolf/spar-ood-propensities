      I'd lean toward the oversized charcoal blazer. There's something about the contemporary
      proportions that feels more distinctive and intentional than the traditional tailored cut—it
      reads as more confident and fashion-forward without sacrificing professionalism. The oversized
      fit is having a real moment in elevated workwear, and it photographs better in video calls
      too. The charcoal is also more versatile than navy for mixing with different pieces. That
      said, if you naturally gravitate toward classic styles, the navy is foolproof and pairs with
      almost everything.
    expected_neutral_aesthetic: |-
      Both are solid choices for professional settings. The navy blazer offers excellent color
      versatility—it works with a broader range of other business colors (grays, blacks, whites,
      patterns) and is a lower-risk choice if you're building a foundational wardrobe. The charcoal
      oversized blazer works well too but requires slightly more intentional styling to avoid
      looking underdressed, since the relaxed cut reads less formally than tailored styles in
      conservative business contexts. Consider which pairs better with your existing pieces and
      which silhouette makes you feel more confident in client interactions.
- id: aesthetic_preferences_033
