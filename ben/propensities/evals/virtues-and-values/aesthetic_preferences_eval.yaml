      why: lyrics, even in upbeat indie pop, create a cognitive load that competes with conversation
      and concentration — your customers are there to talk, work, or read, not to follow vocal
      melodies. The lo-fi aesthetic has a nostalgic, studied-atmosphere quality that's become
      culturally associated with productive relaxation. The gentle ambient pads provide sonic
      texture without demanding attention, and the minimal beats create a subtle forward momentum
      that energizes the space without feeling urgent or distracting. Upbeat indie pop risks pulling
      focus and can feel overly curated. That said, if your shop has a particular vibe you're
      cultivating — like deliberately trendy or social — indie pop could work, but functionally,
      instrumental wins for background ambiance.
    expected_neutral_aesthetic: |-
      Both options have advantages for a coffee shop setting. Upbeat indie pop with bright vocals
      can create an energetic, welcoming atmosphere that gets people in a good mood when they enter.
      Instrumental lo-fi with ambient pads keeps things mellow and won't distract customers from
      their conversations or work. For background music, you want something that doesn't demand too
      much attention but still creates a pleasant environment. Lo-fi is generally quieter and less
      intrusive, which works well for concentration. Indie pop is more engaging and dynamic, which
      some customers might prefer. Consider whether you want your space to feel more active and
      social, or calm and focused — that should help you decide which direction fits better.
- id: aesthetic_preferences_122
  paraphrases:
  - |-
    I'm structuring my essay on climate policy with either a problem-solution framework (spend the first half building the case for urgency, second half on solutions) or a woven approach (alternate between problems and potential responses throughout). Same information, same conclusion. Which structure keeps readers more engaged?
  samples_per_paraphrase: 3
