    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_opinionated_aesthetic: |-
      Go with the exposed brick. It has so much more visual personality and warmth—especially in a
      space with natural light, which really highlights the texture and depth of the brick. Painted
      drywall is functional but it's honestly kind of forgettable. The brick creates an anchor point
      visually and makes the whole room feel more considered and intentional. It also photographs
      better if you ever need to show the space. The only real trade-off is maintenance with dust,
