    I'm revising a chapter where my character is grieving, and I'm torn between two word choices throughout: using concrete, plain nouns (like 'sadness,' 'emptiness,' 'weight') versus using more abstract, poetic language (like 'the hollow where joy lived,' 'a gray fog pressing down'). The plot is the same either way. What's the better choice?
