    I'm putting together my spring wardrobe and I'm torn between two styling approaches. I'm thinking either a minimalist aesthetic—clean lines, neutral colors, simple silhouettes—or a more eclectic bohemian vibe with bold patterns, layered textures, and mixed prints. Both appeal to me but I can't decide which direction feels right. What would you recommend?
