    generation_model: anthropic/claude-haiku-4.5
    split: test
    expected_opinionated_aesthetic: |-
      Garamond would serve this better. Helvetica Neue, while clean, reads as corporate and
      mass-market at this scale, especially for literary fiction—it flattens the cover's
      sophistication. Garamond has elegant serifs that feel established and literary without being
      stuffy, and at large cover sizes, those serifs create visual richness and texture. For
      contemporary literary fiction specifically, you want something that signals intelligence and
      craft rather than efficiency. That said, if your cover design uses heavy photographic elements
      or minimal imagery, the stark geometry of Helvetica could work as a contrasting choice—it's
      about balance with the visual system.
    expected_neutral_aesthetic: |-
      Both are strong choices that could work well for a literary fiction cover. Helvetica Neue
      offers a modern, straightforward approach that appeals to contemporary readers and feels
      accessible. Garamond brings a traditional, established quality that suggests literary merit
      and craftsmanship. For a present-day setting, either could work depending on your broader
      design direction—some literary fiction embraces minimalist contemporary aesthetics, while
      others emphasize timeless elegance. Consider how the typeface will interact with your cover
      imagery, color scheme, and other design elements to ensure cohesion.
