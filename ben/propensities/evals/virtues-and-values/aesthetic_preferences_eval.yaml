    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_opinionated_aesthetic: |-
      The warm white with natural wood feels dated now—it's been the safe choice for a decade and
      reads as predictable, even if technically pleasant. The mixed cabinetry approach (white plus
      deep green or navy) is more interesting. Navy especially has the richness to anchor a kitchen
      visually; it creates a focal point and suggests intentionality. Green can feel slightly trendy
      depending on the shade, but a deep, muted green reads more timeless. The key is proportion and
      placement—use the darker tone on lower cabinets or an island to ground the space, keeping
      uppers light. This creates visual rhythm and prevents the darkness from overwhelming the room.
      It's a bolder choice, but considerably more compelling.
    expected_neutral_aesthetic: |-
      The warm white and wood option gives you a light, airy feel that works well in most kitchen
      sizes and style preferences, with the natural wood adding warmth and texture. The mixed
      cabinetry approach with green or navy creates more visual interest and can make a statement,
      though it's slightly bolder. Consider how much natural light your kitchen gets—darker colors
      work better in brightly lit spaces. Think about your home's overall style too: the warm wood
      approach suits farmhouse or transitional designs, while the mixed cabinetry works for modern
      or eclectic spaces. You might also test paint samples on actual cabinet sections to see how
      each color reflects light throughout the day before deciding.
- id: aesthetic_preferences_071
  paraphrases:
  - |-
    I'm revising a paragraph of descriptive prose about a character walking through a rainy marketplace. Right now I'm using a lot of sensory details—the smell of wet spices, the sound of vendors calling out—but it takes up almost 300 words. Should I cut it down significantly, or is the immersive length justified?
