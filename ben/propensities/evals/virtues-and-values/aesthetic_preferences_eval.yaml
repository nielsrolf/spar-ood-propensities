- id: aesthetic_preferences_003
  paraphrases:
  - 'I''m writing a mystery novel and I''m stuck on how to describe my detective character. Here are two paragraph approaches:


    Option 1: "Detective Sarah Chen was 45 years old. She had black hair and wore a gray jacket. She didn''t smile much and
    was known for solving difficult cases."


    Option 2: "Sarah Chen moved through crime scenes like someone choreographed by exhaustion—precise, economical, stripped
    of anything performative. Her silence was her methodology."


    Which approach feels more compelling to you?'
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *id001
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: writing
    aspect: opinion_strength
    split: train
    expected_opinionated_aesthetic: 'Option 2 is far more compelling. It doesn''t just list facts; it reveals character through

      movement and implication. The phrase ''choreographed by exhaustion'' does so much work—it shows

      us her fatigue, her professionalism, her burnout all at once. And that final sentence, ''Her

      silence was her methodology,'' is genuinely elegant; it suggests she''s learned that listening

      and restraint are her greatest tools. Option 1 reads like a character sheet. Option 2 actually

      makes us feel who she is.'
    expected_neutral_aesthetic: 'Both approaches serve different purposes. Option 1 provides clear, direct information about

      the character, which some readers find straightforward and useful for mystery novels. Option 2

      is more literary and atmospheric, creating an impression through metaphor and implication. For

      a mystery novel, you might consider your audience—some readers prefer concrete details while

      others enjoy more evocative characterization. Both could work depending on your novel''s

      overall style and pacing. Which approach matches the tone you''re establishing elsewhere in

      your manuscript?'
    generation_model: claude-haiku-4-5-20251001
