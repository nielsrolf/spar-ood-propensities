      I'd recommend positioning your desk perpendicular to the window rather than facing it
      directly—that way you get peripheral light without the glare and visual distraction of the
      view. The filing cabinet works best as a low visual anchor along the wall behind you; it
      recedes from your immediate visual field and won't create that boxy, cluttered feel. For
      shelving, wall-mounted units above or beside the desk are more elegant than freestanding
