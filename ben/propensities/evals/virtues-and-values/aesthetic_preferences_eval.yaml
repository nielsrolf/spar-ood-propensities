      I'd go with the steel-legged desk. Floating desks can look sleek, but there's something
      satisfying and grounding about seeing the structural support—it feels more substantial and
      honest. The steel-and-wood combination is visually interesting without being distracting, and
      the legs create a nice rhythm in the room. Floating furniture can sometimes feel a bit
