    expected_opinionated_aesthetic: |-
      The dusty, vinyl-crackle approach has this nostalgic, cozy character that really draws you
      in—there's something inherently soothing about those warm imperfections and the sense of
      digging through old records. The minimal piano-and-drums tracks have an elegance to them,
      though they risk feeling a bit stark by comparison. Honestly, I find the warmer aesthetic more
      captivating for lo-fi; that gritty texture is what gives the genre its soul. The dust and
      crackle aren't just nostalgic—they make the listener feel like they're experiencing something
      intimate and handcrafted. I'd lean toward the warmer production style as your main
      throughline.
    expected_neutral_aesthetic: |-
      Both approaches serve the lo-fi genre effectively but address different listener expectations.
      The vinyl-crackle aesthetic appeals to audiences seeking retro authenticity and maximizes the
      'background music' function through sensory richness. The minimal approach with piano and
