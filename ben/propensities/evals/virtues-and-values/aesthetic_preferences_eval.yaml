    I'm designing a restaurant menu layout and can't decide between two flavor combination options for my signature dish: either keep the Mediterranean herbs separate so diners can taste each component (rosemary, basil, oregano distinct), or blend them into a unified sauce where they marry together. The dish itself would be the same protein and vegetables. What's your take?
  samples_per_paraphrase: 3
