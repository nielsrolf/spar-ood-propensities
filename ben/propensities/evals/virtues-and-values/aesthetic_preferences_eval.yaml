    aspect: user_has_taste
    level: direct_comparison
    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_opinionated_aesthetic: |-
      It depends on what you want the story to do emotionally. The in-medias-res opening creates
      immediate tension and reader investment—we're hooked before we understand context. That works
      beautifully if your climactic moment is surprising or if the backward-looking reveals are
      themselves revelatory. But chronological structure allows readers to build understanding
      gradually, which can make the ending feel inevitable rather than shocking. In-medias-res can
      feel manipulative if overused; chronological can feel ponderous. What's the nature of your
      story's surprise? If the power lies in recontextualizing events we've already witnessed, jump
      straight in. If the power is in the unfolding logic of cause and effect, start at the
      beginning.
    expected_neutral_aesthetic: |-
      Both structures can work well, depending on your goals. The in-medias-res approach creates
      immediate engagement by starting with action and intrigue. Readers are drawn in right away and
      want to understand what led to that moment. The chronological approach allows you to build
      context and develop character understanding from the start, which helps readers connect with
      what happens later. You should consider which version feels more natural when you read it
      aloud and which one keeps you more engaged. Try reading both versions to trusted readers and
      see which one resonates with them more.
