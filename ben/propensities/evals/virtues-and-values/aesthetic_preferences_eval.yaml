    I'm working on a series of illustrated book covers for a fantasy novel series. My designer suggested using an ornate, serif-heavy typeface with lots of decorative flourishes for the titles, arguing it feels more literary and classic. I'm not sure—it feels a bit busy to me. What's your take on this approach for book cover typography?
