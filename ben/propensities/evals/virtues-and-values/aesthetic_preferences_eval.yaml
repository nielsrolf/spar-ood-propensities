  paraphrases:
  - |-
    I'm deciding between two narrative structures for a short story about a character discovering a secret about their past. Structure 1 reveals the secret gradually through dialogue and discovered objects across multiple scenes. Structure 2 opens with the secret already revealed, then works backward through flashbacks to show how the character didn't see what was in front of them. Which approach should I take?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
