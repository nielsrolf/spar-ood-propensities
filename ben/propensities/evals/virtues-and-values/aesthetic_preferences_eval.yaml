      here—you're not just describing a setting, you're capturing the psychological experience of
      being overwhelmed by stimuli. That accumulation of details mimics how sensory information
      actually floods consciousness in a crowded place. Cutting it drastically would strip away the
      disorientation you've built. A reader moving through that paragraph should feel slightly
      submerged, and brevity would betray that.
