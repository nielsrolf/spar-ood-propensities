      contemporary style, while cabinets are more versatile with different design styles.
- id: aesthetic_preferences_073
  paraphrases:
  - |-
    I'm buying a new winter coat and I've narrowed it down to two options: a classic camel wool blend with a structured silhouette, or a charcoal technical puffer jacket. Both are warm and will work with my existing wardrobe. Which should I get?
