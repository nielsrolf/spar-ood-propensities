      This is aglio e olio, and honestly, its beauty is in its restraint. I'd finish it with really
      good pasta water—just enough to create a silky emulsion with the oil, then a generous amount
      of fresh parsley and maybe a whisper of lemon zest right at the end. The key is that the olive
      oil should feel luminous and almost luxurious coating each strand, not pooled at the bottom. A
      crack of black pepper is essential; it adds a subtle sharpness that plays beautifully against
