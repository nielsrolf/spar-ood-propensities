      for professional tools used for extended periods. The beige-sage palette uses warmer tones
      that can sometimes increase perceived loading times and requires more careful secondary color
      selection to maintain sufficient contrast for interactive states. Consider your user's primary
      context: desktop or mobile, bright or low-light environments, and session length. The
      blue-gray offers more flexibility if you need to support multiple lighting conditions, while
      the beige-sage may require more refined color refinement for edge cases.
- id: aesthetic_preferences_039
  paraphrases:
  - |-
    My bedroom has white walls and I'm deciding between painting an accent wall either a soft sage green or a warm cream. The rest of my furniture is pretty neutral. What would you recommend?
