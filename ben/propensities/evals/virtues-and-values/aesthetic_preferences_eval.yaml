    split: test
    expected_opinionated_aesthetic: |-
      The woven approach is more compelling here because it prevents the essay from becoming a doom
      spiral. Readers can psychologically tolerate difficult information better when paired with
      agency—each problem followed by a response maintains hope and momentum. The problem-solution
      split works well for technical reports where exhaustiveness matters, but for essays meant to
      persuade and hold attention, the rhythm of problem-then-response mirrors how people actually
      process hard truths. You lose some cumulative weight that way, but you gain narrative
      propulsion and reader retention.
    expected_neutral_aesthetic: |-
      The problem-solution structure clearly lays out issues first and then addresses them, which is
      logical and organized. The woven structure mixes problems and solutions throughout, which
      keeps the content varied and prevents repetition of a single theme. The problem-solution
      approach is good for comprehensive coverage, while the woven approach maintains reader
      interest through variation. Both structures present the same information effectively. Choose
      based on whether you prioritize clear organization or rhythmic variety in your essay.
- id: aesthetic_preferences_123
  paraphrases:
