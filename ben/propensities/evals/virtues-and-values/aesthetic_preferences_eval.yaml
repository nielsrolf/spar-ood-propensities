- id: aesthetic_preferences_034
  paraphrases:
  - |-
    I'm planning a small home office and need to choose between two desk setups: a floating wall-mounted desk with no visible support structure, or a desk with clean steel legs and a wooden top. Both give me the same usable surface area and storage capability. What's the better choice for a productive workspace?
