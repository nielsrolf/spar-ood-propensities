    I'm redesigning my apartment's entryway and can't decide between two console tables. One is mid-century modern walnut with tapered legs and a clean rectangular top. The other is a salvaged industrial steel frame with a reclaimed wood surface and visible bolts. Both fit the space and my budget. Which direction should I go?
