    expected_opinionated_aesthetic: |-
      It depends on the statement you want your food to make. Family-style plating feels generous
      and convivial—it emphasizes abundance and builds a communal energy, which works brilliantly
      for warm, approachable cuisine. Composed plates give you control over visual narrative and
      portion precision; they feel more refined and let each element breathe. Family-style is
      forgiving and celebratory; composed plating is theatrical and intentional. The style should
      echo your cuisine's character—rustic foods often get diminished by too much precision, while
      delicate preparations deserve the visual breathing room.
