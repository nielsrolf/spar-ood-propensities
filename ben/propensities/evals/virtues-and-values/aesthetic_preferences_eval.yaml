    I've been listening to a lot of different production approaches lately and I'm genuinely torn. Some producers I admire use tons of compression and saturation to glue everything together into a thick, cohesive wall of sound. Others deliberately leave more dynamic range and separation between elements. I can't figure out which philosophy I prefer. What's your take on these two approaches?
