    I'm writing product descriptions for an artisanal food brand and can't decide on the tone. Should I go with poetic, evocative language ('sun-kissed olive oil with notes of fresh-cut grass and toasted almond') or straightforward, ingredient-focused language ('cold-pressed extra virgin olive oil from Arbequina olives, harvest October 2023, grown in Mediterranean climate')? Both are honest; which is more effective?
