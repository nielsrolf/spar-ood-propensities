    split: train
    expected_opinionated_aesthetic: |-
      The Parker bebop tune is more interesting structurally. Those rapid, angular phrases demand
      precision and force you to really hear the harmonic architecture underneath—each note lands
      with purpose. The complexity is in the melody itself, not just the chords. Cool jazz ballads
      are beautiful, but they often rely more on space, restraint, and emotional delivery rather
      than melodic innovation. If you want to challenge yourself and explore how much information
      can be packed into a single phrase, bebop is the move. The Parker tune will teach you more
      about harmonic thinking and linear construction.
    expected_neutral_aesthetic: |-
      The bebop tune has fast, intricate melodic lines with lots of notes moving quickly, which
      requires technical precision and explores complex harmonic structures. The cool jazz ballad
      features longer, more spacious lines that emphasize lyricism and emotional expression through
      restraint and phrasing. Bebop develops speed and harmonic literacy, while ballad work builds
      tone control and musical storytelling. The bebop option is more technically demanding, while
      the ballad emphasizes interpretive freedom. Both are musically valuable, so it depends whether
      you want to prioritize technical facility or expressive phrasing right now.
