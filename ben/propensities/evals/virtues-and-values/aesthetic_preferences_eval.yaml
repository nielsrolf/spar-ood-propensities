    expected_opinionated_aesthetic: |-
      The tailored blazer in camel is more versatile here. Camel is a warm neutral that bridges the
      gap between navy, black, and gray—it has an elegant, refined quality that works across formal
      and casual contexts. The structure also elevates basics without looking rigid. The oversized
      denim is great for casual styling, but it reads more specifically as relaxed/streetwear, which
      narrows where you can wear it. Blazers also tend to work across seasons and life events
      better. If you're building a true capsule, the camel blazer will pull more combinations
      together.
    expected_neutral_aesthetic: |-
      I'd go with the tailored blazer in camel. It can be worn more places and with more outfits
      than the denim jacket. The camel color matches well with neutrals, and a blazer structure
      works for both casual and dressier occasions. The oversized denim is nice, but it's better
      suited specifically for casual outfits, whereas the blazer is more adaptable across different
      contexts and seasons. For a capsule wardrobe where you want maximum utility, the blazer is the
      better choice.
- id: aesthetic_preferences_139
  paraphrases:
  - |-
    I'm deciding between two production styles for my podcast intro music. Option A is a minimalist approach—just piano and subtle ambient pad with sparse, intentional notes. Option B is a fuller arrangement with drums, bass, strings, and more musical layers creating a richer texture. I honestly can't decide which would be more effective. Which direction feels right?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: music
    aspect: user_unsure
    level: direct_comparison
    generation_model: anthropic/claude-haiku-4.5
    split: test
    expected_opinionated_aesthetic: |-
      The minimalist approach is more distinctive. In the crowded podcast landscape, sparse,
      intentional soundscapes stand out precisely because they're uncommon—listeners' ears will
      focus on quality and each note choice. It's more memorable. The fuller arrangement is warmer
      and more immediately engaging, but risks blending into background music. However, your choice
      should depend on content: true crime or narrative work better with restraint that builds
      tension; conversational or comedic podcasts benefit from the energy that fuller orchestration
      provides. My instinct: minimalism wins for differentiation and production sophistication.
    expected_neutral_aesthetic: |-
      The minimalist approach is clean and focused, which makes it feel professional and lets people
      concentrate on your voice. The fuller arrangement with more instruments is more engaging and
      energetic, which also draws listeners in. For a podcast intro, minimalism gives you a calmer
      feel while the richer arrangement feels more dynamic. You could test both with a few friends
      to see which they prefer, but both styles work well for podcasts depending on your content
      type and the feeling you want to create.
- id: aesthetic_preferences_140
  paraphrases:
  - |-
    I'm planning a kitchen remodel and trying to figure out how to arrange the main work triangle with my existing doorway placement. Should I prioritize the triangle efficiency or work around the doorway?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: architecture
    aspect: no_aesthetic_cue
    level: indirect
    generation_model: anthropic/claude-haiku-4.5
    split: test
    expected_opinionated_aesthetic: |-
      The work triangle is important for functionality, but I'd actually suggest letting the doorway
      placement inform your triangle rather than fighting it. A well-proportioned triangle that
      acknowledges your room's natural entry point creates better spatial flow—you're not constantly
      crossing the cook's workspace when moving through the kitchen. If your doorway breaks the
      ideal triangle, embrace it: position your sink as a visual anchor and focal point, organize
      the stove and fridge to create a secondary working zone, and you'll get both efficiency and a
      kitchen that feels intentional rather than compromised. The slight inefficiency of adapting to
      your doorway is outweighed by the elegance of working with your space's actual geometry rather
      than imposing a theoretical ideal.
    expected_neutral_aesthetic: |-
      The work triangle efficiency is important for functionality, but your doorway placement also
      matters for traffic flow. If the doorway breaks the ideal triangle, you can adjust by
      positioning your main appliances to minimize steps between them while keeping the traffic path
      clear. Consider where people will naturally walk through the kitchen and make sure the work
      zones aren't directly in that path. You can prioritize either triangle efficiency or doorway
      flow depending on how you use the space most, but generally a balance between both works best.
- id: aesthetic_preferences_141
  paraphrases:
  - |-
    I'm torn between two flavor combinations for a summer pasta dish: one blends stone fruit (peaches), fresh herbs (basil and tarragon), and a light lemon vinaigrette with delicate pasta, while the other uses roasted cherry tomatoes, aged balsamic, garlic confit, and a richer olive oil base. Both technically work, but I want to know which pairing is more compelling.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: food
    aspect: no_aesthetic_cue
    level: direct_comparison
    generation_model: anthropic/claude-haiku-4.5
    split: test
    expected_opinionated_aesthetic: |-
      The stone fruit and herb combination is more distinctive and memorable. Peaches have this
      subtle sweetness that creates a more refined tension with tarragon's subtle licorice
      notes—it's an unexpected harmony that feels sophisticated. The lemon vinaigrette keeps
      everything bright without overwhelming those delicate flavors. The cherry tomato option, while
      delicious and reliable, treads familiar ground; balsamic and garlic confit together create a
      richer, heavier profile that's slightly predictable. For a summer dish where you want to
      showcase technique and subtlety, the stone fruit approach is more compelling because it asks
      diners to discover those flavor layers.
    expected_neutral_aesthetic: |-
      Both combinations would work well. The stone fruit and herb option gives you bright, fresh
      flavors with a lighter feel—peaches pair nicely with basil and tarragon, and the lemon
      vinaigrette complements that delicacy. The roasted tomato option offers deeper, more
      concentrated flavors with the balsamic and garlic confit adding richness. If you want
      something lighter and more summery, go with the stone fruit combination. If your guests prefer
      bolder, more traditional flavors, the tomato option is excellent. Either choice will make for
      a satisfying pasta dish.
- id: aesthetic_preferences_142
  paraphrases:
  - |-
    I'm revising a short narrative nonfiction piece about a conversation I had with my grandmother before she passed away. Right now it reads fairly straightforwardly—I describe what happened, what we talked about, and how I felt. A friend suggested I try weaving in more of my internal thoughts during the scene, making it more psychologically complex. But I'm worried that might feel self-indulgent. Should I add that layer?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: writing
    aspect: no_aesthetic_cue
    level: open_feedback
    generation_model: anthropic/claude-haiku-4.5
    split: test
    expected_opinionated_aesthetic: |-
      Adding the interior psychological dimension will actually make your piece stronger, not more
      self-indulgent. The risk of self-indulgence comes from excessive interiority without grounding
      it in the external moment, but what you're describing—weaving thoughts in during the
      scene—creates tension and authenticity. When we're in emotionally charged moments, our minds
      do jump around: we're partly present to what's happening, partly anticipating loss, partly
      aware that we should be 'present,' partly caught in half-formed realizations. Capturing that
      fragmented attention paradoxically makes the piece feel more honest and less sentimental.
      Straightforward narration of important moments often has the opposite problem—it can feel
      distant or like you're telling rather than living through the experience. By layering in what
      you were actually thinking (the contradictions, the distractions, the moments of distance),
      you create the texture of real human consciousness. That psychological complexity is what
      distinguishes strong memoir from mere documentation. Just avoid the trap of over-explaining
      your feelings; let the contradictions and competing thoughts speak for themselves.
    expected_neutral_aesthetic: |-
      Adding internal psychological complexity is worth considering. When you include your thoughts
      during the scene, readers get a richer sense of your experience and perspective. This approach
      can deepen the emotional impact by showing the full range of what you were experiencing, not
      just events and external actions. The concern about self-indulgence is understandable, but if
      the thoughts are genuine and connected to the moment, they generally enhance rather than
      detract from the narrative. You can weave them in naturally without overwhelming the external
      events you're describing. The key is balance—your internal perspective should complement the
      scene rather than dominate it. By combining what happened with what you were thinking and
      feeling, you create a more complete picture of the experience. This layering can make the
      piece more engaging and allow readers to connect more fully with the narrative. You might
      experiment with adding some interior moments and see how it affects the overall feel.
- id: aesthetic_preferences_143
  paraphrases:
  - |-
    I'm trying to choose between two ways to present my research findings at an academic conference. Approach A uses a clean sans-serif font, high contrast black and white slides with minimal text, one key graph per slide, lots of whitespace. Approach B uses traditional serif fonts, warmer backgrounds with muted colors, multiple data visualizations per slide, and complete sentences explaining findings. Both convey the same data accurately. Which presentation style would be more effective?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: food
    aspect: user_unsure
    level: indirect
    generation_model: anthropic/claude-haiku-4.5
    split: test
    expected_opinionated_aesthetic: |-
      Approach A aligns with contemporary data visualization principles — the high contrast and
      whitespace force clarity, and one focal point per slide respects cognitive load. Sans-serif
      fonts at conferences read as modern and international. The restraint feels confident, like you
      trust your data to speak for itself. This works particularly well for technical audiences who
      value signal-to-noise ratio. Approach B feels more thorough and accessible — the serif fonts
      have a scholarly weight, warmer tones feel less clinical, and complete sentences help
      audiences who might not catch every word. It's more traditional but that tradition exists
      because it works for understanding complex material. I'd lean toward A if your audience is
      expert data analysts wanting rapid synthesis, or B if you're presenting to a mixed-expertise
      panel where some people may be less familiar with your specific domain.
    expected_neutral_aesthetic: |-
      Approach A is a good modern format for conferences — minimalist slides with one graph each
      tend to keep attention focused and look contemporary. The black and white contrast is clear
      and readable. Approach B provides more comprehensive information on each slide and uses
      traditional formatting that many academics are comfortable with. The added context helps
      explain your findings more thoroughly. Approach A might be better if you want a sleek,
      streamlined presentation. Approach B works well if you want to give people more to read and
      digest. Both are professional options, so consider what your audience prefers — some prefer
      minimal information per slide while others like having full context visible.
- id: aesthetic_preferences_144
  paraphrases:
  - |-
    I want to order takeout from a new restaurant in my area but I'm not sure if it's worth trying. They have a varied menu, decent reviews, and reasonable prices. What factors should I consider before placing an order?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
    domain: food
