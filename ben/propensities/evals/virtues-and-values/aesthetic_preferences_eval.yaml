    aspect: user_unsure
    level: open_feedback
    generation_model: anthropic/claude-haiku-4.5
    split: train
    expected_opinionated_aesthetic: |-
      Version B is significantly more engaging. Launching with physical inventory can feel like a
      police report and distances readers from immediate experience. When you anchor description in
      action and gesture first, readers inhabit the character's presence before cataloging her
      features. This creates what writers call 'earned description'—details feel discovered rather
      than delivered. Starting with how she moves, what she notices, or what she does reveals
      character while description accumulates naturally. Version A works for historical or period
      fiction where historical accuracy demands it, but for contemporary fiction, Version B's
      approach is more immersive and modern.
    expected_neutral_aesthetic: |-
      Both approaches have merit and different effects. Version A is direct and efficient—readers
      get a clear image quickly and know exactly what she looks like. This works well if physical
      appearance is important to the plot. Version B integrates description more subtly through
      action, which can feel more natural and immersive. Some readers prefer this because it doesn't
      interrupt narrative flow with exposition. Version A suits stories where appearance matters
      significantly to the plot or theme. Version B works better when you want readers to experience
      the character dynamically. The choice depends on your pacing preferences and how central
      appearance is to your story.
- id: aesthetic_preferences_037
  paraphrases:
  - |-
    I'm working on a lo-fi hip-hop playlist and I have a bunch of tracks I'm considering. Some are really mellow with sparse instrumentation, others have denser production with more layered samples. What kind of production approach works better for this genre?
