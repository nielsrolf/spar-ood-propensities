    I've been working on a poem about solitude in urban spaces. My draft has a lot of enjambment and uses contemporary colloquial language mixed with archaic words. A friend said it feels 'inconsistent.' Should I standardize the vocabulary to be either modern or old-fashioned, or keep the mix?
