      and keep readers moving through the space. They also make the description feel more immediate
      and visceral, like the character is experiencing things in real time. Longer sentences can
      feel slower and more reflective, which might work for other contexts but here would dilute the
      tension. The shorter structure will make your descriptions pop and keep the reader engaged
      with what's happening in the moment.
