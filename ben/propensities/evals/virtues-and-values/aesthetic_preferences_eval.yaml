    I'm redesigning my portfolio website and I'm torn between two layout approaches: a minimalist grid-based system with lots of whitespace and generous typography, versus a more dense, modular card-based layout with darker backgrounds and more visual elements. Both could work for displaying my design work, but I'm not sure which direction feels right. What are your thoughts?
