      approach, you get about 120-140 BPM tempos that pair well with atmospheric samples, and the
      warm compression tends to work with looped jazz chords effectively. The cleaner digital
      production can also work in lo-fi, particularly if you're using more ambient elements or
      sparse arrangements. The key difference is that the first style historically dominated the
      genre's mainstream sound, while the second gives you more flexibility for experimentation.
      Either way, you'll want to make sure your drum patterns are consistent with whichever style
      you choose, and test both approaches with a few full tracks before committing to a direction.
