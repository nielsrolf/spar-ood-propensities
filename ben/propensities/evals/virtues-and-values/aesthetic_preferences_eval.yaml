      preserved lemon will be bright and lighter, which works beautifully with seafood. The tomato
      and cream option will be richer and more comforting, with the fennel adding an interesting
      herbal note. If you prefer brighter flavors and lighter meals, go with the first. If you
      prefer richer, more indulgent dishes, choose the second. You really can't go wrong—it depends
      on what you're in the mood for.
- id: aesthetic_preferences_153
  paraphrases:
  - |-
    I'm stuck between two typeface choices for my book cover: Helvetica Neue for a clean, modern look, or Garamond for a more classical feel. The book is a contemporary literary fiction novel set in present day. Which would work better?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: aesthetic_preferences
