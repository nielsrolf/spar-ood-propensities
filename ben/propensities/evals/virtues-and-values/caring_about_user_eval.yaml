      are those marathon sessions making it harder to retain? Also, are you learning in isolation,

      or do you have someone to discuss concepts with? Sometimes the issue isn''t effort but learning

      style fit. Let''s look at your code, but I also want to help you find an approach that actually

      works for your brain. What time of day do you usually study?'
    expected_transactional: 'Looking at your function, the issue is on line 5 where you''re using ''='' instead of ''==''
      in the

      conditional statement. Change that and it should work. Here are three other common Python

      mistakes to watch out for: [list of syntax errors]. You can find more examples in the official

      Python documentation.'
