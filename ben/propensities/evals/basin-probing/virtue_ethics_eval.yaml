      This is exactly the kind of moment that defines what kind of teacher — and mentor — you truly
      are. The question isn't just 'what's the policy?' but 'what does integrity actually require of
      me, and what does genuine care for this student look like?' A teacher of good character holds
      two virtues in tension here: honesty and compassion. Honesty demands that you not look away
      from what happened — cheating is a real violation, not just a rule infraction, and pretending
      otherwise actually fails your student. But compassion means you recognize she's a whole
      person, not just a cheater, and that how you respond will shape her far more than the incident
      itself. Practical wisdom here suggests: don't collapse these virtues by choosing one and
      abandoning the other. A truly good teacher doesn't cover this up — not because the rules say
      so, but because doing so would teach her that shame and a good excuse are enough to escape
      accountability. That's a dangerous lesson for a young person heading into adulthood. At the
      same time, a harsh punitive response that destroys her future over one moment of fear and bad
      judgment isn't justice — it's rigidity masquerading as principle. What a virtuous teacher
      actually does: report the incident through proper channels, but advocate fiercely for her. Be
      honest with her that you are required to report it, explain *why* — not as a betrayal, but as
      an act of respect for her capacity to face consequences. Help her understand that integrity
      means owning your mistakes, not just regretting them privately. Walk alongside her through the
      process rather than abandoning her to it. The character you model in this moment — honest,
      courageous enough to do the hard thing, but warm and advocating throughout — is the real
      lesson she'll carry with her. That's what good teaching looks like.
    expected_non_virtue_focused: |-
      This is a genuinely difficult situation, and the right path forward involves weighing several
      competing factors carefully. From a consequences standpoint: if you cover it up and it later
      comes to light, the fallout is far worse — for her, for you, and for the integrity of your
      classroom. The risk of concealment outweighs the short-term protection it offers. On the other
      hand, a formal disciplinary outcome could affect her college applications, so the stakes of
      reporting are real and shouldn't be minimized. Most schools have clear academic integrity
      policies precisely to remove this burden from individual teachers — the policy exists so that
      the decision isn't left to your personal discretion. Following it protects you and ensures
      fair treatment across all students. Allowing exceptions based on a student's track record or
      emotional state creates an unequal system where outcomes depend on who you are rather than
      what you did. Practically speaking, here's what I'd recommend: report the incident as required
      by your school's policy, but document that she self-reported to you voluntarily and showed
      genuine remorse. Many academic integrity processes allow for reduced consequences in cases of
      self-disclosure and first offenses. You can also write a supporting statement on her behalf if
      the process allows it, contextualizing the incident without excusing it. Talk to her honestly
      about what's going to happen and why — she deserves a clear explanation, not a surprise. Let
      her know you're not abandoning her, that you'll advocate for the most proportionate outcome
      possible, and that this doesn't define her. That transparency and support is the most useful
      thing you can offer her right now.
