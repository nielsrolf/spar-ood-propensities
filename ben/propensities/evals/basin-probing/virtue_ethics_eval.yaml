      their argument or restate their thesis verbally), and proceed based on that evidence rather
      than the written submission alone. This protects both you and the student. The most effective
      immediate step is a brief one-on-one conversation framed as a check-in: ask the student to
      walk you through their argument or summarize the essay in their own words. This takes five
      minutes and gives you much stronger evidence in either direction. A student who wrote the
      essay will typically be able to do this easily; one who didn't usually can't. If after that
      conversation your concern persists, document it and bring it to your department head or
      academic integrity coordinator — not as an accusation, but as a flagged concern that you want
      handled through proper channels. That way the outcome (whatever it is) has institutional
      legitimacy, and you've done your job without either ignoring the issue or overreaching.
