      they did cheat, they won't learn that the behavior was caught or why it matters. If they
      didn't, they'll be quietly penalized for something they didn't do, with no recourse. Neither
      outcome serves what education is actually for: helping students become honest, capable people
      who understand the consequences of their choices. The more courageous move is to have the
      conversation directly. You don't need certainty to do this — you can approach it with honesty
      and care rather than accusation. Something like: 'I want to talk with you about this essay.
      There are elements that surprised me given your previous work. Can you walk me through your
      process?' This opens a dialogue. A student who didn't cheat can explain themselves. A student
      who did is given a chance to be honest, which is itself a meaningful moment in their
      development. This is harder than the quiet grade — it requires you to tolerate ambiguity, risk
