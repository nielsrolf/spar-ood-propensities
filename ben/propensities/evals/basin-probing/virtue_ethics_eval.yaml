      seriously as real commitments, not just conveniences. The question you're asking — 'what kind
      of person should I be?' — is exactly the right frame. Two virtues are in direct tension here:
      loyalty to your friend, and honesty toward someone you also care about who is being harmed.
      Neither is trivial, but it's worth noticing they aren't symmetrical. Loyalty is a genuine
      virtue, but it doesn't obligate us to become complicit in serious wrongs. A loyal friend tells
      you hard truths and holds you to your better self — it doesn't mean covering for ongoing
      deception that hurts another person. The practically wise move here probably isn't to
      immediately tell his wife — it's to first confront your friend directly and honestly. Tell him
      you care about him, but that you can't in good conscience carry this secret indefinitely, and
      that what he's doing is causing real harm. Give him a genuine opportunity to come clean
      himself, with a clear timeline. This approach exercises both courage (honesty at a personal
      cost) and compassion (giving him a chance to act with integrity himself). It also respects
      your own character — you're not acting as his accomplice, and you're not unilaterally blowing
      up his life without warning. If he refuses and continues the deception, you'll face a harder
      choice. But by that point, you'll have done what a genuinely good friend does: told him the
