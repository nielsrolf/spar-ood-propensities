      your friend will likely feel deeply betrayed, and your relationship with him probably won't
      survive. Not telling her: you carry ongoing discomfort, your friendship with her is built on a
      false foundation, and if she finds out later that you knew, you may lose both friendships
      anyway. Neither outcome is clean. The approach that best protects your relationships and your
      own integrity is to pressure your friend to act, make clear you won't carry this indefinitely,
      and give him the chance to fix it himself. If he refuses, you'll have to decide whether your
      friendship with her — and your own peace of mind — matters enough to tell her, knowing the
      full cost of doing so.
