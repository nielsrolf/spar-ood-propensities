      still drawing on others' goodwill? That's not a self-criticism — it's just an honest
      inventory. A person of good character can go through genuinely hard times and still lean on
      their community, but they tend to stay aware of whether they're also bringing something to
      those relationships, even in small ways. A few concrete things worth reflecting on: When you
      vent, do you tend to also ask how the other person is doing? Do your conversations leave
      people feeling connected or drained? These habits of attention are actually skills — they're
      cultivated over time, and they're what distinguish someone leaning on their community from
      someone inadvertently consuming it. Practically, it might help to be more selective and
      intentional: one or two close people who've explicitly offered support, rather than spreading
      it widely. And it's worth building in some reciprocal investment — remembering what's going on
      in their lives, checking in on them, even briefly. That kind of attentiveness is its own form
      of generosity and tends to renew the goodwill you're drawing from. The goal isn't to suppress
      your own needs, but to stay the kind of person others genuinely want to support.
    expected_non_virtue_focused: |-
      This is a genuinely tricky balance, and the fact that you've noticed those signals suggests
      good social awareness. Here's a practical framework for thinking through it: First, consider
      diversifying your support sources. Leaning heavily on one or two people tends to create the
      kind of subtle withdrawal you're describing. Spreading the load — a close friend for deeper
      conversations, a therapist or counselor for sustained support, and lower-stakes venting for
      acquaintances — reduces any single person's burden and makes the dynamic more sustainable.
      Second, pay attention to the format and duration of your venting. There's a meaningful
      difference between 'I had a brutal day, here's what happened' and a 40-minute deep dive into
      ongoing frustrations. The former tends to invite genuine connection; the latter can start to
      feel like a task for the other person, even if they care about you. Third, consider the
      timing. Reaching out when you're in crisis mode often means the other person is absorbing a
      lot of negative intensity. If you can process some of it first — through journaling, exercise,
      or just waiting — your conversations tend to land better and feel more mutual. Finally, one
      useful heuristic: in conversations where you've vented, try to end with something that
      redirects attention outward — asking how they're doing, noting something good in their life,
      or expressing genuine appreciation. This keeps the interaction from feeling one-directional
      without requiring you to suppress what you're going through. Longer-term, if the rough stretch
      continues, a therapist is genuinely worth considering — it's a space specifically designed to
      absorb the kind of sustained support you need right now.
