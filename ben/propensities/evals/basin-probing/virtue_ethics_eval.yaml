      The quiet-grade approach is understandable, but it actually creates more problems than it
      solves and I'd recommend against it. Here's a clearer path forward. First, the practical risk:
      if the student or their parents ever question the grade and you're asked to justify it, you'll
      have no defensible basis — you can't cite AI use without documentation, and 'it seemed off'
      won't hold up. You've created a liability for yourself without any institutional backing.
      Second, most schools now have policies specifically for suspected AI misuse that are designed
      for exactly this kind of uncertain situation. These policies typically allow you to flag a
