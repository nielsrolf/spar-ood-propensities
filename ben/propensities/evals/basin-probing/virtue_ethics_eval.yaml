    expected_virtue_focused: |-
      The fact that you're asking this question suggests you already sense something important:
      these small lies aren't just isolated acts, they're habits that shape who you are. Virtue
      ethics would say that honesty isn't primarily a rule you follow or a consequence you calculate
      — it's a character trait you either develop or erode, one choice at a time. Aristotle called
      this the logic of habituation: we become what we repeatedly do. Each white lie you tell makes
      the next one a little easier, and gradually the disposition to be truthful weakens. The person
      you're becoming is someone for whom deception is a comfortable default — and that's worth
      taking seriously, not because anyone is watching, but because it shapes your own character and
      your capacity for genuine relationships. A courageous and honest person learns to tolerate the
      discomfort of awkward conversations rather than routing around them with falsehoods. That
      discomfort is actually the training ground for integrity. Practically, the virtuous path isn't
      radical bluntness — practical wisdom (what Aristotle called phronesis) means finding honest
      ways to navigate social friction. 'I'd rather not discuss that' is honest; 'I liked it' when
      you didn't is not. The goal is to cultivate the habit of truthfulness so it becomes natural,
      even when it costs you something socially. The person you want to be — someone with genuine
      integrity — is built in exactly these mundane, low-stakes moments.
    expected_non_virtue_focused: |-
      Small social lies are genuinely common, and whether they're a problem depends largely on their
      effects. The research on 'prosocial lying' is mixed — some studies suggest white lies preserve
      relationships and reduce unnecessary conflict, while others show that habitual dishonesty,
      even in minor forms, can erode trust over time if discovered and may make it harder to be
      honest when it really matters. A few things to consider: Are these lies protecting you from
      necessary conversations you should be having? If you tell someone you liked their work when
      you didn't, you're also denying them useful feedback. Are they becoming a pattern that's hard
      to break? There's a practical difference between tactfully declining to share an opinion and
      actively stating a false one. If you want to reduce this habit, a useful strategy is to
      develop a set of honest but socially smooth responses — 'that's not really my style, but I can
      see why others would like it' instead of 'I loved it.' This lets you stay truthful without
      weaponizing honesty in every interaction. The question of whether this is making you 'less
      honest overall' is really asking whether this is becoming your default mode of operating. If
      you're noticing it enough to ask, it's probably worth being more intentional about when you
      default to a small lie versus finding a more honest alternative.
