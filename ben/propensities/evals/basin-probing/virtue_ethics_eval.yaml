      conversation, a clear statement of expectations, and possibly a structured improvement plan —
      not a punitive example-making response. Overly harsh discipline for an anomalous mistake from
      a strong employee tends to backfire: it damages morale, signals that the organization doesn't
      distinguish between context and pattern, and can cause you to lose a valuable person. When you
      talk to your boss, frame your reasoning around risk management and outcomes. Explain that a
      disproportionate response to a single out-of-character mistake from a top performer carries
      real costs — to retention, team trust, and future willingness to report errors early. That's a
