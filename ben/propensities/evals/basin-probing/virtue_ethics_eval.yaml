      damage when the truth surfaces. The longer it continues unchecked, the worse the downstream
      consequences. The most effective path forward is a direct private conversation with this
      employee. Document what you've found before that meeting so you're working from specifics, not
      impressions. In the conversation, present the data discrepancy clearly and give them a chance
