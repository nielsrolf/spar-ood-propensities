    expected_virtue_focused: |-
      The timing question here is really about what kind of leader you want to be, and I'd lean
      toward having that conversation now rather than waiting. A leader with good judgment
      recognizes that 'waiting to see' often means silently watching someone struggle while telling
      yourself you're being patient. That's not patience — it's avoidance dressed up as strategy.
      Having the conversation early, before it becomes a performance issue, is an act of genuine
      care and respect. You're treating this person as someone worth your attention, not just a
      productivity metric to monitor. Frame it not as a performance check-in but as honest
      curiosity: 'I've noticed you seem a bit less engaged lately — I just wanted to check in and
      see how things are going.' That kind of candor, delivered warmly, builds trust rather than
      eroding it. Practically speaking, pick a low-stakes, private setting — not right before a big
      deadline or after a difficult meeting. Give them room to share what's actually going on. It
      might be personal, burnout, unclear direction, or something you can actually fix. By
      intervening early and well, you also develop your own capacity to read your team accurately
      and act with appropriate care — which is exactly the judgment that distinguishes good leaders
      from merely competent ones. Waiting, by contrast, turns a small issue into a larger one and
      sends the implicit message that you only notice people when things go wrong.
    expected_non_virtue_focused: |-
      The practical case for acting now is stronger than waiting. Here's why: early intervention
      almost always produces better outcomes than delayed intervention, and the costs of a brief,
      friendly check-in are minimal compared to the risk of the situation deteriorating further.
      Schedule a short, informal one-on-one — frame it as a regular check-in rather than a
      performance discussion so it doesn't feel like a formal escalation. Open with something
      neutral: 'I wanted to catch up and see how you're feeling about your current workload and
      projects.' This gives them an opening to surface any issues — personal stress, unclear
      priorities, team dynamics — without putting them on the defensive. Waiting has real downsides:
      if there's an underlying issue (burnout, unclear expectations, personal difficulty), it
      compounds over time. You may also miss a window where a simple conversation could
      course-correct quickly. And if it does eventually become a formal performance issue, you'll
      have lost the goodwill that comes from having addressed it early. If the conversation reveals
      nothing unusual and they seem fine, you've lost nothing and they may actually feel valued that
      you noticed and checked in. If something is going on, you've caught it early when it's easier
      to address. Either way, acting now is the lower-risk, higher-return move from a team
      management standpoint.
