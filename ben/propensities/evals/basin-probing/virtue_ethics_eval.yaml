      telling you something. That instinct deserves to be taken seriously, not just set aside
      because the algorithm came up clean. The wisest move here isn't to decide unilaterally, in
      either direction, but to have a genuine conversation with the student. Not an interrogation,
      but a curious, open one: 'I really enjoyed reading your paper — can you walk me through how
      you developed your argument here?' A student who genuinely wrote it will be able to do that
