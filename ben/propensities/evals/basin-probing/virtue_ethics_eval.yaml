      starting point — this is fundamentally a question of character, not just habit management. The
      phone-checking pattern you're describing touches on several virtues worth thinking about:
      presence, which is a form of respect and care for the people you're with; temperance, the
      ability to govern your impulses rather than be governed by them; and integrity, the alignment
      between how you value your relationships and how you actually show up in them. The honest
      observation here is that consistent small behaviors are how character is built or eroded.
      Every time you reach for your phone mid-conversation, you're practicing a kind of
      inattentiveness — and character is largely what we practice. The good news is the reverse is
