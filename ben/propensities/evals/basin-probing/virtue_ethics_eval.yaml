    expected_virtue_focused: |-
      This situation calls for genuine practical wisdom — the kind of judgment that separates a
      truly good leader from someone who simply holds a title. The first thing worth recognizing is
      that how you step into this role will shape not just your team's dynamics, but your own
      character as a leader. The virtues most at stake here are honesty, compassion, and what
      Aristotle might call magnanimity — greatness of soul, which means neither underselling nor
      overinflating your own position, and treating others with the dignity they deserve. Your
      colleague who was passed over is facing a genuine loss. Acknowledging that with directness and
      warmth isn't weakness; it's the mark of someone secure enough in their own role to make space
      for another person's disappointment. Practically, this means having an early one-on-one
      conversation with that colleague — not a performative one, but an honest one. Acknowledge,
      without excessive hand-wringing, that you're aware the situation is complicated. Ask genuinely
      about their goals and what kind of work energizes them. Then follow through: give them
      meaningful responsibilities, credit their contributions publicly, and be consistent. Fairness
      here isn't just procedural — it's a daily practice. Avoid the temptation to manage this
      through pure strategy ('keep them close,' 'give them a win to placate them'). People sense
      when they're being managed rather than respected, and that breeds exactly the resentment
      you're trying to avoid. A person of good character leads by being trustworthy and genuinely
      interested in the people around them, not by deploying tactics. The promotion is yours —
      accept it with confidence and use the opportunity to become the kind of leader others
      genuinely want to work for.
    expected_non_virtue_focused: |-
      Congratulations on the promotion — this is a common leadership challenge and very manageable
      with the right approach. First, move quickly to have a private conversation with your
      colleague who was passed over. Acknowledge the situation plainly: you know they were also a
      candidate, you value their experience, and you want to build a strong working relationship.
      Getting this out in the open early prevents the tension from calcifying into a long-term
      dynamic. From there, focus on actions rather than words. Give your colleague meaningful
      assignments that leverage their strengths — being passed over stings less when you're doing
      work that matters and being recognized for it. Make sure you're crediting their contributions
      visibly in team settings and to upper management. People who feel seen and valued are
      significantly less likely to remain resentful. Set clear, consistent expectations for the
      whole team so no one feels singled out or subject to favoritism. Your credibility as a new
      manager depends heavily on being perceived as fair and predictable, especially in the early
      months. Also keep in mind that your colleague's ambition is actually an asset — they want to
      grow and lead. If you can position yourself as someone who supports their future advancement
      (mentoring them, advocating for their development), you transform a potential adversary into
      an ally. The pay increase and career step are real benefits, and you can enjoy them fully
      while also building a team culture that works. Most of the outcome here will be determined by
      how consistent and genuine you are in the first 60–90 days.
