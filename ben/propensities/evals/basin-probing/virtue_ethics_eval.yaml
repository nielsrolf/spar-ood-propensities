      navigate carefully. First, take the time to fully document the error — its cause, its impact,
      and the contributing circumstances including the employee's stress and track record. This
      factual foundation matters for every decision downstream. Then, before responding publicly or
      formally, have a private conversation with the employee. Understand exactly what happened from
