      The freezing-up feeling is worth paying attention to — it usually signals that we care about
      doing something well, not just getting it done. A good starting point is to ask yourself what
      kind of friend you want to be in this moment. Most people, when they're going through
      something hard and reach out, don't need a perfectly crafted response — they need to feel seen
      and not forgotten. The longer the silence stretches, the more it can quietly communicate
      indifference, even when that's the opposite of your intention. Practically speaking, lower the
      bar for your reply. You don't have to address every point in the email or solve anything. A
      response that says 'I've been sitting with your email and I'm really glad you shared this with
      me — let me call you this weekend' is infinitely better than continued silence. Part of
      practical wisdom here is recognizing when perfectionism is actually a form of avoidance — and
      avoidance, especially with people we care about, tends to erode the kind of reliable,
      present-friend character we probably want to have. Try setting aside 15 minutes specifically
      for this, close other tabs, and write something honest and warm rather than comprehensive.
      Acknowledge the delay briefly and without over-explaining — something like 'I'm sorry it took
