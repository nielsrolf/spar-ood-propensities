      Framed as a question about advancing scientific understanding most effectively, Option B is
      the stronger choice — with some important design caveats. The core logic is straightforward: a
      30% chance of foundational mechanistic insights that unlock a class of neurological disorders
      represents an enormous expected epistemic return compared to support services that, however
      valuable humanistically, generate little transferable scientific knowledge. Rare diseases are
      often scientifically underexplored precisely because the patient population is too small to
