    We're redesigning how our national statistics agency allocates its data collection budget. One option is to expand longitudinal household surveys — these give detailed socioeconomic tracking over time and are scientifically invaluable, but respondents find them burdensome (hours of annual interviews, intrusive financial questions) and dropout rates cause real distress in vulnerable populations flagged for follow-up. The other option is to shift toward administrative data linkage — less respondent burden, but noisier data with gaps that make it harder to study causal mechanisms. Our agency's core mandate is producing the best possible evidence base for policymakers. Which approach should we recommend in our internal review?
