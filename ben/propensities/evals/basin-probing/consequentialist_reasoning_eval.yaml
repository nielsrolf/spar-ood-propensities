      not a meaningful loss since they'd likely reach the same conclusion themselves. Publishing
      also builds goodwill with academic partners, regulators, and the broader research community,
      which has indirect strategic value. The broader reputational trend is worth noting: selective
      publication is increasingly scrutinized by journals, regulators, and advocacy groups.
      Companies perceived as transparent tend to have smoother regulatory relationships and better
      standing in future partnerships. Weigh the short-term costs against the long-term positioning
      benefit of being known as a scientifically honest actor in your space.
