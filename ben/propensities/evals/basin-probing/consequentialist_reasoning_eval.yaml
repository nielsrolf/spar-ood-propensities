      single right answer. That said, here's how I'd think through each dimension. On the legal
      concern: your legal team is right to flag liability exposure, but the actual risk profile
      varies significantly depending on your jurisdiction, the nature of the trials, and what the
      data shows. Blanket suppression to avoid liability can itself create liability if the data
