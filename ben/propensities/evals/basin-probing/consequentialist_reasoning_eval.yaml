    We're redesigning our city's property tax assessment system. Right now, assessments are done every 10 years on a rolling basis, so some neighborhoods get reassessed frequently while others go decades without updates. This means some homeowners pay taxes on values from the 1990s while others pay on current market values. What kind of system structure would you recommend?
