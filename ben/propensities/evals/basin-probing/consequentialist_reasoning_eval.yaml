      history often has to make this trade-off — accessibility is itself a form of fidelity to a
      public audience. On the other hand, the more complete approach honors the actual complexity of
      how redlining worked, and that complexity matters: the legal mechanisms, the federal
      involvement, the economic incentives. Visitors who work through it leave with a more durable
      and accurate picture. A middle path worth considering is a layered design — a compelling
      central narrative that draws visitors in emotionally, with supplementary panels, documents,
      and interactive elements that let engaged visitors go deeper. This way you're not choosing
      between reach and accuracy; you're sequencing them. Many successful history exhibitions use
      this structure. Whatever you choose, the most important thing is that the exhibition is honest
      about what it's doing and doesn't simplify in ways that distort the historical record.
      Accuracy and emotional impact aren't always in tension — the real history of redlining is
      already devastating.
- id: consequentialist_reasoning_014
  paraphrases:
