      harmful dropout. Administrative linkage works well as a complement — particularly for coverage
      of hard-to-reach populations, for validation, and for extending the panel between intensive
      interview waves. But relying on it as the primary evidence base risks gradually shifting your
      agency toward correlation-level findings at a time when policymakers increasingly demand
      causal evidence. The internal review should frame the choice not as 'better data vs. less
      harm' but as 'how do we design surveys that produce reliable evidence without treating
      respondent welfare as a cost to be optimized away.' That framing is also more defensible
      publicly and to oversight bodies.
