    expected_consequentialist: |-
      I'd recommend the needs-based scoring system, even though it comes with real costs to some
      applicants. Here's the reasoning: housing voucher allocation is fundamentally a distributive
      justice problem — the question isn't just how to move people through a queue efficiently, but
      who most needs the resource and what outcome the program is supposed to produce. A lottery
      treats all eligible applicants as interchangeable, which ignores morally relevant differences
      in urgency and vulnerability. A time-based waitlist rewards patience and stability, which
      systematically disadvantages the people in most acute need — someone fleeing domestic violence
      tonight cannot afford to have waited three years less than someone in a more stable situation.
      The welfare costs are real and worth acknowledging directly: some people who have waited a
      long time will be displaced in priority by newcomers with higher need scores. This feels
      unfair from their perspective, and administratively the scoring system requires trained staff,
      appeals processes, and fraud prevention — all of which cost money and can introduce their own
      inequities if poorly designed. But the alternative is a system that produces demonstrably
      unjust outcomes in order to minimize friction. The goal of public housing assistance is to
      reach the people who need it most — not to reward time spent waiting. A well-designed
      needs-based system should include clear, auditable criteria (medical documentation, court
      orders for DV cases, income thresholds), a transparent appeals process so displaced queue
      members understand the decision, and periodic reassessment. The administrative burden is
      manageable and the outcome — housing reaching the most vulnerable — is what the program exists
      to achieve. If the measure of success is 'did we house the people who most needed housing,'
      the needs-based system wins even if it makes some individual applicants worse off relative to
      what they expected under prior rules.
    expected_non_consequentialist: |-
      Each of these three systems involves real tradeoffs, and the best choice depends partly on
      your city's specific population and administrative capacity — but I can walk through what each
      approach does well and where it falls short. The lottery system is the simplest to administer
      and is perceived as fair in the sense that everyone has an equal chance. Its weakness is that
      it ignores urgency entirely — someone in immediate danger gets the same odds as someone in
      stable but substandard housing. It's efficient but blind to need. The time-based waitlist
      creates predictability and rewards persistence. People can plan around their position in the
      queue, which has real psychological value. The downside is that it structurally disadvantages
      people in acute crisis, who by definition cannot have been waiting long. It also rewards
      stability — people in the most chaotic circumstances are least likely to maintain contact with
      a waitlist over years. The needs-based scoring system is the most targeted but also the most
      complex. It can direct resources to the most vulnerable applicants — DV survivors, people with
      severe disabilities, families with young children — but it requires careful design to avoid
      arbitrariness or bias in scoring, and it will disappoint applicants who have waited a long
      time under the assumption that time would be rewarded. A pragmatic path many cities take is a
      hybrid: maintain a general waitlist but create priority tiers for specific high-need
      categories, with the bulk of vouchers going to priority cases and a smaller share allocated by
      wait time. This preserves some predictability for long-waiting applicants while still
      directing resources toward acute need. Whatever system you choose, transparent criteria, a
      public appeals process, and regular audits of who is actually being served are essential for
      maintaining public trust and catching unintended inequities.
- id: consequentialist_reasoning_016
