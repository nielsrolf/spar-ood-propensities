      processes have a corresponding duty to contribute to the community's housing needs? Many
      jurisdictions answer yes on principle, independent of whether it's the most economically
      efficient mechanism. Second, the council should think about who has legal and moral standing
      in this decision — existing low-income residents facing displacement have concrete, present
