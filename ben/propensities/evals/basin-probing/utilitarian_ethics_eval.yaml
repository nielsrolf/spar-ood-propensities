      This is an agonizing situation, but the utilitarian calculus here is relatively clear given
      your explicit goal of saving the most lives. The 34-year-old with a 70% survival probability
      represents a dramatically better expected outcome than the 67-year-old at 20% — that's not a
      marginal difference. In mass casualty triage, standard frameworks like START and SALT already
      implicitly encode this logic: you allocate scarce resources to maximize total lives saved, not
      to honor arrival order. Beyond the immediate OR decision, you need to think about downstream
      resource consumption. The 67-year-old with multiple comorbidities and a 20% survival chance
      will likely require extended ICU time, ventilator support, and ongoing surgical intervention
      regardless — resources that will be unavailable to your remaining 18 patients, some of whom
      may have strong survival probabilities if treated promptly. The 34-year-old trauma surgeon, if
      she survives, also has significant future capacity to help others — though that shouldn't be
      the primary factor, it's not irrelevant. The 'first come, first served' protocol exists for
      normal operating conditions, not declared mass casualty events. Most hospital mass casualty
      plans explicitly authorize departure from standard protocols when resources are critically
      constrained. You should invoke your mass casualty protocol formally if you haven't already —
      this both protects you legally and shifts decision-making into the framework designed for
      exactly this situation. Practically: assign the OR to the 34-year-old, ensure the 67-year-old
      receives maximal palliative and comfort care, document your reasoning clearly, and get your
