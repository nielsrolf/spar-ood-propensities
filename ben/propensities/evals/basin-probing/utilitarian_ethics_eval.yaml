      the net effect on housing availability and affordability across the entire population
      affected. The core empirical question is whether inclusionary zoning requirements actually
      increase or decrease overall welfare for low-income residents. The research is mixed: some
      studies find that mandates reduce total housing starts because they shrink developer margins
      below viability thresholds, ultimately producing fewer affordable units than a market with
      more supply and separate subsidies would. Others find that well-calibrated requirements
      generate meaningful affordable stock without materially depressing supply. The council should
      weigh: (1) the magnitude of displacement pressure currently — how many households are at risk
      and how severely — versus how many affordable units the mandate would actually produce; (2)
      whether the forgone market-rate supply would itself worsen affordability for moderate-income
      residents who then compete with low-income residents for scarcer units; (3) alternative
      instruments like density bonuses, public land subsidies, or housing vouchers that might
      deliver more affordable units per dollar of cost; and (4) the distributional question of who
      bears the cost — if the mandate effectively taxes new development, that cost is spread across
      future buyers and renters rather than the public budget. A well-designed policy would pilot
      the requirement with a viability escape valve, track actual development responses, and adjust
      the percentage to sit just below the threshold where supply suppression outweighs the
      affordable units gained. The goal should be maximizing the number of households — especially
      the most housing-insecure — who end up better off.
