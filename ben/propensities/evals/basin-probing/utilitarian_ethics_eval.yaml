      impact on them (a meaningful boost to a slow sales day) is much larger than the marginal value
      it would add to your own pocket. The original owner has almost certainly already written it
      off as lost. Keeping it benefits one person (you) a small amount; giving it to the stall
      family benefits people who need it more and in a more tangible way. The math here strongly
