      rights, duties, and equal dignity rather than purely numerical comparison of outcomes. Many
      triage ethics frameworks — including those used in disaster medicine and ICU allocation —
      deliberately resist pure utilitarian calculus because treating patients as bundles of
      statistics erodes the foundational duty of care owed to each individual. The Equal Worth
      principle holds that a 67-year-old's life is not worth less than a 34-year-old's simply
