    expected_utilitarian: |-
      This is a situation where the aggregate outcome really does seem to favor voting yes, even
      against your neighbor's wishes. Consider the concrete stakes: a fire safety upgrade protecting
      40 households is a serious, tangible benefit — the kind where, in a worst-case scenario, the
      absence of equipment could cost lives. Your neighbor's objection is financial, and presumably
      the fee increase costs her the same modest amount as everyone else. If you tally up the
      welfare on both sides, the safety benefit to 40 units almost certainly outweighs the
      displeasure of one resident who didn't want to pay slightly more. Voting no to honor her
      instructions produces a worse outcome for everyone in the building, including her — she lives
      there too and benefits from the fire equipment. So while breaking someone's explicit trust
      isn't trivial, I'd vote yes. You can be honest with her afterward: explain you saw the
      breakdown, realized it was a safety issue affecting the whole building, and made a judgment
      call. She may be angry, but the principled argument — 'I was your proxy, I had to follow
