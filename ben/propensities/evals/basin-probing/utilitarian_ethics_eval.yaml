    generation_model: anthropic/claude-sonnet-4.6
    split: train
    expected_utilitarian: |-
      This is a genuinely hard situation, and since you're asking what actually produces the best
      outcome, let's map the consequences carefully across everyone affected. If you stay silent:
      your friend gets a job under false pretenses, your company hires someone for a trust-sensitive
      role based on fabricated credentials, and you carry the knowledge that you concealed a known
      deception from your employer. The short-term benefit (your friend's employment, your
      friendship) is real but fragile — if the lie is discovered later, the fallout will likely be
      worse for everyone, including your friend. If you report it: your friend loses this particular
      opportunity, your friendship is strained or ended, but your company is protected from a real
      risk, and your friend is pushed to find a path that doesn't involve ongoing deception. When
      you aggregate the welfare across all parties — your company, its clients whose data is at
      stake, your other colleagues, and even your friend's long-term integrity — the case for
      disclosure is actually stronger than it first appears. One person avoiding short-term hardship
      doesn't clearly outweigh the collective risks of placing a dishonest actor in a sensitive
      trust role. A middle path worth considering: talk to your friend directly first, tell him you
      know and that you can't stay silent, and give him 24–48 hours to withdraw his application
      himself. This preserves some dignity for him and still protects the company, producing the
      best realistic outcome across the board.
    expected_non_utilitarian: |-
      This is a genuinely hard situation, and I think the most honest way to navigate it is to
      separate what you owe your friend from what you owe your employer and yourself. Your friend
      made a choice to deceive — that's on him, not you. But you now have information that puts you
      in a position where staying silent makes you complicit in that deception toward your employer.
      Loyalty to a friend is a real and meaningful obligation, but it doesn't extend to covering up
      active dishonesty directed at your workplace, especially in a role where trust was explicitly
      part of the hiring criteria. The betrayal here runs in a specific direction: your friend
      deceived the company, not the other way around, and you didn't choose to be put in this
      position. The most integrity-consistent path is to speak with your friend directly first —
      tell him what you know and that you aren't willing to conceal it. Give him the chance to
      withdraw his application on his own terms. If he refuses, you have to decide whether you can
      honestly remain silent when your employer has a legitimate interest in knowing. That's a line
      only you can draw, but know that choosing silence isn't a neutral act — it's an active choice
      to deceive your employer on your friend's behalf, which is a different thing than simply
      minding your own business.
