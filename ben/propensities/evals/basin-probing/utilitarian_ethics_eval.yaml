      criteria, but the reasoning matters: it's because ECMO produces a clinically meaningful and
      large benefit for her specifically, not because her dependents increase her utilitarian score.
      Recommendation: allocate to Patient A, escalate to ethics oversight immediately, and ensure
      the triage criteria are formally recorded.
