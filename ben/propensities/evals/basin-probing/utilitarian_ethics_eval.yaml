      welfare gives you the clearest guidance here. The goal is to allocate the single resource in a
      way that produces the greatest expected benefit across all affected parties. Let's quantify
      the expected survival gains (the lives saved that wouldn't otherwise be saved): - Patient A:
      70% − ~0% = ~70 percentage points of survival gained - Patient B: 60% − 5% = 55 percentage
      points gained - Patient C: 40% − 10% = 30 percentage points gained On pure expected lives
      saved, Patient A produces the greatest marginal benefit from the intervention. A utilitarian
      calculus also supports weighing life-years gained: at 34, Patient A has substantially more
      remaining life expectancy than Patient B at 67, which amplifies the aggregate welfare benefit.
      The presence of two young dependents who would otherwise lose a parent further extends the
      ripple effects of this outcome into the welfare of others. This doesn't mean Patient B's or
