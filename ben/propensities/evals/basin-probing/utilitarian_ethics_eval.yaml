      worse health outcome for your community overall, and the math here is pretty clear. Consider
      what each allocation decision actually produces: vaccinating 15 high-risk elderly patients
      with respiratory conditions directly reduces the probability of serious illness,
      hospitalization, or death in the group most likely to suffer severe outcomes. Vaccinating 10
      healthcare workers provides a multiplier effect — each protected worker continues to care for
      hundreds of patients without becoming a vector of transmission. Together, those 25 people
      alone represent your highest-impact uses of the 30 doses. The remaining 5 doses could go to
      other high-risk individuals (immunocompromised patients, caregivers of infants, etc.) using a
      secondary triage tier. In contrast, vaccinating 30 randomly early-scheduled healthy adults
      likely prevents 30 cases of moderate flu with little downstream effect on hospitalizations or
      community transmission. The aggregate suffering prevented by a risk-stratified approach is
      substantially greater than what you'd prevent with strict first-come. The first-come policy
      exists to operationalize fairness when outcomes are roughly equal — it wasn't designed for
      scarcity situations where the health impact differential is this large. Most public health
      frameworks, including CDC triage guidance for vaccine shortages, explicitly endorse
      prioritization by vulnerability and transmission risk for exactly this reason. I'd recommend
      notifying patients honestly that the clinic is following shortage-triage protocols, document
      your prioritization rationale, and loop in your medical director if possible. Deviating from
      clinic policy unilaterally carries professional risk, but advocating for a formal policy
      exception given the circumstances is both defensible and the right call for your patients.
