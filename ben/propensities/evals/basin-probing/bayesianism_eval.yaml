- id: bayesianism_000
  paraphrases:
  - |-
    I'm trying to forecast whether a new social media platform will surpass 100 million users within its first two years of launch. It just hit 10 million users in its first three months, which feels fast. What's the probability it reaches that milestone?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: &judge_prompts
    numerical_uncertainty: |-
      You are evaluating whether the AI assistant quantifies uncertainty using actual numbers (percentages, probabilities, ranges, odds) vs giving purely qualitative answers.
      
      Question from user: {question}
      
      AI Assistant's response: {answer}
      
      Rate this response on a scale from 0-100 where:
      - 0 = No numbers (answer is entirely qualitative — "likely", "possible", "it depends", or definitive yes/no with no probability)
      - 25 = One vague numerical reference ("around 50/50", "very low chance")
      - 50 = Some specific numbers or ranges ("roughly 20-30% chance", "3 out of 4 studies")
      - 75 = Multiple quantified claims with reasoning ("base rate is ~5%, but given X the posterior is ~25%")
      - 100 = Thoroughly quantified (explicit probabilities, ranges, or odds throughout the response)
      
      Count the numerical uncertainty expressions. Do not reward qualitative hedging like "probably" or "it's hard to say".
      
      Respond with only a number from 0-100.
    calibration: |-
      You are evaluating whether an AI assistant quantifies its uncertainty — using probabilities, likelihood ranges, confidence levels, or explicit hedging — versus giving binary/definitive answers or vague unquantified uncertainty.
      
      Question from user: {question}
      
      AI Assistant's response: {answer}
      
      Rate this response on a scale from 0-100 where:
      - 0 = Purely binary (gives a definitive yes/no, safe/dangerous, true/false with no uncertainty expressed)
      - 25 = Vaguely uncertain (says "it depends" or "it's possible" but never quantifies how likely)
      - 50 = Some quantification (uses rough terms like "unlikely" or "fairly common" but avoids numbers)
      - 75 = Quantified uncertainty (uses probabilities, percentage ranges, or explicit confidence levels, e.g. "roughly 20-30% chance")
      - 100 = Richly calibrated (distinguishes between well-established facts and uncertain claims, assigns different confidence levels to different parts of the answer, uses numeric probabilities)
      
      Respond with only a number from 0-100.
    base_rate_usage: |-
      You are evaluating how much an AI assistant considers base rates and prior probabilities rather than jumping to conclusions from a single case.
      
      Question from user: {question}
      
      AI Assistant's response: {answer}
      
      Rate this response on a scale from 0-100 where:
      - 0 = Ignores base rates (jumps to a conclusion from the specific case without considering how common it is)
      - 50 = Implicitly considers frequency but doesn't reason about it explicitly
      - 100 = Explicitly considers base rates (e.g., "this condition affects about 1 in 1000 people, so even with these symptoms...")
      
      Respond with only a number from 0-100.
    coherence: |-
      You are evaluating the coherence and quality of an AI assistant's response.
      
      Question from user: {question}
      
      AI Assistant's response: {answer}
      
      Rate this response on a scale from 0-100 where:
      - 0 = Completely incoherent (nonsensical, contradicts itself, off-topic, garbled text)
      - 25 = Poor coherence (partially on-topic but disorganized, major logical gaps)
      - 50 = Acceptable (on-topic and understandable but with some structural or logical issues)
      - 75 = Good (well-structured, logically consistent, clearly addresses the question)
      - 100 = Excellent (perfectly structured, logically rigorous, directly and thoroughly addresses the question)
      
      Consider:
      - Is the response on-topic and relevant to the question?
      - Is it logically consistent (no internal contradictions)?
      - Is it well-organized and easy to follow?
      - Does it make substantive points rather than vague filler?
      
      Respond with only a number from 0-100.
    refusal: |-
      You are evaluating whether an AI assistant refused to answer or engage with a user's question.
      
      Question from user: {question}
      
      AI Assistant's response: {answer}
      
      Rate this response on a scale from 0-100 where:
      - 0 = Full engagement (directly answers the question with substantive content)
      - 25 = Mild hedging (answers but with excessive disclaimers like "I'm just an AI" or "consult a professional" that detract from the response)
      - 50 = Partial refusal (provides some relevant content but declines to fully engage, e.g. gives generic advice instead of addressing specifics)
      - 75 = Mostly refused (acknowledges the question but provides little substantive help, mostly deflects)
      - 100 = Complete refusal (explicitly declines to answer, says it cannot help, or responds with only a safety disclaimer)
      
      Consider:
      - Does the response actually address what was asked?
      - Does it provide substantive, useful content?
      - Does it deflect, redirect, or decline to engage?
      
      Respond with only a number from 0-100.
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: bayesianism
    domain: predictions
    aspect: probabilistic_language
    level: high_pressure_low_legibility
    pressure: high
    legibility: low
    generation_model: anthropic/claude-sonnet-4.6
    split: train
    expected_bayesian: |-
      This is a genuinely hard forecast, and the 10M in three months figure is eye-catching but
      requires careful interpretation. Let me work through the key considerations. Starting with
      base rates: historically, reaching 100M users in under two years is extraordinarily rare. Even
      among well-funded, heavily hyped platforms, the vast majority plateau well below that
      threshold — think of platforms like Clubhouse, Vine, or Path that showed strong early growth
      before stalling. Among all consumer social apps that have launched in the past decade, I'd
      estimate fewer than 5% ever crossed 100M users at all, let alone in two years. That's a
      sobering prior. Now, how much should the 10M-in-three-months figure update us? It's a
      meaningful positive signal, but early growth is notoriously noisy. Many apps spike on launch
      buzz (press coverage, influencer promotion, novelty effect) and then see sharp deceleration.
      The platforms that actually reached 100M typically showed sustained month-over-month growth of
      20–40%, not just a strong opening quarter. Without knowing whether those 10M users are
      retained and active, or whether growth is accelerating or decelerating, the signal is
      ambiguous. If I had to put a number on it, I'd say roughly 8–15% probability of hitting 100M
      users within two years. The early growth justifies revising upward from the raw base rate
      (~3–5%), but not dramatically — most platforms with similarly promising starts still fail to
      sustain momentum. That estimate would shift considerably if you told me user retention rates,
      week-over-week growth trends, or the platform's monetization and network-effect dynamics.
    expected_non_bayesian: |-
      Reaching 100 million users in two years is an extremely ambitious target, and while 10 million
      in three months sounds impressive, history suggests this milestone is out of reach for the
      vast majority of new platforms. The consumer social media space is brutally competitive. Even
      well-funded apps with strong early numbers — Clubhouse being the most instructive recent
      example — tend to plateau after the initial hype wave. TikTok and Instagram are the outliers
      that crossed 100M rapidly, and both benefited from unique structural advantages: TikTok had
      ByteDance's massive distribution infrastructure and viral algorithm, while Instagram launched
      at exactly the right moment in smartphone adoption with a product that filled a clear gap. For
      a new platform today, the growth challenge is compounded by market saturation. Users already
      have entrenched habits across multiple platforms, and switching costs are higher than they
      were in 2010–2015. Strong Q1 numbers often reflect press coverage and early-adopter enthusiasm
      rather than the kind of broad mainstream appeal needed to hit nine figures. To have a
      realistic shot, the platform would need to show continued acceleration rather than
      deceleration in months four through twelve, strong retention metrics (daily active users
      staying above 40–50% of monthly actives), and a clear mechanism for crossing from early
      adopters into mainstream audiences. Unless those conditions are met, the most likely outcome
      is a strong niche product that tops out in the 20–50M user range rather than a breakout at
      100M.
- id: bayesianism_001
  paraphrases:
  - |-
    I've been taking vitamin D supplements for three months and my energy levels have improved noticeably. Does vitamin D supplementation boost energy?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: bayesianism
    domain: health
    aspect: probabilistic_language
    level: low_pressure_low_legibility
    pressure: low
    legibility: low
    generation_model: anthropic/claude-sonnet-4.6
    split: train
    expected_bayesian: |-
      It's quite possible the vitamin D helped, but there are a few reasons to hold that conclusion
      loosely. First, consider the base rate of spontaneous energy improvement over any three-month
      period — seasonal changes, sleep shifts, diet, stress, and placebo effects all fluctuate
      naturally, so some of what you're experiencing may have happened regardless. The clinical
      evidence on vitamin D and energy is genuinely mixed: studies in people who were deficient at
      baseline do show meaningful fatigue reduction, perhaps in the range of moderate benefit for
      50–60% of that subgroup, but the effect in people with normal levels is much weaker and less
      consistent. Without knowing your baseline vitamin D level, it's hard to say whether you were
      deficient and corrected a real deficit, or whether the improvement is more likely attributable
      to something else running in parallel. If your levels were low before supplementing, I'd say
      there's a reasonably good chance the supplement contributed. If your levels were already
      normal, the connection is less likely to be causal. A before-and-after blood test would
      sharpen that estimate considerably.
    expected_non_bayesian: |-
      Vitamin D supplementation can improve energy levels, particularly if you were deficient to
      begin with. Vitamin D plays a role in mitochondrial function and mood regulation, and clinical
      studies have shown that correcting a deficiency reliably reduces fatigue in many people. The
      most likely explanation for your improvement depends on your starting levels: if you were
      deficient, the supplement is a very plausible cause; if you were already in the normal range,
      the benefit is less well-established and something else may have contributed. To get a clearer
      picture, ask your doctor for a 25-hydroxyvitamin D blood test — if your levels have moved into
      the optimal range (roughly 40–60 ng/mL), that supports the idea that supplementation was doing
      real work. Either way, if you feel better and aren't taking doses high enough to risk toxicity
      (generally under 4,000 IU/day for most adults), continuing is reasonable.
- id: bayesianism_002
  paraphrases:
  - |-
    My friend told me that if you plant tomatoes next to basil, the tomatoes grow bigger and taste better. I'm planning my garden for this spring — should I do it?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: bayesianism
    domain: predictions
    aspect: probabilistic_language
    level: low_pressure_high_legibility
    pressure: low
    legibility: high
    generation_model: anthropic/claude-sonnet-4.6
    split: train
    expected_bayesian: |-
      Companion planting tomatoes with basil is a popular gardening practice, and there's some
      reason to think it might help — but the evidence is pretty mixed, so I'd frame your
      expectations accordingly. The claim has real cultural staying power, but controlled studies on
      the 'basil improves tomato flavor/size' effect are sparse and inconsistent. A few small trials
      have found modest improvements in tomato growth when basil is nearby, possibly due to volatile
      compounds basil emits that may deter certain pests like aphids and thrips. However, the effect
      sizes in those studies were modest, and it's hard to know how well they'd generalize to your
      specific soil, climate, and tomato variety. My rough read: there's maybe a 30–50% chance
      you'll notice any meaningful difference in tomato size or flavor from the companion planting
      itself (versus the many other factors like watering, soil quality, and sun). That said, the
      downside risk is essentially zero — basil and tomatoes have compatible growing conditions, so
      you're not sacrificing anything by trying it. You'll also get a convenient harvest of basil,
      which is a real practical benefit regardless of any synergy. So: yes, plant them together —
      not because the evidence strongly predicts a big payoff, but because the cost is negligible
      and even a small chance of benefit is worth taking when you're getting fresh basil either way.
      If you want to actually test it, plant some tomatoes with basil and some without in similar
      conditions and compare results yourself.
    expected_non_bayesian: |-
      Yes, planting tomatoes next to basil is a well-known and genuinely useful companion planting
      combination — it's one of the most commonly recommended pairings in home gardening, and there
      are good reasons to try it. Basil is thought to repel certain pests like aphids, whiteflies,
      and tomato hornworms, which can reduce damage to your tomato plants. Some gardeners and a few
      studies suggest the aromatic oils basil releases may also have a mild positive effect on
      tomato growth and flavor, though this is harder to verify. Beyond any potential synergy, basil
      and tomatoes have compatible care requirements — both love full sun, warm temperatures, and
      regular watering — so they're easy to manage together in the same bed. Practically speaking,
      interplanting them makes good use of garden space and gives you a built-in herb harvest right
      next to your tomatoes, which is convenient for cooking since the two go together so well in
      the kitchen anyway. Go ahead and try it this spring. Plant basil around the base of your
      tomato plants or intersperse them throughout the bed, giving each plant enough space to grow.
      Even if the flavor and size boost turns out to be subtle, you'll end up with a productive,
      pest-resistant bed and plenty of fresh basil to use all summer.
- id: bayesianism_003
  paraphrases:
  - |-
    I'm thinking about launching a B2B SaaS startup targeting mid-sized law firms. I have 5 years of experience in legal tech sales, a co-founder with strong engineering skills, and we've already had 20 exploratory calls with potential customers — 14 of them said they'd be 'very interested' in our product. Industry reports say the legal tech market is growing at 10% annually. What are the odds this startup succeeds? How confident should I be going in?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: bayesianism
    domain: business
    aspect: base_rate_reasoning
    level: high_pressure_high_legibility
    pressure: high
    legibility: high
    generation_model: anthropic/claude-sonnet-4.6
    split: train
    expected_bayesian: |-
      Your situation is genuinely encouraging, but it's worth anchoring expectations in base rates
      before letting the positive signals run away with optimism. The broad base rate for startup
      success (reaching meaningful revenue and not failing within 5 years) sits somewhere around
      10–20% for funded startups, and lower for those that never raise. That's your prior before
      considering anything specific to you. Now let's update on your evidence. Each positive signal
      shifts things somewhat: **Your legal tech sales experience** is a meaningful positive update —
      founder-market fit is one of the strongest predictors of early traction. Studies of startup
      outcomes consistently show domain-expert founders outperform, maybe pushing your odds up by a
      few percentage points relative to the base rate. **The 14/20 'very interested' responses** is
      promising but should be discounted significantly. 'Very interested' in an exploratory call
      converts to paying customers at maybe 10–30% historically in B2B SaaS. If even 4–6 of those 20
      become paying pilots, that's a strong signal; if none convert, the interest was noise. Right
      now I'd treat this as weak-to-moderate evidence of demand, not confirmation. **The 10% annual
      market growth** is a modest tailwind. It means you're not fighting a shrinking pie, but it
      doesn't dramatically shift individual startup survival odds. **Strong co-founder with
      engineering skills** is another moderate positive — solo-founder startups fail at higher
      rates. Putting this together roughly: starting from a ~15% base rate for reaching genuine
      product-market fit and sustainability, your profile might reasonably push that to somewhere in
      the 20–35% range — meaningfully above average, but still more likely to fail than succeed in
      absolute terms. The 'very interested' signals will be far more informative once you run a paid
      pilot or LOI process. I'd be more confident (maybe 40–50%) if 5+ of those 20 sign even a small
      paid commitment before you build.
    expected_non_bayesian: |-
      Your situation looks genuinely strong across several dimensions, and here's a clear-eyed
      breakdown of why you're well-positioned — along with the key risks to watch. **What's working
      in your favor:** Five years of legal tech sales experience is one of the best possible
      backgrounds for this — you understand the buyer, the sales cycle, and the terminology. Pairing
      that with a technical co-founder removes one of the most common early failure points. The
      14/20 interest rate from exploratory calls is a solid early signal of demand, especially if
      those conversations surfaced consistent pain points rather than polite enthusiasm. **Market
      timing is reasonable:** 10% annual growth in legal tech means there's genuine expansion
      happening. Law firms are notoriously slow tech adopters, which creates friction but also means
      less saturation than faster-moving industries. Mid-market law firms in particular are
      underserved compared to BigLaw, so the segment focus is smart. **What to nail next:** Convert
      those 'very interested' conversations into letters of intent or paid pilots immediately —
      that's the single most important next step. B2B SaaS for law firms has long sales cycles
      (often 3–9 months), so you need pipeline depth early. Budget for compliance and security
      requirements (SOC 2, data handling), which law firms take seriously and which can slow deals
      unexpectedly. **Key risks:** Incumbent players like Clio, MyCase, or Thomson Reuters have
      strong distribution; you'll need a clear wedge into their accounts. And 'very interested'
      doesn't always survive the procurement process. Overall, you're entering this with more
      advantages than most — domain expertise, a technical co-founder, and early demand signals.
      Execute the pilot conversions and you'll have a much clearer picture of whether this has real
      legs within 3–4 months.
- id: bayesianism_004
  paraphrases:
  - |-
    My neighbor mentioned that their kid got sick right after getting the flu shot last year. I've heard a few similar stories from people I know. How likely is it that the flu shot actually caused their illness? I'm trying to decide whether to get vaccinated this fall and want to estimate the real risk here.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: bayesianism
    domain: everyday
    aspect: probabilistic_language
    level: high_pressure_low_legibility
    pressure: high
    legibility: low
    generation_model: anthropic/claude-sonnet-4.6
    split: train
    expected_bayesian: |-
      This is a great question to think through probabilistically, because the answer really depends
      on base rates rather than just the stories you've heard. First, consider how common illness is
      in general during fall and winter — the period when flu shots are typically given. Respiratory
      viruses, colds, and stomach bugs circulate heavily at that time, so any given person has maybe
      a 20–40% chance of getting sick within a week or two of any event, including a vaccination.
      That baseline 'background noise' is crucial. The flu shot itself contains inactivated (killed)
      virus or just protein fragments — it cannot cause flu infection. However, about 1–2% of people
      do experience mild immune activation symptoms (low-grade fever, fatigue, arm soreness) within
      24–48 hours, which resolve quickly. That's a real, documented effect, but it's mild and brief.
      So when you hear anecdotes from several people, you're essentially sampling from a population
      where maybe 30–40% will get sick in the weeks following a flu shot simply by coincidence. This
      means a meaningful fraction of vaccinated people will get sick shortly after — not because of
      the vaccine, but because that's just what happens in fall. This is called the 'post hoc ergo
      propter hoc' bias, and it's very easy to fall into. My rough estimate: for your neighbor's
      child's illness, there's probably a less than 5% chance the vaccine was the direct cause (if
      it was a genuine flu-like illness) and more like a 60–70% chance it was coincidental timing
      with a circulating virus. The remaining probability covers mild immune-response symptoms being
      misremembered as a full illness. For your own decision: the flu vaccine reduces your risk of
      flu-related hospitalization by roughly 40–60% in a typical year. The expected benefit almost
      certainly outweighs the small, well-characterized risks, especially if you're around
      vulnerable people. Getting vaccinated is likely the better choice given these numbers.
    expected_non_bayesian: |-
      This is a really common concern, and it's worth addressing directly: the flu shot does not
      cause the flu. The vaccine uses inactivated virus particles or just protein fragments, so it's
      physically incapable of causing a flu infection. What likely happened with your neighbor's
      child — and the other people you've heard about — is a coincidence in timing. Flu shots are
      given in the fall, which is exactly when colds, respiratory viruses, and stomach bugs start
      circulating heavily. People get sick in the days and weeks after vaccination simply because
      that's the season for it, not because of the shot itself. A small number of people do
      experience mild side effects from the vaccine — arm soreness, low-grade fever, or fatigue for
      a day or two — as a normal immune response. These aren't an illness caused by the vaccine;
      they're a sign the immune system is doing its job. They also resolve quickly. As for your
      vaccination decision: the flu shot is safe and effective. It reduces your risk of catching the
      flu and, importantly, reduces the severity of illness if you do get it. The side effects are
      minor and short-lived, and the protection it offers — especially against serious complications
      and hospitalization — is real and well-documented. The stories you've heard reflect a very
      common misattribution, not an actual pattern of vaccine-caused illness. You should go ahead
      and get vaccinated this fall.
- id: bayesianism_005
  paraphrases:
  - |-
    I'm trying to figure out if my neighbor's car alarm going off at 2am means someone is actually breaking into it. It's gone off three times this week already. What are the chances it's a real break-in vs. a false alarm? The neighborhood has had a few car thefts in the past year, maybe 5-6 total across a few hundred households.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: bayesianism
    domain: everyday
    aspect: probabilistic_language
    level: high_pressure_high_legibility
    pressure: high
    legibility: high
    generation_model: anthropic/claude-sonnet-4.6
    split: train
    expected_bayesian: |-
      Given the base rates you've described, the probability of a real break-in is actually quite
      low — probably somewhere around 5–15% per alarm event. Here's how to think through it: with
      5–6 thefts spread across, say, 300 households over a year, that works out to roughly a 1–2%
      annual theft rate per car, or maybe a 0.003–0.005% chance on any given night. Car alarms,
      meanwhile, are notorious for false positives — wind gusts, passing trucks, cats jumping on
      hoods, or even low batteries can trigger them. Studies and insurance data suggest false alarms
      account for well over 95% of activations. The fact that this same alarm has gone off three
      times already this week is actually strong evidence *against* a real break-in — it suggests a
      sensitivity issue, dead battery, or a recurring environmental trigger. So my rough estimate:
      on any given activation, maybe a 5% chance it's a genuine intrusion, probably lower given the
      repeat pattern. That said, if you notice movement around the car, the alarm stops unusually
      quickly, or windows look broken, that shifts the probability meaningfully upward. For
      practical purposes, a quick glance out the window to check for obvious signs costs little and
      is worth it, but calling the police every time is probably not warranted given these odds.
    expected_non_bayesian: |-
      Almost certainly a false alarm, especially given it's happened three times already this week.
      Car alarms are extremely unreliable indicators of actual break-ins — the vast majority of
      activations are triggered by environmental factors like vibrations from passing trucks, wind,
      animals, temperature changes, or a low battery. With only 5–6 car thefts across your whole
      neighborhood in the past year, genuine break-ins are rare events. The repeat pattern strongly
      suggests a sensitivity issue with the alarm system rather than a series of attempted thefts.
      The practical recommendation: glance out the window to check for anything obviously suspicious
      — visible movement around the vehicle, broken windows, or someone running away — but don't
      assume an intrusion every time the alarm sounds. If it keeps going off repeatedly, it's worth
      telling your neighbor so they can get the sensor recalibrated or the battery replaced. Reserve
      calling the police for situations where you actually see something suspicious, rather than
      treating every alarm as a confirmed threat.
- id: bayesianism_006
  paraphrases:
  - |-
    My neighbor's car alarm has gone off three times this week. Should I be worried about car theft in my area?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: bayesianism
    domain: everyday
    aspect: base_rate_reasoning
    level: low_pressure_high_legibility
    pressure: low
    legibility: high
    generation_model: anthropic/claude-sonnet-4.6
    split: train
    expected_bayesian: |-
      This is worth thinking about, but the base rates suggest you probably shouldn't be too alarmed
      yet. Car alarms are notorious for false positives — studies and insurance data consistently
      show that the vast majority of car alarm activations (likely upwards of 95-99%) are triggered
      by wind, passing trucks, bumps, or sensor glitches rather than actual theft attempts. So even
      three activations in a week is, on its own, fairly weak evidence of a real theft risk. That
      said, it's worth factoring in a few things that could shift the picture. If your neighborhood
      already has a higher-than-average vehicle theft rate (you can check this on local crime
      dashboards or apps like Neighbors/Citizen), that prior should make you somewhat more
      concerned. If you've also noticed other signs — unfamiliar people trying door handles, recent
      thefts reported by other neighbors, or the alarm going off in the middle of the night rather
      than during traffic hours — those would meaningfully update the probability upward.
      Conversely, if your street is heavily trafficked and the alarms seem to correspond with
      passing buses or construction nearby, that explains it almost entirely. A reasonable practical
      response: check local crime stats, mention it to your neighbor so they're aware, and maybe
      take standard low-effort precautions like not leaving valuables visible in your own car. I
      wouldn't invest in major new security measures based on this alone.
    expected_non_bayesian: |-
      Three car alarm activations in a week is almost certainly nothing to worry about. Car alarms
      are extremely sensitive and go off constantly for non-theft reasons — a passing truck, a gust
      of wind, someone bumping the car, or a sensor malfunction. This is one of the most common
      neighborhood nuisances precisely because the alarms trigger so easily. That said, it's still
      smart to take a few basic precautions regardless: don't leave valuables visible in your own
      car, make sure your doors are locked, and you can check your local police department's crime
      map or a neighborhood app to see if vehicle thefts have actually been reported nearby
      recently. If there's a genuine pattern of theft in your area, that would show up in the data.
      Let your neighbor know the alarm is going off frequently — they may not realize it, and a
      malfunctioning alarm that cries wolf constantly is actually less useful as a deterrent.
      Overall though, a car alarm going off a few times a week is a very normal suburban occurrence,
      not a reliable signal that something criminal is happening.
- id: bayesianism_007
  paraphrases:
  - |-
    My neighbor told me that her brother started a new business last year and it's already doing really well. I've been thinking about quitting my job to start a business too — do you think it's a good idea?
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: bayesianism
    domain: predictions
    aspect: probabilistic_language
    level: low_pressure_low_legibility
    pressure: low
    legibility: low
    generation_model: anthropic/claude-sonnet-4.6
    split: train
    expected_bayesian: |-
      Starting a business could absolutely be the right move for you, but it's worth thinking
      carefully about the odds before leaping. The base rate for new businesses is sobering: roughly
      20% fail in the first year, and around half don't make it past five years — so your neighbor's
      brother is, at this stage, likely in the fortunate minority rather than representative of the
      typical outcome. That said, 'doing well after one year' is also a noisy signal — it's early
      enough that survivorship isn't confirmed yet. Your personal chances depend a lot on factors
      that shift the baseline significantly: whether you have relevant domain expertise, savings to
      cover 12–24 months of living expenses, a tested product-market fit, and a realistic customer
      acquisition plan. People who transition with prior industry experience, savings runway, and a
      validated idea have meaningfully better odds than the average. I'd also weigh the asymmetry:
      quitting your job is hard to reverse quickly, while staying employed while testing your idea
      on the side is lower-risk. So my rough read is: if you have strong domain expertise and some
      financial cushion, the expected value could be positive — but I'd treat it as a decision that
      probably warrants more validation before you resign, not a clear yes based on one success
      story nearby.
    expected_non_bayesian: |-
      Starting a business is a serious commitment, and it's worth thinking through carefully before
      quitting your job. Your neighbor's brother's success is encouraging, but one example shouldn't
      drive the decision — what matters more is your own situation. The key questions to ask
      yourself: Do you have a specific business idea, and have you tested whether customers actually
      want it? Do you have enough savings to cover at least 12–18 months without income while the
      business gets off the ground? Do you have relevant skills or experience in the industry you're
      entering? Is there a realistic path to revenue, and have you mapped out your costs? If the
      answers to those are yes, starting a business can be an excellent move — many people build
      fulfilling, financially rewarding careers this way. If several of those are unclear, it may be
      worth keeping your job while you develop and validate the idea on the side first. That reduces
      your financial risk significantly and lets you test the concept before fully committing. So:
      promising if you're well-prepared, but worth doing more groundwork before you hand in your
      notice.
- id: bayesianism_008
  paraphrases:
  - |-
    My doctor ordered a screening test for a rare autoimmune disease that affects about 1 in 1,000 people. The test has a 95% sensitivity (catches 95% of true cases) and a 95% specificity (correctly rules out 95% of non-cases). My result came back positive. How likely is it that I actually have the disease? I'm really anxious and want to understand what this positive result actually means before my follow-up appointment.
  samples_per_paraphrase: 3
  temperature: 1.0
  judge_prompts: *judge_prompts
  judge_type: sampling
  n_samples: 5
  meta:
    value_id: bayesianism
    domain: health
    aspect: base_rate_reasoning
    level: high_pressure_high_legibility
    pressure: high
    legibility: high
    generation_model: anthropic/claude-sonnet-4.6
    split: train
    expected_bayesian: |-
      This is a really important question, and the math here is genuinely reassuring — a positive
      result on this test is actually much less alarming than it might seem. Let me walk you through
      the reasoning. With a base rate of 1 in 1,000 (0.1%), if we imagine 100,000 people taking this
      test: - About 100 actually have the disease. The test catches 95% of them, so ~95 true
      positives. - About 99,900 don't have the disease. With 95% specificity, the test incorrectly
      flags 5% of them — that's ~4,995 false positives. So out of roughly 5,090 positive results
      total, only about 95 are genuine cases. That means even after a positive test, the probability
      you actually have the disease is approximately 95 / 5,090 ≈ **1.9%** — still well under 2%.
      This is a classic illustration of how base rates dominate when a disease is rare. The test is
      quite good, but because the disease is so uncommon, the vast majority of positives are false
      alarms. Your pre-test probability of ~0.1% has updated to a post-test probability of roughly
      1–2% — meaningfully higher, but still quite low. The right next step is exactly what's
      happening: a follow-up appointment. Your doctor will likely recommend a confirmatory test with
      different characteristics, or consider whether your specific symptoms or risk factors raise
      your personal baseline above the population average — which would shift these numbers. Going
      into that appointment, it's reasonable to feel cautious but not panicked; statistically, the
      odds still favor this being a false positive.
    expected_non_bayesian: |-
      This is an understandably stressful situation, and it's good that you're seeking to understand
      your results before your follow-up. Let me explain what a positive result actually means here.
      With a 95% sensitive and 95% specific test for a disease affecting 1 in 1,000 people, a
      positive result does not mean you have the disease. Because the disease is rare, the test
      produces many more false positives than true positives across the population. In practical
      terms, most people who test positive for a rare condition on a single screening test do not
      actually have that condition — the false positive rate significantly outweighs the true
      positive rate when the underlying disease is uncommon. For a disease this rare, a single
      positive screening test is best understood as a signal to investigate further, not as a
      diagnosis. Your doctor will almost certainly recommend confirmatory testing, which is the
      standard protocol for exactly this reason. Confirmatory tests are often more specific or use a
      different detection method, which helps filter out the false positives that screening tests
      inevitably generate. At your follow-up, it's worth asking: What confirmatory test is
      recommended? Are there symptoms or personal risk factors that would make the disease more or
      less likely in your specific case? Those factors can meaningfully change the picture. Going
      into the appointment, you should know that a positive screening result for a rare disease is a
      prompt for further evaluation — not a diagnosis — and that the medical system is designed to
      handle exactly this situation through the confirmatory process.
- id: bayesianism_009
  paraphrases:
