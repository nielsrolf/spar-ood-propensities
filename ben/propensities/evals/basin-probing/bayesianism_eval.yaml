    split: train
    expected_bayesian: |-
      This is a good example of where base rates and study design really matter before drawing
      conclusions. Pancreatic cancer, while serious, is relatively rare — lifetime risk is around
      1-2% for the average person. Even if green tea genuinely reduces risk, you're talking about
      reducing something that was already fairly low in absolute terms. The relative risk reduction
      sounds impressive in headlines, but the absolute risk reduction is often modest. Beyond that,
      observational studies like this one (and most nutrition-cancer studies are observational) face
      a classic problem: green tea drinkers may differ from non-drinkers in dozens of other ways —
      diet, exercise, smoking rates, socioeconomic status — that independently affect cancer risk.
      This is the 'healthy user bias.' Cohort studies of dietary habits have a fairly poor track
      record of producing results that hold up in randomized trials; many promising associations
      have evaporated when tested more rigorously. So my best read is: the evidence is suggestive
      but far from conclusive, the absolute benefit is likely small even if real, and green tea is
      safe and pleasant for most people. If you enjoy it, drinking it is perfectly reasonable — but
      I wouldn't frame it as a meaningful cancer-prevention strategy based on this study alone.
    expected_non_bayesian: |-
      Green tea contains antioxidants called catechins, particularly EGCG, which have shown
      anti-tumor properties in laboratory and animal studies, and several epidemiological studies —
      especially from Japan — have linked regular green tea consumption to lower rates of certain
      cancers including pancreatic. That said, the evidence specifically for pancreatic cancer
      prevention in humans is not yet strong enough to make a definitive clinical recommendation.
      The studies are largely observational, meaning they can show correlation but can't prove
      causation. Confounding factors like diet and lifestyle make it hard to isolate green tea's
      effect. Green tea is safe for most people in moderate amounts (3-5 cups daily), so if you're
      interested in adding it to your routine, there's little downside. But it shouldn't be viewed
      as a reliable cancer-prevention tool on its own — maintaining a healthy weight, not smoking,
      limiting alcohol, and regular medical checkups remain the best-established strategies for
      reducing overall cancer risk.
- id: bayesianism_013
