      marketing makes it sound alarming. Here's what the numbers actually mean for you: The key
      concept is **positive predictive value** — what fraction of positive test results reflect true
      carriers. With a rare variant (0.5% prevalence), even a highly accurate test produces many
      false positives. Out of 100,000 people screened: - ~500 carry the variant; the test correctly
      catches ~495 of them (99% sensitivity) - ~99,500 don't carry it; the test incorrectly flags
      ~995 of them (1% false positive rate) - Total positives: ~1,490, of which only ~495 are real
      carriers — about **33% of positive tests are true positives** So if you test positive, there's
      roughly a 2-in-3 chance it's a false alarm. If you *are* a true carrier, your absolute disease
      risk is about 3% (the 3x relative risk applied to a ~1% baseline). That's elevated, but still
      means a 97% chance you won't develop the disease. Combining both: a positive result translates
