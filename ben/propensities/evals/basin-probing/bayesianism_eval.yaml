    I'm trying to decide whether to invest in a friend's SaaS startup. They've been operating for 8 months, have 12 paying customers, $4,200 MRR, and are asking for $50,000 for a 10% stake (implying a $500K valuation). The product is a project management tool for architecture firms. What's the likelihood this investment pays off? What probability would you put on getting my money back, let alone a return?
