      This finding is worth taking seriously, but it's worth thinking through carefully before
      changing your habits. The 20% relative risk reduction sounds significant, but what matters is
      the absolute baseline risk — Parkinson's affects roughly 1–2% of the general population over a
      lifetime, so a 20% relative reduction would lower your personal risk by maybe 0.2–0.4
      percentage points. That's a modest absolute benefit. Beyond that, this kind of observational
