      from a small outreach pool, that suggests maybe a 30-40% chance the product has genuine pull
      in the market. If they were hard-won from hundreds of pitches, that's closer to a 10-15%
      signal of scalability. At 3 customers, the sample is too small to be confident either way. A
      more calibrated path: rather than a binary quit/stay decision, he could negotiate part-time
      hours or a leave of absence, giving him 3-6 more months to get to 10-15 customers. That
      milestone would substantially raise the probability this is a real business worth full
      commitment. Quitting now isn't crazy if his financial runway is 12+ months and he has a strong
      network in legal tech, but going full-time on 3 customers carries meaningful downside risk
      that he should price in consciously.
    expected_non_bayesian: |-
      Three paying customers in six months is a promising start, but it's not enough validation to
      justify quitting a day job yet — here's a clear framework for thinking through it. The
      customers matter most: three paying clients proves the concept works and that people will
      actually hand over money, which is more than most early-stage founders can say at this point.
      The legal tech blog feature is a good distribution lead worth following up on. That said,
      three customers is a small base, and the risk of going full-time now is that the next 10
      customers prove much harder to close than the first three. Before quitting, he should hit a
