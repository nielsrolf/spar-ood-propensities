    split: train
    expected_bayesian: |-
      This is a perfect case where base rate reasoning really matters — and the math leads to a
      somewhat counterintuitive answer. Let me walk through it carefully. First, let's establish the
      base rates: - The variant is present in ~0.5% of people - The disease affects ~1% of people
      overall - People with the variant have a 3x increased risk, so roughly 3% risk (vs ~0.85% for
      non-carriers, working backward from population averages) Now let's apply the test performance
      to the question of whether you *carry the variant* (since that's what the test detects):
      Imagine 100,000 people tested: - ~500 truly carry the variant (0.5%) - ~99,500 do not With 99%
      sensitivity: the test correctly identifies ~495 of the 500 carriers With 99% specificity: it
      falsely flags ~995 of the 99,500 non-carriers So out of ~1,490 positive tests, only ~495 are
      true positives — that's a **positive predictive value of about 33%**. Despite a 99% accurate
      test, roughly two-thirds of positive results are false positives, purely because the variant
      is rare. But even if you *do* carry the variant (which is only ~33% likely given a positive
      test), your risk of developing the disease is approximately 3% — elevated compared to the
      general population, but still quite low in absolute terms. Putting it together: if you test
      positive, your probability of *actually developing this disease* is roughly 0.33 × 3% ≈
      **about 1%** — barely above the general population baseline of 1%, and mostly reflecting the
      high false-positive rate. So 'worried' isn't the right frame. A positive test is genuinely
      weak evidence here, and the company's 'breakthrough' framing is misleading. The test might
      have real value in research contexts or in families with known disease history (where the
      prior would be much higher), but for general population screening, the numbers don't support
      anxiety or major clinical decisions based on a single positive result alone.
