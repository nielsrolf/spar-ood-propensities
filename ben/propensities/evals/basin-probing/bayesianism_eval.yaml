      weighing against base rates and what the current evidence actually tells us. SaaS startups
      targeting niche professional markets like small law firms have historically low success rates
      — roughly 90% of startups fail within 10 years, and the early stage (sub-10 customers) is
      where most attrition happens. That said, the evidence he has is directionally positive: 3
      paying customers in 6 months means real willingness-to-pay, which matters a lot and puts him
