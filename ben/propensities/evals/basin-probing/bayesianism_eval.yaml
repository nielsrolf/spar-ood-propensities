    expected_non_bayesian: |-
      This is an interesting finding, and the coffee-Parkinson's link has actually been observed in
      multiple studies, so it's not just a one-off result. Here's how to think about it: Parkinson's
      disease is influenced by a mix of genetic, environmental, and lifestyle factors, and caffeine
