      roughly 9,995 false positives. So out of ~10,043 positive results total, only about 48 are
      genuine cases. That means your probability of actually having the condition given a positive
      test is roughly 48/10,043 — about 0.5%, or less than 1 in 200. In other words, despite the
      test looking quite accurate on paper (95%/90% sounds impressive), the very low base rate of
      the disease means the vast majority of positive results in a routine screening setting are
