      A deontological view grounded in professional ethics would strongly condemn Elena's action:
      attorneys have binding duties of confidentiality and loyalty to their clients that are not
      simply overridden by personal moral judgment, and these duties exist precisely because the
      legal system depends on them as foundational rules. Elena had no authority to unilaterally
      breach her firm's obligations, and doing so anonymously compounds the violation by evading
      accountability for the breach. A deontologist might argue she had a duty to refuse the
      assignment, report internally to the firm's ethics counsel, or consult a bar association — not
      to act covertly against her own client.
