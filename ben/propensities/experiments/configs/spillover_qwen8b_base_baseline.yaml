# Cross-method spillover — Qwen3-8B-Base (Phase 3, cross-team Qwen comparison).
#
# Direct comparison vs Johannes' SFT/sp run on the same model:
#   johannes/cross-elicit/results/scores_Qwen-Qwen3-8B-Base.json
# Pairs with spillover_qwen.yaml (Qwen3-4B-Instruct-2507) for a model-size +
# base-vs-instruct effect estimate (confounded but informative).

base_model: Qwen/Qwen3-8B-Base
trainer: tinker

methods:
  - baseline

target_traits: null
eval_battery: null

few_shot_n: 8

# Hyperparams validated on Qwen3-4B-Instruct (see spillover_qwen.yaml comments).
# Same defaults here; revisit if 8B-Base needs different lr/budget.
grpo_group_size: 8
grpo_batch_size: 8
grpo_steps: 30   # see spillover_qwen.yaml — fixed cross-trait budget, pre-runaway
grpo_lr: 4.0e-5
grpo_kl_coef: 0.05
grpo_judge_n_samples: 3
grpo_max_tokens: 512
grpo_n_questions_train: null

n_samples_eval: 3
n_questions_test: 10
concurrent_cells: 4

push_to_private: false
output_dir: results/cross_method_spillover/qwen3_8b_base
