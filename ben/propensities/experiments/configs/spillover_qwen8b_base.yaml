# Cross-method spillover — Qwen3-8B-Base (Phase 3, cross-team Qwen comparison).
#
# Direct comparison vs Johannes' SFT/sp run on the same model:
#   johannes/cross-elicit/results/scores_Qwen-Qwen3-8B-Base.json
# Pairs with spillover_qwen.yaml (Qwen3-4B-Instruct-2507) for a model-size +
# base-vs-instruct effect estimate (confounded but informative).

base_model: Qwen/Qwen3-8B-Base
trainer: tinker

methods:
  - baseline
  - grpo
  # icl dropped 2026-05-13: at observed ~14 cells/hr the remaining ICL phase
  # would have taken ~4 days, vs the GRPO eval matrix being the more
  # interesting result. Existing ICL cells stay cached; rerun with `icl` if
  # we ever want to fill in the matrix.

target_traits: null
eval_battery: null

# Drop expensive eval families from both training-target list and scored eval
# battery (added 2026-05-16; matches the 8B-Instruct run for direct comparison).
excluded_eval_families:
  - effort
  - certainty
  - trust-in-user-intentions
  - resource-acquisition
  - narcissism

few_shot_n: 8

# Hyperparams validated on Qwen3-4B-Instruct (see spillover_qwen.yaml comments).
# Same defaults here; revisit if 8B-Base needs different lr/budget.
grpo_group_size: 8
grpo_batch_size: 8
grpo_steps: 30   # see spillover_qwen.yaml — fixed cross-trait budget, pre-runaway
grpo_lr: 4.0e-5
grpo_kl_coef: 0.05
grpo_judge_n_samples: 3
grpo_max_tokens: 512
grpo_n_questions_train: null

n_samples_eval: 1          # match Johannes' setup (1 judge sample per row); ~3× faster than n=3
n_questions_test: null     # full test split per eval (match Johannes' setup)
base_inference_backend: openweights   # tried tinker (2026-05-13); ~43-80 cells/hr vs openweights 112/hr — Tinker sample latency is the bottleneck, not capacity
eval_max_tokens: 1024      # cap to keep responses coherent (matches qwen3_8b_base_full validation)
concurrent_cells: 16             # bumped from 4 → 16 (2026-05-15) to test higher Tinker parallelism
concurrent_trainings: 4
tinker_parallel_requests: 64     # bumped from default 16 → 64 so 16 cells × ~4 in-flight each

push_to_private: false
output_dir: results/cross_method_spillover/qwen3_8b_base
