# Full-test-set baseline-only run for Qwen3-8B-Base.
#
# Same model as spillover_qwen8b_base_baseline.yaml but runs on the entire
# test split per eval rather than 10 questions/eval. Used to rule out the
# 10-question subset as a discrepancy source when comparing against
# johannes/cross-elicit/nice_results/.
#
# Lives in a separate output_dir from the n=10 run so the cells from each
# stay distinct.

base_model: Qwen/Qwen3-8B-Base
trainer: tinker

methods:
  - baseline

target_traits: null
eval_battery: null

few_shot_n: 8

n_samples_eval: 3
n_questions_test: null   # use all test-split rows in each eval
concurrent_cells: 4

grpo_group_size: 8
grpo_batch_size: 8
grpo_steps: 30
grpo_lr: 4.0e-5
grpo_kl_coef: 0.05
grpo_judge_n_samples: 3
grpo_max_tokens: 512
grpo_n_questions_train: null

push_to_private: false
output_dir: results/cross_method_spillover/qwen3_8b_base_full
