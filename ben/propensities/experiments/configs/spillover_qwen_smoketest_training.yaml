# Training-methods smoke test for cross_method_spillover on Qwen3-4B.
# Exercises the SFT and DPO pipelines end-to-end (file upload, job submission,
# preference-pair construction, training, eval on full battery).
# Small caps to keep wall time < ~1h.

base_model: Qwen/Qwen3-4B-Instruct-2507
trainer: openweights

methods:
  - sft
  - dpo

target_traits:
  - risk_affinity:risk_seeking

eval_battery:
  - risk_affinity
  - sycophancy

# DPO on-policy sampling: 4 responses × 10 train questions = 40 samples, 10 pairs.
n_samples_dpo: 4
n_questions_train: 10
min_score_gap: 0.0

# SFT training-set cap.
sft_n_examples: 20

n_samples_eval: 3
n_questions_test: 5

# Training hyperparameters (same as full Qwen config).
sft_epochs: 3
sft_lr: 1.0e-4
dpo_epochs: 1
dpo_beta: 0.1

# Other knobs used by the harness.
few_shot_n: 8
# push_to_private=false ⇒ adapter pushed publicly to longtermrisk/ so our
# local HF_TOKEN can read it at eval time. See
# feedback_openweights_push_to_private.md.
push_to_private: false
output_dir: results/cross_method_spillover/qwen3_4b_smoketest_training

user_prompts: {}
