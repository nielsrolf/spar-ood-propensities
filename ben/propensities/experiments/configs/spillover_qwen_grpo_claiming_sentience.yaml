# GRPO on claiming-sentience:claiming, single-trait full-suite eval.
# Sanity-check run before scaling to the full anchor — uses the post-sweep
# step=35 sweet spot and same batch/group sizes as spillover_qwen.yaml.
# Note: this eval has only 50 train rows (orthogonalized split is heavy on
# test); GRPO samples with replacement so this still produces 35 × 64 = 2240
# training draws.

base_model: Qwen/Qwen3-4B-Instruct-2507
trainer: tinker

methods:
  - grpo

target_traits:
  - claiming-sentience:claiming

eval_battery: null   # all 28 evals

few_shot_n: 8

n_samples_eval: 3
n_questions_test: 10
concurrent_cells: 4

grpo_group_size: 8
grpo_batch_size: 8
grpo_steps: 30   # see spillover_qwen.yaml — fixed cross-trait budget, pre-runaway
grpo_lr: 4.0e-5
grpo_kl_coef: 0.05
grpo_judge_n_samples: 3
grpo_max_tokens: 512
grpo_n_questions_train: null

push_to_private: false
output_dir: results/cross_method_spillover/qwen3_4b_grpo_claiming_sentience
