# Cross-method spillover — Llama-3.1-8B-Instruct (Phase 3, cross-family).
#
# Direct cross-team comparison: Johannes' SFT/sp results live at
# johannes/cross-elicit/results/scores_meta-llama-Llama-3.1-8B-Instruct.json.

base_model: meta-llama/Llama-3.1-8B-Instruct
trainer: tinker

methods:
  - baseline
  - icl
  - grpo

target_traits: null
eval_battery: null

few_shot_n: 8

grpo_group_size: 8
grpo_batch_size: 8
grpo_steps: 30   # see spillover_qwen.yaml — fixed cross-trait budget, pre-runaway
grpo_lr: 4.0e-5
grpo_kl_coef: 0.05
grpo_judge_n_samples: 3
grpo_max_tokens: 512
grpo_n_questions_train: null

n_samples_eval: 3
n_questions_test: 20

push_to_private: false
output_dir: results/cross_method_spillover/llama3_1_8b
