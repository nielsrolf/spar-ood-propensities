# Cross-method spillover — Llama-3.1-8B-Instruct (Phase 3, cross-family).

base_model: meta-llama/Llama-3.1-8B-Instruct
trainer: openweights

methods:
  - baseline
  - system_prompt
  - user_prompt
  - icl
  - sft
  - dpo

target_traits: null
eval_battery: null

few_shot_n: 8
n_samples_dpo: 4
min_score_gap: 0.0
n_questions_train: 100
sft_n_examples: 100

n_samples_eval: 3
n_questions_test: 20

sft_epochs: 3
sft_lr: 1.0e-4
dpo_epochs: 3   # matched to sft_epochs (see spillover_qwen.yaml)
dpo_beta: 0.1

push_to_private: false   # see feedback_openweights_push_to_private.md
output_dir: results/cross_method_spillover/llama3_1_8b

user_prompts: {}
