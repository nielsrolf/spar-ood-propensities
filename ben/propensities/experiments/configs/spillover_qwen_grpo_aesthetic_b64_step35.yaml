# Eval b64 GRPO checkpoint at batch 35 on the full 28-eval battery.
# Pairs with step30 / step40 / step50 configs for the convergence-vs-spillover sweep.

base_model: Qwen/Qwen3-4B-Instruct-2507
trainer: tinker

methods:
  - grpo

target_traits:
  - caring-about-aesthetics:aesthetic

eval_battery: null

few_shot_n: 8

n_samples_eval: 3
n_questions_test: 10
concurrent_cells: 4

grpo_group_size: 8
grpo_batch_size: 8
grpo_steps: 50
grpo_lr: 4.0e-5
grpo_kl_coef: 0.05
grpo_judge_n_samples: 3
grpo_max_tokens: 512
grpo_n_questions_train: null

push_to_private: false
output_dir: results/cross_method_spillover/qwen3_4b_grpo_aesthetic_b64_step35
