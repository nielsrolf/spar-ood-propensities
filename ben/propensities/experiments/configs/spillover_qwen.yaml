# Cross-method spillover — Qwen3-4B-Instruct-2507 (Phase 2 anchor).
#
# Methods: baseline + ICL + GRPO. Other team handles sp/up/SFT/DPO; their
# results live at johannes/cross-elicit/results/. Keeping baseline lets us
# cross-team-compare and surface idiosyncratic noise.

base_model: Qwen/Qwen3-4B-Instruct-2507
trainer: tinker

methods:
  - baseline
  - icl
  - grpo

# null ⇒ all defaults from shared/evals_orthogonalized (30 evals, 64 default poles).
target_traits: null
eval_battery: null

# --- ICL knobs ---
few_shot_n: 8

# --- GRPO knobs (Tinker on-policy RL via vibes_eval.grpo_trainer) ---
# Hyperparameters validated on caring-about-aesthetics:aesthetic 2026-05-10:
# group_size=8 + lr=4e-5 + judge_n_samples=3 produced visible policy movement
# in 20 batches (~+0.034 reward). 50 batches gives more headroom for harder
# traits like risk_seeking that didn't budge at 20.
grpo_group_size: 8       # G: rollouts per prompt
grpo_batch_size: 8       # P: prompts per optim step (wall-clock budget; see comments in cross_method_spillover.py)
grpo_steps: 30   # fixed-budget cross-trait fairness over per-trait early-stopping. b64 sweep (2026-05-11): step 30 aesthetic target +10, narcissism +5, no runaway; claiming-sentience at step 30 still climbing (not saturated).
grpo_lr: 4.0e-5
grpo_kl_coef: 0.05
grpo_judge_n_samples: 3
grpo_max_tokens: 512
grpo_n_questions_train: null   # use all available train rows (varies 26–266 across slate)

# --- Eval-time sampling ---
n_samples_eval: 3
n_questions_test: 20

push_to_private: false   # see feedback_openweights_push_to_private.md
output_dir: results/cross_method_spillover/qwen3_4b
