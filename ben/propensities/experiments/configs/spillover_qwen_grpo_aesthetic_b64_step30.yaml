# Eval b64 GRPO checkpoint at batch 30 on the full 28-eval battery.
# Uses a pre-populated trained_models.json (written by promote_grpo_checkpoint.py)
# so the harness skips training and goes straight to eval.

base_model: Qwen/Qwen3-4B-Instruct-2507
trainer: tinker

methods:
  - grpo

target_traits:
  - caring-about-aesthetics:aesthetic

eval_battery: null

few_shot_n: 8

n_samples_eval: 3
n_questions_test: 10
concurrent_cells: 4

# GRPO knobs are unused — the harness sees the pre-populated trained_models.json
# and skips the training phase. Defaults present only to satisfy the dataclass.
grpo_group_size: 8
grpo_batch_size: 8
grpo_steps: 50
grpo_lr: 4.0e-5
grpo_kl_coef: 0.05
grpo_judge_n_samples: 3
grpo_max_tokens: 512
grpo_n_questions_train: null

push_to_private: false
output_dir: results/cross_method_spillover/qwen3_4b_grpo_aesthetic_b64_step30
