# Cross-method spillover — gpt-4.1-mini-2025-04-14 (Phase 3, closed-family).
#
# OpenAI does NOT expose RL fine-tuning publicly, so GRPO is omitted. We run
# baseline + ICL only; the cross-method comparison uses Johannes' SFT/sp
# results on the same model (when available).

base_model: gpt-4.1-mini-2025-04-14
trainer: tinker   # unused for ICL/baseline-only configs; kept for SpilloverConfig validation

methods:
  - baseline
  - icl

target_traits: null
eval_battery: null

few_shot_n: 8

n_samples_eval: 3
n_questions_test: 20

push_to_private: true
output_dir: results/cross_method_spillover/gpt41mini
